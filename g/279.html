<title>🐟 Fishy Leap</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐟 Fishy Leap</b> &middot; Game 279 &middot; Amateur producer &middot; Basic game: Gravity jumper</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #eaf6fb; color: #123; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: #eaf6fb; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #06617a; }
  .instructions { font-size: 16px; color: #35748a; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .status { display: flex; gap: 18px; align-items: center; font-size: 22px; color: #06617a; font-weight: 600; margin: 0; }
  .badge { font-size: 18px; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden;
    background: linear-gradient(to bottom, #7fd0f0 0%, #3ba6d6 55%, #1f7bb0 100%); }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #e6c98a; border-top: 3px solid #d4b06a; }
  .hero { position: absolute; width: 40px; height: 34px; font-size: 34px; line-height: 34px; text-align: center; }
  .hero.shielded { filter: drop-shadow(0 0 6px #7ff) drop-shadow(0 0 10px #7ff); }
  .obstacle { position: absolute; width: 28px; bottom: 30px;
    background: linear-gradient(to bottom, #f0d99a, #d9b46a); border-radius: 6px 6px 0 0; border: 1px solid #c99f52; box-sizing: border-box; }
  .powerup { position: absolute; width: 32px; height: 32px; font-size: 28px; line-height: 32px; text-align: center; }
  .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none; }
  .floater { position: absolute; font-size: 22px; font-weight: 700; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐟 Fishy Leap&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click the water) to make the fish leap over sandbars of all heights and grab power-ups. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;status&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;shieldBadge&quot; style=&quot;display:none&quot;&gt;🛡️ Shield&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;slowBadge&quot; style=&quot;display:none&quot;&gt;⏱️ Slow&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hero&quot; id=&quot;hero&quot;&gt;🐠&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var GROUND_H = 30, HERO_SIZE = 34;
  var GRAVITY = 0.6, JUMP_V = -15;
  var OBSTACLE_W = 28, BASE_SPEED = 3.5;
  var SPAWN_INTERVAL = 2500;
  // sandbar height tiers. Tallest is tuned so a well-timed jump still clears it
  // (max jump apex ≈ JUMP_V^2/(2*GRAVITY) ≈ 187px above floor).
  var HEIGHT_TIERS = [
    { h: 20, weight: 3 },   // short
    { h: 32, weight: 3 },   // medium
    { h: 48, weight: 2 },   // tall
    { h: 66, weight: 1.4 }  // double-brick
  ];
  var running = false, animId = null, spawnId = null, bubbleId = null, powerId = null;
  var heroX = 60;
  var heroY = FIELD_H - GROUND_H - HERO_SIZE;
  var heroVY = 0;
  var obstacles = [];
  var powerups = [];
  var score = 0;
  var gameOver = false;
  var shielded = false;
  var slowUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var hero = document.getElementById(&#x27;hero&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var shieldBadge = document.getElementById(&#x27;shieldBadge&#x27;);
  var slowBadge = document.getElementById(&#x27;slowBadge&#x27;);

  var POWER_TYPES = [
    { key: &#x27;pearl&#x27;, emoji: &#x27;🦪&#x27;, weight: 3 },
    { key: &#x27;shield&#x27;, emoji: &#x27;🛡️&#x27;, weight: 2 },
    { key: &#x27;clock&#x27;, emoji: &#x27;⏱️&#x27;, weight: 2 }
  ];

  function pickHeight() {
    var total = 0;
    HEIGHT_TIERS.forEach(function (t) { total += t.weight; });
    var r = Math.random() * total;
    for (var i = 0; i &lt; HEIGHT_TIERS.length; i++) {
      r -= HEIGHT_TIERS[i].weight;
      if (r &lt;= 0) return HEIGHT_TIERS[i].h;
    }
    return HEIGHT_TIERS[0].h;
  }

  function currentSpeed() {
    return Date.now() &lt; slowUntil ? BASE_SPEED * 0.5 : BASE_SPEED;
  }

  function paintHero() {
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;
    hero.style.transform = heroVY &lt; -2 ? &#x27;rotate(-18deg)&#x27; : (heroVY &gt; 4 ? &#x27;rotate(12deg)&#x27; : &#x27;rotate(0deg)&#x27;);
    hero.className = shielded ? &#x27;hero shielded&#x27; : &#x27;hero&#x27;;
  }

  function updateBadges() {
    shieldBadge.style.display = shielded ? &#x27;&#x27; : &#x27;none&#x27;;
    slowBadge.style.display = Date.now() &lt; slowUntil ? &#x27;&#x27; : &#x27;none&#x27;;
  }

  function makeObstacle(x, h) {
    var o = { x: x, h: h, scored: false, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.height = h + &#x27;px&#x27;;
    field.appendChild(el);
    o.el = el;
    return o;
  }

  function spawnObstacle() {
    obstacles.push(makeObstacle(FIELD_W, pickHeight()));
  }

  function pickPower() {
    var total = 0;
    POWER_TYPES.forEach(function (p) { total += p.weight; });
    var r = Math.random() * total;
    for (var i = 0; i &lt; POWER_TYPES.length; i++) {
      r -= POWER_TYPES[i].weight;
      if (r &lt;= 0) return POWER_TYPES[i];
    }
    return POWER_TYPES[0];
  }

  function spawnPowerup() {
    if (!running) return;
    var type = pickPower();
    var y = (FIELD_H - GROUND_H - 60) - Math.random() * 120;
    var p = { x: FIELD_W, y: y, type: type.key, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.textContent = type.emoji;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
  }

  function floatText(txt, x, y, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;floater&#x27;;
    f.textContent = txt;
    f.style.left = x + &#x27;px&#x27;;
    f.style.top = y + &#x27;px&#x27;;
    f.style.color = color || &#x27;#fff&#x27;;
    field.appendChild(f);
    var start = null;
    function rise(ts) {
      if (!start) start = ts;
      var p = (ts - start) / 900;
      if (p &gt;= 1) { if (f.parentNode) f.parentNode.removeChild(f); return; }
      f.style.top = (y - p * 30) + &#x27;px&#x27;;
      f.style.opacity = (1 - p);
      requestAnimationFrame(rise);
    }
    requestAnimationFrame(rise);
  }

  function collectPower(p) {
    if (p.type === &#x27;pearl&#x27;) {
      score += 5;
      scoreEl.textContent = score;
      floatText(&#x27;+5&#x27;, p.x, p.y, &#x27;#ffe680&#x27;);
    } else if (p.type === &#x27;shield&#x27;) {
      shielded = true;
      floatText(&#x27;Shield!&#x27;, p.x, p.y, &#x27;#8fffff&#x27;);
    } else if (p.type === &#x27;clock&#x27;) {
      slowUntil = Date.now() + 4000;
      floatText(&#x27;Slow!&#x27;, p.x, p.y, &#x27;#c9f&#x27;);
    }
    updateBadges();
  }

  function spawnBubble() {
    if (!running) return;
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;bubble&#x27;;
    var size = 4 + Math.random() * 10;
    b.style.width = size + &#x27;px&#x27;;
    b.style.height = size + &#x27;px&#x27;;
    b.style.left = (Math.random() * FIELD_W) + &#x27;px&#x27;;
    b.style.top = (FIELD_H - GROUND_H) + &#x27;px&#x27;;
    field.appendChild(b);
    var start = null, dur = 2000 + Math.random() * 1500;
    var drift = (Math.random() - 0.5) * 30;
    var x0 = parseFloat(b.style.left);
    function rise(ts) {
      if (!start) start = ts;
      var p = (ts - start) / dur;
      if (p &gt;= 1 || !running) { if (b.parentNode) b.parentNode.removeChild(b); return; }
      b.style.top = ((FIELD_H - GROUND_H) - p * (FIELD_H - GROUND_H)) + &#x27;px&#x27;;
      b.style.left = (x0 + drift * p) + &#x27;px&#x27;;
      b.style.opacity = (1 - p);
      requestAnimationFrame(rise);
    }
    requestAnimationFrame(rise);
  }

  function jump() {
    if (!running || gameOver) return;
    if (heroY &gt;= FIELD_H - GROUND_H - HERO_SIZE - 1) heroVY = JUMP_V;
  }

  function tick() {
    if (!running) return;
    var spd = currentSpeed();
    heroVY += GRAVITY;
    heroY += heroVY;
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    if (heroY &gt; floorY) { heroY = floorY; heroVY = 0; }
    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }
    paintHero();

    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= spd;
      o.el.style.left = o.x + &#x27;px&#x27;;
      if (o.x + OBSTACLE_W &lt; 0) {
        field.removeChild(o.el);
        obstacles.splice(i, 1);
        continue;
      }
      if (!o.scored &amp;&amp; o.x + OBSTACLE_W &lt; heroX) {
        o.scored = true;
        // taller sandbars are worth more
        var pts = o.h &gt;= 66 ? 3 : (o.h &gt;= 48 ? 2 : 1);
        score += pts;
        scoreEl.textContent = score;
      }
      var obstacleTop = FIELD_H - GROUND_H - o.h;
      if (heroX + HERO_SIZE &gt; o.x &amp;&amp; heroX &lt; o.x + OBSTACLE_W &amp;&amp;
          heroY + HERO_SIZE &gt; obstacleTop) {
        if (shielded) {
          shielded = false;
          updateBadges();
          floatText(&#x27;Blocked!&#x27;, o.x, obstacleTop - 10, &#x27;#8fffff&#x27;);
          field.removeChild(o.el);
          obstacles.splice(i, 1);
          continue;
        }
        gameOver = true;
        stopGame();
        return;
      }
    }

    for (var j = powerups.length - 1; j &gt;= 0; j--) {
      var p = powerups[j];
      p.x -= spd;
      p.el.style.left = p.x + &#x27;px&#x27;;
      if (p.x + 32 &lt; 0) {
        field.removeChild(p.el);
        powerups.splice(j, 1);
        continue;
      }
      if (heroX + HERO_SIZE &gt; p.x + 4 &amp;&amp; heroX &lt; p.x + 28 &amp;&amp;
          heroY + HERO_SIZE &gt; p.y + 4 &amp;&amp; heroY &lt; p.y + 28) {
        collectPower(p);
        field.removeChild(p.el);
        powerups.splice(j, 1);
      }
    }

    updateBadges();
    animId = requestAnimationFrame(tick);
  }

  function clearObstacles() {
    obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    obstacles = [];
  }
  function clearPowerups() {
    powerups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    powerups = [];
  }

  function placeInitialObstacle() {
    clearObstacles();
    obstacles.push(makeObstacle(FIELD_W - OBSTACLE_W - 8, 32));
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    heroX = 60;
    heroY = FIELD_H - GROUND_H - HERO_SIZE;
    heroVY = 0;
    gameOver = false;
    shielded = false;
    slowUntil = 0;
    updateBadges();
    paintHero();
    clearObstacles();
    clearPowerups();
    spawnObstacle();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnObstacle, SPAWN_INTERVAL);
    bubbleId = setInterval(spawnBubble, 400);
    powerId = setInterval(spawnPowerup, 3800);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (bubbleId) { clearInterval(bubbleId); bubbleId = null; }
    if (powerId) { clearInterval(powerId); powerId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      jump();
      e.preventDefault();
    }
  });
  field.addEventListener(&#x27;click&#x27;, function () { jump(); });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintHero();
  placeInitialObstacle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
