&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✨ CRITTER SMASH ✨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap the cute critters and gold stars for points and chain hits for a combo, but never smash the bombs! Catch the rare spinning rainbow 🌈 to unleash a wild point-storm FRENZY.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 400, SIZE = 74;
  var score = 0, combo = 0, timeLeft = 35;
  var running = false, spawnId = null, clockId = null, frenzyId = null;
  var frenzy = false;
  var moleTimeouts = [];
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var scenery = document.getElementById(&#x27;scenery&#x27;);

  // sprinkle twinkling stars into the scenery
  (function seedTwinkles(){
    var glyphs = [&#x27;✨&#x27;,&#x27;⭐&#x27;,&#x27;🌟&#x27;,&#x27;💫&#x27;];
    for (var i = 0; i &lt; 14; i++) {
      var t = document.createElement(&#x27;div&#x27;);
      t.className = &#x27;twinkle&#x27;;
      t.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      t.style.left = Math.random()*620 + &#x27;px&#x27;;
      t.style.top = Math.random()*360 + &#x27;px&#x27;;
      t.style.animationDelay = (Math.random()*2.6) + &#x27;s&#x27;;
      t.style.fontSize = (12 + Math.random()*14) + &#x27;px&#x27;;
      scenery.appendChild(t);
    }
  })();

  var CRITTERS = [&#x27;🐸&#x27;,&#x27;🐹&#x27;,&#x27;🐰&#x27;,&#x27;🐷&#x27;,&#x27;🐵&#x27;,&#x27;🐤&#x27;,&#x27;🦊&#x27;,&#x27;🐙&#x27;,&#x27;🐼&#x27;,&#x27;🐨&#x27;];
  var audioCtx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(vol || 0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }
  function chime(base) {
    beep(base, 0.12, &#x27;triangle&#x27;);
    setTimeout(function(){ beep(base*1.25, 0.12, &#x27;triangle&#x27;); }, 70);
    setTimeout(function(){ beep(base*1.5, 0.14, &#x27;triangle&#x27;); }, 140);
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var kids = board.querySelectorAll(&#x27;.critter,.msg,.confetti,.frenzyText&#x27;);
    for (var j = 0; j &lt; kids.length; j++) kids[j].remove();
  }

  function floatMsg(x, y, text, color) {
    var m = document.createElement(&#x27;div&#x27;);
    m.className = &#x27;msg&#x27;; m.textContent = text; m.style.color = color;
    m.style.left = x + &#x27;px&#x27;; m.style.top = y + &#x27;px&#x27;;
    board.appendChild(m);
    setTimeout(function () { m.remove(); }, 800);
  }

  function confettiBurst(x, y, big) {
    var colors = [&#x27;#ff5edf&#x27;,&#x27;#ffd93d&#x27;,&#x27;#4dd0ff&#x27;,&#x27;#5efc82&#x27;,&#x27;#ff8c42&#x27;,&#x27;#fff&#x27;];
    var n = big ? 24 : 14;
    for (var i = 0; i &lt; n; i++) {
      (function () {
        var c = document.createElement(&#x27;div&#x27;);
        c.className = &#x27;confetti&#x27;;
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.left = x + &#x27;px&#x27;; c.style.top = y + &#x27;px&#x27;;
        board.appendChild(c);
        var ang = Math.random() * Math.PI * 2, dist = 30 + Math.random() * (big?90:55);
        var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
        c.animate([
          { transform: &#x27;translate(0,0) rotate(0deg)&#x27;, opacity: 1 },
          { transform: &#x27;translate(&#x27; + dx + &#x27;px,&#x27; + (dy + 50) + &#x27;px) rotate(540deg)&#x27;, opacity: 0 }
        ], { duration: 750, easing: &#x27;ease-out&#x27; });
        setTimeout(function () { c.remove(); }, 750);
      })();
    }
  }

  function shakeBoard() {
    board.classList.remove(&#x27;shake&#x27;);
    void board.offsetWidth;
    board.classList.add(&#x27;shake&#x27;);
  }

  function startFrenzy() {
    frenzy = true;
    board.classList.add(&#x27;frenzy&#x27;);
    var ft = document.createElement(&#x27;div&#x27;);
    ft.className = &#x27;frenzyText&#x27;; ft.textContent = &#x27;🌈 FRENZY! 🌈&#x27;;
    board.appendChild(ft);
    chime(660);
    if (frenzyId) clearTimeout(frenzyId);
    frenzyId = setTimeout(function () {
      frenzy = false;
      board.classList.remove(&#x27;frenzy&#x27;);
      var f = board.querySelector(&#x27;.frenzyText&#x27;);
      if (f) f.remove();
    }, 5000);
  }

  function spawnMole() {
    if (!running) return;
    var roll = Math.random();
    var type;
    if (!frenzy &amp;&amp; roll &lt; 0.05) type = &#x27;rainbow&#x27;;
    else if (roll &lt; (frenzy ? 0.02 : 0.14)) type = &#x27;bomb&#x27;;
    else if (roll &lt; 0.32) type = &#x27;star&#x27;;
    else type = &#x27;critter&#x27;;

    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;critter&#x27;;
    if (type === &#x27;rainbow&#x27;) el.className += &#x27; rainbow&#x27;;
    else if (type === &#x27;bomb&#x27;) el.className += &#x27; wobble&#x27;;
    var x = Math.random() * (BOARD_W - SIZE);
    var y = Math.random() * (BOARD_H - SIZE);
    el.style.left = x + &#x27;px&#x27;; el.style.top = y + &#x27;px&#x27;;
    if (type === &#x27;bomb&#x27;) el.textContent = &#x27;💣&#x27;;
    else if (type === &#x27;star&#x27;) el.textContent = &#x27;⭐&#x27;;
    else if (type === &#x27;rainbow&#x27;) el.textContent = &#x27;🌈&#x27;;
    else el.textContent = CRITTERS[Math.floor(Math.random() * CRITTERS.length)];

    var done = false;
    el.addEventListener(&#x27;click&#x27;, function () {
      if (done || !running) return;
      done = true;
      var cx = x + SIZE / 2, cy = y + SIZE / 2;
      if (type === &#x27;bomb&#x27;) {
        score = Math.max(0, score - 5);
        combo = 0;
        beep(90, 0.35, &#x27;sawtooth&#x27;, 0.25);
        shakeBoard();
        floatMsg(cx - 24, cy, &#x27;-5 💥&#x27;, &#x27;#ff4d4d&#x27;);
      } else if (type === &#x27;rainbow&#x27;) {
        combo += 1;
        score += 10;
        chime(880);
        confettiBurst(cx, cy, true);
        floatMsg(cx - 34, cy, &#x27;+10 🌈&#x27;, &#x27;#fff&#x27;);
        startFrenzy();
      } else {
        combo += 1;
        var mult = Math.min(6, combo);
        var base = type === &#x27;star&#x27; ? 5 : 1;
        var gained = base * mult * (frenzy ? 2 : 1);
        score += gained;
        beep((type === &#x27;star&#x27; ? 880 : 520) + combo * 30, 0.12, &#x27;triangle&#x27;);
        if (combo &gt; 1) beep(700 + combo * 40, 0.08, &#x27;square&#x27;, 0.12);
        confettiBurst(cx, cy);
        floatMsg(cx - 24, cy, &#x27;+&#x27; + gained + (mult &gt; 1 ? &#x27; x&#x27; + mult : &#x27;&#x27;), type === &#x27;star&#x27; ? &#x27;#ffd93d&#x27; : &#x27;#5efc82&#x27;);
      }
      scoreEl.textContent = score;
      comboEl.textContent = &#x27;x&#x27; + Math.min(6, Math.max(1, combo));
      el.classList.add(&#x27;leaving&#x27;);
      setTimeout(function () { el.remove(); }, 150);
    });
    board.appendChild(el);

    var life = (type === &#x27;rainbow&#x27;) ? 2200 : 1600 + Math.random() * 900;
    moleTimeouts.push(setTimeout(function () {
      if (!done &amp;&amp; el.parentNode === board) {
        el.classList.add(&#x27;leaving&#x27;);
        if (type === &#x27;critter&#x27; || type === &#x27;star&#x27;) { combo = 0; }
        comboEl.textContent = &#x27;x&#x27; + Math.max(1, combo);
        setTimeout(function () { el.remove(); }, 150);
      }
    }, life));
  }

  function tick() {
    timeLeft -= 1;
    timeEl.textContent = timeLeft;
    if (timeLeft &lt;= 0) endGame();
  }

  function currentSpawnRate() {
    if (frenzy) return 500;
    return Math.max(700, 1300 - (35 - timeLeft) * 14);
  }

  function scheduleSpawn() {
    if (!running) return;
    spawnMole();
    spawnId = setTimeout(scheduleSpawn, currentSpawnRate());
  }

  function startGame() {
    if (running) return;
    running = true;
    frenzy = false;
    board.classList.remove(&#x27;frenzy&#x27;);
    score = 0; combo = 0; timeLeft = 35;
    scoreEl.textContent = &#x27;0&#x27;; timeEl.textContent = &#x27;35&#x27;; comboEl.textContent = &#x27;x1&#x27;;
    banner.style.display = &#x27;none&#x27;;
    clearAllMoles();
    scheduleSpawn();
    clockId = setInterval(tick, 1000);
  }

  function stopGame() {
    running = false; frenzy = false;
    board.classList.remove(&#x27;frenzy&#x27;);
    if (spawnId) { clearTimeout(spawnId); spawnId = null; }
    if (clockId) { clearInterval(clockId); clockId = null; }
    if (frenzyId) { clearTimeout(frenzyId); frenzyId = null; }
    clearAllMoles();
    banner.textContent = &#x27;Press Start below to play!&#x27;;
    banner.style.display = &#x27;flex&#x27;;
  }

  function endGame() {
    running = false; frenzy = false;
    board.classList.remove(&#x27;frenzy&#x27;);
    if (spawnId) { clearTimeout(spawnId); spawnId = null; }
    if (clockId) { clearInterval(clockId); clockId = null; }
    if (frenzyId) { clearTimeout(frenzyId); frenzyId = null; }
    clearAllMoles();
    banner.innerHTML = &quot;⏰ Time&#x27;s up!&lt;br&gt;Final Score: &quot; + score + &quot;&lt;br&gt;&lt;span style=&#x27;font-size:18px&#x27;&gt;Press Start to play again&lt;/span&gt;&quot;;
    banner.style.display = &#x27;flex&#x27;;
    chime(660);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

<script>
