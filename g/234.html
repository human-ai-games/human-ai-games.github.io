&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d1030; color: #eef; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }

  @keyframes bob { from{transform:translateY(-3px) scale(1)} to{transform:translateY(3px) scale(1.12)} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cross the Lanes&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to dodge the fast cars and reach the glowing goal at the top for a point. Grab 🛡️ to survive one hit and ⏱️ to slow everything down — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;statusbar&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;shieldBadge&quot;&gt;🛡️ off&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;slowBadge&quot;&gt;⏱️ off&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var CAR_COLORS = [&#x27;#ff5d6c&#x27;,&#x27;#ffab4c&#x27;,&#x27;#4cd4ff&#x27;,&#x27;#b06cff&#x27;,&#x27;#5dffa0&#x27;,&#x27;#ff7cd4&#x27;,&#x27;#ffe066&#x27;];
  var BASE_SPEED = 1.4;        // faster starting speed (was ~0.5)
  var SPEED_STEP = 0.15;       // extra speed added per point scored
  var speedBoost = 0;          // grows as you score
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var hasShield = false;
  var slowUntil = 0;
  var powerups = [];
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var shieldBadge = document.getElementById(&#x27;shieldBadge&#x27;);
  var slowBadge = document.getElementById(&#x27;slowBadge&#x27;);

  // ---- Sound ----
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || &#x27;sine&#x27;;
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.15;
    osc.connect(gain); gain.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.start(now); osc.stop(now + dur);
  }
  function sMove() { beep(320, 0.07, &#x27;square&#x27;, 0.08); }
  function sScore() { beep(523, 0.1, &#x27;triangle&#x27;, 0.18); setTimeout(function(){ beep(784, 0.14, &#x27;triangle&#x27;, 0.18); }, 90); }
  function sPower() { beep(660, 0.08, &#x27;sine&#x27;, 0.2); setTimeout(function(){ beep(990, 0.12, &#x27;sine&#x27;, 0.2); }, 70); }
  function sCrash() { beep(140, 0.35, &#x27;sawtooth&#x27;, 0.25); }
  function sShieldBreak() { beep(400, 0.15, &#x27;square&#x27;, 0.2); setTimeout(function(){ beep(250, 0.2, &#x27;square&#x27;, 0.2); }, 100); }

  function drawScenery() {
    var top = document.createElement(&#x27;div&#x27;); top.className = &#x27;top-row&#x27;; field.appendChild(top);
    var goal = document.createElement(&#x27;div&#x27;); goal.className = &#x27;goal&#x27;; field.appendChild(goal);
    for (var s = 0; s &lt; 22; s++) {
      var st = document.createElement(&#x27;div&#x27;); st.className = &#x27;star&#x27;;
      st.style.left = (Math.random() * FIELD_W) + &#x27;px&#x27;;
      st.style.top = (Math.random() * (CELL - 6) + 3) + &#x27;px&#x27;;
      st.style.animationDelay = (Math.random() * 2) + &#x27;s&#x27;;
      field.appendChild(st);
    }
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var ln = document.createElement(&#x27;div&#x27;);
      ln.className = &#x27;lane &#x27; + (i % 2 === 0 ? &#x27;dark&#x27; : &#x27;light&#x27;);
      ln.style.top = (laneRow * CELL) + &#x27;px&#x27;;
      field.appendChild(ln);
      var dash = document.createElement(&#x27;div&#x27;); dash.className = &#x27;dash&#x27;;
      dash.style.top = (laneRow * CELL + CELL/2) + &#x27;px&#x27;;
      field.appendChild(dash);
    }
    var bot = document.createElement(&#x27;div&#x27;); bot.className = &#x27;bottom-row&#x27;; field.appendChild(bot);
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = BASE_SPEED + (i % 3) * 0.35;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var color = CAR_COLORS[i % CAR_COLORS.length];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.style.background = &#x27;linear-gradient(180deg,&#x27; + color + &#x27;,&#x27; + shade(color,-30) + &#x27;)&#x27;;
        var hl = document.createElement(&#x27;div&#x27;); hl.className = &#x27;hl&#x27;;
        if (dir &gt; 0) hl.style.right = &#x27;3px&#x27;; else hl.style.left = &#x27;3px&#x27;;
        el.appendChild(hl);
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function shade(hex, amt) {
    var c = hex.replace(&#x27;#&#x27;,&#x27;&#x27;);
    var r = Math.max(0,Math.min(255,parseInt(c.substr(0,2),16)+amt));
    var g = Math.max(0,Math.min(255,parseInt(c.substr(2,2),16)+amt));
    var b = Math.max(0,Math.min(255,parseInt(c.substr(4,2),16)+amt));
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function clearPowerups() {
    powerups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    powerups = [];
  }

  function spawnPowerup() {
    if (!running) return;
    var type = Math.random() &lt; 0.5 ? &#x27;shield&#x27; : &#x27;slow&#x27;;
    var col = Math.floor(Math.random() * COLS);
    var row = 1 + Math.floor(Math.random() * LANES);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.left = (col * CELL) + &#x27;px&#x27;;
    el.style.top = (row * CELL) + &#x27;px&#x27;;
    el.textContent = type === &#x27;shield&#x27; ? &#x27;🛡️&#x27; : &#x27;⏱️&#x27;;
    field.appendChild(el);
    var p = { type: type, col: col, row: row, el: el };
    powerups.push(p);
    setTimeout(function () {
      var idx = powerups.indexOf(p);
      if (idx &gt;= 0) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); powerups.splice(idx, 1); }
    }, 7000);
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.textContent = &#x27;😎&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
    heroEl.classList.toggle(&#x27;shield&#x27;, hasShield);
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function updateBadges() {
    shieldBadge.textContent = hasShield ? &#x27;🛡️ ready&#x27; : &#x27;🛡️ off&#x27;;
    shieldBadge.classList.toggle(&#x27;active&#x27;, hasShield);
    var slowOn = Date.now() &lt; slowUntil;
    slowBadge.textContent = slowOn ? &#x27;⏱️ slow!&#x27; : &#x27;⏱️ off&#x27;;
    slowBadge.classList.toggle(&#x27;active&#x27;, slowOn);
  }

  function tick() {
    if (!running) return;
    var slowFactor = Date.now() &lt; slowUntil ? 0.35 : 1;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      var laneSpeed = (lane.speed + speedBoost) * slowFactor;
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * laneSpeed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    updateBadges();
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var lane2 = lanes[laneIdx];
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        if (hx &lt; o2.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
            hy &lt; lane2.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane2.y) {
          if (hasShield) {
            hasShield = false;
            sShieldBreak();
            resetHero();
            updateBadges();
          } else {
            sCrash();
            endGame();
            return;
          }
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function collectCheck() {
    for (var i = powerups.length - 1; i &gt;= 0; i--) {
      var p = powerups[i];
      if (p.col === hero.col &amp;&amp; p.row === hero.row) {
        if (p.type === &#x27;shield&#x27;) hasShield = true;
        else slowUntil = Date.now() + 4000;
        sPower();
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        powerups.splice(i, 1);
        updateBadges();
      }
    }
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    sMove();
    collectCheck();
    if (hero.row === 0) {
      score += 1;
      speedBoost += SPEED_STEP;   // cars accelerate as you progress
      scoreEl.textContent = score;
      sScore();
      resetHero();
    }
  }

  var spawnTimer = null;
  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0;
    speedBoost = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    hasShield = false;
    slowUntil = 0;
    field.innerHTML = &#x27;&#x27;;
    clearPowerups();
    drawScenery();
    buildLanes();
    makeHero();
    resetHero();
    updateBadges();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnPowerup();
    spawnTimer = setInterval(spawnPowerup, 4500);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint.
  drawScenery();
  buildLanes();
  makeHero();
  paintHero();
  updateBadges();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
