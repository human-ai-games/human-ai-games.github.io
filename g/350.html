[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var FIELD_W=620, FIELD_H=388;
var PADDLE_H=14, PADDLE_BOTTOM=12, PADDLE_SPEED=8;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;),comboEl=document.getElementById(&#x27;combo&#x27;),levelEl=document.getElementById(&#x27;level&#x27;),chargeEl=document.getElementById(&#x27;charge&#x27;),bestEl=document.getElementById(&#x27;best&#x27;);

var running=false, animId=null, keysDown={}, mouseTarget=null;
var mode=&#x27;campaign&#x27;, difficulty=&#x27;normal&#x27;, bestScore=0;

// audio
var actx=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
function beep(f,d,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||&#x27;square&#x27;;o.frequency.value=f;g.gain.value=vol||0.12;o.connect(g);g.connect(a.destination);var t=a.currentTime;g.gain.setValueAtTime(g.gain.value,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d);}
function sweep(f1,f2,d,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||&#x27;sine&#x27;;o.connect(g);g.connect(a.destination);var t=a.currentTime;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d);}

// skins
var PADDLE_SKINS=[
  {name:&#x27;Neon&#x27;,unlock:0,draw:function(x,y,w){var g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,&#x27;#ff4ecd&#x27;);g.addColorStop(0.5,&#x27;#9d4eff&#x27;);g.addColorStop(1,&#x27;#4ec5ff&#x27;);return g;},glow:&#x27;#ff4ecd&#x27;},
  {name:&#x27;Gold (25)&#x27;,unlock:25,draw:function(x,y,w){var g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,&#x27;#ffcf4e&#x27;);g.addColorStop(1,&#x27;#ff9d4e&#x27;);return g;},glow:&#x27;#ffcf4e&#x27;},
  {name:&#x27;Ice (60)&#x27;,unlock:60,draw:function(x,y,w){var g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,&#x27;#9dfcff&#x27;);g.addColorStop(1,&#x27;#4e8aff&#x27;);return g;},glow:&#x27;#9dfcff&#x27;},
  {name:&#x27;Toxic (120)&#x27;,unlock:120,draw:function(x,y,w){var g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,&#x27;#9dff4e&#x27;);g.addColorStop(1,&#x27;#4eff9d&#x27;);return g;},glow:&#x27;#9dff4e&#x27;}
];
var BALL_SKINS=[
  {name:&#x27;Rainbow&#x27;,unlock:0,fill:function(b){var g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r);g.addColorStop(0,&#x27;#fff&#x27;);g.addColorStop(1,&#x27;hsl(&#x27;+b.hue+&#x27;,90%,55%)&#x27;);return g;},glow:function(b){return &#x27;hsl(&#x27;+b.hue+&#x27;,90%,60%)&#x27;;}},
  {name:&#x27;Fireball (40)&#x27;,unlock:40,fill:function(b){var g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r);g.addColorStop(0,&#x27;#fff&#x27;);g.addColorStop(0.5,&#x27;#ffcf4e&#x27;);g.addColorStop(1,&#x27;#ff3d1a&#x27;);return g;},glow:function(){return &#x27;#ff5a1a&#x27;;}},
  {name:&#x27;Plasma (90)&#x27;,unlock:90,fill:function(b){var g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r);g.addColorStop(0,&#x27;#fff&#x27;);g.addColorStop(1,&#x27;#c04eff&#x27;);return g;},glow:function(){return &#x27;#c04eff&#x27;;}}
];
var chosenPaddle=0,chosenBall=0,maxSeenScore=0;
function rebuildSkinMenus(){
  var ps=document.getElementById(&#x27;paddleSkin&#x27;);ps.innerHTML=&#x27;&#x27;;
  PADDLE_SKINS.forEach(function(s,i){var o=document.createElement(&#x27;option&#x27;);o.value=i;var l=maxSeenScore&lt;s.unlock;o.textContent=(l?&#x27;🔒 &#x27;:&#x27;&#x27;)+s.name;o.disabled=l;ps.appendChild(o);});
  ps.value=chosenPaddle;
  var bs=document.getElementById(&#x27;ballSkin&#x27;);bs.innerHTML=&#x27;&#x27;;
  BALL_SKINS.forEach(function(s,i){var o=document.createElement(&#x27;option&#x27;);o.value=i;var l=maxSeenScore&lt;s.unlock;o.textContent=(l?&#x27;🔒 &#x27;:&#x27;&#x27;)+s.name;o.disabled=l;bs.appendChild(o);});
  bs.value=chosenBall;
}
document.getElementById(&#x27;paddleSkin&#x27;).addEventListener(&#x27;change&#x27;,function(e){chosenPaddle=+e.target.value;});
document.getElementById(&#x27;ballSkin&#x27;).addEventListener(&#x27;change&#x27;,function(e){chosenBall=+e.target.value;});
document.getElementById(&#x27;difficulty&#x27;).addEventListener(&#x27;change&#x27;,function(e){difficulty=e.target.value;});

// ---- campaign story ----
var STORY=[
  {title:&#x27;Level 1 — Awakening&#x27;,text:&#x27;The Grid flickers to life. Keep the Core Ball alive and prove your reflexes.&#x27;,hits:6},
  {title:&#x27;Level 2 — The Swarm&#x27;,text:&#x27;Rogue bumpers infest the sector. Bounce through them to push deeper.&#x27;,hits:8},
  {title:&#x27;Level 3 — Blockade&#x27;,text:&#x27;Moving barriers guard the path to the Core. Break the line.&#x27;,hits:9},
  {title:&#x27;Level 4 — Secret Signal&#x27;,text:&#x27;A hidden star pulses in the dark. Touch it to reveal what lies beyond...&#x27;,hits:8,hasSecret:true},
  {title:&#x27;BOSS — The Overseer&#x27;,text:&#x27;The Overseer awakens. Strike its weak core while dodging its fire!&#x27;,boss:true}
];
var SECRET_LEVEL={title:&#x27;??? — The Void&#x27;,text:&#x27;You slipped between the walls. A silent, faster realm. Survive the chaos.&#x27;,hits:12,secret:true};
var storyStage=0, showingStory=false, storyTimer=0;

// game state
var paddle,balls,powerups,particles,obstacles,boss,bossBullets,secretStar,stars,trails;
var score,combo,comboTimer,level,hitsThisLevel,hitsNeeded;
var slowFactor,slowTimer,widePaddleTimer,charge,shake,shakeMag;
var basePaddleW=100;
var inSecret=false;

function diffParams(){
  if(difficulty===&#x27;easy&#x27;)return{spd:0.85,bossHp:8,bulletRate:120};
  if(difficulty===&#x27;hard&#x27;)return{spd:1.35,bossHp:20,bulletRate:55};
  return{spd:1.0,bossHp:14,bulletRate:85};
}

function resetState(){
  paddle={x:(FIELD_W-basePaddleW)/2,w:basePaddleW};
  balls=[];powerups=[];particles=[];obstacles=[];bossBullets=[];trails=[];
  boss=null;secretStar=null;
  score=0;combo=1;comboTimer=0;level=1;hitsThisLevel=0;
  slowFactor=1;slowTimer=0;widePaddleTimer=0;charge=0;shake=0;shakeMag=0;
  inSecret=false;storyStage=0;
  makeStars();
  if(mode===&#x27;campaign&#x27;){startStage(0);} else {beginLevel(); balls.push(newBall());}
  updateHUD();
}
function makeStars(){stars=[];for(var i=0;i&lt;70;i++)stars.push({x:Math.random()*FIELD_W,y:Math.random()*FIELD_H,z:Math.random()*2+0.3,tw:Math.random()*Math.PI*2});}

function startStage(idx){
  storyStage=idx;
  var s=STORY[idx];
  showingStory=true;storyTimer=150;
  // set up level contents
  balls=[];powerups=[];obstacles=[];bossBullets=[];boss=null;secretStar=null;
  hitsThisLevel=0;
  if(s.boss){setupBoss();}
  else{
    hitsNeeded=s.hits;
    var np = idx; // more obstacles later
    for(var i=0;i&lt;Math.min(idx,3);i++)obstacles.push({type:&#x27;bumper&#x27;,x:100+i*180+Math.random()*40,y:110+Math.random()*70,r:15});
    if(idx&gt;=2)obstacles.push({type:&#x27;block&#x27;,x:200,y:210,w:80,h:14,vx:2.2,minx:60,maxx:FIELD_W-140});
    if(s.hasSecret)secretStar={x:60+Math.random()*(FIELD_W-120),y:70+Math.random()*120,r:11,found:false,tw:0};
  }
  level=idx+1;updateHUD();
}
function beginLevel(){hitsNeeded=6;}

function setupBoss(){
  var d=diffParams();
  boss={x:FIELD_W/2,y:70,w:130,h:44,hp:d.bossHp,maxHp:d.bossHp,vx:2.4,fireTimer:d.bulletRate,fireRate:d.bulletRate,hue:300,coreOpen:true};
  balls=[newBall()];
}

function newBall(x,y,vx){
  var d=diffParams();
  var base=(3.0+level*0.3)*d.spd*(inSecret?1.4:1);
  var ang=(Math.random()*0.6-0.3);
  return{x:x!=null?x:FIELD_W/2,y:y!=null?y:60,r:9,vx:vx!=null?vx:(Math.random()&lt;0.5?-1:1)*base*Math.cos(ang),vy:base,hue:Math.random()*360};
}
function updateHUD(){
  scoreEl.textContent=score;comboEl.textContent=combo;levelEl.textContent=inSecret?&#x27;★&#x27;:level;
  chargeEl.textContent=Math.floor(charge)+&#x27;%&#x27;;
  if(score&gt;bestScore){bestScore=score;bestEl.textContent=bestScore;}
  if(score&gt;maxSeenScore){maxSeenScore=score;rebuildSkinMenus();}
}

var PU_TYPES=[{key:&#x27;wide&#x27;,color:&#x27;#4ec5ff&#x27;,label:&#x27;W&#x27;},{key:&#x27;multi&#x27;,color:&#x27;#ff4ecd&#x27;,label:&#x27;+&#x27;},{key:&#x27;slow&#x27;,color:&#x27;#9dff4e&#x27;,label:&#x27;S&#x27;},{key:&#x27;escort&#x27;,color:&#x27;#ffcf4e&#x27;,label:&#x27;★&#x27;}];
function spawnPowerup(){var t=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];powerups.push({x:20+Math.random()*(FIELD_W-40),y:-14,r:12,vy:1.6,type:t});}
function burst(x,y,color,n){for(var i=0;i&lt;(n||10);i++){var a=Math.random()*Math.PI*2,s=1+Math.random()*3.5;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});}}
function paddleTop(){return FIELD_H-PADDLE_BOTTOM-PADDLE_H;}
function addShake(m){shake=12;shakeMag=m;}

function advanceStage(){
  if(mode!==&#x27;campaign&#x27;)return;
  if(inSecret){inSecret=false;startStage(4);return;} // after secret, go to boss
  if(storyStage&gt;=STORY.length-1){
    // campaign complete
    showingStory=true;storyTimer=99999;storyStage=-1;return;
  }
  startStage(storyStage+1);
}

function fireShockwave(){
  if(charge&lt;100)return;
  charge=0;updateHUD();
  addShake(8);sweep(900,120,0.4,&#x27;sawtooth&#x27;,0.2);
  burst(paddle.x+paddle.w/2,paddleTop(),&#x27;#9dff4e&#x27;,40);
  // destroy bullets, damage boss, score
  bossBullets=[];
  if(boss){boss.hp-=3;burst(boss.x,boss.y,&#x27;#fff&#x27;,30);if(boss.hp&lt;=0)killBoss();}
  obstacles.forEach(function(o){burst(o.x,o.y,&#x27;#9dff4e&#x27;,10);});
  score+=15;updateHUD();
}

function killBoss(){
  burst(boss.x,boss.y,&#x27;#ff4ecd&#x27;,60);addShake(14);sweep(600,80,0.8,&#x27;sawtooth&#x27;,0.25);
  boss=null;score+=100;updateHUD();
  advanceStage();
}

function tick(){
  if(!running)return;

  if(showingStory){
    storyTimer--;
    if(storyTimer&lt;=0&amp;&amp;storyStage&gt;=0){
      showingStory=false;
      var s=STORY[storyStage];
      if(!s.boss&amp;&amp;balls.length===0)balls.push(newBall());
      if(mode!==&#x27;campaign&#x27;&amp;&amp;balls.length===0)balls.push(newBall());
    }
    drawStory();
    animId=requestAnimationFrame(tick);
    return;
  }

  var dt=slowFactor;

  // paddle
  if(mouseTarget!=null){var c=paddle.x+paddle.w/2;paddle.x+=(mouseTarget-c)*0.25;}
  if(keysDown[&#x27;ArrowLeft&#x27;])paddle.x-=PADDLE_SPEED;
  if(keysDown[&#x27;ArrowRight&#x27;])paddle.x+=PADDLE_SPEED;
  paddle.x=Math.max(0,Math.min(FIELD_W-paddle.w,paddle.x));

  if(comboTimer&gt;0){comboTimer--;if(comboTimer===0){combo=1;updateHUD();}}
  if(slowTimer&gt;0){slowTimer--;if(slowTimer===0)slowFactor=1;}
  if(widePaddleTimer&gt;0){widePaddleTimer--;if(widePaddleTimer===0){var cc=paddle.x+paddle.w/2;paddle.w=basePaddleW;paddle.x=cc-paddle.w/2;}}
  if(shake&gt;0)shake--;

  // stars
  stars.forEach(function(st){st.y+=st.z*0.4;if(st.y&gt;FIELD_H){st.y=0;st.x=Math.random()*FIELD_W;}st.tw+=0.05;});

  // obstacles
  obstacles.forEach(function(o){if(o.type===&#x27;block&#x27;){o.x+=o.vx*dt;if(o.x&lt;=o.minx||o.x&gt;=o.maxx)o.vx=-o.vx;}});

  // boss
  if(boss){
    boss.x+=boss.vx*dt;
    if(boss.x-boss.w/2&lt;=0||boss.x+boss.w/2&gt;=FIELD_W)boss.vx=-boss.vx;
    boss.hue=(boss.hue+1)%360;
    boss.fireTimer--;
    if(boss.fireTimer&lt;=0){boss.fireTimer=boss.fireRate;bossBullets.push({x:boss.x,y:boss.y+boss.h/2,vy:3.4,r:7});beep(200,0.1,&#x27;sawtooth&#x27;,0.1);}
  }
  // boss bullets
  for(var bi=bossBullets.length-1;bi&gt;=0;bi--){
    var bu=bossBullets[bi];bu.y+=bu.vy*dt;
    var pt0=paddleTop();
    if(bu.y+bu.r&gt;=pt0&amp;&amp;bu.x&gt;=paddle.x&amp;&amp;bu.x&lt;=paddle.x+paddle.w){bossBullets.splice(bi,1);burst(bu.x,bu.y,&#x27;#ff3d1a&#x27;,8);combo=1;comboTimer=0;addShake(6);beep(120,0.2,&#x27;sawtooth&#x27;,0.15);updateHUD();continue;}
    if(bu.y-bu.r&gt;FIELD_H)bossBullets.splice(bi,1);
  }

  var pt=paddleTop();
  for(var i=balls.length-1;i&gt;=0;i--){
    var b=balls[i];
    trails.push({x:b.x,y:b.y,r:b.r,hue:b.hue,life:1});
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.hue=(b.hue+2)%360;
    if(b.x-b.r&lt;=0){b.x=b.r;b.vx=-b.vx;beep(300,0.05);}
    if(b.x+b.r&gt;=FIELD_W){b.x=FIELD_W-b.r;b.vx=-b.vx;beep(300,0.05);}
    if(b.y-b.r&lt;=0){b.y=b.r;b.vy=-b.vy;beep(300,0.05);}

    // secret star
    if(secretStar&amp;&amp;!secretStar.found){var dx=b.x-secretStar.x,dy=b.y-secretStar.y;if(dx*dx+dy*dy&lt;(b.r+secretStar.r)*(b.r+secretStar.r)){secretStar.found=true;burst(secretStar.x,secretStar.y,&#x27;#ffcf4e&#x27;,30);sweep(500,1400,0.5,&#x27;triangle&#x27;,0.18);score+=30;updateHUD();inSecret=true;startStage(STORY.length); /* invalid idx triggers secret */}}

    // boss hit
    if(boss){
      if(b.y-b.r&lt;=boss.y+boss.h/2&amp;&amp;b.y+b.r&gt;=boss.y-boss.h/2&amp;&amp;b.x&gt;=boss.x-boss.w/2&amp;&amp;b.x&lt;=boss.x+boss.w/2){
        b.vy=Math.abs(b.vy);b.y=boss.y+boss.h/2+b.r;
