&lt;script&gt;
  var TYPES = {

      mole.classList.remove(&#x27;up&#x27;); clear();

    mole.addEventListener(&#x27;click&#x27;, function (ev) {

      if (!alive) return;
      alive = false;
      clearTimeout(lifeTimer);

      updateCombo();

      scoreEl.textContent = score;

      mole.classList.add(&#x27;hit&#x27;);
      explode(hole.el, t.cls);
      floatScore(hole.el, gained, t.cls);
      sound(t.cls === &#x27;magenta&#x27; ? 880 : t.cls === &#x27;gold&#x27; ? 660 : 520, 0.18, &#x27;triangle&#x27;);
      timeouts.push(setTimeout(clear, 200));

  var COLORS = { cyan:[&#x27;#9bffff&#x27;,&#x27;#00eaff&#x27;], gold:[&#x27;#fff6c0&#x27;,&#x27;#ffd700&#x27;], magenta:[&#x27;#ffb0f5&#x27;,&#x27;#ff36e0&#x27;] };

      p.className = &#x27;particle&#x27;;

    f.className = &#x27;floatscore&#x27;;
    f.textContent = &#x27;+&#x27; + val;

  function currentSpawnInterval() {
    var frac = timeLeft / 60; // 1 -&gt; 0
    return Math.round(320 + frac * 530);
  }

    if (!running) return;
    spawnMole();
    spawnTimer = setTimeout(scheduleSpawn, currentSpawnInterval());
  }

  function tick() {
    if (!running) return;
    timeLeft--;

    timeEl.textContent = timeLeft;
    if (timeLeft &lt;= 0) { endGame(); return; }

  }

  function stopGame() {
    running = false;
    clearTimeout(spawnTimer); clearInterval(countdownTimer);
    clearMoles();
  }

  function endGame() {
    running = false;
    clearTimeout(spawnTimer); clearInterval(countdownTimer);

    overlay.classList.remove(&#x27;hidden&#x27;);

  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {

          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
