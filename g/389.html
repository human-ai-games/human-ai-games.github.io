&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Froggy Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys, dodge the goofy crocodiles, and grab powerups: 🕐 freezes crocs, ⭐ gives bonus points, 🛡️ blocks one chomp. Reach the top to score — getting chomped ends the round!&lt;/p&gt;

    &lt;div class=&quot;badge&quot; id=&quot;freezeBadge&quot;&gt;🕐 off&lt;/div&gt;

&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var PU_SIZE = 30;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var powerups = [];
  var score = 0;
  var shield = false;
  var freezeUntil = 0;
  var spawnTimer = null;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var shieldBadge = document.getElementById(&#x27;shieldBadge&#x27;);
  var freezeBadge = document.getElementById(&#x27;freezeBadge&#x27;);
  var waterEls = [];

  function drawLaneBackgrounds() {
    waterEls = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var isWater = !(r === 0 || r === ROWS - 1);
      var l = document.createElement(&#x27;div&#x27;);
      l.className = &#x27;lane &#x27; + (isWater ? &#x27;water&#x27; : &#x27;grass&#x27;);
      l.style.top = (r * CELL) + &#x27;px&#x27;;
      l.style.height = CELL + &#x27;px&#x27;;
      if (isWater) {
        for (var k = 0; k &lt; 4; k++) {
          var rp = document.createElement(&#x27;div&#x27;);
          rp.className = &#x27;ripple&#x27;;
          rp.style.left = (30 + Math.random() * (FIELD_W - 60)) + &#x27;px&#x27;;
          rp.style.top = (10 + Math.random() * (CELL - 20)) + &#x27;px&#x27;;
          rp.style.animationDelay = (Math.random() * 2.4) + &#x27;s&#x27;;
          l.appendChild(rp);
        }
        waterEls.push(l);
      }
      field.appendChild(l);
    }
  }

  function setWaterAnimation(active) {
    waterEls.forEach(function (l) {
      if (active) l.classList.remove(&#x27;stopped&#x27;); else l.classList.add(&#x27;stopped&#x27;);
      l.querySelectorAll(&#x27;.ripple&#x27;).forEach(function (rp) {
        rp.style.animationPlayState = active ? &#x27;running&#x27; : &#x27;paused&#x27;;
      });
    });
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2 - 4;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.5 + (i % 3) * 0.2;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27; + (dir &gt; 0 ? &#x27; flip&#x27; : &#x27;&#x27;);
        el.textContent = &#x27;🐊&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles, row: laneRow });
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2 - 4;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2 - 4;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
    heroEl.classList.toggle(&#x27;shielded&#x27;, shield);
  }

  function spawnSplash() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2 - 4;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2 - 4;
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;splash&#x27;; s.textContent = &#x27;💦&#x27;;
    s.style.left = x + &#x27;px&#x27;; s.style.top = y + &#x27;px&#x27;;
    field.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
  }

  function toast(text, col, rowPx) {
    var t = document.createElement(&#x27;div&#x27;);
    t.className = &#x27;toast&#x27;; t.textContent = text;
    t.style.left = (col * CELL) + &#x27;px&#x27;;
    t.style.top = rowPx + &#x27;px&#x27;;
    field.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 1000);
  }

  var PU_TYPES = [
    { kind: &#x27;freeze&#x27;, emoji: &#x27;🕐&#x27; },
    { kind: &#x27;star&#x27;, emoji: &#x27;⭐&#x27; },
    { kind: &#x27;shield&#x27;, emoji: &#x27;🛡️&#x27; }
  ];

  function spawnPowerup() {
    if (!running) return;
    var type = PU_TYPES[Math.floor(Math.random() * PU_TYPES.length)];
    var laneIdx = Math.floor(Math.random() * LANES);
    var lane = lanes[laneIdx];
    var dir = -lane.dir; // drift opposite to that lane&#x27;s crocs for variety
    var startX = dir &gt; 0 ? -PU_SIZE : FIELD_W;
    var y = lane.row * CELL + (CELL - PU_SIZE) / 2;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.textContent = type.emoji;
    el.style.left = startX + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    powerups.push({ x: startX, y: y, dir: dir, speed: 0.7, el: el, kind: type.kind, row: lane.row });
  }

  function collect(pu) {
    var rowPx = pu.row * CELL;
    if (pu.kind === &#x27;freeze&#x27;) {
      freezeUntil = performance.now() + 3000;
      toast(&#x27;FREEZE!&#x27;, hero.col, rowPx);
    } else if (pu.kind === &#x27;star&#x27;) {
      score += 3;
      scoreEl.textContent = score;
      toast(&#x27;+3&#x27;, hero.col, rowPx);
    } else if (pu.kind === &#x27;shield&#x27;) {
      shield = true;
      toast(&#x27;SHIELD!&#x27;, hero.col, rowPx);
    }
    if (pu.el.parentNode) pu.el.parentNode.removeChild(pu.el);
  }

  function updateBadges(now) {
    shieldBadge.textContent = &#x27;🛡️ &#x27; + (shield ? &#x27;ON&#x27; : &#x27;off&#x27;);
    shieldBadge.classList.toggle(&#x27;active&#x27;, shield);
    var frozen = now &lt; freezeUntil;
    var remain = frozen ? Math.ceil((freezeUntil - now) / 1000) : 0;
    freezeBadge.textContent = &#x27;🕐 &#x27; + (frozen ? remain + &#x27;s&#x27; : &#x27;off&#x27;);
    freezeBadge.classList.toggle(&#x27;active&#x27;, frozen);
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax &lt; bx + bw &amp;&amp; ax + aw &gt; bx &amp;&amp; ay &lt; by + bh &amp;&amp; ay + ah &gt; by;
  }

  function tick() {
    if (!running) return;
    var now = performance.now();
    var frozen = now &lt; freezeUntil;

    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.el.classList.toggle(&#x27;frozen&#x27;, frozen);
        if (!frozen) {
          o.x += lane.dir * lane.speed;
          if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
          else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
          o.el.style.left = o.x + &#x27;px&#x27;;
        }
      }
    }

    // move powerups
    var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.x += pu.dir * pu.speed;
      pu.el.style.left = pu.x + &#x27;px&#x27;;
      if (pu.x &lt; -PU_SIZE - 4 || pu.x &gt; FIELD_W + 4) {
        if (pu.el.parentNode) pu.el.parentNode.removeChild(pu.el);
        powerups.splice(p, 1);
        continue;
      }
      if (overlap(hx, hy, HERO_SIZE, HERO_SIZE, pu.x, pu.y, PU_SIZE, PU_SIZE)) {
        collect(pu);
        powerups.splice(p, 1);
      }
    }

    // collision with crocs
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var lane2 = lanes[laneIdx];
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        if (overlap(hx, hy, HERO_SIZE, HERO_SIZE, o2.x, lane2.y, OBSTACLE_W, OBSTACLE_H)) {
          if (shield) {
            shield = false;
            toast(&#x27;BLOCKED!&#x27;, hero.col, hero.row * CELL);
            resetHero();
          } else {
            endGame();
            return;
          }
          break;
        }
      }
    }

    updateBadges(now);
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    var moved = (nc !== hero.col || nr !== hero.row);
    hero.col = nc;
    hero.row = nr;
    paintHero();
    if (moved &amp;&amp; hero.row &gt;= 1 &amp;&amp; hero.row &lt;= LANES) spawnSplash();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    if (heroEl) heroEl.textContent = &#x27;💥&#x27;;
    setWaterAnimation(false);
  }

  function clearPowerups() {
    powerups.forEach(function (pu) { if (pu.el.parentNode) pu.el.parentNode.removeChild(pu.el); });
    powerups = [];
  }

  function startGame() {
    if (running) return;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    shield = false; freezeUntil = 0;
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    clearPowerups();
    drawLaneBackgrounds();
    buildLanes();
    makeHero();
    resetHero();
    setWaterAnimation(true);
    updateBadges(performance.now());
    running = true;
    animId = requestAnimationFrame(tick);
    if (spawnTimer) clearInterval(spawnTimer);
    spawnPowerup(); // one right away for responsiveness
    spawnTimer = setInterval(spawnPowerup, 4500);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    setWaterAnimation(false);
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  drawLaneBackgrounds();
  buildLanes();
  makeHero();
  paintHero();
  setWaterAnimation(false);
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
