&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐹 Mole Trouble 🌱&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;You own this lawn and the moles are wrecking it — click a mole to send it packing, and whack it quickly for a goofy noise! Small ones drop in one hit, big slow ones need two and score more, and watch for fancy moles in hats and shades.&lt;/p&gt;

&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 452;
  var SPAWN_MS = 850;
  var score = 0;
  var intervalId = null;
  var moleTimeouts = [];
  var running = false;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var HOLES = [];
  (function () {
    var cols = 4, rows = 3;
    var marginX = 90, marginY = 90;
    var spanX = (BOARD_W - marginX * 2) / (cols - 1);
    var spanY = (BOARD_H - marginY * 2) / (rows - 1);
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; cols; c++) {
        HOLES.push({ x: marginX + c * spanX + (r % 2 ? 20 : 0), y: marginY + r * spanY });

  })();
  var holeBusy = [];

  var holeEls = [];
  var clipEls = [];

    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;hole&#x27;;
    el.style.left = h.x + &#x27;px&#x27;;
    el.style.top = h.y + &#x27;px&#x27;;

        &#x27;&lt;rect x=&quot;34&quot; y=&quot;20&quot; width=&quot;14&quot; height=&quot;10&quot; rx=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27; +

      &#x27;&lt;ellipse cx=&quot;32&quot; cy=&quot;40&quot; rx=&quot;16&quot; ry=&quot;14&quot; fill=&quot;#a37a52&quot;/&gt;&#x27; +

      eyes +
      &#x27;&lt;ellipse cx=&quot;32&quot; cy=&quot;36&quot; rx=&quot;6&quot; ry=&quot;4.5&quot; fill=&quot;#e88aa0&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;35&quot; r=&quot;1.3&quot; fill=&quot;#c76a82&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;34&quot; cy=&quot;35&quot; r=&quot;1.3&quot; fill=&quot;#c76a82&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;28&quot; y=&quot;42&quot; width=&quot;4&quot; height=&quot;8&quot; rx=&quot;1.5&quot; fill=&quot;#fff&quot; stroke=&quot;#ccc&quot; stroke-width=&quot;0.5&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;32&quot; y=&quot;42&quot; width=&quot;4&quot; height=&quot;8&quot; rx=&quot;1.5&quot; fill=&quot;#fff&quot; stroke=&quot;#ccc&quot; stroke-width=&quot;0.5&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;8&quot; y1=&quot;34&quot; x2=&quot;20&quot; y2=&quot;36&quot; stroke=&quot;#4a3320&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;8&quot; y1=&quot;40&quot; x2=&quot;20&quot; y2=&quot;40&quot; stroke=&quot;#4a3320&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +

      o.frequency.exponentialRampToValueAtTime(700, t + 0.12);
      o.frequency.exponentialRampToValueAtTime(320, t + 0.28);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    holeEls.forEach(function (h) {
      var c = h.querySelector(&#x27;.clip&#x27;);

  function spawnMole() {

    for (var i = 0; i &lt; holeBusy.length; i++) if (!holeBusy[i]) free.push(i);
    if (free.length === 0) return;
    var idx = free[Math.floor(Math.random() * free.length)];
    holeBusy[idx] = true;
    var holeEl = holeEls[idx];
    var clipEl = clipEls[idx];

    var big = Math.random() &lt; 0.32;
    var hp = big ? 2 : 1;

    var accessory = &#x27;&#x27;;
    var roll = Math.random();
    if (roll &lt; 0.2) accessory = &#x27;hat&#x27;;

    mole.className = &#x27;mole down&#x27;;
    mole.innerHTML = moleSVG(big, accessory);
    mole.style.transitionDuration = big ? &#x27;0.36s&#x27; : &#x27;0.16s&#x27;;
    clipEl.appendChild(mole);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        mole.classList.remove(&#x27;down&#x27;);
        mole.classList.add(&#x27;up&#x27;);

    var gone = false;

    function retreat() {
      if (gone) return;
      gone = true;
      mole.classList.remove(&#x27;up&#x27;);
      mole.classList.add(&#x27;down&#x27;);
      setTimeout(function () {
        if (mole.parentNode === clipEl) clipEl.removeChild(mole);

      ev.stopPropagation();

      var reaction = Date.now() - appearTime;
      var fast = reaction &lt; 500;

      hp -= 1;

        mole.classList.remove(&#x27;flash&#x27;); void mole.offsetWidth; mole.classList.add(&#x27;flash&#x27;);
        return;

      if (fast) {
        boing();
      } else {
        beep(big ? 520 : 660, 0.12, &#x27;square&#x27;);

      var pts = big ? 3 : 1;
      if (fast) pts += 1;
      score += pts;
      scoreEl.textContent = score;

      var badge = document.createElement(&#x27;div&#x27;);
      badge.className = &#x27;badge&#x27;;
      badge.textContent = fast ? &#x27;+&#x27; + pts + &#x27; ⚡&#x27; : &#x27;+&#x27; + pts;
      holeEl.appendChild(badge);
      requestAnimationFrame(function () { badge.classList.add(&#x27;show&#x27;); });
      setTimeout(function () { if (badge.parentNode === holeEl) holeEl.removeChild(badge); }, 620);
      retreat();
    });

    moleTimeouts.push(setTimeout(retreat, lifeMs));
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    if (intervalId) clearInterval(intervalId);
    clearAllMoles();
    spawnMole();
    intervalId = setInterval(spawnMole, SPAWN_MS);
  }

    if (!running) return;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllMoles();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();

    window.addEventListener(t, function(e) {

          &#x27;*&#x27;

    }, true);
  });
