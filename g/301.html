<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🦆 Duck Crossing</b> &middot; Game 301 &middot; Professional producer &middot; Basic game: Road crossing</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .status { font-size: 20px; color: #555; margin: 0; display:flex; gap:20px; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .hero { position: absolute; text-align:center; font-size: 30px; line-height: 36px; z-index: 5; transition: left .08s, top .08s; }
  .guard { position: absolute; text-align:center; font-size: 30px; line-height: 36px; z-index: 5; transition: left .12s, top .12s; }
  .vehicle { position: absolute; border-radius: 6px; z-index: 3; display:flex; align-items:center; justify-content:space-between; box-shadow: 0 2px 3px rgba(0,0,0,.25); }
  .vehicle .wheel { width: 10px; height: 10px; background:#111; border-radius:50%; position:absolute; bottom:-4px; }
  .vehicle .win { position:absolute; top:5px; background:#bfe3ff; border-radius:2px; height: 40%; }
  .powerup { position:absolute; z-index:4; font-size: 26px; text-align:center; line-height: 30px; }
  .frozen-tint { position:absolute; inset:0; background: rgba(150,210,255,.28); z-index: 6; pointer-events:none; }
  .guardstop { position:absolute; left:0; right:0; z-index:2; background: rgba(255,80,80,.16); pointer-events:none; }
  .banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:10; color:#fff; font-size:30px; font-weight:700; text-shadow:0 2px 4px #000; background:rgba(0,0,0,.35); }
  .banner small { font-size:18px; font-weight:400; margin-top:6px; }
  .levelflash { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:9; color:#fff; font-size:36px; font-weight:800; text-shadow:0 2px 6px #000; pointer-events:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦆 Duck Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Guide your duck across the avenue with the arrow keys, dodging cars and trucks to reach the forest and lake at the top. Watch out for the traffic guard 👮 who chases you when you&#x27;re near — cars freeze in his lane, but if he touches you it&#x27;s game over. Grab a ❄️ snowflake to freeze traffic, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;status&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;span&gt;Level: &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/span&gt;&lt;span id=&quot;freeze&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = 36;
  var VEH_H = CELL - 16;
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var guard = { col: 5, row: 4, px: 0, py: 0, active: false };
  var lanes = [];
  var powerups = [];
  var score = 0;
  var level = 1;
  var freezeUntil = 0;
  var lastGuardStep = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null, guardEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var freezeEl = document.getElementById(&#x27;freeze&#x27;);
  var frozenTintEl = null, guardStopEl = null;
  var bannerEl = null;

  var CAR_COLORS = [&#x27;#e74c3c&#x27;,&#x27;#3498db&#x27;,&#x27;#f39c12&#x27;,&#x27;#9b59b6&#x27;,&#x27;#1abc9c&#x27;,&#x27;#e67e22&#x27;];
  var TRUCK_COLORS = [&#x27;#2c3e50&#x27;,&#x27;#34495e&#x27;,&#x27;#7f8c8d&#x27;,&#x27;#8e44ad&#x27;];

  var GUARD_SIZE = 34;
  var GUARD_DETECT = 4;      // chase if within this many cells (Manhattan-ish)
  var GUARD_STEP_MS = 320;   // how often the guard moves a cell

  function now() { return performance.now(); }
  function isFrozen() { return now() &lt; freezeUntil; }
  function speedMult() { return Math.pow(1.18, level - 1); }
  function guardStepMs() { return Math.max(180, GUARD_STEP_MS - (level - 1) * 12); }

  function buildScenery() {
    var forest = document.createElement(&#x27;div&#x27;);
    forest.style.cssText = &#x27;position:absolute;left:0;right:0;top:0;height:&#x27;+CELL+&#x27;px;background:linear-gradient(#79c26a,#4d9e4d);z-index:1;&#x27;;
    forest.innerHTML = &#x27;🌲🌳🌊🌲💧🌳🌲🌳🌊🌲&#x27;;
    forest.style.fontSize = &#x27;26px&#x27;;
    forest.style.textAlign = &#x27;center&#x27;;
    forest.style.lineHeight = CELL + &#x27;px&#x27;;
    forest.style.letterSpacing = &#x27;6px&#x27;;
    field.appendChild(forest);

    var road = document.createElement(&#x27;div&#x27;);
    road.style.cssText = &#x27;position:absolute;left:0;right:0;top:&#x27;+CELL+&#x27;px;height:&#x27;+(LANES*CELL)+&#x27;px;background:#4a4a4a;z-index:0;&#x27;;
    field.appendChild(road);

    for (var r = 2; r &lt;= LANES; r++) {
      var dash = document.createElement(&#x27;div&#x27;);
      dash.style.cssText = &#x27;position:absolute;left:0;right:0;top:&#x27;+(r*CELL-1)+&#x27;px;height:3px;z-index:2;&#x27;
        + &#x27;background:repeating-linear-gradient(90deg,#f5d33a 0 24px, transparent 24px 48px);opacity:.7;&#x27;;
      field.appendChild(dash);
    }

    var grass = document.createElement(&#x27;div&#x27;);
    grass.style.cssText = &#x27;position:absolute;left:0;right:0;top:&#x27;+((ROWS-1)*CELL)+&#x27;px;height:&#x27;+CELL+&#x27;px;background:#5cae4f;z-index:1;&#x27;;
    field.appendChild(grass);
  }

  function makeVehicleEl(width, color, isTruck) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;vehicle&#x27;;
    el.style.width = width + &#x27;px&#x27;;
    el.style.height = VEH_H + &#x27;px&#x27;;
    el.style.background = color;
    var w = document.createElement(&#x27;div&#x27;);
    w.className = &#x27;win&#x27;;
    w.style.width = (isTruck ? width*0.28 : width*0.5) + &#x27;px&#x27;;
    w.style.left = (isTruck ? &#x27;6px&#x27; : (width*0.25)+&#x27;px&#x27;);
    el.appendChild(w);
    var w1 = document.createElement(&#x27;div&#x27;); w1.className=&#x27;wheel&#x27;; w1.style.left=&#x27;8px&#x27;; el.appendChild(w1);
    var w2 = document.createElement(&#x27;div&#x27;); w2.className=&#x27;wheel&#x27;; w2.style.right=&#x27;8px&#x27;; el.appendChild(w2);
    if (isTruck) { var w3=document.createElement(&#x27;div&#x27;); w3.className=&#x27;wheel&#x27;; w3.style.left=(width*0.5)+&#x27;px&#x27;; el.appendChild(w3); }
    return el;
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.vehicles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    var mult = speedMult();
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - VEH_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = (0.6 + (i % 4) * 0.35) * mult;
      var isTruck = (i % 3 === 0);
      var vehicles = [];
      var count = isTruck ? 2 : 3;
      var vw = isTruck ? CELL * 2.2 : CELL * 1.3;
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var color = isTruck ? TRUCK_COLORS[(i+j)%TRUCK_COLORS.length] : CAR_COLORS[(i+j)%CAR_COLORS.length];
        var x = j * gap + (i * 37) % gap;
        var el = makeVehicleEl(vw, color, isTruck);
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.style.transform = dir &lt; 0 ? &#x27;scaleX(-1)&#x27; : &#x27;none&#x27;;
        field.appendChild(el);
        vehicles.push({ x: x, w: vw, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, w: vw, vehicles: vehicles });
    }
  }

  function clearPowerups() {
    powerups.forEach(function(p){ if(p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    powerups = [];
  }

  function spawnPowerup() {
    var laneIdx = 1 + Math.floor(Math.random() * (LANES - 1));
    var row = laneIdx + 1;
    var col = Math.floor(Math.random() * COLS);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.textContent = &#x27;❄️&#x27;;
    var x = col * CELL + (CELL - 30) / 2;
    var y = row * CELL + (CELL - 30) / 2;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    powerups.push({ row: row, col: col, el: el });
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🦆&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function makeGuard() {
    if (guardEl &amp;&amp; guardEl.parentNode) guardEl.parentNode.removeChild(guardEl);
    guardEl = document.createElement(&#x27;div&#x27;);
    guardEl.className = &#x27;guard&#x27;;
    guardEl.textContent = &#x27;👮&#x27;;
    guardEl.style.width = GUARD_SIZE + &#x27;px&#x27;;
    guardEl.style.height = GUARD_SIZE + &#x27;px&#x27;;
    field.appendChild(guardEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function paintGuard() {
    var x = guard.col * CELL + (CELL - GUARD_SIZE) / 2;
    var y = guard.row * CELL + (CELL - GUARD_SIZE) / 2;
    guardEl.style.left = x + &#x27;px&#x27;;
    guardEl.style.top = y + &#x27;px&#x27;;
    // Red stop-strip in the guard&#x27;s lane (only when on the road)
    if (guard.row &gt;= 1 &amp;&amp; guard.row &lt;= LANES) {
      guardStopEl.style.display = &#x27;block&#x27;;
      guardStopEl.style.top = (guard.row * CELL) + &#x27;px&#x27;;
      guardStopEl.style.height = CELL + &#x27;px&#x27;;
    } else {
      guardStopEl.style.display = &#x27;none&#x27;;
    }
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function resetGuard() {
    guard.col = Math.floor(Math.random() * COLS);
    guard.row = 2 + Math.floor(Math.random() * (LANES - 2)); // middle-ish road lane
    guard.active = false;
    paintGuard();
  }

  function makeFrozenTint() {
    frozenTintEl = document.createElement(&#x27;div&#x27;);
    frozenTintEl.className = &#x27;frozen-tint&#x27;;
    frozenTintEl.style.display = &#x27;none&#x27;;
    field.appendChild(frozenTintEl);
    guardStopEl = document.createElement(&#x27;div&#x27;);
    guardStopEl.className = &#x27;guardstop&#x27;;
    guardStopEl.style.display = &#x27;none&#x27;;
    field.appendChild(guardStopEl);
  }

  function updateGuard() {
    var dist = Math.abs(guard.col - hero.col) + Math.abs(guard.row - hero.row);
    guard.active = dist &lt;= GUARD_DETECT;
    if (now() - lastGuardStep &lt; guardStepMs()) return;
    lastGuardStep = now();
    if (guard.active) {
      // Step one cell toward the duck; prioritize the larger gap.
      var dc = hero.col - guard.col;
      var dr = hero.row - guard.row;
      if (Math.abs(dc) &gt;= Math.abs(dr)) {
        guard.col += dc &gt; 0 ? 1 : (dc &lt; 0 ? -1 : 0);
      } else {
        guard.row += dr &gt; 0 ? 1 : (dr &lt; 0 ? -1 : 0);
      }
    } else {
      // Idle patrol: wander sideways, stay on road.
      if (Math.random() &lt; 0.7) {
        guard.col += Math.random() &lt; 0.5 ? -1 : 1;
      } else {
        guard.row += Math.random() &lt; 0.5 ? -1 : 1;
      }
      guard.row = Math.max(1, Math.min(LANES, guard.row));
    }
    guard.col = Math.max(0, Math.min(COLS - 1, guard.col));
    guard.row = Math.max(0, Math.min(ROWS - 1, guard.row));
    paintGuard();
  }

  function tick() {
    if (!running) return;
    var frozen = isFrozen();
    frozenTintEl.style.display = frozen ? &#x27;block&#x27; : &#x27;none&#x27;;
    freezeEl.textContent = frozen ? &#x27;❄️ FROZEN &#x27; + Math.ceil((freezeUntil-now())/1000) + &#x27;s&#x27; : &#x27;&#x27;;

    updateGuard();

    if (!frozen) {
      for (var i = 0; i &lt; lanes.length; i++) {
        var lane = lanes[i];
        // Cars stop entirely in the guard&#x27;s lane.
        if ((i + 1) === guard.row) continue;
        for (var j = 0; j &lt; lane.vehicles.length; j++) {
          var o = lane.vehicles[j];
          o.x += lane.dir * lane.speed;
          if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -o.w;
          else if (lane.dir &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = FIELD_W;
          o.el.style.left = o.x + &#x27;px&#x27;;
        }
      }
    }

    // Guard catches duck?
    if (guard.col === hero.col &amp;&amp; guard.row === hero.row) {
      endGame(&#x27;👮 Caught!&#x27;, &#x27;The traffic guard nabbed you at level &#x27; + level + &#x27;.&#x27;);
      return;
    }

    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      if (powerups[p].row === hero.row &amp;&amp; powerups[p].col === hero.col) {
        if (powerups[p].el.parentNode) powerups[p].el.parentNode.removeChild(powerups[p].el);
        powerups.splice(p, 1);
        freezeUntil = now() + 4000;
      }
    }

    if (!frozen) {
      var laneIdx = hero.row - 1;
      // Only collide with cars if not in the guard&#x27;s (stopped) lane.
      if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES &amp;&amp; hero.row !== guard.row) {
        var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
        var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
        var lane2 = lanes[laneIdx];
        for (var k = 0; k &lt; lane2.vehicles.length; k++) {
          var o2 = lane2.vehicles[k];
          if (hx &lt; o2.x + o2.w - 4 &amp;&amp; hx + HERO_SIZE &gt; o2.x + 4 &amp;&amp;
              hy &lt; lane2.y + VEH_H &amp;&amp; hy + HERO_SIZE &gt; lane2.y) {
            endGame(&#x27;💥 Splat!&#x27;, &#x27;A car got you at level &#x27; + level + &#x27;.&#x27;);
            return;
          }
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function flashLevel() {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;levelflash&#x27;;
    f.textContent = &#x27;Level &#x27; + level + &#x27;!&#x27;;
    field.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 900);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    // Immediate catch check on the duck&#x27;s own move.
    if (guard.col === hero.col &amp;&amp; guard.row === hero.row) {
      endGame(&#x27;👮 Caught!&#x27;, &#x27;The traffic guard nabbed you at level &#x27; + level + &#x27;.&#x27;);
      return;
    }
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      level += 1;
      levelEl.textContent = level;
      buildLanes();
      makeFrozenTint();
      field.appendChild(guardEl);
      field.appendChild(heroEl);
      flashLevel();
      resetGuard();
      if (Math.random() &lt; 0.6) spawnPowerup();
      resetHero();
    }
  }

  function showBanner(title, sub) {
    if (bannerEl &amp;&amp; bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement(&#x27;div&#x27;);
    bannerEl.className = &#x27;banner&#x27;;
    bannerEl.innerHTML = title + &#x27;&lt;small&gt;&#x27; + sub + &#x27;&lt;/small&gt;&#x27;;
    field.appendChild(bannerEl);
  }

  function endGame(title, sub) {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    frozenTintEl.style.display = &#x27;none&#x27;;
    freezeEl.textContent = &#x27;&#x27;;
    showBanner(title || &#x27;💥 Splat!&#x27;, sub || (&#x27;Reached level &#x27; + level + &#x27;. Press Start to try again.&#x27;));
  }

  function startGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    score = 0;
    level = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    levelEl.textContent = &#x27;1&#x27;;
    freezeUntil = 0;
    freezeEl.textContent = &#x27;&#x27;;
    lastGuardStep = 0;
    field.innerHTML = &#x27;&#x27;;
    buildScenery();
    buildLanes();
    clearPowerups();
    spawnPowerup();
    spawnPowerup();
    makeFrozenTint();
    makeGuard();
    makeHero();
    resetGuard();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  buildScenery();
  buildLanes();
  makeFrozenTint();
  makeGuard();
  makeHero();
  resetGuard();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
