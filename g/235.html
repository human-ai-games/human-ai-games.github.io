&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;), ovTitle = document.getElementById(&#x27;ovTitle&#x27;), ovMsg = document.getElementById(&#x27;ovMsg&#x27;);
var elLvl=document.getElementById(&#x27;lvl&#x27;), elCoins=document.getElementById(&#x27;coins&#x27;), elTime=document.getElementById(&#x27;time&#x27;),
    elScore=document.getElementById(&#x27;score&#x27;), elCombo=document.getElementById(&#x27;combo&#x27;), bar=document.getElementById(&#x27;bar&#x27;);
var muteBtn=document.getElementById(&#x27;mute&#x27;);

var COLS=15, ROWS=10, TILE=40;
cv.width=COLS*TILE; cv.height=ROWS*TILE;

/* ---------- audio ---------- */
var actx=null, soundOn=true;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ actx=null; } } return actx; }
function beep(freq,dur,type,vol){
  if(!soundOn) return;
  var a=ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }catch(_){}
}
function sfxCoin(n){ beep(660+ (n||0)*60, 0.12,&#x27;triangle&#x27;,0.12); }
function sfxPower(){ beep(880,0.18,&#x27;square&#x27;,0.1); setTimeout(function(){beep(1180,0.18,&#x27;square&#x27;,0.1);},70); }
function sfxTrap(){ beep(140,0.25,&#x27;sawtooth&#x27;,0.14); }
function sfxWin(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){beep(f,0.16,&#x27;triangle&#x27;,0.12);}, i*90); }); }
function sfxLose(){ [440,330,220,140].forEach(function(f,i){ setTimeout(function(){beep(f,0.22,&#x27;sawtooth&#x27;,0.13);}, i*110); }); }
function sfxBonus(){ [784,988,1319].forEach(function(f,i){ setTimeout(function(){beep(f,0.2,&#x27;square&#x27;,0.1);}, i*80); }); }
function sfxStep(){ beep(220,0.04,&#x27;sine&#x27;,0.04); }

muteBtn.addEventListener(&#x27;click&#x27;, function(){
  soundOn=!soundOn;
  muteBtn.textContent = soundOn ? &#x27;🔊 Sound&#x27; : &#x27;🔇 Muted&#x27;;
  if(soundOn &amp;&amp; actx &amp;&amp; actx.state===&#x27;suspended&#x27;){ try{actx.resume();}catch(_){} }
});

/* ---------- state ---------- */
var running=false, rafId=null, lastTs=0;
var level=1, score=0, coinsThisLevel=0, difficulty=&#x27;easy&#x27;;
var timeLeft=0, timeTotal=1;
var grid=[], enemies=[], coins=[], specials=[], secrets=[];
var exitPos={x:0,y:0};
var player={x:1,y:1,px:1,py:1};
var moveCooldown=0, baseInterval=0.11, speedBoost=0, shield=0, wallBlast=0;
var pendingDir=null;
var combo=1, comboTimer=0;
var particles=[];
var inBonus=false, bonusReturn=null;

var DIFF={
  easy:   {enBase:1, enPer:0.4, enSpeed:1.3, trapBase:2, trapPer:0.5, timeMul:1.25},
  normal: {enBase:2, enPer:0.6, enSpeed:1.7, trapBase:3, trapPer:0.7, timeMul:1.0},
  hard:   {enBase:3, enPer:0.8, enSpeed:2.1, trapBase:4, trapPer:0.9, timeMul:0.8}
};

function idx(x,y){ return y*COLS+x; }
function cellAt(x,y){ if(x&lt;0||y&lt;0||x&gt;=COLS||y&gt;=ROWS) return 0; return grid[idx(x,y)]; }

function genMaze(){
  grid=new Array(COLS*ROWS).fill(0);
  var stack=[]; grid[idx(1,1)]=1; stack.push({x:1,y:1});
  var dirs=[{x:0,y:-2},{x:0,y:2},{x:-2,y:0},{x:2,y:0}];
  while(stack.length){
    var c=stack[stack.length-1], opts=[];
    for(var i=0;i&lt;dirs.length;i++){ var nx=c.x+dirs[i].x, ny=c.y+dirs[i].y;
      if(nx&gt;0&amp;&amp;ny&gt;0&amp;&amp;nx&lt;COLS-1&amp;&amp;ny&lt;ROWS-1&amp;&amp;grid[idx(nx,ny)]===0) opts.push(dirs[i]); }
    if(opts.length){ var d=opts[Math.floor(Math.random()*opts.length)];
      grid[idx(c.x+d.x/2,c.y+d.y/2)]=1; grid[idx(c.x+d.x,c.y+d.y)]=1;
      stack.push({x:c.x+d.x,y:c.y+d.y}); }
    else stack.pop();
  }
  for(var k=0;k&lt;20;k++){ var rx=1+Math.floor(Math.random()*(COLS-2)), ry=1+Math.floor(Math.random()*(ROWS-2)); grid[idx(rx,ry)]=1; }
}

function floorCells(){ var arr=[]; for(var y=0;y&lt;ROWS;y++)for(var x=0;x&lt;COLS;x++) if(grid[idx(x,y)]===1) arr.push({x:x,y:y}); return arr; }
function farFrom(cells,fx,fy){ var best=null,bd=-1; for(var i=0;i&lt;cells.length;i++){ var d=Math.abs(cells[i].x-fx)+Math.abs(cells[i].y-fy); if(d&gt;bd){bd=d;best=cells[i];} } return best; }

function bfsNext(sx,sy,tx,ty){
  if(sx===tx&amp;&amp;sy===ty) return null;
  var prev=new Array(COLS*ROWS).fill(-1);
  var q=[idx(sx,sy)]; prev[idx(sx,sy)]=idx(sx,sy);
  var d=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){
    var cur=q.shift(), cx=cur%COLS, cy=Math.floor(cur/COLS);
    if(cx===tx&amp;&amp;cy===ty) break;
    for(var i=0;i&lt;4;i++){ var nx=cx+d[i][0], ny=cy+d[i][1];
      if(nx&lt;0||ny&lt;0||nx&gt;=COLS||ny&gt;=ROWS) continue;
      if(cellAt(nx,ny)===0) continue;
      var ni=idx(nx,ny); if(prev[ni]!==-1) continue;
      prev[ni]=cur; q.push(ni);
    }
  }
  var goal=idx(tx,ty); if(prev[goal]===-1) return null;
  var cur=goal;
  while(prev[cur]!==idx(sx,sy) &amp;&amp; prev[cur]!==cur) cur=prev[cur];
  return {x:cur%COLS, y:Math.floor(cur/COLS)};
}

function buildLevel(){
  genMaze();
  var cells=floorCells();
  exitPos=farFrom(cells,1,1);
  player={x:1,y:1,px:1,py:1};
  pendingDir=null; speedBoost=0; inBonus=false; bonusReturn=null;
  combo=1; comboTimer=0;

  function taken(x,y){
    if(x===1&amp;&amp;y===1) return true;
    if(x===exitPos.x&amp;&amp;y===exitPos.y) return true;
    for(var i=0;i&lt;coins.length;i++) if(coins[i].x===x&amp;&amp;coins[i].y===y) return true;
    for(var i=0;i&lt;specials.length;i++) if(specials[i].x===x&amp;&amp;specials[i].y===y) return true;
    for(var i=0;i&lt;secrets.length;i++) if(secrets[i].x===x&amp;&amp;secrets[i].y===y) return true;
    for(var i=0;i&lt;enemies.length;i++) if(Math.round(enemies[i].x)===x&amp;&amp;Math.round(enemies[i].y)===y) return true;
    return false;
  }
  function pick(){ for(var t=0;t&lt;300;t++){ var c=cells[Math.floor(Math.random()*cells.length)]; if(!taken(c.x,c.y)) return {x:c.x,y:c.y}; } return null; }

  coins=[]; specials=[]; enemies=[]; secrets=[]; particles=[];
  var cfg=DIFF[difficulty];

  var coinCount=6+Math.min(level,8);
  for(var i=0;i&lt;coinCount;i++){ var p=pick(); if(p) coins.push(p); }

  var kinds=[&#x27;speed&#x27;,&#x27;time&#x27;,&#x27;tp&#x27;,&#x27;shield&#x27;,&#x27;blast&#x27;];
  for(var i=0;i&lt;3+Math.min(level,2);i++){ var p=pick(); if(p){ p.kind=kinds[Math.floor(Math.random()*kinds.length)]; specials.push(p);} }

  var trapCount=cfg.trapBase+Math.floor(level*cfg.trapPer);
  for(var i=0;i&lt;trapCount;i++){ var p=pick(); if(p) grid[idx(p.x,p.y)]=2; }

  var enCount=Math.round(cfg.enBase+level*cfg.enPer);
  for(var i=0;i&lt;enCount;i++){ var p=pick(); if(p) enemies.push({x:p.x,y:p.y,tx:p.x,ty:p.y,speed:cfg.enSpeed+level*0.12,moving:false}); }

  var s=pick(); if(s){ s.opened=false; secrets.push(s); }

  coinsThisLevel=coins.length;
  timeTotal=(18+coins.length*0.7 - Math.min(level*1.0,6))*cfg.timeMul;
  if(timeTotal&lt;11) timeTotal=11;
  timeLeft=timeTotal;
}

function enterBonus(){
  inBonus=true;
  bonusReturn={coins:coins.slice(), specials:specials.slice(), enemies:enemies, grid:grid.slice(),
    exit:exitPos, player:{x:player.x,y:player.y}, secrets:secrets, timeLeft:timeLeft};
  grid=new Array(COLS*ROWS).fill(0);
  for(var y=2;y&lt;ROWS-2;y++)for(var x=2;x&lt;COLS-2;x++) grid[idx(x,y)]=1;
  coins=[]; specials=[]; enemies=[]; secrets=[]; particles=[];
  for(var y=3;y&lt;ROWS-3;y++)for(var x=3;x&lt;COLS-3;x+=2) coins.push({x:x,y:y,bonus:true});
  player={x:2,y:2,px:2,py:2}; grid[idx(2,2)]=1;
  exitPos={x:COLS-3,y:ROWS-3}; grid[idx(exitPos.x,exitPos.y)]=1;
  coinsThisLevel=coins.length;
  sfxBonus();
}
function exitBonus(){
  var r=bonusReturn; inBonus=false;
  coins=r.coins; specials=r.specials; enemies=r.enemies; grid=r.grid;
  exitPos=r.exit; player={x:r.player.x,y:r.player.y,px:r.player.x,py:r.player.y};
  secrets=r.secrets; timeLeft=r.timeLeft; coinsThisLevel=coins.length;
  bonusReturn=null;
}

function neighborsFloor(x,y){ var r=[],d=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i&lt;4;i++){ var nx=x+d[i][0],ny=y+d[i][1]; if(cellAt(nx,ny)!==0) r.push({x:nx,y:ny}); } return r; }

function updateEnemy(e,dt){
  if(shield&gt;0) return;
  if(!e.moving){
    var next=bfsNext(Math.round(e.x),Math.round(e.y),player.x,player.y);
    if(next &amp;&amp; Math.random()&lt;0.85){ e.tx=next.x; e.ty=next.y; e.moving=true; }
    else { var opts=neighborsFloor(Math.round(e.x),Math.round(e.y)); if(opts.length){ var o=opts[Math.floor(Math.random()*opts.length)]; e.tx=o.x; e.ty=o.y; e.moving=true; } }
  }
  var dx=e.tx-e.x, dy=e.ty-e.y, dist=Math.hypot(dx,dy), step=e.speed*dt;
  if(dist&lt;=step){ e.x=e.tx; e.y=e.ty; e.moving=false; }
  else { e.x+=dx/dist*step; e.y+=dy/dist*step; }
}

function spawnParticles(x,y,color,n){
  for(var i=0;i&lt;n;i++){ var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5,color:color}); }
}

function tryMove(dx,dy){
  var nx=player.x+dx, ny=player.y+dy;
  if(cellAt(nx,ny)===0){
    if(wallBlast&gt;0 &amp;&amp; nx&gt;0&amp;&amp;ny&gt;0&amp;&amp;nx&lt;COLS-1&amp;&amp;ny&lt;ROWS-1){ grid[idx(nx,ny)]=1; wallBlast--; spawnParticles(nx*TILE+TILE/2,ny*TILE+TILE/2,&#x27;#ff9d5d&#x27;,10); sfxPower(); }
    else return;
  } else { sfxStep(); }
  player.x=nx; player.y=ny;
  var pcx=nx*TILE+TILE/2, pcy=ny*TILE+TILE/2;
  for(var i=coins.length-1;i&gt;=0;i--){
    if(coins[i].x===nx&amp;&amp;coins[i].y===ny){
      var b=coins[i].bonus?2:1;
      score+=Math.round(10*combo*b);
      comboTimer=1.6; combo=Math.min(combo+1,9);
      sfxCoin(Math.min(combo,8)); spawnParticles(pcx,pcy,&#x27;#ffd35d&#x27;,7);
      coins.splice(i,1);
    }
  }
  for(var i=specials.length-1;i&gt;=0;i--){
    if(specials[i].x===nx&amp;&amp;specials[i].y===ny){
      var k=specials[i].kind; specials.splice(i,1); sfxPower(); spawnParticles(pcx,pcy,&#x27;#fff&#x27;,10);
      if(k===&#x27;speed&#x27;) speedBoost=4;
      else if(k===&#x27;time&#x27;){ timeLeft+=5; timeTotal=Math.max(timeTotal,timeLeft); }
      else if(k===&#x27;tp&#x27;){ var cells=floorCells(); for(var t=0;t&lt;50;t++){ var c=cells[Math.floor(Math.random()*cells.length)]; if(cellAt(c.x,c.y)===1){ player.x=c.x; player.y=c.y; break; } } }
      else if(k===&#x27;shield&#x27;) shield=4;
      else if(k===&#x27;blast&#x27;) wallBlast=3;
    }
  }
  for(var i=secrets.length-1;i&gt;=0;i--){
    if(secrets[i].x===nx&amp;&amp;secrets[i].y===ny &amp;&amp; !inBonus){ enterBonus(); return; }
  }
  if(!inBonus &amp;&amp; cellAt(player.x,player.y)===2){ score=Math.max(0,score-15); timeLeft-=3; combo=1; grid[idx(player.x,player.y)]=1; sfxTrap(); spawnParticles(pcx,pcy,&#x27;#888&#x27;,8); }
  if(player.x===exitPos.x&amp;&amp;player.y===exitPos.y){
    if(inBonus){ exitBonus(); }
    else nextLevel();
  }
}

function nextLevel(){
  score+=50+Math.floor(timeLeft*3);
  sfxWin(); level++; buildLevel();
}

function endGame(){
  running=false; if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  sfxLose();
  overlay.classList.remove(&#x27;hidden&#x27;);
  ovTitle.textContent=&#x27;Game Over&#x27;;
  ovMsg.textContent=&#x27;Final Score: &#x27;+score+&#x27;  •  Level &#x27;+level+&#x27; (&#x27;+difficulty+&#x27;). Press Start to try again.&#x27;;
}

function update(dt){
  moveCooldown-=dt;
  if(speedBoost&gt;0) speedBoost-=dt;
  if(shield&gt;0) shield-=dt;
  if(comboTimer&gt;0){ comboTimer-=dt; if(comboTimer&lt;=0) combo=1; }

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  ctx.fillText(&#x27;▶&#x27;,ex+TILE/2,ey+TILE/2);

  var ssym={speed:&#x27;»&#x27;,time:&#x27;+&#x27;,tp:&#x27;✦&#x27;,shield:&#x27;◆&#x27;,blast:&#x27;✸&#x27;};

  elLvl.textContent=level; elCoins.textContent=(coinsThisLevel-coins.length);
  elTime.textContent=timeLeft.toFixed(1); elScore.textContent=score; elCombo.textContent=&#x27;x&#x27;+combo;

}
