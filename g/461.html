<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>LASER PADDLE</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #d8e6ff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; color: #4df2ff; text-shadow: 0 0 12px #0ff; letter-spacing: 2px; }
  .instructions { font-size: 16px; color: #8fb0d8; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 26px; align-items: center; }
  .score { font-size: 22px; color: #b6ff6b; margin: 0; text-shadow: 0 0 8px #6f3; }
  .speed { font-size: 20px; color: #ffb14d; margin: 0; text-shadow: 0 0 8px #a60; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: radial-gradient(circle at 50% 120%, #101a3a, #05060f 70%); border: 1px solid #1e3a6b; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 40px #08122e; }
  .paddle { position: absolute; width: 100px; height: 14px; background: linear-gradient(#7cf, #29f); border-radius: 4px; bottom: 10px; box-shadow: 0 0 14px #4df2ff, 0 0 4px #fff; }
  .cannon { position: absolute; width: 14px; height: 10px; background: #b6ff6b; border-radius: 3px 3px 0 0; box-shadow: 0 0 10px #b6ff6b; }
  .ball { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #ff5bd0 60%, #a0128a); box-shadow: 0 0 18px #ff5bd0, 0 0 6px #fff; }
  .laser { position: absolute; width: 4px; height: 18px; background: linear-gradient(#fff, #b6ff6b); border-radius: 2px; box-shadow: 0 0 10px #b6ff6b, 0 0 4px #fff; }
  .particle { position: absolute; border-radius: 50%; pointer-events: none; }
  .flash { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, #fff, rgba(255,255,255,0) 70%); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;LASER PADDLE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt;, fire lasers with &lt;strong&gt;Space&lt;/strong&gt;, and change the orb&#x27;s speed with &lt;strong&gt;&amp;uarr; &amp;darr;&lt;/strong&gt;. Bouncing scores 1 point and a direct laser hit scores 5 — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;speed&quot;&gt;Speed: &lt;span id=&quot;speed&quot;&gt;4.0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cannon&quot; id=&quot;cannon&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 18;
  var MIN_SPEED = 1.5, MAX_SPEED = 10, SPEED_STEP = 0.5;
  var ballSpeed = 4.0;
  var LASER_SPEED = 9, LASER_W = 4, LASER_H = 18, FIRE_COOLDOWN = 14;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = ballSpeed, ballVY = ballSpeed;
  var score = 0;
  var lasers = [];
  var particles = [];
  var cooldown = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var cannon = document.getElementById(&#x27;cannon&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);

  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = 0.08;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function boom(dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = &#x27;sawtooth&#x27;;
      o.frequency.setValueAtTime(320, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + dur);
      g.gain.value = 0.14;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function updateSpeedDisplay() { speedEl.textContent = ballSpeed.toFixed(1); }

  function applySpeed() {
    // preserve direction, set magnitude to ballSpeed on each axis
    var sx = ballVX &lt; 0 ? -1 : 1;
    var sy = ballVY &lt; 0 ? -1 : 1;
    ballVX = sx * ballSpeed;
    ballVY = sy * ballSpeed;
  }

  function changeSpeed(delta) {
    ballSpeed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, ballSpeed + delta));
    ballSpeed = Math.round(ballSpeed * 10) / 10;
    applySpeed();
    updateSpeedDisplay();
    beep(delta &gt; 0 ? 660 : 330, 0.05, &#x27;sine&#x27;);
  }

  function explode(cx, cy, count, colors, big) {
    var flash = document.createElement(&#x27;div&#x27;);
    flash.className = &#x27;flash&#x27;;
    var fsize = big ? 90 : 50;
    flash.style.width = fsize + &#x27;px&#x27;;
    flash.style.height = fsize + &#x27;px&#x27;;
    flash.style.left = (cx - fsize / 2) + &#x27;px&#x27;;
    flash.style.top = (cy - fsize / 2) + &#x27;px&#x27;;
    field.appendChild(flash);
    particles.push({ flash: true, el: flash, life: 10, maxLife: 10 });

    for (var i = 0; i &lt; count; i++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;particle&#x27;;
      var sz = (big ? 5 : 3) + Math.random() * (big ? 5 : 3);
      el.style.width = sz + &#x27;px&#x27;;
      el.style.height = sz + &#x27;px&#x27;;
      var col = colors[Math.floor(Math.random() * colors.length)];
      el.style.background = col;
      el.style.boxShadow = &#x27;0 0 8px &#x27; + col;
      el.style.left = cx + &#x27;px&#x27;;
      el.style.top = cy + &#x27;px&#x27;;
      field.appendChild(el);
      var ang = Math.random() * Math.PI * 2;
      var spd = (big ? 3 : 2) + Math.random() * (big ? 5 : 3);
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 24 + Math.random() * 12,
        maxLife: 36,
        el: el
      });
    }
  }

  function updateParticles() {
    for (var i = particles.length - 1; i &gt;= 0; i--) {
      var p = particles[i];
      p.life--;
      if (p.flash) {
        var t = p.life / p.maxLife;
        p.el.style.opacity = t;
        p.el.style.transform = &#x27;scale(&#x27; + (1.6 - t) + &#x27;)&#x27;;
        if (p.life &lt;= 0) { if (p.el.parentNode) field.removeChild(p.el); particles.splice(i, 1); }
        continue;
      }
      p.vy += 0.12;
      p.vx *= 0.97;
      p.x += p.vx;
      p.y += p.vy;
      p.el.style.left = p.x + &#x27;px&#x27;;
      p.el.style.top = p.y + &#x27;px&#x27;;
      p.el.style.opacity = Math.max(0, p.life / p.maxLife);
      if (p.life &lt;= 0) { if (p.el.parentNode) field.removeChild(p.el); particles.splice(i, 1); }
    }
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    cannon.style.left = (paddleX + PADDLE_W / 2 - 7) + &#x27;px&#x27;;
    cannon.style.bottom = (PADDLE_BOTTOM + PADDLE_H) + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * ballSpeed;
    ballVY = ballSpeed;
  }

  function fire() {
    if (cooldown &gt; 0) return;
    cooldown = FIRE_COOLDOWN;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;laser&#x27;;
    var lx = paddleX + PADDLE_W / 2 - LASER_W / 2;
    var ly = FIELD_H - PADDLE_BOTTOM - PADDLE_H - LASER_H;
    el.style.left = lx + &#x27;px&#x27;;
    el.style.top = ly + &#x27;px&#x27;;
    field.appendChild(el);
    lasers.push({ x: lx, y: ly, el: el });
    beep(880, 0.08, &#x27;square&#x27;);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    if (cooldown &gt; 0) cooldown--;
    if (keysDown[&#x27; &#x27;]) fire();

    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
      beep(440, 0.06, &#x27;triangle&#x27;);
      explode(ballX + BALL_SIZE / 2, ballY + BALL_SIZE, 10, [&#x27;#4df2ff&#x27;, &#x27;#7cf&#x27;, &#x27;#fff&#x27;], false);
    }
    if (ballY &gt;= FIELD_H) resetBall();

    for (var i = lasers.length - 1; i &gt;= 0; i--) {
      var L = lasers[i];
      L.y -= LASER_SPEED;
      var bcx = ballX + BALL_SIZE / 2, bcy = ballY + BALL_SIZE / 2;
      var lcx = L.x + LASER_W / 2, lcy = L.y + LASER_H / 2;
      var dx = bcx - lcx, dy = bcy - lcy;
      if (Math.sqrt(dx * dx + dy * dy) &lt; BALL_SIZE / 2 + 8) {
        score += 5;
        scoreEl.textContent = score;
        boom(0.35);
        explode(bcx, bcy, 26, [&#x27;#ff5bd0&#x27;, &#x27;#ffb14d&#x27;, &#x27;#fff&#x27;, &#x27;#ffe14d&#x27;], true);
        field.removeChild(L.el);
        lasers.splice(i, 1);
        resetBall();
        continue;
      }
      if (L.y + LASER_H &lt; 0) {
        field.removeChild(L.el);
        lasers.splice(i, 1);
        continue;
      }
      L.el.style.top = L.y + &#x27;px&#x27;;
    }

    updateParticles();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function clearLasers() {
    for (var i = 0; i &lt; lasers.length; i++) {
      if (lasers[i].el.parentNode) field.removeChild(lasers[i].el);
    }
    lasers = [];
  }
  function clearParticles() {
    for (var i = 0; i &lt; particles.length; i++) {
      if (particles[i].el.parentNode) field.removeChild(particles[i].el);
    }
    particles = [];
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    ballSpeed = 4.0;
    updateSpeedDisplay();
    paddleX = (FIELD_W - PADDLE_W) / 2;
    cooldown = 0;
    for (var k in keysDown) keysDown[k] = false;
    clearLasers();
    clearParticles();
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27; &#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27;ArrowUp&#x27;) {
      if (running) changeSpeed(SPEED_STEP);
      e.preventDefault();
    } else if (e.key === &#x27;ArrowDown&#x27;) {
      if (running) changeSpeed(-SPEED_STEP);
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27; &#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  updateSpeedDisplay();
  paint();
&lt;/script&gt;

<script>

  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
