  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }

  .ship { position: absolute; width: 30px; height: 24px; background: #555; border-radius: 4px; bottom: 12px; }
  .ship.powered { background: #2277dd; box-shadow: 0 0 10px rgba(34,119,221,0.8); }
  .bullet { position: absolute; width: 5px; height: 12px; background: #777; border-radius: 2px; }
  .bullet.power { background: #2277dd; }
  .target { position: absolute; width: 34px; height: 34px; background: #444; border-radius: 50%; }
  .ball { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #ffe680, #f5b400 60%, #b47b00); box-shadow: 0 0 8px rgba(245,180,0,0.7); }
  .powerup { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #bfe4ff, #2277dd 60%, #114488); box-shadow: 0 0 10px rgba(34,119,221,0.9); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to shoot. Dark targets are 1 point, gold balls 10; grab a blue power-up for 10 seconds of five-way rapid fire. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;powerlabel&quot; id=&quot;powerlabel&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 8;
  var TARGET_SIZE = 34, TARGET_SPEED = 1.8;
  var BALL_SIZE = 30, BALL_SPEED = 2.6;
  var POWERUP_SIZE = 30, POWERUP_SPEED = 2.2;
  var BALL_POINTS = 10;
  var FIRE_COOLDOWN = 150;      // ms base fire rate (faster)
  var POWER_FIRE_COOLDOWN = 90; // ms while powered
  var SPAWN_INTERVAL = 1200;  // ms
  var BALL_SPAWN_INTERVAL = 2600; // ms
  var POWERUP_SPAWN_INTERVAL = 9000; // ms
  var POWER_DURATION = 10000; // ms
  var running = false, animId = null, spawnId = null, ballSpawnId = null, powerupSpawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], balls = [], powerups = [];
  var score = 0;
  var lastShot = 0;
  var powerUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var powerLabel = document.getElementById(&#x27;powerlabel&#x27;);

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBall() {
    var b = { x: Math.random() * (FIELD_W - BALL_SIZE), y: -BALL_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ball&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    balls.push(b);
  }

  function spawnPowerup() {
    var p = { x: Math.random() * (FIELD_W - POWERUP_SIZE), y: -POWERUP_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
  }

  function makeBullet(x, vx, powered) {
    var b = { x: x, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, vx: vx || 0, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27; + (powered ? &#x27; power&#x27; : &#x27;&#x27;);
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function spawnBullet() {
    var now = Date.now();
    var powered = now &lt; powerUntil;
    var cooldown = powered ? POWER_FIRE_COOLDOWN : FIRE_COOLDOWN;
    if (now - lastShot &lt; cooldown) return;
    lastShot = now;
    var cx = shipX + SHIP_W / 2 - BULLET_W / 2;
    if (powered) {
      // Five-way spread
      makeBullet(cx, 0, true);
      makeBullet(cx, -1.8, true);
      makeBullet(cx, 1.8, true);
      makeBullet(cx, -3.6, true);
      makeBullet(cx, 3.6, true);
    } else {
      // Double shot
      makeBullet(cx - 5, 0, false);
      makeBullet(cx + 5, 0, false);
    }
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    // Auto-fire while space held
    if (keysDown[&#x27; &#x27;]) spawnBullet();

    var now = Date.now();
    if (now &lt; powerUntil) {
      ship.classList.add(&#x27;powered&#x27;);
      powerLabel.textContent = &#x27;RAPID FIRE: &#x27; + Math.ceil((powerUntil - now) / 1000) + &#x27;s&#x27;;
    } else {
      ship.classList.remove(&#x27;powered&#x27;);
      powerLabel.textContent = &#x27;&#x27;;
    }

    // Bullets up
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      b.x += b.vx;
      if (b.y + BULLET_H &lt; 0 || b.x &lt; -10 || b.x &gt; FIELD_W + 10) {
        field.removeChild(b.el);
        bullets.splice(i, 1);
        continue;
      }
      b.el.style.top = b.y + &#x27;px&#x27;;
      b.el.style.left = b.x + &#x27;px&#x27;;
    }
    // Targets down
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      if (t.y &gt; FIELD_H) {
        field.removeChild(t.el);
        targets.splice(j, 1);
        continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    // Balls down
    for (var k = balls.length - 1; k &gt;= 0; k--) {
      var bl = balls[k];
      bl.y += BALL_SPEED;
      if (bl.y &gt; FIELD_H) {
        field.removeChild(bl.el);
        balls.splice(k, 1);
        continue;
      }
      bl.el.style.top = bl.y + &#x27;px&#x27;;
    }
    // Powerups down
    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.y += POWERUP_SPEED;
      if (pu.y &gt; FIELD_H) {
        field.removeChild(pu.el);
        powerups.splice(p, 1);
        continue;
      }
      pu.el.style.top = pu.y + &#x27;px&#x27;;
    }
    // Collisions
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      var hit = false;
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += 1;
          scoreEl.textContent = score;
          hit = true;
          break;
        }
      }
      if (hit) continue;
      for (var k2 = balls.length - 1; k2 &gt;= 0; k2--) {
        var bl2 = balls[k2];
        if (b2.x &lt; bl2.x + BALL_SIZE &amp;&amp; b2.x + BULLET_W &gt; bl2.x &amp;&amp;
            b2.y &lt; bl2.y + BALL_SIZE &amp;&amp; b2.y + BULLET_H &gt; bl2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(bl2.el); balls.splice(k2, 1);
          score += BALL_POINTS;
          scoreEl.textContent = score;
          hit = true;
          break;
        }
      }
      if (hit) continue;
      for (var p2 = powerups.length - 1; p2 &gt;= 0; p2--) {
        var pu2 = powerups[p2];
        if (b2.x &lt; pu2.x + POWERUP_SIZE &amp;&amp; b2.x + BULLET_W &gt; pu2.x &amp;&amp;
            b2.y &lt; pu2.y + POWERUP_SIZE &amp;&amp; b2.y + BULLET_H &gt; pu2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(pu2.el); powerups.splice(p2, 1);
          powerUntil = Date.now() + POWER_DURATION;
          break;
        }
      }
    }
    // Ship can also grab powerups by touching them
    for (var p3 = powerups.length - 1; p3 &gt;= 0; p3--) {
      var pu3 = powerups[p3];
      var sy = FIELD_H - SHIP_BOTTOM - SHIP_H;
      if (shipX &lt; pu3.x + POWERUP_SIZE &amp;&amp; shipX + SHIP_W &gt; pu3.x &amp;&amp;
          sy &lt; pu3.y + POWERUP_SIZE &amp;&amp; sy + SHIP_H &gt; pu3.y) {
        field.removeChild(pu3.el); powerups.splice(p3, 1);
        powerUntil = Date.now() + POWER_DURATION;
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    balls.forEach(function (bl) { if (bl.el.parentNode) bl.el.parentNode.removeChild(bl.el); });
    powerups.forEach(function (pu) { if (pu.el.parentNode) pu.el.parentNode.removeChild(pu.el); });
    bullets = []; targets = []; balls = []; powerups = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    powerUntil = 0;
    ship.classList.remove(&#x27;powered&#x27;);
    powerLabel.textContent = &#x27;&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    spawnBall();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    ballSpawnId = setInterval(spawnBall, BALL_SPAWN_INTERVAL);
    powerupSpawnId = setInterval(spawnPowerup, POWERUP_SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (ballSpawnId) { clearInterval(ballSpawnId); ballSpawnId = null; }
    if (powerupSpawnId) { clearInterval(powerupSpawnId); powerupSpawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      keysDown[&#x27; &#x27;] = true;
      if (running) spawnBullet();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) keysDown[&#x27; &#x27;] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
