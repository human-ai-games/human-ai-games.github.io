<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship Duel</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Ship Duel</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 20px; }
  .hud .you { color: #d13b3b; font-weight: 600; }
  .hud .rival { color: #2a6fd6; font-weight: 600; }
  .hud .timer { color: #444; font-weight: 600; }
  .legend { font-size: 13px; color: #777; margin: 0; display: flex; gap: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { display: inline-block; }
  .dot.circle { width: 15px; height: 15px; border-radius: 50%; background: #2e8b57; }
  .dot.square { width: 14px; height: 14px; border-radius: 3px; background: #e08a1e; }
  .dot.diamond { width: 12px; height: 12px; background: #9b59b6; transform: rotate(45deg); }
  .field { position: relative; width: 620px; height: 380px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .ship { position: absolute; width: 30px; height: 24px; border-radius: 4px; bottom: 12px; }
  .ship.you { background: #d13b3b; }
  .ship.rival { background: #2a6fd6; }
  .bullet { position: absolute; width: 5px; height: 12px; border-radius: 2px; }
  .bullet.you { background: #d13b3b; }
  .bullet.rival { background: #2a6fd6; }
  .target { position: absolute; }
  .target.circle { border-radius: 50%; background: #2e8b57; }
  .target.square { border-radius: 5px; background: #e08a1e; }
  .target.diamond { background: #9b59b6; border-radius: 3px; }
  .banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.78); color: #fff; padding: 18px 30px; border-radius: 12px; font-size: 26px; font-weight: 700; text-align: center; display: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Ship Duel&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your red ship with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and tap &lt;strong&gt;Space&lt;/strong&gt; to fire — smaller targets are worth more. Beat the blue rival before the timer runs out! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;you&quot;&gt;You: &lt;span id=&quot;scoreYou&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;timer&quot;&gt;⏱ &lt;span id=&quot;timer&quot;&gt;45&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;rival&quot;&gt;Rival: &lt;span id=&quot;scoreRival&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;dot circle&quot;&gt;&lt;/span&gt; Circle = 1&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;dot square&quot;&gt;&lt;/span&gt; Square = 2&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;dot diamond&quot;&gt;&lt;/span&gt; Diamond = 3&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship you&quot; id=&quot;shipYou&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ship rival&quot; id=&quot;shipRival&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 380;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 7;
  var SPAWN_INTERVAL = 550;   // more targets
  var GAME_SECONDS = 45;
  var RIVAL_SPEED = 4.6, RIVAL_SHOT_MS = 260;

  var running = false, animId = null, spawnId = null, timerId = null;
  var timeLeft = GAME_SECONDS;
  var keysDown = {};
  var youX = FIELD_W * 0.7 - SHIP_W / 2;
  var rivalX = FIELD_W * 0.3 - SHIP_W / 2;
  var bullets = [], targets = [];
  var scoreYou = 0, scoreRival = 0;
  var lastShotYou = 0, lastShotRival = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var shipYouEl = document.getElementById(&#x27;shipYou&#x27;);
  var shipRivalEl = document.getElementById(&#x27;shipRival&#x27;);
  var scoreYouEl = document.getElementById(&#x27;scoreYou&#x27;);
  var scoreRivalEl = document.getElementById(&#x27;scoreRival&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);

  var TYPES = [
    { name: &#x27;circle&#x27;,  size: 40, speed: 1.4, points: 1 },
    { name: &#x27;square&#x27;,  size: 30, speed: 2.2, points: 2 },
    { name: &#x27;diamond&#x27;, size: 22, speed: 3.2, points: 3 }
  ];

  function paintShips() {
    shipYouEl.style.left = youX + &#x27;px&#x27;;
    shipRivalEl.style.left = rivalX + &#x27;px&#x27;;
  }

  function spawnTarget() {
    var type = TYPES[Math.floor(Math.random() * TYPES.length)];
    var t = {
      x: Math.random() * (FIELD_W - type.size),
      y: -type.size,
      size: type.size, speed: type.speed, points: type.points, el: null
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target &#x27; + type.name;
    el.style.width = type.size + &#x27;px&#x27;;
    el.style.height = type.size + &#x27;px&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    if (type.name === &#x27;diamond&#x27;) el.style.transform = &#x27;rotate(45deg)&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function fire(owner) {
    var now = Date.now();
    if (owner === &#x27;you&#x27;) {
      if (now - lastShotYou &lt; 90) return;
      lastShotYou = now;
    } else {
      if (now - lastShotRival &lt; RIVAL_SHOT_MS) return;
      lastShotRival = now;
    }
    var sx = (owner === &#x27;you&#x27; ? youX : rivalX);
    var b = { owner: owner, x: sx + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet &#x27; + owner;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  // Rival AI: pick the lowest target roughly in its zone, chase, shoot
  function rivalThink() {
    var best = null, bestY = -Infinity;
    for (var i = 0; i &lt; targets.length; i++) {
      var t = targets[i];
      if (t.y &gt; bestY) { bestY = t.y; best = t; }
    }
    var rivalCenter = rivalX + SHIP_W / 2;
    if (best) {
      var targetCenter = best.x + best.size / 2;
      if (targetCenter &lt; rivalCenter - 4) rivalX -= RIVAL_SPEED;
      else if (targetCenter &gt; rivalCenter + 4) rivalX += RIVAL_SPEED;
      if (Math.abs(targetCenter - (rivalX + SHIP_W / 2)) &lt; best.size / 2 + 6) fire(&#x27;rival&#x27;);
    }
    rivalX = Math.max(0, Math.min(FIELD_W - SHIP_W, rivalX));
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) youX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) youX += SHIP_SPEED;
    youX = Math.max(0, Math.min(FIELD_W - SHIP_W, youX));

    rivalThink();
    paintShips();

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) {
        field.removeChild(b.el); bullets.splice(i, 1); continue;
      }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += t.speed;
      if (t.y &gt; FIELD_H) {
        field.removeChild(t.el); targets.splice(j, 1); continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      var hit = false;
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + t2.size &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + t2.size &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          if (b2.owner === &#x27;you&#x27;) { scoreYou += t2.points; scoreYouEl.textContent = scoreYou; }
          else { scoreRival += t2.points; scoreRivalEl.textContent = scoreRival; }
          field.removeChild(t2.el); targets.splice(j2, 1);
          hit = true;
          break;
        }
      }
      if (hit) { field.removeChild(b2.el); bullets.splice(i2, 1); }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bullets = []; targets = [];
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    var msg;
    if (scoreYou &gt; scoreRival) msg = &#x27;You win! 🎉&lt;br&gt;&#x27; + scoreYou + &#x27; – &#x27; + scoreRival;
    else if (scoreRival &gt; scoreYou) msg = &#x27;Rival wins 😐&lt;br&gt;&#x27; + scoreYou + &#x27; – &#x27; + scoreRival;
    else msg = &#x27;It\&#x27;s a tie!&lt;br&gt;&#x27; + scoreYou + &#x27; – &#x27; + scoreRival;
    banner.innerHTML = msg;
    banner.style.display = &#x27;block&#x27;;
  }

  function startGame() {
    if (running) return;
    clearAll();
    banner.style.display = &#x27;none&#x27;;
    scoreYou = 0; scoreRival = 0;
    scoreYouEl.textContent = &#x27;0&#x27;; scoreRivalEl.textContent = &#x27;0&#x27;;
    timeLeft = GAME_SECONDS; timerEl.textContent = timeLeft;
    youX = FIELD_W * 0.7 - SHIP_W / 2;
    rivalX = FIELD_W * 0.3 - SHIP_W / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShotYou = 0; lastShotRival = 0;
    paintShips();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    timerId = setInterval(function () {
      timeLeft--;
      timerEl.textContent = Math.max(0, timeLeft);
      if (timeLeft &lt;= 0) endGame();
    }, 1000);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running &amp;&amp; !e.repeat) fire(&#x27;you&#x27;);
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShips();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
