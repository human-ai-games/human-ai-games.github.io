  .wrap { display: flex; flex-direction: column; align-items: center;

  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;

  .controls { margin-top: 14px; display: flex; gap: 10px; }

&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden;
           background: linear-gradient(#5fb4f5 0%, #8ecbff 45%, #bfe4ff 75%, #d8f0ff 100%); }

  .clouds { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .cloud { position: absolute; }

  .castle { position: absolute; bottom: 30px; left: 0; right: 0; height: 240px; }

  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px;
    background-color: #b5502f;
    background-image:
      linear-gradient(rgba(0,0,0,0.18) 2px, transparent 2px),
      linear-gradient(90deg, rgba(0,0,0,0.18) 2px, transparent 2px),
      linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
    background-size: 40px 15px, 40px 15px, 40px 15px;
    background-position: 0 0, 20px 0, 0 0;
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.18), inset 0 -4px 0 rgba(0,0,0,0.2);
  }

  .hero { position: absolute; width: 44px; height: 50px; z-index: 5; }

  .obstacle { position: absolute; bottom: 30px; z-index: 4; }
  .obstacle.golden { filter: drop-shadow(0 0 6px rgba(255,210,60,0.9)); }

  .popup { position: absolute; font-weight: 800; font-size: 22px; color: #ffcc22;
    text-shadow: 0 0 4px #b8860b, 0 2px 3px rgba(0,0,0,0.4); pointer-events: none; z-index: 6;
    animation: floatUp 0.9s ease-out forwards; }
  .popup.gold { font-size: 26px; color: #ffe14d; text-shadow: 0 0 6px #b8860b, 0 2px 3px rgba(0,0,0,0.5); }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.6); opacity: 1; }
    30% { transform: translateY(-14px) scale(1.2); opacity: 1; }
    100% { transform: translateY(-46px) scale(1); opacity: 0; }
  }

  .particle { position: absolute; pointer-events: none; z-index: 6; }
  .dust { position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(200,180,140,0.85); pointer-events: none; z-index: 3; }

    return { el: el, x: x, y: y, w: w, speed: 0.25 + Math.random() * 0.35 };
  }

    clouds.forEach(function (c) { if (c.el.parentNode) c.el.parentNode.removeChild(c.el); });

    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
