&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✨ Falling Blocks ✨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and drop faster with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Clear rows to score — the pieces speed up as your level rises. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;stats&quot;&gt;
      &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var BASE_MS = 550;
  var MIN_MS = 90;
  var LINES_PER_LEVEL = 4;
  var running = false, dropId = null;
  var grid = [];
  var piece = null, nextType = null;
  var score = 0, lines = 0, level = 1;
  var field = document.getElementById(&#x27;field&#x27;);
  var preview = document.getElementById(&#x27;preview&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);

  // Each shape now carries two colors for a vivid gradient + glow tint.
  var SHAPES = {
    I: { c1:&#x27;#5eead4&#x27;, c2:&#x27;#0891b2&#x27;, glow:&#x27;#22d3ee&#x27;, rot: [
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:3,y:1}],
      [{x:2,y:0},{x:2,y:1},{x:2,y:2},{x:2,y:3}]
    ]},
    O: { c1:&#x27;#fde68a&#x27;, c2:&#x27;#f59e0b&#x27;, glow:&#x27;#fbbf24&#x27;, rot: [
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:2,y:1}]
    ]},
    T: { c1:&#x27;#e9d5ff&#x27;, c2:&#x27;#9333ea&#x27;, glow:&#x27;#c084fc&#x27;, rot: [
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:2}]
    ]},
    S: { c1:&#x27;#bbf7d0&#x27;, c2:&#x27;#16a34a&#x27;, glow:&#x27;#4ade80&#x27;, rot: [
      [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:2,y:2}]
    ]},
    Z: { c1:&#x27;#fecaca&#x27;, c2:&#x27;#dc2626&#x27;, glow:&#x27;#f87171&#x27;, rot: [
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}],
      [{x:2,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}]
    ]},
    L: { c1:&#x27;#fed7aa&#x27;, c2:&#x27;#ea580c&#x27;, glow:&#x27;#fb923c&#x27;, rot: [
      [{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:2,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:0,y:2}],
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:1,y:2}]
    ]},
    J: { c1:&#x27;#c7d2fe&#x27;, c2:&#x27;#4338ca&#x27;, glow:&#x27;#818cf8&#x27;, rot: [
      [{x:0,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:2,y:2}],
      [{x:1,y:0},{x:1,y:1},{x:0,y:2},{x:1,y:2}]
    ]}
  };
  var TYPES = Object.keys(SHAPES);

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  function pieceCells(p) {
    var states = SHAPES[p.type].rot;
    var offs = states[p.rot % states.length];
    var out = [];
    for (var i = 0; i &lt; offs.length; i++) out.push({ x: p.x + offs[i].x, y: p.y + offs[i].y });
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var type = nextType || randType();
    nextType = randType();
    piece = { type: type, rot: 0, x: 3, y: -1 };
    drawPreview();
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = { type: piece.type, pop: true };
    }
    piece = null;
  }

  function dropInterval() {
    var ms = BASE_MS - (level - 1) * 45;
    return Math.max(MIN_MS, ms);
  }

  function applySpeed() {
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropInterval());
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared * cleared * level;
      scoreEl.textContent = score;
      lines += cleared;
      var newLevel = Math.floor(lines / LINES_PER_LEVEL) + 1;
      if (newLevel &gt; level) {
        level = newLevel;
        levelEl.textContent = level;
        if (running) applySpeed();
      }
    }
  }

  function styleBlock(el, type) {
    var s = SHAPES[type];
    el.style.background = &#x27;linear-gradient(150deg,&#x27; + s.c1 + &#x27;,&#x27; + s.c2 + &#x27;)&#x27;;
    el.style.boxShadow = &#x27;0 0 8px &#x27; + s.glow + &#x27;, inset 0 0 2px rgba(255,255,255,0.6)&#x27;;
  }

  function drawBlock(container, cx, cy, cell, type, pop) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27; + (pop ? &#x27; pop&#x27; : &#x27;&#x27;);
    el.style.left = (cx * cell) + &#x27;px&#x27;;
    el.style.top = (cy * cell) + &#x27;px&#x27;;
    el.style.width = cell + &#x27;px&#x27;;
    el.style.height = cell + &#x27;px&#x27;;
    styleBlock(el, type);
    container.appendChild(el);
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        var cell = grid[r][c];
        if (cell) {
          drawBlock(field, c, r, CELL, cell.type, cell.pop);
          cell.pop = false;  // pop only once
        }
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(field, cells[i].x, cells[i].y, CELL, piece.type, false);
      }
    }
  }

  function drawPreview() {
    preview.innerHTML = &#x27;&#x27;;
    if (!nextType) return;
    var offs = SHAPES[nextType].rot[0];
    for (var i = 0; i &lt; offs.length; i++) drawBlock(preview, offs[i].x, offs[i].y, 24, nextType, false);
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var states = SHAPES[piece.type].rot;
    var nextRot = (piece.rot + 1) % states.length;
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var cand = { type: piece.type, rot: nextRot, x: piece.x + kicks[k], y: piece.y };
      if (!collides(cand)) { piece = cand; paint(); return; }
    }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0; lines = 0; level = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    levelEl.textContent = &#x27;1&#x27;;
    newGrid();
    nextType = randType();
    if (!spawnPiece()) return;
    paint();
    running = true;
    applySpeed();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  nextType = randType();
  piece = { type: randType(), rot: 0, x: 3, y: 0 };
  drawPreview();
  paint();
&lt;/script&gt;

  startBtn.addEventListener('click', function () {

    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;

  var lastW = 0, lastH = 0;
  function applyFit() {

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }

  var tries = 0;
