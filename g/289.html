&lt;script&gt;
  var BOARD_W = 660, BOARD_H = 372;
  var board = document.getElementById(&#x27;board&#x27;);
  var beatbar = document.getElementById(&#x27;beatbar&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var fxbadge = document.getElementById(&#x27;fxbadge&#x27;);
  var cursor = document.getElementById(&#x27;cursor&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var multEl = document.getElementById(&#x27;mult&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var stageEl = document.getElementById(&#x27;stage&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var xpfill = document.getElementById(&#x27;xpfill&#x27;);
  var unlockMsg = document.getElementById(&#x27;unlockMsg&#x27;);

  var running = false;
  var score = 0, best = 0, combo = 0, mult = 1;
  var baseBeatMs = 850, beatMs = 850;
  var beatTimer = null, rafId = null, beatStart = 0;
  var beatCount = 0;
  var hitsSinceScale = 0, missesSinceScale = 0;
  var slowUntil = 0, x2Until = 0;

  // XP / leveling
  var xp = 0, level = 1;
  function xpNeeded(lv) { return 40 + lv * 30; }
  var unlockedSkins = [&#x27;classic&#x27;];
  var unlockedPalettes = [&#x27;default&#x27;];
  var UNLOCKS = [
    { lv: 2, type: &#x27;skin&#x27;, id: &#x27;diamond&#x27;, label: &#x27;Diamond orbs&#x27; },
    { lv: 3, type: &#x27;palette&#x27;, id: &#x27;aurora&#x27;, label: &#x27;Aurora palette&#x27; },
    { lv: 4, type: &#x27;skin&#x27;, id: &#x27;plasma&#x27;, label: &#x27;Plasma orbs&#x27; },
    { lv: 5, type: &#x27;palette&#x27;, id: &#x27;sunset&#x27;, label: &#x27;Sunset palette&#x27; }
  ];

  // Accessibility
  var colorblind = false;
  var sweepBig = false; // larger base cursor

  // Stages
  var STAGES = [
    { name: &#x27;Chill Lo-fi&#x27;, threshold: 0, beat: 950,
      bg: &#x27;radial-gradient(circle at 50% 40%, #1e2a3a 0%, #0a0e14 70%)&#x27;,
      a: &#x27;#7fe0ff&#x27;, b: &#x27;#3388cc&#x27;, wave: &#x27;sine&#x27;, root: 220, glow: &#x27;#7fe0ff&#x27; },
    { name: &#x27;Synthwave&#x27;, threshold: 60, beat: 640,
      bg: &#x27;radial-gradient(circle at 50% 40%, #2a163e 0%, #0a0a14 70%)&#x27;,
      a: &#x27;#00f0ff&#x27;, b: &#x27;#ff2fd0&#x27;, wave: &#x27;square&#x27;, root: 330, glow: &#x27;#ff00e0&#x27; },
    { name: &#x27;Dark Industrial&#x27;, threshold: 160, beat: 480,
      bg: &#x27;radial-gradient(circle at 50% 40%, #2a1010 0%, #060606 70%)&#x27;,
      a: &#x27;#ff5533&#x27;, b: &#x27;#661111&#x27;, wave: &#x27;sawtooth&#x27;, root: 150, glow: &#x27;#ff3300&#x27; }
  ];
  var stageIdx = 0;
  function currentStage() { return STAGES[stageIdx]; }

  function orbColors(bonus) {
    var s = currentStage();
    var a = s.a, b = s.b;
    if (unlockedPalettes.indexOf(&#x27;aurora&#x27;) &gt;= 0 &amp;&amp; !bonus) { a = &#x27;#66ffcc&#x27;; b = &#x27;#3366ff&#x27;; }
    if (unlockedPalettes.indexOf(&#x27;sunset&#x27;) &gt;= 0 &amp;&amp; !bonus) { a = &#x27;#ffcc66&#x27;; b = &#x27;#ff3366&#x27;; }
    if (colorblind) { a = bonus ? &#x27;#ffffff&#x27; : &#x27;#ffd000&#x27;; b = bonus ? &#x27;#0066ff&#x27; : &#x27;#0033aa&#x27;; }
    return { a: a, b: b, glow: colorblind ? &#x27;#ffd000&#x27; : s.glow };
  }

  function updateStage() {
    var newIdx = 0;
    for (var i = STAGES.length - 1; i &gt;= 0; i--) { if (score &gt;= STAGES[i].threshold) { newIdx = i; break; } }
    if (newIdx !== stageIdx) { stageIdx = newIdx; applyStage(); }
  }
  function applyStage() {
    var s = currentStage();
    board.style.background = colorblind ? &#x27;radial-gradient(circle at 50% 40%, #101020 0%, #050510 70%)&#x27; : s.bg;
    stageEl.textContent = s.name;
    baseBeatMs = s.beat;
  }

  function addXP(amount) {
    xp += amount;
    while (xp &gt;= xpNeeded(level)) {
      xp -= xpNeeded(level);
      level += 1;
      onLevelUp();
    }
    levelEl.textContent = level;
    xpfill.style.width = Math.min(100, (xp / xpNeeded(level)) * 100) + &#x27;%&#x27;;
  }
  function onLevelUp() {
    for (var i = 0; i &lt; UNLOCKS.length; i++) {
      var u = UNLOCKS[i];
      if (u.lv === level) {
        if (u.type === &#x27;skin&#x27; &amp;&amp; unlockedSkins.indexOf(u.id) &lt; 0) unlockedSkins.push(u.id);
        if (u.type === &#x27;palette&#x27; &amp;&amp; unlockedPalettes.indexOf(u.id) &lt; 0) unlockedPalettes.push(u.id);
        unlockMsg.textContent = &#x27;★ Unlocked: &#x27; + u.label + &#x27;!&#x27;;
        setTimeout(function () { unlockMsg.textContent = &#x27;&#x27;; }, 3500);
      }
    }
    tone(880, 0.15, &#x27;sine&#x27;, 0.18); tone(1320, 0.18, &#x27;sine&#x27;, 0.14);
  }

  // ---- Audio ----
  var actx = null;
  function ensureAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { actx = null; } } }
  function tone(freq, dur, type, vol) {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  }
  function beatTick() { var s = currentStage(); tone(s.root * 0.5, 0.09, s.wave, 0.1); }
  function hitSound(bonus) { var s = currentStage(); tone(bonus ? s.root*2 : s.root*1.5, 0.12, s.wave, 0.16); tone(bonus ? s.root*3 : s.root*2, 0.1, &#x27;sine&#x27;, 0.09); }
  function missSound() { tone(120, 0.2, &#x27;sawtooth&#x27;, 0.16); }
  function powerSound() { tone(660, 0.1, &#x27;sine&#x27;, 0.16); tone(990, 0.14, &#x27;sine&#x27;, 0.14); }
  function bossHitSound() { tone(200, 0.08, &#x27;square&#x27;, 0.18); }
  function bossDownSound() { tone(90, 0.3, &#x27;sawtooth&#x27;, 0.2); tone(180, 0.3, &#x27;square&#x27;, 0.14); }

  function now() { return performance.now(); }
  function slowActive() { return now() &lt; slowUntil; }
  function x2Active() { return now() &lt; x2Until; }

  function cursorRadius() {
    var base = sweepBig ? 42 : 30;
    return base + (mult - 1) * 8; // grows with combo
  }

  // ---- Entities ----
  var orbs = [];     // {x,y,r,hit,bonus,el,timeout}
  var powers = [];   // {x,y,r,kind,el,timeout}
  var boss = null;   // {x,y,w,h,hp,maxhp,el,timeout}

  function spawnOrb(bonus) {
    var c = orbColors(bonus);
    var r = bonus ? 28 : 24;
    var x = r + Math.random() * (BOARD_W - 2*r);
    var y = r + Math.random() * (BOARD_H - 2*r - 10);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;orb&#x27;;
    el.style.width = el.style.height = (2*r) + &#x27;px&#x27;;
    el.style.left = (x - r) + &#x27;px&#x27;; el.style.top = (y - r) + &#x27;px&#x27;;
    var skin = unlockedSkins[unlockedSkins.length - 1];
    var bg = &#x27;radial-gradient(circle at 35% 30%, &#x27; + c.a + &#x27;, &#x27; + c.b + &#x27;)&#x27;;
    if (skin === &#x27;diamond&#x27;) el.style.borderRadius = &#x27;6px&#x27;;
    if (skin === &#x27;plasma&#x27;) bg = &#x27;radial-gradient(circle at 30% 25%, #fff, &#x27; + c.a + &#x27; 40%, &#x27; + c.b + &#x27;)&#x27;;
    el.style.background = bg;
    el.style.boxShadow = &#x27;0 0 16px &#x27; + c.glow + &#x27;, inset 0 0 8px rgba(255,255,255,0.5)&#x27;;
    board.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add(&#x27;on&#x27;); });
    var obj = { x:x, y:y, r:r, hit:false, bonus:bonus, el:el, glow:c.glow };
    obj.timeout = setTimeout(function(){
      if (!obj.hit &amp;&amp; running) { breakCombo(); missSound(); doFlash(); missesSinceScale++; maybeScale(); }
      removeOrb(obj);
    }, beatMs * 1.3);
    orbs.push(obj);
  }
  function removeOrb(obj) {
    if (obj.timeout) clearTimeout(obj.timeout);
    var i = orbs.indexOf(obj); if (i&gt;=0) orbs.splice(i,1);
    if (obj.el.parentNode === board) board.removeChild(obj.el);
  }

  function spawnPower(kind) {
    var r = 27;
    var x = r + Math.random() * (BOARD_W - 2*r);
    var y = r + Math.random() * (BOARD_H - 2*r - 10);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;orb on&#x27;;
    el.style.width = el.style.height = (2*r) + &#x27;px&#x27;;
    el.style.left = (x-r)+&#x27;px&#x27;; el.style.top = (y-r)+&#x27;px&#x27;;
    el.style.display = &#x27;flex&#x27;; el.style.alignItems=&#x27;center&#x27;; el.style.justifyContent=&#x27;center&#x27;;
    el.style.fontSize = &#x27;26px&#x27;; el.textContent = kind===&#x27;slow&#x27; ? &#x27;⏳&#x27; : &#x27;✕2&#x27;;
    el.style.background = kind===&#x27;slow&#x27; ? &#x27;radial-gradient(circle at 35% 30%, #7fffff, #0088ff)&#x27; : &#x27;radial-gradient(circle at 35% 30%, #ffb0ff, #d000ff)&#x27;;
    el.style.boxShadow = &#x27;0 0 22px &#x27; + (kind===&#x27;slow&#x27;?&#x27;#00d0ff&#x27;:&#x27;#ff00e0&#x27;);
    board.appendChild(el);
    var obj = { x:x, y:y, r:r, kind:kind, el:el };
    obj.timeout = setTimeout(function(){ removePower(obj); }, 3800);
    powers.push(obj);
  }
  function removePower(obj) {
    if (obj.timeout) clearTimeout(obj.timeout);
    var i = powers.indexOf(obj); if (i&gt;=0) powers.splice(i,1);
    if (obj.el.parentNode === board) board.removeChild(obj.el);
  }

  function spawnBoss() {
    if (boss) return;
    var w = 96, h = 84;
    var x = 40 + Math.random() * (BOARD_W - w - 80);
    var y = 30 + Math.random() * (BOARD_H - h - 50);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;boss&#x27;;
    el.style.width = w+&#x27;px&#x27;; el.style.height = h+&#x27;px&#x27;;
    el.style.left = x+&#x27;px&#x27;; el.style.top = y+&#x27;px&#x27;;
    var hp = 4 + Math.min(4, stageIdx*2);
    el.innerHTML = &#x27;&lt;div&gt;⚠ GLITCH&lt;/div&gt;&lt;div class=&quot;bosshp&quot;&gt;HP &#x27; + hp + &#x27;/&#x27; + hp + &#x27;&lt;/div&gt;&#x27;;
    board.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add(&#x27;on&#x27;); });
    boss = { x:x+w/2, y:y+h/2, w:w, h:h, hp:hp, maxhp:hp, el:el, lastHit:0 };
    boss.timeout = setTimeout(function(){
      if (boss) { breakCombo(); doFlash(); removeBoss(); }
    }, 9000);
    showPop(x+w/2, y-6, &#x27;BOSS GLITCH!&#x27;, &#x27;#ff3300&#x27;);
  }
  function removeBoss() {
    if (!boss) return;
    if (boss.timeout) clearTimeout(boss.timeout);
    if (boss.el.parentNode === board) board.removeChild(boss.el);
    boss = null;
  }
  function hitBoss() {
    if (!boss) return;
    var t = now();
    if (t - boss.lastHit &lt; 90) return; // rhythm pacing - can&#x27;t spam instantly
    boss.lastHit = t;
    boss.hp -= 1;
    bossHitSound();
    boss.el.querySelector(&#x27;.bosshp&#x27;).textContent = &#x27;HP &#x27; + boss.hp + &#x27;/&#x27; + boss.maxhp;
    boss.el.style.transform = &#x27;scale(1.12)&#x27;;
    setTimeout(function(){ if (boss) boss.el.style.transform = &#x27;scale(1)&#x27;; }, 80);
    showBurst(boss.x, boss.y);
    if (boss.hp &lt;= 0) {
      var gained = 25 * (x2Active()?2:1);
      score += gained; scoreEl.textContent = score;
      if (score &gt; best) { best = score; bestEl.textContent = best; }

    sweeping = false;

    if (rafId){ cancelAnimationFrame(rafId); rafId=null; }

    overlay.style.display=&#x27;flex&#x27;;

  // Toolbar
  document.getElementById(&#x27;btnCB&#x27;).addEventListener(&#x27;click&#x27;, function(){
    colorblind = !colorblind;

  window.addEventListener(&#x27;message&#x27;, function (e) {

<script>
