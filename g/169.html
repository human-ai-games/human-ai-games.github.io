<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross the lanes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Cross the lanes</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; align-items: center; gap: 16px; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .cooldown-wrap { width: 140px; height: 12px; background: #ddd; border-radius: 6px; overflow: hidden; }
  .cooldown-bar { height: 100%; width: 100%; background: #ff5a5a; border-radius: 6px; transition: width 0.05s linear; }
  .cooldown-label { font-size: 14px; color: #888; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; background: #1c1c28; border-radius: 8px; overflow: hidden; }
  .hero { position: absolute; background: #fff; border-radius: 3px; box-shadow: 0 0 6px #fff; }
  .obstacle { position: absolute; background: #556; border-radius: 3px; }
  .lane-divider { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.06); }
  .orb { position: absolute; border-radius: 50%; pointer-events: none; }
  .predator { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, #d81b1b); box-shadow: 0 0 12px #ff5a5a; pointer-events: none; }
  .slash { position: absolute; border-radius: 4px; background: rgba(255,255,255,0.7); pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cross the lanes&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Arrow keys move and reach the top for a point; grab orbs (green 1, blue 3, gold 5) and flee red predators. Press W/A/S/D to attack the next cell up/left/down/right and destroy a predator — usable once every 5 seconds. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;span class=&quot;cooldown-label&quot;&gt;Attack&lt;/span&gt;
    &lt;div class=&quot;cooldown-wrap&quot;&gt;&lt;div class=&quot;cooldown-bar&quot; id=&quot;cdbar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var PRED_SIZE = CELL - 14;
  var ATTACK_COOLDOWN = 5;   // seconds
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var orbs = [];
  var predators = [];
  var slashes = [];
  var score = 0;
  var lastTime = 0;
  var orbTimer = 0;
  var predTimer = 0;
  var attackCd = 0;   // remaining cooldown seconds
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var cdBar = document.getElementById(&#x27;cdbar&#x27;);

  var ORB_TYPES = [
    { color: &#x27;#4caf50&#x27;, glow: &#x27;#8fff8f&#x27;, points: 1, life: 4.5 },
    { color: &#x27;#3d7bff&#x27;, glow: &#x27;#9fc0ff&#x27;, points: 3, life: 3.0 },
    { color: &#x27;#ffca28&#x27;, glow: &#x27;#fff2b0&#x27;, points: 5, life: 1.8 }
  ];

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = Math.random() &lt; 0.5 ? 1 : -1;
      var speed = 0.4 + Math.random() * 1.6;
      var obstacles = [];
      var count = 2 + Math.floor(Math.random() * 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + Math.random() * (gap - OBSTACLE_W);
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function drawDividers() {
    for (var r = 1; r &lt; ROWS; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane-divider&#x27;;
      d.style.top = (r * CELL) + &#x27;px&#x27;;
      field.appendChild(d);
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function heroCenter() {
    return { x: hero.col * CELL + CELL / 2, y: hero.row * CELL + CELL / 2 };
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function clearOrbs() {
    orbs.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    orbs = [];
  }
  function clearPredators() {
    predators.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    predators = [];
  }
  function clearSlashes() {
    slashes.forEach(function (s) { if (s.el.parentNode) s.el.parentNode.removeChild(s.el); });
    slashes = [];
  }

  function spawnPredator() {
    var edge = Math.floor(Math.random() * 4);
    var x, y;
    if (edge === 0) { x = Math.random() * FIELD_W; y = 0; }
    else if (edge === 1) { x = Math.random() * FIELD_W; y = FIELD_H; }
    else if (edge === 2) { x = 0; y = Math.random() * FIELD_H; }
    else { x = FIELD_W; y = Math.random() * FIELD_H; }
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;predator&#x27;;
    el.style.width = PRED_SIZE + &#x27;px&#x27;;
    el.style.height = PRED_SIZE + &#x27;px&#x27;;
    field.appendChild(el);
    var speed = 55 + Math.random() * 25 + Math.min(60, score * 1.2);
    predators.push({ el: el, x: x, y: y, speed: speed });
  }

  function spawnOrb() {
    var roll = Math.random();
    var type = roll &lt; 0.55 ? ORB_TYPES[0] : (roll &lt; 0.85 ? ORB_TYPES[1] : ORB_TYPES[2]);
    var laneRow = 1 + Math.floor(Math.random() * LANES);
    var col = Math.floor(Math.random() * COLS);
    var size = HERO_SIZE;
    var cx = col * CELL + CELL / 2;
    var cy = laneRow * CELL + CELL / 2;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;orb&#x27;;
    el.style.width = size + &#x27;px&#x27;;
    el.style.height = size + &#x27;px&#x27;;
    el.style.left = (cx - size / 2) + &#x27;px&#x27;;
    el.style.top = (cy - size / 2) + &#x27;px&#x27;;
    el.style.background = &#x27;radial-gradient(circle at 35% 35%, &#x27; + type.glow + &#x27;, &#x27; + type.color + &#x27;)&#x27;;
    el.style.boxShadow = &#x27;0 0 12px &#x27; + type.glow;
    field.appendChild(el);
    orbs.push({ el: el, col: col, row: laneRow, cx: cx, cy: cy, size: size,
                points: type.points, life: type.life, age: 0 });
  }

  function collectOrbsAtHero() {
    for (var i = orbs.length - 1; i &gt;= 0; i--) {
      var o = orbs[i];
      if (o.row === hero.row &amp;&amp; o.col === hero.col) {
        score += o.points;
        scoreEl.textContent = score;
        if (o.el.parentNode) o.el.parentNode.removeChild(o.el);
        orbs.splice(i, 1);
      }
    }
  }

  function updateCdBar() {
    var frac = 1 - attackCd / ATTACK_COOLDOWN;
    cdBar.style.width = Math.max(0, Math.min(1, frac)) * 100 + &#x27;%&#x27;;
    cdBar.style.background = attackCd &lt;= 0 ? &#x27;#4caf50&#x27; : &#x27;#ff5a5a&#x27;;
  }

  function attack(dc, dr) {
    if (!running || attackCd &gt; 0) return;
    // Target the adjacent cell in the given direction.
    var tcol = hero.col + dc;
    var trow = hero.row + dr;
    var tcx = tcol * CELL + CELL / 2;
    var tcy = trow * CELL + CELL / 2;
    // Visual slash in the target cell.
    var slash = document.createElement(&#x27;div&#x27;);
    slash.className = &#x27;slash&#x27;;
    slash.style.width = (CELL - 8) + &#x27;px&#x27;;
    slash.style.height = (CELL - 8) + &#x27;px&#x27;;
    slash.style.left = (tcx - (CELL - 8) / 2) + &#x27;px&#x27;;
    slash.style.top = (tcy - (CELL - 8) / 2) + &#x27;px&#x27;;
    field.appendChild(slash);
    slashes.push({ el: slash, age: 0 });
    // Kill any predator whose center is within the target cell.
    for (var i = predators.length - 1; i &gt;= 0; i--) {
      var pr = predators[i];
      if (Math.abs(pr.x - tcx) &lt; CELL / 2 + PRED_SIZE / 2 &amp;&amp;
          Math.abs(pr.y - tcy) &lt; CELL / 2 + PRED_SIZE / 2) {
        if (pr.el.parentNode) pr.el.parentNode.removeChild(pr.el);
        predators.splice(i, 1);
        score += 2;
        scoreEl.textContent = score;
      }
    }
    attackCd = ATTACK_COOLDOWN;
    updateCdBar();
  }

  function tick(now) {
    if (!running) return;
    if (!lastTime) lastTime = now;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    if (attackCd &gt; 0) { attackCd = Math.max(0, attackCd - dt); updateCdBar(); }

    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    for (var m = orbs.length - 1; m &gt;= 0; m--) {
      var orb = orbs[m];
      orb.age += dt;
      var remaining = 1 - orb.age / orb.life;
      if (remaining &lt;= 0) {
        if (orb.el.parentNode) orb.el.parentNode.removeChild(orb.el);
        orbs.splice(m, 1);
        continue;
      }
      orb.el.style.opacity = Math.max(0.1, remaining);
      var pulse = 0.85 + 0.15 * Math.sin(orb.age * 8);
      orb.el.style.transform = &#x27;scale(&#x27; + (pulse * (0.6 + 0.4 * remaining)) + &#x27;)&#x27;;
    }

    // Fade slashes out quickly.
    for (var s = slashes.length - 1; s &gt;= 0; s--) {
      var sl = slashes[s];
      sl.age += dt;
      if (sl.age &gt; 0.25) {
        if (sl.el.parentNode) sl.el.parentNode.removeChild(sl.el);
        slashes.splice(s, 1);
      } else {
        sl.el.style.opacity = 1 - sl.age / 0.25;
      }
    }

    var hc = heroCenter();
    for (var p = 0; p &lt; predators.length; p++) {
      var pr = predators[p];
      var ddx = hc.x - pr.x, ddy = hc.y - pr.y;
      var dist = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
      pr.x += (ddx / dist) * pr.speed * dt;
      pr.y += (ddy / dist) * pr.speed * dt;
      pr.el.style.left = (pr.x - PRED_SIZE / 2) + &#x27;px&#x27;;
      pr.el.style.top = (pr.y - PRED_SIZE / 2) + &#x27;px&#x27;;
      var hitDist = (PRED_SIZE + HERO_SIZE) / 2 - 6;
      if (dist &lt; hitDist) { endGame(); return; }
    }

    orbTimer -= dt;
    if (orbTimer &lt;= 0) {
      if (orbs.length &lt; 6) spawnOrb();
      orbTimer = 0.9 + Math.random() * 1.1;
    }

    predTimer -= dt;
    if (predTimer &lt;= 0) {
      if (predators.length &lt; 4) spawnPredator();
      predTimer = 7 - Math.min(4, score * 0.1);
    }

    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var lane2 = lanes[laneIdx];
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        if (hx &lt; o2.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
            hy &lt; lane2.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane2.y) {
          endGame();
          return;
        }
      }
    }

    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    hero.col = nc;
    hero.row = nr;
    paintHero();
    collectOrbsAtHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    lastTime = 0;
    orbTimer = 0;
    predTimer = 2;
    attackCd = 0;
    field.innerHTML = &#x27;&#x27;;
    clearOrbs();
    clearPredators();
    clearSlashes();
    drawDividers();
    buildLanes();
    makeHero();
    resetHero();
    updateCdBar();
    spawnOrb();
    spawnPredator();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    var k = e.key;
    if (k === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (k === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (k === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (k === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
    else if (k === &#x27;w&#x27; || k === &#x27;W&#x27;) { attack(0, -1); e.preventDefault(); }
    else if (k === &#x27;s&#x27; || k === &#x27;S&#x27;) { attack(0, 1); e.preventDefault(); }
    else if (k === &#x27;a&#x27; || k === &#x27;A&#x27;) { attack(-1, 0); e.preventDefault(); }
    else if (k === &#x27;d&#x27; || k === &#x27;D&#x27;) { attack(1, 0); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  drawDividers();
  buildLanes();
  makeHero();
  paintHero();
  updateCdBar();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);

<script>
