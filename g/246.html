&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Color Cascade&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the falling piece with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and speed the drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Fill an entire row with colorful blocks to score a point and clear it. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0;
  var animating = false;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // ----- Sound (Web Audio, procedural) -----
  var audioCtx = null;
  var musicMaster = null;
  var musicId = null;
  var musicStep = 0;

  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
    } catch (_) { audioCtx = null; }
  }
  function tone(freq, start, dur, type, vol) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || &#x27;sine&#x27;;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(vol || 0.2, audioCtx.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + start + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + start);
    osc.stop(audioCtx.currentTime + start + dur + 0.02);
  }
  function playYay() {
    ensureAudio();
    tone(523.25, 0, 0.15, &#x27;triangle&#x27;, 0.25);
    tone(659.25, 0.10, 0.15, &#x27;triangle&#x27;, 0.25);
    tone(783.99, 0.20, 0.22, &#x27;triangle&#x27;, 0.28);
  }
  function playBoo() {
    ensureAudio();
    tone(311.13, 0, 0.28, &#x27;sawtooth&#x27;, 0.22);
    tone(233.08, 0.18, 0.45, &#x27;sawtooth&#x27;, 0.22);
  }

  // ----- 8-bit background music -----
  // Note frequencies for a simple looping melody + bass line.
  var MELODY = [
    659.25, 493.88, 523.25, 587.33, 523.25, 493.88, 440.00, 440.00,
    523.25, 659.25, 587.33, 523.25, 493.88, 493.88, 523.25, 587.33,
    659.25, 523.25, 440.00, 440.00, 0, 587.33, 698.46, 880.00,
    783.99, 698.46, 587.33, 523.25, 659.25, 523.25, 493.88, 493.88
  ];
  var BASS = [
    220.00, 0, 220.00, 0, 164.81, 0, 164.81, 0,
    174.61, 0, 174.61, 0, 196.00, 0, 196.00, 0,
    220.00, 0, 220.00, 0, 164.81, 0, 164.81, 0,
    174.61, 0, 196.00, 0, 220.00, 0, 220.00, 0
  ];
  var STEP_MS = 180;

  function playMusicNote(freq, dur, type, vol) {
    if (!audioCtx || !musicMaster) return;
    if (!freq) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(musicMaster);
    osc.start();
    osc.stop(audioCtx.currentTime + dur + 0.02);
  }
  function musicTick() {
    if (!audioCtx || !musicMaster) return;
    playMusicNote(MELODY[musicStep % MELODY.length], STEP_MS / 1000 * 0.9, &#x27;square&#x27;, 0.10);
    playMusicNote(BASS[musicStep % BASS.length], STEP_MS / 1000 * 1.4, &#x27;triangle&#x27;, 0.14);
    musicStep++;
  }
  function startMusic() {
    ensureAudio();
    if (!audioCtx) return;
    if (!musicMaster) {
      musicMaster = audioCtx.createGain();
      musicMaster.gain.value = 0.5;
      musicMaster.connect(audioCtx.destination);
    }
    if (musicId) return;
    musicStep = 0;
    musicTick();
    musicId = setInterval(musicTick, STEP_MS);
  }
  function stopMusic() {
    if (musicId) { clearInterval(musicId); musicId = null; }
  }

  // Seven vibrant piece types.
  var PIECES = [
    { color: &#x27;#ff4b5c&#x27;, cells: [[0,0],[1,0],[0,1],[1,1]] },
    { color: &#x27;#3ec6ff&#x27;, cells: [[0,0],[1,0],[2,0],[3,0]] },
    { color: &#x27;#ffd23f&#x27;, cells: [[0,0],[1,0],[2,0],[2,1]] },
    { color: &#x27;#7c5cff&#x27;, cells: [[0,0],[1,0],[2,0],[0,1]] },
    { color: &#x27;#3fe07d&#x27;, cells: [[0,0],[1,0],[1,1],[2,1]] },
    { color: &#x27;#ff8c3f&#x27;, cells: [[1,0],[2,0],[0,1],[1,1]] },
    { color: &#x27;#ff5ce0&#x27;, cells: [[0,0],[1,0],[2,0],[1,1]] },
  ];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var out = [];
    for (var i = 0; i &lt; p.cells.length; i++) {
      out.push({ x: p.x + p.cells[i][0], y: p.y + p.cells[i][1] });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function rotate(p) {
    var rotated = [];
    for (var i = 0; i &lt; p.cells.length; i++) {
      var cx = p.cells[i][0], cy = p.cells[i][1];
      rotated.push([-cy, cx]);
    }
    var minX = Infinity, minY = Infinity;
    for (var j = 0; j &lt; rotated.length; j++) {
      if (rotated[j][0] &lt; minX) minX = rotated[j][0];
      if (rotated[j][1] &lt; minY) minY = rotated[j][1];
    }
    for (var k = 0; k &lt; rotated.length; k++) {
      rotated[k][0] -= minX;
      rotated[k][1] -= minY;
    }
    return { x: p.x, y: p.y, color: p.color, cells: rotated };
  }

  function makePiece(type) {
    var def = PIECES[type];
    var cells = [];
    for (var i = 0; i &lt; def.cells.length; i++) cells.push([def.cells[i][0], def.cells[i][1]]);
    return { x: Math.floor((COLS - 2) / 2), y: 0, color: def.color, cells: cells };
  }

  function spawnPiece() {
    var type = Math.floor(Math.random() * PIECES.length);
    piece = makePiece(type);
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function findFullRows() {
    var rows = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) rows.push(r);
    }
    return rows;
  }

  function removeRows(rows) {
    rows.sort(function (a, b) { return a - b; });
    for (var i = rows.length - 1; i &gt;= 0; i--) {
      grid.splice(rows[i], 1);
      var empty = [];
      for (var c = 0; c &lt; COLS; c++) empty.push(0);
      grid.unshift(empty);
    }
    score += rows.length;
    scoreEl.textContent = score;
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y, piece.color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    field.appendChild(el);
    return el;
  }

  function animateClear(rows, done) {
    animating = true;
    field.innerHTML = &#x27;&#x27;;
    var isClearing = {};
    for (var i = 0; i &lt; rows.length; i++) isClearing[rows[i]] = true;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c] &amp;&amp; !isClearing[r]) drawBlock(c, r, grid[r][c]);
      }
    }
    var sweepEls = [];
    for (var k = 0; k &lt; rows.length; k++) {
      var rr = rows[k];
      for (var cc = 0; cc &lt; COLS; cc++) {
        if (grid[rr][cc]) {
          var el = drawBlock(cc, rr, grid[rr][cc]);
          el.classList.add(&#x27;clearing&#x27;);
          sweepEls.push(el);
        }
      }
    }
    playYay();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        for (var i = 0; i &lt; sweepEls.length; i++) {
          sweepEls[i].style.transform = &#x27;translateX(260px) scaleX(0.2)&#x27;;
          sweepEls[i].style.opacity = &#x27;0&#x27;;
        }
      });
    });
    setTimeout(function () {
      removeRows(rows);
      animating = false;
      done();
    }, 380);
  }

  function afterLock() {
    var rows = findFullRows();
    if (rows.length &gt; 0) {
      animateClear(rows, function () {
        if (!running) return;
        if (!spawnPiece()) { playBoo(); endGame(); paint(); return; }
        paint();
      });
    } else {
      if (!spawnPiece()) { playBoo(); endGame(); paint(); return; }
      paint();
    }
  }

  function stepDown() {
    if (!piece || animating) return;
    var next = { x: piece.x, y: piece.y + 1, color: piece.color, cells: piece.cells };
    if (collides(next)) {
      lockPiece();
      afterLock();
    } else {
      piece = next;
      paint();
    }
  }

  function move(dx) {
    if (!running || !piece || animating) return;
    var next = { x: piece.x + dx, y: piece.y, color: piece.color, cells: piece.cells };
    if (!collides(next)) { piece = next; paint(); }
  }

  function tryRotate() {
    if (!running || !piece || animating) return;
    var next = rotate(piece);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i &lt; kicks.length; i++) {
      var test = { x: next.x + kicks[i], y: next.y, color: next.color, cells: next.cells };
      if (!collides(test)) { piece = test; paint(); return; }
    }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    stopMusic();
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    animating = false;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
    startMusic();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    stopMusic();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running &amp;&amp; !animating) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { tryRotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = makePiece(0);
  paint();
&lt;/script&gt;

<script>
(function () {

    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
