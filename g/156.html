&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;

  &lt;p class=&quot;instructions&quot;&gt;Slide your &lt;strong&gt;mouse&lt;/strong&gt; left and right to move the baseball bat and swing it at the bouncing eyeball. Each hit scores a point &amp;mdash; and every other hit reveals a secret funny message! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;

        &lt;rect x=&quot;43&quot; y=&quot;74&quot; width=&quot;14&quot; height=&quot;18&quot; rx=&quot;5&quot; fill=&quot;#8a5a1e&quot;/&gt;

      &lt;g id=&quot;wingR&quot;&gt;&lt;path d=&quot;M50 50 C80 10, 95 40, 70 55 C90 65, 75 90, 50 60 Z&quot; fill=&quot;#5cc8ff&quot; stroke=&quot;#2a6bb1&quot; stroke-width=&quot;2&quot;/&gt;&lt;/g&gt;
      &lt;rect x=&quot;47&quot; y=&quot;30&quot; width=&quot;6&quot; height=&quot;42&quot; rx=&quot;3&quot; fill=&quot;#333&quot;/&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var BAT_W = 90, BAT_HITBOX = 70, BAT_TOP_OFFSET = 40;
  var BALL_SIZE = 56;
  var BALL_SPEED = 4.0;
  var running = false, animId = null;
  var batX = (FIELD_W - BAT_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  // butterfly state
  var bfX = FIELD_W / 2, bfY = 50, bfPhase = 0;
  var bat = document.getElementById(&#x27;bat&#x27;);
  var eye = document.getElementById(&#x27;eye&#x27;);
  var iris = document.getElementById(&#x27;iris&#x27;);
  var pupil = document.getElementById(&#x27;pupil&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var secretEl = document.getElementById(&#x27;secret&#x27;);
  var butterfly = document.getElementById(&#x27;butterfly&#x27;);
  var wingL = document.getElementById(&#x27;wingL&#x27;);
  var wingR = document.getElementById(&#x27;wingR&#x27;);

  var SECRETS = [
    &quot;Home run!&quot;,
    &quot;Eye see you 👀&quot;,
    &quot;You&#x27;re on a roll!&quot;,
    &quot;Batter up baby!&quot;,
    &quot;That tickled!&quot;,
    &quot;Keep it bouncing!&quot;,
    &quot;10/10 swing!&quot;,
    &quot;Are you a slugger?&quot;,
    &quot;Don&#x27;t drop me!&quot;,
    &quot;Whack-a-eye!&quot;
  ];
  var secretTimer = null;

  // --- Audio ---
  var audioCtx = null, musicTimer = null, musicStep = 0;
  var MELODY = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880.0, 698.46];
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
  }
  function playCrack() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    // sharp bat &quot;crack&quot;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = &#x27;square&#x27;;
    o.frequency.setValueAtTime(900, t);
    o.frequency.exponentialRampToValueAtTime(140, t + 0.12);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.19);
  }
  function playMusicNote() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var freq = MELODY[musicStep % MELODY.length];
    musicStep++;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = &#x27;triangle&#x27;;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0, t);
    g.gain.linearRampToValueAtTime(0.08, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.34);
    var b = audioCtx.createOscillator();
    var bg = audioCtx.createGain();
    b.type = &#x27;sine&#x27;;
    b.frequency.setValueAtTime(freq / 4, t);
    bg.gain.setValueAtTime(0.06, t);
    bg.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
    b.connect(bg); bg.connect(audioCtx.destination);
    b.start(t); b.stop(t + 0.36);
  }
  function startMusic() {
    if (musicTimer) return;
    musicStep = 0;
    musicTimer = setInterval(playMusicNote, 340);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function swingBat() {
    bat.classList.add(&#x27;swing&#x27;);
    setTimeout(function () { bat.classList.remove(&#x27;swing&#x27;); }, 140);
  }

  function showSecret() {
    var msg = SECRETS[Math.floor(Math.random() * SECRETS.length)];
    secretEl.textContent = msg;
    secretEl.classList.add(&#x27;show&#x27;);
    if (secretTimer) clearTimeout(secretTimer);
    secretTimer = setTimeout(function () {
      secretEl.classList.remove(&#x27;show&#x27;);
    }, 1400);
  }

  function paint() {
    bat.style.left = batX + &#x27;px&#x27;;
    eye.style.left = ballX + &#x27;px&#x27;;
    eye.style.top = ballY + &#x27;px&#x27;;
    var dx = ballVX &gt; 0 ? 6 : -6;
    var dy = ballVY &gt; 0 ? 6 : -6;
    iris.setAttribute(&#x27;cx&#x27;, 50 + dx);
    iris.setAttribute(&#x27;cy&#x27;, 50 + dy);
    pupil.setAttribute(&#x27;cx&#x27;, 50 + dx);
    pupil.setAttribute(&#x27;cy&#x27;, 50 + dy);
    butterfly.style.left = (bfX - 17) + &#x27;px&#x27;;
    butterfly.style.top = (bfY - 17) + &#x27;px&#x27;;
    var flap = Math.abs(Math.sin(bfPhase));
    var sx = 0.3 + 0.7 * flap;
    wingL.setAttribute(&#x27;transform&#x27;, &#x27;translate(&#x27; + (50 * (1 - sx)) + &#x27; 0) scale(&#x27; + sx + &#x27; 1)&#x27;);
    wingR.setAttribute(&#x27;transform&#x27;, &#x27;translate(&#x27; + (-50 * (1 - sx) + 50 * (1 - sx)) + &#x27; 0) scale(&#x27; + sx + &#x27; 1) translate(&#x27; + (100 * (1 - sx) / sx) + &#x27; 0)&#x27;);
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function tick() {
    if (!running) return;
    batX = Math.max(0, Math.min(FIELD_W - BAT_W, batX));
    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }

    var batTop = FIELD_H - BAT_TOP_OFFSET;
    var batHitLeft = batX + (BAT_W - BAT_HITBOX) / 2;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= batTop &amp;&amp;
        ballY + BALL_SIZE &lt;= batTop + 30 &amp;&amp;
        ballX + BALL_SIZE &gt;= batHitLeft &amp;&amp;
        ballX &lt;= batHitLeft + BAT_HITBOX) {
      ballVY = -Math.abs(ballVY);
      ballY = batTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
      swingBat();
      playCrack();
      if (score % 2 === 0) showSecret();
    }
    if (ballY &gt;= FIELD_H) resetBall();

    // butterfly gently chases the eyeball with a wobble
    var targetX = ballX + BALL_SIZE / 2 - 30;
    var targetY = ballY + BALL_SIZE / 2 - 20;
    bfX += (targetX - bfX) * 0.06;
    bfY += (targetY - bfY) * 0.06;
    bfPhase += 0.5;

    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    batX = (FIELD_W - BAT_W) / 2;
    resetBall();
    bfX = ballX; bfY = ballY;
    secretEl.classList.remove(&#x27;show&#x27;);
    paint();
    running = true;
    startMusic();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    stopMusic();
  }

  field.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = field.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    batX = mx - BAT_W / 2;
    batX = Math.max(0, Math.min(FIELD_W - BAT_W, batX));
  });

  window.addEventListener(&#x27;mousedown&#x27;, ensureAudio, true);
  window.addEventListener(&#x27;keydown&#x27;, ensureAudio, true);

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
