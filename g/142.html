<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Defender</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Crystal Defender</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d1024; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; color: #7fe0ff; }
  .instructions { font-size: 16px; color: #b6c2e0; max-width: 610px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 18px; font-size: 19px; color: #dfe6ff; flex-wrap: wrap; justify-content: center; }
  .hud b { color: #7fe0ff; }
  .power-hud { display: flex; gap: 12px; font-size: 14px; min-height: 18px; color: #cfe; }
  .power-hud span { padding: 1px 8px; border-radius: 10px; background: rgba(255,255,255,0.08); }
  .board { position: relative; width: 620px; height: 430px; flex-shrink: 0; background: radial-gradient(circle at center, #1a2145 0%, #0d1024 75%); border-radius: 10px; overflow: hidden; cursor: crosshair; border: 1px solid #2a335f; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #ff7b7b; font-weight: 700; text-shadow: 0 0 12px rgba(0,0,0,.6); text-align: center; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Crystal Defender&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click enemies to destroy them before they reach the crystal (tough ones need several hits). Grab floating power-ups for a shield, auto-turrets, stronger clicks, or explosive blasts!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Level: &lt;b id=&quot;level&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Crystal HP: &lt;b id=&quot;hp&quot;&gt;5&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;power-hud&quot; id=&quot;powerHud&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 430;
  var CX = BOARD_W / 2, CY = BOARD_H / 2;
  var CRYSTAL_R = 26, ENEMY_R = 18, POWER_R = 16;
  var MAX_HP = 5;
  var SHIELD_R = 60;

  var canvas, ctx;
  var enemies = [], particles = [], powerups = [], shots = [];
  var score = 0, hp = MAX_HP, level = 1;
  var running = false, gameOver = false;
  var rafId = null, spawnTimer = 0, spawnEvery = 1200, lastTime = 0;
  var pulse = 0, elapsed = 0;
  var powerSpawnTimer = 0;
  var turretCooldown = 0;

  // active power-up timers (seconds remaining)
  var pw = { shield: 0, turret: 0, damage: 0, blast: 0 };

  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var hpEl = document.getElementById(&#x27;hp&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var powerHud = document.getElementById(&#x27;powerHud&#x27;);

  canvas = document.createElement(&#x27;canvas&#x27;);
  canvas.width = BOARD_W; canvas.height = BOARD_H;
  board.appendChild(canvas);
  ctx = canvas.getContext(&#x27;2d&#x27;);

  var TIER_COLORS = { 1: &#x27;hsl(350,75%,58%)&#x27;, 2: &#x27;hsl(28,85%,56%)&#x27;, 3: &#x27;hsl(280,70%,62%)&#x27; };

  var POWER_DEFS = {
    shield: { color: &#x27;#4aa3ff&#x27;, icon: &#x27;🛡️&#x27;, dur: 8, label: &#x27;Shield&#x27; },
    turret: { color: &#x27;#3ecf6b&#x27;, icon: &#x27;🔫&#x27;, dur: 12, label: &#x27;Turret&#x27; },
    damage: { color: &#x27;#ff9a3c&#x27;, icon: &#x27;⚔️&#x27;, dur: 10, label: &#x27;x2 Damage&#x27; },
    blast:  { color: &#x27;#b56bff&#x27;, icon: &#x27;💥&#x27;, dur: 10, label: &#x27;Blast&#x27; }
  };
  var POWER_KEYS = [&#x27;shield&#x27;, &#x27;turret&#x27;, &#x27;damage&#x27;, &#x27;blast&#x27;];

  function currentLevel() {
    return 1 + Math.floor(elapsed / 12) + Math.floor(score / 12);
  }

  function edgeSpawnPos(r) {
    var side = Math.floor(Math.random() * 4);
    if (side === 0) return { x: Math.random() * BOARD_W, y: -r };
    if (side === 1) return { x: BOARD_W + r, y: Math.random() * BOARD_H };
    if (side === 2) return { x: Math.random() * BOARD_W, y: BOARD_H + r };
    return { x: -r, y: Math.random() * BOARD_H };
  }

  function spawnEnemy() {
    var p = edgeSpawnPos(ENEMY_R);
    var lvl = level;
    var maxTier = lvl &gt;= 8 ? 3 : (lvl &gt;= 4 ? 2 : 1);
    var roll = Math.random();
    var tier = 1;
    if (maxTier === 2) { tier = roll &lt; 0.35 + Math.min(0.25, lvl * 0.02) ? 2 : 1; }
    else if (maxTier === 3) {
      if (roll &lt; 0.25) tier = 3; else if (roll &lt; 0.6) tier = 2; else tier = 1;
    }
    var baseSpeed = 40 + Math.random() * 30 + lvl * 3;
    var speed = baseSpeed - (tier - 1) * 10;
    if (speed &gt; 165) speed = 165;
    if (speed &lt; 25) speed = 25;
    enemies.push({ x: p.x, y: p.y, speed: speed, maxHp: tier, hp: tier, wob: Math.random() * 6.28, flash: 0 });
  }

  function spawnPowerup() {
    var key = POWER_KEYS[Math.floor(Math.random() * POWER_KEYS.length)];
    var p = edgeSpawnPos(POWER_R);
    // gentle drift toward a random interior point
    var tx = 120 + Math.random() * (BOARD_W - 240);
    var ty = 100 + Math.random() * (BOARD_H - 200);
    var dx = tx - p.x, dy = ty - p.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var sp = 55;
    powerups.push({ x: p.x, y: p.y, vx: dx / d * sp, vy: dy / d * sp, key: key, life: 9, wob: Math.random() * 6.28 });
  }

  function makeParticles(x, y, color, n) {
    n = n || 10;
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random() * 6.28, s = 40 + Math.random() * 120;
      particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color: color });
    }
  }

  function endGame() {
    gameOver = true; running = false;
    var m = document.createElement(&#x27;div&#x27;);
    m.className = &#x27;msg&#x27;;
    m.textContent = &#x27;Crystal shattered! Score: &#x27; + score + &#x27;  (Lvl &#x27; + level + &#x27;)&#x27;;
    board.appendChild(m);
  }

  function damageEnemyAt(idx, dmg, sx, sy) {
    var e = enemies[idx];
    e.hp -= dmg;
    if (e.hp &lt;= 0) {
      makeParticles(e.x, e.y, TIER_COLORS[e.maxHp], 12);
      score += e.maxHp;
      scoreEl.textContent = score;
      beep(660 + e.maxHp * 80, 0.06);
      enemies.splice(idx, 1);
      return true;
    } else {
      e.flash = 0.18;
      makeParticles(e.x, e.y, &#x27;#ffffff&#x27;, 4);
      beep(420, 0.04);
      return false;
    }
  }

  function playerClick(px, py) {
    // first: check power-up pickups (priority)
    for (var i = powerups.length - 1; i &gt;= 0; i--) {
      var u = powerups[i];
      var dx = px - u.x, dy = py - u.y, rr = POWER_R + 10;
      if (dx * dx + dy * dy &lt;= rr * rr) {
        var def = POWER_DEFS[u.key];
        pw[u.key] = def.dur;
        makeParticles(u.x, u.y, def.color, 16);
        beep(880, 0.12);
        powerups.splice(i, 1);
        return;
      }
    }
    // damage per click
    var dmg = pw.damage &gt; 0 ? 2 : 1;
    // find topmost enemy hit
    var hitIdx = -1;
    for (var j = enemies.length - 1; j &gt;= 0; j--) {
      var e = enemies[j];
      var ex = px - e.x, ey = py - e.y, r2 = ENEMY_R + 8;
      if (ex * ex + ey * ey &lt;= r2 * r2) { hitIdx = j; break; }
    }
    if (hitIdx &gt;= 0) {
      var hx = enemies[hitIdx].x, hy = enemies[hitIdx].y;
      damageEnemyAt(hitIdx, dmg, hx, hy);
      // blast: splash damage to nearby
      if (pw.blast &gt; 0) {
        var BLAST_R = 78;
        makeParticles(hx, hy, &#x27;#b56bff&#x27;, 18);
        beep(240, 0.14);
        for (var k = enemies.length - 1; k &gt;= 0; k--) {
          var ne = enemies[k];
          var ddx = ne.x - hx, ddy = ne.y - hy;
          if (ddx * ddx + ddy * ddy &lt;= BLAST_R * BLAST_R) {
            damageEnemyAt(k, dmg, ne.x, ne.y);
          }
        }
      }
    }
  }

  canvas.addEventListener(&#x27;mousedown&#x27;, function (ev) {
    if (!running) return;
    var rect = canvas.getBoundingClientRect();
    var px = (ev.clientX - rect.left) * (BOARD_W / rect.width);
    var py = (ev.clientY - rect.top) * (BOARD_H / rect.height);
    playerClick(px, py);
  });

  function updatePowerHud() {
    var html = &#x27;&#x27;;
    for (var i = 0; i &lt; POWER_KEYS.length; i++) {
      var k = POWER_KEYS[i];
      if (pw[k] &gt; 0) {
        html += &#x27;&lt;span style=&quot;color:&#x27; + POWER_DEFS[k].color + &#x27;&quot;&gt;&#x27; + POWER_DEFS[k].icon + &#x27; &#x27; + POWER_DEFS[k].label + &#x27; &#x27; + Math.ceil(pw[k]) + &#x27;s&lt;/span&gt;&#x27;;
      }
    }
    powerHud.innerHTML = html;
  }

  function update(dt) {
    pulse += dt * 3;
    elapsed += dt;

    // decay power timers
    for (var pk = 0; pk &lt; POWER_KEYS.length; pk++) {
      var key = POWER_KEYS[pk];
      if (pw[key] &gt; 0) { pw[key] -= dt; if (pw[key] &lt; 0) pw[key] = 0; }
    }
    updatePowerHud();

    var newLevel = currentLevel();
    if (newLevel !== level) { level = newLevel; levelEl.textContent = level; }

    spawnTimer += dt * 1000;
    var curEvery = Math.max(380, spawnEvery - level * 55);
    if (spawnTimer &gt;= curEvery) { spawnTimer = 0; spawnEnemy(); }

    // power-up spawns periodically
    powerSpawnTimer += dt;
    if (powerSpawnTimer &gt;= 7 + Math.random() * 4) { powerSpawnTimer = 0; spawnPowerup(); }

    // turret auto-fire
    if (pw.turret &gt; 0) {
      turretCooldown -= dt;
      if (turretCooldown &lt;= 0 &amp;&amp; enemies.length &gt; 0) {
        // target the closest enemy to the crystal
        var best = -1, bestD = 1e9;
        for (var t = 0; t &lt; enemies.length; t++) {
          var edx = CX - enemies[t].x, edy = CY - enemies[t].y;
          var edd = edx * edx + edy * edy;
          if (edd &lt; bestD) { bestD = edd; best = t; }
        }
        if (best &gt;= 0) {
          var te = enemies[best];
          var sdx = te.x - CX, sdy = te.y - CY, sd = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
          shots.push({ x: CX, y: CY, vx: sdx / sd * 460, vy: sdy / sd * 460, life: 2 });
          beep(520, 0.03);
          turretCooldown = 0.55;
        }
      }
    }

    // move shots &amp; collide
    for (var s = shots.length - 1; s &gt;= 0; s--) {
      var sh = shots[s];
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      sh.life -= dt;
      var hitS = false;
      for (var se = enemies.length - 1; se &gt;= 0; se--) {
        var en = enemies[se];
        var sx = sh.x - en.x, sy = sh.y - en.y;
        if (sx * sx + sy * sy &lt;= (ENEMY_R + 5) * (ENEMY_R + 5)) {
          damageEnemyAt(se, 1, en.x, en.y);
          hitS = true; break;
        }
      }
      if (hitS || sh.life &lt;= 0 || sh.x &lt; -20 || sh.x &gt; BOARD_W + 20 || sh.y &lt; -20 || sh.y &gt; BOARD_H + 20) {
        shots.splice(s, 1);
      }
    }

    // move powerups
    for (var u = powerups.length - 1; u &gt;= 0; u--) {
      var pu = powerups[u];
      pu.x += pu.vx * dt; pu.y += pu.vy * dt; pu.wob += dt * 4;
      pu.life -= dt;
      // bounce off walls softly
      if (pu.x &lt; POWER_R || pu.x &gt; BOARD_W - POWER_R) pu.vx *= -1;
      if (pu.y &lt; POWER_R || pu.y &gt; BOARD_H - POWER_R) pu.vy *= -1;
      if (pu.life &lt;= 0) powerups.splice(u, 1);
    }

    // move enemies
    for (var i = enemies.length - 1; i &gt;= 0; i--) {
      var e = enemies[i];
      if (e.flash &gt; 0) e.flash -= dt;
      var dx = CX - e.x, dy = CY - e.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      e.wob += dt * 5;
      e.x += (dx / d) * e.speed * dt;
      e.y += (dy / d) * e.speed * dt;

      var contact = pw.shield &gt; 0 ? (SHIELD_R + ENEMY_R) : (CRYSTAL_R + ENEMY_R);
      if (d &lt;= contact) {
        if (pw.shield &gt; 0) {
          // shield destroys the enemy instead of damaging crystal
          makeParticles(e.x, e.y, &#x27;#4aa3ff&#x27;, 12);
          beep(300, 0.06);
          enemies.splice(i, 1);
          continue;
        }
        enemies.splice(i, 1);
        hp -= 1;
        hpEl.textContent = hp;
        makeParticles(CX, CY, &#x27;#ff5566&#x27;, 14);
        beep(160, 0.12);
        if (hp &lt;= 0) { endGame(); return; }
      }
    }

    for (var j = particles.length - 1; j &gt;= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life -= dt * 1.6;
      if (p.life &lt;= 0) particles.splice(j, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, BOARD_W, BOARD_H);

    var glow = 0.5 + 0.5 * Math.sin(pulse);

    // shield ring
    if (pw.shield &gt; 0) {
      var sAlpha = pw.shield &lt; 2 ? (0.3 + 0.4 * Math.abs(Math.sin(pulse * 4))) : 0.55;
      ctx.beginPath();
      ctx.arc(CX, CY, SHIELD_R, 0, 6.2832);
      ctx.strokeStyle = &#x27;rgba(74,163,255,&#x27; + sAlpha + &#x27;)&#x27;;
      ctx.lineWidth = 4;
      ctx.shadowColor = &#x27;#4aa3ff&#x27;; ctx.shadowBlur = 16;
      ctx.stroke();
      ctx.shadowBlur = 0;
      var sg = ctx.createRadialGradient(CX, CY, SHIELD_R - 20, CX, CY, SHIELD_R);
      sg.addColorStop(0, &#x27;rgba(74,163,255,0)&#x27;);
      sg.addColorStop(1, &#x27;rgba(74,163,255,0.12)&#x27;);
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(CX, CY, SHIELD_R, 0, 6.2832); ctx.fill();
    }

    // crystal glow
    var grad = ctx.createRadialGradient(CX, CY, 4, CX, CY, CRYSTAL_R + 30 + glow * 10);
    grad.addColorStop(0, &#x27;rgba(127,224,255,0.55)&#x27;);
    grad.addColorStop(1, &#x27;rgba(127,224,255,0)&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(CX, CY, CRYSTAL_R + 30, 0, 6.2832); ctx.fill();

    // crystal
    var hpFrac = hp / MAX_HP;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(pulse * 0.3);
    ctx.beginPath();
    ctx.moveTo(0, -CRYSTAL_R);
    ctx.lineTo(CRYSTAL_R * 0.8, 0);
    ctx.lineTo(0, CRYSTAL_R);
    ctx.lineTo(-CRYSTAL_R * 0.8, 0);
    ctx.closePath();
    ctx.fillStyle = &#x27;hsl(&#x27; + (120 * hpFrac + 190) + &#x27;,85%,&#x27; + (55 + glow * 10) + &#x27;%)&#x27;;
    ctx.shadowColor = &#x27;#7fe0ff&#x27;; ctx.shadowBlur = 18;
    ctx.fill();
    ctx.restore();

    // turret barrel indicator
    if (pw.turret &gt; 0) {
      ctx.beginPath();
      ctx.arc(CX, CY, CRYSTAL_R + 6, 0, 6.2832);
      ctx.strokeStyle = &#x27;rgba(62,207,107,0.7)&#x27;;
      ctx.lineWidth = 3; ctx.stroke();
    }

    // shots
    for (var s = 0; s &lt; shots.length; s++) {
      var sh = shots[s];
      ctx.beginPath();
      ctx.arc(sh.x, sh.y, 4, 0, 6.2832);
      ctx.fillStyle = &#x27;#aaffcc&#x27;;
      ctx.shadowColor = &#x27;#3ecf6b&#x27;; ctx.shadowBlur = 8;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    // power-ups
    for (var u = 0; u &lt; powerups.length; u++) {
      var pu = powerups[u];
      var def = POWER_DEFS[pu.key];
      var bob = Math.sin(pu.wob) * 3;
      var blink = pu.life &lt; 2.5 ? (0.4 + 0.6 * Math.abs(Math.sin(pulse * 5))) : 1;
      ctx.globalAlpha = blink;
      ctx.beginPath();
      ctx.arc(pu.x, pu.y + bob, POWER_R, 0, 6.2832);
      ctx.fillStyle = def.color;
      ctx.shadowColor = def.color; ctx.shadowBlur = 14;
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      ctx.font = &#x27;18px system-ui&#x27;;
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.fillText(def.icon, pu.x, pu.y + bob + 1);
    }

    // enemies
    for (var i = 0; i &lt; enemies.length; i++) {
      var e = enemies[i];
      var r = ENEMY_R + Math.sin(e.wob) * 2;
      var col = e.flash &gt; 0 ? &#x27;#ffffff&#x27; : TIER_COLORS[e.maxHp];
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, 6.2832);
      ctx.fillStyle = col;
      ctx.shadowColor = TIER_COLORS[e.maxHp]; ctx.shadowBlur = 10;
      ctx.fill(); ctx.shadowBlur = 0;

      if (e.maxHp &gt; 1) {
        var segGap = 0.25, seg = (6.2832 / e.maxHp);
        for (var sc = 0; sc &lt; e.maxHp; sc++) {
          ctx.beginPath();
          ctx.strokeStyle = sc &lt; e.hp ? &#x27;#ffffff&#x27; : &#x27;rgba(255,255,255,0.2)&#x27;;
          ctx.lineWidth = 3;
          ctx.arc(e.x, e.y, r + 5, sc * seg + segGap / 2 - 1.5708, (sc + 1) * seg - segGap / 2 - 1.5708);
          ctx.stroke();
        }
      }
      ctx.fillStyle = &#x27;#1a0010&#x27;;
      ctx.beginPath(); ctx.arc(e.x - 5, e.y - 3, 3, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 5, e.y - 3, 3, 0, 6.2832); ctx.fill();
    }

    // particles
    for (var j = 0; j &lt; particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = &#x27;start&#x27;; ctx.textBaseline = &#x27;alphabetic&#x27;;
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = (ts - lastTime) / 1000;
    if (dt &gt; 0.05) dt = 0.05;
    lastTime = ts;
    update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }

  var audioCtx = null;
  function beep(freq, dur) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.type = &#x27;triangle&#x27;;
      g.gain.value = 0.08;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function clearMsg() {
    var m = board.querySelector(&#x27;.msg&#x27;);

/* game_input_heartbeat_server_inject — server-side fallback when the LLM

 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
