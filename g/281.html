  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

  .barfill { height: 100%; width: 100%; background: var(--barg); transition: width .25s linear; }
  .barfill.low { background: linear-gradient(90deg,#ff6b6b,#ff3b3b); }
  .pw { display: flex; gap: 6px; }

  .bullet { position: absolute; width: 5px; height: 14px; background: var(--bullet); border-radius: 3px; box-shadow: 0 0 8px var(--glow); }
  .target { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 30px; will-change: transform; }
  .powerup { position: absolute; display:flex; align-items:center; justify-content:center; font-size: 26px; will-change: transform; filter: drop-shadow(0 0 6px #ffd86b); }
  .burst { position: absolute; pointer-events: none; font-size: 26px; animation: burst .4s ease-out forwards; }
  @keyframes burst { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
  .float { position: absolute; pointer-events: none; font-weight: 700; font-size: 16px; color: var(--val); text-shadow: 0 0 6px #000; animation: float 0.8s ease-out forwards; }
  @keyframes float { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
  .badge { position:absolute; right:10px; top:10px; background:rgba(11,16,33,.9); border:1px solid var(--accent); border-radius:8px; padding:6px 10px; font-size:14px; font-weight:700; color:var(--accent); box-shadow:0 0 12px var(--glow); animation: badgein 2.4s ease forwards; pointer-events:none; }
  @keyframes badgein { 0%{transform:translateX(60px);opacity:0;} 10%{transform:translateX(0);opacity:1;} 85%{opacity:1;} 100%{opacity:0;} }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(11,16,33,.88); text-align: center; gap: 8px; padding: 10px; box-sizing:border-box; }
  .overlay h2 { margin: 0; font-size: 26px; color: var(--accent); }
  .overlay p { margin: 0; font-size: 15px; color: #aeb8e0; max-width:460px; line-height:1.3; }
  .countnum { font-size: 76px; font-weight: 800; color: var(--val); text-shadow: 0 0 20px var(--glow); animation: pop .8s ease-out; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 40% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .banner { position:absolute; top: 12px; left:0; right:0; text-align:center; font-size: 22px; font-weight:800; color:#ffd86b; text-shadow:0 0 12px rgba(255,216,107,.7); pointer-events:none; animation: pop .5s ease-out; }
  .bigbtn { font-size:17px; padding:9px 22px; border-radius:8px; border:none; background:var(--accent); color:#0b1021; font-weight:800; cursor:pointer; box-shadow:0 0 14px var(--glow); }
  .hidden { display: none; }

  /* themes */
  body { --accent:#7fd7ff; --glow:rgba(127,215,255,.5); --val:#ffd86b; --barg:linear-gradient(90deg,#7fd7ff,#4a86ff); --bullet:linear-gradient(#fff,#7fd7ff); --fieldbg: radial-gradient(circle at 50% 20%, #16204a 0%, #0b1021 80%); }
  body.theme-sunset { --accent:#ff9a5c; --glow:rgba(255,154,92,.55); --val:#ffe36b; --barg:linear-gradient(90deg,#ff9a5c,#ff5c8a); --bullet:linear-gradient(#fff,#ffb35c); --fieldbg: radial-gradient(circle at 50% 20%, #4a1d3a 0%, #1a0e26 80%); background:#1a0e26; }
  body.theme-matrix { --accent:#5cff9a; --glow:rgba(92,255,154,.55); --val:#bfffca; --barg:linear-gradient(90deg,#5cff9a,#1fae5a); --bullet:linear-gradient(#fff,#5cff9a); --fieldbg: radial-gradient(circle at 50% 20%, #0d2a17 0%, #04120a 80%); background:#04120a; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON STRIKE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and press &lt;strong&gt;Space&lt;/strong&gt; to fire at targets before time runs out. Grab power-ups, chain combos, and pick a difficulty &amp; theme below — then hit Start!&lt;/p&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;div class=&quot;seg&quot; id=&quot;diffSeg&quot;&gt;
      &lt;button class=&quot;btn on&quot; data-diff=&quot;easy&quot;&gt;Easy&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-diff=&quot;normal&quot;&gt;Normal&lt;/button&gt;
      &lt;button class=&quot;btn&quot; data-diff=&quot;hard&quot;&gt;Hard&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;seg&quot; id=&quot;themeSeg&quot;&gt;
      &lt;button class=&quot;btn on&quot; data-theme=&quot;neon&quot;&gt;🌊 Neon&lt;/button&gt;
      &lt;button class=&quot;btn locked&quot; data-theme=&quot;sunset&quot;&gt;🌅 Sunset (300)&lt;/button&gt;
      &lt;button class=&quot;btn locked&quot; data-theme=&quot;matrix&quot;&gt;🟢 Matrix (800)&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;box&quot; id=&quot;score&quot;&gt;Score &lt;span class=&quot;val&quot; id=&quot;scoreVal&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot; id=&quot;combo&quot;&gt;Combo &lt;span class=&quot;val&quot; id=&quot;comboVal&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot; id=&quot;lvl&quot;&gt;Lvl &lt;span class=&quot;val&quot; id=&quot;lvlVal&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot; id=&quot;best&quot;&gt;Best &lt;span class=&quot;val&quot; id=&quot;bestVal&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;bars&quot;&gt;
    &lt;div class=&quot;barwrap&quot;&gt;
      &lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Time&lt;/span&gt;&lt;span id=&quot;timeTxt&quot;&gt;45s&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;barfill&quot; id=&quot;timeBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;pw&quot;&gt;
      &lt;span class=&quot;pwchip&quot; id=&quot;chipSlow&quot;&gt;⏳&lt;/span&gt;
      &lt;span class=&quot;pwchip&quot; id=&quot;chipDbl&quot;&gt;✨&lt;/span&gt;
      &lt;span class=&quot;pwchip&quot; id=&quot;chipMag&quot;&gt;🧲&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;🚀&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Ready?&lt;/h2&gt;
      &lt;p&gt;Choose a difficulty and theme above, then press the Start button below to launch.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var FIELD_W = 640, FIELD_H = 360;
  var SHIP_W = 36, SHIP_H = 30, SHIP_BOTTOM = 12;
  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 8.5;
  var DIFF = {
    easy:   { time:50, shipSpeed:7,   spd0:1.2, spdK:0.035, spawn0:1150, spawnK:12, fire:190 },
    normal: { time:45, shipSpeed:7,   spd0:1.5, spdK:0.045, spawn0:1050, spawnK:15, fire:190 },
    hard:   { time:40, shipSpeed:7.5, spd0:1.9, spdK:0.06,  spawn0:900,  spawnK:20, fire:170 }
  };
  var diff = &#x27;easy&#x27;, cfg = DIFF.easy;
  var GAME_TIME = cfg.time;
  var running = false, animId = null, spawnId = null, timerId = null, countId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], powerups = [];
  var score = 0, best = 0, combo = 0, maxCombo = 0, comboTimer = 0, timeLeft = 0, elapsed = 0;
  var level = 1, powersUsed = 0;
  var lastShot = 0;
  var slowT = 0, dblT = 0, magT = 0;
  var bonusT = 0, nextBonus = 0;
  var earnedBadges = {};
  var unlocked = { neon:true, sunset:false, matrix:false };
  var theme = &#x27;neon&#x27;;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreVal = document.getElementById(&#x27;scoreVal&#x27;);
  var comboVal = document.getElementById(&#x27;comboVal&#x27;);
  var comboBox = document.getElementById(&#x27;combo&#x27;);
  var lvlVal = document.getElementById(&#x27;lvlVal&#x27;);
  var bestVal = document.getElementById(&#x27;bestVal&#x27;);
  var timeBar = document.getElementById(&#x27;timeBar&#x27;);
  var timeTxt = document.getElementById(&#x27;timeTxt&#x27;);
  var chipSlow = document.getElementById(&#x27;chipSlow&#x27;);
  var chipDbl = document.getElementById(&#x27;chipDbl&#x27;);
  var chipMag = document.getElementById(&#x27;chipMag&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var diffSeg = document.getElementById(&#x27;diffSeg&#x27;);
  var themeSeg = document.getElementById(&#x27;themeSeg&#x27;);

  // ---- Audio ----
  var actx = null;
  function audio() { if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){} } return actx; }
  function beep(freq, dur, type, vol) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime;
    o.start(t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq*0.6), t + dur);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.stop(t + dur);
  }
  function laserSound() { beep(880, 0.1, &#x27;square&#x27;, 0.07); }
  function hitSound(c) { beep(300 + Math.min(c,10)*80, 0.16, &#x27;triangle&#x27;, 0.15); }
  function powerSound() { beep(660, 0.12, &#x27;sine&#x27;, 0.18); setTimeout(function(){beep(990,0.14,&#x27;sine&#x27;,0.18);},90); }
  function bonusSound() { beep(523,0.15,&#x27;sine&#x27;,.2); setTimeout(function(){beep(659,0.15,&#x27;sine&#x27;,.2);},120); setTimeout(function(){beep(784,0.2,&#x27;sine&#x27;,.2);},240); }
  function countSound(f){ beep(f,0.18,&#x27;sine&#x27;,0.2); }
  function badgeSound(){ beep(784,0.1,&#x27;sine&#x27;,.2); setTimeout(function(){beep(1046,0.16,&#x27;sine&#x27;,.2);},100); }

  function timeScale() { return slowT &gt; 0 ? 0.45 : 1; }
  function targetSpeed() { return (cfg.spd0 + elapsed * cfg.spdK) * timeScale(); }
  function spawnInterval() {
    var base = Math.max(380, cfg.spawn0 - elapsed * cfg.spawnK);
    if (bonusT &gt; 0) base *= 0.5;
    return base;
  }
  function currentLevel() { return 1 + Math.floor(elapsed / 12); }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function pickTargetType() {
    var lv = level, r = Math.random();
    if (lv &gt;= 3 &amp;&amp; r &lt; 0.22) return &#x27;armor&#x27;;
    if (lv &gt;= 2 &amp;&amp; r &lt; 0.42) return &#x27;zig&#x27;;
    return &#x27;normal&#x27;;
  }

  function spawnTarget() {
    if (!running) return;
    var size = 30, type = pickTargetType();
    var t = { x: Math.random()*(FIELD_W-size), y:-size, size:size, el:null, type:type, hp:type===&#x27;armor&#x27;?2:1, vx:type===&#x27;zig&#x27;?(Math.random()&lt;.5?1.6:-1.6):0 };
    var el = document.createElement(&#x27;div&#x27;);
    el.className=&#x27;target&#x27;; el.style.width=size+&#x27;px&#x27;; el.style.height=size+&#x27;px&#x27;;
    el.textContent = type===&#x27;armor&#x27;?&#x27;🛡️&#x27;:type===&#x27;zig&#x27;?&#x27;🛸&#x27;:[&#x27;👾&#x27;,&#x27;👽&#x27;,&#x27;☄️&#x27;][Math.floor(Math.random()*3)];
    el.style.transform=&#x27;translate(&#x27;+t.x+&#x27;px,&#x27;+t.y+&#x27;px)&#x27;;
    field.appendChild(el); t.el=el; targets.push(t);
    scheduleSpawn();
  }
  function scheduleSpawn(){ if(spawnId) clearTimeout(spawnId); spawnId=setTimeout(spawnTarget, spawnInterval()); }

  function spawnPowerup(){
    if(!running) return;
    var kinds=[&#x27;slow&#x27;,&#x27;dbl&#x27;,&#x27;mag&#x27;], kind=kinds[Math.floor(Math.random()*3)], size=28;
    var p={x:Math.random()*(FIELD_W-size),y:-size,size:size,kind:kind,el:null,speed:1.8};
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;powerup&#x27;;
    el.style.width=size+&#x27;px&#x27;; el.style.height=size+&#x27;px&#x27;;
    el.textContent=kind===&#x27;slow&#x27;?&#x27;⏳&#x27;:kind===&#x27;dbl&#x27;?&#x27;✨&#x27;:&#x27;🧲&#x27;;
    el.style.transform=&#x27;translate(&#x27;+p.x+&#x27;px,&#x27;+p.y+&#x27;px)&#x27;;
    field.appendChild(el); p.el=el; powerups.push(p);
  }

  function spawnBullet(){
    var now=Date.now(); if(now-lastShot&lt;cfg.fire) return; lastShot=now;
    var b={x:shipX+SHIP_W/2-BULLET_W/2,y:FIELD_H-SHIP_BOTTOM-SHIP_H-BULLET_H,el:null};
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;bullet&#x27;;
    el.style.left=b.x+&#x27;px&#x27;; el.style.top=b.y+&#x27;px&#x27;;
    field.appendChild(el); b.el=el; bullets.push(b); laserSound();
  }

  function effect(cls,txt,x,y){
    var el=document.createElement(&#x27;div&#x27;); el.className=cls; el.textContent=txt;
    el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;; field.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },800);
  }
  function banner(txt){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;banner&#x27;; el.textContent=txt;
    field.appendChild(el); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1400);
  }
  function badge(id,txt){
    if (earnedBadges[id]) return; earnedBadges[id]=true;
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;badge&#x27;; el.textContent=&#x27;🏅 &#x27;+txt;
    field.appendChild(el); badgeSound();
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },2400);
  }

  function updateCombo(){ comboVal.textContent=&#x27;x&#x27;+Math.max(1,combo); comboBox.classList.toggle(&#x27;hot&#x27;,combo&gt;=3); }
  function updateChips(){ chipSlow.classList.toggle(&#x27;on&#x27;,slowT&gt;0); chipDbl.classList.toggle(&#x27;on&#x27;,dblT&gt;0); chipMag.classList.toggle(&#x27;on&#x27;,magT&gt;0); }

  function checkUnlocks(){
    if (!unlocked.sunset &amp;&amp; score&gt;=300){ unlocked.sunset=true; markThemeBtn(&#x27;sunset&#x27;); banner(&#x27;🌅 Sunset theme unlocked!&#x27;); }
    if (!unlocked.matrix &amp;&amp; score&gt;=800){ unlocked.matrix=true; markThemeBtn(&#x27;matrix&#x27;); banner(&#x27;🟢 Matrix theme unlocked!&#x27;); }
  }
  function markThemeBtn(name){
    var b = themeSeg.querySelector(&#x27;[data-theme=&quot;&#x27;+name+&#x27;&quot;]&#x27;);
    if (b){ b.classList.remove(&#x27;locked&#x27;); b.textContent = name===&#x27;sunset&#x27;?&#x27;🌅 Sunset&#x27;:&#x27;🟢 Matrix&#x27;; }
  }

  function tick(){
    if(!running) return;
    var dt=16;
    if(keysDown[&#x27;ArrowLeft&#x27;]) shipX-=cfg.shipSpeed;
    if(keysDown[&#x27;ArrowRight&#x27;]) shipX+=cfg.shipSpeed;
    shipX=Math.max(0,Math.min(FIELD_W-SHIP_W,shipX)); paintShip();

    if(slowT&gt;0){slowT-=dt; if(slowT&lt;=0){slowT=0;updateChips();}}
    if(dblT&gt;0){dblT-=dt; if(dblT&lt;=0){dblT=0;updateChips();}}
    if(magT&gt;0){magT-=dt; if(magT&lt;=0){magT=0;updateChips();}}
    if(bonusT&gt;0){bonusT-=dt; if(bonusT&lt;=0){bonusT=0;field.classList.remove(&#x27;bonus&#x27;);banner(&#x27;Bonus Over&#x27;);}}
    if(comboTimer&gt;0){comboTimer-=dt; if(comboTimer&lt;=0){combo=0;updateCombo();}}

    var sp=targetSpeed(), ts=timeScale();

    for(var i=bullets.length-1;i&gt;=0;i--){
      var b=bullets[i]; b.y-=BULLET_SPEED;
      if(magT&gt;0){ var near=null,nd=1e9;
        for(var m=0;m&lt;targets.length;m++){var tt=targets[m];var d=Math.abs((tt.x+tt.size/2)-(b.x+BULLET_W/2)); if(tt.y&lt;b.y&amp;&amp;d&lt;nd){nd=d;near=tt;}}
        if(near){var cx=near.x+near.size/2-BULLET_W/2; b.x+=Math.max(-4,Math.min(4,cx-b.x)); b.el.style.left=b.x+&#x27;px&#x27;;}
      }
      if(b.y+BULLET_H&lt;0){field.removeChild(b.el);bullets.splice(i,1);continue;}
      b.el.style.top=b.y+&#x27;px&#x27;;
    }
    for(var j=targets.length-1;j&gt;=0;j--){

      pu.el.style.transform=&#x27;translate(&#x27;+pu.x+&#x27;px,&#x27;+pu.y+&#x27;px)&#x27;;
      var sy=FIELD_H-SHIP_BOTTOM-SHIP_H;
      if(pu.y+pu.size&gt;sy&amp;&amp;pu.x&lt;shipX+SHIP_W&amp;&amp;pu.x+pu.size&gt;shipX){ collectPower(pu.kind,pu.x,pu.y); field.removeChild(pu.el); powerups.splice(p,1); }

      &#x27;&lt;h2&gt;&#x27;+(record?&#x27;🏆 New Best!&#x27;:&quot;Time&#x27;s Up!&quot;)+&#x27;&lt;/h2&gt;&#x27;+

  function stopTimers(){
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearTimeout(spawnId);spawnId=null;}
    if(timerId){clearInterval(timerId);timerId=null;}
    if(countId){clearInterval(countId);countId=null;}
  }

  function stopGame(){
    stopTimers(); running=false; clearAll();
    overlay.classList.remove(&#x27;hidden&#x27;);
    overlay.innerHTML=&#x27;&lt;h2&gt;Paused&lt;/h2&gt;&lt;p&gt;Press the Start button below to play.&lt;/p&gt;&#x27;;
  }

  // difficulty &amp; theme buttons
  diffSeg.addEventListener(&#x27;click&#x27;, function(e){
    var b=e.target.closest(&#x27;[data-diff]&#x27;); if(!b) return;
    diff=b.getAttribute(&#x27;data-diff&#x27;);

  });

    var b=e.target.closest(&#x27;[data-theme]&#x27;); if(!b) return;
    var name=b.getAttribute(&#x27;data-theme&#x27;);

  });

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keysDown[e.key]=true;e.preventDefault();}

  paintShip();

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
