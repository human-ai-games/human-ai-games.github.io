&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐡 Puffer Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to swim your puffer fish to the top of each level. Dodge the sea creatures (they cost a life — you have 3), pop bubbles for 9 points plus a heart, grab chests for 15, and clear all three levels to reach the surface.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;

    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;

    &lt;div id=&quot;banner&quot;&gt;&lt;/div&gt;

    &lt;div id=&quot;win&quot;&gt;

    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 10;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var running = false, animId = null, transitioning = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0, lives = 3, level = 1;
  var MAX_LIVES = 3;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var winScreen = document.getElementById(&#x27;win&#x27;);
  var winScoreEl = document.getElementById(&#x27;winScore&#x27;);

  var LEVELS = {
    1: { bg: &#x27;linear-gradient(180deg,#0a4a86 0%,#073a6e 45%,#052b52 100%)&#x27;, creature: &#x27;fish&#x27;,  speed: 1.0, sizeScale: 1.0 },
    2: { bg: &#x27;linear-gradient(180deg,#2b7dc4 0%,#1f66a8 50%,#164e86 100%)&#x27;, creature: &#x27;squid&#x27;, speed: 1.15, sizeScale: 1.0 },
    3: { bg: &#x27;linear-gradient(180deg,#7fc4ec 0%,#59a9de 50%,#3d8bc4 100%)&#x27;, creature: &#x27;mini&#x27;,  speed: 1.55, sizeScale: 0.7 }
  };

  // ---- audio ----
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  // ---- gradient/defs helper ----
  var _gid = 0;
  function uid() { return &#x27;g&#x27; + (_gid++); }

  // ---- sprites (with shading for depth) ----
  function fishSVG(bodyColor, finColor, hi, dir, w, h) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(-72,0)&quot;&#x27; : &#x27;&#x27;;
    var id = uid();
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 72 32&quot;&gt;&#x27;+
      &#x27;&lt;defs&gt;&#x27;+
        &#x27;&lt;radialGradient id=&quot;&#x27;+id+&#x27;&quot; cx=&quot;60%&quot; cy=&quot;30%&quot; r=&quot;75%&quot;&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;&#x27;+hi+&#x27;&quot;/&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;55%&quot; stop-color=&quot;&#x27;+bodyColor+&#x27;&quot;/&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;&#x27;+finColor+&#x27;&quot;/&gt;&#x27;+
        &#x27;&lt;/radialGradient&gt;&#x27;+
      &#x27;&lt;/defs&gt;&#x27;+
      &#x27;&lt;g&#x27;+flip+&#x27;&gt;&#x27;+
      &#x27;&lt;polygon points=&quot;0,16 16,4 16,28&quot; fill=&quot;&#x27;+finColor+&#x27;&quot;/&gt;&#x27;+
      &#x27;&lt;polygon points=&quot;2,16 15,7 15,25&quot; fill=&quot;&#x27;+bodyColor+&#x27;&quot; opacity=&quot;0.6&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;42&quot; cy=&quot;16&quot; rx=&quot;26&quot; ry=&quot;13&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M34,4 Q42,3 40,12 Z&quot; fill=&quot;&#x27;+finColor+&#x27;&quot; opacity=&quot;0.85&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;48&quot; cy=&quot;10&quot; rx=&quot;12&quot; ry=&quot;5&quot; fill=&quot;&#x27;+hi+&#x27;&quot; opacity=&quot;0.45&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;58&quot; cy=&quot;13&quot; r=&quot;4.2&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;59&quot; cy=&quot;13&quot; r=&quot;2.1&quot; fill=&quot;#111&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;60&quot; cy=&quot;12&quot; r=&quot;0.8&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M30,22 Q42,26 54,22&quot; stroke=&quot;&#x27;+finColor+&#x27;&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; opacity=&quot;0.5&quot;/&gt;&#x27;+
      &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }
  function squidSVG(bodyColor, dark, hi, dir, w, h) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(-72,0)&quot;&#x27; : &#x27;&#x27;;
    var id = uid();
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 72 32&quot;&gt;&#x27;+
      &#x27;&lt;defs&gt;&#x27;+
        &#x27;&lt;radialGradient id=&quot;&#x27;+id+&#x27;&quot; cx=&quot;45%&quot; cy=&quot;30%&quot; r=&quot;70%&quot;&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;&#x27;+hi+&#x27;&quot;/&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;55%&quot; stop-color=&quot;&#x27;+bodyColor+&#x27;&quot;/&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;&#x27;+dark+&#x27;&quot;/&gt;&#x27;+
        &#x27;&lt;/radialGradient&gt;&#x27;+
      &#x27;&lt;/defs&gt;&#x27;+
      &#x27;&lt;g&#x27;+flip+&#x27;&gt;&#x27;+
      &#x27;&lt;path d=&quot;M40,14 q10,0 12,6&quot; stroke=&quot;&#x27;+dark+&#x27;&quot; stroke-width=&quot;4&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M40,18 q12,2 14,10&quot; stroke=&quot;&#x27;+dark+&#x27;&quot; stroke-width=&quot;4&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M40,22 q10,4 10,10&quot; stroke=&quot;&#x27;+dark+&#x27;&quot; stroke-width=&quot;4&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;10&quot; y=&quot;24&quot; width=&quot;4&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;&#x27;+dark+&#x27;&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;20&quot; y=&quot;25&quot; width=&quot;4&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;&#x27;+dark+&#x27;&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;30&quot; y=&quot;25&quot; width=&quot;4&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;&#x27;+dark+&#x27;&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;24&quot; cy=&quot;14&quot; rx=&quot;18&quot; ry=&quot;12&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;18&quot; cy=&quot;8&quot; rx=&quot;9&quot; ry=&quot;4&quot; fill=&quot;&#x27;+hi+&#x27;&quot; opacity=&quot;0.5&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;13&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;13&quot; r=&quot;2&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;19&quot; cy=&quot;12&quot; r=&quot;0.7&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;13&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;30&quot; cy=&quot;13&quot; r=&quot;2&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;31&quot; cy=&quot;12&quot; r=&quot;0.7&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }
  function bubbleSVG(w, h) {
    var id = uid();
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 72 32&quot;&gt;&#x27;+
      &#x27;&lt;defs&gt;&lt;radialGradient id=&quot;&#x27;+id+&#x27;&quot; cx=&quot;35%&quot; cy=&quot;30%&quot; r=&quot;70%&quot;&gt;&#x27;+
        &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#ffffff&quot; stop-opacity=&quot;0.9&quot;/&gt;&#x27;+
        &#x27;&lt;stop offset=&quot;55%&quot; stop-color=&quot;#bfe9ff&quot; stop-opacity=&quot;0.55&quot;/&gt;&#x27;+
        &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#5fb4e6&quot; stop-opacity=&quot;0.45&quot;/&gt;&#x27;+
      &#x27;&lt;/radialGradient&gt;&lt;/defs&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;16&quot; r=&quot;11&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot; stroke=&quot;#e6f6ff&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;16&quot; cy=&quot;12&quot; r=&quot;3&quot; fill=&quot;#fff&quot; opacity=&quot;0.9&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;46&quot; cy=&quot;18&quot; r=&quot;8&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot; stroke=&quot;#e6f6ff&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;43&quot; cy=&quot;15&quot; r=&quot;2&quot; fill=&quot;#fff&quot; opacity=&quot;0.85&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;60&quot; cy=&quot;10&quot; r=&quot;5&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot; stroke=&quot;#e6f6ff&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;+
      &#x27;&lt;text x=&quot;34&quot; y=&quot;20&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; opacity=&quot;0.85&quot;&gt;❤&lt;/text&gt;&#x27;+
      &#x27;&lt;/svg&gt;&#x27;;
  }
  function chestSVG(w, h) {
    var id = uid();
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 72 32&quot;&gt;&#x27;+
      &#x27;&lt;defs&gt;&lt;linearGradient id=&quot;&#x27;+id+&#x27;&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;&#x27;+
        &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#b3792f&quot;/&gt;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#6e4413&quot;/&gt;&#x27;+
      &#x27;&lt;/linearGradient&gt;&lt;/defs&gt;&#x27;+
      &#x27;&lt;rect x=&quot;14&quot; y=&quot;14&quot; width=&quot;44&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot; stroke=&quot;#4a2f0c&quot; stroke-width=&quot;2&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M14,15 Q36,1 58,15 Z&quot; fill=&quot;#a9702a&quot; stroke=&quot;#4a2f0c&quot; stroke-width=&quot;2&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M18,12 Q36,3 54,12&quot; fill=&quot;none&quot; stroke=&quot;#e0b25e&quot; stroke-width=&quot;1.5&quot; opacity=&quot;0.7&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;14&quot; y=&quot;18&quot; width=&quot;44&quot; height=&quot;4&quot; fill=&quot;#e6b455&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;14&quot; y=&quot;18&quot; width=&quot;44&quot; height=&quot;1.5&quot; fill=&quot;#ffe7a8&quot; opacity=&quot;0.7&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;33&quot; y=&quot;16&quot; width=&quot;6&quot; height=&quot;9&quot; rx=&quot;1&quot; fill=&quot;#ffe27a&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;34&quot; y=&quot;19&quot; width=&quot;4&quot; height=&quot;3&quot; fill=&quot;#8a5a1e&quot;/&gt;&#x27;+
      &#x27;&lt;/svg&gt;&#x27;;
  }
  function pufferSVG(scale) {
    var id = uid();
    var s = scale || 1;
    var sz = HERO_SIZE * s;
    return &#x27;&lt;svg width=&quot;&#x27;+sz+&#x27;&quot; height=&quot;&#x27;+sz+&#x27;&quot; viewBox=&quot;0 0 38 38&quot;&gt;&#x27;+
      &#x27;&lt;defs&gt;&#x27;+
        &#x27;&lt;radialGradient id=&quot;&#x27;+id+&#x27;&quot; cx=&quot;38%&quot; cy=&quot;32%&quot; r=&quot;70%&quot;&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#fff0b8&quot;/&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;45%&quot; stop-color=&quot;#f6cd5c&quot;/&gt;&#x27;+
          &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#c98a1e&quot;/&gt;&#x27;+
        &#x27;&lt;/radialGradient&gt;&#x27;+
      &#x27;&lt;/defs&gt;&#x27;+
      &#x27;&lt;g&gt;&#x27;+
      &#x27;&lt;polygon points=&quot;19,1 23,9 15,9&quot; fill=&quot;#e8b04b&quot;/&gt;&lt;polygon points=&quot;19,37 23,29 15,29&quot; fill=&quot;#d99a2e&quot;/&gt;&#x27;+
      &#x27;&lt;polygon points=&quot;1,19 9,15 9,23&quot; fill=&quot;#e8b04b&quot;/&gt;&lt;polygon points=&quot;37,19 29,15 29,23&quot; fill=&quot;#d99a2e&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;19&quot; cy=&quot;20&quot; r=&quot;14.5&quot; fill=&quot;#b87d18&quot; opacity=&quot;0.6&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;19&quot; cy=&quot;19&quot; r=&quot;14&quot; fill=&quot;url(#&#x27;+id+&#x27;)&quot; stroke=&quot;#a87413&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;14&quot; cy=&quot;12&quot; rx=&quot;7&quot; ry=&quot;4&quot; fill=&quot;#fff5cf&quot; opacity=&quot;0.55&quot;/&gt;&#x27;+
      // little spikes for texture
      &#x27;&lt;circle cx=&quot;10&quot; cy=&quot;14&quot; r=&quot;1.1&quot; fill=&quot;#c98a1e&quot;/&gt;&lt;circle cx=&quot;14&quot; cy=&quot;10&quot; r=&quot;1.1&quot; fill=&quot;#c98a1e&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;10&quot; r=&quot;1.1&quot; fill=&quot;#c98a1e&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;14&quot; r=&quot;1.1&quot; fill=&quot;#c98a1e&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;10&quot; cy=&quot;24&quot; r=&quot;1.1&quot; fill=&quot;#b87d18&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;24&quot; r=&quot;1.1&quot; fill=&quot;#b87d18&quot;/&gt;&#x27;+

<script>
(function () {

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
