<!doctype html>
<html lang="en">
<head>

<title>🎧 Neon DJ Pony 🦄</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🎧 Neon DJ Pony 🦄</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0018; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff2fd6,#4dfff0,#a26bff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 12px rgba(255,47,214,.4); }
  .instructions { font-size: 16px; color: #b9a9ff; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }
  .layout { display: flex; gap: 10px; width: 100%; }
  .stage-wrap { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; position: relative; }
  #stage { display: block; border-radius: 10px; border: 2px solid #ff2fd6;
           box-shadow: 0 0 22px rgba(255,47,214,.5), inset 0 0 30px rgba(77,255,240,.15); background: #12002b; }
  .panel { width: 250px; flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; }
  .cat { font-size: 12px; font-weight: 700; color: #4dfff0; margin: 1px 0 0; text-transform: uppercase; letter-spacing: 1px; }
  .row { display: flex; gap: 5px; }
  .opt { flex: 1; height: 26px; border: 2px solid #5a3a8a; border-radius: 6px; background: #1c0838; color: #fff;
         font-size: 14px; cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; }
  .opt:hover { border-color: #a26bff; }
  .opt.sel { border-color: #ff2fd6; background: #33104f; box-shadow: 0 0 10px rgba(255,47,214,.6); }
  .controls { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 6px 12px; border-radius: 6px; border: 2px solid #4dfff0; background: #08243a; color: #4dfff0;
         font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #0d3a5c; }
  .btn.on { background: #4dfff0; color: #001; }
  .btn.go { border-color: #ff2fd6; color: #ff2fd6; }
  .btn.go:hover { background: #33104f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🎧 Neon DJ Pony 🦄&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot; id=&quot;instr&quot;&gt;Dress up your DJ pony with the buttons on the right and press Beat for the epic soundtrack. When ready, hit &quot;Go Run!&quot; — then tap Space to sprint faster and jump; reach the finish to win!&lt;/p&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;div class=&quot;stage-wrap&quot;&gt;
      &lt;canvas id=&quot;stage&quot; width=&quot;440&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;controls&quot; id=&quot;controls&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;beatBtn&quot;&gt;▶ Beat: OFF&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;randBtn&quot;&gt;🎲 Randomize&lt;/button&gt;
        &lt;button class=&quot;btn go&quot; id=&quot;goBtn&quot;&gt;🏃 Go Run! →&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot; id=&quot;panel&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var canvas = document.getElementById(&#x27;stage&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var panel = document.getElementById(&#x27;panel&#x27;);
  var beatBtn = document.getElementById(&#x27;beatBtn&#x27;);
  var randBtn = document.getElementById(&#x27;randBtn&#x27;);
  var goBtn = document.getElementById(&#x27;goBtn&#x27;);
  var instr = document.getElementById(&#x27;instr&#x27;);
  var running = false, animId = null, t0 = 0;
  var mode = &#x27;dress&#x27;; // &#x27;dress&#x27; | &#x27;run&#x27; | &#x27;win&#x27;

  var CATS = [
    { key: &#x27;head&#x27;, label: &#x27;Head&#x27;, opts: [&#x27;None&#x27;,&#x27;Headphones&#x27;,&#x27;DJ Cap&#x27;,&#x27;Neon Shades&#x27;] },
    { key: &#x27;neck&#x27;, label: &#x27;Neck&#x27;, opts: [&#x27;None&#x27;,&#x27;Gold Chain&#x27;,&#x27;Glow Scarf&#x27;,&#x27;Bow Tie&#x27;] },
    { key: &#x27;body&#x27;, label: &#x27;Body&#x27;, opts: [&#x27;None&#x27;,&#x27;LED Vest&#x27;,&#x27;Rainbow Wings&#x27;,&#x27;Hoodie&#x27;] },
    { key: &#x27;legs&#x27;, label: &#x27;Legs&#x27;, opts: [&#x27;None&#x27;,&#x27;Glow Boots&#x27;,&#x27;Leg Warmers&#x27;,&#x27;Anklets&#x27;] }
  ];
  var sel = { head: 1, neck: 1, body: 2, legs: 1 };

  function buildPanel() {
    panel.innerHTML = &#x27;&#x27;;
    CATS.forEach(function(cat) {
      var lbl = document.createElement(&#x27;div&#x27;); lbl.className = &#x27;cat&#x27;; lbl.textContent = cat.label;
      panel.appendChild(lbl);
      var row = document.createElement(&#x27;div&#x27;); row.className = &#x27;row&#x27;;
      cat.opts.forEach(function(name, i) {
        var b = document.createElement(&#x27;div&#x27;);
        b.className = &#x27;opt&#x27; + (sel[cat.key] === i ? &#x27; sel&#x27; : &#x27;&#x27;);
        b.textContent = (i === 0 ? &#x27;✕&#x27; : (i));
        b.title = name;
        b.addEventListener(&#x27;click&#x27;, function() {
          if (mode !== &#x27;dress&#x27;) return;
          sel[cat.key] = i; buildPanel(); blip(300 + i * 120);
        });
        row.appendChild(b);
      });
      panel.appendChild(row);
    });
  }

  /* ---------------- AUDIO ---------------- */
  var ac = null, beatOn = false, beatTimer = null, step = 0;
  function getAC() {
    if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
    if (ac &amp;&amp; ac.state === &#x27;suspended&#x27;) ac.resume();
    return ac;
  }
  function blip(freq) {
    var a = getAC(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = 0.05; o.connect(g); g.connect(a.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.12);
    o.stop(a.currentTime + 0.13);
  }
  function kick(time, hard) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(hard?200:160, time);
    o.frequency.exponentialRampToValueAtTime(42, time + 0.15);
    g.gain.setValueAtTime(hard?0.8:0.6, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    o.connect(g); g.connect(ac.destination); o.start(time); o.stop(time + 0.22);
  }
  function snare(time) {
    var bufSize = ac.sampleRate * 0.12;
    var buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i&lt;bufSize;i++) d[i] = (Math.random()*2-1)*(1-i/bufSize);
    var src = ac.createBufferSource(); src.buffer = buf;
    var bp = ac.createBiquadFilter(); bp.type=&#x27;bandpass&#x27;; bp.frequency.value=1800;
    var g = ac.createGain(); g.gain.setValueAtTime(0.35, time);
    g.gain.exponentialRampToValueAtTime(0.001, time+0.12);
    src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(time); src.stop(time+0.13);
  }
  function hat(time, open) {
    var bufSize = ac.sampleRate * (open?0.1:0.03);
    var buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i&lt;bufSize;i++) d[i] = (Math.random()*2-1);
    var src = ac.createBufferSource(); src.buffer = buf;
    var hp = ac.createBiquadFilter(); hp.type=&#x27;highpass&#x27;; hp.frequency.value=8000;
    var g = ac.createGain(); g.gain.setValueAtTime(open?0.14:0.1, time);
    g.gain.exponentialRampToValueAtTime(0.001, time+(open?0.1:0.03));
    src.connect(hp); hp.connect(g); g.connect(ac.destination); src.start(time); src.stop(time+(open?0.11:0.04));
  }
  function lead(time, freq, dur) {
    var o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.value=freq;
    o2.type=&#x27;square&#x27;; o2.frequency.value=freq*2.005;
    var f = ac.createBiquadFilter(); f.type=&#x27;lowpass&#x27;;
    f.frequency.setValueAtTime(2600, time); f.frequency.exponentialRampToValueAtTime(700, time+dur);
    g.gain.setValueAtTime(0.0, time); g.gain.linearRampToValueAtTime(0.13, time+0.01);
    g.gain.exponentialRampToValueAtTime(0.001, time+dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination);
    o.start(time); o2.start(time); o.stop(time+dur+0.02); o2.stop(time+dur+0.02);
  }
  function bass(time, freq) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.value=freq;
    var f = ac.createBiquadFilter(); f.type=&#x27;lowpass&#x27;; f.frequency.value=400;
    g.gain.setValueAtTime(0.22, time); g.gain.exponentialRampToValueAtTime(0.001, time+0.28);
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(time); o.stop(time+0.3);
  }
  // 16-step epic pattern with melody (2-bar feel via step index)
  var LEAD = [784,0,988,0, 1047,988,880,0, 784,0,659,784, 880,0,988,1047];
  var LEAD2= [1047,0,988,880, 784,0,880,988, 659,0,784,0, 587,659,784,880];
  var BASS = [98,98,0,98, 131,0,131,0, 110,110,0,110, 147,0,98,0];
  var bar = 0;
  function scheduleStep() {
    if (!beatOn || !ac) return;
    var time = ac.currentTime + 0.03;
    // drums
    if (step % 4 === 0) kick(time, step===0);
    if (step % 8 === 4) snare(time);
    hat(time, step % 4 === 2);
    // bass
    if (BASS[step]) bass(time, BASS[step]);
    // melody alternates each 2 bars
    var mel = (bar % 4 &lt; 2) ? LEAD : LEAD2;
    if (mel[step]) lead(time, mel[step], 0.16);
    step++;
    if (step &gt;= 16) { step = 0; bar++; }
  }
  var STEP_MS = 130;
  function startBeat() {
    if (!getAC()) return;
    beatOn = true; step = 0; bar = 0;
    beatBtn.textContent = &#x27;⏸ Beat: ON&#x27;; beatBtn.classList.add(&#x27;on&#x27;);
    if (beatTimer) clearInterval(beatTimer);
    beatTimer = setInterval(scheduleStep, STEP_MS);
  }
  function stopBeat() {
    beatOn = false;
    beatBtn.textContent = &#x27;▶ Beat: OFF&#x27;; beatBtn.classList.remove(&#x27;on&#x27;);
    if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
  }
  function jumpSfx() {
    var a = getAC(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type=&#x27;triangle&#x27;; o.frequency.setValueAtTime(400, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, a.currentTime+0.15);
    g.gain.setValueAtTime(0.15, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.2);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.22);
  }
  function winFanfare() {
    var a = getAC(); if (!a) return;
    var notes = [523,659,784,1047,1319];
    notes.forEach(function(n,i){
      var o=a.createOscillator(), g=a.createGain();
      o.type=&#x27;sawtooth&#x27;; o.frequency.value=n;
      var st=a.currentTime+i*0.12;
      g.gain.setValueAtTime(0.0,st); g.gain.linearRampToValueAtTime(0.18,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,st+0.4);
      o.connect(g); g.connect(a.destination); o.start(st); o.stop(st+0.42);
    });
  }
  beatBtn.addEventListener(&#x27;click&#x27;, function() { beatOn ? stopBeat() : startBeat(); });
  randBtn.addEventListener(&#x27;click&#x27;, function() {
    if (mode!==&#x27;dress&#x27;) return;
    CATS.forEach(function(c){ sel[c.key] = Math.floor(Math.random()*4); });
    buildPanel(); blip(600);
  });
  goBtn.addEventListener(&#x27;click&#x27;, function(){ if (mode===&#x27;dress&#x27;) startRun(); });

  /* ---------------- STARS ---------------- */
  var stars = [];
  function initStars() {
    stars = [];
    for (var i=0;i&lt;90;i++) stars.push({ x:Math.random()*440, y:Math.random()*420, r:Math.random()*1.6+0.3, tw:Math.random()*6, sp:Math.random()*0.4+0.1 });
  }

  /* ---------------- RUN STATE ---------------- */
  var runX, runProgress, speed, py, vy, onGround, trail, GOAL = 4200;
  function startRun() {
    mode = &#x27;run&#x27;;
    runProgress = 0; speed = 2; py = 0; vy = 0; onGround = true; trail = [];
    instr.textContent = &#x27;RUN! Tap Space rapidly to sprint faster and jump. Reach the finish line to win — Wow!&#x27;;
    goBtn.textContent = &#x27;↩ Back to Dress-up&#x27;;
    randBtn.style.display = &#x27;none&#x27;;
    if (!beatOn) startBeat();
  }
  function backToDress() {
    mode = &#x27;dress&#x27;;
    instr.textContent = &#x27;Dress up your DJ pony with the buttons on the right and press Beat for the epic soundtrack. When ready, hit &quot;Go Run!&quot; — then tap Space to sprint faster and jump; reach the finish to win!&#x27;;
    goBtn.textContent = &#x27;🏃 Go Run! →&#x27;; goBtn.classList.add(&#x27;go&#x27;);
    randBtn.style.display = &#x27;&#x27;;
  }
  goBtn.addEventListener(&#x27;click&#x27;, function(){ if (mode===&#x27;run&#x27;||mode===&#x27;win&#x27;) { backToDress(); } });

  function tapSpace() {
    if (mode === &#x27;run&#x27;) {
      speed = Math.min(speed + 0.9, 14);
      if (onGround) { vy = -9.5; onGround = false; jumpSfx(); }
    }
  }

  /* ---------------- DRAWING ---------------- */
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function neon(color, blur){ ctx.shadowColor = color; ctx.shadowBlur = blur; }
  function noNeon(){ ctx.shadowBlur = 0; }
  var RAINBOW = [&#x27;#ff2f6d&#x27;,&#x27;#ff9a2f&#x27;,&#x27;#ffe62f&#x27;,&#x27;#4dff6a&#x27;,&#x27;#4dfff0&#x27;,&#x27;#4d7bff&#x27;,&#x27;#a26bff&#x27;];

  function drawStars(el) {
    for (var i=0;i&lt;stars.length;i++){
      var s = stars[i];
      var a = 0.4 + 0.6*Math.abs(Math.sin(el*s.sp + s.tw));
      ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+a+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
  }

  function draw(ts) {
    if (!t0) t0 = ts;
    var el = (ts - t0) / 1000;
    var W = canvas.width, H = canvas.height;
    // galaxy bg
    var bg = ctx.createRadialGradient(W/2,H*0.4,20, W/2,H*0.4,W*0.9);
    bg.addColorStop(0,&#x27;#241056&#x27;); bg.addColorStop(0.5,&#x27;#120033&#x27;); bg.addColorStop(1,&#x27;#06001a&#x27;);
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    drawStars(el);

    if (mode === &#x27;dress&#x27;) drawDress(el);
    else if (mode === &#x27;run&#x27;) { updateRun(); drawRun(el); }
    else if (mode === &#x27;win&#x27;) { drawRun(el); drawBanner(el); }

    if (running) animId = requestAnimationFrame(draw);
  }

  function drawDress(el) {
    var W = canvas.width, H = canvas.height;
    var pulse = beatOn ? (0.5 + 0.5*Math.sin(el*7)) : 0.4;
    // floor grid
    ctx.strokeStyle = &#x27;rgba(77,255,240,&#x27; + (0.12 + 0.13*pulse) + &#x27;)&#x27;; ctx.lineWidth = 1;
    for (var gx=0; gx&lt;=W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,300); ctx.lineTo(W/2+(gx-W/2)*2,H); ctx.stroke(); }
    for (var gy=300; gy&lt;=H; gy+=22){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    // deck
    ctx.fillStyle=&#x27;#1a0a33&#x27;; rr(120,320,200,60,8); ctx.fill();
    ctx.strokeStyle=&#x27;#ff2fd6&#x27;; ctx.lineWidth=2; rr(120,320,200,60,8); ctx.stroke();
    [160,280].forEach(function(cx){
      var ang = el*(beatOn?9:2)+(cx===280?1:0);
      ctx.save(); ctx.translate(cx,350); ctx.rotate(ang);
      ctx.fillStyle=&#x27;#000&#x27;; ctx.beginPath(); ctx.arc(0,0,20,0,7); ctx.fill();
      ctx.strokeStyle=&#x27;#a26bff&#x27;; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,20,0,7); ctx.stroke();
      ctx.fillStyle=&#x27;#4dfff0&#x27;; ctx.fillRect(-2,-18,4,10); ctx.restore();
    });
    var bob = beatOn ? Math.sin(el*7)*4 : Math.sin(el*2)*1.5;
    drawPony(220, 210 + bob, el, false);
  }

  function updateRun() {
    // gravity / jump
    vy += 0.55; py += vy;
    if (py &gt;= 0) { py = 0; vy = 0; onGround = true; }
    // natural decel then move
    speed = Math.max(2, speed - 0.045);
    runProgress += speed;
    // rainbow trail
    var tx = 150, ty = 300 + py;
    trail.push({ x: tx, y: ty, life: 1, c: RAINBOW[Math.floor((runProgress/12)%RAINBOW.length)] });
    if (trail.length &gt; 60) trail.shift();
    for (var i=0;i&lt;trail.length;i++) trail[i].life -= 0.02;
    if (runProgress &gt;= GOAL) { mode = &#x27;win&#x27;; winFanfare(); }
  }

  function drawRun(el) {
    var W = canvas.width, H = canvas.height;
    // moving ground
    ctx.fillStyle = &#x27;#1a0a33&#x27;; ctx.fillRect(0, 320, W, H-320);
    ctx.strokeStyle = &#x27;rgba(255,47,214,0.5)&#x27;; ctx.lineWidth = 2;
    var off = -(runProgress % 60);
    for (var gx=off; gx&lt;=W; gx+=60){ ctx.beginPath(); ctx.moveTo(gx,320); ctx.lineTo(gx,H); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0,320); ctx.lineTo(W,320); ctx.stroke();
    // finish line if near
    var fx = 150 + (GOAL - runProgress);
    if (fx &lt; W + 40) {
      for (var y=200;y&lt;320;y+=16){
        ctx.fillStyle = (Math.floor(y/16)%2===0)?&#x27;#fff&#x27;:&#x27;#000&#x27;;
        ctx.fillRect(fx, y, 14, 16);
      }
      neon(&#x27;#ffe62f&#x27;,14); ctx.fillStyle=&#x27;#ffe62f&#x27;; ctx.font=&#x27;bold 14px system-ui&#x27;;
      ctx.fillText(&#x27;FINISH&#x27;, fx-14, 190); noNeon();
    }
    // rainbow trail
    for (var i=0;i&lt;trail.length;i++){
      var t = trail[i]; if (t.life&lt;=0) continue;
      neon(t.c, 10); ctx.fillStyle = t.c; ctx.globalAlpha = Math.max(0,t.life);
      var sz = 6*t.life+2;
      ctx.fillRect(t.x - (trail.length-i)*speed*0.4 - 40, t.y+20, sz, sz);
      ctx.globalAlpha = 1; noNeon();
    }
    // progress bar
    var pct = Math.min(1, runProgress/GOAL);
    ctx.fillStyle = &#x27;rgba(255,255,255,0.15)&#x27;; rr(20,14,W-40,10,5); ctx.fill();
    var grad = ctx.createLinearGradient(20,0,W-20,0);
    grad.addColorStop(0,&#x27;#ff2f6d&#x27;); grad.addColorStop(0.5,&#x27;#4dfff0&#x27;); grad.addColorStop(1,&#x27;#a26bff&#x27;);
    ctx.fillStyle = grad; rr(20,14,(W-40)*pct,10,5); ctx.fill();
