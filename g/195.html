<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON DROP</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>NEON DROP</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #eee; overflow: hidden;
    background:
      radial-gradient(circle at 20% 30%, rgba(120,60,220,0.35), transparent 45%),
      radial-gradient(circle at 80% 20%, rgba(0,180,220,0.30), transparent 45%),
      radial-gradient(circle at 60% 85%, rgba(220,40,140,0.30), transparent 45%),
      linear-gradient(160deg, #0a0a16, #171730 60%, #0d1226);
  }
  /* animated grid + orbs backdrop */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg .grid {
    position: absolute; inset: -50%;
    background-image:
      linear-gradient(rgba(90,120,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,120,255,0.15) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(400px) rotateX(55deg);
    animation: gridmove 6s linear infinite;
  }
  @keyframes gridmove { from { background-position: 0 0; } to { background-position: 0 40px; } }
  .orb { position: absolute; border-radius: 50%; filter: blur(30px); opacity: 0.55; }
  .orb1 { width: 220px; height: 220px; background: #7a3cff; top: 8%; left: -6%; animation: float1 14s ease-in-out infinite; }
  .orb2 { width: 260px; height: 260px; background: #00c8dc; bottom: -8%; right: -6%; animation: float2 18s ease-in-out infinite; }
  .orb3 { width: 180px; height: 180px; background: #e6289b; top: 40%; right: 20%; animation: float3 12s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-40px);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,50px);} }

  .game { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 12px rgba(120,180,255,0.8); }
  .instructions { font-size: 16px; color: #cdd; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 18px; font-size: 18px; align-items: center; background: rgba(20,20,40,0.55); padding: 4px 12px; border-radius: 10px; backdrop-filter: blur(4px); }
  .hud b { color: #6cf; }
  .mute { cursor: pointer; font-size: 18px; background: #23233a; border: 1px solid #44446a; color: #eee; border-radius: 6px; padding: 2px 8px; }
  .main { display: flex; gap: 14px; align-items: flex-start; }
  .field { position: relative; width: 240px; height: 384px; background: rgba(18,18,32,0.72); border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 2px rgba(120,140,255,0.5), 0 0 24px rgba(80,120,255,0.4); backdrop-filter: blur(2px); }
  .side { display: flex; flex-direction: column; gap: 10px; width: 130px; }
  .panel { background: rgba(20,20,40,0.6); border-radius: 8px; padding: 8px; box-shadow: inset 0 0 0 2px rgba(120,140,255,0.35); backdrop-filter: blur(3px); }
  .panel h2 { margin: 0 0 6px; font-size: 13px; color: #99a; text-transform: uppercase; letter-spacing: 1px; }
  .preview { position: relative; width: 96px; height: 72px; margin: 0 auto; }
  .powerlist { font-size: 13px; line-height: 1.5; color: #ccd; }
  .powerlist span { font-size: 16px; }
  .block { position: absolute; box-sizing: border-box; border-radius: 3px; }
  .pw { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 16px; border-radius: 4px; background: #fff2; box-shadow: 0 0 6px #fff8; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000a; font-size: 22px; font-weight: 700; color: #fff; text-align: center; border-radius: 8px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;bg&quot;&gt;
  &lt;div class=&quot;grid&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;orb orb1&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;orb orb2&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;orb orb3&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON DROP&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, soft-drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;, and hard-drop with &lt;strong&gt;Space&lt;/strong&gt;. Clear rows to score and grab glowing power-ups by landing a piece on them.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Level: &lt;b id=&quot;level&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Lines: &lt;b id=&quot;lines&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;button class=&quot;mute&quot; id=&quot;mute&quot;&gt;🔊&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div id=&quot;overlay&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;h2&gt;Next&lt;/h2&gt;
        &lt;div class=&quot;preview&quot; id=&quot;preview&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;h2&gt;Power-ups&lt;/h2&gt;
        &lt;div class=&quot;powerlist&quot;&gt;
          &lt;div&gt;&lt;span&gt;🐢&lt;/span&gt; Slow-mo&lt;/div&gt;
          &lt;div&gt;&lt;span&gt;💣&lt;/span&gt; Bomb 3×3&lt;/div&gt;
          &lt;div&gt;&lt;span&gt;🧹&lt;/span&gt; Clear rows&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var preview = document.getElementById(&#x27;preview&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var linesEl = document.getElementById(&#x27;lines&#x27;);
  var muteBtn = document.getElementById(&#x27;mute&#x27;);

  /* ---------------- AUDIO ---------------- */
  var actx = null, masterGain = null, muted = false;
  function audio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = actx.createGain();
        masterGain.gain.value = muted ? 0 : 0.8;
        masterGain.connect(actx.destination);
      } catch (_) { actx = null; }
    }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
    return actx;
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (!audio() || muted) return;
    var t = actx.currentTime;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = type || &#x27;square&#x27;;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  var sfx = {
    move:   function () { beep(220, 0.05, &#x27;square&#x27;, 0.12); },
    rotate: function () { beep(380, 0.07, &#x27;triangle&#x27;, 0.15); },
    drop:   function () { beep(160, 0.12, &#x27;sawtooth&#x27;, 0.2, 60); },
    lock:   function () { beep(120, 0.06, &#x27;square&#x27;, 0.12); },
    clear:  function () { beep(520, 0.09, &#x27;square&#x27;, 0.22); setTimeout(function(){beep(660,0.09,&#x27;square&#x27;,0.22);},80); setTimeout(function(){beep(880,0.14,&#x27;square&#x27;,0.22);},160); },
    power:  function () { beep(660, 0.08, &#x27;triangle&#x27;, 0.25, 990); setTimeout(function(){beep(1320,0.12,&#x27;triangle&#x27;,0.22);},90); },
    level:  function () { beep(440,0.1,&#x27;square&#x27;,0.25); setTimeout(function(){beep(587,0.1,&#x27;square&#x27;,0.25);},110); setTimeout(function(){beep(880,0.2,&#x27;square&#x27;,0.25);},220); },
    over:   function () { beep(330,0.2,&#x27;sawtooth&#x27;,0.25,220); setTimeout(function(){beep(220,0.25,&#x27;sawtooth&#x27;,0.25,110);},200); setTimeout(function(){beep(110,0.4,&#x27;sawtooth&#x27;,0.25,55);},420); }
  };

  /* ---------------- BACKGROUND MUSIC ---------------- */
  var musicTimer = null, musicStep = 0;
  var melody = [
    659,0,587,0,523,0,587,0, 659,659,659,0, 587,587,0,0,
    659,0,784,0,880,0,784,0, 659,0,587,0,523,0,0,0
  ];
  var bass = [
    131,0,0,0, 165,0,0,0, 196,0,0,0, 165,0,0,0,
    131,0,0,0, 196,0,0,0, 220,0,0,0, 196,0,0,0
  ];
  function playMusicNote() {
    if (!audio() || muted) { musicStep = (musicStep + 1) % melody.length; return; }
    var mf = melody[musicStep], bf = bass[musicStep];
    var t = actx.currentTime;
    if (mf) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;triangle&#x27;; o.frequency.value = mf;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.2);
    }
    if (bf) {
      var o2 = actx.createOscillator(), g2 = actx.createGain();
      o2.type = &#x27;sawtooth&#x27;; o2.frequency.value = bf;
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o2.connect(g2); g2.connect(masterGain); o2.start(t); o2.stop(t + 0.26);
    }
    musicStep = (musicStep + 1) % melody.length;
  }
  function startMusic() {
    if (musicTimer) return;
    musicStep = 0;
    musicTimer = setInterval(playMusicNote, 165);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  muteBtn.addEventListener(&#x27;click&#x27;, function () {
    muted = !muted;
    muteBtn.textContent = muted ? &#x27;🔇&#x27; : &#x27;🔊&#x27;;
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.8;
  });

  /* ---------------- GAME ---------------- */
  var SHAPES = {
    I: { color: &#x27;#3ce6e6&#x27;, rots: [
      [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]] ] },
    O: { color: &#x27;#f2d94e&#x27;, rots: [ [[1,0],[2,0],[1,1],[2,1]] ] },
    T: { color: &#x27;#c264f0&#x27;, rots: [
      [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },
    S: { color: &#x27;#5ef07a&#x27;, rots: [
      [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]] ] },
    Z: { color: &#x27;#f0604e&#x27;, rots: [
      [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]] ] },
    J: { color: &#x27;#5a7cf0&#x27;, rots: [
      [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] },
    L: { color: &#x27;#f0983a&#x27;, rots: [
      [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] }
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  var running = false, dropId = null;
  var grid = [], piece = null, next = null;
  var score = 0, lines = 0, level = 1;
  var powerups = [];
  var slowUntil = 0;

  function baseSpeed() {
    var s = 620 - (level - 1) * 55;
    return Math.max(110, s);
  }
  function curSpeed() {
    return Date.now() &lt; slowUntil ? Math.max(baseSpeed(), 750) : baseSpeed();
  }
  function restartTimer() {
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, curSpeed());
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }
  function makePiece(type) { return { type: type, rot: 0, x: 3, y: 0 }; }

  function cellsOf(p) {
    var cells = SHAPES[p.type].rots[p.rot % SHAPES[p.type].rots.length];
    var out = [];
    for (var i = 0; i &lt; cells.length; i++)
      out.push({ x: p.x + cells[i][0], y: p.y + cells[i][1] });
    return out;
  }

  function collides(p) {
    var cells = cellsOf(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    piece = makePiece(next ? next.type : randType());
    next = makePiece(randType());
    drawPreview();
    if (collides(piece)) return false;
    return true;
  }

  function collectPowerAt(x, y) {
    for (var i = 0; i &lt; powerups.length; i++) {
      if (powerups[i].x === x &amp;&amp; powerups[i].y === y) {
        var k = powerups[i].kind;
        powerups.splice(i, 1);
        applyPower(k);
        return;
      }
    }
  }

  function applyPower(kind) {
    sfx.power();
    if (kind === &#x27;🐢&#x27;) {
      slowUntil = Date.now() + 8000;
      restartTimer();
      flash(&#x27;SLOW-MO!&#x27;);
    } else if (kind === &#x27;💣&#x27;) {
      var cx = Math.floor(COLS / 2), cy = ROWS - 2;
      for (var r = cy - 1; r &lt;= cy + 1; r++)
        for (var c = cx - 1; c &lt;= cx + 1; c++)
          if (r &gt;= 0 &amp;&amp; r &lt; ROWS &amp;&amp; c &gt;= 0 &amp;&amp; c &lt; COLS) grid[r][c] = null;
      score += 5; scoreEl.textContent = score;
      flash(&#x27;BOOM!&#x27;);
    } else if (kind === &#x27;🧹&#x27;) {
      grid.splice(ROWS - 2, 2);
      grid.unshift([]); grid.unshift([]);
      for (var i = 0; i &lt; 2; i++) {
        var row = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) row.push(null);
        grid[i] = row;
      }
      score += 8; scoreEl.textContent = score;
      flash(&#x27;SWEEP!&#x27;);
    }
  }

  function flash(txt) {
    overlay.textContent = txt;
    overlay.style.display = &#x27;flex&#x27;;
    setTimeout(function () { if (running) overlay.style.display = &#x27;none&#x27;; }, 700);
  }

  function lockPiece() {
    var cells = cellsOf(piece);
    var color = SHAPES[piece.type].color;
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = color;
      collectPowerAt(c.x, c.y);
    }
    piece = null;
    sfx.lock();
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      var pts = [0, 10, 25, 45, 70][cleared] || 70;
      score += pts;
      lines += cleared;
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      sfx.clear();
      var nl = Math.floor(lines / 5) + 1;
      if (nl &gt; level) { level = nl; levelEl.textContent = level; restartTimer(); sfx.level(); }
    }
  }

  function maybeSpawnPowerup() {
    if (powerups.length &gt;= 2) return;
    if (Math.random() &gt; 0.35) return;
    var kinds = [&#x27;🐢&#x27;, &#x27;💣&#x27;, &#x27;🧹&#x27;];
    for (var tries = 0; tries &lt; 12; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = 4 + Math.floor(Math.random() * 8);
      if (!grid[y][x] &amp;&amp; !powerAt(x, y)) {
        powerups.push({ x: x, y: y, kind: kinds[Math.floor(Math.random() * 3)] });
        return;
      }
    }
  }
  function powerAt(x, y) {
    for (var i = 0; i &lt; powerups.length; i++)
      if (powerups[i].x === x &amp;&amp; powerups[i].y === y) return true;
    return false;
  }

  function drawBlock(parent, cx, cy, color, cell) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * cell) + &#x27;px&#x27;;
    el.style.top = (cy * cell) + &#x27;px&#x27;;
    el.style.width = cell + &#x27;px&#x27;;
    el.style.height = cell + &#x27;px&#x27;;
    el.style.background = color;
    el.style.boxShadow = &#x27;0 0 5px &#x27; + color + &#x27;, inset 0 0 4px #fff6&#x27;;
    parent.appendChild(el);
  }

  function paint() {
    var kids = field.querySelectorAll(&#x27;.block, .pw&#x27;);
    for (var i = 0; i &lt; kids.length; i++) kids[i].remove();
    for (var r = 0; r &lt; ROWS; r++)
      for (var c = 0; c &lt; COLS; c++)
        if (grid[r][c]) drawBlock(field, c, r, grid[r][c], CELL);
    for (var p = 0; p &lt; powerups.length; p++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;pw&#x27;;
      el.style.left = (powerups[p].x * CELL) + &#x27;px&#x27;;
      el.style.top = (powerups[p].y * CELL) + &#x27;px&#x27;;
      el.style.width = CELL + &#x27;px&#x27;;
      el.style.height = CELL + &#x27;px&#x27;;
      el.textContent = powerups[p].kind;
      field.appendChild(el);
    }
    if (piece) {
      var cells = cellsOf(piece);
      var color = SHAPES[piece.type].color;
      for (var k = 0; k &lt; cells.length; k++)
        if (cells[k].y &gt;= 0) drawBlock(field, cells[k].x, cells[k].y, color, CELL);
    }
  }

  function drawPreview() {
    preview.innerHTML = &#x27;&#x27;;
