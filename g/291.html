<title>Paddle ball</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }

  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Paddle ball</b> &middot; Game 291 &middot; Amateur producer &middot; Basic game: Paddle and ball</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .stats { display: flex; gap: 22px; font-size: 20px; color: #555; margin: 0; }
  .stats .streak { color: #16a34a; font-weight: 600; }
  .stats .speed { color: #2563eb; font-weight: 600; }
  .layout { display: flex; gap: 14px; align-items: flex-start; }
  .field { position: relative; width: 470px; height: 350px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .missions { width: 190px; background: #f8f8f8; border: 1px solid #e2e2e2; border-radius: 8px; padding: 10px; box-sizing: border-box; }
  .missions h2 { margin: 0 0 8px; font-size: 17px; }
  .mission { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; margin-bottom: 10px; color: #444; line-height: 1.3; }
  .mission .box { flex-shrink: 0; width: 18px; height: 18px; border: 2px solid #bbb; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: white; margin-top: 1px; }
  .mission.done { color: #16a34a; text-decoration: line-through; }
  .mission.done .box { background: #16a34a; border-color: #16a34a; }
  .paddle { position: absolute; width: 100px; height: 14px; background: #555; border-radius: 4px; bottom: 10px; transition: background 0.2s; }
  .ball { position: absolute; width: 16px; height: 16px; background: #555; border-radius: 50%; transition: background 0.2s; }
  .paddle.hot { background: #16a34a; }
  .ball.hot { background: #16a34a; }
  .popup {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.6);
    background: #16a34a; color: white; padding: 14px 20px; border-radius: 10px;
    font-size: 18px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-width: 85%;
  }
  .popup.show { animation: pop 1.6s ease-out forwards; }
  .popup.mission { background: #d97706; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    30% { transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Paddle ball&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys to keep hitting the ball. Build streaks, speed up your paddle, and complete the three missions on the right!&lt;/p&gt;
  &lt;div class=&quot;stats&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;streak&quot;&gt;Streak: &lt;span id=&quot;streak&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;speed&quot;&gt;Speed: &lt;span id=&quot;speed&quot;&gt;100&lt;/span&gt;%&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;popup&quot; id=&quot;popup&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;missions&quot;&gt;
      &lt;h2&gt;Missions&lt;/h2&gt;
      &lt;div class=&quot;mission&quot; id=&quot;m1&quot;&gt;&lt;span class=&quot;box&quot;&gt;&lt;/span&gt;&lt;span&gt;Reach a 7-hit streak without missing&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;mission&quot; id=&quot;m2&quot;&gt;&lt;span class=&quot;box&quot;&gt;&lt;/span&gt;&lt;span&gt;Hit the ball 10 times total&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;mission&quot; id=&quot;m3&quot;&gt;&lt;span class=&quot;box&quot;&gt;&lt;/span&gt;&lt;span&gt;Boost paddle speed to 106%&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 470, FIELD_H = 350;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, BASE_PADDLE_SPEED = 6;
  var BALL_SIZE = 14;
  var BALL_SPEED = 4.0;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  var streak = 0;
  var paddleSpeed = BASE_PADDLE_SPEED;
  var speedMultiplier = 1.0;
  var hotTimer = null;
  var missions = { m1: false, m2: false, m3: false };
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);
  var popup = document.getElementById(&#x27;popup&#x27;);
  var m1El = document.getElementById(&#x27;m1&#x27;);
  var m2El = document.getElementById(&#x27;m2&#x27;);
  var m3El = document.getElementById(&#x27;m3&#x27;);

  var MESSAGES = [
    &quot;You hit this 5 times in a row! Let&#x27;s keep it up! 🎉&quot;,
    &quot;10 in a row — you&#x27;re on fire! 🔥&quot;,
    &quot;15 straight hits! Unstoppable! 💪&quot;,
    &quot;20 in a row! Incredible streak! ⭐&quot;,
    &quot;25 hits! You&#x27;re a legend! 👑&quot;
  ];

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function showPopup(text, isMission) {
    popup.textContent = text;
    popup.classList.remove(&#x27;show&#x27;, &#x27;mission&#x27;);
    if (isMission) popup.classList.add(&#x27;mission&#x27;);
    void popup.offsetWidth;
    popup.classList.add(&#x27;show&#x27;);
  }

  function showStreakPopup(streakVal) {
    var idx = Math.min(Math.floor(streakVal / 5) - 1, MESSAGES.length - 1);
    showPopup(MESSAGES[idx], false);
  }

  function flashHot() {
    paddle.classList.add(&#x27;hot&#x27;);
    ball.classList.add(&#x27;hot&#x27;);
    if (hotTimer) clearTimeout(hotTimer);
    hotTimer = setTimeout(function () {
      paddle.classList.remove(&#x27;hot&#x27;);
      ball.classList.remove(&#x27;hot&#x27;);
    }, 1400);
  }

  function updateSpeedDisplay() {
    speedEl.textContent = Math.round(speedMultiplier * 100);
  }

  function completeMission(key, el, text) {
    if (missions[key]) return;
    missions[key] = true;
    el.classList.add(&#x27;done&#x27;);
    el.querySelector(&#x27;.box&#x27;).textContent = &#x27;✓&#x27;;
    showPopup(text, true);
  }

  function checkMissions() {
    if (!missions.m1 &amp;&amp; streak &gt;= 7) {
      completeMission(&#x27;m1&#x27;, m1El, &quot;Mission complete: 7-hit streak! 🏅&quot;);
      return;
    }
    if (!missions.m2 &amp;&amp; score &gt;= 10) {
      completeMission(&#x27;m2&#x27;, m2El, &quot;Mission complete: 10 hits! 🏅&quot;);
      return;
    }
    if (!missions.m3 &amp;&amp; Math.round(speedMultiplier * 100) &gt;= 106) {
      completeMission(&#x27;m3&#x27;, m3El, &quot;Mission complete: 106% speed! 🏅&quot;);
      return;
    }
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= paddleSpeed;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += paddleSpeed;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      streak += 1;
      scoreEl.textContent = score;
      streakEl.textContent = streak;
      if (score % 2 === 0) {
        speedMultiplier *= 1.02;
        paddleSpeed = BASE_PADDLE_SPEED * speedMultiplier;
        updateSpeedDisplay();
      }
      if (streak % 5 === 0) {
        showStreakPopup(streak);
        flashHot();
      }
      checkMissions();
    }
    if (ballY &gt;= FIELD_H) {
      streak = 0;
      streakEl.textContent = streak;
      resetBall();
    }
    paint();
    animId = requestAnimationFrame(tick);
  }

  function resetMissions() {
    missions = { m1: false, m2: false, m3: false };
    [m1El, m2El, m3El].forEach(function (el) {
      el.classList.remove(&#x27;done&#x27;);
      el.querySelector(&#x27;.box&#x27;).textContent = &#x27;&#x27;;
    });
  }

  function startGame() {
    if (running) return;
    score = 0;
    streak = 0;
    speedMultiplier = 1.0;
    paddleSpeed = BASE_PADDLE_SPEED;
    scoreEl.textContent = &#x27;0&#x27;;
    streakEl.textContent = &#x27;0&#x27;;
    updateSpeedDisplay();
    resetMissions();
    paddle.classList.remove(&#x27;hot&#x27;);
    ball.classList.remove(&#x27;hot&#x27;);
    popup.classList.remove(&#x27;show&#x27;);
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  updateSpeedDisplay();
  paint();
&lt;/script&gt;

<script>

  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
