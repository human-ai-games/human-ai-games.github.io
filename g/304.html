&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Ninja Crossing &lt;span class=&quot;kanji&quot;&gt;忍者横断&lt;/span&gt;&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to move the ninja 🥷 one step at a time, dodging the rolling sushi, fans and koi. Reach the golden torii gate ⛩️ five times to win — one hit ends the round!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;得点 Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; / &lt;span id=&quot;goalTotal&quot;&gt;5&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
  var CELL = 50;
  var COLS = 12;
  var LANES = 5;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL;
  var OB_W = CELL, OB_H = CELL;
  var OB_EMOJIS = [&#x27;🍣&#x27;,&#x27;🪭&#x27;,&#x27;🎏&#x27;,&#x27;🍥&#x27;,&#x27;🏮&#x27;];
  var WIN_SCORE = 5;
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var petals = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var overBig = document.getElementById(&#x27;overBig&#x27;);
  var overSub = document.getElementById(&#x27;overSub&#x27;);
  var heroEl = null;

  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.15, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }
  function fanfare() {
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (f, i) { setTimeout(function () { beep(f, 0.25, &#x27;triangle&#x27;); }, i * 130); });
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OB_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.9 + (i % 3) * 0.5;
      var emoji = OB_EMOJIS[i % OB_EMOJIS.length];
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 33) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.textContent = emoji;
        el.style.width = OB_W + &#x27;px&#x27;;
        el.style.height = OB_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function buildPetals(count) {
    petals.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    petals = [];
    var n = count || 8;
    for (var i = 0; i &lt; n; i++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;petal&#x27;;
      el.textContent = &#x27;🌸&#x27;;
      field.appendChild(el);
      petals.push({ el: el, x: Math.random() * FIELD_W, y: Math.random() * FIELD_H,
        vy: 0.3 + Math.random() * 0.5, vx: (Math.random() - 0.5) * 0.4 });
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🥷&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    heroEl.style.left = (hero.col * CELL) + &#x27;px&#x27;;
    heroEl.style.top = (hero.row * CELL) + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OB_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OB_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    for (var p = 0; p &lt; petals.length; p++) {
      var pt = petals[p];
      pt.y += pt.vy; pt.x += pt.vx;
      if (pt.y &gt; FIELD_H) { pt.y = -10; pt.x = Math.random() * FIELD_W; }
      pt.el.style.left = pt.x + &#x27;px&#x27;;
      pt.el.style.top = pt.y + &#x27;px&#x27;;
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL, hy = hero.row * CELL;
      var pad = 10;
      var lane = lanes[laneIdx];
      for (var k = 0; k &lt; lane.obstacles.length; k++) {
        var o2 = lane.obstacles[k];
        if (hx + pad &lt; o2.x + OB_W - pad &amp;&amp; hx + HERO_SIZE - pad &gt; o2.x + pad &amp;&amp;
            hy &lt; lane.y + OB_H &amp;&amp; hy + HERO_SIZE &gt; lane.y) {
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    beep(440, 0.05, &#x27;square&#x27;);
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      beep(880, 0.15, &#x27;triangle&#x27;);
      if (score &gt;= WIN_SCORE) { winGame(); return; }
      resetHero();
    }
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    overlay.classList.remove(&#x27;win&#x27;);
    overBig.textContent = &#x27;やられた！ &#x27; + score + &#x27;点&#x27;;
    overSub.textContent = &#x27;Press Start below to try again&#x27;;
    overlay.classList.add(&#x27;show&#x27;);
    beep(180, 0.4, &#x27;sawtooth&#x27;);
  }

  function winGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    buildPetals(30);
    // let petals settle a moment then keep raining via a light loop
    var rainT = 0;
    function rain() {
      for (var p = 0; p &lt; petals.length; p++) {
        var pt = petals[p];
        pt.y += pt.vy + 1.2; pt.x += pt.vx;
        if (pt.y &gt; FIELD_H) { pt.y = -10; pt.x = Math.random() * FIELD_W; }
        pt.el.style.left = pt.x + &#x27;px&#x27;;
        pt.el.style.top = pt.y + &#x27;px&#x27;;
      }
      rainT++;
      if (rainT &lt; 180 &amp;&amp; !running) requestAnimationFrame(rain);
    }
    requestAnimationFrame(rain);
    overlay.classList.add(&#x27;win&#x27;);
    overBig.textContent = &#x27;勝利！ You Win! 🎉&#x27;;
    overSub.textContent = &#x27;All &#x27; + WIN_SCORE + &#x27; crossings complete — press Start to play again&#x27;;
    overlay.classList.add(&#x27;show&#x27;);
    fanfare();
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    overlay.classList.remove(&#x27;win&#x27;);
    buildLanes();
    buildPetals(8);
    makeHero();
    resetHero();
    running = true;
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint before Start.
  buildLanes();
  buildPetals(8);
  makeHero();
  paintHero();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
