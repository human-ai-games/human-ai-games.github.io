    { n: 3, shuffle: 12 },
    { n: 3, shuffle: 25 },
    { n: 3, shuffle: 60 },
    { n: 3, shuffle: 120 },
    { n: 4, shuffle: 40 },
    { n: 4, shuffle: 90 },
    { n: 4, shuffle: 160 },
    { n: 4, shuffle: 260 },
    { n: 5, shuffle: 120 },

  var GAP = 8;

  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var ovBig = document.getElementById(&#x27;ovBig&#x27;);

  var levelEl = document.getElementById(&#x27;level&#x27;);
  var movesEl = document.getElementById(&#x27;moves&#x27;);

  var levelIdx = 0;
  var solvedCount = 0;
  var moves = 0;
  var n = 3;
  var tiles = [];        // grid values, length n*n, 0 = empty
  var tileEls = {};      // value -&gt; element
  var tileSize = 0;
  var busy = false;      // block input during transitions

    if (c &gt; 0) res.push(idx(r, c - 1));
    if (c &lt; n - 1) res.push(idx(r, c + 1));

  function buildBoard() {

    board.style.height = BOARD_PX + &#x27;px&#x27;;
    board.innerHTML = &#x27;&#x27;;
    tileEls = {};
    tileSize = (BOARD_PX - GAP * (n + 1)) / n;
    var fontSz = Math.max(16, Math.round(tileSize * 0.4));
    for (var v = 1; v &lt; n * n; v++) {

      el.className = &#x27;tile&#x27;;
      el.textContent = v;
      el.style.width = tileSize + &#x27;px&#x27;;
      el.style.height = tileSize + &#x27;px&#x27;;
      el.style.fontSize = fontSz + &#x27;px&#x27;;
      (function (val) {
        el.addEventListener(&#x27;click&#x27;, function () { tryMove(val); });
      })(v);
      board.appendChild(el);
      tileEls[v] = el;

  function positionTiles() {
    for (var i = 0; i &lt; tiles.length; i++) {

      var el = tileEls[v];
      var r = rowOf(i), c = colOf(i);
      el.style.left = (GAP + c * (tileSize + GAP)) + &#x27;px&#x27;;
      el.style.top = (GAP + r * (tileSize + GAP)) + &#x27;px&#x27;;
      el.classList.toggle(&#x27;solved&#x27;, v === i + 1);

  function tryMove(val) {

    var pos = tiles.indexOf(val);
    var e = emptyIndex();
    if (neighborsOfEmpty().indexOf(pos) === -1) return; // not adjacent

    tiles[pos] = 0;
    moves++;

  function totalDistance(arr) {

      tiles[e] = tiles[pick];
      tiles[pick] = 0;

  }

    var colors = [&#x27;#ffd479&#x27;,&#x27;#8ff0a4&#x27;,&#x27;#8fd0ff&#x27;,&#x27;#f78fb3&#x27;,&#x27;#c58fff&#x27;];

        var dur = 900 + Math.random() * 900;

          { transform: &#x27;translateY(&#x27; + fall + &#x27;px) rotate(&#x27; + (360 + Math.random()*360) + &#x27;deg)&#x27;, opacity: 0 }
        ], { duration: dur, easing: &#x27;ease-in&#x27; });
        setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, dur);
      })();
    }
  }

  function startGame() {
    levelIdx = 0;
    solvedCount = 0;
    solvedEl.textContent = &#x27;0&#x27;;
    running = true;
    busy = false;
    loadLevel(0);
  }

  function stopGame() {
    running = false;
    if (state === &#x27;playing&#x27;) {
      state = &#x27;idle&#x27;;
      hintBtn.disabled = true;
      shuffleBtn.disabled = true;

    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
