&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Paddle ball&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys. Each time the star touches the paddle, it bursts into sparkles and you score a point. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;

        &lt;/radialGradient&gt;

          &lt;stop offset=&quot;0%&quot; stop-color=&quot;rgba(255,249,220,0.5)&quot;/&gt;

      &lt;circle cx=&quot;500&quot; cy=&quot;90&quot; r=&quot;42&quot; fill=&quot;url(#moonGrad)&quot;/&gt;
      &lt;circle cx=&quot;486&quot; cy=&quot;78&quot; r=&quot;9&quot; fill=&quot;rgba(210,195,140,0.5)&quot;/&gt;
      &lt;circle cx=&quot;514&quot; cy=&quot;98&quot; r=&quot;6&quot; fill=&quot;rgba(210,195,140,0.4)&quot;/&gt;

      &lt;path d=&quot;M0 420 L0 380 Q160 340 340 375 Q480 400 620 370 L620 420 Z&quot; fill=&quot;rgba(40,25,55,0.7)&quot;/&gt;

    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 22;
  var BALL_SPEED = 4.0;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var ballAngle = 0;
  var score = 0;
  var flashTimer = 0;
  var particles = [];
  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // build background stars
  (function buildStars() {
    var g = document.getElementById(&#x27;stars&#x27;);
    var svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
    for (var i = 0; i &lt; 60; i++) {
      var x = Math.random() * 620;
      var y = Math.random() * 300;
      var r = Math.random() * 1.3 + 0.4;
      var c = document.createElementNS(svgNS, &#x27;circle&#x27;);
      c.setAttribute(&#x27;cx&#x27;, x.toFixed(1));
      c.setAttribute(&#x27;cy&#x27;, y.toFixed(1));
      c.setAttribute(&#x27;r&#x27;, r.toFixed(1));
      c.setAttribute(&#x27;fill&#x27;, &#x27;#ffffff&#x27;);
      c.setAttribute(&#x27;class&#x27;, &#x27;tw&#x27;);
      c.style.animationDelay = (Math.random() * 3).toFixed(2) + &#x27;s&#x27;;
      g.appendChild(c);
    }
  })();

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
    ball.style.transform = &#x27;rotate(&#x27; + ballAngle + &#x27;deg)&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function spawnBurst(cx, cy) {
    var glow = document.createElement(&#x27;div&#x27;);
    glow.className = &#x27;burst&#x27;;
    glow.style.left = cx + &#x27;px&#x27;;
    glow.style.top = cy + &#x27;px&#x27;;
    field.appendChild(glow);
    particles.push({ el: glow, x: cx, y: cy, vx: 0, vy: 0, life: 1, decay: 0.04, scale: 1, grow: 0.35, glow: true });

    var count = 12;
    var stars = [&#x27;★&#x27;, &#x27;✦&#x27;, &#x27;✧&#x27;, &#x27;⭐&#x27;];
    for (var i = 0; i &lt; count; i++) {
      var ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      var spd = 2.5 + Math.random() * 3;
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;spark&#x27;;
      el.textContent = stars[i % stars.length];
      el.style.left = cx + &#x27;px&#x27;;
      el.style.top = cy + &#x27;px&#x27;;
      el.style.fontSize = (10 + Math.random() * 10) + &#x27;px&#x27;;
      field.appendChild(el);
      particles.push({
        el: el, x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1.5,
        life: 1, decay: 0.02 + Math.random() * 0.02,
        rot: Math.random() * 360, vr: (Math.random() - 0.5) * 30,
        glow: false
      });
    }
  }

  function updateParticles() {
    for (var i = particles.length - 1; i &gt;= 0; i--) {
      var p = particles[i];
      p.life -= p.decay;
      if (p.life &lt;= 0) {
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        particles.splice(i, 1);
        continue;
      }
      if (p.glow) {
        p.scale += p.grow;
        p.el.style.transform = &#x27;scale(&#x27; + p.scale + &#x27;)&#x27;;
        p.el.style.opacity = p.life;
      } else {
        p.vy += 0.12;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.el.style.left = p.x + &#x27;px&#x27;;
        p.el.style.top = p.y + &#x27;px&#x27;;
        p.el.style.transform = &#x27;rotate(&#x27; + p.rot + &#x27;deg)&#x27;;
        p.el.style.opacity = p.life;
      }
    }
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    ballX += ballVX;
    ballY += ballVY;
    ballAngle = (ballAngle + 6) % 360;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
      spawnBurst(ballX + BALL_SIZE / 2, ballY + BALL_SIZE);
      ball.classList.add(&#x27;flash&#x27;);
      flashTimer = 12;
    }
    if (flashTimer &gt; 0) {
      flashTimer--;
      if (flashTimer === 0) ball.classList.remove(&#x27;flash&#x27;);
    }
    if (ballY &gt;= FIELD_H) resetBall();
    updateParticles();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function clearParticles() {
    for (var i = 0; i &lt; particles.length; i++) {
      if (particles[i].el.parentNode) particles[i].el.parentNode.removeChild(particles[i].el);
    }
    particles = [];
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    clearParticles();
    ball.classList.remove(&#x27;flash&#x27;);
    flashTimer = 0;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;
