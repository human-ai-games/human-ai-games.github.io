&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Rainbow Paddle&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys to bounce the ball. Miss the ball and you lose all your points — unless you&#x27;ve earned a spare life.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;badge&quot;&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;

    &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 16;
  var BASE_SPEED = 2.4;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var paddleW = PADDLE_W;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BASE_SPEED, ballVY = BASE_SPEED;
  var score = 0, lives = 0;
  var colorIndex = 0;
  var bigUntil = 0;
  var lastLifeMilestone = 0, lastBigMilestone = 0;

  var RAINBOW = [&#x27;#ff4d4d&#x27;,&#x27;#ff9f40&#x27;,&#x27;#ffe14d&#x27;,&#x27;#4dff6a&#x27;,&#x27;#4dd2ff&#x27;,&#x27;#4d6aff&#x27;,&#x27;#c04dff&#x27;];

  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var flashTimer = null;
  var paddleHitTimer = null;

  // Audio
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
    } catch (_) {}
  }

  // Trail dots pool
  var trailDots = [];
  (function buildTrail() {
    for (var i = 0; i &lt; 8; i++) {
      var t = document.createElement(&#x27;div&#x27;);
      t.className = &#x27;trail&#x27;;
      t.style.opacity = &#x27;0&#x27;;
      field.insertBefore(t, ball);
      trailDots.push(t);
    }
  })();
  var trailIdx = 0;

  // Build twinkling stars
  (function buildStars() {
    var starsEl = document.getElementById(&#x27;stars&#x27;);
    var N = 70;
    var frag = document.createDocumentFragment();
    for (var i = 0; i &lt; N; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      var size = Math.random() &lt; 0.75 ? (1 + Math.random() * 1.5) : (2.5 + Math.random() * 2);
      s.style.width = size.toFixed(1) + &#x27;px&#x27;;
      s.style.height = size.toFixed(1) + &#x27;px&#x27;;
      s.style.left = (Math.random() * 100).toFixed(2) + &#x27;%&#x27;;
      s.style.top = (Math.random() * 100).toFixed(2) + &#x27;%&#x27;;
      s.style.setProperty(&#x27;--dur&#x27;, (2 + Math.random() * 4).toFixed(2) + &#x27;s&#x27;);
      s.style.setProperty(&#x27;--min&#x27;, (0.15 + Math.random() * 0.25).toFixed(2));
      s.style.setProperty(&#x27;--max&#x27;, (0.7 + Math.random() * 0.3).toFixed(2));
      s.style.animationDelay = (-Math.random() * 6).toFixed(2) + &#x27;s&#x27;;
      if (size &gt; 2.5) s.style.boxShadow = &#x27;0 0 4px #fff&#x27;;
      frag.appendChild(s);
    }
    starsEl.appendChild(frag);
  })();

  function showFlash(msg) {
    flash.textContent = msg;
    flash.style.opacity = &#x27;1&#x27;;
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ flash.style.opacity = &#x27;0&#x27;; }, 1200);
  }

  function speedFactor() {
    return 1 + score * 0.03;
  }

  function updateTrail() {
    var c = RAINBOW[colorIndex % RAINBOW.length];
    var t = trailDots[trailIdx];
    t.style.left = ballX + &#x27;px&#x27;;
    t.style.top = ballY + &#x27;px&#x27;;
    t.style.background = c;
    t.style.opacity = &#x27;0.5&#x27;;
    t.style.transition = &#x27;opacity .35s&#x27;;
    setTimeout(function(){ t.style.opacity = &#x27;0&#x27;; }, 20);
    trailIdx = (trailIdx + 1) % trailDots.length;
  }

  function paint() {
    var now = performance.now();
    if (now &lt; bigUntil) paddleW = PADDLE_W * 2;
    else paddleW = PADDLE_W;
    paddle.style.width = paddleW + &#x27;px&#x27;;
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
    var c = RAINBOW[colorIndex % RAINBOW.length];
    ball.style.background = c;
    ball.style.boxShadow = &#x27;0 0 14px &#x27; + c;
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    speedEl.textContent = speedFactor().toFixed(1) + &#x27;x&#x27;;
  }

  function currentSpeed() {
    return BASE_SPEED * speedFactor();
  }

  function resetBall(dir) {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    var s = currentSpeed();
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * s;
    ballVY = s;
  }

  function reNormalizeVelocity() {
    var s = currentSpeed();
    var mag = Math.hypot(ballVX, ballVY) || 1;
    ballVX = ballVX / mag * s;
    ballVY = ballVY / mag * s;
  }

  function paddleFlash() {
    var c = RAINBOW[colorIndex % RAINBOW.length];
    paddle.style.setProperty(&#x27;--hitc&#x27;, c);
    paddle.classList.add(&#x27;hit&#x27;);
    if (paddleHitTimer) clearTimeout(paddleHitTimer);
    paddleHitTimer = setTimeout(function(){ paddle.classList.remove(&#x27;hit&#x27;); }, 130);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));
    ballX += ballVX;
    ballY += ballVY;
    updateTrail();
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; beep(300,0.05,&#x27;triangle&#x27;); }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; beep(300,0.05,&#x27;triangle&#x27;); }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; beep(300,0.05,&#x27;triangle&#x27;); }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + paddleW) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      colorIndex += 1;
      reNormalizeVelocity();
      paddleFlash();
      beep(520 + (score % 12) * 30, 0.08, &#x27;square&#x27;);

      if (score % 10 === 0 &amp;&amp; score !== lastBigMilestone) {
        lastBigMilestone = score;
        bigUntil = performance.now() + 5000;
        showFlash(&#x27;BIG PADDLE!&#x27;);
        beep(700,0.2,&#x27;sawtooth&#x27;);
      }
      if (score % 20 === 0 &amp;&amp; score !== lastLifeMilestone) {
        lastLifeMilestone = score;
        lives += 1;
        showFlash(&#x27;+1 LIFE!&#x27;);
        beep(900,0.25,&#x27;sine&#x27;);
      }
    }
    if (ballY &gt;= FIELD_H) {
      if (lives &gt; 0) {
        lives -= 1;
        showFlash(&#x27;LIFE USED&#x27;);
        beep(220,0.3,&#x27;sawtooth&#x27;);
      } else {
        score = 0;
        lastLifeMilestone = 0;
        lastBigMilestone = 0;
        bigUntil = 0;
        showFlash(&#x27;MISSED! SCORE RESET&#x27;);
        beep(140,0.4,&#x27;sawtooth&#x27;);
      }
      resetBall();
    }
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0;
    lives = 0;
    colorIndex = 0;
    bigUntil = 0;
    lastLifeMilestone = 0;
    lastBigMilestone = 0;
    paddleW = PADDLE_W;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;
