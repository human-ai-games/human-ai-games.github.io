&lt;div class=&quot;game&quot;&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W = 100, PADDLE_H = 26, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 26;
  var BALL_SPEED = 4.0;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  var combo = 0;
  var heroNotches = 0;       // 0..10
  var heroReady = false;
  var slowmoUntil = 0;       // timestamp in ms
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboVal = document.getElementById(&#x27;comboVal&#x27;);
  var heroFill = document.getElementById(&#x27;heroFill&#x27;);
  var heroReadyEl = document.getElementById(&#x27;heroReady&#x27;);
  var heroEl = document.getElementById(&#x27;hero&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);

  // Build the row of shields
  paddle.style.width = PADDLE_W + &#x27;px&#x27;;
  var SHIELD_COUNT = 5;
  for (var i = 0; i &lt; SHIELD_COUNT; i++) {
    var s = document.createElement(&#x27;span&#x27;);
    s.className = &#x27;shield&#x27;;
    s.textContent = &#x27;🛡️&#x27;;
    paddle.appendChild(s);
  }

  // ---- Web Audio ----
  var audioCtx = null;
  var musicNodes = [];
  var musicTimer = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
  }

  function playClang() {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var freqs = [520, 785, 1170, 1560];
    var master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.4, now + 0.005);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    master.connect(audioCtx.destination);
    freqs.forEach(function (f, idx) {
      var osc = audioCtx.createOscillator();
      osc.type = &#x27;square&#x27;;
      osc.frequency.setValueAtTime(f * (1 + Math.random() * 0.02), now);
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(1 / (idx + 1), now);
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now + 0.35);
    });
  }

  function playHeroChime() {
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (f, i) {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = &#x27;triangle&#x27;;
      osc.frequency.value = f;
      var t = now + i * 0.09;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.4);
    });
  }

  // ---- Epic fantasy background music (procedural loop) ----
  // Chord progression (root notes) with a simple melody over a pad.
  var musicGain = null;
  var musicStep = 0;
  var CHORDS = [
    [130.81, 164.81, 196.00],  // Cm-ish (C E G)
    [146.83, 174.61, 220.00],  // Dm (D F A)
    [174.61, 220.00, 261.63],  // F (F A C)
    [196.00, 246.94, 293.66]   // G (G B D)
  ];
  var MELODY = [523.25, 659.25, 587.33, 783.99, 659.25, 587.33, 523.25, 493.88];
  var STEP_MS = 650;

  function scheduleMusicStep() {
    if (!audioCtx || !musicGain) return;
    var now = audioCtx.currentTime;
    var chord = CHORDS[Math.floor(musicStep / 2) % CHORDS.length];
    var dur = STEP_MS / 1000;

    // Pad chord
    chord.forEach(function (f) {
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = &#x27;sawtooth&#x27;;
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.06, now + 0.08);
      g.gain.linearRampToValueAtTime(0.04, now + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g); g.connect(musicGain);
      osc.start(now); osc.stop(now + dur);
    });

    // Bass note
    var bass = audioCtx.createOscillator();
    var bg = audioCtx.createGain();
    bass.type = &#x27;triangle&#x27;;
    bass.frequency.value = chord[0] / 2;
    bg.gain.setValueAtTime(0.0001, now);
    bg.gain.linearRampToValueAtTime(0.12, now + 0.04);
    bg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    bass.connect(bg); bg.connect(musicGain);
    bass.start(now); bass.stop(now + dur);

    // Melody note
    var mf = MELODY[musicStep % MELODY.length];
    var mo = audioCtx.createOscillator();
    var mg = audioCtx.createGain();
    mo.type = &#x27;square&#x27;;
    mo.frequency.value = mf;
    mg.gain.setValueAtTime(0.0001, now);
    mg.gain.linearRampToValueAtTime(0.05, now + 0.03);
    mg.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.9);
    mo.connect(mg); mg.connect(musicGain);
    mo.start(now); mo.stop(now + dur * 0.9);

    musicStep++;
  }

  function startMusic() {
    if (!audioCtx) return;
    stopMusic();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.5;
    musicGain.connect(audioCtx.destination);
    musicStep = 0;
    scheduleMusicStep();
    musicTimer = setInterval(scheduleMusicStep, STEP_MS);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (musicGain) { try { musicGain.disconnect(); } catch (_) {} musicGain = null; }
  }
  function setMusicTempo(fast) {
    // slow motion =&gt; slower music
  }

  // ---- HUD ----
  function updateHUD() {
    comboVal.textContent = combo;
    heroFill.style.width = (heroNotches * 10) + &#x27;%&#x27;;
    if (heroReady) {
      heroEl.classList.add(&#x27;ready&#x27;);
      heroReadyEl.textContent = &#x27;Press SPACE!&#x27;;
    } else {
      heroEl.classList.remove(&#x27;ready&#x27;);
      var now = performance.now();
      if (now &lt; slowmoUntil) {
        heroReadyEl.textContent = &#x27;SLOW-MO &#x27; + Math.ceil((slowmoUntil - now) / 1000) + &#x27;s&#x27;;
      } else {
        heroReadyEl.textContent = &#x27;&#x27;;
      }
    }
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function flashHit() {
    paddle.classList.remove(&#x27;hit&#x27;);
    void paddle.offsetWidth;
    paddle.classList.add(&#x27;hit&#x27;);
  }

  function activateSlowmo() {
    if (!heroReady) return;
    heroReady = false;
    heroNotches = 0;
    slowmoUntil = performance.now() + 10000;
    field.classList.add(&#x27;slowmo&#x27;);
    playHeroChime();
    updateHUD();
  }

  function tick(ts) {
    if (!running) return;
    var now = performance.now();
    var slow = now &lt; slowmoUntil;
    if (!slow &amp;&amp; field.classList.contains(&#x27;slowmo&#x27;)) {
      field.classList.remove(&#x27;slowmo&#x27;);
    }
    var speedFactor = slow ? 0.35 : 1;

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));

    ballX += ballVX * speedFactor;
    ballY += ballVY * speedFactor;

    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
      combo += 1;
      if (!heroReady &amp;&amp; heroNotches &lt; 10) {
        heroNotches += 1;
        if (heroNotches &gt;= 10) { heroNotches = 10; heroReady = true; playHeroChime(); }
      }
      playClang();
      flashHit();
      updateHUD();
    }
    if (ballY &gt;= FIELD_H) {
      resetBall();
      combo = 0;           // missed — reset combo
      updateHUD();
    }
    updateHUD();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
    score = 0; combo = 0; heroNotches = 0; heroReady = false; slowmoUntil = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    field.classList.remove(&#x27;slowmo&#x27;);
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    updateHUD();
    paint();
    startMusic();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    stopMusic();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) { activateSlowmo(); }
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  updateHUD();
  paint();
&lt;/script&gt;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // briefly before the fit lands. Force hidden so it never appears.

    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);

  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the

        kind: &#x27;iframe_error&#x27;,

        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

  }, true);

  function reportSize() {

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor

  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
