<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Shooter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Star Shooter</b> &middot; Game 024 &middot; Amateur producer &middot; Basic game: Space shooter</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.3; text-align: center; }
  .hud { font-size: 18px; color: #555; margin: 0; display: flex; gap: 20px; }
  .field { position: relative; width: 680px; flex: 1 1 auto; min-height: 0; margin: 0; background: linear-gradient(90deg, #0b1230, #1a2350); border-radius: 8px; overflow: hidden; }
  .ship { position: absolute; width: 40px; height: 34px; }
  .bullet { position: absolute; width: 16px; height: 5px; background: #ffe27a; border-radius: 3px; box-shadow: 0 0 6px #ffcf3a; }
  .target { position: absolute; width: 34px; height: 34px; background: radial-gradient(circle at 35% 30%, #ff8a8a, #c0392b); border-radius: 50%; box-shadow: 0 0 8px rgba(255,80,80,0.5); }
  .powerup { position: absolute; width: 30px; height: 30px; background: radial-gradient(circle at 35% 30%, #b6ffb0, #2ecc71); border-radius: 6px; box-shadow: 0 0 10px rgba(80,255,120,0.7); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .bomb { position: absolute; width: 32px; height: 32px; display:flex; align-items:center; justify-content:center; font-size:24px; }
  .msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:26px; text-align:center; text-shadow:0 2px 8px #000; display:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Star Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;uarr; &amp;darr;&lt;/strong&gt; and hold &lt;strong&gt;Space&lt;/strong&gt; to shoot the red orbs flying in. Grab green power-ups for bonus points and rapid fire, but dodge the bombs 💣!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Lives: &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;svg class=&quot;ship&quot; id=&quot;ship&quot; viewBox=&quot;0 0 40 34&quot;&gt;
      &lt;polygon points=&quot;40,17 0,0 8,17 0,34&quot; fill=&quot;#7fd0ff&quot; stroke=&quot;#cfefff&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;polygon points=&quot;34,17 10,8 14,17 10,26&quot; fill=&quot;#2a6fb0&quot;/&gt;
      &lt;rect x=&quot;0&quot; y=&quot;14&quot; width=&quot;6&quot; height=&quot;6&quot; fill=&quot;#ffcf3a&quot;/&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 680, FIELD_H = 500; // measured dynamically
  var SHIP_W = 40, SHIP_H = 34, SHIP_LEFT = 12, SHIP_SPEED = 3.2;
  var BULLET_W = 16, BULLET_H = 5, BULLET_SPEED = 9;
  var TARGET_SIZE = 34, PU_SIZE = 30, BOMB_SIZE = 32;
  var SPAWN_INTERVAL = 1000;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipY = 0; // set on start
  var bullets = [], targets = [], powerups = [], bombs = [];
  var score = 0, lives = 3;
  var lastShot = 0, startTime = 0, rapidUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  function measureField() { FIELD_H = field.clientHeight || 500; FIELD_W = field.clientWidth || 680; }
  function paintShip() {
    ship.style.left = SHIP_LEFT + &#x27;px&#x27;;
    ship.style.top = shipY + &#x27;px&#x27;;
  }

  // Slower ramp than before.
  function currentSpeed() {
    var elapsed = (Date.now() - startTime) / 1000;
    return 0.8 + elapsed * 0.02;
  }

  function spawnFalling() {
    var r = Math.random();
    if (r &lt; 0.15) {
      var p = { y: Math.random()*(FIELD_H-PU_SIZE), x: FIELD_W, el:null };
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;powerup&#x27;; el.textContent = &#x27;★&#x27;;
      el.style.left = p.x+&#x27;px&#x27;; el.style.top = p.y+&#x27;px&#x27;;
      field.appendChild(el); p.el = el; powerups.push(p);
    } else if (r &lt; 0.35) {
      var bm = { y: Math.random()*(FIELD_H-BOMB_SIZE), x: FIELD_W, el:null };
      var bel = document.createElement(&#x27;div&#x27;);
      bel.className = &#x27;bomb&#x27;; bel.textContent = &#x27;💣&#x27;;
      bel.style.left = bm.x+&#x27;px&#x27;; bel.style.top = bm.y+&#x27;px&#x27;;
      field.appendChild(bel); bm.el = bel; bombs.push(bm);
    } else {
      var t = { y: Math.random()*(FIELD_H-TARGET_SIZE), x: FIELD_W, el:null };
      var tel = document.createElement(&#x27;div&#x27;);
      tel.className = &#x27;target&#x27;;
      tel.style.left = t.x+&#x27;px&#x27;; tel.style.top = t.y+&#x27;px&#x27;;
      field.appendChild(tel); t.el = tel; targets.push(t);
    }
  }

  function spawnBullet() {
    var now = Date.now();
    var rate = now &lt; rapidUntil ? 55 : 110;
    if (now - lastShot &lt; rate) return;
    lastShot = now;
    var startX = SHIP_LEFT + SHIP_W;
    var b = { x: startX, y: shipY + SHIP_H/2 - BULLET_H/2, el:null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x+&#x27;px&#x27;; el.style.top = b.y+&#x27;px&#x27;;
    field.appendChild(el); b.el = el; bullets.push(b);
  }

  function shipRect() {
    return { x: SHIP_LEFT, y: shipY, w: SHIP_W, h: SHIP_H };
  }
  function overlap(a, bx, by, bw, bh) {
    return a.x &lt; bx+bw &amp;&amp; a.x+a.w &gt; bx &amp;&amp; a.y &lt; by+bh &amp;&amp; a.y+a.h &gt; by;
  }

  function loseLife() {
    lives--; livesEl.textContent = lives;
    if (lives &lt;= 0) endGame();
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowUp&#x27;]) shipY -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowDown&#x27;]) shipY += SHIP_SPEED;
    shipY = Math.max(0, Math.min(FIELD_H - SHIP_H, shipY));
    paintShip();
    if (keysDown[&#x27; &#x27;]) spawnBullet();
    var spd = currentSpeed();
    var sr = shipRect();

    for (var i = bullets.length-1; i&gt;=0; i--) {
      var b = bullets[i]; b.x += BULLET_SPEED;
      if (b.x&gt;FIELD_W){ field.removeChild(b.el); bullets.splice(i,1); continue; }
      b.el.style.left = b.x+&#x27;px&#x27;;
    }
    for (var j = targets.length-1; j&gt;=0; j--) {
      var t = targets[j]; t.x -= spd;
      if (t.x + TARGET_SIZE &lt; 0){ field.removeChild(t.el); targets.splice(j,1); continue; }
      t.el.style.left = t.x+&#x27;px&#x27;;
    }
    for (var p=powerups.length-1;p&gt;=0;p--){
      var pu=powerups[p]; pu.x-=spd*0.9;
      if(overlap(sr,pu.x,pu.y,PU_SIZE,PU_SIZE)){
        field.removeChild(pu.el); powerups.splice(p,1);
        score+=5; scoreEl.textContent=score; rapidUntil=Date.now()+5000; continue;
      }
      if(pu.x + PU_SIZE &lt; 0){ field.removeChild(pu.el); powerups.splice(p,1); continue; }
      pu.el.style.left=pu.x+&#x27;px&#x27;;
    }
    for (var m=bombs.length-1;m&gt;=0;m--){
      var bm=bombs[m]; bm.x-=spd*1.1;
      if(overlap(sr,bm.x,bm.y,BOMB_SIZE,BOMB_SIZE)){
        field.removeChild(bm.el); bombs.splice(m,1);
        score=Math.max(0,score-3); scoreEl.textContent=score; loseLife();
        if(!running) return; continue;
      }
      if(bm.x + BOMB_SIZE &lt; 0){ field.removeChild(bm.el); bombs.splice(m,1); continue; }
      bm.el.style.left=bm.x+&#x27;px&#x27;;
    }
    // bullet vs target
    for (var i2=bullets.length-1;i2&gt;=0;i2--){
      var b2=bullets[i2]; var hit=false;
      for (var j2=targets.length-1;j2&gt;=0;j2--){
        var t2=targets[j2];
        if(b2.x&lt;t2.x+TARGET_SIZE &amp;&amp; b2.x+BULLET_W&gt;t2.x &amp;&amp; b2.y&lt;t2.y+TARGET_SIZE &amp;&amp; b2.y+BULLET_H&gt;t2.y){
          field.removeChild(b2.el); bullets.splice(i2,1);
          field.removeChild(t2.el); targets.splice(j2,1);
          score+=1; scoreEl.textContent=score; hit=true; break;
        }
      }
      if(hit) continue;
      for (var m2=bombs.length-1;m2&gt;=0;m2--){
        var bm2=bombs[m2];
        if(b2.x&lt;bm2.x+BOMB_SIZE &amp;&amp; b2.x+BULLET_W&gt;bm2.x &amp;&amp; b2.y&lt;bm2.y+BOMB_SIZE &amp;&amp; b2.y+BULLET_H&gt;bm2.y){
          field.removeChild(b2.el); bullets.splice(i2,1);
          field.removeChild(bm2.el); bombs.splice(m2,1); break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    [bullets,targets,powerups,bombs].forEach(function(arr){
      arr.forEach(function(o){ if(o.el&amp;&amp;o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    bullets=[]; targets=[]; powerups=[]; bombs=[];
  }

  function endGame() {
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    msgEl.textContent=&#x27;Game Over — Score &#x27;+score;
    msgEl.style.display=&#x27;block&#x27;;
  }

  function startGame() {
    if (running) return;
    clearAll();
    measureField();
    score=0; lives=3;
    scoreEl.textContent=&#x27;0&#x27;; livesEl.textContent=&#x27;3&#x27;;
    shipY=(FIELD_H-SHIP_H)/2;
    for(var k in keysDown) keysDown[k]=false;
    lastShot=0; rapidUntil=0; startTime=Date.now();
    msgEl.style.display=&#x27;none&#x27;;
    paintShip();
    running=true;
    spawnFalling();
    animId=requestAnimationFrame(tick);
    spawnId=setInterval(spawnFalling, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;ArrowDown&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ keysDown[&#x27; &#x27;]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;ArrowDown&#x27;) keysDown[e.key]=false;
    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;) keysDown[&#x27; &#x27;]=false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });
  window.addEventListener(&#x27;resize&#x27;, function(){ measureField(); if(running) paintShip(); });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  measureField();
  shipY=(FIELD_H-SHIP_H)/2;
  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
