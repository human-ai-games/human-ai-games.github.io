<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦫 Beaver Crossing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🦫 Beaver Crossing</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #eef7fb; color: #45525c; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: #f7fcff; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #6a8caf; }
  .instructions { font-size: 16px; color: #6b7c88; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #6a8caf; margin: 0; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0;
    background: linear-gradient(180deg, #bfe4f5 0%, #a9d8f0 100%); border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 0 24px rgba(120,180,220,0.35); }
  .field.party { background: linear-gradient(180deg, #ffe0f0 0%, #e5d4ff 100%); }
  .field.dragon { background: linear-gradient(180deg, #cdeaff 0%, #ffe7f6 100%); }
  .safe-top { position: absolute; left:0; right:0; top:0; height:48px; background:#d9f2c9; }
  .safe-bottom { position: absolute; left:0; right:0; bottom:0; height:48px; background:#d9f2c9; }
  .hero, .obstacle, .fish, .confetti, .seg { position: absolute; }
  .seg { border-radius:50%; }
  .lane-divider { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.35); }
  .banner { position:absolute; top:8px; left:0; right:0; text-align:center; font-size:20px; font-weight:700; color:#c85a9a; text-shadow:0 1px 2px #fff; pointer-events:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦫 Beaver Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Guide the beaver across the river with the arrow keys, dodging logs and grabbing drifting fish for points. Cross with 5+ points for a candy party, then reach 50 to become a confetti-shooting rainbow dragon (press Space)!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var FISH_SIZE = CELL - 20;
  var MAX_FISH = 5;

  var running = false, animId = null, gameOver = false;
  var mode = &#x27;normal&#x27;; // normal | party | dragon
  var partyNext = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1, x:0, y:0 };
  var lanes = [];
  var fishes = [];
  var confetti = [];
  var dragonTrail = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bannerEl = null;
  var keys = {};

  var DRAGON_SEGS = 10;
  var DRAGON_HEAD = HERO_SIZE + 16;

  var LOG_SVG =
    &#x27;&lt;svg width=&quot;&#x27;+OBSTACLE_W+&#x27;&quot; height=&quot;&#x27;+OBSTACLE_H+&#x27;&quot; viewBox=&quot;0 0 84 32&quot;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;4&quot; width=&quot;76&quot; height=&quot;24&quot; rx=&quot;12&quot; fill=&quot;#c98f8f&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;4&quot; width=&quot;76&quot; height=&quot;24&quot; rx=&quot;12&quot; fill=&quot;none&quot; stroke=&quot;#a86e6e&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;12&quot; cy=&quot;16&quot; rx=&quot;6&quot; ry=&quot;10&quot; fill=&quot;#e0b0b0&quot; stroke=&quot;#a86e6e&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;12&quot; cy=&quot;16&quot; rx=&quot;2.5&quot; ry=&quot;5&quot; fill=&quot;#b88&quot; /&gt;&#x27; +
      &#x27;&lt;line x1=&quot;30&quot; y1=&quot;10&quot; x2=&quot;60&quot; y2=&quot;10&quot; stroke=&quot;#b57f7f&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;34&quot; y1=&quot;22&quot; x2=&quot;66&quot; y2=&quot;22&quot; stroke=&quot;#b57f7f&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;

  var CANDY_SVG =
    &#x27;&lt;svg width=&quot;&#x27;+OBSTACLE_W+&#x27;&quot; height=&quot;&#x27;+OBSTACLE_H+&#x27;&quot; viewBox=&quot;0 0 84 32&quot;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;20&quot; y=&quot;7&quot; width=&quot;44&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;#ff9ecb&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M20 8 L8 3 L12 16 L8 29 L20 24 Z&quot; fill=&quot;#ffd36b&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M64 8 L76 3 L72 16 L76 29 L64 24 Z&quot; fill=&quot;#ffd36b&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;30&quot; y1=&quot;12&quot; x2=&quot;54&quot; y2=&quot;20&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; opacity=&quot;0.7&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;30&quot; y1=&quot;20&quot; x2=&quot;54&quot; y2=&quot;12&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; opacity=&quot;0.7&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;

  var FISH_SVG =
    &#x27;&lt;svg width=&quot;&#x27;+FISH_SIZE+&#x27;&quot; height=&quot;&#x27;+FISH_SIZE+&#x27;&quot; viewBox=&quot;0 0 28 28&quot;&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;13&quot; cy=&quot;14&quot; rx=&quot;9&quot; ry=&quot;6&quot; fill=&quot;#ffb3c8&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M22 14 L28 9 L28 19 Z&quot; fill=&quot;#ff87a8&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;9&quot; cy=&quot;12&quot; r=&quot;1.6&quot; fill=&quot;#333&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M6 14 q3 3 6 0&quot; stroke=&quot;#e77&quot; stroke-width=&quot;1.2&quot; fill=&quot;none&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;

  function beaverSVG(party) {
    return &#x27;&lt;svg width=&quot;&#x27;+HERO_SIZE+&#x27;&quot; height=&quot;&#x27;+HERO_SIZE+&#x27;&quot; viewBox=&quot;0 0 36 36&quot;&gt;&#x27; +
      (party ? &#x27;&lt;polygon points=&quot;18,-3 11,10 25,10&quot; fill=&quot;#ff77aa&quot;/&gt;&lt;circle cx=&quot;18&quot; cy=&quot;-2&quot; r=&quot;2.2&quot; fill=&quot;#ffe14d&quot;/&gt;&lt;circle cx=&quot;14&quot; cy=&quot;8&quot; r=&quot;1.3&quot; fill=&quot;#ffe14d&quot;/&gt;&lt;circle cx=&quot;22&quot; cy=&quot;8&quot; r=&quot;1.3&quot; fill=&quot;#8fd8ff&quot;/&gt;&#x27; : &#x27;&#x27;) +
      &#x27;&lt;ellipse cx=&quot;18&quot; cy=&quot;30&quot; rx=&quot;12&quot; ry=&quot;5&quot; fill=&quot;#8a5a3b&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;19&quot; r=&quot;11&quot; fill=&quot;#a9713f&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;12&quot; cy=&quot;9&quot; r=&quot;4&quot; fill=&quot;#a9713f&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;9&quot; r=&quot;4&quot; fill=&quot;#a9713f&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;13&quot; r=&quot;9&quot; fill=&quot;#c48a52&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;14&quot; cy=&quot;12&quot; r=&quot;1.7&quot; fill=&quot;#1a1a1a&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;22&quot; cy=&quot;12&quot; r=&quot;1.7&quot; fill=&quot;#1a1a1a&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;18&quot; cy=&quot;17&quot; rx=&quot;4&quot; ry=&quot;3&quot; fill=&quot;#efe0c8&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;16&quot; r=&quot;1.5&quot; fill=&quot;#5a3a20&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;16.5&quot; y=&quot;17.5&quot; width=&quot;3&quot; height=&quot;3&quot; rx=&quot;0.6&quot; fill=&quot;#fff&quot; stroke=&quot;#c9b98f&quot; stroke-width=&quot;0.5&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;
  }

  var RBCOLS = [&#x27;#ff8a8a&#x27;,&#x27;#ffb27f&#x27;,&#x27;#ffe17f&#x27;,&#x27;#8affb0&#x27;,&#x27;#8fd0ff&#x27;,&#x27;#b79cff&#x27;,&#x27;#e79cff&#x27;,&#x27;#ff9ecb&#x27;];

  function dragonHeadSVG() {
    return &#x27;&lt;svg width=&quot;&#x27;+DRAGON_HEAD+&#x27;&quot; height=&quot;&#x27;+DRAGON_HEAD+&#x27;&quot; viewBox=&quot;0 0 44 44&quot;&gt;&#x27; +
      &#x27;&lt;defs&gt;&lt;radialGradient id=&quot;hg&quot; cx=&quot;0.4&quot; cy=&quot;0.4&quot; r=&quot;0.7&quot;&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#ffd6f0&quot;/&gt;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#ff9ecb&quot;/&gt;&lt;/radialGradient&gt;&lt;/defs&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;22&quot; cy=&quot;22&quot; r=&quot;18&quot; fill=&quot;url(#hg)&quot; stroke=&quot;#c47&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;polygon points=&quot;18,6 22,-2 26,6&quot; fill=&quot;#ffd27f&quot; stroke=&quot;#c47&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;15&quot; cy=&quot;18&quot; r=&quot;3.4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;15&quot; cy=&quot;18&quot; r=&quot;1.8&quot; fill=&quot;#1a1a1a&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;29&quot; cy=&quot;18&quot; r=&quot;3.4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;29&quot; cy=&quot;18&quot; r=&quot;1.8&quot; fill=&quot;#1a1a1a&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;22&quot; cy=&quot;30&quot; rx=&quot;7&quot; ry=&quot;4&quot; fill=&quot;#c47&quot;/&gt;&#x27; +   // open mouth
      &#x27;&lt;ellipse cx=&quot;22&quot; cy=&quot;29&quot; rx=&quot;4.5&quot; ry=&quot;2.2&quot; fill=&quot;#7a2444&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;
  }

  function heroSize() { return mode === &#x27;dragon&#x27; ? DRAGON_HEAD : HERO_SIZE; }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    if (mode === &#x27;dragon&#x27;) return;
    var svg = (mode === &#x27;party&#x27;) ? CANDY_SVG : LOG_SVG;
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.5 + (i % 3) * 0.2;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.innerHTML = svg;
        field.appendChild(el);
        obstacles.push({ x: x, el: el, alive: true });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function spawnFish() {
    fishes.forEach(function (f) { if (f.el.parentNode) f.el.parentNode.removeChild(f.el); });
    fishes = [];
    if (mode === &#x27;dragon&#x27;) return;
    for (var i = 0; i &lt; MAX_FISH; i++) addFish();
  }

  function addFish() {
    var laneRow = 1 + Math.floor(Math.random() * LANES);
    var laneIdx = laneRow - 1;
    var driftDir = (laneIdx % 2 === 0) ? 1 : -1; // matches river direction of that lane
    var x = Math.random() * (FIELD_W - FISH_SIZE);
    var y = laneRow * CELL + (CELL - FISH_SIZE) / 2;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;fish&#x27;;
    el.style.width = FISH_SIZE + &#x27;px&#x27;;
    el.style.height = FISH_SIZE + &#x27;px&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    if (driftDir &lt; 0) el.style.transform = &#x27;scaleX(-1)&#x27;;
    field.appendChild(el);
    el.innerHTML = FISH_SVG;
    fishes.push({ x: x, y: y, el: el, drift: driftDir * (0.25 + Math.random()*0.2) });
  }

  function makeConfetti(n) {
    for (var i = 0; i &lt; n; i++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;confetti&#x27;;
      var s = 4 + Math.random()*5;
      el.style.width = s + &#x27;px&#x27;; el.style.height = s + &#x27;px&#x27;;
      el.style.background = RBCOLS[Math.floor(Math.random()*RBCOLS.length)];
      el.style.borderRadius = Math.random()&lt;0.5?&#x27;50%&#x27;:&#x27;2px&#x27;;
      var x = Math.random()*FIELD_W, y = Math.random()*FIELD_H;
      el.style.left = x+&#x27;px&#x27;; el.style.top = y+&#x27;px&#x27;;
      field.appendChild(el);
      confetti.push({ x:x, y:y, vx:(Math.random()-0.5)*1.2, vy:0.6+Math.random()*1.4, el:el, grav:0 });
    }
  }

  function drawBanks() {
    var top = document.createElement(&#x27;div&#x27;); top.className = &#x27;safe-top&#x27;; field.appendChild(top);
    var bot = document.createElement(&#x27;div&#x27;); bot.className = &#x27;safe-bottom&#x27;; field.appendChild(bot);
    if (mode !== &#x27;dragon&#x27;) {
      for (var r = 1; r &lt; ROWS; r++) {
        var d = document.createElement(&#x27;div&#x27;);
        d.className = &#x27;lane-divider&#x27;;
        d.style.top = (r * CELL) + &#x27;px&#x27;;
        field.appendChild(d);
      }
    }
    bannerEl = document.createElement(&#x27;div&#x27;);
    bannerEl.className = &#x27;banner&#x27;;
    if (mode === &#x27;party&#x27;) bannerEl.textContent = &#x27;🎉 Candy Party! 🎉&#x27;;
    else if (mode === &#x27;dragon&#x27;) bannerEl.textContent = &#x27;🐉 Fly around — press Space! 🌈&#x27;;
    field.appendChild(bannerEl);
  }

  function makeHero() {
    // clear old dragon segments
    dragonTrail.forEach(function(s){ if (s.el.parentNode) s.el.parentNode.removeChild(s.el); });
    dragonTrail = [];
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);

    if (mode === &#x27;dragon&#x27;) {
      // build tail segments (drawn behind head)
      for (var i = DRAGON_SEGS - 1; i &gt;= 0; i--) {
        var size = DRAGON_HEAD * (0.85 - i * 0.06);
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;seg&#x27;;
        el.style.width = size + &#x27;px&#x27;;
        el.style.height = size + &#x27;px&#x27;;
        el.style.background = RBCOLS[i % RBCOLS.length];
        el.style.boxShadow = &#x27;0 0 4px rgba(0,0,0,0.1)&#x27;;
        field.appendChild(el);
        dragonTrail[i] = { el: el, size: size, x: FIELD_W/2, y: FIELD_H - 60 };
      }
    }
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    var s = heroSize();
    heroEl.style.width = s + &#x27;px&#x27;;
    heroEl.style.height = s + &#x27;px&#x27;;
    heroEl.innerHTML = (mode === &#x27;dragon&#x27;) ? dragonHeadSVG() : beaverSVG(mode === &#x27;party&#x27;);
    field.appendChild(heroEl);
  }

  function paintHero() {
    if (mode === &#x27;dragon&#x27;) {
      heroEl.style.left = hero.x + &#x27;px&#x27;;
      heroEl.style.top = hero.y + &#x27;px&#x27;;
    } else {
      var s = heroSize();
      var x = hero.col * CELL + (CELL - s) / 2;
      var y = hero.row * CELL + (CELL - s) / 2;
      heroEl.style.left = x + &#x27;px&#x27;;
      heroEl.style.top = y + &#x27;px&#x27;;
    }
  }

  function resetHero() {
    if (mode === &#x27;dragon&#x27;) {
      hero.x = FIELD_W/2 - DRAGON_HEAD/2;
      hero.y = FIELD_H - DRAGON_HEAD - 6;
      // reset trail to start at head
      var hx = hero.x + DRAGON_HEAD/2, hy = hero.y + DRAGON_HEAD/2;
      for (var i = 0; i &lt; dragonTrail.length; i++) {
        dragonTrail[i].x = hx; dragonTrail[i].y = hy;
      }
    } else {
      hero.col = Math.floor(COLS / 2);
      hero.row = ROWS - 1;
    }
    paintHero();
  }

  function tick() {
    if (!running) return;
    // logs / candy
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        if (!o.alive) continue;
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    // fish drift with river
    for (var fd = 0; fd &lt; fishes.length; fd++) {
      var fx = fishes[fd];
      fx.x += fx.drift;
      if (fx.x &gt; FIELD_W) fx.x = -FISH_SIZE;
      else if (fx.x + FISH_SIZE &lt; 0) fx.x = FIELD_W;
      fx.el.style.left = fx.x + &#x27;px&#x27;;
    }
    // confetti motion
    for (var c = confetti.length - 1; c &gt;= 0; c--) {
      var cf = confetti[c];
      cf.x += cf.vx; cf.y += cf.vy;
      if (cf.grav) { cf.vy += cf.grav; cf.vx *= 0.98; }
      else { cf.x += Math.sin(cf.y/20)*0.3; }
      if (cf.y &gt; FIELD_H + 20 || cf.x &lt; -20 || cf.x &gt; FIELD_W + 20) {
        if (cf.temp) { if (cf.el.parentNode) cf.el.parentNode.removeChild(cf.el); confetti.splice(c,1); continue; }
        cf.y = -8; cf.x = Math.random()*FIELD_W;
      }
      cf.el.style.left = cf.x+&#x27;px&#x27;; cf.el.style.top = cf.y+&#x27;px&#x27;;
    }

    if (mode === &#x27;dragon&#x27;) {
      var sp = 3.4;
      if (keys[&#x27;ArrowLeft&#x27;]) hero.x -= sp;
      if (keys[&#x27;ArrowRight&#x27;]) hero.x += sp;
      if (keys[&#x27;ArrowUp&#x27;]) hero.y -= sp;
      if (keys[&#x27;ArrowDown&#x27;]) hero.y += sp;
