<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BOUNCE</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>NEON BOUNCE</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: &#x27;Courier New&#x27;, monospace; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 3px; color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 16px #0ff; }
  .instructions { font-size: 16px; color: #9df; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 22px; font-size: 18px; align-items: center; }
  .hud .val { color: #ff2bd1; text-shadow: 0 0 6px #ff2bd1; font-weight: bold; }
  .combo { color: #ffed4a; text-shadow: 0 0 6px #ffed4a; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: radial-gradient(circle at 50% 40%, #10032a, #05010f); border: 2px solid #0ff; border-radius: 8px; overflow: hidden; box-shadow: 0 0 18px #0ff5, inset 0 0 30px #0ff2; }
  .paddle { position: absolute; height: 14px; background: #0ff; border-radius: 6px; bottom: 12px; box-shadow: 0 0 12px #0ff, 0 0 24px #0ff; }
  .ball { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff, 0 0 20px #ff2bd1; }
  .trail { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #ff2bd1; pointer-events: none; }
  .powerup { position: absolute; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; }
  .target { position: absolute; width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }
  .msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 22px; color: #ffed4a; text-shadow: 0 0 8px #ffed4a; pointer-events: none; opacity: 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON BOUNCE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Glide the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt; keys or your mouse and keep the balls alive to score. Grab power-ups, smash floating bonus targets, and chain fast hits for combos — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;SCORE &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;COMBO x&lt;span id=&quot;combo&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;SPEED &lt;span class=&quot;val&quot; id=&quot;speed&quot;&gt;1.0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var PADDLE_H = 14, PADDLE_BOTTOM = 12;
  var BASE_PADDLE_W = 100;
  var BALL_SIZE = 16;
  var BASE_SPEED = 4.0;
  var running = false, animId = null;
  var keysDown = {};
  var paddleW = BASE_PADDLE_W;
  var paddleX = (FIELD_W - paddleW) / 2;
  var paddleTargetX = paddleX;   // where the paddle wants to be
  var paddleVel = 0;             // for smooth keyboard motion
  var KEY_ACCEL = 1.4, KEY_MAX = 12, FRICTION = 0.78;
  var MOUSE_EASE = 0.28;         // smoothing toward mouse target
  var usingMouse = false;
  var balls = [];
  var score = 0, combo = 1, speedMult = 1;
  var lastHitTime = 0;
  var wideUntil = 0, slowUntil = 0;
  var powerups = [];
  var targets = [];
  var particles = [];
  var trails = [];
  var shakeUntil = 0, shakeMag = 0;
  var comboTimeout = 1500;

  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var audioCtx = null;
  function ac() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
    return audioCtx;
  }
  function tone(freq, start, dur, type, vol, glideTo) {
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + start;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || &#x27;sine&#x27;;
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function wallSound() { tone(320, 0, 0.05, &#x27;sine&#x27;, 0.06); }
  function hitSound(cmb) {
    tone(360 + cmb * 40, 0, 0.09, &#x27;triangle&#x27;, 0.15, 520 + cmb * 60);
    tone(180 + cmb * 20, 0, 0.11, &#x27;sine&#x27;, 0.09);
  }
  function targetSound() {
    tone(880, 0, 0.09, &#x27;triangle&#x27;, 0.13);
    tone(1320, 0.04, 0.1, &#x27;sine&#x27;, 0.11);
    tone(1760, 0.09, 0.12, &#x27;sine&#x27;, 0.08);
  }
  function powerupSound() {
    tone(523, 0, 0.08, &#x27;square&#x27;, 0.1);
    tone(659, 0.07, 0.08, &#x27;square&#x27;, 0.1);
    tone(784, 0.14, 0.12, &#x27;square&#x27;, 0.1);
    tone(1047, 0.21, 0.14, &#x27;sine&#x27;, 0.08);
  }
  function missSound() {
    tone(220, 0, 0.35, &#x27;sawtooth&#x27;, 0.14, 70);
  }

  var PTYPES = [
    { icon: &#x27;↔&#x27;, color: &#x27;#ffed4a&#x27;, kind: &#x27;wide&#x27; },
    { icon: &#x27;★&#x27;, color: &#x27;#ff2bd1&#x27;, kind: &#x27;points&#x27; },
    { icon: &#x27;❄&#x27;, color: &#x27;#0ff&#x27;, kind: &#x27;slow&#x27; },
    { icon: &#x27;⚭&#x27;, color: &#x27;#7fff5a&#x27;, kind: &#x27;multi&#x27; }
  ];

  function shake(mag) { shakeMag = mag; shakeUntil = performance.now() + 250; }

  function showMsg(t, color) {
    msgEl.textContent = t;
    if (color) msgEl.style.color = color;
    msgEl.style.transition = &#x27;none&#x27;;
    msgEl.style.opacity = &#x27;1&#x27;;
    requestAnimationFrame(function(){
      msgEl.style.transition = &#x27;opacity 0.9s&#x27;;
      msgEl.style.opacity = &#x27;0&#x27;;
    });
  }

  function makeBall(x, y, vx, vy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ball&#x27;;
    field.appendChild(el);
    return { el: el, x: x, y: y, vx: vx, vy: vy };
  }

  function spawnTrail(x, y, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;trail&#x27;;
    el.style.background = color;
    field.appendChild(el);
    trails.push({ el: el, x: x, y: y, life: 1 });
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i &lt; n; i++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;particle&#x27;;
      el.style.background = color;
      el.style.boxShadow = &#x27;0 0 6px &#x27; + color;
      field.appendChild(el);
      var ang = Math.random() * Math.PI * 2;
      var sp = 2 + Math.random() * 4;
      particles.push({ el: el, x: x, y: y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: 1 });
    }
  }

  function paint() {
    paddle.style.width = paddleW + &#x27;px&#x27;;
    paddle.style.left = paddleX + &#x27;px&#x27;;
    for (var i = 0; i &lt; balls.length; i++) {
      balls[i].el.style.left = balls[i].x + &#x27;px&#x27;;
      balls[i].el.style.top = balls[i].y + &#x27;px&#x27;;
    }
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    speedEl.textContent = speedMult.toFixed(1);
  }

  function resetBalls() {
    balls.forEach(function(b){ if (b.el.parentNode) field.removeChild(b.el); });
    balls = [];
    var ang = (Math.random() &lt; 0.5 ? -1 : 1);
    balls.push(makeBall((FIELD_W - BALL_SIZE)/2, 50, ang * BASE_SPEED, BASE_SPEED));
  }

  function spawnPowerup() {
    var t = PTYPES[Math.floor(Math.random() * PTYPES.length)];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.textContent = t.icon;
    el.style.background = t.color + &#x27;33&#x27;;
    el.style.color = t.color;
    el.style.border = &#x27;2px solid &#x27; + t.color;
    el.style.boxShadow = &#x27;0 0 10px &#x27; + t.color;
    field.appendChild(el);
    powerups.push({ el: el, x: Math.random() * (FIELD_W - 24), y: -24, kind: t.kind, color: t.color });
  }

  function spawnTarget() {
    var colors = [&#x27;#ff2bd1&#x27;, &#x27;#ffed4a&#x27;, &#x27;#7fff5a&#x27;, &#x27;#0ff&#x27;];
    var c = colors[Math.floor(Math.random()*colors.length)];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.textContent = &#x27;◈&#x27;;
    el.style.background = c + &#x27;22&#x27;;
    el.style.color = c;
    el.style.border = &#x27;2px solid &#x27; + c;
    el.style.boxShadow = &#x27;0 0 12px &#x27; + c;
    field.appendChild(el);
    targets.push({
      el: el, color: c,
      x: 40 + Math.random() * (FIELD_W - 110),
      y: 40 + Math.random() * 150,
      vx: (Math.random()-0.5) * 1.6,
      vy: (Math.random()-0.5) * 1.6,
      value: 15
    });
  }

  function currentSlow(now) { return now &lt; slowUntil ? 0.55 : 1; }

  function updatePaddle() {
    if (usingMouse) {
      // ease toward mouse target
      paddleX += (paddleTargetX - paddleX) * MOUSE_EASE;
      paddleVel = 0;
    } else {
      // smooth keyboard with acceleration + friction
      if (keysDown[&#x27;ArrowLeft&#x27;]) paddleVel -= KEY_ACCEL;
      if (keysDown[&#x27;ArrowRight&#x27;]) paddleVel += KEY_ACCEL;
      if (!keysDown[&#x27;ArrowLeft&#x27;] &amp;&amp; !keysDown[&#x27;ArrowRight&#x27;]) paddleVel *= FRICTION;
      paddleVel = Math.max(-KEY_MAX, Math.min(KEY_MAX, paddleVel));
      paddleX += paddleVel;
    }
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));
    if (paddleX &lt;= 0 || paddleX &gt;= FIELD_W - paddleW) paddleVel *= 0.4;
  }

  function tick() {
    if (!running) return;
    var now = performance.now();

    paddleW = (now &lt; wideUntil) ? BASE_PADDLE_W * 1.7 : BASE_PADDLE_W;
    updatePaddle();

    if (combo &gt; 1 &amp;&amp; now - lastHitTime &gt; comboTimeout) combo = 1;

    var slow = currentSlow(now);
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;

    for (var i = balls.length - 1; i &gt;= 0; i--) {
      var b = balls[i];
      b.x += b.vx * slow;
      b.y += b.vy * slow;

      // trail
      if (Math.random() &lt; 0.6) spawnTrail(b.x, b.y, &#x27;#ff2bd1&#x27;);

      if (b.x &lt;= 0) { b.x = 0; b.vx = Math.abs(b.vx); wallSound(); }
      if (b.x + BALL_SIZE &gt;= FIELD_W) { b.x = FIELD_W - BALL_SIZE; b.vx = -Math.abs(b.vx); wallSound(); }
      if (b.y &lt;= 0) { b.y = 0; b.vy = Math.abs(b.vy); wallSound(); }

      if (b.vy &gt; 0 &amp;&amp;
          b.y + BALL_SIZE &gt;= paddleTop &amp;&amp;
          b.y + BALL_SIZE &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
          b.x + BALL_SIZE &gt;= paddleX &amp;&amp;
          b.x &lt;= paddleX + paddleW) {
        b.vy = -Math.abs(b.vy);
        b.y = paddleTop - BALL_SIZE;
        var rel = (b.x + BALL_SIZE/2 - paddleX) / paddleW - 0.5;
        b.vx = rel * BASE_SPEED * 2.2 * speedMult;
        if (now - lastHitTime &lt; comboTimeout) combo = Math.min(combo + 1, 9);
        else combo = 1;
        lastHitTime = now;
        score += combo;
        hitSound(combo);
        shake(4 + combo);
        spawnParticles(b.x + BALL_SIZE/2, paddleTop, &#x27;#0ff&#x27;, 8 + combo);

        var newMult = 1 + Math.floor(score / 10) * 0.15;
        if (newMult &gt; speedMult) speedMult = newMult;
        var target = BASE_SPEED * speedMult;
        var mag = Math.sqrt(b.vx*b.vx + b.vy*b.vy) || 1;
        b.vx = b.vx / mag * target;
        b.vy = b.vy / mag * target;

        if (Math.random() &lt; 0.25) spawnPowerup();
      }

      for (var t = targets.length - 1; t &gt;= 0; t--) {
        var tg = targets[t];
        if (b.x + BALL_SIZE &gt;= tg.x &amp;&amp; b.x &lt;= tg.x + 30 &amp;&amp;
            b.y + BALL_SIZE &gt;= tg.y &amp;&amp; b.y &lt;= tg.y + 30) {
          score += tg.value * combo;
          showMsg(&#x27;+&#x27; + (tg.value*combo), tg.color);
          spawnParticles(tg.x + 15, tg.y + 15, tg.color, 16);
          shake(6);
          targetSound();
          field.removeChild(tg.el);
          targets.splice(t, 1);
          b.vy = -b.vy;
        }
      }

      if (b.y &gt;= FIELD_H) {
        field.removeChild(b.el);
        balls.splice(i, 1);
      }
    }

    if (balls.length === 0) {
      combo = 1;
      showMsg(&#x27;MISS!&#x27;, &#x27;#ff5555&#x27;);
      missSound();
      shake(10);
      resetBalls();
    }

    for (var t = 0; t &lt; targets.length; t++) {
      var tg = targets[t];
      tg.x += tg.vx * slow; tg.y += tg.vy * slow;
      if (tg.x &lt;= 10 || tg.x &gt;= FIELD_W - 40) tg.vx = -tg.vx;
      if (tg.y &lt;= 10 || tg.y &gt;= 200) tg.vy = -tg.vy;
      tg.el.style.left = tg.x + &#x27;px&#x27;;
      tg.el.style.top = tg.y + &#x27;px&#x27;;
    }

    for (var i = powerups.length - 1; i &gt;= 0; i--) {
      var p = powerups[i];
      p.y += 2.4 * slow;
      p.el.style.left = p.x + &#x27;px&#x27;;
      p.el.style.top = p.y + &#x27;px&#x27;;
      if (p.y + 24 &gt;= paddleTop &amp;&amp; p.y &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
          p.x + 24 &gt;= paddleX &amp;&amp; p.x &lt;= paddleX + paddleW) {
        applyPowerup(p, now);
        field.removeChild(p.el);
        powerups.splice(i, 1);
        continue;
      }
      if (p.y &gt; FIELD_H) { field.removeChild(p.el); powerups.splice(i, 1); }
    }

    // trails fade
    for (var i = trails.length - 1; i &gt;= 0; i--) {
      var tr = trails[i];
      tr.life -= 0.12;
      if (tr.life &lt;= 0) { field.removeChild(tr.el); trails.splice(i, 1); continue; }
      tr.el.style.left = tr.x + &#x27;px&#x27;;
      tr.el.style.top = tr.y + &#x27;px&#x27;;
      tr.el.style.opacity = tr.life * 0.5;
      tr.el.style.transform = &#x27;scale(&#x27; + (tr.life * 0.9) + &#x27;)&#x27;;
    }

    for (var i = particles.length - 1; i &gt;= 0; i--) {
      var pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.04;
      if (pt.life &lt;= 0) { field.removeChild(pt.el); particles.splice(i, 1); continue; }
      pt.el.style.left = pt.x + &#x27;px&#x27;;
      pt.el.style.top = pt.y + &#x27;px&#x27;;
      pt.el.style.opacity = pt.life;
    }

    if (now &lt; shakeUntil) {
      var dx = (Math.random()-0.5) * shakeMag;
      var dy = (Math.random()-0.5) * shakeMag;
      field.style.transform = &#x27;translate(&#x27; + dx + &#x27;px,&#x27; + dy + &#x27;px)&#x27;;
    } else {
      field.style.transform = &#x27;&#x27;;
    }

    paint();
    animId = requestAnimationFrame(tick);
  }

  function applyPowerup(p, now) {
    powerupSound();
    spawnParticles(p.x + 12, p.y + 12, p.color, 12);
    if (p.kind === &#x27;wide&#x27;) { wideUntil = now + 8000; showMsg(&#x27;WIDE PADDLE!&#x27;, &#x27;#ffed4a&#x27;); }
    else if (p.kind === &#x27;points&#x27;) { score += 10 * combo; showMsg(&#x27;+&#x27; + (10*combo) + &#x27; BONUS!&#x27;, &#x27;#ff2bd1&#x27;); }
    else if (p.kind === &#x27;slow&#x27;) { slowUntil = now + 5000; showMsg(&#x27;SLOW MOTION!&#x27;, &#x27;#0ff&#x27;); }
    else if (p.kind === &#x27;multi&#x27;) {
      showMsg(&#x27;MULTIBALL!&#x27;, &#x27;#7fff5a&#x27;);
      var src = balls[0];
      if (src) {
        var sp = Math.sqrt(src.vx*src.vx + src.vy*src.vy) || BASE_SPEED;
        balls.push(makeBall(src.x, src.y, sp*0.7, -Math.abs(sp*0.7)));
        balls.push(makeBall(src.x, src.y, -sp*0.7, -Math.abs(sp*0.7)));
      }
    }
  }

  var puSpawnTimer = null, tgSpawnTimer = null;

  function startGame() {
    if (running) return;
    if (ac() &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
    score = 0; combo = 1; speedMult = 1;
    wideUntil = 0; slowUntil = 0; lastHitTime = 0;
    paddleW = BASE_PADDLE_W;
    paddleX = (FIELD_W - paddleW) / 2;
    paddleTargetX = paddleX;
    paddleVel = 0;
    usingMouse = false;
    powerups.forEach(function(p){ if (p.el.parentNode) field.removeChild(p.el); });
    powerups = [];
    targets.forEach(function(t){ if (t.el.parentNode) field.removeChild(t.el); });
    targets = [];
    particles.forEach(function(p){ if (p.el.parentNode) field.removeChild(p.el); });
    particles = [];
    trails.forEach(function(t){ if (t.el.parentNode) field.removeChild(t.el); });
    trails = [];
    for (var k in keysDown) keysDown[k] = false;
    resetBalls();
    paint();
    running = true;
    setTimeout(function(){ if (running) { spawnPowerup(); spawnTarget(); } }, 500);
    if (puSpawnTimer) clearInterval(puSpawnTimer);
    puSpawnTimer = setInterval(function(){ if (running &amp;&amp; powerups.length &lt; 3) spawnPowerup(); }, 4000);
    if (tgSpawnTimer) clearInterval(tgSpawnTimer);
    tgSpawnTimer = setInterval(function(){ if (running &amp;&amp; targets.length &lt; 4) spawnTarget(); }, 3500);
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (puSpawnTimer) { clearInterval(puSpawnTimer); puSpawnTimer = null; }
    if (tgSpawnTimer) { clearInterval(tgSpawnTimer); tgSpawnTimer = null; }
    field.style.transform = &#x27;&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      usingMouse = false;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
