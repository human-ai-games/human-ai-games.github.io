<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounce Basketball</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Bounce Basketball</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; }
  .score { font-size: 20px; color: #555; margin: 0; }
  canvas { background: #f4c98a; border-radius: 8px; border: 3px solid #c99a5b; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Bounce Basketball&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;The orange ball bounces on its own — steer it with the &lt;strong&gt;arrow keys&lt;/strong&gt; and hit the trampolines for a big boost. Guide it into the hoop to score!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;|&amp;nbsp; Baskets: &lt;span id=&quot;baskets&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var GROUND = H - 30;
  var GRAV = 0.42;
  var R = 18;

  var score = 0, baskets = 0;
  var running = false;
  var animId = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var basketsEl = document.getElementById(&#x27;baskets&#x27;);

  // Hoop geometry
  var hoop = { x: W - 70, y: 150, rimW: 60 };
  var rimLeft, rimRight, rimY;
  function setHoop() {
    rimY = hoop.y;
    rimLeft = hoop.x - hoop.rimW / 2;
    rimRight = hoop.x + hoop.rimW / 2;
  }
  setHoop();

  // Trampolines: sit on the ground, give a strong upward boost
  var TRAMP_H = 12;
  var trampolines = [
    { x: 60,  w: 110 },
    { x: 255, w: 110 },
    { x: 430, w: 110 }
  ];
  var trampFlash = [0, 0, 0];

  var ball = { x: 100, y: 100, vx: 3.5, vy: 0, scored: false };

  var keys = { left: false, right: false, up: false };
  var flash = 0;

  function resetBall() {
    ball.x = 100; ball.y = 120;
    ball.vx = 3.5; ball.vy = 0;
    ball.scored = false;
  }

  function update() {
    if (keys.left) ball.vx -= 0.35;
    if (keys.right) ball.vx += 0.35;
    if (keys.up) ball.vy -= 0.55;

    if (ball.vx &gt; 8) ball.vx = 8;
    if (ball.vx &lt; -8) ball.vx = -8;

    ball.vy += GRAV;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // walls
    if (ball.x - R &lt; 0) { ball.x = R; ball.vx = Math.abs(ball.vx) * 0.85; }
    if (ball.x + R &gt; W) { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * 0.85; }
    if (ball.y - R &lt; 0) { ball.y = R; ball.vy = Math.abs(ball.vy) * 0.6; }

    // Trampoline bounce — check when ball is moving down near ground level
    var trampY = GROUND - TRAMP_H;
    var boosted = false;
    if (ball.vy &gt; 0 &amp;&amp; ball.y + R &gt;= trampY &amp;&amp; ball.y + R &lt;= GROUND + 8) {
      for (var t = 0; t &lt; trampolines.length; t++) {
        var tr = trampolines[t];
        if (ball.x &gt;= tr.x &amp;&amp; ball.x &lt;= tr.x + tr.w) {
          ball.y = trampY - R;
          ball.vy = -Math.max(Math.abs(ball.vy) * 1.15, 13); // strong boost
          if (ball.vy &gt; -13) ball.vy = -13;
          trampFlash[t] = 8;
          ball.scored = false;
          boosted = true;
          break;
        }
      }
    }

    // ground bounce (between trampolines)
    if (!boosted &amp;&amp; ball.y + R &gt; GROUND) {
      ball.y = GROUND - R;
      ball.vy = -Math.abs(ball.vy) * 0.82;
      ball.vx *= 0.92;
      if (Math.abs(ball.vy) &lt; 6) ball.vy = -9;
      ball.scored = false;
    }

    // rim posts
    bouncePost(rimLeft, rimY);
    bouncePost(rimRight, rimY);

    // Scoring
    if (!ball.scored &amp;&amp; ball.vy &gt; 0 &amp;&amp;
        ball.y - R &gt; rimY &amp;&amp; ball.y - R &lt; rimY + 28 &amp;&amp;
        ball.x &gt; rimLeft + 6 &amp;&amp; ball.x &lt; rimRight - 6) {
      ball.scored = true;
      score += 1;
      baskets += 1;
      scoreEl.textContent = score;
      basketsEl.textContent = baskets;
      flash = 14;
    }
  }

  function bouncePost(px, py) {
    var dx = ball.x - px, dy = ball.y - py;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist &lt; R + 4 &amp;&amp; dist &gt; 0) {
      var nx = dx / dist, ny = dy / dist;
      var overlap = (R + 4) - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      var dot = ball.vx * nx + ball.vy * ny;
      ball.vx = (ball.vx - 2 * dot * nx) * 0.7;
      ball.vy = (ball.vy - 2 * dot * ny) * 0.7;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Court floor
    ctx.fillStyle = &#x27;#e0a86a&#x27;;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = &#x27;#b5813f&#x27;;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND);
    ctx.stroke();

    // Trampolines
    var trampY = GROUND - TRAMP_H;
    for (var t = 0; t &lt; trampolines.length; t++) {
      var tr = trampolines[t];
      // legs
      ctx.strokeStyle = &#x27;#2b6cb0&#x27;;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(tr.x + 6, trampY + 4); ctx.lineTo(tr.x + 2, GROUND + 6);
      ctx.moveTo(tr.x + tr.w - 6, trampY + 4); ctx.lineTo(tr.x + tr.w - 2, GROUND + 6);
      ctx.stroke();
      // bounce surface (dips when flashing)
      var dip = trampFlash[t] &gt; 0 ? 6 : 0;
      ctx.fillStyle = &#x27;#3182ce&#x27;;
      ctx.beginPath();
      ctx.moveTo(tr.x, trampY);
      ctx.quadraticCurveTo(tr.x + tr.w / 2, trampY + dip + TRAMP_H, tr.x + tr.w, trampY);
      ctx.lineTo(tr.x + tr.w, trampY + 4);
      ctx.quadraticCurveTo(tr.x + tr.w / 2, trampY + dip + TRAMP_H + 4, tr.x, trampY + 4);
      ctx.closePath();
      ctx.fill();
      // top rim highlight
      ctx.strokeStyle = &#x27;#e8802a&#x27;;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(tr.x, trampY);
      ctx.quadraticCurveTo(tr.x + tr.w / 2, trampY + dip + TRAMP_H, tr.x + tr.w, trampY);
      ctx.stroke();
      if (trampFlash[t] &gt; 0) trampFlash[t]--;
    }

    // Backboard
    ctx.fillStyle = &#x27;#ffffff&#x27;;
    ctx.fillRect(hoop.x + hoop.rimW / 2 + 6, rimY - 50, 10, 90);
    ctx.strokeStyle = &#x27;#333&#x27;;
    ctx.strokeRect(hoop.x + hoop.rimW / 2 + 6, rimY - 50, 10, 90);
    ctx.strokeStyle = &#x27;#d33&#x27;;
    ctx.lineWidth = 2;
    ctx.strokeRect(hoop.x + hoop.rimW / 2 - 8, rimY - 30, 20, 24);

    // Rim
    ctx.strokeStyle = &#x27;#e0561b&#x27;;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(rimLeft, rimY);
    ctx.lineTo(rimRight, rimY);
    ctx.stroke();

    // Net
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.85)&#x27;;
    ctx.lineWidth = 1;
    var segs = 6;
    for (var i = 0; i &lt;= segs; i++) {
      var tt = i / segs;
      var topx = rimLeft + tt * hoop.rimW;
      var botx = rimLeft + hoop.rimW * (0.28 + tt * 0.44);
      ctx.beginPath();
      ctx.moveTo(topx, rimY);
      ctx.lineTo(botx, rimY + 34);
      ctx.stroke();
    }
    for (var j = 1; j &lt;= 2; j++) {
      var yy = rimY + (34 * j / 3);
      var shrink = (j / 3) * 0.28;
      ctx.beginPath();
      ctx.moveTo(rimLeft + hoop.rimW * shrink, yy);
      ctx.lineTo(rimRight - hoop.rimW * shrink, yy);
      ctx.stroke();
    }

    // Ball
    ctx.save();
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.fillStyle = &#x27;#e8802a&#x27;;
    ctx.fill();
    ctx.clip();
    ctx.strokeStyle = &#x27;#8a3f0e&#x27;;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ball.x - R, ball.y); ctx.lineTo(ball.x + R, ball.y);
    ctx.moveTo(ball.x, ball.y - R); ctx.lineTo(ball.x, ball.y + R);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ball.x - R, ball.y, R * 1.3, -0.9, 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ball.x + R, ball.y, R * 1.3, Math.PI - 0.9, Math.PI + 0.9);
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = &#x27;#8a3f0e&#x27;;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.stroke();

    // Score flash
    if (flash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(59,165,92,&#x27; + (flash / 14) + &#x27;)&#x27;;
      ctx.font = &#x27;bold 34px system-ui&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(&#x27;SWISH! +1&#x27;, W / 2, 60);
      ctx.textAlign = &#x27;left&#x27;;
      flash--;
    }
  }

  function loop() {
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; baskets = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    basketsEl.textContent = &#x27;0&#x27;;
    resetBall();
    flash = 0;
    trampFlash = [0, 0, 0];
    if (animId) cancelAnimationFrame(animId);
    loop();
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    draw();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (!running) return;
    if (e.code === &#x27;ArrowLeft&#x27;) { keys.left = true; e.preventDefault(); }
    else if (e.code === &#x27;ArrowRight&#x27;) { keys.right = true; e.preventDefault(); }
    else if (e.code === &#x27;ArrowUp&#x27;) { keys.up = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.code === &#x27;ArrowLeft&#x27;) keys.left = false;
    else if (e.code === &#x27;ArrowRight&#x27;) keys.right = false;
    else if (e.code === &#x27;ArrowUp&#x27;) keys.up = false;
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
