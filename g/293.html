<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TETRIS</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>TETRIS</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #eee; overflow-y: auto;
    background: linear-gradient(135deg, #0d1030, #241040, #401030, #0d2030);
    background-size: 400% 400%; animation: bgShift 18s ease infinite; }
  @keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(90deg,#3ad0e0,#b45cf0,#f0574b,#f2d13a); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 300% 100%; animation: hue 6s linear infinite; }
  @keyframes hue { to { background-position: 300% 0; } }
  .instructions { font-size: 16px; color: #cbd; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  .field { position: relative; width: 240px; height: 480px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px; overflow: hidden;
    background: linear-gradient(160deg, var(--f1,#1b1b28), var(--f2,#2a1b40), var(--f3,#101830));
    background-size: 300% 300%; animation: fieldShift 12s ease infinite; transition: filter 0.4s; }
  @keyframes fieldShift { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }
  .field.pulse { animation: fieldShift 12s ease infinite, fieldPulse 0.5s ease-out; }
  @keyframes fieldPulse { 0% { filter: brightness(2.2) saturate(1.6); } 100% { filter: brightness(1) saturate(1); } }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: 0.5; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.8; } }
  .aurora { position: absolute; inset: -30%; pointer-events: none; opacity: 0.4; mix-blend-mode: screen;
    background: radial-gradient(circle at 30% 40%, rgba(90,200,255,0.5), transparent 45%), radial-gradient(circle at 70% 70%, rgba(200,90,255,0.5), transparent 45%);
    animation: auroraMove 14s ease-in-out infinite; }
  @keyframes auroraMove { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(8%,-6%) scale(1.15); } 66% { transform: translate(-8%,6%) scale(1.05); } }
  .side { display: flex; flex-direction: column; gap: 12px; width: 120px; }
  .panel { background: rgba(20,20,35,0.7); border: 2px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 8px; backdrop-filter: blur(2px); }
  .panel h2 { margin: 0 0 6px; font-size: 14px; color: #cbd; letter-spacing: 1px; }
  .score { font-size: 26px; font-weight: 700; transition: transform 0.12s; }
  .score.bump { transform: scale(1.35); color: #f2d13a; }
  .lines { font-size: 16px; color: #9c9; }
  .preview { position: relative; width: 96px; height: 96px; margin: 0 auto; }
  .block { position: absolute; box-sizing: border-box; border-radius: 3px; border: 1px solid rgba(0,0,0,0.35); box-shadow: inset 0 0 6px rgba(255,255,255,0.25); }
  .block.active { box-shadow: inset 0 0 6px rgba(255,255,255,0.35), 0 0 10px currentColor; }
  .block.settle { animation: settle 0.18s ease-out; }
  @keyframes settle { 0% { transform: scale(1.18); filter: brightness(1.8); } 100% { transform: scale(1); filter: brightness(1); } }
  .clearing { animation: flashRow 0.35s ease-out forwards; }
  @keyframes flashRow { 0% { filter: brightness(3); background: #fff !important; } 60% { filter: brightness(3); background: #fff !important; } 100% { transform: scale(0.2) rotate(30deg); opacity: 0; } }
  .shard { position: absolute; width: 6px; height: 6px; border-radius: 1px; pointer-events: none; }
  .popbubble { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-size: 24px; font-weight: 800; color: #f2d13a; text-shadow: 0 0 8px rgba(242,209,58,0.8); pointer-events: none; animation: pop 0.9s ease-out forwards; z-index: 6; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -4px) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -50px) scale(1); } }
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.72); font-size: 22px; font-weight: 700; z-index: 8; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;TETRIS&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, soft-drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;, and slam a piece down with &lt;strong&gt;Space&lt;/strong&gt;. Clear full rows to score, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;aurora&quot; id=&quot;aurora&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;h2&gt;SCORE&lt;/h2&gt;
        &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
        &lt;div class=&quot;lines&quot;&gt;Lines: &lt;span id=&quot;lines&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;h2&gt;NEXT&lt;/h2&gt;
        &lt;div class=&quot;preview&quot; id=&quot;preview&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 20;
  var running = false, dropId = null, dropMs = 600;
  var grid = [], piece = null, nextType = null, score = 0, lines = 0;
  var settleCells = [];

  var field = document.getElementById(&#x27;field&#x27;);
  var starsEl = document.getElementById(&#x27;stars&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var linesEl = document.getElementById(&#x27;lines&#x27;);
  var previewEl = document.getElementById(&#x27;preview&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);

  for (var s = 0; s &lt; 40; s++) {
    var st = document.createElement(&#x27;div&#x27;);
    st.className = &#x27;star&#x27;;
    st.style.left = Math.random() * 100 + &#x27;%&#x27;;
    st.style.top = Math.random() * 100 + &#x27;%&#x27;;
    st.style.animationDelay = (Math.random() * 3) + &#x27;s&#x27;;
    starsEl.appendChild(st);
  }

  // Field gradient &quot;moods&quot; — deepen as lines are cleared.
  var MOODS = [
    [&#x27;#1b1b28&#x27;, &#x27;#2a1b40&#x27;, &#x27;#101830&#x27;],
    [&#x27;#102a30&#x27;, &#x27;#1b3040&#x27;, &#x27;#0d1830&#x27;],
    [&#x27;#2a1030&#x27;, &#x27;#301b40&#x27;, &#x27;#101020&#x27;],
    [&#x27;#301020&#x27;, &#x27;#40201b&#x27;, &#x27;#1a1010&#x27;],
    [&#x27;#103018&#x27;, &#x27;#1b4030&#x27;, &#x27;#101820&#x27;],
    [&#x27;#301830&#x27;, &#x27;#40105c&#x27;, &#x27;#180830&#x27;]
  ];
  function applyMood() {
    var m = MOODS[Math.min(MOODS.length - 1, Math.floor(lines / 4)) % MOODS.length];
    field.style.setProperty(&#x27;--f1&#x27;, m[0]);
    field.style.setProperty(&#x27;--f2&#x27;, m[1]);
    field.style.setProperty(&#x27;--f3&#x27;, m[2]);
  }
  function pulseField() {
    field.classList.remove(&#x27;pulse&#x27;);
    void field.offsetWidth;
    field.classList.add(&#x27;pulse&#x27;);
  }

  var SHAPES = {
    I: { color: &#x27;#3ad0e0&#x27;, cells: [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]] },
    O: { color: &#x27;#f2d13a&#x27;, cells: [[[1,0],[2,0],[1,1],[2,1]]] },
    T: { color: &#x27;#b45cf0&#x27;, cells: [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] },
    S: { color: &#x27;#4be07a&#x27;, cells: [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]] },
    Z: { color: &#x27;#f0574b&#x27;, cells: [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]] },
    J: { color: &#x27;#4b7af0&#x27;, cells: [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] },
    L: { color: &#x27;#f0964b&#x27;, cells: [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) { var row = []; for (var c = 0; c &lt; COLS; c++) row.push(null); grid.push(row); }
  }
  function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  function pieceCells(p) {
    var states = SHAPES[p.type].cells;
    var offs = states[p.rot % states.length];
    var out = [];
    for (var i = 0; i &lt; offs.length; i++) out.push({ x: p.x + offs[i][0], y: p.y + offs[i][1] });
    return out;
  }
  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }
  function spawnPiece() {
    var type = nextType || randType();
    nextType = randType();
    piece = { type: type, rot: 0, x: 3, y: -1 };
    drawPreview();
    if (collides(piece)) return false;
    return true;
  }
  function lockPiece() {
    var cells = pieceCells(piece), color = SHAPES[piece.type].color;
    settleCells = [];
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) { grid[c.y][c.x] = color; settleCells.push(c.y + &#x27;_&#x27; + c.x); }
    }
    piece = null;
  }
  function popBubble(text) {
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;popbubble&#x27;;
    b.textContent = text;
    field.appendChild(b);
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 900);
  }
  function spawnShards(rowIndex) {
    for (var c = 0; c &lt; COLS; c++) {
      var color = grid[rowIndex][c] || &#x27;#fff&#x27;;
      for (var k = 0; k &lt; 2; k++) {
        var sh = document.createElement(&#x27;div&#x27;);
        sh.className = &#x27;shard&#x27;;
        sh.style.background = color;
        var sx = c * CELL + CELL / 2, sy = rowIndex * CELL + CELL / 2;
        sh.style.left = sx + &#x27;px&#x27;; sh.style.top = sy + &#x27;px&#x27;;
        field.appendChild(sh);
        var ang = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 40;
        var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist + 40;
        sh.animate([
          { transform: &#x27;translate(0,0) rotate(0deg)&#x27;, opacity: 1 },
          { transform: &#x27;translate(&#x27; + dx + &#x27;px,&#x27; + dy + &#x27;px) rotate(360deg)&#x27;, opacity: 0 }
        ], { duration: 600, easing: &#x27;ease-out&#x27; });
        (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 620); })(sh);
      }
    }
  }

  var running_pausedForClear = false;
  function clearFullRows() {
    var fullRows = [];
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) fullRows.push(r);
    }
    if (fullRows.length === 0) return;

    var cleared = fullRows.length;
    for (var i = 0; i &lt; fullRows.length; i++) {
      var rr = fullRows[i];
      spawnShards(rr);
      var rowBlocks = field.querySelectorAll(&#x27;[data-row=&quot;&#x27; + rr + &#x27;&quot;]&#x27;);
      for (var j = 0; j &lt; rowBlocks.length; j++) rowBlocks[j].classList.add(&#x27;clearing&#x27;);
    }
    pulseField();

    running_pausedForClear = true;
    setTimeout(function () {
      fullRows.sort(function (a, b) { return a - b; });
      for (var f = fullRows.length - 1; f &gt;= 0; f--) {
        grid.splice(fullRows[f], 1);
        var empty = []; for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
      }
      lines += cleared;
      var pts = [0, 100, 300, 500, 800][cleared] || (cleared * 300);
      score += pts;
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      scoreEl.classList.add(&#x27;bump&#x27;);
      setTimeout(function () { scoreEl.classList.remove(&#x27;bump&#x27;); }, 150);
      var labels = { 1: &#x27;+100&#x27;, 2: &#x27;DOUBLE +300&#x27;, 3: &#x27;TRIPLE +500&#x27;, 4: &#x27;TETRIS! +800&#x27; };
      popBubble(labels[cleared] || (&#x27;+&#x27; + pts));
      applyMood();
      var newMs = Math.max(120, 600 - Math.floor(lines / 10) * 60);
      if (newMs !== dropMs &amp;&amp; running) { dropMs = newMs; clearInterval(dropId); dropId = setInterval(stepDown, dropMs); }
      running_pausedForClear = false;
      paint();
    }, 350);
  }

  function drawBlockAt(parent, cx, cy, color, cell, opts) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27; + (opts &amp;&amp; opts.active ? &#x27; active&#x27; : &#x27;&#x27;) + (opts &amp;&amp; opts.settle ? &#x27; settle&#x27; : &#x27;&#x27;);
    el.style.left = (cx * cell) + &#x27;px&#x27;;
    el.style.top = (cy * cell) + &#x27;px&#x27;;
    el.style.width = cell + &#x27;px&#x27;;
    el.style.height = cell + &#x27;px&#x27;;
    el.style.background = color;
    el.style.color = color;
    if (opts &amp;&amp; opts.row !== undefined) el.setAttribute(&#x27;data-row&#x27;, opts.row);
    parent.appendChild(el);
  }
  function paint() {
    var olds = field.querySelectorAll(&#x27;.block&#x27;);
    for (var o = 0; o &lt; olds.length; o++) olds[o].remove();
    for (var r = 0; r &lt; ROWS; r++) for (var c = 0; c &lt; COLS; c++) if (grid[r][c]) {
      var key = r + &#x27;_&#x27; + c;
      var isSettle = settleCells.indexOf(key) &gt;= 0;
      drawBlockAt(field, c, r, grid[r][c], CELL, { row: r, settle: isSettle });
    }
    settleCells = [];
    if (piece) {
      var cells = pieceCells(piece), color = SHAPES[piece.type].color;
      for (var i = 0; i &lt; cells.length; i++) if (cells[i].y &gt;= 0) drawBlockAt(field, cells[i].x, cells[i].y, color, CELL, { active: true });
    }
  }
  function drawPreview() {
    var olds = previewEl.querySelectorAll(&#x27;.block&#x27;);
    for (var o = 0; o &lt; olds.length; o++) olds[o].remove();
    if (!nextType) return;
    var offs = SHAPES[nextType].cells[0], color = SHAPES[nextType].color;
    var minX = 9, minY = 9;
    for (var i = 0; i &lt; offs.length; i++) { minX = Math.min(minX, offs[i][0]); minY = Math.min(minY, offs[i][1]); }
    for (var j = 0; j &lt; offs.length; j++) drawBlockAt(previewEl, offs[j][0] - minX + 0.5, offs[j][1] - minY + 0.5, color, 22, { active: true });
  }

  function stepDown() {
    if (!piece || running_pausedForClear) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece(); paint(); clearFullRows();
      if (!running_pausedForClear) { if (!spawnPiece()) { endGame(); paint(); return; } }
      else { setTimeout(function () { if (running &amp;&amp; !spawnPiece()) { endGame(); paint(); } }, 360); }
    } else piece = next;
    paint();
  }
  function move(dx) {
    if (!running || !piece || running_pausedForClear) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }
  function rotate() {
    if (!running || !piece || running_pausedForClear) return;
    var states = SHAPES[piece.type].cells.length;
    var next = { type: piece.type, rot: (piece.rot + 1) % states, x: piece.x, y: piece.y };
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var t = { type: next.type, rot: next.rot, x: next.x + kicks[k], y: next.y };
      if (!collides(t)) { piece = t; paint(); return; }
    }
  }
  function hardDrop() {
    if (!running || !piece || running_pausedForClear) return;
    while (true) {
      var next = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 };
      if (collides(next)) break;
      piece = next; score += 2;
    }
    scoreEl.textContent = score;
    pulseField();
    lockPiece(); paint(); clearFullRows();
    if (!running_pausedForClear) { if (!spawnPiece()) { endGame(); paint(); return; } }
    else { setTimeout(function () { if (running &amp;&amp; !spawnPiece()) { endGame(); paint(); } }, 360); }
    paint();
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    overEl.innerHTML = &#x27;GAME OVER&lt;br&gt;&lt;span style=&quot;font-size:15px;color:#aab&quot;&gt;Press Start to play again&lt;/span&gt;&#x27;;
    overEl.style.display = &#x27;flex&#x27;;
  }
  function startGame() {
    running = true;
    running_pausedForClear = false;
    score = 0; lines = 0; dropMs = 600; nextType = null; settleCells = [];
    scoreEl.textContent = &#x27;0&#x27;; linesEl.textContent = &#x27;0&#x27;;
    overEl.style.display = &#x27;none&#x27;;
    applyMood();
    var junk = field.querySelectorAll(&#x27;.shard, .popbubble&#x27;);
    for (var q = 0; q &lt; junk.length; q++) junk[q].remove();
    newGrid();
    if (!spawnPiece()) return;
    paint();
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropMs);
  }
  function stopGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
