<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Cross the highway</b> &middot; Game 307 &middot; Professional producer &middot; Basic game: Road crossing</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }

  .obstacle { position: absolute; z-index: 4; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cross the highway&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the arrow keys, one cell at a time, and dodge the cars as you cross each lane. Reach the grass at the top to score — the higher lanes move faster, so time your dashes carefully!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var bgEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var CAR_COLORS = [&#x27;#e63946&#x27;,&#x27;#f4a261&#x27;,&#x27;#2a9d8f&#x27;,&#x27;#457b9d&#x27;,&#x27;#e76f51&#x27;,&#x27;#8338ec&#x27;,&#x27;#ffb703&#x27;,&#x27;#06d6a0&#x27;,&#x27;#ff5d8f&#x27;,&#x27;#3a86ff&#x27;];
  var LANE_SPEEDS = [0.6, 0.6, 1.0, 1.0, 1.6, 1.6, 2.3];

  /* ---------- 8-bit sound ---------- */
  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) { try { audioCtx.resume(); } catch (_) {} }
    return audioCtx;
  }
  // Play a single square-wave tone.
  function beep(freq, startOffset, dur, vol, type) {
    var ctx = getCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime + (startOffset || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || &#x27;square&#x27;;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function footstepSound() {
    beep(180, 0, 0.07, 0.18, &#x27;square&#x27;);
    beep(120, 0.05, 0.06, 0.14, &#x27;square&#x27;);
  }
  function crashSound() {
    var ctx = getCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    // Noise burst for the crash.
    var dur = 0.5;
    var buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i &lt; data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.35, t0);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    noise.connect(ng); ng.connect(ctx.destination);
    noise.start(t0);
    // Descending low tones underneath.
    beep(160, 0, 0.25, 0.25, &#x27;sawtooth&#x27;);
    beep(90, 0.12, 0.3, 0.22, &#x27;sawtooth&#x27;);
  }
  function victorySound() {
    // Rising cheerful arpeggio.
    beep(523, 0.00, 0.12, 0.22, &#x27;square&#x27;);
    beep(659, 0.10, 0.12, 0.22, &#x27;square&#x27;);
    beep(784, 0.20, 0.12, 0.22, &#x27;square&#x27;);
    beep(1047, 0.30, 0.20, 0.24, &#x27;square&#x27;);
  }
  /* --------------------------------- */

  function carSVG(color, dir) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(-100,0)&quot;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg width=&quot;&#x27; + OBSTACLE_W + &#x27;&quot; height=&quot;&#x27; + OBSTACLE_H + &#x27;&quot; viewBox=&quot;0 0 100 44&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27; +
      &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;20&quot; width=&quot;92&quot; height=&quot;16&quot; rx=&quot;5&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M22 20 L34 8 L66 8 L80 20 Z&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;37&quot; y=&quot;11&quot; width=&quot;12&quot; height=&quot;8&quot; fill=&quot;#dff3ff&quot; opacity=&quot;0.85&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;52&quot; y=&quot;11&quot; width=&quot;12&quot; height=&quot;8&quot; fill=&quot;#dff3ff&quot; opacity=&quot;0.85&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;28&quot; cy=&quot;37&quot; r=&quot;7&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;37&quot; r=&quot;3&quot; fill=&quot;#888&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;72&quot; cy=&quot;37&quot; r=&quot;7&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;72&quot; cy=&quot;37&quot; r=&quot;3&quot; fill=&quot;#888&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;93&quot; cy=&quot;26&quot; r=&quot;2.5&quot; fill=&quot;#fff2a8&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }

  function personSVG() {
    return &#x27;&lt;svg width=&quot;&#x27; + HERO_SIZE + &#x27;&quot; height=&quot;&#x27; + HERO_SIZE + &#x27;&quot; viewBox=&quot;0 0 40 40&quot;&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;9&quot; r=&quot;7&quot; fill=&quot;#ffcc99&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;17&quot; y=&quot;4&quot; width=&quot;6&quot; height=&quot;4&quot; rx=&quot;2&quot; fill=&quot;#5a3825&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;13&quot; y=&quot;16&quot; width=&quot;14&quot; height=&quot;15&quot; rx=&quot;4&quot; fill=&quot;#2a6fdb&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;8&quot; y=&quot;18&quot; width=&quot;5&quot; height=&quot;11&quot; rx=&quot;2.5&quot; fill=&quot;#2a6fdb&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;27&quot; y=&quot;18&quot; width=&quot;5&quot; height=&quot;11&quot; rx=&quot;2.5&quot; fill=&quot;#2a6fdb&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;14&quot; y=&quot;30&quot; width=&quot;5&quot; height=&quot;9&quot; rx=&quot;2&quot; fill=&quot;#333&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;21&quot; y=&quot;30&quot; width=&quot;5&quot; height=&quot;9&quot; rx=&quot;2&quot; fill=&quot;#333&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function buildBackground() {
    if (bgEl &amp;&amp; bgEl.parentNode) bgEl.parentNode.removeChild(bgEl);
    var roadTop = CELL;
    var roadBottom = (ROWS - 1) * CELL;
    var svg = &#x27;&lt;svg width=&quot;&#x27; + FIELD_W + &#x27;&quot; height=&quot;&#x27; + FIELD_H + &#x27;&quot; viewBox=&quot;0 0 &#x27; + FIELD_W + &#x27; &#x27; + FIELD_H + &#x27;&quot;&gt;&#x27;;
    svg += &#x27;&lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;&#x27; + FIELD_W + &#x27;&quot; height=&quot;&#x27; + FIELD_H + &#x27;&quot; fill=&quot;#5bab4e&quot;/&gt;&#x27;;
    for (var gx = 0; gx &lt; FIELD_W; gx += 40) {
      svg += &#x27;&lt;rect x=&quot;&#x27; + gx + &#x27;&quot; y=&quot;0&quot; width=&quot;20&quot; height=&quot;&#x27; + FIELD_H + &#x27;&quot; fill=&quot;#54a247&quot; opacity=&quot;0.5&quot;/&gt;&#x27;;
    }
    svg += &#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27; + roadTop + &#x27;&quot; width=&quot;&#x27; + FIELD_W + &#x27;&quot; height=&quot;&#x27; + (roadBottom - roadTop) + &#x27;&quot; fill=&quot;#3a3a40&quot;/&gt;&#x27;;
    svg += &#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27; + (roadTop - 3) + &#x27;&quot; width=&quot;&#x27; + FIELD_W + &#x27;&quot; height=&quot;6&quot; fill=&quot;#f2d94e&quot;/&gt;&#x27;;
    svg += &#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27; + (roadBottom - 3) + &#x27;&quot; width=&quot;&#x27; + FIELD_W + &#x27;&quot; height=&quot;6&quot; fill=&quot;#f2d94e&quot;/&gt;&#x27;;
    for (var r = 2; r &lt; ROWS - 1; r++) {
      var y = r * CELL - 2;
      for (var dx = 10; dx &lt; FIELD_W; dx += 44) {
        svg += &#x27;&lt;rect x=&quot;&#x27; + dx + &#x27;&quot; y=&quot;&#x27; + y + &#x27;&quot; width=&quot;26&quot; height=&quot;4&quot; rx=&quot;2&quot; fill=&quot;#e9e9e9&quot;/&gt;&#x27;;
      }
    }
    svg += &#x27;&lt;/svg&gt;&#x27;;
    bgEl = document.createElement(&#x27;div&#x27;);
    bgEl.style.position = &#x27;absolute&#x27;;
    bgEl.style.left = &#x27;0&#x27;;
    bgEl.style.top = &#x27;0&#x27;;
    bgEl.style.width = FIELD_W + &#x27;px&#x27;;
    bgEl.style.height = FIELD_H + &#x27;px&#x27;;
    bgEl.style.zIndex = &#x27;0&#x27;;
    bgEl.innerHTML = svg;
    field.appendChild(bgEl);
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var laneFromBottom = (LANES - 1) - i;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = LANE_SPEEDS[laneFromBottom];
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var color = CAR_COLORS[i % CAR_COLORS.length];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.innerHTML = carSVG(color, dir);
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = personSVG();
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var lane = lanes[laneIdx];
      for (var k = 0; k &lt; lane.obstacles.length; k++) {
        var o2 = lane.obstacles[k];
        if (hx &lt; o2.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
            hy &lt; lane.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane.y) {
          crashSound();
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    var moved = (nc !== hero.col || nr !== hero.row);
    hero.col = nc;
    hero.row = nr;
    paintHero();
    if (moved &amp;&amp; hero.row !== 0) footstepSound();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      victorySound();
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    getCtx();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    buildBackground();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  buildBackground();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
