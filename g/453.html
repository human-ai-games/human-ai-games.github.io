&lt;html&gt;&lt;head&gt;&lt;style&gt;

        &lt;path d=&quot;M13 1 L13 25 M1 13 L25 13 M4 4 Q13 13 4 22 M22 4 Q13 13 22 22&quot; stroke=&quot;#7a3200&quot; stroke-width=&quot;1.2&quot; fill=&quot;none&quot;/&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var PADDLE_W = 100, RIM_OFFSET = 10, HOOP_BOTTOM = 10, HOOP_H = 40, PADDLE_SPEED = 6;
  var RIM_H = 5;
  var BALL_SIZE = 26;
  var BALL_SPEED = 4.0;
  var MAKE_MARGIN = 14;
  var GAME_SECONDS = 60;
  var running = false, animId = null, clockId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  var timeLeft = GAME_SECONDS;
  var scoring = false;
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var multEl = document.getElementById(&#x27;mult&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  // ---- Web Audio ----
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
  }
  function swish() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    // white-noise burst filtered high -&gt; &quot;swish&quot;
    var buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i &lt; data.length; i++) data[i] = (Math.random() * 2 - 1);
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var filt = audioCtx.createBiquadFilter(); filt.type = &#x27;bandpass&#x27;;
    filt.frequency.setValueAtTime(3000, t);
    filt.frequency.exponentialRampToValueAtTime(6000, t + 0.25);
    filt.Q.value = 1.2;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
    src.start(t); src.stop(t + 0.3);
  }
  function buzzer() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    osc.type = &#x27;square&#x27;;
    osc.frequency.value = 180;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.35, t + 0.02);
    g.gain.setValueAtTime(0.35, t + 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 1.6);
  }

  function currentPoints() { return timeLeft &lt;= 10 ? 3 : 2; }
  function updateMult() {
    multEl.textContent = &#x27;+&#x27; + currentPoints();
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = Math.random() * (FIELD_W - BALL_SIZE);
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
    scoring = false;
    ball.style.opacity = &#x27;1&#x27;;
    ball.style.transform = &#x27;scale(1)&#x27;;
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));

    if (scoring) {
      ballY += BALL_SPEED;
      var op = parseFloat(ball.style.opacity) || 1;
      op -= 0.06;
      ball.style.opacity = Math.max(0, op);
      var sc = 1 - (1 - op) * 0.6;
      ball.style.transform = &#x27;scale(&#x27; + Math.max(0.4, sc) + &#x27;)&#x27;;
      if (op &lt;= 0) resetBall();
      paint();
      animId = requestAnimationFrame(tick);
      return;
    }

    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }

    var rimTop = FIELD_H - HOOP_BOTTOM - HOOP_H + RIM_OFFSET;
    var ballCenterX = ballX + BALL_SIZE / 2;
    var rimLeft = paddleX + 8;
    var rimRight = paddleX + PADDLE_W - 8;

    if (ballVY &gt; 0 &amp;&amp; ballY + BALL_SIZE &gt;= rimTop &amp;&amp; ballY + BALL_SIZE &lt;= rimTop + RIM_H + 8) {
      var throughOpening = ballCenterX &gt;= rimLeft + MAKE_MARGIN &amp;&amp; ballCenterX &lt;= rimRight - MAKE_MARGIN;
      if (throughOpening) {
        score += currentPoints();
        scoreEl.textContent = score;
        scoring = true;
        swish();
      } else if (ballCenterX &gt;= paddleX &amp;&amp; ballCenterX &lt;= paddleX + PADDLE_W) {
        ballVY = -Math.abs(ballVY);
        ballY = rimTop - BALL_SIZE;
        ballVX = (ballCenterX &lt; paddleX + PADDLE_W / 2 ? -1 : 1) * Math.abs(ballVX);
      }
    }

    if (ballY &gt;= FIELD_H) resetBall();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function tickClock() {
    if (!running) return;
    timeLeft -= 1;
    if (timeLeft &lt;= 0) {
      timeLeft = 0;
      timeEl.textContent = &#x27;0&#x27;;
      updateMult();
      endGame();
      return;
    }
    timeEl.textContent = timeLeft;
    timeEl.classList.toggle(&#x27;bonus&#x27;, timeLeft &lt;= 10);
    updateMult();
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (clockId) { clearInterval(clockId); clockId = null; }
    buzzer();
    msgEl.style.display = &#x27;block&#x27;;
  }

  function startGame() {
    ensureAudio();
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    timeLeft = GAME_SECONDS;
    timeEl.textContent = timeLeft;
    timeEl.classList.remove(&#x27;bonus&#x27;);
    updateMult();
    msgEl.style.display = &#x27;none&#x27;;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
    clockId = setInterval(tickClock, 1000);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (clockId) { clearInterval(clockId); clockId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);

      }
    } catch (_) {}
  }

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,

        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

    } catch (_) {}

  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;

        kind: &#x27;iframe_error&#x27;,

    } catch (_) {}

  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }

&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
