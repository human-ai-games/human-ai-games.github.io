<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✨ Cosmic Shooter ✨</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>✨ Cosmic Shooter ✨</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1a1030; color: #eee; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; background: linear-gradient(160deg,#241447,#12082b); height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 7px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; background: linear-gradient(90deg,#ff6ec4,#7873f5,#4ade80); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #c9c2e8; max-width: 600px; margin: 0; line-height: 1.3; text-align: center; }
  .hud { display: flex; gap: 20px; align-items: center; font-size: 19px; font-weight: 600; }
  .score { color: #ffd93d; }
  .power { color: #4ade80; min-width: 180px; text-align: left; }
  .power.none { color: #7a72a8; }
  .field { position: relative; width: 620px; height: 390px; flex-shrink: 0; margin: 0; background: radial-gradient(ellipse at 50% 0%,#2b1a5c,#0d0522 80%); border-radius: 10px; overflow: hidden; box-shadow: 0 0 24px rgba(120,115,245,.4) inset, 0 4px 20px rgba(0,0,0,.5); }
  .ship { position: absolute; width: 30px; height: 26px; bottom: 12px; filter: drop-shadow(0 0 8px #4dd0ff); }
  .ship::before { content:&#x27;&#x27;; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:8px; height:10px; background:linear-gradient(#ffd93d,#ff5e3a); border-radius:0 0 50% 50%; animation:flame .18s infinite alternate; }
  @keyframes flame { from{height:6px;opacity:.7} to{height:12px;opacity:1} }
  .ship.shield::after { content:&#x27;&#x27;; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:46px; height:46px; border-radius:50%; border:2px solid #54d1ff; box-shadow:0 0 12px #54d1ff, 0 0 12px #54d1ff inset; opacity:.8; animation:pulse .8s infinite alternate; }
  @keyframes pulse { from{opacity:.4;} to{opacity:.9;} }
  .rocket { width:30px; height:26px; }
  .bullet { position: absolute; width: 5px; height: 14px; background: linear-gradient(#fffbaf,#ffd93d); border-radius: 3px; box-shadow: 0 0 8px #ffe14d; }
  .ebullet { position: absolute; width: 7px; height: 14px; background: linear-gradient(#ff9be0,#c026d3); border-radius: 3px; box-shadow: 0 0 8px #e879f9; }
  .target { position: absolute; width: 34px; height: 34px; border-radius: 50%; animation: spin 3s linear infinite; box-shadow: 0 0 10px rgba(255,255,255,.3); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pup { position: absolute; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #12082b; animation: bob 1s infinite alternate; }
  @keyframes bob { from{box-shadow:0 0 6px currentColor;} to{box-shadow:0 0 16px currentColor;} }
  .boss { position: absolute; width: 84px; height: 54px; filter: drop-shadow(0 0 14px #c026d3); }
  .bosshp { position:absolute; height:6px; background:#3a2a5c; border-radius:3px; overflow:hidden; }
  .bosshp &gt; i { display:block; height:100%; background:linear-gradient(90deg,#ff5e7e,#ff9f43); }
  .flash { position:absolute; inset:0; background:rgba(192,38,211,.25); pointer-events:none; opacity:0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✨ Cosmic Shooter ✨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, &lt;strong&gt;Space&lt;/strong&gt; to fire, grab power-ups (&lt;strong&gt;T&lt;/strong&gt;/&lt;strong&gt;R&lt;/strong&gt;/&lt;strong&gt;S&lt;/strong&gt;). Watch for purple &lt;strong&gt;minibosses&lt;/strong&gt; — 8 hits, worth 15 points, but dodge their bullets!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;power none&quot; id=&quot;power&quot;&gt;No power-up&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;
      &lt;svg class=&quot;rocket&quot; viewBox=&quot;0 0 30 26&quot;&gt;&lt;path d=&quot;M15 0 L23 20 L15 15 L7 20 Z&quot; fill=&quot;#4dd0ff&quot; stroke=&quot;#a6ecff&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 390;
  var SHIP_W = 30, SHIP_H = 26, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 7;
  var EB_W = 7, EB_H = 14, EB_SPEED = 4;
  var TARGET_SIZE = 34, TARGET_SPEED = 1.8;
  var PUP_SIZE = 30, PUP_SPEED = 1.6;
  var BOSS_W = 84, BOSS_H = 54, BOSS_HP = 8, BOSS_SPEED = 1.6;
  var SPAWN_INTERVAL = 1200, PUP_INTERVAL = 6500, BOSS_INTERVAL = 15000;
  var COLORS = [&#x27;#ff6ec4&#x27;,&#x27;#7873f5&#x27;,&#x27;#4ade80&#x27;,&#x27;#ff9f43&#x27;,&#x27;#54d1ff&#x27;,&#x27;#ffd93d&#x27;,&#x27;#ff5e7e&#x27;];
  var PUP_DEFS = {
    T: { color:&#x27;#ff6ec4&#x27;, label:&#x27;Triple Shot&#x27; },
    R: { color:&#x27;#4ade80&#x27;, label:&#x27;Rapid Fire&#x27; },
    S: { color:&#x27;#54d1ff&#x27;, label:&#x27;Shield x2&#x27; }
  };
  var POWER_DURATION = 8000;
  var running = false, animId = null, spawnId = null, pupSpawnId = null, bossSpawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], pups = [], ebullets = [];
  var boss = null, bossFireTimer = 0;
  var score = 0;
  var lastShot = 0;
  var activePower = null, powerEndsAt = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var powerEl = document.getElementById(&#x27;power&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);

  for (var s = 0; s &lt; 40; s++) {
    var star = document.createElement(&#x27;div&#x27;);
    var sz = Math.random() * 2 + 1;
    star.style.cssText = &#x27;position:absolute;width:&#x27;+sz+&#x27;px;height:&#x27;+sz+&#x27;px;background:#fff;border-radius:50%;opacity:&#x27;+(Math.random()*.6+.2)+&#x27;;left:&#x27;+(Math.random()*FIELD_W)+&#x27;px;top:&#x27;+(Math.random()*FIELD_H)+&#x27;px;&#x27;;
    field.appendChild(star);
  }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function updatePowerHud() {
    if (activePower) {
      var secs = Math.ceil((powerEndsAt - Date.now()) / 1000);
      powerEl.className = &#x27;power&#x27;;
      powerEl.textContent = PUP_DEFS[activePower].label + &#x27; (&#x27; + secs + &#x27;s)&#x27;;
      powerEl.style.color = PUP_DEFS[activePower].color;
    } else {
      powerEl.className = &#x27;power none&#x27;;
      powerEl.textContent = &#x27;No power-up&#x27;;
      powerEl.style.color = &#x27;&#x27;;
    }
  }

  function setPower(type) {
    activePower = type;
    powerEndsAt = Date.now() + POWER_DURATION;
    ship.classList.toggle(&#x27;shield&#x27;, type === &#x27;S&#x27;);
    updatePowerHud();
  }
  function clearPower() {
    activePower = null;
    ship.classList.remove(&#x27;shield&#x27;);
    updatePowerHud();
  }

  function flash() {
    flashEl.style.transition = &#x27;none&#x27;;
    flashEl.style.opacity = &#x27;1&#x27;;
    requestAnimationFrame(function(){
      flashEl.style.transition = &#x27;opacity .35s&#x27;;
      flashEl.style.opacity = &#x27;0&#x27;;
    });
  }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    var c = COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.background = &#x27;radial-gradient(circle at 35% 30%, #fff, &#x27;+c+&#x27; 70%)&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnPup() {
    var types = [&#x27;T&#x27;,&#x27;R&#x27;,&#x27;S&#x27;];
    var type = types[Math.floor(Math.random()*types.length)];
    var p = { x: Math.random() * (FIELD_W - PUP_SIZE), y: -PUP_SIZE, type: type, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;pup&#x27;;
    el.textContent = type;
    var c = PUP_DEFS[type].color;
    el.style.background = &#x27;radial-gradient(circle at 35% 30%, #fff, &#x27;+c+&#x27;)&#x27;;
    el.style.color = c;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    pups.push(p);
  }

  function spawnBoss() {
    if (boss) return;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;boss&#x27;;
    el.innerHTML = &#x27;&lt;svg viewBox=&quot;0 0 84 54&quot; width=&quot;84&quot; height=&quot;54&quot;&gt;&lt;path d=&quot;M42 4 L78 30 L60 30 L60 44 L24 44 L24 30 L6 30 Z&quot; fill=&quot;#8b2fc9&quot; stroke=&quot;#e879f9&quot; stroke-width=&quot;2&quot;/&gt;&lt;circle cx=&quot;42&quot; cy=&quot;26&quot; r=&quot;7&quot; fill=&quot;#ffd93d&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;24&quot; r=&quot;4&quot; fill=&quot;#ff5e7e&quot;/&gt;&lt;circle cx=&quot;56&quot; cy=&quot;24&quot; r=&quot;4&quot; fill=&quot;#ff5e7e&quot;/&gt;&lt;/svg&gt;&#x27;;
    field.appendChild(el);
    var hpWrap = document.createElement(&#x27;div&#x27;);
    hpWrap.className = &#x27;bosshp&#x27;;
    hpWrap.style.width = BOSS_W + &#x27;px&#x27;;
    hpWrap.innerHTML = &#x27;&lt;i style=&quot;width:100%&quot;&gt;&lt;/i&gt;&#x27;;
    field.appendChild(hpWrap);
    boss = { x: (FIELD_W-BOSS_W)/2, y: 14, dir: 1, hp: BOSS_HP, el: el, hpEl: hpWrap, hpBar: hpWrap.querySelector(&#x27;i&#x27;) };
    positionBoss();
    bossFireTimer = 0;
  }
  function positionBoss() {
    boss.el.style.left = boss.x + &#x27;px&#x27;;
    boss.el.style.top = boss.y + &#x27;px&#x27;;
    boss.hpEl.style.left = boss.x + &#x27;px&#x27;;
    boss.hpEl.style.top = (boss.y - 10) + &#x27;px&#x27;;
  }
  function removeBoss() {
    if (!boss) return;
    if (boss.el.parentNode) boss.el.parentNode.removeChild(boss.el);
    if (boss.hpEl.parentNode) boss.hpEl.parentNode.removeChild(boss.hpEl);
    boss = null;
  }
  function bossFire() {
    var cx = boss.x + BOSS_W/2;
    [-18,0,18].forEach(function(off){
      var e = { x: cx + off - EB_W/2, y: boss.y + BOSS_H, el: null };
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;ebullet&#x27;;
      el.style.left = e.x + &#x27;px&#x27;;
      el.style.top = e.y + &#x27;px&#x27;;
      field.appendChild(el);
      e.el = el;
      ebullets.push(e);
    });
  }

  function makeBullet(x) {
    return { x: x - BULLET_W/2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, vx: 0, el: null };
  }
  function addBullet(b) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function spawnBullet() {
    var now = Date.now();
    var cooldown = (activePower === &#x27;R&#x27;) ? 110 : 250;
    if (now - lastShot &lt; cooldown) return;
    lastShot = now;
    var cx = shipX + SHIP_W / 2;
    if (activePower === &#x27;T&#x27;) {
      var b1 = makeBullet(cx); b1.vx = 0; addBullet(b1);
      var b2 = makeBullet(cx); b2.vx = -2.5; addBullet(b2);
      var b3 = makeBullet(cx); b3.vx = 2.5; addBullet(b3);
    } else {
      addBullet(makeBullet(cx));
    }
  }

  function tick() {
    if (!running) return;
    if (activePower &amp;&amp; Date.now() &gt;= powerEndsAt) clearPower();
    else if (activePower) updatePowerHud();

    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      b.x += b.vx;
      if (b.y + BULLET_H &lt; 0 || b.x &lt; -10 || b.x &gt; FIELD_W + 10) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
      b.el.style.left = b.x + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    // enemy bullets
    var shipTop = FIELD_H - SHIP_BOTTOM - SHIP_H;
    for (var e = ebullets.length - 1; e &gt;= 0; e--) {
      var eb = ebullets[e];
      eb.y += EB_SPEED;
      if (eb.y &gt; FIELD_H) { field.removeChild(eb.el); ebullets.splice(e, 1); continue; }
      eb.el.style.top = eb.y + &#x27;px&#x27;;
      if (eb.x &lt; shipX + SHIP_W &amp;&amp; eb.x + EB_W &gt; shipX &amp;&amp;
          eb.y + EB_H &gt; shipTop &amp;&amp; eb.y &lt; shipTop + SHIP_H) {
        field.removeChild(eb.el); ebullets.splice(e, 1);
        if (activePower !== &#x27;S&#x27;) {
          score = Math.max(0, score - 3);
          scoreEl.textContent = score;
        }
        flash();
      }
    }
    // power-ups fall &amp; get collected
    for (var p = pups.length - 1; p &gt;= 0; p--) {
      var pu = pups[p];
      pu.y += PUP_SPEED;
      if (pu.y &gt; FIELD_H) { field.removeChild(pu.el); pups.splice(p, 1); continue; }
      pu.el.style.top = pu.y + &#x27;px&#x27;;
      if (pu.x &lt; shipX + SHIP_W &amp;&amp; pu.x + PUP_SIZE &gt; shipX &amp;&amp;
          pu.y + PUP_SIZE &gt; shipTop &amp;&amp; pu.y &lt; shipTop + SHIP_H) {
        setPower(pu.type);
        field.removeChild(pu.el); pups.splice(p, 1);
      }
    }
    // boss movement &amp; firing
    if (boss) {
      boss.x += BOSS_SPEED * boss.dir;
      if (boss.x &lt;= 0) { boss.x = 0; boss.dir = 1; }
      if (boss.x &gt;= FIELD_W - BOSS_W) { boss.x = FIELD_W - BOSS_W; boss.dir = -1; }
      positionBoss();
      bossFireTimer++;
      if (bossFireTimer &gt;= 75) { bossFireTimer = 0; bossFire(); }
    }
    // player bullets vs targets &amp; boss
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      var hit = false;
      if (boss &amp;&amp; b2.x &lt; boss.x + BOSS_W &amp;&amp; b2.x + BULLET_W &gt; boss.x &amp;&amp;
          b2.y &lt; boss.y + BOSS_H &amp;&amp; b2.y + BULLET_H &gt; boss.y) {
        field.removeChild(b2.el); bullets.splice(i2, 1);
        boss.hp--;
        boss.hpBar.style.width = (100 * boss.hp / BOSS_HP) + &#x27;%&#x27;;
        boss.el.style.filter = &#x27;drop-shadow(0 0 14px #fff) brightness(2)&#x27;;
        (function(bel){ setTimeout(function(){ if(bel) bel.style.filter=&#x27;drop-shadow(0 0 14px #c026d3)&#x27;; }, 60); })(boss.el);
        if (boss.hp &lt;= 0) {
          score += 15;
          scoreEl.textContent = score;
          removeBoss();
        }
        continue;
      }
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += (activePower === &#x27;S&#x27;) ? 2 : 1;
          scoreEl.textContent = score;
          hit = true;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    pups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    ebullets.forEach(function (e) { if (e.el.parentNode) e.el.parentNode.removeChild(e.el); });
    bullets = []; targets = []; pups = []; ebullets = [];
    removeBoss();
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    clearPower();
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    pupSpawnId = setInterval(spawnPup, PUP_INTERVAL);
    bossSpawnId = setInterval(spawnBoss, BOSS_INTERVAL);
    setTimeout(function(){ if (running) spawnPup(); }, 2500);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (pupSpawnId) { clearInterval(pupSpawnId); pupSpawnId = null; }
    if (bossSpawnId) { clearInterval(bossSpawnId); bossSpawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }

  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;

      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,

        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

        stack: (r &amp;&amp; r.stack) || null,

      // fires repeatedly during layout/font load; we only need the latest.

      lastReportT = now;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
