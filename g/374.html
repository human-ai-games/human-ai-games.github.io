<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: &#x27;Courier New&#x27;, monospace; background: #04060a; color: #7fffd4; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 16px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 5px; }

  .hud { display: flex; gap: 14px; font-size: 14px; color: #00e5ff; align-items: center; flex-wrap: wrap; justify-content: center; }
  .hud b { color: #ff2d78; }
  .keys { font-size: 13px; color: #ffb000; text-align:center; }
  canvas { background: #060a12; border: 1px solid #14324a; box-shadow: 0 0 24px rgba(255,45,120,.2); display: block; }
  .status { font-size: 14px; height: 18px; color: #ffb000; letter-spacing: 1px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;PROMETHEAN OVERRIDE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;A neural-net AI drives the snake by itself — you don&#x27;t steer, you shock its brain: LEFT=lobotomy (panic hard-left), RIGHT=adrenaline dodge then random crash, UP=mutation wildcard, SPACE=clone into a rival AI. Keep your AIs alive and eating; use Start below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;SCORE: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;AIs: &lt;b id=&quot;ais&quot;&gt;1&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;LOBOTOMY &lt;b id=&quot;lob&quot;&gt;L&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;ADREN &lt;b id=&quot;adr&quot;&gt;R&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;MUTATE &lt;b id=&quot;mut&quot;&gt;U&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;CLONE &lt;b id=&quot;cln&quot;&gt;SPC&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;status&quot; id=&quot;status&quot;&gt;STANDBY — PRESS START&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var CELL=20, COLS=30, ROWS=22, W=COLS*CELL, H=ROWS*CELL;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), aisEl=document.getElementById(&#x27;ais&#x27;), statusEl=document.getElementById(&#x27;status&#x27;);

var running=false, rafId=null, lastTick=0, acc=0;
var ais, nodes, score, tangles;
var audioCtx=null;

function beep(freq,dur,type,vol){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
    g.gain.value=vol||0.05; o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.5),audioCtx.currentTime+dur);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(_){}
}

var DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];

function makeAI(x,y,color){
  return {
    body:[{x:x,y:y},{x:x-1,y:y},{x:x-2,y:y}],
    dir:{x:1,y:0},
    color:color,
    alive:true,
    // brain: weights preferring directions. &quot;left brain&quot; = left/down bias
    brain:{ left:1, right:1, up:1, down:1 },
    adrenaline:0,   // hyper-dodge timer
    crash:0,        // random-move timer
    mutation:{ wallsAreFood:false, selfIsFood:false },
    mutTimer:0,
    growPending:0
  };
}

function reset(){
  ais=[ makeAI(8,11,&#x27;#7fffd4&#x27;) ];
  nodes=[]; score=0; tangles=[];
  for(var i=0;i&lt;5;i++) spawnNode();
  updateHud();
}

function occupied(x,y){
  for(var a=0;a&lt;ais.length;a++){ var b=ais[a].body; for(var i=0;i&lt;b.length;i++) if(b[i].x===x&amp;&amp;b[i].y===y) return true; }
  for(var i=0;i&lt;nodes.length;i++) if(nodes[i].x===x&amp;&amp;nodes[i].y===y) return true;
  return false;
}
function spawnNode(){
  for(var t=0;t&lt;200;t++){
    var x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS);
    if(!occupied(x,y)){ nodes.push({x:x,y:y}); return; }
  }
}

function updateHud(){
  scoreEl.textContent=score;
  aisEl.textContent=ais.filter(function(a){return a.alive;}).length;
}

function nearestNode(head){
  var best=null,bd=1e9;
  for(var i=0;i&lt;nodes.length;i++){
    var d=Math.abs(nodes[i].x-head.x)+Math.abs(nodes[i].y-head.y);
    if(d&lt;bd){bd=d;best=nodes[i];}
  }
  return best;
}

// The AI&#x27;s autonomous decision for its next direction.
function decide(ai){
  var head=ai.body[0];
  var options=DIRS.filter(function(d){ return !(d.x===-ai.dir.x&amp;&amp;d.y===-ai.dir.y); });
  var target=nearestNode(head);

  function danger(d){
    var nx=head.x+d.x, ny=head.y+d.y;
    // wall
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ return ai.mutation.wallsAreFood?-5:100; }
    // self / other bodies
    for(var a=0;a&lt;ais.length;a++){
      var b=ais[a].body;
      for(var i=0;i&lt;b.length;i++){
        if(b[i].x===nx&amp;&amp;b[i].y===ny){
          var isSelf=(a===ais.indexOf(ai));
          if(isSelf &amp;&amp; ai.mutation.selfIsFood) return -5;
          return 100;
        }
      }
    }
    return 0;
  }

  var scored=options.map(function(d){
    var s=danger(d);
    if(target){
      var nx=head.x+d.x, ny=head.y+d.y;
      s += (Math.abs(nx-target.x)+Math.abs(ny-target.y))*0.5;
    }
    // brain weighting (lobotomy skews this)
    var name = d.x===-1?&#x27;left&#x27;:d.x===1?&#x27;right&#x27;:d.y===-1?&#x27;up&#x27;:&#x27;down&#x27;;
    s -= (ai.brain[name]||1)*2;
    return {d:d,s:s};
  });

  // adrenaline = perfect dodge (pick strictly lowest danger, near-optimal)
  if(ai.adrenaline&gt;0){
    scored.sort(function(a,b){return a.s-b.s;});
    return scored[0].d;
  }
  // crash = fully random
  if(ai.crash&gt;0){
    return options[Math.floor(Math.random()*options.length)];
  }
  // normal: mostly best with a little noise
  scored.sort(function(a,b){return a.s-b.s;});
  if(Math.random()&lt;0.15) return scored[Math.min(scored.length-1,Math.floor(Math.random()*2))].d;
  return scored[0].d;
}

function killAI(ai,reason){
  ai.alive=false;
  // body becomes tangle debris briefly
  for(var i=0;i&lt;ai.body.length;i++) tangles.push({x:ai.body[i].x,y:ai.body[i].y,life:120});
  beep(90,0.4,&#x27;sawtooth&#x27;,0.09);
}

function stepAI(ai){
  if(!ai.alive) return;
  // timers
  if(ai.adrenaline&gt;0){ ai.adrenaline--; if(ai.adrenaline===0){ ai.crash=40; statusEl.textContent=&#x27;ADRENALINE CRASH — AI FLAILING&#x27;; } }
  if(ai.crash&gt;0) ai.crash--;
  if(ai.mutTimer&gt;0){ ai.mutTimer--; if(ai.mutTimer===0){ ai.mutation.wallsAreFood=false; ai.mutation.selfIsFood=false; } }
  // slowly heal lobotomized brain
  for(var k in ai.brain){ if(ai.brain[k]&lt;1) ai.brain[k]=Math.min(1,ai.brain[k]+0.05); }

  ai.dir=decide(ai);
  var head=ai.body[0];
  var nx=head.x+ai.dir.x, ny=head.y+ai.dir.y;

  // wall
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){
    if(ai.mutation.wallsAreFood){
      nx=(nx+COLS)%COLS; ny=(ny+ROWS)%ROWS; score+=1; beep(660,0.1,&#x27;square&#x27;,0.06);
    } else { return killAI(ai,&#x27;WALL&#x27;); }
  }

  // collisions with any body
  for(var a=0;a&lt;ais.length;a++){
    if(!ais[a].alive) continue;
    var b=ais[a].body;
    var isSelf=(ais[a]===ai);
    for(var i=(isSelf?1:0);i&lt;b.length;i++){
      if(b[i].x===nx&amp;&amp;b[i].y===ny){
        if(isSelf &amp;&amp; ai.mutation.selfIsFood){ score+=1; beep(500,0.08,&#x27;square&#x27;,0.05); ai.growPending++; }
        else { return killAI(ai, isSelf?&#x27;SELF-KNOT&#x27;:&#x27;CROSS-TANGLE&#x27;); }
      }
    }
  }

  ai.body.unshift({x:nx,y:ny});
  // eat node?
  var ate=null;
  for(var i=0;i&lt;nodes.length;i++){ if(nodes[i].x===nx&amp;&amp;nodes[i].y===ny){ate=i;break;} }
  if(ate!==null){
    nodes.splice(ate,1); score+=1; beep(880,0.08,&#x27;square&#x27;,0.05);
    if(ai.adrenaline&gt;0){ ai.growPending+=2; } // triple growth during rush
    spawnNode();
  } else {
    if(ai.growPending&gt;0){ ai.growPending--; } else { ai.body.pop(); }
  }
}

function step(){
  for(var i=tangles.length-1;i&gt;=0;i--){ tangles[i].life--; if(tangles[i].life&lt;=0) tangles.splice(i,1); }
  for(var a=0;a&lt;ais.length;a++) stepAI(ais[a]);
  updateHud();
  var anyAlive=ais.some(function(a){return a.alive;});
  if(!anyAlive) endGame(&#x27;ALL AIs TERMINATED&#x27;);
}

// ---- Neuro-Shocks (player inputs) ----
function lobotomy(){
  ais.forEach(function(ai){ if(!ai.alive) return;
    // delete left brain -&gt; forces erratic hard-left
    ai.brain.left=0; ai.brain.down=0.2;
    // immediate hard-left relative to current heading
    var d=ai.dir;
    var hardLeft={x:d.y,y:-d.x};
    if(!(hardLeft.x===-ai.dir.x&amp;&amp;hardLeft.y===-ai.dir.y)) ai.dir=hardLeft;
  });
  statusEl.textContent=&#x27;LOBOTOMY — LEFT BRAIN CLIPPED&#x27;;
  beep(200,0.2,&#x27;sawtooth&#x27;,0.07);
}
function adrenaline(){
  ais.forEach(function(ai){ if(!ai.alive) return; ai.adrenaline=90; ai.crash=0; });
  statusEl.textContent=&#x27;ADRENALINE SHOT — HYPER-DODGE (tail x3)&#x27;;
  beep(990,0.2,&#x27;square&#x27;,0.07);
}
function mutate(){
  ais.forEach(function(ai){ if(!ai.alive) return;
    var r=Math.random();
    if(r&lt;0.5) ai.mutation.wallsAreFood=true; else ai.mutation.selfIsFood=true;
    ai.mutTimer=150;
  });
  statusEl.textContent=&#x27;MUTATION — REALITY SCRAMBLED&#x27;;
  beep(300+Math.random()*400,0.25,&#x27;triangle&#x27;,0.08);
}
function cloneAI(){
  var newOnes=[];
  ais.forEach(function(ai){
    if(!ai.alive || ais.length+newOnes.length&gt;=6) return;
    var head=ai.body[0];
    var c=makeAI(head.x,head.y,&#x27;#00e5ff&#x27;);
    c.body=ai.body.map(function(s){return {x:s.x,y:s.y};});
    c.dir={x:-ai.dir.x||0,y:-ai.dir.y||0};
    if(c.dir.x===0&amp;&amp;c.dir.y===0) c.dir={x:0,y:1};
    c.brain=Object.assign({},ai.brain);
    c.color=&#x27;#&#x27;+[&#x27;00e5ff&#x27;,&#x27;ffb000&#x27;,&#x27;b026ff&#x27;,&#x27;ff2d78&#x27;][Math.floor(Math.random()*4)];
    newOnes.push(c);
  });
  ais=ais.concat(newOnes);
  statusEl.textContent=&#x27;HARD RESET — AI CLONED, RIVALS AT WAR&#x27;;
  beep(440,0.3,&#x27;square&#x27;,0.08);
  updateHud();
}

// ---- Render ----
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=&#x27;#060a12&#x27;; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=&#x27;rgba(0,229,255,0.05)&#x27;;
  for(var x=0;x&lt;=W;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y&lt;=H;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  for(var i=0;i&lt;tangles.length;i++){
    ctx.fillStyle=&#x27;rgba(255,60,60,&#x27;+(0.3+0.4*(tangles[i].life/120))+&#x27;)&#x27;;
    ctx.fillRect(tangles[i].x*CELL+4,tangles[i].y*CELL+4,CELL-8,CELL-8);
  }
  for(var i=0;i&lt;nodes.length;i++){
    ctx.fillStyle=&#x27;#39ff14&#x27;; ctx.shadowColor=&#x27;#39ff14&#x27;; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(nodes[i].x*CELL+CELL/2,nodes[i].y*CELL+CELL/2,CELL/2-3,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  for(var a=0;a&lt;ais.length;a++){
    var ai=ais[a]; if(!ai.alive) continue;
    var glow = ai.adrenaline&gt;0? &#x27;#ffef5e&#x27; : ai.crash&gt;0? &#x27;#ff2d78&#x27; : ai.color;
    for(var i=ai.body.length-1;i&gt;=0;i--){
      var seg=ai.body[i];
      ctx.fillStyle = i===0? glow : ai.color;
      if(i===0){ ctx.shadowColor=glow; ctx.shadowBlur=10; }
      // mutation shimmer
      if((ai.mutation.wallsAreFood||ai.mutation.selfIsFood) &amp;&amp; Math.random()&lt;0.3) ctx.fillStyle=&#x27;#b026ff&#x27;;
      ctx.fillRect(seg.x*CELL+1,seg.y*CELL+1,CELL-2,CELL-2);
      ctx.shadowBlur=0;
    }
  }
}

function loop(ts){
  if(!running) return;
  if(!lastTick) lastTick=ts;
  var dt=ts-lastTick; lastTick=ts;
  acc+=dt;
  var interval=1000/9;
  while(acc&gt;=interval){ acc-=interval; if(running) step(); }
  draw();
  rafId=requestAnimationFrame(loop);
}

function endGame(reason){
  running=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  beep(70,0.8,&#x27;sawtooth&#x27;,0.12);
  var flashes=0;
  var flash=setInterval(function(){
    flashes++;
    ctx.fillStyle= flashes%2? &#x27;rgba(255,45,120,0.85)&#x27;:&#x27;rgba(0,0,0,0.9)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;bold 34px Courier New&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;OVERRIDE FAILED&#x27;,W/2,H/2-16);
    ctx.font=&#x27;16px Courier New&#x27;; ctx.fillStyle=&#x27;#00e5ff&#x27;;
    ctx.fillText(reason,W/2,H/2+14);
    ctx.fillText(&#x27;DATA HARVESTED: &#x27;+score,W/2,H/2+40);
    ctx.textAlign=&#x27;left&#x27;;
    if(flashes&gt;7) clearInterval(flash);
  },160);
  statusEl.textContent=&#x27;OVERRIDE FAILED — &#x27;+reason+&#x27; — PRESS START TO RETRY&#x27;;
}

function startGame(){
  if(running) return;
  lastTick=0; acc=0;
  reset();
  running=true;
  statusEl.textContent=&#x27;NEURAL NET ONLINE — SHOCK THE BRAIN&#x27;;
  draw();
  rafId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  statusEl.textContent=&#x27;PAUSED&#x27;;
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(!running) return;
  if(e.key===&#x27;ArrowLeft&#x27;){lobotomy();e.preventDefault();}
  else if(e.key===&#x27;ArrowRight&#x27;){adrenaline();e.preventDefault();}
  else if(e.key===&#x27;ArrowUp&#x27;){mutate();e.preventDefault();}
  else if(e.key===&#x27;ArrowDown&#x27;){e.preventDefault();}
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){cloneAI();e.preventDefault();}
});
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

reset(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
