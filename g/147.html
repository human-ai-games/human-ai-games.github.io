&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var CELL=50, COLS=12, LANES=6, ROWS=LANES+2;
  var FIELD_W=COLS*CELL, FIELD_H=ROWS*CELL;

  // ---- Themes ----
  var THEMES={
    city:  { name:&#x27;🌆 City&#x27;, goal:&#x27;#7e57c2&#x27;, start:&#x27;#26a69a&#x27;,
             road:[&#x27;#37474f&#x27;,&#x27;#455a64&#x27;,&#x27;#3e4c59&#x27;], river:&#x27;#1565c0&#x27;,
             cars:[&#x27;🚗&#x27;,&#x27;🚙&#x27;,&#x27;🚕&#x27;,&#x27;�uf68c&#x27;,&#x27;🚚&#x27;,&#x27;🏎️&#x27;], train:&#x27;🚆&#x27;, log:&#x27;🪵&#x27;,
             carCol:[&#x27;#ef5350&#x27;,&#x27;#ffa726&#x27;,&#x27;#42a5f5&#x27;,&#x27;#ab47bc&#x27;,&#x27;#26c6da&#x27;,&#x27;#ec407a&#x27;] },
    snow:  { name:&#x27;❄️ Snow&#x27;, goal:&#x27;#5c6bc0&#x27;, start:&#x27;#4db6ac&#x27;,
             road:[&#x27;#78909c&#x27;,&#x27;#90a4ae&#x27;,&#x27;#b0bec5&#x27;], river:&#x27;#4fc3f7&#x27;,
             cars:[&#x27;🚙&#x27;,&#x27;🛻&#x27;,&#x27;🚗&#x27;,&#x27;🚌&#x27;], train:&#x27;🚂&#x27;, log:&#x27;🧊&#x27;,
             carCol:[&#x27;#e57373&#x27;,&#x27;#fff176&#x27;,&#x27;#4fc3f7&#x27;,&#x27;#ba68c8&#x27;,&#x27;#4dd0e1&#x27;,&#x27;#f06292&#x27;] },
    neon:  { name:&#x27;🌈 Neon&#x27;, goal:&#x27;#d500f9&#x27;, start:&#x27;#00e5ff&#x27;,
             road:[&#x27;#1a0033&#x27;,&#x27;#2a004d&#x27;,&#x27;#12002e&#x27;], river:&#x27;#00363a&#x27;,
             cars:[&#x27;🚗&#x27;,&#x27;🏎️&#x27;,&#x27;🚙&#x27;,&#x27;🛸&#x27;], train:&#x27;🚄&#x27;, log:&#x27;💠&#x27;,
             carCol:[&#x27;#ff1744&#x27;,&#x27;#ffea00&#x27;,&#x27;#00e5ff&#x27;,&#x27;#d500f9&#x27;,&#x27;#1de9b6&#x27;,&#x27;#ff4081&#x27;] }
  };
  var themeKey=&#x27;city&#x27;;

  // ---- Difficulty ----
  var DIFF={
    easy:   { name:&#x27;Easy&#x27;,   speed:0.75, time:75, riverLanes:1 },
    normal: { name:&#x27;Normal&#x27;, speed:1.0,  time:60, riverLanes:2 },
    hard:   { name:&#x27;Hard&#x27;,   speed:1.4,  time:45, riverLanes:2 }
  };
  var diffKey=&#x27;normal&#x27;;

  // ---- Skins (unlock by best score milestone) ----
  var SKINS=[
    { e:&#x27;🐸&#x27;, name:&#x27;Frog&#x27;,    need:0 },
    { e:&#x27;🐤&#x27;, name:&#x27;Chick&#x27;,   need:300 },
    { e:&#x27;🐱&#x27;, name:&#x27;Cat&#x27;,     need:700 },
    { e:&#x27;🤖&#x27;, name:&#x27;Robot&#x27;,   need:1200 },
    { e:&#x27;🐉&#x27;, name:&#x27;Dragon&#x27;,  need:2000 }
  ];
  var skinIdx=0;

  var running=false, animId=null;
  var hero={col:6,row:ROWS-1};
  var lanes=[], coins=[], powers=[];
  var score=0, coinCount=0, crossings=0, combo=0, maxCombo=0, level=1, speedMult=1;
  var timeLeft=60, lastTs=0, timerAcc=0, powerAcc=0;
  var shieldT=0, slowT=0, boostT=0;
  var best=0, leaderboard=[];
  var badges={}, objective=null, showingMenu=true;

  var field=document.getElementById(&#x27;field&#x27;), overlay=document.getElementById(&#x27;overlay&#x27;);
  var flash=document.getElementById(&#x27;flash&#x27;), toast=document.getElementById(&#x27;toast&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;), coinsEl=document.getElementById(&#x27;coins&#x27;);
  var comboEl=document.getElementById(&#x27;combo&#x27;), levelEl=document.getElementById(&#x27;level&#x27;);
  var timeEl=document.getElementById(&#x27;time&#x27;), bestEl=document.getElementById(&#x27;best&#x27;);
  var pShield=document.getElementById(&#x27;pShield&#x27;), pSlow=document.getElementById(&#x27;pSlow&#x27;), pBoost=document.getElementById(&#x27;pBoost&#x27;);
  var heroEl=null;

  // ---- Audio ----
  var actx=null, musicTimer=null, musicStep=0;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } return actx; }
  function beep(freq,dur,type,vol){ var a=ac(); if(!a) return; var o=a.createOscillator(),g=a.createGain(); o.type=type||&#x27;square&#x27;; o.frequency.value=freq; g.gain.value=vol||0.15; o.connect(g); g.connect(a.destination); var t=a.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.stop(t+dur); }
  var scale=[261,294,330,392,440,523,587,659];
  function startMusic(){
    stopMusic(); musicStep=0;
    musicTimer=setInterval(function(){
      if (!running) return;
      var n=scale[Math.floor(Math.random()*scale.length)];
      var base = themeKey===&#x27;neon&#x27;?1.5:(themeKey===&#x27;snow&#x27;?1.2:1);
      beep(n*base,0.18,&#x27;sine&#x27;,0.05);
      if (musicStep%4===0) beep(n/2,0.3,&#x27;triangle&#x27;,0.04);
      musicStep++;
    },340);
  }
  function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }
  function sHop(){ beep(420,0.06,&#x27;square&#x27;,0.09); }
  function sCoin(){ beep(880,0.06,&#x27;triangle&#x27;,0.16); setTimeout(function(){beep(1320,0.08,&#x27;triangle&#x27;,0.16);},55); }
  function sCross(){ beep(660,0.09,&#x27;sawtooth&#x27;,0.13); setTimeout(function(){beep(990,0.11,&#x27;sawtooth&#x27;,0.13);},80); }
  function sCombo(n){ beep(700+n*55,0.09,&#x27;triangle&#x27;,0.18); }
  function sPower(){ beep(600,0.08,&#x27;sine&#x27;,0.2); setTimeout(function(){beep(900,0.08,&#x27;sine&#x27;,0.2);},70); setTimeout(function(){beep(1200,0.1,&#x27;sine&#x27;,0.2);},140); }
  function sSplash(){ beep(300,0.2,&#x27;sine&#x27;,0.2); setTimeout(function(){beep(180,0.25,&#x27;sine&#x27;,0.18);},80); }
  function sCrash(){ beep(120,0.35,&#x27;sawtooth&#x27;,0.25); }
  function sLevel(){ beep(523,0.1,&#x27;square&#x27;,0.2); setTimeout(function(){beep(784,0.14,&#x27;square&#x27;,0.2);},110); }
  function sUnlock(){ beep(659,0.1,&#x27;triangle&#x27;,0.2); setTimeout(function(){beep(880,0.1,&#x27;triangle&#x27;,0.2);},100); setTimeout(function(){beep(1174,0.18,&#x27;triangle&#x27;,0.2);},200); }
  function sWin(){ beep(523,0.14,&#x27;triangle&#x27;,0.2); setTimeout(function(){beep(659,0.14,&#x27;triangle&#x27;,0.2);},140); setTimeout(function(){beep(784,0.14,&#x27;triangle&#x27;,0.2);},280); setTimeout(function(){beep(1047,0.3,&#x27;triangle&#x27;,0.2);},420); }
  function sEnd(){ beep(392,0.15,&#x27;triangle&#x27;,0.2); setTimeout(function(){beep(262,0.3,&#x27;triangle&#x27;,0.2);},150); }

  function T(){ return THEMES[themeKey]; }

  // ---- Objectives ----
  var OBJECTIVES=[
    { id:&#x27;coins&#x27;, text:&#x27;Collect 15 coins&#x27;, check:function(){return coinCount&gt;=15;}, target:15, cur:function(){return coinCount;} },
    { id:&#x27;cross&#x27;, text:&#x27;Make 8 crossings&#x27;, check:function(){return crossings&gt;=8;}, target:8, cur:function(){return crossings;} },
    { id:&#x27;combo&#x27;, text:&#x27;Reach a x5 combo&#x27;, check:function(){return maxCombo&gt;=5;}, target:5, cur:function(){return maxCombo;} },
    { id:&#x27;score&#x27;, text:&#x27;Score 250 points&#x27;, check:function(){return score&gt;=250;}, target:250, cur:function(){return score;} }
  ];
  function pickObjective(){ objective=OBJECTIVES[Math.floor(Math.random()*OBJECTIVES.length)]; objective.done=false; }

  function showToast(msg){
    toast.textContent=msg; toast.classList.add(&#x27;show&#x27;);

    showToast._t=setTimeout(function(){ toast.classList.remove(&#x27;show&#x27;); },1800);
  }
  function grantBadge(id,label){

  }

  function buildField(){
    field.innerHTML=&#x27;&#x27;;
    field.appendChild(flash); field.appendChild(toast); field.appendChild(overlay);
    var th=T();
    // choose which lanes are rivers (top-ish lanes)
    var riverCount=DIFF[diffKey].riverLanes;
    var riverSet={};
    for (var rc=0; rc&lt;riverCount; rc++){ riverSet[rc+1]=true; } // lanes just below goal
    // one train lane (fast) roughly in the middle
    var trainLane = LANES-1; // near bottom for readability
    for (var r=0;r&lt;ROWS;r++){
      var bg=document.createElement(&#x27;div&#x27;);
      bg.style.position=&#x27;absolute&#x27;; bg.style.left=&#x27;0&#x27;; bg.style.right=&#x27;0&#x27;;
      bg.style.top=(r*CELL)+&#x27;px&#x27;; bg.style.height=CELL+&#x27;px&#x27;;
      if (r===0) bg.style.background=th.goal;
      else if (r===ROWS-1) bg.style.background=th.start;
      else if (riverSet[r]) bg.style.background=th.river;
      else bg.style.background=th.road[(r-1)%th.road.length];
      field.appendChild(bg);
    }
    lanes=[]; coins=[]; powers=[];
    for (var l=0;l&lt;LANES;l++){
      var laneRow=l+1;
      var dir=(l%2===0)?1:-1;
      var isRiver=!!riverSet[laneRow];
      var isTrain=(l===trainLane) &amp;&amp; !isRiver;
      var base = isTrain ? 3.0 : (0.9+(l%3)*0.35);
      var count = isRiver ? 3 : (isTrain?1:2+(l%2));
      var w = isRiver ? CELL*2 : (isTrain? CELL*3 : CELL*1.7);
      var h = CELL-14;
      var y=laneRow*CELL+(CELL-h)/2;
      var pattern = isRiver||isTrain ? 0 : (l%3);
      var obstacles=[];
      var gap=FIELD_W/count;
      for (var j=0;j&lt;count;j++){
        var x=j*gap+(l*37)%gap;
        var el=document.createElement(&#x27;div&#x27;);
        if (isRiver){
          el.className=&#x27;platform&#x27;; el.style.background=&#x27;#8d6e63&#x27;; el.textContent=th.log;
          if (themeKey===&#x27;snow&#x27;) el.style.background=&#x27;#b3e5fc&#x27;;
          if (themeKey===&#x27;neon&#x27;) el.style.background=&#x27;#00bcd4&#x27;;
        } else {
          el.className=&#x27;obstacle&#x27;;

          el.textContent= isTrain? th.train : th.cars[l%th.cars.length];
        }
        el.style.width=w+&#x27;px&#x27;; el.style.height=h+&#x27;px&#x27;;
        el.style.top=y+&#x27;px&#x27;; el.style.left=x+&#x27;px&#x27;;
        el.style.transform=dir&lt;0?&#x27;scaleX(-1)&#x27;:&#x27;none&#x27;;
        field.appendChild(el);
        obstacles.push({x:x,el:el,phase:Math.random()*6.28});
      }
      lanes.push({y:y,dir:dir,base:base,w:w,h:h,obstacles:obstacles,pattern:pattern,river:isRiver,train:isTrain,row:laneRow});
    }
    spawnCoins(); maybeSpawnPower(true);
    makeHero(); paintHero();
  }

  function laneAt(row){ for (var i=0;i&lt;lanes.length;i++) if(lanes[i].row===row) return lanes[i]; return null; }

  function spawnCoins(){
    coins.forEach(function(c){ if(c.el.parentNode) c.el.parentNode.removeChild(c.el); });
    coins=[];
    var placed=0,tries=0;
    while(placed&lt;4 &amp;&amp; tries&lt;50){
      tries++;
      var lr=1+Math.floor(Math.random()*LANES);
      var ln=laneAt(lr); if (ln &amp;&amp; ln.river) continue; // no coins on water cells
      var col=Math.floor(Math.random()*COLS);
      if (coins.some(function(c){return c.row===lr&amp;&amp;c.col===col;})) continue;
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;coin&#x27;;
      el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
      el.style.left=(col*CELL)+&#x27;px&#x27;; el.style.top=(lr*CELL)+&#x27;px&#x27;;
      el.textContent=&#x27;🪙&#x27;; field.appendChild(el);
      coins.push({row:lr,col:col,el:el}); placed++;
    }
  }
  var powerTypes=[{k:&#x27;shield&#x27;,e:&#x27;🛡️&#x27;},{k:&#x27;slow&#x27;,e:&#x27;🐢&#x27;},{k:&#x27;boost&#x27;,e:&#x27;⚡&#x27;}];
  function maybeSpawnPower(force){
    if (!force &amp;&amp; powers.length&gt;0) return;
    if (!force &amp;&amp; Math.random()&gt;0.7) return;
    var t=powerTypes[Math.floor(Math.random()*powerTypes.length)];
    var lr, ln, tr=0;
    do { lr=1+Math.floor(Math.random()*LANES); ln=laneAt(lr); tr++; } while(ln&amp;&amp;ln.river&amp;&amp;tr&lt;10);
    var col=Math.floor(Math.random()*COLS);
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;power&#x27;;

  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
