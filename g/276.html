&lt;script&gt;
  var field = document.getElementById(&#x27;field&#x27;);

    [ {x:310,y:60}, {x:540,y:216}, {x:310,y:372}, {x:80,y:216} ],

  var swat = { x: 310, y: 216, vx: 0, vy: 0 };
  var SPRING = 0.14;   // how strongly swatter is pulled toward the mouse
  var DAMP = 0.78;     // velocity damping (higher = more glide)

  // Combo tracking.
  var combo = 0, lastHitTime = 0, COMBO_WINDOW = 1500;

  function makeElems() {
    [flyEl, flyShadowEl, swatterEl].forEach(function (el) {
      if (el &amp;&amp; el.parentNode) el.parentNode.removeChild(el);
    });
    flyShadowEl = document.createElement(&#x27;div&#x27;);
    flyShadowEl.className = &#x27;flyShadow&#x27;;
    field.appendChild(flyShadowEl);

    flyEl = document.createElement(&#x27;div&#x27;);
    flyEl.className = &#x27;fly&#x27;;
    flyEl.textContent = &#x27;🪰&#x27;;
    field.appendChild(flyEl);

    swatterEl = document.createElement(&#x27;div&#x27;);
    swatterEl.className = &#x27;swatter&#x27;;
    swatterEl.textContent = &#x27;🏓&#x27;;
    field.appendChild(swatterEl);
    paintSwatter();
  }

  function paintFly() {
    flyEl.style.transform = &#x27;translate(&#x27; + (fly.x - FLY_SIZE/2) + &#x27;px,&#x27; + (fly.y - FLY_SIZE/2) + &#x27;px)&#x27;;
    // Shadow sits a bit below the fly, on the &quot;wall&quot;.
    flyShadowEl.style.left = (fly.x - 12) + &#x27;px&#x27;;
    flyShadowEl.style.top = (fly.y + 14) + &#x27;px&#x27;;
  }
  function paintSwatter() {
    // The swatter tilts based on horizontal velocity for a swing feel.
    var tilt = Math.max(-35, Math.min(35, swat.vx * 3));
    swatterEl.style.transform = &#x27;translate(&#x27; + (swat.x) + &#x27;px,&#x27; + (swat.y) + &#x27;px) translate(-50%,-60%) rotate(&#x27; + tilt + &#x27;deg)&#x27;;
  }

  function pickRoute() {
    route = ROUTES[Math.floor(Math.random() * ROUTES.length)];
    routeIdx = 0;
    prog = 0;
    fly.x = route[0].x;
    fly.y = route[0].y;
    paintFly();
  }

  function advanceFly() {
    var a = route[routeIdx];
    var b = route[(routeIdx + 1) % route.length];
    var dx = b.x - a.x, dy = b.y - a.y;
    var segLen = Math.hypot(dx, dy) || 1;
    prog += speed;
    if (prog &gt;= segLen) {
      prog -= segLen;
      routeIdx = (routeIdx + 1) % route.length;
      a = route[routeIdx];
      b = route[(routeIdx + 1) % route.length];
      dx = b.x - a.x; dy = b.y - a.y;
      segLen = Math.hypot(dx, dy) || 1;
    }
    var t = prog / segLen;
    fly.x = a.x + dx * t;
    fly.y = a.y + dy * t;
  }

  function updateSwatter() {
    // Spring the swatter toward the mouse with momentum/glide.
    swat.vx += (mouse.x - swat.x) * SPRING;
    swat.vy += (mouse.y - swat.y) * SPRING;
    swat.vx *= DAMP;
    swat.vy *= DAMP;
    swat.x += swat.vx;
    swat.y += swat.vy;
    paintSwatter();
  }

  function tick() {
    if (!running) return;
    advanceFly();
    paintFly();
    updateSwatter();
    // Update combo decay display.
    if (combo &gt; 0 &amp;&amp; Date.now() - lastHitTime &gt; COMBO_WINDOW) {
      combo = 0;
      comboEl.textContent = &#x27;&#x27;;
    }
    animId = requestAnimationFrame(tick);
  }

  function splatAt(x, y) {
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;splat&#x27;;
    s.textContent = &#x27;💥&#x27;;
    s.style.left = (x - 17) + &#x27;px&#x27;;
    s.style.top = (y - 17) + &#x27;px&#x27;;
    field.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
  }

  function floatText(x, y, txt) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;floatText&#x27;;
    f.textContent = txt;
    f.style.left = (x - 10) + &#x27;px&#x27;;
    f.style.top = (y - 20) + &#x27;px&#x27;;
    field.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 700);
  }

  var audioCtx = null;
  function beep(freqStart, freqEnd, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();

      o.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }
  function zapSound() { beep(600, 120, 0.15, &#x27;square&#x27;, 0.22); }
  function whooshSound() { beep(320, 140, 0.12, &#x27;sawtooth&#x27;, 0.08); }

  function trySwat(clickX, clickY) {
    if (!running) return;
    // The swing lands where the swatter actually is (drag), not the cursor.
    var dist = Math.hypot(swat.x - fly.x, swat.y - fly.y);
    // A little swing-speed bonus: faster swings reach a touch farther.
    var swingSpeed = Math.hypot(swat.vx, swat.vy);
    var reach = 30 + Math.min(12, swingSpeed);
    if (dist &lt; reach) {
      // Combo logic.
      var now = Date.now();
      if (now - lastHitTime &lt; COMBO_WINDOW) combo += 1; else combo = 1;
      lastHitTime = now;
      var mult = combo &gt;= 3 ? 3 : (combo === 2 ? 2 : 1);
      var pts = mult;
      score += pts;
      scoreEl.textContent = score;
      comboEl.textContent = combo &gt;= 2 ? (&#x27;x&#x27; + mult + &#x27; combo!&#x27;) : &#x27;&#x27;;
      zapSound();
      splatAt(fly.x, fly.y);
      floatText(fly.x, fly.y, &#x27;+&#x27; + pts);
      pickRoute();
      speed = Math.min(4.5, speed + 0.15);
    } else {
      whooshSound();
    }
  }

  field.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = field.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  field.addEventListener(&#x27;mousedown&#x27;, function (e) {
    var rect = field.getBoundingClientRect();
    trySwat(e.clientX - rect.left, e.clientY - rect.top);
  });

  function startGame() {
    if (running) return;
    score = 0; timeLeft = 30; speed = 2.2; combo = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    timeEl.textContent = &#x27;30&#x27;;
    comboEl.textContent = &#x27;&#x27;;
    banner.style.display = &#x27;none&#x27;;
    makeElems();
    // Reset swatter to center so it doesn&#x27;t fling in.
    swat.x = mouse.x; swat.y = mouse.y; swat.vx = 0; swat.vy = 0;
    pickRoute();
    running = true;
    animId = requestAnimationFrame(tick);
    timerId = setInterval(function () {
      timeLeft -= 1;
      timeEl.textContent = timeLeft;
      if (timeLeft &lt;= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    banner.textContent = &#x27;Time! Final score: &#x27; + score;
    banner.style.display = &#x27;flex&#x27;;
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the field is visible before Start.
  makeElems();
  pickRoute();

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

  function init() {

      requestAnimationFrame(reportSize);
    });

    window.addEventListener(&#x27;load&#x27;, init);
  }

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
