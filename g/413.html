    setTimeout(function(){ beep(880, 0.12, &#x27;sine&#x27;, 0.16); }, 80);
    setTimeout(function(){ beep(1047, 0.25, &#x27;sine&#x27;, 0.16); }, 160);

  function newGrid() {

  function pieceCells(p) {

      { x: p.x + 1, y: p.y },
      { x: p.x,     y: p.y + 1 },
      { x: p.x + 1, y: p.y + 1 },

      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;

  function spawnPiece() {
    var kind = 1 + Math.floor(Math.random() * KINDS.length);
    var gold = Math.random() &lt; GOLD_CHANCE;
    piece = { x: Math.floor((COLS - 2) / 2), y: 0, kind: kind, gold: gold,

    if (collides(piece)) return false;

  function showSecret(msg) {

    secretEl.classList.add(&#x27;show&#x27;);
    soundSecret();
    if (secretTimer) clearTimeout(secretTimer);
    secretTimer = setTimeout(function(){ secretEl.classList.remove(&#x27;show&#x27;); }, 2500);
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) {
        grid[c.y][c.x] = piece.kind;
        goldGrid[c.y][c.x] = piece.gold;

    var wasGold = piece.gold, msg = piece.msg;
    piece = null;
    soundLand();
    if (wasGold &amp;&amp; msg) showSecret(msg);

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1); goldGrid.splice(r, 1);
        var empty = [], gempty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) { empty.push(0); gempty.push(false); }
        grid.unshift(empty); goldGrid.unshift(gempty);
        cleared += 1;
        r += 1;

    }
    if (cleared &gt; 0) {
      score += cleared;
      scoreEl.textContent = score;
      soundClear();
    }
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c], goldGrid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y, piece.kind, piece.gold);
      }
    }
  }

  function drawBlock(cx, cy, kind, gold) {
    var k = KINDS[kind - 1];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27; + (gold ? &#x27; golden&#x27; : &#x27;&#x27;);
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = gold ? &#x27;#ffe680&#x27; : k.c;
    el.textContent = gold ? &#x27;❓&#x27; : k.e;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { x: piece.x, y: piece.y + 1, kind: piece.kind, gold: piece.gold, msg: piece.msg };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { x: piece.x + dx, y: piece.y, kind: piece.kind, gold: piece.gold, msg: piece.msg };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    soundOver();
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    secretEl.classList.remove(&#x27;show&#x27;);
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);

          &#x27;*&#x27;

    }, true);
  });

  piece = { x: Math.floor((COLS - 2) / 2), y: 0, kind: 1, gold: false, msg: null };
  paint();

    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    lastW = w; lastH = h; applyFit();
