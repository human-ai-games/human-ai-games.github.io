&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #3a7d2c; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 18px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .hud { display: flex; gap: 22px; font-size: 20px; font-weight: 700; text-shadow: 1px 1px 0 #245018; }
  .board {
    position: relative; width: 640px; height: 430px; flex-shrink: 0;
    border-radius: 12px; overflow: hidden; cursor: none;
    background:
      radial-gradient(circle at 50% 120%, #4c9c38 0%, #3f8a2e 60%, #357326 100%);
    box-shadow: inset 0 0 60px rgba(0,60,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
  .board::after {
    content: &quot;&quot;; position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(85deg, rgba(255,255,255,.04) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 2px, transparent 2px 9px);
  }
  .tree { position: absolute; pointer-events: none; z-index: 1; }
  .hole {
    position: absolute; width: 96px; height: 44px; border-radius: 50%;
    background: radial-gradient(ellipse at center, #2a1c0d 0%, #3b2712 70%, #4a3216 100%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,.6); z-index: 2;
  }
  .critter {
    position: absolute; width: 78px; height: 90px; cursor: pointer; z-index: 3;
    transform: translateY(70px) scale(.6); opacity: 0;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .12s;
  }
  .critter.up { transform: translateY(0) scale(1); opacity: 1; }
  .critter.whacked { transform: translateY(20px) scale(.5) rotate(15deg); opacity: 0; transition: all .18s ease-in; }
  .fork { position: absolute; width: 54px; height: 66px; pointer-events: none; z-index: 20; transform: translate(-10px, -6px) rotate(0deg); transition: transform .06s; }
  .fork.swing { transform: translate(-10px, 8px) scale(1.1) rotate(-8deg); }
  .float { position: absolute; z-index: 15; font-weight: 800; font-size: 22px; pointer-events: none; text-shadow: 1px 1px 2px rgba(0,0,0,.5); animation: floatUp .7s ease-out forwards; }
  @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
  .banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; font-size: 24px; font-weight: 800; color: #fff; background: rgba(20,60,10,.45); text-shadow: 1px 2px 0 #245018; }

  /* --- smash / splatter effect --- */
  .splat { position: absolute; z-index: 16; pointer-events: none; width: 0; height: 0; }
  .ring {
    position: absolute; left: 0; top: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px;
    border-radius: 50%; border: 4px solid rgba(255,255,255,.85);
    animation: ringPop .4s ease-out forwards;
  }
  @keyframes ringPop {
    from { transform: scale(.3); opacity: .9; }
    to   { transform: scale(4.5); opacity: 0; }
  }
  .goo {
    position: absolute; left: 0; top: 0; border-radius: 50%;
    animation: gooFly .55s ease-out forwards;
  }
  @keyframes gooFly {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

&lt;div class=&quot;game&quot;&gt;

  &lt;p class=&quot;instructions&quot;&gt;Stab the happy avocados with your fork to catch them before they become guacamole — golden ones score double! Avoid the rotten brown avocados: hitting one costs you 3 points.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;img class=&quot;fork&quot; id=&quot;fork&quot; alt=&quot;&quot; src=&quot;data:image/svg+xml;utf8,&amp;lt;svg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; width=&#x27;54&#x27; height=&#x27;66&#x27; viewBox=&#x27;0 0 54 66&#x27;&amp;gt;&amp;lt;g fill=&#x27;%23d9dde3&#x27; stroke=&#x27;%238b929c&#x27; stroke-width=&#x27;1.5&#x27;&amp;gt;&amp;lt;rect x=&#x27;11&#x27; y=&#x27;2&#x27; width=&#x27;4&#x27; height=&#x27;20&#x27; rx=&#x27;1.5&#x27;/&amp;gt;&amp;lt;rect x=&#x27;19&#x27; y=&#x27;2&#x27; width=&#x27;4&#x27; height=&#x27;20&#x27; rx=&#x27;1.5&#x27;/&amp;gt;&amp;lt;rect x=&#x27;27&#x27; y=&#x27;2&#x27; width=&#x27;4&#x27; height=&#x27;20&#x27; rx=&#x27;1.5&#x27;/&amp;gt;&amp;lt;rect x=&#x27;35&#x27; y=&#x27;2&#x27; width=&#x27;4&#x27; height=&#x27;20&#x27; rx=&#x27;1.5&#x27;/&amp;gt;&amp;lt;path d=&#x27;M9,22 Q25,30 41,22 L38,30 Q25,36 12,30 Z&#x27;/&amp;gt;&amp;lt;rect x=&#x27;22&#x27; y=&#x27;30&#x27; width=&#x27;6&#x27; height=&#x27;34&#x27; rx=&#x27;3&#x27;/&amp;gt;&amp;lt;/g&amp;gt;&amp;lt;/svg&amp;gt;&quot;&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var BOARD_W = 640, BOARD_H = 430;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var fork = document.getElementById(&#x27;fork&#x27;);

  var score = 0;
  var running = false;
  var spawnTimer = null;
  var activeTimeouts = [];
  var holes = [];

  function avoSVG(type) {
    var body = &#x27;#7cb342&#x27;, bodyDark = &#x27;#558b2f&#x27;, flesh = &#x27;#c5e17a&#x27;, pit = &#x27;#8d5524&#x27;;
    var mouth = &#x27;M28,66 Q39,74 50,66&#x27;;
    var eyeColor = &#x27;#222&#x27;;
    if (type === &#x27;gold&#x27;) { body = &#x27;#f4c430&#x27;; bodyDark = &#x27;#c99700&#x27;; flesh = &#x27;#ffe58a&#x27;; }
    if (type === &#x27;rotten&#x27;) {
      body = &#x27;#6b4c2a&#x27;; bodyDark = &#x27;#4a3316&#x27;; flesh = &#x27;#8a6d3b&#x27;; pit = &#x27;#3b2a13&#x27;;
      mouth = &#x27;M28,70 Q39,62 50,70&#x27;;
      eyeColor = &#x27;#2b1d0d&#x27;;
    }
    var spots = &#x27;&#x27;;
    if (type === &#x27;rotten&#x27;) {
      spots = &quot;&lt;circle cx=&#x27;30&#x27; cy=&#x27;45&#x27; r=&#x27;5&#x27; fill=&#x27;rgba(0,0,0,.3)&#x27;/&gt;&lt;circle cx=&#x27;52&#x27; cy=&#x27;55&#x27; r=&#x27;4&#x27; fill=&#x27;rgba(0,0,0,.3)&#x27;/&gt;&lt;circle cx=&#x27;44&#x27; cy=&#x27;38&#x27; r=&#x27;3&#x27; fill=&#x27;rgba(0,0,0,.3)&#x27;/&gt;&quot;;
    }
    var sparkle = &#x27;&#x27;;
    if (type === &#x27;gold&#x27;) {
      sparkle = &quot;&lt;text x=&#x27;60&#x27; y=&#x27;20&#x27; font-size=&#x27;16&#x27;&gt;✨&lt;/text&gt;&quot;;
    }
    return &quot;data:image/svg+xml;utf8,&quot; + encodeURIComponent(
      &quot;&lt;svg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; width=&#x27;78&#x27; height=&#x27;90&#x27; viewBox=&#x27;0 0 78 90&#x27;&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;39&#x27; cy=&#x27;55&#x27; rx=&#x27;30&#x27; ry=&#x27;34&#x27; fill=&#x27;&quot;+body+&quot;&#x27; stroke=&#x27;&quot;+bodyDark+&quot;&#x27; stroke-width=&#x27;3&#x27;/&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;39&#x27; cy=&#x27;58&#x27; rx=&#x27;20&#x27; ry=&#x27;23&#x27; fill=&#x27;&quot;+flesh+&quot;&#x27;/&gt;&quot;
      + &quot;&lt;circle cx=&#x27;39&#x27; cy=&#x27;60&#x27; r=&#x27;11&#x27; fill=&#x27;&quot;+pit+&quot;&#x27;/&gt;&quot;
      + spots
      + &quot;&lt;circle cx=&#x27;31&#x27; cy=&#x27;42&#x27; r=&#x27;4.5&#x27; fill=&#x27;&quot;+eyeColor+&quot;&#x27;/&gt;&lt;circle cx=&#x27;47&#x27; cy=&#x27;42&#x27; r=&#x27;4.5&#x27; fill=&#x27;&quot;+eyeColor+&quot;&#x27;/&gt;&quot;
      + &quot;&lt;circle cx=&#x27;32.5&#x27; cy=&#x27;40.5&#x27; r=&#x27;1.5&#x27; fill=&#x27;#fff&#x27;/&gt;&lt;circle cx=&#x27;48.5&#x27; cy=&#x27;40.5&#x27; r=&#x27;1.5&#x27; fill=&#x27;#fff&#x27;/&gt;&quot;
      + &quot;&lt;path d=&#x27;&quot;+mouth+&quot;&#x27; fill=&#x27;none&#x27; stroke=&#x27;&quot;+eyeColor+&quot;&#x27; stroke-width=&#x27;3&#x27; stroke-linecap=&#x27;round&#x27;/&gt;&quot;
      + sparkle
      + &quot;&lt;/svg&gt;&quot;
    );
  }

  function treeSVG() {
    return &quot;data:image/svg+xml;utf8,&quot; + encodeURIComponent(
      &quot;&lt;svg xmlns=&#x27;http://www.w3.org/2000/svg&#x27; width=&#x27;70&#x27; height=&#x27;90&#x27; viewBox=&#x27;0 0 70 90&#x27;&gt;&quot;
      + &quot;&lt;rect x=&#x27;30&#x27; y=&#x27;55&#x27; width=&#x27;10&#x27; height=&#x27;30&#x27; rx=&#x27;3&#x27; fill=&#x27;#6d4c2b&#x27;/&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;35&#x27; cy=&#x27;36&#x27; rx=&#x27;30&#x27; ry=&#x27;28&#x27; fill=&#x27;#3e8e2f&#x27;/&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;35&#x27; cy=&#x27;30&#x27; rx=&#x27;22&#x27; ry=&#x27;20&#x27; fill=&#x27;#4caf3a&#x27;/&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;24&#x27; cy=&#x27;40&#x27; rx=&#x27;8&#x27; ry=&#x27;11&#x27; fill=&#x27;#7cb342&#x27; stroke=&#x27;#558b2f&#x27; stroke-width=&#x27;2&#x27;/&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;46&#x27; cy=&#x27;44&#x27; rx=&#x27;7&#x27; ry=&#x27;10&#x27; fill=&#x27;#7cb342&#x27; stroke=&#x27;#558b2f&#x27; stroke-width=&#x27;2&#x27;/&gt;&quot;
      + &quot;&lt;ellipse cx=&#x27;38&#x27; cy=&#x27;24&#x27; rx=&#x27;6&#x27; ry=&#x27;9&#x27; fill=&#x27;#7cb342&#x27; stroke=&#x27;#558b2f&#x27; stroke-width=&#x27;2&#x27;/&gt;&quot;
      + &quot;&lt;/svg&gt;&quot;
    );
  }

  function buildScenery() {
    var treePos = [ [10,-4], [560,2], [280,-8], [-6,300], [590,300] ];
    treePos.forEach(function(p) {
      var img = document.createElement(&#x27;img&#x27;);
      img.className = &#x27;tree&#x27;;
      img.src = treeSVG();
      img.style.left = p[0] + &#x27;px&#x27;;
      img.style.top = p[1] + &#x27;px&#x27;;
      img.width = 70; img.height = 90;
      board.appendChild(img);
    });

    holes = [];
    var cols = 4, rows = 2;
    var startX = 40, startY = 130, gapX = 150, gapY = 150;
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; cols; c++) {
        var hole = document.createElement(&#x27;div&#x27;);
        hole.className = &#x27;hole&#x27;;
        var x = startX + c * gapX;
        var y = startY + r * gapY;
        hole.style.left = x + &#x27;px&#x27;;
        hole.style.top = y + &#x27;px&#x27;;
        board.appendChild(hole);
        holes.push({ x: x, y: y, busy: false });
      }
    }
  }

  // ---- audio ----
  var actx = null;
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === &#x27;suspended&#x27;) actx.resume();
    } catch (_) {}
    return actx;
  }
  function beep(freq, dur, type, vol) {
    try {
      var a = ensureAudio(); if (!a) return;
      var o = a.createOscillator(), g = a.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(vol == null ? 0.18 : vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      o.start(); o.stop(a.currentTime + dur);
    } catch (_) {}
  }

  // crunchy smash: short noise burst + low thump
  function smashSound() {
    try {
      var a = ensureAudio(); if (!a) return;
      var dur = 0.18;
      var buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i &lt; data.length; i++) {
        var t = i / data.length;
        data[i] = (Math.random() * 2 - 1) * (1 - t) * (1 - t);
      }
      var noise = a.createBufferSource(); noise.buffer = buf;
      var ng = a.createGain(); ng.gain.value = 0.35;
      var lp = a.createBiquadFilter(); lp.type = &#x27;lowpass&#x27;; lp.frequency.value = 1800;
      noise.connect(lp); lp.connect(ng); ng.connect(a.destination);
      noise.start();
      // low thump
      var o = a.createOscillator(), g = a.createGain();
      o.type = &#x27;sine&#x27;; o.frequency.setValueAtTime(180, a.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, a.currentTime + 0.15);
      g.gain.setValueAtTime(0.3, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.18);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + 0.18);
    } catch (_) {}
  }

  // ---- suspenseful background music (looping) ----
  var musicTimer = null;
  var musicStep = 0;
  // low, tense minor-ish bass pattern
  var bassNotes = [55, 55, 65.4, 55, 58.3, 55, 49, 55];
  function musicTick() {
    if (!running) return;
    var a = ensureAudio(); if (!a) return;
    var note = bassNotes[musicStep % bassNotes.length];
    // pulsing bass
    var o = a.createOscillator(), g = a.createGain();
    o.type = &#x27;triangle&#x27;; o.frequency.value = note;
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.linearRampToValueAtTime(0.16, a.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.35);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.4);
    // occasional eerie high shimmer on off-beats
    if (musicStep % 4 === 2) {
      var o2 = a.createOscillator(), g2 = a.createGain();
      o2.type = &#x27;sine&#x27;; o2.frequency.value = note * 6 + (Math.random()*8);
      g2.gain.setValueAtTime(0.0001, a.currentTime);
      g2.gain.linearRampToValueAtTime(0.05, a.currentTime + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
      o2.connect(g2); g2.connect(a.destination);
      o2.start(); o2.stop(a.currentTime + 0.55);
    }
    musicStep++;
    // tempo speeds up slightly with game speed for more tension
    var stepMs = 340 / Math.min(currentSpeed(), 2);
    musicTimer = setTimeout(musicTick, stepMs);
  }
  function startMusic() {
    stopMusic();
    musicStep = 0;
    musicTick();
  }
  function stopMusic() {
    if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  }

  // ---- splatter visual ----
  function splatEffect(x, y, type) {
    var container = document.createElement(&#x27;div&#x27;);
    container.className = &#x27;splat&#x27;;
    container.style.left = x + &#x27;px&#x27;;
    container.style.top = y + &#x27;px&#x27;;
    board.appendChild(container);

    var ring = document.createElement(&#x27;div&#x27;);
    ring.className = &#x27;ring&#x27;;
    if (type === &#x27;gold&#x27;) ring.style.borderColor = &#x27;rgba(255,224,102,.9)&#x27;;
    if (type === &#x27;rotten&#x27;) ring.style.borderColor = &#x27;rgba(90,60,30,.9)&#x27;;
    container.appendChild(ring);

    var color = &#x27;#a4d65e&#x27;;
    if (type === &#x27;gold&#x27;) color = &#x27;#ffe066&#x27;;
    if (type === &#x27;rotten&#x27;) color = &#x27;#6b4c2a&#x27;;

    var n = 9;
    for (var i = 0; i &lt; n; i++) {
      var goo = document.createElement(&#x27;div&#x27;);
      goo.className = &#x27;goo&#x27;;
      var size = 6 + Math.random() * 12;
      goo.style.width = size + &#x27;px&#x27;;
      goo.style.height = size + &#x27;px&#x27;;
      goo.style.marginLeft = (-size/2) + &#x27;px&#x27;;
      goo.style.marginTop = (-size/2) + &#x27;px&#x27;;
      goo.style.background = color;
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      var dist = 40 + Math.random() * 50;
      goo.style.setProperty(&#x27;--dx&#x27;, Math.cos(ang) * dist + &#x27;px&#x27;);
      goo.style.setProperty(&#x27;--dy&#x27;, Math.sin(ang) * dist + &#x27;px&#x27;);
      container.appendChild(goo);
    }
    setTimeout(function () { if (container.parentNode) container.parentNode.removeChild(container); }, 600);
  }

  function floatText(x, y, txt, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = txt;
    f.style.color = color;
    f.style.left = x + &#x27;px&#x27;;
    f.style.top = y + &#x27;px&#x27;;
    board.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 720);
  }

  function currentSpeed() {
    return Math.min(1 + score / 60, 3.0);
  }
  function updateSpeedHud() {
    speedEl.textContent = currentSpeed().toFixed(1) + &#x27;x&#x27;;
  }

  function spawnCritter() {
    if (!running) return;
    var free = holes.filter(function (h) { return !h.busy; });
    if (free.length === 0) return;
    var hole = free[Math.floor(Math.random() * free.length)];
    hole.busy = true;

    var roll = Math.random();
    var type = &#x27;normal&#x27;;
    if (roll &lt; 0.18) type = &#x27;rotten&#x27;;
    else if (roll &lt; 0.34) type = &#x27;gold&#x27;;

    var c = document.createElement(&#x27;img&#x27;);
    c.className = &#x27;critter&#x27;;
    c.src = avoSVG(type);
    c.width = 78; c.height = 90;
    c.style.left = (hole.x + 96/2 - 78/2) + &#x27;px&#x27;;
    c.style.top = (hole.y - 62) + &#x27;px&#x27;;
    board.appendChild(c);
    requestAnimationFrame(function () { c.classList.add(&#x27;up&#x27;); });

    running = true;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    updateSpeedHud();
    banner.style.display = &#x27;none&#x27;;
    clearActive();
    ensureAudio();
    startMusic();
    spawnCritter();
    scheduleNext();

  function stopGame() {

    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    stopMusic();
    clearActive();
    banner.textContent = &#x27;Game over — Score: &#x27; + score;
    banner.style.display = &#x27;flex&#x27;;

  window.addEventListener(&#x27;message&#x27;, function (e) {
