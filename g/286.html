<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Snake</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .cell { position: absolute; box-sizing: border-box; }
  .snake { background: #555; border-radius: 2px; }
  .food { background: #444; border-radius: 50%; }
  .enemy { background: transparent; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys, eat food to grow, and wrap around the edges. Dodge the triangle enemies — a hit to your head ends the round, but a hit to your body just chops off your tail there. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var TICK_MS = 150;
  var running = false, tickId = null, gameOver = false;
  var snake = [];  // array of {x, y} in cell coords, head at index 0
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var score = 0;

  var enemies = [];           // each: {x,y, type, dirx,diry, dieAt, accum}
  var ENEMY_SPEED = 0.25;     // quarter of the snake&#x27;s speed
  var MAX_ENEMIES = 3;
  var lastSpawnCheck = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  function clearField() { field.innerHTML = &#x27;&#x27;; }

  function drawCell(cls, x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
    return el;
  }

  function enemyColor(type) {
    if (type === &#x27;red&#x27;) return &#x27;#d33&#x27;;
    if (type === &#x27;blue&#x27;) return &#x27;#36c&#x27;;
    return &#x27;#2b9d3a&#x27;; // green
  }

  function drawEnemy(en) {
    var el = drawCell(&#x27;enemy&#x27;, en.x, en.y);
    el.style.width = &#x27;0&#x27;;
    el.style.height = &#x27;0&#x27;;
    var half = CELL / 2;
    el.style.borderLeft = half + &#x27;px solid transparent&#x27;;
    el.style.borderRight = half + &#x27;px solid transparent&#x27;;
    el.style.borderBottom = CELL + &#x27;px solid &#x27; + enemyColor(en.type);
  }

  function paint() {
    clearField();
    drawCell(&#x27;food&#x27;, food.x, food.y);
    for (var i = 0; i &lt; snake.length; i++) drawCell(&#x27;snake&#x27;, snake[i].x, snake[i].y);
    for (var j = 0; j &lt; enemies.length; j++) drawEnemy(enemies[j]);
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function enemyAt(x, y) {
    for (var i = 0; i &lt; enemies.length; i++) if (enemies[i].x === x &amp;&amp; enemies[i].y === y) return true;
    return false;
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y) &amp;&amp; !enemyAt(x, y)) { food = { x: x, y: y }; return; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  // ---- Enemy spawning ----
  function spawnEnemy() {
    var types = [&#x27;red&#x27;, &#x27;blue&#x27;, &#x27;green&#x27;];
    var type = types[Math.floor(Math.random() * types.length)];
    var x, y, tries = 0;
    do {
      x = Math.floor(Math.random() * COLS);
      y = Math.floor(Math.random() * ROWS);
      tries++;
    } while ((cellOccupied(x, y) || enemyAt(x, y) || (x === food.x &amp;&amp; y === food.y)) &amp;&amp; tries &lt; 100);
    // life span 5–15 seconds
    var lifeMs = 5000 + Math.random() * 10000;
    enemies.push({
      x: x, y: y, type: type,
      dirx: Math.random() &lt; 0.5 ? 1 : -1,
      diry: Math.random() &lt; 0.5 ? 1 : -1,
      dieAt: Date.now() + lifeMs,
      accum: 0
    });
  }

  // Spawn chance grows with snake length. Checked ~once per second.
  function trySpawn() {
    if (enemies.length &gt;= MAX_ENEMIES) return;
    var now = Date.now();
    if (now - lastSpawnCheck &lt; 1000) return;
    lastSpawnCheck = now;
    // base 8% + 2% per body segment beyond the start, capped at ~70%.
    var chance = 0.08 + 0.02 * Math.max(0, snake.length - 3);
    if (chance &gt; 0.7) chance = 0.7;
    if (Math.random() &lt; chance) spawnEnemy();
  }

  function wrapDelta(target, cur, size) {
    var d = target - cur;
    if (d &gt; size / 2) d -= size;
    else if (d &lt; -size / 2) d += size;
    return d;
  }

  // Clamp a candidate move to inside the field (enemies can&#x27;t cross edges).
  function clampMove(en, stepX, stepY) {
    var nx = en.x + stepX, ny = en.y + stepY;
    if (nx &lt; 0 || nx &gt;= COLS) { stepX = 0; nx = en.x; }
    if (ny &lt; 0 || ny &gt;= ROWS) { stepY = 0; ny = en.y; }
    en.x = nx; en.y = ny;
  }

  function moveTowardHead(en, randomChance) {
    if (Math.random() &lt; randomChance) { moveRandom(en); return; }
    var head = snake[0];
    var dx = wrapDelta(head.x, en.x, COLS);
    var dy = wrapDelta(head.y, en.y, ROWS);
    var stepX = 0, stepY = 0;
    if (Math.abs(dx) &gt;= Math.abs(dy)) {
      if (dx !== 0) stepX = dx &gt; 0 ? 1 : -1;
      else if (dy !== 0) stepY = dy &gt; 0 ? 1 : -1;
    } else {
      if (dy !== 0) stepY = dy &gt; 0 ? 1 : -1;
      else if (dx !== 0) stepX = dx &gt; 0 ? 1 : -1;
    }
    clampMove(en, stepX, stepY);
  }

  function moveRandom(en) {
    var dirs = [ [1,0],[-1,0],[0,1],[0,-1] ];
    // Filter to moves that stay in bounds.
    var valid = dirs.filter(function (d) {
      var nx = en.x + d[0], ny = en.y + d[1];
      return nx &gt;= 0 &amp;&amp; nx &lt; COLS &amp;&amp; ny &gt;= 0 &amp;&amp; ny &lt; ROWS;
    });
    if (valid.length === 0) return;
    var pick = valid[Math.floor(Math.random() * valid.length)];
    clampMove(en, pick[0], pick[1]);
  }

  // Blue: patrol the borders. Move along the current edge; if not on an
  // edge, head toward the nearest one.
  function movePatrol(en) {
    var onLeft = en.x === 0, onRight = en.x === COLS - 1;
    var onTop = en.y === 0, onBottom = en.y === ROWS - 1;
    var onEdge = onLeft || onRight || onTop || onBottom;
    if (!onEdge) {
      // Move toward the nearest edge.
      var distLeft = en.x, distRight = COLS - 1 - en.x;
      var distTop = en.y, distBottom = ROWS - 1 - en.y;
      var m = Math.min(distLeft, distRight, distTop, distBottom);
      if (m === distLeft) clampMove(en, -1, 0);
      else if (m === distRight) clampMove(en, 1, 0);
      else if (m === distTop) clampMove(en, 0, -1);
      else clampMove(en, 0, 1);
      return;
    }
    // Walk clockwise around the perimeter.
    var stepX = 0, stepY = 0;
    if (onTop &amp;&amp; !onRight) stepX = 1;
    else if (onRight &amp;&amp; !onBottom) stepY = 1;
    else if (onBottom &amp;&amp; !onLeft) stepX = -1;
    else if (onLeft &amp;&amp; !onTop) stepY = -1;
    else if (onTop) stepX = 1;
    clampMove(en, stepX, stepY);
  }

  function moveEnemy(en) {
    if (en.type === &#x27;red&#x27;) moveTowardHead(en, 0.35);   // chases often, sometimes random
    else if (en.type === &#x27;blue&#x27;) movePatrol(en);       // patrols borders
    else moveRandom(en);                               // green: random
  }

  // Check enemy collisions with the snake. Returns true if game over.
  function resolveEnemyCollisions() {
    for (var e = 0; e &lt; enemies.length; e++) {
      var en = enemies[e];
      // Head collision → game over.
      if (snake[0].x === en.x &amp;&amp; snake[0].y === en.y) return true;
      // Body collision → chop tail at that point.
      for (var i = 1; i &lt; snake.length; i++) {
        if (snake[i].x === en.x &amp;&amp; snake[i].y === en.y) {
          snake = snake.slice(0, i);
          break;
        }
      }
    }
    return false;
  }

  function tick() {
    if (!running) return;
    // Commit queued direction (blocking 180-degree reversal).
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    // Wrap around the edges instead of ending the game.
    if (nx &lt; 0) nx = COLS - 1;
    else if (nx &gt;= COLS) nx = 0;
    if (ny &lt; 0) ny = ROWS - 1;
    else if (ny &gt;= ROWS) ny = 0;
    // Self-collision (skip tail if not eating — it moves out of the way).
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }

    // Remove expired enemies.
    var now = Date.now();
    enemies = enemies.filter(function (en) { return en.dieAt &gt; now; });

    // Move enemies at 0.25x snake speed.
    for (var e = 0; e &lt; enemies.length; e++) {
      var en = enemies[e];
      en.accum += ENEMY_SPEED;
      if (en.accum &gt;= 1) { en.accum -= 1; moveEnemy(en); }
    }

    // Try to spawn more enemies (rate scales with snake length).
    trySpawn();

    if (resolveEnemyCollisions()) { paint(); endGame(); return; }
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    initSnake();
    enemies = [];
    lastSpawnCheck = Date.now();
    placeFood();
    // Spawn one enemy immediately so there&#x27;s motion within a second.
    spawnEnemy();
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the snake + food before pressing Start.
  initSnake();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
