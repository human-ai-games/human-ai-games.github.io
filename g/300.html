  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐍 Snake</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0;
    border-radius: 8px; overflow: hidden;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 20px, rgba(0,0,0,0.03) 20px 40px),
      linear-gradient(180deg, #8fc65a 0%, #6faf3e 55%, #5a9b34 100%);
    box-shadow: inset 0 0 50px rgba(40,70,20,0.35); }
  .cell { position: absolute; box-sizing: border-box; }

  .tuft { position: absolute; color: rgba(40,90,25,0.5); font-size: 14px; pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,0.15); }

  .seg { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7bd15a, #3e8b32 70%, #2e6b26);
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3); }
  .head { border-radius: 55% 55% 45% 45%; background: radial-gradient(circle at 40% 35%, #86dd63, #3e8b32 75%);
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3); z-index: 5; }
  .eye { position: absolute; width: 5px; height: 5px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 0 1px #222; }
  .eye::after { content: &#x27;&#x27;; position: absolute; left: 1.5px; top: 1.5px; width: 2px; height: 2px; background: #111; border-radius: 50%; }
  .tongue { position: absolute; width: 3px; height: 10px; background: #d1385a; transform-origin: top center;
    border-radius: 2px; }
  .tongue::before, .tongue::after { content: &#x27;&#x27;; position: absolute; bottom: -3px; width: 3px; height: 4px; background: #d1385a; border-radius: 2px; }
  .tongue::before { left: -1px; transform: rotate(20deg); }
  .tongue::after { left: 1px; transform: rotate(-20deg); }
  .mouse { display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 4;
    animation: scurry 0.5s infinite alternate ease-in-out; }
  @keyframes scurry { from { transform: translateX(-1px) rotate(-4deg); } to { transform: translateX(1px) rotate(4deg); } }
  .trap { display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 3;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }

  .warn { background: rgba(255,140,0,0.28); box-shadow: inset 0 0 6px rgba(255,120,0,0.6);
    z-index: 2; animation: pulse 0.35s infinite alternate; }
  @keyframes pulse { from { opacity: 0.4; } to { opacity: 0.9; } }
  .fire { display: flex; align-items: center; justify-content: center; font-size: 17px; z-index: 6;
    background: radial-gradient(circle at 50% 60%, rgba(255,200,40,0.7), rgba(255,80,0,0.5) 70%, transparent);
    animation: flick 0.18s infinite alternate; }
  @keyframes flick { from { transform: scale(0.9) translateY(1px); } to { transform: scale(1.08) translateY(-1px); } }

  .banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 30px; font-weight: 700; z-index: 20; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐍 Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys to catch the mouse — walls wrap you around to the other side. Dodge the spiky traps and the sweeping lines of fire (a glow warns you first), or it&#x27;s game over!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;Game Over&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var TICK_MS = 150;
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var traps = [];
  var tufts = [];
  var score = 0;
  var tickCount = 0;
  // fire: {cells:[{x,y}], state:&#x27;warn&#x27;|&#x27;fire&#x27;, timer:int}
  var fires = [];
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);

  /* ---------- audio ---------- */
  var actx = null;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { actx = null; }
    }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) { try { actx.resume(); } catch (_) {} }
  }
  function slither() {
    if (!actx) return;
    var t = actx.currentTime;
    var dur = 0.12;
    var buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i &lt; d.length; i++) {
      var env = 1 - i / d.length;
      d[i] = (Math.random() * 2 - 1) * env * 0.5;
    }
    var src = actx.createBufferSource(); src.buffer = buf;
    var bp = actx.createBiquadFilter(); bp.type = &#x27;bandpass&#x27;; bp.frequency.value = 5500; bp.Q.value = 0.8;
    var g = actx.createGain(); g.gain.value = 0.06;
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t);
  }
  function squeak() {
    if (!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator(); o.type = &#x27;square&#x27;;
    o.frequency.setValueAtTime(900, t);
    o.frequency.exponentialRampToValueAtTime(1700, t + 0.08);
    o.frequency.exponentialRampToValueAtTime(1100, t + 0.16);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.2);
  }
  function whoosh() {
    if (!actx) return;
    var t = actx.currentTime;
    var dur = 0.5;
    var buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i &lt; d.length; i++) d[i] = (Math.random() * 2 - 1);
    var src = actx.createBufferSource(); src.buffer = buf;
    var bp = actx.createBiquadFilter(); bp.type = &#x27;bandpass&#x27;; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(400, t);
    bp.frequency.exponentialRampToValueAtTime(2500, t + dur);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(actx.destination);
    src.start(t);
  }
  function boom() {
    if (!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator(); o.type = &#x27;sawtooth&#x27;;
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.5);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.6);
  }

  /* ---------- rendering ---------- */
  function segEl(cls, x, y, size) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    var s = size || CELL;
    var off = (CELL - s) / 2;
    el.style.left = (x * CELL + off) + &#x27;px&#x27;;
    el.style.top = (y * CELL + off) + &#x27;px&#x27;;
    el.style.width = s + &#x27;px&#x27;;
    el.style.height = s + &#x27;px&#x27;;
    field.appendChild(el);
    return el;
  }

  function makeTufts() {
    tufts = [];
    for (var i = 0; i &lt; 40; i++) {
      tufts.push({ x: Math.random() * 600, y: Math.random() * 440, c: [&#x27;🌿&#x27;,&#x27;🌱&#x27;,&#x27;☘️&#x27;][i % 3] });
    }
  }

  function paint() {
    var kids = Array.prototype.slice.call(field.children);
    for (var k = 0; k &lt; kids.length; k++) if (kids[k] !== banner) field.removeChild(kids[k]);

    for (var g = 0; g &lt; tufts.length; g++) {
      var tf = document.createElement(&#x27;div&#x27;);
      tf.className = &#x27;tuft&#x27;;
      tf.textContent = tufts[g].c;
      tf.style.left = tufts[g].x + &#x27;px&#x27;;
      tf.style.top = tufts[g].y + &#x27;px&#x27;;
      field.appendChild(tf);
    }

    // fire (warn + fire states)
    for (var f = 0; f &lt; fires.length; f++) {
      var fr = fires[f];
      for (var c = 0; c &lt; fr.cells.length; c++) {
        var fe = segEl(fr.state === &#x27;fire&#x27; ? &#x27;fire&#x27; : &#x27;warn&#x27;, fr.cells[c].x, fr.cells[c].y, CELL);
        if (fr.state === &#x27;fire&#x27;) fe.textContent = &#x27;🔥&#x27;;
      }
    }

    for (var tp = 0; tp &lt; traps.length; tp++) {
      var te = segEl(&#x27;trap&#x27;, traps[tp].x, traps[tp].y, CELL);
      te.textContent = &#x27;🌵&#x27;;
    }

    var m = segEl(&#x27;mouse&#x27;, food.x, food.y, CELL);
    m.textContent = &#x27;🐭&#x27;;

    for (var i = snake.length - 1; i &gt;= 1; i--) {
      var t = 1 - (i / snake.length) * 0.35;
      segEl(&#x27;seg&#x27;, snake[i].x, snake[i].y, Math.round(CELL * (0.7 + 0.25 * t)));
    }

    if (snake.length) {
      var head = snake[0];
      var h = segEl(&#x27;head&#x27;, head.x, head.y, CELL);
      var angle = 0;
      if (dir.x === 1) angle = 0;
      else if (dir.x === -1) angle = 180;
      else if (dir.y === -1) angle = -90;
      else if (dir.y === 1) angle = 90;
      h.style.transform = &#x27;rotate(&#x27; + angle + &#x27;deg)&#x27;;
      var e1 = document.createElement(&#x27;div&#x27;); e1.className = &#x27;eye&#x27;;
      var e2 = document.createElement(&#x27;div&#x27;); e2.className = &#x27;eye&#x27;;
      e1.style.left = &#x27;11px&#x27;; e1.style.top = &#x27;3px&#x27;;
      e2.style.left = &#x27;11px&#x27;; e2.style.top = &#x27;11px&#x27;;
      h.appendChild(e1); h.appendChild(e2);
      var tg = document.createElement(&#x27;div&#x27;); tg.className = &#x27;tongue&#x27;;
      tg.style.left = &#x27;18px&#x27;; tg.style.top = &#x27;8px&#x27;;
      tg.style.transform = &#x27;rotate(-90deg)&#x27;;
      h.appendChild(tg);
    }
  }

  /* ---------- helpers ---------- */
  function occupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    for (var j = 0; j &lt; traps.length; j++) if (traps[j].x === x &amp;&amp; traps[j].y === y) return true;
    if (food.x === x &amp;&amp; food.y === y) return true;
    return false;
  }

  function randFreeCell() {
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!occupied(x, y)) return { x: x, y: y };
    }
    return { x: 0, y: 0 };
  }

  function placeFood() { food = randFreeCell(); }

  function placeTraps() {
    traps = [];
    for (var i = 0; i &lt; 5; i++) traps.push(randFreeCell());
  }

  function spawnFire() {
    var cells = [];
    var horizontal = Math.random() &lt; 0.5;
    if (horizontal) {
      var row = Math.floor(Math.random() * ROWS);
      for (var x = 0; x &lt; COLS; x++) cells.push({ x: x, y: row });
    } else {
      var col = Math.floor(Math.random() * COLS);
      for (var y = 0; y &lt; ROWS; y++) cells.push({ x: col, y: y });
    }
    fires.push({ cells: cells, state: &#x27;warn&#x27;, timer: 8 }); // ~1.2s warn
    whoosh();
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  /* ---------- game loop ---------- */
  function tick() {
    if (!running) return;
    tickCount++;

    // advance fire states
    for (var f = fires.length - 1; f &gt;= 0; f--) {
      fires[f].timer--;
      if (fires[f].timer &lt;= 0) {
        if (fires[f].state === &#x27;warn&#x27;) { fires[f].state = &#x27;fire&#x27;; fires[f].timer = 10; whoosh(); }
        else { fires.splice(f, 1); }
      }
    }
    // occasionally spawn new fire
    if (tickCount % 28 === 0 &amp;&amp; fires.length &lt; 2) spawnFire();

    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0) nx = COLS - 1; else if (nx &gt;= COLS) nx = 0;
    if (ny &lt; 0) ny = ROWS - 1; else if (ny &gt;= ROWS) ny = 0;

    // active fire collision
    for (var ff = 0; ff &lt; fires.length; ff++) {
      if (fires[ff].state !== &#x27;fire&#x27;) continue;
      for (var fc = 0; fc &lt; fires[ff].cells.length; fc++) {
        if (fires[ff].cells[fc].x === nx &amp;&amp; fires[ff].cells[fc].y === ny) { endGame(); return; }
      }
    }

    for (var tp = 0; tp &lt; traps.length; tp++) {
      if (traps[tp].x === nx &amp;&amp; traps[tp].y === ny) { endGame(); return; }
    }

    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      squeak();
      placeFood();
    } else {
      snake.pop();
    }
    if (tickCount % 2 === 0) slither();
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
    banner.style.display = &#x27;flex&#x27;;
    boom();
  }

  function startGame() {
    ensureAudio();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    tickCount = 0;
    fires = [];
    banner.style.display = &#x27;none&#x27;;
    makeTufts();
    initSnake();
    placeTraps();
    placeFood();
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
    spawnFire();
    paint();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    ensureAudio();
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  makeTufts();
  initSnake();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);

<script>
