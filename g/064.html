<title>Pong Duel</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Pong Duel</b> &middot; Game 064 &middot; Professional producer &middot; Basic game: Paddle and ball</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .scoreboard { display: flex; gap: 40px; font-size: 20px; }
  .scoreboard .cpu { color: #c0392b; }
  .scoreboard .you { color: #2471a3; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; background: #1c2833; border-radius: 8px; overflow: hidden; }
  .midline { position: absolute; left: 0; top: 50%; width: 100%; height: 2px; background: repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 24px); opacity: .3; }
  .paddle { position: absolute; height: 14px; border-radius: 4px; transition: width .15s; }
  .paddle.you { background: #5dade2; bottom: 10px; }
  .paddle.cpu { background: #ec7063; top: 10px; }
  .ball { position: absolute; width: 16px; height: 16px; background: #f7dc6f; border-radius: 50%; box-shadow: 0 0 8px rgba(247,220,111,.6); }
  .powerup { position: absolute; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.5); animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.18);} }
  .msg { position: absolute; left: 0; top: 42%; width: 100%; text-align: center; color: #fff; font-size: 28px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .banner { position: absolute; left: 0; top: 8px; width: 100%; text-align: center; color: #f7dc6f; font-size: 16px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Pong Duel&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys and keep the ball from getting past you. Hit the glowing power-ups near the middle for surprise effects — first to 7 wins.&lt;/p&gt;
  &lt;div class=&quot;scoreboard&quot;&gt;
    &lt;div class=&quot;cpu&quot;&gt;Computer: &lt;span id=&quot;cpuScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;you&quot;&gt;You: &lt;span id=&quot;youScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;midline&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;paddle cpu&quot; id=&quot;cpu&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;paddle you&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_MARGIN = 10, PADDLE_SPEED = 7;
  var BALL_SIZE = 16;
  var BALL_SPEED = 2.6;
  var CPU_SPEED = 3.9;
  var WIN_SCORE = 7;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var cpuX = (FIELD_W - PADDLE_W) / 2;
  var youW = PADDLE_W, cpuW = PADDLE_W;
  var ballX = FIELD_W / 2, ballY = FIELD_H / 2;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var spin = 0;              // curve effect
  var invisibleUntil = 0;    // timestamp for invisible ball
  var youScore = 0, cpuScore = 0;
  var powerup = null;        // {x,y,type}
  var nextPowerT = 0;
  var effectResetT = 0;      // when to restore paddle widths
  var frame = 0;

  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var cpu = document.getElementById(&#x27;cpu&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var youScoreEl = document.getElementById(&#x27;youScore&#x27;);
  var cpuScoreEl = document.getElementById(&#x27;cpuScore&#x27;);
  var msg = document.getElementById(&#x27;msg&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);

  var POWERS = [
    { type: &#x27;speed&#x27;,     icon: &#x27;⚡&#x27;, label: &#x27;Speed boost!&#x27; },
    { type: &#x27;curve&#x27;,     icon: &#x27;🌀&#x27;, label: &#x27;Curveball!&#x27; },
    { type: &#x27;invisible&#x27;, icon: &#x27;👻&#x27;, label: &#x27;Invisible ball!&#x27; },
    { type: &#x27;shrinkcpu&#x27;, icon: &#x27;✂️&#x27;, label: &#x27;Computer paddle shrunk!&#x27; },
    { type: &#x27;widen&#x27;,     icon: &#x27;↔️&#x27;, label: &#x27;Your paddle widened!&#x27; }
  ];

  function paint() {
    paddle.style.width = youW + &#x27;px&#x27;;
    cpu.style.width = cpuW + &#x27;px&#x27;;
    paddle.style.left = paddleX + &#x27;px&#x27;;
    cpu.style.left = cpuX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
    ball.style.opacity = (frame &lt; invisibleUntil) ? &#x27;0.06&#x27; : &#x27;1&#x27;;
  }

  function serveBall(dir) {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = (FIELD_H - BALL_SIZE) / 2;
    var sp = BALL_SPEED;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * sp;
    ballVY = dir * sp;
    spin = 0;
  }

  function showMsg(text) { msg.textContent = text; msg.style.display = &#x27;block&#x27;; }
  function hideMsg() { msg.style.display = &#x27;none&#x27;; }
  function showBanner(text) {
    banner.textContent = text;
    banner._t = frame + 120;
  }

  function spawnPowerup() {
    var p = POWERS[Math.floor(Math.random() * POWERS.length)];
    powerup = {
      type: p.type, icon: p.icon, label: p.label,
      x: 60 + Math.random() * (FIELD_W - 120),
      y: FIELD_H/2 - 80 + Math.random() * 160
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.id = &#x27;powerupEl&#x27;;
    el.textContent = p.icon;
    el.style.left = powerup.x + &#x27;px&#x27;;
    el.style.top = powerup.y + &#x27;px&#x27;;
    field.appendChild(el);
  }
  function removePowerup() {
    powerup = null;
    var el = document.getElementById(&#x27;powerupEl&#x27;);
    if (el) el.remove();
  }

  function applyPower(p) {
    showBanner(p.icon + &#x27; &#x27; + p.label);
    if (p.type === &#x27;speed&#x27;) {
      ballVX *= 1.6; ballVY *= 1.6;
    } else if (p.type === &#x27;curve&#x27;) {
      spin = (Math.random() &lt; 0.5 ? -1 : 1) * 0.05;
    } else if (p.type === &#x27;invisible&#x27;) {
      invisibleUntil = frame + 150;
    } else if (p.type === &#x27;shrinkcpu&#x27;) {
      cpuW = 55; effectResetT = frame + 420;
    } else if (p.type === &#x27;widen&#x27;) {
      youW = 160; effectResetT = frame + 420;
    }
  }

  function tick() {
    if (!running) return;
    frame++;

    if (banner._t &amp;&amp; frame &gt; banner._t) { banner.textContent = &#x27;&#x27;; banner._t = 0; }
    if (effectResetT &amp;&amp; frame &gt; effectResetT) { youW = PADDLE_W; cpuW = PADDLE_W; effectResetT = 0; }

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - youW, paddleX));

    // Computer AI
    var cpuCenter = cpuX + cpuW / 2;
    var target = ballX + BALL_SIZE / 2;
    if (cpuCenter &lt; target - 4) cpuX += CPU_SPEED;
    else if (cpuCenter &gt; target + 4) cpuX -= CPU_SPEED;
    cpuX = Math.max(0, Math.min(FIELD_W - cpuW, cpuX));

    // Curve: gradually bend horizontal velocity
    if (spin) ballVX += spin;

    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }

    // Power-up collision
    if (powerup) {
      var pcx = powerup.x + 15, pcy = powerup.y + 15;
      var bcx = ballX + BALL_SIZE/2, bcy = ballY + BALL_SIZE/2;
      var dx = pcx - bcx, dy = pcy - bcy;
      if (dx*dx + dy*dy &lt; 26*26) {
        applyPower(powerup);
        removePowerup();
        nextPowerT = frame + 240 + Math.floor(Math.random()*240);
      }
    }
    if (!powerup &amp;&amp; frame &gt; nextPowerT) spawnPowerup();

    // Your paddle (bottom)
    var youTop = FIELD_H - PADDLE_MARGIN - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= youTop &amp;&amp;
        ballY + BALL_SIZE &lt;= youTop + PADDLE_H + 8 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + youW) {
      ballVY = -Math.abs(ballVY);
      ballY = youTop - BALL_SIZE;
      var hit = (ballX + BALL_SIZE/2) - (paddleX + youW/2);
      ballVX += hit * 0.03;
      spin = 0;
    }

    // Computer paddle (top)
    var cpuBottom = PADDLE_MARGIN + PADDLE_H;
    if (ballVY &lt; 0 &amp;&amp;
        ballY &lt;= cpuBottom &amp;&amp;
        ballY &gt;= PADDLE_MARGIN - 8 &amp;&amp;
        ballX + BALL_SIZE &gt;= cpuX &amp;&amp;
        ballX &lt;= cpuX + cpuW) {
      ballVY = Math.abs(ballVY);
      ballY = cpuBottom;
      var hit2 = (ballX + BALL_SIZE/2) - (cpuX + cpuW/2);
      ballVX += hit2 * 0.03;
      spin = 0;
    }

    // Clamp ball speed so power-ups don&#x27;t make it uncontrollable
    ballVX = Math.max(-7, Math.min(7, ballVX));

    // Scoring
    if (ballY + BALL_SIZE &gt;= FIELD_H) {
      cpuScore += 1;
      cpuScoreEl.textContent = cpuScore;
      removePowerup(); invisibleUntil = 0;
      if (!checkWin()) serveBall(-1);
    } else if (ballY &lt;= 0) {
      youScore += 1;
      youScoreEl.textContent = youScore;
      removePowerup(); invisibleUntil = 0;
      if (!checkWin()) serveBall(1);
    }

    paint();
    if (running) animId = requestAnimationFrame(tick);
  }

  function checkWin() {
    if (youScore &gt;= WIN_SCORE) { showMsg(&#x27;You win! 🎉&#x27;); running = false; return true; }
    if (cpuScore &gt;= WIN_SCORE) { showMsg(&#x27;Computer wins!&#x27;); running = false; return true; }
    return false;
  }

  function startGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    youScore = 0; cpuScore = 0; frame = 0;
    youScoreEl.textContent = &#x27;0&#x27;; cpuScoreEl.textContent = &#x27;0&#x27;;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    cpuX = (FIELD_W - PADDLE_W) / 2;
    youW = PADDLE_W; cpuW = PADDLE_W;
    spin = 0; invisibleUntil = 0; effectResetT = 0;
    banner.textContent = &#x27;&#x27;; banner._t = 0;
    removePowerup();
    nextPowerT = 120;
    for (var k in keysDown) keysDown[k] = false;
    hideMsg();
    serveBall(Math.random() &lt; 0.5 ? 1 : -1);
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  banner._t = 0;
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
