<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Alligator Moat</b> &middot; Game 112 &middot; Professional producer &middot; Basic game: Road crossing</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 22px; font-size: 20px; color: #555; margin: 0; }
  .hud .surge { color: #b3541e; font-weight: 600; opacity: 0; transition: opacity 0.2s; }
  .hud .surge.on { opacity: 1; }
  .field {
    position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0;
    border-radius: 8px; overflow: hidden;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 2px, transparent 2px, transparent 14px),
      linear-gradient(180deg, #2b7fb8 0%, #1c5f96 50%, #144a78 100%);
  }
  .field.surging {
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 2px, transparent 2px, transparent 10px),
      linear-gradient(180deg, #2f6ba0 0%, #1a4f82 50%, #0f3a63 100%);
  }
  .lane-divider { position: absolute; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.10); }
  .gator, .hero, .log { position: absolute; will-change: left, top; }
  .hero.sinking { transition: top 1.1s ease-in, opacity 1.1s ease-in, transform 1.1s ease-in; opacity: 0; }
  .splash { position: absolute; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Alligator Moat&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to cross the moat — dodge alligators, or hop on a drifting brown log to ride safely across. Watch for water surges that speed the gators up; reach the top bank to score. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;surge&quot; id=&quot;surge&quot;&gt;🌊 SURGE!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var LOG_W = CELL * 2.2, LOG_H = CELL - 14;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1, xOffset: 0 };
  var lanes = [];   // gator lanes
  var logLanes = []; // log lanes (subset of the same rows, chosen ones carry logs)
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var surgeEl = document.getElementById(&#x27;surge&#x27;);
  var surging = false, surgeTimer = 0;

  function gatorSVG(dir) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(-100,0)&quot;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg viewBox=&quot;0 0 100 40&quot; width=&quot;&#x27; + OBSTACLE_W + &#x27;&quot; height=&quot;&#x27; + OBSTACLE_H + &#x27;&quot; style=&quot;display:block&quot;&gt;&#x27; +
      &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
        &#x27;&lt;path d=&quot;M2 20 L22 13 L22 27 Z&quot; fill=&quot;#2f7d32&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;42&quot; cy=&quot;20&quot; rx=&quot;26&quot; ry=&quot;11&quot; fill=&quot;#3a9440&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M28 11 l4 -5 l4 5 M40 10 l4 -5 l4 5 M52 11 l4 -5 l4 5&quot; stroke=&quot;#2f7d32&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M62 14 L96 8 L96 18 L66 22 Z&quot; fill=&quot;#3a9440&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M64 24 L96 30 L96 22 L66 20 Z&quot; fill=&quot;#2f7d32&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M68 18 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4 l3 4 l3 -4&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;52&quot; cy=&quot;13&quot; r=&quot;3.5&quot; fill=&quot;#eafbe7&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;53&quot; cy=&quot;13&quot; r=&quot;1.8&quot; fill=&quot;#173d18&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }

  function logSVG() {
    return &#x27;&lt;svg viewBox=&quot;0 0 110 34&quot; width=&quot;&#x27; + LOG_W + &#x27;&quot; height=&quot;&#x27; + LOG_H + &#x27;&quot; style=&quot;display:block&quot;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;4&quot; width=&quot;102&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;#8a5a2b&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;4&quot; width=&quot;102&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;none&quot; stroke=&quot;#5f3c18&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;12&quot; cy=&quot;17&quot; rx=&quot;7&quot; ry=&quot;11&quot; fill=&quot;#b07d45&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;12&quot; cy=&quot;17&quot; rx=&quot;3.5&quot; ry=&quot;6&quot; fill=&quot;#6b451f&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;40&quot; y1=&quot;9&quot; x2=&quot;46&quot; y2=&quot;25&quot; stroke=&quot;#6b451f&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;66&quot; y1=&quot;9&quot; x2=&quot;72&quot; y2=&quot;25&quot; stroke=&quot;#6b451f&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;90&quot; y1=&quot;10&quot; x2=&quot;94&quot; y2=&quot;24&quot; stroke=&quot;#6b451f&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function heroSVG(flail) {
    var s = HERO_SIZE;
    var arms = flail
      ? &#x27;&lt;rect x=&quot;7&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#f2c9a0&quot; transform=&quot;rotate(-30 9 12)&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;25&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#f2c9a0&quot; transform=&quot;rotate(30 27 12)&quot;/&gt;&#x27;
      : &#x27;&lt;rect x=&quot;6&quot; y=&quot;15&quot; width=&quot;7&quot; height=&quot;4&quot; rx=&quot;2&quot; fill=&quot;#f2c9a0&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;23&quot; y=&quot;15&quot; width=&quot;7&quot; height=&quot;4&quot; rx=&quot;2&quot; fill=&quot;#f2c9a0&quot;/&gt;&#x27;;
    var mouth = flail ? &#x27;&lt;ellipse cx=&quot;18&quot; cy=&quot;10&quot; rx=&quot;1.8&quot; ry=&quot;2.4&quot; fill=&quot;#7a3b2e&quot;/&gt;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg viewBox=&quot;0 0 36 36&quot; width=&quot;&#x27; + s + &#x27;&quot; height=&quot;&#x27; + s + &#x27;&quot; style=&quot;display:block&quot;&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;8&quot; r=&quot;6&quot; fill=&quot;#f2c9a0&quot; stroke=&quot;#c99a6a&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      mouth +
      &#x27;&lt;rect x=&quot;12&quot; y=&quot;14&quot; width=&quot;12&quot; height=&quot;14&quot; rx=&quot;4&quot; fill=&quot;#d94b4b&quot;/&gt;&#x27; +
      arms +
      &#x27;&lt;rect x=&quot;13&quot; y=&quot;27&quot; width=&quot;4&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#33507a&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;19&quot; y=&quot;27&quot; width=&quot;4&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#33507a&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function clearField() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    logLanes.forEach(function (lane) {
      lane.logs.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    logLanes = [];
  }

  function buildLanes() {
    clearField();
    // Decide which rows carry logs instead of gators. Alternate-ish selection.
    var logRows = { 2: true, 5: true };  // lane indices (0-based) that get logs
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var baseSpeed = 0.5 + (i % 3) * 0.2;

      if (logRows[i]) {
        // Log lane — safe to ride, deadly water if you fall between logs? Keep it forgiving: water is passable but logs carry you.
        var logs = [];
        var lcount = 2;
        var lgap = FIELD_W / lcount;
        var logY = laneRow * CELL + (CELL - LOG_H) / 2;
        for (var m = 0; m &lt; lcount; m++) {
          var lx = m * lgap + (i * 40) % lgap;
          var lel = document.createElement(&#x27;div&#x27;);
          lel.className = &#x27;log&#x27;;
          lel.style.width = LOG_W + &#x27;px&#x27;;
          lel.style.height = LOG_H + &#x27;px&#x27;;
          lel.style.top = logY + &#x27;px&#x27;;
          lel.style.left = lx + &#x27;px&#x27;;
          lel.innerHTML = logSVG();
          field.appendChild(lel);
          logs.push({ x: lx, el: lel });
        }
        logLanes.push({ rowIdx: i, y: logY, dir: dir, speed: baseSpeed * 0.7, logs: logs });
      } else {
        var obstacles = [];
        var count = 2 + (i % 2);
        var gap = FIELD_W / count;
        for (var j = 0; j &lt; count; j++) {
          var x = j * gap + (i * 30) % gap;
          var el = document.createElement(&#x27;div&#x27;);
          el.className = &#x27;gator&#x27;;
          el.style.width = OBSTACLE_W + &#x27;px&#x27;;
          el.style.height = OBSTACLE_H + &#x27;px&#x27;;
          el.style.top = y + &#x27;px&#x27;;
          el.style.left = x + &#x27;px&#x27;;
          el.innerHTML = gatorSVG(dir);
          field.appendChild(el);
          var perGatorSpeed = baseSpeed * (0.75 + Math.random() * 0.6);
          obstacles.push({ x: x, el: el, speed: perGatorSpeed });
        }
        lanes.push({ rowIdx: i, y: y, dir: dir, speed: baseSpeed, obstacles: obstacles });
      }
    }
  }

  function drawDividers() {
    for (var r = 1; r &lt; ROWS; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane-divider&#x27;;
      d.style.top = (r * CELL) + &#x27;px&#x27;;
      field.appendChild(d);
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = heroSVG(false);
    field.appendChild(heroEl);
  }

  function heroX() {
    return hero.col * CELL + (CELL - HERO_SIZE) / 2 + hero.xOffset;
  }
  function heroY() {
    return hero.row * CELL + (CELL - HERO_SIZE) / 2;
  }

  function paintHero() {
    heroEl.style.left = heroX() + &#x27;px&#x27;;
    heroEl.style.top = heroY() + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    hero.xOffset = 0;
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.opacity = &#x27;1&#x27;;
    heroEl.style.transform = &#x27;&#x27;;
    heroEl.innerHTML = heroSVG(false);
    paintHero();
  }

  function makeSplash(x, y) {
    var sp = document.createElement(&#x27;div&#x27;);
    sp.className = &#x27;splash&#x27;;
    sp.style.left = (x - 8) + &#x27;px&#x27;;
    sp.style.top = (y - 8) + &#x27;px&#x27;;
    sp.innerHTML = &#x27;&lt;svg width=&quot;&#x27; + (HERO_SIZE + 16) + &#x27;&quot; height=&quot;&#x27; + (HERO_SIZE + 16) + &#x27;&quot; viewBox=&quot;0 0 52 52&quot;&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;26&quot; r=&quot;6&quot; fill=&quot;none&quot; stroke=&quot;#cfeeffcc&quot; stroke-width=&quot;3&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;26&quot; r=&quot;14&quot; fill=&quot;none&quot; stroke=&quot;#cfeeff88&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;14&quot; cy=&quot;18&quot; r=&quot;2.5&quot; fill=&quot;#e8f7ff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;38&quot; cy=&quot;16&quot; r=&quot;2&quot; fill=&quot;#e8f7ff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;40&quot; cy=&quot;34&quot; r=&quot;2.5&quot; fill=&quot;#e8f7ff&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
    field.appendChild(sp);
    sp.animate(
      [ { transform: &#x27;scale(0.3)&#x27;, opacity: 1 }, { transform: &#x27;scale(1.4)&#x27;, opacity: 0 } ],
      { duration: 900, easing: &#x27;ease-out&#x27; }
    );
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 950);
  }

  function maybeSurge() {
    // Randomly start/stop a surge.
    if (surging) {
      surgeTimer--;
      if (surgeTimer &lt;= 0) {
        surging = false;
        field.classList.remove(&#x27;surging&#x27;);
        surgeEl.classList.remove(&#x27;on&#x27;);
      }
    } else {
      if (Math.random() &lt; 0.004) {
        surging = true;
        surgeTimer = 180 + Math.floor(Math.random() * 120); // ~3-5s at 60fps
        field.classList.add(&#x27;surging&#x27;);
        surgeEl.classList.add(&#x27;on&#x27;);
      }
    }
  }

  function tick() {
    if (!running) return;
    maybeSurge();
    var speedMult = surging ? 1.8 : 1;

    // Move gators.
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * o.speed * speedMult;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    // Move logs (logs drift slower, unaffected by surge for fairness).
    var ridingLog = null;
    for (var p = 0; p &lt; logLanes.length; p++) {
      var ll = logLanes[p];
      for (var q = 0; q &lt; ll.logs.length; q++) {
        var lg = ll.logs[q];
        lg.x += ll.dir * ll.speed;
        if (ll.dir &gt; 0 &amp;&amp; lg.x &gt; FIELD_W) lg.x = -LOG_W;
        else if (ll.dir &lt; 0 &amp;&amp; lg.x + LOG_W &lt; 0) lg.x = FIELD_W;
        lg.el.style.left = lg.x + &#x27;px&#x27;;
      }
    }

    // Is the hero on a log lane? If so, check if standing on a log.
    var heroLaneIdx = hero.row - 1;
    var onLogLane = null;
    for (var r2 = 0; r2 &lt; logLanes.length; r2++) {
      if (logLanes[r2].rowIdx === heroLaneIdx) { onLogLane = logLanes[r2]; break; }
    }

    if (onLogLane) {
      var hcx = heroX() + HERO_SIZE / 2;
      var found = null;
      for (var s2 = 0; s2 &lt; onLogLane.logs.length; s2++) {
        var lg2 = onLogLane.logs[s2];
        if (hcx &gt; lg2.x &amp;&amp; hcx &lt; lg2.x + LOG_W) { found = onLogLane; break; }
      }
      if (found) {
        // Ride the log: carry hero horizontally.
        hero.xOffset += found.dir * found.speed;
        var absX = heroX();
        if (absX &lt; 0 || absX + HERO_SIZE &gt; FIELD_W) {
          // Carried off the edge — falls in.
          endGame(); return;
        }
      } else {
        // In the water between logs on a log lane — fall in.
        endGame(); return;
      }
    }

    paintHero();

    // Collision check with gators in the hero&#x27;s lane.
    if (heroLaneIdx &gt;= 0 &amp;&amp; heroLaneIdx &lt; LANES) {
      for (var t = 0; t &lt; lanes.length; t++) {
        if (lanes[t].rowIdx !== heroLaneIdx) continue;
        var laneG = lanes[t];
        var hx = heroX(), hy = heroY();
        for (var k = 0; k &lt; laneG.obstacles.length; k++) {
          var o2 = laneG.obstacles[k];
          if (hx &lt; o2.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
              hy &lt; laneG.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; laneG.y) {
            endGame();
            return;
          }
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    // When moving vertically, snap xOffset into the nearest column so movement stays grid-friendly.
    if (dr !== 0) {
      hero.col = Math.max(0, Math.min(COLS - 1, Math.round((heroX() - (CELL - HERO_SIZE) / 2) / CELL)));
      hero.xOffset = 0;
    } else {
      hero.col = nc;
    }
    hero.row = nr;
    paintHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    var hx = heroX(), hy = heroY();
    heroEl.innerHTML = heroSVG(true);
    makeSplash(hx, hy);
    void heroEl.offsetWidth;
    heroEl.className = &#x27;hero sinking&#x27;;
    heroEl.style.top = (hy + CELL * 1.5) + &#x27;px&#x27;;
    heroEl.style.transform = &#x27;rotate(20deg) scale(0.6)&#x27;;
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    surging = false;
    surgeTimer = 0;
    field.classList.remove(&#x27;surging&#x27;);
    surgeEl.classList.remove(&#x27;on&#x27;);
    field.innerHTML = &#x27;&#x27;;
    drawDividers();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }

<script>
(function () {

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
