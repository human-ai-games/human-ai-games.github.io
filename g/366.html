  .wrap { display: flex; flex-direction: column; align-items: center;

  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Shooter</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #2b3a67; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; }
  .score, .lives { font-size: 22px; color: #555; margin: 0; }
  .lives .heart { color: #e53935; letter-spacing: 2px; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; background: radial-gradient(ellipse at 50% 0%, #1b2a5b 0%, #0a0f2c 70%, #060818 100%); border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.6); }
  .ship { position: absolute; width: 30px; height: 24px; background: linear-gradient(180deg, #6fd8ff 0%, #2196f3 60%, #1565c0 100%); border-radius: 6px 6px 4px 4px; bottom: 12px; box-shadow: 0 0 12px #4fc3f7, 0 0 4px #fff; }
  .ship.invuln { animation: blink 0.25s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .bullet { position: absolute; width: 5px; height: 12px; background: #ffe94d; border-radius: 2px; box-shadow: 0 0 8px #fff176, 0 0 3px #fff; }
  .target { position: absolute; width: 34px; height: 34px; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.4); }

  .overlay h2 { margin: 0; font-size: 38px; color: #ff6b6b; text-shadow: 0 0 12px rgba(255,107,107,0.6); }
  .overlay p { margin: 0; font-size: 20px; }
  .overlay .hint { font-size: 16px; color: #cfd6ff; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the ship with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys, and press &lt;strong&gt;Space&lt;/strong&gt; to shoot. Hit targets to score — but you only have 3 lives, so don&#x27;t let one crash into you! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot;&gt;Lives: &lt;span class=&quot;heart&quot; id=&quot;lives&quot;&gt;♥♥♥&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Game Over&lt;/h2&gt;
      &lt;p&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
      &lt;p class=&quot;hint&quot;&gt;Press Start/Restart below to play again.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 7;
  var TARGET_SIZE = 34, TARGET_SPEED = 1.8;
  var SPAWN_INTERVAL = 1200;  // ms
  var START_LIVES = 3;
  var INVULN_MS = 1500;
  var TARGET_COLORS = [
    &#x27;radial-gradient(circle at 35% 30%, #ff9a9a, #e53935)&#x27;,
    &#x27;radial-gradient(circle at 35% 30%, #a5f0b0, #43a047)&#x27;,
    &#x27;radial-gradient(circle at 35% 30%, #ffe08a, #fb8c00)&#x27;,
    &#x27;radial-gradient(circle at 35% 30%, #d0a5ff, #8e24aa)&#x27;,
    &#x27;radial-gradient(circle at 35% 30%, #a5e6ff, #00acc1)&#x27;,
    &#x27;radial-gradient(circle at 35% 30%, #ffb3e6, #d81b60)&#x27;
  ];
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [];
  var score = 0;
  var lives = START_LIVES;
  var invulnUntil = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  (function makeStars() {
    for (var i = 0; i &lt; 40; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.style.position = &#x27;absolute&#x27;;
      var sz = Math.random() * 2 + 1;
      s.style.width = sz + &#x27;px&#x27;;
      s.style.height = sz + &#x27;px&#x27;;
      s.style.background = &#x27;#fff&#x27;;
      s.style.borderRadius = &#x27;50%&#x27;;
      s.style.left = (Math.random() * FIELD_W) + &#x27;px&#x27;;
      s.style.top = (Math.random() * FIELD_H) + &#x27;px&#x27;;
      s.style.opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
      field.appendChild(s);
    }
  })();

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }
  function paintLives() {
    livesEl.textContent = lives &gt; 0 ? &#x27;♥&#x27;.repeat(lives) : &#x27;—&#x27;;
  }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.background = TARGET_COLORS[Math.floor(Math.random() * TARGET_COLORS.length)];
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function boom(cx, cy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;boom&#x27;;
    el.style.left = (cx - 20) + &#x27;px&#x27;;
    el.style.top = (cy - 20) + &#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
  }

  function shipRect() {
    return { x: shipX, y: FIELD_H - SHIP_BOTTOM - SHIP_H, w: SHIP_W, h: SHIP_H };
  }

  function loseLife() {
    var r = shipRect();
    boom(r.x + SHIP_W / 2, r.y + SHIP_H / 2);
    lives -= 1;
    paintLives();
    if (lives &lt;= 0) {
      gameOver();
      return;
    }
    // Respawn in center with temporary invulnerability
    shipX = (FIELD_W - SHIP_W) / 2;
    paintShip();
    invulnUntil = Date.now() + INVULN_MS;
    ship.classList.add(&#x27;invuln&#x27;);
  }

  function gameOver() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    ship.style.visibility = &#x27;hidden&#x27;;
    ship.classList.remove(&#x27;invuln&#x27;);
    finalScoreEl.textContent = score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    var invuln = now &lt; invulnUntil;
    if (!invuln) ship.classList.remove(&#x27;invuln&#x27;);

    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();
    // Bullets up
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) {
        field.removeChild(b.el);
        bullets.splice(i, 1);
        continue;
      }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    // Targets down
    var sr = shipRect();
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      // Ship collision (skip if invulnerable)
      if (!invuln &amp;&amp;
          t.x &lt; sr.x + sr.w &amp;&amp; t.x + TARGET_SIZE &gt; sr.x &amp;&amp;
          t.y &lt; sr.y + sr.h &amp;&amp; t.y + TARGET_SIZE &gt; sr.y) {
        field.removeChild(t.el);
        targets.splice(j, 1);
        loseLife();
        if (!running) return;
        continue;
      }
      if (t.y &gt; FIELD_H) {
        field.removeChild(t.el);
        targets.splice(j, 1);
        continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    // Collisions with bullets
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          boom(t2.x + TARGET_SIZE / 2, t2.y + TARGET_SIZE / 2);
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += 1;
          scoreEl.textContent = score;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bullets = []; targets = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    overlay.classList.remove(&#x27;show&#x27;);
    ship.style.visibility = &#x27;visible&#x27;;
    ship.classList.remove(&#x27;invuln&#x27;);
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    lives = START_LIVES;
    paintLives();
    invulnUntil = 0;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnTarget();
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) spawnBullet();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
  paintLives();
&lt;/script&gt;

<script>

  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
