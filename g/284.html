&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

    66%{filter:drop-shadow(0 0 10px #4aa8ff) drop-shadow(0 8px 5px rgba(0,0,0,.45));}
    100%{filter:drop-shadow(0 0 10px #ff5b6e) drop-shadow(0 8px 5px rgba(0,0,0,.45));} }

  .splash { position: absolute; pointer-events: none; transform: translate(-50%,-50%); z-index: 6; }
  .drop { position: absolute; left: 50%; top: 50%; border-radius: 50% 50% 50% 0;
    transform-origin: 50% 50%; animation: dropFly 0.7s cubic-bezier(.2,.7,.4,1) forwards;
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.25), inset 2px 2px 3px rgba(255,255,255,0.6); }
  @keyframes dropFly {
    0% { opacity: 1; transform: rotate(var(--rot)) translateY(0) scale(0.3); }

    100% { opacity: 0; transform: rotate(var(--rot)) translateY(var(--dist)) scale(1.2); } }
  .spark { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px #fff; animation: sparkFly 0.6s ease-out forwards; }
  @keyframes sparkFly {
    0% { opacity: 1; transform: rotate(var(--rot)) translateY(0) scale(1); }
    100% { opacity: 0; transform: rotate(var(--rot)) translateY(var(--dist)) scale(0.2); } }

  @keyframes puddleGrow { 0%{opacity:0.7; transform: translate(-50%,-50%) scale(0.1);}

  .wow { position: absolute; transform: translate(-50%,-50%); pointer-events: none;

  @keyframes wowPop { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0; }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column;

  @keyframes goPop { 0%{transform:scale(0) rotate(-15deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;} }
  .gameover .go-score { font-size: 30px; font-weight: 800; color: #ffe14a;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5); }

  .flyfruit { position: absolute; pointer-events: none; z-index: 18; will-change: transform; }

  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var gameoverEl = document.getElementById(&#x27;gameover&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  function renderLives() {
    livesRow.innerHTML = &#x27;&#x27;;
    for (var i = 0; i &lt; MAX_LIVES; i++) {
      var s = document.createElement(&#x27;span&#x27;);
      s.className = &#x27;life&#x27; + (i &gt;= lives ? &#x27; lost&#x27; : &#x27;&#x27;);
      s.textContent = &#x27;🍎&#x27;;
      livesRow.appendChild(s);
    }
  }

  var HOLES = [];
  (function () {
    var cols = 4, rows = 3;
    var padX = 28, padY = 14;
    var gapX = (BOARD_W - padX*2 - 120) / (cols-1);
    var gapY = (BOARD_H - padY*2 - 120) / (rows-1);
    for (var r = 0; r &lt; rows; r++)
      for (var c = 0; c &lt; cols; c++)
        HOLES.push({ x: padX + c*gapX, y: padY + r*gapY, busy: false });
  })();

  HOLES.forEach(function (h) {
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;
    hole.style.left = h.x + &#x27;px&#x27;;
    hole.style.top = h.y + &#x27;px&#x27;;
    hole.innerHTML = &#x27;&lt;div class=&quot;hole-mouth&quot;&gt;&lt;/div&gt;&#x27;;
    board.appendChild(hole);
    h.el = hole;
    // entire hole area is clickable
    hole.addEventListener(&#x27;mousedown&#x27;, function (ev) {
      ev.stopPropagation();
      if (!running || over) { swingMallet(); return; }
      swingMallet();
      // find an active un-hit fruit in this hole
      for (var k = 0; k &lt; activeFruits.length; k++) {
        if (activeFruits[k].h === h &amp;&amp; !activeFruits[k].hit) {
          hitFruit(activeFruits[k]);
          return;
        }
      }
    });

  var FRUIT_EMOJI = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍓&#x27;,&#x27;🍇&#x27;,&#x27;🍉&#x27;,&#x27;🍑&#x27;,&#x27;🥝&#x27;,&#x27;🍒&#x27;];

  function fruitSVG(def) { return &#x27;&lt;svg viewBox=&quot;0 0 80 88&quot;&gt;&lt;defs&gt;&lt;/defs&gt;&#x27; + def.svg + &#x27;&lt;/svg&gt;&#x27;; }

  function spawnFruit() {

  function cleanup(record, delay) {

  function makeSplash(x, y, color, big) {

    var sparkCount = big ? 22 : 12;
    var maxDist = big ? 140 : 70;

      d.style.background = color === &#x27;rainbow&#x27; ? rainbow[i % rainbow.length] : color;

    running = false;

  function startGame() {

    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    lives = MAX_LIVES; renderLives();
    overlay.style.display = &#x27;none&#x27;;

  function scheduleSpawns() {
    if (spawnTimer) clearTimeout(spawnTimer);

  }

  function clearActive() {
    activeFruits.forEach(function (r) {

  }

  function stopGame() {
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    clearActive();
    mallet.style.display = &#x27;none&#x27;;
    if (!over) {

      overlay.style.display = &#x27;flex&#x27;;

  renderLives();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();

          &#x27;*&#x27;

      } catch (_) {}

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
