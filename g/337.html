&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🧜‍♀️ Mermiranda to the Rescue!&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move Mermiranda with the arrow keys, dodging the sharks. Carry the seagull to the top sky and the starfish to the sandy bottom — save 10 of each to become a hero!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Seagulls: &lt;span id=&quot;gulls&quot;&gt;0&lt;/span&gt;/10 &amp;nbsp; Starfish: &lt;span id=&quot;stars&quot;&gt;0&lt;/span&gt;/10 &amp;nbsp; Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var SHARK_W = CELL * 2 - 6, SHARK_H = CELL - 8;
  var HERO_SIZE = 34, FRIEND_SIZE = 30;
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var carrying = null;
  var lanes = [];
  var score = 0, gullsSaved = 0, starsSaved = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null, msgEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var gullsEl = document.getElementById(&#x27;gulls&#x27;);
  var starsEl = document.getElementById(&#x27;stars&#x27;);
  var savedEls = [];

  var seagull = null;
  var starfish = null;

  function makeBg() {
    for (var r = 0; r &lt; ROWS; r++) {
      var band = document.createElement(&#x27;div&#x27;);
      band.style.position = &#x27;absolute&#x27;;
      band.style.left = &#x27;0&#x27;;
      band.style.width = FIELD_W + &#x27;px&#x27;;
      band.style.top = (r * CELL) + &#x27;px&#x27;;
      band.style.height = CELL + &#x27;px&#x27;;
      if (r === 0) {
        band.style.background = &#x27;linear-gradient(#8fd6ff, #b8e8ff)&#x27;;
      } else if (r === ROWS - 1) {
        band.style.background = &#x27;linear-gradient(#e6cf94, #d8bd77)&#x27;;
      } else {
        var t = (r - 1) / (ROWS - 2);
        var top = 90 - t * 40, bot = 70 - t * 45;
        band.style.background = &#x27;linear-gradient(hsl(200,70%,&#x27;+top+&#x27;%), hsl(205,75%,&#x27;+bot+&#x27;%))&#x27;;
      }
      band.style.zIndex = &#x27;0&#x27;;
      field.appendChild(band);
    }
    for (var d = 1; d &lt; ROWS; d++) {
      var line = document.createElement(&#x27;div&#x27;);
      line.className = &#x27;lane-divider&#x27;;
      line.style.top = (d * CELL) + &#x27;px&#x27;;
      field.appendChild(line);
    }
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.sharks.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - SHARK_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.7 + (i % 3) * 0.25;
      var sharks = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;shark&#x27;;
        el.textContent = &#x27;🦈&#x27;;
        el.style.transform = dir &gt; 0 ? &#x27;scaleX(-1)&#x27; : &#x27;scaleX(1)&#x27;;
        el.style.top = (y - 4) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        sharks.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, sharks: sharks, row: laneRow });
    }
  }

  function makeFriendEl(emoji) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;friend&#x27;;
    el.textContent = emoji;
    return el;
  }

  function spawnFriend(kind, other) {
    var laneIdx = Math.floor(Math.random() * LANES);
    var lane = lanes[laneIdx];
    var x = Math.random() * (FIELD_W - CELL);
    var col = Math.round(x / CELL);
    if (other &amp;&amp; !other.delivered) {
      var tries = 0;
      while (tries &lt; 10 &amp;&amp; lane.row === other.row &amp;&amp; Math.abs(col - other.col) &lt; 2) {
        laneIdx = Math.floor(Math.random() * LANES);
        lane = lanes[laneIdx];
        x = Math.random() * (FIELD_W - CELL);
        col = Math.round(x / CELL);
        tries++;
      }
    }
    var emoji = kind === &#x27;seagull&#x27; ? &#x27;🐦&#x27; : &#x27;⭐&#x27;;
    var f = {
      kind: kind, row: lane.row, col: col, x: x,
      dir: lane.dir, speed: lane.speed * 0.6, delivered: false,
      el: makeFriendEl(emoji)
    };
    field.appendChild(f.el);
    paintFriend(f);
    return f;
  }

  function paintFriend(f) {
    if (!f) return;
    var beingCarried = carrying === f.kind;
    var x, y;
    if (beingCarried) {
      x = hero.col * CELL + (CELL - FRIEND_SIZE) / 2;
      y = hero.row * CELL + (CELL - FRIEND_SIZE) / 2 - 6;
    } else {
      x = f.x;
      y = f.row * CELL + (CELL - FRIEND_SIZE) / 2;
    }
    f.el.style.left = x + &#x27;px&#x27;;
    f.el.style.top = y + &#x27;px&#x27;;
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🧜‍♀️&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function showMsg(text, persist) {
    if (msgEl &amp;&amp; msgEl.parentNode) msgEl.parentNode.removeChild(msgEl);
    msgEl = document.createElement(&#x27;div&#x27;);
    msgEl.className = &#x27;msg&#x27;;
    msgEl.textContent = text;
    field.appendChild(msgEl);
    if (!persist) {
      setTimeout(function () { if (msgEl &amp;&amp; msgEl.parentNode) msgEl.parentNode.removeChild(msgEl); }, 1400);
    }
  }

  function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax &lt; bx + bw &amp;&amp; ax + aw &gt; bx &amp;&amp; ay &lt; by + bh &amp;&amp; ay + ah &gt; by;
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.sharks.length; j++) {
        var o = lane.sharks[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -SHARK_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + SHARK_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    [seagull, starfish].forEach(function (f) {
      if (f &amp;&amp; !f.delivered &amp;&amp; carrying !== f.kind) {
        f.x += f.dir * f.speed;
        if (f.dir &gt; 0 &amp;&amp; f.x &gt; FIELD_W - FRIEND_SIZE) f.x = 0;
        else if (f.dir &lt; 0 &amp;&amp; f.x &lt; 0) f.x = FIELD_W - FRIEND_SIZE;
        paintFriend(f);
      }
    });

    // Very tight collision: just a small dot at the center of hero vs
    // a small dot at the center of the shark. Effectively the shark&#x27;s core.
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var heroCx = hero.col * CELL + CELL / 2;
      var heroCy = hero.row * CELL + CELL / 2;
      var HR = 10; // hero hit radius
      var SR = 12; // shark core radius
      var lane2 = lanes[laneIdx];
      var sy = lane2.y - 4 + SHARK_H / 2;
      for (var k = 0; k &lt; lane2.sharks.length; k++) {
        var o2 = lane2.sharks[k];
        var sx = o2.x + SHARK_W / 2;
        var dx = heroCx - sx, dy = heroCy - sy;
        if (dx * dx + dy * dy &lt; (HR + SR) * (HR + SR)) {
          endGame();
          return;
        }
      }
    }
    paintFriend(seagull);
    paintFriend(starfish);

    animId = requestAnimationFrame(tick);
  }

  function friendPickupOverlap(f) {
    if (!f || f.delivered || carrying === f.kind) return false;
    var hx = hero.col * CELL, hy = hero.row * CELL;
    return overlap(hx, hy, CELL, CELL, f.x, f.row * CELL, FRIEND_SIZE, CELL);
  }

  function checkPickupAndDelivery() {
    if (carrying === null) {
      if (friendPickupOverlap(seagull)) {
        carrying = &#x27;seagull&#x27;;
        showMsg(&#x27;🐦 Got the seagull! Fly it up!&#x27;);
      } else if (friendPickupOverlap(starfish)) {
        carrying = &#x27;starfish&#x27;;
        showMsg(&#x27;⭐ Got the starfish! Take it down!&#x27;);
      }
    }
    if (carrying === &#x27;seagull&#x27; &amp;&amp; hero.row === 0) {
      deliver(seagull);
    } else if (carrying === &#x27;starfish&#x27; &amp;&amp; hero.row === ROWS - 1) {
      deliver(starfish);
    }
    paintFriend(seagull);
    paintFriend(starfish);
  }

  function addSaved(kind) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;saved&#x27;;
    el.textContent = kind === &#x27;seagull&#x27; ? &#x27;🐦&#x27; : &#x27;⭐&#x27;;
    var idx = kind === &#x27;seagull&#x27; ? gullsSaved - 1 : starsSaved - 1;
    // line them up along top (sky) or bottom (sand)
    var x = 8 + idx * ((FIELD_W - 40) / 10);
    var y = kind === &#x27;seagull&#x27; ? 8 : FIELD_H - 34;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    savedEls.push(el);
  }

  function deliver(f) {
    carrying = null;
    score += 10; scoreEl.textContent = score;
    if (f.kind === &#x27;seagull&#x27;) { gullsSaved++; gullsEl.textContent = gullsSaved; }
    else { starsSaved++; starsEl.textContent = starsSaved; }
    showMsg((f.kind === &#x27;seagull&#x27; ? &#x27;🐦&#x27; : &#x27;⭐&#x27;) + &#x27; Delivered! +10&#x27;);
    if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
    addSaved(f.kind);

    if (gullsSaved &gt;= 10 &amp;&amp; starsSaved &gt;= 10) {
      winGame();
      return;
    }
    var other = f.kind === &#x27;seagull&#x27; ? starfish : seagull;
    var fresh = spawnFriend(f.kind, other);
    if (f.kind === &#x27;seagull&#x27;) seagull = fresh; else starfish = fresh;
  }

  function winGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    // remove all sharks
    lanes.forEach(function (lane) {
      lane.sharks.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
      lane.sharks = [];
    });
    // remove any remaining loose friend being carried / roaming
    if (seagull &amp;&amp; seagull.el.parentNode &amp;&amp; !seagull.delivered) seagull.el.parentNode.removeChild(seagull.el);
    if (starfish &amp;&amp; starfish.el.parentNode &amp;&amp; !starfish.delivered) starfish.el.parentNode.removeChild(starfish.el);
    // everyone dances
    savedEls.forEach(function (el, i) {
      el.classList.add(&#x27;dancing&#x27;);
      el.style.animationDelay = (i * 0.08) + &#x27;s&#x27;;
    });
    heroEl.classList.add(&#x27;heroDancing&#x27;);
    showMsg(&#x27;🎉 Mermiranda is a HERO! 🏆&#x27;, true);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    paintFriend(seagull);
    paintFriend(starfish);
    checkPickupAndDelivery();
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    showMsg(&#x27;🦈 Chomp! Game over&#x27;);
  }

  function startGame() {
    if (running) return;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    gullsSaved = 0; starsSaved = 0;
    gullsEl.textContent = &#x27;0&#x27;; starsEl.textContent = &#x27;0&#x27;;
    carrying = null;
    savedEls = [];
    field.innerHTML = &#x27;&#x27;;
    makeBg();
    buildLanes();
    seagull = spawnFriend(&#x27;seagull&#x27;, null);
    starfish = spawnFriend(&#x27;starfish&#x27;, seagull);
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so participant sees the scene before Start.
  makeBg();
  buildLanes();
  seagull = spawnFriend(&#x27;seagull&#x27;, null);
  starfish = spawnFriend(&#x27;starfish&#x27;, seagull);
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;

<script>
