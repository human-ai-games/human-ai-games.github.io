<!doctype html>
<html lang="en">
<head>

<title>🐸 Frog Pond</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐸 Frog Pond</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #2a7d4f; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #2a7d4f; margin: 0; }
  .field {
    position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0;
    border-radius: 8px; overflow: hidden;
    background: linear-gradient(180deg, #7fd3ec 0%, #34a8dc 45%, #1673b0 100%);
  }
  .field::before {
    content: &quot;&quot;; position: absolute; inset: -50% 0 0 0; pointer-events: none;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.10) 0 6px, rgba(255,255,255,0) 6px 26px),
      repeating-linear-gradient(65deg, rgba(255,255,255,0.06) 0 8px, rgba(255,255,255,0) 8px 34px);
    animation: shimmer 7s linear infinite;
  }
  @keyframes shimmer {
    0% { transform: translateY(0); }
    100% { transform: translateY(120px); }
  }
  .entity { position: absolute; user-select: none; }
  .frog {
    width: 46px; height: 46px; bottom: 6px; font-size: 40px; line-height: 46px;
    text-align: center; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
  .lily {
    position: absolute; width: 58px; height: 26px; bottom: 4px;
    background: #2a7d4f; border-radius: 50%;
    box-shadow: 0 3px 4px rgba(0,0,0,0.2);
    z-index: 0;
  }
  .droplet {
    width: 14px; height: 18px; font-size: 15px; line-height: 18px; text-align: center;
    z-index: 2;
  }
  .fly {
    width: 38px; height: 38px; z-index: 1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
  .fly svg { display: block; width: 100%; height: 100%; }
  /* wing flap */
  .fly .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap 0.18s ease-in-out infinite alternate; }
  @keyframes flap {
    0% { transform: scaleY(1) rotate(0deg); }
    100% { transform: scaleY(0.55) rotate(-6deg); }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Pond&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your frog with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys, and press &lt;strong&gt;Space&lt;/strong&gt; to spit water droplets. Splash the cartoon flies coming toward you to score points, and use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;lily&quot; id=&quot;lily&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;entity frog&quot; id=&quot;ship&quot;&gt;🐸&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 46, SHIP_H = 46, SHIP_BOTTOM = 6, SHIP_SPEED = 6;
  var BULLET_W = 14, BULLET_H = 18, BULLET_SPEED = 7;
  var TARGET_SIZE = 38, TARGET_SPEED = 1.8;
  var SPAWN_INTERVAL = 1200;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [];
  var score = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var lily = document.getElementById(&#x27;lily&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // Cartoon fly drawn as inline SVG
  var FLY_SVG =
    &#x27;&lt;svg viewBox=&quot;0 0 40 40&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&#x27; +
      &#x27;&lt;ellipse class=&quot;wing&quot; cx=&quot;12&quot; cy=&quot;15&quot; rx=&quot;8&quot; ry=&quot;12&quot; fill=&quot;rgba(210,235,255,0.75)&quot; stroke=&quot;#8fb8d0&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse class=&quot;wing&quot; cx=&quot;28&quot; cy=&quot;15&quot; rx=&quot;8&quot; ry=&quot;12&quot; fill=&quot;rgba(210,235,255,0.75)&quot; stroke=&quot;#8fb8d0&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;26&quot; rx=&quot;9&quot; ry=&quot;11&quot; fill=&quot;#3a3a3a&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;18&quot; rx=&quot;7&quot; ry=&quot;7&quot; fill=&quot;#4a4a4a&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;16&quot; cy=&quot;17&quot; r=&quot;3.4&quot; fill=&quot;#e23b3b&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;17&quot; r=&quot;3.4&quot; fill=&quot;#e23b3b&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;15.2&quot; cy=&quot;16.2&quot; r=&quot;1.1&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;23.2&quot; cy=&quot;16.2&quot; r=&quot;1.1&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M13 30 q7 6 14 0&quot; stroke=&quot;#1f1f1f&quot; stroke-width=&quot;1.4&quot; fill=&quot;none&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;

  function paintShip() {
    ship.style.left = shipX + &#x27;px&#x27;;
    lily.style.left = (shipX + SHIP_W/2 - 29) + &#x27;px&#x27;;
  }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE,
              vx: (Math.random() - 0.5) * 2, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;entity fly&#x27;;
    el.innerHTML = FLY_SVG;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;entity droplet&#x27;;
    el.textContent = &#x27;💧&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) {
        field.removeChild(b.el);
        bullets.splice(i, 1);
        continue;
      }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      t.x += t.vx;
      if (t.x &lt; 0 || t.x &gt; FIELD_W - TARGET_SIZE) t.vx = -t.vx;
      if (t.y &gt; FIELD_H) {
        field.removeChild(t.el);
        targets.splice(j, 1);
        continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
      t.el.style.left = t.x + &#x27;px&#x27;;
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += 1;
          scoreEl.textContent = score;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bullets = []; targets = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) spawnBullet();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }

  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
