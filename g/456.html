<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Snake</b> &middot; Game 456 &middot; Amateur producer &middot; Basic game: Whack-a-mole</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; }
  .game { max-width: 720px; margin: 0 auto; padding: 16px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .wrap { position: relative; }
  canvas { background: #1e2229; border-radius: 8px; display: block; }
  .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 600; background: rgba(20,24,32,0.72); border-radius: 8px; text-align: center; padding: 20px; box-sizing: border-box; }
  .overlay.hidden { display: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys or WASD to steer the snake and eat the food to grow. Avoid the walls and your own tail — use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;500&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press Start below to play&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var canvas = document.getElementById(&#x27;cv&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  var CELL = 20;
  var COLS = canvas.width / CELL;   // 25
  var ROWS = canvas.height / CELL;  // 22
  var FOOD_CELLS = 2;               // food occupies a 2x2 block of cells

  var snake, dir, nextDir, food, score, best = 0;
  var running = false, gameOver = false;
  var tickId = null, tickMs = 200;
  var pulse = 0;

  function reset() {
    snake = [{x: 8, y: 11}, {x: 7, y: 11}, {x: 6, y: 11}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    tickMs = 200;
    gameOver = false;
    scoreEl.textContent = &#x27;0&#x27;;
    placeFood();
  }

  function cellOnSnake(x, y) {
    for (var i = 0; i &lt; snake.length; i++) {
      if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    }
    return false;
  }

  function placeFood() {
    // food spans FOOD_CELLS x FOOD_CELLS starting at (fx, fy)
    while (true) {
      var fx = Math.floor(Math.random() * (COLS - FOOD_CELLS + 1));
      var fy = Math.floor(Math.random() * (ROWS - FOOD_CELLS + 1));
      var clash = false;
      for (var dx = 0; dx &lt; FOOD_CELLS; dx++) {
        for (var dy = 0; dy &lt; FOOD_CELLS; dy++) {
          if (cellOnSnake(fx + dx, fy + dy)) { clash = true; }
        }
      }
      if (!clash) { food = {x: fx, y: fy}; return; }
    }
  }

  function headOnFood(head) {
    return head.x &gt;= food.x &amp;&amp; head.x &lt; food.x + FOOD_CELLS &amp;&amp;
           head.y &gt;= food.y &amp;&amp; head.y &lt; food.y + FOOD_CELLS;
  }

  function scheduleTick() {
    if (tickId) clearTimeout(tickId);
    tickId = setTimeout(function () {
      if (running) { step(); scheduleTick(); }
    }, tickMs);
  }

  function step() {
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // wall collision
    if (head.x &lt; 0 || head.x &gt;= COLS || head.y &lt; 0 || head.y &gt;= ROWS) {
      return endGame();
    }
    // self collision
    for (var i = 0; i &lt; snake.length; i++) {
      if (snake[i].x === head.x &amp;&amp; snake[i].y === head.y) return endGame();
    }

    snake.unshift(head);

    if (headOnFood(head)) {
      score += 1;
      scoreEl.textContent = score;
      if (score &gt; best) { best = score; bestEl.textContent = best; }
      if (tickMs &gt; 110) tickMs -= 3;
      beep(660, 0.06);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function endGame() {
    gameOver = true;
    running = false;
    if (tickId) { clearTimeout(tickId); tickId = null; }
    beep(160, 0.25);
    draw();
    overlay.textContent = &#x27;Game Over — Score &#x27; + score + &#x27;. Press Start below to play again.&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  function draw() {
    ctx.fillStyle = &#x27;#1e2229&#x27;;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.03)&#x27;;
    for (var x = 0; x &lt;= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
    }
    for (var y = 0; y &lt;= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
    }

    // food — large glowing circle covering the 2x2 block
    var fsize = FOOD_CELLS * CELL;
    var cx = food.x * CELL + fsize / 2;
    var cy = food.y * CELL + fsize / 2;
    pulse = (pulse + 0.15) % (Math.PI * 2);
    var glow = 4 + Math.sin(pulse) * 3;
    ctx.save();
    ctx.shadowColor = &#x27;#ff5a5f&#x27;;
    ctx.shadowBlur = 15 + glow;
    ctx.fillStyle = &#x27;#ff5a5f&#x27;;
    ctx.beginPath();
    ctx.arc(cx, cy, fsize / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // little highlight
    ctx.fillStyle = &#x27;rgba(255,255,255,0.5)&#x27;;
    ctx.beginPath();
    ctx.arc(cx - fsize * 0.15, cy - fsize * 0.15, fsize * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // snake
    for (var i = 0; i &lt; snake.length; i++) {
      var seg = snake[i];
      ctx.fillStyle = i === 0 ? &#x27;#7ee787&#x27; : &#x27;#3fb950&#x27;;
      var pad = i === 0 ? 1 : 2;
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // simple procedural sound
  var actx = null;
  function beep(freq, dur) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = &#x27;square&#x27;;
      o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function setDir(x, y) {
    // prevent reversing directly into the neck
    if (dir.x === -x &amp;&amp; dir.y === -y) return;
    nextDir = {x: x, y: y};
  }

  document.addEventListener(&#x27;keydown&#x27;, function (e) {
    var k = e.key.toLowerCase();
    if (k === &#x27;arrowup&#x27; || k === &#x27;w&#x27;) { setDir(0, -1); e.preventDefault(); }
    else if (k === &#x27;arrowdown&#x27; || k === &#x27;s&#x27;) { setDir(0, 1); e.preventDefault(); }
    else if (k === &#x27;arrowleft&#x27; || k === &#x27;a&#x27;) { setDir(-1, 0); e.preventDefault(); }
    else if (k === &#x27;arrowright&#x27; || k === &#x27;d&#x27;) { setDir(1, 0); e.preventDefault(); }
  });

  function startGame() {
    reset();
    running = true;
    overlay.classList.add(&#x27;hidden&#x27;);
    draw();
    scheduleTick();
  }

  function stopGame() {
    running = false;
    if (tickId) { clearTimeout(tickId); tickId = null; }
    if (!gameOver) {
      overlay.textContent = &#x27;Paused — press Start below to play&#x27;;
      overlay.classList.remove(&#x27;hidden&#x27;);
    }
  }

  // initial static state
  reset();
  draw();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
