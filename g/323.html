  function resetBall() {

    ball.y = 50;

    ball.vy = BALL_SPEED;

  function tick() {

    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x + BALL_SIZE &gt;= FIELD_W) { ball.x = FIELD_W - BALL_SIZE; ball.vx = -ball.vx; }
    if (ball.y &lt;= 0) { ball.y = 0; ball.vy = -ball.vy; }

        ball.x + BALL_SIZE &gt;= paddleX &amp;&amp;
        ball.x &lt;= paddleX + PADDLE_W) {

      ball.y = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
    }

    animId = requestAnimationFrame(tick);

    scoreEl.textContent = &#x27;0&#x27;;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;

    paint();

  function stopGame() {

    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
