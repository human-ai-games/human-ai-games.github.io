  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }

  .overlay h2 { margin: 0; font-size: 22px; color: #ffea00; }

  .gamble.hidden { display:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SMASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;mouse&lt;/strong&gt;/&lt;strong&gt;&amp;larr;&amp;rarr;&lt;/strong&gt;, &lt;strong&gt;Space&lt;/strong&gt; fires lasers, &lt;strong&gt;S&lt;/strong&gt; swaps skins, and &lt;strong&gt;G&lt;/strong&gt; gambles your combo for double-or-nothing. Beat bosses every 5 levels and unlock all badges!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Combo &lt;span class=&quot;mult&quot; id=&quot;mult&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Lvl &lt;span class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Lives &lt;span class=&quot;val&quot; id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Best &lt;span class=&quot;best&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;barwrap&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;badges&quot; id=&quot;badges&quot;&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_combo&quot; title=&quot;Combo Master (reach x9)&quot;&gt;🔥&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_multi&quot; title=&quot;Ball Storm (multi-ball)&quot;&gt;⚪&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_laser&quot; title=&quot;Gunner (fire lasers)&quot;&gt;🔫&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_bonus&quot; title=&quot;Bonus Hunter (clear bonus stage)&quot;&gt;💎&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_boss&quot; title=&quot;Boss Slayer (defeat a boss)&quot;&gt;☠️&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_gamble&quot; title=&quot;High Stakes (win a gamble)&quot;&gt;🎲&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_lvl5&quot; title=&quot;Veteran (reach level 5)&quot;&gt;🏆&lt;/span&gt;
    &lt;span class=&quot;badge&quot; id=&quot;b_1000&quot; title=&quot;High Roller (score 1000)&quot;&gt;👑&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;392&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;gamble hidden&quot; id=&quot;gambleTag&quot;&gt;🎲 Press G to gamble combo!&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2 id=&quot;ovTitle&quot;&gt;Ready?&lt;/h2&gt;
      &lt;p id=&quot;ovText&quot; class=&quot;stats&quot;&gt;Press Start below. Break bricks, grab power-ups, beat bosses, and unlock all 8 badges!&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W=620,H=392;
  var cv=document.getElementById(&#x27;cv&#x27;),ctx=cv.getContext(&#x27;2d&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;),multEl=document.getElementById(&#x27;mult&#x27;),
      levelEl=document.getElementById(&#x27;level&#x27;),livesEl=document.getElementById(&#x27;lives&#x27;),
      bestEl=document.getElementById(&#x27;best&#x27;),barEl=document.getElementById(&#x27;bar&#x27;),
      overlay=document.getElementById(&#x27;overlay&#x27;),ovTitle=document.getElementById(&#x27;ovTitle&#x27;),
      ovText=document.getElementById(&#x27;ovText&#x27;),gambleTag=document.getElementById(&#x27;gambleTag&#x27;);

  var running=false,animId=null,keys={},mouseX=null;
  var paddle,balls,bricks,particles,powerups,lasers,obstacles,floatText,boss,bossShots;
  var score=0,best=0,level=1,mult=1,comboTimer=0,totalBricks=0,lives=3;
  var laserTimer=0,expandTimer=0,shake=0,flash=0,bonusStage=false,bossStage=false,shootCD=0;
  var shotsFired=0,shotsHit=0,longestCombo=0,gambleUsed=false;
  var skinIdx=0;
  var SKINS=[
    {name:&#x27;Cyan&#x27;,paddle:&#x27;#00e5ff&#x27;,ball:&#x27;#ffea00&#x27;,req:null},
    {name:&#x27;Magenta&#x27;,paddle:&#x27;#ff00d4&#x27;,ball:&#x27;#00ff9d&#x27;,req:&#x27;multi&#x27;},
    {name:&#x27;Inferno&#x27;,paddle:&#x27;#ff5e00&#x27;,ball:&#x27;#ffea00&#x27;,req:&#x27;combo&#x27;},
    {name:&#x27;Royal&#x27;,paddle:&#x27;#a26bff&#x27;,ball:&#x27;#ffffff&#x27;,req:&#x27;boss&#x27;},
    {name:&#x27;Gold&#x27;,paddle:&#x27;#ffd700&#x27;,ball:&#x27;#ff2e63&#x27;,req:&#x27;r1000&#x27;}
  ];
  var badges={combo:false,multi:false,laser:false,bonus:false,boss:false,gamble:false,lvl5:false,r1000:false};
  var PADDLE_BASE=100,PADDLE_H=14,PADDLE_Y=H-24;

  // ---- audio + music ----
  var actx=null,musicTimer=null,musicStep=0,musicOn=false;
  function ac(){ if(!actx){ try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
  function beep(f,d,t,v){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain();
    o.type=t||&#x27;square&#x27;; o.frequency.value=f; g.gain.setValueAtTime(v||0.1,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(d||0.1));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(d||0.1)); }
  var baseScale=[196,220,262,294,330,392,440,523];
  var bossScale=[147,165,175,220,262,175,220,294];
  function musicTick(){
    if(!musicOn)return;
    var a=ac(); if(!a){ scheduleMusic(); return; }
    var intense=bossStage||balls.length&gt;1||mult&gt;=5;
    var scale=bossStage?bossScale:baseScale;
    var note=scale[musicStep%scale.length];
    var o=a.createOscillator(),g=a.createGain();
    o.type=bossStage?&#x27;sawtooth&#x27;:&#x27;triangle&#x27;; o.frequency.value=note;
    g.gain.setValueAtTime(0.05,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.18);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.2);
    if(musicStep%4===0){ // bass
      var bo=a.createOscillator(),bg=a.createGain();
      bo.type=&#x27;sine&#x27;; bo.frequency.value=note/2;
      bg.gain.setValueAtTime(0.06,a.currentTime); bg.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3);
      bo.connect(bg); bg.connect(a.destination); bo.start(); bo.stop(a.currentTime+0.3);
    }
    musicStep++;
    scheduleMusic(intense);
  }
  function scheduleMusic(intense){
    var tempo=intense?150:240;
    musicTimer=setTimeout(musicTick,tempo);
  }
  function startMusic(){ if(musicOn)return; musicOn=true; musicStep=0; scheduleMusic(); }
  function stopMusic(){ musicOn=false; if(musicTimer){clearTimeout(musicTimer);musicTimer=null;} }

  function paddleW(){ return expandTimer&gt;0?PADDLE_BASE*1.6:PADDLE_BASE; }
  function skin(){ return SKINS[skinIdx]; }

  function makeBricks(){
    bricks=[];
    if(bossStage){ totalBricks=1; return; }
    if(bonusStage){
      var cols=11,rows=5,bw=48,bh=16,gap=4,sx=(W-(cols*bw+(cols-1)*gap))/2;
      for(var r=0;r&lt;rows;r++)for(var c=0;c&lt;cols;c++)
        bricks.push({x:sx+c*(bw+gap),y:28+r*(bh+gap),w:bw,h:bh,hp:1,max:1,color:&#x27;#ffea00&#x27;,type:&#x27;coin&#x27;});
    } else {
      var cols=9,rows=Math.min(3+level,6),bw=58,bh=20,gap=6,sx=(W-(cols*bw+(cols-1)*gap))/2;
      var arr=[&#x27;#00e5ff&#x27;,&#x27;#ff00d4&#x27;,&#x27;#00ff9d&#x27;,&#x27;#a26bff&#x27;,&#x27;#ff5e00&#x27;,&#x27;#ff2e63&#x27;];
      for(var r=0;r&lt;rows;r++)for(var c=0;c&lt;cols;c++){
        var roll=Math.random(),hp=1,type=&#x27;normal&#x27;,color=arr[r%arr.length];
        if(roll&lt;0.12){type=&#x27;explode&#x27;;color=&#x27;#ff5e00&#x27;;}
        else if(roll&lt;0.35){hp=Math.random()&lt;0.5?3:2;}
        bricks.push({x:sx+c*(bw+gap),y:28+r*(bh+gap),w:bw,h:bh,hp:hp,max:hp,color:color,type:type});
      }
    }
    totalBricks=bricks.length;
  }

  function newBall(x,y,vx,vy){ return {x:x,y:y,r:8,vx:vx,vy:vy}; }
  function resetBalls(){ var sp=3+level*0.35; balls=[newBall(W/2,PADDLE_Y-20,(Math.random()&lt;0.5?-1:1)*sp,-sp)]; }

  function makeObstacles(){ obstacles=[]; if(!bonusStage&amp;&amp;!bossStage&amp;&amp;level&gt;=2) obstacles.push({x:W/2,y:H*0.55,r:16,vx:(1+level*0.2),angle:0}); }

  function makeBoss(){
    var hp=60+level*8;
    boss={x:W/2,y:70,r:44,vx:2.2,hp:hp,max:hp,shootCD:0};
    bossShots=[];
  }

  function startLevel(){
    bossStage=(level%5===0);
    bonusStage=(!bossStage &amp;&amp; level%4===0);
    paddle={x:(W-paddleW())/2};
    makeBricks(); resetBalls(); makeObstacles();
    particles=[];powerups=[];lasers=[];floatText=[];bossShots=[];boss=null;
    if(bossStage) makeBoss();
    mult=1;comboTimer=0;laserTimer=0;expandTimer=0;gambleUsed=false;
    updateHUD(); updateGambleTag();
    if(bossStage)ovTitle.textContent=&#x27;BOSS!&#x27;; else if(bonusStage)ovTitle.textContent=&#x27;BONUS STAGE!&#x27;;
  }

  function resetStats(){ shotsFired=0;shotsHit=0;longestCombo=0; }

  function startGame(){
    if(running)return;
    score=0;level=1;lives=3; resetStats();
    overlay.classList.add(&#x27;hidden&#x27;);
    startLevel(); startMusic();
    running=true; animId=requestAnimationFrame(tick);
    beep(660,0.1,&#x27;triangle&#x27;,0.1);
  }
  function stopGame(){ if(!running)return; running=false; if(animId){cancelAnimationFrame(animId);animId=null;} stopMusic(); }

  function gameOver(){
    running=false; if(animId){cancelAnimationFrame(animId);animId=null;} stopMusic();
    if(score&gt;best){best=score;bestEl.textContent=best;}
    var acc=shotsFired&gt;0?Math.round(shotsHit/shotsFired*100):0;
    ovTitle.textContent=&#x27;Game Over&#x27;;
    ovText.innerHTML=&#x27;Final Score: &lt;b&gt;&#x27;+score+&#x27;&lt;/b&gt;&lt;br&gt;Level Reached: &lt;b&gt;&#x27;+level+&#x27;&lt;/b&gt;&lt;br&gt;&#x27;+
      &#x27;Laser Accuracy: &lt;b&gt;&#x27;+acc+&#x27;%&lt;/b&gt;&lt;br&gt;Longest Combo: &lt;b&gt;x&#x27;+longestCombo+&#x27;&lt;/b&gt;&lt;br&gt;&#x27;+
      &#x27;Session Best: &lt;b&gt;&#x27;+best+&#x27;&lt;/b&gt;&lt;br&gt;&lt;br&gt;Press Start to play again!&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;); beep(160,0.4,&#x27;sawtooth&#x27;,0.14);
  }

  function nextLevel(){
    if(bonusStage)earn(&#x27;bonus&#x27;);
    if(bossStage)earn(&#x27;boss&#x27;);
    level++; if(level&gt;=5)earn(&#x27;lvl5&#x27;);
    beep(880,0.15,&#x27;triangle&#x27;,0.12); beep(1100,0.15,&#x27;triangle&#x27;,0.1);
    startLevel(); ovTitle.textContent=&#x27;Level &#x27;+level; flash=8;
  }

  function earn(k){
    if(badges[k])return; badges[k]=true;
    var map={combo:&#x27;b_combo&#x27;,multi:&#x27;b_multi&#x27;,laser:&#x27;b_laser&#x27;,bonus:&#x27;b_bonus&#x27;,boss:&#x27;b_boss&#x27;,gamble:&#x27;b_gamble&#x27;,lvl5:&#x27;b_lvl5&#x27;,r1000:&#x27;b_1000&#x27;};
    var el=document.getElementById(map[k]); if(el)el.classList.add(&#x27;earned&#x27;);
    beep(1320,0.12,&#x27;triangle&#x27;,0.12);
  }

  function updateHUD(){
    scoreEl.textContent=score; multEl.textContent=&#x27;x&#x27;+mult; levelEl.textContent=level; livesEl.textContent=lives;
    if(mult&gt;longestCombo)longestCombo=mult;
    if(bossStage&amp;&amp;boss){ barEl.style.width=(boss.hp/boss.max*100)+&#x27;%&#x27;; barEl.style.background=&#x27;linear-gradient(90deg,#ff2e63,#ff5e00)&#x27;; }
    else { var alive=bricks.filter(function(b){return b.hp&gt;0;}).length;
      barEl.style.width=(totalBricks?((totalBricks-alive)/totalBricks*100):0)+&#x27;%&#x27;;
      barEl.style.background=&#x27;linear-gradient(90deg,#00e5ff,#ff00d4)&#x27;; }
    if(score&gt;=1000)earn(&#x27;r1000&#x27;);
  }

  function updateGambleTag(){
    if(running &amp;&amp; mult&gt;=3 &amp;&amp; !gambleUsed){ gambleTag.classList.remove(&#x27;hidden&#x27;); }
    else gambleTag.classList.add(&#x27;hidden&#x27;);
  }

  function doGamble(){
    if(!running||mult&lt;3||gambleUsed)return;
    gambleUsed=true;
    if(Math.random()&lt;0.5){
      var win=mult*100; score+=win; pushFloat(W/2,H/2,&#x27;GAMBLE WIN +&#x27;+win);
      earn(&#x27;gamble&#x27;); flash=8; shake=6; beep(1200,0.2,&#x27;triangle&#x27;,0.14);
    } else {
      pushFloat(W/2,H/2,&#x27;GAMBLE LOST!&#x27;); mult=1; flash=6; shake=8; beep(180,0.3,&#x27;sawtooth&#x27;,0.14);
    }
    updateHUD(); updateGambleTag();
  }

  function cycleSkin(){
    for(var n=0;n&lt;SKINS.length;n++){
      skinIdx=(skinIdx+1)%SKINS.length;
      var s=SKINS[skinIdx];
      if(s.req===null||badges[s.req]){ pushFloat(paddle.x+paddleW()/2,PADDLE_Y-16,&#x27;Skin: &#x27;+s.name); beep(700,0.08,&#x27;triangle&#x27;,0.1); return; }
    }
  }

  function burst(x,y,c,n){ n=n||10; for(var i=0;i&lt;n;i++)particles.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,color:c}); }
  function pushFloat(x,y,t){ floatText.push({x:x,y:y,t:t,life:1}); }

  function spawnPowerup(x,y){
    if(Math.random()&gt;0.22)return;
    var types=[&#x27;multi&#x27;,&#x27;expand&#x27;,&#x27;laser&#x27;],t=types[Math.floor(Math.random()*types.length)];
    powerups.push({x:x,y:y,vy:2,type:t});
  }

  function hitBrick(b){
    b.hp--;
    if(b.hp&gt;0){ burst(b.x+b.w/2,b.y+b.h/2,b.color,4); beep(500,0.04,&#x27;square&#x27;,0.08); return; }
    mult=Math.min(mult+1,9); if(mult&gt;=9)earn(&#x27;combo&#x27;); comboTimer=90; updateGambleTag();
    var pts=(b.type===&#x27;coin&#x27;?30:10)*mult; score+=pts; pushFloat(b.x+b.w/2,b.y,&#x27;+&#x27;+pts);
    burst(b.x+b.w/2,b.y+b.h/2,b.color,12); beep(700+mult*60,0.05,&#x27;square&#x27;,0.1); shake=Math.max(shake,3);
    spawnPowerup(b.x+b.w/2,b.y+b.h/2);
    if(b.type===&#x27;explode&#x27;){ shake=8;flash=6;beep(220,0.2,&#x27;sawtooth&#x27;,0.14);
      for(var i=0;i&lt;bricks.length;i++){ var o=bricks[i]; if(o===b||o.hp&lt;=0)continue;
        var dx=o.x-b.x,dy=o.y-b.y; if(dx*dx+dy*dy&lt;80*80){o.hp=0;score+=10;burst(o.x+o.w/2,o.y+o.h/2,o.color,8);} } }
    updateHUD();
  }

  function hitBoss(dmg){
    boss.hp-=dmg; burst(boss.x,boss.y,&#x27;#ff2e63&#x27;,6); beep(400,0.05,&#x27;square&#x27;,0.1); shake=Math.max(shake,3);
    if(boss.hp&lt;=0){ boss.hp=0; score+=500*mult; pushFloat(boss.x,boss.y,&#x27;BOSS DOWN +&#x27;+(500*mult));
      burst(boss.x,boss.y,&#x27;#ffea00&#x27;,40); shake=14; flash=10; beep(120,0.5,&#x27;sawtooth&#x27;,0.16); }
    updateHUD();
  }

  function applyPowerup(t){
    if(t===&#x27;multi&#x27;){ earn(&#x27;multi&#x27;); var cur=balls.slice();
      cur.forEach(function(b){ balls.push(newBall(b.x,b.y,-b.vx,b.vy)); balls.push(newBall(b.x,b.y,b.vy,-b.vx)); });
      pushFloat(paddle.x+paddleW()/2,PADDLE_Y-20,&#x27;MULTI-BALL&#x27;); beep(900,0.1,&#x27;triangle&#x27;,0.12); }
    else if(t===&#x27;expand&#x27;){ expandTimer=600; pushFloat(paddle.x+paddleW()/2,PADDLE_Y-20,&#x27;WIDE&#x27;); beep(600,0.1,&#x27;triangle&#x27;,0.12); }
    else if(t===&#x27;laser&#x27;){ laserTimer=600; pushFloat(paddle.x+paddleW()/2,PADDLE_Y-20,&#x27;LASERS&#x27;); beep(1000,0.1,&#x27;square&#x27;,0.12); }
  }

  function fire(){
    if(laserTimer&lt;=0||shootCD&gt;0)return;
    shootCD=12; var w=paddleW();
    lasers.push({x:paddle.x+8,y:PADDLE_Y}); lasers.push({x:paddle.x+w-8,y:PADDLE_Y});
    shotsFired+=2; beep(1400,0.05,&#x27;square&#x27;,0.08);

  function tick(){
    if(!running)return;
    var w=paddleW();
    if(mouseX!==null) paddle.x+=(mouseX-w/2-paddle.x)*0.35;

    if(laserTimer&gt;0)laserTimer--; if(expandTimer&gt;0)expandTimer--; if(shootCD&gt;0)shootCD--;
    if(keys[&#x27; &#x27;])fire();

    obstacles.forEach(function(ob){ ob.x+=ob.vx;ob.angle+=0.1;
      if(ob.x-ob.r&lt;0){ob.x=ob.r;ob.vx=-ob.vx;} if(ob.x+ob.r&gt;W){ob.x=W-ob.r;ob.vx=-ob.vx;} });

    if(bossStage&amp;&amp;boss&amp;&amp;boss.hp&gt;0){
      boss.x+=boss.vx; if(boss.x-boss.r&lt;0){boss.x=boss.r;boss.vx=-boss.vx;} if(boss.x+boss.r&gt;W){boss.x=W-boss.r;boss.vx=-boss.vx;}
      boss.shootCD--; if(boss.shootCD&lt;=0){ boss.shootCD=70-level; bossShots.push({x:boss.x,y:boss.y+boss.r,vy:3.5}); beep(300,0.08,&#x27;sawtooth&#x27;,0.08); }
    }
    for(var si=bossShots.length-1;si&gt;=0;si--){ var bs=bossShots[si]; bs.y+=bs.vy;
      if(bs.y&gt;PADDLE_Y&amp;&amp;bs.y&lt;PADDLE_Y+PADDLE_H&amp;&amp;bs.x&gt;paddle.x&amp;&amp;bs.x&lt;paddle.x+w){
        bossShots.splice(si,1); lives--; shake=8;flash=6; beep(160,0.2,&#x27;sawtooth&#x27;,0.14); updateHUD();

    for(var bi=balls.length-1;bi&gt;=0;bi--){
      var ball=balls[bi]; ball.x+=ball.vx; ball.y+=ball.vy;
      if(ball.x-ball.r&lt;=0){ball.x=ball.r;ball.vx=-ball.vx;beep(400,0.04);}
      if(ball.x+ball.r&gt;=W){ball.x=W-ball.r;ball.vx=-ball.vx;beep(400,0.04);}
      if(ball.y-ball.r&lt;=0){ball.y=ball.r;ball.vy=-ball.vy;beep(400,0.04);}
      if(ball.vy&gt;0&amp;&amp;ball.y+ball.r&gt;=PADDLE_Y&amp;&amp;ball.y+ball.r&lt;=PADDLE_Y+PADDLE_H+8&amp;&amp;ball.x&gt;=paddle.x&amp;&amp;ball.x&lt;=paddle.x+w){
        ball.vy=-Math.abs(ball.vy); var hit=(ball.x-(paddle.x+w/2))/(w/2); ball.vx=hit*5; ball.y=PADDLE_Y-ball.r; beep(520,0.06,&#x27;square&#x27;,0.1); }
      obstacles.forEach(function(ob){ var dx=ball.x-ob.x,dy=ball.y-ob.y,d=Math.hypot(dx,dy)||1;

      for(var i=0;i&lt;bricks.length;i++){ var b=bricks[i]; if(b.hp&lt;=0)continue;

    if(balls.length===0){ lives--; updateHUD(); if(lives&lt;=0){gameOver();return;} shake=6;flash=5; resetBalls(); expandTimer=0;laserTimer=0; }

    for(var li=lasers.length-1;li&gt;=0;li--){ var lz=lasers[li]; lz.y-=9; var done=false;
      if(bossStage&amp;&amp;boss&amp;&amp;boss.hp&gt;0){ var dx=lz.x-boss.x,dy=lz.y-boss.y; if(dx*dx+dy*dy&lt;boss.r*boss.r){ hitBoss(2); shotsHit++; done=true; } }
      if(!done)for(var i=0;i&lt;bricks.length;i++){ var b=bricks[i]; if(b.hp&lt;=0)continue;
        if(lz.x&gt;b.x&amp;&amp;lz.x&lt;b.x+b.w&amp;&amp;lz.y&lt;b.y+b.h&amp;&amp;lz.y&gt;b.y){ hitBrick(b); shotsHit++; done=true; break; } }

    for(var pi=powerups.length-1;pi&gt;=0;pi--){ var pu=powerups[pi]; pu.y+=pu.vy;
      if(pu.y&gt;PADDLE_Y-6&amp;&amp;pu.y&lt;PADDLE_Y+PADDLE_H+6&amp;&amp;pu.x&gt;paddle.x&amp;&amp;pu.x&lt;paddle.x+w){ applyPowerup(pu.type); powerups.splice(pi,1); flash=4; }
      else if(pu.y&gt;H) powerups.splice(pi,1); }

    else if(bricks.every(function(b){return b.hp&lt;=0;})) nextLevel();

    for(var p=particles.length-1;p&gt;=0;p--){ var pt=particles[p]; pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.15;pt.life-=0.03; if(pt.life&lt;=0)particles.splice(p,1); }
    for(var f=floatText.length-1;f&gt;=0;f--){ var ft=floatText[f]; ft.y-=0.8;ft.life-=0.02; if(ft.life&lt;=0)floatText.splice(f,1); }
    if(shake&gt;0)shake*=0.85; if(flash&gt;0)flash--;

    draw(); animId=requestAnimationFrame(tick);
  }

  var puColors={multi:&#x27;#00e5ff&#x27;,expand:&#x27;#00ff9d&#x27;,laser:&#x27;#ff00d4&#x27;};
  var puIcons={multi:&#x27;⚪&#x27;,expand:&#x27;↔&#x27;,laser:&#x27;▲&#x27;};

  function draw(){
    ctx.save();
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    ctx.clearRect(-15,-15,W+30,H+30);
    var s=skin();
    for(var i=0;i&lt;bricks.length;i++){ var b=bricks[i]; if(b.hp&lt;=0)continue;

      if(b.type===&#x27;explode&#x27;){ ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;12px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;✦&#x27;,b.x+b.w/2,b.y+b.h-6); } }
    ctx.shadowBlur=0;

    if(bossStage&amp;&amp;boss&amp;&amp;boss.hp&gt;0){
      ctx.save(); ctx.translate(boss.x,boss.y);
      ctx.fillStyle=&#x27;#ff2e63&#x27;; ctx.shadowColor=&#x27;#ff2e63&#x27;; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(0,0,boss.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=&#x27;#ffea00&#x27;; ctx.beginPath(); ctx.arc(-14,-6,7,0,Math.PI*2); ctx.arc(14,-6,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=&#x27;#0a0a1a&#x27;; ctx.beginPath(); ctx.arc(-14,-6,3,0,Math.PI*2); ctx.arc(14,-6,3,0,Math.PI*2); ctx.fill();
      ctx.restore(); ctx.shadowBlur=0;
    }
    ctx.fillStyle=&#x27;#ff2e63&#x27;; ctx.shadowColor=&#x27;#ff2e63&#x27;; ctx.shadowBlur=8;
    for(var si=0;si&lt;bossShots.length;si++){ ctx.beginPath(); ctx.arc(bossShots[si].x,bossShots[si].y,5,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0;
    obstacles.forEach(function(ob){ ctx.fillStyle=&#x27;#888&#x27;; ctx.shadowColor=&#x27;#fff&#x27;; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(ob.x,ob.y,ob.r,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=&#x27;#ff2e63&#x27;; ctx.lineWidth=3; ctx.stroke(); ctx.shadowBlur=0; });
    for(var p=0;p&lt;particles.length;p++){ var pt=particles[p]; ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color; ctx.fillRect(pt.x-2,pt.y-2,4,4); }
    ctx.globalAlpha=1;
    for(var pi=0;pi&lt;powerups.length;pi++){ var pu=powerups[pi];
      ctx.fillStyle=puColors[pu.type]; ctx.shadowColor=puColors[pu.type]; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(pu.x,pu.y,10,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;#0a0a1a&#x27;; ctx.font=&#x27;bold 12px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(puIcons[pu.type],pu.x,pu.y+1); ctx.textBaseline=&#x27;alphabetic&#x27;; }
    ctx.fillStyle=&#x27;#ff00d4&#x27;; ctx.shadowColor=&#x27;#ff00d4&#x27;; ctx.shadowBlur=8;
    for(var li=0;li&lt;lasers.length;li++) ctx.fillRect(lasers[li].x-2,lasers[li].y-12,4,12);
    ctx.shadowBlur=0;
    var w=paddleW();
    ctx.fillStyle=laserTimer&gt;0?&#x27;#ff00d4&#x27;:s.paddle; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=12; ctx.fillRect(paddle.x,PADDLE_Y,w,PADDLE_H);
    if(laserTimer&gt;0){ ctx.fillRect(paddle.x+4,PADDLE_Y-4,4,4); ctx.fillRect(paddle.x+w-8,PADDLE_Y-4,4,4); }
    ctx.fillStyle=s.ball; ctx.shadowColor=s.ball; ctx.shadowBlur=14;
    for(var bi=0;bi&lt;balls.length;bi++){ ctx.beginPath(); ctx.arc(balls[bi].x,balls[bi].y,balls[bi].r,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0;
    ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;bold 14px sans-serif&#x27;;
    for(var f=0;f&lt;floatText.length;f++){ var ft=floatText[f]; ctx.globalAlpha=Math.max(0,ft.life); ctx.fillStyle=&#x27;#fff&#x27;; ctx.fillText(ft.t,ft.x,ft.y); }
    ctx.globalAlpha=1; ctx.restore();
    if(flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.05)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    var k=e.key;
    if(k===&#x27;ArrowLeft&#x27;||k===&#x27;ArrowRight&#x27;||k===&#x27; &#x27;){ keys[k]=true; e.preventDefault(); }
    else if(k===&#x27;g&#x27;||k===&#x27;G&#x27;){ doGamble(); }

  window.addEventListener(&#x27;keyup&#x27;,function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;||e.key===&#x27; &#x27;) keys[e.key]=false; });
  cv.addEventListener(&#x27;mousemove&#x27;,function(e){ var r=cv.getBoundingClientRect(); mouseX=(e.clientX-r.left)*(W/r.width); });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);

  bestEl.textContent=best;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

    } catch (_) {}

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;

      var d = document.documentElement;

      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;

        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

    } catch (_) {}
  }

  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
