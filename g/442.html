<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐙 Sea Monster Rising</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐙 Sea Monster Rising</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a2a3a; color: #eaf6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .5px; }
  .instructions { font-size: 16px; color: #bfe3f7; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,.35); }
  .hud { position: absolute; top: 8px; right: 10px; display: flex; gap: 4px; z-index: 20; }
  .heart { font-size: 26px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .heart.lost { opacity: .18; }
  .scorebox { position: absolute; bottom: 8px; right: 10px; z-index: 20; text-align: right; }
  .scorebox .num { font-size: 30px; font-weight: 800; color: #ffe27a; text-shadow: 0 2px 4px rgba(0,0,0,.5); line-height: 1; }
  .scorebox .lbl { font-size: 12px; color: #cfeaf7; letter-spacing: 1px; }
  .charge { position: absolute; bottom: 8px; left: 10px; z-index: 20; font-size: 14px; font-weight: 700; background: rgba(0,0,0,.3); padding: 4px 8px; border-radius: 6px; }
  .charge.ready { color: #7dff8f; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 30; background: rgba(4,20,30,.55); text-align: center; }
  .banner h2 { margin: 0 0 6px; font-size: 30px; }
  .banner p { margin: 0; font-size: 16px; color: #cfeaf7; }
  .hidden { display: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐙 Sea Monster Rising&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to swim your sea monster upward, dodging Viking rowboats and gobbling up stray fish for bonus points. Reach the top for 10 points and to grow — once fully charged after 5 rows, swim into a boat to devour it!&lt;/p&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;hud&quot; id=&quot;hud&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;scorebox&quot;&gt;&lt;div class=&quot;num&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;SCORE&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;charge&quot; id=&quot;charge&quot;&gt;Charge: 0/5&lt;/div&gt;
    &lt;canvas id=&quot;wave&quot; width=&quot;620&quot; height=&quot;432&quot; style=&quot;position:absolute;inset:0;z-index:1&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;banner hidden&quot; id=&quot;banner&quot;&gt;&lt;h2 id=&quot;btitle&quot;&gt;Press Start&lt;/h2&gt;&lt;p id=&quot;bmsg&quot;&gt;Swim to the top of the sea!&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var CELL = 48, COLS = 12, LANES = 7, ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var OBSTACLE_W = CELL * 2 - 8, OBSTACLE_H = CELL - 10;

  var canvas = document.getElementById(&#x27;wave&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var chargeEl = document.getElementById(&#x27;charge&#x27;);
  var hudEl = document.getElementById(&#x27;hud&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var btitle = document.getElementById(&#x27;btitle&#x27;);
  var bmsg = document.getElementById(&#x27;bmsg&#x27;);

  var running = false, animId = null;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [];
  var fishes = [];
  var score = 0, lives = 3, charge = 0;
  var t = 0;
  var floats = [];

  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.15;
      o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    } catch(_) {}
  }
  // chompy fish-eating sound: a descending pitch bite plus a crunch
  function chompSound() {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var now = actx.currentTime;
      // bite swoop
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;square&#x27;;
      o.frequency.setValueAtTime(500, now);
      o.frequency.exponentialRampToValueAtTime(120, now + 0.12);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      o.connect(g); g.connect(actx.destination);
      o.start(now); o.stop(now + 0.15);
      // second little gulp
      var o2 = actx.createOscillator(), g2 = actx.createGain();
      o2.type = &#x27;sine&#x27;;
      o2.frequency.setValueAtTime(220, now + 0.09);
      o2.frequency.exponentialRampToValueAtTime(660, now + 0.2);
      g2.gain.setValueAtTime(0.14, now + 0.09);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      o2.connect(g2); g2.connect(actx.destination);
      o2.start(now + 0.09); o2.stop(now + 0.25);
    } catch(_) {}
  }

  function buildLanes() {
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var y = (i+1) * CELL + (CELL - OBSTACLE_H)/2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.5 + (i % 3) * 0.25;
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var obstacles = [];
      for (var j = 0; j &lt; count; j++) {
        obstacles.push({ x: j*gap + (i*30)%gap, alive: true });
      }
      lanes.push({ row: i+1, y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  var FISH_COLORS = [&#x27;#ffb347&#x27;,&#x27;#ff6f91&#x27;,&#x27;#5ad1ff&#x27;,&#x27;#a1ff5a&#x27;,&#x27;#ff5a5a&#x27;];
  function spawnFish() {
    var lane = 1 + Math.floor(Math.random() * LANES);
    var x = 40 + Math.random() * (FIELD_W - 80);
    var y = lane * CELL + CELL/2;
    return {
      x: x, y: y, row: lane,
      dir: Math.random() &lt; 0.5 ? 1 : -1,
      speed: 0.4 + Math.random() * 0.5,
      color: FISH_COLORS[Math.floor(Math.random()*FISH_COLORS.length)],
      wob: Math.random() * 6.28
    };
  }
  function buildFishes() {
    fishes = [];
    for (var i = 0; i &lt; 4; i++) fishes.push(spawnFish());
  }

  function renderHUD() {
    hudEl.innerHTML = &#x27;&#x27;;
    for (var i = 0; i &lt; 3; i++) {
      var h = document.createElement(&#x27;span&#x27;);
      h.className = &#x27;heart&#x27; + (i &lt; lives ? &#x27;&#x27; : &#x27; lost&#x27;);
      h.textContent = &#x27;❤️&#x27;;
      hudEl.appendChild(h);
    }
  }

  function updateCharge() {
    chargeEl.textContent = charge &gt;= 5 ? &#x27;CHARGED! Eat a boat!&#x27; : (&#x27;Charge: &#x27; + charge + &#x27;/5&#x27;);
    chargeEl.className = &#x27;charge&#x27; + (charge &gt;= 5 ? &#x27; ready&#x27; : &#x27;&#x27;);
  }

  function resetHero() { hero.col = Math.floor(COLS/2); hero.row = ROWS-1; }

  // monster is now bigger: larger base and larger growth per row
  function monsterSize() { return 18 + charge * 4; }

  function drawWater() {
    var g = ctx.createLinearGradient(0,0,0,FIELD_H);
    g.addColorStop(0, &#x27;#1b6f8c&#x27;);
    g.addColorStop(1, &#x27;#0a3a52&#x27;);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,FIELD_W,FIELD_H);
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.08)&#x27;;
    ctx.lineWidth = 2;
    for (var y = 0; y &lt; FIELD_H; y += 24) {
      ctx.beginPath();
      for (var x = 0; x &lt;= FIELD_W; x += 8) {
        var yy = y + Math.sin((x*0.05) + t*0.05 + y*0.1) * 3;
        if (x===0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
  }

  function drawFish(f) {
    ctx.save();
    var bob = Math.sin(t*0.15 + f.wob) * 3;
    ctx.translate(f.x, f.y + bob);
    ctx.scale(f.dir, 1);
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-9, 0);
    ctx.lineTo(-18, -6);
    ctx.lineTo(-18, 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(5, -2, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#111&#x27;;
    ctx.beginPath(); ctx.arc(5.6, -2, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBoat(x, y, dir) {
    ctx.save();
    ctx.translate(x + OBSTACLE_W/2, y + OBSTACLE_H/2);
    var bob = Math.sin(t*0.1 + x*0.05) * 2;
    ctx.translate(0, bob);
    ctx.fillStyle = &#x27;#7a4a24&#x27;;
    ctx.beginPath();
    ctx.moveTo(-OBSTACLE_W/2, -OBSTACLE_H/2+4);
    ctx.lineTo(OBSTACLE_W/2, -OBSTACLE_H/2+4);
    ctx.quadraticCurveTo(OBSTACLE_W/2+8, 0, OBSTACLE_W/2-6, OBSTACLE_H/2);
    ctx.lineTo(-OBSTACLE_W/2+6, OBSTACLE_H/2);
    ctx.quadraticCurveTo(-OBSTACLE_W/2-8, 0, -OBSTACLE_W/2, -OBSTACLE_H/2+4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = &#x27;#5c3617&#x27;;
    ctx.fillRect(-OBSTACLE_W/2, -OBSTACLE_H/2+2, OBSTACLE_W, 5);
    for (var s = -1; s &lt;= 1; s++) {
      ctx.beginPath();
      ctx.arc(s*22, -OBSTACLE_H/2+4, 6, 0, Math.PI*2);
      ctx.fillStyle = (s%2===0)?&#x27;#c0392b&#x27;:&#x27;#2c3e9e&#x27;;
      ctx.fill();
    }
    var rowPhase = Math.sin(t*0.2);
    for (var v = -1; v &lt;= 1; v++) {
      ctx.fillStyle = &#x27;#f0c27b&#x27;;
      ctx.beginPath(); ctx.arc(v*20, 2, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;#b0b8c0&#x27;;
      ctx.beginPath(); ctx.arc(v*20, 0, 5, Math.PI, 0); ctx.fill();
      ctx.fillStyle = &#x27;#e8e8e8&#x27;;
      ctx.fillRect(v*20-6, -2, 2, -3);
      ctx.fillRect(v*20+4, -2, 2, -3);
      ctx.strokeStyle = &#x27;#3a2412&#x27;;
      ctx.lineWidth = 2;
      var oy = 8 + rowPhase*4;
      ctx.beginPath();
      ctx.moveTo(v*20, 4);
      ctx.lineTo(v*20 - dir*14, oy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMonster() {
    var hx = hero.col * CELL + CELL/2;
    var hy = hero.row * CELL + CELL/2;
    var size = monsterSize();
    var wob = Math.sin(t*0.15) * 3;
    ctx.save();
    ctx.translate(hx, hy);
    if (charge &gt;= 5) {
      ctx.fillStyle = &#x27;rgba(125,255,143,0.25)&#x27;;
      ctx.beginPath(); ctx.arc(0,0,size+10,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = &#x27;#7d3fbf&#x27;;
    for (var i = 0; i &lt; 8; i++) {
      var a = (i/8)*Math.PI*2 + t*0.02;
      var tx = Math.cos(a) * size;
      var ty = Math.sin(a) * size + size*0.4;
      ctx.beginPath();
      ctx.arc(tx, ty + wob, size*0.28, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = &#x27;#9b59d0&#x27;;
    ctx.beginPath();
    ctx.arc(0, wob*0.5, size, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(-size*0.35, -size*0.2+wob*0.5, size*0.28, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.35, -size*0.2+wob*0.5, size*0.28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#1a1a2a&#x27;;
    ctx.beginPath(); ctx.arc(-size*0.3, -size*0.15+wob*0.5, size*0.13, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.4, -size*0.15+wob*0.5, size*0.13, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawFloats() {
    for (var i = floats.length-1; i &gt;= 0; i--) {
      var f = floats[i];
      ctx.fillStyle = &#x27;rgba(255,226,122,&#x27; + (f.life/40) + &#x27;)&#x27;;
      ctx.font = &#x27;bold 18px system-ui&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(f.txt, f.x, f.y);
      f.y -= 1; f.life--;
      if (f.life &lt;= 0) floats.splice(i,1);
    }
    ctx.textAlign = &#x27;start&#x27;;
  }

  function render() {
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    drawWater();
    for (var i = 0; i &lt; fishes.length; i++) drawFish(fishes[i]);
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        if (o.alive) drawBoat(o.x, lane.y, lane.dir);
      }
    }
    drawMonster();
    drawFloats();
  }

  function boatHitTest() {
    var laneIdx = hero.row - 1;
    if (laneIdx &lt; 0 || laneIdx &gt;= LANES) return;
    var hx = hero.col * CELL + 6;
    var hy = hero.row * CELL + 6;
    var hs = CELL - 12;
    var lane = lanes[laneIdx];
    for (var k = 0; k &lt; lane.obstacles.length; k++) {
      var o = lane.obstacles[k];
      if (!o.alive) continue;
      if (hx &lt; o.x + OBSTACLE_W &amp;&amp; hx + hs &gt; o.x &amp;&amp;
          hy &lt; lane.y + OBSTACLE_H &amp;&amp; hy + hs &gt; lane.y) {
        if (charge &gt;= 5) {
          o.alive = false;
          charge = 0;
          score += 50;
          scoreEl.textContent = score;
          floats.push({ x: o.x + OBSTACLE_W/2, y: lane.y, txt: &#x27;+50 YUM!&#x27;, life: 40 });
          updateCharge();
          beep(180, 0.3, &#x27;sawtooth&#x27;, 0.2);
          beep(90, 0.4, &#x27;square&#x27;, 0.15);
        } else {
          loseLife();
        }
        return;
      }
    }
  }

  function fishHitTest() {
    var hcx = hero.col * CELL + CELL/2;
    var hcy = hero.row * CELL + CELL/2;
    var reach = monsterSize() + 8;
    for (var i = 0; i &lt; fishes.length; i++) {
      var f = fishes[i];
      var dx = f.x - hcx, dy = f.y - hcy;
      if (dx*dx + dy*dy &lt; reach*reach) {
        score += 15;
        scoreEl.textContent = score;
        floats.push({ x: f.x, y: f.y, txt: &#x27;+15 fish!&#x27;, life: 40 });
        chompSound();
        fishes[i] = spawnFish();
      }
    }
  }

  function loseLife() {
    lives--;
    renderHUD();
    beep(120, 0.3, &#x27;square&#x27;, 0.2);
    resetHero();
    if (lives &lt;= 0) endGame();
  }

  function tick() {
    if (!running) return;
    t++;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        if (!o.alive) continue;
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
      }
    }
    for (var i = 0; i &lt; fishes.length; i++) {
      var f = fishes[i];
      f.x += f.dir * f.speed;
      if (f.x &gt; FIELD_W - 20) { f.x = FIELD_W - 20; f.dir = -1; }
      else if (f.x &lt; 20) { f.x = 20; f.dir = 1; }
    }
    boatHitTest();
    fishHitTest();
    render();
    if (running) animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS-1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS-1, hero.row + dr));
    if (dr &lt; 0) beep(400, 0.08, &#x27;sine&#x27;, 0.1);
    boatHitTest();
    fishHitTest();
    if (hero.row === 0) {
      score += 10;
      scoreEl.textContent = score;
      if (charge &lt; 5) { charge++; updateCharge(); }
      floats.push({ x: hero.col*CELL+CELL/2, y: 20, txt: &#x27;+10&#x27;, life: 40 });
      beep(660, 0.12, &#x27;triangle&#x27;, 0.15);
      resetHero();
    }
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    btitle.textContent = &#x27;The seas claim you!&#x27;;
    bmsg.textContent = &#x27;Final score: &#x27; + score + &#x27; — press Start to dive again.&#x27;;
    banner.classList.remove(&#x27;hidden&#x27;);
    beep(200, 0.5, &#x27;sawtooth&#x27;, 0.2);
  }

  function startGame() {
    score = 0; lives = 3; charge = 0; t = 0; floats = [];
    scoreEl.textContent = &#x27;0&#x27;;
    renderHUD();
    updateCharge();
    buildLanes();
    buildFishes();
    resetHero();
    banner.classList.add(&#x27;hidden&#x27;);
    running = true;
    render();
    animId = requestAnimationFrame(tick);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0,-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0,1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  buildLanes(); buildFishes(); renderHUD(); updateCharge(); render();
  banner.classList.remove(&#x27;hidden&#x27;);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry

<script>
(function () {
  var iframe = document.getElementById('game');

  var stopBtn = document.getElementById('stop');

  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
