  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🚀 Bubble Blaster&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Your rocket auto-aims and locks onto the nearest bubble (glowing white ring) — press &lt;strong&gt;Space&lt;/strong&gt; to fire a laser and pop it. Steer manually with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt; if you like, and use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;🚀&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 40, SHIP_H = 40, SHIP_BOTTOM = 8, SHIP_SPEED = 3.6, AUTO_SPEED = 5;
  var BULLET_W = 6, BULLET_H = 16, BULLET_SPEED = 5.5;
  var TARGET_SIZE = 36, TARGET_SPEED = 1.1;
  var SPAWN_INTERVAL = 1200;
  var MANUAL_LOCK_MS = 900;
  var COLORS = [&#x27;#ff5ec7&#x27;,&#x27;#5ee1ff&#x27;,&#x27;#7dff8e&#x27;,&#x27;#ffd24a&#x27;,&#x27;#ff8a5e&#x27;,&#x27;#b98cff&#x27;];
  var BURSTS = [&#x27;💥&#x27;,&#x27;✨&#x27;,&#x27;🌟&#x27;,&#x27;💫&#x27;];
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [];
  var score = 0;
  var lastShot = 0, lastManual = 0;
  var lockedTarget = null;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // starfield
  (function makeStars(){
    for (var i=0;i&lt;60;i++){
      var s=document.createElement(&#x27;div&#x27;);
      s.className=&#x27;star&#x27;;
      s.style.left=Math.random()*FIELD_W+&#x27;px&#x27;;
      s.style.top=Math.random()*FIELD_H+&#x27;px&#x27;;
      s.style.opacity=(0.3+Math.random()*0.6).toFixed(2);
      var sz=(1+Math.random()*2).toFixed(1);
      s.style.width=sz+&#x27;px&#x27;; s.style.height=sz+&#x27;px&#x27;;
      field.appendChild(s);
    }
  })();

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    var c = COLORS[Math.floor(Math.random()*COLORS.length)];
    el.style.background = &#x27;radial-gradient(circle at 30% 30%, #fff, &#x27;+c+&#x27; 70%)&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function pickLock() {
    var best = null, bestY = -Infinity;
    for (var i = 0; i &lt; targets.length; i++) {
      var t = targets[i];
      if (t.dying) continue;
      if (t.y &gt; bestY) { bestY = t.y; best = t; }
    }
    return best;
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function makeBurst(x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;burst&#x27;;
    el.textContent = BURSTS[Math.floor(Math.random()*BURSTS.length)];
    el.style.left = (x - 10) + &#x27;px&#x27;;
    el.style.top = (y - 10) + &#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 400);
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    var manual = false;
    if (keysDown[&#x27;ArrowLeft&#x27;]) { shipX -= SHIP_SPEED; manual = true; }
    if (keysDown[&#x27;ArrowRight&#x27;]) { shipX += SHIP_SPEED; manual = true; }
    if (manual) lastManual = now;

    var newLock = pickLock();
    if (newLock !== lockedTarget) {
      if (lockedTarget &amp;&amp; lockedTarget.el) lockedTarget.el.classList.remove(&#x27;locked&#x27;);
      lockedTarget = newLock;
      if (lockedTarget &amp;&amp; lockedTarget.el) lockedTarget.el.classList.add(&#x27;locked&#x27;);
    }
    if (lockedTarget &amp;&amp; (now - lastManual &gt; MANUAL_LOCK_MS)) {
      var targetCenter = lockedTarget.x + TARGET_SIZE / 2;
      var shipCenter = shipX + SHIP_W / 2;
      var diff = targetCenter - shipCenter;
      if (Math.abs(diff) &lt;= AUTO_SPEED) shipX += diff;
      else shipX += (diff &gt; 0 ? AUTO_SPEED : -AUTO_SPEED);
    }
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      if (t.dying) continue;
      t.y += TARGET_SPEED;
      if (t.y &gt; FIELD_H) {
        if (t === lockedTarget) lockedTarget = null;
        field.removeChild(t.el); targets.splice(j, 1); continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (t2.dying) continue;
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          t2.dying = true;
          if (t2 === lockedTarget) lockedTarget = null;
          t2.el.classList.remove(&#x27;locked&#x27;);
          t2.el.classList.add(&#x27;hit&#x27;);
          makeBurst(t2.x + TARGET_SIZE/2, t2.y + TARGET_SIZE/2);
          (function (tt) {
            setTimeout(function () {
              if (tt.el &amp;&amp; tt.el.parentNode) tt.el.parentNode.removeChild(tt.el);
              var k = targets.indexOf(tt);
              if (k !== -1) targets.splice(k, 1);
            }, 200);
          })(t2);
          score += 1;
          scoreEl.textContent = score;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bullets = []; targets = [];
    lockedTarget = null;
    var bs = field.querySelectorAll(&#x27;.burst&#x27;);
    for (var i=0;i&lt;bs.length;i++) bs[i].parentNode.removeChild(bs[i]);
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0; lastManual = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true; e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) spawnBullet(); e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  paintShip();

<script>

    if (!e || !e.data || e.data.type !== 'game_size') return;

    var w = e.data.w, h = e.data.h;
