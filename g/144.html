  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #eef3f0; color: #222; overflow-y: auto; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the frog with the arrow keys and reach the green strip at the top to score — dodge the cars or the round ends. Step onto a 🐞 bug for bonus points, and use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_H = CELL - 16;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var bugs = [];          // {col, row, el}
  var bugTimer = 0;       // frames until next bug spawn
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var CAR_COLORS = [&#x27;#e74c3c&#x27;,&#x27;#3498db&#x27;,&#x27;#f1c40f&#x27;,&#x27;#2ecc71&#x27;,&#x27;#e67e22&#x27;,&#x27;#9b59b6&#x27;,&#x27;#1abc9c&#x27;,&#x27;#ff6fae&#x27;];

  function rand(min, max) { return min + Math.random() * (max - min); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function carSVG(w, h, color, dir, shape) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(&#x27; + (-w) + &#x27;,0)&quot;&#x27; : &#x27;&#x27;;
    var body, cabin, wheels;
    var wr = h * 0.22;
    var wy = h - wr * 0.6;
    var wx1 = w * 0.24, wx2 = w * 0.76;
    wheels =
      &#x27;&lt;circle cx=&quot;&#x27;+wx1+&#x27;&quot; cy=&quot;&#x27;+wy+&#x27;&quot; r=&quot;&#x27;+wr+&#x27;&quot; fill=&quot;#1a1a1a&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+wx2+&#x27;&quot; cy=&quot;&#x27;+wy+&#x27;&quot; r=&quot;&#x27;+wr+&#x27;&quot; fill=&quot;#1a1a1a&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+wx1+&#x27;&quot; cy=&quot;&#x27;+wy+&#x27;&quot; r=&quot;&#x27;+(wr*0.45)+&#x27;&quot; fill=&quot;#888&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+wx2+&#x27;&quot; cy=&quot;&#x27;+wy+&#x27;&quot; r=&quot;&#x27;+(wr*0.45)+&#x27;&quot; fill=&quot;#888&quot;/&gt;&#x27;;

    if (shape === &#x27;sport&#x27;) {
      body = &#x27;&lt;path d=&quot;M&#x27;+(w*0.04)+&#x27; &#x27;+(h*0.72)+&#x27; Q&#x27;+(w*0.04)+&#x27; &#x27;+(h*0.45)+&#x27; &#x27;+(w*0.28)+&#x27; &#x27;+(h*0.42)+
             &#x27; L&#x27;+(w*0.42)+&#x27; &#x27;+(h*0.2)+&#x27; Q&#x27;+(w*0.55)+&#x27; &#x27;+(h*0.12)+&#x27; &#x27;+(w*0.68)+&#x27; &#x27;+(h*0.22)+
             &#x27; L&#x27;+(w*0.8)+&#x27; &#x27;+(h*0.42)+&#x27; Q&#x27;+(w*0.96)+&#x27; &#x27;+(h*0.44)+&#x27; &#x27;+(w*0.96)+&#x27; &#x27;+(h*0.72)+
             &#x27; Z&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27;;
      cabin = &#x27;&lt;path d=&quot;M&#x27;+(w*0.44)+&#x27; &#x27;+(h*0.24)+&#x27; L&#x27;+(w*0.55)+&#x27; &#x27;+(h*0.14)+&#x27; Q&#x27;+(w*0.62)+&#x27; &#x27;+(h*0.12)+&#x27; &#x27;+(w*0.66)+&#x27; &#x27;+(h*0.24)+&#x27; Z&quot; fill=&quot;#bfe6ff&quot; opacity=&quot;0.85&quot;/&gt;&#x27;;
    } else if (shape === &#x27;truck&#x27;) {
      body = &#x27;&lt;rect x=&quot;&#x27;+(w*0.04)+&#x27;&quot; y=&quot;&#x27;+(h*0.28)+&#x27;&quot; width=&quot;&#x27;+(w*0.92)+&#x27;&quot; height=&quot;&#x27;+(h*0.5)+&#x27;&quot; rx=&quot;4&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
             &#x27;&lt;rect x=&quot;&#x27;+(w*0.04)+&#x27;&quot; y=&quot;&#x27;+(h*0.12)+&#x27;&quot; width=&quot;&#x27;+(w*0.46)+&#x27;&quot; height=&quot;&#x27;+(h*0.66)+&#x27;&quot; rx=&quot;4&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27;;
      cabin = &#x27;&lt;rect x=&quot;&#x27;+(w*0.1)+&#x27;&quot; y=&quot;&#x27;+(h*0.2)+&#x27;&quot; width=&quot;&#x27;+(w*0.3)+&#x27;&quot; height=&quot;&#x27;+(h*0.28)+&#x27;&quot; rx=&quot;3&quot; fill=&quot;#bfe6ff&quot; opacity=&quot;0.85&quot;/&gt;&#x27;;
    } else {
      body = &#x27;&lt;rect x=&quot;&#x27;+(w*0.03)+&#x27;&quot; y=&quot;&#x27;+(h*0.42)+&#x27;&quot; width=&quot;&#x27;+(w*0.94)+&#x27;&quot; height=&quot;&#x27;+(h*0.4)+&#x27;&quot; rx=&quot;6&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
             &#x27;&lt;path d=&quot;M&#x27;+(w*0.24)+&#x27; &#x27;+(h*0.44)+&#x27; L&#x27;+(w*0.36)+&#x27; &#x27;+(h*0.18)+&#x27; L&#x27;+(w*0.66)+&#x27; &#x27;+(h*0.18)+&#x27; L&#x27;+(w*0.78)+&#x27; &#x27;+(h*0.44)+&#x27; Z&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27;;
      cabin = &#x27;&lt;path d=&quot;M&#x27;+(w*0.3)+&#x27; &#x27;+(h*0.42)+&#x27; L&#x27;+(w*0.38)+&#x27; &#x27;+(h*0.24)+&#x27; L&#x27;+(w*0.62)+&#x27; &#x27;+(h*0.24)+&#x27; L&#x27;+(w*0.7)+&#x27; &#x27;+(h*0.42)+&#x27; Z&quot; fill=&quot;#bfe6ff&quot; opacity=&quot;0.85&quot;/&gt;&#x27;;
    }
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 &#x27;+w+&#x27; &#x27;+h+&#x27;&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&#x27; +
           &#x27;&lt;g&#x27;+flip+&#x27;&gt;&#x27; + body + cabin + wheels + &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }

  function heroSVG(s) {
    return &#x27;&lt;svg width=&quot;&#x27;+s+&#x27;&quot; height=&quot;&#x27;+s+&#x27;&quot; viewBox=&quot;0 0 100 100&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;60&quot; rx=&quot;34&quot; ry=&quot;30&quot; fill=&quot;#4caf50&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;72&quot; rx=&quot;22&quot; ry=&quot;14&quot; fill=&quot;#a5d66b&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;30&quot; r=&quot;14&quot; fill=&quot;#4caf50&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;70&quot; cy=&quot;30&quot; r=&quot;14&quot; fill=&quot;#4caf50&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;30&quot; r=&quot;8&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;70&quot; cy=&quot;30&quot; r=&quot;8&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;31&quot; cy=&quot;31&quot; r=&quot;4&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;71&quot; cy=&quot;31&quot; r=&quot;4&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M38 66 Q50 74 62 66&quot; stroke=&quot;#2e7d32&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function buildField() {
    field.innerHTML = &#x27;&#x27;;
    var topSafe = document.createElement(&#x27;div&#x27;);
    topSafe.className = &#x27;safe&#x27;;
    topSafe.style.top = &#x27;0px&#x27;;
    topSafe.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(topSafe);
    var botSafe = document.createElement(&#x27;div&#x27;);
    botSafe.className = &#x27;safe&#x27;;
    botSafe.style.top = ((ROWS - 1) * CELL) + &#x27;px&#x27;;
    botSafe.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(botSafe);
  }

  function buildLanes() {
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var laneEl = document.createElement(&#x27;div&#x27;);
      laneEl.className = &#x27;lane&#x27;;
      laneEl.style.top = (laneRow * CELL) + &#x27;px&#x27;;
      laneEl.style.height = CELL + &#x27;px&#x27;;
      field.appendChild(laneEl);

      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var shape = pick([&#x27;sedan&#x27;,&#x27;sport&#x27;,&#x27;truck&#x27;]);
        var w = shape === &#x27;truck&#x27; ? CELL * 2.1 : (shape === &#x27;sport&#x27; ? CELL * 1.9 : CELL * 1.8);
        var color = pick(CAR_COLORS);
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;car&#x27;;
        el.style.width = w + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.innerHTML = carSVG(w, OBSTACLE_H, color, dir, shape);
        field.appendChild(el);
        var base = rand(0.35, 1.6);
        obstacles.push({
          x: x, el: el, w: w,
          speed: base,
          target: rand(0.35, 1.6),
          retarget: rand(20, 90)
        });
      }
      lanes.push({ y: y, dir: dir, obstacles: obstacles });
    }
  }

  function clearBugs() {
    bugs.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    bugs = [];
  }

  function spawnBug() {
    if (bugs.length &gt;= 3) return;
    // Bugs live only on the road lanes (rows 1..LANES).
    var row = 1 + Math.floor(Math.random() * LANES);
    var col = Math.floor(Math.random() * COLS);
    // Avoid stacking on an existing bug.
    for (var i = 0; i &lt; bugs.length; i++) {
      if (bugs[i].row === row &amp;&amp; bugs[i].col === col) return;
    }
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bug&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.left = (col * CELL) + &#x27;px&#x27;;
    el.style.top = (row * CELL) + &#x27;px&#x27;;
    el.textContent = &#x27;🐞&#x27;;
    field.appendChild(el);
    bugs.push({ col: col, row: row, el: el, life: rand(300, 600) });
  }

  function makeHero() {
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = heroSVG(HERO_SIZE);
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function checkBugPickup() {
    for (var i = bugs.length - 1; i &gt;= 0; i--) {
      if (bugs[i].row === hero.row &amp;&amp; bugs[i].col === hero.col) {
        score += 3;
        scoreEl.textContent = score;
        if (bugs[i].el.parentNode) bugs[i].el.parentNode.removeChild(bugs[i].el);
        bugs.splice(i, 1);
      }
    }
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.speed += (o.target - o.speed) * 0.05;
        o.retarget -= 1;
        if (o.retarget &lt;= 0) {
          o.target = rand(0.35, 1.7);
          o.retarget = rand(20, 90);
        }
        o.x += lane.dir * o.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) {
          o.x = -o.w;
          o.speed = rand(0.35, 1.6);
          o.target = rand(0.35, 1.7);
        } else if (lane.dir &lt; 0 &amp;&amp; o.x + o.w &lt; 0) {
          o.x = FIELD_W;
          o.speed = rand(0.35, 1.6);
          o.target = rand(0.35, 1.7);
        }
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    // Bug lifetimes and spawning.
    bugTimer -= 1;
    if (bugTimer &lt;= 0) {
      spawnBug();
      bugTimer = rand(120, 260);
    }
    for (var b = bugs.length - 1; b &gt;= 0; b--) {
      bugs[b].life -= 1;
      if (bugs[b].life &lt;= 0) {
        if (bugs[b].el.parentNode) bugs[b].el.parentNode.removeChild(bugs[b].el);
        bugs.splice(b, 1);
      }
    }

    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var lane2 = lanes[laneIdx];
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        var pad = 6;
        if (hx + pad &lt; o2.x + o2.w &amp;&amp; hx + HERO_SIZE - pad &gt; o2.x &amp;&amp;
            hy &lt; lane2.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane2.y) {
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    hero.col = nc;
    hero.row = nr;
    paintHero();
    checkBugPickup();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (heroEl) heroEl.style.filter = &#x27;grayscale(1) brightness(1.4)&#x27;;
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    clearBugs();
    buildField();
    buildLanes();
    makeHero();
    resetHero();
    bugTimer = 60;   // first bug appears quickly
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the field before pressing Start.
  buildField();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;
