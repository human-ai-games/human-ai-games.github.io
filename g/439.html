<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Splash</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Ball Splash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .board { position: relative; width: 620px; height: 440px; flex-shrink: 0; margin: 0; background: linear-gradient(#dff1ff, #f3fbff); border-radius: 8px; cursor: none; overflow: hidden; }
  .ball { position: absolute; width: 56px; height: 56px; border-radius: 50%; cursor: none; box-shadow: inset -6px -6px 12px rgba(0,0,0,0.25); }
  .water { position: absolute; left: 0; bottom: 0; width: 100%; height: 70px; background: linear-gradient(#3aa8d8, #1c6fa0); z-index: 5; }
  .water::before { content: &#x27;&#x27;; position: absolute; top: -8px; left: 0; width: 100%; height: 12px; background: rgba(255,255,255,0.35); border-radius: 50%; animation: bob 2.5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  .hammer { position: absolute; width: 60px; height: 60px; pointer-events: none; transform-origin: 20% 20%; transition: transform 0.06s ease-out; z-index: 100; font-size: 48px; line-height: 60px; }
  .hammer.swing { transform: rotate(-70deg); }
  .droplet { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: rgba(160,220,255,0.9); z-index: 6; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Ball Splash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to aim the hammer and click the falling balls to smash them for points. If a ball splashes into the water at the bottom you lose a life — you have 3!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;|&amp;nbsp; Lives: &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;water&quot; id=&quot;water&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hammer&quot; id=&quot;hammer&quot;&gt;🔨&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 440, BALL_SIZE = 56, WATER_H = 70;
  var WATER_TOP = BOARD_H - WATER_H;
  var SPAWN_MS = 1000;
  var COLORS = [&#x27;#e74c3c&#x27;,&#x27;#3498db&#x27;,&#x27;#2ecc71&#x27;,&#x27;#f1c40f&#x27;,&#x27;#9b59b6&#x27;,&#x27;#e67e22&#x27;,&#x27;#1abc9c&#x27;,&#x27;#ff6ec7&#x27;];
  var score = 0, lives = 3;
  var spawnId = null, rafId = null;
  var running = false;
  var balls = [];
  var lastTime = 0;
  var board = document.getElementById(&#x27;board&#x27;);
  var water = document.getElementById(&#x27;water&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var hammer = document.getElementById(&#x27;hammer&#x27;);

  board.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = board.getBoundingClientRect();
    hammer.style.left = (e.clientX - rect.left - 12) + &#x27;px&#x27;;
    hammer.style.top = (e.clientY - rect.top - 12) + &#x27;px&#x27;;
  });

  function swingHammer() {
    hammer.classList.add(&#x27;swing&#x27;);
    setTimeout(function () { hammer.classList.remove(&#x27;swing&#x27;); }, 120);
  }

  function makeSplash(x) {
    var count = 8;
    for (var i = 0; i &lt; count; i++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;droplet&#x27;;
      d.style.left = x + &#x27;px&#x27;;
      d.style.top = WATER_TOP + &#x27;px&#x27;;
      board.appendChild(d);
      var vx = (Math.random() - 0.5) * 160;
      var vy = -(80 + Math.random() * 120);
      (function (drop, vX, vY) {
        var t0 = performance.now();
        function fly(t) {
          var dt = (t - t0) / 1000;
          var px = x + vX * dt;
          var py = WATER_TOP + vY * dt + 300 * dt * dt;
          drop.style.left = px + &#x27;px&#x27;;
          drop.style.top = py + &#x27;px&#x27;;
          drop.style.opacity = String(Math.max(0, 1 - dt * 1.4));
          if (dt &lt; 0.7) requestAnimationFrame(fly);
          else if (drop.parentNode === board) board.removeChild(drop);
        }
        requestAnimationFrame(fly);
      })(d, vx, vy);
    }
  }

  function clearAllBalls() {
    for (var i = 0; i &lt; balls.length; i++) {
      if (balls[i].el.parentNode === board) board.removeChild(balls[i].el);
    }
    balls = [];
  }

  function spawnBall() {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ball&#x27;;
    el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    var x = Math.random() * (BOARD_W - BALL_SIZE);
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = &#x27;-56px&#x27;;
    var ball = { el: el, x: x, y: -BALL_SIZE, speed: 80 + Math.random() * 90, hit: false };
    el.addEventListener(&#x27;mousedown&#x27;, function () {
      if (ball.hit) return;
      ball.hit = true;
      score += 1;
      scoreEl.textContent = score;
      swingHammer();
      el.style.transition = &#x27;transform 0.12s, opacity 0.12s&#x27;;
      el.style.transform = &#x27;scale(0.3)&#x27;;
      el.style.opacity = &#x27;0&#x27;;
      setTimeout(function () {
        if (el.parentNode === board) board.removeChild(el);
      }, 120);
      var idx = balls.indexOf(ball);
      if (idx !== -1) balls.splice(idx, 1);
    });
    board.appendChild(el);
    balls.push(ball);
  }

  function tick(now) {
    if (!running) return;
    var dt = (now - lastTime) / 1000;
    if (dt &gt; 0.1) dt = 0.1;
    lastTime = now;
    for (var i = balls.length - 1; i &gt;= 0; i--) {
      var b = balls[i];
      if (b.hit) continue;
      b.y += b.speed * dt;
      b.el.style.top = b.y + &#x27;px&#x27;;
      // Ball hits the water surface.
      if (b.y + BALL_SIZE &gt;= WATER_TOP) {
        makeSplash(b.x + BALL_SIZE / 2);
        if (b.el.parentNode === board) board.removeChild(b.el);
        balls.splice(i, 1);
        lives -= 1;
        livesEl.textContent = lives;
        if (lives &lt;= 0) { gameOver(); return; }
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function gameOver() {
    running = false;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    var msg = document.createElement(&#x27;div&#x27;);
    msg.id = &#x27;gameover&#x27;;
    msg.style.cssText = &#x27;position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:16px 24px;border-radius:10px;font-size:22px;z-index:50;&#x27;;
    msg.textContent = &#x27;Game Over — Score: &#x27; + score;
    board.appendChild(msg);
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; lives = 3;
    scoreEl.textContent = &#x27;0&#x27;;
    livesEl.textContent = &#x27;3&#x27;;
    clearAllBalls();
    var old = document.getElementById(&#x27;gameover&#x27;);
    if (old) board.removeChild(old);
    spawnBall();
    spawnId = setInterval(spawnBall, SPAWN_MS);
    lastTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    clearAllBalls();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
