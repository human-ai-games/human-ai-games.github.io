  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }

  .layout { display: flex; gap: 12px; align-items: flex-start; }
  .board { position: relative; width: 500px; height: 400px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; transition: background 0.3s; }
  .board.slow { background: #d6e6f5; }
  .mole { position: absolute; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 30px; user-select: none; }
  .good { background: #b98a4e; }
  .bad { background: #b98a4e; }
  .slowm { background: #2980b9; }
  .gold { background: #f1c40f; box-shadow: 0 0 14px 4px #f9e27b; }

  .overlay.hidden { display: none; }
  .overlay .big { font-size: 30px; font-weight: 700; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Whack-a-mole&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack brown moles (+1), blue slows time for 10s, gold gives +100 — but some brown ones are disguised bombs that wipe your score! You have 60 seconds; use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;status&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;timetag&quot;&gt;Time: &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/span&gt;
    &lt;span id=&quot;slowIndicator&quot; class=&quot;slowtag&quot; style=&quot;visibility:hidden;&quot;&gt;SLOW-MO: &lt;span id=&quot;slowTime&quot;&gt;0&lt;/span&gt;s&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
      &lt;div class=&quot;overlay hidden&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;big&quot;&gt;Time&#x27;s Up!&lt;/div&gt;
        &lt;div&gt;Final score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
        &lt;div style=&quot;font-size:14px;opacity:0.8;&quot;&gt;Press Start to play again&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;leaderboard&quot;&gt;
      &lt;h2&gt;🏆 Leaderboard&lt;/h2&gt;
      &lt;ol id=&quot;lbList&quot;&gt;&lt;/ol&gt;
      &lt;div class=&quot;empty&quot; id=&quot;lbEmpty&quot;&gt;No scores yet&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 500, BOARD_H = 400, MOLE_SIZE = 60;
  var BASE_SPAWN_MS = 750, BASE_LIFE_MS = 700;
  var SLOW_FACTOR = 2.2, SLOW_DURATION_MS = 10000;
  var BAD_CHANCE = 0.28, GOLD_CHANCE = 0.02, SLOW_CHANCE = 0.06;
  var GAME_SECONDS = 60;
  var score = 0;
  var spawnTimeout = null;
  var moleTimeouts = [];
  var running = false;
  var slowUntil = 0;
  var slowTickId = null;
  var timeLeft = GAME_SECONDS;
  var timerId = null;
  var leaderboard = [];
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var slowIndicator = document.getElementById(&#x27;slowIndicator&#x27;);
  var slowTimeEl = document.getElementById(&#x27;slowTime&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var lbList = document.getElementById(&#x27;lbList&#x27;);
  var lbEmpty = document.getElementById(&#x27;lbEmpty&#x27;);

  function isSlow() { return Date.now() &lt; slowUntil; }
  function factor() { return isSlow() ? SLOW_FACTOR : 1; }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var moles = board.querySelectorAll(&#x27;.mole&#x27;);
    for (var j = 0; j &lt; moles.length; j++) moles[j].remove();
  }

  function updateSlowUI() {
    if (isSlow()) {
      board.classList.add(&#x27;slow&#x27;);
      slowIndicator.style.visibility = &#x27;visible&#x27;;
      slowTimeEl.textContent = Math.ceil((slowUntil - Date.now()) / 1000);
    } else {
      board.classList.remove(&#x27;slow&#x27;);
      slowIndicator.style.visibility = &#x27;hidden&#x27;;
    }
  }

  function renderLeaderboard() {
    lbList.innerHTML = &#x27;&#x27;;
    if (leaderboard.length === 0) {
      lbEmpty.style.display = &#x27;block&#x27;;
      return;
    }
    lbEmpty.style.display = &#x27;none&#x27;;
    for (var i = 0; i &lt; leaderboard.length; i++) {
      var li = document.createElement(&#x27;li&#x27;);
      li.textContent = leaderboard[i];
      lbList.appendChild(li);
    }
  }

  function submitScore(s) {
    leaderboard.push(s);
    leaderboard.sort(function (a, b) { return b - a; });
    leaderboard = leaderboard.slice(0, 5);
    renderLeaderboard();
  }

  function pickType() {
    var r = Math.random();
    if (r &lt; GOLD_CHANCE) return &#x27;gold&#x27;;
    if (r &lt; GOLD_CHANCE + SLOW_CHANCE) return &#x27;slow&#x27;;
    if (r &lt; GOLD_CHANCE + SLOW_CHANCE + BAD_CHANCE) return &#x27;bad&#x27;;
    return &#x27;good&#x27;;
  }

  function spawnMole() {
    if (!running) return;
    var type = pickType();
    var mole = document.createElement(&#x27;div&#x27;);
    var cls, emoji;
    if (type === &#x27;gold&#x27;) { cls = &#x27;gold&#x27;; emoji = &#x27;⭐&#x27;; }
    else if (type === &#x27;slow&#x27;) { cls = &#x27;slowm&#x27;; emoji = &#x27;❄️&#x27;; }
    else if (type === &#x27;bad&#x27;) { cls = &#x27;bad&#x27;; emoji = &#x27;🐹&#x27;; }
    else { cls = &#x27;good&#x27;; emoji = &#x27;🐹&#x27;; }
    mole.className = &#x27;mole &#x27; + cls;
    mole.textContent = emoji;
    mole.style.left = Math.random() * (BOARD_W - MOLE_SIZE) + &#x27;px&#x27;;
    mole.style.top = Math.random() * (BOARD_H - MOLE_SIZE) + &#x27;px&#x27;;
    var hit = false;
    mole.addEventListener(&#x27;click&#x27;, function () {
      if (hit || !running) return;
      hit = true;
      if (type === &#x27;bad&#x27;) {
        score = 0; scoreEl.textContent = &#x27;0&#x27;; mole.textContent = &#x27;💥&#x27;; mole.style.background = &#x27;#c0392b&#x27;;
      } else if (type === &#x27;gold&#x27;) {
        score += 100; scoreEl.textContent = score; mole.style.background = &#x27;#3ba55c&#x27;;
      } else if (type === &#x27;slow&#x27;) {
        slowUntil = Date.now() + SLOW_DURATION_MS;
        updateSlowUI();
        mole.style.background = &#x27;#3ba55c&#x27;;
      } else {
        score += 1; scoreEl.textContent = score; mole.style.background = &#x27;#3ba55c&#x27;;
      }
      setTimeout(function () {
        if (mole.parentNode === board) board.removeChild(mole);
      }, 120);
    });
    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (mole.parentNode === board) board.removeChild(mole);
    }, BASE_LIFE_MS * factor()));
  }

  function scheduleSpawn() {
    if (!running) return;
    spawnMole();
    spawnTimeout = setTimeout(scheduleSpawn, BASE_SPAWN_MS * factor());
  }

  function tickTimer() {
    timeLeft -= 1;
    if (timeLeft &lt; 0) timeLeft = 0;
    timeEl.textContent = timeLeft;
    if (timeLeft &lt;= 0) endGame();
  }

  function endGame() {
    running = false;
    if (spawnTimeout) { clearTimeout(spawnTimeout); spawnTimeout = null; }
    if (slowTickId) { clearInterval(slowTickId); slowTickId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    clearAllMoles();
    slowUntil = 0;
    updateSlowUI();
    submitScore(score);
    finalScoreEl.textContent = score;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  function startGame() {
    running = true;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    timeLeft = GAME_SECONDS;
    timeEl.textContent = timeLeft;
    slowUntil = 0;
    updateSlowUI();
    overlay.classList.add(&#x27;hidden&#x27;);
    if (spawnTimeout) clearTimeout(spawnTimeout);
    if (timerId) clearInterval(timerId);
    if (slowTickId) clearInterval(slowTickId);
    clearAllMoles();
    scheduleSpawn();
    slowTickId = setInterval(updateSlowUI, 250);
    timerId = setInterval(tickTimer, 1000);
  }

  function stopGame() {
    running = false;
    if (spawnTimeout) { clearTimeout(spawnTimeout); spawnTimeout = null; }
    if (slowTickId) { clearInterval(slowTickId); slowTickId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    clearAllMoles();
  }

  renderLeaderboard();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;
