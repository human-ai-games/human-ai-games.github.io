<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shooter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Shooter</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .legend { font-size: 14px; color: #777; margin: 0; }
  .legend b { font-weight: 700; }
  .stats { display: flex; gap: 26px; align-items: baseline; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .combo { font-size: 22px; margin: 0; color: #c0392b; font-weight: 600; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .ship { position: absolute; width: 30px; height: 24px; background: #555; border-radius: 4px; bottom: 12px; }
  .bullet { position: absolute; width: 5px; height: 12px; background: #777; border-radius: 2px; }
  .target { position: absolute; width: 34px; height: 34px; border-radius: 50%; }
  .t-normal { background: #444; }
  .t-bonus { background: radial-gradient(circle at 35% 30%, #ffe27a, #f5a623); box-shadow: 0 0 8px #f5a623; }
  .t-penalty { background: radial-gradient(circle at 35% 30%, #ff8a80, #c0392b); box-shadow: 0 0 8px #c0392b; }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }
  .pop { position: absolute; font-size: 16px; font-weight: 700; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to shoot. Chain hits for a bigger combo multiplier — targets speed up as your score climbs!&lt;/p&gt;
  &lt;p class=&quot;legend&quot;&gt;&lt;b style=&quot;color:#444&quot;&gt;●&lt;/b&gt; normal &amp;nbsp; &lt;b style=&quot;color:#f5a623&quot;&gt;●&lt;/b&gt; bonus (3×) &amp;nbsp; &lt;b style=&quot;color:#c0392b&quot;&gt;●&lt;/b&gt; penalty — don&#x27;t shoot it!&lt;/p&gt;
  &lt;div class=&quot;stats&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot;&gt;Combo: x&lt;span id=&quot;combo&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 7;
  var TARGET_SIZE = 34;
  var SPAWN_INTERVAL = 1200;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], pops = [], particles = [];
  var score = 0;
  var combo = 1;
  var streak = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function speedFactor() { return 1 + Math.min(score / 25, 2.0); }

  function updateStats() {
    scoreEl.textContent = score;
    comboEl.textContent = combo;
  }

  function showPop(x, y, text, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;pop&#x27;;
    el.textContent = text;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    el.style.color = color;
    field.appendChild(el);
    pops.push({ el: el, y: y, life: 40 });
  }

  function burst(cx, cy, colors) {
    var n = 12;
    for (var i = 0; i &lt; n; i++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;particle&#x27;;
      el.style.background = colors[i % colors.length];
      el.style.left = cx + &#x27;px&#x27;;
      el.style.top = cy + &#x27;px&#x27;;
      field.appendChild(el);
      var ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      var spd = 2 + Math.random() * 3;
      particles.push({
        el: el, x: cx, y: cy,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        life: 30
      });
    }
  }

  function pickType() {
    var r = Math.random();
    if (r &lt; 0.15) return &#x27;bonus&#x27;;
    if (r &lt; 0.30) return &#x27;penalty&#x27;;
    return &#x27;normal&#x27;;
  }

  function spawnTarget() {
    var sf = speedFactor();
    var fallSpeed = (1.2 + Math.random() * 2.6) * sf;
    var driftSpeed = (Math.random() * 3 + 0.5) * sf;
    var dir = Math.random() &lt; 0.5 ? -1 : 1;
    var type = pickType();
    var t = {
      x: Math.random() * (FIELD_W - TARGET_SIZE),
      y: -TARGET_SIZE,
      vy: fallSpeed,
      vx: driftSpeed * dir,
      type: type,
      el: null
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target &#x27; + (type === &#x27;bonus&#x27; ? &#x27;t-bonus&#x27; : type === &#x27;penalty&#x27; ? &#x27;t-penalty&#x27; : &#x27;t-normal&#x27;);
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function comboForStreak(s) { return 1 + Math.floor(s / 3); }

  function hitTarget(t) {
    var cx = t.x + TARGET_SIZE / 2, cy = t.y + TARGET_SIZE / 2;
    if (t.type === &#x27;penalty&#x27;) {
      // Penalty target: breaks combo, small point loss.
      streak = 0;
      combo = 1;
      score = Math.max(0, score - 3);
      burst(cx, cy, [&#x27;#c0392b&#x27;, &#x27;#ff8a80&#x27;, &#x27;#e74c3c&#x27;]);
      showPop(t.x, t.y, &#x27;-3&#x27;, &#x27;#c0392b&#x27;);
      updateStats();
      return;
    }
    streak += 1;
    combo = comboForStreak(streak);
    var base = t.type === &#x27;bonus&#x27; ? 3 : 1;
    var gained = base * combo;
    score += gained;
    updateStats();
    if (t.type === &#x27;bonus&#x27;) {
      burst(cx, cy, [&#x27;#ffe27a&#x27;, &#x27;#f5a623&#x27;, &#x27;#fff&#x27;]);
      showPop(t.x, t.y, &#x27;+&#x27; + gained, &#x27;#f5a623&#x27;);
    } else {
      burst(cx, cy, [&#x27;#888&#x27;, &#x27;#bbb&#x27;, &#x27;#555&#x27;]);
      showPop(t.x, t.y, &#x27;+&#x27; + gained, &#x27;#c0392b&#x27;);
    }
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }

    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += t.vy;
      t.x += t.vx;
      if (t.x &lt;= 0) { t.x = 0; t.vx = -t.vx; }
      else if (t.x &gt;= FIELD_W - TARGET_SIZE) { t.x = FIELD_W - TARGET_SIZE; t.vx = -t.vx; }
      if (t.y &gt; FIELD_H) {
        field.removeChild(t.el);
        targets.splice(j, 1);
        // Missing a normal or bonus target breaks the combo. Penalties
        // escaping is fine (you WANT them to leave).
        if (t.type !== &#x27;penalty&#x27;) { streak = 0; combo = 1; updateStats(); }
        continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
      t.el.style.left = t.x + &#x27;px&#x27;;
    }

    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      var hit = false;
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(t2.el); targets.splice(j2, 1);
          hitTarget(t2);
          hit = true;
          break;
        }
      }
      if (hit) { field.removeChild(b2.el); bullets.splice(i2, 1); }
    }

    for (var p = pops.length - 1; p &gt;= 0; p--) {
      var po = pops[p];
      po.y -= 1; po.life -= 1;
      po.el.style.top = po.y + &#x27;px&#x27;;
      po.el.style.opacity = Math.max(0, po.life / 40);
      if (po.life &lt;= 0) { if (po.el.parentNode) po.el.parentNode.removeChild(po.el); pops.splice(p, 1); }
    }

    for (var q = particles.length - 1; q &gt;= 0; q--) {
      var pa = particles[q];
      pa.x += pa.vx; pa.y += pa.vy;
      pa.vy += 0.12;  // gravity
      pa.life -= 1;
      pa.el.style.left = pa.x + &#x27;px&#x27;;
      pa.el.style.top = pa.y + &#x27;px&#x27;;
      pa.el.style.opacity = Math.max(0, pa.life / 30);
      if (pa.life &lt;= 0) { if (pa.el.parentNode) pa.el.parentNode.removeChild(pa.el); particles.splice(q, 1); }
    }

    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    pops.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    particles.forEach(function (pa) { if (pa.el.parentNode) pa.el.parentNode.removeChild(pa.el); });
    bullets = []; targets = []; pops = []; particles = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; streak = 0; combo = 1;
    updateStats();
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
  updateStats();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM

(function () {

  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {

      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
