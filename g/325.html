  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #fff; overflow: hidden;
    background: radial-gradient(circle at 30% 10%, #2b2560, #1a1a3e 55%, #140f2e); }

  h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing:.5px; background: linear-gradient(90deg,#ff6ec4,#7873f5,#4ADEDE); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(120,115,245,.4)); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✨ Bubble Pop Chain ✨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click groups of 2+ touching same-color bubbles to pop them, and pop quickly to build a combo multiplier before time runs out. Grab 💣 bombs to blast an area and 🌈 rainbows to clear a whole color!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Level &lt;span id=&quot;accent&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Combo &lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Best &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;⏱ &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;barwrap&quot;&gt;&lt;div id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;480&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;msg&quot;&gt;Press Start below to play!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;💣 &lt;b&gt;Bomb&lt;/b&gt; blasts nearby&lt;/span&gt;&lt;span&gt;🌈 &lt;b&gt;Rainbow&lt;/b&gt; clears its color&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var COLS = 12, ROWS = 11, R = 20;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), accEl = document.getElementById(&#x27;accent&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;), barEl = document.getElementById(&#x27;bar&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);
  var PALETTES = [
    [&#x27;#ff6b6b&#x27;,&#x27;#4ADEDE&#x27;,&#x27;#ffd93d&#x27;,&#x27;#6bcB77&#x27;],
    [&#x27;#ff6b6b&#x27;,&#x27;#4ADEDE&#x27;,&#x27;#ffd93d&#x27;,&#x27;#6bcB77&#x27;,&#x27;#c780ff&#x27;],
    [&#x27;#ff6b6b&#x27;,&#x27;#4ADEDE&#x27;,&#x27;#ffd93d&#x27;,&#x27;#6bcB77&#x27;,&#x27;#c780ff&#x27;,&#x27;#ff9f43&#x27;]
  ];
  var COMBO_COLORS=[&#x27;#fff&#x27;,&#x27;#fff&#x27;,&#x27;#9be7ff&#x27;,&#x27;#ffd93d&#x27;,&#x27;#ff9f43&#x27;,&#x27;#ff6ec4&#x27;,&#x27;#ff6ec4&#x27;,&#x27;#ff4d9d&#x27;,&#x27;#ff4d9d&#x27;,&#x27;#ff2d7a&#x27;];
  var grid, particles = [], floaters = [], hover = null, hoverGroup = {};
  var running = false, animId = null;
  var score = 0, level = 1, target = 300, bestChain = 0, addTimer = 0;
  var combo = 1, comboTimer = 0;
  var timeLeft = 60, timeFrames = 0;
  var shake = 0, flashCol = null, flashT = 0, pulse = 0;

  function colors(){ return PALETTES[Math.min(PALETTES.length-1, Math.floor((level-1)/2))]; }
  function rndColor(){ var c = colors(); return c[Math.floor(Math.random()*c.length)]; }

  function makeCell(spawnY){
    var col = rndColor();
    var roll = Math.random();
    var special = null;
    // slightly more specials at higher levels to keep it exciting
    var bombChance = 0.028 + level*0.002;
    var rainChance = bombChance + 0.02;
    if (roll &lt; bombChance) special = &#x27;bomb&#x27;;
    else if (roll &lt; rainChance) special = &#x27;rainbow&#x27;;
    return { col: col, special: special, oy: (spawnY!==undefined?spawnY:0) };
  }

  function makeGrid(rows){
    grid = [];
    for (var c=0;c&lt;COLS;c++){ grid.push([]); for (var r=0;r&lt;ROWS;r++) grid[c].push(null); }
    for (var c2=0;c2&lt;COLS;c2++)
      for (var r2=ROWS-rows;r2&lt;ROWS;r2++){ grid[c2][r2] = makeCell(-(200+Math.random()*120)); }
  }

  function cx(c){ return 30 + c*R*2; }
  function cy(r){ return 30 + r*R*2; }

  function cellAt(mx,my){
    for (var c=0;c&lt;COLS;c++) for (var r=0;r&lt;ROWS;r++){
      if (!grid[c][r]) continue;
      var dx=mx-cx(c), dy=my-(cy(r)+grid[c][r].oy);
      if (dx*dx+dy*dy &lt;= R*R) return {c:c,r:r};
    }
    return null;
  }

  function group(c,r){
    var col = grid[c][r] &amp;&amp; grid[c][r].col; if (!col) return [];
    var seen = {}, stack=[[c,r]], res=[];
    while(stack.length){
      var p = stack.pop(), pc=p[0], pr=p[1], key=pc+&#x27;,&#x27;+pr;
      if (seen[key]) continue; if (pc&lt;0||pc&gt;=COLS||pr&lt;0||pr&gt;=ROWS) continue;
      if (!grid[pc][pr] || grid[pc][pr].col!==col) continue;
      seen[key]=1; res.push([pc,pr]);
      stack.push([pc+1,pr]);stack.push([pc-1,pr]);stack.push([pc,pr+1]);stack.push([pc,pr-1]);
    }
    return res;
  }

  function updateHoverGroup(){
    hoverGroup={};
    if(!hover||!grid[hover.c]||!grid[hover.c][hover.r]) return;
    var cell=grid[hover.c][hover.r];
    var g = cell.special ? [[hover.c,hover.r]] : group(hover.c,hover.r);
    if(g.length&lt;2 &amp;&amp; !cell.special) return;
    for(var i=0;i&lt;g.length;i++) hoverGroup[g[i][0]+&#x27;,&#x27;+g[i][1]]=1;
  }

  function collapse(){
    for (var c=0;c&lt;COLS;c++){
      var stack=[];
      for (var r=ROWS-1;r&gt;=0;r--) if (grid[c][r]) stack.push(grid[c][r]);
      for (var r2=ROWS-1;r2&gt;=0;r2--){
        var nc = stack[ROWS-1-r2] || null;
        if(nc){ // set drop offset relative to old visual position handled naturally
          grid[c][r2]=nc;
        } else grid[c][r2]=null;
      }
    }
    var newCols=[];
    for (var c2=0;c2&lt;COLS;c2++){
      var empty=true;
      for (var r3=0;r3&lt;ROWS;r3++) if(grid[c2][r3]){empty=false;break;}
      if(!empty) newCols.push(grid[c2]);
    }
    while(newCols.length&lt;COLS){ var e=[]; for(var k=0;k&lt;ROWS;k++)e.push(null); newCols.push(e); }
    grid=newCols;
  }

  function burst(c,r,col,n){
    n = n||6; var yo = grid[c]&amp;&amp;grid[c][r]?0:0;
    for (var i=0;i&lt;n;i++){
      var a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
      particles.push({x:cx(c),y:cy(r),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:col,sz:3+Math.random()*3});
    }
  }

  function popText(x,y,t,c,sz){ floaters.push({x:x,y:y,t:t,life:1,col:c||&#x27;#fff&#x27;,sz:sz||18}); }
  function flash(){ cv.style.boxShadow=&#x27;0 0 0 3px #ff4d4d inset, 0 10px 34px rgba(0,0,0,.5)&#x27;; setTimeout(function(){cv.style.boxShadow=&#x27;&#x27;;},120); }

  function collectCells(cells){
    var toClear = {}, queue = cells.slice();
    function key(c,r){return c+&#x27;,&#x27;+r;}
    for (var i=0;i&lt;cells.length;i++) toClear[key(cells[i][0],cells[i][1])]=cells[i];
    while(queue.length){
      var cell=queue.shift(), c=cell[0], r=cell[1];
      var g=grid[c][r]; if(!g) continue;
      if (g.special===&#x27;bomb&#x27;){
        for (var dc=-1;dc&lt;=1;dc++) for (var dr=-1;dr&lt;=1;dr++){
          var nc=c+dc, nr=r+dr;
          if(nc&lt;0||nc&gt;=COLS||nr&lt;0||nr&gt;=ROWS) continue;
          if(grid[nc][nr] &amp;&amp; !toClear[key(nc,nr)]){ toClear[key(nc,nr)]=[nc,nr]; queue.push([nc,nr]); }
        }
      } else if (g.special===&#x27;rainbow&#x27;){
        var tc = g.col;
        for (var cc=0;cc&lt;COLS;cc++) for (var rr=0;rr&lt;ROWS;rr++){
          if(grid[cc][rr] &amp;&amp; grid[cc][rr].col===tc &amp;&amp; !toClear[key(cc,rr)]){ toClear[key(cc,rr)]=[cc,rr]; queue.push([cc,rr]); }
        }
      }
    }
    var out=[]; for (var k in toClear) out.push(toClear[k]);
    return out;
  }

  function pop(mx,my){
    if(!running) return;
    var hit = cellAt(mx,my); if(!hit) return;
    var cell = grid[hit.c][hit.r]; if(!cell) return;
    var g;
    if (cell.special){ g = [[hit.c,hit.r]]; }
    else { g = group(hit.c,hit.r); if (g.length&lt;2){ flash(); combo=1; comboEl.textContent=&#x27;x1&#x27;; return; } }
    var all = collectCells(g);
    if (all.length&lt;2 &amp;&amp; !cell.special){ flash(); return; }
    combo = Math.min(9, combo+1); comboTimer = 100; comboEl.textContent=&#x27;x&#x27;+combo;
    var hasSpecial=false;
    for (var i=0;i&lt;all.length;i++){
      var ac=all[i][0], ar=all[i][1], gc=grid[ac][ar];
      if(gc){ if(gc.special)hasSpecial=true; burst(ac,ar,gc.col, gc.special?14:5); grid[ac][ar]=null; }
    }
    var base = all.length*all.length*5;
    var gained = Math.round(base*combo);
    score += gained;
    if (all.length&gt;bestChain){ bestChain=all.length; bestEl.textContent=bestChain; }
    scoreEl.textContent = score;
    popText(mx,my,&#x27;+&#x27;+gained, combo&gt;1?COMBO_COLORS[combo]:&#x27;#fff&#x27;, 18+combo);
    if (combo&gt;=3) popText(mx,my-26,&#x27;COMBO x&#x27;+combo+&#x27;!&#x27;,COMBO_COLORS[combo],16+combo);
    shake = Math.min(16, 4 + all.length*0.5 + (hasSpecial?6:0));
    pulse = 1;
    beep(400+all.length*30+combo*45, 0.08);
    if(hasSpecial){ beep(900,0.15); flashCol=&#x27;rgba(255,255,255,0.25)&#x27;; flashT=8; }
    collapse();
    updateHoverGroup();
    barEl.style.width = Math.min(100, score/target*100)+&#x27;%&#x27;;
    if (score&gt;=target) levelUp();
  }

  function levelUp(){
    level++; accEl.textContent=level;
    target = Math.round(target*1.55);
    var bonus = level&lt;=3?22:16;
    timeLeft += bonus; timeEl.textContent = timeLeft;
    barEl.style.width=&#x27;0%&#x27;;
    makeGrid(Math.min(ROWS, 4+level));
    beep(660,0.12); setTimeout(function(){beep(880,0.12);},110); setTimeout(function(){beep(1200,0.16);},220);
    flashCol=&#x27;rgba(120,115,245,0.35)&#x27;; flashT=16;
    showMsg(&#x27;LEVEL &#x27;+level+&#x27;! &#x27;,&#x27;+&#x27;+bonus+&#x27; seconds · Next target &#x27;+target);
    setTimeout(function(){ if(running) hideMsg(); },1000);
  }

  function addRow(){
    for (var c2=0;c2&lt;COLS;c2++){
      for (var r2=0;r2&lt;ROWS-1;r2++) grid[c2][r2]=grid[c2][r2+1];
      grid[c2][ROWS-1]=makeCell(-40);
    }
  }
  function topFilled(){ for (var c=0;c&lt;COLS;c++) if(grid[c][0]) return true; return false; }
  function boardDanger(){ var d=0; for(var c=0;c&lt;COLS;c++) if(grid[c][1]) d++; return d/COLS; }

  function gameOver(reason){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    showMsg(reason,&#x27;Final score &#x27;+score+&#x27; · Reached level &#x27;+level+&#x27;&lt;br&gt;Best chain &#x27;+bestChain+&#x27; · Press Start to retry&#x27;);
    beep(200,0.3); setTimeout(function(){beep(150,0.35);},180);
  }

  function showMsg(a,b){ msgEl.innerHTML = a + (b?&#x27;&lt;small&gt;&#x27;+b+&#x27;&lt;/small&gt;&#x27;:&#x27;&#x27;); msgEl.style.display=&#x27;flex&#x27;; }
  function hideMsg(){ msgEl.style.display=&#x27;none&#x27;; }

  function draw(){
    var ox=0, oy=0;
    if(shake&gt;0){ ox=(Math.random()-0.5)*shake; oy=(Math.random()-0.5)*shake; }
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save(); ctx.translate(ox,oy);
    var danger = boardDanger();
    if(danger&gt;0.35){
      var a=0.06+danger*0.14*(0.6+0.4*Math.sin(Date.now()/140));
      ctx.fillStyle=&#x27;rgba(255,60,60,&#x27;+a+&#x27;)&#x27;; ctx.fillRect(-20,-20,cv.width+40,70);
    }
    var t=Date.now();
    for (var c=0;c&lt;COLS;c++) for (var r=0;r&lt;ROWS;r++){
      var cell=grid[c][r]; if(!cell) continue;
      // animate drop offset toward 0
      if(cell.oy&lt;0){ cell.oy += (0-cell.oy)*0.22; if(cell.oy&gt;-0.5) cell.oy=0; }
      var col=cell.col, x=cx(c), y=cy(r)+cell.oy;
      var inHover = hoverGroup[c+&#x27;,&#x27;+r];
      var rr2 = R-2;
      if(inHover){ rr2 = R-2 + Math.sin(t/120)*1.5; }
      ctx.beginPath(); ctx.arc(x,y,rr2,0,Math.PI*2);
      if(cell.special===&#x27;rainbow&#x27;){
        var rg=ctx.createLinearGradient(x-R,y-R,x+R,y+R);
        rg.addColorStop(0,&#x27;#ff6b6b&#x27;);rg.addColorStop(0.3,&#x27;#ffd93d&#x27;);rg.addColorStop(0.6,&#x27;#6bcB77&#x27;);rg.addColorStop(1,&#x27;#c780ff&#x27;);
        ctx.fillStyle=rg;
      } else {
        var grad=ctx.createRadialGradient(x-6,y-6,2,x,y,R);
        grad.addColorStop(0,&#x27;#ffffff&#x27;); grad.addColorStop(0.25,col); grad.addColorStop(1,shade(col,-35));
        ctx.fillStyle=grad;
      }
      ctx.fill();
      if(inHover){ ctx.lineWidth=2.5; ctx.strokeStyle=&#x27;rgba(255,255,255,0.9)&#x27;; ctx.stroke(); }
      if(cell.special===&#x27;bomb&#x27;){
        ctx.font=&#x27;16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;; ctx.fillText(&#x27;💣&#x27;,x,y+1);
      } else if(cell.special===&#x27;rainbow&#x27;){
        ctx.font=&#x27;16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;; ctx.fillText(&#x27;🌈&#x27;,x,y+1);
      } else {
        ctx.beginPath(); ctx.arc(x-6,y-7,4,0,Math.PI*2); ctx.fillStyle=&#x27;rgba(255,255,255,.6)&#x27;; ctx.fill();
      }
    }
    ctx.textBaseline=&#x27;alphabetic&#x27;;
    for (var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i]; ctx.globalAlpha=Math.max(0,p.life);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life+1,0,Math.PI*2); ctx.fillStyle=p.col; ctx.fill();
      ctx.globalAlpha=1;
    }
    for (var f=floaters.length-1;f&gt;=0;f--){
      var fl=floaters[f]; ctx.globalAlpha=Math.max(0,fl.life); ctx.fillStyle=fl.col;
      ctx.font=&#x27;bold &#x27;+fl.sz+&#x27;px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(fl.t, fl.x, fl.y); ctx.globalAlpha=1;
    }
    ctx.restore();
    if(flashT&gt;0){ ctx.fillStyle=flashCol; ctx.fillRect(0,0,cv.width,cv.height); }
  }

  function shade(hex,amt){
    var n=parseInt(hex.slice(1),16), r=(n&gt;&gt;16)+amt, g=((n&gt;&gt;8)&amp;255)+amt, b=(n&amp;255)+amt;
    r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function loop(){
    for (var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.03;
      if(p.life&lt;=0) particles.splice(i,1);
    }
    for (var f=floaters.length-1;f&gt;=0;f--){ floaters[f].y-=0.8; floaters[f].life-=0.02; if(floaters[f].life&lt;=0)floaters.splice(f,1); }
    if(shake&gt;0){ shake*=0.85; if(shake&lt;0.4) shake=0; }
    if(flashT&gt;0) flashT--;
    if(pulse&gt;0) pulse*=0.9;
    if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0 &amp;&amp; combo&gt;1){ combo=1; comboEl.textContent=&#x27;x1&#x27;; } }
    timeFrames++;
    if(timeFrames&gt;=60){ timeFrames=0; timeLeft--; timeEl.textContent=timeLeft;
      if(timeLeft&lt;=10){ timeEl.parentElement.style.background = timeLeft%2?&#x27;rgba(255,60,60,0.45)&#x27;:&#x27;rgba(255,255,255,0.08)&#x27;; }
      else { timeEl.parentElement.style.background=&#x27;rgba(255,255,255,0.08)&#x27;; }
      if(timeLeft&lt;=0){ draw(); gameOver(&quot;Time&#x27;s up!&quot;); return; }
    }
    addTimer++;
    var interval = Math.max(165, 500 - level*26);
    if (addTimer&gt;=interval){ addTimer=0; addRow(); if(topFilled()){ draw(); gameOver(&#x27;Board full!&#x27;); return; } }
    draw();
    if(running) animId=requestAnimationFrame(loop);
  }

  var actx=null;
  function beep(freq,dur){
