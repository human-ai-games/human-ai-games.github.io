<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alien Road Trip</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Alien Road Trip</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; background: #3a3a42; border-radius: 8px; overflow: hidden; }
  .hero, .obstacle { position: absolute; }
  .lane-divider { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed #ffd54a; opacity: 0.5; }
  .safe-top, .safe-bottom { position: absolute; left: 0; right: 0; background: #55603a; }
  #boltLayer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Alien Road Trip&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to hop your little alien across the road, dodging the cars. A faster, higher alarm means a car is dangerously close — reach the top to score.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var DANGER_DIST = CELL * 1.6;
  var ALARM_DIST = CELL * 2.2;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null, boltLayer = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var audioCtx = null, lastZap = 0, lastBeep = 0;

  var CAR_COLORS = [&#x27;#e74c3c&#x27;, &#x27;#3498db&#x27;, &#x27;#f1c40f&#x27;, &#x27;#2ecc71&#x27;, &#x27;#e67e22&#x27;, &#x27;#9b59b6&#x27;, &#x27;#1ab4c4&#x27;];

  function carSVG(color, dir) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(-100,0)&quot;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg width=&quot;&#x27; + OBSTACLE_W + &#x27;&quot; height=&quot;&#x27; + OBSTACLE_H + &#x27;&quot; viewBox=&quot;0 0 100 44&quot;&gt;&#x27; +
      &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;14&quot; width=&quot;92&quot; height=&quot;24&quot; rx=&quot;8&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M24 14 L36 3 L66 3 L80 14 Z&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;38&quot; y=&quot;6&quot; width=&quot;24&quot; height=&quot;9&quot; rx=&quot;2&quot; fill=&quot;#bfe9ff&quot; opacity=&quot;0.85&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;39&quot; r=&quot;7&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;26&quot; cy=&quot;39&quot; r=&quot;3&quot; fill=&quot;#777&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;74&quot; cy=&quot;39&quot; r=&quot;7&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;74&quot; cy=&quot;39&quot; r=&quot;3&quot; fill=&quot;#777&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;92&quot; cy=&quot;22&quot; r=&quot;3&quot; fill=&quot;#fff6a8&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }

  function alienSVG() {
    return &#x27;&lt;svg width=&quot;&#x27; + HERO_SIZE + &#x27;&quot; height=&quot;&#x27; + HERO_SIZE + &#x27;&quot; viewBox=&quot;0 0 40 40&quot;&gt;&#x27; +
      &#x27;&lt;line x1=&quot;14&quot; y1=&quot;6&quot; x2=&quot;11&quot; y2=&quot;0&quot; stroke=&quot;#4a9d6a&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;26&quot; y1=&quot;6&quot; x2=&quot;29&quot; y2=&quot;0&quot; stroke=&quot;#4a9d6a&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;11&quot; cy=&quot;1&quot; r=&quot;2&quot; fill=&quot;#c6ff8a&quot;/&gt;&lt;circle cx=&quot;29&quot; cy=&quot;1&quot; r=&quot;2&quot; fill=&quot;#c6ff8a&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;18&quot; rx=&quot;13&quot; ry=&quot;15&quot; fill=&quot;#6ecb8a&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;14&quot; cy=&quot;17&quot; rx=&quot;4&quot; ry=&quot;6&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;26&quot; cy=&quot;17&quot; rx=&quot;4&quot; ry=&quot;6&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;15&quot; cy=&quot;15&quot; r=&quot;1.4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;27&quot; cy=&quot;15&quot; r=&quot;1.4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M15 27 Q20 31 25 27&quot; stroke=&quot;#2c5b3a&quot; stroke-width=&quot;1.6&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;9&quot; cy=&quot;34&quot; rx=&quot;5&quot; ry=&quot;4&quot; fill=&quot;#4a9d6a&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;31&quot; cy=&quot;34&quot; rx=&quot;5&quot; ry=&quot;4&quot; fill=&quot;#4a9d6a&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.5 + (i % 3) * 0.2;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var color = CAR_COLORS[i % CAR_COLORS.length];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.innerHTML = carSVG(color, dir);
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function drawScenery() {
    var top = document.createElement(&#x27;div&#x27;);
    top.className = &#x27;safe-top&#x27;;
    top.style.top = &#x27;0px&#x27;;
    top.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(top);
    var bottom = document.createElement(&#x27;div&#x27;);
    bottom.className = &#x27;safe-bottom&#x27;;
    bottom.style.top = ((ROWS - 1) * CELL) + &#x27;px&#x27;;
    bottom.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(bottom);
    for (var r = 2; r &lt; ROWS - 1; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane-divider&#x27;;
      d.style.top = (r * CELL) + &#x27;px&#x27;;
      field.appendChild(d);
    }
    boltLayer = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;svg&#x27;);
    boltLayer.setAttribute(&#x27;id&#x27;, &#x27;boltLayer&#x27;);
    boltLayer.setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + FIELD_W + &#x27; &#x27; + FIELD_H);
    field.appendChild(boltLayer);
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = alienSVG();
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function lightningPath(x1, y1, x2, y2) {
    var segs = 6;
    var d = &#x27;M &#x27; + x1 + &#x27; &#x27; + y1;
    for (var s = 1; s &lt; segs; s++) {
      var t = s / segs;
      var bx = x1 + (x2 - x1) * t;
      var by = y1 + (y2 - y1) * t;
      var jitter = 9;
      bx += (Math.random() - 0.5) * jitter;
      by += (Math.random() - 0.5) * jitter;
      d += &#x27; L &#x27; + bx.toFixed(1) + &#x27; &#x27; + by.toFixed(1);
    }
    d += &#x27; L &#x27; + x2 + &#x27; &#x27; + y2;
    return d;
  }

  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (_) {}
  }

  function zapSound() {
    try {
      ensureAudio();
      if (!audioCtx) return;
      var now = audioCtx.currentTime;
      if (now - lastZap &lt; 0.12) return;
      lastZap = now;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = &#x27;sawtooth&#x27;;
      o.frequency.setValueAtTime(900, now);
      o.frequency.exponentialRampToValueAtTime(200, now + 0.08);
      g.gain.setValueAtTime(0.05, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.1);
    } catch (_) {}
  }

  // proximity 0 (edge of alarm range) -&gt; 1 (right on top of alien).
  function alarmBeep(proximity) {
    try {
      ensureAudio();
      if (!audioCtx) return;
      var now = audioCtx.currentTime;
      // Closer = faster beeps and higher pitch.
      var interval = 0.45 - proximity * 0.36; // 0.45s far -&gt; 0.09s close
      if (now - lastBeep &lt; interval) return;
      lastBeep = now;
      var freq = 520 + proximity * 640; // 520Hz far -&gt; 1160Hz close
      var vol = 0.04 + proximity * 0.08;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = &#x27;square&#x27;;
      o.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(vol, now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 0.08);
    } catch (_) {}
  }

  function drawBolts(bolts) {
    if (!boltLayer) return;
    var svg = &#x27;&#x27;;
    for (var i = 0; i &lt; bolts.length; i++) {
      var b = bolts[i];
      var path = lightningPath(b.x1, b.y1, b.x2, b.y2);
      svg += &#x27;&lt;path d=&quot;&#x27; + path + &#x27;&quot; stroke=&quot;#bfe9ff&quot; stroke-width=&quot;3.5&quot; fill=&quot;none&quot; &#x27; +
             &#x27;stroke-linejoin=&quot;round&quot; opacity=&quot;0.9&quot;/&gt;&#x27;;
      svg += &#x27;&lt;path d=&quot;&#x27; + path + &#x27;&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;1.4&quot; fill=&quot;none&quot; &#x27; +
             &#x27;stroke-linejoin=&quot;round&quot;/&gt;&#x27;;
    }
    boltLayer.innerHTML = svg;
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    var hcx = hx + HERO_SIZE / 2, hcy = hy + HERO_SIZE / 2;

    var bolts = [];
    var anyClose = false;
    var nearestDist = Infinity;
    for (var li = 0; li &lt; lanes.length; li++) {
      var lane2 = lanes[li];
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        var ex = Math.max(o2.x, Math.min(hcx, o2.x + OBSTACLE_W));
        var ey = Math.max(lane2.y, Math.min(hcy, lane2.y + OBSTACLE_H));
        var dx = ex - hcx, dy = ey - hcy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist &lt; nearestDist) nearestDist = dist;
        if (dist &lt; DANGER_DIST) {
          anyClose = true;
          bolts.push({ x1: hcx, y1: hcy, x2: ex, y2: ey });
        }
      }
    }
    drawBolts(bolts);
    if (anyClose) zapSound();
    if (nearestDist &lt; ALARM_DIST) {
      var proximity = 1 - (nearestDist / ALARM_DIST);
      if (proximity &lt; 0) proximity = 0;
      if (proximity &gt; 1) proximity = 1;
      alarmBeep(proximity);
    }

    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var lane3 = lanes[laneIdx];
      for (var m = 0; m &lt; lane3.obstacles.length; m++) {
        var o3 = lane3.obstacles[m];
        if (hx &lt; o3.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o3.x &amp;&amp;
            hy &lt; lane3.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane3.y) {
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    hero.col = nc;
    hero.row = nr;
    paintHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (boltLayer) boltLayer.innerHTML = &#x27;&#x27;;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) { try { audioCtx.resume(); } catch (_) {} }
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    drawScenery();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (boltLayer) boltLayer.innerHTML = &#x27;&#x27;;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  drawScenery();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
