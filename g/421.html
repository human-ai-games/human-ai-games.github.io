<!doctype html>
<html lang="en">

<title>Forest Crossing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Forest Crossing</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; background: #dff0d8; border-radius: 8px; overflow: hidden; }
  .hero { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; z-index: 3; }
  .obstacle { position: absolute; display: flex; align-items: center; justify-content: center; line-height: 1; z-index: 2; }
  .lane { position: absolute; left: 0; right: 0; overflow: hidden; }
  .lane-road { background: #1a1a1a; }
  .lane-grass { background: #2e8b57; }
  .safe-bottom { background: #f6e7b8; }
  .safe-top { background: #14532d; }
  .banner {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%);
    width: 100%; text-align: center; z-index: 10; pointer-events: none;
    font-size: 46px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 0 #14532d, 0 0 14px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  .banner-anim { animation: sweep 1.6s ease-in-out forwards; }
  @keyframes sweep {
    0%   { transform: translate(-110%, -50%); opacity: 0; }
    20%  { transform: translate(0, -50%);      opacity: 1; }
    80%  { transform: translate(0, -50%);      opacity: 1; }
    100% { transform: translate(110%, -50%);   opacity: 0; }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Forest Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Guide your hedgehog to the leafy top row with the arrow keys, one step at a time, dodging the vehicles on black roads and animals on green lanes. Each crossing scores a point and speeds things up — a collision ends the round, so use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 6;
  var OBSTACLE_H = CELL - 8;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var speedMult = 1;   // grows each point scored
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var bannerEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // ---- Sound ----
  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    return audioCtx;
  }
  function playHop() {
    var ctx = getCtx();
    if (!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = &#x27;sine&#x27;;
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.18);
  }
  function playScreech() {
    var ctx = getCtx();
    if (!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = &#x27;sawtooth&#x27;;
    o.frequency.setValueAtTime(900, t);
    o.frequency.linearRampToValueAtTime(300, t + 0.5);
    var lfo = ctx.createOscillator();
    var lfoG = ctx.createGain();
    lfo.type = &#x27;square&#x27;;
    lfo.frequency.setValueAtTime(30, t);
    lfoG.gain.setValueAtTime(120, t);
    lfo.connect(lfoG); lfoG.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
    g.gain.setValueAtTime(0.3, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + 0.6);
    lfo.start(t); lfo.stop(t + 0.6);
    var noise = ctx.createBufferSource();
    var buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i &lt; data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    noise.buffer = buf;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.2, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    noise.connect(ng); ng.connect(ctx.destination);
    noise.start(t);
  }
  function playCheer() {
    var ctx = getCtx();
    if (!ctx) return;
    var t = ctx.currentTime;
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i &lt; notes.length; i++) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = &#x27;triangle&#x27;;
      var st = t + i * 0.09;
      o.frequency.setValueAtTime(notes[i], st);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.25, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(st); o.stop(st + 0.25);
    }
  }

  var VEHICLES = [
    { icon: &#x27;🚗&#x27;, w: 1 }, { icon: &#x27;🚙&#x27;, w: 1 }, { icon: &#x27;🚕&#x27;, w: 1 },
    { icon: &#x27;🚚&#x27;, w: 2 }, { icon: &#x27;🚛&#x27;, w: 2 }, { icon: &#x27;🚌&#x27;, w: 2 }
  ];
  var ANIMALS = [
    { icon: &#x27;🦌&#x27;, w: 1 }, { icon: &#x27;🐗&#x27;, w: 1 }, { icon: &#x27;🦊&#x27;, w: 1 },
    { icon: &#x27;🐻&#x27;, w: 1 }, { icon: &#x27;🐺&#x27;, w: 1 }, { icon: &#x27;🦉&#x27;, w: 1 }
  ];

  function drawLaneBackgrounds() {
    for (var r = 0; r &lt; ROWS; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      var cls = &#x27;lane &#x27;;
      if (r === 0) cls += &#x27;safe-top&#x27;;
      else if (r === ROWS - 1) cls += &#x27;safe-bottom&#x27;;
      else cls += (r % 2 === 1 ? &#x27;lane-road&#x27; : &#x27;lane-grass&#x27;);
      d.className = cls;
      d.style.top = (r * CELL) + &#x27;px&#x27;;
      d.style.height = CELL + &#x27;px&#x27;;
      if (r === 0) {
        var deco = [&#x27;🌲&#x27;, &#x27;🌳&#x27;, &#x27;🍄&#x27;, &#x27;🌲&#x27;, &#x27;🌿&#x27;, &#x27;🌳&#x27;, &#x27;🍃&#x27;, &#x27;🌲&#x27;, &#x27;🌳&#x27;, &#x27;🌿&#x27;, &#x27;🍄&#x27;, &#x27;🌳&#x27;];
        for (var c = 0; c &lt; COLS; c++) {
          var s = document.createElement(&#x27;span&#x27;);
          s.textContent = deco[c % deco.length];
          s.style.position = &#x27;absolute&#x27;;
          s.style.left = (c * CELL + 8) + &#x27;px&#x27;;
          s.style.top = &#x27;6px&#x27;;
          s.style.fontSize = (CELL - 16) + &#x27;px&#x27;;
          s.style.lineHeight = &#x27;1&#x27;;
          d.appendChild(s);
        }
      }
      field.appendChild(d);
    }
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var isRoad = (laneRow % 2 === 1);
      var set = isRoad ? VEHICLES : ANIMALS;
      var pick = set[i % set.length];
      var y = laneRow * CELL;
      var dir = (i % 2 === 0) ? 1 : -1;
      var baseSpeed = 0.5 + (i % 3) * 0.25 + (isRoad ? 0.3 : 0);
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var w = pick.w * CELL - 4;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = w + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.fontSize = (OBSTACLE_H - 6) + &#x27;px&#x27;;
        el.style.top = (y + 4) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.textContent = pick.icon;
        if (dir &gt; 0) el.style.transform = &#x27;scaleX(-1)&#x27;;
        field.appendChild(el);
        obstacles.push({ x: x, w: w, el: el });
      }
      lanes.push({ y: y, dir: dir, baseSpeed: baseSpeed, obstacles: obstacles, isRoad: isRoad });
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.textContent = &#x27;🦔&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function showBanner() {
    if (bannerEl &amp;&amp; bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = document.createElement(&#x27;div&#x27;);
    bannerEl.className = &#x27;banner banner-anim&#x27;;
    bannerEl.textContent = &#x27;You made it! 🎉&#x27;;
    field.appendChild(bannerEl);
    var toRemove = bannerEl;
    setTimeout(function () {
      if (toRemove &amp;&amp; toRemove.parentNode) toRemove.parentNode.removeChild(toRemove);
    }, 1700);
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      var spd = lane.baseSpeed * speedMult;
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * spd;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -o.w;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var lane2 = lanes[laneIdx];
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        if (hx &lt; o2.x + o2.w - 6 &amp;&amp; hx + HERO_SIZE - 6 &gt; o2.x &amp;&amp;
            hy &lt; lane2.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane2.y) {
          endGame(lane2.isRoad);
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var pc = hero.col, pr = hero.row;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    if (hero.col !== pc || hero.row !== pr) playHop();
    paintHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      speedMult *= 1.12;   // speed everything up a little each point
      showBanner();
      playCheer();
      resetHero();
    }
  }

  function endGame(hitByVehicle) {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (heroEl) heroEl.textContent = &#x27;💥&#x27;;
    playScreech();
  }

  function startGame() {
    if (running) return;
    var ctx = getCtx();
    if (ctx &amp;&amp; ctx.state === &#x27;suspended&#x27;) ctx.resume();
    score = 0;
    speedMult = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    bannerEl = null;
    drawLaneBackgrounds();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the field before pressing Start.
  drawLaneBackgrounds();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}

  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,

        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {

  if (document.readyState === &#x27;complete&#x27;) {

  }

    <button id="stop" disabled>Stop</button>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
