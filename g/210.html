<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }

    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Critter Blocks 🐾</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }
  .score { font-size: 20px; color: #555; margin: 0; }
  .field { position: relative; width: 364px; height: 546px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 2px #ddd; }
  .block { position: absolute; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.15); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: none; }
  .bomb { background: #37474f !important; color:#fff; }
  .pred { position:absolute; display:flex; align-items:center; justify-content:center; font-size:20px; pointer-events:none; }
  .boom { position:absolute; display:flex; align-items:center; justify-content:center; font-size:20px; background:#fff59d; border-radius:5px; box-shadow:0 0 8px 3px #ffb300; }
  .over { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); color:#fff; font-size:28px; font-weight:700; border-radius:8px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Critter Blocks 🐾&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&amp;rarr;&lt;/strong&gt;, rotate &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, soft drop &lt;strong&gt;&amp;darr;&lt;/strong&gt;, and &lt;strong&gt;Space&lt;/strong&gt; to slam down. Fill a whole line to make it explode; dodge the bombs 💣 and the predators 🦅 that chase your critters!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 26;
  var COLS = 14, ROWS = 21;
  var DROP_MS = 500;
  var running = false, dropId = null, predId = null, bombTimer = null;
  var grid = [];
  var piece = null;
  var bomb = null;          // {x, y}
  var predators = [];       // {col, y, face}
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);

  var PREY = [&#x27;🐭&#x27;,&#x27;🐰&#x27;,&#x27;🐹&#x27;,&#x27;🐸&#x27;,&#x27;🐤&#x27;,&#x27;🐢&#x27;,&#x27;🐑&#x27;,&#x27;🦌&#x27;,&#x27;🐟&#x27;,&#x27;🐛&#x27;];
  var PREDATORS = [&#x27;🦅&#x27;,&#x27;🦊&#x27;,&#x27;🐺&#x27;,&#x27;🦁&#x27;,&#x27;🐍&#x27;,&#x27;🦈&#x27;,&#x27;🐆&#x27;,&#x27;🦉&#x27;];

  var SHAPES = {
    I: { color:&#x27;#4dd0e1&#x27;, rot:[ [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]] ] },
    O: { color:&#x27;#ffd54f&#x27;, rot:[ [[1,0],[2,0],[1,1],[2,1]] ] },
    T: { color:&#x27;#ba68c8&#x27;, rot:[ [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },
    S: { color:&#x27;#81c784&#x27;, rot:[ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]] ] },
    Z: { color:&#x27;#e57373&#x27;, rot:[ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]] ] },
    J: { color:&#x27;#7986cb&#x27;, rot:[ [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] },
    L: { color:&#x27;#ffb74d&#x27;, rot:[ [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] }
  };
  var KEYS = Object.keys(SHAPES);

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for (var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function pieceCells(p) {
    var offs = SHAPES[p.type].rot[p.rot];
    var out=[];
    for (var i=0;i&lt;offs.length;i++) out.push({ x:p.x+offs[i][0], y:p.y+offs[i][1] });
    return out;
  }
  function collides(p) {
    var cells=pieceCells(p);
    for (var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }
  function spawnPiece() {
    var type=KEYS[Math.floor(Math.random()*KEYS.length)];
    piece={ type:type, rot:0, x:Math.floor((COLS-4)/2), y:-1,
            color:SHAPES[type].color,
            face:PREY[Math.floor(Math.random()*PREY.length)] };
    if (collides(piece)) return false;
    return true;
  }
  function lockPiece() {
    var cells=pieceCells(piece);
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]={ color:piece.color, face:piece.face };
    }
    piece=null;
  }

  function clearFullRows() {
    var fullRows=[];
    for (var r=0;r&lt;ROWS;r++){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if (!grid[r][c]) { full=false; break; }
      if (full) fullRows.push(r);
    }
    if (fullRows.length===0) return;
    // explosion flash then remove
    explodeRows(fullRows);
    for (var k=fullRows.length-1;k&gt;=0;k--){
      grid.splice(fullRows[k],1);
      var empty=[]; for (var c2=0;c2&lt;COLS;c2++) empty.push(null);
      grid.unshift(empty);
    }
    score+=fullRows.length*10; scoreEl.textContent=score;
    playBoom(fullRows.length);
  }

  function explodeRows(rows) {
    for (var i=0;i&lt;rows.length;i++){
      var r=rows[i];
      for (var c=0;c&lt;COLS;c++){
        var b=document.createElement(&#x27;div&#x27;);
        b.className=&#x27;boom&#x27;;
        b.style.left=(c*CELL)+&#x27;px&#x27;; b.style.top=(r*CELL)+&#x27;px&#x27;;
        b.style.width=CELL+&#x27;px&#x27;; b.style.height=CELL+&#x27;px&#x27;;
        b.textContent=&#x27;💥&#x27;;
        field.appendChild(b);
        (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },260); })(b);
      }
    }
  }

  /* ---- Bombs ---- */
  function spawnBomb() {
    if (bomb) return;
    bomb={ x:Math.floor(Math.random()*COLS), y:-1 };
  }
  function bombLandY(x) {
    for (var y=0;y&lt;ROWS;y++){ if (grid[y][x]) return y-1; }
    return ROWS-1;
  }
  function stepBomb() {
    if (!bomb) return;
    var ny=bomb.y+1;
    var landY=bombLandY(bomb.x);
    if (ny&gt;=landY &amp;&amp; ny&gt;=0) {
      // detonate this column: clear the whole column
      for (var y=0;y&lt;ROWS;y++){
        if (grid[y][bomb.x]) {
          var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;boom&#x27;;
          b.style.left=(bomb.x*CELL)+&#x27;px&#x27;; b.style.top=(y*CELL)+&#x27;px&#x27;;
          b.style.width=CELL+&#x27;px&#x27;; b.style.height=CELL+&#x27;px&#x27;; b.textContent=&#x27;💥&#x27;;
          field.appendChild(b);
          (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); })(b);
          grid[y][bomb.x]=null;
        }
      }
      score=Math.max(0,score-5); scoreEl.textContent=score;
      playBoom(2);
      bomb=null;
    } else {
      bomb.y=ny;
    }
  }

  /* ---- Predators ---- */
  function maybeSpawnPredator() {
    if (predators.length&gt;=3) return;
    if (Math.random()&lt;0.4) {
      var col=Math.floor(Math.random()*COLS);
      predators.push({ col:col, y:-1, face:PREDATORS[Math.floor(Math.random()*PREDATORS.length)] });
    }
  }
  function topBlockY(col) {
    for (var y=0;y&lt;ROWS;y++){ if (grid[y][col]) return y; }
    return -99;
  }
  function stepPredators() {
    for (var i=predators.length-1;i&gt;=0;i--){
      var p=predators[i];
      p.y+=1;
      var ty=topBlockY(p.col);
      if (ty&gt;=0 &amp;&amp; p.y&gt;=ty) {
        // snatch the top critter of this column
        grid[ty][p.col]=null;
        score=Math.max(0,score-2); scoreEl.textContent=score;
        playBlip(200);
        predators.splice(i,1);
      } else if (p.y&gt;ROWS) {
        predators.splice(i,1);
      }
    }
    maybeSpawnPredator();
  }

  function paint() {
    field.innerHTML=&#x27;&#x27;; field.appendChild(overEl);
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++) if (grid[r][c]) drawBlock(c,r,grid[r][c].color,grid[r][c].face,false);
    if (piece) {
      var cells=pieceCells(piece);
      for (var i=0;i&lt;cells.length;i++) if (cells[i].y&gt;=0) drawBlock(cells[i].x,cells[i].y,piece.color,piece.face,false);
    }
    if (bomb &amp;&amp; bomb.y&gt;=0) drawBlock(bomb.x,bomb.y,&#x27;#37474f&#x27;,&#x27;💣&#x27;,true);
    for (var k=0;k&lt;predators.length;k++){
      var p=predators[k];
      if (p.y&gt;=0) {
        var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;pred&#x27;;
        el.style.left=(p.col*CELL)+&#x27;px&#x27;; el.style.top=(p.y*CELL)+&#x27;px&#x27;;
        el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;; el.textContent=p.face;
        field.appendChild(el);
      }
    }
  }
  function drawBlock(cx,cy,color,face,isBomb) {
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block&#x27;+(isBomb?&#x27; bomb&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=color; el.textContent=face;
    field.appendChild(el);
  }

  function afterLock() {
    clearFullRows();
    if (!spawnPiece()) { endGame(); overEl.style.display=&#x27;flex&#x27;; paint(); return false; }
    return true;
  }

  function stepDown() {
    if (!piece) return;
    var next={ type:piece.type, rot:piece.rot, x:piece.x, y:piece.y+1, color:piece.color, face:piece.face };
    if (collides(next)) { lockPiece(); if(!afterLock()) return; }
    else piece=next;
    paint();
  }

  function hardDrop() {
    if (!running||!piece) return;
    while (true) {
      var next={ type:piece.type, rot:piece.rot, x:piece.x, y:piece.y+1, color:piece.color, face:piece.face };
      if (collides(next)) break;
      piece=next;
    }
    playBlip(300);
    lockPiece(); if(!afterLock()) return;
    paint();
  }

  function move(dx) {
    if (!running||!piece) return;
    var next={ type:piece.type, rot:piece.rot, x:piece.x+dx, y:piece.y, color:piece.color, face:piece.face };
    if (!collides(next)) { piece=next; paint(); }
  }
  function rotate() {
    if (!running||!piece) return;
    var states=SHAPES[piece.type].rot.length;
    var nr=(piece.rot+1)%states;
    var kicks=[0,-1,1,-2,2];
    for (var k=0;k&lt;kicks.length;k++){
      var next={ type:piece.type, rot:nr, x:piece.x+kicks[k], y:piece.y, color:piece.color, face:piece.face };
      if (!collides(next)) { piece=next; paint(); playBlip(660); return; }
    }
  }

  function endGame() {
    running=false;
    if (dropId){clearInterval(dropId);dropId=null;}
    if (predId){clearInterval(predId);predId=null;}
    if (bombTimer){clearInterval(bombTimer);bombTimer=null;}
    stopMusic();
  }

  function startGame() {
    if (running) return;
    score=0; scoreEl.textContent=&#x27;0&#x27;; overEl.style.display=&#x27;none&#x27;;
    newGrid(); bomb=null; predators=[];
    if (!spawnPiece()) return;
    paint();
    running=true;
    if (dropId) clearInterval(dropId);
    dropId=setInterval(stepDown,DROP_MS);
    predId=setInterval(function(){ if(running){ stepBomb(); stepPredators(); paint(); } },420);
    bombTimer=setInterval(function(){ if(running) spawnBomb(); },5000);
    setTimeout(function(){ if(running){ spawnBomb(); paint(); } },900);
    startMusic();
  }
  function stopGame() {
    if (!running) return;
    running=false;
    if (dropId){clearInterval(dropId);dropId=null;}
    if (predId){clearInterval(predId);predId=null;}
    if (bombTimer){clearInterval(bombTimer);bombTimer=null;}
    stopMusic();
  }

  /* ---------- Audio ---------- */
  var actx=null, musicTimer=null, musicStep=0;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function tone(freq,dur,type,vol){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.15,a.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.02);
  }
  function playBlip(f){ tone(f,0.08,&#x27;square&#x27;,0.08); }
  function playBoom(n){
    var a=ac(); if(!a) return;
    // noise burst
    var dur=0.35;
    var buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    var d=buf.getChannelData(0);
    for (var i=0;i&lt;d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    var src=a.createBufferSource(); src.buffer=buf;
    var g=a.createGain(); g.gain.value=0.25;
    src.connect(g); g.connect(a.destination); src.start();
    var notes=[523,659,784,1047];
    for (var k=0;k&lt;Math.min(n+1,4);k++) (function(k){ setTimeout(function(){ tone(notes[k],0.15,&#x27;triangle&#x27;,0.16); },k*80); })(k);
  }
  var MELODY=[330,392,494,392,330,294,262,294,330,392,330,294,262,220,262,294];
  function startMusic(){
    stopMusic(); musicStep=0;
    var a=ac(); if(!a) return;
    if (a.state===&#x27;suspended&#x27;) a.resume();
    musicTimer=setInterval(function(){
      var f=MELODY[musicStep%MELODY.length];
      tone(f,0.22,&#x27;sine&#x27;,0.05);
      if (musicStep%2===0) tone(f/2,0.22,&#x27;triangle&#x27;,0.04);
      musicStep++;
    },260);
  }
  function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if (e.key===&#x27; &#x27;||e.key===&#x27;Spacebar&#x27;){ hardDrop(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // Initial preview
  newGrid();
  piece={ type:&#x27;T&#x27;, rot:0, x:Math.floor((COLS-4)/2), y:1, color:SHAPES.T.color, face:&#x27;🐰&#x27; };
  paint();
&lt;/script&gt;

      window.parent.postMessage({

        source: ev.filename || null,

        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {

      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,

        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
