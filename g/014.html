  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;

  .candy.show { opacity: 1; transform: scale(1); animation: candyPulse 0.8s ease-in-out infinite; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🎪 Circus Elephant Bounce 🎪&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer your elephant with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys to bounce the red ball — paddle hits score 1 and clown hits score 10 while slowing the ball. Grab the rare 🍬 for an instant win, and watch out — extra balls join at 30 points and every 10 after! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W = 64, PADDLE_H = 44, PADDLE_BOTTOM = 8, PADDLE_SPEED = 6.5;
  var BALL_SIZE = 18;
  var BALL_SPEED = 4.2;
  var SLOW_FACTOR = 0.45, SLOW_MS = 5000;
  var running = false, animId = null, won = false;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var score = 0;
  var nextBallScore = 30; // score at which the next extra ball spawns
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var candyEl = document.getElementById(&#x27;candy&#x27;);
  var clowns = [document.getElementById(&#x27;clown0&#x27;), document.getElementById(&#x27;clown1&#x27;), document.getElementById(&#x27;clown2&#x27;)];
  var clownState = [{active:false}, {active:false}, {active:false}];
  var CLOWN_SIZE = 46;
  var candyState = { active: false, x: 0, y: 0, size: 44 };
  var clownTimer = null, candyTimer = null;

  // multiple balls: each has its own element + physics
  var balls = [];

  function makeBallEl() {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ball&#x27;;
    field.appendChild(el);
    return el;
  }

  function spawnBall(fromTop) {
    var el = makeBallEl();
    var b = {
      el: el,
      x: (FIELD_W - BALL_SIZE) / 2 + (Math.random() * 120 - 60),
      y: 60,
      vx: (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED,
      vy: BALL_SPEED,
      speedMult: 1,
      slowUntil: 0
    };
    balls.push(b);
    return b;
  }

  function clearBalls() {
    for (var i = 0; i &lt; balls.length; i++) {
      if (balls[i].el &amp;&amp; balls[i].el.parentNode) balls[i].el.parentNode.removeChild(balls[i].el);
    }
    balls = [];
  }

  function resetBall(b) {
    b.x = (FIELD_W - BALL_SIZE) / 2;
    b.y = 60;
    b.vx = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    b.vy = BALL_SPEED;
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    for (var i = 0; i &lt; balls.length; i++) {
      balls[i].el.style.left = balls[i].x + &#x27;px&#x27;;
      balls[i].el.style.top = balls[i].y + &#x27;px&#x27;;
    }
  }

  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
    while (score &gt;= nextBallScore) {
      spawnBall();
      nextBallScore += 10;
    }
  }

  function popClown() {
    if (!running) return;
    var i = Math.floor(Math.random() * clowns.length);
    if (clownState[i].active) { clownTimer = setTimeout(popClown, 400); return; }
    var x = 20 + Math.random() * (FIELD_W - 80);
    var y = 60 + Math.random() * (FIELD_H - 190);
    clownState[i] = { active: true, x: x, y: y, size: CLOWN_SIZE };
    var c = clowns[i];
    c.style.left = x + &#x27;px&#x27;;
    c.style.top = y + &#x27;px&#x27;;
    c.classList.remove(&#x27;hit&#x27;);
    c.classList.add(&#x27;show&#x27;);
    (function(idx, node){
      setTimeout(function () {
        if (clownState[idx].active) {
          node.classList.remove(&#x27;show&#x27;);
          clownState[idx].active = false;
        }
      }, 1500);
    })(i, c);
    clownTimer = setTimeout(popClown, 700 + Math.random() * 900);
  }

  function hideClown(i) {
    clownState[i].active = false;
    clowns[i].classList.remove(&#x27;show&#x27;);
    clowns[i].classList.add(&#x27;hit&#x27;);
  }

  function popCandy() {
    if (!running) return;
    if (!candyState.active) {
      var x = 40 + Math.random() * (FIELD_W - 120);
      var y = 60 + Math.random() * (FIELD_H - 200);
      candyState = { active: true, x: x, y: y, size: 44 };
      candyEl.style.left = x + &#x27;px&#x27;;
      candyEl.style.top = y + &#x27;px&#x27;;
      candyEl.classList.add(&#x27;show&#x27;);
      setTimeout(function () {
        if (candyState.active) { candyState.active = false; candyEl.classList.remove(&#x27;show&#x27;); }
      }, 3500);
    }
    candyTimer = setTimeout(popCandy, 9000 + Math.random() * 12000);
  }

  function circleHit(bx, by, cx, cy, size) {
    var bcx = bx + BALL_SIZE / 2, bcy = by + BALL_SIZE / 2;
    var tcx = cx + size / 2, tcy = cy + size / 2;
    var dx = bcx - tcx, dy = bcy - tcy;
    var r = size * 0.42 + BALL_SIZE / 2;
    return dx * dx + dy * dy &lt;= r * r;
  }

  function winRound() {
    won = true;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (clownTimer) { clearTimeout(clownTimer); clownTimer = null; }
    if (candyTimer) { clearTimeout(candyTimer); candyTimer = null; }
    candyState.active = false;
    candyEl.classList.remove(&#x27;show&#x27;);
    banner.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;🍬 INSTANT WIN! 🍬&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Score: &#x27; + score + &#x27; &amp;middot; Press Restart below to play again&lt;/div&gt;&#x27;;
    banner.style.display = &#x27;block&#x27;;
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    var now = Date.now();

    for (var bi = 0; bi &lt; balls.length; bi++) {
      var b = balls[bi];
      if (b.slowUntil &amp;&amp; now &gt;= b.slowUntil) {
        b.slowUntil = 0; b.speedMult = 1;
        b.el.classList.remove(&#x27;slow&#x27;);
      }
      b.x += b.vx * b.speedMult;
      b.y += b.vy * b.speedMult;
      if (b.x &lt;= 0) { b.x = 0; b.vx = -b.vx; }
      if (b.x + BALL_SIZE &gt;= FIELD_W) { b.x = FIELD_W - BALL_SIZE; b.vx = -b.vx; }
      if (b.y &lt;= 46) { b.y = 46; b.vy = -b.vy; }

      // cotton candy = instant win
      if (candyState.active &amp;&amp; circleHit(b.x, b.y, candyState.x, candyState.y, candyState.size)) {
        winRound();
        return;
      }

      // clown hits
      for (var i = 0; i &lt; clownState.length; i++) {
        if (clownState[i].active &amp;&amp; circleHit(b.x, b.y, clownState[i].x, clownState[i].y, clownState[i].size)) {
          hideClown(i);
          addScore(10);
          b.speedMult = SLOW_FACTOR;
          b.slowUntil = now + SLOW_MS;
          b.el.classList.add(&#x27;slow&#x27;);
        }
      }

      // paddle bounce
      if (b.vy &gt; 0 &amp;&amp;
          b.y + BALL_SIZE &gt;= paddleTop &amp;&amp;
          b.y + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
          b.x + BALL_SIZE &gt;= paddleX + 8 &amp;&amp;
          b.x &lt;= paddleX + PADDLE_W - 8) {
        b.vy = -Math.abs(b.vy);
        b.y = paddleTop - BALL_SIZE;
        addScore(1);
      }
      if (b.y &gt;= FIELD_H) resetBall(b);
    }
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    won = false;
    banner.style.display = &#x27;none&#x27;;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    nextBallScore = 30;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    for (var i = 0; i &lt; clownState.length; i++) {
      clownState[i].active = false;
      clowns[i].classList.remove(&#x27;show&#x27;, &#x27;hit&#x27;);
    }
    candyState.active = false;
    candyEl.classList.remove(&#x27;show&#x27;);
    clearBalls();
    spawnBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
    clownTimer = setTimeout(popClown, 500);
    candyTimer = setTimeout(popCandy, 8000 + Math.random() * 10000);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (clownTimer) { clearTimeout(clownTimer); clownTimer = null; }
    if (candyTimer) { clearTimeout(candyTimer); candyTimer = null; }
    for (var i = 0; i &lt; clowns.length; i++) clowns[i].classList.remove(&#x27;show&#x27;);
    candyEl.classList.remove(&#x27;show&#x27;);
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;

    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
