&lt;html&gt;&lt;head&gt;&lt;style&gt;

        &lt;rect x=&quot;44&quot; y=&quot;40&quot; width=&quot;12&quot; height=&quot;18&quot; rx=&quot;4&quot; fill=&quot;#7a4a2b&quot; stroke=&quot;#5c3620&quot; stroke-width=&quot;2&quot;/&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var FIELD_W = 620, FIELD_H = 410;
  var PADDLE_W = 100, PADDLE_H = 60, PADDLE_HIT_TOP = 8, PADDLE_BOTTOM = 8, PADDLE_SPEED = 7;
  var PADDLE_HIT_W = 68, PADDLE_HIT_INSET = (PADDLE_W - PADDLE_HIT_W)/2;
  var BALL_SIZE = 18;
  var BALL_SPEED = 4.2;
  var TARGET_SIZE = 34;
  var TARGET_ZONE_TOP = 30, TARGET_ZONE_BOTTOM = 165;
  var STREAK_MAX = 10; // fills the bar
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  var streak = 0;
  var targets = [];
  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var comboFill = document.getElementById(&#x27;combofill&#x27;);
  var celebrateEl = document.getElementById(&#x27;celebrate&#x27;);

  var audioCtx = null;
  function beep(freqStart, freqEnd, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;triangle&#x27;;
      o.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.25, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur + 0.02);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur + 0.03);
    } catch (_) {}
  }
  function hitSound() {
    // pitch rises with streak so it feels like building momentum
    var base = 400 + Math.min(streak, 12) * 45;
    beep(base, base*0.5, 0.11);
  }
  function ding() { beep(660, 990, 0.15, &#x27;square&#x27;, 0.2); }
  function fanfare() {
    var notes = [523,659,784,1046];
    notes.forEach(function(n,i){ setTimeout(function(){ beep(n, n*1.01, 0.16, &#x27;square&#x27;, 0.18); }, i*90); });
  }

  var CFCOLORS = [&#x27;#ff6b6b&#x27;,&#x27;#ffd93d&#x27;,&#x27;#6bcB77&#x27;,&#x27;#4d96ff&#x27;,&#x27;#c77dff&#x27;,&#x27;#ff9f45&#x27;,&#x27;#ff4fa3&#x27;];
  function burstConfetti(cx, cy, count) {
    for (var i=0;i&lt;count;i++){
      var c = document.createElement(&#x27;div&#x27;);
      c.className = &#x27;confetti&#x27;;
      var col = CFCOLORS[(Math.random()*CFCOLORS.length)|0];
      c.style.background = col;
      c.style.borderRadius = (Math.random()&lt;0.5?&#x27;50%&#x27;:&#x27;2px&#x27;);
      c.style.left = cx + &#x27;px&#x27;;
      c.style.top = cy + &#x27;px&#x27;;
      field.appendChild(c);
      var ang = Math.random()*Math.PI*2;
      var spd = 2 + Math.random()*4;
      (function(el){
        var vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd - 2;
        var px = cx, py = cy, life = 0, rot = Math.random()*360, rv = (Math.random()-0.5)*20;
        function step(){
          life++;
          vy += 0.18;
          px += vx; py += vy; rot += rv;
          el.style.left = px + &#x27;px&#x27;;
          el.style.top = py + &#x27;px&#x27;;
          el.style.transform = &#x27;rotate(&#x27;+rot+&#x27;deg)&#x27;;
          el.style.opacity = Math.max(0, 1 - life/48);
          if (life &lt; 48) requestAnimationFrame(step);
          else if (el.parentNode) el.parentNode.removeChild(el);
        }
        requestAnimationFrame(step);
      })(c);
    }
  }

  function showCelebrate(text, color) {
    celebrateEl.textContent = text;
    if (color) celebrateEl.style.color = color;
    celebrateEl.classList.remove(&#x27;show&#x27;);
    void celebrateEl.offsetWidth; // restart animation
    celebrateEl.classList.add(&#x27;show&#x27;);
  }

  function updateCombo() {
    comboEl.textContent = &#x27;Streak: &#x27; + streak;
    comboFill.style.width = Math.min(100, (streak/STREAK_MAX)*100) + &#x27;%&#x27;;
  }

  function bumpStreak() {
    streak++;
    updateCombo();
    if (streak === 5) showCelebrate(&#x27;NICE! 🔥&#x27;, &#x27;#ffd93d&#x27;);
    else if (streak === 10) { showCelebrate(&#x27;ON FIRE! 🔥🔥&#x27;, &#x27;#ff9f45&#x27;); burstConfetti(FIELD_W/2, FIELD_H*0.38, 30); }
    else if (streak === 20) { showCelebrate(&#x27;UNSTOPPABLE! ⭐&#x27;, &#x27;#c77dff&#x27;); burstConfetti(FIELD_W/2, FIELD_H*0.38, 45); fanfare(); }
    else if (streak &gt; 20 &amp;&amp; streak % 10 === 0) { showCelebrate(&#x27;LEGENDARY! 👑&#x27;, &#x27;#4d96ff&#x27;); burstConfetti(FIELD_W/2, FIELD_H*0.38, 45); fanfare(); }
  }
  function resetStreak() {
    if (streak &gt;= 3) showCelebrate(&#x27;Streak lost!&#x27;, &#x27;#fff&#x27;);
    streak = 0;
    updateCombo();
  }

  var TARGET_COLORS = [&#x27;#ff6b6b&#x27;,&#x27;#ffd93d&#x27;,&#x27;#6bcB77&#x27;,&#x27;#4d96ff&#x27;,&#x27;#c77dff&#x27;,&#x27;#ff9f45&#x27;];
  function makeTargets() {
    targets.forEach(function(t){ if (t.el &amp;&amp; t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    targets = [];
    var count = 5;
    for (var i=0;i&lt;count;i++){
      var col = TARGET_COLORS[i % TARGET_COLORS.length];
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;target&#x27;;
      el.innerHTML = &#x27;&lt;svg width=&quot;&#x27;+TARGET_SIZE+&#x27;&quot; height=&quot;&#x27;+TARGET_SIZE+&#x27;&quot; viewBox=&quot;0 0 34 34&quot;&gt;&#x27;
        + &#x27;&lt;circle cx=&quot;17&quot; cy=&quot;17&quot; r=&quot;16&quot; fill=&quot;&#x27;+col+&#x27;&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/&gt;&#x27;
        + &#x27;&lt;circle cx=&quot;17&quot; cy=&quot;17&quot; r=&quot;10&quot; fill=&quot;#fff&quot; opacity=&quot;0.35&quot;/&gt;&#x27;
        + &#x27;&lt;circle cx=&quot;17&quot; cy=&quot;17&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;&#x27;;
      field.appendChild(el);
      var t = {
        el: el,
        x: 30 + Math.random()*(FIELD_W-60-TARGET_SIZE),
        y: TARGET_ZONE_TOP + Math.random()*(TARGET_ZONE_BOTTOM-TARGET_ZONE_TOP-TARGET_SIZE),
        vx: (Math.random()&lt;0.5?-1:1)*(0.8+Math.random()*1.2),
        alive: true
      };
      targets.push(t);
      el.style.left = t.x + &#x27;px&#x27;;
      el.style.top = t.y + &#x27;px&#x27;;
    }
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
    targets.forEach(function(t){
      if (t.alive){ t.el.style.left = t.x + &#x27;px&#x27;; t.el.style.top = t.y + &#x27;px&#x27;; }
    });
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = FIELD_H*0.6;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = -BALL_SPEED;
  }

  function circlesOverlap(ax, ay, ar, bx, by, br){
    var dx = ax-bx, dy = ay-by;
    return (dx*dx+dy*dy) &lt;= (ar+br)*(ar+br);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));

    var aliveCount = 0;
    targets.forEach(function(t){
      if (!t.alive) return;
      aliveCount++;
      t.x += t.vx;
      if (t.x &lt;= 20) { t.x = 20; t.vx = -t.vx; }
      if (t.x + TARGET_SIZE &gt;= FIELD_W-20) { t.x = FIELD_W-20-TARGET_SIZE; t.vx = -t.vx; }
    });
    if (aliveCount === 0) {
      showCelebrate(&#x27;WAVE CLEARED! 🎉&#x27;, &#x27;#6bcB77&#x27;);
      burstConfetti(FIELD_W/2, FIELD_H*0.38, 40);
      fanfare();
      score += 20;
      scoreEl.textContent = score;
      makeTargets();
    }

    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }

    var bcx = ballX + BALL_SIZE/2, bcy = ballY + BALL_SIZE/2;
    targets.forEach(function(t){
      if (!t.alive) return;
      var tcx = t.x + TARGET_SIZE/2, tcy = t.y + TARGET_SIZE/2;
      if (circlesOverlap(bcx,bcy,BALL_SIZE/2, tcx,tcy,TARGET_SIZE/2)) {
        t.alive = false;
        t.el.classList.add(&#x27;pop&#x27;);
        (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },320); })(t.el);
        var dx = bcx - tcx, dy = bcy - tcy;
        if (Math.abs(dx) &gt; Math.abs(dy)) ballVX = (dx&lt;0?-1:1)*Math.abs(ballVX);
        else ballVY = (dy&lt;0?-1:1)*Math.abs(ballVY);
        score += 5;
        scoreEl.textContent = score;
        burstConfetti(tcx, tcy, 14);
        ding();
        bumpStreak();
      }
    });

    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H + PADDLE_HIT_TOP;
    var hitLeft = paddleX + PADDLE_HIT_INSET;
    var hitRight = paddleX + PADDLE_W - PADDLE_HIT_INSET;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + 26 &amp;&amp;
        ballX + BALL_SIZE &gt;= hitLeft &amp;&amp;
        ballX &lt;= hitRight) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      var center = paddleX + PADDLE_W/2;
      var offset = (ballX + BALL_SIZE/2 - center) / (PADDLE_HIT_W/2);
      ballVX = BALL_SPEED * Math.max(-1.2, Math.min(1.2, offset)) + ballVX*0.2;
      score += 1;
      scoreEl.textContent = score;
      hitSound();
      bumpStreak();
    }
    if (ballY &gt;= FIELD_H) {
      resetStreak();
      resetBall();
    }
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0; streak = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    updateCombo();
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    makeTargets();
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  paint();
  updateCombo();
&lt;/script&gt;
