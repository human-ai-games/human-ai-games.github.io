&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON BLOCKS: TURBO VIBRATIONS&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; (or your mouse) to bounce the ball and smash the neon blocks. Catch falling bonuses to slow the ball, split it, or grow it huge — clear every block to win!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;Score &lt;span class=&quot;v&quot; id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp; Balls &lt;span class=&quot;m&quot; id=&quot;balls&quot;&gt;1&lt;/span&gt; &amp;nbsp; Blocks &lt;span class=&quot;v&quot; id=&quot;blocks&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var W = 620, H = 460;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), ballsEl = document.getElementById(&#x27;balls&#x27;), blocksEl = document.getElementById(&#x27;blocks&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 26, PADDLE_SPEED = 7;
  var BASE_SPEED = 2.4, BASE_R = 8, BIG_R = 18;
  var BIG_DURATION = 5; // seconds
  var running = false, animId = null, keys = {};
  var paddleX, score, shake, tSec, won, bigTimer;
  var balls, blocks, bonuses, particles, ambient;

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.06;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(vol||0.06, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+(dur||0.1));
      o.start(t); o.stop(t+(dur||0.1));
    } catch(_){}
  }

  var COLORS = [&#x27;#ff00d4&#x27;,&#x27;#00fff2&#x27;,&#x27;#ffe600&#x27;,&#x27;#7cff00&#x27;,&#x27;#ff5e00&#x27;,&#x27;#8a5cff&#x27;];

  // Diamond-shaped arrangement of blocks
  function buildBlocks() {
    blocks = [];
    var pad = 6, bw = 58, bh = 20, cols = 9, rows = 9;
    var topY = 36;
    var totalW = cols*(bw+pad) - pad;
    var startX = (W - totalW)/2;
    var center = (cols-1)/2;
    for (var r=0;r&lt;rows;r++){
      // half-width of the diamond at this row
      var dist = Math.abs(r - (rows-1)/2);
      var allowed = center - dist; // number of cols from center that are filled
      for (var c=0;c&lt;cols;c++){
        if (Math.abs(c - center) &lt;= allowed + 0.001){
          blocks.push({
            x: startX + c*(bw+pad), y: topY + r*(bh+pad),
            w: bw, h: bh, color: COLORS[r % COLORS.length], alive: true
          });
        }
      }
    }
  }

  function newBall(x,y,vx,vy){ return {x:x,y:y,vx:vx,vy:vy,r:BASE_R,trail:[]}; }

  function makeAmbient(){
    ambient = [];
    for (var i=0;i&lt;50;i++){
      ambient.push({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25,
        r: 0.6+Math.random()*1.8,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        phase: Math.random()*6
      });
    }
  }

  function resetState(){
    paddleX = (W-PADDLE_W)/2;
    score = 0; shake = 0; tSec = 0; won = false; bigTimer = 0;
    balls = [ newBall(W/2, H-60, BASE_SPEED*0.6, -BASE_SPEED) ];
    bonuses = []; particles = [];
    makeAmbient();
    for (var k in keys) keys[k]=false;
    buildBlocks();
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    ballsEl.textContent = balls.length;
    var live = blocks.filter(function(b){return b.alive;}).length;
    blocksEl.textContent = live;
  }

  function showMsg(t){ msgEl.textContent = t; msgEl.classList.add(&#x27;show&#x27;); setTimeout(function(){msgEl.classList.remove(&#x27;show&#x27;);},1200); }

  function burst(x,y,color,n){
    for (var i=0;i&lt;(n||14);i++){
      var a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
      particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color,r:3});
    }
  }
  function spark(x,y,color){
    particles.push({x:x,y:y,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2,life:0.6,color:color,r:2});
  }

  var BONUS_TYPES = [
    {kind:&#x27;big&#x27;, color:&#x27;#ff5e00&#x27;, label:&#x27;O&#x27;},
    {kind:&#x27;multi&#x27;, color:&#x27;#00fff2&#x27;, label:&#x27;x2&#x27;},
    {kind:&#x27;slow&#x27;, color:&#x27;#7cff00&#x27;, label:&#x27;&lt;&lt;&#x27;}
  ];

  function spawnBonus(x,y){
    if (Math.random() &lt; 0.32){
      var t = BONUS_TYPES[Math.floor(Math.random()*BONUS_TYPES.length)];
      bonuses.push({x:x,y:y,vy:1.6,kind:t.kind,color:t.color,label:t.label,r:11,phase:Math.random()*6});
    }
  }

  function applyBonus(b){
    if (b.kind===&#x27;big&#x27;){
      bigTimer = BIG_DURATION;
      balls.forEach(function(bl){ bl.r = BIG_R; });
      showMsg(&#x27;BIG BALL!&#x27;); beep(180,0.25,&#x27;sawtooth&#x27;,0.08);
    } else if (b.kind===&#x27;slow&#x27;){
      balls.forEach(function(bl){ bl.vx*=0.7; bl.vy*=0.7; });
      showMsg(&#x27;CHILL&#x27;); beep(220,0.2,&#x27;sine&#x27;,0.07);
    } else if (b.kind===&#x27;multi&#x27;){
      var add=[];
      balls.forEach(function(bl){
        var sp = Math.hypot(bl.vx,bl.vy)||BASE_SPEED;
        var ang = Math.atan2(bl.vy,bl.vx)+0.5;
        var nb = newBall(bl.x,bl.y,Math.cos(ang)*sp,Math.sin(ang)*sp);
        nb.r = bl.r;
        add.push(nb);
      });
      balls = balls.concat(add).slice(0,12);
      showMsg(&#x27;MULTIBALL!&#x27;); beep(660,0.15,&#x27;square&#x27;,0.08);
    }
    updateHUD();
  }

  function step(){
    if (!running) return;
    tSec += 1/60;

    if (bigTimer&gt;0){
      bigTimer -= 1/60;
      if (bigTimer&lt;=0){
        bigTimer=0;
        balls.forEach(function(bl){ bl.r = BASE_R; });
        beep(300,0.1,&#x27;sine&#x27;,0.05);
      }
    }

    if (keys[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keys[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

    for (var a=0;a&lt;ambient.length;a++){
      var am=ambient[a];
      am.x+=am.vx; am.y+=am.vy; am.phase+=0.03;
      if (am.x&lt;0) am.x+=W; if (am.x&gt;W) am.x-=W;
      if (am.y&lt;0) am.y+=H; if (am.y&gt;H) am.y-=H;
    }

    for (var i=balls.length-1;i&gt;=0;i--){
      var b = balls[i];
      b.trail.push({x:b.x,y:b.y}); if(b.trail.length&gt;10) b.trail.shift();
      if (Math.random()&lt;0.5) spark(b.x,b.y, bigTimer&gt;0?&#x27;#ff5e00&#x27;:&#x27;#00fff2&#x27;);
      b.x += b.vx; b.y += b.vy;
      if (b.x-b.r&lt;=0){b.x=b.r;b.vx=Math.abs(b.vx);beep(400,0.04,&#x27;square&#x27;,0.03);}
      if (b.x+b.r&gt;=W){b.x=W-b.r;b.vx=-Math.abs(b.vx);beep(400,0.04,&#x27;square&#x27;,0.03);}
      if (b.y-b.r&lt;=0){b.y=b.r;b.vy=Math.abs(b.vy);beep(400,0.04,&#x27;square&#x27;,0.03);}
      if (b.vy&gt;0 &amp;&amp; b.y+b.r&gt;=PADDLE_Y &amp;&amp; b.y+b.r&lt;=PADDLE_Y+PADDLE_H+8 &amp;&amp; b.x&gt;=paddleX &amp;&amp; b.x&lt;=paddleX+PADDLE_W){
        b.vy=-Math.abs(b.vy);
        var hit=(b.x-(paddleX+PADDLE_W/2))/(PADDLE_W/2);
        var sp=Math.hypot(b.vx,b.vy);
        b.vx = hit*sp*0.8;
        var ny=-Math.sqrt(Math.max(0.2,sp*sp-b.vx*b.vx));
        b.vy=ny;
        b.y=PADDLE_Y-b.r;
        beep(300,0.05,&#x27;triangle&#x27;,0.05);
        burst(b.x,PADDLE_Y,&#x27;#8a5cff&#x27;,6);
      }
      for (var j=0;j&lt;blocks.length;j++){
        var bl=blocks[j]; if(!bl.alive) continue;
        if (b.x+b.r&gt;bl.x &amp;&amp; b.x-b.r&lt;bl.x+bl.w &amp;&amp; b.y+b.r&gt;bl.y &amp;&amp; b.y-b.r&lt;bl.y+bl.h){
          bl.alive=false;
          score+=10;
          shake=6;
          burst(bl.x+bl.w/2, bl.y+bl.h/2, bl.color, 18);
          spawnBonus(bl.x+bl.w/2, bl.y+bl.h/2);
          beep(500+Math.random()*300,0.06,&#x27;square&#x27;,0.05);
          var overlapX = Math.min(b.x+b.r-bl.x, bl.x+bl.w-(b.x-b.r));
          var overlapY = Math.min(b.y+b.r-bl.y, bl.y+bl.h-(b.y-b.r));
          if (overlapX&lt;overlapY) b.vx=-b.vx; else b.vy=-b.vy;
          updateHUD();
          break;
        }
      }
      if (b.y-b.r&gt;H){
        balls.splice(i,1);
        beep(120,0.25,&#x27;sawtooth&#x27;,0.06);
        if (balls.length===0){
          running=false; showMsg(&#x27;GAME OVER&#x27;);
          updateHUD();
        }
      }
    }

    for (var k=bonuses.length-1;k&gt;=0;k--){
      var bo=bonuses[k]; bo.y+=bo.vy; bo.phase+=0.15;
      if (Math.random()&lt;0.3) spark(bo.x,bo.y,bo.color);
      if (bo.y-bo.r&gt;PADDLE_Y-4 &amp;&amp; bo.y-bo.r&lt;PADDLE_Y+PADDLE_H+8 &amp;&amp; bo.x&gt;=paddleX-6 &amp;&amp; bo.x&lt;=paddleX+PADDLE_W+6){
        applyBonus(bo); burst(bo.x,bo.y,bo.color,20); shake=8; bonuses.splice(k,1); continue;
      }
      if (bo.y-bo.r&gt;H) bonuses.splice(k,1);
    }

    for (var p=particles.length-1;p&gt;=0;p--){
      var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.04; pt.life-=0.03;
      if (pt.life&lt;=0) particles.splice(p,1);
    }

    if (!won &amp;&amp; blocks.every(function(x){return !x.alive;})){
      won=true; running=false; showMsg(&#x27;YOU WIN!&#x27;); beep(880,0.3,&#x27;square&#x27;,0.08);
    }

    if (shake&gt;0) shake*=0.85;
    draw();
    animId = requestAnimationFrame(step);
  }

  function draw(){
    ctx.save();
    var sx = shake&gt;0.3?(Math.random()-0.5)*shake:0, sy = shake&gt;0.3?(Math.random()-0.5)*shake:0;
    ctx.clearRect(0,0,W,H);
    ctx.translate(sx,sy);

    ctx.strokeStyle=&#x27;rgba(120,60,255,0.08)&#x27;; ctx.lineWidth=1;
    for (var gx=0;gx&lt;W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
    for (var gy=0;gy&lt;H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

    for (var a=0;a&lt;ambient.length;a++){
      var am=ambient[a];
      var tw = 0.3+Math.abs(Math.sin(am.phase))*0.5;
      ctx.globalAlpha=tw;
      ctx.fillStyle=am.color; ctx.shadowColor=am.color; ctx.shadowBlur=6;
      ctx.beginPath(); ctx.arc(am.x,am.y,am.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;

    for (var i=0;i&lt;blocks.length;i++){
      var b=blocks[i]; if(!b.alive) continue;
      ctx.shadowColor=b.color; ctx.shadowBlur=12;
      ctx.fillStyle=b.color;
      roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;rgba(255,255,255,0.25)&#x27;;
      roundRect(b.x+2,b.y+2,b.w-4,4,2); ctx.fill();
    }

    for (var k=0;k&lt;bonuses.length;k++){
      var bo=bonuses[k];
      var pulse = 1+Math.sin(bo.phase)*0.15;
      ctx.shadowColor=bo.color; ctx.shadowBlur=16;
      ctx.fillStyle=bo.color;
      ctx.beginPath(); ctx.arc(bo.x,bo.y,bo.r*pulse,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;#05010f&#x27;; ctx.font=&#x27;bold 11px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(bo.label,bo.x,bo.y+1);
    }

    for (var p=0;p&lt;particles.length;p++){
      var pt=particles[p];
      ctx.globalAlpha=Math.max(0,pt.life);
      ctx.fillStyle=pt.color; ctx.shadowColor=pt.color; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r||3,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;

    for (var bi=0;bi&lt;balls.length;bi++){
      var bl=balls[bi];
      var big = bigTimer&gt;0;
      for (var t=0;t&lt;bl.trail.length;t++){
        ctx.globalAlpha=(t/bl.trail.length)*0.4;
        ctx.fillStyle= big?&#x27;#ff5e00&#x27;:&#x27;#00fff2&#x27;;
        ctx.beginPath(); ctx.arc(bl.trail[t].x,bl.trail[t].y,bl.r*(t/bl.trail.length),0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.shadowColor= big?&#x27;#ff5e00&#x27;:&#x27;#fff&#x27;; ctx.shadowBlur= big?26:18;
      ctx.fillStyle= big?&#x27;#ffd0a0&#x27;:&#x27;#ffffff&#x27;;
      ctx.beginPath(); ctx.arc(bl.x,bl.y,bl.r,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }

    ctx.shadowColor=&#x27;#ff00d4&#x27;; ctx.shadowBlur=20;
    var grad=ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
    grad.addColorStop(0,&#x27;#ff00d4&#x27;); grad.addColorStop(0.5,&#x27;#8a5cff&#x27;); grad.addColorStop(1,&#x27;#00fff2&#x27;);
    ctx.fillStyle=grad;
    roundRect(paddleX,PADDLE_Y,PADDLE_W,PADDLE_H,7); ctx.fill();
    ctx.shadowBlur=0;

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function startGame(){
    if (running) return;
    resetState();
    if (actx &amp;&amp; actx.state===&#x27;suspended&#x27;) actx.resume();
    running = true;
    animId = requestAnimationFrame(step);
  }
  function stopGame(){
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX-rect.left)*(W/rect.width);
    paddleX = Math.max(0, Math.min(W-PADDLE_W, mx-PADDLE_W/2));
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  resetState();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
