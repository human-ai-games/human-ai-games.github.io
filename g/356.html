<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>NEON ASCENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8ecff; overflow: hidden; }

       background: linear-gradient(90deg,#00e5ff,#b14bff,#ff4bd8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9aa6d8; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON ASCENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap &lt;strong&gt;Space&lt;/strong&gt;/click to thrust and hold for a boost (uses the orange meter) — fly through gates, grab coins, and snag power-ups. Dodge walls and moving lasers; chain coins without missing to trigger a STAR RUN, and clear each zone&#x27;s goal to fly faster!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;BEST&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;LV&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;GOAL&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;goal&quot;&gt;0/5&lt;/span&gt;&lt;/span&gt;
    &lt;span id=&quot;combo&quot;&gt;×1&lt;/span&gt;
    &lt;span id=&quot;zone&quot;&gt;&lt;/span&gt;
    &lt;span id=&quot;power&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;medal&quot; id=&quot;ovMedal&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;big&quot; id=&quot;ovBig&quot;&gt;READY&lt;/div&gt;
      &lt;div class=&quot;sub&quot; id=&quot;ovSub&quot;&gt;Press Start below to launch&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;boostbar&quot;&gt;&lt;div class=&quot;boostfill&quot; id=&quot;boostfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
var levelEl = document.getElementById(&#x27;level&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
var goalEl = document.getElementById(&#x27;goal&#x27;), powerEl = document.getElementById(&#x27;power&#x27;), zoneEl = document.getElementById(&#x27;zone&#x27;);
var boostFill = document.getElementById(&#x27;boostfill&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;), ovBig = document.getElementById(&#x27;ovBig&#x27;), ovSub = document.getElementById(&#x27;ovSub&#x27;), ovMedal = document.getElementById(&#x27;ovMedal&#x27;);

var ZONES = [
  { name: &#x27;CYAN FIELDS&#x27;, hue: 190 },
  { name: &#x27;VIOLET DRIFT&#x27;, hue: 265 },
  { name: &#x27;CRIMSON BELT&#x27;, hue: 340 },
  { name: &#x27;NOVA CORE&#x27;, hue: 25 }
];
function zoneFor(lv){ return ZONES[Math.min(ZONES.length-1, Math.floor((lv-1)/2))]; }

var running = false, animId = null;
var ship, obstacles, coins, powerups, lasers, particles, stars, nebula, floats;
var score, best = 0, level, combo, comboTimer, spawnTimer, speed, shake, gameOver;
var boost, boosting, coinsThisLevel, goalCount;
var shieldT, magnetT, slowT, starRunT, missStreak, coinStreak;
var holdActive = false;
var countdown = 0, hueBase = 190, hueTarget = 190;

// ---- Web Audio ----
var actx = null, hum = null, humGain = null;
function ac() { if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return actx; }
function beep(freq, dur, type, vol) {
  var a = ac(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
  g.gain.value = vol || 0.06;
  o.connect(g); g.connect(a.destination);
  var t = a.currentTime; o.start(t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.stop(t + dur);
}
function slide(f1,f2,dur,type,vol){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain(); o.type=type||&#x27;sine&#x27;; o.frequency.setValueAtTime(f1,a.currentTime); o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur); g.gain.value=vol||0.06; o.connect(g); g.connect(a.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); o.stop(a.currentTime+dur); }
function startHum(){ var a=ac(); if(!a||hum)return; hum=a.createOscillator(); humGain=a.createGain(); hum.type=&#x27;sawtooth&#x27;; hum.frequency.value=55; humGain.gain.value=0.012; var lp=a.createBiquadFilter(); lp.type=&#x27;lowpass&#x27;; lp.frequency.value=200; hum.connect(lp); lp.connect(humGain); humGain.connect(a.destination); hum.start(); }
function stopHum(){ if(hum){ try{hum.stop();}catch(e){} hum=null; humGain=null; } }
function sfxThrust(){ beep(220 + Math.random()*40, 0.07, &#x27;sine&#x27;, 0.035); }
function sfxCoin(){ beep(880, 0.05, &#x27;square&#x27;, 0.05); beep(1320, 0.08, &#x27;square&#x27;, 0.04); }
function sfxGate(){ beep(520, 0.09, &#x27;triangle&#x27;, 0.045); }
function sfxCrash(){ slide(300,40,0.5,&#x27;sawtooth&#x27;,0.12); }
function sfxLevel(){ beep(660,0.09,&#x27;square&#x27;,0.06); setTimeout(function(){beep(990,0.13,&#x27;square&#x27;,0.06);},90); setTimeout(function(){beep(1320,0.16,&#x27;square&#x27;,0.05);},180); }
function sfxPower(){ slide(400,1000,0.25,&#x27;triangle&#x27;,0.07); }
function sfxShieldHit(){ slide(900,300,0.2,&#x27;square&#x27;,0.08); }
function sfxStarRun(){ beep(784,0.1,&#x27;square&#x27;,0.06); setTimeout(function(){beep(1047,0.1,&#x27;square&#x27;,0.06);},80); setTimeout(function(){beep(1568,0.2,&#x27;square&#x27;,0.055);},160); }
function sfxCount(hi){ beep(hi?880:440, 0.12, &#x27;square&#x27;, 0.06); }

function reset() {
  ship = { x: 130, y: H/2, vy: 0, r: 13, trail: [] };
  obstacles = []; coins = []; powerups = []; lasers = []; particles = []; floats = [];
  stars = []; nebula = [];
  for (var i=0;i&lt;70;i++) stars.push({ x: Math.random()*W, y: Math.random()*H, z: 0.3+Math.random()*1.2 });
  for (var n=0;n&lt;5;n++) nebula.push({ x: Math.random()*W, y: Math.random()*H, r: 80+Math.random()*120, hue: 220+Math.random()*120, a: 0.04+Math.random()*0.05 });
  score = 0; level = 1; combo = 1; comboTimer = 0;
  spawnTimer = 0; speed = 3.0; shake = 0; gameOver = false;
  boost = 100; boosting = false; coinsThisLevel = 0; goalCount = 5;
  shieldT = 0; magnetT = 0; slowT = 0; starRunT = 0; missStreak = 0; coinStreak = 0;
  hueBase = zoneFor(1).hue; hueTarget = hueBase;
  updateHud();
}
function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  levelEl.textContent = level;
  goalEl.textContent = coinsThisLevel + &#x27;/&#x27; + goalCount;
  comboEl.textContent = &#x27;×&#x27; + combo;
  comboEl.style.transform = &#x27;scale(&#x27;+(1 + Math.min(0.5,(combo-1)*0.06))+&#x27;)&#x27;;
  zoneEl.textContent = zoneFor(level).name;
  var pw = [];
  if (starRunT&gt;0) pw.push(&#x27;⭐&#x27;+Math.ceil(starRunT/60));
  if (shieldT&gt;0) pw.push(&#x27;🛡&#x27;+Math.ceil(shieldT/60));
  if (magnetT&gt;0) pw.push(&#x27;🧲&#x27;+Math.ceil(magnetT/60));
  if (slowT&gt;0) pw.push(&#x27;🐢&#x27;+Math.ceil(slowT/60));
  powerEl.textContent = pw.join(&#x27; &#x27;);
  boostFill.style.width = boost + &#x27;%&#x27;;
}

var GRAV = 0.40, THRUST = -7.0;
function thrust() {
  if (!running || gameOver || countdown&gt;0) return;
  ship.vy = THRUST;
  sfxThrust();
  for (var i=0;i&lt;5;i++) particles.push({ x: ship.x-8, y: ship.y+6, vx: -2-Math.random()*2, vy: (Math.random()-0.5)*2, life: 20, col: &#x27;#00e5ff&#x27;, r: 3 });
}

var POWER_TYPES = [&#x27;shield&#x27;,&#x27;magnet&#x27;,&#x27;slow&#x27;,&#x27;coinburst&#x27;];
function spawnPair() {
  var gap = 165 - Math.min(62, level*4);
  var minTop = 40, maxTop = H - 40 - gap;
  var top = minTop + Math.random()*(maxTop - minTop);
  var w = 34;
  var hue = hueBase + (Math.random()-0.5)*40;
  obstacles.push({ x: W+w, w: w, topH: top, gap: gap, hue: hue, scored: false });
  coins.push({ x: W + w + 20, y: top + gap/2, r: 8, got: false, pulse: Math.random()*Math.PI });
  if (level &gt;= 2 &amp;&amp; Math.random() &lt; 0.5) {
    var cy = top + gap*(0.25+Math.random()*0.5);
    coins.push({ x: W + w + 110, y: cy, r: 8, got: false, pulse: Math.random()*Math.PI });
  }
  if (Math.random() &lt; 0.26) {
    var type = POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)];
    powerups.push({ x: W + w + 180, y: top + gap/2 + (Math.random()-0.5)*gap*0.4, r: 12, type: type, got: false, pulse: Math.random()*Math.PI });
  }
  if (level &gt;= 3 &amp;&amp; Math.random() &lt; 0.33) {
    var ly = 60 + Math.random()*(H-120);
    lasers.push({ x: W + 260, y: ly, r: 10, vy: (Math.random()&lt;0.5?-1:1)*(1+level*0.14), len: 46 });
  }
}

function burst(x, y, col, n) {
  for (var i=0;i&lt;n;i++) {
    var a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
    particles.push({ x:x, y:y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 24+Math.random()*16, col: col, r: 2+Math.random()*3 });
  }
}
function sparkle(x,y,col){ for(var i=0;i&lt;6;i++){ var a=Math.random()*Math.PI*2; particles.push({x:x,y:y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,life:18,col:col,r:1.5}); } }
function floatText(x,y,txt,col){ floats.push({x:x,y:y,txt:txt,col:col,life:50}); }

function applyPower(type, x, y) {
  sfxPower();
  if (type === &#x27;shield&#x27;) { shieldT = 360; floatText(x,y,&#x27;SHIELD&#x27;,&#x27;#7bff9e&#x27;); burst(x,y,&#x27;#7bff9e&#x27;,14); }
  else if (type === &#x27;magnet&#x27;) { magnetT = 360; floatText(x,y,&#x27;MAGNET&#x27;,&#x27;#4bd8ff&#x27;); burst(x,y,&#x27;#4bd8ff&#x27;,14); }
  else if (type === &#x27;slow&#x27;) { slowT = 300; floatText(x,y,&#x27;SLOW-MO&#x27;,&#x27;#b14bff&#x27;); burst(x,y,&#x27;#b14bff&#x27;,14); }
  else if (type === &#x27;coinburst&#x27;) { var bonus=10*combo; score+=bonus; floatText(x,y,&#x27;+&#x27;+bonus,&#x27;#ffd24b&#x27;); burst(x,y,&#x27;#ffd24b&#x27;,20); sfxCoin(); }
  updateHud();
}

function gainScore(n, x, y) {
  var mult = starRunT&gt;0 ? 2 : 1;
  score += n*mult; floatText(x, y, &#x27;+&#x27;+(n*mult), starRunT&gt;0?&#x27;#fff2a0&#x27;:&#x27;#ffd24b&#x27;);
  combo = Math.min(9, combo + 1); comboTimer = 160;
}

function levelUp() {
  level++;
  speed = 3.0 + level*0.5;
  coinsThisLevel = 0;
  goalCount = 5 + level*2;
  boost = Math.min(100, boost + 30);
  hueTarget = zoneFor(level).hue;
  sfxLevel(); shake = Math.max(shake,8); showFlash();
  floatText(ship.x+20, ship.y, &#x27;LEVEL &#x27;+level+&#x27;!&#x27;, &#x27;#ff4bd8&#x27;);
  var z = zoneFor(level); var pz = zoneFor(level-1);
  if (z.name !== pz.name) floatText(W/2, 60, &#x27;► &#x27;+z.name+&#x27; ◄&#x27;, &#x27;#ff9de0&#x27;);
  updateHud();
}

function endGame() {
  gameOver = true; sfxCrash(); shake = 20; stopHum();
  burst(ship.x, ship.y, &#x27;#ff4b6e&#x27;, 44);
  if (score &gt; best) best = score;
  var medal=&#x27;🥉&#x27;, label=&#x27;Nice run!&#x27;;
  if (score &gt;= 150) { medal=&#x27;🥇&#x27;; label=&#x27;LEGENDARY PILOT!&#x27;; }
  else if (score &gt;= 70) { medal=&#x27;🥈&#x27;; label=&#x27;Great flying!&#x27;; }
  ovMedal.textContent = medal;
  updateHud();
  var newBest = (score&gt;=best &amp;&amp; score&gt;0) ? &#x27;  ★NEW BEST★&#x27; : &#x27;&#x27;;
  showOverlay(&#x27;GAME OVER&#x27;, label + &#x27;&lt;br&gt;Score &#x27; + score + newBest + &#x27;  •  Best &#x27; + best + &#x27;&lt;br&gt;Reached &#x27; + zoneFor(level).name + &#x27; (Lv &#x27;+level+&#x27;)&lt;br&gt;Press Start to fly again&#x27;, true);
}

function showOverlay(big, sub, keepMedal) { ovBig.textContent = big; ovSub.innerHTML = sub; if(!keepMedal) ovMedal.textContent=&#x27;&#x27;; overlay.classList.remove(&#x27;hidden&#x27;); }
function hideOverlay() { overlay.classList.add(&#x27;hidden&#x27;); }

var flash = 0;
function showFlash(){ flash = 1; }

var countTimer = 0;
function step() {
  if (!running) return;

  // hue easing
  hueBase += (hueTarget - hueBase) * 0.03;

  // countdown phase
  if (countdown &gt; 0) {
    countTimer--;
    if (countTimer &lt;= 0) {
      countdown--; countTimer = 45;
      if (countdown &gt; 0) sfxCount(false); else { sfxCount(true); startHum(); }
    }
    for (var s0=0;s0&lt;stars.length;s0++){ stars[s0].x -= stars[s0].z*0.6; if (stars[s0].x&lt;0){stars[s0].x=W;stars[s0].y=Math.random()*H;} }
    draw();
    animId = requestAnimationFrame(step);
    return;
  }

  var spdMul = slowT&gt;0 ? 0.55 : 1;
  var effSpeed = speed * spdMul;

  // boost
  if (holdActive &amp;&amp; boost &gt; 0 &amp;&amp; !gameOver) {
    boosting = true; boost = Math.max(0, boost - 0.8);
    ship.vy += THRUST*0.12;
    if (Math.random()&lt;0.6) particles.push({ x: ship.x-10, y: ship.y+(Math.random()-0.5)*10, vx:-4-Math.random()*3, vy:(Math.random()-0.5)*2, life:18, col:&#x27;#ff9d00&#x27;, r:3 });
  } else { boosting = false; if (!holdActive) boost = Math.min(100, boost + 0.16); }

  ship.vy += GRAV; ship.y += ship.vy;
  ship.trail.push({ x: ship.x, y: ship.y }); if (ship.trail.length &gt; 12) ship.trail.shift();

  if (ship.y - ship.r &lt; 0) { ship.y = ship.r; ship.vy = 0; hitWall(); }
  if (ship.y + ship.r &gt; H) { ship.y = H - ship.r; ship.vy = 0; hitWall(); }

  if (comboTimer &gt; 0) { comboTimer--; if (comboTimer === 0 &amp;&amp; combo &gt; 1) { combo = 1; updateHud(); } }
  if (shieldT&gt;0) shieldT--; if (magnetT&gt;0) magnetT--; if (slowT&gt;0) slowT--; if (starRunT&gt;0) { starRunT--; if(starRunT===0) floatText(ship.x, ship.y-20,&#x27;STAR RUN END&#x27;,&#x27;#aab4e6&#x27;); }

  spawnTimer--;
  var interval = Math.max(58, 112 - level*5);
  if (spawnTimer &lt;= 0) { spawnPair(); spawnTimer = interval; }

  for (var i=obstacles.length-1;i&gt;=0;i--) {
    var o = obstacles[i];
    o.x -= effSpeed;
    if (o.x + o.w &lt; -5) { obstacles.splice(i,1); continue; }
    if (!o.scored &amp;&amp; o.x + o.w &lt; ship.x) { o.scored = true; gainScore(1*combo, ship.x+30, ship.y-20); sfxGate(); updateHud(); }
    var sx=ship.x, sy=ship.y, r=ship.r;
    if (sx + r &gt; o.x &amp;&amp; sx - r &lt; o.x + o.w) { if (sy - r &lt; o.topH || sy + r &gt; o.topH + o.gap) hitObstacle(o); }
  }

  for (var L=lasers.length-1;L&gt;=0;L--) {
    var la = lasers[L];
    la.x -= effSpeed; la.y += la.vy;
    if (la.y &lt; 30 || la.y &gt; H-30) la.vy *= -1;
    if (la.x &lt; -30) { lasers.splice(L,1); continue; }
    var dx = Math.abs(la.x - ship.x);
    if (dx &lt; ship.r + la.r &amp;&amp; Math.abs(la.y - ship.y) &lt; la.len/2 + ship.r) hitObstacle(la);
  }

  for (var j=coins.length-1;j&gt;=0;j--) {
    var c = coins[j];
    c.x -= effSpeed; c.pulse += 0.15;
    if (magnetT&gt;0) { var mdx=ship.x-c.x, mdy=ship.y-c.y, md=Math.hypot(mdx,mdy); if (md&lt;150){c.x+=mdx/md*4;c.y+=mdy/md*4;} }
    if (c.x &lt; -20) { coins.splice(j,1); coinStreak = 0; continue; }
    var ddx=c.x-ship.x, ddy=c.y-ship.y;
    if (!c.got &amp;&amp; ddx*ddx+ddy*ddy &lt; (c.r+ship.r)*(c.r+ship.r)) {
      coins.splice(j,1); gainScore(2*combo, c.x, c.y);
      coinsThisLevel++; if (coinsThisLevel &gt;= goalCount) levelUp();
      sfxCoin(); sparkle(c.x, c.y, &#x27;#ffd24b&#x27;);
      coinStreak++;

function hitWall() { if (gameOver||countdown&gt;0) return; coinStreak=0; if (shieldT&gt;0) { shieldT=0; sfxShieldHit(); ship.vy=THRUST*0.7; burst(ship.x,ship.y,&#x27;#7bff9e&#x27;,16); shake=8; } else endGame(); }

function draw() {

  for (var o2=0;o2&lt;obstacles.length;o2++) {

  var picon = { shield:&#x27;🛡&#x27;, magnet:&#x27;🧲&#x27;, slow:&#x27;🐢&#x27;, coinburst:&#x27;💰&#x27; };
  var pcol = { shield:&#x27;#7bff9e&#x27;, magnet:&#x27;#4bd8ff&#x27;, slow:&#x27;#b14bff&#x27;, coinburst:&#x27;#ffd24b&#x27; };
  for (var q=0;q&lt;powerups.length;q++) {

    ctx.shadowBlur = 0; ctx.font = &#x27;18px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;

  for (var t=0;t&lt;ship.trail.length;t++) { var tr=ship.trail[t]; ctx.globalAlpha=t/ship.trail.length*0.5; ctx.fillStyle= starRunT&gt;0?&#x27;#fff2a0&#x27;:(boosting?&#x27;#ff9d00&#x27;:&#x27;#00e5ff&#x27;); ctx.beginPath(); ctx.arc(tr.x,tr.y,ship.r*(t/ship.trail.length),0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;

  if (!gameOver) {
    if (starRunT&gt;0) { ctx.strokeStyle=&#x27;rgba(255,242,160,&#x27;+(0.5+0.3*Math.sin(Date.now()/80))+&#x27;)&#x27;; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ship.x,ship.y,ship.r+11,0,Math.PI*2); ctx.stroke(); }
    if (shieldT&gt;0) { ctx.strokeStyle=&#x27;rgba(123,255,158,&#x27;+(0.4+0.3*Math.sin(Date.now()/100))+&#x27;)&#x27;; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ship.x,ship.y,ship.r+8,0,Math.PI*2); ctx.stroke(); }

}
