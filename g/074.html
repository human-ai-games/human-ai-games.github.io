  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;ARMORED TRAIN — NEON DEFENSE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Drive with Arrow keys or WASD; turrets auto-fire at the nearest foe — clear 3 waves and keep your carriages alive. Fill the green bar for weapon upgrades (F/S/x2); every 3rd fill adds a rail with an extra gun, and health packs restore carriage armor.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Cars: &lt;b id=&quot;carr&quot;&gt;5&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;F&lt;b id=&quot;fLvl&quot;&gt;1&lt;/b&gt;·S&lt;b id=&quot;sLvl&quot;&gt;1&lt;/b&gt;·&lt;b id=&quot;x2&quot;&gt;x2 off&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Wave &lt;b id=&quot;wave&quot;&gt;-&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;bars&quot;&gt;
    &lt;div class=&quot;barlabel&quot;&gt;&lt;span&gt;Power (upgrades)&lt;/span&gt;&lt;span id=&quot;fills&quot;&gt;rails: 0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;powerbar-wrap&quot;&gt;&lt;div class=&quot;powerbar&quot; id=&quot;powerbar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;progress-wrap&quot; id=&quot;progWrap&quot;&gt;
      &lt;div class=&quot;progressbar-bg&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;progressbar&quot; id=&quot;progressbar&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fieldwrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;410&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var W=cv.width, H=cv.height;
var scoreEl=document.getElementById(&#x27;score&#x27;), carrEl=document.getElementById(&#x27;carr&#x27;);
var fLvlEl=document.getElementById(&#x27;fLvl&#x27;), sLvlEl=document.getElementById(&#x27;sLvl&#x27;), x2El=document.getElementById(&#x27;x2&#x27;);
var waveEl=document.getElementById(&#x27;wave&#x27;), fillsEl=document.getElementById(&#x27;fills&#x27;);
var powerbarEl=document.getElementById(&#x27;powerbar&#x27;), progressbarEl=document.getElementById(&#x27;progressbar&#x27;);
var progWrap=document.getElementById(&#x27;progWrap&#x27;);

var running=false, lastTime=0, rafId=null, gameTime=0;

var SEG=34, CARR_SIZE=22, speed=100;
var CARR_MAX_HP=100, HIT_DMG=5;
var BASE_HP=420;          // regular hp (was 210 -&gt; x2)
var ELITE_MUL=1.5;
var carriages, path, dir, pendingDir, keys;
var score, powerVal, powerReq, fireLvl, rateLvl, hasX2, totalFills, railsGained;
var enemies, bullets, particles, upgrades, trail, healthpacks, flashes;
var shake, spawnCooldown, hpackTimer;
var wave, waveState, waveTimer, spawnQueue;
var boss, bossActive, bossFlash, gameWon;

function rand(a,b){ return a+Math.random()*(b-a); }

function resetGame(){
  score=0; powerVal=0; powerReq=500; fireLvl=1; rateLvl=1; hasX2=false; totalFills=0; railsGained=0;
  enemies=[]; bullets=[]; particles=[]; upgrades=[]; trail=[]; healthpacks=[]; flashes=[];
  shake=0; spawnCooldown=0; gameTime=0; hpackTimer=10;
  keys={};
  carriages=[];
  var sx=W/2, sy=H/2;
  for(var i=0;i&lt;5;i++) carriages.push({x:sx-i*SEG,y:sy,hp:CARR_MAX_HP,gunAngle:0,targetAngle:0,cooldown:rand(0.3,0.5),flashT:0});
  dir={x:1,y:0}; pendingDir={x:1,y:0};
  path=[]; for(var j=0;j&lt;50*SEG;j++) path.push({x:sx-j,y:sy});
  wave=0; boss=null; bossActive=false; bossFlash=0; gameWon=false;
  spawnQueue=[]; waveState=&#x27;pre&#x27;; waveTimer=0.6;
  updateHud(); buildProgressMarkers();
}

function buildProgressMarkers(){
  var old=progWrap.querySelectorAll(&#x27;.marker&#x27;);
  for(var i=0;i&lt;old.length;i++) old[i].remove();
  [{p:33,e:&#x27;🚩&#x27;},{p:66,e:&#x27;🚩&#x27;},{p:100,e:&#x27;💀&#x27;}].forEach(function(f){
    var m=document.createElement(&#x27;div&#x27;); m.className=&#x27;marker&#x27;; m.style.left=f.p+&#x27;%&#x27;; m.textContent=f.e; progWrap.appendChild(m);
  });
}

function updateHud(){
  scoreEl.textContent=score; carrEl.textContent=carriages.length;
  fLvlEl.textContent=fireLvl; sLvlEl.textContent=rateLvl;
  x2El.textContent=hasX2?&#x27;x2 on&#x27;:&#x27;x2 off&#x27;;
  waveEl.textContent=wave===0?&#x27;-&#x27;:(wave===3?&#x27;BOSS&#x27;:wave);
  fillsEl.textContent=&#x27;rails: &#x27;+railsGained;
  powerbarEl.style.width=Math.min(100,(powerVal/powerReq)*100)+&#x27;%&#x27;;
  var prog = wave===0?0:Math.min(100,((wave-1)/3)*100+(waveClearFrac()*(100/3)));
  progressbarEl.style.width=Math.max(0,prog)+&#x27;%&#x27;;
}

function waveClearFrac(){
  if(wave===3){ return boss?(1-boss.hp/boss.maxHp):1; }
  var total=wave===1?10:(wave===2?16:1);
  var remaining=spawnQueue.length+enemies.length;
  if(remaining===0) return 1;
  return Math.max(0,Math.min(1,1-remaining/total));
}

// --- Input (Arrows + WASD) ---
function setDir(nx,ny){
  if(nx!==0 &amp;&amp; dir.x!==-nx) pendingDir={x:nx,y:0};
  else if(ny!==0 &amp;&amp; dir.y!==-ny) pendingDir={x:0,y:ny};
}
window.addEventListener(&#x27;keydown&#x27;, function(e){
  var k=e.key.toLowerCase();
  if(k===&#x27;arrowleft&#x27;||k===&#x27;a&#x27;){ setDir(-1,0); e.preventDefault(); }
  else if(k===&#x27;arrowright&#x27;||k===&#x27;d&#x27;){ setDir(1,0); e.preventDefault(); }
  else if(k===&#x27;arrowup&#x27;||k===&#x27;w&#x27;){ setDir(0,-1); e.preventDefault(); }
  else if(k===&#x27;arrowdown&#x27;||k===&#x27;s&#x27;){ setDir(0,1); e.preventDefault(); }
});

// --- Waves ---
function startWave(n){
  wave=n; spawnQueue=[];
  if(n===1){ for(var i=0;i&lt;10;i++) spawnQueue.push(&#x27;std&#x27;); }
  else if(n===2){ for(var i=0;i&lt;10;i++) spawnQueue.push(&#x27;std&#x27;); for(var j=0;j&lt;6;j++) spawnQueue.push(&#x27;elite&#x27;); shuffle(spawnQueue); }
  else if(n===3){ spawnBoss(); bossFlash=3.0; }
  spawnCooldown=0; waveState=&#x27;active&#x27;; updateHud();
}
function shuffle(a){ for(var i=a.length-1;i&gt;0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } }

function makeEnemy(type){
  var side=Math.floor(Math.random()*4), x,y;
  if(side===0){x=rand(0,W);y=-25;} else if(side===1){x=W+25;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=H+25;} else {x=-25;y=rand(0,H);}
  if(type===&#x27;elite&#x27;){
    return {x:x,y:y,hp:BASE_HP*ELITE_MUL,maxHp:BASE_HP*ELITE_MUL,r:19,speed:rand(20,30),type:&#x27;elite&#x27;,spawnT:0.5,fireCd:2};
  }
  return {x:x,y:y,hp:BASE_HP,maxHp:BASE_HP,r:15,speed:rand(64,90),type:&#x27;std&#x27;,spawnT:0.5,fireCd:99};
}

function spawnBoss(){
  boss={x:W/2,y:60,hp:13000,maxHp:13000,r:34,angle:Math.PI/2,fireCd:2.2,moveT:0,patternIdx:0,mobCd:4};
  bossActive=true;
}

// --- Firing ---
function fireBullet(x,y,angle,dmg){
  bullets.push({x:x+Math.cos(angle)*16,y:y+Math.sin(angle)*16,vx:Math.cos(angle)*380,vy:Math.sin(angle)*380,dmg:dmg,life:2,enemy:false,col:&#x27;#5affe0&#x27;});
  // muzzle flash + smoke
  flashes.push({x:x+Math.cos(angle)*18,y:y+Math.sin(angle)*18,life:0.09,maxLife:0.09,r:9,angle:angle});
  for(var i=0;i&lt;3;i++){ var a=angle+rand(-0.4,0.4); particles.push({x:x+Math.cos(angle)*16,y:y+Math.sin(angle)*16,vx:Math.cos(a)*rand(20,60),vy:Math.sin(a)*rand(20,60),life:rand(0.3,0.6),maxLife:0.6,r:rand(2,4),color:&#x27;#7a7f9a&#x27;,drag:0.9}); }
}
function fireEnemyBullet(x,y,angle,speed,col){
  bullets.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,dmg:HIT_DMG*2,life:5,enemy:true,col:col});
}

function nearestTarget(x,y){
  var best=null,bd=1e9;
  for(var i=0;i&lt;enemies.length;i++){ var e=enemies[i]; if(e.spawnT&gt;0) continue; var d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y); if(d&lt;bd){bd=d;best=e;} }
  if(boss&amp;&amp;bossActive){ var d=(boss.x-x)*(boss.x-x)+(boss.y-y)*(boss.y-y); if(d&lt;bd){bd=d;best=boss;} }
  return best;
}

function shrapnel(x,y,color,count){
  for(var i=0;i&lt;count;i++){ var a=Math.random()*Math.PI*2, sp=rand(120,360);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.8,1.7),maxLife:1.7,r:rand(2,5),color:color,drag:0.97,glow:true}); }
}
function sparkle(x,y,color,count){
  for(var i=0;i&lt;count;i++){ var a=Math.random()*Math.PI*2, sp=rand(30,120);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(0.3,0.7),maxLife:0.7,r:rand(2,4),color:color,drag:0.92,glow:true}); }
}
function angleLerp(cur,tgt,t){ var d=tgt-cur; while(d&gt;Math.PI)d-=Math.PI*2; while(d&lt;-Math.PI)d+=Math.PI*2; return cur+d*t; }

function update(dt){
  gameTime+=dt;
  // wave management
  if(waveState===&#x27;pre&#x27;){ waveTimer-=dt; if(waveTimer&lt;=0) startWave(1); }
  else if(waveState===&#x27;active&#x27;){
    if(wave&lt;3){
      spawnCooldown-=dt;
      if(spawnQueue.length&gt;0 &amp;&amp; enemies.length&lt;4 &amp;&amp; spawnCooldown&lt;=0){
        enemies.push(makeEnemy(spawnQueue.shift()));
        spawnCooldown=1.5;
      }
      if(spawnQueue.length===0 &amp;&amp; enemies.length===0){ waveState=&#x27;pre2&#x27;; waveTimer=1.2; }
    }
  } else if(waveState===&#x27;pre2&#x27;){ waveTimer-=dt; if(waveTimer&lt;=0) startWave(wave+1); }

  // health pack spawns
  var lowHp = carriages.length&gt;0 &amp;&amp; (totalHp()/(carriages.length*CARR_MAX_HP))&lt;0.5;
  hpackTimer-=dt;
  if(hpackTimer&lt;=0){ healthpacks.push({x:rand(50,W-50),y:rand(50,H-50),r:13,pulse:0}); hpackTimer=lowHp?5:10; }

  // move head
  dir=pendingDir;
  var head=carriages[0];
  head.x+=dir.x*speed*dt; head.y+=dir.y*speed*dt;
  if(head.x&lt;0)head.x+=W; if(head.x&gt;W)head.x-=W;
  if(head.y&lt;0)head.y+=H; if(head.y&gt;H)head.y-=H;
  path.unshift({x:head.x,y:head.y});
  var maxPath=carriages.length*SEG+20; if(path.length&gt;maxPath) path.length=maxPath;
  for(var i=1;i&lt;carriages.length;i++){ var idx=i*SEG; if(idx&lt;path.length){ carriages[i].x=path[idx].x; carriages[i].y=path[idx].y; } }

  // steam trail
  if(Math.random()&lt;0.9) trail.push({x:head.x,y:head.y,life:0.8,maxLife:0.8,r:rand(6,11)});
  for(var i=trail.length-1;i&gt;=0;i--){ var tp=trail[i]; tp.life-=dt; tp.r+=dt*10; if(tp.life&lt;=0) trail.splice(i,1); }

  // guns
  var fireDmg=14+(fireLvl-1)*8;
  var rateMul=1+(rateLvl-1)*0.5;
  for(var i=0;i&lt;carriages.length;i++){
    var c=carriages[i];
    if(c.flashT&gt;0) c.flashT-=dt;
    var target=nearestTarget(c.x,c.y);
    if(target){ c.targetAngle=Math.atan2(target.y-c.y,target.x-c.x); }
    c.gunAngle=angleLerp(c.gunAngle,c.targetAngle,Math.min(1,dt*5));
    c.cooldown-=dt*rateMul;
    if(c.cooldown&lt;=0 &amp;&amp; target){
      var err=Math.abs(angleLerp(c.gunAngle,c.targetAngle,1)-c.gunAngle);
      if(err&lt;0.35){ fireBullet(c.x,c.y,c.gunAngle,fireDmg); if(hasX2) fireBullet(c.x,c.y,c.gunAngle+Math.PI,fireDmg); c.cooldown=rand(0.3,0.5); c.flashT=0.09; }
    }
  }

  // bullets
  for(var i=bullets.length-1;i&gt;=0;i--){
    var b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life&lt;=0||b.x&lt;-15||b.x&gt;W+15||b.y&lt;-15||b.y&gt;H+15){ bullets.splice(i,1); continue; }
    if(b.enemy){
      var tgt=carriages[carriages.length-1];
      if(tgt &amp;&amp; (b.x-tgt.x)*(b.x-tgt.x)+(b.y-tgt.y)*(b.y-tgt.y)&lt;(CARR_SIZE/2+5)*(CARR_SIZE/2+5)){ damageCarriage(tgt,b.dmg); bullets.splice(i,1); }
      continue;
    }
    var hit=false;
    for(var j=0;j&lt;enemies.length;j++){
      var e=enemies[j];
      if((b.x-e.x)*(b.x-e.x)+(b.y-e.y)*(b.y-e.y)&lt;e.r*e.r){
        e.hp-=b.dmg; hit=true; shake=Math.max(shake,2); sparkle(b.x,b.y,&#x27;#ffd27a&#x27;,3); addPower(5);
        if(e.hp&lt;=0){ score+=1; shrapnel(e.x,e.y,e.type===&#x27;elite&#x27;?&#x27;#ffaa55&#x27;:&#x27;#ff6a6a&#x27;,26); shake=Math.max(shake,9); addPower(20); enemies.splice(j,1); }
        break;
      }
    }
    if(!hit &amp;&amp; boss &amp;&amp; bossActive &amp;&amp; (b.x-boss.x)*(b.x-boss.x)+(b.y-boss.y)*(b.y-boss.y)&lt;boss.r*boss.r){
      boss.hp-=b.dmg; hit=true; shake=Math.max(shake,2); sparkle(b.x,b.y,&#x27;#ffd27a&#x27;,3); addPower(15);
      if(boss.hp&lt;=0){ score+=25; shrapnel(boss.x,boss.y,&#x27;#ff6a6a&#x27;,70); shake=Math.max(shake,18); bossActive=false; boss=null; gameWon=true; running=false; }
    }
    if(hit) bullets.splice(i,1);
  }

  // enemies move + shoot
  var target=carriages[carriages.length-1];
  for(var i=enemies.length-1;i&gt;=0;i--){
    var e=enemies[i];
    if(e.spawnT&gt;0){ e.spawnT-=dt; continue; }
    if(!target) break;
    var ang=Math.atan2(target.y-e.y,target.x-e.x);
    e.x+=Math.cos(ang)*e.speed*dt; e.y+=Math.sin(ang)*e.speed*dt;
    if(e.type===&#x27;elite&#x27;){
      e.fireCd-=dt;
      if(e.fireCd&lt;=0){ fireEnemyBullet(e.x,e.y,ang,150,&#x27;#ffb347&#x27;); e.fireCd=2; }
    }
    var dx=e.x-target.x, dy=e.y-target.y;
    if(dx*dx+dy*dy&lt;(e.r+CARR_SIZE/2)*(e.r+CARR_SIZE/2)){
      shrapnel(e.x,e.y,&#x27;#ff8844&#x27;,18);
      damageCarriage(carriages[carriages.length-1], e.type===&#x27;elite&#x27;?HIT_DMG*6:HIT_DMG*4);
      enemies.splice(i,1);
      target=carriages.length?carriages[carriages.length-1]:null;
    }
  }

  // boss
  if(boss &amp;&amp; bossActive){
    boss.moveT+=dt;
    boss.x=W/2+Math.sin(boss.moveT*0.5)*160;
    boss.y=70+Math.sin(boss.moveT*0.9)*20;
    var h=carriages[0]; boss.angle=Math.atan2(h.y-boss.y,h.x-boss.x);
    boss.fireCd-=dt;
    if(boss.fireCd&lt;=0){
      var pat=boss.patternIdx%3;
      if(pat===0){ for(var a=-2;a&lt;=2;a++) fireEnemyBullet(boss.x,boss.y,boss.angle+a*0.22,150,&#x27;#ff5a9a&#x27;); }
      else if(pat===1){ for(var a=0;a&lt;10;a++) fireEnemyBullet(boss.x,boss.y,(a/10)*Math.PI*2,130,&#x27;#ff5a5a&#x27;); }
      else { for(var a=-1;a&lt;=1;a++) fireEnemyBullet(boss.x,boss.y,boss.angle+a*0.5,190,&#x27;#ffaa5a&#x27;); }
      boss.patternIdx++; boss.fireCd=2.2;
    }
    boss.mobCd-=dt;
    if(boss.mobCd&lt;=0 &amp;&amp; enemies.length&lt;3){ enemies.push(makeEnemy(&#x27;std&#x27;)); boss.mobCd=4; }
  }

  // upgrades pickup
  for(var i=upgrades.length-1;i&gt;=0;i--){
    var u=upgrades[i];
    for(var k=0;k&lt;carriages.length;k++){ var c=carriages[k];

    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
