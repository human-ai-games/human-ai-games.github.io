<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚀 Home Planet Run</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🚀 Home Planet Run</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #dfe6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #9fd0ff; text-shadow: 0 0 8px #2a6cff; }
  .instructions { font-size: 16px; color: #aeb8dd; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 20px; font-size: 18px; color: #cfe0ff; }
  .hud b { color: #ffe08a; }
  canvas { background: radial-gradient(circle at 50% 30%, #0b1030, #04040c); border-radius: 10px; box-shadow: 0 0 20px #12245e inset; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🚀 Home Planet Run&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your UFO along the bottom with ← →, and use ↑ ↓ to flip your launch angle between the left and right diagonal, then press spacebar to fire toward your home planet. Ricochet off asteroids and walls — but your UFO vanishes after 10 bounces, and each missed shot clears one asteroid and lowers its points.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;This shot: &lt;b id=&quot;worth&quot;&gt;10&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Bounces: &lt;b id=&quot;bounces&quot;&gt;0&lt;/b&gt;/10&lt;/div&gt;
    &lt;div&gt;Landings: &lt;b id=&quot;landings&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 480;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var worthEl = document.getElementById(&#x27;worth&#x27;);
  var bouncesEl = document.getElementById(&#x27;bounces&#x27;);
  var landingsEl = document.getElementById(&#x27;landings&#x27;);

  var running = false, animId = null;
  var keysDown = {};
  var score = 0, worth = 10, landings = 0;
  var MAX_BOUNCES = 10;

  var UFO_W = 34, UFO_H = 16, UFO_Y = H - 26, UFO_SPEED = 5;
  var ufoX = W / 2;
  var aimDir = -1;
  var BALL_R = 9, SPEED = 5.2;
  var ball = { x: 0, y: 0, vx: 0, vy: 0, flying: false, bounces: 0 };

  var planet = { x: 0, y: 0, r: 30 };
  var asteroids = [];
  var stars = [];

  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function makeStars() {
    stars = [];
    for (var i = 0; i &lt; 70; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.3, a: Math.random()*0.7+0.3 });
    }
  }

  function randPlanet() {
    planet.r = 26 + Math.random()*10;
    planet.x = planet.r + 20 + Math.random()*(W - 2*planet.r - 40);
    planet.y = planet.r + 20 + Math.random()*60;
  }

  function makeAsteroid(cx, cy, size, drift) {
    var pts = [], n = 6 + Math.floor(Math.random()*4);
    for (var i = 0; i &lt; n; i++) {
      var ang = (i/n)*Math.PI*2 + (Math.random()-0.5)*0.3;
      var rad = size * (0.65 + Math.random()*0.45);
      pts.push({ x: Math.cos(ang)*rad, y: Math.sin(ang)*rad });
    }
    var vx = 0, vy = 0;
    if (drift) {
      var a = Math.random()*Math.PI*2, sp = 0.35 + Math.random()*0.55;
      vx = Math.cos(a)*sp; vy = Math.sin(a)*sp;
    }
    return { cx: cx, cy: cy, pts: pts, size: size, spin: (Math.random()-0.5)*0.01, rot: 0, vx: vx, vy: vy, drift: !!drift };
  }

  function buildField(count) {
    asteroids = [];
    var tries = 0;
    // stationary field
    while (asteroids.length &lt; count &amp;&amp; tries &lt; 400) {
      tries++;
      var size = 20 + Math.random()*26;
      var cx = size + 20 + Math.random()*(W - 2*size - 40);
      var cy = 130 + Math.random()*(H - 260);
      if (Math.hypot(cx-planet.x, cy-planet.y) &lt; planet.r + size + 30) continue;
      var ok = true;
      for (var j=0;j&lt;asteroids.length;j++){
        if (Math.hypot(cx-asteroids[j].cx, cy-asteroids[j].cy) &lt; size+asteroids[j].size+18){ok=false;break;}
      }
      if (!ok) continue;
      asteroids.push(makeAsteroid(cx, cy, size, false));
    }
    // 1-3 drifting asteroids
    var drifters = 1 + Math.floor(Math.random()*3);
    for (var d=0; d&lt;drifters; d++) {
      var ds = 18 + Math.random()*22;
      var dx = ds + 20 + Math.random()*(W - 2*ds - 40);
      var dy = 130 + Math.random()*(H - 280);
      asteroids.push(makeAsteroid(dx, dy, ds, true));
    }
  }

  function resetRound() {
    randPlanet();
    buildField(11);
    worth = 10;
    ball.flying = false;
    ball.bounces = 0;
    worthEl.textContent = worth;
    bouncesEl.textContent = &#x27;0&#x27;;
  }

  function addBounce() {
    ball.bounces += 1;
    bouncesEl.textContent = ball.bounces;
    if (ball.bounces &gt;= MAX_BOUNCES) {
      failShot();
      return true;
    }
    return false;
  }

  function launch() {
    if (ball.flying || !running) return;
    ball.x = ufoX; ball.y = UFO_Y - UFO_H/2 - BALL_R - 2;
    ball.vx = aimDir * SPEED * Math.SQRT1_2;
    ball.vy = -SPEED * Math.SQRT1_2;
    ball.flying = true;
    ball.bounces = 0;
    bouncesEl.textContent = &#x27;0&#x27;;
    beep(520, 0.15, &#x27;square&#x27;);
  }

  function failShot() {
    ball.flying = false;
    if (asteroids.length &gt; 0) asteroids.pop();
    if (worth &gt; 1) worth -= 1;
    worthEl.textContent = worth;
    ball.bounces = 0;
    bouncesEl.textContent = &#x27;0&#x27;;
    beep(140, 0.25, &#x27;sawtooth&#x27;);
  }

  function landShot() {
    score += worth;
    landings += 1;
    scoreEl.textContent = score;
    landingsEl.textContent = landings;
    ball.flying = false;
    beep(660, 0.12, &#x27;sine&#x27;);
    setTimeout(function(){ beep(880, 0.18, &#x27;sine&#x27;); }, 90);
    resetRound();
  }

  function astPoly(a) {
    var out = [], c = Math.cos(a.rot), s = Math.sin(a.rot);
    for (var i=0;i&lt;a.pts.length;i++){
      var p = a.pts[i];
      out.push({ x: a.cx + p.x*c - p.y*s, y: a.cy + p.x*s + p.y*c });
    }
    return out;
  }

  function collidePoly(poly) {
    var bx = ball.x, by = ball.y;
    var closestDist = Infinity, nx = 0, ny = 0;
    for (var i=0;i&lt;poly.length;i++){
      var a = poly[i], b = poly[(i+1)%poly.length];
      var ex = b.x-a.x, ey = b.y-a.y;
      var t = ((bx-a.x)*ex + (by-a.y)*ey)/(ex*ex+ey*ey);
      t = Math.max(0, Math.min(1, t));
      var px = a.x + ex*t, py = a.y + ey*t;
      var d = Math.hypot(bx-px, by-py);
      if (d &lt; closestDist) {
        closestDist = d;
        nx = bx - px; ny = by - py;
      }
    }
    if (closestDist &lt; BALL_R) {
      var len = Math.hypot(nx, ny) || 1;
      nx /= len; ny /= len;
      var dot = ball.vx*nx + ball.vy*ny;
      ball.vx -= 2*dot*nx;
      ball.vy -= 2*dot*ny;
      ball.x += nx * (BALL_R - closestDist + 1);
      ball.y += ny * (BALL_R - closestDist + 1);
      beep(300, 0.06, &#x27;triangle&#x27;);
      return true;
    }
    return false;
  }

  function update() {
    if (keysDown[&#x27;ArrowLeft&#x27;]) ufoX -= UFO_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) ufoX += UFO_SPEED;
    ufoX = Math.max(UFO_W/2, Math.min(W - UFO_W/2, ufoX));

    // drift asteroids
    for (var k=0;k&lt;asteroids.length;k++){
      var ast = asteroids[k];
      ast.rot += ast.spin;
      if (ast.drift) {
        ast.cx += ast.vx; ast.cy += ast.vy;
        if (ast.cx - ast.size &lt; 0) { ast.cx = ast.size; ast.vx = Math.abs(ast.vx); }
        if (ast.cx + ast.size &gt; W) { ast.cx = W - ast.size; ast.vx = -Math.abs(ast.vx); }
        if (ast.cy - ast.size &lt; 110) { ast.cy = 110 + ast.size; ast.vy = Math.abs(ast.vy); }
        if (ast.cy + ast.size &gt; H - 60) { ast.cy = H - 60 - ast.size; ast.vy = -Math.abs(ast.vy); }
      }
    }

    if (ball.flying) {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - BALL_R &lt;= 0) { ball.x = BALL_R; ball.vx = -ball.vx; beep(300,0.05,&#x27;triangle&#x27;); if (addBounce()) return; }
      else if (ball.x + BALL_R &gt;= W) { ball.x = W - BALL_R; ball.vx = -ball.vx; beep(300,0.05,&#x27;triangle&#x27;); if (addBounce()) return; }
      if (ball.y - BALL_R &lt;= 0) { ball.y = BALL_R; ball.vy = -ball.vy; beep(300,0.05,&#x27;triangle&#x27;); if (addBounce()) return; }
      else if (ball.y + BALL_R &gt;= H) { ball.y = H - BALL_R; ball.vy = -ball.vy; beep(300,0.05,&#x27;triangle&#x27;); if (addBounce()) return; }

      if (Math.hypot(ball.x-planet.x, ball.y-planet.y) &lt; planet.r + BALL_R - 4) {
        landShot();
        return;
      }

      for (var i=0;i&lt;asteroids.length;i++){
        if (collidePoly(astPoly(asteroids[i]))) { if (addBounce()) return; break; }
      }
    }
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    for (var i=0;i&lt;stars.length;i++){
      var s = stars[i];
      ctx.globalAlpha = s.a;
      ctx.fillStyle = &#x27;#cfe0ff&#x27;;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var pg = ctx.createRadialGradient(planet.x-planet.r*0.3, planet.y-planet.r*0.3, 4, planet.x, planet.y, planet.r);
    pg.addColorStop(0, &#x27;#7dffb0&#x27;); pg.addColorStop(1, &#x27;#178a4e&#x27;);
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(planet.x, planet.y, planet.r, 0, 7); ctx.fill();
    ctx.strokeStyle = &#x27;rgba(180,255,210,0.6)&#x27;; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(planet.x, planet.y, planet.r+9, planet.r*0.45, -0.4, 0, 7); ctx.stroke();
    ctx.fillStyle = &#x27;rgba(255,255,255,0.85)&#x27;;
    ctx.font = &#x27;11px system-ui&#x27;; ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;HOME&#x27;, planet.x, planet.y - planet.r - 6);

    for (var a=0;a&lt;asteroids.length;a++){
      var poly = astPoly(asteroids[a]);
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (var j=1;j&lt;poly.length;j++) ctx.lineTo(poly[j].x, poly[j].y);
      ctx.closePath();
      ctx.fillStyle = asteroids[a].drift ? &#x27;#7a6f8a&#x27; : &#x27;#6b6470&#x27;; ctx.fill();
      ctx.strokeStyle = asteroids[a].drift ? &#x27;#4a3f5a&#x27; : &#x27;#3a353f&#x27;; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = &#x27;rgba(0,0,0,0.25)&#x27;;
      ctx.beginPath(); ctx.arc(asteroids[a].cx-4, asteroids[a].cy+3, asteroids[a].size*0.18, 0, 7); ctx.fill();
    }

    var ux = ufoX, uy = UFO_Y;
    ctx.fillStyle = &#x27;#8fd8ff&#x27;;
    ctx.beginPath(); ctx.ellipse(ux, uy, UFO_W/2, UFO_H/2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = &#x27;#d6f0ff&#x27;;
    ctx.beginPath(); ctx.ellipse(ux, uy-6, UFO_W/4, UFO_H/2.2, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = &#x27;#ffe08a&#x27;;
    ctx.beginPath(); ctx.arc(ux-8, uy, 2, 0, 7); ctx.arc(ux, uy, 2, 0, 7); ctx.arc(ux+8, uy, 2, 0, 7); ctx.fill();

    if (!ball.flying &amp;&amp; running) {
      ctx.strokeStyle = &#x27;rgba(255,224,138,0.85)&#x27;; ctx.lineWidth = 2;
      ctx.setLineDash([5,5]);
      ctx.beginPath();
      ctx.moveTo(ux, uy - UFO_H/2 - 4);
      ctx.lineTo(ux + aimDir*44, uy - UFO_H/2 - 48);
      ctx.stroke();
      ctx.setLineDash([]);
      var ex = ux + aimDir*44, ey = uy - UFO_H/2 - 48;
      ctx.fillStyle = &#x27;rgba(255,224,138,0.9)&#x27;;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - aimDir*8, ey + 3);
      ctx.lineTo(ex - aimDir*3, ey + 9);
      ctx.closePath(); ctx.fill();
    }

    if (ball.flying) {
      ctx.fillStyle = &#x27;#8fd8ff&#x27;;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, 7); ctx.fill();
      ctx.strokeStyle = &#x27;#d6f0ff&#x27;; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  function loop() {
    if (!running) return;
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    score = 0; landings = 0;
    scoreEl.textContent = &#x27;0&#x27;; landingsEl.textContent = &#x27;0&#x27;;
    ufoX = W/2; aimDir = -1;
    for (var k in keysDown) keysDown[k] = false;
    makeStars();
    resetRound();
    running = true;
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    if (e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowDown&#x27;) {
      aimDir = -aimDir;
      beep(440, 0.05, &#x27;square&#x27;);
      e.preventDefault();
    }
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { launch(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  makeStars(); randPlanet(); buildField(11); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
