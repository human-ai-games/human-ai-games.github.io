&lt;script&gt;

  var UNIT_W = 46, BOX_H = 40, BOX_SPEED = 2.6;

  function makeBox(x, units, dir) {

  function tryMerge() {

          a.dir = newDir;

    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }
