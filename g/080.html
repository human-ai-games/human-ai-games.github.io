&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON STRIKER&lt;/h1&gt;

            &lt;stop offset=&quot;1&quot; stop-color=&quot;#1b2f7a&quot;/&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 44, SHIP_H = 40, SHIP_BOTTOM = 14, SHIP_SPEED = 6;
  var BULLET_W = 6, BULLET_H = 16, BULLET_SPEED = 8;
  var TARGET_SIZE = 38;

  var DIFFICULTY = {
    easy:   { speed: 1.5, spawn: 1400 },
    normal: { speed: 2.4, spawn: 1000 },
    hard:   { speed: 3.4, spawn: 650 }
  };
  var currentLevel = &#x27;easy&#x27;;
  var TARGET_SPEED = DIFFICULTY[currentLevel].speed;
  var SPAWN_INTERVAL = DIFFICULTY[currentLevel].spawn;

  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [];
  var score = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var lvlBtns = document.querySelectorAll(&#x27;.lvl&#x27;);

  lvlBtns.forEach(function (btn) {
    btn.addEventListener(&#x27;click&#x27;, function () {
      currentLevel = btn.getAttribute(&#x27;data-lvl&#x27;);
      lvlBtns.forEach(function (b) { b.classList.remove(&#x27;active&#x27;); });
      btn.classList.add(&#x27;active&#x27;);
      TARGET_SPEED = DIFFICULTY[currentLevel].speed;
      SPAWN_INTERVAL = DIFFICULTY[currentLevel].spawn;
    });
  });

  var actx = null;
  function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {} } return actx; }
  function beep(freq, dur, type, vol) {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(a.destination);
    var now = a.currentTime;
    g.gain.setValueAtTime(vol || 0.08, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur);
  }
  function laserSound() { beep(880, 0.12, &#x27;sawtooth&#x27;, 0.05); }
  function boomSound() {
    var a = audio(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = &#x27;triangle&#x27;; o.frequency.setValueAtTime(300, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(60, a.currentTime + 0.3);
    g.gain.setValueAtTime(0.12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.3);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.3);
  }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
    laserSound();
  }

  function explosion(x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;boom&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
    boomSound();
  }

  function gameOver() {
    finalScoreEl.textContent = &#x27;Score: &#x27; + score;
    overlay.classList.add(&#x27;show&#x27;);
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    var shipY = FIELD_H - SHIP_BOTTOM - SHIP_H;
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      if (t.x &lt; shipX + SHIP_W &amp;&amp; t.x + TARGET_SIZE &gt; shipX &amp;&amp;
          t.y &lt; shipY + SHIP_H &amp;&amp; t.y + TARGET_SIZE &gt; shipY) {
        explosion(t.x, t.y);
        gameOver();
        return;
      }
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          explosion(t2.x, t2.y);
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += 1;
          scoreEl.textContent = score;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bullets = []; targets = [];
  }

  function startGame() {
    clearAll();
    overlay.classList.remove(&#x27;show&#x27;);
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    // Lock in difficulty settings for this run
    TARGET_SPEED = DIFFICULTY[currentLevel].speed;
    SPAWN_INTERVAL = DIFFICULTY[currentLevel].spawn;
    paintShip();
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    running = true;
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    spawnTarget();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
