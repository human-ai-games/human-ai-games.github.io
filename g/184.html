&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 380;
  var SHIP_W = 34, SHIP_H = 30, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 7;
  var TARGET_SIZE = 34;
  var BASE_TARGET_SPEED = 1.8;
  var BASE_SPAWN_INTERVAL = 1200;
  var HITS_PER_LEVEL = 10;
  var POWER_SPEED = 2.2, POWER_SIZE = 30;
  var TRIPLE_DURATION = 8000; // ms

  var running = false, animId = null, spawnId = null, powerSpawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], powerups = [];
  var score = 0, level = 1, hitsThisLevel = 0, lives = 3;
  var targetSpeed = BASE_TARGET_SPEED, spawnInterval = BASE_SPAWN_INTERVAL;
  var lastShot = 0;
  var tripleUntil = 0, hasShield = false;

  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var powerEl = document.getElementById(&#x27;power&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;);
  var shieldRing = document.getElementById(&#x27;shieldring&#x27;);
  var gameoverEl = document.getElementById(&#x27;gameover&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  var ROCKS = [&#x27;🪨&#x27;,&#x27;☄️&#x27;,&#x27;🌑&#x27;,&#x27;💫&#x27;];
  (function makeStars() {
    for (var i = 0; i &lt; 70; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      var size = Math.random() * 2 + 1;
      s.style.width = size + &#x27;px&#x27;;
      s.style.height = size + &#x27;px&#x27;;
      s.style.left = (Math.random() * FIELD_W) + &#x27;px&#x27;;
      s.style.top = (Math.random() * FIELD_H) + &#x27;px&#x27;;
      s.style.animationDuration = (1.5 + Math.random() * 3) + &#x27;s&#x27;;
      s.style.animationDelay = (Math.random() * 3) + &#x27;s&#x27;;
      field.appendChild(s);
    }
  })();

  function paintShip() {
    ship.style.left = shipX + &#x27;px&#x27;;
    shieldRing.style.left = (shipX + SHIP_W / 2 - 26) + &#x27;px&#x27;;
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    livesEl.textContent = lives &gt; 0 ? Array(lives + 1).join(&#x27;♥&#x27;) : &#x27;—&#x27;;
    var now = Date.now();
    var parts = [];
    if (now &lt; tripleUntil) parts.push(&#x27;⚡Triple&#x27;);
    if (hasShield) parts.push(&#x27;🛡️Shield&#x27;);
    powerEl.textContent = parts.length ? parts.join(&#x27; &#x27;) : &#x27;—&#x27;;
    shieldRing.style.display = hasShield ? &#x27;block&#x27; : &#x27;none&#x27;;
  }

  function showBanner(txt, color) {
    bannerEl.textContent = txt;
    if (color) bannerEl.style.color = color;
    bannerEl.classList.remove(&#x27;show&#x27;);
    void bannerEl.offsetWidth;
    bannerEl.classList.add(&#x27;show&#x27;);
  }

  function applyLevelSettings() {
    targetSpeed = BASE_TARGET_SPEED + (level - 1) * 0.55;
    spawnInterval = Math.max(380, BASE_SPAWN_INTERVAL - (level - 1) * 110);
    if (spawnId) { clearInterval(spawnId); spawnId = setInterval(spawnTarget, spawnInterval); }
  }

  function levelUp() {
    level += 1;
    applyLevelSettings();
    showBanner(&#x27;LEVEL &#x27; + level + &#x27;!&#x27;, &#x27;#ffe27a&#x27;);
    updateHud();
  }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.textContent = ROCKS[Math.floor(Math.random() * ROCKS.length)];
    el.style.fontSize = &#x27;28px&#x27;;
    el.style.lineHeight = TARGET_SIZE + &#x27;px&#x27;;
    el.style.textAlign = &#x27;center&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnPowerup() {
    var kind = Math.random() &lt; 0.5 ? &#x27;triple&#x27; : &#x27;shield&#x27;;
    var p = { x: Math.random() * (FIELD_W - POWER_SIZE), y: -POWER_SIZE, kind: kind, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.textContent = kind === &#x27;triple&#x27; ? &#x27;⚡&#x27; : &#x27;🛡️&#x27;;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
  }

  function fireBullets() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var cx = shipX + SHIP_W / 2 - BULLET_W / 2;
    var topY = FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H;
    var specs;
    if (now &lt; tripleUntil) specs = [{x: cx, vx: 0}, {x: cx, vx: -2.2}, {x: cx, vx: 2.2}];
    else specs = [{x: cx, vx: 0}];
    specs.forEach(function (sp) {
      var b = { x: sp.x, y: topY, vx: sp.vx, el: null };
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;bullet&#x27;;
      el.style.left = b.x + &#x27;px&#x27;;
      el.style.top = b.y + &#x27;px&#x27;;
      field.appendChild(el);
      b.el = el;
      bullets.push(b);
    });
  }

  function loseLife() {
    if (hasShield) {
      hasShield = false;
      showBanner(&#x27;SHIELD DOWN&#x27;, &#x27;#5adcff&#x27;);
      updateHud();
      return;
    }
    lives -= 1;
    updateHud();
    if (lives &lt;= 0) endGame();
    else showBanner(&#x27;-1 LIFE&#x27;, &#x27;#ff6b6b&#x27;);
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      b.x += b.vx;
      if (b.y + BULLET_H &lt; 0 || b.x &lt; -10 || b.x &gt; FIELD_W + 10) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
      b.el.style.left = b.x + &#x27;px&#x27;;
    }

    var shipTop = FIELD_H - SHIP_BOTTOM - SHIP_H;
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += targetSpeed;
      // hit the ship?
      if (t.y + TARGET_SIZE &gt; shipTop &amp;&amp; t.x &lt; shipX + SHIP_W &amp;&amp; t.x + TARGET_SIZE &gt; shipX) {
        field.removeChild(t.el); targets.splice(j, 1);
        loseLife();
        if (!running) return;
        continue;
      }
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }

    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.y += POWER_SPEED;
      // collect?
      if (pu.y + POWER_SIZE &gt; shipTop &amp;&amp; pu.x &lt; shipX + SHIP_W &amp;&amp; pu.x + POWER_SIZE &gt; shipX) {
        if (pu.kind === &#x27;triple&#x27;) { tripleUntil = now + TRIPLE_DURATION; showBanner(&#x27;⚡ TRIPLE SHOT!&#x27;, &#x27;#ffd24d&#x27;); }
        else { hasShield = true; showBanner(&#x27;🛡️ SHIELD UP!&#x27;, &#x27;#5adcff&#x27;); }
        field.removeChild(pu.el); powerups.splice(p, 1);
        updateHud();
        continue;
      }
      if (pu.y &gt; FIELD_H) { field.removeChild(pu.el); powerups.splice(p, 1); continue; }
      pu.el.style.top = pu.y + &#x27;px&#x27;;
    }

    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += 1;
          hitsThisLevel += 1;
          if (hitsThisLevel &gt;= HITS_PER_LEVEL) { hitsThisLevel = 0; levelUp(); }
          updateHud();
          break;
        }
      }
    }

    if (tripleUntil &amp;&amp; now &gt;= tripleUntil) { tripleUntil = 0; updateHud(); }

    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    powerups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    bullets = []; targets = []; powerups = [];
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (powerSpawnId) { clearInterval(powerSpawnId); powerSpawnId = null; }
    finalScoreEl.textContent = &#x27;Score: &#x27; + score + &#x27;  •  Level &#x27; + level;
    gameoverEl.classList.add(&#x27;show&#x27;);
  }

  function startGame() {
    if (running) return;
    clearAll();
    gameoverEl.classList.remove(&#x27;show&#x27;);
    score = 0; level = 1; hitsThisLevel = 0; lives = 3;
    tripleUntil = 0; hasShield = false;
    targetSpeed = BASE_TARGET_SPEED;
    spawnInterval = BASE_SPAWN_INTERVAL;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    updateHud();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, spawnInterval);
    powerSpawnId = setInterval(spawnPowerup, 6000);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (powerSpawnId) { clearInterval(powerSpawnId); powerSpawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) fireBullets(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  paintShip();
  updateHud();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
