<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Soldier Jumper</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; background: linear-gradient(#bfe3ff, #eaf6ff); border-radius: 8px; overflow: hidden; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #8a9a5b; }
  .hero { position: absolute; width: 52px; height: 46px; }
  .obstacle { position: absolute; width: 28px; bottom: 30px; }
  .chopper { position: absolute; width: 60px; height: 30px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Soldier Jumper&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click the field) to make the armed girl soldier jump over spikes and dodge enemy choppers coming from the right. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hero&quot; id=&quot;hero&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var GROUND_H = 30, HERO_W = 52, HERO_H = 46;
  var GRAVITY = 0.6, JUMP_V = -15;
  var OBSTACLE_W = 28, OBSTACLE_H = 32, OBSTACLE_SPEED = 4.0;
  var CHOPPER_W = 60, CHOPPER_H = 30, CHOPPER_SPEED = 5.0;
  var SPAWN_INTERVAL = 2000;
  var running = false, animId = null, spawnId = null;
  var heroX = 60;
  var heroY = FIELD_H - GROUND_H - HERO_H;
  var heroVY = 0;
  var obstacles = [];
  var choppers = [];
  var score = 0;
  var gameOver = false;
  var spawnCount = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var hero = document.getElementById(&#x27;hero&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // Girl soldier holding a rifle, drawn as inline SVG.
  hero.innerHTML =
    &#x27;&lt;svg viewBox=&quot;0 0 52 46&quot; width=&quot;52&quot; height=&quot;46&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&#x27; +
      &#x27;&lt;path d=&quot;M11 8 Q11 2 20 2 Q29 2 29 8 L29 20 Q29 22 26 22 L14 22 Q11 22 11 20 Z&quot; fill=&quot;#6b4226&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M9 9 Q9 1 20 1 Q31 1 31 9 L31 12 L9 12 Z&quot; fill=&quot;#3e5b28&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;8&quot; y=&quot;11&quot; width=&quot;24&quot; height=&quot;3&quot; rx=&quot;1.5&quot; fill=&quot;#2e4620&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;7&quot; r=&quot;2.2&quot; fill=&quot;#e2c044&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;13&quot; y=&quot;13&quot; width=&quot;14&quot; height=&quot;12&quot; rx=&quot;4&quot; fill=&quot;#f1c9a5&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;17&quot; cy=&quot;18&quot; r=&quot;1.3&quot; fill=&quot;#333&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;23&quot; cy=&quot;18&quot; r=&quot;1.3&quot; fill=&quot;#333&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M17 21 Q20 23 23 21&quot; stroke=&quot;#a05a3a&quot; stroke-width=&quot;1&quot; fill=&quot;none&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;12&quot; y=&quot;24&quot; width=&quot;16&quot; height=&quot;14&quot; rx=&quot;3&quot; fill=&quot;#4a6b2a&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;12&quot; y=&quot;33&quot; width=&quot;16&quot; height=&quot;3&quot; fill=&quot;#33481d&quot;/&gt;&#x27; +
      // back arm
      &#x27;&lt;rect x=&quot;8&quot; y=&quot;25&quot; width=&quot;5&quot; height=&quot;10&quot; rx=&quot;2&quot; fill=&quot;#3e5b28&quot;/&gt;&#x27; +
      // legs
      &#x27;&lt;rect x=&quot;13&quot; y=&quot;37&quot; width=&quot;5&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#33481d&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;22&quot; y=&quot;37&quot; width=&quot;5&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#33481d&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;12&quot; y=&quot;43&quot; width=&quot;7&quot; height=&quot;3&quot; rx=&quot;1.5&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;21&quot; y=&quot;43&quot; width=&quot;7&quot; height=&quot;3&quot; rx=&quot;1.5&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      // rifle held out front
      &#x27;&lt;rect x=&quot;27&quot; y=&quot;27&quot; width=&quot;22&quot; height=&quot;4&quot; rx=&quot;1&quot; fill=&quot;#2b2b2b&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;46&quot; y=&quot;28&quot; width=&quot;6&quot; height=&quot;2&quot; fill=&quot;#555&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;30&quot; y=&quot;30&quot; width=&quot;4&quot; height=&quot;6&quot; fill=&quot;#4a3b2a&quot;/&gt;&#x27; +
      // front arm holding rifle
      &#x27;&lt;rect x=&quot;27&quot; y=&quot;26&quot; width=&quot;5&quot; height=&quot;9&quot; rx=&quot;2&quot; fill=&quot;#3e5b28&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;

  function paintHero() {
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;
  }

  function makeSpikeEl(x, h) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.height = h + &#x27;px&#x27;;
    el.style.display = &#x27;flex&#x27;;
    el.style.alignItems = &#x27;flex-end&#x27;;
    var half = OBSTACLE_W / 2;
    for (var s = 0; s &lt; 2; s++) {
      var tri = document.createElement(&#x27;div&#x27;);
      tri.style.width = &#x27;0&#x27;;
      tri.style.height = &#x27;0&#x27;;
      tri.style.borderLeft = (half / 2) + &#x27;px solid transparent&#x27;;
      tri.style.borderRight = (half / 2) + &#x27;px solid transparent&#x27;;
      tri.style.borderBottom = h + &#x27;px solid #d32f2f&#x27;;
      el.appendChild(tri);
    }
    return el;
  }

  // Enemy helicopter, drawn as inline SVG.
  function makeChopperEl(x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;chopper&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    el.innerHTML =
      &#x27;&lt;svg viewBox=&quot;0 0 60 30&quot; width=&quot;60&quot; height=&quot;30&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&#x27; +
        &#x27;&lt;rect x=&quot;4&quot; y=&quot;2&quot; width=&quot;46&quot; height=&quot;2&quot; rx=&quot;1&quot; fill=&quot;#444&quot;/&gt;&#x27; +   // rotor blade
        &#x27;&lt;rect x=&quot;26&quot; y=&quot;4&quot; width=&quot;2&quot; height=&quot;4&quot; fill=&quot;#444&quot;/&gt;&#x27; +          // mast
        &#x27;&lt;ellipse cx=&quot;24&quot; cy=&quot;16&quot; rx=&quot;18&quot; ry=&quot;8&quot; fill=&quot;#556b2f&quot;/&gt;&#x27; +       // body
        &#x27;&lt;path d=&quot;M40 14 L58 18 L40 20 Z&quot; fill=&quot;#556b2f&quot;/&gt;&#x27; +              // tail
        &#x27;&lt;rect x=&quot;54&quot; y=&quot;12&quot; width=&quot;2&quot; height=&quot;8&quot; fill=&quot;#444&quot;/&gt;&#x27; +         // tail rotor
        &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;15&quot; r=&quot;4&quot; fill=&quot;#9fd0ff&quot;/&gt;&#x27; +                 // cockpit glass
        &#x27;&lt;rect x=&quot;12&quot; y=&quot;23&quot; width=&quot;24&quot; height=&quot;2&quot; rx=&quot;1&quot; fill=&quot;#333&quot;/&gt;&#x27; + // skid
      &#x27;&lt;/svg&gt;&#x27;;
    return el;
  }

  function spawnObstacle() {
    spawnCount++;
    // every 3rd spawn is a chopper, otherwise spikes
    if (spawnCount % 3 === 0) {
      // chopper hovers at a height the standing soldier hits — must be avoided
      var cy = FIELD_H - GROUND_H - CHOPPER_H - 18;
      var c = { x: FIELD_W, y: cy, scored: false, el: null };
      c.el = makeChopperEl(c.x, c.y);
      field.appendChild(c.el);
      choppers.push(c);
    } else {
      var o = { x: FIELD_W, h: OBSTACLE_H, scored: false, el: null };
      o.el = makeSpikeEl(o.x, o.h);
      field.appendChild(o.el);
      obstacles.push(o);
    }
  }

  function jump() {
    if (!running || gameOver) return;
    if (heroY &gt;= FIELD_H - GROUND_H - HERO_H - 1) heroVY = JUMP_V;
  }

  function tick() {
    if (!running) return;
    heroVY += GRAVITY;
    heroY += heroVY;
    var floorY = FIELD_H - GROUND_H - HERO_H;
    if (heroY &gt; floorY) { heroY = floorY; heroVY = 0; }
    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }
    paintHero();

    // spikes
    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= OBSTACLE_SPEED;
      o.el.style.left = o.x + &#x27;px&#x27;;
      if (o.x + OBSTACLE_W &lt; 0) {
        field.removeChild(o.el);
        obstacles.splice(i, 1);
        continue;
      }
      if (!o.scored &amp;&amp; o.x + OBSTACLE_W &lt; heroX) {
        o.scored = true;
        score += 1;
        scoreEl.textContent = score;
      }
      var obstacleTop = FIELD_H - GROUND_H - o.h;
      if (heroX + HERO_W - 8 &gt; o.x + 4 &amp;&amp; heroX + 6 &lt; o.x + OBSTACLE_W - 4 &amp;&amp;
          heroY + HERO_H &gt; obstacleTop + 6) {
        gameOver = true; stopGame(); return;
      }
    }

    // choppers
    for (var j = choppers.length - 1; j &gt;= 0; j--) {
      var c = choppers[j];
      c.x -= CHOPPER_SPEED;
      c.el.style.left = c.x + &#x27;px&#x27;;
      if (c.x + CHOPPER_W &lt; 0) {
        field.removeChild(c.el);
        choppers.splice(j, 1);
        continue;
      }
      if (!c.scored &amp;&amp; c.x + CHOPPER_W &lt; heroX) {
        c.scored = true;
        score += 1;
        scoreEl.textContent = score;
      }
      // rectangular hitbox for chopper
      if (heroX + HERO_W - 8 &gt; c.x + 6 &amp;&amp; heroX + 6 &lt; c.x + CHOPPER_W - 6 &amp;&amp;
          heroY + HERO_H &gt; c.y + 6 &amp;&amp; heroY &lt; c.y + CHOPPER_H - 4) {
        gameOver = true; stopGame(); return;
      }
    }

    animId = requestAnimationFrame(tick);
  }

  function clearObstacles() {
    obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    obstacles = [];
    choppers.forEach(function (c) { if (c.el.parentNode) c.el.parentNode.removeChild(c.el); });
    choppers = [];
  }

  function placeInitialObstacle() {
    clearObstacles();
    var o = { x: FIELD_W - OBSTACLE_W - 8, h: OBSTACLE_H, scored: false, el: null };
    o.el = makeSpikeEl(o.x, o.h);
    field.appendChild(o.el);
    obstacles.push(o);
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    heroX = 60;
    heroY = FIELD_H - GROUND_H - HERO_H;
    heroVY = 0;
    gameOver = false;
    spawnCount = 0;
    paintHero();
    clearObstacles();
    spawnObstacle();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnObstacle, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      jump();
      e.preventDefault();
    }
  });
  field.addEventListener(&#x27;click&#x27;, function () { jump(); });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintHero();
  placeInitialObstacle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
