<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroid Blaster</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Asteroid Blaster</b> &middot; Game 113 &middot; Professional producer &middot; Basic game: Space shooter</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; justify-content: space-between; align-items: center; }
  .score { font-size: 20px; color: #555; margin: 0; }
  .hearts { font-size: 22px; letter-spacing: 2px; }
  .powinfo { font-size: 15px; color: #d05; height: 18px; font-weight: 600; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: #05060f; border-radius: 8px; overflow: hidden; }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  .ship { position: absolute; bottom: 12px; filter: drop-shadow(0 0 6px #4dff7a); z-index: 5; }
  .bullet { position: absolute; width: 5px; height: 12px; background: #ffe23d; border-radius: 2px; box-shadow: 0 0 6px #ffe23d; }
  .laser { position: absolute; width: 8px; background: rgba(255,60,80,0.85); box-shadow: 0 0 14px #ff3c50; border-radius: 4px; }
  .target { position: absolute; }
  .target svg { display: block; animation: spin 4s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .powerup { position: absolute; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; animation: bob 1s ease-in-out infinite alternate; z-index: 4; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(4px); } }
  .pu-B { background: radial-gradient(#7fd0ff, #1c7cd6); box-shadow: 0 0 10px #4aa8ff; }
  .pu-S { background: radial-gradient(#ffc46b, #e07a15); box-shadow: 0 0 10px #ffab3d; }
  .pu-L { background: radial-gradient(#ff8093, #d61c34); box-shadow: 0 0 10px #ff4a5f; }
  .boom { position: absolute; pointer-events: none; z-index: 6; }
  .boom span { position: absolute; left: 0; top: 0; width: 6px; height: 6px; border-radius: 50%; background: #ffb028; box-shadow: 0 0 6px #ff7a1a; }
  @keyframes flash { 0% { transform: scale(0.3); opacity: 1; background:#fff; } 60% { background:#ffb028; } 100% { transform: scale(2.2); opacity: 0; } }
  .boom .flash { border-radius: 50%; background: #fff; animation: flash 0.4s ease-out forwards; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Asteroid Blaster&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Fly with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and press &lt;strong&gt;Space&lt;/strong&gt; to shoot. Small rocks break in one hit, dark rocks take three, and big rocks split into two — grab &lt;strong&gt;B&lt;/strong&gt;/&lt;strong&gt;S&lt;/strong&gt;/&lt;strong&gt;L&lt;/strong&gt; power-ups and protect your hearts!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;powinfo&quot; id=&quot;powinfo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hearts&quot; id=&quot;hearts&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;stars&quot; width=&quot;620&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 34, SHIP_H = 30, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 8;
  var SPAWN_INTERVAL = 1100;
  var POWERUP_SIZE = 26, POWERUP_SPEED = 1.4;
  var running = false, animId = null, spawnId = null, powId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], powerups = [], lasers = [];
  var score = 0, lives = 3;
  var lastShot = 0;
  var powerType = null, powerUntil = 0;
  var invulnUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var heartsEl = document.getElementById(&#x27;hearts&#x27;);
  var powinfoEl = document.getElementById(&#x27;powinfo&#x27;);

  // Starfield background
  var starCanvas = document.getElementById(&#x27;stars&#x27;);
  var sctx = starCanvas.getContext(&#x27;2d&#x27;);
  var stars = [];
  for (var s = 0; s &lt; 90; s++) {
    stars.push({ x: Math.random() * FIELD_W, y: Math.random() * FIELD_H,
                 r: Math.random() * 1.4 + 0.3, sp: Math.random() * 0.6 + 0.2 });
  }
  function drawStars() {
    sctx.fillStyle = &#x27;#05060f&#x27;;
    sctx.fillRect(0, 0, FIELD_W, FIELD_H);
    for (var i = 0; i &lt; stars.length; i++) {
      var st = stars[i];
      if (running) { st.y += st.sp; if (st.y &gt; FIELD_H) { st.y = 0; st.x = Math.random() * FIELD_W; } }
      sctx.fillStyle = &#x27;rgba(255,255,255,&#x27; + (0.4 + st.r * 0.4) + &#x27;)&#x27;;
      sctx.beginPath();
      sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      sctx.fill();
    }
  }

  ship.innerHTML = &#x27;&lt;svg width=&quot;34&quot; height=&quot;30&quot; viewBox=&quot;0 0 34 30&quot;&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;17,0 24,20 17,15 10,20&quot; fill=&quot;#5dff8f&quot; stroke=&quot;#1faf4c&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;6,28 12,16 17,15 17,24&quot; fill=&quot;#2fd066&quot;/&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;28,28 22,16 17,15 17,24&quot; fill=&quot;#2fd066&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;14&quot; y=&quot;10&quot; width=&quot;6&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#bfffdc&quot;/&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;15,24 19,24 17,30&quot; fill=&quot;#ffb028&quot;/&gt;&lt;/svg&gt;&#x27;;

  // Asteroid types
  // small: 1 hit, medium(tough): 3 hits dark, big: 2 hits then splits into 2 smalls
  var TYPES = {
    small:  { size: 26, hp: 1, fill: &#x27;#8a8577&#x27;, stroke: &#x27;#5c584c&#x27;, score: 1 },
    tough:  { size: 34, hp: 3, fill: &#x27;#4a4740&#x27;, stroke: &#x27;#2a2823&#x27;, score: 3 },
    big:    { size: 52, hp: 2, fill: &#x27;#9a8f78&#x27;, stroke: &#x27;#655c48&#x27;, score: 2, splits: true }
  };

  function asteroidSVG(size, fill, stroke, damageFrac) {
    var v = 34;
    var cracks = &#x27;&#x27;;
    if (damageFrac &gt; 0.33) cracks += &#x27;&lt;line x1=&quot;10&quot; y1=&quot;8&quot; x2=&quot;20&quot; y2=&quot;20&quot; stroke=&quot;#20201c&quot; stroke-width=&quot;1.4&quot;/&gt;&#x27;;
    if (damageFrac &gt; 0.66) cracks += &#x27;&lt;line x1=&quot;26&quot; y1=&quot;10&quot; x2=&quot;16&quot; y2=&quot;26&quot; stroke=&quot;#20201c&quot; stroke-width=&quot;1.4&quot;/&gt;&#x27;;
    return &#x27;&lt;svg width=&quot;&#x27; + size + &#x27;&quot; height=&quot;&#x27; + size + &#x27;&quot; viewBox=&quot;0 0 &#x27; + v + &#x27; &#x27; + v + &#x27;&quot;&gt;&#x27; +
      &#x27;&lt;polygon points=&quot;17,2 27,6 32,15 30,26 20,32 9,31 3,22 2,11 8,4&quot; fill=&quot;&#x27; + fill + &#x27;&quot; stroke=&quot;&#x27; + stroke + &#x27;&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;13&quot; cy=&quot;14&quot; r=&quot;3&quot; fill=&quot;rgba(0,0,0,0.25)&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;22&quot; cy=&quot;20&quot; r=&quot;2.5&quot; fill=&quot;rgba(0,0,0,0.25)&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;10&quot; r=&quot;1.8&quot; fill=&quot;rgba(0,0,0,0.25)&quot;/&gt;&#x27; + cracks + &#x27;&lt;/svg&gt;&#x27;;
  }

  function paintShip() {
    ship.style.left = shipX + &#x27;px&#x27;;
    ship.style.opacity = (Date.now() &lt; invulnUntil &amp;&amp; Math.floor(Date.now() / 100) % 2) ? &#x27;0.35&#x27; : &#x27;1&#x27;;
  }
  function updateHearts() {
    heartsEl.textContent = lives &gt; 0 ? &#x27;❤️&#x27;.repeat(lives) + &#x27;🖤&#x27;.repeat(3 - lives) : &#x27;🖤🖤🖤&#x27;;
  }
  function updatePowInfo() {
    if (powerType &amp;&amp; Date.now() &lt; powerUntil) {
      var names = { B: &#x27;BURST&#x27;, S: &#x27;SHOTGUN&#x27;, L: &#x27;LASER&#x27; };
      var rem = Math.ceil((powerUntil - Date.now()) / 1000);
      powinfoEl.textContent = names[powerType] + &#x27; &#x27; + rem + &#x27;s&#x27;;
    } else { powerType = null; powinfoEl.textContent = &#x27;&#x27;; }
  }

  function makeTarget(typeName, x, y, vx) {
    var cfg = TYPES[typeName];
    var t = { type: typeName, size: cfg.size, hp: cfg.hp, maxhp: cfg.hp,
              x: x, y: y, vx: vx, vy: 1.4 + Math.random() * 1.2, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.width = cfg.size + &#x27;px&#x27;;
    el.style.height = cfg.size + &#x27;px&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    el.innerHTML = asteroidSVG(cfg.size, cfg.fill, cfg.stroke, 0);
    el.firstChild.style.animationDuration = (2 + Math.random() * 4) + &#x27;s&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
    return t;
  }

  function spawnTarget() {
    var r = Math.random();
    var typeName = r &lt; 0.5 ? &#x27;small&#x27; : (r &lt; 0.78 ? &#x27;tough&#x27; : &#x27;big&#x27;);
    var cfg = TYPES[typeName];
    var x = Math.random() * (FIELD_W - cfg.size);
    makeTarget(typeName, x, -cfg.size, (Math.random() - 0.5) * 3);
  }

  function redrawTarget(t) {
    var cfg = TYPES[t.type];
    var dmg = 1 - t.hp / t.maxhp;
    t.el.innerHTML = asteroidSVG(cfg.size, cfg.fill, cfg.stroke, dmg);
    t.el.firstChild.style.animationDuration = (2 + Math.random() * 3) + &#x27;s&#x27;;
  }

  function spawnPowerup() {
    var types = [&#x27;B&#x27;, &#x27;S&#x27;, &#x27;L&#x27;];
    var type = types[Math.floor(Math.random() * types.length)];
    var p = { x: Math.random() * (FIELD_W - POWERUP_SIZE), y: -POWERUP_SIZE, type: type, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup pu-&#x27; + type;
    el.textContent = type;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
  }

  function explode(cx, cy, size) {
    var boom = document.createElement(&#x27;div&#x27;);
    boom.className = &#x27;boom&#x27;;
    boom.style.left = cx + &#x27;px&#x27;;
    boom.style.top = cy + &#x27;px&#x27;;
    var flash = document.createElement(&#x27;div&#x27;);
    flash.className = &#x27;flash&#x27;;
    var fs = size || 34;
    flash.style.width = fs + &#x27;px&#x27;; flash.style.height = fs + &#x27;px&#x27;;
    flash.style.left = (-fs / 2) + &#x27;px&#x27;; flash.style.top = (-fs / 2) + &#x27;px&#x27;;
    boom.appendChild(flash);
    var N = 8;
    for (var i = 0; i &lt; N; i++) {
      var p = document.createElement(&#x27;span&#x27;);
      var ang = (Math.PI * 2 * i) / N + Math.random() * 0.5;
      var dist = 18 + Math.random() * (size || 34) * 0.6;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      p.style.transition = &#x27;transform 0.5s ease-out, opacity 0.5s ease-out&#x27;;
      boom.appendChild(p);
      (function (pp, ddx, ddy) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            pp.style.transform = &#x27;translate(&#x27; + ddx + &#x27;px,&#x27; + ddy + &#x27;px)&#x27;;
            pp.style.opacity = &#x27;0&#x27;;
          });
        });
      })(p, dx, dy);
    }
    field.appendChild(boom);
    setTimeout(function () { if (boom.parentNode) boom.parentNode.removeChild(boom); }, 550);
  }

  function addBullet(x, vx) {
    var b = { x: x - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, vx: vx || 0, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function fire() {
    var now = Date.now();
    var cx = shipX + SHIP_W / 2;
    var active = powerType &amp;&amp; now &lt; powerUntil ? powerType : null;
    if (active === &#x27;L&#x27;) return;
    var rate = active === &#x27;B&#x27; ? 90 : 200;
    if (now - lastShot &lt; rate) return;
    lastShot = now;
    if (active === &#x27;S&#x27;) {
      addBullet(cx, -3); addBullet(cx, -1.2); addBullet(cx, 0);
      addBullet(cx, 1.2); addBullet(cx, 3);
    } else if (active === &#x27;B&#x27;) {
      addBullet(cx - 8, 0); addBullet(cx, 0); addBullet(cx + 8, 0);
    } else { addBullet(cx, 0); }
  }

  function damageTarget(idx) {
    var t = targets[idx];
    t.hp -= 1;
    if (t.hp &gt; 0) {
      redrawTarget(t);
      return;
    }
    // destroyed
    var cx = t.x + t.size / 2, cy = t.y + t.size / 2;
    explode(cx, cy, t.size);
    score += TYPES[t.type].score;
    scoreEl.textContent = score;
    var wasBig = TYPES[t.type].splits;
    var bx = t.x, by = t.y;
    field.removeChild(t.el);
    targets.splice(idx, 1);
    if (wasBig) {
      makeTarget(&#x27;small&#x27;, bx, by, -1.6 - Math.random());
      makeTarget(&#x27;small&#x27;, bx + 20, by, 1.6 + Math.random());
    }
  }

  function loseLife() {
    if (Date.now() &lt; invulnUntil) return;
    lives -= 1;
    updateHearts();
    invulnUntil = Date.now() + 1500;
    if (lives &lt;= 0) stopGame();
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    drawStars();
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();
    updatePowInfo();

    var laserActive = powerType === &#x27;L&#x27; &amp;&amp; now &lt; powerUntil &amp;&amp; keysDown[&#x27; &#x27;];
    lasers.forEach(function (l) { if (l.el.parentNode) l.el.parentNode.removeChild(l.el); });
    lasers = [];
    if (laserActive) {
      var lx = shipX + SHIP_W / 2 - 4;
      var beam = document.createElement(&#x27;div&#x27;);
      beam.className = &#x27;laser&#x27;;
      beam.style.left = lx + &#x27;px&#x27;;
      beam.style.top = &#x27;0px&#x27;;
      beam.style.height = (FIELD_H - SHIP_BOTTOM - SHIP_H) + &#x27;px&#x27;;
      field.appendChild(beam);
      lasers.push({ el: beam, x: lx });
      for (var lj = targets.length - 1; lj &gt;= 0; lj--) {
        var lt = targets[lj];
        if (lt.x &lt; lx + 8 &amp;&amp; lt.x + lt.size &gt; lx) damageTarget(lj);
      }
    }

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED; b.x += b.vx;
      if (b.y + BULLET_H &lt; 0 || b.x &lt; -10 || b.x &gt; FIELD_W + 10) {
        field.removeChild(b.el); bullets.splice(i, 1); continue;
      }
      b.el.style.top = b.y + &#x27;px&#x27;; b.el.style.left = b.x + &#x27;px&#x27;;
    }

    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += t.vy; t.x += t.vx;
      if (t.x &lt; 0) { t.x = 0; t.vx = Math.abs(t.vx); }
      if (t.x &gt; FIELD_W - t.size) { t.x = FIELD_W - t.size; t.vx = -Math.abs(t.vx); }
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;; t.el.style.left = t.x + &#x27;px&#x27;;
      var sx = shipX, sy = FIELD_H - SHIP_BOTTOM - SHIP_H;
      if (t.x &lt; sx + SHIP_W &amp;&amp; t.x + t.size &gt; sx &amp;&amp; t.y &lt; sy + SHIP_H &amp;&amp; t.y + t.size &gt; sy) {
        explode(t.x + t.size / 2, t.y + t.size / 2, t.size);
        field.removeChild(t.el); targets.splice(j, 1);
        loseLife();
        continue;
      }
    }

    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.y += POWERUP_SPEED;
      if (pu.y &gt; FIELD_H) { field.removeChild(pu.el); powerups.splice(p, 1); continue; }
      pu.el.style.top = pu.y + &#x27;px&#x27;;
      var sx2 = shipX, sy2 = FIELD_H - SHIP_BOTTOM - SHIP_H;
      if (pu.x &lt; sx2 + SHIP_W &amp;&amp; pu.x + POWERUP_SIZE &gt; sx2 &amp;&amp;
          pu.y &lt; sy2 + SHIP_H &amp;&amp; pu.y + POWERUP_SIZE &gt; sy2) {
        powerType = pu.type; powerUntil = now + 3000;
        field.removeChild(pu.el); powerups.splice(p, 1);
        updatePowInfo();
      }
    }

    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      var hit = false;
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + t2.size &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + t2.size &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          damageTarget(j2);
          hit = true;
          break;
        }
      }
      if (hit) continue;
    }

    if (keysDown[&#x27; &#x27;]) fire();
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    powerups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    lasers.forEach(function (l) { if (l.el.parentNode) l.el.parentNode.removeChild(l.el); });
