          &lt;path d=&quot;M40 44 q9 1 11 7 q-6 4 -12 1 z&quot; fill=&quot;#f0c19b&quot; stroke=&quot;#d9a578&quot; stroke-width=&quot;1.2&quot;/&gt;

&lt;script&gt;
  // Build a simple crowd of colored dots in the bleachers.
  (function buildCrowd() {
    var crowd = document.getElementById(&#x27;crowd&#x27;);
    if (!crowd) return;
    var svgNS = &#x27;http://www.w3.org/2000/svg&#x27;;
    var colors = [&#x27;#e2761a&#x27;, &#x27;#1f8c5a&#x27;, &#x27;#c8412a&#x27;, &#x27;#1f4e8c&#x27;, &#x27;#8a4fb0&#x27;, &#x27;#d1a01f&#x27;, &#x27;#e0e0e0&#x27;];
    function seat(x, y) {
      var c = document.createElementNS(svgNS, &#x27;circle&#x27;);
      c.setAttribute(&#x27;cx&#x27;, x);
      c.setAttribute(&#x27;cy&#x27;, y);
      c.setAttribute(&#x27;r&#x27;, 3.2);
      c.setAttribute(&#x27;fill&#x27;, colors[Math.floor(Math.random() * colors.length)]);
      crowd.appendChild(c);
    }
    var rows = [90, 108, 126, 144];
    rows.forEach(function (ry) {
      for (var x = 8; x &lt;= 84; x += 11) seat(x, ry);
      for (var x2 = 538; x2 &lt;= 614; x2 += 11) seat(x2, ry);
    });
  })();

  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var PADDLE_VISUAL_H = 60, PADDLE_VISUAL_BOTTOM = 6, BLADE_TOP_OFFSET = 8;
  var BALL_SIZE = 14;
  var BASE_SPEED = 2.2;
  var SPEED_STEP = 0.6;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BASE_SPEED, ballVY = BASE_SPEED;
  var score = 0;
  var speedLevel = 1;
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);

  var paddleTop = FIELD_H - PADDLE_VISUAL_BOTTOM - PADDLE_VISUAL_H + BLADE_TOP_OFFSET;

  function currentSpeed() {
    return BASE_SPEED + (speedLevel - 1) * SPEED_STEP;
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    var s = currentSpeed();
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * s;
    ballVY = s;
  }

  function applySpeed() {
    var s = currentSpeed();
    var mag = Math.sqrt(ballVX * ballVX + ballVY * ballVY) || 1;
    ballVX = (ballVX / mag) * s;
    ballVY = (ballVY / mag) * s;
  }

  function tick() {
    if (!running) return;
    var moving = 0;
    if (keysDown[&#x27;ArrowLeft&#x27;]) { paddleX -= PADDLE_SPEED; moving = -1; }
    if (keysDown[&#x27;ArrowRight&#x27;]) { paddleX += PADDLE_SPEED; moving = 1; }
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    if (moving === -1) paddle.classList.add(&#x27;flip&#x27;);
    else if (moving === 1) paddle.classList.remove(&#x27;flip&#x27;);

    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 10 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
      var newLevel = 1 + Math.floor(score / 10);
      if (newLevel !== speedLevel) {
        speedLevel = newLevel;
        speedEl.textContent = speedLevel;
        applySpeed();
      }
    }
    if (ballY &gt;= FIELD_H) resetBall();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0;
    speedLevel = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    speedEl.textContent = &#x27;1&#x27;;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
