<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .scorebar { display: flex; gap: 14px; align-items: stretch; }
  .stat { background: #1a1a2e; border-radius: 10px; padding: 6px 16px; text-align: center; min-width: 90px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .stat .label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #9aa; }
  .stat .val {

  }
  @keyframes rainbowShift { to { background-position: 300% 0; } }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the ship with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys, and press &lt;strong&gt;Space&lt;/strong&gt; to shoot. Chain quick hits to raise your multiplier and rack up a bigger rainbow score. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;scorebar&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat mult&quot;&gt;&lt;div class=&quot;label&quot;&gt;Multiplier&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;mult&quot;&gt;x1&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Best&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;best&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 380;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 12;
  var TARGET_SIZE = 34, TARGET_SPEED = 1.8;
  var SPAWN_INTERVAL = 1200;
  var FIRE_COOLDOWN = 100;
  var COMBO_WINDOW = 1500; // ms to keep the streak alive
  var RAINBOW = [&#x27;#ff004d&#x27;, &#x27;#ff8800&#x27;, &#x27;#ffee00&#x27;, &#x27;#00e436&#x27;, &#x27;#29adff&#x27;, &#x27;#7b2fbe&#x27;, &#x27;#ff77aa&#x27;];
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], particles = [], popups = [];
  var score = 0, best = 0, mult = 1, lastKill = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var multEl = document.getElementById(&#x27;mult&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function popScore(el) {
    el.classList.remove(&#x27;pop&#x27;);
    void el.offsetWidth;
    el.classList.add(&#x27;pop&#x27;);
  }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function explode(cx, cy) {
    for (var i = 0; i &lt; 18; i++) {
      var angle = (Math.PI * 2 * i) / 18 + Math.random() * 0.4;
      var speed = 2 + Math.random() * 3;
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;particle&#x27;;
      var color = RAINBOW[i % RAINBOW.length];
      el.style.background = color;
      el.style.boxShadow = &#x27;0 0 6px &#x27; + color;
      el.style.left = cx + &#x27;px&#x27;;
      el.style.top = cy + &#x27;px&#x27;;
      field.appendChild(el);
      particles.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, el: el });
    }
  }

  function floatPopup(cx, cy, points) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;popup&#x27;;
    el.textContent = &#x27;+&#x27; + points;
    el.style.color = RAINBOW[Math.floor(Math.random() * RAINBOW.length)];
    el.style.left = cx + &#x27;px&#x27;;
    el.style.top = cy + &#x27;px&#x27;;
    field.appendChild(el);
    popups.push({ x: cx, y: cy, life: 1, el: el });
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; FIRE_COOLDOWN) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function registerKill(cx, cy) {
    var now = Date.now();
    if (now - lastKill &lt; COMBO_WINDOW) {
      mult = Math.min(mult + 1, 9);
    } else {
      mult = 1;
    }
    lastKill = now;
    var points = 10 * mult;
    score += points;
    scoreEl.textContent = score;
    multEl.textContent = &#x27;x&#x27; + mult;
    popScore(scoreEl);
    if (mult &gt; 1) popScore(multEl);
    if (score &gt; best) { best = score; bestEl.textContent = best; }
    floatPopup(cx, cy, points);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();
    if (keysDown[&#x27; &#x27;]) spawnBullet();

    // Combo decay display
    if (mult &gt; 1 &amp;&amp; Date.now() - lastKill &gt; COMBO_WINDOW) {
      mult = 1;
      multEl.textContent = &#x27;x1&#x27;;
    }

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= 0.025;
      if (pt.life &lt;= 0) { field.removeChild(pt.el); particles.splice(p, 1); continue; }
      pt.el.style.left = pt.x + &#x27;px&#x27;; pt.el.style.top = pt.y + &#x27;px&#x27;; pt.el.style.opacity = pt.life;
    }
    for (var q = popups.length - 1; q &gt;= 0; q--) {
      var pu = popups[q];
      pu.y -= 1.2; pu.life -= 0.02;
      if (pu.life &lt;= 0) { field.removeChild(pu.el); popups.splice(q, 1); continue; }
      pu.el.style.top = pu.y + &#x27;px&#x27;; pu.el.style.opacity = pu.life;
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          var cx = t2.x + TARGET_SIZE / 2, cy = t2.y + TARGET_SIZE / 2;
          explode(cx, cy);
          registerKill(cx, cy);
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    particles.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    popups.forEach(function (u) { if (u.el.parentNode) u.el.parentNode.removeChild(u.el); });
    bullets = []; targets = []; particles = []; popups = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; mult = 1; lastKill = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    multEl.textContent = &#x27;x1&#x27;;
    bestEl.textContent = best;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    spawnTarget();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true; e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      keysDown[&#x27; &#x27;] = true;
      if (running) spawnBullet();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) keysDown[&#x27; &#x27;] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;
