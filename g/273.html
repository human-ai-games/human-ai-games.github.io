<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Whack-a-mole</b> &middot; Game 273 &middot; Amateur producer &middot; Basic game: Whack-a-mole</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; }
  .hud { display: flex; gap: 28px; align-items: center; justify-content: center; font-size: 22px; color: #555; }
  .hud .level { color: #b8570f; font-weight: 600; }

  .progress &gt; div { height: 100%; width: 0%; background: #3ba55c; transition: width 0.2s ease; }
  .board { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .mole { position: absolute; width: 68px; height: 68px; border-radius: 50%; background: #555; cursor: pointer; }
  .flower { position: absolute; font-size: 28px; pointer-events: none; will-change: transform, opacity; }
  .banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.6); font-size: 44px; font-weight: 700; color: #b8570f; opacity: 0; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.15); }
  .banner.show { animation: pop 1.1s ease; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    70% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Whack-a-mole&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the moles as they pop up to score points. Every 10 points advances you a level — moles get faster each time, so stay sharp!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;level&quot;&gt;Level &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;progress&quot;&gt;&lt;div id=&quot;progressBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;Level Up!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var BOARD_W = 620, BOARD_H = 400, MOLE_SIZE = 68;
  var POINTS_PER_LEVEL = 10;
  var FLOWERS = [&#x27;🌸&#x27;,&#x27;🌼&#x27;,&#x27;🌺&#x27;,&#x27;🌻&#x27;,&#x27;🌷&#x27;,&#x27;💐&#x27;,&#x27;🏵️&#x27;];
  var score = 0;
  var level = 1;
  var intervalId = null;
  var moleTimeouts = [];
  var running = false;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var progressBar = document.getElementById(&#x27;progressBar&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);

  function spawnInterval() { return Math.max(320, 900 - (level - 1) * 70); }
  function moleLife() { return Math.max(500, 1200 - (level - 1) * 90); }

  // --- Sound (procedural, Web Audio) ---
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
  }
  function playHit() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = &#x27;triangle&#x27;;
    osc.frequency.setValueAtTime(680, t);
    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.06);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.2);
  }
  function playMiss() {

    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = &#x27;sine&#x27;;
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + 0.25);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.32);
  }
  function playLevelUp() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i &lt; notes.length; i++) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var start = t + i * 0.09;
      osc.type = &#x27;square&#x27;;
      osc.frequency.setValueAtTime(notes[i], start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.18);
    }
  }

  // --- Flower burst effect ---
  function burstFlowers(cx, cy) {
    var count = 6;
    for (var i = 0; i &lt; count; i++) {
      var f = document.createElement(&#x27;div&#x27;);
      f.className = &#x27;flower&#x27;;
      f.textContent = FLOWERS[Math.floor(Math.random() * FLOWERS.length)];
      f.style.left = cx + &#x27;px&#x27;;
      f.style.top = cy + &#x27;px&#x27;;
      board.appendChild(f);
      var angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.6;
      var dist = 40 + Math.random() * 50;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 40; // bias upward
      (function (el, dx, dy) {
        var start = null;
        var dur = 800 + Math.random() * 300;
        function step(ts) {
          if (start === null) start = ts;
          var p = (ts - start) / dur;
          if (p &gt;= 1) { if (el.parentNode === board) board.removeChild(el); return; }
          var ease = 1 - Math.pow(1 - p, 2);
          el.style.transform = &#x27;translate(&#x27; + (dx * ease) + &#x27;px,&#x27; + (dy * ease + p * p * 60) + &#x27;px) rotate(&#x27; + (ease * 360) + &#x27;deg) scale(&#x27; + (1 - p * 0.3) + &#x27;)&#x27;;
          el.style.opacity = String(1 - p);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })(f, dx, dy);
    }
  }

  function updateProgress() {
    var inLevel = score % POINTS_PER_LEVEL;
    progressBar.style.width = (inLevel / POINTS_PER_LEVEL * 100) + &#x27;%&#x27;;
  }

  function levelUp() {
    level += 1;
    levelEl.textContent = level;
    playLevelUp();
    banner.classList.remove(&#x27;show&#x27;);
    void banner.offsetWidth;
    banner.classList.add(&#x27;show&#x27;);
    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(spawnMole, spawnInterval());
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var moles = board.querySelectorAll(&#x27;.mole, .flower&#x27;);
    for (var j = 0; j &lt; moles.length; j++) board.removeChild(moles[j]);
  }

  function spawnMole() {
    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27;;
    var mx = Math.random() * (BOARD_W - MOLE_SIZE);
    var my = Math.random() * (BOARD_H - MOLE_SIZE);
    mole.style.left = mx + &#x27;px&#x27;;
    mole.style.top = my + &#x27;px&#x27;;
    var hit = false;
    mole.addEventListener(&#x27;click&#x27;, function () {
      if (hit) return;
      hit = true;
      var prevLevelCount = Math.floor(score / POINTS_PER_LEVEL);
      score += 1;
      scoreEl.textContent = score;
      updateProgress();
      playHit();
      burstFlowers(mx + MOLE_SIZE / 2, my + MOLE_SIZE / 2);
      mole.style.background = &#x27;#3ba55c&#x27;;
      setTimeout(function () {
        if (mole.parentNode === board) board.removeChild(mole);
      }, 120);
      if (Math.floor(score / POINTS_PER_LEVEL) &gt; prevLevelCount) {
        levelUp();
      }
    });
    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (!hit &amp;&amp; mole.parentNode === board) {
        board.removeChild(mole);
        playMiss();
      }
    }, moleLife()));
  }

  function startGame() {
    if (running) return;
    running = true;
    ensureAudio();
    score = 0;
    level = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    levelEl.textContent = &#x27;1&#x27;;
    updateProgress();
    if (intervalId) clearInterval(intervalId);
    clearAllMoles();
    spawnMole();
    intervalId = setInterval(spawnMole, spawnInterval());
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllMoles();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
