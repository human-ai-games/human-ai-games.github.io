<html lang="en">

<title>Cross the road!</title>
<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Cross the road!</b> &middot; Game 318 &middot; Professional producer &middot; Basic game: Road crossing</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 3px #333; }
  .hero { position: absolute; font-size: 34px; line-height: 1; text-align: center; z-index: 5; transition: left 0.08s, top 0.08s; }
  .car { position: absolute; font-size: 34px; line-height: 1; text-align: center; }
  .lane-road { position: absolute; left: 0; right: 0; background: #555; }
  .lane-grass { position: absolute; left: 0; right: 0; background: #6bbf4a; }
  .lane-dash { position: absolute; height: 3px; background: repeating-linear-gradient(90deg, #fdd835 0 22px, transparent 22px 44px); }

  /* Explosion pieces */
  .boom-core { position: absolute; font-size: 40px; line-height: 1; text-align: center; z-index: 8;
    animation: boomCore 0.6s ease-out forwards; }
  @keyframes boomCore {
    0% { transform: scale(0.3); opacity: 1; }
    35% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; z-index: 7;
    animation: sparkFly 0.6s ease-out forwards; }
  @keyframes sparkFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cross the road!&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to hop your chicken across the road, dodging the cars. Reach the grass at the top to score — getting hit by a car ends the round.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var CAR_W = CELL * 2 - 12, CAR_H = CELL - 16;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var CARS = [&#x27;🚗&#x27;,&#x27;🚕&#x27;,&#x27;🚙&#x27;,&#x27;🚌&#x27;,&#x27;🚓&#x27;,&#x27;🚑&#x27;,&#x27;🚚&#x27;,&#x27;🏎️&#x27;];

  function buildBackground() {
    for (var r = 0; r &lt; ROWS; r++) {
      var isGrass = (r === 0 || r === ROWS - 1);
      var band = document.createElement(&#x27;div&#x27;);
      band.className = isGrass ? &#x27;lane-grass&#x27; : &#x27;lane-road&#x27;;
      band.style.top = (r * CELL) + &#x27;px&#x27;;
      band.style.height = CELL + &#x27;px&#x27;;
      field.appendChild(band);
      if (!isGrass &amp;&amp; r &lt; ROWS - 1) {
        var dash = document.createElement(&#x27;div&#x27;);
        dash.className = &#x27;lane-dash&#x27;;
        dash.style.top = ((r + 1) * CELL - 1.5) + &#x27;px&#x27;;
        field.appendChild(dash);
      }
    }
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - CAR_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.6 + (i % 3) * 0.25;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var emoji = CARS[i % CARS.length];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;car&#x27;;
        el.style.top = (laneRow * CELL) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.style.transform = dir &gt; 0 ? &#x27;scaleX(-1)&#x27; : &#x27;scaleX(1)&#x27;;
        el.textContent = emoji;
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🐔&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + 4;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function explodeAt(cx, cy) {
    var core = document.createElement(&#x27;div&#x27;);
    core.className = &#x27;boom-core&#x27;;
    core.textContent = &#x27;💥&#x27;;
    core.style.left = (cx - 20) + &#x27;px&#x27;;
    core.style.top = (cy - 20) + &#x27;px&#x27;;
    field.appendChild(core);

    var colors = [&#x27;#ff5722&#x27;,&#x27;#ffc107&#x27;,&#x27;#ff9800&#x27;,&#x27;#ffeb3b&#x27;,&#x27;#fff&#x27;];
    var N = 10;
    for (var s = 0; s &lt; N; s++) {
      var ang = (s / N) * Math.PI * 2;
      var dist = 34 + Math.random() * 22;
      var sp = document.createElement(&#x27;div&#x27;);
      sp.className = &#x27;spark&#x27;;
      sp.style.left = (cx - 4) + &#x27;px&#x27;;
      sp.style.top = (cy - 4) + &#x27;px&#x27;;
      sp.style.background = colors[s % colors.length];
      sp.style.setProperty(&#x27;--dx&#x27;, (Math.cos(ang) * dist).toFixed(1) + &#x27;px&#x27;);
      sp.style.setProperty(&#x27;--dy&#x27;, (Math.sin(ang) * dist).toFixed(1) + &#x27;px&#x27;);
      field.appendChild(sp);
    }

    setTimeout(function () {
      if (core.parentNode) core.parentNode.removeChild(core);
      var sparks = field.querySelectorAll(&#x27;.spark&#x27;);
      for (var q = 0; q &lt; sparks.length; q++) sparks[q].parentNode.removeChild(sparks[q]);
    }, 650);
  }

  function tick() {
    if (!running) return;
    var laneIdx = hero.row - 1;
    var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var hy = hero.row * CELL + 4;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -CAR_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + CAR_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
        if (i === laneIdx) {
          var carLeft = o.x + 6, carRight = o.x + CAR_W - 6;
          var heroLeft = hx + 4, heroRight = hx + HERO_SIZE - 4;
          if (heroLeft &lt; carRight &amp;&amp; heroRight &gt; carLeft) {
            var cx = Math.max(heroLeft, carLeft);
            cx = (Math.min(heroRight, carRight) + cx) / 2;
            explodeHero(cx, hy + HERO_SIZE / 2);
            return;
          }
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function explodeHero(cx, cy) {
    if (heroEl) heroEl.style.visibility = &#x27;hidden&#x27;;
    explodeAt(cx, cy);
    endGame();
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    buildBackground();
    buildLanes();
    makeHero();
    if (heroEl) heroEl.style.visibility = &#x27;visible&#x27;;
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint before Start.
  buildBackground();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;

<script>

  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {

    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
