  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>NEON DROP</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: &#x27;Segoe UI&#x27;, system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0b0e1a; color: #e8ecff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; background: radial-gradient(circle at 50% 0%, #1a2140 0%, #0b0e1a 70%); }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(90deg,#4dd0ff,#b388ff,#ff6ec7); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(120,150,255,0.4); }
  .instructions { font-size: 16px; color: #9aa4d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .goal { font-size: 15px; color: #6be0ff; font-weight: 700; margin: 0; text-align: center; text-shadow: 0 0 8px rgba(80,200,255,0.5); }
  .layout { display: flex; gap: 14px; align-items: flex-start; }
  .side { display: flex; flex-direction: column; gap: 8px; width: 96px; padding-top: 2px; }
  .stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(120,150,255,0.25); border-radius: 10px; padding: 5px 8px; font-size: 13px; color: #aeb6e6; text-align: center; }
  .stat b { display: block; font-size: 18px; color: #fff; }
  .next-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(120,150,255,0.25); border-radius: 10px; padding: 6px; text-align: center; font-size: 12px; color: #aeb6e6; }
  .next-canvas { position: relative; width: 78px; height: 78px; margin: 4px auto 0; }
  .combo { font-size: 13px; color: #ffd166; font-weight: 700; text-align: center; min-height: 16px; text-shadow: 0 0 8px rgba(255,209,102,0.6); }
  .progress-wrap { width: 260px; height: 12px; background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; border: 1px solid rgba(120,150,255,0.25); margin: 0 auto; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg,#39d98a,#6be0ff); box-shadow: 0 0 12px rgba(80,220,180,0.7); transition: width 0.25s; }
  .field { position: relative; width: 260px; height: 416px; flex-shrink: 0; margin: 0;
    background:
      linear-gradient(rgba(120,150,255,0.06) 1px, transparent 1px) 0 0 / 26px 26px,
      linear-gradient(90deg, rgba(120,150,255,0.06) 1px, transparent 1px) 0 0 / 26px 26px,
      #12152b;
    border-radius: 10px; overflow: hidden; border: 2px solid rgba(120,150,255,0.3); box-shadow: 0 0 30px rgba(80,120,255,0.25), inset 0 0 40px rgba(0,0,0,0.5); }
  .block { position: absolute; box-sizing: border-box; border-radius: 5px; }
  .block .shine { position: absolute; top: 3px; left: 3px; right: 40%; bottom: 55%; background: rgba(255,255,255,0.35); border-radius: 3px; }
  .ghost { position: absolute; box-sizing: border-box; border-radius: 5px; border: 2px dashed rgba(255,255,255,0.25); background: rgba(255,255,255,0.04); }
  .flash { position: absolute; left: 0; width: 100%; height: 26px; background: #fff; box-shadow: 0 0 25px #fff; animation: flashOut 0.28s ease-out forwards; z-index: 5; }
  @keyframes flashOut { 0% { opacity: 1; transform: scaleY(1);} 100% { opacity: 0; transform: scaleY(0.2);} }
  .msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(8,10,22,0.88); font-size: 28px; font-weight: 800; text-align: center; gap: 10px; backdrop-filter: blur(3px); z-index: 10; }
  .msg .big { background: linear-gradient(90deg,#4dd0ff,#ff6ec7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .msg small { font-size: 15px; font-weight: 400; color: #9aa4d0; line-height: 1.5; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON DROP&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;&lt;strong&gt;&amp;larr;&amp;rarr;&lt;/strong&gt; move, &lt;strong&gt;&amp;uarr;&lt;/strong&gt; rotate, &lt;strong&gt;&amp;darr;&lt;/strong&gt; soft drop, &lt;strong&gt;Space&lt;/strong&gt; hard drop. Clear full rows to fill the goal bar before the stack tops out!&lt;/p&gt;
  &lt;p class=&quot;goal&quot; id=&quot;goal&quot;&gt;Goal: clear 15 rows to win!&lt;/p&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;stat&quot;&gt;Rows&lt;b&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;/&lt;span id=&quot;target&quot;&gt;15&lt;/span&gt;&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;stat&quot;&gt;Level&lt;b id=&quot;level&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;stat&quot;&gt;Points&lt;b id=&quot;points&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
      &lt;div class=&quot;next-box&quot;&gt;NEXT&lt;div class=&quot;next-canvas&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;progress-wrap&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 26;
  var COLS = 10, ROWS = 16;
  var TARGET = 15;
  var DROP_MS = 500;
  var running = false, dropId = null;
  var grid = [];
  var piece = null, nextType = null;
  var score = 0, level = 1, points = 0;

  var COLORS = [
    { base: &#x27;#4dd0ff&#x27;, glow: &#x27;rgba(77,208,255,0.7)&#x27; },
    { base: &#x27;#ff6ec7&#x27;, glow: &#x27;rgba(255,110,199,0.7)&#x27; },
    { base: &#x27;#b388ff&#x27;, glow: &#x27;rgba(179,136,255,0.7)&#x27; },
    { base: &#x27;#39d98a&#x27;, glow: &#x27;rgba(57,217,138,0.7)&#x27; },
    { base: &#x27;#ffd166&#x27;, glow: &#x27;rgba(255,209,102,0.7)&#x27; },
    { base: &#x27;#ff8c42&#x27;, glow: &#x27;rgba(255,140,66,0.7)&#x27; },
    { base: &#x27;#ff5e7e&#x27;, glow: &#x27;rgba(255,94,126,0.7)&#x27; }
  ];

  // Piece shapes as lists of [x,y] offsets, with rotation states.
  var SHAPES = {
    O: { color: 5, rot: [ [[0,0],[1,0],[0,1],[1,1]] ] },
    I: { color: 1, rot: [ [[0,0],[1,0],[2,0],[3,0]], [[1,-1],[1,0],[1,1],[1,2]] ] },
    L: { color: 6, rot: [ [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,0],[1,0],[2,0],[2,1]], [[1,0],[1,1],[0,2],[1,2]] ] },
    J: { color: 3, rot: [ [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,0],[1,0],[2,0],[0,1]], [[0,0],[1,0],[1,1],[1,2]] ] },
    T: { color: 2, rot: [ [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,0],[1,0],[2,0],[1,1]], [[1,0],[0,1],[1,1],[1,2]] ] },
    S: { color: 4, rot: [ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]] ] },
    Z: { color: 7, rot: [ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]] ] }
  };
  var TYPES = [&#x27;O&#x27;,&#x27;I&#x27;,&#x27;L&#x27;,&#x27;J&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;];

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var targetEl = document.getElementById(&#x27;target&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var pointsEl = document.getElementById(&#x27;points&#x27;);
  var barEl = document.getElementById(&#x27;bar&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);
  var nextEl = document.getElementById(&#x27;next&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);

  targetEl.textContent = TARGET;

  // ---- Audio ----
  var actx = null;
  function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {} } return actx; }
  function beep(freq, dur, type, vol) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function sndMove() { beep(220, 0.05, &#x27;square&#x27;, 0.04); }
  function sndRotate() { beep(380, 0.06, &#x27;triangle&#x27;, 0.05); }
  function sndDrop() { beep(140, 0.1, &#x27;square&#x27;, 0.06); }
  function sndClear(n) {
    var base = 400 + n * 120;
    for (var i = 0; i &lt; n; i++) {
      (function(i){ setTimeout(function(){ beep(base + i*140, 0.14, &#x27;sawtooth&#x27;, 0.07); }, i*60); })(i);
    }
  }
  function sndWin() { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,0.2,&#x27;triangle&#x27;,0.08); }, i*130); }); }
  function sndLose() { [330,262,196,131].forEach(function(f,i){ setTimeout(function(){ beep(f,0.22,&#x27;sawtooth&#x27;,0.07); }, i*130); }); }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function randType() { return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  function pieceCells(p) {
    var rots = SHAPES[p.type].rot;
    var off = rots[p.rot % rots.length];
    var out = [];
    for (var i = 0; i &lt; off.length; i++) out.push({ x: p.x + off[i][0], y: p.y + off[i][1] });
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var type = nextType || randType();
    nextType = randType();
    piece = { type: type, x: Math.floor((COLS - 3) / 2), y: 0, rot: 0, color: SHAPES[type].color };
    drawNext();
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function updateStats() {
    scoreEl.textContent = score;
    pointsEl.textContent = points;
    var pct = Math.min(100, (score / TARGET) * 100);
    barEl.style.width = pct + &#x27;%&#x27;;
    var newLevel = Math.floor(score / 3) + 1;
    if (newLevel !== level) {
      level = newLevel;
      levelEl.textContent = level;
      if (running) {
        clearInterval(dropId);
        var speed = Math.max(110, DROP_MS - (level - 1) * 55);
        dropId = setInterval(stepDown, speed);
      }
    }
  }

  function clearFullRows() {
    var fullRows = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) fullRows.push(r);
    }
    if (fullRows.length === 0) { comboEl.textContent = &#x27;&#x27;; return; }

    // flash effect
    fullRows.forEach(function(r){
      var f = document.createElement(&#x27;div&#x27;);
      f.className = &#x27;flash&#x27;;
      f.style.top = (r * CELL) + &#x27;px&#x27;;
      field.appendChild(f);
      setTimeout(function(){ f.remove(); }, 300);
    });

    // remove rows
    fullRows.sort(function(a,b){ return a-b; });
    for (var i = fullRows.length - 1; i &gt;= 0; i--) {
      grid.splice(fullRows[i], 1);
      var empty = [];
      for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
      grid.unshift(empty);
    }

    var n = fullRows.length;
    score += n;
    var gained = n * 100 * n; // combo bonus for multi-clears
    points += gained;
    sndClear(n);
    if (n &gt;= 2) {
      comboEl.textContent = (n===2?&#x27;DOUBLE&#x27;:n===3?&#x27;TRIPLE&#x27;:&#x27;TETRIS&#x27;) + &#x27;! +&#x27; + gained;
    } else {
      comboEl.textContent = &#x27;+&#x27; + gained;
    }
    updateStats();
    if (score &gt;= TARGET) { win(); }
  }

  function ghostDrop(p) {
    var g = { type: p.type, x: p.x, y: p.y, rot: p.rot, color: p.color };
    while (!collides({ type: g.type, x: g.x, y: g.y + 1, rot: g.rot, color: g.color })) g.y += 1;
    return g;
  }

  function paint() {
    field.querySelectorAll(&#x27;.block, .ghost&#x27;).forEach(function (b) { b.remove(); });
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(field, c, r, grid[r][c], CELL);
      }
    }
    if (piece) {
      var g = ghostDrop(piece);
      if (g.y !== piece.y) {
        var gc = pieceCells(g);
        for (var j = 0; j &lt; gc.length; j++) {
          if (gc[j].y &gt;= 0) drawGhost(gc[j].x, gc[j].y);
        }
      }
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(field, cells[i].x, cells[i].y, piece.color, CELL);
      }
    }
  }

  function drawNext() {
    nextEl.innerHTML = &#x27;&#x27;;
    if (!nextType) return;
    var off = SHAPES[nextType].rot[0];
    var minx = 9, miny = 9, maxx = -9, maxy = -9;
    off.forEach(function(o){ minx=Math.min(minx,o[0]); maxx=Math.max(maxx,o[0]); miny=Math.min(miny,o[1]); maxy=Math.max(maxy,o[1]); });
    var w = maxx-minx+1, h = maxy-miny+1;
    var nc = 18;
    var offx = (78 - w*nc)/2, offy = (78 - h*nc)/2;
    off.forEach(function(o){
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;block&#x27;;
      var pal = COLORS[(SHAPES[nextType].color - 1) % COLORS.length];
      el.style.left = (offx + (o[0]-minx)*nc + 1) + &#x27;px&#x27;;
      el.style.top = (offy + (o[1]-miny)*nc + 1) + &#x27;px&#x27;;
      el.style.width = (nc-2) + &#x27;px&#x27;;
      el.style.height = (nc-2) + &#x27;px&#x27;;
      el.style.background = &#x27;linear-gradient(145deg,&#x27; + pal.base + &#x27;, &#x27; + shade(pal.base) + &#x27;)&#x27;;
      el.style.boxShadow = &#x27;0 0 8px &#x27; + pal.glow;
      nextEl.appendChild(el);
    });
  }

  function drawBlock(container, cx, cy, color, cell) {
    var pal = COLORS[(color - 1) % COLORS.length];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * cell + 1) + &#x27;px&#x27;;
    el.style.top = (cy * cell + 1) + &#x27;px&#x27;;
    el.style.width = (cell - 2) + &#x27;px&#x27;;
    el.style.height = (cell - 2) + &#x27;px&#x27;;
    el.style.background = &#x27;linear-gradient(145deg,&#x27; + pal.base + &#x27;, &#x27; + shade(pal.base) + &#x27;)&#x27;;
    el.style.boxShadow = &#x27;0 0 10px &#x27; + pal.glow + &#x27;, inset 0 0 6px rgba(255,255,255,0.25)&#x27;;
    var shine = document.createElement(&#x27;div&#x27;);
    shine.className = &#x27;shine&#x27;;
    el.appendChild(shine);
    container.appendChild(el);
  }

  function drawGhost(cx, cy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ghost&#x27;;
    el.style.left = (cx * CELL + 1) + &#x27;px&#x27;;
    el.style.top = (cy * CELL + 1) + &#x27;px&#x27;;
    el.style.width = (CELL - 2) + &#x27;px&#x27;;
    el.style.height = (CELL - 2) + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function shade(hex) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.floor(((n &gt;&gt; 16) &amp; 255) * 0.55);
    var g = Math.floor(((n &gt;&gt; 8) &amp; 255) * 0.55);
    var b = Math.floor((n &amp; 255) * 0.55);
    return &#x27;rgb(&#x27; + r + &#x27;,&#x27; + g + &#x27;,&#x27; + b + &#x27;)&#x27;;
  }

  function afterLock() {
    lockPiece();
    clearFullRows();
    if (!running) return;
    if (!spawnPiece()) { lose(); paint(); return; }
    paint();
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, x: piece.x, y: piece.y + 1, rot: piece.rot, color: piece.color };
    if (collides(next)) {
      afterLock();
    } else {
      piece = next;
      paint();
    }
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, x: piece.x + dx, y: piece.y, rot: piece.rot, color: piece.color };
    if (!collides(next)) { piece = next; paint(); sndMove(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var rots = SHAPES[piece.type].rot.length;
    var nr = (piece.rot + 1) % rots;
    // try with wall kicks
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var test = { type: piece.type, x: piece.x + kicks[k], y: piece.y, rot: nr, color: piece.color };
      if (!collides(test)) { piece = test; paint(); sndRotate(); return; }
    }
  }

  function hardDrop() {
    if (!running || !piece) return;
    var g = ghostDrop(piece);
    piece.y = g.y;
    sndDrop();
    afterLock();
  }

  function showMsg(html) { msgEl.innerHTML = html; msgEl.style.display = &#x27;flex&#x27;; }
  function hideMsg() { msgEl.style.display = &#x27;none&#x27;; }

  function win() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    sndWin();
    showMsg(&#x27;&lt;span class=&quot;big&quot;&gt;🏆 YOU WIN!&lt;/span&gt;&lt;small&gt;&#x27; + TARGET + &#x27; rows cleared &amp;middot; &#x27; + points + &#x27; points!&lt;br&gt;Press Restart to play again.&lt;/small&gt;&#x27;);
  }

  function lose() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    sndLose();
    showMsg(&#x27;&lt;span class=&quot;big&quot;&gt;💥 GAME OVER&lt;/span&gt;&lt;small&gt;&#x27; + score + &#x27; of &#x27; + TARGET + &#x27; rows &amp;middot; &#x27; + points + &#x27; points&lt;br&gt;Press Restart to try again.&lt;/small&gt;&#x27;);
  }

  function startGame() {
    if (running) return;
    hideMsg();
    score = 0; level = 1; points = 0;
    scoreEl.textContent = &#x27;0&#x27;; levelEl.textContent = &#x27;1&#x27;; pointsEl.textContent = &#x27;0&#x27;;
    barEl.style.width = &#x27;0%&#x27;; comboEl.textContent = &#x27;&#x27;;
    newGrid();
