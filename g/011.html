<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paddle ball</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Paddle ball</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .stats { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .boost { font-size: 17px; color: #d1257a; margin: 0; font-weight: 600; min-height: 22px; }
  .rain { font-size: 17px; color: #2b7fb8; margin: 0; font-weight: 700; min-height: 22px; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Paddle ball&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and bounce the gray ball to score; missing it costs 2 points and ends any active boost or storm. Catch the rainbow ball to grow for 30s, or the rare flashing super ball to start a light-blue ball storm — keep catching the gray ball to keep it going!&lt;/p&gt;
  &lt;div class=&quot;stats&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;boost&quot; id=&quot;boost&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;rain&quot; id=&quot;rain&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;canvas&quot; width=&quot;620&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W_NORMAL = 100, PADDLE_W_BOOST = 220, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 14, BONUS_SIZE = 20, SUPER_SIZE = 20;
  var BALL_SPEED = 2.8;          // slowed down from 4.0
  var MISS_PENALTY = 2;
  var BOOST_MS = 30000;
  var running = false, animId = null;
  var keysDown = {};
  var score = 0;

  var canvas = document.getElementById(&#x27;canvas&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var boostEl = document.getElementById(&#x27;boost&#x27;);
  var rainEl = document.getElementById(&#x27;rain&#x27;);

  var paddleW = PADDLE_W_NORMAL;
  var paddleX = (FIELD_W - paddleW) / 2;
  var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;

  // main ball
  var ballX, ballY, ballVX, ballVY;

  // rainbow bonus ball
  var bonusActive = false, bonusX = 0, bonusY = 0, bonusVX = 0, bonusVY = 0;
  var lastBonusTime = 0, nextBonusDelay = 0;

  // super ball (flashing)
  var superActive = false, superX = 0, superY = 0, superVX = 0, superVY = 0;
  var lastSuperTime = 0, nextSuperDelay = 0;

  // boost
  var boostUntil = 0;

  // rain storm — now driven by keeping the gray ball alive, not a timer
  var raining = false;
  var rainBalls = []; // {x,y,vx,vy}

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function scheduleBonus(now) {
    lastBonusTime = now;
    nextBonusDelay = 6000 + Math.random() * 8000;
  }
  function scheduleSuper(now) {
    lastSuperTime = now;
    nextSuperDelay = 20000 + Math.random() * 18000;
  }

  function spawnBonus() {
    bonusActive = true;
    bonusX = 30 + Math.random() * (FIELD_W - 60 - BONUS_SIZE);
    bonusY = -BONUS_SIZE;
    bonusVX = (Math.random() &lt; 0.5 ? -1 : 1) * (1 + Math.random() * 1.5);
    bonusVY = 2.2 + Math.random() * 1.2;
  }
  function spawnSuper() {
    superActive = true;
    superX = 30 + Math.random() * (FIELD_W - 60 - SUPER_SIZE);
    superY = -SUPER_SIZE;
    superVX = (Math.random() &lt; 0.5 ? -1 : 1) * (1.5 + Math.random() * 2.0) * 1.05;
    superVY = (2.6 + Math.random() * 1.3) * 1.05;
  }

  function startRain() {
    raining = true;
    rainBalls = [];
    for (var i = 0; i &lt; 12; i++) spawnRainBall();
  }
  function stopRain() {
    raining = false;
    rainBalls = [];
  }
  function spawnRainBall() {
    rainBalls.push({
      x: Math.random() * (FIELD_W - 10),
      y: -10 - Math.random() * 150,
      vx: (Math.random() - 0.5) * 2,
      vy: 2 + Math.random() * 2   // calmer, normal fall rate
    });
  }

  function paddleGradient(x, w) {
    var pg = ctx.createLinearGradient(x, 0, x + w, 0);
    pg.addColorStop(0, &#x27;#ff5f6d&#x27;);
    pg.addColorStop(0.33, &#x27;#ffc371&#x27;);
    pg.addColorStop(0.66, &#x27;#42e695&#x27;);
    pg.addColorStop(1, &#x27;#a34de3&#x27;);
    return pg;
  }

  function draw() {
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);

    // rain balls — light blue
    ctx.fillStyle = &#x27;#8ecdf0&#x27;;
    for (var i = 0; i &lt; rainBalls.length; i++) {
      var rb = rainBalls[i];
      ctx.beginPath();
      ctx.arc(rb.x + 5, rb.y + 5, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    // main ball
    ctx.fillStyle = &#x27;#555&#x27;;
    ctx.beginPath();
    ctx.arc(ballX + BALL_SIZE / 2, ballY + BALL_SIZE / 2, BALL_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();

    // rainbow bonus ball — same palette as boosted paddle
    if (bonusActive) {
      ctx.fillStyle = paddleGradient(bonusX, BONUS_SIZE);
      ctx.beginPath();
      ctx.arc(bonusX + BONUS_SIZE / 2, bonusY + BONUS_SIZE / 2, BONUS_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // super ball (flashing)
    if (superActive) {
      var flash = (Math.floor(performance.now() / 120) % 2 === 0);
      ctx.fillStyle = flash ? &#x27;#fff700&#x27; : &#x27;#ff00c8&#x27;;
      ctx.beginPath();
      ctx.arc(superX + SUPER_SIZE / 2, superY + SUPER_SIZE / 2, SUPER_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = flash ? &#x27;#ff00c8&#x27; : &#x27;#fff700&#x27;;
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // paddle
    var boosted = performance.now() &lt; boostUntil;
    ctx.fillStyle = boosted ? paddleGradient(paddleX, paddleW) : &#x27;#555&#x27;;
    roundRect(ctx, paddleX, paddleTop, paddleW, PADDLE_H, 4);
    ctx.fill();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function hitsPaddle(px, py, size, vy) {
    return vy &gt; 0 &amp;&amp;
      py + size &gt;= paddleTop &amp;&amp;
      py + size &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
      px + size &gt;= paddleX &amp;&amp;
      px &lt;= paddleX + paddleW;
  }

  function tick(ts) {
    if (!running) return;
    var now = ts || performance.now();

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;

    var boosted = now &lt; boostUntil;
    var targetW = boosted ? PADDLE_W_BOOST : PADDLE_W_NORMAL;
    if (paddleW !== targetW) {
      var center = paddleX + paddleW / 2;
      paddleW = targetW;
      paddleX = center - paddleW / 2;
    }
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));

    boostEl.textContent = boosted ? &#x27;\u2b50 Big paddle: &#x27; + Math.ceil((boostUntil - now) / 1000) + &#x27;s&#x27; : &#x27;&#x27;;
    rainEl.textContent = raining ? &#x27;\u26a1 BALL STORM active!&#x27; : &#x27;&#x27;;

    // main ball
    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    if (hitsPaddle(ballX, ballY, BALL_SIZE, ballVY)) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
    }
    if (ballY &gt;= FIELD_H) {
      // missed the gray ball: penalty, end boost and storm
      score -= MISS_PENALTY;
      scoreEl.textContent = score;
      if (boosted) boostUntil = 0;
      if (raining) stopRain();
      resetBall();
    }

    // rainbow bonus
    if (!bonusActive &amp;&amp; (now - lastBonusTime) &gt;= nextBonusDelay) spawnBonus();
    if (bonusActive) {
      bonusX += bonusVX;
      bonusY += bonusVY;
      if (bonusX &lt;= 0) { bonusX = 0; bonusVX = -bonusVX; }
      if (bonusX + BONUS_SIZE &gt;= FIELD_W) { bonusX = FIELD_W - BONUS_SIZE; bonusVX = -bonusVX; }
      if (hitsPaddle(bonusX, bonusY, BONUS_SIZE, bonusVY)) {
        bonusActive = false;
        boostUntil = now + BOOST_MS;
        scheduleBonus(now);
      } else if (bonusY &gt;= FIELD_H) {
        bonusActive = false;
        scheduleBonus(now);
      }
    }

    // super ball
    if (!superActive &amp;&amp; (now - lastSuperTime) &gt;= nextSuperDelay) spawnSuper();
    if (superActive) {
      superX += superVX;
      superY += superVY;
      if (superX &lt;= 0) { superX = 0; superVX = -superVX; }
      if (superX + SUPER_SIZE &gt;= FIELD_W) { superX = FIELD_W - SUPER_SIZE; superVX = -superVX; }
      if (hitsPaddle(superX, superY, SUPER_SIZE, superVY)) {
        superActive = false;
        startRain();
        scheduleSuper(now);
      } else if (superY &gt;= FIELD_H) {
        superActive = false;
        scheduleSuper(now);
      }
    }

    // ball storm — keeps going while raining, normal rate
    if (raining) {
      if (rainBalls.length &lt; 25 &amp;&amp; Math.random() &lt; 0.25) spawnRainBall();
    }
    for (var i = rainBalls.length - 1; i &gt;= 0; i--) {
      var rb = rainBalls[i];
      rb.x += rb.vx;
      rb.y += rb.vy;
      if (rb.x &lt;= 0) { rb.x = 0; rb.vx = -rb.vx; }
      if (rb.x + 10 &gt;= FIELD_W) { rb.x = FIELD_W - 10; rb.vx = -rb.vx; }
      if (hitsPaddle(rb.x, rb.y, 10, rb.vy)) {
        score += 1;
        scoreEl.textContent = score;
        rainBalls.splice(i, 1);
      } else if (rb.y &gt;= FIELD_H) {
        rainBalls.splice(i, 1);
      }
    }

    draw();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    boostEl.textContent = &#x27;&#x27;;
    rainEl.textContent = &#x27;&#x27;;
    boostUntil = 0;
    raining = false;
    rainBalls = [];
    paddleW = PADDLE_W_NORMAL;
    paddleX = (FIELD_W - paddleW) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    bonusActive = false;
    superActive = false;
    var now = performance.now();
    scheduleBonus(now);
    scheduleSuper(now);
    nextBonusDelay = 2500;
    draw();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
