  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;h1&gt;Lunar Lander Blocks&lt;/h1&gt;
    &lt;p class=&quot;instructions&quot;&gt;Hold &lt;strong&gt;&amp;uarr;&lt;/strong&gt; to fire the jet and slow your fall, &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt; to steer sideways, and &lt;strong&gt;A&lt;/strong&gt;/&lt;strong&gt;S&lt;/strong&gt; to spin the piece left/right. Land pieces to fill and clear rows for points.&lt;/p&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;field-wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;300&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 30;
  var COLS = 10, ROWS = 16;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var GRAVITY = 220;
  var JET_THRUST = 340;
  var MAX_FALL = 260;
  var MIN_VY = -70;
  var H_SPEED = 130;
  var H_FRICTION = 6;

  var SHAPES = [
    { color:&#x27;#4fc3f7&#x27;, cells:[[0,0],[1,0],[2,0],[3,0]] }, // I
    { color:&#x27;#ffca28&#x27;, cells:[[0,0],[1,0],[0,1],[1,1]] }, // O
    { color:&#x27;#ab47bc&#x27;, cells:[[1,0],[0,1],[1,1],[2,1]] }, // T
    { color:&#x27;#66bb6a&#x27;, cells:[[1,0],[2,0],[0,1],[1,1]] }, // S
    { color:&#x27;#ef5350&#x27;, cells:[[0,0],[1,0],[1,1],[2,1]] }, // Z
    { color:&#x27;#5c6bc0&#x27;, cells:[[0,0],[0,1],[1,1],[2,1]] }, // J
    { color:&#x27;#ffa726&#x27;, cells:[[2,0],[0,1],[1,1],[2,1]] }, // L
  ];

  var grid, piece, score, running = false, lastT = 0, rafId = null;
  var keys = { left:false, right:false, up:false };
  var sparks = [];

  function hexToRgb(h){
    h = h.replace(&#x27;#&#x27;,&#x27;&#x27;);
    return { r:parseInt(h.substr(0,2),16), g:parseInt(h.substr(2,2),16), b:parseInt(h.substr(4,2),16) };
  }

  function newGrid(){
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function spawnPiece(){
    var s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
    var maxc = 0; for (var i=0;i&lt;s.cells.length;i++) maxc = Math.max(maxc, s.cells[i][0]);
    var w = maxc + 1;
    var startCol = Math.floor((COLS - w)/2);
    piece = {
      cells: s.cells.map(function(c){ return [c[0], c[1]]; }),
      color: s.color,
      px: startCol * CELL,
      py: -CELL * 2,
      vx: 0, vy: 40,
      lean: 0, spin: 0
    };
    if (occupiedNow(piece)) { endGame(); return false; }
    return true;
  }

  function cellsAt(p, px, py){
    var col0 = Math.round(px / CELL);
    var row0 = Math.round(py / CELL);
    var out = [];
    for (var i=0;i&lt;p.cells.length;i++){
      out.push([col0 + p.cells[i][0], row0 + p.cells[i][1]]);
    }
    return out;
  }

  function occupiedNow(p){
    var cs = cellsAt(p, p.px, p.py);
    for (var i=0;i&lt;cs.length;i++){
      var c = cs[i][0], r = cs[i][1];
      if (r &lt; 0) continue;
      if (c&lt;0 || c&gt;=COLS || r&gt;=ROWS) return true;
      if (grid[r][c]) return true;
    }
    return false;
  }

  function collidesAt(p, px, py){
    var cs = cellsAt(p, px, py);
    for (var i=0;i&lt;cs.length;i++){
      var c = cs[i][0], r = cs[i][1];
      if (c&lt;0 || c&gt;=COLS) return true;
      if (r&gt;=ROWS) return true;
      if (r&gt;=0 &amp;&amp; grid[r][c]) return true;
    }
    return false;
  }

  function bounds(cells){
    var minx=99,maxx=-99,miny=99,maxy=-99;
    for(var i=0;i&lt;cells.length;i++){
      minx=Math.min(minx,cells[i][0]); maxx=Math.max(maxx,cells[i][0]);
      miny=Math.min(miny,cells[i][1]); maxy=Math.max(maxy,cells[i][1]);
    }
    return {minx:minx,maxx:maxx,miny:miny,maxy:maxy};
  }

  function rotatePiece(dir){
    if (!piece) return;
    var b = bounds(piece.cells);
    var w = b.maxx - b.minx + 1;
    var h = b.maxy - b.miny + 1;
    var rotated = piece.cells.map(function(c){
      var lx = c[0]-b.minx, ly = c[1]-b.miny;
      if (dir&gt;0) return [ (h-1-ly), lx ];
      else       return [ ly, (w-1-lx) ];
    });
    var rb = bounds(rotated);
    rotated = rotated.map(function(c){ return [c[0]-rb.minx, c[1]-rb.miny]; });
    var test = { cells:rotated, px:piece.px, py:piece.py };
    var kicks = [0, -CELL, CELL, -2*CELL, 2*CELL];
    for (var k=0;k&lt;kicks.length;k++){
      if (!collidesAt(test, piece.px + kicks[k], piece.py)){
        piece.cells = rotated;
        piece.px += kicks[k];
        piece.spin = -dir * (Math.PI/2);
        emitSpinSparks(dir);
        return;
      }
    }
  }

  function centerPx(p){
    var b = bounds(p.cells);
    var cx = p.px + ((b.minx+b.maxx)/2 + 0.5)*CELL;
    var cy = p.py + ((b.miny+b.maxy)/2 + 0.5)*CELL;
    return {x:cx, y:cy};
  }

  function jetOrigin(p){
    var b = bounds(p.cells);
    var cx = p.px + ((b.minx+b.maxx)/2 + 0.5)*CELL;
    var cy = p.py + (b.maxy+1)*CELL;
    return {x:cx, y:cy};
  }

  function emitSparks(p){
    var o = jetOrigin(p);
    for (var i=0;i&lt;3;i++){
      var ang = Math.PI/2 + (Math.random()-0.5)*0.9;
      var sp = 120 + Math.random()*120;
      sparks.push({ x:o.x, y:o.y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
        life:100, max:100, col: Math.random()&lt;0.5 ? &#x27;#ffe6a0&#x27; : &#x27;#ffb070&#x27; });
    }
  }

  function emitSpinSparks(dir){
    var ctr = centerPx(piece);
    var b = bounds(piece.cells);
    var halfW = (b.maxx-b.minx+1)*CELL/2;
    var side = dir&gt;0 ? -1 : 1;
    var ox = ctr.x + side*halfW;
    var oy = ctr.y;
    for (var i=0;i&lt;10;i++){
      var baseAng = side&gt;0 ? 0 : Math.PI;
      var ang = baseAng + (Math.random()-0.5)*1.1;
      var sp = 140 + Math.random()*140;
      sparks.push({ x:ox, y:oy, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 30 + Math.random()*60,
        life:100, max:100, col: Math.random()&lt;0.5 ? &#x27;#c0e8ff&#x27; : &#x27;#ecf6ff&#x27; });
    }
  }

  function lockPiece(){
    var cs = cellsAt(piece, piece.px, piece.py);
    for (var i=0;i&lt;cs.length;i++){
      var c = cs[i][0], r = cs[i][1];
      if (r&gt;=0 &amp;&amp; r&lt;ROWS &amp;&amp; c&gt;=0 &amp;&amp; c&lt;COLS) grid[r][c] = piece.color;
    }
    piece = null;
    clearRows();
  }

  function clearRows(){
    var cleared = 0;
    for (var r=ROWS-1;r&gt;=0;r--){
      var full = true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){ full=false; break; }
      if (full){
        grid.splice(r,1);
        var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
        grid.unshift(empty);
        cleared++; r++;
      }
    }
    if (cleared){ score += cleared*cleared*10; scoreEl.textContent = score; }
  }

  function update(dt){
    if (!piece) { if(!spawnPiece()) return; }
    var p = piece;

    if (keys.left &amp;&amp; !keys.right) p.vx = -H_SPEED;
    else if (keys.right &amp;&amp; !keys.left) p.vx = H_SPEED;
    else p.vx -= p.vx * Math.min(1, H_FRICTION*dt);

    var targetLean = (p.vx/H_SPEED) * 0.18;
    p.lean += (targetLean - p.lean) * Math.min(1, 10*dt);

    p.spin += (0 - p.spin) * Math.min(1, 12*dt);
    if (Math.abs(p.spin) &lt; 0.01) p.spin = 0;

    var accel = GRAVITY;
    if (keys.up){ accel -= JET_THRUST; emitSparks(p); }
    p.vy += accel * dt;
    if (p.vy &gt; MAX_FALL) p.vy = MAX_FALL;
    if (p.vy &lt; MIN_VY) p.vy = MIN_VY;

    var nx = p.px + p.vx*dt;
    if (!collidesAt(p, nx, p.py)) p.px = nx;
    else p.vx = 0;

    var ny = p.py + p.vy*dt;
    if (!collidesAt(p, p.px, ny)){
      p.py = ny;
    } else {
      if (p.vy &gt; 0){
        p.py = Math.round(p.py / CELL) * CELL;
        lockPiece();
      } else {
        p.vy = 0;
      }
    }

    for (var i=sparks.length-1;i&gt;=0;i--){
      var s = sparks[i];
      s.life -= dt*1000;
      s.x += s.vx*dt; s.y += s.vy*dt;
      if (s.life&lt;=0) sparks.splice(i,1);
    }
  }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);

    // faint grid guide lines for glass feel
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.04)&#x27;;
    ctx.lineWidth = 1;
    for (var gx=0;gx&lt;=COLS;gx++){ ctx.beginPath(); ctx.moveTo(gx*CELL,0); ctx.lineTo(gx*CELL,ROWS*CELL); ctx.stroke(); }
    for (var gy=0;gy&lt;=ROWS;gy++){ ctx.beginPath(); ctx.moveTo(0,gy*CELL); ctx.lineTo(COLS*CELL,gy*CELL); ctx.stroke(); }

    for (var r=0;r&lt;ROWS;r++){
      for (var c=0;c&lt;COLS;c++){
        if (grid[r][c]) drawGlassCell(c*CELL, r*CELL, grid[r][c], false);
      }
    }

    for (var i=0;i&lt;sparks.length;i++){
      var s=sparks[i];
      var a = Math.max(0, s.life/s.max);
      ctx.strokeStyle = s.col;
      ctx.globalAlpha = a;
      ctx.lineWidth = 2;
      ctx.shadowColor = s.col;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx*0.02, s.y - s.vy*0.02);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    if (piece){
      var ctr = centerPx(piece);
      ctx.save();
      ctx.translate(ctr.x, ctr.y);
      ctx.rotate(piece.spin + piece.lean);
      ctx.translate(-ctr.x, -ctr.y);
      var col0 = piece.px, row0 = piece.py;
      for (var i2=0;i2&lt;piece.cells.length;i2++){
        drawGlassCell(col0 + piece.cells[i2][0]*CELL, row0 + piece.cells[i2][1]*CELL, piece.color, true);
      }
      ctx.restore();
    }
  }

  function drawGlassCell(x,y,color,active){
    var rgb = hexToRgb(color);
    var pad = 2, r = 6;
    var w = CELL - pad*2, h = CELL - pad*2;
    var xx = x+pad, yy = y+pad;

    // soft outer glow
    ctx.save();
    ctx.shadowColor = &#x27;rgba(&#x27;+rgb.r+&#x27;,&#x27;+rgb.g+&#x27;,&#x27;+rgb.b+&#x27;,0.6)&#x27;;
    ctx.shadowBlur = active ? 14 : 8;

    // glass body: translucent tinted fill
    roundRect(xx, yy, w, h, r);
    var grad = ctx.createLinearGradient(xx, yy, xx, yy+h);
    grad.addColorStop(0, &#x27;rgba(&#x27;+rgb.r+&#x27;,&#x27;+rgb.g+&#x27;,&#x27;+rgb.b+&#x27;,&#x27;+(active?0.55:0.42)+&#x27;)&#x27;);
    grad.addColorStop(1, &#x27;rgba(&#x27;+rgb.r+&#x27;,&#x27;+rgb.g+&#x27;,&#x27;+rgb.b+&#x27;,&#x27;+(active?0.30:0.20)+&#x27;)&#x27;);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    // glossy top highlight
    roundRect(xx, yy, w, h*0.5, r);
    var gloss = ctx.createLinearGradient(xx, yy, xx, yy+h*0.5);
    gloss.addColorStop(0, &#x27;rgba(255,255,255,0.45)&#x27;);
    gloss.addColorStop(1, &#x27;rgba(255,255,255,0.02)&#x27;);
    ctx.fillStyle = gloss;
    ctx.fill();

    // glass edge
    roundRect(xx+0.5, yy+0.5, w-1, h-1, r);
    ctx.strokeStyle = &#x27;rgba(255,255,255,&#x27;+(active?0.55:0.32)+&#x27;)&#x27;;
    ctx.lineWidth = 1;
    ctx.stroke();

    // small corner sparkle
    ctx.fillStyle = &#x27;rgba(255,255,255,0.6)&#x27;;
    ctx.beginPath();
    ctx.arc(xx + w*0.28, yy + h*0.26, 1.6, 0, Math.PI*2);
    ctx.fill();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(t){
    if (!running) return;
    var dt = (t - lastT)/1000;
    lastT = t;
    if (dt &gt; 0.05) dt = 0.05;
    update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function startGame(){
    newGrid();
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    sparks = [];
    piece = null;
    spawnPiece();
    running = true;
    lastT = performance.now();
    draw();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  function stopGame(){
    running = false;
    if (rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }
  function endGame(){
    running = false;
    if (rafId){ cancelAnimationFrame(rafId); rafId=null; }
    ctx.fillStyle = &#x27;rgba(10,12,30,0.55)&#x27;;
    ctx.fillRect(0, cv.height/2-32, cv.width, 64);
    ctx.fillStyle = &#x27;#eaf2ff&#x27;;
    ctx.font = &#x27;22px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = &#x27;rgba(150,120,255,0.6)&#x27;;
    ctx.shadowBlur = 10;
    ctx.fillText(&#x27;Crash Landing!&#x27;, cv.width/2, cv.height/2+8);
    ctx.shadowBlur = 0;
    ctx.textAlign = &#x27;left&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.repeat) {
      if (e.key===&#x27;a&#x27;||e.key===&#x27;A&#x27;||e.key===&#x27;s&#x27;||e.key===&#x27;S&#x27;) { e.preventDefault(); return; }
    }
    if (e.key===&#x27;ArrowLeft&#x27;){ keys.left=true; e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ keys.right=true; e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ keys.up=true; e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ e.preventDefault(); }
    else if ((e.key===&#x27;a&#x27;||e.key===&#x27;A&#x27;) &amp;&amp; running){ rotatePiece(-1); e.preventDefault(); }
    else if ((e.key===&#x27;s&#x27;||e.key===&#x27;S&#x27;) &amp;&amp; running){ rotatePiece(1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;) keys.left=false;
    else if (e.key===&#x27;ArrowRight&#x27;) keys.right=false;
    else if (e.key===&#x27;ArrowUp&#x27;) keys.up=false;
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  newGrid();
  score = 0;
  piece = { cells: SHAPES[2].cells.map(function(c){return [c[0],c[1]];}), color: SHAPES[2].color, px: 3*CELL, py: 0, vx:0, vy:0, lean:0, spin:0 };
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
