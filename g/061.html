&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-4px,3px);} 40%{transform:translate(5px,-2px);} 60%{transform:translate(-3px,-3px);} 80%{transform:translate(3px,2px);} }
  .cell { position: relative; display: flex; align-items: flex-end; justify-content: center; z-index:2; }
  .hole {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);

  }
  .hole::before { content:&#x27;&#x27;; position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:124px; height:16px; border-radius:50%; background: rgba(60,38,20,.6); }
  .mole-wrap { position: absolute; bottom: 12px; left: 50%; width: 88px; height: 100px;
    transform: translate(-50%, 105%); pointer-events: none; z-index:3; }
  .mole-wrap.up { animation: popUp .28s cubic-bezier(.34,1.7,.5,1) forwards; }
  .mole-wrap.up .mole { animation: idleBob 1.3s ease-in-out .3s infinite; }
  .mole-wrap.whacked { animation: whackDown .22s cubic-bezier(.5,-0.4,.7,.5) forwards; }
  .mole-wrap.timeout { animation: sinkDown .25s ease-in forwards; }
  @keyframes popUp { 0%{transform:translate(-50%,105%);} 70%{transform:translate(-50%,-8%);} 100%{transform:translate(-50%,4%);} }
  @keyframes idleBob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
  @keyframes whackDown { 0%{transform:translate(-50%,4%) scale(1,1);} 30%{transform:translate(-50%,20%) scale(1.25,.7);} 100%{transform:translate(-50%,110%) scale(.85,1);} }
  @keyframes sinkDown { from{transform:translate(-50%,4%);} to{transform:translate(-50%,110%);} }
  .mole { width: 88px; height: 88px; cursor: pointer; pointer-events: auto; position: relative; }
  .mole svg { display: block; filter: drop-shadow(0 4px 5px rgba(0,0,0,.4)); }
  .mole.golden svg { filter: drop-shadow(0 0 8px #ffd24d) drop-shadow(0 4px 5px rgba(0,0,0,.4)); }
  .paw { transform-origin: center; animation: pawWiggle 1s ease-in-out infinite; }
  .paw.r { animation-delay:.15s; }
  @keyframes pawWiggle { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-2px) rotate(4deg);} }
  .whisk { transform-origin: 44px 60px; animation: whiskTwitch 2.4s ease-in-out infinite; }
  @keyframes whiskTwitch { 0%,88%,100%{transform:rotate(0deg);} 92%,96%{transform:rotate(3deg);} }
  .eye-lid { transform-origin:center; animation: blink 3.4s infinite; }
  @keyframes blink { 0%,94%,100%{transform:scaleY(0);} 96%,98%{transform:scaleY(1);} }
  .dirt { position:absolute; bottom:16px; left:50%; width:8px; height:8px; border-radius:50%;
    background:#3a2413; pointer-events:none; z-index:4; animation: dirtFly .5s ease-out forwards; }
  @keyframes dirtFly { 0%{opacity:1;transform:translate(-50%,0) scale(1);} 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(.4);} }
  .float { position: absolute; font-weight: 700; font-size: 26px; pointer-events: none; font-family: Georgia, serif;
    text-shadow: 0 2px 5px rgba(0,0,0,.5); animation: floatUp .75s ease-out forwards; z-index: 6; }
  @keyframes floatUp { 0%{ transform: translate(-50%,0) scale(.5); opacity:0; }
    20%{ opacity:1; transform: translate(-50%,-12px) scale(1.15);} 100%{ transform: translate(-50%,-52px) scale(1); opacity:0; } }
  .star { position:absolute; font-size:20px; pointer-events:none; z-index:5;
    animation: starBurst .55s ease-out forwards; }
  @keyframes starBurst { 0%{opacity:1;transform:translate(-50%,-50%) scale(.3) rotate(0deg);}
    100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1.1) rotate(180deg);} }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:700; color:#f4e4c4; background:rgba(58,36,20,.72); border-radius:16px;
    text-shadow:0 2px 4px rgba(0,0,0,.5); flex-direction:column; gap:8px; z-index:20; }
  .overlay small { font-size:17px; font-weight:400; color:#e8d3ac; }
  .overlay .big { font-size:44px; color:#ffd24d; animation: pillBump .5s ease; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;⛏️ Whack-a-Mole ⛏️&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the moles as they pop out of their burrows to score — golden moles are worth triple, and fast back-to-back hits build a combo bonus! You have 30 seconds, so whack quickly using the Start button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stat&quot; id=&quot;scoreStat&quot;&gt;&lt;span class=&quot;label&quot;&gt;Score&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;label&quot;&gt;Time&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;time&quot;&gt;30&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot; id=&quot;comboStat&quot;&gt;&lt;span class=&quot;label&quot;&gt;Combo&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;label&quot;&gt;Best&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board-shell&quot;&gt;
    &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press Start to play!&lt;small&gt;Whack the moles&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var GRID = 9, GAME_TIME = 30;
  var score = 0, best = 0, timeLeft = GAME_TIME, running = false;
  var spawnTimer = null, countTimer = null;
  var combo = 1, lastHit = 0;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var scoreStat = document.getElementById(&#x27;scoreStat&#x27;);
  var comboStat = document.getElementById(&#x27;comboStat&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var cells = [];

  for (var i = 0; i &lt; GRID; i++) {
    var cell = document.createElement(&#x27;div&#x27;);
    cell.className = &#x27;cell&#x27;;
    var hole = document.createElement(&#x27;div&#x27;); hole.className = &#x27;hole&#x27;;
    var wrap = document.createElement(&#x27;div&#x27;); wrap.className = &#x27;mole-wrap&#x27;;
    var mole = document.createElement(&#x27;div&#x27;); mole.className = &#x27;mole&#x27;;
    mole.innerHTML = moleSVG(false);
    wrap.appendChild(mole);
    cell.appendChild(hole); cell.appendChild(wrap);
    board.appendChild(cell);
    cells.push({ cell: cell, wrap: wrap, mole: mole, active: false, golden: false, timeout: null });
    (function(idx){
      cells[idx].mole.addEventListener(&#x27;click&#x27;, function(){ whack(idx); });
    })(i);
  }

  // Classic gray garden mole — round body, dirt cap, pink snout &amp; paws,
  // buck teeth, whiskers. Golden variant swaps the body to warm gold.
  function moleSVG(golden){
    var body = golden ? &#x27;#c9a13a&#x27; : &#x27;#6b6b73&#x27;;
    var bodyD = golden ? &#x27;#a9832a&#x27; : &#x27;#54545c&#x27;;
    var belly = golden ? &#x27;#e8d38f&#x27; : &#x27;#9a9aa2&#x27;;
    var snout = &#x27;#e39aa0&#x27;;
    return &#x27;&lt;svg width=&quot;88&quot; height=&quot;88&quot; viewBox=&quot;0 0 88 88&quot;&gt;&#x27;
      // paws
      + &#x27;&lt;g class=&quot;paw l&quot;&gt;&lt;ellipse cx=&quot;20&quot; cy=&quot;62&quot; rx=&quot;9&quot; ry=&quot;7&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&lt;ellipse cx=&quot;17&quot; cy=&quot;64&quot; rx=&quot;4&quot; ry=&quot;3&quot; fill=&quot;&#x27;+snout+&#x27;&quot;/&gt;&lt;/g&gt;&#x27;
      + &#x27;&lt;g class=&quot;paw r&quot;&gt;&lt;ellipse cx=&quot;68&quot; cy=&quot;62&quot; rx=&quot;9&quot; ry=&quot;7&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&lt;ellipse cx=&quot;71&quot; cy=&quot;64&quot; rx=&quot;4&quot; ry=&quot;3&quot; fill=&quot;&#x27;+snout+&#x27;&quot;/&gt;&lt;/g&gt;&#x27;
      // body
      + &#x27;&lt;ellipse cx=&quot;44&quot; cy=&quot;52&quot; rx=&quot;30&quot; ry=&quot;30&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;path d=&quot;M14 52 a30 30 0 0 0 60 0 z&quot; fill=&quot;&#x27;+bodyD+&#x27;&quot; opacity=&quot;.35&quot;/&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;44&quot; cy=&quot;60&quot; rx=&quot;18&quot; ry=&quot;16&quot; fill=&quot;&#x27;+belly+&#x27;&quot;/&gt;&#x27;
      // little dirt cap on head
      + &#x27;&lt;path d=&quot;M24 30 q20 -16 40 0 q-20 -6 -40 0 z&quot; fill=&quot;#3a2413&quot;/&gt;&#x27;
      + &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;27&quot; r=&quot;2.5&quot; fill=&quot;#4a2e15&quot;/&gt;&lt;circle cx=&quot;44&quot; cy=&quot;24&quot; r=&quot;2.8&quot; fill=&quot;#4a2e15&quot;/&gt;&lt;circle cx=&quot;57&quot; cy=&quot;27&quot; r=&quot;2.5&quot; fill=&quot;#4a2e15&quot;/&gt;&#x27;
      // eyes
      + &#x27;&lt;circle cx=&quot;34&quot; cy=&quot;44&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot;/&gt;&#x27;
      + &#x27;&lt;circle cx=&quot;54&quot; cy=&quot;44&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot;/&gt;&#x27;
      + &#x27;&lt;circle cx=&quot;35&quot; cy=&quot;45&quot; r=&quot;3&quot; fill=&quot;#2a2a2a&quot;/&gt;&#x27;
      + &#x27;&lt;circle cx=&quot;55&quot; cy=&quot;45&quot; r=&quot;3&quot; fill=&quot;#2a2a2a&quot;/&gt;&#x27;
      + &#x27;&lt;circle cx=&quot;36&quot; cy=&quot;43.5&quot; r=&quot;1&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;56&quot; cy=&quot;43.5&quot; r=&quot;1&quot; fill=&quot;#fff&quot;/&gt;&#x27;
      + &#x27;&lt;rect class=&quot;eye-lid&quot; x=&quot;28&quot; y=&quot;38.5&quot; width=&quot;12&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;rect class=&quot;eye-lid&quot; x=&quot;48&quot; y=&quot;38.5&quot; width=&quot;12&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&#x27;
      // whiskers
      + &#x27;&lt;g class=&quot;whisk&quot; stroke=&quot;#d8d8dd&quot; stroke-width=&quot;1.4&quot; stroke-linecap=&quot;round&quot;&gt;&#x27;
      + &#x27;&lt;path d=&quot;M40 58 L22 54&quot;/&gt;&lt;path d=&quot;M40 61 L21 62&quot;/&gt;&lt;path d=&quot;M48 58 L66 54&quot;/&gt;&lt;path d=&quot;M48 61 L67 62&quot;/&gt;&lt;/g&gt;&#x27;
      // snout
      + &#x27;&lt;ellipse cx=&quot;44&quot; cy=&quot;59&quot; rx=&quot;9&quot; ry=&quot;7&quot; fill=&quot;&#x27;+snout+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;44&quot; cy=&quot;56&quot; rx=&quot;4&quot; ry=&quot;3&quot; fill=&quot;#c96f78&quot;/&gt;&#x27;
      + &#x27;&lt;circle cx=&quot;42&quot; cy=&quot;55&quot; r=&quot;1&quot; fill=&quot;#fff&quot; opacity=&quot;.7&quot;/&gt;&#x27;
      // buck teeth
      + &#x27;&lt;rect x=&quot;40&quot; y=&quot;65&quot; width=&quot;4&quot; height=&quot;6&quot; rx=&quot;1&quot; fill=&quot;#fff&quot; stroke=&quot;#d0d0d0&quot; stroke-width=&quot;.5&quot;/&gt;&#x27;
      + &#x27;&lt;rect x=&quot;44&quot; y=&quot;65&quot; width=&quot;4&quot; height=&quot;6&quot; rx=&quot;1&quot; fill=&quot;#fff&quot; stroke=&quot;#d0d0d0&quot; stroke-width=&quot;.5&quot;/&gt;&#x27;
      + &#x27;&lt;/svg&gt;&#x27;;
  }

  // --- audio ---
  var audioCtx = null;
  function ctx(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return audioCtx; }
  function beep(freq, dur, type, vol){
    var c = ctx(); if(!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.15;
      o.connect(g); g.connect(c.destination);
      var t = c.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      o.start(t); o.stop(t+dur);
    } catch(e){}
  }
  function bonkSound(golden){
    var c = ctx(); if(!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type=&#x27;sine&#x27;;
      var t = c.currentTime;
      o.frequency.setValueAtTime(golden?900:600, t);
      o.frequency.exponentialRampToValueAtTime(golden?200:150, t+0.14);
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t+0.16);
    } catch(e){}
    if (golden) setTimeout(function(){ beep(1320,0.12,&#x27;triangle&#x27;,0.14); }, 60);
  }
  function popSound(){ beep(420, 0.06, &#x27;triangle&#x27;, 0.08); }

  function popUp(){
    if (!running) return;
    var free = [];
    for (var i=0;i&lt;GRID;i++){ if(!cells[i].active) free.push(i); }
    if (free.length){
      var idx = free[Math.floor(Math.random()*free.length)];
      var c = cells[idx];
      c.active = true;
      c.golden = Math.random() &lt; 0.15;
      c.mole.className = &#x27;mole&#x27; + (c.golden ? &#x27; golden&#x27; : &#x27;&#x27;);
      c.mole.innerHTML = moleSVG(c.golden);
      c.wrap.className = &#x27;mole-wrap up&#x27;;
      dirtBurst(c.cell);
      popSound();
      if (c.golden){ board.classList.add(&#x27;gold-glow&#x27;); }
      var life = 750 + Math.random()*550;
      c.timeout = setTimeout(function(){ timeoutHide(idx); }, life);
    }
  }

  function anyGolden(){
    for (var i=0;i&lt;GRID;i++){ if(cells[i].active &amp;&amp; cells[i].golden) return true; }
    return false;
  }

  function dirtBurst(cell){
    for (var i=0;i&lt;6;i++){
      var d = document.createElement(&#x27;div&#x27;);
      d.className=&#x27;dirt&#x27;;
      d.style.setProperty(&#x27;--dx&#x27;, (Math.random()*70-35)+&#x27;px&#x27;);
      d.style.setProperty(&#x27;--dy&#x27;, -(15+Math.random()*30)+&#x27;px&#x27;);
      cell.appendChild(d);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },500); })(d);
    }
  }

  function timeoutHide(idx){
    var c = cells[idx];
    if (!c.active) return;
    c.active = false;
    if (c.timeout){ clearTimeout(c.timeout); c.timeout=null; }
    c.wrap.className = &#x27;mole-wrap timeout&#x27;;
    if (!anyGolden()) board.classList.remove(&#x27;gold-glow&#x27;);
    combo = 1; comboEl.textContent = &#x27;x1&#x27;;
  }

  function whack(idx){
    var c = cells[idx];
    if (!running || !c.active) return;
    var now = Date.now();
    if (now - lastHit &lt; 900) { combo = Math.min(combo+1, 8); }
    else { combo = 1; }
    lastHit = now;
    comboEl.textContent = &#x27;x&#x27;+combo;
    comboStat.classList.remove(&#x27;bump&#x27;); void comboStat.offsetWidth; comboStat.classList.add(&#x27;bump&#x27;);

    var base = c.golden ? 3 : 1;
    var pts = base * combo;
    score += pts;
    scoreEl.textContent = score;
    scoreStat.classList.remove(&#x27;bump&#x27;); void scoreStat.offsetWidth; scoreStat.classList.add(&#x27;bump&#x27;);

    c.active = false;
    if (c.timeout){ clearTimeout(c.timeout); c.timeout=null; }
    c.wrap.className = &#x27;mole-wrap whacked&#x27;;
    if (!anyGolden()) board.classList.remove(&#x27;gold-glow&#x27;);
    bonkSound(c.golden);
    showFloat(c.cell, &#x27;+&#x27;+pts, c.golden ? &#x27;#ffd24d&#x27; : &#x27;#f4e4c4&#x27;);
    starBurst(c.cell, c.golden);
    board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;);
  }

  function showFloat(cell, text, color){
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;; f.textContent = text; f.style.color = color;
    f.style.left = &#x27;50%&#x27;; f.style.top = &#x27;16px&#x27;;
    cell.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 750);

    setTimeout(function(){ beep(587,0.12,&#x27;triangle&#x27;,0.14); },110);

  function stopGame(){

  function endGame(){

    overlay.innerHTML = &quot;Time&#x27;s up!&quot;

    beep(523,0.14,&#x27;triangle&#x27;,0.15);
    setTimeout(function(){ beep(392,0.14,&#x27;triangle&#x27;,0.13); },150);
    setTimeout(function(){ beep(659,0.22,&#x27;triangle&#x27;,0.14); },300);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) { stopGame(); startGame(); }

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {

    window.addEventListener(t, function (e) {

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
