&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;

    color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; height: 100%;
    text-align: center; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 6px; cursor: none; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 3px;
    background: linear-gradient(#ffe81f, #ffb400); -webkit-background-clip: text;
    background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(255,232,31,.3);
    font-family: &quot;Trebuchet MS&quot;, system-ui, sans-serif; }
  .instructions { font-size: 16px; color: #b9c2ff; max-width: 660px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 16px; align-items: center; font-size: 18px; font-weight: 700; }
  .hud .val { color: #ffe81f; }
  .hud .time .val { color: #6cf; }
  .hud .lvl .val { color: #7dff9e; }
  .hud .mult .val { color: #ff5bd0; }
  .streakbar { width: 640px; height: 12px; border-radius: 6px; background: #1a1240;
    border: 1px solid #3a2c7a; overflow: hidden; position: relative; }
  .streakfill { height: 100%; width: 0%; border-radius: 6px;
    background: linear-gradient(90deg, #6cf, #7dff9e, #ffe81f, #ff5bd0);
    transition: width .2s; box-shadow: 0 0 10px rgba(255,150,255,.5); }
  .board { position: relative; width: 640px; height: 372px; flex-shrink: 0; margin: 0;
    border-radius: 14px; overflow: hidden;
    background:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 70% 60%, #cfe, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 20%, #fff, transparent),
      radial-gradient(2px 2px at 55% 15%, #ffd, transparent),
      radial-gradient(1px 1px at 15% 65%, #fff, transparent),
      linear-gradient(160deg, #0a0724, #140b33 60%, #05020f);
    border: 2px solid #3a2c7a; box-shadow: inset 0 0 60px rgba(80,40,160,.4), 0 0 30px rgba(120,60,220,.3);
  }
  .board.shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-5px,3px);}
    40%{transform:translate(5px,-3px);} 60%{transform:translate(-4px,-2px);} 80%{transform:translate(4px,2px);} }
  .portal { position: absolute; width: 78px; height: 78px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(90,180,255,.22), rgba(60,20,140,.12) 60%, transparent 72%);
  }
  .portal .ring { position: absolute; width: 78px; height: 78px; border-radius: 50%;
    border: 3px solid rgba(120,200,255,.35); box-shadow: 0 0 14px rgba(120,200,255,.3) inset; }
  .droid { position: absolute; width: 58px; height: 58px; cursor: none;
    transform: translateY(120%) scale(.6); opacity: 0;
    transition: transform .15s cubic-bezier(.3,1.7,.6,1), opacity .15s;
    font-size: 48px; line-height: 58px; user-select: none; text-align: center;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .droid.up { transform: translateY(0) scale(1); opacity: 1; }
  .droid.bad { filter: drop-shadow(0 0 10px #f33) drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .droid.rare { filter: drop-shadow(0 0 12px #ffe23a) drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  .droid.epic { filter: drop-shadow(0 0 14px #7dff9e) drop-shadow(0 4px 6px rgba(0,0,0,.6));
    animation: bob .5s ease-in-out infinite alternate; }
  .droid.bonus { filter: drop-shadow(0 0 16px #ff5bd0) drop-shadow(0 0 8px #fff);
    animation: blink .28s steps(1) infinite; }
  .droid.mult { filter: drop-shadow(0 0 16px #8af) drop-shadow(0 0 8px #fff);
    animation: spin 1.4s linear infinite; }
  @keyframes bob { from { transform: translateY(0) scale(1); } to { transform: translateY(-4px) scale(1.05); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: .35; } }
  @keyframes spin { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1); } }
  .cursor { position: fixed; width: 58px; height: 58px; pointer-events: none;
    transform: translate(-50%,-60%) rotate(-25deg); z-index: 50;
    transition: transform .05s; will-change: transform; }
  .cursor.swing { transform: translate(-50%,-60%) rotate(35deg) scale(1.1); }
  .pop { position: absolute; pointer-events: none; font-weight: 900; font-size: 24px;
    color: #ffe81f; text-shadow: 0 0 8px #ff9; z-index: 40;
    animation: rise .6s ease-out forwards; }
  .pop.bad { color: #ff5b5b; text-shadow: 0 0 8px #f55; }
  .pop.big { color: #7dff9e; font-size: 32px; text-shadow: 0 0 10px #7dff9e; }
  .pop.mult { color: #8af; font-size: 30px; text-shadow: 0 0 10px #8af; }
  @keyframes rise { from { transform: translate(-50%,0) scale(.6); opacity: 1; }
    to { transform: translate(-50%,-46px) scale(1.3); opacity: 0; } }
  .boom { position: absolute; pointer-events: none; z-index: 39; font-size: 42px;
    transform: translate(-50%,-50%); animation: boom .35s ease-out forwards; }
  @keyframes boom { from { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    to { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
  .spark { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none;
    z-index: 38; }
  .flash { position: absolute; inset: 0; pointer-events: none; z-index: 55; opacity: 0; }
  .flash.on { animation: fl .4s ease-out; }
  @keyframes fl { from { opacity: 1; } to { opacity: 0; } }
  .lvlup { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none; z-index: 58; font-size: 28px; font-weight: 900; letter-spacing: 2px;
    color: #7dff9e; text-shadow: 0 0 14px #7dff9e; opacity: 0; }
  .lvlup.on { animation: lu 1.1s ease-out; }
  @keyframes lu { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
    30% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-72%) scale(1); } }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 6px;
    background: rgba(5,2,15,.6); z-index: 60; font-size: 22px; color: #ffe81f;
    font-weight: 800; letter-spacing: 2px; text-align: center; padding: 12px; }
  .overlay small { font-size: 15px; color: #b9c2ff; font-weight: 500; letter-spacing: normal; }
  .overlay .big { font-size: 26px; color: #7dff9e; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot; id=&quot;game&quot;&gt;
  &lt;h1&gt;WHACK WARS&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Smash droids before they warp away and grab the glowing blue Kyber crystals to raise your Force Multiplier — chaining good hits builds a streak that boosts every point. Missing a target or hitting the red Sith helmet resets your streak, so aim true and use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;SCORE &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;mult&quot;&gt;×&lt;span class=&quot;val&quot; id=&quot;mult&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lvl&quot;&gt;LVL &lt;span class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;time&quot;&gt;TIME &lt;span class=&quot;val&quot; id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;streakbar&quot;&gt;&lt;div class=&quot;streakfill&quot; id=&quot;streakfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;lvlup&quot; id=&quot;lvlup&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;MAY THE FORCE BE WITH YOU&lt;small&gt;Press Start below to begin&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;svg class=&quot;cursor&quot; id=&quot;cursor&quot; viewBox=&quot;0 0 60 60&quot;&gt;
  &lt;defs&gt;
    &lt;linearGradient id=&quot;g1&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;1&quot;&gt;
      &lt;stop offset=&quot;0&quot; stop-color=&quot;#8fd8ff&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;#2a6bd0&quot;/&gt;
    &lt;/linearGradient&gt;
  &lt;/defs&gt;
  &lt;rect x=&quot;27&quot; y=&quot;20&quot; width=&quot;6&quot; height=&quot;36&quot; rx=&quot;3&quot; fill=&quot;#9aa6c8&quot;/&gt;
  &lt;rect x=&quot;24&quot; y=&quot;8&quot; width=&quot;12&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;url(#g1)&quot; stroke=&quot;#cfeeff&quot; stroke-width=&quot;1.5&quot;/&gt;
  &lt;rect x=&quot;18&quot; y=&quot;12&quot; width=&quot;24&quot; height=&quot;12&quot; rx=&quot;5&quot; fill=&quot;url(#g1)&quot; stroke=&quot;#e8faff&quot; stroke-width=&quot;2&quot;/&gt;
  &lt;circle cx=&quot;30&quot; cy=&quot;18&quot; r=&quot;3&quot; fill=&quot;#eaffff&quot;/&gt;
  &lt;rect x=&quot;16&quot; y=&quot;10&quot; width=&quot;4&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#bff&quot; opacity=&quot;.7&quot;/&gt;
  &lt;rect x=&quot;40&quot; y=&quot;10&quot; width=&quot;4&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#bff&quot; opacity=&quot;.7&quot;/&gt;
&lt;/svg&gt;

&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 372, GAME_TIME = 60, MAX_LEVEL = 5;
  var GOOD = [&#x27;🤖&#x27;,&#x27;👽&#x27;,&#x27;🚀&#x27;,&#x27;🛸&#x27;,&#x27;🪐&#x27;,&#x27;☄️&#x27;];
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var multEl = document.getElementById(&#x27;mult&#x27;);
  var streakfill = document.getElementById(&#x27;streakfill&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var cursor = document.getElementById(&#x27;cursor&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var lvlup = document.getElementById(&#x27;lvlup&#x27;);

  var score = 0, timeLeft = GAME_TIME, running = false, level = 1;
  var streak = 0, mult = 1;
  var spawnId = null, tickId = null, moleTimeouts = [];
  var portals = [];

  // ---- Audio ----
  var actx = null;
  function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return actx; }
  function tone(freq, dur, type, vol, slideTo, delay) {
    var c = ac(); if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol || .2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur);
  }
  function noise(dur, vol) {
    var c = ac(); if (!c) return;
    var n = c.sampleRate * dur, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i=0;i&lt;n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    var s = c.createBufferSource(); s.buffer = buf;
    var g = c.createGain(); g.gain.value = vol || .2;
    var f = c.createBiquadFilter(); f.type=&#x27;lowpass&#x27;; f.frequency.value=1400;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }
  // R2-D2 style random warble: quick random pitch chirps
  function r2(seq, gap) {
    var c = ac(); if (!c) return;
    seq.forEach(function(f, i) {
      var d = i * (gap || .08);
      tone(f, .07, &#x27;square&#x27;, .2, f * (Math.random()*1.5+.7), d);
    });
  }
  function sHit() { tone(920,.1,&#x27;square&#x27;,.24,200); tone(1400,.07,&#x27;triangle&#x27;,.16,600); }
  function sBad() { tone(140,.32,&#x27;sawtooth&#x27;,.3,38); tone(90,.4,&#x27;square&#x27;,.2,30); noise(.2,.15); }
  function sSwing() { tone(700,.05,&#x27;triangle&#x27;,.1,1500); }
  function sRare() { [700,950,1300].forEach(function(f,i){ tone(f,.12,&#x27;square&#x27;,.2,f*1.4,i*.05); }); }
  function sEpic() { [523,659,784,1046,1318].forEach(function(f,i){ tone(f,.14,&#x27;triangle&#x27;,.22,null,i*.06); }); }
  function sBonus() { for(var i=0;i&lt;6;i++) tone(600+i*180,.09,&#x27;square&#x27;,.2,null,i*.05); noise(.3,.12); }
  function sMult() { r2([1200, 1600, 900, 1800, 1400], .06); }
  function sLevel() { [392,523,659,784].forEach(function(f,i){ tone(f,.15,&#x27;square&#x27;,.18,null,i*.08); }); }
  // R2 excited beeps for start, R2 sad descending warble for game over
  function sStart() { r2([900, 1400, 1100, 1700, 1300, 2000], .09); }
  function sEnd() { r2([1600, 1200, 900, 1500, 800, 500, 350], .11); }

  function buildPortals() {
    board.querySelectorAll(&#x27;.portal&#x27;).forEach(function(p){ p.remove(); });
    portals = [];
    var cols = 4, rows = 3, pad = 30, pw = 78;
    var gx = (BOARD_W - pad*2 - pw) / (cols - 1);
    var gy = (BOARD_H - pad*2 - pw) / (rows - 1);
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; cols; c++) {
        var p = document.createElement(&#x27;div&#x27;);
        p.className = &#x27;portal&#x27;;
        var x = pad + c*gx, y = pad + r*gy;
        p.style.left = x + &#x27;px&#x27;; p.style.top = y + &#x27;px&#x27;;
        p.innerHTML = &#x27;&lt;div class=&quot;ring&quot;&gt;&lt;/div&gt;&#x27;;
        board.appendChild(p);
        portals.push({ el: p, x: x, y: y, busy: false });
      }
    }
  }

  function popText(x, y, txt, cls) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;pop&#x27; + (cls ? &#x27; &#x27; + cls : &#x27;&#x27;);
    el.style.left = x + &#x27;px&#x27;; el.style.top = y + &#x27;px&#x27;;
    el.textContent = txt;
    board.appendChild(el);
    setTimeout(function(){ el.remove(); }, 600);
  }
  function boom(x, y, emoji) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;boom&#x27;; el.textContent = emoji || &#x27;💥&#x27;;
    el.style.left = x + &#x27;px&#x27;; el.style.top = y + &#x27;px&#x27;;
    board.appendChild(el);
    setTimeout(function(){ el.remove(); }, 350);
  }
  function sparkBurst(x, y, color, n) {
    for (var i = 0; i &lt; (n||8); i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;spark&#x27;;
      s.style.left = x + &#x27;px&#x27;; s.style.top = y + &#x27;px&#x27;;
      s.style.background = color;
      s.style.boxShadow = &#x27;0 0 6px &#x27; + color;
      board.appendChild(s);
      var ang = Math.random()*Math.PI*2, dist = 30 + Math.random()*45;
      var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
      s.animate([
        { transform:&#x27;translate(-50%,-50%) scale(1)&#x27;, opacity:1 },
        { transform:&#x27;translate(calc(-50% + &#x27;+dx+&#x27;px),calc(-50% + &#x27;+dy+&#x27;px)) scale(.2)&#x27;, opacity:0 }
      ], { duration: 500 + Math.random()*250, easing:&#x27;ease-out&#x27; });
      (function(el){ setTimeout(function(){ el.remove(); }, 780); })(s);
    }
  }
  function doFlash(color) {
    flash.style.background = color || &#x27;rgba(125,255,158,.18)&#x27;;
    flash.classList.remove(&#x27;on&#x27;); void flash.offsetWidth; flash.classList.add(&#x27;on&#x27;);
  }
  function doShake() { board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;); }

  // ---- Streak / multiplier ----
  function multForStreak(s) {
    if (s &gt;= 12) return 5;
    if (s &gt;= 8) return 4;
    if (s &gt;= 5) return 3;
    if (s &gt;= 2) return 2;
    return 1;
  }
  function updateStreakUI() {
    mult = multForStreak(streak);
    multEl.textContent = mult;
    // fill bar toward next multiplier threshold (cap visual at streak 12)
    var pct = Math.min(100, (streak / 12) * 100);
    streakfill.style.width = pct + &#x27;%&#x27;;
  }
  function gainStreak() {
    var prev = mult;
    streak++;
    updateStreakUI();
    if (mult &gt; prev) { sMult(); doFlash(&#x27;rgba(255,91,208,.18)&#x27;); }
  }
  function breakStreak() {
    if (streak &gt; 0) { doFlash(&#x27;rgba(255,60,60,.2)&#x27;); }
    streak = 0;
    updateStreakUI();
  }

  function pickType() {
    var roll = Math.random();
    if (roll &lt; 0.18) return { kind:&#x27;bad&#x27;, emoji:&#x27;⚫&#x27;, cls:&#x27;bad&#x27;, pts:-2 };
    if (roll &lt; 0.26) return { kind:&#x27;mult&#x27;, emoji:&#x27;💎&#x27;, cls:&#x27;mult&#x27;, pts:1 };   // Kyber crystal ~8%
    if (roll &lt; 0.30) return { kind:&#x27;bonus&#x27;, emoji:&#x27;🌑&#x27;, cls:&#x27;bonus&#x27;, pts:8 };  // Death Star ~4%
    if (roll &lt; 0.39) return { kind:&#x27;epic&#x27;, emoji:&#x27;🧙&#x27;, cls:&#x27;epic&#x27;, pts:5 };    // Yoda ~9%
    if (roll &lt; 0.53) return { kind:&#x27;rare&#x27;, emoji:&#x27;⭐&#x27;, cls:&#x27;rare&#x27;, pts:3 };    // golden ~14%
    return { kind:&#x27;good&#x27;, emoji: GOOD[Math.floor(Math.random()*GOOD.length)], cls:&#x27;&#x27;, pts:1 };
  }

  function moleLife() {
    // Gentler than before. Level 1 generous, level 5 tight but doable.
    var base = 1150 - (level-1)*130;   // L1:1150 ... L5:630
    return Math.max(560, base + Math.random()*250);
  }
  function spawnDelay() {
    var d = 950 - (level-1)*115;       // L1:950 ... L5:490
    return Math.max(430, d) + Math.random()*160;
  }

  function spawnDroid() {
    if (!running) return;
    var free = portals.filter(function(p){ return !p.busy; });
    if (!free.length) return;
    var p = free[Math.floor(Math.random()*free.length)];
    p.busy = true;
    var type = pickType();
    var d = document.createElement(&#x27;div&#x27;);
    d.className = &#x27;droid &#x27; + type.cls;
    d.textContent = type.emoji;
    d.style.left = (p.x + 39 - 29) + &#x27;px&#x27;;
    d.style.top  = (p.y + 39 - 29) + &#x27;px&#x27;;
    board.appendChild(d);
    requestAnimationFrame(function(){ d.classList.add(&#x27;up&#x27;); });

    var cx = p.x + 39, cy = p.y + 39;
    var hit = false;
    d.addEventListener(&#x27;mousedown&#x27;, function() {
      if (hit || !running) return;
      hit = true;
      swing();
      if (type.kind === &#x27;bad&#x27;) {
        score = Math.max(0, score - 2); sBad(); popText(cx, cy, &#x27;-2&#x27;, &#x27;bad&#x27;);
