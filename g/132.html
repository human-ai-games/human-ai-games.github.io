<head>

<title>Falling blocks</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .stats { display: flex; gap: 14px; }
  .stat { background: #f0f2f8; border-radius: 8px; padding: 6px 14px; text-align: center; min-width: 74px; }
  .stat .label { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .val { font-size: 24px; font-weight: 700; color: #333; }
  .stat.hi .val { color: #e6a100; }
  .diff { display: flex; gap: 6px; }
  .diff button { font-family: inherit; font-size: 15px; padding: 5px 12px; border: 2px solid #ccc; background: #fafafa; border-radius: 6px; cursor: pointer; color: #444; }
  .diff button.active { border-color: #4361ee; background: #eaf0ff; color: #1a3bb3; font-weight: 600; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .block { position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; }
  .popup { position: absolute; left: 0; right: 0; top: 42%; text-align: center; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.5); pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .popup.show { opacity: 1; animation: pop 0.7s ease-out; }
  @keyframes pop { 0% { transform: scale(0.5); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the piece with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to drop faster. Clearing multiple rows at once scores big — pick a difficulty, then use &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; below.&lt;/p&gt;
  &lt;div class=&quot;stats&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat hi&quot;&gt;&lt;div class=&quot;label&quot;&gt;High&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;high&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Lines&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;lines&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;diff&quot; id=&quot;diff&quot;&gt;
    &lt;button data-diff=&quot;easy&quot;&gt;Easy&lt;/button&gt;
    &lt;button data-diff=&quot;normal&quot; class=&quot;active&quot;&gt;Normal&lt;/button&gt;
    &lt;button data-diff=&quot;hard&quot;&gt;Hard&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;popup&quot; id=&quot;popup&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DIFFS = {
    easy:   { base: 750, min: 350, ramp: 4 },
    normal: { base: 500, min: 220, ramp: 3.5 },
    hard:   { base: 260, min: 110, ramp: 2.5 }
  };
  // Points for clearing 1..4 rows at once (before difficulty multiplier).
  var LINE_SCORE = { 1: 100, 2: 300, 3: 500, 4: 800 };
  var DIFF_MULT = { easy: 1, normal: 1.5, hard: 2 };
  var difficulty = &#x27;normal&#x27;;
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0, highScore = 0, linesCleared = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var highEl = document.getElementById(&#x27;high&#x27;);
  var linesEl = document.getElementById(&#x27;lines&#x27;);
  var diffBar = document.getElementById(&#x27;diff&#x27;);
  var popupEl = document.getElementById(&#x27;popup&#x27;);
  var popupTimer = null;

  var SHAPES = {
    I: { color: &#x27;#39c5c8&#x27;, rot: [
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:3,y:1}],
      [{x:2,y:0},{x:2,y:1},{x:2,y:2},{x:2,y:3}]
    ]},
    O: { color: &#x27;#e6b800&#x27;, rot: [
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:2,y:1}]
    ]},
    T: { color: &#x27;#9b5de5&#x27;, rot: [
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:2}]
    ]},
    L: { color: &#x27;#f3722c&#x27;, rot: [
      [{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:2,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:0,y:2}],
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:1,y:2}]
    ]},
    J: { color: &#x27;#4361ee&#x27;, rot: [
      [{x:0,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:2,y:2}],
      [{x:1,y:0},{x:1,y:1},{x:0,y:2},{x:1,y:2}]
    ]},
    S: { color: &#x27;#43aa8b&#x27;, rot: [
      [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:2,y:2}]
    ]},
    Z: { color: &#x27;#e63946&#x27;, rot: [
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}],
      [{x:2,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}]
    ]}
  };
  var KEYS = Object.keys(SHAPES);

  function currentDropMs() {
    var d = DIFFS[difficulty];
    var ms = d.base - linesCleared * d.ramp;
    return Math.max(d.min, ms);
  }

  function applyDropSpeed() {
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, currentDropMs());
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var states = SHAPES[p.type].rot;
    var state = states[p.rot % states.length];
    var out = [];
    for (var i = 0; i &lt; state.length; i++) {
      out.push({ x: p.x + state[i].x, y: p.y + state[i].y });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var type = KEYS[Math.floor(Math.random() * KEYS.length)];
    piece = { type: type, rot: 0, x: 3, y: 0 };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    var color = SHAPES[piece.type].color;
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = color;
    }
    piece = null;
  }

  function showPopup(count) {
    var msgs = { 1: &#x27;CLEAR!&#x27;, 2: &#x27;DOUBLE!&#x27;, 3: &#x27;TRIPLE!&#x27;, 4: &#x27;TETRIS!&#x27; };
    var colors = { 1: &#x27;#4361ee&#x27;, 2: &#x27;#43aa8b&#x27;, 3: &#x27;#f3722c&#x27;, 4: &#x27;#e63946&#x27; };
    popupEl.textContent = msgs[count] || &#x27;CLEAR!&#x27;;
    popupEl.style.color = colors[count] || &#x27;#fff&#x27;;
    popupEl.classList.remove(&#x27;show&#x27;);
    void popupEl.offsetWidth; // restart animation
    popupEl.classList.add(&#x27;show&#x27;);
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(function () { popupEl.classList.remove(&#x27;show&#x27;); }, 800);
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      var pts = Math.round((LINE_SCORE[cleared] || cleared * 100) * DIFF_MULT[difficulty]);
      score += pts;
      linesCleared += cleared;
      scoreEl.textContent = score;
      linesEl.textContent = linesCleared;
      if (score &gt; highScore) { highScore = score; highEl.textContent = highScore; }
      if (cleared &gt;= 2) showPopup(cleared);
      else showPopup(1);
      if (running) applyDropSpeed();
    }
  }

  function paint() {
    // Remove only block elements, keep the popup.
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    for (var i = 0; i &lt; blocks.length; i++) blocks[i].remove();
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var color = SHAPES[piece.type].color;
      var cells = pieceCells(piece);
      for (var j = 0; j &lt; cells.length; j++) {
        if (cells[j].y &gt;= 0) drawBlock(cells[j].x, cells[j].y, color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var states = SHAPES[piece.type].rot;
    var nextRot = (piece.rot + 1) % states.length;
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var cand = { type: piece.type, rot: nextRot, x: piece.x + kicks[k], y: piece.y };
      if (!collides(cand)) { piece = cand; paint(); return; }
    }
  }

  function setDifficulty(d) {
    if (!DIFFS[d]) return;
    difficulty = d;
    var btns = diffBar.querySelectorAll(&#x27;button&#x27;);
    for (var i = 0; i &lt; btns.length; i++) {
      btns[i].classList.toggle(&#x27;active&#x27;, btns[i].getAttribute(&#x27;data-diff&#x27;) === d);
    }
    if (running) applyDropSpeed();
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0; linesCleared = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    linesEl.textContent = &#x27;0&#x27;;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    applyDropSpeed();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  diffBar.addEventListener(&#x27;click&#x27;, function (e) {
    var b = e.target.closest(&#x27;button&#x27;);
    if (b) setDifficulty(b.getAttribute(&#x27;data-diff&#x27;));
  });

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = { type: &#x27;T&#x27;, rot: 0, x: 3, y: 0 };
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

    <button id="stop" disabled>Stop</button>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
