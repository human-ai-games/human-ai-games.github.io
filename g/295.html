<title>Falling blocks</title>
<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .topbar { display: flex; align-items: center; gap: 20px; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .score .val { font-weight: 700; color: #222; }
  .score.high .val { color: #c47a00; }
  .levels { display: flex; gap: 8px; align-items: center; }
  .levels button { font-size: 15px; padding: 6px 14px; border: 2px solid #bbb; background: #f0f0f0; color: #444; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .levels button.active { border-color: #2a7; background: #d8f5e6; color: #164; font-weight: 600; }
  .sound-toggle { font-size: 15px; padding: 6px 12px; border: 2px solid #bbb; background: #f0f0f0; color: #444; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .sound-toggle.on { border-color: #47a; background: #dde8f7; color: #235; font-weight: 600; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .block { position: absolute; box-sizing: border-box; background: #555; border: 1px solid #ececec; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the falling piece with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to speed the drop. Pick a difficulty, then clear full rows to score. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;levels&quot; id=&quot;levels&quot;&gt;
    &lt;button data-level=&quot;easy&quot;&gt;Easy&lt;/button&gt;
    &lt;button data-level=&quot;medium&quot;&gt;Medium&lt;/button&gt;
    &lt;button data-level=&quot;hard&quot;&gt;Hard&lt;/button&gt;
    &lt;button class=&quot;sound-toggle on&quot; id=&quot;soundToggle&quot;&gt;&amp;#128266; Sound: On&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;score high&quot;&gt;Best: &lt;span class=&quot;val&quot; id=&quot;highScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;score&quot;&gt;Level: &lt;span class=&quot;val&quot; id=&quot;levelName&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var SPEEDS = { easy: 700, medium: 450, hard: 250 };
  var LEVEL_NAMES = { easy: &#x27;Easy&#x27;, medium: &#x27;Medium&#x27;, hard: &#x27;Hard&#x27; };
  var difficulty = &#x27;medium&#x27;;
  var DROP_MS = SPEEDS[difficulty];
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0;
  var highScore = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var highScoreEl = document.getElementById(&#x27;highScore&#x27;);
  var levelNameEl = document.getElementById(&#x27;levelName&#x27;);
  var levelsEl = document.getElementById(&#x27;levels&#x27;);
  var soundToggle = document.getElementById(&#x27;soundToggle&#x27;);

  function updateHighScore() {
    if (score &gt; highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
    }
  }

  // ---- Sound (Web Audio, procedural) ----
  var soundOn = true;
  var audioCtx = null;
  var musicTimer = null;
  var musicStep = 0;
  var MELODY = [220, 0, 277, 0, 330, 0, 277, 0, 262, 0, 330, 0, 392, 0, 330, 0];

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) {
      try { audioCtx.resume(); } catch (_) {}
    }
    return audioCtx;
  }

  function beep(freq, dur, type, vol) {
    if (!soundOn) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || &#x27;square&#x27;;
    osc.frequency.value = freq;
    var v = vol == null ? 0.12 : vol;
    var t = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(v, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function moveSound() { beep(330, 0.05, &#x27;square&#x27;, 0.05); }
  function dropSound() { beep(160, 0.08, &#x27;square&#x27;, 0.07); }
  function clearSound() {
    beep(523, 0.10, &#x27;triangle&#x27;, 0.14);
    setTimeout(function () { beep(659, 0.10, &#x27;triangle&#x27;, 0.14); }, 90);
    setTimeout(function () { beep(784, 0.14, &#x27;triangle&#x27;, 0.14); }, 180);
  }
  function gameOverSound() {
    beep(200, 0.25, &#x27;sawtooth&#x27;, 0.12);
    setTimeout(function () { beep(150, 0.30, &#x27;sawtooth&#x27;, 0.12); }, 200);
    setTimeout(function () { beep(100, 0.40, &#x27;sawtooth&#x27;, 0.12); }, 420);
  }

  function playMusicStep() {
    if (!soundOn) return;
    var note = MELODY[musicStep % MELODY.length];
    if (note &gt; 0) beep(note, 0.18, &#x27;triangle&#x27;, 0.04);
    musicStep++;
  }
  function startMusic() {
    stopMusic();
    if (!soundOn) return;
    musicStep = 0;
    musicTimer = setInterval(playMusicStep, 180);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    return [
      { x: p.x,     y: p.y },
      { x: p.x + 1, y: p.y },
      { x: p.x,     y: p.y + 1 },
      { x: p.x + 1, y: p.y + 1 },
    ];
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    piece = { x: Math.floor((COLS - 2) / 2), y: 0 };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = 1;
    }
    piece = null;
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared;
      scoreEl.textContent = score;
      updateHighScore();
      clearSound();
    }
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y);
      }
    }
  }

  function drawBlock(cx, cy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      dropSound();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); moveSound(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    updateHighScore();
    stopMusic();
    gameOverSound();
  }

  function setDifficulty(level) {
    if (!SPEEDS[level]) return;
    difficulty = level;
    DROP_MS = SPEEDS[level];
    levelNameEl.textContent = LEVEL_NAMES[level];
    var btns = levelsEl.querySelectorAll(&#x27;button[data-level]&#x27;);
    for (var i = 0; i &lt; btns.length; i++) {
      btns[i].classList.toggle(&#x27;active&#x27;, btns[i].getAttribute(&#x27;data-level&#x27;) === level);
    }
    if (running &amp;&amp; dropId) {
      clearInterval(dropId);
      dropId = setInterval(stepDown, DROP_MS);
    }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    DROP_MS = SPEEDS[difficulty];
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
    ensureAudio();
    startMusic();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    updateHighScore();
    stopMusic();
  }

  levelsEl.addEventListener(&#x27;click&#x27;, function (e) {
    var btn = e.target.closest(&#x27;button[data-level]&#x27;);
    if (!btn) return;
    setDifficulty(btn.getAttribute(&#x27;data-level&#x27;));
  });

  soundToggle.addEventListener(&#x27;click&#x27;, function () {
    soundOn = !soundOn;
    soundToggle.classList.toggle(&#x27;on&#x27;, soundOn);
    soundToggle.innerHTML = soundOn ? &#x27;\uD83D\uDD0A Sound: On&#x27; : &#x27;\uD83D\uDD07 Sound: Off&#x27;;
    if (soundOn) {
      ensureAudio();
      if (running) startMusic();
    } else {
      stopMusic();
    }
  });

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial setup: default difficulty highlighted and a preview piece shown.
  setDifficulty(&#x27;medium&#x27;);
  newGrid();
  piece = { x: Math.floor((COLS - 2) / 2), y: 0 };
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
