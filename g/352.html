&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌈 Rainbow Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the rainbow snake with the arrow keys and eat the glowing fruit to grow. Hitting a wall or your own tail ends the round — use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;sparkles&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var TICK_MS = 220;
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var foods = [];
  var score = 0;
  var hue = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // ---- Sparkle background ----
  var canvas = document.getElementById(&#x27;sparkles&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var sparks = [];
  var sparkAnimId = null;
  function initSparks() {
    sparks = [];
    for (var i = 0; i &lt; 60; i++) {
      sparks.push({
        x: Math.random() * 600,
        y: Math.random() * 440,
        r: 0.6 + Math.random() * 1.8,
        h: Math.random() * 360,
        vy: 6 + Math.random() * 18,
        vx: (Math.random() - 0.5) * 8,
        tw: Math.random() * Math.PI * 2,
        tws: 1.5 + Math.random() * 2.5
      });
    }
  }
  var lastSpark = 0;
  function drawSparks(ts) {
    var dt = lastSpark ? (ts - lastSpark) / 1000 : 0.016;
    lastSpark = ts;
    ctx.clearRect(0, 0, 600, 440);
    for (var i = 0; i &lt; sparks.length; i++) {
      var s = sparks[i];
      s.y += s.vy * dt;
      s.x += s.vx * dt;
      s.tw += s.tws * dt;
      if (s.y &gt; 445) { s.y = -5; s.x = Math.random() * 600; }
      if (s.x &lt; -5) s.x = 605; else if (s.x &gt; 605) s.x = -5;
      var alpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(s.tw));
      ctx.beginPath();
      ctx.fillStyle = &#x27;hsla(&#x27; + ((s.h + hue) % 360) + &#x27;,95%,65%,&#x27; + alpha + &#x27;)&#x27;;
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 6;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    sparkAnimId = requestAnimationFrame(drawSparks);
  }
  function startSparks() {
    if (sparkAnimId) cancelAnimationFrame(sparkAnimId);
    lastSpark = 0;
    sparkAnimId = requestAnimationFrame(drawSparks);
  }
  function stopSparks() {
    if (sparkAnimId) { cancelAnimationFrame(sparkAnimId); sparkAnimId = null; }
  }

  function rainbow(i) { return &#x27;hsl(&#x27; + (((i * 25) + hue) % 360) + &#x27;, 90%, 55%)&#x27;; }

  function clearField() {
    var kids = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i = 0; i &lt; kids.length; i++) kids[i].remove();
  }

  function drawSeg(x, y, isHead, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + (isHead ? &#x27;head&#x27; : &#x27;seg&#x27;);
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    if (isHead) {
      var e1 = document.createElement(&#x27;div&#x27;); e1.className = &#x27;eye&#x27;;
      var e2 = document.createElement(&#x27;div&#x27;); e2.className = &#x27;eye&#x27;;
      var positions = eyePositions();
      e1.style.left = positions[0].x + &#x27;px&#x27;; e1.style.top = positions[0].y + &#x27;px&#x27;;
      e2.style.left = positions[1].x + &#x27;px&#x27;; e2.style.top = positions[1].y + &#x27;px&#x27;;
      el.appendChild(e1); el.appendChild(e2);
      var t = document.createElement(&#x27;div&#x27;);
      t.style.position = &#x27;absolute&#x27;;
      t.style.background = &#x27;#ff2d6f&#x27;;
      var tp = tonguePos();
      Object.assign(t.style, tp);
      el.appendChild(t);
    }
    field.appendChild(el);
  }

  function eyePositions() {
    var s = CELL;
    if (dir.x === 1) return [{x:s-8,y:4},{x:s-8,y:s-8}];
    if (dir.x === -1) return [{x:4,y:4},{x:4,y:s-8}];
    if (dir.y === -1) return [{x:4,y:4},{x:s-8,y:4}];
    return [{x:4,y:s-8},{x:s-8,y:s-8}];
  }

  function tonguePos() {
    var s = CELL;
    if (dir.x === 1) return {right:&#x27;-5px&#x27;, top:(s/2-1)+&#x27;px&#x27;, width:&#x27;6px&#x27;, height:&#x27;2px&#x27;};
    if (dir.x === -1) return {left:&#x27;-5px&#x27;, top:(s/2-1)+&#x27;px&#x27;, width:&#x27;6px&#x27;, height:&#x27;2px&#x27;};
    if (dir.y === -1) return {top:&#x27;-5px&#x27;, left:(s/2-1)+&#x27;px&#x27;, width:&#x27;2px&#x27;, height:&#x27;6px&#x27;};
    return {bottom:&#x27;-5px&#x27;, left:(s/2-1)+&#x27;px&#x27;, width:&#x27;2px&#x27;, height:&#x27;6px&#x27;};
  }

  function drawFood(f) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell food&#x27;;
    el.style.left = (f.x * CELL) + &#x27;px&#x27;;
    el.style.top = (f.y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.color = rainbow(f.x + f.y * 3);
    el.style.background = &#x27;currentColor&#x27;;
    field.appendChild(el);
  }

  function paint() {
    clearField();
    for (var j = 0; j &lt; foods.length; j++) drawFood(foods[j]);
    for (var i = 0; i &lt; snake.length; i++) drawSeg(snake[i].x, snake[i].y, i === 0, rainbow(i));
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    for (var j = 0; j &lt; foods.length; j++) if (foods[j].x === x &amp;&amp; foods[j].y === y) return true;
    return false;
  }

  function spawnFood() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { foods.push({ x: x, y: y }); return; }
    }
  }

  function ensureFoods() {
    while (foods.length &lt; 2) spawnFood();
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function tick() {
    if (!running) return;
    hue = (hue + 8) % 360;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateIndex = -1;
    for (var f = 0; f &lt; foods.length; f++) {
      if (foods[f].x === nx &amp;&amp; foods[f].y === ny) { ateIndex = f; break; }
    }
    var ateFood = ateIndex !== -1;
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      foods.splice(ateIndex, 1);
      ensureFoods();
    } else {
      snake.pop();
    }
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    foods = [];
    initSnake();
    ensureFoods();
    paint();
    initSparks();
    startSparks();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    stopSparks();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initSnake();
  ensureFoods();
  initSparks();
  paint();
&lt;/script&gt;
