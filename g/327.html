&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ Cosmic Blaster ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Soar past planet Earth in your rocket — move with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to fire. Blast the colorful aliens for points — smaller, faster ones are worth more!&lt;/p&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 56, SHIP_H = 52, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 7, BULLET_H = 16, BULLET_SPEED = 8;
  var SPAWN_INTERVAL = 1000;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], sparks = [];
  var score = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var earth = document.getElementById(&#x27;earth&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var TYPES = [
    { emoji: &#x27;👾&#x27;, size: 40, speed: 1.4, points: 1, color: &#x27;#5cff9d&#x27; },
    { emoji: &#x27;👽&#x27;, size: 34, speed: 2.0, points: 2, color: &#x27;#33e1ff&#x27; },
    { emoji: &#x27;🛸&#x27;, size: 28, speed: 2.8, points: 3, color: &#x27;#ff5edb&#x27; },
    { emoji: &#x27;⭐&#x27;, size: 22, speed: 3.6, points: 5, color: &#x27;#ffef5c&#x27; }

  (function makeStars() {
    for (var i = 0; i &lt; 60; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      var sz = Math.random() * 2.5 + 1;
      s.style.width = sz + &#x27;px&#x27;; s.style.height = sz + &#x27;px&#x27;;
      s.style.left = Math.random() * FIELD_W + &#x27;px&#x27;;
      s.style.top = Math.random() * (FIELD_H * 0.6) + &#x27;px&#x27;;
      s.style.opacity = (Math.random() * 0.6 + 0.3).toFixed(2);
      field.appendChild(s);
    }
  })();

  // Clouds drifting across Earth
  var clouds = [];
  (function makeClouds() {
    for (var i = 0; i &lt; 7; i++) {
      var c = document.createElement(&#x27;div&#x27;);
      c.className = &#x27;cloud&#x27;;
      var w = Math.random() * 140 + 90;
      var h = w * (0.35 + Math.random() * 0.2);
      c.style.width = w + &#x27;px&#x27;; c.style.height = h + &#x27;px&#x27;;
      var cx = Math.random() * 700 + 40;
      var cy = Math.random() * 260 + 120;
      c.style.left = cx + &#x27;px&#x27;; c.style.top = cy + &#x27;px&#x27;;
      earth.appendChild(c);
      clouds.push({ el: c, x: cx, speed: 0.15 + Math.random() * 0.25, w: w });
    }
  })();

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var type = TYPES[Math.floor(Math.random() * TYPES.length)];
    var t = { x: Math.random() * (FIELD_W - type.size), y: -type.size, type: type, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.textContent = type.emoji;
    el.style.width = type.size + &#x27;px&#x27;;
    el.style.height = type.size + &#x27;px&#x27;;
    el.style.fontSize = (type.size - 4) + &#x27;px&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    el.style.filter = &#x27;drop-shadow(0 0 6px &#x27; + type.color + &#x27;)&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 220) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
    beep(660, 0.06);
  }

  function boom(x, y, pts, color) {
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;boom&#x27;;
    b.textContent = &#x27;💥&#x27;;
    b.style.left = (x - 30) + &#x27;px&#x27;;
    b.style.top = (y - 30) + &#x27;px&#x27;;
    field.appendChild(b);
    setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 550);

    var colors = [&#x27;#fff&#x27;, &#x27;#ffef5c&#x27;, &#x27;#ff8a3d&#x27;, color];
    for (var i = 0; i &lt; 12; i++) {
      var sp = { x: x, y: y, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.5) * 9, life: 22, el: null };
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;spark&#x27;;
      var sz = Math.random() * 5 + 3;
      el.style.width = sz + &#x27;px&#x27;; el.style.height = sz + &#x27;px&#x27;;
      var c = colors[Math.floor(Math.random() * colors.length)];
      el.style.background = c;
      el.style.boxShadow = &#x27;0 0 8px &#x27; + c;
      el.style.left = x + &#x27;px&#x27;; el.style.top = y + &#x27;px&#x27;;
      field.appendChild(el);
      sp.el = el;
      sparks.push(sp);
    }

    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;points&#x27;;
    p.textContent = &#x27;+&#x27; + pts;
    p.style.color = color;
    p.style.left = x + &#x27;px&#x27;;
    p.style.top = (y - 20) + &#x27;px&#x27;;
    field.appendChild(p);
    setTimeout(function(){ if (p.parentNode) p.parentNode.removeChild(p); }, 700);

    field.classList.remove(&#x27;shake&#x27;);
    void field.offsetWidth;
    field.classList.add(&#x27;shake&#x27;);
  }

  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;;
      o.frequency.value = freq;
      g.gain.value = 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function tick() {
    if (!running) return;
    // Drift clouds
    for (var c = 0; c &lt; clouds.length; c++) {
      var cl = clouds[c];
      cl.x -= cl.speed;
      if (cl.x + cl.w &lt; 0) cl.x = 840;
      cl.el.style.left = cl.x + &#x27;px&#x27;;
    }
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += t.type.speed;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    for (var s = sparks.length - 1; s &gt;= 0; s--) {
      var sp = sparks[s];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.3; sp.life--;
      if (sp.life &lt;= 0) { if (sp.el.parentNode) sp.el.parentNode.removeChild(sp.el); sparks.splice(s, 1); continue; }
      sp.el.style.left = sp.x + &#x27;px&#x27;; sp.el.style.top = sp.y + &#x27;px&#x27;;
      sp.el.style.opacity = (sp.life / 22).toFixed(2);
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        var sz = t2.type.size;
        if (b2.x &lt; t2.x + sz &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + sz &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          boom(t2.x + sz / 2, t2.y + sz / 2, t2.type.points, t2.type.color);
          beep(150, 0.22, &#x27;sawtooth&#x27;);
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += t2.type.points;
          scoreEl.textContent = score;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    sparks.forEach(function (sp) { if (sp.el.parentNode) sp.el.parentNode.removeChild(sp.el); });
    bullets = []; targets = []; sparks = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) spawnBullet();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.

    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {

  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,

        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,

  function reportSize() {

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();

      var d = document.documentElement;

      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
