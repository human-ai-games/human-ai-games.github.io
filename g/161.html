<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🦒 Jungle Jumper</b> &middot; Game 161 &middot; Professional producer &middot; Basic game: Gravity jumper</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .field { position: relative; width: 620px; height: 430px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; }
  .scorebox { position: absolute; top: 8px; right: 10px; background: rgba(0,0,0,0.55); color: #ffd85e;
    font-size: 20px; font-weight: 700; padding: 6px 12px; border-radius: 8px; display: flex; align-items: center; gap: 6px; z-index: 20; }
  .coinIcon { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff2a8, #f5c400 60%, #b88900); display: inline-block; border: 1px solid #a97e00; }
  canvas { display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦒 Jungle Jumper&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click the field) to make the giraffe jump. Leap the chomping hippos and ostriches and pop red balloons for bonus coins — use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;scorebox&quot;&gt;&lt;span class=&quot;coinIcon&quot;&gt;&lt;/span&gt;Coins: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;430&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 430;
  var GRASS_H = 70;             // taller grass
  var GROUND_Y = H - GRASS_H;   // top of grass / obstacle standing line
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var GRAVITY = 0.55, JUMP_V = -16;
  var SPEED = 3.6;
  var SPAWN_INTERVAL = 2200;
  var running = false, animId = null, spawnId = null, balloonId = null;
  var gameOver = false;
  var score = 0;
  var night = false;

  var GW = 90, GH = 130;
  var heroScreenX = 70;         // giraffe on the LEFT
  var heroY = GROUND_Y - GH;
  var heroVY = 0;
  var worldScroll = 0;

  var obstacles = [];
  var balloons = [];
  var bgAnimals = [];

  // ---------- audio ----------
  var actx = null, masterGain = null;
  function ensureAudio(){
    if(!actx){
      try{
        actx = new (window.AudioContext||window.webkitAudioContext)();
        masterGain = actx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(actx.destination);
      }catch(_){}
    }
    if(actx &amp;&amp; actx.state===&#x27;suspended&#x27;){ try{actx.resume();}catch(_){}}
  }
  function tone(freq, start, dur, type, vol){
    if(!actx) return;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
    o.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.0001,start);
    g.gain.exponentialRampToValueAtTime(vol||0.15,start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.start(start); o.stop(start+dur+0.02);
  }
  function coinSound(){
    if(!actx) return; var t=actx.currentTime;
    tone(988,t,0.14,&#x27;square&#x27;,0.16); tone(1319,t+0.08,0.16,&#x27;square&#x27;,0.16);
  }
  function popSound(){
    if(!actx) return; var t=actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=&#x27;triangle&#x27;; o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(120,t+0.12);
    o.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    o.start(t); o.stop(t+0.14);
  }
  function lionRoar(){
    if(!actx) return; var t=actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain(), f=actx.createBiquadFilter();
    o.type=&#x27;sawtooth&#x27;;
    o.frequency.setValueAtTime(70,t);
    o.frequency.linearRampToValueAtTime(120,t+0.3);
    o.frequency.linearRampToValueAtTime(55,t+1.1);
    f.type=&#x27;lowpass&#x27;; f.frequency.setValueAtTime(500,t); f.frequency.linearRampToValueAtTime(220,t+1.1);
    o.connect(f); f.connect(g); g.connect(masterGain);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.35,t+0.15);
    g.gain.setValueAtTime(0.35,t+0.7);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
    o.start(t); o.stop(t+1.25);
  }

  // Upbeat melody: 12 short stanzas (phrases) that loop.
  // Each stanza = 4 notes. Scheduler advances stanza by stanza.
  var SCALE = { C:523.25,D:587.33,E:659.25,F:698.46,G:783.99,A:880,B:987.77,C2:1046.5,r:0 };
  var STANZAS = [
    [&#x27;C&#x27;,&#x27;E&#x27;,&#x27;G&#x27;,&#x27;C2&#x27;], [&#x27;C2&#x27;,&#x27;G&#x27;,&#x27;E&#x27;,&#x27;C&#x27;], [&#x27;D&#x27;,&#x27;F&#x27;,&#x27;A&#x27;,&#x27;D&#x27;], [&#x27;A&#x27;,&#x27;F&#x27;,&#x27;D&#x27;,&#x27;A&#x27;],
    [&#x27;E&#x27;,&#x27;G&#x27;,&#x27;C2&#x27;,&#x27;E&#x27;], [&#x27;G&#x27;,&#x27;E&#x27;,&#x27;C&#x27;,&#x27;G&#x27;], [&#x27;F&#x27;,&#x27;A&#x27;,&#x27;C2&#x27;,&#x27;A&#x27;], [&#x27;C&#x27;,&#x27;G&#x27;,&#x27;E&#x27;,&#x27;C&#x27;],
    [&#x27;D&#x27;,&#x27;A&#x27;,&#x27;F&#x27;,&#x27;D&#x27;], [&#x27;E&#x27;,&#x27;C2&#x27;,&#x27;G&#x27;,&#x27;E&#x27;], [&#x27;G&#x27;,&#x27;C2&#x27;,&#x27;B&#x27;,&#x27;A&#x27;], [&#x27;C2&#x27;,&#x27;G&#x27;,&#x27;E&#x27;,&#x27;C&#x27;]
  ];
  var BASS = [&#x27;C&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;D&#x27;,&#x27;E&#x27;,&#x27;E&#x27;,&#x27;F&#x27;,&#x27;C&#x27;,&#x27;D&#x27;,&#x27;E&#x27;,&#x27;G&#x27;,&#x27;C&#x27;];
  var musicTimer=null, stanzaIdx=0, noteIdx=0;
  var NOTE_DUR=0.22;
  function scheduleStanzaNote(){
    if(!actx || !running) return;
    var t = actx.currentTime + 0.03;
    var st = STANZAS[stanzaIdx];
    var n = st[noteIdx];
    if(SCALE[n]) tone(SCALE[n], t, NOTE_DUR*0.9, &#x27;square&#x27;, 0.11);
    // bass note on first beat of stanza
    if(noteIdx===0){
      var bn = BASS[stanzaIdx];
      if(SCALE[bn]) tone(SCALE[bn]/2, t, NOTE_DUR*3.6, &#x27;triangle&#x27;, 0.08);
    }
    noteIdx++;
    if(noteIdx&gt;=st.length){
      noteIdx=0;
      stanzaIdx=(stanzaIdx+1)%STANZAS.length;
    }
  }
  function startMusic(){
    stopMusic();
    stanzaIdx=0; noteIdx=0;
    if(!actx) return;
    musicTimer = setInterval(scheduleStanzaNote, NOTE_DUR*1000);
  }
  function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

  var roarTimer=null;
  function startRoars(){
    stopRoars();
    roarTimer = setInterval(function(){ if(running &amp;&amp; Math.random()&lt;0.5) lionRoar(); }, 9000);
  }
  function stopRoars(){ if(roarTimer){ clearInterval(roarTimer); roarTimer=null; } }

  // ---------- background ----------
  function initBackground(){
    bgAnimals = [];
    for(var i=0;i&lt;7;i++){
      bgAnimals.push({ x: 430 + Math.random()*170, y: 250 + Math.random()*40, type: Math.random()&lt;0.5?&#x27;g&#x27;:&#x27;e&#x27;, ph: Math.random()*Math.PI*2 });
    }
  }

  function paintSky(){
    var g = ctx.createLinearGradient(0,0,0,H);
    if(night){
      g.addColorStop(0,&#x27;#0d1b3a&#x27;); g.addColorStop(0.4,&#x27;#1c2c55&#x27;);
      g.addColorStop(0.7,&#x27;#2c3a4a&#x27;); g.addColorStop(1,&#x27;#20321f&#x27;);
    } else {
      g.addColorStop(0,&#x27;#f6c26b&#x27;); g.addColorStop(0.22,&#x27;#f3a95a&#x27;);
      g.addColorStop(0.52,&#x27;#cfe08a&#x27;); g.addColorStop(0.72,&#x27;#9ac96f&#x27;); g.addColorStop(1,&#x27;#6fa84f&#x27;);
    }
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(night){
      // stars
      ctx.fillStyle=&#x27;#fff&#x27;;
      for(var s=0;s&lt;40;s++){
        var sx=(s*97+13)%W, sy=(s*53+7)%230;
        var tw = 0.5+0.5*Math.sin(worldScroll/30 + s);
        ctx.globalAlpha=0.4+0.5*tw;
        ctx.fillRect(sx,sy,1.6,1.6);
      }
      ctx.globalAlpha=1;
    }
  }

  function drawBackground(t){
    ctx.save();
    if(night){
      // moon
      var mg=ctx.createRadialGradient(500,120,6,500,120,60);
      mg.addColorStop(0,&#x27;rgba(230,240,255,0.6)&#x27;); mg.addColorStop(1,&#x27;rgba(230,240,255,0)&#x27;);
      ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(500,120,60,0,7); ctx.fill();
      ctx.fillStyle=&#x27;#e8eeff&#x27;; ctx.beginPath(); ctx.arc(500,120,28,0,7); ctx.fill();
      ctx.fillStyle=night?&#x27;#20325a&#x27;:&#x27;#f6c26b&#x27;;
      ctx.beginPath(); ctx.arc(512,114,26,0,7); ctx.fill();
    } else {
      var sg = ctx.createRadialGradient(500,150,10,500,150,90);
      sg.addColorStop(0,&#x27;#fff2c0&#x27;); sg.addColorStop(1,&#x27;rgba(255,200,90,0)&#x27;);
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(500,150,90,0,7); ctx.fill();
      ctx.fillStyle=&#x27;#f7d17a&#x27;; ctx.beginPath(); ctx.arc(500,150,34,0,7); ctx.fill();
    }
    // ridge
    ctx.fillStyle=night?&#x27;#3a2b4a&#x27;:&#x27;#b9863f&#x27;;
    ctx.beginPath();
    ctx.moveTo(360,300); ctx.lineTo(420,255); ctx.lineTo(470,285); ctx.lineTo(520,240);
    ctx.lineTo(575,280); ctx.lineTo(620,255); ctx.lineTo(620,300); ctx.closePath(); ctx.fill();
    ctx.fillStyle=night?&#x27;#2a2038&#x27;:&#x27;#9c6d34&#x27;;
    ctx.beginPath();
    ctx.moveTo(360,300); ctx.lineTo(410,278); ctx.lineTo(460,300); ctx.lineTo(520,275);
    ctx.lineTo(580,300); ctx.lineTo(620,285); ctx.lineTo(620,300); ctx.closePath(); ctx.fill();
    bgAnimals.forEach(function(a){
      var bob = Math.sin(t/500 + a.ph)*1.5;
      ctx.fillStyle=night?&#x27;#181026&#x27;:&#x27;#5a3a18&#x27;;
      if(a.type===&#x27;g&#x27;){
        ctx.fillRect(a.x, a.y+bob, 6, 8);
        ctx.fillRect(a.x+4, a.y-8+bob, 2, 10);
        ctx.fillRect(a.x+3, a.y-10+bob, 4, 3);
      } else {
        ctx.beginPath(); ctx.ellipse(a.x+4, a.y+4+bob, 6, 4, 0, 0, 7); ctx.fill();
        ctx.fillRect(a.x+8, a.y+6+bob, 2, 4);
      }
    });
    ctx.strokeStyle=night?&#x27;#2a1c12&#x27;:&#x27;#5a3a1c&#x27;; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(430,300); ctx.lineTo(430,260); ctx.stroke();
    ctx.fillStyle=night?&#x27;#1f3a1a&#x27;:&#x27;#3f6b34&#x27;;
    ctx.beginPath(); ctx.ellipse(430,255,26,10,0,0,7); ctx.fill();
    ctx.restore();
  }

  function drawJungle(){
    var par = -worldScroll*0.4;
    var leaf = night?&#x27;#16321a&#x27;:&#x27;#274d20&#x27;;
    var trunk = night?&#x27;#2a1c12&#x27;:&#x27;#5a3a1c&#x27;;
    ctx.save();
    for(var i=-1;i&lt;4;i++){
      var bx = ((i*220 + (par%220)) % 900);
      if(bx &lt; -120) bx += 900;
      drawTree(bx, 320, 1, leaf, trunk);
    }
    ctx.fillStyle=night?&#x27;#1a3418&#x27;:&#x27;#2f5a26&#x27;;
    for(var c=-1;c&lt;8;c++){
      var cx = c*90 + ((par*1.1)%90);
      ctx.beginPath(); ctx.arc(cx, 30, 46, 0, 7); ctx.fill();
    }
    ctx.fillStyle=night?&#x27;#1f3d1c&#x27;:&#x27;#35662c&#x27;;
    for(var c2=-1;c2&lt;9;c2++){
      var cx2 = c2*80 + 40 + ((par*1.1)%80);
      ctx.beginPath(); ctx.arc(cx2, 55, 34, 0, 7); ctx.fill();
    }
    var vpar = (par*1.1);
    for(var v=0;v&lt;7;v++){
      var vx = ((v*110 + vpar) % 780);
      if(vx&lt;-40) vx+=780;
      var len = 60 + (v%3)*35;
      ctx.strokeStyle=night?&#x27;#255a2a&#x27;:&#x27;#3a7d3f&#x27;; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(vx,70); ctx.quadraticCurveTo(vx+8,70+len/2, vx-4,70+len); ctx.stroke();
      ctx.fillStyle=night?&#x27;#2f6a34&#x27;:&#x27;#4f9c4a&#x27;;
      ctx.beginPath(); ctx.ellipse(vx+6,90,5,3,0.6,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(vx-2,70+len,6,4,-0.4,0,7); ctx.fill();
    }
    ctx.restore();
  }

  function drawTree(x,y,s,leaf,trunk){
    ctx.fillStyle=trunk; ctx.fillRect(x, y-110*s, 22*s, 110*s);
    ctx.fillStyle=leaf;
    ctx.beginPath(); ctx.arc(x+11*s, y-120*s, 44*s,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x-14*s, y-100*s, 30*s,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+38*s, y-100*s, 30*s,0,7); ctx.fill();
  }

  function drawGround(){
    // dirt below grass
    ctx.fillStyle=night?&#x27;#3a2a18&#x27;:&#x27;#6b4a2b&#x27;;
    ctx.fillRect(0, GROUND_Y+18, W, H-(GROUND_Y+18));
    // tall grass band
    var gTop = GROUND_Y;
    ctx.fillStyle=night?&#x27;#2c5a2a&#x27;:&#x27;#4f9c4a&#x27;;
    ctx.fillRect(0, gTop, W, GRASS_H);
    // tall waving blades
    var off = (-worldScroll) % 18;
    for(var g=off-18; g&lt;W; g+=18){
      var sway = Math.sin((worldScroll+g)/40)*4;
      ctx.fillStyle=night?&#x27;#357033&#x27;:&#x27;#3f7d3a&#x27;;
      ctx.beginPath();
      ctx.moveTo(g, GROUND_Y+GRASS_H);
      ctx.quadraticCurveTo(g+3+sway, GROUND_Y+8, g+6+sway, GROUND_Y-14);
      ctx.quadraticCurveTo(g+9+sway, GROUND_Y+8, g+12, GROUND_Y+GRASS_H);
      ctx.closePath(); ctx.fill();
    }
    for(var g2=off-9; g2&lt;W; g2+=18){
      var sway2 = Math.cos((worldScroll+g2)/38)*3;
      ctx.fillStyle=night?&#x27;#2a5f28&#x27;:&#x27;#4a9245&#x27;;
      ctx.beginPath();
      ctx.moveTo(g2, GROUND_Y+GRASS_H);
      ctx.quadraticCurveTo(g2+2+sway2, GROUND_Y+14, g2+5+sway2, GROUND_Y-4);
      ctx.quadraticCurveTo(g2+8+sway2, GROUND_Y+14, g2+10, GROUND_Y+GRASS_H);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawGiraffe(x,y,legPhase){
    ctx.save();
    ctx.translate(x,y);
    var body=night?&#x27;#b88a38&#x27;:&#x27;#d9a441&#x27;, bodyD=night?&#x27;#a07529&#x27;:&#x27;#c48f2f&#x27;, spot=night?&#x27;#6f471a&#x27;:&#x27;#8a5a1e&#x27;, cream=night?&#x27;#c9b78e&#x27;:&#x27;#f0dcae&#x27;;
    var swing = Math.sin(legPhase)*8;
    ctx.strokeStyle=body; ctx.lineWidth=11; ctx.lineCap=&#x27;round&#x27;;
    function leg(lx, ph){
      ctx.beginPath(); ctx.moveTo(lx, 78); ctx.lineTo(lx+ph, 118); ctx.stroke();
      ctx.fillStyle=&#x27;#3a2a12&#x27;; ctx.fillRect(lx+ph-6, 116, 12, 6);
    }
    leg(28, swing); leg(66, -swing);
    leg(22, -swing*0.6); leg(60, swing*0.6);
    ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(46, 66, 34, 24, 0, 0, 7); ctx.fill();
    ctx.fillStyle=bodyD; ctx.beginPath(); ctx.ellipse(46, 74, 34, 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle=body;
    ctx.beginPath(); ctx.moveTo(60,50); ctx.quadraticCurveTo(74,26,78,-10);
    ctx.lineTo(64,-12); ctx.quadraticCurveTo(54,24,44,50); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(74,-20,15,11,-0.3,0,7); ctx.fill();
    ctx.fillStyle=cream; ctx.beginPath(); ctx.ellipse(85,-14,8,7,-0.3,0,7); ctx.fill();
    ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(64,-30,7,4,0.6,0,7); ctx.fill();
    ctx.strokeStyle=body; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(70,-30); ctx.lineTo(68,-42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(76,-30); ctx.lineTo(76,-43); ctx.stroke();
    ctx.fillStyle=&#x27;#5a3a18&#x27;;
    ctx.beginPath(); ctx.arc(68,-43,4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(76,-44,4,0,7); ctx.fill();
    ctx.strokeStyle=&#x27;#7a4a1c&#x27;; ctx.lineWidth=4;
    for(var m=0;m&lt;9;m++){ var mx=64-m*1.4, my=-8+m*7; ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx-5,my-3); ctx.stroke(); }
    ctx.fillStyle=&#x27;#2a1a08&#x27;; ctx.beginPath(); ctx.arc(72,-22,2.6,0,7); ctx.fill();
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(71.2,-23,0.9,0,7); ctx.fill();
    ctx.fillStyle=&#x27;#3a2a12&#x27;; ctx.beginPath(); ctx.arc(88,-13,1.4,0,7); ctx.fill();
    ctx.strokeStyle=body; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(12,60); ctx.lineTo(2,88); ctx.stroke();
    ctx.fillStyle=&#x27;#3a2a12&#x27;; ctx.beginPath(); ctx.arc(2,90,4,0,7); ctx.fill();
    ctx.fillStyle=spot;
    var spots=[[38,58],[56,60],[30,70],[52,74],[64,64],[46,66],[58,42],[66,20],[70,-2],[42,80]];
    spots.forEach(function(s){
      ctx.beginPath(); ctx.moveTo(s[0],s[1]);
      for(var a=0;a&lt;6;a++){ var ang=a/6*Math.PI*2, r=5+((a%2)?2:-1); ctx.lineTo(s[0]+Math.cos(ang)*r, s[1]+Math.sin(ang)*r); }
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();

  function drawHippo(x, chomp){
