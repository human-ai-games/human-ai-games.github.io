  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a1a; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; background: linear-gradient(90deg,#ff2d95,#ffd200,#3cff6e,#00c3ff,#b400ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #cfcfe6; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #fff; margin: 0; }
  .frame { padding: 6px; border-radius: 16px; background: linear-gradient(120deg,#ff2d95,#ffd200,#3cff6e,#00c3ff,#b400ff,#ff2d95); background-size: 300% 300%; animation: rainbow 6s linear infinite; box-shadow: 0 0 24px rgba(180,0,255,.5); }
  @keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
  .field { position: relative; width: 240px; height: 384px; border-radius: 10px; overflow: hidden; background: #06061a; }
  .aurora { position: absolute; inset: 0; z-index: 0; }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(38px); opacity: .55; mix-blend-mode: screen; }
  .a1 { width: 220px; height: 160px; left: -40px; top: -30px; background: #00c3ff; animation: drift1 7s ease-in-out infinite alternate, glow1 4s ease-in-out infinite alternate; }
  .a2 { width: 200px; height: 180px; right: -50px; top: 40px; background: #b400ff; animation: drift2 9s ease-in-out infinite alternate, glow2 5s ease-in-out infinite alternate; }
  .a3 { width: 240px; height: 150px; left: -20px; bottom: -40px; background: #3cff6e; animation: drift3 6s ease-in-out infinite alternate, glow1 4.5s ease-in-out infinite alternate; }
  .a4 { width: 160px; height: 160px; right: -20px; bottom: 10px; background: #ff2d95; animation: drift4 8s ease-in-out infinite alternate, glow2 3.5s ease-in-out infinite alternate; }
  @keyframes drift1 { from{transform:translate(0,0) scale(1)} to{transform:translate(45px,55px) scale(1.15)} }
  @keyframes drift2 { from{transform:translate(0,0) scale(1)} to{transform:translate(-45px,65px) scale(1.2)} }
  @keyframes drift3 { from{transform:translate(0,0) scale(1)} to{transform:translate(55px,-45px) scale(1.1)} }
  @keyframes drift4 { from{transform:translate(0,0) scale(1)} to{transform:translate(-35px,-40px) scale(1.25)} }
  @keyframes glow1 { from{opacity:.35} to{opacity:.7} }
  @keyframes glow2 { from{opacity:.4} to{opacity:.75} }
  .block { position: absolute; z-index: 2; transition: left .12s ease, top .12s ease; display:flex; align-items:center; justify-content:center; }
  .block svg { width:100%; height:100%; display:block; }
  .block.spin svg { animation: spinpop .18s ease-out; }
  @keyframes spinpop { 0%{transform:rotate(-40deg) scale(.8)} 60%{transform:rotate(10deg) scale(1.08)} 100%{transform:rotate(0) scale(1)} }
  .spark { position: absolute; z-index: 5; pointer-events: none; }

  .gameover.show { animation: goIn .6s ease-out forwards; }
  @keyframes goIn { from{opacity:0; transform:scale(.4)} 60%{opacity:1; transform:scale(1.12)} 100%{opacity:1; transform:scale(1)} }
  .gameover span {
    font-family: &quot;Comic Sans MS&quot;, &quot;Chalkboard SE&quot;, &quot;Baloo&quot;, system-ui, sans-serif;
    font-weight: 800; font-size: 40px; text-align:center; line-height:1.1;

    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;

  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Aurora Blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to drop faster. Fill a whole row to clear it in a burst of stars and score a point!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;frame&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;aurora&quot;&gt;&lt;span class=&quot;a1&quot;&gt;&lt;/span&gt;&lt;span class=&quot;a2&quot;&gt;&lt;/span&gt;&lt;span class=&quot;a3&quot;&gt;&lt;/span&gt;&lt;span class=&quot;a4&quot;&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;gameover&quot; id=&quot;gameover&quot;&gt;&lt;span&gt;Game&lt;br&gt;Over!&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null;
  var grid = [], piece = null, score = 0, linesCleared = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var gameoverEl = document.getElementById(&#x27;gameover&#x27;);

  var STAR_PATH = &quot;M12 2 C12.9 2 13.6 2.6 13.9 3.4 L15.4 7.9 L20.2 8 C22.4 8.05 23.3 10.8 21.5 12.1 L17.7 14.9 L19.1 19.5 C19.7 21.6 17.4 23.3 15.6 22 L12 19.4 L8.4 22 C6.6 23.3 4.3 21.6 4.9 19.5 L6.3 14.9 L2.5 12.1 C0.7 10.8 1.6 8.05 3.8 8 L8.6 7.9 L10.1 3.4 C10.4 2.6 11.1 2 12 2 Z&quot;;

  var SHAPES = {
    O: { color:&#x27;#ff2d95&#x27;, rot:[[[0,0],[1,0],[0,1],[1,1]]] },
    I: { color:&#x27;#3cff6e&#x27;, rot:[
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]]
    ]},
    T: { color:&#x27;#ff9500&#x27;, rot:[
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]]
    ]},
    L: { color:&#x27;#00c3ff&#x27;, rot:[
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]]
    ]},
    J: { color:&#x27;#b400ff&#x27;, rot:[
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]]
    ]}
  };
  var TYPES = [&#x27;O&#x27;,&#x27;I&#x27;,&#x27;T&#x27;,&#x27;L&#x27;,&#x27;J&#x27;];

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function cellsOf(p) {
    var offs = SHAPES[p.type].rot[p.rot % SHAPES[p.type].rot.length];
    return offs.map(function(o){ return { x:p.x+o[0], y:p.y+o[1] }; });
  }

  function collides(p) {
    var cells = cellsOf(p);
    for (var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var t = TYPES[Math.floor(Math.random()*TYPES.length)];
    piece = { type:t, rot:0, x:Math.floor((COLS-3)/2), y:-1, justRotated:false };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = cellsOf(piece);
    var color = SHAPES[piece.type].color;
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS &amp;&amp; c.x&gt;=0 &amp;&amp; c.x&lt;COLS) grid[c.y][c.x]=color;
    }
    piece = null;
  }

  function clearFullRows() {
    var fullRows = [];
    for (var r=0;r&lt;ROWS;r++){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){ full=false; break; }
      if (full) fullRows.push(r);
    }
    if (fullRows.length===0) return;
    linesCleared += fullRows.length;
    // intensity grows with total lines cleared this game AND how many at once
    var levelBoost = Math.min(3, 1 + linesCleared/12);
    var comboBoost = fullRows.length; // 1..4
    var intensity = levelBoost * comboBoost;
    fullRows.forEach(function(r){ burstRow(r, intensity); });
    fullRows.forEach(function(r){
      grid.splice(r,1);
      var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
      grid.unshift(empty);
    });
    score += fullRows.length;
    scoreEl.textContent = score;
  }

  function makeStarSVG(color, size) {
    return &#x27;&lt;svg viewBox=&quot;0 0 24 24&quot; width=&quot;&#x27;+size+&#x27;&quot; height=&quot;&#x27;+size+&#x27;&quot;&gt;&#x27;+
      &#x27;&lt;path d=&quot;&#x27;+STAR_PATH+&#x27;&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&lt;/svg&gt;&#x27;;
  }

  function burstRow(r, intensity) {
    var cy = r*CELL + CELL/2;
    var dots = Math.round(7 * intensity);
    var stars = Math.round(3 * intensity);
    var glowMul = Math.min(2.2, 1 + intensity*0.25);
    for (var c=0;c&lt;COLS;c++){
      var cx = c*CELL + CELL/2;
      for (var k=0;k&lt;dots;k++){
        var s=document.createElement(&#x27;div&#x27;);
        s.className=&#x27;spark dot&#x27;;
        var hue=Math.floor(Math.random()*360);
        var sz=(4+Math.random()*8) * Math.min(1.8,glowMul);
        s.style.width=sz+&#x27;px&#x27;; s.style.height=sz+&#x27;px&#x27;;
        s.style.background=&#x27;hsl(&#x27;+hue+&#x27;,100%,&#x27;+(70+Math.random()*15)+&#x27;%)&#x27;;
        s.style.boxShadow=&#x27;0 0 &#x27;+(14*glowMul)+&#x27;px hsl(&#x27;+hue+&#x27;,100%,72%), 0 0 &#x27;+(26*glowMul)+&#x27;px hsl(&#x27;+hue+&#x27;,100%,60%)&#x27;;
        s.style.left=(cx-sz/2)+&#x27;px&#x27;; s.style.top=(cy-sz/2)+&#x27;px&#x27;;
        field.appendChild(s);
        animateSpark(s, (70+Math.random()*90)*intensity*0.5+40, 650+Math.random()*350);
      }
      for (var m=0;m&lt;stars;m++){
        var st=document.createElement(&#x27;div&#x27;);
        st.className=&#x27;spark&#x27;;
        var hue2=Math.floor(Math.random()*360);
        var stsz=(8+Math.random()*10) * Math.min(1.7,glowMul);
        st.style.width=stsz+&#x27;px&#x27;; st.style.height=stsz+&#x27;px&#x27;;
        st.innerHTML=makeStarSVG(&#x27;hsl(&#x27;+hue2+&#x27;,100%,72%)&#x27;, stsz);
        st.style.filter=&#x27;drop-shadow(0 0 &#x27;+(8*glowMul)+&#x27;px hsl(&#x27;+hue2+&#x27;,100%,70%))&#x27;;
        st.style.left=(cx-stsz/2)+&#x27;px&#x27;; st.style.top=(cy-stsz/2)+&#x27;px&#x27;;
        field.appendChild(st);
        animateSpark(st, (80+Math.random()*100)*intensity*0.5+50, 800+Math.random()*400, true);
      }
    }
  }

  function animateSpark(el, dist, dur, spin) {
    var ang=Math.random()*Math.PI*2;
    var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist - 25;
    var rot=(Math.random()*900-450);
    el.animate([
      {transform:&#x27;translate(0,0) scale(1.3) rotate(0deg)&#x27;, opacity:1},
      {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(0) rotate(&#x27;+(spin?rot:0)+&#x27;deg)&#x27;, opacity:0}
    ],{duration:dur, easing:&#x27;cubic-bezier(.2,.7,.3,1)&#x27;});
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, dur);
  }

  function paint() {
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    for (var i=0;i&lt;blocks.length;i++) blocks[i].remove();
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++) if(grid[r][c]) drawBlock(c,r,grid[r][c],false);
    if (piece) {
      var cells=cellsOf(piece), color=SHAPES[piece.type].color;
      for (var j=0;j&lt;cells.length;j++) if(cells[j].y&gt;=0) drawBlock(cells[j].x,cells[j].y,color,piece.justRotated);
      piece.justRotated=false;
    }
  }

  function drawBlock(cx,cy,color,spin) {
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block&#x27;+(spin?&#x27; spin&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL+1)+&#x27;px&#x27;;
    el.style.top=(cy*CELL+1)+&#x27;px&#x27;;
    el.style.width=(CELL-2)+&#x27;px&#x27;;
    el.style.height=(CELL-2)+&#x27;px&#x27;;
    el.style.filter=&#x27;drop-shadow(0 0 5px &#x27;+color+&#x27;)&#x27;;
    el.innerHTML=makeStarSVG(color, CELL-2);
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if (collides(next)){
      lockPiece();
      clearFullRows();
      if (!spawnPiece()){ triggerGameOver(); return; }
    } else piece=next;
    paint();
  }

  function move(dx) {
    if (!running||!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if (!collides(next)){ piece=next; paint(); }
  }

  function rotate() {
    if (!running||!piece) return;
    var n=SHAPES[piece.type].rot.length;
    var cand={type:piece.type,rot:(piece.rot+1)%n,x:piece.x,y:piece.y};
    var kicks=[0,-1,1,-2,2];
    for (var i=0;i&lt;kicks.length;i++){
      var t={type:cand.type,rot:cand.rot,x:cand.x+kicks[i],y:cand.y};
      if (!collides(t)){ piece=t; piece.justRotated=true; paint(); return; }
    }
  }

  function triggerGameOver() {
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    piece=null;
    paint();
    // swirl all existing blocks down a drain
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    var cx = field.clientWidth/2, cy = field.clientHeight/2;
    for (var i=0;i&lt;blocks.length;i++){
      (function(el, idx){
        var bx = parseFloat(el.style.left), by = parseFloat(el.style.top);
        var relx = bx - cx, rely = by - cy;
        var dur = 1100 + Math.random()*300;
        var delay = idx*12;
        el.style.transition=&#x27;none&#x27;;
        el.animate([
          {transform:&#x27;translate(0,0) rotate(0deg) scale(1)&#x27;, opacity:1, offset:0},
          {transform:&#x27;translate(&#x27;+(-relx*0.3)+&#x27;px,&#x27;+(-rely*0.3)+&#x27;px) rotate(360deg) scale(.7)&#x27;, opacity:.9, offset:.5},
          {transform:&#x27;translate(&#x27;+(-relx)+&#x27;px,&#x27;+(-rely)+&#x27;px) rotate(1080deg) scale(0)&#x27;, opacity:0, offset:1}
        ],{duration:dur, delay:delay, easing:&#x27;cubic-bezier(.5,0,.9,.6)&#x27;, fill:&#x27;forwards&#x27;});
      })(blocks[i], i);
    }
    // after swirl, clear board and show Game Over
    setTimeout(function(){
      var bl = field.querySelectorAll(&#x27;.block&#x27;);
      for (var j=0;j&lt;bl.length;j++) bl[j].remove();
      gameoverEl.classList.add(&#x27;show&#x27;);
    }, 1500);
  }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  function startGame(){
    if (running) return;
    score=0; linesCleared=0; scoreEl.textContent=&#x27;0&#x27;;
    gameoverEl.classList.remove(&#x27;show&#x27;);
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running=true;
    if (dropId) clearInterval(dropId);
    dropId=setInterval(stepDown,DROP_MS);
  }
  function stopGame(){ if(!running) return; running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  newGrid();
  piece={type:&#x27;O&#x27;,rot:0,x:Math.floor((COLS-3)/2),y:0};
  paint();
&lt;/script&gt;
