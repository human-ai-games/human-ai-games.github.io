&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐍 Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys and eat the red food to grow and score. Pick a difficulty, tap &lt;strong&gt;Undo&lt;/strong&gt; to step back, then press &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; below.&lt;/p&gt;

    &lt;button class=&quot;lvl-btn active&quot; id=&quot;lvlMedium&quot; data-level=&quot;medium&quot;&gt;Medium&lt;/button&gt;
    &lt;button class=&quot;lvl-btn&quot; id=&quot;lvlHard&quot; data-level=&quot;hard&quot;&gt;Hard&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;How to Play&lt;/h2&gt;
      &lt;div class=&quot;tut-emoji&quot; id=&quot;tutEmoji&quot;&gt;⬆️⬇️⬅️➡️&lt;/div&gt;
      &lt;div class=&quot;tut-step&quot; id=&quot;tutStep&quot;&gt;Use the &lt;strong&gt;arrow keys&lt;/strong&gt; to steer your snake up, down, left, and right around the field.&lt;/div&gt;
      &lt;div class=&quot;tut-nav&quot;&gt;
        &lt;button class=&quot;tut-btn secondary&quot; id=&quot;tutBack&quot;&gt;Back&lt;/button&gt;
        &lt;div class=&quot;tut-dots&quot; id=&quot;tutDots&quot;&gt;&lt;/div&gt;
        &lt;button class=&quot;tut-btn&quot; id=&quot;tutNext&quot;&gt;Next&lt;/button&gt;
      &lt;/div&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var MAX_UNDO = 20;
  var LEVELS = { easy: 220, medium: 150, hard: 90 };
  var level = &#x27;medium&#x27;;
  var TICK_MS = LEVELS[level];
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var score = 0;
  var undoStack = [];
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var undoBtn = document.getElementById(&#x27;undoBtn&#x27;);
  var lvlBtns = document.querySelectorAll(&#x27;.lvl-btn&#x27;);

  /* ---------- Levels ---------- */
  function setLevel(lv) {
    if (running) return;  // locked during play
    level = lv;
    TICK_MS = LEVELS[lv];
    for (var i = 0; i &lt; lvlBtns.length; i++) {
      lvlBtns[i].classList.toggle(&#x27;active&#x27;, lvlBtns[i].getAttribute(&#x27;data-level&#x27;) === lv);
    }
  }
  for (var li = 0; li &lt; lvlBtns.length; li++) {
    lvlBtns[li].addEventListener(&#x27;click&#x27;, function () {
      setLevel(this.getAttribute(&#x27;data-level&#x27;));
    });
  }
  function lockLevels(locked) {
    for (var i = 0; i &lt; lvlBtns.length; i++) lvlBtns[i].disabled = locked;
  }

  /* ---------- Tutorial ---------- */
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var tutEmoji = document.getElementById(&#x27;tutEmoji&#x27;);
  var tutStep = document.getElementById(&#x27;tutStep&#x27;);
  var tutHint = document.getElementById(&#x27;tutHint&#x27;);
  var tutDots = document.getElementById(&#x27;tutDots&#x27;);
  var tutBack = document.getElementById(&#x27;tutBack&#x27;);
  var tutNext = document.getElementById(&#x27;tutNext&#x27;);

  var steps = [
    { emoji: &#x27;⬆️⬇️⬅️➡️&#x27;, text: &#x27;Use the &lt;strong&gt;arrow keys&lt;/strong&gt; to steer your snake up, down, left, and right around the field.&#x27; },
    { emoji: &#x27;🍎&#x27;, text: &#x27;Guide the snake onto the &lt;strong&gt;red food&lt;/strong&gt;. Each bite grows your snake and adds a point.&#x27; },
    { emoji: &#x27;🧱&#x27;, text: &#x27;Stay away from the &lt;strong&gt;walls&lt;/strong&gt; — hitting the edge of the field ends the round.&#x27; },
    { emoji: &#x27;⚡&#x27;, text: &#x27;Choose a difficulty: &lt;strong&gt;Easy&lt;/strong&gt; is slow, &lt;strong&gt;Medium&lt;/strong&gt; is standard, and &lt;strong&gt;Hard&lt;/strong&gt; is fast!&#x27; },
    { emoji: &#x27;↩&#x27;, text: &#x27;Made a mistake? Press &lt;strong&gt;Undo&lt;/strong&gt; to step back a move — even to escape a crash!&#x27; }
  ];
  var stepIdx = 0;

  for (var i = 0; i &lt; steps.length; i++) {
    var d = document.createElement(&#x27;div&#x27;);
    d.className = &#x27;tut-dot&#x27;;
    tutDots.appendChild(d);
  }
  var dotEls = tutDots.querySelectorAll(&#x27;.tut-dot&#x27;);

  function renderStep() {
    var s = steps[stepIdx];
    tutEmoji.textContent = s.emoji;
    tutStep.innerHTML = s.text;
    tutHint.textContent = &#x27;Step &#x27; + (stepIdx + 1) + &#x27; of &#x27; + steps.length;
    tutBack.style.visibility = stepIdx === 0 ? &#x27;hidden&#x27; : &#x27;visible&#x27;;
    tutNext.textContent = (stepIdx === steps.length - 1) ? &#x27;Got it!&#x27; : &#x27;Next&#x27;;
    for (var i = 0; i &lt; dotEls.length; i++) dotEls[i].classList.toggle(&#x27;active&#x27;, i === stepIdx);
  }
  tutNext.addEventListener(&#x27;click&#x27;, function () {
    if (stepIdx &lt; steps.length - 1) { stepIdx++; renderStep(); }
    else { overlay.classList.add(&#x27;hidden&#x27;); }
  });
  tutBack.addEventListener(&#x27;click&#x27;, function () {
    if (stepIdx &gt; 0) { stepIdx--; renderStep(); }
  });
  renderStep();

  function hideTutorial() { overlay.classList.add(&#x27;hidden&#x27;); }

  /* ---------- Game ---------- */
  function drawCell(cls, x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function paint() {
    var cells = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i = 0; i &lt; cells.length; i++) cells[i].remove();
    drawCell(&#x27;food&#x27;, food.x, food.y);
    for (var j = 0; j &lt; snake.length; j++) drawCell(&#x27;snake&#x27; + (j === 0 ? &#x27; head&#x27; : &#x27;&#x27;), snake[j].x, snake[j].y);
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { food = { x: x, y: y }; return; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function snapshot() {
    var snakeCopy = [];
    for (var i = 0; i &lt; snake.length; i++) snakeCopy.push({ x: snake[i].x, y: snake[i].y });
    undoStack.push({
      snake: snakeCopy,
      dir: { x: dir.x, y: dir.y },
      food: { x: food.x, y: food.y },
      score: score
    });
    if (undoStack.length &gt; MAX_UNDO) undoStack.shift();
    updateUndoBtn();
  }

  function updateUndoBtn() {
    undoBtn.disabled = undoStack.length === 0;
  }

  function doUndo() {
    if (undoStack.length === 0) return;
    var st = undoStack.pop();
    snake = st.snake;
    dir = { x: st.dir.x, y: st.dir.y };
    pendingDir = { x: st.dir.x, y: st.dir.y };
    food = { x: st.food.x, y: st.food.y };
    score = st.score;
    scoreEl.textContent = score;
    if (gameOver) {
      gameOver = false;
      hideTutorial();
      running = true;
      lockLevels(true);
      if (tickId) clearInterval(tickId);
      tickId = setInterval(tick, TICK_MS);
    }
    paint();
    updateUndoBtn();
  }
  undoBtn.addEventListener(&#x27;click&#x27;, doUndo);

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snapshot();
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    lockLevels(false);
    if (tickId) { clearInterval(tickId); tickId = null; }
    overlay.classList.remove(&#x27;hidden&#x27;);
    tutEmoji.textContent = &#x27;💀&#x27;;
    tutStep.innerHTML = &#x27;Game over! You scored &lt;strong&gt;&#x27; + score + &#x27;&lt;/strong&gt;. Press &lt;strong&gt;Undo&lt;/strong&gt; to rewind, or &lt;strong&gt;Restart&lt;/strong&gt; below.&#x27;;
    tutHint.textContent = &#x27;&#x27;;
    tutBack.style.visibility = &#x27;hidden&#x27;;
    tutNext.style.display = &#x27;none&#x27;;
    for (var i = 0; i &lt; dotEls.length; i++) dotEls[i].style.display = &#x27;none&#x27;;
    updateUndoBtn();
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    undoStack = [];
    TICK_MS = LEVELS[level];
    lockLevels(true);
    updateUndoBtn();
    hideTutorial();
    tutNext.style.display = &#x27;&#x27;;
    for (var i = 0; i &lt; dotEls.length; i++) dotEls[i].style.display = &#x27;&#x27;;
    initSnake();
    placeFood();
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
  }
  function stopGame() {
    running = false;
    lockLevels(false);
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
    else if ((e.key === &#x27;z&#x27; || e.key === &#x27;Z&#x27;) &amp;&amp; (e.ctrlKey || e.metaKey)) { doUndo(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  // Initial state: snake + food visible behind the tutorial overlay.
  initSnake();
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
