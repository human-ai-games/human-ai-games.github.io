  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;

  }

  .next { position: absolute; top: 30px; left: 505px; width: 120px; text-align: center; }

  .next canvas { background: #05030f; border: 3px solid #fff; box-shadow: 0 0 0 2px #000; border-radius: 6px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Wizard Circuit Blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;/&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, speed drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Clear rows for points — clear four at once for lightning! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;arena&quot;&gt;
    &lt;canvas class=&quot;bg&quot; id=&quot;bg&quot; width=&quot;700&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;next&quot;&gt;
      &lt;div class=&quot;lbl&quot;&gt;NEXT&lt;/div&gt;
      &lt;canvas id=&quot;nextC&quot; width=&quot;100&quot; height=&quot;100&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
        &lt;div class=&quot;cheer&quot; id=&quot;cheer&quot;&gt;ALRIGHTY BRO!&lt;/div&gt;
        &lt;svg class=&quot;pac&quot; id=&quot;pac&quot; viewBox=&quot;0 0 100 100&quot;&gt;
          &lt;path id=&quot;pacPath&quot; fill=&quot;#ffe400&quot; d=&quot;M50,50 L95,25 A50,50 0 1 0 95,75 Z&quot;/&gt;
        &lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL=24, COLS=10, ROWS=16;
  var DROP_MS=500, running=false, dropId=null;
  var grid=[], piece=null, nextType=null, score=0, animating=false;
  var field=document.getElementById(&#x27;field&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var pac=document.getElementById(&#x27;pac&#x27;);
  var pacPath=document.getElementById(&#x27;pacPath&#x27;);
  var cheer=document.getElementById(&#x27;cheer&#x27;);
  var nextC=document.getElementById(&#x27;nextC&#x27;), nctx=nextC.getContext(&#x27;2d&#x27;);
  var bg=document.getElementById(&#x27;bg&#x27;), bctx=bg.getContext(&#x27;2d&#x27;);

  var SHAPES={
    O:{color:&#x27;#ff5d5d&#x27;,rots:[[[0,0],[1,0],[0,1],[1,1]]]},
    I:{color:&#x27;#3fd6ff&#x27;,rots:[[[0,0],[1,0],[2,0],[3,0]],[[1,0],[1,1],[1,2],[1,3]]]},
    L:{color:&#x27;#ffb03f&#x27;,rots:[[[0,0],[0,1],[0,2],[1,2]],[[0,0],[1,0],[2,0],[0,1]],[[0,0],[1,0],[1,1],[1,2]],[[2,0],[0,1],[1,1],[2,1]]]},
    T:{color:&#x27;#c46bff&#x27;,rots:[[[1,0],[0,1],[1,1],[2,1]],[[0,0],[0,1],[1,1],[0,2]],[[0,0],[1,0],[2,0],[1,1]],[[1,0],[0,1],[1,1],[1,2]]]}
  };
  var KEYS=[&#x27;O&#x27;,&#x27;I&#x27;,&#x27;L&#x27;,&#x27;T&#x27;];

  function newGrid(){grid=[];for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);}}
  function pieceCells(p){var rot=SHAPES[p.type].rots[p.rot%SHAPES[p.type].rots.length];return rot.map(function(c){return {x:p.x+c[0],y:p.y+c[1]};});}
  function collides(p){var cells=pieceCells(p);for(var i=0;i&lt;cells.length;i++){var cx=cells[i].x,cy=cells[i].y;if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS)return true;if(cy&gt;=0&amp;&amp;grid[cy][cx])return true;}return false;}
  function spawnPiece(){
    var t=nextType||KEYS[Math.floor(Math.random()*KEYS.length)];
    nextType=KEYS[Math.floor(Math.random()*KEYS.length)];
    drawNext();
    piece={type:t,rot:0,x:Math.floor((COLS-2)/2),y:0};
    return !collides(piece);
  }
  function lockPiece(){var cells=pieceCells(piece),col=SHAPES[piece.type].color;for(var i=0;i&lt;cells.length;i++){var c=cells[i];if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS)grid[c.y][c.x]=col;}piece=null;}
  function fullRows(){var rows=[];for(var r=0;r&lt;ROWS;r++){var full=true;for(var c=0;c&lt;COLS;c++)if(!grid[r][c]){full=false;break;}if(full)rows.push(r);}return rows;}
  function removeRows(rows){rows.sort(function(a,b){return a-b;});for(var i=0;i&lt;rows.length;i++){grid.splice(rows[i],1);var e=[];for(var c=0;c&lt;COLS;c++)e.push(null);grid.unshift(e);}score+=rows.length*(rows.length&gt;=4?2:1);scoreEl.textContent=score;}

  function drawBlock(cx,cy,color){var el=document.createElement(&#x27;div&#x27;);el.className=&#x27;block&#x27;;el.style.left=(cx*CELL)+&#x27;px&#x27;;el.style.top=(cy*CELL)+&#x27;px&#x27;;el.style.width=CELL+&#x27;px&#x27;;el.style.height=CELL+&#x27;px&#x27;;el.style.background=color;field.appendChild(el);}
  function paint(){
    var blocks=field.querySelectorAll(&#x27;.block&#x27;);for(var i=0;i&lt;blocks.length;i++)blocks[i].remove();
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++)if(grid[r][c])drawBlock(c,r,grid[r][c]);
    if(piece){var cells=pieceCells(piece);var col=SHAPES[piece.type].color;for(var i=0;i&lt;cells.length;i++)if(cells[i].y&gt;=0)drawBlock(cells[i].x,cells[i].y,col);}
  }
  function drawNext(){
    nctx.clearRect(0,0,100,100);
    if(!nextType)return;
    var rot=SHAPES[nextType].rots[0],col=SHAPES[nextType].color;
    var minx=9,miny=9,maxx=0,maxy=0;
    rot.forEach(function(c){minx=Math.min(minx,c[0]);miny=Math.min(miny,c[1]);maxx=Math.max(maxx,c[0]);maxy=Math.max(maxy,c[1]);});
    var w=(maxx-minx+1),h=(maxy-miny+1),s=20;
    var ox=(100-w*s)/2, oy=(100-h*s)/2;
    rot.forEach(function(c){
      var x=ox+(c[0]-minx)*s, y=oy+(c[1]-miny)*s;
      nctx.fillStyle=col; nctx.fillRect(x,y,s-1,s-1);
      nctx.strokeStyle=&#x27;rgba(255,255,255,.35)&#x27;; nctx.strokeRect(x+1,y+1,s-3,s-3);
    });
  }

  function stepDown(){
    if(!piece||animating)return;
    var next={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(next)){lockPiece();var rows=fullRows();if(rows.length){doClear(rows);return;}if(!spawnPiece()){endGame();paint();return;}}
    else{piece=next;}
    paint();
  }
  function move(dx){if(!running||!piece||animating)return;var next={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y};if(!collides(next)){piece=next;paint();}}
  function rotate(){if(!running||!piece||animating)return;var next={type:piece.type,rot:(piece.rot+1)%SHAPES[piece.type].rots.length,x:piece.x,y:piece.y};var kicks=[0,-1,1,-2,2];for(var k=0;k&lt;kicks.length;k++){var t={type:next.type,rot:next.rot,x:next.x+kicks[k],y:next.y};if(!collides(t)){piece=t;paint();return;}}}

  var lightning=[];
  function fireLightning(){lightning=[];for(var i=0;i&lt;5;i++){lightning.push({x:20+Math.random()*(240-40),t:performance.now()+i*60,life:0});}}

  function doClear(rows){
    animating=true;
    playCheer(); showCheer();
    if(rows.length&gt;=4){ fireLightning(); playThunder(); }
    var topRow=Math.min.apply(null,rows);
    pac.style.display=&#x27;block&#x27;;
    pac.style.top=(topRow*CELL+(rows.length*CELL)/2-15)+&#x27;px&#x27;;
    var startX=COLS*CELL,endX=-32,dur=750,t0=performance.now();
    function frame(now){
      var p=Math.min(1,(now-t0)/dur);
      var x=startX+(endX-startX)*p;
      pac.style.left=x+&#x27;px&#x27;;
      var open=(Math.sin(now/50)*0.5+0.5)*35+5;
      pacPath.setAttribute(&#x27;d&#x27;,&#x27;M50,50 L&#x27;+(50+45*Math.cos(open*Math.PI/180))+&#x27;,&#x27;+(50-45*Math.sin(open*Math.PI/180))+&#x27; A50,50 0 1 0 &#x27;+(50+45*Math.cos(open*Math.PI/180))+&#x27;,&#x27;+(50+45*Math.sin(open*Math.PI/180))+&#x27; Z&#x27;);
      var pacCol=Math.floor(x/CELL);
      for(var ri=0;ri&lt;rows.length;ri++)for(var c=0;c&lt;COLS;c++){if(c&gt;=pacCol)grid[rows[ri]][c]=null;}
      paint();
      if(p&lt;1)requestAnimationFrame(frame);
      else{pac.style.display=&#x27;none&#x27;;finishClear(rows);}
    }
    requestAnimationFrame(frame);
  }
  function finishClear(rows){removeRows(rows);animating=false;lightning=[];if(!spawnPiece()){endGame();paint();return;}paint();}

  function showCheer(){cheer.style.transition=&#x27;none&#x27;;cheer.style.opacity=&#x27;1&#x27;;cheer.style.transform=&#x27;translate(-50%,-50%) scale(1.3)&#x27;;setTimeout(function(){cheer.style.transition=&#x27;opacity .6s, transform .6s&#x27;;cheer.style.opacity=&#x27;0&#x27;;cheer.style.transform=&#x27;translate(-50%,-50%) scale(1)&#x27;;},400);}

  // ===== Background: grey tower + wizard on top, dragon-riding wizard, stars, spells =====
  var bats=[]; for(var i=0;i&lt;4;i++)bats.push({x:80+i*30,y:60+Math.random()*30,ph:Math.random()*6});
  var spells=[];
  function px(ctx,x,y,s,col){ctx.fillStyle=col;ctx.fillRect(x,y,s,s);}

  function drawWizard(ctx,ox,oy,robe,face,flip){
    ctx.save();
    if(flip){ctx.translate(ox+40,oy);ctx.scale(-1,1);ctx.translate(-ox,0);}
    px(ctx,ox+12,oy-18,16,&#x27;#3a1d6e&#x27;);
    px(ctx,ox+18,oy-30,4,&#x27;#3a1d6e&#x27;);
    px(ctx,ox+16,oy-24,8,&#x27;#3a1d6e&#x27;);
    px(ctx,ox+8,oy-6,24,&#x27;#5a2d9e&#x27;);
    px(ctx,ox+18,oy-14,3,&#x27;#ffe400&#x27;);
    px(ctx,ox+14,oy,12,face);
    px(ctx,ox+16,oy+3,2,&#x27;#000&#x27;);
    px(ctx,ox+22,oy+3,2,&#x27;#000&#x27;);
    px(ctx,ox+13,oy+10,14,&#x27;#eee&#x27;);
    px(ctx,ox+16,oy+16,8,&#x27;#eee&#x27;);
    px(ctx,ox+8,oy+12,24,robe);
    px(ctx,ox+4,oy+22,32,robe);
    px(ctx,ox+30,oy+8,4,face);
    px(ctx,ox+34,oy-16,3,&#x27;#8a5a2a&#x27;);
    px(ctx,ox+33,oy-20,5,&#x27;#88ffff&#x27;);
    ctx.restore();
  }

  function drawDragon(ctx,ox,oy,now){
    var flap=Math.sin(now/200)*8;
    ctx.fillStyle=&#x27;#1f8a3a&#x27;;
    // body
    ctx.beginPath();ctx.ellipse(ox+30,oy+40,34,16,0,0,7);ctx.fill();
    // neck + head
    ctx.beginPath();ctx.moveTo(ox+5,oy+40);ctx.lineTo(ox-15,oy+15);ctx.lineTo(ox-2,oy+42);ctx.fill();
    ctx.beginPath();ctx.ellipse(ox-15,oy+14,12,9,0,0,7);ctx.fill();
    // eye
    ctx.fillStyle=&#x27;#ff2020&#x27;;ctx.beginPath();ctx.arc(ox-20,oy+11,2.5,0,7);ctx.fill();
    // horn
    ctx.fillStyle=&#x27;#0d5a24&#x27;;ctx.beginPath();ctx.moveTo(ox-12,oy+6);ctx.lineTo(ox-8,oy-4);ctx.lineTo(ox-6,oy+7);ctx.fill();
    // wing
    ctx.fillStyle=&#x27;#28a84a&#x27;;
    ctx.beginPath();ctx.moveTo(ox+28,oy+30);ctx.lineTo(ox+55,oy-5-flap);ctx.lineTo(ox+62,oy+18);ctx.lineTo(ox+45,oy+34);ctx.fill();
    // tail
    ctx.fillStyle=&#x27;#1f8a3a&#x27;;
    ctx.beginPath();ctx.moveTo(ox+60,oy+40);ctx.lineTo(ox+92,oy+30);ctx.lineTo(ox+62,oy+48);ctx.fill();
    ctx.beginPath();ctx.moveTo(ox+88,oy+24);ctx.lineTo(ox+100,oy+22);ctx.lineTo(ox+92,oy+34);ctx.fill();
    // legs
    ctx.fillStyle=&#x27;#0d5a24&#x27;;ctx.fillRect(ox+18,oy+52,6,12);ctx.fillRect(ox+40,oy+52,6,12);
  }

  function drawBG(now){
    bctx.clearRect(0,0,700,470);
    bctx.fillStyle=&#x27;#12246a&#x27;; bctx.fillRect(0,430,700,40);

    // grey brick tower left
    var tx=55;
    bctx.fillStyle=&#x27;#9a9a9a&#x27;; bctx.fillRect(tx,150,70,290);
    bctx.fillStyle=&#x27;#6f6f6f&#x27;;
    for(var y=150;y&lt;440;y+=18){for(var x=tx;x&lt;tx+70;x+=24){bctx.fillRect(x+((Math.floor((y-150)/18)%2)*12),y,22,2);bctx.fillRect(x,y,2,18);}}
    bctx.fillStyle=&#x27;#9a9a9a&#x27;;
    for(var x=tx;x&lt;tx+70;x+=20)bctx.fillRect(x,135,12,15);
    bctx.fillStyle=&#x27;#ffcf3f&#x27;; bctx.fillRect(tx+26,220,18,26);

    // wizard on TOP of tower
    drawWizard(bctx,68,110,&#x27;#5a2d9e&#x27;,&#x27;#f0c090&#x27;,false);

    // bats upper-mid
    bats.forEach(function(b){
      var wy=b.y+Math.sin(now/300+b.ph)*8;
      var wing=Math.sin(now/120+b.ph)*6;
      bctx.fillStyle=&#x27;#000&#x27;;
      px(bctx,b.x,wy,6,&#x27;#000&#x27;);
      bctx.beginPath();bctx.moveTo(b.x,wy+3);bctx.lineTo(b.x-10,wy-wing);bctx.lineTo(b.x-3,wy+3);bctx.fill();
      bctx.beginPath();bctx.moveTo(b.x+6,wy+3);bctx.lineTo(b.x+16,wy-wing);bctx.lineTo(b.x+9,wy+3);bctx.fill();
    });

    // right: dragon-riding wizard (floating, bobbing)
    var dy=250+Math.sin(now/500)*10;
    drawDragon(bctx,560,dy,now);
    drawWizard(bctx,588,dy-30,&#x27;#2d6e9e&#x27;,&#x27;#f0c090&#x27;,true);

    // spell bolts between wizards
    if(running &amp;&amp; Math.random()&lt;0.04){
      var dir=Math.random()&lt;0.5?1:-1;
      spells.push({x:dir&gt;0?110:600,y:dir&gt;0?140:dy-20,vx:dir*(3+Math.random()*2),col:dir&gt;0?&#x27;#88ffff&#x27;:&#x27;#ff66ff&#x27;});
    }
    for(var i=spells.length-1;i&gt;=0;i--){
      var sp=spells[i]; sp.x+=sp.vx;
      bctx.fillStyle=sp.col;
      bctx.beginPath();bctx.arc(sp.x,sp.y,4,0,7);bctx.fill();
      bctx.fillStyle=&#x27;rgba(255,255,255,.5)&#x27;;
      bctx.beginPath();bctx.arc(sp.x-sp.vx,sp.y,2,0,7);bctx.fill();
      if(sp.x&lt;100||sp.x&gt;610)spells.splice(i,1);
    }

    // lightning over field
    var flx=242, fly=42;
    lightning.forEach(function(L){
      if(now&gt;=L.t &amp;&amp; now-L.t&lt;250){
        bctx.strokeStyle=&#x27;rgba(200,230,255,&#x27;+(1-(now-L.t)/250)+&#x27;)&#x27;;
        bctx.lineWidth=3;bctx.beginPath();
        var x=flx+L.x, y=fly;bctx.moveTo(x,y);
        for(var seg=0;seg&lt;8;seg++){x+=(Math.random()-0.5)*18;y+=45;bctx.lineTo(x,y);}
        bctx.stroke();
      }
    });
  }

  // Starfield inside the field
  var starC=document.createElement(&#x27;canvas&#x27;);
  starC.width=240;starC.height=384;
  starC.style.position=&#x27;absolute&#x27;;starC.style.left=&#x27;0&#x27;;starC.style.top=&#x27;0&#x27;;starC.style.pointerEvents=&#x27;none&#x27;;starC.style.zIndex=&#x27;0&#x27;;
  field.insertBefore(starC,field.firstChild);
  var sctx=starC.getContext(&#x27;2d&#x27;);
  var fstars=[];for(var i=0;i&lt;50;i++)fstars.push({x:Math.random()*240,y:Math.random()*384,r:Math.random()*1.2+0.4,ph:Math.random()*6});
  function drawStars(now){
    sctx.clearRect(0,0,240,384);
    fstars.forEach(function(s){var a=0.5+0.5*Math.sin(now/500+s.ph);sctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+a+&#x27;)&#x27;;sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,7);sctx.fill();});
  }

  var rafId=null;
  function loop(now){drawBG(now);drawStars(now);rafId=requestAnimationFrame(loop);}

  // ===== Audio =====
  var actx=null,musicTimer=null,musicStep=0,laughTimer=null,flushTimer=null;
  function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return actx;}
  function tone(freq,dur,type,vol){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||&#x27;square&#x27;;o.frequency.value=freq;g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(vol||0.15,a.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+0.05);}

  // Mysterious sorcery theme — minor key, slow, eerie
  var N={A2:110,B2:123.47,C:130.81,D:146.83,E:164.81,F:174.61,G:196.00,Ab:207.65,A:220,Bb:233.08,B:246.94,C2:261.63,D2:293.66,Eb:311.13,E2:329.63,F2:349.23};
  var MELODY=[N.A,N.C2,N.E2,N.D2,N.C2,N.B,N.A,N.E,
