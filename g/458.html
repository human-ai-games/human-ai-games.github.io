<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Snake</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { font-size: 20px; color: #555; margin: 0; display: flex; gap: 22px; }
  .hud b { color: #222; }
  .field { position: relative; width: 600px; height: 420px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .cell { position: absolute; box-sizing: border-box; }
  .snake { background: #2e7d32; border-radius: 2px; }
  .head { background: #1b5e20; border-radius: 4px; }
  .enemy { background: #c62828; border-radius: 2px; }
  .enemyhead { background: #8e0000; border-radius: 4px; }
  .ally { background: #1976d2; border-radius: 2px; }
  .allyhead { background: #0d47a1; border-radius: 4px; }
  .food { background: #f9a825; border-radius: 50%; box-shadow: 0 0 6px #f9a825; }
  .power { background: #e91e8c; border-radius: 50%; box-shadow: 0 0 7px #ff4fb0; }
  .friend { background: #9c27b0; border-radius: 50%; box-shadow: 0 0 9px #c94fff; }
  .float { color: #d84315; font-weight: 700; font-size: 15px; text-shadow: 0 0 3px #fff; pointer-events: none; }
  .hplabel { color: #fff; font-weight: 700; font-size: 11px; text-align: center; line-height: 20px; pointer-events: none; text-shadow: 0 0 2px #000; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys: eat gold food (bigger growth near edges), grab pink balls to raise attack, and let red snakes crash into your tail to damage and bounce them off. Rare purple balls summon a temporary blue ally that hunts enemies with your current attack power.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Attack: &lt;b id=&quot;atk&quot;&gt;1.0&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 21;
  var TICK_MS = 150;
  var running = false, tickId = null;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var foodGrow = 1;
  var power = null;   // pink ball
  var friend = null;  // purple ball
  var attack = 1.0;
  var enemies = [];   // { body, dir, maxHp, hp, cooldown }
  var allies = [];    // { body, dir, life }
  var spawnCount = 0;
  var score = 0;
  var floats = [];
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var atkEl = document.getElementById(&#x27;atk&#x27;);

  function clearField() { field.innerHTML = &#x27;&#x27;; }

  function drawCell(cls, x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
    return el;
  }

  function drawFloat(f) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell float&#x27;;
    el.style.left = (f.x * CELL - 6) + &#x27;px&#x27;;
    el.style.top = (f.y * CELL - 14) + &#x27;px&#x27;;
    el.textContent = f.text;
    el.style.opacity = Math.max(0, f.life / 14);
    field.appendChild(el);
  }

  function foodValue(x, y) {
    var d = Math.min(x, COLS - 1 - x, y, ROWS - 1 - y);
    var maxD = Math.min((COLS - 1) / 2, (ROWS - 1) / 2);
    var v = Math.round(1 + 4 * (1 - d / maxD));
    if (v &lt; 1) v = 1;
    return v;
  }

  function paint() {
    clearField();
    drawCell(&#x27;food&#x27;, food.x, food.y);
    if (power) drawCell(&#x27;power&#x27;, power.x, power.y);
    if (friend) drawCell(&#x27;friend&#x27;, friend.x, friend.y);
    for (var i = 0; i &lt; snake.length; i++) drawCell(i === 0 ? &#x27;head&#x27; : &#x27;snake&#x27;, snake[i].x, snake[i].y);
    for (var a = 0; a &lt; allies.length; a++) {
      var ab = allies[a].body;
      for (var k = 0; k &lt; ab.length; k++) drawCell(k === 0 ? &#x27;allyhead&#x27; : &#x27;ally&#x27;, ab[k].x, ab[k].y);
    }
    for (var e = 0; e &lt; enemies.length; e++) {
      var b = enemies[e].body;
      for (var j = 0; j &lt; b.length; j++) {
        drawCell(j === 0 ? &#x27;enemyhead&#x27; : &#x27;enemy&#x27;, b[j].x, b[j].y);
        if (j === 0) {
          var lab = document.createElement(&#x27;div&#x27;);
          lab.className = &#x27;cell hplabel&#x27;;
          lab.style.left = (b[j].x * CELL) + &#x27;px&#x27;;
          lab.style.top = (b[j].y * CELL) + &#x27;px&#x27;;
          lab.style.width = CELL + &#x27;px&#x27;;
          lab.style.height = CELL + &#x27;px&#x27;;
          lab.textContent = Math.ceil(enemies[e].hp);
          field.appendChild(lab);
        }
      }
    }
    for (var f = 0; f &lt; floats.length; f++) drawFloat(floats[f]);
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    for (var e = 0; e &lt; enemies.length; e++) {
      var b = enemies[e].body;
      for (var j = 0; j &lt; b.length; j++) if (b[j].x === x &amp;&amp; b[j].y === y) return true;
    }
    for (var a = 0; a &lt; allies.length; a++) {
      var ab = allies[a].body;
      for (var k = 0; k &lt; ab.length; k++) if (ab[k].x === x &amp;&amp; ab[k].y === y) return true;
    }
    if (food &amp;&amp; food.x === x &amp;&amp; food.y === y) return true;
    if (power &amp;&amp; power.x === x &amp;&amp; power.y === y) return true;
    if (friend &amp;&amp; friend.x === x &amp;&amp; friend.y === y) return true;
    return false;
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { food = { x: x, y: y }; foodGrow = foodValue(x, y); return; }
    }
  }

  function maybePlacePower() {
    if (power) return;
    if (Math.random() &gt; 0.5) return; // ~50% chance
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { power = { x: x, y: y }; return; }
    }
  }

  function maybePlaceFriend() {
    if (friend) return;
    if (Math.random() &gt; 0.12) return; // ~12% chance — much rarer
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { friend = { x: x, y: y }; return; }
    }
  }

  function enemyMaxHp(spawnNumber) {
    return Math.floor((spawnNumber - 1) / 2) + 1;
  }

  function spawnEnemy() {
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      var head = snake[0];
      if (Math.abs(x - head.x) + Math.abs(y - head.y) &lt; 6) continue;
      if (cellOccupied(x, y)) continue;
      spawnCount++;
      var hp = enemyMaxHp(spawnCount);
      var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      enemies.push({ body: [{x:x,y:y}], dir: dirs[Math.floor(Math.random()*4)], maxHp: hp, hp: hp, cooldown: 0 });
      return;
    }
  }

  function spawnAlly() {
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (cellOccupied(x, y)) continue;
      allies.push({ body: [{x:x,y:y}], dir: {x:1,y:0}, life: 40 }); // ~6 seconds
      return;
    }
  }

  function tailHitAt(x, y) {
    for (var i = 1; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function nearestEnemy(from) {
    var best = null, bestD = 1e9;
    for (var e = 0; e &lt; enemies.length; e++) {
      var h = enemies[e].body[0];
      var d = Math.abs(h.x - from.x) + Math.abs(h.y - from.y);
      if (d &lt; bestD) { bestD = d; best = enemies[e]; }
    }
    return best;
  }

  function damageEnemyIndex(idx, amount, atX, atY) {
    var en = enemies[idx];
    en.hp -= amount;
    floats.push({ x: atX, y: atY, text: &#x27;-&#x27; + amount.toFixed(1), life: 12 });
    if (en.hp &lt;= 0) { enemies.splice(idx, 1); return true; }
    return false;
  }

  function moveAllies() {
    for (var a = allies.length - 1; a &gt;= 0; a--) {
      var al = allies[a];
      al.life--;
      if (al.life &lt;= 0) { allies.splice(a, 1); continue; }
      var h = al.body[0];
      var target = nearestEnemy(h);
      if (target) {
        var t = target.body[0];
        // greedy chase
        var choices = [];
        if (t.x &gt; h.x) choices.push({x:1,y:0});
        if (t.x &lt; h.x) choices.push({x:-1,y:0});
        if (t.y &gt; h.y) choices.push({x:0,y:1});
        if (t.y &lt; h.y) choices.push({x:0,y:-1});
        if (choices.length) al.dir = choices[Math.floor(Math.random()*choices.length)];
      }
      var nx = h.x + al.dir.x, ny = h.y + al.dir.y;
      if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) {
        al.dir = { x: -al.dir.x, y: -al.dir.y };
        nx = h.x + al.dir.x; ny = h.y + al.dir.y;
        if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) continue;
      }
      // ally attacks any enemy it touches
      var hit = -1;
      for (var e = 0; e &lt; enemies.length; e++) {
        var b = enemies[e].body;
        for (var j = 0; j &lt; b.length; j++) if (b[j].x === nx &amp;&amp; b[j].y === ny) { hit = e; break; }
        if (hit &gt;= 0) break;
      }
      if (hit &gt;= 0) {
        damageEnemyIndex(hit, attack, nx, ny);
        // don&#x27;t advance onto the enemy cell
        continue;
      }
      al.body.unshift({x:nx, y:ny});
      al.body.pop();
    }
  }

  function moveEnemies() {
    for (var e = enemies.length - 1; e &gt;= 0; e--) {
      var en = enemies[e];
      if (en.cooldown &gt; 0) en.cooldown--;
      var h = en.body[0];
      var nx = h.x + en.dir.x, ny = h.y + en.dir.y;
      if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS || Math.random() &lt; 0.15) {
        var options = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(function(d){
          var tx = h.x + d.x, ty = h.y + d.y;
          return tx &gt;= 0 &amp;&amp; tx &lt; COLS &amp;&amp; ty &gt;= 0 &amp;&amp; ty &lt; ROWS;
        });
        if (options.length) en.dir = options[Math.floor(Math.random()*options.length)];
        nx = h.x + en.dir.x; ny = h.y + en.dir.y;
      }
      if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) continue;

      if (tailHitAt(nx, ny)) {
        if (en.cooldown === 0) {
          var died = damageEnemyIndex(e, attack, h.x, h.y);
          if (died) continue;
          en.cooldown = 2;
        }
        // BOUNCE: reverse direction and actually step backward if possible
        en.dir = { x: -en.dir.x, y: -en.dir.y };
        var bx = h.x + en.dir.x, by = h.y + en.dir.y;
        if (bx &gt;= 0 &amp;&amp; bx &lt; COLS &amp;&amp; by &gt;= 0 &amp;&amp; by &lt; ROWS &amp;&amp; !tailHitAt(bx, by)) {
          en.body.unshift({x:bx, y:by});
          en.body.pop();
        }
        continue;
      }

      en.body.unshift({x:nx, y:ny});
      en.body.pop();
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function headHitsEnemy(x, y) {
    for (var e = 0; e &lt; enemies.length; e++) {
      var b = enemies[e].body;
      for (var j = 0; j &lt; b.length; j++) if (b[j].x === x &amp;&amp; b[j].y === y) return true;
    }
    return false;
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }

    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }

    snake.unshift({ x: nx, y: ny });
    var gotPower = (power &amp;&amp; nx === power.x &amp;&amp; ny === power.y);
    var gotFriend = (friend &amp;&amp; nx === friend.x &amp;&amp; ny === friend.y);
    if (ateFood) {
      var gained = foodGrow;
      score += gained;
      scoreEl.textContent = score;
      floats.push({ x: food.x, y: food.y, text: &#x27;+&#x27; + gained, life: 14 });
      for (var g = 1; g &lt; gained; g++) snake.push({ x: snake[snake.length-1].x, y: snake[snake.length-1].y });
      spawnEnemy();
      placeFood();
      maybePlacePower();
      maybePlaceFriend();
    } else if (gotPower) {
      attack += 0.2;
      atkEl.textContent = attack.toFixed(1);
      floats.push({ x: power.x, y: power.y, text: &#x27;ATK+&#x27;, life: 14 });
      power = null;
      snake.pop();
    } else if (gotFriend) {
      floats.push({ x: friend.x, y: friend.y, text: &#x27;ALLY!&#x27;, life: 14 });
      friend = null;
      spawnAlly();
      snake.pop();
    } else {
      snake.pop();
    }

    moveAllies();
    moveEnemies();

    if (headHitsEnemy(nx, ny)) { endGame(); return; }

    for (var f = floats.length - 1; f &gt;= 0; f--) {
      floats[f].life--;
      if (floats[f].life &lt;= 0) floats.splice(f, 1);
    }

    paint();
  }

  function endGame() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    attack = 1.0; atkEl.textContent = &#x27;1.0&#x27;;
    enemies = []; allies = []; floats = []; spawnCount = 0; power = null; friend = null;
    initSnake();
    placeFood();
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initSnake();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
