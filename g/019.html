<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Dash</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Coin Dash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d0d1a; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #ffe066; text-shadow: 0 0 8px rgba(255,224,102,.5); }
  .instructions { font-size: 16px; color: #aab; max-width: 620px; margin: 0; line-height: 1.4; }
  .hud { display: flex; gap: 20px; font-size: 20px; font-weight: 600; flex-wrap: wrap; justify-content: center; }
  .hud .coins { color: #ffe066; }
  .hud .lives { color: #ff6b6b; }
  .hud .slow { color: #66ccff; }
  .hud .best { color: #b48eff; }
  canvas { background: radial-gradient(circle at 50% 40%, #1c1c3a, #0d0d1a); border: 2px solid #333366; border-radius: 10px; display: block; cursor: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Coin Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to steer your orb — grab gold coins for points, snag blue coins to briefly slow the hazards, and dodge the red spikes. Press Start below; each hazard hit costs a life, and the game ends at zero lives.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;coins&quot;&gt;🪙 &lt;span id=&quot;coins&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;🏆 &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot;&gt;❤️ &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;slow&quot;&gt;🐢 &lt;span id=&quot;slow&quot;&gt;0.0&lt;/span&gt;s&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var coinsEl = document.getElementById(&#x27;coins&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var slowEl = document.getElementById(&#x27;slow&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);

  var running = false, animId = null;
  var lastTime = 0, elapsed = 0;
  var score = 0, lives = 3, gameOver = false;
  var bestScore = 0;   // kept in memory for the session only

  var player = { x: W/2, y: H/2, r: 16 };
  var targetX = W/2, targetY = H/2;
  var coins = [], hazards = [], particles = [];
  var coinTimer = 0, hazardTimer = 0, powerupTimer = 0;
  var invuln = 0;
  var slowTime = 0;
  var SLOW_DURATION = 5000;
  var SLOW_FACTOR = 0.35;

  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }
  function powerSound() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;sine&#x27;;
      o.frequency.setValueAtTime(400, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1000, actx.currentTime + 0.3);
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.2, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
      o.start(); o.stop(actx.currentTime + 0.35);
    } catch (_) {}
  }

  cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = cv.getBoundingClientRect();
    targetX = (e.clientX - rect.left) * (W / rect.width);
    targetY = (e.clientY - rect.top) * (H / rect.height);
  });

  function spawnParticles(x, y, color, count, speedMax) {
    for (var i = 0; i &lt; count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = 0.5 + Math.random() * speedMax;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1, decay: 0.015 + Math.random() * 0.02,
        size: 2 + Math.random() * 3,
        color: color
      });
    }
  }

  function spawnCoin() {
    coins.push({ x: 30 + Math.random()*(W-60), y: 30 + Math.random()*(H-60), r: 10, pulse: Math.random()*Math.PI*2, power: false });
  }
  function spawnPowerup() {
    coins.push({ x: 30 + Math.random()*(W-60), y: 30 + Math.random()*(H-60), r: 12, pulse: Math.random()*Math.PI*2, power: true });
  }
  function spawnHazard() {
    var side = Math.floor(Math.random()*4);
    var speed = 1.5 + Math.random()*1.5 + elapsed/40000;
    var h = { r: 12 + Math.random()*6 };
    if (side === 0) { h.x = -20; h.y = Math.random()*H; h.vx = speed; h.vy = (Math.random()-0.5)*1.5; }
    else if (side === 1) { h.x = W+20; h.y = Math.random()*H; h.vx = -speed; h.vy = (Math.random()-0.5)*1.5; }
    else if (side === 2) { h.x = Math.random()*W; h.y = -20; h.vy = speed; h.vx = (Math.random()-0.5)*1.5; }
    else { h.x = Math.random()*W; h.y = H+20; h.vy = -speed; h.vx = (Math.random()-0.5)*1.5; }
    hazards.push(h);
  }

  function reset() {
    score = 0; lives = 3; gameOver = false; elapsed = 0;
    coins = []; hazards = []; particles = [];
    coinTimer = 0; hazardTimer = 0; powerupTimer = 0; invuln = 0;
    slowTime = 0;
    player.x = W/2; player.y = H/2; targetX = W/2; targetY = H/2;
    coinsEl.textContent = &#x27;0&#x27;; livesEl.textContent = &#x27;3&#x27;; slowEl.textContent = &#x27;0.0&#x27;;
    bestEl.textContent = bestScore;
    for (var i = 0; i &lt; 3; i++) spawnCoin();
    spawnHazard();
  }

  function update(dt) {
    elapsed += dt;
    player.x += (targetX - player.x) * 0.25;
    player.y += (targetY - player.y) * 0.25;
    if (invuln &gt; 0) invuln -= dt;
    if (slowTime &gt; 0) { slowTime -= dt; if (slowTime &lt; 0) slowTime = 0; }
    slowEl.textContent = (slowTime/1000).toFixed(1);

    var hazardScale = slowTime &gt; 0 ? SLOW_FACTOR : 1;

    coinTimer += dt; hazardTimer += dt; powerupTimer += dt;
    if (coinTimer &gt; 1100) { coinTimer = 0; if (coins.filter(function(c){return !c.power;}).length &lt; 6) spawnCoin(); }
    if (powerupTimer &gt; 9000) {
      powerupTimer = 0;
      if (!coins.some(function(c){return c.power;})) spawnPowerup();
    }
    var hazardRate = Math.max(500, 1500 - elapsed/20);
    if (hazardTimer &gt; hazardRate) { hazardTimer = 0; spawnHazard(); }

    for (var i = coins.length - 1; i &gt;= 0; i--) {
      var c = coins[i];
      c.pulse += dt/200;
      var dx = c.x - player.x, dy = c.y - player.y;
      if (Math.sqrt(dx*dx+dy*dy) &lt; player.r + c.r) {
        if (c.power) {
          slowTime = SLOW_DURATION;
          powerSound();
          spawnParticles(c.x, c.y, &#x27;#4db8ff&#x27;, 22, 4);
          spawnParticles(c.x, c.y, &#x27;#eaf6ff&#x27;, 12, 3);
        } else {
          score += 1; coinsEl.textContent = score;
          if (score &gt; bestScore) { bestScore = score; bestEl.textContent = bestScore; }
          beep(880, 0.12, &#x27;triangle&#x27;);
          spawnParticles(c.x, c.y, &#x27;#ffe066&#x27;, 16, 3.5);
          spawnParticles(c.x, c.y, &#x27;#fff4c0&#x27;, 8, 2.5);
        }
        coins.splice(i, 1);
      }
    }

    for (var j = hazards.length - 1; j &gt;= 0; j--) {
      var h = hazards[j];
      h.x += h.vx * hazardScale; h.y += h.vy * hazardScale;
      if (h.x &lt; -40 || h.x &gt; W+40 || h.y &lt; -40 || h.y &gt; H+40) { hazards.splice(j, 1); continue; }
      var hx = h.x - player.x, hy = h.y - player.y;
      if (invuln &lt;= 0 &amp;&amp; Math.sqrt(hx*hx+hy*hy) &lt; player.r + h.r) {
        hazards.splice(j, 1);
        lives -= 1; livesEl.textContent = Math.max(0, lives);
        invuln = 1200;
        beep(140, 0.3, &#x27;sawtooth&#x27;);
        spawnParticles(player.x, player.y, &#x27;#ff4d4d&#x27;, 20, 4);
        if (lives &lt;= 0) { gameOver = true; }
      }
    }

    // update particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * (dt/16);
      pt.y += pt.vy * (dt/16);
      pt.vx *= 0.96; pt.vy *= 0.96;
      pt.life -= pt.decay * (dt/16);
      if (pt.life &lt;= 0) particles.splice(p, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (slowTime &gt; 0) {
      ctx.fillStyle = &#x27;rgba(102,204,255,0.07)&#x27;;
      ctx.fillRect(0, 0, W, H);
    }

    // particles (drawn behind entities)
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI*2);
      ctx.fillStyle = pt.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var i = 0; i &lt; coins.length; i++) {
      var c = coins[i];
      var glow = 2 + Math.sin(c.pulse)*2;
      if (c.power) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r + glow + 3, 0, Math.PI*2);
        ctx.fillStyle = &#x27;rgba(102,204,255,0.3)&#x27;; ctx.fill();
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        ctx.fillStyle = &#x27;#4db8ff&#x27;; ctx.fill();
        ctx.strokeStyle = &#x27;#eaf6ff&#x27;; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = &#x27;#eaf6ff&#x27;;
        ctx.font = &#x27;bold 13px system-ui, sans-serif&#x27;;
        ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
        ctx.fillText(&#x27;❄&#x27;, c.x, c.y + 1);
      } else {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r + glow, 0, Math.PI*2);
        ctx.fillStyle = &#x27;rgba(255,224,102,0.25)&#x27;; ctx.fill();
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
        ctx.fillStyle = &#x27;#ffe066&#x27;; ctx.fill();
        ctx.strokeStyle = &#x27;#c9a227&#x27;; ctx.lineWidth = 2; ctx.stroke();
      }
    }

    var frozen = slowTime &gt; 0;
    for (var j = 0; j &lt; hazards.length; j++) {
      var h = hazards[j];
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r, 0, Math.PI*2);
      ctx.fillStyle = frozen ? &#x27;#7fa8c9&#x27; : &#x27;#ff4d4d&#x27;; ctx.fill();
      ctx.strokeStyle = frozen ? &#x27;#456&#x27; : &#x27;#a30000&#x27;; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = frozen ? &#x27;#bcd6ea&#x27; : &#x27;#ff8a8a&#x27;; ctx.lineWidth = 2;
      for (var a = 0; a &lt; 8; a++) {
        var ang = a/8 * Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(h.x + Math.cos(ang)*h.r, h.y + Math.sin(ang)*h.r);
        ctx.lineTo(h.x + Math.cos(ang)*(h.r+5), h.y + Math.sin(ang)*(h.r+5));
        ctx.stroke();
      }
    }

    var show = invuln &lt;= 0 || Math.floor(invuln/120) % 2 === 0;
    if (show) {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI*2);
      ctx.fillStyle = &#x27;rgba(102,204,255,0.25)&#x27;; ctx.fill();
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
      ctx.fillStyle = &#x27;#66ccff&#x27;; ctx.fill();
      ctx.strokeStyle = &#x27;#fff&#x27;; ctx.lineWidth = 2; ctx.stroke();
    }

    if (slowTime &gt; 0) {
      var barW = W - 40;
      var frac = slowTime / SLOW_DURATION;
      ctx.fillStyle = &#x27;rgba(255,255,255,0.15)&#x27;;
      ctx.fillRect(20, H - 14, barW, 6);
      ctx.fillStyle = &#x27;#4db8ff&#x27;;
      ctx.fillRect(20, H - 14, barW * frac, 6);
    }

    if (gameOver) {
      ctx.fillStyle = &#x27;rgba(0,0,0,0.6)&#x27;;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = &#x27;#fff&#x27;;
      ctx.font = &#x27;bold 34px system-ui, sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;alphabetic&#x27;;
      ctx.fillText(&#x27;Game Over&#x27;, W/2, H/2 - 22);
      ctx.font = &#x27;22px system-ui, sans-serif&#x27;;
      ctx.fillStyle = &#x27;#ffe066&#x27;;
      ctx.fillText(&#x27;Coins collected: &#x27; + score, W/2, H/2 + 12);
      ctx.font = &#x27;bold 20px system-ui, sans-serif&#x27;;
      ctx.fillStyle = &#x27;#b48eff&#x27;;
      ctx.fillText(&#x27;Best: &#x27; + bestScore, W/2, H/2 + 42);
      ctx.font = &#x27;16px system-ui, sans-serif&#x27;;
      ctx.fillStyle = &#x27;#aab&#x27;;
      ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2 + 72);
    }
  }

  function loop(t) {
    if (!running) return;
    if (!lastTime) lastTime = t;
    var dt = t - lastTime; lastTime = t;
    if (dt &gt; 60) dt = 60;
    if (!gameOver) update(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    running = true;
    lastTime = 0;
    reset();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  bestEl.textContent = bestScore;
  draw();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
