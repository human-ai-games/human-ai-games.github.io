<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shooter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Shooter</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 20px; color: #555; }
  .hearts { letter-spacing: 2px; font-size: 20px; }
  .power { font-size: 15px; color: #c0392b; min-height: 18px; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .ship { position: absolute; width: 30px; height: 24px; bottom: 12px;
          background: #555;
          clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
  .bullet { position: absolute; width: 5px; height: 12px; background: #777; border-radius: 2px; }
  .target { position: absolute; border-radius: 50%; }
  .t-basic { background: #444; }
  .t-zigzag { background: #16a085; border-radius: 6px; }
  .t-tank { background: #7f1d1d; border: 3px solid #b91c1c; }
  .powerup { position: absolute; width: 26px; height: 26px; border-radius: 6px; display: flex;
             align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: white;
             box-shadow: 0 0 10px 2px rgba(255,180,0,0.7); animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .pu-rapid { background: #e67e22; }
  .pu-double { background: #2980b9; }
  .pu-triple { background: #8e44ad; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); color: white;
             display: none; align-items: center; justify-content: center; flex-direction: column;
             font-size: 26px; gap: 8px; }
  .overlay small { font-size: 16px; opacity: 0.85; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrows and press &lt;strong&gt;Space&lt;/strong&gt; to shoot. Green zig-zaggers weave, big red tanks take 3 hits — don&#x27;t let any reach the bottom, and grab power-ups (R=rapid, 2=double, 3=triple)!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;hearts&quot; id=&quot;hearts&quot;&gt;❤️❤️❤️❤️❤️&lt;/div&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;power&quot; id=&quot;power&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div&gt;Game Over&lt;/div&gt;&lt;small&gt;Press Restart below to play again&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 4;
  var BULLET_W = 5, BULLET_H = 12, BULLET_SPEED = 7;
  var PU_SIZE = 26, PU_SPEED = 1.6;
  var SPAWN_INTERVAL = 1200;  // ms
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], powerups = [];
  var score = 0, lives = 5;
  var lastShot = 0;
  var shotMode = 1;
  var fireDelay = 250;
  var rapidUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var heartsEl = document.getElementById(&#x27;hearts&#x27;);
  var powerEl = document.getElementById(&#x27;power&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  // Enemy type definitions
  var ENEMY_TYPES = {
    basic:  { size: 34, speed: 1.8, hp: 1, points: 1, cls: &#x27;t-basic&#x27; },
    zigzag: { size: 28, speed: 1.6, hp: 1, points: 2, cls: &#x27;t-zigzag&#x27;, amp: 90, freq: 0.05 },
    tank:   { size: 52, speed: 0.9, hp: 3, points: 3, cls: &#x27;t-tank&#x27; }
  };

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }
  function paintHearts() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; lives; i++) s += &#x27;❤️&#x27;;
    for (var j = lives; j &lt; 5; j++) s += &#x27;🖤&#x27;;
    heartsEl.textContent = s;
  }
  function paintPower() {
    var parts = [];
    if (shotMode === 2) parts.push(&#x27;Double shot&#x27;);
    else if (shotMode === 3) parts.push(&#x27;Triple shot&#x27;);
    if (Date.now() &lt; rapidUntil) parts.push(&#x27;Rapid fire&#x27;);
    powerEl.textContent = parts.join(&#x27; + &#x27;);
  }

  function spawnTarget() {
    // weighted pick
    var r = Math.random();
    var type = r &lt; 0.55 ? &#x27;basic&#x27; : (r &lt; 0.82 ? &#x27;zigzag&#x27; : &#x27;tank&#x27;);
    var def = ENEMY_TYPES[type];
    var baseX = Math.random() * (FIELD_W - def.size);
    var t = {
      type: type, def: def, hp: def.hp,
      baseX: baseX, x: baseX, y: -def.size,
      phase: Math.random() * Math.PI * 2, el: null
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target &#x27; + def.cls;
    el.style.width = def.size + &#x27;px&#x27;;
    el.style.height = def.size + &#x27;px&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnPowerup() {
    var types = [&#x27;rapid&#x27;, &#x27;double&#x27;, &#x27;triple&#x27;];
    var type = types[Math.floor(Math.random() * types.length)];
    var label = type === &#x27;rapid&#x27; ? &#x27;R&#x27; : (type === &#x27;double&#x27; ? &#x27;2&#x27; : &#x27;3&#x27;);
    var p = { x: Math.random() * (FIELD_W - PU_SIZE), y: -PU_SIZE, type: type, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup pu-&#x27; + type;
    el.textContent = label;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
  }

  function spawnBullet() {
    var now = Date.now();
    var delay = now &lt; rapidUntil ? 110 : fireDelay;
    if (now - lastShot &lt; delay) return;
    lastShot = now;
    var cx = shipX + SHIP_W / 2 - BULLET_W / 2;
    var topY = FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H;
    var offsets;
    if (shotMode === 1) offsets = [0];
    else if (shotMode === 2) offsets = [-9, 9];
    else offsets = [-14, 0, 14];
    offsets.forEach(function (off) {
      var b = { x: cx + off, y: topY, el: null };
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;bullet&#x27;;
      el.style.left = b.x + &#x27;px&#x27;;
      el.style.top = b.y + &#x27;px&#x27;;
      field.appendChild(el);
      b.el = el;
      bullets.push(b);
    });
  }

  function loseLife() {
    lives -= 1;
    paintHearts();
    if (lives &lt;= 0) gameOver();
  }

  function gameOver() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    overlay.style.display = &#x27;flex&#x27;;
  }

  function applyPowerup(type) {
    if (type === &#x27;rapid&#x27;) rapidUntil = Date.now() + 6000;
    else if (type === &#x27;double&#x27;) shotMode = 2;
    else if (type === &#x27;triple&#x27;) shotMode = 3;
    paintPower();
  }

  function damageTarget(t) {
    t.hp -= 1;
    if (t.hp &lt;= 0) {
      field.removeChild(t.el);
      var idx = targets.indexOf(t);
      if (idx &gt;= 0) targets.splice(idx, 1);
      score += t.def.points;
      scoreEl.textContent = score;
      return true;
    } else {
      // fade tank color to show damage
      var frac = t.hp / t.def.hp;
      t.el.style.opacity = (0.4 + 0.6 * frac).toFixed(2);
      return false;
    }
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    // Bullets up
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) {
        field.removeChild(b.el); bullets.splice(i, 1); continue;
      }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }

    // Targets down
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += t.def.speed;
      if (t.type === &#x27;zigzag&#x27;) {
        t.phase += t.def.freq;
        t.x = t.baseX + Math.sin(t.phase) * t.def.amp;
        t.x = Math.max(0, Math.min(FIELD_W - t.def.size, t.x));
        t.el.style.left = t.x + &#x27;px&#x27;;
      }
      if (t.y &gt; FIELD_H) {
        field.removeChild(t.el); targets.splice(j, 1);
        loseLife();
        if (!running) return;
        continue;
      }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }

    // Powerups down
    var shipTop = FIELD_H - SHIP_BOTTOM - SHIP_H;
    for (var k = powerups.length - 1; k &gt;= 0; k--) {
      var p = powerups[k];
      p.y += PU_SPEED;
      if (p.y &gt; FIELD_H) {
        field.removeChild(p.el); powerups.splice(k, 1); continue;
      }
      if (p.y + PU_SIZE &gt; shipTop &amp;&amp; p.x &lt; shipX + SHIP_W &amp;&amp; p.x + PU_SIZE &gt; shipX) {
        applyPowerup(p.type);
        field.removeChild(p.el); powerups.splice(k, 1); continue;
      }
      p.el.style.top = p.y + &#x27;px&#x27;;
    }

    // Collisions bullet/target
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      var hit = false;
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        var sz = t2.def.size;
        if (b2.x &lt; t2.x + sz &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + sz &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          damageTarget(t2);
          hit = true;
          break;
        }
      }
      if (hit) continue;
    }

    paintPower();
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    powerups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    bullets = []; targets = []; powerups = [];
  }

  var puSpawnCounter = 0;
  function spawnCycle() {
    spawnTarget();
    puSpawnCounter++;
    if (puSpawnCounter % 4 === 0) spawnPowerup();
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; lives = 5; shotMode = 1; rapidUntil = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    paintHearts(); paintPower();
    overlay.style.display = &#x27;none&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var kk in keysDown) keysDown[kk] = false;
    lastShot = 0;
    puSpawnCounter = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnCycle, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) spawnBullet();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip(); paintHearts();
&lt;/script&gt;

&lt;script&gt;

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

  function init() {

  if (document.readyState === &#x27;complete&#x27;) {

  }

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
