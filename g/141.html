<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FROGGER QUEST</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>FROGGER QUEST</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: &#x27;Courier New&#x27;, monospace; margin: 0; padding: 0; background: #0a0f14; color: #e8e8e8; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 640px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; color: #7CFC00; letter-spacing: 2px; text-shadow: 2px 2px 0 #003300; }
  .instructions { font-size: 16px; color: #b8d8b8; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 26px; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .hud .lbl { color: #ffd700; }
  .hud .val { color: #fff; }
  .field { position: relative; width: 520px; height: 470px; flex-shrink: 0; border: 3px solid #2a3a2a; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 0 24px rgba(0,0,0,0.6) inset; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;FROGGER QUEST&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to hop up across the road, river and grass — dodge cars and critters, but swim freely in the water and ride logs or animals for bonus points. Every lane you climb scores points; reach the top to win big. Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;HI&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;hi&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;ROW&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;rown&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;520&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var FIELD_W = 520, FIELD_H = 470;
  var COLS = 11;
  var CELL = FIELD_W / COLS;
  var ROW_H = 92;
  var ROWS = 16;

  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var hiEl = document.getElementById(&#x27;hi&#x27;);
  var rowEl = document.getElementById(&#x27;rown&#x27;);

  var running = false, animId = null, lastT = 0;
  var score = 0, hiScore = 0, maxRow = 0;
  var frog = { col: 5, row: 0, offset: 0, hop: 0, dir: 1, alive: true };
  var popups = [], ripples = [];
  var bannerText = &#x27;&#x27;, bannerWin = false;
  var camY = 0, targetCamY = 0;
  var shake = 0, timeT = 0;
  var lanes = [];
  var ridingNow = null;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function worldTop(row) { return (ROWS - 1 - row) * ROW_H; }
  var WORLD_H = ROWS * ROW_H;

  function emojiFor(kind) {
    switch (kind) {
      case &#x27;car&#x27;: return &#x27;🚗&#x27;; case &#x27;bus&#x27;: return &#x27;🚌&#x27;; case &#x27;bike&#x27;: return &#x27;🏍️&#x27;; case &#x27;truck&#x27;: return &#x27;🚚&#x27;;
      case &#x27;log&#x27;: return &#x27;🪵&#x27;; case &#x27;leaf&#x27;: return &#x27;🍃&#x27;; case &#x27;duck&#x27;: return &#x27;🦆&#x27;; case &#x27;gull&#x27;: return &#x27;🦢&#x27;; case &#x27;turtle&#x27;: return &#x27;🐢&#x27;;
      case &#x27;snake&#x27;: return &#x27;🐍&#x27;; case &#x27;hopper&#x27;: return &#x27;🦗&#x27;; case &#x27;spider&#x27;: return &#x27;🕷️&#x27;; case &#x27;frog2&#x27;: return &#x27;🐸&#x27;;
    }
    return &#x27;?&#x27;;
  }

  function buildLanes() {
    lanes = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var type = &#x27;safe&#x27;;
      if (r &gt;= 1 &amp;&amp; r &lt;= 4) type = &#x27;road&#x27;;
      else if (r &gt;= 6 &amp;&amp; r &lt;= 9) type = &#x27;river&#x27;;
      else if (r &gt;= 11 &amp;&amp; r &lt;= 14) type = &#x27;grass&#x27;;
      var lane = { row: r, type: type, dir: (r % 2 === 0 ? 1 : -1), entities: [], phase: rand(0, 6.28) };
      var count = 2 + Math.floor(rand(0, 2)); // 2 or 3
      var kind, speed, w;
      if (type === &#x27;road&#x27;) {
        var kinds = [&#x27;car&#x27;, &#x27;bus&#x27;, &#x27;bike&#x27;, &#x27;truck&#x27;];
        kind = kinds[Math.floor(rand(0, kinds.length))];
        speed = rand(55, 130);
        w = (kind === &#x27;bus&#x27; || kind === &#x27;truck&#x27;) ? CELL * 1.6 : CELL * 1.0;
      } else if (type === &#x27;river&#x27;) {
        var rkinds = [&#x27;log&#x27;, &#x27;duck&#x27;, &#x27;leaf&#x27;, &#x27;turtle&#x27;, &#x27;gull&#x27;];
        kind = rkinds[Math.floor(rand(0, rkinds.length))];
        speed = rand(35, 80);
        w = (kind === &#x27;log&#x27; || kind === &#x27;leaf&#x27;) ? CELL * 2.3 : CELL * 1.6;
      } else if (type === &#x27;grass&#x27;) {
        var gkinds = [&#x27;snake&#x27;, &#x27;hopper&#x27;, &#x27;spider&#x27;, &#x27;frog2&#x27;];
        kind = gkinds[Math.floor(rand(0, gkinds.length))];
        speed = rand(40, 110);
        w = CELL * 0.9;
      }
      if (type !== &#x27;safe&#x27;) {
        // Evenly spaced along the wrap-around track so nothing overlaps.
        var track = FIELD_W + w + 60; // extra spacing buffer per slot
        var slot = track / count;
        var start = rand(0, slot);
        for (var i = 0; i &lt; count; i++) {
          var jitter = rand(-slot * 0.2, slot * 0.2);
          var x = start + i * slot + jitter - w;
          lane.entities.push({ kind: kind, x: x, w: w, speed: speed, ride: type === &#x27;river&#x27; });
        }
      }
      lanes.push(lane);
    }
  }

  function laneBg(type, r) {
    if (type === &#x27;road&#x27;) return &#x27;#33373d&#x27;;
    if (type === &#x27;river&#x27;) return &#x27;#164e8f&#x27;;
    if (type === &#x27;grass&#x27;) return (r % 2 ? &#x27;#2f6b2f&#x27; : &#x27;#357a35&#x27;);
    return &#x27;#3fa03f&#x27;;
  }

  function draw() {
    ctx.save();
    var sx = shake &gt; 0 ? rand(-shake, shake) : 0;
    var sy = shake &gt; 0 ? rand(-shake, shake) : 0;
    ctx.translate(sx, sy);
    ctx.clearRect(-10, -10, FIELD_W + 20, FIELD_H + 20);

    ctx.textAlign = &#x27;center&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;

    for (var r = 0; r &lt; ROWS; r++) {
      var lane = lanes[r];
      var y = worldTop(r) - camY;
      if (y &gt; FIELD_H || y + ROW_H &lt; 0) continue;
      ctx.fillStyle = laneBg(lane.type, r);
      ctx.fillRect(0, y, FIELD_W, ROW_H + 1);

      if (lane.type === &#x27;road&#x27;) {
        ctx.strokeStyle = &#x27;rgba(255,220,80,0.5)&#x27;;
        ctx.lineWidth = 3;
        ctx.setLineDash([14, 12]);
        ctx.beginPath(); ctx.moveTo(0, y + ROW_H / 2); ctx.lineTo(FIELD_W, y + ROW_H / 2); ctx.stroke();
        ctx.setLineDash([]);
      } else if (lane.type === &#x27;river&#x27;) {
        ctx.strokeStyle = &#x27;rgba(255,255,255,0.10)&#x27;;
        ctx.lineWidth = 2;
        for (var w = 0; w &lt; 3; w++) {
          ctx.beginPath();
          var yy = y + ROW_H * (0.3 + w * 0.25);
          for (var xx = 0; xx &lt;= FIELD_W; xx += 12) {
            var wy = yy + Math.sin((xx * 0.05) + timeT * 2 + w + lane.phase) * 3;
            if (xx === 0) ctx.moveTo(xx, wy); else ctx.lineTo(xx, wy);
          }
          ctx.stroke();
        }
      } else if (lane.type === &#x27;grass&#x27;) {
        ctx.fillStyle = &#x27;rgba(255,255,255,0.05)&#x27;;
        for (var g = 0; g &lt; 8; g++) {
          var gx = ((g * 71 + r * 33) % FIELD_W);
          ctx.fillText(&#x27;🌿&#x27;, gx, y + (g % 2 ? ROW_H * 0.35 : ROW_H * 0.7));
        }
      }
    }

    var topY = worldTop(15) - camY;
    if (topY &lt; FIELD_H &amp;&amp; topY + ROW_H &gt; 0) {
      ctx.font = &#x27;28px monospace&#x27;;
      ctx.fillText(&#x27;🏁   🏁   🏁&#x27;, FIELD_W / 2, topY + ROW_H / 2);
    }

    for (var p = 0; p &lt; ripples.length; p++) {
      var rp = ripples[p];
      ctx.globalAlpha = Math.max(0, rp.life);
      ctx.strokeStyle = &#x27;#cfe8ff&#x27;;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y - camY, rp.r, 0, 6.28);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (var i = 0; i &lt; lanes.length; i++) {
      var lane2 = lanes[i];
      var ly0 = worldTop(lane2.row) - camY;
      if (ly0 &gt; FIELD_H || ly0 + ROW_H &lt; 0) continue;
      for (var j = 0; j &lt; lane2.entities.length; j++) {
        var e = lane2.entities[j];
        var em = emojiFor(e.kind);
        var bob = 0, wob = 0;
        if (lane2.type === &#x27;river&#x27;) bob = Math.sin(timeT * 3 + e.x * 0.05) * 4;
        if (lane2.type === &#x27;road&#x27; || lane2.type === &#x27;grass&#x27;) wob = Math.sin(timeT * 8 + e.x * 0.1) * 0.12;
        var ly = ly0 + ROW_H / 2 + bob;
        ctx.save();
        ctx.font = Math.floor(ROW_H * 0.55) + &#x27;px serif&#x27;;
        if (e.w &gt; CELL * 1.5) {
          ctx.fillText(em, e.x + e.w * 0.3, ly);
          ctx.fillText(em, e.x + e.w * 0.7, ly);
        } else {
          ctx.translate(e.x + e.w / 2, ly);
          ctx.rotate(wob);
          ctx.fillText(em, 0, 0);
        }
        ctx.restore();
      }
    }

    var fx = frog.col * CELL + CELL / 2 + frog.offset;
    var fyRow = worldTop(frog.row) - camY;
    var hopLift = Math.sin(frog.hop * Math.PI) * 18;
    var fy = fyRow + ROW_H / 2 - hopLift;
    var stretch = 1 + Math.sin(frog.hop * Math.PI) * 0.25;
    // swimming bob when in water and not riding
    var inWater = lanes[frog.row] &amp;&amp; lanes[frog.row].type === &#x27;river&#x27;;
    if (inWater &amp;&amp; frog.alive) fy += Math.sin(timeT * 5) * 3;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(2 - stretch, stretch);
    if (frog.dir &lt; 0) ctx.scale(-1, 1);
    ctx.font = Math.floor(ROW_H * 0.62) + &#x27;px serif&#x27;;
    ctx.globalAlpha = frog.alive ? 1 : 0.5;
    ctx.fillText(frog.alive ? &#x27;🐸&#x27; : &#x27;💥&#x27;, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;

    for (var q = 0; q &lt; popups.length; q++) {
      ctx.globalAlpha = Math.max(0, popups[q].life);
      ctx.fillStyle = popups[q].color || &#x27;#ffe94d&#x27;;
      ctx.font = &#x27;bold &#x27; + (16 + (1 - popups[q].life) * 6) + &#x27;px monospace&#x27;;
      ctx.fillText(popups[q].text, popups[q].x, popups[q].y - camY);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (bannerText) {
      ctx.fillStyle = &#x27;rgba(0,0,0,0.55)&#x27;;
      ctx.fillRect(0, FIELD_H * 0.35, FIELD_W, 80);
      ctx.fillStyle = bannerWin ? &#x27;#7CFC00&#x27; : &#x27;#ff5050&#x27;;
      ctx.font = &#x27;bold 30px monospace&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(bannerText, FIELD_W / 2, FIELD_H * 0.42);
      ctx.font = &#x27;15px monospace&#x27;;
      ctx.fillStyle = &#x27;#fff&#x27;;
      ctx.fillText(&#x27;Press Start/Restart below&#x27;, FIELD_W / 2, FIELD_H * 0.42 + 28);
    }
  }

  function update(dt) {
    timeT += dt;
    if (shake &gt; 0) shake = Math.max(0, shake - dt * 40);
    targetCamY = worldTop(frog.row) - FIELD_H * 0.62;
    targetCamY = Math.max(0, Math.min(WORLD_H - FIELD_H, targetCamY));
    camY += (targetCamY - camY) * Math.min(1, dt * 8);

    if (frog.hop &gt; 0) { frog.hop -= dt * 6; if (frog.hop &lt; 0) frog.hop = 0; }

    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      if (lane.type === &#x27;safe&#x27;) continue;
      for (var j = 0; j &lt; lane.entities.length; j++) {
        var e = lane.entities[j];
        e.x += lane.dir * e.speed * dt;
        if (lane.dir &gt; 0 &amp;&amp; e.x &gt; FIELD_W + 10) e.x = -e.w - rand(0, 30);
        else if (lane.dir &lt; 0 &amp;&amp; e.x + e.w &lt; -10) e.x = FIELD_W + rand(0, 30);
      }
    }

    if (!frog.alive) return;

    var curLane = lanes[frog.row];
    // RIVER: frog swims freely (never drowns). Riding gives a boost + bonus.
    if (curLane &amp;&amp; curLane.type === &#x27;river&#x27;) {
      var fx = frog.col * CELL + CELL / 2 + frog.offset;
      var riding = null;
      for (var k = 0; k &lt; curLane.entities.length; k++) {
        var e2 = curLane.entities[k];
        if (fx &gt; e2.x &amp;&amp; fx &lt; e2.x + e2.w) { riding = e2; break; }
      }
      if (riding) {
        frog.offset += curLane.dir * riding.speed * dt;
        // award a one-time bonus for first landing on a rider
        if (ridingNow !== riding) {
          ridingNow = riding;
          score += 5; scoreEl.textContent = score;
          addPopup(&#x27;+5 RIDE!&#x27;, &#x27;#8ef0ff&#x27;);
        }
      } else {
        ridingNow = null;
      }
      // keep frog within the field even while swimming
      var absX = frog.col * CELL + CELL / 2 + frog.offset;
      if (absX &lt; CELL / 2) frog.offset = CELL / 2 - frog.col * CELL - CELL / 2;
      if (absX &gt; FIELD_W - CELL / 2) frog.offset = FIELD_W - CELL / 2 - frog.col * CELL - CELL / 2;
    } else {
      ridingNow = null;
    }

    if (curLane &amp;&amp; (curLane.type === &#x27;road&#x27; || curLane.type === &#x27;grass&#x27;)) {
      var fx2 = frog.col * CELL + CELL / 2 + frog.offset;
      for (var m = 0; m &lt; curLane.entities.length; m++) {
        var e3 = curLane.entities[m];
        if (fx2 &gt; e3.x - CELL * 0.3 &amp;&amp; fx2 &lt; e3.x + e3.w + CELL * 0.3) { die(&#x27;SPLAT!&#x27;); return; }
      }
    }

    for (var p = popups.length - 1; p &gt;= 0; p--) {
      popups[p].y -= 26 * dt; popups[p].life -= dt * 1.1;
      if (popups[p].life &lt;= 0) popups.splice(p, 1);
    }
    for (var rr = ripples.length - 1; rr &gt;= 0; rr--) {
      ripples[rr].r += 40 * dt; ripples[rr].life -= dt * 1.5;
      if (ripples[rr].life &lt;= 0) ripples.splice(rr, 1);
    }
  }

  function addPopup(text, color) {
    var fx = frog.col * CELL + CELL / 2 + frog.offset;
    var fy = worldTop(frog.row) + ROW_H / 2 - 14;
    popups.push({ text: text, x: fx, y: fy, life: 1, color: color });
  }

  function die(msg) {
    frog.alive = false;
    running = false;
    shake = 8;
    bannerText = msg; bannerWin = false;
    if (score &gt; hiScore) { hiScore = score; hiEl.textContent = hiScore; }
    if (animId) cancelAnimationFrame(animId);
    animId = null;
    draw();
  }

  function win() {
    score += 100; scoreEl.textContent = score;
    running = false;
    bannerText = &#x27;YOU WIN! +100&#x27;; bannerWin = true;
    if (score &gt; hiScore) { hiScore = score; hiEl.textContent = hiScore; }
    if (animId) cancelAnimationFrame(animId);
    animId = null;
    draw();
  }

  function move(dc, dr) {
    if (!running || !frog.alive) return;
    var nr = frog.row + dr;
    var nc = frog.col + dc;
    if (nr &lt; 0 || nr &gt; 15) nr = frog.row;
    if (nc &lt; 0) nc = 0;
    if (nc &gt; COLS - 1) nc = COLS - 1;

    if (dr !== 0) {
      var absX = frog.col * CELL + CELL / 2 + frog.offset;
      var snapCol = Math.max(0, Math.min(COLS - 1, Math.round((absX - CELL / 2) / CELL)));
      frog.col = snapCol; frog.offset = 0; frog.row = nr;
      ridingNow = null;
    } else {
      frog.col = nc; frog.offset = 0; frog.dir = dc &lt; 0 ? -1 : 1;
    }
    frog.hop = 1;

    if (frog.row &gt; maxRow) {
      var gained = (frog.row - maxRow) * 10;
      maxRow = frog.row; score += gained; scoreEl.textContent = score;
      rowEl.textContent = maxRow; addPopup(&#x27;+&#x27; + gained, &#x27;#ffe94d&#x27;);
      if (frog.row === 15) { draw(); win(); return; }
    }
    draw();
  }

  function loop(t) {
    if (!running) return;
    if (!lastT) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    update(dt);
    draw();
    if (running) animId = requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0; maxRow = 0;
    scoreEl.textContent = &#x27;0&#x27;; rowEl.textContent = &#x27;0&#x27;;
    frog = { col: 5, row: 0, offset: 0, hop: 0, dir: 1, alive: true };
    popups = []; ripples = []; bannerText = &#x27;&#x27;; shake = 0; timeT = 0; ridingNow = null;
    buildLanes();
    camY = Math.max(0, Math.min(WORLD_H - FIELD_H, worldTop(0) - FIELD_H * 0.62));
    running = true; lastT = 0;
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function stopGame() {
    running = false;
    if (animId) cancelAnimationFrame(animId);
    animId = null;
    draw();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, 1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, -1); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  buildLanes();
  camY = Math.max(0, Math.min(WORLD_H - FIELD_H, worldTop(0) - FIELD_H * 0.62));
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
