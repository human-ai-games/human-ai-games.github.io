[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {

var mouseX = null;

var BASE_SPEED = 5.6;

var AC = null;
function beep(freq, dur, type, vol) {

    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();

function makeBricks(lv) {
  bricks = [];

  var bw = 58, bh = 20, gap = 6;
  var totalW = cols * bw + (cols - 1) * gap;

        color: COLORS[(r + c) % COLORS.length]

function newBall(x, y, vx, vy) {
  return { x: x, y: y, vx: vx, vy: vy, r: 8 };
}

function resetBallsAndPaddle() {

  var sp = levelSpeed(level);
  balls = [ newBall(W / 2, H - 40, sp * 0.6, -sp) ];

function startLevel(lv) {
  makeBricks(lv);
  powerups = [];
  particles = [];

  flash(&#x27;LEVEL &#x27; + lv, 900);
}

function startGame() {

  scoreEl.textContent = 0; livesEl.textContent = 3; comboEl.textContent = &#x27;x1&#x27;;
  for (var k in keysDown) keysDown[k] = false;

  running = true;
  msgEl.style.display = &#x27;none&#x27;;

}

  running = false;

function maybeDropPowerup(x, y) {

    var types = [&#x27;wide&#x27;, &#x27;multi&#x27;, &#x27;life&#x27;, &#x27;slow&#x27;];
    var t = types[Math.floor(Math.random() * types.length)];
    powerups.push({ x: x, y: y, vy: 2, type: t });
  }

function applyPowerup(t) {

  else if (t === &#x27;multi&#x27;) {
    var extra = [];
    balls.forEach(function(b) {
      extra.push(newBall(b.x, b.y, -b.vx, b.vy));
      extra.push(newBall(b.x, b.y, b.vy, -b.vx));
