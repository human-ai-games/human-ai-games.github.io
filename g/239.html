&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;⚔️ Medieval Ghost Busters 👻&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your staff with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; to deflect the ghost, which sends a magic orb falling from the wall. Catch orbs to slow the ghost, earn necromancer points, and grow flowers — miss them and your staff just grows bigger. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;
    &lt;span&gt;Orbs cast: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Necromancer points: &lt;b id=&quot;necro&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;wall&quot; width=&quot;620&quot; height=&quot;60&quot; style=&quot;position:absolute;top:0;left:0;&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;staff&quot; id=&quot;staff&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ghost&quot; id=&quot;ghost&quot;&gt;👻&lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var WALL_H = 60;
  var STAFF_BOTTOM = 12, STAFF_SPEED = 6.5;
  var STAFF_H = 14;
  var staffW = 100;
  var STAFF_W_MAX = 260;
  var GHOST_SIZE = 30;
  var BASE_SPEED = 2.6, MIN_SPEED = 0.9;
  var ballSpeed = BASE_SPEED;
  var running = false, animId = null;
  var keysDown = {};
  var staffX = (FIELD_W - staffW) / 2;
  var ballX = FIELD_W / 2, ballY = 100;
  var ballVX = ballSpeed, ballVY = ballSpeed;
  var bobPhase = 0;
  var score = 0, necro = 0;
  var flowers = [];   // {pos, emoji, side: &#x27;top&#x27;|&#x27;bottom&#x27;}
  var orbs = [];

  var field = document.getElementById(&#x27;field&#x27;);
  var staff = document.getElementById(&#x27;staff&#x27;);
  var ghost = document.getElementById(&#x27;ghost&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var necroEl = document.getElementById(&#x27;necro&#x27;);
  var wallCanvas = document.getElementById(&#x27;wall&#x27;);
  var wctx = wallCanvas.getContext(&#x27;2d&#x27;);

  function drawWall() {
    wctx.clearRect(0, 0, FIELD_W, WALL_H);
    wctx.fillStyle = &#x27;#5a5266&#x27;;
    wctx.fillRect(0, 0, FIELD_W, WALL_H);
    var bw = 44, bh = 20;
    wctx.strokeStyle = &#x27;#2e2838&#x27;;
    wctx.lineWidth = 2;
    for (var row = 0; row * bh &lt; WALL_H; row++) {
      var offset = (row % 2) * (bw / 2);
      for (var x = -bw; x &lt; FIELD_W + bw; x += bw) {
        var bx = x + offset, by = row * bh;
        var g = wctx.createLinearGradient(bx, by, bx, by + bh);
        g.addColorStop(0, &#x27;#6b6378&#x27;);
        g.addColorStop(1, &#x27;#4a4356&#x27;);
        wctx.fillStyle = g;
        wctx.fillRect(bx + 1, by + 1, bw - 2, bh - 2);
        wctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
      }
    }
    wctx.fillStyle = &#x27;#5a5266&#x27;;
    for (var nx = 0; nx &lt; FIELD_W; nx += 40) {
      wctx.fillRect(nx + 20, WALL_H - 8, 20, 8);
    }
    wctx.fillStyle = &#x27;rgba(180,107,255,0.25)&#x27;;
    wctx.fillRect(0, WALL_H - 2, FIELD_W, 2);
  }

  var FLOWER_EMOJI = [&#x27;🌸&#x27;,&#x27;🌼&#x27;,&#x27;🌺&#x27;,&#x27;🌷&#x27;,&#x27;🏵️&#x27;];
  function buildStaff() {
    var flowerHtml = &#x27;&#x27;;
    for (var i = 0; i &lt; flowers.length; i++) {
      var f = flowers[i];
      var topStyle = f.side === &#x27;top&#x27; ? &#x27;top:-14px;&#x27; : &#x27;top:&#x27; + STAFF_H + &#x27;px;&#x27;;
      flowerHtml += &#x27;&lt;div style=&quot;position:absolute;left:&#x27; + (f.pos * 100) + &#x27;%;&#x27; + topStyle +
        &#x27;transform:translateX(-50%);font-size:16px;filter:drop-shadow(0 0 4px #ffb3e6);&quot;&gt;&#x27; +
        f.emoji + &#x27;&lt;/div&gt;&#x27;;
    }
    staff.innerHTML =
      &#x27;&lt;div style=&quot;position:relative;width:&#x27; + staffW + &#x27;px;height:&#x27; + STAFF_H + &#x27;px;&quot;&gt;&#x27; +
        &#x27;&lt;div style=&quot;position:absolute;left:0;top:3px;width:100%;height:8px;border-radius:5px;&#x27; +
          &#x27;background:linear-gradient(#8a5a2b,#5c3a18);box-shadow:0 0 6px #2a1a08;&quot;&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div style=&quot;position:absolute;left:50%;top:-3px;transform:translateX(-50%);&#x27; +
          &#x27;width:16px;height:16px;border-radius:50%;&#x27; +
          &#x27;background:radial-gradient(circle at 35% 35%,#fff,#8ad9ff 55%,#3f8fff);&#x27; +
          &#x27;box-shadow:0 0 14px #6bb6ff;&quot;&gt;&lt;/div&gt;&#x27; +
        flowerHtml +
      &#x27;&lt;/div&gt;&#x27;;
  }

  function paint() {
    staff.style.left = staffX + &#x27;px&#x27;;
    staff.style.bottom = STAFF_BOTTOM + &#x27;px&#x27;;
    ghost.style.left = ballX + &#x27;px&#x27;;
    ghost.style.top = ballY + &#x27;px&#x27;;
  }

  function setBallSpeed(s) {
    ballSpeed = s;
    var mag = Math.hypot(ballVX, ballVY) || 1;
    ballVX = ballVX / mag * s;
    ballVY = ballVY / mag * s;
  }

  function resetBall() {
    ballX = (FIELD_W - GHOST_SIZE) / 2;
    ballY = WALL_H + 30;
    var dir = Math.random() &lt; 0.5 ? -1 : 1;
    ballVX = dir * ballSpeed * 0.7;
    ballVY = ballSpeed;
    setBallSpeed(ballSpeed);
  }

  function spawnOrb(x) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;orb&#x27;;
    field.appendChild(el);
    orbs.push({ el: el, x: x, y: WALL_H, vy: 3.2 + Math.random() * 1.2, vx: (Math.random() - 0.5) * 1.2 });
  }

  function updateOrbs() {
    var staffTop = FIELD_H - STAFF_BOTTOM - STAFF_H;
    for (var i = orbs.length - 1; i &gt;= 0; i--) {
      var o = orbs[i];
      o.x += o.vx;
      o.y += o.vy;
      if (o.x &lt;= 0 || o.x &gt;= FIELD_W - 14) o.vx = -o.vx;
      o.el.style.left = o.x + &#x27;px&#x27;;
      o.el.style.top = o.y + &#x27;px&#x27;;

      if (o.y + 14 &gt;= staffTop &amp;&amp; o.y &lt;= staffTop + STAFF_H + 4 &amp;&amp;
          o.x + 14 &gt;= staffX &amp;&amp; o.x &lt;= staffX + staffW) {
        necro += 1;
        necroEl.textContent = necro;
        setBallSpeed(Math.max(MIN_SPEED, ballSpeed - 0.22));
        addFlower();
        fairyChime();
        field.removeChild(o.el);
        orbs.splice(i, 1);
        continue;
      }
      if (o.y &gt; FIELD_H) {
        field.removeChild(o.el);
        orbs.splice(i, 1);
      }
    }
  }

  function addFlower() {
    flowers.push({
      pos: Math.random() * 0.9 + 0.05,
      emoji: FLOWER_EMOJI[Math.floor(Math.random() * FLOWER_EMOJI.length)],
      side: Math.random() &lt; 0.5 ? &#x27;top&#x27; : &#x27;bottom&#x27;
    });
    if (flowers.length &gt; 20) flowers.shift();
    buildStaff();
  }

  function beep(freq, dur, type) {
    try {
      var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
      var osc = ac.createOscillator(), g = ac.createGain();
      osc.frequency.value = freq;
      osc.type = type || &#x27;sine&#x27;;
      g.gain.value = 0.08;
      osc.connect(g); g.connect(ac.destination);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      osc.stop(ac.currentTime + dur);
    } catch (_) {}
  }

  function fairyChime() {
    var notes = [880, 1108, 1318, 1760];
    try {
      var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
      notes.forEach(function (f, i) {
        var osc = ac.createOscillator(), g = ac.createGain();
        osc.type = &#x27;triangle&#x27;;
        osc.frequency.value = f;
        var t0 = ac.currentTime + i * 0.06;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
        osc.connect(g); g.connect(ac.destination);
        osc.start(t0);
        osc.stop(t0 + 0.28);
      });
    } catch (_) {}
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) staffX -= STAFF_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) staffX += STAFF_SPEED;
    staffX = Math.max(0, Math.min(FIELD_W - staffW, staffX));

    bobPhase += 0.08;
    ballX += ballVX;
    ballY += ballVY + Math.sin(bobPhase) * 0.4;
    ghost.style.transform = &#x27;translateY(&#x27; + (Math.sin(bobPhase) * 3) + &#x27;px)&#x27;;

    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + GHOST_SIZE &gt;= FIELD_W) { ballX = FIELD_W - GHOST_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= WALL_H) { ballY = WALL_H; ballVY = Math.abs(ballVY); }

    var staffTop = FIELD_H - STAFF_BOTTOM - STAFF_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + GHOST_SIZE &gt;= staffTop &amp;&amp;
        ballY + GHOST_SIZE &lt;= staffTop + STAFF_H + 8 &amp;&amp;
        ballX + GHOST_SIZE &gt;= staffX &amp;&amp;
        ballX &lt;= staffX + staffW) {
      ballVY = -Math.abs(ballVY);
      ballY = staffTop - GHOST_SIZE;
      score += 1;
      scoreEl.textContent = score;
      spawnOrb(ballX + GHOST_SIZE / 2 - 7);
      if (staffW &lt; STAFF_W_MAX) {
        staffW = Math.min(STAFF_W_MAX, staffW + 12);
        buildStaff();
        staffX = Math.max(0, Math.min(FIELD_W - staffW, staffX));
      }
      beep(520, 0.15);
    }

    if (ballY &gt;= FIELD_H) { beep(160, 0.25, &#x27;sawtooth&#x27;); resetBall(); }

    updateOrbs();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0; necro = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    necroEl.textContent = &#x27;0&#x27;;
    staffW = 100;
    flowers = [];
    ballSpeed = BASE_SPEED;
    buildStaff();
    staffX = (FIELD_W - staffW) / 2;
    orbs.forEach(function (o) { if (o.el.parentNode) field.removeChild(o.el); });
    orbs = [];
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  drawWall();
  buildStaff();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
