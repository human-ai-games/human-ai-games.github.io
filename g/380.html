<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling blocks</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }

  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b> &middot; Game 380 &middot; Amateur producer &middot; Basic game: Falling blocks</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .arena { display: flex; align-items: flex-start; gap: 16px; }
  .fruitbar { width: 120px; min-height: 384px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px; }
  .fruitbar .label { font-size: 16px; color: #777; }
  .fruit-list { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
  .fruit { font-size: 34px; line-height: 1; animation: pop 0.4s ease; }
  @keyframes pop { 0% { transform: scale(0.2); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .block { position: absolute; box-sizing: border-box; border: 1px solid #ececec; }
  .purple { background: #7b4fbf; }
  .red { background: #d64545; }
  .blue { background: #3a6fd6; }
  .yellow { background: #e0b028; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the piece with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to drop faster, and press &lt;strong&gt;Delete&lt;/strong&gt; to rotate clockwise. Clear a full row to score and collect a piece of fruit on the left!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;arena&quot;&gt;
    &lt;div class=&quot;fruitbar&quot;&gt;
      &lt;div class=&quot;label&quot;&gt;Fruit&lt;/div&gt;
      &lt;div class=&quot;fruit-list&quot; id=&quot;fruitList&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var fruitList = document.getElementById(&#x27;fruitList&#x27;);

  // Base spawn weights (must sum to 1). These shift as lines are cleared.
  var W_PURPLE = 0.40, W_YELLOW = 0.20;
  var BASE_RED = 0.20, BASE_BLUE = 0.20;

  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;,&#x27;🍌&#x27;,&#x27;🍒&#x27;,&#x27;🥝&#x27;,&#x27;🍑&#x27;,&#x27;🍍&#x27;,&#x27;🥭&#x27;];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  var FULL = [{dx:0,dy:0},{dx:1,dy:0},{dx:0,dy:1},{dx:1,dy:1}];
  var RED  = [{dx:0,dy:0},{dx:1,dy:0},{dx:0,dy:1}];
  var BLUE = [{dx:0,dy:0},{dx:1,dy:1}];
  var YELLOW = [{dx:0,dy:0},{dx:1,dy:0}];

  function cloneOffsets(offs) {
    return offs.map(function (o) { return { dx: o.dx, dy: o.dy }; });
  }

  function makePiece() {
    // Clamp weights so they stay valid; red/blue split the remainder.
    var wp = Math.max(0, W_PURPLE);
    var wy = Math.max(0, Math.min(1, W_YELLOW));
    var remainder = Math.max(0, 1 - wp - wy);
    var wr = remainder / 2, wb = remainder / 2;
    var roll = Math.random();
    var color, offsets;
    if (roll &lt; wp) { color = &#x27;purple&#x27;; offsets = FULL; }
    else if (roll &lt; wp + wr) { color = &#x27;red&#x27;; offsets = RED; }
    else if (roll &lt; wp + wr + wb) { color = &#x27;blue&#x27;; offsets = BLUE; }
    else { color = &#x27;yellow&#x27;; offsets = YELLOW; }
    return { x: Math.floor((COLS - 2) / 2), y: 0, color: color, offsets: cloneOffsets(offsets) };
  }

  function pieceCells(p) {
    var cells = [];
    for (var i = 0; i &lt; p.offsets.length; i++) {
      cells.push({ x: p.x + p.offsets[i].dx, y: p.y + p.offsets[i].dy });
    }
    return cells;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function rotateOffsets(offs) {
    return offs.map(function (o) {
      return { dx: 1 - o.dy, dy: o.dx };
    });
  }

  function rotate() {
    if (!running || !piece) return;
    var rotated = rotateOffsets(piece.offsets);
    var test = { x: piece.x, y: piece.y, color: piece.color, offsets: rotated };
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      test.x = piece.x + kicks[k];
      if (!collides(test)) {
        piece.x = test.x;
        piece.offsets = rotated;
        paint();
        return;
      }
    }
  }

  function spawnPiece() {
    piece = makePiece();
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function addFruit() {
    var el = document.createElement(&#x27;span&#x27;);
    el.className = &#x27;fruit&#x27;;
    el.textContent = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    fruitList.appendChild(el);
  }

  function shiftWeights() {
    // Each cleared line: +20% relative yellow, -10% relative purple.
    W_YELLOW = Math.min(0.9, W_YELLOW * 1.20);
    W_PURPLE = Math.max(0, W_PURPLE * 0.90);
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared;
      scoreEl.textContent = score;
      for (var i = 0; i &lt; cleared; i++) { addFruit(); shiftWeights(); }
    }
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y, piece.color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block &#x27; + color;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { x: piece.x, y: piece.y + 1, color: piece.color, offsets: piece.offsets };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { x: piece.x + dx, y: piece.y, color: piece.color, offsets: piece.offsets };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    fruitList.innerHTML = &#x27;&#x27;;
    W_PURPLE = 0.40; W_YELLOW = 0.20;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
    else if (e.key === &#x27;Delete&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint: empty grid with a preview piece so shape is visible.
  newGrid();
  piece = { x: Math.floor((COLS - 2) / 2), y: 0, color: &#x27;yellow&#x27;, offsets: cloneOffsets(YELLOW) };
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
