<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Whack</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Neon Whack</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1a1a2e; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; background: linear-gradient(90deg,#ff6ec4,#7873f5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #b8b8d0; max-width: 600px; margin: 0; line-height: 1.4; }
  .hud { display: flex; gap: 24px; align-items: center; justify-content: center; }
  .score { font-size: 22px; color: #eee; margin: 0; font-weight: 600; }
  .combo { font-size: 22px; margin: 0; font-weight: 700; min-width: 120px; }
  .combo.hot { animation: comboPulse 0.4s ease; }
  @keyframes comboPulse { 0% { transform: scale(1);} 40% { transform: scale(1.35);} 100% { transform: scale(1);} }
  .board { position: relative; width: 620px; height: 430px; flex-shrink: 0; margin: 0; background: radial-gradient(circle at 50% 40%, #26264a, #16162b); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.5); }

  /* Thin guide line pointing to the next spawn location */
  .guideline { position: absolute; height: 2px; transform-origin: 0 50%; pointer-events: none; z-index: 0;
               background: linear-gradient(90deg, var(--c1), transparent); opacity: 0.55; }

  .mole { position: absolute; width: 68px; height: 68px; border-radius: 50%; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          animation: pop 0.28s cubic-bezier(.17,.89,.32,1.28); }
  @keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.15) rotate(8deg);} 100% { transform: scale(1) rotate(0);} }

  .mole .core { position: absolute; inset: 8px; border-radius: 50%;
                background: radial-gradient(circle at 35% 30%, #ffe3f4, var(--c1) 55%, var(--c2));
                box-shadow: 0 0 18px var(--c1); }
  .mole .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--c1); opacity: 0.7;
                animation: ringPulse 0.9s ease-in-out infinite; }
  @keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 0.6;} 50% { transform: scale(1.18); opacity: 0.15;} }
  .mole svg.timer { position: absolute; inset: -4px; width: 76px; height: 76px; transform: rotate(-90deg); pointer-events: none; }
  .mole .emoji { font-size: 30px; z-index: 2; pointer-events: none; user-select: none; }

  .mole.hit { animation: hitPop 0.22s ease forwards; }
  @keyframes hitPop { to { transform: scale(1.6); opacity: 0; } }

  .burst { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 5; }
  .floattext { position: absolute; font-weight: 800; font-size: 20px; pointer-events: none; z-index: 6;
               animation: floatUp 0.7s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  @keyframes floatUp { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-6px) scale(1.1);} 100% { transform: translateY(-40px) scale(1); opacity: 0; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Neon Whack&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;A thin fading line hints where the next orb will appear — click each orb before it shrinks away, and streaks build combo bonuses. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&amp;nbsp;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 430, MOLE_SIZE = 68;
  var SPAWN_MS = 900, MOLE_LIFE_MS = 1300;
  var score = 0, combo = 0, comboTimer = null;
  var intervalId = null;
  var moleTimeouts = [];
  var running = false;
  var lastCenter = null; // where the previous orb was, for drawing the guide line
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);

  var COLORS = [
    [&#x27;#ff6ec4&#x27;,&#x27;#7873f5&#x27;], [&#x27;#42e695&#x27;,&#x27;#3bb2b8&#x27;], [&#x27;#f9d423&#x27;,&#x27;#ff4e50&#x27;],
    [&#x27;#00c6ff&#x27;,&#x27;#0072ff&#x27;], [&#x27;#f857a6&#x27;,&#x27;#ff5858&#x27;], [&#x27;#a8ff78&#x27;,&#x27;#78ffd6&#x27;]
  ];
  var EMOJIS = [&#x27;⭐&#x27;,&#x27;💎&#x27;,&#x27;🔥&#x27;,&#x27;⚡&#x27;,&#x27;🌟&#x27;,&#x27;✨&#x27;];

  function updateCombo(add) {
    combo = add ? combo + 1 : 0;
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    if (combo &gt;= 2) {
      var msg = combo &gt;= 8 ? &#x27;🔥 UNSTOPPABLE x&#x27; + combo :
                combo &gt;= 5 ? &#x27;⚡ ON FIRE x&#x27; + combo :
                &#x27;COMBO x&#x27; + combo;
      comboEl.textContent = msg;
      var hue = Math.min(combo * 20, 120);
      comboEl.style.color = &#x27;hsl(&#x27; + (50 - hue) + &#x27;,100%,60%)&#x27;;
      comboEl.classList.remove(&#x27;hot&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;hot&#x27;);
    } else {
      comboEl.innerHTML = &#x27;&amp;nbsp;&#x27;;
    }
    if (combo &gt; 0) comboTimer = setTimeout(function(){ combo = 0; comboEl.innerHTML = &#x27;&amp;nbsp;&#x27;; }, 1800);
  }

  function floatText(x, y, txt, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;floattext&#x27;;
    f.textContent = txt;
    f.style.color = color;
    f.style.left = (x - 20) + &#x27;px&#x27;;
    f.style.top = (y - 10) + &#x27;px&#x27;;
    board.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 700);
  }

  function burst(x, y, color) {
    for (var i = 0; i &lt; 8; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;burst&#x27;;
      p.style.background = color;
      p.style.left = x + &#x27;px&#x27;;
      p.style.top = y + &#x27;px&#x27;;
      p.style.boxShadow = &#x27;0 0 8px &#x27; + color;
      board.appendChild(p);
      var ang = (Math.PI * 2 * i) / 8;
      var dist = 40 + Math.random() * 30;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      (function(el, dx, dy) {
        el.animate([
          { transform: &#x27;translate(0,0) scale(1)&#x27;, opacity: 1 },
          { transform: &#x27;translate(&#x27; + dx + &#x27;px,&#x27; + dy + &#x27;px) scale(0)&#x27;, opacity: 0 }
        ], { duration: 500, easing: &#x27;ease-out&#x27; });
      })(p, dx, dy);
      setTimeout((function(el){ return function(){ if (el.parentNode) el.parentNode.removeChild(el); }; })(p), 500);
    }
  }

  // Thin line from the previous orb&#x27;s center toward the new one, fading away.
  // It stops short of both circles so it never overlaps them.
  function drawGuide(fromX, fromY, toX, toY, color) {
    var dx = toX - fromX, dy = toY - fromY;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len &lt; 1) return;
    var gap = MOLE_SIZE / 2 + 6; // keep line clear of both orbs
    if (len &lt;= gap * 2) return;
    var ux = dx / len, uy = dy / len;
    var sx = fromX + ux * gap, sy = fromY + uy * gap;
    var drawLen = len - gap * 2;
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var line = document.createElement(&#x27;div&#x27;);
    line.className = &#x27;guideline&#x27;;
    line.style.setProperty(&#x27;--c1&#x27;, color);
    line.style.left = sx + &#x27;px&#x27;;
    line.style.top = sy + &#x27;px&#x27;;
    line.style.width = drawLen + &#x27;px&#x27;;
    line.style.transform = &#x27;rotate(&#x27; + ang + &#x27;deg)&#x27;;
    board.appendChild(line);
    line.animate([
      { opacity: 0.55 }, { opacity: 0 }
    ], { duration: 700, easing: &#x27;ease-out&#x27;, fill: &#x27;forwards&#x27; });
    setTimeout(function(){ if (line.parentNode) line.parentNode.removeChild(line); }, 720);
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    board.innerHTML = &#x27;&#x27;;
    lastCenter = null;
  }

  function spawnMole() {
    var idx = Math.floor(Math.random() * COLORS.length);
    var c1 = COLORS[idx][0], c2 = COLORS[idx][1];
    var lx = Math.random() * (BOARD_W - MOLE_SIZE);
    var ty = Math.random() * (BOARD_H - MOLE_SIZE);
    var cx = lx + MOLE_SIZE / 2, cy = ty + MOLE_SIZE / 2;

    // Draw the subtle guide line from the last orb&#x27;s location to this one.
    if (lastCenter) drawGuide(lastCenter.x, lastCenter.y, cx, cy, c1);
    lastCenter = { x: cx, y: cy };

    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27;;
    mole.style.setProperty(&#x27;--c1&#x27;, c1);
    mole.style.setProperty(&#x27;--c2&#x27;, c2);
    mole.style.left = lx + &#x27;px&#x27;;
    mole.style.top = ty + &#x27;px&#x27;;

    mole.innerHTML =
      &#x27;&lt;div class=&quot;ring&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;core&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;svg class=&quot;timer&quot; viewBox=&quot;0 0 76 76&quot;&gt;&lt;circle cx=&quot;38&quot; cy=&quot;38&quot; r=&quot;35&quot; fill=&quot;none&quot; stroke=&quot;&#x27; + c1 + &#x27;&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;220&quot; stroke-dashoffset=&quot;0&quot; opacity=&quot;0.9&quot;/&gt;&lt;/svg&gt;&#x27; +
      &#x27;&lt;div class=&quot;emoji&quot;&gt;&#x27; + EMOJIS[idx] + &#x27;&lt;/div&gt;&#x27;;

    var timerCircle = mole.querySelector(&#x27;circle&#x27;);
    timerCircle.animate([
      { strokeDashoffset: 0 }, { strokeDashoffset: 220 }
    ], { duration: MOLE_LIFE_MS, easing: &#x27;linear&#x27; });

    // Orb shrinks from full size down to nothing over its lifetime.
    mole.animate([
      { transform: &#x27;scale(1)&#x27; },
      { transform: &#x27;scale(0)&#x27; }
    ], { duration: MOLE_LIFE_MS, easing: &#x27;ease-in&#x27;, fill: &#x27;forwards&#x27;, delay: 300 });

    var hit = false;
    mole.addEventListener(&#x27;mousedown&#x27;, function () {
      if (hit || !running) return;
      hit = true;
      updateCombo(true);
      var pts = 1 + Math.floor(combo / 2);
      score += pts;
      scoreEl.textContent = score;
      burst(cx, cy, c1);
      floatText(cx, cy, &#x27;+&#x27; + pts, c1);
      mole.getAnimations().forEach(function(a){ a.cancel(); });
      mole.classList.add(&#x27;hit&#x27;);
      mole.style.pointerEvents = &#x27;none&#x27;;
      setTimeout(function () { if (mole.parentNode === board) board.removeChild(mole); }, 220);
    });

    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (mole.parentNode === board &amp;&amp; !hit) {
        board.removeChild(mole);
        updateCombo(false);
      }
    }, MOLE_LIFE_MS));
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; combo = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    comboEl.innerHTML = &#x27;&amp;nbsp;&#x27;;
    if (intervalId) clearInterval(intervalId);
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    clearAllMoles();
    spawnMole();
    intervalId = setInterval(spawnMole, SPAWN_MS);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    clearAllMoles();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
