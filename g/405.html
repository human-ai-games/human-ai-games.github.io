<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALL BREAKER</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>WALL BREAKER</b> &middot; Game 405 &middot; Amateur producer &middot; Basic game: Paddle and ball</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d1117; color: #e6edf3; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #9aa7b3; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 18px; color: #58a6ff; margin: 0; font-weight: 600; }
  .wrap { position: relative; width: 620px; height: 440px; }
  canvas { position: absolute; top:0; left:0; background: #161b22; border-radius: 10px; box-shadow: 0 0 24px rgba(88,166,255,0.15); }
  #tapTarget {
    position: absolute; width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe07a, #ff9f1c 70%, #d97706);
    color: #3a2600; font-weight: 800; font-size: 15px; border: none; cursor: pointer;
    box-shadow: 0 0 18px rgba(255,159,28,0.7); display: none; z-index: 5;
    transition: box-shadow 0.1s;
  }
  #tapTarget:active { box-shadow: 0 0 6px rgba(255,159,28,0.4); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;WALL BREAKER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot; id=&quot;instr&quot;&gt;Steer the ball with &amp;larr;, &amp;rarr;, &amp;uarr; and smash the sliding walls. Speed rises each round — then a Quick-Tap bonus appears: click the glowing button as fast as you can while it jumps around!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; · Lives: &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt; · Round: &lt;span id=&quot;round&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;button id=&quot;tapTarget&quot;&gt;TAP!&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;), roundEl = document.getElementById(&#x27;round&#x27;);
  var tapBtn = document.getElementById(&#x27;tapTarget&#x27;);

  var running = false, animId = null;
  var keys = {};
  var score = 0, lives = 3, round = 1;
  var wallsCleared = 0;

  // mode: &#x27;play&#x27; (wall breaker) or &#x27;tap&#x27; (quick-tap bonus)
  var mode = &#x27;play&#x27;;

  var ball = { x: W/2, y: H - 40, r: 11, vx: 0, vy: 0 };
  var walls = [];
  var BLOCKS = 10;
  var blockW = W / BLOCKS;

  // speed factors scale up with round
  function ballSpeed() { return 3.2 + (round-1)*0.9; }
  function wallSpeedBase() { return 0.25 + (round-1)*0.28; }
  function accel() { return 0.35 + (round-1)*0.05; }

  function makeWall(y, dir) {
    var segs = [];
    var gapCount = 2 + Math.floor(Math.random()*2);
    for (var i=0;i&lt;BLOCKS;i++) segs.push(true);
    var placed = 0;
    while (placed &lt; gapCount) {
      var idx = Math.floor(Math.random()*BLOCKS);
      if (segs[idx]) { segs[idx] = false; placed++; }
    }
    return {
      y: y, dir: dir,
      offset: Math.random()*W,
      speed: wallSpeedBase() + Math.random()*0.45,
      segs: segs
    };
  }

  function resetWalls() {
    walls = [];
    walls.push(makeWall(90, 1));
    walls.push(makeWall(180, -1));
    walls.push(makeWall(270, 1));
  }

  function resetBall() {
    ball.x = W/2; ball.y = H - 40;
    ball.vx = 0; ball.vy = -ballSpeed();
  }

  function startGame() {
    if (running) return;
    score = 0; lives = 3; round = 1; wallsCleared = 0;
    scoreEl.textContent = &#x27;0&#x27;; livesEl.textContent = &#x27;3&#x27;; roundEl.textContent = &#x27;1&#x27;;
    for (var k in keys) keys[k] = false;
    mode = &#x27;play&#x27;;
    tapBtn.style.display = &#x27;none&#x27;;
    resetWalls();
    resetBall();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    tapBtn.style.display = &#x27;none&#x27;;
  }

  // ===== Quick-Tap bonus =====
  var tapState = null;
  function startTapBonus() {
    mode = &#x27;tap&#x27;;
    tapState = { hits: 0, timeLeft: 8.0, lastT: performance.now() };
    moveTapButton();
    tapBtn.style.display = &#x27;block&#x27;;
  }
  function moveTapButton() {
    var pad = 10;
    var maxX = W - 74 - pad, maxY = H - 74 - pad;
    tapBtn.style.left = (pad + Math.random()*maxX) + &#x27;px&#x27;;
    tapBtn.style.top = (pad + Math.random()*maxY) + &#x27;px&#x27;;
  }
  tapBtn.addEventListener(&#x27;click&#x27;, function () {
    if (mode !== &#x27;tap&#x27; || !running) return;
    tapState.hits++;
    score += 2;
    scoreEl.textContent = score;
    moveTapButton();
  });

  function endTapBonus() {
    tapBtn.style.display = &#x27;none&#x27;;
    mode = &#x27;play&#x27;;
    round++;
    roundEl.textContent = round;
    wallsCleared = 0;
    resetWalls();
    resetBall();
  }

  function tick() {
    if (!running) return;

    if (mode === &#x27;tap&#x27;) {
      var now = performance.now();
      var dt = (now - tapState.lastT) / 1000;
      tapState.lastT = now;
      tapState.timeLeft -= dt;
      drawTap();
      if (tapState.timeLeft &lt;= 0) { endTapBonus(); }
      animId = requestAnimationFrame(tick);
      return;
    }

    // === wall breaker play ===
    var a = accel();
    if (keys[&#x27;ArrowLeft&#x27;]) ball.vx -= a;
    if (keys[&#x27;ArrowRight&#x27;]) ball.vx += a;
    if (keys[&#x27;ArrowUp&#x27;]) ball.vy -= a;
    if (!keys[&#x27;ArrowUp&#x27;]) ball.vy += 0.05 + (round-1)*0.02;

    var vmax = 4 + (round-1)*1.1;
    ball.vx = Math.max(-vmax, Math.min(vmax, ball.vx));
    ball.vy = Math.max(-vmax-0.5, Math.min(vmax+0.5, ball.vy));
    if (!keys[&#x27;ArrowLeft&#x27;] &amp;&amp; !keys[&#x27;ArrowRight&#x27;]) ball.vx *= 0.96;

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.r &lt; 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r &gt; W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r &lt; 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    if (ball.y - ball.r &gt; H) {
      lives--;
      livesEl.textContent = lives;
      if (lives &lt;= 0) { gameOver(); return; }
      resetBall();
    }

    for (var w=0; w&lt;walls.length; w++) {
      var wall = walls[w];
      wall.offset += wall.dir * wall.speed;
      if (wall.offset &gt; W) wall.offset -= W;
      if (wall.offset &lt; 0) wall.offset += W;

      if (ball.y - ball.r &lt; wall.y + 8 &amp;&amp; ball.y + ball.r &gt; wall.y - 8) {
        var relX = (ball.x - wall.offset + W*4) % W;
        var idx = Math.floor(relX / blockW);
        if (idx &gt;= 0 &amp;&amp; idx &lt; BLOCKS &amp;&amp; wall.segs[idx]) {
          wall.segs[idx] = false;
          score++;
          scoreEl.textContent = score;
          ball.vy = -ball.vy;
          if (ball.vy &gt; 0) ball.y = wall.y + 10 + ball.r;
          else ball.y = wall.y - 10 - ball.r;
        }
      }

      var alive = wall.segs.some(function(s){return s;});
      if (!alive) {
        walls[w] = makeWall(wall.y, -wall.dir);
        score += 3;
        scoreEl.textContent = score;
        wallsCleared++;
        // after clearing 3 walls -&gt; quick-tap bonus, then next round
        if (wallsCleared &gt;= 3) { startTapBonus(); }
      }
    }

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    for (var w=0; w&lt;walls.length; w++) {
      var wall = walls[w];
      for (var i=0;i&lt;BLOCKS;i++) {
        if (!wall.segs[i]) continue;
        var x = (wall.offset + i*blockW) % W;
        drawBlock(x, wall.y);
        if (x + blockW &gt; W) drawBlock(x - W, wall.y);
      }
    }
    ctx.save();
    ctx.shadowColor = &#x27;#58a6ff&#x27;;
    ctx.shadowBlur = 18;
    ctx.fillStyle = &#x27;#7cc4ff&#x27;;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawTap() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = &#x27;rgba(22,27,34,1)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillStyle = &#x27;#ffe07a&#x27;;
    ctx.font = &#x27;bold 26px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;QUICK-TAP BONUS!&#x27;, W/2, 46);
    ctx.fillStyle = &#x27;#e6edf3&#x27;;
    ctx.font = &#x27;bold 20px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Time: &#x27; + tapState.timeLeft.toFixed(1) + &#x27;s   Hits: &#x27; + tapState.hits, W/2, 78);
  }

  function drawBlock(x, y) {
    var pad = 2;
    var grad = ctx.createLinearGradient(0, y-8, 0, y+8);
    grad.addColorStop(0, &#x27;#ff7b72&#x27;);
    grad.addColorStop(1, &#x27;#d1493f&#x27;);
    ctx.fillStyle = grad;
    ctx.fillRect(x+pad, y-8, blockW-pad*2, 16);
  }

  function gameOver() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    tapBtn.style.display = &#x27;none&#x27;;
    draw();
    ctx.save();
    ctx.fillStyle = &#x27;rgba(13,17,23,0.8)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#e6edf3&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.font = &#x27;bold 34px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
    ctx.font = &#x27;20px system-ui, sans-serif&#x27;;
    ctx.fillStyle = &#x27;#58a6ff&#x27;;
    ctx.fillText(&#x27;Score: &#x27; + score + &#x27;  ·  Round &#x27; + round, W/2, H/2 + 28);
    ctx.restore();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowDown&#x27;) {
      keys[e.key] = true; e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowDown&#x27;) keys[e.key] = false;
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  resetWalls();
  resetBall();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
