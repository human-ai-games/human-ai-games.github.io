<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Snake</b> &middot; Game 468 &middot; Amateur producer &middot; Basic game: Snake</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }

  .diff button.active { border-color: #2e9e2e; background: #dff2df; color: #1c6d1c; font-weight: 600; }
  .field { position: relative; width: 600px; height: 420px; flex-shrink: 0; margin: 0; background: #cfe8c9; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.08); }
  .cell { position: absolute; box-sizing: border-box; }

  .head { border-radius: 8px; background: radial-gradient(circle at 35% 30%, #6cd36c, #2e9e2e); box-shadow: inset 0 1px 2px rgba(255,255,255,0.5); z-index: 5; }
  .eye { position: absolute; width: 4px; height: 4px; background: #111; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
  .tongue { position: absolute; background: #d3223a; z-index: 4; }
  .apple { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff7b7b, #cc1f1f); box-shadow: inset 0 1px 2px rgba(255,255,255,0.5); }

  .gold { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff4b0, #e0a800); box-shadow: 0 0 8px rgba(240,190,20,0.8), inset 0 1px 3px rgba(255,255,255,0.7); z-index: 3; }
  .goldleaf { position: absolute; width: 8px; height: 5px; background: #3a9e3a; border-radius: 0 60% 0 60%; top: -4px; left: 58%; transform: rotate(-30deg); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the snake with the arrow keys, eat red apples for 1 point and golden fruits for 5 (they vanish in ~10s). Pick a difficulty below, then use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button under the game.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;diff&quot; id=&quot;diff&quot;&gt;
      &lt;button data-mode=&quot;easy&quot;&gt;Easy&lt;/button&gt;
      &lt;button data-mode=&quot;normal&quot; class=&quot;active&quot;&gt;Normal&lt;/button&gt;
      &lt;button data-mode=&quot;hard&quot;&gt;Hard&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 21;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;

  // Difficulty settings.
  var DIFFS = {
    easy:   { tick: 200, goldLife: 12000 },
    normal: { tick: 150, goldLife: 10000 },
    hard:   { tick: 95,  goldLife: 7000 }
  };
  var mode = &#x27;normal&#x27;;
  var TICK_MS = DIFFS[mode].tick;
  var GOLD_LIFE_MS = DIFFS[mode].goldLife;

  var running = false, tickId = null, rafId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var diffBox = document.getElementById(&#x27;diff&#x27;);

  var gold = null;
  var nextGoldAt = 0;

  function clearField() { field.innerHTML = &#x27;&#x27;; }

  function drawApple(x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell apple&#x27;;
    el.style.left = (x * CELL + 2) + &#x27;px&#x27;;
    el.style.top = (y * CELL + 2) + &#x27;px&#x27;;
    el.style.width = (CELL - 4) + &#x27;px&#x27;;
    el.style.height = (CELL - 4) + &#x27;px&#x27;;
    var leaf = document.createElement(&#x27;div&#x27;);
    leaf.className = &#x27;leaf&#x27;;
    el.appendChild(leaf);
    field.appendChild(el);
  }

  function drawGold(g) {
    var span = CELL * 2;
    var px = g.x * CELL, py = g.y * CELL;
    var remain = Math.max(0, 1 - (Date.now() - g.spawnAt) / GOLD_LIFE_MS);

    var ring = document.createElement(&#x27;div&#x27;);
    ring.className = &#x27;cell ring&#x27;;
    ring.style.left = (px - 3) + &#x27;px&#x27;;
    ring.style.top = (py - 3) + &#x27;px&#x27;;
    ring.style.width = (span + 6) + &#x27;px&#x27;;
    ring.style.height = (span + 6) + &#x27;px&#x27;;
    var deg = Math.round(remain * 360);
    var col = remain &lt; 0.3 ? &#x27;#e04a2a&#x27; : &#x27;#2e9e2e&#x27;;
    ring.style.background = &#x27;conic-gradient(&#x27; + col + &#x27; &#x27; + deg + &#x27;deg, rgba(0,0,0,0.12) &#x27; + deg + &#x27;deg)&#x27;;
    field.appendChild(ring);

    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell gold&#x27;;
    el.style.left = (px + 3) + &#x27;px&#x27;;
    el.style.top = (py + 3) + &#x27;px&#x27;;
    el.style.width = (span - 6) + &#x27;px&#x27;;
    el.style.height = (span - 6) + &#x27;px&#x27;;
    var leaf = document.createElement(&#x27;div&#x27;);
    leaf.className = &#x27;goldleaf&#x27;;
    el.appendChild(leaf);
    field.appendChild(el);
  }

  function drawBody(x, y, t) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell seg&#x27;;
    el.style.left = (x * CELL + 1) + &#x27;px&#x27;;
    el.style.top = (y * CELL + 1) + &#x27;px&#x27;;
    var size = CELL - 2 - Math.round(t * 5);
    var off = ((CELL - 2) - size) / 2;
    el.style.width = size + &#x27;px&#x27;;
    el.style.height = size + &#x27;px&#x27;;
    el.style.marginLeft = off + &#x27;px&#x27;;
    el.style.marginTop = off + &#x27;px&#x27;;
    var g = Math.round(158 + t * 55);
    el.style.background = &#x27;linear-gradient(135deg, rgb(&#x27; + Math.round(60 + t*40) + &#x27;,&#x27; + g + &#x27;,&#x27; + Math.round(46 + t*40) + &#x27;), rgb(&#x27; + Math.round(30 + t*40) + &#x27;,&#x27; + Math.round(120 + t*55) + &#x27;,&#x27; + Math.round(30 + t*40) + &#x27;))&#x27;;
    field.appendChild(el);
  }

  function drawHead(x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell head&#x27;;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;

    var e1 = document.createElement(&#x27;div&#x27;), e2 = document.createElement(&#x27;div&#x27;);
    e1.className = &#x27;eye&#x27;; e2.className = &#x27;eye&#x27;;
    if (dir.x === 1) { e1.style.left=&#x27;12px&#x27;; e1.style.top=&#x27;3px&#x27;; e2.style.left=&#x27;12px&#x27;; e2.style.top=&#x27;11px&#x27;; }
    else if (dir.x === -1) { e1.style.left=&#x27;2px&#x27;; e1.style.top=&#x27;3px&#x27;; e2.style.left=&#x27;2px&#x27;; e2.style.top=&#x27;11px&#x27;; }
    else if (dir.y === -1) { e1.style.left=&#x27;3px&#x27;; e1.style.top=&#x27;2px&#x27;; e2.style.left=&#x27;11px&#x27;; e2.style.top=&#x27;2px&#x27;; }
    else { e1.style.left=&#x27;3px&#x27;; e1.style.top=&#x27;12px&#x27;; e2.style.left=&#x27;11px&#x27;; e2.style.top=&#x27;12px&#x27;; }
    el.appendChild(e1); el.appendChild(e2);
    field.appendChild(el);

    var t = document.createElement(&#x27;div&#x27;);
    t.className = &#x27;cell tongue&#x27;;
    var bx = x * CELL, by = y * CELL;
    if (dir.x === 1) { t.style.left=(bx+CELL)+&#x27;px&#x27;; t.style.top=(by+CELL/2-1)+&#x27;px&#x27;; t.style.width=&#x27;7px&#x27;; t.style.height=&#x27;2px&#x27;; }
    else if (dir.x === -1) { t.style.left=(bx-7)+&#x27;px&#x27;; t.style.top=(by+CELL/2-1)+&#x27;px&#x27;; t.style.width=&#x27;7px&#x27;; t.style.height=&#x27;2px&#x27;; }
    else if (dir.y === -1) { t.style.left=(bx+CELL/2-1)+&#x27;px&#x27;; t.style.top=(by-7)+&#x27;px&#x27;; t.style.width=&#x27;2px&#x27;; t.style.height=&#x27;7px&#x27;; }
    else { t.style.left=(bx+CELL/2-1)+&#x27;px&#x27;; t.style.top=(by+CELL)+&#x27;px&#x27;; t.style.width=&#x27;2px&#x27;; t.style.height=&#x27;7px&#x27;; }
    field.appendChild(t);
  }

  function paint() {
    clearField();
    drawApple(food.x, food.y);
    if (gold) drawGold(gold);
    for (var i = snake.length - 1; i &gt;= 1; i--) {
      var t = snake.length &gt; 1 ? i / (snake.length - 1) : 0;
      drawBody(snake[i].x, snake[i].y, t);
    }
    drawHead(snake[0].x, snake[0].y);
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function goldOccupies(x, y) {
    if (!gold) return false;
    return (x === gold.x || x === gold.x + 1) &amp;&amp; (y === gold.y || y === gold.y + 1);
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y) &amp;&amp; !goldOccupies(x, y)) { food = { x: x, y: y }; return; }
    }
  }

  function spawnGold() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * (COLS - 1));
      var y = Math.floor(Math.random() * (ROWS - 1));
      var clear = true;
      for (var dx = 0; dx &lt; 2 &amp;&amp; clear; dx++) {
        for (var dy = 0; dy &lt; 2 &amp;&amp; clear; dy++) {
          if (cellOccupied(x + dx, y + dy)) clear = false;
          if (food.x === x + dx &amp;&amp; food.y === y + dy) clear = false;
        }
      }
      if (clear) { gold = { x: x, y: y, spawnAt: Date.now() }; return; }
    }
  }

  function scheduleNextGold() {
    nextGoldAt = Date.now() + 6000 + Math.random() * 8000;
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }

    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var ateGold = goldOccupies(nx, ny);
    var grow = ateFood || ateGold;
    var body = grow ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });

    if (ateGold) {
      score += 5;
      scoreEl.textContent = score;
      gold = null;
      scheduleNextGold();
    }
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    }
    if (!grow) snake.pop();

    if (gold &amp;&amp; Date.now() - gold.spawnAt &gt; GOLD_LIFE_MS) {
      gold = null;
      scheduleNextGold();
    }
    if (!gold &amp;&amp; Date.now() &gt;= nextGoldAt) {
      spawnGold();
    }

    paint();
  }

  function animate() {
    if (!running) return;
    if (gold) {
      if (Date.now() - gold.spawnAt &gt; GOLD_LIFE_MS) {
        gold = null;
        scheduleNextGold();
      }
      paint();
    }
    rafId = requestAnimationFrame(animate);
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function applyMode(m) {
    mode = m;
    TICK_MS = DIFFS[m].tick;
    GOLD_LIFE_MS = DIFFS[m].goldLife;
    var btns = diffBox.querySelectorAll(&#x27;button&#x27;);
    for (var i = 0; i &lt; btns.length; i++) {
      btns[i].classList.toggle(&#x27;active&#x27;, btns[i].getAttribute(&#x27;data-mode&#x27;) === m);
    }
  }

  diffBox.addEventListener(&#x27;click&#x27;, function (e) {
    var b = e.target.closest(&#x27;button&#x27;);
    if (!b) return;
    applyMode(b.getAttribute(&#x27;data-mode&#x27;));
    // If a game is already running, apply the new tick speed immediately.
    if (running) {
      if (tickId) clearInterval(tickId);
      tickId = setInterval(tick, TICK_MS);
    }
  });

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    initSnake();
    gold = null;
    placeFood();
    nextGoldAt = Date.now() + 3000;
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(animate);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initSnake();
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
