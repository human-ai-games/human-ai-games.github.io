<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚀 Galaxy Drop</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🚀 Galaxy Drop</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05050f; color: #dfe6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; background: radial-gradient(circle at 50% 0%, #14143a, #05050f 70%); height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 0 12px #6a7bff; }
  .instructions { font-size: 16px; color: #9fb0e0; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .warning { font-size: 13px; color: #ffd27a; background: rgba(120,80,0,0.35); border: 1px solid rgba(255,180,60,0.5); border-radius: 6px; padding: 4px 10px; margin: 0; max-width: 560px; text-align: center; line-height: 1.3; }
  .stats { display: flex; gap: 20px; font-size: 18px; color: #b8c4ff; margin: 0; }
  .stats span { color: #fff; text-shadow: 0 0 8px #6a7bff; }
  .controls { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #9fb0e0; margin: 0; }
  .controls button { background: #23264d; color: #dfe6ff; border: 1px solid #4a4f80; border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 14px; }
  .controls button:hover { background: #33375f; }
  .controls input[type=range] { width: 110px; accent-color: #6a7bff; cursor: pointer; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 0 24px rgba(90,110,255,0.4), inset 0 0 0 2px rgba(150,170,255,0.4); }
  #bg { position: absolute; inset: 0; z-index: 0; }
  #playfield { position: absolute; inset: 0; z-index: 1; }
  .block { position: absolute; box-sizing: border-box; border-radius: 3px; border: 1px solid rgba(255,255,255,0.35); }
  .zone-name { font-size: 14px; color: #8fa0d8; margin: 0; letter-spacing: 1px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;&amp;#128640; Galaxy Drop&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and speed the drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Clear full rows to warp deeper into the galaxy — it gets faster as you go!&lt;/p&gt;
  &lt;p class=&quot;warning&quot;&gt;&amp;#9888; Photosensitivity warning: this game briefly flashes the screen when you advance to a new level.&lt;/p&gt;
  &lt;div class=&quot;stats&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Level: &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Lines: &lt;span id=&quot;lines&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button id=&quot;muteBtn&quot; title=&quot;Mute / unmute&quot;&gt;&amp;#128266;&lt;/button&gt;
    &lt;label for=&quot;vol&quot;&gt;Music&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;vol&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;55&quot;&gt;
  &lt;/div&gt;
  &lt;p class=&quot;zone-name&quot; id=&quot;zone&quot;&gt;Sector: Home Orbit&lt;/p&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;bg&quot; width=&quot;240&quot; height=&quot;384&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;playfield&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0, lines = 0, level = 1;
  var field = document.getElementById(&#x27;field&#x27;);
  var playfield = document.getElementById(&#x27;playfield&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var linesEl = document.getElementById(&#x27;lines&#x27;);
  var zoneEl = document.getElementById(&#x27;zone&#x27;);
  var volSlider = document.getElementById(&#x27;vol&#x27;);
  var muteBtn = document.getElementById(&#x27;muteBtn&#x27;);

  var SHAPES = {
    I: { color: &#x27;#33d6e6&#x27;, rots: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]]
    ]},
    O: { color: &#x27;#f7d038&#x27;, rots: [
      [[1,0],[2,0],[1,1],[2,1]]
    ]},
    T: { color: &#x27;#c14fe0&#x27;, rots: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]]
    ]},
    S: { color: &#x27;#4ce660&#x27;, rots: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]]
    ]},
    Z: { color: &#x27;#f0553a&#x27;, rots: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]]
    ]},
    J: { color: &#x27;#3a6ff0&#x27;, rots: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]]
    ]},
    L: { color: &#x27;#f5943a&#x27;, rots: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]]
    ]}
  };
  var KEYS = Object.keys(SHAPES);

  var ZONES = [
    { name: &#x27;Home Orbit&#x27;,    top: &#x27;#0a1030&#x27;, bot: &#x27;#05050f&#x27;, neb: &#x27;rgba(80,110,255,0.35)&#x27;, star: &#x27;#bcd0ff&#x27; },
    { name: &#x27;Blue Drift&#x27;,    top: &#x27;#101a4a&#x27;, bot: &#x27;#050818&#x27;, neb: &#x27;rgba(60,150,255,0.4)&#x27;,  star: &#x27;#cfe4ff&#x27; },
    { name: &#x27;Violet Reach&#x27;,  top: &#x27;#2a1050&#x27;, bot: &#x27;#0a0518&#x27;, neb: &#x27;rgba(160,80,255,0.4)&#x27;,  star: &#x27;#e8d0ff&#x27; },
    { name: &#x27;Crimson Nebula&#x27;,top: &#x27;#3a0e28&#x27;, bot: &#x27;#150410&#x27;, neb: &#x27;rgba(255,80,120,0.42)&#x27;, star: &#x27;#ffd6e0&#x27; },
    { name: &#x27;Ember Cluster&#x27;, top: &#x27;#3a1e08&#x27;, bot: &#x27;#150a02&#x27;, neb: &#x27;rgba(255,150,50,0.42)&#x27;, star: &#x27;#ffe6c0&#x27; },
    { name: &#x27;Emerald Void&#x27;,  top: &#x27;#083020&#x27;, bot: &#x27;#02100a&#x27;, neb: &#x27;rgba(50,255,160,0.4)&#x27;,  star: &#x27;#c8ffe4&#x27; },
    { name: &#x27;Deep Singularity&#x27;, top: &#x27;#000000&#x27;, bot: &#x27;#0a0016&#x27;, neb: &#x27;rgba(200,120,255,0.5)&#x27;, star: &#x27;#ffffff&#x27; }
  ];
  function currentZone() { return ZONES[Math.min(level - 1, ZONES.length - 1)]; }

  /* ---------- Galaxy background canvas ---------- */
  var bg = document.getElementById(&#x27;bg&#x27;);
  var bctx = bg.getContext(&#x27;2d&#x27;);
  var stars = [];
  var bgRAF = null;
  var warpFlash = 0;

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 70; i++) {
      stars.push({
        x: Math.random() * 240,
        y: Math.random() * 384,
        r: Math.random() * 1.6 + 0.4,
        sp: Math.random() * 0.4 + 0.15,
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function drawBg() {
    var z = currentZone();
    var g = bctx.createLinearGradient(0, 0, 0, 384);
    g.addColorStop(0, z.top);
    g.addColorStop(1, z.bot);
    bctx.fillStyle = g;
    bctx.fillRect(0, 0, 240, 384);

    var t = Date.now() * 0.0002;
    for (var n = 0; n &lt; 3; n++) {
      var nx = 120 + Math.sin(t + n * 2) * 70;
      var ny = 120 + n * 90 + Math.cos(t * 1.3 + n) * 40;
      var rg = bctx.createRadialGradient(nx, ny, 0, nx, ny, 90);
      rg.addColorStop(0, z.neb);
      rg.addColorStop(1, &#x27;rgba(0,0,0,0)&#x27;);
      bctx.fillStyle = rg;
      bctx.fillRect(0, 0, 240, 384);
    }

    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i];
      s.y += s.sp * (1 + (level - 1) * 0.25);
      s.tw += 0.05;
      if (s.y &gt; 384) { s.y = -2; s.x = Math.random() * 240; }
      var alpha = 0.5 + 0.5 * Math.sin(s.tw);
      bctx.globalAlpha = alpha;
      bctx.fillStyle = z.star;
      bctx.beginPath();
      bctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bctx.fill();
    }
    bctx.globalAlpha = 1;

    // Softer, slower level-up glow (reduced peak brightness for photosensitivity).
    if (warpFlash &gt; 0) {
      bctx.fillStyle = &#x27;rgba(150,170,255,&#x27; + (warpFlash * 0.18) + &#x27;)&#x27;;
      bctx.fillRect(0, 0, 240, 384);
      warpFlash -= 0.02;
    }

    bgRAF = requestAnimationFrame(drawBg);
  }

  function startBg() {
    if (bgRAF) cancelAnimationFrame(bgRAF);
    drawBg();
  }
  function stopBg() {
    if (bgRAF) { cancelAnimationFrame(bgRAF); bgRAF = null; }
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var rot = SHAPES[p.type].rots[p.rot % SHAPES[p.type].rots.length];
    var out = [];
    for (var i = 0; i &lt; rot.length; i++) {
      out.push({ x: p.x + rot[i][0], y: p.y + rot[i][1] });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function randType() { return KEYS[Math.floor(Math.random() * KEYS.length)]; }

  function spawnPiece() {
    piece = { type: randType(), rot: 0, x: Math.floor((COLS - 4) / 2) + 1, y: 0 };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    var color = SHAPES[piece.type].color;
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = color;
    }
    piece = null;
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared * cleared * 10;
      lines += cleared;
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      var newLevel = Math.floor(lines / 5) + 1;
      if (newLevel !== level) {
        level = newLevel;
        levelEl.textContent = level;
        zoneEl.textContent = &#x27;Sector: &#x27; + currentZone().name;
        warpFlash = 1;
        warpChime();
        restartDropTimer();
      }
      if (cleared &gt;= 2) chime();
    }
  }

  function dropInterval() {
    return Math.max(90, 520 - (level - 1) * 45);
  }

  function restartDropTimer() {
    if (dropId) clearInterval(dropId);
    if (running) dropId = setInterval(stepDown, dropInterval());
  }

  function paint() {
    playfield.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      var color = SHAPES[piece.type].color;
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y, color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    el.style.boxShadow = &#x27;0 0 8px &#x27; + color;
    playfield.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, rot: piece.rot, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var nRots = SHAPES[piece.type].rots.length;
    var next = { type: piece.type, rot: (piece.rot + 1) % nRots, x: piece.x, y: piece.y };
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var test = { type: next.type, rot: next.rot, x: next.x + kicks[k], y: next.y };
      if (!collides(test)) { piece = test; paint(); return; }
    }
  }

  /* ---------- Audio: soft sci-fi synth loop + volume control ---------- */
  var audioCtx = null, musicTimer = null, musicStep = 0, masterGain = null, reverbGain = null;
  var musicVolume = 0.55;   // 0..1, controlled by slider
  var muted = false;
  var MELODY = [
    440.00, 523.25, 659.25, 587.33,
    523.25, 659.25, 783.99, 659.25,
    587.33, 523.25, 440.00, 493.88,
    523.25, 440.00, 392.00, 440.00
  ];
  var BASS = [110.00, 110.00, 98.00, 98.00, 130.81, 130.81, 123.47, 123.47,
              110.00, 110.00, 87.31, 87.31, 98.00, 98.00, 110.00, 110.00];

  function effectiveVolume() { return muted ? 0 : musicVolume; }

  function applyVolume() {
    if (masterGain) masterGain.gain.value = effectiveVolume() * 0.75;
  }

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = effectiveVolume() * 0.75;
        masterGain.connect(audioCtx.destination);
        var delay = audioCtx.createDelay();
        delay.delayTime.value = 0.33;
        reverbGain = audioCtx.createGain();
        reverbGain.gain.value = 0.32;
        delay.connect(reverbGain);
        reverbGain.connect(delay);
        reverbGain.connect(audioCtx.destination);
        masterGain._delay = delay;
      } catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
  }

  function playNote(freq, dur, type, vol, echo) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.detune.value = (Math.random() - 0.5) * 6;
    var now = audioCtx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(masterGain);
    if (echo &amp;&amp; masterGain._delay) g.connect(masterGain._delay);
    osc.start(now); osc.stop(now + dur + 0.05);
  }

  function musicTick() {
    if (!audioCtx) return;
    playNote(MELODY[musicStep % MELODY.length], 0.55, &#x27;sine&#x27;, 0.16, true);
    if (musicStep % 2 === 0) playNote(BASS[musicStep % BASS.length], 0.7, &#x27;triangle&#x27;, 0.12, false);
    if (musicStep % 4 === 0) playNote(MELODY[musicStep % MELODY.length] * 2, 0.4, &#x27;sine&#x27;, 0.05, true);
    musicStep++;
  }

  function startMusic() {
    ensureAudio();
    if (!audioCtx) return;
    applyVolume();
    if (musicTimer) clearInterval(musicTimer);
    musicStep = 0;
    musicTick();
    musicTimer = setInterval(musicTick, 360);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }
  function chime() {
    if (!audioCtx) return;
    playNote(783.99, 0.25, &#x27;sine&#x27;, 0.18, true);
    setTimeout(function(){ playNote(1046.50, 0.3, &#x27;sine&#x27;, 0.16, true); }, 100);
  }
  function warpChime() {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = &#x27;sawtooth&#x27;;
    var now = audioCtx.currentTime;
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.12, now + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    osc.connect(g); g.connect(masterGain);
    if (masterGain._delay) g.connect(masterGain._delay);
    osc.start(now); osc.stop(now + 0.65);
  }

  /* ---------- Volume UI ---------- */
  function updateMuteIcon() {
    muteBtn.innerHTML = (muted || musicVolume === 0) ? &#x27;&amp;#128263;&#x27; : &#x27;&amp;#128266;&#x27;;
  }
  volSlider.addEventListener(&#x27;input&#x27;, function () {
    musicVolume = parseInt(volSlider.value, 10) / 100;
    if (musicVolume &gt; 0) muted = false;
    applyVolume();
    updateMuteIcon();
  });
  muteBtn.addEventListener(&#x27;click&#x27;, function () {
    muted = !muted;
    applyVolume();
    updateMuteIcon();
  });
  updateMuteIcon();

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    stopMusic();
  }

  function startGame() {
    if (running) return;
    score = 0; lines = 0; level = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    levelEl.textContent = &#x27;1&#x27;;
    linesEl.textContent = &#x27;0&#x27;;
    zoneEl.textContent = &#x27;Sector: &#x27; + currentZone().name;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    initStars();
    startBg();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropInterval());
    startMusic();
  }
  function stopGame() {
    if (!running) return;
    running = false;
