&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;★ SNAKE ARCADE ★&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Arrow keys steer you; eat apples to grow and dodge walls and the red enemy snakes. Grab power-ups: 🛡️ shield (pass through anything), ⭐ bonus points, ⏱️ slow-motion — use Start/Restart below.&lt;/p&gt;

&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var BASE_TICK = 150;
  var running = false, tickId = null, tickCount = 0;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var score = 0;
  var enemies = [];         // each: {body:[{x,y}...]}
  var powerup = null;       // {x,y,type}
  var shieldTicks = 0;      // &gt;0 = shield active
  var slowTicks = 0;        // &gt;0 = slow-mo active
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var shieldBadge = document.getElementById(&#x27;shieldBadge&#x27;);
  var slowBadge = document.getElementById(&#x27;slowBadge&#x27;);

  var walls = [
    {x:6,y:5},{x:7,y:5},{x:8,y:5},{x:9,y:5},
    {x:22,y:8},{x:22,y:9},{x:22,y:10},{x:22,y:11},
    {x:8,y:16},{x:9,y:16},{x:8,y:17},{x:9,y:17},
    {x:18,y:17},{x:19,y:17},{x:20,y:17},{x:21,y:17},
    {x:15,y:2},{x:15,y:3},{x:15,y:4}
  ];

  var tunnels = [
    { a:{x:2,y:2}, b:{x:27,y:19}, color:&#x27;#c14bff&#x27; },
    { a:{x:27,y:2}, b:{x:2,y:19}, color:&#x27;#2affe0&#x27; }
  ];

  var POWER_ICON = { shield:&#x27;🛡️&#x27;, star:&#x27;⭐&#x27;, slow:&#x27;⏱️&#x27; };

  function clearField() { field.innerHTML = &#x27;&#x27;; }

  function drawCell(cls, x, y, color, text) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    if (color) { el.style.background = color; el.style.color = color; }
    if (text) el.textContent = text;
    field.appendChild(el);
  }

  function paint() {
    clearField();
    for (var w = 0; w &lt; walls.length; w++) drawCell(&#x27;wall&#x27;, walls[w].x, walls[w].y);
    for (var t = 0; t &lt; tunnels.length; t++) {
      drawCell(&#x27;tunnel&#x27;, tunnels[t].a.x, tunnels[t].a.y, tunnels[t].color);
      drawCell(&#x27;tunnel&#x27;, tunnels[t].b.x, tunnels[t].b.y, tunnels[t].color);
    }
    if (powerup) drawCell(&#x27;power pw-&#x27; + powerup.type, powerup.x, powerup.y, null, POWER_ICON[powerup.type]);
    drawCell(&#x27;food&#x27;, food.x, food.y);
    for (var e = 0; e &lt; enemies.length; e++) {
      var b = enemies[e].body;
      for (var i = 0; i &lt; b.length; i++) drawCell(i === 0 ? &#x27;enemyhead&#x27; : &#x27;enemy&#x27;, b[i].x, b[i].y);
    }
    for (var s = 0; s &lt; snake.length; s++) {
      var cls = s === 0 ? (&#x27;head&#x27; + (shieldTicks &gt; 0 ? &#x27; shielded&#x27; : &#x27;&#x27;)) : &#x27;snake&#x27;;
      drawCell(cls, snake[s].x, snake[s].y);
    }
  }

  function isWall(x, y) {
    for (var i = 0; i &lt; walls.length; i++) if (walls[i].x === x &amp;&amp; walls[i].y === y) return true;
    return false;
  }
  function isTunnel(x, y) {
    for (var t = 0; t &lt; tunnels.length; t++) {
      if (tunnels[t].a.x === x &amp;&amp; tunnels[t].a.y === y) return tunnels[t].b;
      if (tunnels[t].b.x === x &amp;&amp; tunnels[t].b.y === y) return tunnels[t].a;
    }
    return null;
  }
  function inSnake(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }
  function inAnyEnemy(x, y) {
    for (var e = 0; e &lt; enemies.length; e++) {
      var b = enemies[e].body;
      for (var i = 0; i &lt; b.length; i++) if (b[i].x === x &amp;&amp; b[i].y === y) return true;
    }
    return false;
  }
  function cellOccupied(x, y) {
    if (inSnake(x, y)) return true;
    if (inAnyEnemy(x, y)) return true;
    if (isWall(x, y)) return true;
    if (isTunnel(x, y)) return true;
    if (powerup &amp;&amp; powerup.x === x &amp;&amp; powerup.y === y) return true;
    if (food.x === x &amp;&amp; food.y === y) return true;
    return false;
  }

  function randFreeCell() {
    for (var tries = 0; tries &lt; 400; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) return { x: x, y: y };
    }
    return null;
  }

  function placeFood() { var c = randFreeCell(); if (c) food = c; }

  function spawnPowerup() {
    var c = randFreeCell();
    if (!c) return;
    var types = [&#x27;shield&#x27;, &#x27;star&#x27;, &#x27;slow&#x27;];
    c.type = types[Math.floor(Math.random() * types.length)];
    c.life = 60; // ticks before it disappears
    powerup = c;
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function initEnemies() {
    enemies = [
      { body: [ {x:26,y:4}, {x:27,y:4}, {x:28,y:4} ] },
      { body: [ {x:26,y:18}, {x:27,y:18}, {x:28,y:18} ] }
    ];
  }

  // Enemy chooses a step toward the player, avoiding walls/itself when possible.
  function moveEnemy(en) {
    var head = en.body[0];
    var target = snake[0];
    var opts = [
      { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }
    ];
    // Sort by how much each option reduces distance to player.
    opts.sort(function(a, b) {
      var da = Math.abs(head.x + a.x - target.x) + Math.abs(head.y + a.y - target.y);
      var db = Math.abs(head.x + b.x - target.x) + Math.abs(head.y + b.y - target.y);
      return da - db;
    });
    // occasionally act randomly so it isn&#x27;t perfect
    if (Math.random() &lt; 0.2) opts.sort(function() { return Math.random() - 0.5; });
    for (var i = 0; i &lt; opts.length; i++) {
      var nx = head.x + opts[i].x, ny = head.y + opts[i].y;
      if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) continue;
      if (isWall(nx, ny)) continue;
      // avoid stepping on its own body
      var selfHit = false;
      for (var j = 0; j &lt; en.body.length - 1; j++) if (en.body[j].x === nx &amp;&amp; en.body[j].y === ny) { selfHit = true; break; }
      if (selfHit) continue;
      en.body.unshift({ x: nx, y: ny });
      en.body.pop();
      return;
    }
    // stuck: stay
  }

  function collidesWithEnemy(x, y) {
    return inAnyEnemy(x, y);
  }

  function applyPowerup(type) {
    if (type === &#x27;shield&#x27;) { shieldTicks = 45; }
    else if (type === &#x27;star&#x27;) { score += 5; scoreEl.textContent = score; }
    else if (type === &#x27;slow&#x27;) { slowTicks = 45; }
    updateBadges();
    restartTimer();
  }

  function updateBadges() {
    shieldBadge.classList.toggle(&#x27;on&#x27;, shieldTicks &gt; 0);
    slowBadge.classList.toggle(&#x27;on&#x27;, slowTicks &gt; 0);
  }

  function currentInterval() {
    return slowTicks &gt; 0 ? BASE_TICK * 1.8 : BASE_TICK;
  }
  function restartTimer() {
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, currentInterval());
  }

  function tick() {
    if (!running) return;
    tickCount++;

    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;

    var shielded = shieldTicks &gt; 0;

    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    if (isWall(nx, ny) &amp;&amp; !shielded) { endGame(); return; }
    // if shielded and moving into a wall, just skip past it into the next open logic (treat wall as passable)
    var exit = isTunnel(nx, ny);
    if (exit) { nx = exit.x; ny = exit.y; }

    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    // Enemy collision (unless shielded)
    if (!shielded &amp;&amp; collidesWithEnemy(nx, ny)) { endGame(); return; }

    snake.unshift({ x: nx, y: ny });

    var gotPower = powerup &amp;&amp; powerup.x === nx &amp;&amp; powerup.y === ny;
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    if (gotPower) { var pt = powerup.type; powerup = null; applyPowerup(pt); }

    // Move enemies (they move a bit slower — every other tick)
    if (tickCount % 2 === 0) {
      for (var e = 0; e &lt; enemies.length; e++) moveEnemy(enemies[e]);
      // check head-on collision after enemies moved
      if (!shielded &amp;&amp; collidesWithEnemy(snake[0].x, snake[0].y)) { endGame(); return; }
    }

    // Powerup lifecycle
    if (powerup) { powerup.life--; if (powerup.life &lt;= 0) powerup = null; }
    else if (tickCount % 40 === 0) { spawnPowerup(); }

    // Timers
    if (shieldTicks &gt; 0) { shieldTicks--; if (shieldTicks === 0) updateBadges(); }
    if (slowTicks &gt; 0) { slowTicks--; if (slowTicks === 0) { updateBadges(); restartTimer(); } }

    paint();
  }

  function endGame() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    tickCount = 0;
    shieldTicks = 0;
    slowTicks = 0;
    powerup = null;
    updateBadges();
    initSnake();
    initEnemies();
    placeFood();
    paint();
    running = true;
    restartTimer();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initSnake();
  initEnemies();
  paint();
&lt;/script&gt;
