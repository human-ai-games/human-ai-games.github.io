<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross the lanes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Cross the lanes</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; gap: 20px; font-size: 20px; color: #555; margin: 0; }
  .lives { font-size: 22px; letter-spacing: 2px; }
  .goals { display: flex; align-items: center; gap: 12px; }
  .goals svg { display: block; transition: transform 0.25s; }
  .goal-frog.filled { animation: pop 0.4s; }
  @keyframes pop { 0%{transform:scale(1);} 45%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; background: #7cae54; border-radius: 8px; overflow: hidden; }
  .road { position: absolute; left: 0; right: 0; background: #3a3d42; }
  .road-edge { position: absolute; left: 0; right: 0; height: 4px; background: #f2f2f2; }
  .hero { position: absolute; }
  .car { position: absolute; }
  .dash-lane { position: absolute; left: 0; right: 0; height: 4px; }
  .dash { position: absolute; top: 0; width: 28px; height: 4px; background: #f6c945; border-radius: 2px; }
  .hero.hit { animation: flash 0.6s linear; }
  @keyframes flash { 0%,100%{opacity:1;} 25%,75%{opacity:0.25;} }
  .banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .banner .txt { font-size: 46px; font-weight: 800; letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 12px #ffe14d, 0 0 24px #ff9d00, 0 3px 4px rgba(0,0,0,0.4);
    animation: nextlvl 1.4s ease-out forwards; }
  @keyframes nextlvl {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    25% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    45% { transform: scale(1) rotate(0deg); }
    80% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.1); opacity: 0; }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cross the lanes&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the arrow keys, dodging the cars, and reach the top row three times to complete a level. Getting hit costs a life — lose all 3 and the round ends.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Level: &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;goals&quot; id=&quot;goals&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var GOALS_PER_LEVEL = 3;
  var running = false, animId = null, gameOver = false, transitioning = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var level = 1;
  var goalsDone = 0;
  var lives = 3;
  var invuln = false;
  var speedMult = 1;
  var SPEED_STEP = 0.12;
  var SPEED_MAX = 2.6;
  var carColors = [&#x27;#e63946&#x27;, &#x27;#f4a261&#x27;, &#x27;#2a9d8f&#x27;, &#x27;#457b9d&#x27;, &#x27;#e76f51&#x27;, &#x27;#9b5de5&#x27;, &#x27;#f7b801&#x27;];
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var goalsEl = document.getElementById(&#x27;goals&#x27;);

  function goalFrogSVG(filled) {
    var body = filled ? &#x27;#37c24a&#x27; : &#x27;#b9bcc0&#x27;;
    var belly = filled ? &#x27;#bff5c2&#x27; : &#x27;#d6d8db&#x27;;
    var eye = filled ? &#x27;#1c7a2a&#x27; : &#x27;#8f9296&#x27;;
    return &#x27;&lt;svg class=&quot;goal-frog&#x27; + (filled ? &#x27; filled&#x27; : &#x27;&#x27;) + &#x27;&quot; width=&quot;34&quot; height=&quot;34&quot; viewBox=&quot;0 0 40 40&quot;&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;5&quot; fill=&quot;&#x27; + body + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;28&quot; cy=&quot;10&quot; r=&quot;5&quot; fill=&quot;&#x27; + body + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;2.2&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;1&quot; fill=&quot;&#x27; + eye + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;28&quot; cy=&quot;10&quot; r=&quot;2.2&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;10&quot; r=&quot;1&quot; fill=&quot;&#x27; + eye + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;22&quot; rx=&quot;13&quot; ry=&quot;12&quot; fill=&quot;&#x27; + body + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;20&quot; rx=&quot;8&quot; ry=&quot;6&quot; fill=&quot;&#x27; + belly + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M14 26 Q20 30 26 26&quot; stroke=&quot;&#x27; + eye + &#x27;&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function renderGoals() {
    var html = &#x27;&#x27;;
    for (var i = 0; i &lt; GOALS_PER_LEVEL; i++) html += goalFrogSVG(i &lt; goalsDone);
    goalsEl.innerHTML = html;
  }

  function carSVG(color, dir) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1) translate(-100,0)&quot;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg width=&quot;&#x27; + OBSTACLE_W + &#x27;&quot; height=&quot;&#x27; + OBSTACLE_H + &#x27;&quot; viewBox=&quot;0 0 100 40&quot;&gt;&#x27; +
      &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;4&quot; y=&quot;14&quot; width=&quot;92&quot; height=&quot;20&quot; rx=&quot;6&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M26 14 L36 4 L70 4 L80 14 Z&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;38&quot; y=&quot;7&quot; width=&quot;14&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;#cdefff&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;55&quot; y=&quot;7&quot; width=&quot;14&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;#cdefff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;28&quot; cy=&quot;35&quot; r=&quot;7&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;35&quot; r=&quot;3&quot; fill=&quot;#888&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;72&quot; cy=&quot;35&quot; r=&quot;7&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;72&quot; cy=&quot;35&quot; r=&quot;3&quot; fill=&quot;#888&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;90&quot; y=&quot;18&quot; width=&quot;6&quot; height=&quot;6&quot; rx=&quot;2&quot; fill=&quot;#fff2a8&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;;
  }

  function heroSVG() {
    var s = HERO_SIZE;
    return &#x27;&lt;svg width=&quot;&#x27; + s + &#x27;&quot; height=&quot;&#x27; + s + &#x27;&quot; viewBox=&quot;0 0 40 40&quot;&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;34&quot; rx=&quot;14&quot; ry=&quot;5&quot; fill=&quot;rgba(0,0,0,0.2)&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;5&quot; fill=&quot;#3fa34d&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;28&quot; cy=&quot;10&quot; r=&quot;5&quot; fill=&quot;#3fa34d&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;2.2&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;10&quot; r=&quot;1&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;28&quot; cy=&quot;10&quot; r=&quot;2.2&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;28&quot; cy=&quot;10&quot; r=&quot;1&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;22&quot; rx=&quot;13&quot; ry=&quot;12&quot; fill=&quot;#5cc063&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;20&quot; rx=&quot;8&quot; ry=&quot;6&quot; fill=&quot;#bdf0b0&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M14 26 Q20 30 26 26&quot; stroke=&quot;#2e7d32&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.5 + (i % 3) * 0.2;
      var obstacles = [];
      var count = (i % 3 === 1) ? 2 : 1;
      var gap = FIELD_W / count;
      var color = carColors[i % carColors.length];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 37) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;car&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.innerHTML = carSVG(color, dir);
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function drawRoad() {
    var road = document.createElement(&#x27;div&#x27;);
    road.className = &#x27;road&#x27;;
    road.style.top = CELL + &#x27;px&#x27;;
    road.style.height = (LANES * CELL) + &#x27;px&#x27;;
    field.appendChild(road);

    var topEdge = document.createElement(&#x27;div&#x27;);
    topEdge.className = &#x27;road-edge&#x27;;
    topEdge.style.top = (CELL - 2) + &#x27;px&#x27;;
    field.appendChild(topEdge);
    var botEdge = document.createElement(&#x27;div&#x27;);
    botEdge.className = &#x27;road-edge&#x27;;
    botEdge.style.top = ((LANES + 1) * CELL - 2) + &#x27;px&#x27;;
    field.appendChild(botEdge);

    for (var r = 2; r &lt;= LANES; r++) {
      var laneY = document.createElement(&#x27;div&#x27;);
      laneY.className = &#x27;dash-lane&#x27;;
      laneY.style.top = (r * CELL - 2) + &#x27;px&#x27;;
      var span = 48;
      for (var x = 6; x &lt; FIELD_W; x += span) {
        var dash = document.createElement(&#x27;div&#x27;);
        dash.className = &#x27;dash&#x27;;
        dash.style.left = x + &#x27;px&#x27;;
        laneY.appendChild(dash);
      }
      field.appendChild(laneY);
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = heroSVG();
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function updateLives() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; 3; i++) s += (i &lt; lives) ? &#x27;❤️&#x27; : &#x27;🖤&#x27;;
    livesEl.textContent = s;
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed * speedMult;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    if (!invuln &amp;&amp; !transitioning) {
      var laneIdx = hero.row - 1;
      if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
        var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
        var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
        var lane = lanes[laneIdx];
        for (var k = 0; k &lt; lane.obstacles.length; k++) {
          var o2 = lane.obstacles[k];
          if (hx &lt; o2.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
              hy &lt; lane.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane.y) {
            hitByCar();
            break;
          }
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function hitByCar() {
    lives -= 1;
    updateLives();
    if (lives &lt;= 0) {
      endGame();
      return;
    }
    invuln = true;
    heroEl.classList.add(&#x27;hit&#x27;);
    resetHero();
    setTimeout(function () {
      invuln = false;
      if (heroEl) heroEl.classList.remove(&#x27;hit&#x27;);
    }, 700);
  }

  function showNextLevelBanner() {
    var banner = document.createElement(&#x27;div&#x27;);
    banner.className = &#x27;banner&#x27;;
    banner.innerHTML = &#x27;&lt;div class=&quot;txt&quot;&gt;NEXT LEVEL&lt;/div&gt;&#x27;;
    field.appendChild(banner);
    setTimeout(function () {
      if (banner.parentNode) banner.parentNode.removeChild(banner);
    }, 1400);
  }

  function reachedTop() {
    score += 1;
    scoreEl.textContent = score;
    goalsDone += 1;
    renderGoals();
    speedMult = Math.min(SPEED_MAX, 1 + score * SPEED_STEP);

    if (goalsDone &gt;= GOALS_PER_LEVEL) {
      // Level complete!
      transitioning = true;
      showNextLevelBanner();
      resetHero();
      setTimeout(function () {
        if (!running) return;
        level += 1;
        levelEl.textContent = level;
        goalsDone = 0;
        renderGoals();
        // Each level starts a touch faster than the last.
        speedMult = Math.min(SPEED_MAX, 1 + (level - 1) * 0.25);
        transitioning = false;
      }, 1400);
    } else {
      resetHero();
    }
  }

  function move(dc, dr) {
    if (!running || transitioning) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    hero.col = nc;
    hero.row = nr;
    paintHero();
    if (hero.row === 0) reachedTop();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    level = 1;
    levelEl.textContent = &#x27;1&#x27;;
    goalsDone = 0;
    lives = 3;
    invuln = false;
    transitioning = false;
    speedMult = 1;
    updateLives();
    renderGoals();
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    drawRoad();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the field before pressing Start.
  drawRoad();
  buildLanes();
  makeHero();
  paintHero();
  updateLives();
  renderGoals();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
