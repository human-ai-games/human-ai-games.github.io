<head>

<title>Falling blocks</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

  .header a { color: #1f6feb; }

    border: 1px solid #ccc; border-radius: 6px; background: white;

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #000; color: #eee; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: #000; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #fff; }
  .instructions { font-size: 16px; color: #bbb; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #ddd; margin: 0; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; background: #111; border-radius: 8px; overflow: hidden; box-shadow: 0 0 12px rgba(255,255,255,0.08); }
  .block { position: absolute; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.35); border-radius: 3px; }
  .confetti { position: absolute; width: 7px; height: 7px; border-radius: 1px; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the falling piece with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and hold &lt;strong&gt;&amp;darr;&lt;/strong&gt; to make it fall much faster. Bright neon pieces come in many shapes, colors, and speeds — fill a full row to clear it, score a point, and set off confetti!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var SOFT_DROP_MS = 45;   // fast speed while Down is held
  var running = false, dropId = null;
  var softDrop = false;
  var grid = [];       // ROWS x COLS, 0 = empty, else color string
  var piece = null;    // { cells:[{x,y}], x, y, color, speed }
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // ---- Neon piece definitions: variety of sizes, colors, and speeds ----
  var SHAPES = [
    { name: &#x27;dot&#x27;,   cells: [{x:0,y:0}], color: &#x27;#ff1e7a&#x27;, speed: 320 },
    { name: &#x27;o&#x27;,     cells: [{x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1}], color: &#x27;#faff00&#x27;, speed: 500 },
    { name: &#x27;i2&#x27;,    cells: [{x:0,y:0},{x:1,y:0}], color: &#x27;#00f0ff&#x27;, speed: 380 },
    { name: &#x27;i3&#x27;,    cells: [{x:0,y:0},{x:1,y:0},{x:2,y:0}], color: &#x27;#39ff14&#x27;, speed: 620 },
    { name: &#x27;i4&#x27;,    cells: [{x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0}], color: &#x27;#ff00e6&#x27;, speed: 720 },
    { name: &#x27;L&#x27;,     cells: [{x:0,y:0},{x:0,y:1},{x:0,y:2},{x:1,y:2}], color: &#x27;#ff9500&#x27;, speed: 560 },
    { name: &#x27;J&#x27;,     cells: [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:0,y:2}], color: &#x27;#00ff9d&#x27;, speed: 560 },
    { name: &#x27;T&#x27;,     cells: [{x:0,y:0},{x:1,y:0},{x:2,y:0},{x:1,y:1}], color: &#x27;#b026ff&#x27;, speed: 540 },
    { name: &#x27;S&#x27;,     cells: [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}], color: &#x27;#ff073a&#x27;, speed: 520 },
    { name: &#x27;Z&#x27;,     cells: [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}], color: &#x27;#14f0ff&#x27;, speed: 520 },
    { name: &#x27;plus&#x27;,  cells: [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:1,y:2}], color: &#x27;#ff6ec7&#x27;, speed: 600 },
    { name: &#x27;big&#x27;,   cells: [{x:0,y:0},{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:0,y:2},{x:1,y:2},{x:2,y:2}], color: &#x27;#00e5ff&#x27;, speed: 900 }
  ];

  var CONFETTI_COLORS = [&#x27;#ff1e7a&#x27;,&#x27;#faff00&#x27;,&#x27;#00f0ff&#x27;,&#x27;#39ff14&#x27;,&#x27;#ff00e6&#x27;,&#x27;#ff9500&#x27;,&#x27;#00ff9d&#x27;,&#x27;#b026ff&#x27;,&#x27;#ff073a&#x27;,&#x27;#14f0ff&#x27;,&#x27;#ff6ec7&#x27;,&#x27;#00e5ff&#x27;];

  // ---- Audio ----
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }
  function playClearSound(rows) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var base = 523.25; // C5
    var notes = [base, base * 1.26, base * 1.5, base * 2];
    for (var i = 0; i &lt; Math.min(rows + 2, notes.length); i++) {
      (function (freq, delay) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = &#x27;triangle&#x27;;
        osc.frequency.value = freq;
        var t = ctx.currentTime + delay;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.32);
      })(notes[i], i * 0.07);
    }
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var out = [];
    for (var i = 0; i &lt; p.cells.length; i++) {
      out.push({ x: p.x + p.cells[i].x, y: p.y + p.cells[i].y });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function pieceWidth(shape) {
    var max = 0;
    for (var i = 0; i &lt; shape.cells.length; i++) max = Math.max(max, shape.cells[i].x);
    return max + 1;
  }

  function spawnPiece() {
    var shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    var w = pieceWidth(shape);
    piece = {
      cells: shape.cells,
      color: shape.color,
      speed: shape.speed,
      x: Math.floor((COLS - w) / 2),
      y: 0
    };
    if (collides(piece)) return false;  // game over
    restartDropTimer();
    return true;
  }

  function currentInterval() {
    if (softDrop) return SOFT_DROP_MS;
    return piece ? piece.speed : 500;
  }

  function restartDropTimer() {
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (running &amp;&amp; piece) dropId = setInterval(stepDown, currentInterval());
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function clearFullRows() {
    var cleared = 0;
    var clearedRows = [];
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) clearedRows.push(r);
    }
    if (clearedRows.length === 0) return;

    for (var k = 0; k &lt; clearedRows.length; k++) {
      spawnConfetti(clearedRows[k]);
    }

    clearedRows.sort(function (a, b) { return a - b; });
    for (var j = clearedRows.length - 1; j &gt;= 0; j--) {
      grid.splice(clearedRows[j], 1);
      var empty = [];
      for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
      grid.unshift(empty);
      cleared++;
    }

    score += cleared;
    scoreEl.textContent = score;
    playClearSound(cleared);
  }

  function spawnConfetti(row) {
    var yPx = row * CELL + CELL / 2;
    for (var i = 0; i &lt; 24; i++) {
      var conf = document.createElement(&#x27;div&#x27;);
      conf.className = &#x27;confetti&#x27;;
      var col = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      conf.style.background = col;
      conf.style.boxShadow = &#x27;0 0 6px &#x27; + col;
      var startX = Math.random() * FIELD_W;
      conf.style.left = startX + &#x27;px&#x27;;
      conf.style.top = yPx + &#x27;px&#x27;;
      field.appendChild(conf);
      animateConfetti(conf);
    }
  }

  function animateConfetti(el) {
    var vx = (Math.random() - 0.5) * 5;
    var vy = -(2 + Math.random() * 4);
    var x = parseFloat(el.style.left);
    var y = parseFloat(el.style.top);
    var life = 0;
    var rot = Math.random() * 360;
    function frame() {
      life++;
      vy += 0.35; // gravity
      x += vx; y += vy; rot += 12;
      el.style.left = x + &#x27;px&#x27;;
      el.style.top = y + &#x27;px&#x27;;
      el.style.transform = &#x27;rotate(&#x27; + rot + &#x27;deg)&#x27;;
      el.style.opacity = Math.max(0, 1 - life / 45);
      if (life &lt; 45 &amp;&amp; y &lt; FIELD_H + 20) {
        requestAnimationFrame(frame);
      } else if (el.parentNode) {
        el.parentNode.removeChild(el);
      }
    }
    requestAnimationFrame(frame);
  }

  function paint() {
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    for (var b = 0; b &lt; blocks.length; b++) blocks[b].parentNode.removeChild(blocks[b]);
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y, piece.color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    el.style.boxShadow = &#x27;inset -2px -2px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.35), 0 0 8px &#x27; + color;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { cells: piece.cells, color: piece.color, speed: piece.speed, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { cells: piece.cells, color: piece.color, speed: piece.speed, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function setSoftDrop(on) {
    if (softDrop === on) return;
    softDrop = on;
    restartDropTimer();
  }

  function endGame() {
    running = false;
    softDrop = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    softDrop = false;
    var conf = field.querySelectorAll(&#x27;.confetti&#x27;);
    for (var i = 0; i &lt; conf.length; i++) conf[i].parentNode.removeChild(conf[i]);
    newGrid();
    running = true;
    if (!spawnPiece()) { running = false; return; }
    paint();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    softDrop = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) {
      if (running) { setSoftDrop(true); stepDown(); }
      e.preventDefault();
    }
    else if (e.key === &#x27;ArrowUp&#x27;) { e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowDown&#x27;) { setSoftDrop(false); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint: empty grid with a preview piece.
  newGrid();
  piece = { cells: SHAPES[1].cells, color: SHAPES[1].color, speed: SHAPES[1].speed, x: 4, y: 0 };
  paint();
  piece = null;
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
