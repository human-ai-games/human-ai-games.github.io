<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🦘 Kangaroo Hop: Hell Run</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #b5301f; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }

    background: linear-gradient(#2a0505 0%, #6b0f0f 40%, #b5301f 70%, #ff6a00 100%); }
  .lava { position: absolute; left: 0; right: 0; bottom: 30px; height: 40px; background: linear-gradient(#ff9a00, #ff3b00); opacity: .55; filter: blur(2px); }
  .ember { position: absolute; font-size: 20px; opacity: .8; }
  .mountain { position: absolute; bottom: 30px; right: -20px; width: 0; height: 0;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦘 Kangaroo Hop: Hell Run&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click the field) to hop the kangaroo over the flaming monsters, and it pukes with joy on every clean jump. The devil on his throne even puts on shades when you clear one — use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;span class=&quot;ember&quot; id=&quot;ember1&quot; style=&quot;top:40px;left:120px;&quot;&gt;🔥&lt;/span&gt;
    &lt;span class=&quot;ember&quot; id=&quot;ember2&quot; style=&quot;top:90px;left:300px;&quot;&gt;✨&lt;/span&gt;
    &lt;span class=&quot;ember&quot; id=&quot;ember3&quot; style=&quot;top:60px;left:450px;&quot;&gt;🔥&lt;/span&gt;
    &lt;div class=&quot;mountain&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;throne&quot;&gt;🪑&lt;/div&gt;
    &lt;div class=&quot;devil&quot; id=&quot;devil&quot;&gt;😈&lt;/div&gt;
    &lt;div class=&quot;shades&quot; id=&quot;shades&quot;&gt;🕶️&lt;/div&gt;
    &lt;div class=&quot;lava&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hero&quot; id=&quot;hero&quot;&gt;🦘&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var GROUND_H = 30;
  var GRAVITY = 0.58, JUMP_V = -15.5;
  var BASE_SPEED = 3.4;
  var running = false, animId = null, spawnId = null;

  var HERO_BASE = 46, HERO_MAX = 96;
  var heroSize = HERO_BASE;
  var heroX = 60;
  var heroY = FIELD_H - GROUND_H - heroSize;
  var heroVY = 0;

  var obstacles = [];
  var score = 0;
  var gameOver = false;
  var monsters = [&#x27;🧛&#x27;,&#x27;🧟&#x27;,&#x27;🧌&#x27;,&#x27;🧙&#x27;,&#x27;👹&#x27;,&#x27;👿&#x27;];

  var field = document.getElementById(&#x27;field&#x27;);
  var hero = document.getElementById(&#x27;hero&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var devil = document.getElementById(&#x27;devil&#x27;);
  var shades = document.getElementById(&#x27;shades&#x27;);
  var embers = [
    { el: document.getElementById(&#x27;ember1&#x27;), x: 120, s: 0.4 },
    { el: document.getElementById(&#x27;ember2&#x27;), x: 300, s: 0.6 },
    { el: document.getElementById(&#x27;ember3&#x27;), x: 450, s: 0.3 }
  ];
  var shadesTimer = 0;
  var pukeTimer = 0;
  var pukeEl = null;

  function curSpeed() { return BASE_SPEED + Math.min(score * 0.12, 3.5); }

  function paintHero() {
    hero.style.width = heroSize + &#x27;px&#x27;;
    hero.style.height = heroSize + &#x27;px&#x27;;
    hero.style.fontSize = (heroSize - 6) + &#x27;px&#x27;;
    hero.style.lineHeight = heroSize + &#x27;px&#x27;;
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;
  }

  function makeObstacle(x) {
    var r = Math.random();
    var size;
    if (r &lt; 0.4) size = 34 + Math.random() * 12;
    else if (r &lt; 0.8) size = 50 + Math.random() * 14;
    else size = 66 + Math.random() * 18;
    var w = size + 6;
    var o = { x: x, w: w, h: size, hitH: size * 0.72, scored: false, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    el.style.left = o.x + &#x27;px&#x27;;
    el.style.width = w + &#x27;px&#x27;;
    el.style.fontSize = size + &#x27;px&#x27;;
    el.style.lineHeight = size + &#x27;px&#x27;;
    el.textContent = monsters[Math.floor(Math.random() * monsters.length)];
    var fire = document.createElement(&#x27;span&#x27;);
    fire.className = &#x27;fire&#x27;;
    fire.style.fontSize = (size * 0.5) + &#x27;px&#x27;;
    fire.textContent = &#x27;🔥&#x27;;
    el.appendChild(fire);
    field.appendChild(el);
    o.el = el;
    obstacles.push(o);
    return o;
  }

  // easier: smaller bursts (1-2), roomier gaps
  function spawnBurst() {
    var count = 1 + Math.floor(Math.random() * 2);
    var x = FIELD_W;
    for (var i = 0; i &lt; count; i++) {
      var o = makeObstacle(x);
      x += o.w + 30 + Math.random() * 26;
    }
  }

  function showPuke() {
    if (!pukeEl) {
      pukeEl = document.createElement(&#x27;div&#x27;);
      pukeEl.style.position = &#x27;absolute&#x27;;
      pukeEl.style.zIndex = &#x27;7&#x27;;
      pukeEl.style.textContent = &#x27;&#x27;;
      pukeEl.textContent = &#x27;🤮&#x27;;
      field.appendChild(pukeEl);
    }
    pukeEl.style.fontSize = (heroSize * 0.7) + &#x27;px&#x27;;
    pukeEl.style.opacity = &#x27;1&#x27;;
    pukeTimer = 20;
  }

  function showShades() {
    devil.textContent = &#x27;😎&#x27;;
    shades.style.opacity = &#x27;1&#x27;;
    shadesTimer = 30;
  }

  function jump() {
    if (!running || gameOver) return;
    if (heroY &gt;= FIELD_H - GROUND_H - heroSize - 1) heroVY = JUMP_V;
  }

  function tick() {
    if (!running) return;
    for (var e = 0; e &lt; embers.length; e++) {
      var em = embers[e];
      em.x -= em.s; if (em.x &lt; -30) em.x = FIELD_W;
      em.el.style.left = em.x + &#x27;px&#x27;;
    }

    heroVY += GRAVITY;
    heroY += heroVY;
    var floorY = FIELD_H - GROUND_H - heroSize;
    if (heroY &gt; floorY) { heroY = floorY; heroVY = 0; }
    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }
    hero.style.transform = heroVY &lt; 0 ? &#x27;scaleX(-1) scaleY(1.12) rotate(8deg)&#x27; : &#x27;scaleX(-1)&#x27;;
    paintHero();

    if (pukeTimer &gt; 0) {
      pukeTimer--;
      if (pukeEl) {
        pukeEl.style.left = (heroX + heroSize - 6) + &#x27;px&#x27;;
        pukeEl.style.top = (heroY + heroSize * 0.25) + &#x27;px&#x27;;
        if (pukeTimer === 0) pukeEl.style.opacity = &#x27;0&#x27;;
      }
    }

    if (shadesTimer &gt; 0) {
      shadesTimer--;
      if (shadesTimer === 0) { devil.textContent = &#x27;😈&#x27;; shades.style.opacity = &#x27;0&#x27;; }
    }

    var spd = curSpeed();
    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= spd;
      o.el.style.left = o.x + &#x27;px&#x27;;
      if (o.x + o.w &lt; 0) {
        field.removeChild(o.el);
        obstacles.splice(i, 1);
        continue;
      }
      if (!o.scored &amp;&amp; o.x + o.w &lt; heroX) {
        o.scored = true;
        score += 1;
        scoreEl.textContent = score;
        if (heroSize &lt; HERO_MAX) heroSize = Math.min(HERO_MAX, heroSize + 4);
        showPuke();
        showShades();
      }
      var obstacleTop = FIELD_H - GROUND_H - o.hitH;
      var pad = 8;
      if (heroX + heroSize - pad &gt; o.x &amp;&amp; heroX + pad &lt; o.x + o.w &amp;&amp;
          heroY + heroSize - pad &gt; obstacleTop) {
        gameOver = true;
        stopGame();
        return;
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearObstacles() {
    obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    obstacles = [];
  }

  function placeInitialObstacle() {
    clearObstacles();
    makeObstacle(FIELD_W - 60);
    paintHero();
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    heroSize = HERO_BASE;
    heroX = 60;
    heroY = FIELD_H - GROUND_H - heroSize;
    heroVY = 0;
    gameOver = false;
    hero.style.transform = &#x27;scaleX(-1)&#x27;;
    devil.textContent = &#x27;😈&#x27;;
    shades.style.opacity = &#x27;0&#x27;;
    shadesTimer = 0;
    pukeTimer = 0;
    if (pukeEl) pukeEl.style.opacity = &#x27;0&#x27;;
    paintHero();
    clearObstacles();
    spawnBurst();
    running = true;
    animId = requestAnimationFrame(tick);
    scheduleSpawn();
  }

  // easier: longer gaps between bursts, gentle ramp
  function curGap() { return Math.max(1300, 2400 - score * 35); }

  function scheduleSpawn() {
    spawnId = setTimeout(function () {
      if (!running) return;
      spawnBurst();
      scheduleSpawn();
    }, curGap());
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearTimeout(spawnId); spawnId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      jump();
      e.preventDefault();
    }
  });
  field.addEventListener(&#x27;click&#x27;, function () { jump(); });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  placeInitialObstacle();
&lt;/script&gt;
