  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #3a2d5c; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; }
  .status { display: flex; gap: 24px; font-size: 22px; color: #555; margin: 0; align-items: center; }
  .level-badge { color: #d9534f; font-weight: 600; }
  .lives { font-size: 22px; }

  .board {
    position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0;
    border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, #1b2a63 0%, #46337a 55%, #7b4a9e 100%);

  @keyframes twinkle { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  .moon { position: absolute; top: 26px; right: 40px; width: 62px; height: 62px; border-radius: 50%;

  .cloud { position: absolute; height: 26px; background: rgba(255,255,255,0.14); border-radius: 20px; filter: blur(1px); }
  .cloud::before, .cloud::after { content:&#x27;&#x27;; position:absolute; background: rgba(255,255,255,0.14); border-radius:50%; }
  .cloud::before { width: 30px; height: 30px; top: -12px; left: 14px; }
  .cloud::after  { width: 22px; height: 22px; top: -8px;  left: 40px; }
  .c1 { width: 70px; top: 70px;  left: -80px; animation: drift1 26s linear infinite; }
  .c2 { width: 90px; top: 150px; left: -110px; animation: drift2 34s linear infinite; }
  .c3 { width: 60px; top: 250px; left: -90px; animation: drift1 30s linear infinite 6s; }
  @keyframes drift1 { from { transform: translateX(0); } to { transform: translateX(760px); } }
  @keyframes drift2 { from { transform: translateX(0); } to { transform: translateX(780px); } }

  .mole {
    position: absolute; width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a7fb5, #4d3f7a);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 34px; user-select: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 -6px 10px rgba(0,0,0,0.25);
    animation: pop 0.25s cubic-bezier(0.2, 1.6, 0.4, 1);
    transition: transform 0.08s, background 0.1s;
  }
  .mole:active { transform: scale(0.9); }
  .mole.hit { background: radial-gradient(circle at 35% 30%, #6fe89a, #2f9e5c); }
  .mole.missed { background: radial-gradient(circle at 35% 30%, #ff8a8a, #c0392b); }
  @keyframes pop { from { transform: scale(0.2); } to { transform: scale(1); } }

  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(10, 6, 26, 0.82); color: #fff; text-align: center; z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 44px; color: #ff6b6b; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

  .overlay .countdown { font-size: 18px; color: #ffe27a; }
  .countdown .num { font-weight: 700; font-size: 22px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✨ Whack-a-mole ✨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the smiling critters before they vanish — missing one costs a life. Miss three and it&#x27;s game over, but a new round starts automatically after a short countdown.&lt;/p&gt;
  &lt;div class=&quot;status&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;level-badge&quot;&gt;Level: &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;moon&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cloud c1&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cloud c2&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cloud c3&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Game Over&lt;/h2&gt;
      &lt;div class=&quot;final&quot;&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;countdown&quot;&gt;New game in &lt;span class=&quot;num&quot; id=&quot;cd&quot;&gt;10&lt;/span&gt;s…&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 420, MOLE_SIZE = 68;
  var score = 0, level = 1, lives = 3;
  var intervalId = null;
  var moleTimeouts = [];
  var running = false;
  var gameOver = false;
  var restartTimeout = null, cdInterval = null;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var cdEl = document.getElementById(&#x27;cd&#x27;);

  var POINTS_PER_LEVEL = 5;
  var MAX_LIVES = 3;
  var FACES = [&#x27;😀&#x27;,&#x27;😎&#x27;,&#x27;😜&#x27;,&#x27;🤠&#x27;,&#x27;😺&#x27;,&#x27;👻&#x27;,&#x27;🤖&#x27;,&#x27;🎃&#x27;,&#x27;😈&#x27;,&#x27;🥳&#x27;];

  (function makeStars() {
    for (var i = 0; i &lt; 45; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      s.style.left = Math.random() * BOARD_W + &#x27;px&#x27;;
      s.style.top = Math.random() * (BOARD_H * 0.7) + &#x27;px&#x27;;
      s.style.animationDelay = (Math.random() * 2.5) + &#x27;s&#x27;;
      board.appendChild(s);
    }
  })();

  function getSpawnMs() { return Math.max(300, 900 - (level - 1) * 90); }
  function getMoleLifeMs() { return Math.max(500, 1200 - (level - 1) * 110); }

  function renderLives() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; MAX_LIVES; i++) s += (i &lt; lives ? &#x27;❤️&#x27; : &#x27;🖤&#x27;);
    livesEl.textContent = s;
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var moles = board.querySelectorAll(&#x27;.mole&#x27;);
    for (var j = 0; j &lt; moles.length; j++) moles[j].remove();
  }

  function updateLevel() {
    var newLevel = Math.floor(score / POINTS_PER_LEVEL) + 1;
    if (newLevel !== level) {
      level = newLevel;
      levelEl.textContent = level;
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(spawnMole, getSpawnMs());
      levelEl.parentNode.style.transform = &#x27;scale(1.25)&#x27;;
      setTimeout(function () { levelEl.parentNode.style.transform = &#x27;scale(1)&#x27;; }, 200);
    }
  }

  function loseLife(mole) {
    lives -= 1;
    renderLives();
    if (mole &amp;&amp; mole.parentNode === board) {
      mole.classList.add(&#x27;missed&#x27;);
      mole.textContent = &#x27;😵&#x27;;
    }
    if (lives &lt;= 0) triggerGameOver();
  }

  function triggerGameOver() {
    gameOver = true;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllMoles();
    finalScoreEl.textContent = score;
    overlay.classList.add(&#x27;show&#x27;);
    // 10-second countdown then auto-restart.
    var remaining = 10;
    cdEl.textContent = remaining;
    cdInterval = setInterval(function () {
      remaining -= 1;
      cdEl.textContent = remaining;
      if (remaining &lt;= 0) clearInterval(cdInterval);
    }, 1000);
    restartTimeout = setTimeout(function () {
      overlay.classList.remove(&#x27;show&#x27;);
      beginRound();
    }, 10000);
  }

  function spawnMole() {
    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27;;
    mole.textContent = FACES[Math.floor(Math.random() * FACES.length)];
    mole.style.left = Math.random() * (BOARD_W - MOLE_SIZE) + &#x27;px&#x27;;
    mole.style.top = Math.random() * (BOARD_H - MOLE_SIZE) + &#x27;px&#x27;;
    var resolved = false;
    mole.addEventListener(&#x27;click&#x27;, function () {
      if (resolved || gameOver) return;
      resolved = true;
      score += 1;
      scoreEl.textContent = score;
      mole.classList.add(&#x27;hit&#x27;);
      mole.textContent = &#x27;😆&#x27;;
      updateLevel();
      setTimeout(function () {
        if (mole.parentNode === board) board.removeChild(mole);
      }, 120);
    });
    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (resolved) return;
      resolved = true;
      if (!gameOver) loseLife(mole);
      setTimeout(function () {
        if (mole.parentNode === board) board.removeChild(mole);
      }, 200);
    }, getMoleLifeMs()));
  }

  function beginRound() {
    // Fresh game state.
    if (intervalId) clearInterval(intervalId);
    if (restartTimeout) { clearTimeout(restartTimeout); restartTimeout = null; }
    if (cdInterval) { clearInterval(cdInterval); cdInterval = null; }
    clearAllMoles();
    overlay.classList.remove(&#x27;show&#x27;);
    score = 0; level = 1; lives = MAX_LIVES;
    gameOver = false;
    running = true;
    scoreEl.textContent = &#x27;0&#x27;;
    levelEl.textContent = &#x27;1&#x27;;
    renderLives();
    spawnMole();
    intervalId = setInterval(spawnMole, getSpawnMs());
  }

  function startGame() {
    if (running) return;
    levelEl.parentNode.style.transition = &#x27;transform 0.15s&#x27;;
    beginRound();
  }

  function stopGame() {
    running = false;
    gameOver = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    if (restartTimeout) { clearTimeout(restartTimeout); restartTimeout = null; }
    if (cdInterval) { clearInterval(cdInterval); cdInterval = null; }
    clearAllMoles();
    overlay.classList.remove(&#x27;show&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;
