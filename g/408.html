<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling blocks</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .block { position: absolute; box-sizing: border-box; background: #555; border: 1px solid #ececec; }
  .single { background: #2980b9; }
  .bomb { background: #c0392b; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .nuke { background: #16a085; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .boom { background: #f39c12 !important; animation: flash 0.35s ease-out; }
  @keyframes flash { 0% { background: #fff; transform: scale(1.3); } 100% { background: #f39c12; transform: scale(1); } }
  .nukeflash { position: absolute; inset: 0; background: radial-gradient(circle, #fff, #ffe600); opacity: 0; pointer-events: none; z-index: 5; }
  .nukeflash.go { animation: nukewipe 0.7s ease-out; }
  @keyframes nukewipe { 0% { opacity: 1; } 100% { opacity: 0; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to drop faster, and clear full rows for points. Small single bricks help fill gaps left by 💣 bombs, while ☢️ nukes wipe the whole screen!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;div class=&quot;nukeflash&quot; id=&quot;nukeflash&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var NUKE_ROW = ROWS - 3;
  var NUKE_TIMEOUT = 15000;
  var running = false, dropId = null, nukeTickId = null;
  // Grid values: 0 = empty, 1 = normal, 2 = bomb, 3 = nuke, 4 = single.
  var grid = [];
  var nukes = [];
  var piece = null;
  var score = 0;
  var pieceCount = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var nukeflash = document.getElementById(&#x27;nukeflash&#x27;);

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
    nukes = [];
  }

  // A piece is either a 2x2 &quot;O&quot; (shape=&#x27;O&#x27;) or a 1x1 &quot;single&quot; (shape=&#x27;S&#x27;).
  function pieceCells(p) {
    if (p.shape === &#x27;S&#x27;) {
      return [{ x: p.x, y: p.y }];
    }
    return [
      { x: p.x,     y: p.y },
      { x: p.x + 1, y: p.y },
      { x: p.x,     y: p.y + 1 },
      { x: p.x + 1, y: p.y + 1 },
    ];
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    pieceCount++;
    // ~1 in 3 pieces is a single filler brick.
    if (Math.random() &lt; 0.34) {
      piece = { shape: &#x27;S&#x27;, x: Math.floor(COLS / 2), y: 0, special: -1, specialType: 1 };
      if (collides(piece)) return false;
      return true;
    }
    // Otherwise a 2x2 with occasional special cells.
    var special = -1;
    var specialType = 1;
    if (pieceCount % 7 === 0) { special = Math.floor(Math.random() * 4); specialType = 3; }
    else if (pieceCount % 3 === 0) { special = Math.floor(Math.random() * 4); specialType = 2; }
    piece = { shape: &#x27;O&#x27;, x: Math.floor((COLS - 2) / 2), y: 0, special: special, specialType: specialType };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) {
        if (piece.shape === &#x27;S&#x27;) {
          grid[c.y][c.x] = 4;
        } else if (i === piece.special) {
          grid[c.y][c.x] = piece.specialType;
          if (piece.specialType === 3) {
            nukes.push({ r: c.y, c: c.x, placedAt: Date.now() });
          }
        } else {
          grid[c.y][c.x] = 1;
        }
      }
    }
    piece = null;
  }

  function explodeAt(br, bc) {
    for (var dr = -1; dr &lt;= 1; dr++) {
      for (var dc = -1; dc &lt;= 1; dc++) {
        var rr = br + dr, cc = bc + dc;
        if (rr &gt;= 0 &amp;&amp; rr &lt; ROWS &amp;&amp; cc &gt;= 0 &amp;&amp; cc &lt; COLS) {
          if (grid[rr][cc] === 3) removeNukeAt(rr, cc);
          grid[rr][cc] = 0;
        }
      }
    }
  }

  function removeNukeAt(r, c) {
    for (var i = nukes.length - 1; i &gt;= 0; i--) {
      if (nukes[i].r === r &amp;&amp; nukes[i].c === c) nukes.splice(i, 1);
    }
  }

  function detonateNuke() {
    newGrid();
    score += 10;
    scoreEl.textContent = score;
    nukeflash.classList.remove(&#x27;go&#x27;);
    void nukeflash.offsetWidth;
    nukeflash.classList.add(&#x27;go&#x27;);
    paint();
  }

  function checkNukes() {
    if (!running) return;
    var now = Date.now();
    for (var i = 0; i &lt; nukes.length; i++) {
      var n = nukes[i];
      if (n.r &gt;= NUKE_ROW || (now - n.placedAt) &gt;= NUKE_TIMEOUT) {
        detonateNuke();
        return;
      }
    }
  }

  function collapseGravity() {
    for (var c = 0; c &lt; COLS; c++) {
      var write = ROWS - 1;
      for (var r = ROWS - 1; r &gt;= 0; r--) {
        if (grid[r][c]) {
          var v = grid[r][c];
          if (v === 3) { updateNukeRow(r, c, write); }
          grid[r][c] = 0;
          grid[write][c] = v;
          write--;
        }
      }
    }
  }

  function updateNukeRow(oldR, c, newR) {
    for (var i = 0; i &lt; nukes.length; i++) {
      if (nukes[i].r === oldR &amp;&amp; nukes[i].c === c) nukes[i].r = newR;
    }
  }

  function resolveBoard() {
    var explodedSomething = false;
    for (var r = 0; r &lt; ROWS; r++) {
      var full = true, bombCol = -1;
      for (var c = 0; c &lt; COLS; c++) {
        if (!grid[r][c]) { full = false; }
        if (grid[r][c] === 2) bombCol = c;
      }
      if (full &amp;&amp; bombCol &gt;= 0) {
        explodeAt(r, bombCol);
        explodedSomething = true;
        score = Math.max(0, score - 1);
        scoreEl.textContent = score;
      }
    }
    if (explodedSomething) {
      collapseGravity();
      flashBoom();
    }
    clearFullRows();
    checkNukes();
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true, blocked = false;
      for (var c = 0; c &lt; COLS; c++) {
        if (!grid[r][c]) { full = false; break; }
        if (grid[r][c] === 2 || grid[r][c] === 3) blocked = true;
      }
      if (full &amp;&amp; !blocked) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
        grid.unshift(empty);
        for (var i = 0; i &lt; nukes.length; i++) {
          if (nukes[i].r &lt; r) nukes[i].r += 1;
        }
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared;
      scoreEl.textContent = score;
    }
  }

  function paint() {
    var old = field.querySelectorAll(&#x27;.block&#x27;);
    for (var k = 0; k &lt; old.length; k++) old[k].remove();
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        var v = grid[r][c];
        if (v) drawBlock(c, r, v);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) {
          var t;
          if (piece.shape === &#x27;S&#x27;) t = 4;
          else t = (i === piece.special) ? piece.specialType : 1;
          drawBlock(cells[i].x, cells[i].y, t);
        }
      }
    }
  }

  function drawBlock(cx, cy, type) {
    var el = document.createElement(&#x27;div&#x27;);
    var cls = &#x27;block&#x27;;
    if (type === 2) cls += &#x27; bomb&#x27;;
    else if (type === 3) cls += &#x27; nuke&#x27;;
    else if (type === 4) cls += &#x27; single&#x27;;
    el.className = cls;
    if (type === 2) el.textContent = &#x27;💣&#x27;;
    else if (type === 3) el.textContent = &#x27;☢️&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function flashBoom() {
    paint();
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    for (var i = 0; i &lt; blocks.length; i++) blocks[i].classList.add(&#x27;boom&#x27;);
  }

  function stepDown() {
    if (!piece) return;
    var next = { shape: piece.shape, x: piece.x, y: piece.y + 1, special: piece.special, specialType: piece.specialType };
    if (collides(next)) {
      lockPiece();
      resolveBoard();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { shape: piece.shape, x: piece.x + dx, y: piece.y, special: piece.special, specialType: piece.specialType };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (nukeTickId) { clearInterval(nukeTickId); nukeTickId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    pieceCount = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
    if (nukeTickId) clearInterval(nukeTickId);
    nukeTickId = setInterval(checkNukes, 500);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (nukeTickId) { clearInterval(nukeTickId); nukeTickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = { shape: &#x27;O&#x27;, x: Math.floor((COLS - 2) / 2), y: 0, special: -1, specialType: 1 };
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
