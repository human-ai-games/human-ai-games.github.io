&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON BREAKER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with &amp;larr; &amp;rarr; or the mouse to bounce the ball and smash bricks — catch green (wide paddle) and gold (multi-ball) power-ups. Clear every brick to jump to the next level; use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;SCORE &lt;span class=&quot;val s&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;HIGH &lt;span class=&quot;val h&quot; id=&quot;high&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;LVL &lt;span class=&quot;val lv&quot; id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;LIVES &lt;span class=&quot;val l&quot; id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press Start below to play&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;),
      highEl = document.getElementById(&#x27;high&#x27;),
      levelEl = document.getElementById(&#x27;level&#x27;),
      livesEl = document.getElementById(&#x27;lives&#x27;),
      overlay = document.getElementById(&#x27;overlay&#x27;);

  var BASE_PADDLE_W = 108, PADDLE_H = 14, PADDLE_BOTTOM = 16, PADDLE_SPEED = 8;
  var WIDE_PADDLE_W = 170, WIDE_DURATION = 8000;
  var BALL_R = 8, BASE_BALL_SPEED = 5.2;

  var COLS = 10, BRICK_GAP = 6, BRICK_TOP = 40, BRICK_H = 20;
  var BRICK_W = (FIELD_W - BRICK_GAP) / COLS - BRICK_GAP;
  var ROW_COLORS = [&#x27;#ff2fd0&#x27;, &#x27;#ff7b00&#x27;, &#x27;#ffe600&#x27;, &#x27;#00e5ff&#x27;, &#x27;#a6ff00&#x27;];
  var ROW_POINTS = [50, 40, 30, 20, 10];

  var running = false, animId = null;
  var keysDown = {};
  var paddleX, paddleW, wideUntil;
  var balls, score, lives, level, high = 0, bricks, powerups, ballSpeed;

  function currentRows() { return Math.min(5, 3 + Math.floor(level / 2)); }

  function buildBricks() {
    bricks = [];
    var rows = currentRows();
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (level &gt;= 3 &amp;&amp; (r + c) % 7 === 0 &amp;&amp; Math.random() &lt; 0.35) continue;
        var ci = r % ROW_COLORS.length;
        bricks.push({
          x: BRICK_GAP + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          alive: true, color: ROW_COLORS[ci], points: ROW_POINTS[ci]
        });
      }
    }
  }

  function launchAngle() {
    var ang = (Math.random() * 0.6 - 0.3);
    return { vx: Math.sin(ang) * ballSpeed, vy: -Math.abs(Math.cos(ang) * ballSpeed) };
  }

  function spawnBall() {
    var a = launchAngle();
    return { x: FIELD_W / 2, y: FIELD_H - PADDLE_BOTTOM - PADDLE_H - BALL_R - 2, vx: a.vx, vy: a.vy };
  }

  function resetBalls() { balls = [spawnBall()]; }

  function newGame() {
    score = 0; lives = 3; level = 1;
    ballSpeed = BASE_BALL_SPEED;
    paddleW = BASE_PADDLE_W; wideUntil = 0;
    paddleX = (FIELD_W - paddleW) / 2;
    powerups = [];
    buildBricks();
    resetBalls();
    updateHUD();
  }

  function nextLevel() {
    level++;
    ballSpeed = BASE_BALL_SPEED + level * 0.5;
    powerups = [];
    buildBricks();
    resetBalls();
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    highEl.textContent = high;
    levelEl.textContent = level;
    livesEl.textContent = lives;
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy &lt;= r * r;
  }

  function loseLife() {
    lives--;
    updateHUD();
    if (lives &lt;= 0) {
      running = false;
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      overlay.textContent = &#x27;GAME OVER — Score &#x27; + score + &#x27;. Press Start below.&#x27;;
      overlay.classList.remove(&#x27;hide&#x27;);
    } else {
      paddleW = BASE_PADDLE_W; wideUntil = 0;
      powerups = [];
      resetBalls();
    }
  }

  function spawnPowerup(x, y) {
    var roll = Math.random();
    var type = roll &lt; 0.5 ? &#x27;wide&#x27; : &#x27;multi&#x27;;
    powerups.push({ x: x, y: y, vy: 2.2, type: type });
  }

  function applyPowerup(type) {
    if (type === &#x27;wide&#x27;) {
      paddleW = WIDE_PADDLE_W;
      paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX - (WIDE_PADDLE_W - BASE_PADDLE_W) / 2));
      wideUntil = performance.now() + WIDE_DURATION;
    } else if (type === &#x27;multi&#x27;) {
      var extra = [];
      for (var i = 0; i &lt; balls.length; i++) {
        var b = balls[i];
        var sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || ballSpeed;
        for (var k = -1; k &lt;= 1; k += 2) {
          var ang = Math.atan2(b.vy, b.vx) + k * 0.4;
          extra.push({ x: b.x, y: b.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
        }
      }
      balls = balls.concat(extra);
      if (balls.length &gt; 9) balls.length = 9;
    }
  }

  function update() {
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));

    if (wideUntil &amp;&amp; performance.now() &gt; wideUntil) {
      var cx = paddleX + paddleW / 2;
      paddleW = BASE_PADDLE_W; wideUntil = 0;
      paddleX = Math.max(0, Math.min(FIELD_W - paddleW, cx - paddleW / 2));
    }

    var pTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;

    for (var bi = balls.length - 1; bi &gt;= 0; bi--) {
      var ball = balls[bi];
      ball.x += ball.vx; ball.y += ball.vy;

      if (ball.x - BALL_R &lt;= 0) { ball.x = BALL_R; ball.vx = -ball.vx; }
      if (ball.x + BALL_R &gt;= FIELD_W) { ball.x = FIELD_W - BALL_R; ball.vx = -ball.vx; }
      if (ball.y - BALL_R &lt;= 0) { ball.y = BALL_R; ball.vy = -ball.vy; }

      if (ball.vy &gt; 0 &amp;&amp; ball.y + BALL_R &gt;= pTop &amp;&amp; ball.y + BALL_R &lt;= pTop + PADDLE_H + 10 &amp;&amp;
          ball.x &gt;= paddleX - BALL_R &amp;&amp; ball.x &lt;= paddleX + paddleW + BALL_R) {
        ball.y = pTop - BALL_R;
        var hit = (ball.x - (paddleX + paddleW / 2)) / (paddleW / 2);
        hit = Math.max(-1, Math.min(1, hit));
        var maxAng = 1.25;
        var ang = hit * maxAng;
        var sp = ballSpeed;
        ball.vx = Math.sin(ang) * sp;
        ball.vy = -Math.abs(Math.cos(ang) * sp);
      }

      for (var i = 0; i &lt; bricks.length; i++) {
        var b = bricks[i];
        if (!b.alive) continue;
        if (circleRect(ball.x, ball.y, BALL_R, b.x, b.y, BRICK_W, BRICK_H)) {
          b.alive = false;
          score += b.points;
          if (score &gt; high) high = score;
          updateHUD();
          if (Math.random() &lt; 0.18) spawnPowerup(b.x + BRICK_W / 2, b.y + BRICK_H / 2);
          var prevX = ball.x - ball.vx;
          if (prevX &lt; b.x || prevX &gt; b.x + BRICK_W) ball.vx = -ball.vx;
          else ball.vy = -ball.vy;
          break;
        }
      }

      if (ball.y - BALL_R &gt; FIELD_H) {
        balls.splice(bi, 1);
      }
    }

    if (balls.length === 0) loseLife();
    if (!running) return;

    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.y += pu.vy;
      if (pu.y + 10 &gt;= pTop &amp;&amp; pu.y - 10 &lt;= pTop + PADDLE_H &amp;&amp;
          pu.x &gt;= paddleX - 8 &amp;&amp; pu.x &lt;= paddleX + paddleW + 8) {
        applyPowerup(pu.type);
        powerups.splice(p, 1);
        continue;
      }
      if (pu.y - 12 &gt; FIELD_H) powerups.splice(p, 1);
    }

    var anyAlive = false;
    for (var j = 0; j &lt; bricks.length; j++) if (bricks[j].alive) { anyAlive = true; break; }
    if (!anyAlive) nextLevel();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPowerup(pu) {
    var color = pu.type === &#x27;wide&#x27; ? &#x27;#a6ff00&#x27; : &#x27;#ffe600&#x27;;
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(pu.x, pu.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = &#x27;#07070f&#x27;;
    ctx.font = &#x27;bold 12px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillText(pu.type === &#x27;wide&#x27; ? &#x27;W&#x27; : &#x27;M&#x27;, pu.x, pu.y + 1);
  }

  function draw() {
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);

    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.save();
      ctx.shadowColor = b.color; ctx.shadowBlur = 12;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4); ctx.fill();
      ctx.restore();
      ctx.fillStyle = &#x27;rgba(255,255,255,0.18)&#x27;;
      roundRect(b.x, b.y, BRICK_W, BRICK_H / 2, 4); ctx.fill();
    }

    for (var p = 0; p &lt; powerups.length; p++) drawPowerup(powerups[p]);

    var pTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    var pColor = wideUntil ? &#x27;#a6ff00&#x27; : &#x27;#00e5ff&#x27;;
    ctx.save();
    ctx.shadowColor = pColor; ctx.shadowBlur = 18;
    ctx.fillStyle = pColor;
    roundRect(paddleX, pTop, paddleW, PADDLE_H, 7); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = &#x27;#fff&#x27;; ctx.shadowBlur = 16;
    ctx.fillStyle = &#x27;#ffffff&#x27;;
    for (var k = 0; k &lt; balls.length; k++) {
      ctx.beginPath(); ctx.arc(balls[k].x, balls[k].y, BALL_R, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function tick() {
    if (!running) return;
    update();
    if (!running) return;
    draw();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    newGame();
    overlay.classList.add(&#x27;hide&#x27;);
    for (var k in keysDown) keysDown[k] = false;
    running = true;
    draw();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
    if (!running) return;
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (FIELD_W / rect.width);
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, mx - paddleW / 2));
  });

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  newGame();
  draw();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
