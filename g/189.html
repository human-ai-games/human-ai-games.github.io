<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a18; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(90deg,#00ffd5,#7c4dff,#ff4dd2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #aab; max-width: 660px; margin: 0; line-height: 1.3; text-align: center; }
  .arena { display: flex; gap: 10px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .plabel { font-size: 15px; font-weight: 700; }
  .p1 { color: #00e5ff; } .p2 { color: #ff8a3d; }
  .stat { font-size: 13px; color: #ccd; }
  canvas { background: #0f0f22; border-radius: 10px; display: block; box-shadow: 0 0 22px rgba(124,77,255,0.3); }
  .wrap { position: relative; }
  .banner { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 20px; font-weight: 800; pointer-events: none; opacity: 0; transition: opacity 0.25s; text-shadow: 0 0 14px currentColor; }
  .banner.show { opacity: 1; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT — VERSUS&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Two players race on one keyboard: Player 1 (cyan) uses arrow keys, Player 2 (orange) uses W A S D. First to eat the target orbs wins the level — dodge walls, enemies, and purple poison, or you&#x27;re out!&lt;/p&gt;
  &lt;div class=&quot;arena&quot;&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;span class=&quot;plabel p1&quot;&gt;PLAYER 1&lt;/span&gt;
      &lt;div class=&quot;wrap&quot;&gt;
        &lt;canvas id=&quot;cv1&quot; width=&quot;320&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;banner&quot; id=&quot;ban1&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;span class=&quot;stat&quot;&gt;Orbs &lt;span id=&quot;e1&quot;&gt;0&lt;/span&gt;/&lt;span id=&quot;t1&quot;&gt;5&lt;/span&gt; · Wins &lt;span id=&quot;w1&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;span class=&quot;plabel p2&quot;&gt;PLAYER 2&lt;/span&gt;
      &lt;div class=&quot;wrap&quot;&gt;
        &lt;canvas id=&quot;cv2&quot; width=&quot;320&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;banner&quot; id=&quot;ban2&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;span class=&quot;stat&quot;&gt;Orbs &lt;span id=&quot;e2&quot;&gt;0&lt;/span&gt;/&lt;span id=&quot;t2&quot;&gt;5&lt;/span&gt; · Wins &lt;span id=&quot;w2&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var CELL = 20, COLS = 16, ROWS = 20;
  var running = false, rafId = null, lastStep = 0, tGlobal = 0, roundOver = false;

  var AC = null;
  function actx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } return AC; }
  function beep(freq, dur, type, vol){
    var a = actx(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||&#x27;sine&#x27;; o.frequency.value = freq; g.gain.value = vol||0.15;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime;
    g.gain.setValueAtTime(vol||0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur);
  }
  function eatSound(){ beep(560,0.08,&#x27;square&#x27;,0.1); setTimeout(function(){beep(820,0.07,&#x27;square&#x27;,0.09);},50); }
  function winSound(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,0.15,&#x27;triangle&#x27;,0.16);}, i*90); }); }
  function deathSound(){ beep(180,0.35,&#x27;sawtooth&#x27;,0.18); }
  function poisonSound(){ beep(280,0.16,&#x27;sawtooth&#x27;,0.15); }

  // Each player is a self-contained world.
  function makePlayer(cfg){
    return {
      canvas: cfg.canvas, ctx: cfg.canvas.getContext(&#x27;2d&#x27;),
      skin: cfg.skin, name: cfg.name,
      snake: [], dir:{x:1,y:0}, pendingDir:{x:1,y:0},
      food:null, enemies:[], poisons:[],
      eaten:0, target:5, alive:true, level:1, wins:0,
      eEl: cfg.eEl, tEl: cfg.tEl, wEl: cfg.wEl, banner: cfg.banner
    };
  }

  var P1 = makePlayer({ canvas:document.getElementById(&#x27;cv1&#x27;), skin:[&#x27;#00e5ff&#x27;,&#x27;#0a5a6b&#x27;], name:&#x27;PLAYER 1&#x27;,
    eEl:document.getElementById(&#x27;e1&#x27;), tEl:document.getElementById(&#x27;t1&#x27;), wEl:document.getElementById(&#x27;w1&#x27;), banner:document.getElementById(&#x27;ban1&#x27;) });
  var P2 = makePlayer({ canvas:document.getElementById(&#x27;cv2&#x27;), skin:[&#x27;#ff8a3d&#x27;,&#x27;#6b3410&#x27;], name:&#x27;PLAYER 2&#x27;,
    eEl:document.getElementById(&#x27;e2&#x27;), tEl:document.getElementById(&#x27;t2&#x27;), wEl:document.getElementById(&#x27;w2&#x27;), banner:document.getElementById(&#x27;ban2&#x27;) });
  var players = [P1, P2];

  function occupied(P,x,y){
    for(var i=0;i&lt;P.snake.length;i++) if(P.snake[i].x===x&amp;&amp;P.snake[i].y===y) return true;
    for(var j=0;j&lt;P.enemies.length;j++) if(P.enemies[j].x===x&amp;&amp;P.enemies[j].y===y) return true;
    for(var p=0;p&lt;P.poisons.length;p++) if(P.poisons[p].x===x&amp;&amp;P.poisons[p].y===y) return true;
    return false;
  }
  function rnd(n){ return Math.floor(Math.random()*n); }
  function placeFood(P){
    for(var t=0;t&lt;300;t++){ var x=rnd(COLS),y=rnd(ROWS);
      if(!occupied(P,x,y)&amp;&amp;!(P.food&amp;&amp;P.food.x===x&amp;&amp;P.food.y===y)){ P.food={x:x,y:y}; return; } }
  }
  function spawnEnemy(P){
    for(var t=0;t&lt;300;t++){ var x=rnd(COLS),y=rnd(ROWS);
      if(!occupied(P,x,y)&amp;&amp;Math.abs(x-P.snake[0].x)+Math.abs(y-P.snake[0].y)&gt;5){
        P.enemies.push({x:x,y:y,dx:Math.random()&lt;0.5?1:-1,dy:0,mt:0}); return; } }
  }
  function spawnPoison(P){
    for(var t=0;t&lt;300;t++){ var x=rnd(COLS),y=rnd(ROWS);
      if(!occupied(P,x,y)&amp;&amp;Math.abs(x-P.snake[0].x)+Math.abs(y-P.snake[0].y)&gt;4){
        P.poisons.push({x:x,y:y}); return; } }
  }

  function initPlayerLevel(P, resetWins){
    P.eaten=0;
    P.target = 4 + P.level*2;
    P.snake = [{x:4,y:10},{x:3,y:10},{x:2,y:10}];
    P.dir={x:1,y:0}; P.pendingDir={x:1,y:0};
    P.enemies=[]; P.poisons=[];
    P.alive=true;
    for(var i=0;i&lt;P.level-1;i++) spawnEnemy(P);
    for(var q=0;q&lt;P.level;q++) spawnPoison(P);
    P.food=null; placeFood(P);
    if(resetWins) P.wins=0;
    updateHud(P);
  }
  function updateHud(P){ P.eEl.textContent=P.eaten; P.tEl.textContent=P.target; P.wEl.textContent=P.wins; }

  function showBanner(P, txt, color){
    P.banner.textContent=txt; P.banner.style.color=color; P.banner.classList.add(&#x27;show&#x27;);
  }
  function clearBanners(){ P1.banner.classList.remove(&#x27;show&#x27;); P2.banner.classList.remove(&#x27;show&#x27;); }

  function moveEnemies(P){
    for(var i=0;i&lt;P.enemies.length;i++){
      var e=P.enemies[i]; e.mt++;
      if(e.mt%2!==0) continue;
      if(Math.random()&lt;0.35){
        var hx=P.snake[0].x-e.x, hy=P.snake[0].y-e.y;
        if(Math.abs(hx)&gt;Math.abs(hy)){ e.dx=hx&gt;0?1:-1; e.dy=0; } else { e.dy=hy&gt;0?1:-1; e.dx=0; }
      }
      var nx=e.x+e.dx, ny=e.y+e.dy;
      if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ e.dx=-e.dx; e.dy=-e.dy; nx=e.x+e.dx; ny=e.y+e.dy; }
      if(nx&gt;=0&amp;&amp;nx&lt;COLS&amp;&amp;ny&gt;=0&amp;&amp;ny&lt;ROWS){ e.x=nx; e.y=ny; }
    }
  }

  function killPlayer(P){
    P.alive=false;
    deathSound();
    showBanner(P, &#x27;OUT!&#x27;, &#x27;#ff3d5c&#x27;);
    checkRoundEnd();
  }

  function stepPlayer(P){
    if(!P.alive) return;
    if(!(P.pendingDir.x===-P.dir.x&amp;&amp;P.pendingDir.y===-P.dir.y)) P.dir=P.pendingDir;
    var head=P.snake[0], nx=head.x+P.dir.x, ny=head.y+P.dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ killPlayer(P); return; }
    var ate=(nx===P.food.x&amp;&amp;ny===P.food.y);
    var body=ate?P.snake:P.snake.slice(0,P.snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ killPlayer(P); return; }
    for(var j=0;j&lt;P.enemies.length;j++) if(P.enemies[j].x===nx&amp;&amp;P.enemies[j].y===ny){ killPlayer(P); return; }
    for(var p=0;p&lt;P.poisons.length;p++) if(P.poisons[p].x===nx&amp;&amp;P.poisons[p].y===ny){
      poisonSound();
      if(P.level&lt;=1){ killPlayer(P); return; }
      P.level--; showBanner(P,&#x27;POISON! ↓Lvl &#x27;+P.level,&#x27;#c04dff&#x27;);
      initPlayerLevel(P,false); return;
    }
    P.snake.unshift({x:nx,y:ny});
    if(ate){
      P.eaten++; eatSound(); updateHud(P);
      if(P.eaten&gt;=P.target){ winRound(P); return; }
      placeFood(P);
    } else { P.snake.pop(); }
    moveEnemies(P);
    for(var k=0;k&lt;P.enemies.length;k++) if(P.enemies[k].x===P.snake[0].x&amp;&amp;P.enemies[k].y===P.snake[0].y){ killPlayer(P); return; }
  }

  function winRound(P){
    P.wins++;
    roundOver=true; running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    winSound();
    updateHud(P);
    showBanner(P, &#x27;WINNER! 🏆&#x27;, P.skin[0]);
    var other = (P===P1)?P2:P1;
    showBanner(other, &#x27;lost&#x27;, &#x27;#889&#x27;);
    P.level++;
    drawAll();
  }

  function checkRoundEnd(){
    var alive = players.filter(function(p){ return p.alive; });
    if(alive.length===1){
      var w=alive[0]; w.wins++; w.level++;
      roundOver=true; running=false;
      if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
      winSound(); updateHud(w);
      showBanner(w, &#x27;WINNER! 🏆&#x27;, w.skin[0]);
      drawAll();
    } else if(alive.length===0){
      roundOver=true; running=false;
      if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
      showBanner(P1,&#x27;DRAW&#x27;,&#x27;#ccd&#x27;); showBanner(P2,&#x27;DRAW&#x27;,&#x27;#ccd&#x27;);
      drawAll();
    }
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function drawPlayer(P){
    var ctx=P.ctx, W=P.canvas.width, H=P.canvas.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle= P.alive?&#x27;#0f0f22&#x27;:&#x27;#1a0f1a&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=&#x27;rgba(255,255,255,0.03)&#x27;;
    for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
    for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }

    for(var q=0;q&lt;P.poisons.length;q++){
      var pz=P.poisons[q], zx=pz.x*CELL+CELL/2, zy=pz.y*CELL+CELL/2;
      var pl=0.5+0.5*Math.sin(tGlobal*0.1+q);
      ctx.shadowColor=&#x27;#c04dff&#x27;; ctx.shadowBlur=8+pl*6;
      ctx.fillStyle=&#x27;#8a2be2&#x27;;
      ctx.beginPath(); ctx.arc(zx,zy,CELL/2-2,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;#e6c8ff&#x27;;
      ctx.beginPath(); ctx.arc(zx-3,zy-2,1.6,0,Math.PI*2); ctx.arc(zx+3,zy-2,1.6,0,Math.PI*2); ctx.fill();
      ctx.fillRect(zx-2,zy+2,4,3);
    }

    if(P.food){
      var pulse=0.5+0.5*Math.sin(tGlobal*0.15);
      var fx=P.food.x*CELL+CELL/2, fy=P.food.y*CELL+CELL/2;
      ctx.shadowColor=&#x27;#ffe14d&#x27;; ctx.shadowBlur=12+pulse*8;
      ctx.fillStyle=&#x27;#ffe14d&#x27;;
      ctx.beginPath(); ctx.arc(fx,fy,CELL/2-2,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }

    for(var i=0;i&lt;P.enemies.length;i++){
      var e=P.enemies[i], ex=e.x*CELL+CELL/2, ey=e.y*CELL+CELL/2;
      ctx.shadowColor=&#x27;#ff3d5c&#x27;; ctx.shadowBlur=10;
      ctx.fillStyle=&#x27;#ff3d5c&#x27;;
      ctx.beginPath(); ctx.arc(ex,ey,CELL/2-1,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;#fff&#x27;;
      ctx.beginPath(); ctx.arc(ex-2.5,ey-2,1.8,0,Math.PI*2); ctx.arc(ex+2.5,ey-2,1.8,0,Math.PI*2); ctx.fill();
    }

    var sk=P.skin;
    for(var s=P.snake.length-1;s&gt;=0;s--){
      var seg=P.snake[s], px=seg.x*CELL, py=seg.y*CELL;
      var isHead=(s===0);
      ctx.globalAlpha = P.alive?1:0.4;
      ctx.shadowColor=sk[0]; ctx.shadowBlur=isHead?14:6;
      if(isHead){ ctx.fillStyle=sk[0]; }
      else { var g=ctx.createLinearGradient(px,py,px+CELL,py+CELL); g.addColorStop(0,sk[0]); g.addColorStop(1,sk[1]); ctx.fillStyle=g; }
      roundRect(ctx,px+1,py+1,CELL-2,CELL-2,5); ctx.fill();
      ctx.shadowBlur=0;
      if(isHead){
        ctx.fillStyle=&#x27;#0a0a18&#x27;;
        var cx=px+CELL/2, cy=py+CELL/2, ox=P.dir.x*3, oy=P.dir.y*3;
        ctx.beginPath();
        ctx.arc(cx-4+ox,cy-4+oy,2,0,Math.PI*2); ctx.arc(cx+4+ox,cy-4+oy,2,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
  function drawAll(){ drawPlayer(P1); drawPlayer(P2); }

  var STEP_MS = 130;
  function loop(ts){
    if(!running) return;
    tGlobal++;
    if(ts-lastStep&gt;=STEP_MS){
      lastStep=ts;
      stepPlayer(P1); stepPlayer(P2);
      if(!running) return;
    }
    drawAll();
    rafId=requestAnimationFrame(loop);
  }

  function startGame(){
    if(running) return;
    if(AC &amp;&amp; AC.state===&#x27;suspended&#x27;) AC.resume();
    clearBanners();
    roundOver=false;
    initPlayerLevel(P1,false); initPlayerLevel(P2,false);
    drawAll();
    running=true; lastStep=0;
    rafId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    var k=e.key;
    // Player 1 — arrows
    if(k===&#x27;ArrowLeft&#x27;){ P1.pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(k===&#x27;ArrowRight&#x27;){ P1.pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(k===&#x27;ArrowUp&#x27;){ P1.pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(k===&#x27;ArrowDown&#x27;){ P1.pendingDir={x:0,y:1}; e.preventDefault(); }
    // Player 2 — WASD
    var lk=(k||&#x27;&#x27;).toLowerCase();
    if(lk===&#x27;a&#x27;){ P2.pendingDir={x:-1,y:0}; }
    else if(lk===&#x27;d&#x27;){ P2.pendingDir={x:1,y:0}; }
    else if(lk===&#x27;w&#x27;){ P2.pendingDir={x:0,y:-1}; }
    else if(lk===&#x27;s&#x27;){ P2.pendingDir={x:0,y:1}; }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static view
  P1.level=1; P2.level=1;
  P1.snake=[{x:4,y:10},{x:3,y:10},{x:2,y:10}]; P1.food={x:9,y:6}; P1.poisons=[{x:7,y:12}]; P1.target=6;
  P2.snake=[{x:4,y:10},{x:3,y:10},{x:2,y:10}]; P2.food={x:10,y:8}; P2.poisons=[{x:6,y:5}]; P2.target=6;
  updateHud(P1); updateHud(P2); drawAll();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
