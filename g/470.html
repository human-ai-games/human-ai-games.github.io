<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOXRUN</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>FOXRUN</b> &middot; Game 470 &middot; Professional producer &middot; Basic game: Gravity jumper</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0b1020;
    font-family:&#x27;Segoe UI&#x27;,system-ui,sans-serif;}
  .game{width:720px;height:640px;margin:0 auto;position:relative;
    display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:8px;}
  h1{margin:2px 0;font-size:26px;font-weight:800;letter-spacing:3px;
    color:#8ef;text-shadow:0 0 10px #2af,0 0 3px #fff;font-family:&#x27;Trebuchet MS&#x27;,sans-serif;}
  .instructions{font-size:16px;color:#bcd;margin:0 0 4px;text-align:center;max-width:640px;line-height:1.35;}
  .hud{width:640px;display:flex;justify-content:space-between;align-items:center;
    font-family:&#x27;Trebuchet MS&#x27;,monospace;color:#cfe;margin-bottom:4px;}
  .lifewrap{display:flex;align-items:center;gap:6px;}
  .heart{font-size:18px;transition:text-shadow .1s,transform .1s;}
  .heart.heal{animation:heartpulse .7s ease-out;}
  @keyframes heartpulse{
    0%{transform:scale(1);text-shadow:0 0 0 #fff;}
    30%{transform:scale(1.7);text-shadow:0 0 18px #fff,0 0 30px #f6a;}
    100%{transform:scale(1);text-shadow:0 0 0 #fff;}
  }
  .lives{font-size:13px;color:#f9c;letter-spacing:1px;}
  .lifebar{width:130px;height:16px;border:2px solid #2af;border-radius:8px;
    background:#123;overflow:hidden;box-shadow:0 0 8px #2af6;}
  .lifefill{height:100%;width:100%;background:linear-gradient(90deg,#2f6,#7fd);
    transition:width .18s;}
  .score{font-size:20px;font-weight:800;letter-spacing:2px;text-shadow:0 0 6px #2af;}
  .pwr{font-size:14px;color:#fe8;min-width:110px;text-align:right;letter-spacing:1px;}
  #cv{border-radius:10px;box-shadow:0 0 24px #024a,0 0 0 2px #135 inset;background:#0d1b2a;}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;FOXRUN&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; / click to jump — tap again in the air to double-jump. Dodge hazards, grab coins &amp;amp; power-ups, and catch the rare fairy to heal.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lifewrap&quot;&gt;&lt;span class=&quot;heart&quot; id=&quot;heart&quot;&gt;❤&lt;/span&gt;&lt;div class=&quot;lifebar&quot;&gt;&lt;div class=&quot;lifefill&quot; id=&quot;life&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;pwr&quot; id=&quot;pwr&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv=document.getElementById(&#x27;cv&#x27;),ctx=cv.getContext(&#x27;2d&#x27;);
var W=640,H=480,GROUND=H-70;
var scoreEl=document.getElementById(&#x27;score&#x27;),lifeEl=document.getElementById(&#x27;life&#x27;),pwrEl=document.getElementById(&#x27;pwr&#x27;);
var heartEl=document.getElementById(&#x27;heart&#x27;),livesEl=document.getElementById(&#x27;lives&#x27;);

var running=false,animId=null,lastT=0;
var score,life,lives,gameOver;
var speed,baseSpeed,dist,spawnTimer,coinTimer,powerTimer,fairyTimer;
var shield,boost;
var fox,parts,items;
var timeOfDay,weather;

// ---- audio ----
var actx=null,musicTimer=null,musicStep=0;
function initAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){actx=null;} } }
function beep(freq,dur,type,vol){
  if(!actx)return;
  var o=actx.createOscillator(),g=actx.createGain();
  o.type=type||&#x27;square&#x27;;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.15,actx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur);
}
function chime(){ // sparkly heal sound
  if(!actx)return;
  [660,880,1100,1320].forEach(function(f,i){setTimeout(function(){beep(f,0.18,&#x27;triangle&#x27;,0.12);},i*70);});
}
var melody=[523,659,784,659,587,698,880,698,659,784,988,784,587,659,784,523];
var bass=[131,131,147,147,165,165,147,131];
function startMusic(){
  if(!actx||musicTimer)return;
  musicStep=0;
  musicTimer=setInterval(function(){
    var m=melody[musicStep%melody.length];
    beep(m,0.16,&#x27;square&#x27;,0.06);
    if(musicStep%2===0)beep(bass[(musicStep/2)%bass.length],0.22,&#x27;triangle&#x27;,0.09);
    musicStep++;
  },170);
}
function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }

function burst(x,y,color,n,spd){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2,s=Math.random()*(spd||3)+1;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:color,r:Math.random()*3+1.5});
  }
}

function reset(){
  score=0;life=100;lives=0;gameOver=false;
  baseSpeed=4;speed=baseSpeed;dist=0;
  spawnTimer=0;coinTimer=0;powerTimer=0;fairyTimer=14000;shield=0;boost=0;
  timeOfDay=0;
  fox={x:110,y:GROUND-34,vy:0,onGround:true,jumps:0,squash:1,rot:0,legPhase:0};
  parts=[];items=[];weather=[];
  for(var i=0;i&lt;60;i++)weather.push({x:Math.random()*W,y:Math.random()*GROUND,ph:Math.random()*6.28});
  updateHUD();
}
function pulseHeart(){
  heartEl.classList.remove(&#x27;heal&#x27;);
  void heartEl.offsetWidth; // restart animation
  heartEl.classList.add(&#x27;heal&#x27;);
}
function updateHUD(){
  scoreEl.textContent=score;
  lifeEl.style.width=Math.max(0,life)+&#x27;%&#x27;;
  livesEl.textContent=lives&gt;0?(&#x27;+&#x27;+lives):&#x27;&#x27;;
  var p=[];
  if(shield&gt;0)p.push(&#x27;🛡 &#x27;+Math.ceil(shield/1000)+&#x27;s&#x27;);
  if(boost&gt;0)p.push(&#x27;⚡ &#x27;+Math.ceil(boost/1000)+&#x27;s&#x27;);
  pwrEl.textContent=p.join(&#x27;  &#x27;);
}

function jump(){
  if(!running||gameOver)return;
  if(fox.jumps&lt;2){
    fox.vy=fox.jumps===0?-11:-9.5;
    fox.jumps++;fox.onGround=false;fox.squash=0.7;
    burst(fox.x,fox.y+16,&#x27;#8df&#x27;,10,3);
    beep(fox.jumps===1?520:700,0.12,&#x27;square&#x27;,0.12);
  }
}

function spawnObstacle(){
  var t=Math.random();
  if(t&lt;0.34){ items.push({type:&#x27;spike&#x27;,x:W+20,w:46+Math.random()*40,hit:false}); }
  else if(t&lt;0.67){ items.push({type:&#x27;boulder&#x27;,x:W+30,r:22,rot:0,hit:false}); }
  else{ items.push({type:&#x27;mush&#x27;,x:W+30,base:W+30,phase:Math.random()*6,hit:false}); }
}
function spawnCoin(){
  var y=GROUND-34-(Math.random()&lt;0.5?0:70);
  for(var i=0;i&lt;4;i++)items.push({type:&#x27;coin&#x27;,x:W+20+i*30,y:y,got:false});
}
function spawnPower(){
  items.push({type:&#x27;power&#x27;,kind:Math.random()&lt;0.5?&#x27;shield&#x27;:&#x27;boost&#x27;,x:W+30,y:GROUND-90,got:false,bob:0});
}
function spawnFairy(){
  items.push({type:&#x27;fairy&#x27;,x:W+30,y:GROUND-100,got:false,bob:Math.random()*6,seed:Math.random()*6});
}

function healFox(){
  if(life&gt;=100){ lives+=1; burst(fox.x,fox.y,&#x27;#f6a&#x27;,24,4.5); }
  else{ life=Math.min(100,life+45); burst(fox.x,fox.y,&#x27;#6fd&#x27;,24,4.5); }
  pulseHeart();chime();updateHUD();
}

function hitFox(dmg){
  if(shield&gt;0){ burst(fox.x,fox.y,&#x27;#8ef&#x27;,14,4); return; }
  life-=dmg; burst(fox.x,fox.y,&#x27;#f66&#x27;,16,4);
  beep(160,0.25,&#x27;sawtooth&#x27;,0.14);
  if(life&lt;=0){
    if(lives&gt;0){ lives-=1; life=100; burst(fox.x,fox.y,&#x27;#f6a&#x27;,26,5); shield=2500; beep(440,0.3,&#x27;triangle&#x27;,0.14); updateHUD(); return; }
    life=0; gameOver=true; stopGame();
  }
}

function nightAmt(){ return (1-Math.cos(timeOfDay*Math.PI*2))/2; }

function update(dt){
  dist+=speed;
  score+=Math.round(speed*dt*0.6);
  speed=baseSpeed+(boost&gt;0?4:0)+Math.min(3,dist/6000);
  if(shield&gt;0)shield-=dt*1000;
  if(boost&gt;0)boost-=dt*1000;
  timeOfDay=(timeOfDay+dt/45)%1;

  fox.vy+=0.6;fox.y+=fox.vy;
  if(fox.y&gt;=GROUND-34){fox.y=GROUND-34;
    if(!fox.onGround){fox.squash=1.4;burst(fox.x,fox.y+16,&#x27;#cba&#x27;,10,2.5);beep(300,0.08,&#x27;triangle&#x27;,0.08);}
    fox.vy=0;fox.onGround=true;fox.jumps=0;}
  fox.squash+=(1-fox.squash)*0.2;
  fox.legPhase+=speed*0.08;

  spawnTimer-=dt*1000;
  if(spawnTimer&lt;=0){spawnObstacle();spawnTimer=900+Math.random()*700-Math.min(400,dist/40);}
  coinTimer-=dt*1000;
  if(coinTimer&lt;=0){spawnCoin();coinTimer=2200+Math.random()*1800;}
  powerTimer-=dt*1000;
  if(powerTimer&lt;=0){spawnPower();powerTimer=8000+Math.random()*5000;}
  fairyTimer-=dt*1000;
  if(fairyTimer&lt;=0){spawnFairy();fairyTimer=18000+Math.random()*12000;} // rare

  var fx=fox.x,fy=fox.y,fr=18;
  for(var i=items.length-1;i&gt;=0;i--){
    var it=items[i];
    it.x-=speed;
    if(it.type===&#x27;spike&#x27;){
      if(!it.hit&amp;&amp;fx&gt;it.x-6&amp;&amp;fx&lt;it.x+it.w+6&amp;&amp;fy&gt;GROUND-30){it.hit=true;hitFox(34);}
    }else if(it.type===&#x27;boulder&#x27;){
      it.rot+=speed*0.05;
      if(!it.hit){var dx=fx-it.x,dy=fy-(GROUND-it.r);
        if(dx*dx+dy*dy&lt;(fr+it.r)*(fr+it.r)){it.hit=true;hitFox(30);}}
    }else if(it.type===&#x27;mush&#x27;){
      it.phase+=dt*4;
      var ex=it.x+Math.sin(it.phase)*14;
      if(!it.hit&amp;&amp;Math.abs(fx-ex)&lt;fr+14&amp;&amp;fy&gt;GROUND-46){
        if(fox.vy&gt;0&amp;&amp;fy&lt;GROUND-40){it.hit=true;score+=25;fox.vy=-9;burst(ex,GROUND-20,&#x27;#e6f&#x27;,14,3);beep(700,0.1,&#x27;square&#x27;,0.12);}
        else{it.hit=true;hitFox(24);}
      }
    }else if(it.type===&#x27;coin&#x27;){
      var dx=fx-it.x,dy=fy-it.y;
      if(!it.got&amp;&amp;dx*dx+dy*dy&lt;(fr+12)*(fr+12)){it.got=true;score+=10;burst(it.x,it.y,&#x27;#fd4&#x27;,10,3);beep(880,0.08,&#x27;square&#x27;,0.1);}
    }else if(it.type===&#x27;power&#x27;){
      it.bob+=dt*4; var py=it.y+Math.sin(it.bob)*6;
      var dx=fx-it.x,dy=fy-py;
      if(!it.got&amp;&amp;dx*dx+dy*dy&lt;(fr+14)*(fr+14)){
        it.got=true;
        if(it.kind===&#x27;shield&#x27;)shield=6000;else boost=5000;
        burst(it.x,py,it.kind===&#x27;shield&#x27;?&#x27;#8ef&#x27;:&#x27;#fe8&#x27;,20,4);beep(990,0.15,&#x27;square&#x27;,0.14);
      }
    }else if(it.type===&#x27;fairy&#x27;){
      it.bob+=dt*3;it.seed+=dt*5;
      // fairy weaves up and down
      var py2=it.y+Math.sin(it.bob*1.4)*24;
      it.py=py2;
      // sparkle trail
      if(Math.random()&lt;0.6)parts.push({x:it.x+(Math.random()-0.5)*12,y:py2+(Math.random()-0.5)*12,vx:-speed*0.3,vy:(Math.random()-0.5)*1,life:0.8,c:Math.random()&lt;0.5?&#x27;#ff9ee6&#x27;:&#x27;#9ef&#x27;,r:Math.random()*2+1});
      var dx=fx-it.x,dy=fy-py2;
      if(!it.got&amp;&amp;dx*dx+dy*dy&lt;(fr+16)*(fr+16)){ it.got=true; healFox(); }
    }
    if(it.x&lt;-90||it.got||(it.hit&amp;&amp;it.type!==&#x27;spike&#x27;))items.splice(i,1);
    else if(it.hit&amp;&amp;it.type===&#x27;spike&#x27;&amp;&amp;it.x&lt;-90)items.splice(i,1);
  }

  for(var j=parts.length-1;j&gt;=0;j--){var p=parts[j];
    p.x+=p.vx;p.y+=p.vy;p.vy+=(p.c===&#x27;#ff9ee6&#x27;||p.c===&#x27;#9ef&#x27;)?0.02:0.25;p.life-=dt*2.2;
    if(p.life&lt;=0)parts.splice(j,1);}

  var night=nightAmt();
  for(var w=0;w&lt;weather.length;w++){var s=weather[w];
    if(night&gt;0.5){ s.ph+=dt*2;s.x+=Math.cos(s.ph)*0.4-speed*0.05;s.y+=Math.sin(s.ph*1.3)*0.4;
      if(s.x&lt;0)s.x+=W;if(s.x&gt;W)s.x-=W; }
    else{ s.x-=speed*0.3+1;s.y+=7+s.ph;if(s.y&gt;GROUND){s.y=-10;s.x=Math.random()*W;}if(s.x&lt;0)s.x+=W; }
  }

  updateHUD();
}

function lerp(a,b,t){return a+(b-a)*t;}
function rgb(a,b,t){return &#x27;rgb(&#x27;+Math.round(lerp(a[0],b[0],t))+&#x27;,&#x27;+Math.round(lerp(a[1],b[1],t))+&#x27;,&#x27;+Math.round(lerp(a[2],b[2],t))+&#x27;)&#x27;;}
function shade(c,night){return &#x27;rgb(&#x27;+Math.round(c[0]*(1-night*0.55))+&#x27;,&#x27;+Math.round(c[1]*(1-night*0.55))+&#x27;,&#x27;+Math.round(c[2]*(1-night*0.4))+&#x27;)&#x27;;}

function draw(){
  var night=nightAmt();
  var topDay=[90,160,215],topNight=[16,20,45];
  var midDay=[140,200,180],midNight=[26,40,60];
  var botDay=[110,170,120],botNight=[16,40,40];
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(topDay,topNight,night));
  g.addColorStop(0.5,rgb(midDay,midNight,night));
  g.addColorStop(1,rgb(botDay,botNight,night));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  var celY=90+Math.sin(timeOfDay*Math.PI*2+Math.PI/2)*40;
  var celX=(timeOfDay*W*1.4)%(W+120)-60;
  if(night&lt;0.5){ ctx.fillStyle=&#x27;rgba(255,240,180,&#x27;+(1-night*2)+&#x27;)&#x27;;
    ctx.shadowBlur=30;ctx.shadowColor=&#x27;#fe9&#x27;;ctx.beginPath();ctx.arc(celX,celY,26,0,7);ctx.fill();ctx.shadowBlur=0;}
  else{ ctx.fillStyle=&#x27;rgba(230,235,255,&#x27;+((night-0.5)*2)+&#x27;)&#x27;;
    ctx.shadowBlur=25;ctx.shadowColor=&#x27;#adf&#x27;;ctx.beginPath();ctx.arc(W-celX+30,celY,20,0,7);ctx.fill();ctx.shadowBlur=0;
    for(var st=0;st&lt;40;st++){var sx=(st*137)%W,sy=(st*79)%200;
      ctx.globalAlpha=((night-0.5)*2)*(0.4+0.4*Math.sin(dist*0.03+st));
      ctx.fillStyle=&#x27;#fff&#x27;;ctx.fillRect(sx,sy,1.6,1.6);}
    ctx.globalAlpha=1;
  }

  for(var i=0;i&lt;6;i++){
    var ox=((i*160 - dist*0.08)%(W+120)+W+120)%(W+120)-60;
    ctx.globalAlpha=0.35+night*0.4;ctx.fillStyle=night&gt;0.5?&#x27;#8bf&#x27;:&#x27;#5fd&#x27;;
    ctx.beginPath();ctx.arc(ox,70+(i*37)%150,5,0,7);ctx.fill();ctx.globalAlpha=1;
  }

  drawTrees(0.08,shade([18,50,42],night),320,220);
  drawTrees(0.18,shade([16,64,48],night),240,180);
  drawTrees(0.35,shade([14,80,58],night),190,140);
  drawTrees(0.6,shade([16,58,44],night),140,110);

  var gg=ctx.createLinearGradient(0,GROUND,0,H);
  gg.addColorStop(0,rgb([58,107,58],[22,44,36],night));
  gg.addColorStop(1,rgb([32,64,32],[12,26,20],night));
  ctx.fillStyle=gg;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle=night&gt;0.5?&#x27;#3a7&#x27;:&#x27;#5c9&#x27;;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();
  for(var f=0;f&lt;10;f++){
    var fx2=((f*90 - dist*1)%(W+90)+W+90)%(W+90)-45;
    ctx.fillStyle=&#x27;#7fd&#x27;;ctx.globalAlpha=0.7+night*0.3;
    ctx.beginPath();ctx.arc(fx2,GROUND+2,3,0,7);ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle=&#x27;#4a7&#x27;;ctx.beginPath();
    ctx.moveTo(fx2,GROUND);ctx.lineTo(fx2,GROUND-10);ctx.stroke();
  }

  drawWeather(night);
  items.forEach(drawItem);
  drawFox(night);

  parts.forEach(function(p){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;

  if(gameOver){
    ctx.fillStyle=&#x27;rgba(5,10,20,0.72)&#x27;;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#8ef&#x27;;ctx.font=&#x27;bold 46px Trebuchet MS&#x27;;ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;,W/2,H/2-10);
    ctx.font=&#x27;20px Trebuchet MS&#x27;;ctx.fillStyle=&#x27;#cfe&#x27;;
    ctx.fillText(&#x27;Score &#x27;+score+&#x27; — press Start below to run again&#x27;,W/2,H/2+30);
    ctx.textAlign=&#x27;left&#x27;;
  }
}

function drawWeather(night){
  if(night&gt;0.5){
    var a=(night-0.5)*2;
    for(var i=0;i&lt;weather.length;i++){var s=weather[i];
      var glow=0.4+0.6*Math.abs(Math.sin(s.ph*2));
      ctx.globalAlpha=a*glow;ctx.fillStyle=&#x27;#df6&#x27;;
      ctx.shadowBlur=8;ctx.shadowColor=&#x27;#ef8&#x27;;
      ctx.beginPath();ctx.arc(s.x,s.y,2.2,0,7);ctx.fill();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }else{
    var a2=(1-night*2);if(a2&lt;0)a2=0;
