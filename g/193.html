<!doctype html>
<html lang="en">
<head>

<title>🎯 Catch The Mole</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🎯 Catch The Mole</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #7ec850; color: #222; overflow: hidden; cursor: none; }
  .game { width: 720px; height: 640px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; position: relative; }
  h1 { margin: 6px 0 2px; text-align: center; font-size: 26px; color: #2c5c1a; text-shadow: 1px 1px 0 #fff; }
  .instructions { font-size: 16px; color: #234d12; text-align: center; margin: 0 auto 4px; max-width: 640px; line-height: 1.3; }
  .perks { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 24px; margin: 2px 0; }
  .perk { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 12px; background: #fff2; border: 1px solid #ffffff88; color: #14400a; }
  .perk.active { background: #ffd93b; color: #5a3d00; box-shadow: 0 0 8px #ffd93b; }
  .board { position: relative; flex: 1; margin: 4px 8px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(#8fd94f 0%, #79c53f 55%, #6b5030 55%, #5a3f24 100%); }
  .fence { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .hole { position: absolute; width: 84px; height: 40px; pointer-events: none; }
  .hole .dirt { position: absolute; left: 0; top: 8px; width: 84px; height: 32px; border-radius: 50%;
    background: radial-gradient(ellipse at center, #2e1f10 40%, #4a3319 100%); box-shadow: 0 3px 4px #0004 inset, 0 2px 0 #ffffff22; }
  .hole .rim { position: absolute; left: -4px; top: 4px; width: 92px; height: 30px; border-radius: 50%;
    background: radial-gradient(ellipse at center, transparent 55%, #6b4a26 60%, #7a5a34 100%); }
  .mole { position: absolute; width: 52px; height: 54px; cursor: pointer; pointer-events: auto; }
  .banner { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); pointer-events: none;
    font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 0 6px #000, 0 2px 4px #000; opacity: 0;
    transition: opacity .2s, top .5s; z-index: 20; }
  .banner.show { opacity: 1; top: 30%; }
  .float { position: absolute; pointer-events: none; font-weight: 800; font-size: 18px; color: #fff;
    text-shadow: 0 0 4px #000; animation: floatUp 0.8s ease-out forwards; z-index: 20; }
  @keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0);} to { opacity: 0; transform: translate(-50%, -40px);} }
  .hud { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 8px; font-size: 20px; color: #1f4410; font-weight: 700; }
  .hud .combo { color: #b34700; }
  #crosshair { position: fixed; width: 40px; height: 40px; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); display: none; }
  .hitflash { position: absolute; width: 70px; height: 70px; left:0; top:0; transform: translate(-50%,-50%); pointer-events:none;
    border-radius:50%; background: radial-gradient(circle, #fff8 0%, transparent 70%); animation: flash .3s forwards; z-index: 15; }
  @keyframes flash { from { opacity:1; transform: translate(-50%,-50%) scale(.4);} to {opacity:0; transform: translate(-50%,-50%) scale(1.4);} }
  .over-hole { filter: drop-shadow(0 0 6px #ffe14a); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🎯 Catch The Mole&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Moles wander slowly around the field — click one exactly when it is standing over a dirt hole to catch it, and watch it sprint away off screen. Fast catches build a combo for bonus points and unlock perks like a Bigger Hammer and Auto-Catch.&lt;/p&gt;
  &lt;div class=&quot;perks&quot; id=&quot;perks&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;svg class=&quot;fence&quot; id=&quot;fence&quot; preserveAspectRatio=&quot;none&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Combo: &lt;span class=&quot;combo&quot; id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div id=&quot;perkTimer&quot;&gt;&amp;nbsp;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;svg id=&quot;crosshair&quot; viewBox=&quot;0 0 40 40&quot;&gt;
  &lt;circle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;15&quot; fill=&quot;none&quot; stroke=&quot;#e00&quot; stroke-width=&quot;2.5&quot;/&gt;
  &lt;line x1=&quot;20&quot; y1=&quot;2&quot; x2=&quot;20&quot; y2=&quot;12&quot; stroke=&quot;#e00&quot; stroke-width=&quot;2.5&quot;/&gt;
  &lt;line x1=&quot;20&quot; y1=&quot;28&quot; x2=&quot;20&quot; y2=&quot;38&quot; stroke=&quot;#e00&quot; stroke-width=&quot;2.5&quot;/&gt;
  &lt;line x1=&quot;2&quot; y1=&quot;20&quot; x2=&quot;12&quot; y2=&quot;20&quot; stroke=&quot;#e00&quot; stroke-width=&quot;2.5&quot;/&gt;
  &lt;line x1=&quot;28&quot; y1=&quot;20&quot; x2=&quot;38&quot; y2=&quot;20&quot; stroke=&quot;#e00&quot; stroke-width=&quot;2.5&quot;/&gt;
  &lt;circle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;2&quot; fill=&quot;#e00&quot;/&gt;
&lt;/svg&gt;

&lt;script&gt;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var perksEl = document.getElementById(&#x27;perks&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;);
  var perkTimerEl = document.getElementById(&#x27;perkTimer&#x27;);
  var crosshair = document.getElementById(&#x27;crosshair&#x27;);
  var fenceEl = document.getElementById(&#x27;fence&#x27;);

  var running = false;
  var score = 0, combo = 0;
  var holes = [];
  var moles = [];
  var perkTimerInterval = null;
  var rafId = null;
  var lastTime = 0;

  var biggerHammer = false, autoCatch = false;
  var biggerHammerEnd = 0, autoCatchEnd = 0;

  var NUM_MOLES = 5;
  var GRASS_RATIO = 0.55;
  var HOLE_W = 84, HOLE_H = 40, MOLE_W = 52, MOLE_H = 54;

  var HOLE_POSITIONS = [
    {x:0.14,y:0.62},{x:0.42,y:0.62},{x:0.70,y:0.62},
    {x:0.28,y:0.78},{x:0.56,y:0.78},
    {x:0.14,y:0.92},{x:0.42,y:0.92},{x:0.70,y:0.92}
  ];

  function buildFence() {
    var w = board.clientWidth, h = board.clientHeight;
    fenceEl.setAttribute(&#x27;viewBox&#x27;, &#x27;0 0 &#x27; + w + &#x27; &#x27; + h);
    var railY = h * GRASS_RATIO - 4;
    var picketTop = railY - 34;
    var picketBottom = railY + 10;
    var s = &#x27;&#x27;;
    s += &#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27;+(railY-14)+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;5&quot; fill=&quot;#ffffff&quot; stroke=&quot;#d8d8d8&quot; stroke-width=&quot;0.6&quot;/&gt;&#x27;;
    s += &#x27;&lt;rect x=&quot;0&quot; y=&quot;&#x27;+(railY-2)+&#x27;&quot; width=&quot;&#x27;+w+&#x27;&quot; height=&quot;5&quot; fill=&quot;#ffffff&quot; stroke=&quot;#d8d8d8&quot; stroke-width=&quot;0.6&quot;/&gt;&#x27;;
    var spacing = 26, pw = 12;
    for (var x = 6; x &lt; w; x += spacing) {
      s += &#x27;&lt;polygon points=&quot;&#x27;+
        x+&#x27;,&#x27;+picketBottom+&#x27; &#x27;+
        x+&#x27;,&#x27;+(picketTop+8)+&#x27; &#x27;+
        (x+pw/2)+&#x27;,&#x27;+picketTop+&#x27; &#x27;+
        (x+pw)+&#x27;,&#x27;+(picketTop+8)+&#x27; &#x27;+
        (x+pw)+&#x27;,&#x27;+picketBottom+
        &#x27;&quot; fill=&quot;#ffffff&quot; stroke=&quot;#cfcfcf&quot; stroke-width=&quot;0.8&quot;/&gt;&#x27;;
    }
    fenceEl.innerHTML = s;
  }

  function moleSVG() {
    return &#x27;&lt;svg viewBox=&quot;0 0 52 54&quot; style=&quot;width:100%;height:100%&quot;&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;26&quot; cy=&quot;30&quot; rx=&quot;20&quot; ry=&quot;22&quot; fill=&quot;#6b4b32&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;26&quot; cy=&quot;42&quot; rx=&quot;16&quot; ry=&quot;13&quot; fill=&quot;#8a6446&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;24&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;34&quot; cy=&quot;24&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;18&quot; cy=&quot;25&quot; r=&quot;2&quot; fill=&quot;#000&quot;/&gt;&lt;circle cx=&quot;34&quot; cy=&quot;25&quot; r=&quot;2&quot; fill=&quot;#000&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;26&quot; cy=&quot;33&quot; rx=&quot;5&quot; ry=&quot;4&quot; fill=&quot;#d86a8a&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;31&quot; r=&quot;2&quot; fill=&quot;#3a2416&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;22&quot; y1=&quot;34&quot; x2=&quot;8&quot; y2=&quot;31&quot; stroke=&quot;#3a2416&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;22&quot; y1=&quot;36&quot; x2=&quot;9&quot; y2=&quot;37&quot; stroke=&quot;#3a2416&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;30&quot; y1=&quot;34&quot; x2=&quot;44&quot; y2=&quot;31&quot; stroke=&quot;#3a2416&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;30&quot; y1=&quot;36&quot; x2=&quot;43&quot; y2=&quot;37&quot; stroke=&quot;#3a2416&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;g class=&quot;paw&quot;&gt;&lt;ellipse cx=&quot;44&quot; cy=&quot;20&quot; rx=&quot;6&quot; ry=&quot;7&quot; fill=&quot;#8a6446&quot;/&gt;&lt;/g&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function buildHoles() {
    board.querySelectorAll(&#x27;.hole&#x27;).forEach(function(h){ h.remove(); });
    holes = [];
    var w = board.clientWidth, h = board.clientHeight;
    HOLE_POSITIONS.forEach(function(p){
      var hole = document.createElement(&#x27;div&#x27;);
      hole.className = &#x27;hole&#x27;;
      var hx = p.x * w, hy = p.y * h - 20;
      hole.style.left = hx + &#x27;px&#x27;;
      hole.style.top = hy + &#x27;px&#x27;;
      hole.innerHTML = &#x27;&lt;div class=&quot;rim&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dirt&quot;&gt;&lt;/div&gt;&#x27;;
      board.appendChild(hole);
      holes.push({el: hole, x: hx, y: hy, cx: hx + HOLE_W/2, cy: hy + HOLE_H/2});
    });
  }

  function makeMole() {
    var w = board.clientWidth, h = board.clientHeight;
    var minY = h * GRASS_RATIO - 20;
    var maxY = h - MOLE_H - 6;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;mole&#x27;;
    el.innerHTML = moleSVG();
    board.appendChild(el);
    var m = {
      el: el,
      x: Math.random() * (w - MOLE_W),
      y: minY + Math.random() * (maxY - minY),
      vx: (Math.random() &lt; 0.5 ? -1 : 1) * (12 + Math.random()*10),
      vy: (Math.random() &lt; 0.5 ? -1 : 1) * (8 + Math.random()*8),
      minY: minY, maxY: maxY,
      overHole: null,
      wavePhase: Math.random() * 10,
      fleeing: false,
      respawnAt: 0
    };
    (function(mm){
      el.addEventListener(&#x27;click&#x27;, function(ev){ tryCatch(mm, ev); });
    })(m);
    el.style.transform = &#x27;translate(&#x27; + m.x + &#x27;px,&#x27; + m.y + &#x27;px)&#x27;;
    return m;
  }

  function buildMoles() {
    moles.forEach(function(m){ m.el.remove(); });
    moles = [];
    for (var i = 0; i &lt; NUM_MOLES; i++) moles.push(makeMole());
  }

  function showBanner(text) {
    bannerEl.textContent = text;
    bannerEl.classList.add(&#x27;show&#x27;);
    setTimeout(function(){ bannerEl.classList.remove(&#x27;show&#x27;); }, 900);
  }

  function floatText(x, y, text, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = text;
    f.style.left = x + &#x27;px&#x27;;
    f.style.top = y + &#x27;px&#x27;;
    if (color) f.style.color = color;
    board.appendChild(f);
    setTimeout(function(){ f.remove(); }, 800);
  }

  function hitFlash(x, y) {
    var fl = document.createElement(&#x27;div&#x27;);
    fl.className = &#x27;hitflash&#x27;;
    fl.style.left = x + &#x27;px&#x27;;
    fl.style.top = y + &#x27;px&#x27;;
    board.appendChild(fl);
    setTimeout(function(){ fl.remove(); }, 300);
  }

  function updatePerks() {
    perksEl.innerHTML = &#x27;&#x27;;
    function addPerk(label, active) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;perk&#x27; + (active ? &#x27; active&#x27; : &#x27;&#x27;);
      d.textContent = label;
      perksEl.appendChild(d);
    }
    addPerk(&#x27;🔨 Bigger Hammer&#x27;, biggerHammer);
    addPerk(&#x27;⚡ Auto-Catch&#x27;, autoCatch);
    addPerk(&#x27;🔥 Combo Bonus&#x27;, combo &gt;= 3);
  }

  function findHoleUnder(m) {
    var mcx = m.x + MOLE_W/2, mcy = m.y + MOLE_H - 8;
    for (var i = 0; i &lt; holes.length; i++) {
      var dx = mcx - holes[i].cx, dy = mcy - holes[i].cy;
      if (Math.abs(dx) &lt; HOLE_W/2 - 4 &amp;&amp; Math.abs(dy) &lt; HOLE_H) {
        return holes[i];
      }
    }
    return null;
  }

  function tryCatch(m, ev) {
    if (!running || m.fleeing) return;
    if (!m.overHole) {
      combo = 0;
      comboEl.textContent = &#x27;x1&#x27;;
      floatText(m.x + MOLE_W/2, m.y, &#x27;Not on a hole!&#x27;, &#x27;#ffdddd&#x27;);
      updatePerks();
      return;
    }
    doCatch(m, false);
  }

  function doCatch(m, isAuto) {
    if (m.fleeing) return;
    combo += 1;
    var comboMult = 1 + Math.floor(combo / 3) * 0.5;
    var pts = Math.round(15 * comboMult);
    score += pts;
    scoreEl.textContent = score;
    comboEl.textContent = &#x27;x&#x27; + combo;

    hitFlash(m.x + MOLE_W/2, m.y + MOLE_H/2);
    floatText(m.x + MOLE_W/2, m.y, &#x27;+&#x27; + pts, isAuto ? &#x27;#7fd0ff&#x27; : &#x27;#ffe14a&#x27;);

    // Mole panics and runs away off the nearest side edge, fast.
    m.fleeing = true;
    m.overHole = null;
    m.el.classList.remove(&#x27;over-hole&#x27;);
    m.el.style.pointerEvents = &#x27;none&#x27;;
    var w = board.clientWidth;
    var goLeft = (m.x + MOLE_W/2) &lt; w/2;
    m.vx = (goLeft ? -1 : 1) * (620 + Math.random()*160); // sprint speed px/s
    m.vy = (Math.random() - 0.5) * 120;
    // slight flip to face running direction
    m.el.style.transform = &#x27;translate(&#x27; + m.x + &#x27;px,&#x27; + m.y + &#x27;px) scaleX(&#x27; + (goLeft ? -1 : 1) + &#x27;)&#x27;;

    checkPerks();
    updatePerks();
  }

  function respawnMole(m) {
    var w = board.clientWidth;
    m.x = Math.random() * (w - MOLE_W);
    m.y = m.minY + Math.random() * (m.maxY - m.minY);
    m.vx = (Math.random() &lt; 0.5 ? -1 : 1) * (12 + Math.random()*10);
    m.vy = (Math.random() &lt; 0.5 ? -1 : 1) * (8 + Math.random()*8);
    m.fleeing = false;
    m.overHole = null;
    m.el.style.pointerEvents = &#x27;auto&#x27;;
    m.el.style.transform = &#x27;translate(&#x27; + m.x + &#x27;px,&#x27; + m.y + &#x27;px)&#x27;;
  }

  function checkPerks() {
    if (combo === 5) {
      biggerHammer = true;
      biggerHammerEnd = Date.now() + 8000;
      showBanner(&#x27;🔨 BIGGER HAMMER!&#x27;);
    }
    if (combo === 10) {
      autoCatch = true;
      autoCatchEnd = Date.now() + 6000;
      showBanner(&#x27;⚡ AUTO-CATCH!&#x27;);
    }
    if (combo &gt; 0 &amp;&amp; combo % 15 === 0) {
      showBanner(&#x27;🔥 COMBO &#x27; + combo + &#x27;!&#x27;);
    }
  }

  var autoCatchCooldown = 0;

  function loop(t) {
    if (!running) return;
    if (!lastTime) lastTime = t;
    var dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;

    var w = board.clientWidth;
    var speedFactor = 1 + combo * 0.03;

    moles.forEach(function(m){
      if (m.fleeing) {
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        var goLeft = m.vx &lt; 0;
        m.el.style.transform = &#x27;translate(&#x27; + m.x + &#x27;px,&#x27; + m.y + &#x27;px) scaleX(&#x27; + (goLeft ? -1 : 1) + &#x27;)&#x27;;
        // once fully off screen, schedule respawn
        if (m.x &lt; -MOLE_W - 20 || m.x &gt; w + 20) {
          if (!m.respawnScheduled) {
            m.respawnScheduled = true;
            setTimeout(function(){
              m.respawnScheduled = false;
              if (running) respawnMole(m);
            }, 500 + Math.random()*500);
            // park it off-screen invisibly meanwhile
            m.x = -9999;
            m.el.style.transform = &#x27;translate(-9999px,-9999px)&#x27;;
          }
        }
        return;
      }

      m.x += m.vx * dt * speedFactor;
      m.y += m.vy * dt * speedFactor;
      if (m.x &lt; 0) { m.x = 0; m.vx = Math.abs(m.vx); }
      if (m.x &gt; w - MOLE_W) { m.x = w - MOLE_W; m.vx = -Math.abs(m.vx); }
      if (m.y &lt; m.minY) { m.y = m.minY; m.vy = Math.abs(m.vy); }
      if (m.y &gt; m.maxY) { m.y = m.maxY; m.vy = -Math.abs(m.vy); }
      if (Math.random() &lt; 0.004) m.vx = -m.vx;
      if (Math.random() &lt; 0.004) m.vy = -m.vy;

      var hole = findHoleUnder(m);
      m.overHole = hole;
      m.el.style.transform = &#x27;translate(&#x27; + m.x + &#x27;px,&#x27; + m.y + &#x27;px)&#x27;;

      var paw = m.el.querySelector(&#x27;.paw&#x27;);
      if (hole) {
        m.el.classList.add(&#x27;over-hole&#x27;);
        m.wavePhase += dt * 10;
        if (paw) paw.setAttribute(&#x27;transform&#x27;, &#x27;rotate(&#x27; + (Math.sin(m.wavePhase) * 25) + &#x27; 44 24)&#x27;);
      } else {
        m.el.classList.remove(&#x27;over-hole&#x27;);
        if (paw) paw.setAttribute(&#x27;transform&#x27;, &#x27;rotate(0 44 24)&#x27;);
      }
    });

    if (autoCatch) {
      autoCatchCooldown -= dt;
      if (autoCatchCooldown &lt;= 0) {
        for (var i = 0; i &lt; moles.length; i++) {
          if (!moles[i].fleeing &amp;&amp; moles[i].overHole) { doCatch(moles[i], true); autoCatchCooldown = 0.5; break; }
        }
      }
    }

    rafId = requestAnimationFrame(loop);
  }

  function tickPerks() {
    var now = Date.now();
