  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;

  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🌲 Forest Maze Escape 🌲</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0f0a; color: #e6edf3; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; background: linear-gradient(90deg,#8fe36b,#4dd0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #9ab49a; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .scoreboard { display: flex; gap: 8px; width: 620px; box-sizing: border-box; }
  .card { flex: 1; background: linear-gradient(180deg,#1b2b1b,#142014); border: 1px solid #2a3d2a; border-radius: 10px; padding: 6px 8px; text-align: center; }
  .card .label { font-size: 11px; letter-spacing: 1px; color: #7f9a7f; text-transform: uppercase; }
  .card .val { font-size: 22px; font-weight: 700; }
  #gemsVal { color: #8fe36b; }
  #bestVal { color: #ffcf4d; }
  #stateVal { color: #4dd0ff; font-size: 16px; }

  .timelapse { position: relative; width: 620px; height: 40px; border-radius: 10px 10px 0 0; overflow: hidden; border: 1px solid #2a3d2a; border-bottom: none; }
  #sky { position: absolute; inset: 0; }
  #sun { position: absolute; width: 22px; height: 22px; border-radius: 50%; top: 9px; }
  .clock { position: absolute; right: 8px; top: 5px; font-size: 12px; color: rgba(255,255,255,.85); text-shadow: 0 1px 2px rgba(0,0,0,.6); }

  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; overflow: hidden; border: 1px solid #2a3d2a; border-radius: 0 0 12px 12px; background: #0e160e; }
  #maze { position: absolute; inset: 0; }
  .msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(6,12,6,.82); z-index: 20; text-align: center; }
  .msg .big { font-size: 34px; font-weight: 800; }
  .msg .sub { font-size: 16px; color: #b8ccb8; margin-top: 6px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌲 Forest Maze Escape 🌲&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the &lt;strong&gt;arrow keys&lt;/strong&gt; or &lt;strong&gt;WASD&lt;/strong&gt; to walk through the maze and grab every glowing gem while dodging the beast. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;scoreboard&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Gems&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;gemsVal&quot;&gt;0 / 0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Best&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;bestVal&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;Status&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;stateVal&quot;&gt;Ready&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;timelapse&quot;&gt;
    &lt;div id=&quot;sky&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;sun&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;clock&quot; id=&quot;clock&quot;&gt;Dawn&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;maze&quot; width=&quot;620&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;msgBig&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sub&quot; id=&quot;msgSub&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var COLS = 15, ROWS = 11;
  var CELL = 40;                 // 15*40=600, 11*40=440 -&gt; we scale to fit
  var OX = 10, OY = 8;           // maze offset inside field
  // recompute cell to fit
  CELL = Math.floor(Math.min((FIELD_W - 20) / COLS, (FIELD_H - 16) / ROWS));
  OX = Math.floor((FIELD_W - CELL * COLS) / 2);
  OY = Math.floor((FIELD_H - CELL * ROWS) / 2);

  var canvas = document.getElementById(&#x27;maze&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var gemsEl = document.getElementById(&#x27;gemsVal&#x27;);
  var bestEl = document.getElementById(&#x27;bestVal&#x27;);
  var stateEl = document.getElementById(&#x27;stateVal&#x27;);
  var sky = document.getElementById(&#x27;sky&#x27;);
  var sun = document.getElementById(&#x27;sun&#x27;);
  var clock = document.getElementById(&#x27;clock&#x27;);
  var msg = document.getElementById(&#x27;msg&#x27;);
  var msgBig = document.getElementById(&#x27;msgBig&#x27;);
  var msgSub = document.getElementById(&#x27;msgSub&#x27;);

  var running = false, animId = null, moveId = null, beastId = null;
  var grid = [];          // grid[r][c] = 1 wall, 0 open
  var gems = [];          // {r,c,got}
  var totalGems = 0, gemsGot = 0, best = 0;
  var player = { r: 1, c: 1, px: 0, py: 0 };
  var beast = { r: 0, c: 0, px: 0, py: 0 };
  var wobble = 0;
  var timePhase = 0;
  var gameEnded = false;

  function cx(c){ return OX + c*CELL + CELL/2; }
  function cy(r){ return OY + r*CELL + CELL/2; }

  // ---- maze generation (recursive backtracker on odd grid) ----
  function genMaze() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) { grid.push([]); for (var c = 0; c &lt; COLS; c++) grid[r].push(1); }
    var stack = [[1,1]];
    grid[1][1] = 0;
    var dirs = [[0,2],[0,-2],[2,0],[-2,0]];
    while (stack.length) {
      var cur = stack[stack.length-1];
      var r0 = cur[0], c0 = cur[1];
      var opts = [];
      for (var i=0;i&lt;4;i++){
        var nr=r0+dirs[i][0], nc=c0+dirs[i][1];
        if (nr&gt;0&amp;&amp;nr&lt;ROWS-1&amp;&amp;nc&gt;0&amp;&amp;nc&lt;COLS-1&amp;&amp;grid[nr][nc]===1) opts.push([nr,nc,dirs[i][0],dirs[i][1]]);
      }
      if (opts.length) {
        var pick = opts[Math.floor(Math.random()*opts.length)];
        grid[r0+pick[2]/2][c0+pick[3]/2] = 0;
        grid[pick[0]][pick[1]] = 0;
        stack.push([pick[0],pick[1]]);
      } else stack.pop();
    }
    // open a few extra passages for less dead-endy chase feel
    for (var k=0;k&lt;10;k++){
      var rr = 1 + Math.floor(Math.random()*(ROWS-2));
      var cc = 1 + Math.floor(Math.random()*(COLS-2));
      grid[rr][cc]=0;
    }
  }

  function placeGems() {
    gems = []; gemsGot = 0;
    var open = [];
    for (var r=1;r&lt;ROWS-1;r++) for (var c=1;c&lt;COLS-1;c++){
      if (grid[r][c]===0 &amp;&amp; !(r===1&amp;&amp;c===1)) open.push([r,c]);
    }
    // shuffle
    for (var i=open.length-1;i&gt;0;i--){var j=Math.floor(Math.random()*(i+1));var t=open[i];open[i]=open[j];open[j]=t;}
    var count = Math.min(10, open.length);
    for (var g=0; g&lt;count; g++) gems.push({r:open[g][0], c:open[g][1], got:false});
    totalGems = gems.length;
    updateHud();
  }

  function updateHud(){ gemsEl.textContent = gemsGot + &#x27; / &#x27; + totalGems; }

  function canMove(r,c){ return r&gt;=0&amp;&amp;r&lt;ROWS&amp;&amp;c&gt;=0&amp;&amp;c&lt;COLS&amp;&amp;grid[r][c]===0; }

  var pendingDir = null;
  function setDir(dr,dc){ pendingDir = [dr,dc]; }

  function stepPlayer() {
    if (!running || gameEnded) return;
    if (pendingDir) {
      var nr = player.r + pendingDir[0], nc = player.c + pendingDir[1];
      if (canMove(nr,nc)) { player.r = nr; player.c = nc; }
    }
    // collect gems
    for (var i=0;i&lt;gems.length;i++){
      if (!gems[i].got &amp;&amp; gems[i].r===player.r &amp;&amp; gems[i].c===player.c){
        gems[i].got = true; gemsGot++; updateHud();
        if (gemsGot &gt;= totalGems) { win(); return; }
      }
    }
    checkCaught();
  }

  // ---- beast BFS chase ----
  function beastStep() {
    if (!running || gameEnded) return;
    var path = bfs(beast.r, beast.c, player.r, player.c);
    if (path &amp;&amp; path.length &gt; 1) { beast.r = path[1][0]; beast.c = path[1][1]; }
    checkCaught();
  }
  function bfs(sr,sc,tr,tc){
    var q=[[sr,sc]]; var prev={}; var seen={}; seen[sr+&#x27;,&#x27;+sc]=true;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      var cur=q.shift();
      if(cur[0]===tr&amp;&amp;cur[1]===tc){
        var path=[cur]; var key=cur[0]+&#x27;,&#x27;+cur[1];
        while(prev[key]){path.unshift(prev[key]);key=prev[key][0]+&#x27;,&#x27;+prev[key][1];}
        return path;
      }
      for(var d=0;d&lt;4;d++){
        var nr=cur[0]+dirs[d][0],nc=cur[1]+dirs[d][1];
        if(canMove(nr,nc)&amp;&amp;!seen[nr+&#x27;,&#x27;+nc]){seen[nr+&#x27;,&#x27;+nc]=true;prev[nr+&#x27;,&#x27;+nc]=cur;q.push([nr,nc]);}
      }
    }
    return null;
  }

  function checkCaught(){
    if (player.r===beast.r &amp;&amp; player.c===beast.c) lose();
  }

  function win(){
    gameEnded = true;
    if (gemsGot &gt; best){ best = gemsGot; bestEl.textContent = best; }
    stateEl.textContent = &#x27;Escaped!&#x27;;
    showMsg(&#x27;🎉 You Escaped!&#x27;, &#x27;You grabbed all the gems. Press Restart for a new maze.&#x27;);
    stopTimers();
  }
  function lose(){
    gameEnded = true;
    if (gemsGot &gt; best){ best = gemsGot; bestEl.textContent = best; }
    stateEl.textContent = &#x27;Caught!&#x27;;
    showMsg(&#x27;💀 Caught!&#x27;, &#x27;The beast got you. Press Restart to try again.&#x27;);
    stopTimers();
  }
  function showMsg(b,s){ msgBig.textContent=b; msgSub.textContent=s; msg.style.display=&#x27;flex&#x27;; }
  function hideMsg(){ msg.style.display=&#x27;none&#x27;; }

  // ---- timelapse ----
  var SKY_STOPS = [
    { p: 0.0, top: &#x27;#243b6b&#x27;, bot: &#x27;#f5a05a&#x27; },
    { p: 0.25, top: &#x27;#5a9be0&#x27;, bot: &#x27;#bfe3ff&#x27; },
    { p: 0.5, top: &#x27;#3f8fd6&#x27;, bot: &#x27;#eaf6ff&#x27; },
    { p: 0.72, top: &#x27;#e06b3f&#x27;, bot: &#x27;#ffcf7a&#x27; },
    { p: 1.0, top: &#x27;#0a1230&#x27;, bot: &#x27;#22305a&#x27; }
  ];
  function lerp(a,b,t){return a+(b-a)*t;}
  function hx(c){c=c.replace(&#x27;#&#x27;,&#x27;&#x27;);return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)];}
  function mix(c1,c2,t){var a=hx(c1),b=hx(c2);return &#x27;rgb(&#x27;+Math.round(lerp(a[0],b[0],t))+&#x27;,&#x27;+Math.round(lerp(a[1],b[1],t))+&#x27;,&#x27;+Math.round(lerp(a[2],b[2],t))+&#x27;)&#x27;;}
  function updateSky(){
    var i=0; for(;i&lt;SKY_STOPS.length-1;i++){if(timePhase&lt;=SKY_STOPS[i+1].p)break;}
    var a=SKY_STOPS[i],b=SKY_STOPS[Math.min(i+1,SKY_STOPS.length-1)];
    var t=(timePhase-a.p)/Math.max(0.0001,(b.p-a.p));
    var topC=mix(a.top,b.top,t),botC=mix(a.bot,b.bot,t);
    sky.style.background=&#x27;linear-gradient(180deg,&#x27;+topC+&#x27;,&#x27;+botC+&#x27;)&#x27;;
    var sx=6+timePhase*(620-30), arc=Math.sin(timePhase*Math.PI);
    sun.style.left=sx+&#x27;px&#x27;; sun.style.top=(22-arc*14)+&#x27;px&#x27;;
    if(timePhase&lt;0.72){sun.style.background=&#x27;radial-gradient(circle at 40% 35%, #fff6c0, #ffd24d)&#x27;;sun.style.boxShadow=&#x27;0 0 14px #ffd24d&#x27;;}
    else{sun.style.background=&#x27;radial-gradient(circle at 40% 35%, #ffffff, #cfd8ff)&#x27;;sun.style.boxShadow=&#x27;0 0 10px #cfd8ff&#x27;;}
    var labels=[&#x27;Dawn&#x27;,&#x27;Morning&#x27;,&#x27;Noon&#x27;,&#x27;Sunset&#x27;,&#x27;Night&#x27;];
    clock.textContent=labels[Math.min(labels.length-1,Math.round(timePhase*4))];
    return botC;
  }

  // ---- render ----
  function lerpTo(cur,target,speed){ return cur + (target-cur)*speed; }
  function draw(){
    if (!running) return;
    timePhase += 0.0005; if (timePhase&gt;1) timePhase=0;
    var ground = updateSky();
    wobble += 0.15;

    // smooth pixel positions
    player.px = lerpTo(player.px||cx(player.c), cx(player.c), 0.35);
    player.py = lerpTo(player.py||cy(player.r), cy(player.r), 0.35);
    beast.px = lerpTo(beast.px||cx(beast.c), cx(beast.c), 0.25);
    beast.py = lerpTo(beast.py||cy(beast.r), cy(beast.r), 0.25);

    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    // floor
    ctx.fillStyle = &#x27;#16240f&#x27;;
    ctx.fillRect(0,0,FIELD_W,FIELD_H);

    // draw open floor tiles subtly, walls with 3D top
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++){
      var x=OX+c*CELL, y=OY+r*CELL;
      if (grid[r][c]===0){
        ctx.fillStyle = ((r+c)%2===0)? &#x27;#1d3218&#x27; : &#x27;#213a1b&#x27;;
        ctx.fillRect(x,y,CELL,CELL);
      } else {
        // wall block with depth
        ctx.fillStyle = &#x27;#0c1508&#x27;;
        ctx.fillRect(x,y+4,CELL,CELL-4);
        ctx.fillStyle = &#x27;#2f5426&#x27;;
        ctx.fillRect(x,y,CELL,CELL-4);
        ctx.fillStyle = &#x27;#3f6d31&#x27;;
        ctx.fillRect(x,y,CELL,4);
      }
    }

    // gems
    for (var i=0;i&lt;gems.length;i++){
      if (gems[i].got) continue;
      var gx=cx(gems[i].c), gy=cy(gems[i].r)+Math.sin(wobble+i)*2;
      ctx.font = Math.floor(CELL*0.62)+&#x27;px serif&#x27;;
      ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.shadowColor=&#x27;#8fe36b&#x27;; ctx.shadowBlur=10;
      ctx.fillText(&#x27;💎&#x27;, gx, gy);
      ctx.shadowBlur=0;
    }

    // beast
    ctx.font = Math.floor(CELL*0.72)+&#x27;px serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.save();
    ctx.fillStyle=&#x27;rgba(0,0,0,.4)&#x27;;
    ctx.beginPath(); ctx.ellipse(beast.px, beast.py+CELL*0.32, CELL*0.28, CELL*0.1, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.shadowColor=&#x27;#ff5252&#x27;; ctx.shadowBlur=12;
    ctx.fillText(&#x27;👹&#x27;, beast.px, beast.py + Math.sin(wobble*1.3)*2);
    ctx.shadowBlur=0;

    // player
    ctx.save();
    ctx.fillStyle=&#x27;rgba(0,0,0,.4)&#x27;;
    ctx.beginPath(); ctx.ellipse(player.px, player.py+CELL*0.32, CELL*0.26, CELL*0.09, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillText(&#x27;🧝&#x27;, player.px, player.py + Math.sin(wobble)*2);

    animId = requestAnimationFrame(draw);
  }

  function stopTimers(){
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    if (moveId){ clearInterval(moveId); moveId=null; }
    if (beastId){ clearInterval(beastId); beastId=null; }
  }

  function startGame(){
    if (running) return;
    genMaze();
    placeGems();
    player.r=1; player.c=1;
    player.px=cx(1); player.py=cy(1);
    beast.r=ROWS-2; beast.c=COLS-2;
    if (grid[beast.r][beast.c]===1){ beast.r=ROWS-2; beast.c=1; if(grid[beast.r][beast.c]===1){beast.r=1;beast.c=COLS-2;} }
    beast.px=cx(beast.c); beast.py=cy(beast.r);
    pendingDir=null;
    gemsGot=0; updateHud();
    timePhase=0; gameEnded=false;
    stateEl.textContent=&#x27;Running&#x27;;
    hideMsg();
    running=true;
    animId = requestAnimationFrame(draw);
    moveId = setInterval(stepPlayer, 150);   // player moves on held direction
    beastId = setInterval(beastStep, 430);    // beast a bit slower -&gt; fair
  }
  function stopGame(){
    if (!running) { if (!gameEnded) stateEl.textContent=&#x27;Ready&#x27;; return; }
    if (!gameEnded) stateEl.textContent=&#x27;Paused&#x27;;
    stopTimers();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    var k=e.key;
    if (k===&#x27;ArrowUp&#x27;||k===&#x27;w&#x27;||k===&#x27;W&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if (k===&#x27;ArrowDown&#x27;||k===&#x27;s&#x27;||k===&#x27;S&#x27;){ setDir(1,0); e.preventDefault(); }
    else if (k===&#x27;ArrowLeft&#x27;||k===&#x27;a&#x27;||k===&#x27;A&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if (k===&#x27;ArrowRight&#x27;||k===&#x27;d&#x27;||k===&#x27;D&#x27;){ setDir(0,1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    var k=e.key;
    // stop continuous movement when direction key released
    if (k===&#x27;ArrowUp&#x27;||k===&#x27;w&#x27;||k===&#x27;W&#x27;||k===&#x27;ArrowDown&#x27;||k===&#x27;s&#x27;||k===&#x27;S&#x27;||
        k===&#x27;ArrowLeft&#x27;||k===&#x27;a&#x27;||k===&#x27;A&#x27;||k===&#x27;ArrowRight&#x27;||k===&#x27;d&#x27;||k===&#x27;D&#x27;){
      pendingDir=null;
    }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static preview
  genMaze(); placeGems();
  player.px=cx(1); player.py=cy(1);
  beast.r=ROWS-2; beast.c=COLS-2; beast.px=cx(beast.c); beast.py=cy(beast.r);
  updateSky();
  (function previewDraw(){
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    ctx.fillStyle=&#x27;#16240f&#x27;; ctx.fillRect(0,0,FIELD_W,FIELD_H);
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++){
      var x=OX+c*CELL, y=OY+r*CELL;
