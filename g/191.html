<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMIC SERPENT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>COSMIC SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8e8ff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; color: #6ffcff; text-shadow: 0 0 10px #0ff, 0 0 20px #0af; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #aab; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; font-weight: 800; color: #ffe94d; margin: 0; text-shadow: 0 0 8px #ff0; letter-spacing: 0.5px; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; border: 1px solid #223; box-shadow: 0 0 24px rgba(60,120,255,0.25) inset; }
  .field canvas { display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with the arrow keys to eat yellow orbs for 1 point and rare orange orbs for 2 points. Hitting a wall or yourself ends the round — use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var TICK_MS = 150;
  var running = false, tickId = null, rafId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var bonus = null;            // {x, y} orange 2-point orb, or null
  var bonusTimer = 0;          // ticks remaining before bonus despawns
  var score = 0;
  var particles = [];
  var pops = [];               // floating score text popups
  var stars = [];
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var HEAD_RGB = { r: 0, g: 240, b: 255 };
  var TAIL_RGB = { r: 0, g: 90, b: 120 };

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 90; i++) {
      stars.push({
        x: Math.random() * FIELD_W,
        y: Math.random() * FIELD_H,
        r: Math.random() * 1.4 + 0.3,
        tw: Math.random() * Math.PI * 2,
        sp: Math.random() * 0.04 + 0.01
      });
    }
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    if (bonus &amp;&amp; bonus.x === x &amp;&amp; bonus.y === y) return true;
    if (food.x === x &amp;&amp; food.y === y) return true;
    return false;
  }

  function freeCell() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) return { x: x, y: y };
    }
    return null;
  }

  function placeFood() {
    var c = freeCell();
    if (c) food = c;
  }

  function maybeSpawnBonus() {
    if (bonus) return;
    // ~12% chance each tick to spawn a bonus when none present
    if (Math.random() &lt; 0.012) {
      var c = freeCell();
      if (c) { bonus = c; bonusTimer = 45; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function spawnBurst(cx, cy, colors, count, spread) {
    for (var i = 0; i &lt; count; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = Math.random() * spread + 1;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function spawnPop(cx, cy, text, color) {
    pops.push({ x: cx, y: cy, text: text, color: color, life: 1 });
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }

    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var ateBonus = (bonus &amp;&amp; nx === bonus.x &amp;&amp; ny === bonus.y);
    var grow = ateFood || ateBonus;
    var body = grow ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });

    if (ateBonus) {
      score += 2;
      scoreEl.textContent = score;
      var bx = bonus.x * CELL + CELL / 2, by = bonus.y * CELL + CELL / 2;
      spawnBurst(bx, by, [&#x27;#ff8a00&#x27;, &#x27;#ffb347&#x27;, &#x27;#ffd27f&#x27;], 34, 4.5);
      spawnPop(bx, by, &#x27;+2&#x27;, &#x27;#ff8a00&#x27;);
      bonus = null;
    } else if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
      spawnBurst(fx, fy, [&#x27;#ffe94d&#x27;, &#x27;#6ffcff&#x27;], 22, 3.5);
      spawnPop(fx, fy, &#x27;+1&#x27;, &#x27;#ffe94d&#x27;);
      placeFood();
    } else {
      snake.pop();
    }

    // Bonus lifetime / spawning
    if (bonus) { bonusTimer--; if (bonusTimer &lt;= 0) bonus = null; }
    else maybeSpawnBonus();
  }

  function drawStars() {
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i];
      s.tw += s.sp;
      var alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = &#x27;rgba(200,220,255,&#x27; + alpha.toFixed(2) + &#x27;)&#x27;;
      ctx.fill();
    }
  }

  function segColor(t) {
    var r = Math.round(HEAD_RGB.r + (TAIL_RGB.r - HEAD_RGB.r) * t);
    var g = Math.round(HEAD_RGB.g + (TAIL_RGB.g - HEAD_RGB.g) * t);
    var b = Math.round(HEAD_RGB.b + (TAIL_RGB.b - HEAD_RGB.b) * t);
    return &#x27;rgb(&#x27; + r + &#x27;,&#x27; + g + &#x27;,&#x27; + b + &#x27;)&#x27;;
  }

  function drawSnake() {
    var n = snake.length;
    for (var i = 0; i &lt; n; i++) {
      var s = snake[i];
      var px = s.x * CELL, py = s.y * CELL;
      var t = n &gt; 1 ? i / (n - 1) : 0;
      ctx.save();
      ctx.shadowColor = &#x27;#0ff&#x27;;
      ctx.shadowBlur = i === 0 ? 18 : 10;
      ctx.fillStyle = i === 0 ? &#x27;#aaffff&#x27; : segColor(t);
      var pad = 1;
      roundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
      ctx.restore();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawOrb(cx, cy, color, glow, radius) {
    var pulse = 1 + 0.15 * Math.sin(Date.now() / 200);
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(cx, cy, radius * pulse, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function drawFood() {
    drawOrb(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, &#x27;#ffe94d&#x27;, &#x27;#ffea00&#x27;, CELL / 2 - 2);
  }

  function drawBonus() {
    if (!bonus) return;
    // blink faster as it&#x27;s about to expire
    var blink = bonusTimer &gt; 12 || (Math.floor(Date.now() / 150) % 2 === 0);
    if (blink) drawOrb(bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2, &#x27;#e06a00&#x27;, &#x27;#ff8a00&#x27;, CELL / 2 - 1);
  }

  function drawParticles() {
    for (var i = particles.length - 1; i &gt;= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= 0.03;
      if (p.life &lt;= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 * p.life + 1, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPops() {
    for (var i = pops.length - 1; i &gt;= 0; i--) {
      var p = pops[i];
      p.y -= 0.8;
      p.life -= 0.02;
      if (p.life &lt;= 0) { pops.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = p.color;
      ctx.font = &#x27;800 24px system-ui, sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }

  function render() {
    ctx.fillStyle = &#x27;#05060f&#x27;;
    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    drawStars();
    drawFood();
    drawBonus();
    drawSnake();
    drawParticles();
    drawPops();
    if (gameOver) {
      ctx.save();
      ctx.fillStyle = &#x27;rgba(0,0,0,0.5)&#x27;;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      ctx.fillStyle = &#x27;#ff4d6d&#x27;;
      ctx.shadowColor = &#x27;#ff4d6d&#x27;;
      ctx.shadowBlur = 16;
      ctx.font = &#x27;600 34px system-ui, sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, FIELD_W / 2, FIELD_H / 2);
      ctx.restore();
    }
  }

  function loop() {
    render();
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    particles = [];
    pops = [];
    bonus = null;
    bonusTimer = 0;
    initSnake();
    placeFood();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
    if (!rafId) loop();
  }
  function stopGame() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initStars();
  initSnake();
  placeFood();
  render();
&lt;/script&gt;

&lt;script&gt;

        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
