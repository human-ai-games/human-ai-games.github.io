  var FIELD_W = 620, FIELD_H = 384;

  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 8;
  var TARGET_SIZE = 34, BASE_TARGET_SPEED = 1.8;
  var BASE_SPAWN_INTERVAL = 1100;
  var LEVEL_TARGET = 20, MAX_LEVEL = 5;
  var ALIENS = [&#x27;\uD83D\uDC7E&#x27;,&#x27;\uD83D\uDC7D&#x27;,&#x27;\uD83E\uDD16&#x27;,&#x27;\uD83D\uDEF8&#x27;,&#x27;\u2622\uFE0F&#x27;];

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function applyLevelSettings() {
    targetSpeed = BASE_TARGET_SPEED + (level - 1) * 0.9;
    spawnInterval = Math.max(500, BASE_SPAWN_INTERVAL - (level - 1) * 130);
    levelEl.textContent = level;
  }

  function spawnTarget() {
    var r = Math.random();
    var kind = &#x27;normal&#x27;, emoji, cls = &#x27;target&#x27;;
    if (r &lt; 0.14) { kind = &#x27;bonus&#x27;; emoji = BONUS_EMOJI; cls = &#x27;target bonus&#x27;; }
    else if (r &lt; 0.28) { kind = &#x27;penalty&#x27;; emoji = PENALTY_EMOJI; cls = &#x27;target penalty&#x27;; }
    else { emoji = ALIENS[Math.floor(Math.random() * ALIENS.length)]; }
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null, kind: kind };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = cls;
    el.textContent = emoji;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    beep(880, 0.08, &#x27;square&#x27;);
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;

    b.el = el;
    bullets.push(b);

  function clearEntities() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bullets = []; targets = [];
  }

  function completeLevel() {
    transitioning = true;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearEntities();
    beep(1400, 0.25, &#x27;triangle&#x27;);
    setTimeout(function(){ beep(1800, 0.25, &#x27;triangle&#x27;); }, 150);

    if (level &gt;= MAX_LEVEL) {
      showFlash(&#x27;YOU WIN!&#x27;, &#x27;winText&#x27;, 3000);
      setTimeout(function () {
        running = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
      }, 3000);
      return;
    }

    showFlash(&#x27;LEVEL COMPLETE&#x27;, &#x27;levelText&#x27;, 2000);
    setTimeout(function () {
      if (!running) return;
      level += 1;
      score = 0;
      scoreEl.textContent = &#x27;0&#x27;;
      applyLevelSettings();
      shipX = (FIELD_W - SHIP_W) / 2;
      paintShip();
      transitioning = false;
      spawnTarget();
      spawnId = setInterval(spawnTarget, spawnInterval);

  }

  function tick() {
    if (!running) return;
    if (!transitioning) {
      if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
      if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
      shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
      paintShip();
      for (var i = bullets.length - 1; i &gt;= 0; i--) {
        var b = bullets[i];
        b.y -= BULLET_SPEED;
        if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
        b.el.style.top = b.y + &#x27;px&#x27;;
      }
      for (var j = targets.length - 1; j &gt;= 0; j--) {
        var t = targets[j];
        t.y += targetSpeed;
        if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
        t.el.style.top = t.y + &#x27;px&#x27;;
      }
      for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
        var b2 = bullets[i2];
        for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
          var t2 = targets[j2];
          if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
              b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
            field.removeChild(b2.el); bullets.splice(i2, 1);
            field.removeChild(t2.el); targets.splice(j2, 1);
            if (t2.kind === &#x27;bonus&#x27;) {
              score += 5; showFlash(&#x27;BONUS!&#x27;, &#x27;bonusText&#x27;); beep(1200, 0.2, &#x27;triangle&#x27;);
            } else if (t2.kind === &#x27;penalty&#x27;) {
              score -= 5; showFlash(&#x27;OH NO!&#x27;, &#x27;penaltyText&#x27;); beep(120, 0.3, &#x27;sawtooth&#x27;);
            } else {
              score += 1; beep(220, 0.14, &#x27;sawtooth&#x27;);
            }
            scoreEl.textContent = score;
            if (score &gt;= LEVEL_TARGET &amp;&amp; !transitioning) { completeLevel(); }
            break;
          }
        }
        if (transitioning) break;
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    clearEntities();
    if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
    flashEl.style.display = &#x27;none&#x27;;
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    level = 1;
    transitioning = false;
    applyLevelSettings();
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, spawnInterval);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running &amp;&amp; !transitioning) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  paintShip();
