&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {

    }, true);
  });

  var BOARD_W = 640, BOARD_H = 470;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var startMenu = document.getElementById(&#x27;startMenu&#x27;);
  var endMenu = document.getElementById(&#x27;endMenu&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var endReasonEl = document.getElementById(&#x27;endReason&#x27;);

  var score = 0, best = 0;
  var running = false;
  var balloons = [];
  var spawnTimer = null;
  var animId = null;
  var elapsed = 0;
  var lastFrame = 0;

  var COLORS = [
    [&#x27;#ff5e7e&#x27;,&#x27;#c02a4a&#x27;], [&#x27;#5ec6ff&#x27;,&#x27;#1a6bc0&#x27;], [&#x27;#ffd166&#x27;,&#x27;#c99400&#x27;],
    [&#x27;#7bed9f&#x27;,&#x27;#2ecc71&#x27;], [&#x27;#c56cff&#x27;,&#x27;#8a2be2&#x27;], [&#x27;#ff9f43&#x27;,&#x27;#e17055&#x27;],
    [&#x27;#48dbfb&#x27;,&#x27;#0abde3&#x27;], [&#x27;#ff6b9d&#x27;,&#x27;#ee5253&#x27;]
  ];

  // ---------- Audio ----------
  var actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
    return actx;
  }
  function popSound(size) {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    var base = 520 - size * 2;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 0.4, t + 0.12);
    o.type = &#x27;triangle&#x27;;
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.17);
    var bufSize = c.sampleRate * 0.06;
    var buf = c.createBuffer(1, bufSize, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i&lt;bufSize;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/bufSize,2);
    var n = c.createBufferSource(); n.buffer = buf;
    var ng = c.createGain(); ng.gain.value = 0.2;
    n.connect(ng); ng.connect(c.destination); n.start(t);
  }
  function bombSound() {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var bufSize = c.sampleRate * 0.5;
    var buf = c.createBuffer(1, bufSize, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i&lt;bufSize;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/bufSize,1.5);
    var n = c.createBufferSource(); n.buffer = buf;
    var f = c.createBiquadFilter(); f.type=&#x27;lowpass&#x27;;
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(80, t+0.45);
    var g = c.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    n.connect(f); f.connect(g); g.connect(c.destination); n.start(t);
    var o = c.createOscillator(), og = c.createGain();
    o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(40,t+0.4);
    og.gain.setValueAtTime(0.4,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.45);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+0.45);
  }
  function gameOverSound() {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    [440,349,262].forEach(function(f,i){
      var o=c.createOscillator(),g=c.createGain();
      o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(f,t+i*0.18);
      g.gain.setValueAtTime(0.25,t+i*0.18); g.gain.exponentialRampToValueAtTime(0.001,t+i*0.18+0.25);
      o.connect(g); g.connect(c.destination); o.start(t+i*0.18); o.stop(t+i*0.18+0.26);
    });
  }

  // ---------- Balloon SVG ----------
  function balloonSVG(size, colors, isBomb) {
    if (isBomb) {
      return &#x27;&lt;svg width=&quot;&#x27;+size+&#x27;&quot; height=&quot;&#x27;+size*1.15+&#x27;&quot; viewBox=&quot;0 0 100 115&quot;&gt;&#x27; +
        &#x27;&lt;defs&gt;&lt;radialGradient id=&quot;bg&quot; cx=&quot;38%&quot; cy=&quot;32%&quot; r=&quot;70%&quot;&gt;&#x27; +
        &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#666&quot;/&gt;&lt;stop offset=&quot;55%&quot; stop-color=&quot;#222&quot;/&gt;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#000&quot;/&gt;&#x27; +
        &#x27;&lt;/radialGradient&gt;&lt;/defs&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;50&quot; cy=&quot;60&quot; r=&quot;40&quot; fill=&quot;url(#bg)&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;38&quot; cy=&quot;45&quot; rx=&quot;12&quot; ry=&quot;8&quot; fill=&quot;rgba(255,255,255,0.35)&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;46&quot; y=&quot;14&quot; width=&quot;8&quot; height=&quot;14&quot; rx=&quot;2&quot; fill=&quot;#555&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M54 16 Q66 6 74 12&quot; stroke=&quot;#ffcc00&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;76&quot; cy=&quot;11&quot; r=&quot;4&quot; fill=&quot;#ff5e00&quot;&gt;&lt;animate attributeName=&quot;r&quot; values=&quot;3;5;3&quot; dur=&quot;0.4s&quot; repeatCount=&quot;indefinite&quot;/&gt;&lt;/circle&gt;&#x27; +
        &#x27;&lt;/svg&gt;&#x27;;
    }
    var g = &#x27;gr&#x27;+Math.floor(Math.random()*100000);
    return &#x27;&lt;svg width=&quot;&#x27;+size+&#x27;&quot; height=&quot;&#x27;+size*1.25+&#x27;&quot; viewBox=&quot;0 0 100 125&quot;&gt;&#x27; +
      &#x27;&lt;defs&gt;&lt;radialGradient id=&quot;&#x27;+g+&#x27;&quot; cx=&quot;35%&quot; cy=&quot;30%&quot; r=&quot;75%&quot;&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#ffffff&quot;/&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;25%&quot; stop-color=&quot;&#x27;+colors[0]+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;&#x27;+colors[1]+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;/radialGradient&gt;&lt;/defs&gt;&#x27; +
      &#x27;&lt;path d=&quot;M50 100 L46 108 L54 108 Z&quot; fill=&quot;&#x27;+colors[1]+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M50 108 q-6 6 0 12 q6 -6 0 -12&quot; stroke=&quot;&#x27;+colors[1]+&#x27;&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;50&quot; rx=&quot;40&quot; ry=&quot;48&quot; fill=&quot;url(#&#x27;+g+&#x27;)&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;36&quot; cy=&quot;34&quot; rx=&quot;10&quot; ry=&quot;14&quot; fill=&quot;rgba(255,255,255,0.45)&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  // ---------- Particles (fade out within 2s) ----------
  function burst(cx, cy, colors, big) {
    var count = big ? 26 : 12;
    for (var i=0;i&lt;count;i++){
      var p = document.createElement(&#x27;div&#x27;);
      var s = (big? 8:5) + Math.random()*(big?8:6);
      p.style.position=&#x27;absolute&#x27;; p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
      p.style.width=s+&#x27;px&#x27;; p.style.height=s+&#x27;px&#x27;; p.style.borderRadius=&#x27;50%&#x27;;
      p.style.background = big ? (Math.random()&lt;0.5?&#x27;#ff9f43&#x27;:&#x27;#ffd166&#x27;) : colors[Math.random()&lt;0.5?0:1];
      p.style.pointerEvents=&#x27;none&#x27;; p.style.zIndex=40;
      p.style.boxShadow=&#x27;0 0 6px &#x27;+(big?&#x27;#ff6b35&#x27;:colors[0]);
      board.appendChild(p);
      var ang = Math.random()*Math.PI*2, spd = (big?3:1.5)+Math.random()*(big?4:3);
      var vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd - 1;
      var startT = performance.now();
      var LIFE = 2000; // fade fully within 2 seconds
      (function anim(now){
        var t = (now - startT);
        var frac = t / LIFE;
        vy += 0.15;
        cx += vx; cy += vy;
        vx *= 0.98; vy *= 0.98;
        p.style.left = cx+&#x27;px&#x27;; p.style.top = cy+&#x27;px&#x27;;
        p.style.opacity = Math.max(0, 1 - frac);
        if (frac &lt; 1 &amp;&amp; p.parentNode) requestAnimationFrame(anim);
        else if (p.parentNode) p.parentNode.removeChild(p);
      })(startT);
    }
  }

  // ---------- Balloon logic ----------
  function currentSpawnInterval() {
    var v = 1500 - elapsed/60000 * 1100;
    return Math.max(420, v);
  }

  function tryFindSpot(size) {
    for (var attempt=0; attempt&lt;30; attempt++){
      var x = Math.random()*(BOARD_W - size);
      var y = Math.random()*(BOARD_H - size*1.25);
      var ok = true;
      for (var i=0;i&lt;balloons.length;i++){
        var b = balloons[i];
        if (b.popped) continue;
        var dx = (x - b.x), dy = (y - b.y);
        if (Math.abs(dx) &lt; (size+b.size)*0.45 &amp;&amp; Math.abs(dy) &lt; (size+b.size)*0.55) { ok=false; break; }
      }
      if (ok) return {x:x, y:y};
    }
    return null;
  }

  function scoreForSize(size) {
    return Math.max(1, Math.round((90 - size) / 8));
  }

  function spawnBalloon() {
    if (!running) return;
    var isBomb = Math.random() &lt; 0.14;
    var size = 42 + Math.random()*44;
    var spot = tryFindSpot(size);
    if (!spot) { endGame(&#x27;The sky filled up with balloons!&#x27;); return; }
    var colors = COLORS[Math.floor(Math.random()*COLORS.length)];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;balloon pop-in&#x27;;
    el.innerHTML = balloonSVG(size, colors, isBomb);
    el.style.left = spot.x+&#x27;px&#x27;;
    el.style.top = spot.y+&#x27;px&#x27;;
    el.style.width = size+&#x27;px&#x27;;
    // homeX/homeY = anchor point the balloon bobs around (never drifts away)
    var obj = {
      el:el, homeX:spot.x, homeY:spot.y, x:spot.x, y:spot.y,
      size:size, colors:colors, isBomb:isBomb,
      phaseX:Math.random()*6.28, phaseY:Math.random()*6.28,
      ampX: 4 + Math.random()*6, ampY: 3 + Math.random()*5,
      speedX: 0.02 + Math.random()*0.02, speedY: 0.025 + Math.random()*0.025,
      popped:false
    };
    el.addEventListener(&#x27;mousedown&#x27;, function(ev){ ev.stopPropagation(); popBalloon(obj); });
    board.appendChild(el);
    balloons.push(obj);
  }

  function removeBalloon(obj) {
    var idx = balloons.indexOf(obj);
    if (idx&gt;=0) balloons.splice(idx,1);
    if (obj.el.parentNode) obj.el.parentNode.removeChild(obj.el);
  }

  function popBalloon(obj) {
    if (obj.popped || !running) return;
    obj.popped = true;
    var cx = obj.x + obj.size/2, cy = obj.y + obj.size*0.6;
    if (obj.isBomb) {
      bombSound();
      burst(cx, cy, obj.colors, true);
      var radius = 155;
      var toPop = [];
      for (var i=0;i&lt;balloons.length;i++){
        var b = balloons[i];
        if (b===obj || b.popped) continue;
        var bx = b.x+b.size/2, by = b.y+b.size*0.6;
        var d = Math.hypot(bx-cx, by-cy);
        if (d &lt; radius) toPop.push(b);
      }
      removeBalloon(obj);
      score += 5;
      toPop.forEach(function(b, k){
        b.popped = true;
        setTimeout(function(){
          if (b.el.parentNode){
            burst(b.x+b.size/2, b.y+b.size*0.6, b.colors, false);
            popSound(b.size);
            removeBalloon(b);
            score += scoreForSize(b.size);
            scoreEl.textContent = score;
          }
        }, 40*(k+1));
      });
      scoreEl.textContent = score;
    } else {
      popSound(obj.size);
      burst(cx, cy, obj.colors, false);
      removeBalloon(obj);
      score += scoreForSize(obj.size);
      scoreEl.textContent = score;
    }
  }

  function frame(ts) {
    if (!running) return;
    if (!lastFrame) lastFrame = ts;
    var dt = ts - lastFrame; lastFrame = ts;
    elapsed += dt;
    for (var i=balloons.length-1;i&gt;=0;i--){
      var b = balloons[i];
      if (b.popped) continue;
      // gentle bobbing around the anchor point — stays on screen
      b.phaseX += b.speedX;
      b.phaseY += b.speedY;
      b.x = b.homeX + Math.sin(b.phaseX) * b.ampX;
      b.y = b.homeY + Math.sin(b.phaseY) * b.ampY;
      b.el.style.left = b.x+&#x27;px&#x27;;
      b.el.style.top = b.y+&#x27;px&#x27;;
    }
    animId = requestAnimationFrame(frame);
  }

  function scheduleSpawn() {
    if (!running) return;
    spawnBalloon();
    spawnTimer = setTimeout(scheduleSpawn, currentSpawnInterval());
  }

  function clearAll() {
    balloons.forEach(function(b){ if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    balloons = [];
  }

  function startGame() {
    if (running) return;
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
    running = true;
    score = 0; elapsed = 0; lastFrame = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    startMenu.classList.add(&#x27;hidden&#x27;);
    endMenu.classList.add(&#x27;hidden&#x27;);
    clearAll();
    spawnBalloon();
    spawnTimer = setTimeout(scheduleSpawn, 1200);
    animId = requestAnimationFrame(frame);
  }

  function endGame(reason) {
    if (!running) return;
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    gameOverSound();
    if (score &gt; best) { best = score; bestEl.textContent = best; }
    finalScoreEl.textContent = score;
    endReasonEl.textContent = reason || &#x27;The sky got too full!&#x27;;
    endMenu.classList.remove(&#x27;hidden&#x27;);
  }

  function stopGame() {
    if (!running) {
      if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer=null; }
      if (animId) { cancelAnimationFrame(animId); animId=null; }
      return;
    }
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
