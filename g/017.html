    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a14; color: #e0e0f0; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: #0a0a14; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; color: #fff; text-shadow: 0 0 8px #0ff, 0 0 16px #0ff; }
  .instructions { font-size: 16px; color: #9090b0; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }

  .block { position: absolute; box-sizing: border-box; border-radius: 3px; }
  .block.flash { animation: flash 0.35s ease-out; }
  @keyframes flash {
    0% { background: #fff !important; box-shadow: 0 0 18px #fff, 0 0 30px #fff !important; }
    100% { background: #fff !important; opacity: 0; transform: scale(1.3); }
  }

  .bonus.show { animation: pop 1s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(0.5); }

    70% { opacity: 1; transform: scale(1); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Neon Blocos&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Mova a peça com &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, gire com &lt;strong&gt;&amp;uarr;&lt;/strong&gt; e acelere a queda com &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Quando uma linha fica cheia ela pisca, some e você ganha pontos — use o botão Iniciar abaixo do jogo.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Pontos: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;bonus&quot; id=&quot;bonus&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null, locked = false;
  var grid = [];
  var piece = null;
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bonusEl = document.getElementById(&#x27;bonus&#x27;);

  var SHAPES = {
    I: { color: &#x27;#00faff&#x27;, rot: [
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:3,y:1}],
      [{x:2,y:0},{x:2,y:1},{x:2,y:2},{x:2,y:3}]
    ]},
    O: { color: &#x27;#ffe600&#x27;, rot: [
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:2,y:1}]
    ]},
    T: { color: &#x27;#d000ff&#x27;, rot: [
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:2}]
    ]},
    S: { color: &#x27;#00ff66&#x27;, rot: [
      [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:2,y:2}]
    ]},
    Z: { color: &#x27;#ff2a6d&#x27;, rot: [
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}],
      [{x:2,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}]
    ]},
    J: { color: &#x27;#2a6dff&#x27;, rot: [
      [{x:0,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:2,y:2}],
      [{x:1,y:0},{x:1,y:1},{x:0,y:2},{x:1,y:2}]
    ]},
    L: { color: &#x27;#ff9500&#x27;, rot: [
      [{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:2,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:0,y:2}],
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:1,y:2}]
    ]}
  };
  var KEYS = Object.keys(SHAPES);

  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;;
      o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var rots = SHAPES[p.type].rot;
    var base = rots[p.r % rots.length];
    var out = [];
    for (var i = 0; i &lt; base.length; i++) {
      out.push({ x: base[i].x + p.x, y: base[i].y + p.y });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var type = KEYS[Math.floor(Math.random() * KEYS.length)];
    piece = { type: type, r: 0, x: 3, y: 0 };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    var color = SHAPES[piece.type].color;
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = color;
    }
    piece = null;
    beep(180, 0.08);
  }

  function showBonus(text, color) {
    bonusEl.textContent = text;
    bonusEl.style.color = color;
    bonusEl.style.textShadow = &#x27;0 0 10px &#x27; + color + &#x27;, 0 0 20px &#x27; + color;
    bonusEl.classList.remove(&#x27;show&#x27;);
    void bonusEl.offsetWidth;
    bonusEl.classList.add(&#x27;show&#x27;);
  }

  // Encontra as linhas cheias sem removê-las ainda.
  function findFullRows() {
    var full = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var isFull = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { isFull = false; break; }
      if (isFull) full.push(r);
    }
    return full;
  }

  // Faz as linhas piscarem, depois remove e pontua.
  function handleClears(onDone) {
    var full = findFullRows();
    if (full.length === 0) { onDone(); return; }

    // Pisca os blocos das linhas cheias.
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    for (var i = 0; i &lt; blocks.length; i++) {
      var by = parseInt(blocks[i].dataset.row, 10);
      if (full.indexOf(by) !== -1) blocks[i].classList.add(&#x27;flash&#x27;);
    }

    var cleared = full.length;
    if (cleared === 1) beep(440, 0.15);
    else if (cleared === 2) beep(523, 0.2);
    else if (cleared === 3) beep(659, 0.25);
    else beep(784, 0.35);

    // Espera a animação de flash terminar, então remove as linhas.
    setTimeout(function () {
      full.sort(function (a, b) { return a - b; });
      for (var k = full.length - 1; k &gt;= 0; k--) {
        grid.splice(full[k], 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
      }
      var points = 0;
      if (cleared === 1) { points = 1; }
      else if (cleared === 2) { points = 3; showBonus(&#x27;DUPLO! +3&#x27;, &#x27;#00ff66&#x27;); }
      else if (cleared === 3) { points = 6; showBonus(&#x27;TRIPLO! +6&#x27;, &#x27;#d000ff&#x27;); }
      else { points = 12; showBonus(&#x27;TETRIS! +12&#x27;, &#x27;#00faff&#x27;); }
      score += points;
      scoreEl.textContent = score;
      paint();
      onDone();
    }, 350);
  }

  function paint() {
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    for (var i = 0; i &lt; blocks.length; i++) blocks[i].remove();
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      var color = SHAPES[piece.type].color;
      for (var i2 = 0; i2 &lt; cells.length; i2++) {
        if (cells[i2].y &gt;= 0) drawBlock(cells[i2].x, cells[i2].y, color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.dataset.row = cy;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    el.style.boxShadow = &#x27;0 0 8px &#x27; + color + &#x27;, inset 0 0 4px rgba(255,255,255,0.5)&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece || locked) return;
    var next = { type: piece.type, r: piece.r, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      paint();
      // Verifica e limpa linhas com animação; pausa a queda enquanto isso.
      var full = findFullRows();
      if (full.length &gt; 0) {
        locked = true;
        handleClears(function () {
          locked = false;
          if (!spawnPiece()) { endGame(); paint(); return; }
          paint();
        });
      } else {
        if (!spawnPiece()) { endGame(); paint(); return; }
        paint();
      }
    } else {
      piece = next;
      paint();
    }
  }

  function move(dx) {
    if (!running || !piece || locked) return;
    var next = { type: piece.type, r: piece.r, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function rotate() {
    if (!running || !piece || locked) return;
    var rots = SHAPES[piece.type].rot;
    var nr = (piece.r + 1) % rots.length;
    var offsets = [0, -1, 1, -2, 2];
    for (var i = 0; i &lt; offsets.length; i++) {
      var next = { type: piece.type, r: nr, x: piece.x + offsets[i], y: piece.y };
      if (!collides(next)) { piece = next; paint(); return; }
    }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    beep(120, 0.4, &#x27;sawtooth&#x27;);
    showBonus(&#x27;FIM DE JOGO&#x27;, &#x27;#ff2a6d&#x27;);
  }

  function startGame() {
    running = false;
    locked = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    bonusEl.classList.remove(&#x27;show&#x27;);
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    dropId = setInterval(stepDown, DROP_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = { type: &#x27;T&#x27;, r: 0, x: 3, y: 0 };
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
