<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebble Ball: Melody Demolition</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Pebble Ball: Melody Demolition</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1a1035; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; background: linear-gradient(90deg,#ff4fa3,#ffd93d,#4fd1ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #cbb8ff; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 20px; font-size: 20px; font-weight: 600; }
  .hud .lbl { color: #9d86e0; }
  canvas { background: radial-gradient(circle at 50% 60%, #2a1a5e, #12082a); border-radius: 12px; box-shadow: 0 0 30px rgba(120,80,255,.4); display: block; }
  .msg { font-size: 18px; color: #ffd93d; height: 22px; margin: 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Pebble Ball: Melody Demolition&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your paddle with the mouse (or arrow keys) to bounce the pebble into the house — each brick plays a musical note as it shatters. Knock down the whole house before your lives run out; use Start/Restart below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Bricks&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Best&lt;/span&gt; &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Lives&lt;/span&gt; &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;p class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press Start to play!&lt;/p&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;),
      livesEl = document.getElementById(&#x27;lives&#x27;), msgEl = document.getElementById(&#x27;msg&#x27;);

  var running = false, animId = null;
  var score = 0, best = 0, lives = 3;
  var paddle = { w: 110, h: 16, x: W/2 - 55, y: H - 30 };
  var ball = { x: W/2, y: 260, r: 12, vx: 3, vy: -4, hue: 320 };

  // ---- Musical scale (C major pentatonic-ish, two octaves) ----
  // note frequencies used to tune bricks by row
  var SCALE = [
    261.63, 293.66, 329.63, 392.00, 440.00, // C4 D4 E4 G4 A4
    523.25, 587.33, 659.25, 783.99, 880.00  // C5 D5 E5 G5 A5
  ];

  // ---- House made of bricks ----
  var BRICK_W = 46, BRICK_H = 20, GAP = 4;
  var HOUSE_COLS = 9;
  var houseX = (W - (HOUSE_COLS*(BRICK_W+GAP)-GAP)) / 2;
  var houseTop = 20;
  var bricks = [];
  var particles = [];

  // hue per pitch so the house is a rainbow of tones
  function noteColor(noteIndex) {
    return &#x27;hsl(&#x27; + (noteIndex * 34) + &#x27;,70%,55%)&#x27;;
  }

  function buildHouse() {
    bricks = [];
    var wallRows = 4;
    // rows counted top(0) to bottom of drawing; pitch: top rows = high notes
    // roof: 3 narrowing rows (rows 0,1,2)
    var roofSpecs = [ {row:0, start:3, end:HOUSE_COLS-3}, {row:1, start:2, end:HOUSE_COLS-2}, {row:2, start:1, end:HOUSE_COLS-1} ];
    roofSpecs.forEach(function(rs){
      for (var c = rs.start; c &lt; rs.end; c++) bricks.push(makeBrick(c, rs.row));
    });
    // wall rows 3..6
    for (var r = 0; r &lt; wallRows; r++) {
      for (var c = 0; c &lt; HOUSE_COLS; c++) {
        if (r === wallRows-1 &amp;&amp; c === 4) continue; // door gap
        bricks.push(makeBrick(c, r + 3));
      }
    }
  }
  function makeBrick(c, r) {
    // highest row -&gt; highest note index. total rows = 7 (0..6)
    var noteIndex = Math.max(0, Math.min(SCALE.length-1, (6 - r) + (c % 2)));
    return {
      x: houseX + c*(BRICK_W+GAP),
      y: houseTop + r*(BRICK_H+GAP),
      w: BRICK_W, h: BRICK_H, alive: true,
      note: noteIndex, color: noteColor(noteIndex)
    };
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w/2;
    ball.y = paddle.y - 40;
    ball.vx = (Math.random()*4 - 2);
    ball.vy = -4.5;
    ball.hue = Math.floor(Math.random()*360);
  }

  function drawBall() {
    var g = ctx.createRadialGradient(ball.x-4, ball.y-4, 2, ball.x, ball.y, ball.r);
    g.addColorStop(0, &#x27;hsl(&#x27;+ball.hue+&#x27;,100%,80%)&#x27;);
    g.addColorStop(1, &#x27;hsl(&#x27;+ball.hue+&#x27;,90%,50%)&#x27;);
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.shadowColor = &#x27;hsl(&#x27;+ball.hue+&#x27;,100%,60%)&#x27;;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawPaddle() {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8); }
    else { ctx.rect(paddle.x, paddle.y, paddle.w, paddle.h); }
    var pg = ctx.createLinearGradient(paddle.x, 0, paddle.x+paddle.w, 0);
    pg.addColorStop(0,&#x27;#ff4fa3&#x27;); pg.addColorStop(.5,&#x27;#ffd93d&#x27;); pg.addColorStop(1,&#x27;#4fd1ff&#x27;);
    ctx.fillStyle = pg;
    ctx.shadowColor = &#x27;#7a50ff&#x27;; ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawBricks() {
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = &#x27;rgba(255,255,255,.22)&#x27;;
      ctx.fillRect(b.x, b.y, b.w, 4);
      ctx.strokeStyle = &#x27;rgba(0,0,0,.3)&#x27;;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i &lt; 8; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random()*4-2), vy: (Math.random()*-3-1),
        life: 30, color: color
      });
    }
  }
  function updateParticles() {
    for (var i = particles.length-1; i &gt;= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
      if (p.life &lt;= 0) { particles.splice(i,1); continue; }
      ctx.globalAlpha = p.life/30;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 5, 5);
      ctx.globalAlpha = 1;
    }
  }

  var actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {} }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) { try { actx.resume(); } catch(_){} }
  }
  // musical note with a bell-like tone
  function playNote(freq) {
    ensureAudio();
    if (!actx) return;
    try {
      var t = actx.currentTime;
      var o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;sine&#x27;; o2.type = &#x27;triangle&#x27;;
      o.frequency.value = freq; o2.frequency.value = freq * 2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); o2.connect(g); g.connect(actx.destination);
      o.start(t); o2.start(t); o.stop(t + 0.5); o2.stop(t + 0.5);
    } catch (_) {}
  }
  // simple percussive click for walls/paddle
  function tick_sound(freq, type) {
    ensureAudio();
    if (!actx) return;
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type = type || &#x27;triangle&#x27;;
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.12);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.12);
    } catch (_) {}
  }

  function bricksLeft() {
    var n = 0;
    for (var i = 0; i &lt; bricks.length; i++) if (bricks[i].alive) n++;
    return n;
  }

  function tick() {
    if (!running) return;
    ctx.clearRect(0, 0, W, H);

    ball.x += ball.vx; ball.y += ball.vy;

    if (ball.x - ball.r &lt; 0) { ball.x = ball.r; ball.vx = -ball.vx; tick_sound(300); }
    if (ball.x + ball.r &gt; W) { ball.x = W - ball.r; ball.vx = -ball.vx; tick_sound(300); }
    if (ball.y - ball.r &lt; 0) { ball.y = ball.r; ball.vy = -ball.vy; tick_sound(300); }

    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r &gt; b.x &amp;&amp; ball.x - ball.r &lt; b.x + b.w &amp;&amp;
          ball.y + ball.r &gt; b.y &amp;&amp; ball.y - ball.r &lt; b.y + b.h) {
        b.alive = false;
        var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX &lt; overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
        playNote(SCALE[b.note]);
        score++;
        scoreEl.textContent = score;
        if (score &gt; best) { best = score; bestEl.textContent = best; }
        ball.hue = (b.note * 34) % 360;
        if (bricksLeft() === 0) {
          msgEl.textContent = &#x27;House demolished! You win with &#x27;+score+&#x27; bricks! Press Start to play again.&#x27;;
          drawBricks(); drawPaddle(); drawBall();
          stopGame();
          return;
        }
        break;
      }
    }

    if (ball.vy &gt; 0 &amp;&amp; ball.y + ball.r &gt;= paddle.y &amp;&amp;
        ball.y + ball.r &lt;= paddle.y + paddle.h + 12 &amp;&amp;
        ball.x &gt;= paddle.x - ball.r &amp;&amp; ball.x &lt;= paddle.x + paddle.w + ball.r) {
      ball.vy = -Math.abs(ball.vy);
      var hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      ball.vx = hit * 5;
      var speed = Math.min(Math.hypot(ball.vx, ball.vy), 8);
      var ang = Math.atan2(ball.vy, ball.vx);
      ball.vx = Math.cos(ang)*speed; ball.vy = Math.sin(ang)*speed;
      tick_sound(360);
    }

    if (ball.y - ball.r &gt; H) {
      lives--;
      livesEl.textContent = lives;
      tick_sound(140, &#x27;sawtooth&#x27;);
      if (lives &lt;= 0) {
        msgEl.textContent = &#x27;Out of lives! You smashed &#x27;+score+&#x27; bricks. Press Start to try again.&#x27;;
        stopGame();
        return;
      } else {
        resetBall();
      }
    }

    drawBricks();
    updateParticles();
    drawPaddle();
    drawBall();
    animId = requestAnimationFrame(tick);
  }

  function movePaddleTo(x) {
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w/2));
  }

  cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = cv.getBoundingClientRect();
    movePaddleTo((e.clientX - rect.left) * (W / rect.width));
  });
  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) movePaddleTo(paddle.x + paddle.w/2 - 30);
    if (e.key === &#x27;ArrowRight&#x27;) movePaddleTo(paddle.x + paddle.w/2 + 30);
  });

  function drawStatic() {
    ctx.clearRect(0,0,W,H);
    drawBricks(); drawPaddle(); drawBall();
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0; lives = 3;
    scoreEl.textContent = &#x27;0&#x27;; livesEl.textContent = &#x27;3&#x27;;
    msgEl.textContent = &#x27;Make some music!&#x27;;
    particles = [];
    buildHouse();
    paddle.x = W/2 - paddle.w/2;
    resetBall();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  buildHouse();
  drawStatic();

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
