<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐍 Feast Frenzy</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐍 Feast Frenzy</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: radial-gradient(circle at 50% 0%, #1a1c44, #0d0e22 70%); color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: .5px; background: linear-gradient(90deg,#ff5f6d,#ffc371,#5fff8f,#5f9bff,#ff8fe0); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite; }
  @keyframes shimmer { to { background-position: 200% center; } }
  .instructions { font-size: 16px; color: #b9b9d0; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }
  .hud { display: flex; gap: 12px; font-size: 16px; align-items: center; flex-wrap: wrap; justify-content: center; background: rgba(255,255,255,0.04); padding: 5px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
  .hud .val { font-weight: 800; color: #ffe27a; }
  .combo { color: #ff8fe0; font-weight: 800; min-width: 74px; text-align: center; }
  .bar { width: 600px; max-width: 92vw; height: 9px; background: #23244a; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 4px rgba(0,0,0,.5); }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#5fff8f,#5f9bff,#ff8fe0); background-size: 200% auto; animation: shimmer 3s linear infinite; transition: width .25s; }
  .badges { display: flex; gap: 10px; font-size: 15px; min-height: 22px; }
  .badge { padding: 2px 9px; border-radius: 11px; font-weight: 700; animation: pulseb 1s ease-in-out infinite; }
  @keyframes pulseb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .badge.shield { background: rgba(95,155,255,.25); color: #8fbaff; }
  .badge.slow { background: rgba(255,180,80,.25); color: #ffcf7a; }
  .fieldwrap { position: relative; }
  canvas { background: #14153300; border-radius: 12px; display: block; box-shadow: 0 0 30px rgba(95,155,255,.18); border: 1px solid rgba(255,255,255,0.05); }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: rgba(10,10,28,.9); border-radius: 12px; gap: 8px; overflow: hidden; padding: 20px; box-sizing: border-box; }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 34px; z-index: 2; }
  .overlay p { margin: 2px; font-size: 16px; color: #cfd0ea; z-index: 2; line-height: 1.4; }
  .win h2 { color: #5fff8f; animation: pop .5s ease; }
  .lose h2 { color: #ff6d7d; animation: shake .5s ease; }
  .menu h2 { font-size: 30px; background: linear-gradient(90deg,#ff5f6d,#ffc371,#5fff8f,#5f9bff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .legend { z-index:2; display:flex; flex-direction:column; gap:5px; font-size:15px; color:#cfd0ea; margin-top:4px; }
  .legend div { display:flex; align-items:center; gap:8px; justify-content:center; }
  .hint { z-index:2; margin-top:8px; font-size:15px; color:#8fbaff; animation: pulseb 1.4s ease-in-out infinite; }
  @keyframes pop { 0%{transform:scale(.3);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐍 Feast Frenzy&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrows to eat glowing food and reach 25 points; grab 🛡️ shields for invincibility and ⏱️ clocks for slow-motion, and dodge the gray walls. Eat fast for combo bonuses — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Best: &lt;span class=&quot;val&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Speed: &lt;span class=&quot;val&quot; id=&quot;speed&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;bar&quot;&gt;&lt;div class=&quot;bar-fill&quot; id=&quot;barfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;badges&quot; id=&quot;badges&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;fieldwrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;410&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay show menu&quot; id=&quot;overlay&quot;&gt;
      &lt;h2 id=&quot;ovTitle&quot;&gt;🐍 Feast Frenzy&lt;/h2&gt;
      &lt;p id=&quot;ovMsg&quot;&gt;Grow your rainbow snake and reach &lt;b&gt;25 points&lt;/b&gt; to win!&lt;/p&gt;
      &lt;div class=&quot;legend&quot; id=&quot;legend&quot;&gt;
        &lt;div&gt;🍎 Food — grow &amp;amp; score&lt;/div&gt;
        &lt;div&gt;🛡️ Shield — pass through walls &amp;amp; tail&lt;/div&gt;
        &lt;div&gt;⏱️ Clock — slow everything down&lt;/div&gt;
        &lt;div&gt;⬜ Gray walls — avoid them!&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hint&quot; id=&quot;hint&quot;&gt;▶ Press the Start button below to play&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 30, ROWS = 20;
  var GOAL = 25;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;), barfill = document.getElementById(&#x27;barfill&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;), badgesEl = document.getElementById(&#x27;badges&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;), ovTitle = document.getElementById(&#x27;ovTitle&#x27;), ovMsg = document.getElementById(&#x27;ovMsg&#x27;);
  var legend = document.getElementById(&#x27;legend&#x27;), hint = document.getElementById(&#x27;hint&#x27;);

  var running = false;
  var snake, dir, pendingDir, food, score = 0, best = 0, speedLevel = 1;
  var baseTickMs = 155, tickMs = 155, moveAcc = 0, lastTime = 0, rafId = null;
  var pops = [], particles = [], obstacles = [], powerups = [];
  var confetti = [];
  var shieldUntil = 0, slowUntil = 0;
  var combo = 0, lastEatTime = 0, comboFlash = 0;
  var COMBO_WINDOW = 2800;
  var menuAnim = 0;

  // ---- Sound ----
  var actx = null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq,dur,type,vol,slide){ var a=ac(); if(!a) return; var o=a.createOscillator(),g=a.createGain(); o.type=type||&#x27;square&#x27;; o.frequency.value=freq; if(slide){ o.frequency.linearRampToValueAtTime(slide, a.currentTime+dur); } g.gain.value=vol||0.08; o.connect(g); g.connect(a.destination); var t=a.currentTime; g.gain.setValueAtTime(g.gain.value,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur); }
  function crunch(){ beep(480,0.07,&#x27;square&#x27;,0.08,620); setTimeout(function(){beep(780,0.06,&#x27;triangle&#x27;,0.06);},35); }
  function comboSound(n){ beep(500+n*70,0.1,&#x27;triangle&#x27;,0.08,700+n*90); }
  function powerSound(){ [660,880,1180].forEach(function(f,i){ setTimeout(function(){beep(f,0.11,&#x27;triangle&#x27;,0.08);},i*60); }); }
  function loseSound(){ beep(240,0.22,&#x27;sawtooth&#x27;,0.1,120); setTimeout(function(){beep(120,0.4,&#x27;sawtooth&#x27;,0.1,70);},130); }
  function winSound(){ [523,659,784,1047,1319,1568].forEach(function(f,i){ setTimeout(function(){beep(f,0.2,&#x27;triangle&#x27;,0.09);},i*110); }); }

  function initSnake(){ snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}]; dir={x:1,y:0}; pendingDir={x:1,y:0}; for(var k=0;k&lt;snake.length;k++){snake[k].px=snake[k].x;snake[k].py=snake[k].y;} }
  function occupiedSnake(x,y){ for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true; return false; }
  function isObstacle(x,y){ for(var i=0;i&lt;obstacles.length;i++) if(obstacles[i].x===x&amp;&amp;obstacles[i].y===y) return true; return false; }
  function anyOccupied(x,y){ return occupiedSnake(x,y)||isObstacle(x,y)||(food&amp;&amp;food.x===x&amp;&amp;food.y===y); }
  function randFree(){ for(var t=0;t&lt;400;t++){ var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS); if(!anyOccupied(x,y)) return {x:x,y:y}; } return {x:1,y:1}; }
  function placeFood(){ food = randFree(); }

  function maybeAddObstacle(){
    // gentler: cap lower, keep away from head &amp; food
    if(obstacles.length &lt; Math.min(12, 2 + Math.floor(score/3))){
      for(var t=0;t&lt;20;t++){
        var p=randFree(), h=snake[0];
        if(Math.abs(p.x-h.x)+Math.abs(p.y-h.y) &gt; 4 &amp;&amp; Math.abs(p.x-food.x)+Math.abs(p.y-food.y) &gt; 2){ obstacles.push(p); return; }
      }
    }
  }
  function maybeSpawnPowerup(){
    if(powerups.length &gt;= 2) return;
    if(Math.random() &lt; 0.45){
      var p=randFree();
      var type=Math.random()&lt;0.5?&#x27;shield&#x27;:&#x27;slow&#x27;;
      powerups.push({x:p.x,y:p.y,type:type,born:performance.now(),life:9000});
    }
  }

  function updateSpeed(){
    speedLevel = 1 + Math.floor(score/4);           // gentler ramp
    baseTickMs = Math.max(75, 155 - (speedLevel-1)*8);
    speedEl.textContent = speedLevel;
  }

  function spawnParticles(px,py,color,n){
    for(var i=0;i&lt;n;i++){ var a=Math.random()*Math.PI*2, sp=1+Math.random()*3.2; particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color}); }
  }

  var hue = 120;
  function drawBoardBg(){
    ctx.fillStyle=&#x27;#15163a&#x27;; roundRect(0,0,cv.width,cv.height,12); ctx.fill();
    ctx.strokeStyle=&#x27;rgba(255,255,255,0.03)&#x27;;
    for(var gx=0;gx&lt;=COLS;gx++){ ctx.beginPath(); ctx.moveTo(gx*CELL,0); ctx.lineTo(gx*CELL,cv.height); ctx.stroke(); }
    for(var gy=0;gy&lt;=ROWS;gy++){ ctx.beginPath(); ctx.moveTo(0,gy*CELL); ctx.lineTo(cv.width,gy*CELL); ctx.stroke(); }
  }

  function draw(now){
    var slow=now&lt;slowUntil, shield=now&lt;shieldUntil;
    ctx.clearRect(0,0,cv.width,cv.height);
    drawBoardBg();

    for(var o=0;o&lt;obstacles.length;o++){ var ob=obstacles[o];
      ctx.fillStyle=&#x27;#4a4d70&#x27;; roundRect(ob.x*CELL+2,ob.y*CELL+2,CELL-4,CELL-4,3); ctx.fill();
      ctx.fillStyle=&#x27;rgba(255,255,255,0.08)&#x27;; roundRect(ob.x*CELL+3,ob.y*CELL+3,CELL-6,5,2); ctx.fill();
    }
    for(var pu=0;pu&lt;powerups.length;pu++){ var w=powerups[pu];
      var age=(now-w.born)/w.life, wob=0.6+0.4*Math.sin(now/150);
      var cx=w.x*CELL+CELL/2, cy=w.y*CELL+CELL/2;
      ctx.save(); ctx.globalAlpha= age&gt;0.75 ? (Math.sin(now/80)&gt;0?1:0.35):1;
      ctx.shadowBlur=12+6*wob; ctx.shadowColor= w.type===&#x27;shield&#x27;?&#x27;#5f9bff&#x27;:&#x27;#ffcf7a&#x27;;
      ctx.font=&#x27;16px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(w.type===&#x27;shield&#x27;?&#x27;🛡️&#x27;:&#x27;⏱️&#x27;,cx,cy); ctx.restore();
    }

    var pulse=0.5+0.5*Math.sin(now/180);
    var fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2;
    ctx.save(); ctx.shadowColor=&#x27;#ffcf4a&#x27;; ctx.shadowBlur=12+8*pulse; ctx.fillStyle=&#x27;#ffcf4a&#x27;;
    ctx.beginPath(); ctx.arc(fx,fy,CELL/2-2+pulse*2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;rgba(255,255,255,0.5)&#x27;; ctx.beginPath(); ctx.arc(fx-3,fy-3,2,0,Math.PI*2); ctx.fill(); ctx.restore();

    var frac=Math.min(1,moveAcc/tickMs);
    for(var i=snake.length-1;i&gt;=0;i--){
      var s=snake[i];
      var px0=(s.px!==undefined?s.px:s.x), py0=(s.py!==undefined?s.py:s.y);
      var ix= px0+(s.x- px0)*frac, iy=py0+(s.y-py0)*frac;
      var h=(hue+i*8)%360, isHead=i===0;
      if(shield){ ctx.fillStyle=&#x27;hsl(&#x27;+((now/6+i*20)%360)+&#x27;,85%,66%)&#x27;; }
      else { ctx.fillStyle=&#x27;hsl(&#x27;+h+&#x27;,80%,&#x27;+(isHead?63:55)+&#x27;%)&#x27;; }
      ctx.save();
      if(shield){ ctx.shadowColor=&#x27;#8fbaff&#x27;; ctx.shadowBlur=14; }
      else if(isHead){ ctx.shadowColor=&#x27;hsl(&#x27;+h+&#x27;,90%,60%)&#x27;; ctx.shadowBlur=10; }
      var px=ix*CELL, py=iy*CELL;
      roundRect(px+1.5,py+1.5,CELL-3,CELL-3,5); ctx.fill(); ctx.restore();
      if(isHead){
        ctx.fillStyle=&#x27;#fff&#x27;; var ex=px+CELL/2,ey=py+CELL/2,ox=dir.x*4,oy=dir.y*4;
        ctx.beginPath(); ctx.arc(ex-oy*0.6+ox,ey-ox*0.6+oy,2.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex+oy*0.6+ox,ey+ox*0.6+oy,2.5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=&#x27;#222&#x27;;
        ctx.beginPath(); ctx.arc(ex-oy*0.6+ox*1.4,ey-ox*0.6+oy*1.4,1.1,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex+oy*0.6+ox*1.4,ey+ox*0.6+oy*1.4,1.1,0,Math.PI*2); ctx.fill();
      }
    }

    for(var p=pops.length-1;p&gt;=0;p--){ var po=pops[p], pa=(now-po.t)/400;
      if(pa&gt;=1){ pops.splice(p,1); continue; }
      ctx.save(); ctx.globalAlpha=1-pa; ctx.strokeStyle=po.color||&#x27;#ffe27a&#x27;; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(po.x,po.y,6+pa*22,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }
    for(var q=particles.length-1;q&gt;=0;q--){ var pt=particles[q];
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=0.03;
      if(pt.life&lt;=0){ particles.splice(q,1); continue; }
      ctx.save(); ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    if(slow){ ctx.save(); ctx.fillStyle=&#x27;rgba(255,180,80,0.06)&#x27;; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore(); }

    if(comboFlash&gt;0){ ctx.save(); ctx.globalAlpha=Math.min(1,comboFlash); ctx.fillStyle=&#x27;#ff8fe0&#x27;;
      ctx.font=&#x27;bold 26px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;COMBO x&#x27;+combo+&#x27;!&#x27;,cv.width/2,40); ctx.restore(); comboFlash-=0.02; }
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function updateBadges(now){
    var html=&#x27;&#x27;;
    var sh=Math.ceil((shieldUntil-now)/1000), sl=Math.ceil((slowUntil-now)/1000);
    if(sh&gt;0) html+=&#x27;&lt;span class=&quot;badge shield&quot;&gt;🛡️ &#x27;+sh+&#x27;s&lt;/span&gt;&#x27;;
    if(sl&gt;0) html+=&#x27;&lt;span class=&quot;badge slow&quot;&gt;⏱️ &#x27;+sl+&#x27;s&lt;/span&gt;&#x27;;
    badgesEl.innerHTML=html;
  }

  function loop(now){
    if(!running) return;
    if(!lastTime) lastTime=now;
    var dt=now-lastTime; lastTime=now;
    tickMs=(now&lt;slowUntil)?baseTickMs*1.9:baseTickMs;
    moveAcc+=dt; hue=(hue+1.2)%360;
    if(moveAcc&gt;=tickMs){ moveAcc-=tickMs; step(now); }
    if(combo&gt;0 &amp;&amp; now-lastEatTime&gt;COMBO_WINDOW){ combo=0; comboEl.textContent=&#x27;&#x27;; }
    for(var i=powerups.length-1;i&gt;=0;i--){ if(now-powerups[i].born&gt;powerups[i].life) powerups.splice(i,1); }
    updateBadges(now);
    draw(now);
    rafId=requestAnimationFrame(loop);
  }

  function step(now){
    if(!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
    var shielded=now&lt;shieldUntil;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ if(shielded){ nx=Math.max(0,Math.min(COLS-1,nx)); ny=Math.max(0,Math.min(ROWS-1,ny)); } else { endGame(false); return; } }
    for(var k=0;k&lt;snake.length;k++){ snake[k].px=snake[k].x; snake[k].py=snake[k].y; }
    var ate=(nx===food.x&amp;&amp;ny===food.y);
    var body=ate?snake:snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++){ if(body[i].x===nx&amp;&amp;body[i].y===ny){ if(!shielded){ endGame(false); return; } } }
    if(isObstacle(nx,ny)){ if(!shielded){ endGame(false); return; } else { for(var oi=0;oi&lt;obstacles.length;oi++){ if(obstacles[oi].x===nx&amp;&amp;obstacles[oi].y===ny){ spawnParticles(nx*CELL+CELL/2,ny*CELL+CELL/2,&#x27;#8fbaff&#x27;,10); obstacles.splice(oi,1); break; } } } }
    snake.unshift({x:nx,y:ny,px:head.x,py:head.y});
    for(var pu=powerups.length-1;pu&gt;=0;pu--){ if(powerups[pu].x===nx&amp;&amp;powerups[pu].y===ny){ var t=powerups[pu].type; if(t===&#x27;shield&#x27;) shieldUntil=now+7000; else slowUntil=now+6000; spawnParticles(nx*CELL+CELL/2,ny*CELL+CELL/2, t===&#x27;shield&#x27;?&#x27;#8fbaff&#x27;:&#x27;#ffcf7a&#x27;,16); powerups.splice(pu,1); powerSound(); } }
    if(ate){
      if(now-lastEatTime&lt;=COMBO_WINDOW) combo++; else combo=1;
      lastEatTime=now;
      var mult=combo&gt;=2?combo:1;
      score+=mult; scoreEl.textContent=score;
      if(combo&gt;=2){ comboEl.textContent=&#x27;Combo x&#x27;+combo; comboFlash=1; comboSound(combo); } else comboEl.textContent=&#x27;&#x27;;
      if(score&gt;best){ best=score; bestEl.textContent=best; }
      barfill.style.width=Math.min(100,score/GOAL*100)+&#x27;%&#x27;;
      pops.push({x:food.x*CELL+CELL/2,y:food.y*CELL+CELL/2,t:performance.now(),color:&#x27;#ffe27a&#x27;});
      spawnParticles(food.x*CELL+CELL/2,food.y*CELL+CELL/2,&#x27;#ffcf4a&#x27;,12);
      crunch(); updateSpeed();
      if(score&gt;=GOAL){ endGame(true); return; }
      placeFood(); maybeAddObstacle(); maybeSpawnPowerup();
    } else snake.pop();
  }

  function launchConfetti(){
    confetti=[]; var colors=[&#x27;#ff5f6d&#x27;,&#x27;#ffc371&#x27;,&#x27;#5fff8f&#x27;,&#x27;#5f9bff&#x27;,&#x27;#ff8fe0&#x27;,&#x27;#ffe27a&#x27;];
    for(var i=0;i&lt;90;i++) confetti.push({x:Math.random()*cv.width,y:-Math.random()*cv.height,vx:(Math.random()-0.5)*2,vy:2+Math.random()*3,c:colors[i%colors.length],r:3+Math.random()*4,rot:Math.random()*6});
    animConfetti();
  }
  var confettiRaf=null;
  function animConfetti(){
    if(!overlay.classList.contains(&#x27;win&#x27;)){ if(confettiRaf) cancelAnimationFrame(confettiRaf); return; }
    ctx.clearRect(0,0,cv.width,cv.height); drawBoardBg();
    for(var i=0;i&lt;confetti.length;i++){ var c=confetti[i]; c.x+=c.vx; c.y+=c.vy; c.rot+=0.1; if(c.y&gt;cv.height) c.y=-10; ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.fillStyle=c.c; ctx.fillRect(-c.r/2,-c.r/2,c.r,c.r*1.6); ctx.restore(); }
    confettiRaf=requestAnimationFrame(animConfetti);
  }

  // animated idle menu background
  var menuRaf=null;
  function menuLoop(){
    if(running){ if(menuRaf) cancelAnimationFrame(menuRaf); return; }
    if(!overlay.classList.contains(&#x27;menu&#x27;)){ if(menuRaf) cancelAnimationFrame(menuRaf); return; }
    menuAnim+=0.02;
    ctx.clearRect(0,0,cv.width,cv.height); drawBoardBg();
    // drifting glowing dots
    for(var i=0;i&lt;12;i++){
      var t=menuAnim+i*0.7;
      var x=(Math.sin(t*0.6+i)*0.5+0.5)*cv.width;
      var y=(Math.cos(t*0.4+i*1.3)*0.5+0.5)*cv.height;
      var h=(i*40+menuAnim*40)%360;
      ctx.save(); ctx.globalAlpha=0.5; ctx.shadowColor=&#x27;hsl(&#x27;+h+&#x27;,80%,60%)&#x27;; ctx.shadowBlur=14;
      ctx.fillStyle=&#x27;hsl(&#x27;+h+&#x27;,80%,60%)&#x27;; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    menuRaf=requestAnimationFrame(menuLoop);
  }

  function showMenu(){
    overlay.className=&#x27;overlay show menu&#x27;;
    ovTitle.textContent=&#x27;🐍 Feast Frenzy&#x27;;
    ovMsg.innerHTML=&#x27;Grow your rainbow snake and reach &lt;b&gt;25 points&lt;/b&gt; to win!&#x27;;
    legend.style.display=&#x27;flex&#x27;; hint.style.display=&#x27;block&#x27;;
    hint.textContent=&#x27;▶ Press the Start button below to play&#x27;;
    if(menuRaf) cancelAnimationFrame(menuRaf);
    menuLoop();
  }

  function endGame(won){
    running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    overlay.className=&#x27;overlay show &#x27;+(won?&#x27;win&#x27;:&#x27;lose&#x27;);
    legend.style.display=&#x27;none&#x27;; hint.style.display=&#x27;block&#x27;;
    ovTitle.textContent=won?&#x27;🎉 You Win! 🎉&#x27;:&#x27;💥 Game Over&#x27;;
    ovMsg.innerHTML=won?(&#x27;You reached &lt;b&gt;&#x27;+GOAL+&#x27;&lt;/b&gt; points! Best: &lt;b&gt;&#x27;+best+&#x27;&lt;/b&gt;&#x27;):(&#x27;Final Score: &lt;b&gt;&#x27;+score+&#x27;&lt;/b&gt; &amp;nbsp;•&amp;nbsp; Best: &lt;b&gt;&#x27;+best+&#x27;&lt;/b&gt;&#x27;);
    hint.textContent=&#x27;▶ Press Start below to play again&#x27;;
    if(won){ winSound(); launchConfetti(); } else loseSound();
  }

  function startGame(){
    if(confettiRaf){ cancelAnimationFrame(confettiRaf); confettiRaf=null; }
    if(menuRaf){ cancelAnimationFrame(menuRaf); menuRaf=null; }
    overlay.className=&#x27;overlay&#x27;;
    score=0; scoreEl.textContent=&#x27;0&#x27;; combo=0; comboEl.textContent=&#x27;&#x27;; comboFlash=0;
    barfill.style.width=&#x27;0%&#x27;; badgesEl.innerHTML=&#x27;&#x27;;
    shieldUntil=0; slowUntil=0; lastEatTime=0;
    obstacles=[]; powerups=[]; pops=[]; particles=[];
    updateSpeed(); initSnake();
    for(var i=0;i&lt;2;i++) maybeAddObstacle();
    placeFood(); maybeSpawnPowerup();
    moveAcc=0; lastTime=0; running=true; ac();
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(loop);
  }
  function stopGame(){ running=false; if(rafId){ cancelAnimationFrame(rafId); rafId=null; } showMenu(); }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });

  initSnake(); placeFood(); showMenu();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
