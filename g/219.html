<!doctype html>
<html lang="en">
<head>

<title>⚓ Navy Battle</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>⚓ Navy Battle</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0b2a3a; color: #eaf6ff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #bcdcee; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; font-size: 20px; }
  .field { position: relative; width: 620px; height: 430px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden;
    background: linear-gradient(180deg, #1a6fa3 0%, #12588a 40%, #0d3f66 100%); box-shadow: inset 0 0 40px rgba(0,0,0,0.4); }
  .waves { position: absolute; inset: 0; background-image:
    repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 22px);
    animation: swell 6s linear infinite; }
  @keyframes swell { from { background-position-y: 0; } to { background-position-y: 22px; } }
  .ship, .bullet, .ebullet, .target, .powerup, .laser { position: absolute; }
  .powerup { border-radius: 6px; box-shadow: 0 0 12px #6ff, 0 0 22px #0cf; animation: glow 0.8s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 8px #6ff, 0 0 14px #0cf; } to { box-shadow: 0 0 18px #9ff, 0 0 30px #0ef; } }
  .laser { background: linear-gradient(180deg, rgba(120,255,255,0.9), rgba(0,200,255,0.7)); box-shadow: 0 0 14px #6ff, 0 0 26px #0cf; border-radius: 4px; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.6); pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;⚓ Navy Battle&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and press &lt;strong&gt;Space&lt;/strong&gt; to fire; dodge enemy shots or sink after three hits. Grab a glowing crate to unleash an 8‑second continuous laser!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Hull: &lt;span id=&quot;hull&quot;&gt;♥♥♥&lt;/span&gt;&lt;/div&gt;
    &lt;div id=&quot;laserHud&quot; style=&quot;color:#7ff;&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;waves&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 430;
  var SHIP_W = 44, SHIP_H = 34, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 8;
  var EB_W = 6, EB_H = 12, EB_SPEED = 4;
  var TARGET_W = 40, TARGET_H = 34, TARGET_SPEED = 1.4;
  var PU_SIZE = 26, PU_SPEED = 1.6;
  var LASER_W = 10, LASER_DURATION = 8000;
  var SPAWN_INTERVAL = 1300;
  var running = false, animId = null, spawnId = null, puSpawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], ebullets = [], powerups = [];
  var score = 0, hull = 3, gameOver = false;
  var lastShot = 0;
  var laserUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var hullEl = document.getElementById(&#x27;hull&#x27;);
  var laserHud = document.getElementById(&#x27;laserHud&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);
  var ship = null, laserEl = null;

  function makeShip() {
    ship = document.createElement(&#x27;div&#x27;);
    ship.className = &#x27;ship&#x27;;
    ship.style.width = SHIP_W + &#x27;px&#x27;;
    ship.style.height = SHIP_H + &#x27;px&#x27;;
    ship.style.bottom = SHIP_BOTTOM + &#x27;px&#x27;;
    ship.innerHTML = shipSVG(&#x27;#c9d6df&#x27;, &#x27;#1a3a4a&#x27;);
    field.appendChild(ship);
  }

  function shipSVG(hullc, deck) {
    return &#x27;&lt;svg width=&quot;&#x27;+SHIP_W+&#x27;&quot; height=&quot;&#x27;+SHIP_H+&#x27;&quot; viewBox=&quot;0 0 44 34&quot;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;19&quot; y=&quot;2&quot; width=&quot;6&quot; height=&quot;12&quot; fill=&quot;#8a9aa5&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;14&quot; y=&quot;10&quot; width=&quot;16&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;&#x27;+deck+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;8&quot; y=&quot;6&quot; width=&quot;4&quot; height=&quot;10&quot; fill=&quot;#8a9aa5&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M2 18 L42 18 L36 30 L8 30 Z&quot; fill=&quot;&#x27;+hullc+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;2&quot; y=&quot;18&quot; width=&quot;40&quot; height=&quot;3&quot; fill=&quot;#e8eef2&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function boatSVG() {
    return &#x27;&lt;svg width=&quot;&#x27;+TARGET_W+&#x27;&quot; height=&quot;&#x27;+TARGET_H+&#x27;&quot; viewBox=&quot;0 0 40 34&quot;&gt;&#x27; +
      &#x27;&lt;path d=&quot;M2 6 L38 6 L32 20 L8 20 Z&quot; fill=&quot;#7a2b2b&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;16&quot; y=&quot;20&quot; width=&quot;8&quot; height=&quot;10&quot; fill=&quot;#8a9aa5&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;14&quot; y=&quot;0&quot; width=&quot;4&quot; height=&quot;8&quot; fill=&quot;#4a4a4a&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;2&quot; y=&quot;6&quot; width=&quot;36&quot; height=&quot;3&quot; fill=&quot;#a94b4b&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function paintShip() { if (ship) ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    if (!running) return;
    var startX = Math.random() * (FIELD_W - TARGET_W);
    var t = {
      x: startX, y: -TARGET_H, el: null,
      nextShot: Date.now() + 600 + Math.random()*1400,
      baseX: startX, amp: 40 + Math.random()*80,
      phase: Math.random() * Math.PI * 2, freq: 0.02 + Math.random()*0.03
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.width = TARGET_W + &#x27;px&#x27;;
    el.style.height = TARGET_H + &#x27;px&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    el.innerHTML = boatSVG();
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnPowerup() {
    if (!running) return;
    var p = { x: Math.random() * (FIELD_W - PU_SIZE), y: -PU_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.style.width = PU_SIZE + &#x27;px&#x27;;
    el.style.height = PU_SIZE + &#x27;px&#x27;;
    el.style.left = p.x + &#x27;px&#x27;;
    el.style.top = p.y + &#x27;px&#x27;;
    el.style.background = &#x27;radial-gradient(circle at 40% 30%, #cffff, #0af)&#x27;;
    el.style.display = &#x27;flex&#x27;;
    el.style.alignItems = &#x27;center&#x27;;
    el.style.justifyContent = &#x27;center&#x27;;
    el.style.fontSize = &#x27;16px&#x27;;
    el.textContent = &#x27;⚡&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
    beep(520, 0.1, &#x27;sine&#x27;, 0.05);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W/2 - BULLET_W/2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.width = BULLET_W + &#x27;px&#x27;; el.style.height = BULLET_H + &#x27;px&#x27;;
    el.style.background = &#x27;#ffe066&#x27;; el.style.borderRadius = &#x27;2px&#x27;;
    el.style.left = b.x + &#x27;px&#x27;; el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el; bullets.push(b);
    beep(660, 0.06, &#x27;square&#x27;, 0.06);
  }

  function enemyShoot(t) {
    var b = { x: t.x + TARGET_W/2 - EB_W/2, y: t.y + TARGET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ebullet&#x27;;
    el.style.width = EB_W + &#x27;px&#x27;; el.style.height = EB_H + &#x27;px&#x27;;
    el.style.background = &#x27;#ff5a5a&#x27;; el.style.borderRadius = &#x27;3px&#x27;;
    el.style.left = b.x + &#x27;px&#x27;; el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el; ebullets.push(b);
    beep(200, 0.06, &#x27;sawtooth&#x27;, 0.04);
  }

  var audioCtx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function hitHud() { hullEl.textContent = hull &gt; 0 ? &#x27;♥&#x27;.repeat(hull) : &#x27;—&#x27;; }

  function updateLaserVisual(now) {
    var active = now &lt; laserUntil;
    if (active) {
      if (!laserEl) {
        laserEl = document.createElement(&#x27;div&#x27;);
        laserEl.className = &#x27;laser&#x27;;
        laserEl.style.width = LASER_W + &#x27;px&#x27;;
        field.appendChild(laserEl);
      }
      var lx = shipX + SHIP_W/2 - LASER_W/2;
      var topY = 0;
      var bottomY = FIELD_H - SHIP_BOTTOM - SHIP_H;
      laserEl.style.left = lx + &#x27;px&#x27;;
      laserEl.style.top = topY + &#x27;px&#x27;;
      laserEl.style.height = bottomY + &#x27;px&#x27;;
      var secs = Math.ceil((laserUntil - now) / 1000);
      laserHud.textContent = &#x27;⚡ Laser &#x27; + secs + &#x27;s&#x27;;
    } else {
      if (laserEl) { field.removeChild(laserEl); laserEl = null; }
      laserHud.textContent = &#x27;&#x27;;
    }
    return active;
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    var laserActive = updateLaserVisual(now);
    var laserX = shipX + SHIP_W/2 - LASER_W/2;

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i]; b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i,1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }

    for (var e = ebullets.length - 1; e &gt;= 0; e--) {
      var eb = ebullets[e]; eb.y += EB_SPEED;
      if (eb.y &gt; FIELD_H) { field.removeChild(eb.el); ebullets.splice(e,1); continue; }
      eb.el.style.top = eb.y + &#x27;px&#x27;;
      var sx = shipX, sy = FIELD_H - SHIP_BOTTOM - SHIP_H;
      if (eb.x &lt; sx + SHIP_W &amp;&amp; eb.x + EB_W &gt; sx &amp;&amp; eb.y &lt; sy + SHIP_H &amp;&amp; eb.y + EB_H &gt; sy) {
        field.removeChild(eb.el); ebullets.splice(e,1);
        hull--; hitHud(); beep(120, 0.25, &#x27;sawtooth&#x27;, 0.09);
        if (hull &lt;= 0) { endGame(); return; }
      }
    }

    // powerups fall &amp; pickup
    var sx2 = shipX, sy2 = FIELD_H - SHIP_BOTTOM - SHIP_H;
    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p]; pu.y += PU_SPEED;
      if (pu.y &gt; FIELD_H) { field.removeChild(pu.el); powerups.splice(p,1); continue; }
      pu.el.style.top = pu.y + &#x27;px&#x27;;
      if (pu.x &lt; sx2 + SHIP_W &amp;&amp; pu.x + PU_SIZE &gt; sx2 &amp;&amp; pu.y &lt; sy2 + SHIP_H &amp;&amp; pu.y + PU_SIZE &gt; sy2) {
        field.removeChild(pu.el); powerups.splice(p,1);
        laserUntil = now + LASER_DURATION;
        beep(900, 0.2, &#x27;triangle&#x27;, 0.08);
      }
    }

    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      t.phase += t.freq;
      t.x = t.baseX + Math.sin(t.phase) * t.amp;
      t.x = Math.max(0, Math.min(FIELD_W - TARGET_W, t.x));
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j,1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
      t.el.style.left = t.x + &#x27;px&#x27;;
      // laser kills boats it overlaps
      if (laserActive &amp;&amp; t.x &lt; laserX + LASER_W &amp;&amp; t.x + TARGET_W &gt; laserX) {
        field.removeChild(t.el); targets.splice(j,1);
        score += 1; scoreEl.textContent = score;
        beep(1200, 0.05, &#x27;triangle&#x27;, 0.05);
        continue;
      }
      if (now &gt; t.nextShot &amp;&amp; t.y &gt; 0 &amp;&amp; t.y &lt; FIELD_H - 120) {
        enemyShoot(t);
        t.nextShot = now + 1500 + Math.random()*1800;
      }
    }

    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_W &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp; b2.y &lt; t2.y + TARGET_H &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2,1);
          field.removeChild(t2.el); targets.splice(j2,1);
          score += 1; scoreEl.textContent = score;
          beep(880, 0.12, &#x27;triangle&#x27;, 0.07);
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function(b){ if(b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function(t){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    ebullets.forEach(function(e){ if(e.el.parentNode) e.el.parentNode.removeChild(e.el); });
    powerups.forEach(function(p){ if(p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    bullets = []; targets = []; ebullets = []; powerups = [];
    if (laserEl) { if (laserEl.parentNode) laserEl.parentNode.removeChild(laserEl); laserEl = null; }
    laserHud.textContent = &#x27;&#x27;;
  }

  function scheduleNextPowerup() {
    if (puSpawnId) clearTimeout(puSpawnId);
    var delay = 7000 + Math.random() * 8000;
    puSpawnId = setTimeout(function () {
      spawnPowerup();
      scheduleNextPowerup();
    }, delay);
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; hull = 3; gameOver = false; laserUntil = 0;
    scoreEl.textContent = &#x27;0&#x27;; hitHud();
    msgEl.textContent = &#x27;&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    if (!ship) makeShip();
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    scheduleNextPowerup();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (puSpawnId) { clearTimeout(puSpawnId); puSpawnId = null; }
    clearAll();
  }
  function endGame() {
    running = false; gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (puSpawnId) { clearTimeout(puSpawnId); puSpawnId = null; }
    msgEl.textContent = &#x27;💥 Ship Sunk! Score: &#x27; + score;
    beep(90, 0.6, &#x27;sawtooth&#x27;, 0.1);
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  makeShip();
  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
