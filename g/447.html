<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🏎️ Highway Dash</b> &middot; Game 447 &middot; Amateur producer &middot; Basic game: Whack-a-mole</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #10131a; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #ffd166; }
  .instructions { font-size: 16px; color: #b9c2e0; max-width: 620px; margin: 0; line-height: 1.4; }
  .hud { display: flex; gap: 24px; font-size: 18px; color: #fff; align-items: center; }
  .hud b { color: #ffd166; }
  #board { position: relative; width: 420px; height: 470px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,.6); }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #ffd166; text-align: center; padding: 20px; box-sizing: border-box; pointer-events: none; z-index: 5; background: rgba(0,0,0,.35); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🏎️ Highway Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the mouse, or use the ← → arrow keys, to weave through traffic and avoid crashing. The longer you survive the faster you go and the higher your score climbs!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;&lt;div&gt;Speed: &lt;b id=&quot;speed&quot;&gt;0&lt;/b&gt; mph&lt;/div&gt;&lt;div&gt;Best: &lt;b id=&quot;best&quot;&gt;0&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div id=&quot;board&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;420&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;msg&quot;&gt;Press Start below to race!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BW = 420, BH = 470;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var msg = document.getElementById(&#x27;msg&#x27;);

  // Perspective road parameters
  var HORIZON = 150;            // y of vanishing point
  var ROAD_BOTTOM_W = 380;      // road width at bottom of screen
  var ROAD_TOP_W = 24;          // road width at horizon
  var CENTER_X = BW/2;
  var PLAYER_Y = BH - 92;       // fixed screen y for player car

  var running = false, best = 0;
  var score = 0, worldSpeed = 260, roadPos = 0;
  var playerLaneX = 0;          // -1..1 lateral position on road
  var playerVis = CENTER_X;     // smoothed screen x for sway
  var enemies = [], spawnAcc = 0, spawnEvery = 1100;
  var rafId = null, lastFrame = 0;
  var keys = { left:false, right:false };
  var colors = [&#x27;#e63946&#x27;,&#x27;#457b9d&#x27;,&#x27;#f4a261&#x27;,&#x27;#2a9d8f&#x27;,&#x27;#e76f51&#x27;,&#x27;#a06cd5&#x27;,&#x27;#cccccc&#x27;];
  var scenery = [];
  var skidMarks = [];

  function rand(a,b){ return a + Math.random()*(b-a); }

  // Convert a world &quot;depth&quot; (0 = far horizon .. 1 = at player) and lateral
  // offset (-1..1) into a screen point plus a scale factor.
  function project(depth, lateral) {
    // depth 0 -&gt; horizon, depth 1 -&gt; bottom
    var t = depth;
    var y = HORIZON + t * (BH - HORIZON);
    var halfW = (ROAD_TOP_W + t*(ROAD_BOTTOM_W - ROAD_TOP_W)) / 2;
    var x = CENTER_X + lateral * halfW;
    var scale = ROAD_TOP_W/ROAD_BOTTOM_W + t*(1 - ROAD_TOP_W/ROAD_BOTTOM_W);
    return { x:x, y:y, scale:scale, halfW:halfW };
  }

  function spawnEnemy() {
    var lane = [-0.66, -0.22, 0.22, 0.66][Math.floor(Math.random()*4)];
    enemies.push({ depth: 0, lateral: lane, color: colors[Math.floor(Math.random()*colors.length)], vy: rand(0.85,1.05) });
  }

  function spawnScenery() {
    var side = Math.random() &lt; 0.5 ? -1 : 1;
    scenery.push({ depth: 0, side: side, type: Math.random()&lt;0.5?&#x27;tree&#x27;:&#x27;sign&#x27; });
  }

  function drawCar(cx, cy, scale, color, tail) {
    var w = 44*scale, h = 74*scale, r = 8*scale;
    var x = cx - w/2, y = cy - h/2;
    // shadow
    ctx.fillStyle = &#x27;rgba(0,0,0,.35)&#x27;;
    ctx.beginPath(); ctx.ellipse(cx, y+h-2*scale, w*0.55, 8*scale, 0, 0, Math.PI*2); ctx.fill();
    // body
    ctx.fillStyle = color;
    roundRect(x, y, w, h, r); ctx.fill();
    // body shading gradient
    var g = ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,&#x27;rgba(255,255,255,.25)&#x27;);
    g.addColorStop(0.5,&#x27;rgba(255,255,255,0)&#x27;);
    g.addColorStop(1,&#x27;rgba(0,0,0,.3)&#x27;);
    ctx.fillStyle = g; roundRect(x,y,w,h,r); ctx.fill();
    // windows
    ctx.fillStyle = &#x27;rgba(20,40,60,.85)&#x27;;
    roundRect(x+6*scale, y+12*scale, w-12*scale, 18*scale, 4*scale); ctx.fill();
    roundRect(x+6*scale, y+h-30*scale, w-12*scale, 16*scale, 4*scale); ctx.fill();
    // lights
    if (tail) {
      ctx.fillStyle = &#x27;#ff3b30&#x27;;
      ctx.shadowColor = &#x27;#ff3b30&#x27;; ctx.shadowBlur = 8*scale;
      ctx.fillRect(x+5*scale, y+4*scale, 8*scale, 5*scale);
      ctx.fillRect(x+w-13*scale, y+4*scale, 8*scale, 5*scale);
      ctx.shadowBlur = 0;
    } else {
      // player headlights (bottom facing away)
      ctx.fillStyle = &#x27;#fff6c0&#x27;;
      ctx.shadowColor = &#x27;#fff6c0&#x27;; ctx.shadowBlur = 10*scale;
      ctx.fillRect(x+5*scale, y+h-8*scale, 8*scale, 5*scale);
      ctx.fillRect(x+w-13*scale, y+h-8*scale, 8*scale, 5*scale);
      ctx.shadowBlur = 0;
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function render() {
    // sky gradient
    var sky = ctx.createLinearGradient(0,0,0,HORIZON);
    sky.addColorStop(0,&#x27;#6ba7d8&#x27;);
    sky.addColorStop(1,&#x27;#cfe4f2&#x27;);
    ctx.fillStyle = sky; ctx.fillRect(0,0,BW,HORIZON);
    // distant hills
    ctx.fillStyle = &#x27;#7fa87a&#x27;;
    ctx.beginPath(); ctx.moveTo(0,HORIZON);
    ctx.quadraticCurveTo(BW*0.25, HORIZON-28, BW*0.5, HORIZON-6);
    ctx.quadraticCurveTo(BW*0.78, HORIZON-34, BW, HORIZON-4);
    ctx.lineTo(BW,HORIZON); ctx.closePath(); ctx.fill();
    // sun glow
    ctx.fillStyle = &#x27;rgba(255,240,180,.6)&#x27;;
    ctx.beginPath(); ctx.arc(BW*0.72, HORIZON-60, 26, 0, Math.PI*2); ctx.fill();

    // grass
    ctx.fillStyle = &#x27;#2f5d33&#x27;; ctx.fillRect(0,HORIZON,BW,BH-HORIZON);

    // road as a trapezoid
    var top = project(0,0), bot = project(1,0);
    ctx.fillStyle = &#x27;#3a3f47&#x27;;
    ctx.beginPath();
    ctx.moveTo(CENTER_X-top.halfW, top.y);
    ctx.lineTo(CENTER_X+top.halfW, top.y);
    ctx.lineTo(CENTER_X+bot.halfW, bot.y);
    ctx.lineTo(CENTER_X-bot.halfW, bot.y);
    ctx.closePath(); ctx.fill();

    // shoulder edges
    ctx.strokeStyle = &#x27;#e9e9e9&#x27;; 
    ctx.beginPath();
    ctx.moveTo(CENTER_X-top.halfW*1.02, top.y); ctx.lineTo(CENTER_X-bot.halfW*1.02, bot.y);
    ctx.moveTo(CENTER_X+top.halfW*1.02, top.y); ctx.lineTo(CENTER_X+bot.halfW*1.02, bot.y);
    ctx.lineWidth = 3; ctx.stroke();

    // skid marks
    for (var s=0;s&lt;skidMarks.length;s++){
      var sm = skidMarks[s];
      var p = project(sm.depth, sm.lateral);
      ctx.strokeStyle = &#x27;rgba(20,20,20,&#x27;+(0.5*sm.depth)+&#x27;)&#x27;;
      ctx.lineWidth = 6*p.scale;
      ctx.beginPath(); ctx.moveTo(p.x-6*p.scale, p.y); ctx.lineTo(p.x-6*p.scale, p.y+14*p.scale);
      ctx.moveTo(p.x+6*p.scale, p.y); ctx.lineTo(p.x+6*p.scale, p.y+14*p.scale); ctx.stroke();
    }

    // dashed center + lane lines (moving with roadPos)
    var laneOffsets = [-0.44, 0, 0.44];
    for (var li=0; li&lt;laneOffsets.length; li++){
      var lo = laneOffsets[li];
      // draw dashes along depth
      var phase = (roadPos % 1);
      for (var seg=0; seg&lt;20; seg++){
        var d0 = (seg*0.06 + phase*0.06);
        var d1 = d0 + 0.03;
        if (d0 &gt; 1) continue;
        var pa = project(Math.min(1,d0), lo);
        var pb = project(Math.min(1,d1), lo);
        ctx.strokeStyle = li===1 ? &#x27;rgba(255,220,120,.85)&#x27; : &#x27;rgba(255,255,255,.75)&#x27;;
        ctx.lineWidth = 3*pa.scale + 0.5;
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      }
    }

    // scenery (trees / signs), far to near
    scenery.sort(function(a,b){return a.depth-b.depth;});
    for (var i=0;i&lt;scenery.length;i++){
      var sc = scenery[i];
      var p = project(sc.depth, sc.side*1.5);
      var sz = 60*p.scale;
      if (sc.type===&#x27;tree&#x27;){
        ctx.fillStyle = &#x27;#5b3a22&#x27;; ctx.fillRect(p.x-2*p.scale, p.y-sz*0.4, 4*p.scale, sz*0.4);
        ctx.fillStyle = &#x27;#2e7d32&#x27;;
        ctx.beginPath(); ctx.arc(p.x, p.y-sz*0.5, sz*0.35, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = &#x27;#888&#x27;; ctx.fillRect(p.x-1.5*p.scale, p.y-sz*0.5, 3*p.scale, sz*0.5);
        ctx.fillStyle = &#x27;#2a9d8f&#x27;; roundRect(p.x-sz*0.2, p.y-sz*0.7, sz*0.4, sz*0.25, 3*p.scale); ctx.fill();
      }
    }

    // enemies far to near
    enemies.sort(function(a,b){return a.depth-b.depth;});
    for (var e=0;e&lt;enemies.length;e++){
      var en = enemies[e];
      var p = project(en.depth, en.lateral);
      drawCar(p.x, p.y, p.scale, en.color, true);
    }

    // player car (with sway)
    var targetX = CENTER_X + playerLaneX * (ROAD_BOTTOM_W/2 - 22);
    playerVis += (targetX - playerVis) * 0.25;
    var pp = project(0.92, playerLaneX);
    drawCar(playerVis, PLAYER_Y, 0.92, &#x27;#ffd166&#x27;, false);

    // steering tilt hint: small motion blur lines when moving fast
    if (worldSpeed &gt; 400){
      ctx.strokeStyle = &#x27;rgba(255,255,255,.08)&#x27;;
      ctx.lineWidth = 1;
      for (var m=0;m&lt;6;m++){
        var yy = HORIZON + Math.random()*(BH-HORIZON);
        ctx.beginPath(); ctx.moveTo(Math.random()*BW, yy); ctx.lineTo(Math.random()*BW, yy+30); ctx.stroke();
      }
    }
  }

  function loop(t) {
    if (!running) return;
    if (!lastFrame) lastFrame = t;
    var dt = (t - lastFrame)/1000; lastFrame = t;
    if (dt &gt; 0.05) dt = 0.05;

    var advance = (worldSpeed/260) * dt;
    roadPos += advance;

    // steering
    var steerRate = 1.4;
    if (keys.left) playerLaneX -= steerRate*dt;
    if (keys.right) playerLaneX += steerRate*dt;
    playerLaneX = Math.max(-0.9, Math.min(0.9, playerLaneX));

    // engine sound
    updateEngine();

    // spawn
    spawnAcc += dt*1000;
    if (spawnAcc &gt;= spawnEvery) { spawnAcc = 0; spawnEnemy(); if (Math.random()&lt;0.6) spawnScenery(); }

    // move enemies toward player
    for (var i=enemies.length-1;i&gt;=0;i--){
      var en = enemies[i];
      en.depth += advance * 0.5 * en.vy;
      // collision when near player depth
      if (en.depth &gt; 0.82 &amp;&amp; en.depth &lt; 1.0) {
        if (Math.abs(en.lateral - playerLaneX) &lt; 0.18) { crash(); return; }
      }
      if (en.depth &gt;= 1.05) { enemies.splice(i,1); score += 10; }
    }

    // scenery
    for (var s=scenery.length-1;s&gt;=0;s--){
      scenery[s].depth += advance * 0.55;
      if (scenery[s].depth &gt;= 1.1) scenery.splice(s,1);
    }
    // fade skid marks
    for (var k=skidMarks.length-1;k&gt;=0;k--){
      skidMarks[k].depth += advance*0.5;
      if (skidMarks[k].depth &gt;= 1.1) skidMarks.splice(k,1);
    }

    // difficulty
    worldSpeed += dt * 8;
    spawnEvery = Math.max(500, 1100 - (worldSpeed-260)*1.4);
    score += dt * 8;

    scoreEl.textContent = Math.floor(score);
    speedEl.textContent = Math.floor(worldSpeed/4);

    render();
    rafId = requestAnimationFrame(loop);
  }

  // ----- audio: engine drone + crash -----
  var actx = null, engOsc = null, engGain = null, engOsc2 = null;
  function ensureCtx(){ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }
  function startEngine(){
    try {
      ensureCtx();
      engGain = actx.createGain(); engGain.gain.value = 0.0; engGain.connect(actx.destination);
      engOsc = actx.createOscillator(); engOsc.type=&#x27;sawtooth&#x27;; engOsc.frequency.value=60;
      engOsc2 = actx.createOscillator(); engOsc2.type=&#x27;square&#x27;; engOsc2.frequency.value=90;
      var g2 = actx.createGain(); g2.gain.value=0.4;
      engOsc.connect(engGain); engOsc2.connect(g2); g2.connect(engGain);
      engOsc.start(); engOsc2.start();
    } catch(_) {}
  }
  function updateEngine(){
    try {
      if (!engGain) return;
      var f = 55 + (worldSpeed-260)*0.35;
      engOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.05);
      engOsc2.frequency.setTargetAtTime(f*1.5, actx.currentTime, 0.05);
      engGain.gain.setTargetAtTime(0.06, actx.currentTime, 0.1);
    } catch(_) {}
  }
  function stopEngine(){
    try {
      if (engOsc){ engOsc.stop(); engOsc2.stop(); }
      engOsc=engOsc2=engGain=null;
    } catch(_) {}
  }
  function crashTone(){
    try {
      ensureCtx();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(200,actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(50,actx.currentTime+0.5);
      g.gain.setValueAtTime(0.3,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.5);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.5);
    } catch(_) {}
  }

  function crash() {
    running = false;
    stopEngine();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    crashTone();
    ctx.fillStyle = &#x27;rgba(255,80,40,.45)&#x27;; ctx.fillRect(0,0,BW,BH);
    var fs = Math.floor(score);
    if (fs &gt; best) { best = fs; bestEl.textContent = best; }
    msg.textContent = &#x27;💥 Crash! You scored &#x27; + fs + &#x27;. Press Start to race again.&#x27;;
    msg.style.display = &#x27;flex&#x27;;
  }

  function startGame() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    stopEngine();
    running = true;
    score = 0; worldSpeed = 260; roadPos = 0; spawnAcc = 0; spawnEvery = 1100; lastFrame = 0;
    playerLaneX = 0; playerVis = CENTER_X;
    enemies = []; scenery = []; skidMarks = [];
    scoreEl.textContent = &#x27;0&#x27;; speedEl.textContent = &#x27;65&#x27;;
    msg.style.display = &#x27;none&#x27;;
    // seed some scenery for depth
    for (var i=0;i&lt;6;i++){ scenery.push({depth: i*0.15, side: i%2?-1:1, type: i%2?&#x27;tree&#x27;:&#x27;sign&#x27;}); }
    spawnEnemy();
    startEngine();
    render();
    rafId = requestAnimationFrame(loop);
  }

  function stopGame() {
    running = false;
    stopEngine();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    msg.textContent = &#x27;Paused — press Start below.&#x27;;
    msg.style.display = &#x27;flex&#x27;;
  }

  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    if (!running) return;
    var r = cv.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (BW / r.width);
    playerLaneX = Math.max(-0.9, Math.min(0.9, (mx - CENTER_X) / (ROAD_BOTTOM_W/2 - 22)));
  });

  document.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;) { keys.left = true; e.preventDefault(); }
    if (e.key === &#x27;ArrowRight&#x27;) { keys.right = true; e.preventDefault(); }
  });
  document.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;) keys.left = false;
    if (e.key === &#x27;ArrowRight&#x27;) keys.right = false;
  });

  render();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
