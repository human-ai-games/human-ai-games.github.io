&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🎪 Carnival Critter Whack 🎪&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the animals to score, but don&#x27;t miss — each miss costs a life. Watch out: 🐍 snakes appear from level 4 (costs a life) and 🦝 raccoons from level 6 (instant game over); a 20-hit streak earns back one life.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;

    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var BOARD_W = 640, BOARD_H = 400;
  var ANIMALS = [&#x27;🐰&#x27;,&#x27;🐭&#x27;,&#x27;🦊&#x27;,&#x27;🐻&#x27;,&#x27;🐸&#x27;,&#x27;🐷&#x27;,&#x27;🐵&#x27;,&#x27;🐹&#x27;,&#x27;🐨&#x27;,&#x27;🐮&#x27;];
  var SNAKE = &#x27;🐍&#x27;, RACCOON = &#x27;🦝&#x27;;
  var MAX_LIVES = 3, STREAK_BONUS = 20;
  var LEVEL_UP_HITS = 8;
  var SNAKE_LEVEL = 4, RACCOON_LEVEL = 6, DOUBLE_LEVEL = 5;
  var score = 0, streak = 0, lives = MAX_LIVES, level = 1, goodHits = 0, running = false;
  var spawnTimer = null, moleTimeouts = [];
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;);
  var gameoverEl = document.getElementById(&#x27;gameover&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  var HOLES = [];
  (function(){
    var cols = 4, rows = 3, mw = 110, mh = 82;
    var startX = (BOARD_W - cols*mw)/2 + 10;
    var startY = 50;
    for (var r=0;r&lt;rows;r++) for(var c=0;c&lt;cols;c++){
      HOLES.push({ x: startX + c*mw, y: startY + r*mh });
    }
  })();
  HOLES.forEach(function(h){
    var d = document.createElement(&#x27;div&#x27;);
    d.className = &#x27;hole&#x27;;
    d.style.left = h.x + &#x27;px&#x27;;
    d.style.top = (h.y+28) + &#x27;px&#x27;;
    board.insertBefore(d, bannerEl);
  });
  var occupied = {}; // holeIndex -&gt; true while a critter is up there

  // ---- Audio ----
  var actx = null, musicTimer = null;
  function ensureAudio(){
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){ actx=null; } }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
  }
  function tone(freq, start, dur, type, vol){
    if(!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol||0.15, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(start); o.stop(start+dur+0.02);
  }
  var MELODY = [523,659,784,659,523,659,784,880,784,659,587,659,523,659,784,1047];
  var melodyIdx = 0, musicInterval = 240;
  function playMusicStep(){
    if(!running||!actx) return;
    var t = actx.currentTime;
    var n = MELODY[melodyIdx % MELODY.length];
    tone(n, t, 0.22, &#x27;triangle&#x27;, 0.08);
    tone(n/4, t, 0.18, &#x27;sawtooth&#x27;, 0.05);
    if (melodyIdx % 2 === 0) tone(n/2, t+0.12, 0.1, &#x27;square&#x27;, 0.03);
    melodyIdx++;
  }
  function startMusic(){ if(!actx) return; melodyIdx = 0; setMusicTempo(); playMusicStep(); }
  function setMusicTempo(){
    if(musicTimer) clearInterval(musicTimer);
    // music speeds up a little each level for tension
    musicInterval = Math.max(150, 240 - (level-1)*10);
    if(running) musicTimer = setInterval(playMusicStep, musicInterval);
  }
  function stopMusic(){ if(musicTimer){clearInterval(musicTimer); musicTimer=null;} }
  function hitSound(){
    if(!actx) return; var t = actx.currentTime;
    tone(880, t, 0.08, &#x27;square&#x27;, 0.18);
    tone(1320, t+0.06, 0.12, &#x27;square&#x27;, 0.16);
    tone(1760, t+0.12, 0.1, &#x27;triangle&#x27;, 0.12);
  }
  function bonusSound(){
    if(!actx) return; var t = actx.currentTime;
    [523,659,784,1047,1319].forEach(function(f,i){ tone(f, t+i*0.08, 0.2, &#x27;triangle&#x27;, 0.16); });
  }
  function loseSound(){
    if(!actx) return; var t = actx.currentTime;
    tone(300, t, 0.15, &#x27;sawtooth&#x27;, 0.15);
    tone(200, t+0.12, 0.25, &#x27;sawtooth&#x27;, 0.15);
  }
  function levelUpSound(){
    if(!actx) return; var t = actx.currentTime;
    [659,784,988,1319].forEach(function(f,i){ tone(f, t+i*0.09, 0.18, &#x27;square&#x27;, 0.14); });
  }
  function raccoonSound(){
    if(!actx) return; var t = actx.currentTime;
    tone(400, t, 0.2, &#x27;sawtooth&#x27;, 0.2);
    tone(250, t+0.15, 0.3, &#x27;sawtooth&#x27;, 0.2);
    tone(120, t+0.35, 0.4, &#x27;square&#x27;, 0.2);
  }

  function updateHud(){
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    levelEl.textContent = level;
    var hearts = &#x27;&#x27;;
    for (var i=0;i&lt;MAX_LIVES;i++) hearts += (i&lt;lives ? &#x27;❤️&#x27; : &#x27;🖤&#x27;);
    livesEl.textContent = hearts;
  }
  function showBanner(text){
    bannerEl.textContent = text;
    bannerEl.classList.remove(&#x27;show&#x27;);
    void bannerEl.offsetWidth;
    bannerEl.classList.add(&#x27;show&#x27;);
  }

  function clearMoles(){
    for(var i=0;i&lt;moleTimeouts.length;i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var cs = board.querySelectorAll(&#x27;.critter&#x27;);
    for(var j=0;j&lt;cs.length;j++) cs[j].remove();
    occupied = {};
  }

  function loseLife(){
    if(!running) return;
    streak = 0;
    lives--;
    loseSound();
    updateHud();
    if(lives&lt;=0) endGame();
  }

  function goodHit(){
    score += 10;
    streak++;
    goodHits++;
    if(streak&gt;0 &amp;&amp; streak % STREAK_BONUS === 0 &amp;&amp; lives &lt; MAX_LIVES){
      lives++;
      bonusSound();
      showBanner(&#x27;+1 LIFE!&#x27;);
    }
    if(goodHits &gt;= LEVEL_UP_HITS){
      goodHits = 0;
      level++;
      levelUpSound();
      setMusicTempo();
      if(level === SNAKE_LEVEL) showBanner(&#x27;LVL &#x27;+level+&#x27; 🐍!&#x27;);
      else if(level === RACCOON_LEVEL) showBanner(&#x27;LVL &#x27;+level+&#x27; 🦝!&#x27;);
      else showBanner(&#x27;LEVEL &#x27; + level + &#x27;!&#x27;);
    }
    updateHud();
  }

  function chooseType(){
    var r = Math.random();
    // raccoon frequency ramps from level 6 up
    if(level &gt;= RACCOON_LEVEL){
      var rac = Math.min(0.22, 0.12 + (level-RACCOON_LEVEL)*0.02);
      if(r &lt; rac) return { emoji: RACCOON, kind: &#x27;raccoon&#x27; };
    }
    // snake frequency ramps from level 4 up
    if(level &gt;= SNAKE_LEVEL){
      var snk = Math.min(0.35, 0.18 + (level-SNAKE_LEVEL)*0.03);
      if(r &lt; 0.30 + snk*0.001 &amp;&amp; Math.random() &lt; snk) return { emoji: SNAKE, kind: &#x27;snake&#x27; };
    }
    return { emoji: ANIMALS[Math.floor(Math.random()*ANIMALS.length)], kind: &#x27;animal&#x27; };
  }

  function freeHoleIndex(){
    var free = [];
    for(var i=0;i&lt;HOLES.length;i++) if(!occupied[i]) free.push(i);
    if(free.length === 0) return -1;
    return free[Math.floor(Math.random()*free.length)];
  }

  function spawnMole(){
    if(!running) return;
    var idx = freeHoleIndex();
    if(idx &lt; 0) return;
    var slot = HOLES[idx];
    occupied[idx] = true;
    var type = chooseType();
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;critter&#x27;;
    el.textContent = type.emoji;
    el.style.left = (slot.x + 24) + &#x27;px&#x27;;
    el.style.top = (slot.y + 8) + &#x27;px&#x27;;
    board.insertBefore(el, bannerEl);
    void el.offsetWidth;
    el.classList.add(&#x27;up&#x27;);
    var handled = false;

    function release(){ occupied[idx] = false; }

    el.addEventListener(&#x27;mousedown&#x27;, function(){
      if(handled||!running) return;
      handled = true;
      release();
      if(type.kind === &#x27;raccoon&#x27;){
        raccoonSound();
        el.classList.remove(&#x27;up&#x27;); el.classList.add(&#x27;hit&#x27;);
        showBanner(&#x27;🦝 BUSTED!&#x27;);
        endGame();
        return;
      }
      if(type.kind === &#x27;snake&#x27;){
        loseSound();
        el.classList.remove(&#x27;up&#x27;); el.classList.add(&#x27;hit&#x27;);
        setTimeout(function(){ el.remove(); }, 260);
        showBanner(&#x27;🐍 -1 LIFE&#x27;);
        loseLife();
        return;
      }
      hitSound();
      el.classList.remove(&#x27;up&#x27;); el.classList.add(&#x27;hit&#x27;);
      setTimeout(function(){ el.remove(); }, 260);
      goodHit();
    });

    // critters get faster to react to as levels rise
    var life = Math.max(500, 1050 - (level-1)*70) + Math.random()*300;
    var to = setTimeout(function(){
      if(!handled){
        release();
        el.classList.remove(&#x27;up&#x27;);
        setTimeout(function(){ el.remove(); }, 180);
        if(type.kind === &#x27;animal&#x27;) loseLife();
      }
    }, life);
    moleTimeouts.push(to);
  }

  function scheduleSpawn(){
    if(!running) return;
    var delay = Math.max(280, 600 - (level-1)*35) + Math.random()*350;
    spawnTimer = setTimeout(function(){
      spawnMole();
      // From level 5, occasionally spawn a second critter at the same time
      if(level &gt;= DOUBLE_LEVEL &amp;&amp; Math.random() &lt; Math.min(0.5, 0.2 + (level-DOUBLE_LEVEL)*0.06)){
        spawnMole();
      }
      scheduleSpawn();
    }, delay);
  }

  function startGame(){
    if(running) return;
    ensureAudio();
    running = true;
    score = 0; streak = 0; lives = MAX_LIVES; level = 1; goodHits = 0;
    updateHud();
    gameoverEl.classList.remove(&#x27;show&#x27;);
    clearMoles();
    startMusic();
    spawnMole();
    scheduleSpawn();
  }

  function endGame(){
    running = false;
    if(spawnTimer){ clearTimeout(spawnTimer); spawnTimer=null; }
    stopMusic();
    setTimeout(clearMoles, 300);
    finalScoreEl.textContent = &#x27;Final Score: &#x27; + score + &#x27; • Reached Level &#x27; + level;
    gameoverEl.classList.add(&#x27;show&#x27;);
  }

  function stopGame(){
    if(!running) return;
    running = false;
    if(spawnTimer){ clearTimeout(spawnTimer); spawnTimer=null; }
    stopMusic();
    clearMoles();
  }

  updateHud();

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if(e.data.type === &#x27;wd_start&#x27;) startGame();
    else if(e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
