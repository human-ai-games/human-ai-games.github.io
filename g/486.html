<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>NEON RAIDERS</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; background: #05010f; border-radius: 8px; overflow: hidden; }
  .stars { position: absolute; left: 0; width: 100%; }
  .ship { position: absolute; width: 40px; height: 34px; bottom: 12px; z-index: 5; }
  .bullet { position: absolute; width: 6px; height: 14px; background: #ffe14d; border-radius: 2px; box-shadow: 0 0 8px #ffe14d; z-index: 4; }
  .ebullet { position: absolute; width: 6px; height: 14px; background: #34e5ff; border-radius: 2px; box-shadow: 0 0 8px #34e5ff; z-index: 4; }
  .target { position: absolute; width: 40px; height: 34px; z-index: 3; }
  .boss { position: absolute; z-index: 4; }
  .star { position: absolute; background: #fff; border-radius: 50%; }
  .explosion { position: absolute; pointer-events: none; z-index: 6; font-size: 34px; line-height: 1; transform: translate(-50%, -50%); animation: boom 0.45s ease-out forwards; }
  @keyframes boom { 0% { transform: translate(-50%,-50%) scale(0.3); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.9); opacity: 0; } }
  .bosshp { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); color: #ff5ce0; font-weight: 800; font-size: 16px; z-index: 7; text-shadow: 0 0 6px #b800a0; }
  .laser { position: absolute; width: 14px; background: linear-gradient(90deg,#ff2ccb,#fff,#ff2ccb); box-shadow: 0 0 14px #ff2ccb, 0 0 24px #ff2ccb; z-index: 4; border-radius: 4px; }
  .bubble { position: absolute; z-index: 8; background: #fff; color: #111; border: 3px solid #000; border-radius: 12px; padding: 6px 10px; font-weight: 800; font-size: 14px; max-width: 180px; text-align: center; box-shadow: 4px 4px 0 #ff5ce0; transform: translate(-50%, 0); }
  .bubble:after { content: &#x27;&#x27;; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); border-width: 12px 8px 0 8px; border-style: solid; border-color: #000 transparent transparent transparent; }
  .banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; color: #fff; font-weight: 900; font-size: 40px; text-shadow: 3px 3px 0 #ff2ccb, -2px -2px 0 #34e5ff; background: rgba(5,1,15,0.72); text-align: center; letter-spacing: 2px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON RAIDERS&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the red ship with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and press &lt;strong&gt;Space&lt;/strong&gt; to blast the blue enemies while dodging their shots. Every 30 seconds a purple boss roams in — avoid its laser and land 10 hits to destroy it!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;
      &lt;svg viewBox=&quot;0 0 40 34&quot; width=&quot;40&quot; height=&quot;34&quot;&gt;
        &lt;polygon points=&quot;20,1 38,32 20,25 2,32&quot; fill=&quot;#ff2b2b&quot; stroke=&quot;#000&quot; stroke-width=&quot;2.5&quot;/&gt;
        &lt;polygon points=&quot;20,6 20,24 29,28&quot; fill=&quot;#ff8a8a&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;circle cx=&quot;20&quot; cy=&quot;16&quot; r=&quot;3.5&quot; fill=&quot;#fff2f2&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;polygon points=&quot;6,30 1,34 9,32&quot; fill=&quot;#ffd23f&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;polygon points=&quot;34,30 39,34 31,32&quot; fill=&quot;#ffd23f&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 40, SHIP_H = 34, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 6, BULLET_H = 14, BULLET_SPEED = 7, EBULLET_SPEED = 4;
  var TARGET_W = 40, TARGET_H = 34, TARGET_SPEED = 1.8;
  var SPAWN_INTERVAL = 1200;
  var BOSS_W = 110, BOSS_H = 90, BOSS_MAX_HP = 10, BOSS_INTERVAL = 30000;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], ebullets = [];
  var score = 0;
  var lastShot = 0;
  var startTime = 0, nextBossAt = 0, gameOver = false;
  var boss = null, bossEl = null, bossHpEl = null, bossBubble = null;
  var bossDir = 1, bossLaser = null, bossLaserEl = null, nextLaserAt = 0;
  var starOffset = 0, STAR_SPEED = 0.6, STAR_BAND = FIELD_H;
  var field = document.getElementById(&#x27;field&#x27;);
  var starsEl = document.getElementById(&#x27;stars&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;);

  var TAUNTS = [&#x27;I WILL DESTROY YOU!&#x27;, &quot;YOU&#x27;LL NEVER BEST ME!&quot;,
    &#x27;PREPARE TO PERISH!&#x27;, &#x27;YOUR END IS NIGH!&#x27;, &#x27;RESISTANCE IS FUTILE!&#x27;];

  var ENEMY_SVG = &#x27;&lt;svg viewBox=&quot;0 0 40 34&quot; width=&quot;40&quot; height=&quot;34&quot;&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;20,33 2,3 20,10 38,3&quot; fill=&quot;#1f7bff&quot; stroke=&quot;#000&quot; stroke-width=&quot;2.5&quot;/&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;20,29 20,10 11,7&quot; fill=&quot;#7db6ff&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;18&quot; r=&quot;3.5&quot; fill=&quot;#e6f2ff&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;8&quot; cy=&quot;8&quot; r=&quot;3&quot; fill=&quot;#34e5ff&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;32&quot; cy=&quot;8&quot; r=&quot;3&quot; fill=&quot;#34e5ff&quot; stroke=&quot;#000&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;&#x27;;

  var BOSS_SVG = &#x27;&lt;svg viewBox=&quot;0 0 110 90&quot; width=&quot;110&quot; height=&quot;90&quot;&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;55&quot; cy=&quot;46&quot; rx=&quot;52&quot; ry=&quot;28&quot; fill=&quot;#8a2be2&quot; stroke=&quot;#000&quot; stroke-width=&quot;3.5&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;55&quot; cy=&quot;34&quot; rx=&quot;27&quot; ry=&quot;17&quot; fill=&quot;#c56bff&quot; stroke=&quot;#000&quot; stroke-width=&quot;3&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;55&quot; cy=&quot;34&quot; r=&quot;9&quot; fill=&quot;#f0d9ff&quot; stroke=&quot;#000&quot; stroke-width=&quot;2.5&quot;/&gt;&#x27; +
    &#x27;&lt;polygon points=&quot;10,50 55,86 100,50&quot; fill=&quot;#5c1aa8&quot; stroke=&quot;#000&quot; stroke-width=&quot;3&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;48&quot; r=&quot;5&quot; fill=&quot;#ff5ce0&quot; stroke=&quot;#000&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;86&quot; cy=&quot;48&quot; r=&quot;5&quot; fill=&quot;#ff5ce0&quot; stroke=&quot;#000&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;49&quot; y=&quot;70&quot; width=&quot;12&quot; height=&quot;16&quot; fill=&quot;#ff2ccb&quot; stroke=&quot;#000&quot; stroke-width=&quot;2.5&quot;/&gt;&lt;/svg&gt;&#x27;;

  function makeStars() {
    starsEl.innerHTML = &#x27;&#x27;;
    starsEl.style.height = (STAR_BAND * 2) + &#x27;px&#x27;;
    for (var band = 0; band &lt; 2; band++) {
      for (var i = 0; i &lt; 60; i++) {
        var s = document.createElement(&#x27;div&#x27;);
        s.className = &#x27;star&#x27;;
        var size = Math.random() &lt; 0.7 ? 1 : 2;
        s.style.width = size + &#x27;px&#x27;;
        s.style.height = size + &#x27;px&#x27;;
        s.style.left = Math.random() * FIELD_W + &#x27;px&#x27;;
        s.style.top = (band * STAR_BAND + Math.random() * STAR_BAND) + &#x27;px&#x27;;
        s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
        starsEl.appendChild(s);
      }
    }
  }
  makeStars();

  /* ---------- Audio ---------- */
  var actx = null, musicNodes = null;
  function ensureAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { actx = null; }
    }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
  }
  function playExplosion() {
    if (!actx) return;
    var now = actx.currentTime;
    var bufSize = actx.sampleRate * 0.4;
    var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i &lt; bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2);
    var src = actx.createBufferSource(); src.buffer = buf;
    var filt = actx.createBiquadFilter(); filt.type = &#x27;lowpass&#x27;;
    filt.frequency.setValueAtTime(1200, now);
    filt.frequency.exponentialRampToValueAtTime(200, now + 0.4);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.5, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    src.connect(filt); filt.connect(g); g.connect(actx.destination);
    src.start(now); src.stop(now + 0.4);
  }
  function playLaser() {
    if (!actx) return;
    var now = actx.currentTime;
    var o = actx.createOscillator(); o.type = &#x27;sawtooth&#x27;;
    o.frequency.setValueAtTime(880, now);
    o.frequency.exponentialRampToValueAtTime(120, now + 0.4);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    o.connect(g); g.connect(actx.destination);
    o.start(now); o.stop(now + 0.4);
  }
  function startMusic() {
    if (!actx || musicNodes) return;
    var master = actx.createGain(); master.gain.value = 0.06;
    master.connect(actx.destination);
    var freqs = [55, 82.4, 110]; var oscs = [];
    freqs.forEach(function (f, idx) {
      var o = actx.createOscillator();
      o.type = idx === 2 ? &#x27;triangle&#x27; : &#x27;sine&#x27;;
      o.frequency.value = f;
      var og = actx.createGain(); og.gain.value = idx === 2 ? 0.4 : 0.7;
      o.connect(og); og.connect(master); o.start(); oscs.push(o);
    });
    var lfo = actx.createOscillator(); lfo.frequency.value = 0.08;
    var lfoGain = actx.createGain(); lfoGain.gain.value = 0.03;
    lfo.connect(lfoGain); lfoGain.connect(master.gain); lfo.start();
    musicNodes = { master: master, oscs: oscs, lfo: lfo };
  }
  function stopMusic() {
    if (!musicNodes) return;
    try { musicNodes.oscs.forEach(function (o) { o.stop(); }); musicNodes.lfo.stop(); musicNodes.master.disconnect(); } catch (_) {}
    musicNodes = null;
  }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function explodeAt(cx, cy) {
    var e = document.createElement(&#x27;div&#x27;);
    e.className = &#x27;explosion&#x27;; e.textContent = &#x27;💥&#x27;;
    e.style.left = cx + &#x27;px&#x27;; e.style.top = cy + &#x27;px&#x27;;
    field.appendChild(e);
    setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 460);
    playExplosion();
  }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_W), y: -TARGET_H, el: null, nextFire: Date.now() + 600 + Math.random() * 1500 };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;; el.innerHTML = ENEMY_SVG;
    el.style.left = t.x + &#x27;px&#x27;; el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el); t.el = el; targets.push(t);
  }

  function enemyFire(t) {
    var b = { x: t.x + TARGET_W / 2 - BULLET_W / 2, y: t.y + TARGET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;); el.className = &#x27;ebullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;; el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el); b.el = el; ebullets.push(b);
  }

  function spawnBoss() {
    boss = { x: (FIELD_W - BOSS_W) / 2, y: 44, hp: BOSS_MAX_HP };
    bossDir = Math.random() &lt; 0.5 ? 1 : -1;
    bossEl = document.createElement(&#x27;div&#x27;); bossEl.className = &#x27;boss&#x27;; bossEl.innerHTML = BOSS_SVG;
    bossEl.style.left = boss.x + &#x27;px&#x27;; bossEl.style.top = boss.y + &#x27;px&#x27;;
    field.appendChild(bossEl);
    bossHpEl = document.createElement(&#x27;div&#x27;); bossHpEl.className = &#x27;bosshp&#x27;;
    bossHpEl.textContent = &#x27;BOSS HP &#x27; + boss.hp; field.appendChild(bossHpEl);
    bossBubble = document.createElement(&#x27;div&#x27;); bossBubble.className = &#x27;bubble&#x27;;
    bossBubble.textContent = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
    field.appendChild(bossBubble);
    nextLaserAt = Date.now() + 1500 + Math.random() * 1500;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }
  function removeBoss() {
    if (bossEl &amp;&amp; bossEl.parentNode) bossEl.parentNode.removeChild(bossEl);
    if (bossHpEl &amp;&amp; bossHpEl.parentNode) bossHpEl.parentNode.removeChild(bossHpEl);
    if (bossBubble &amp;&amp; bossBubble.parentNode) bossBubble.parentNode.removeChild(bossBubble);
    if (bossLaserEl &amp;&amp; bossLaserEl.parentNode) bossLaserEl.parentNode.removeChild(bossLaserEl);
    boss = null; bossEl = null; bossHpEl = null; bossBubble = null; bossLaser = null; bossLaserEl = null;
    nextBossAt = Date.now() + BOSS_INTERVAL;
    if (!spawnId) spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function fireLaser() {
    var lw = 14;
    var lx = boss.x + BOSS_W / 2 - lw / 2;
    var ly = boss.y + BOSS_H - 8;
    bossLaser = { x: lx, y: ly, w: lw, h: FIELD_H - ly, until: Date.now() + 700 };
    bossLaserEl = document.createElement(&#x27;div&#x27;); bossLaserEl.className = &#x27;laser&#x27;;
    bossLaserEl.style.left = lx + &#x27;px&#x27;; bossLaserEl.style.top = ly + &#x27;px&#x27;;
    bossLaserEl.style.width = lw + &#x27;px&#x27;; bossLaserEl.style.height = bossLaser.h + &#x27;px&#x27;;
    field.appendChild(bossLaserEl);
    playLaser();
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;); el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;; el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el); b.el = el; bullets.push(b);
  }

  function shipRect() {
    return { x: shipX, y: FIELD_H - SHIP_BOTTOM - SHIP_H, w: SHIP_W, h: SHIP_H };
  }
  function endGame() {
    gameOver = true;
    explodeAt(shipX + SHIP_W / 2, FIELD_H - SHIP_BOTTOM - SHIP_H / 2);
    bannerEl.textContent = &#x27;GAME OVER · Score &#x27; + score;
    bannerEl.style.display = &#x27;flex&#x27;;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    stopMusic();
  }

  function tick() {
    if (!running) return;
    var now = Date.now();

    starOffset += STAR_SPEED;
    if (starOffset &gt;= STAR_BAND) starOffset -= STAR_BAND;
    starsEl.style.top = (starOffset - STAR_BAND) + &#x27;px&#x27;;

    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    if (!boss &amp;&amp; now &gt;= nextBossAt) spawnBoss();

    // boss movement + laser
    if (boss) {
      boss.x += bossDir * 1.6;
      if (boss.x &lt;= 0) { boss.x = 0; bossDir = 1; }
      if (boss.x &gt;= FIELD_W - BOSS_W) { boss.x = FIELD_W - BOSS_W; bossDir = -1; }
      bossEl.style.left = boss.x + &#x27;px&#x27;;
      bossBubble.style.left = (boss.x + BOSS_W / 2) + &#x27;px&#x27;;
      bossBubble.style.top = Math.max(2, boss.y - 44) + &#x27;px&#x27;;
      if (!bossLaser &amp;&amp; now &gt;= nextLaserAt) fireLaser();
      if (bossLaser) {
        var lx = boss.x + BOSS_W / 2 - bossLaser.w / 2;
        bossLaser.x = lx; bossLaserEl.style.left = lx + &#x27;px&#x27;;
        if (now &gt;= bossLaser.until) {
          if (bossLaserEl.parentNode) bossLaserEl.parentNode.removeChild(bossLaserEl);
          bossLaser = null; bossLaserEl = null;
          nextLaserAt = now + 2000 + Math.random() * 1500;
        }
      }
    }

    // player bullets
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i]; b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    // enemy bullets
    for (var e = ebullets.length - 1; e &gt;= 0; e--) {
      var eb = ebullets[e]; eb.y += EBULLET_SPEED;
      if (eb.y &gt; FIELD_H) { field.removeChild(eb.el); ebullets.splice(e, 1); continue; }
      eb.el.style.top = eb.y + &#x27;px&#x27;;
    }
    // targets
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j]; t.y += TARGET_SPEED;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
      if (t.y &gt; 0 &amp;&amp; now &gt;= t.nextFire) { enemyFire(t); t.nextFire = now + 1200 + Math.random() * 1800; }
    }

    // player bullet vs targets/boss
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2]; var consumed = false;
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
