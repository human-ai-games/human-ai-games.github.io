  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0b0e23; color: #e8ecff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#6ee7ff,#c084fc,#ff8bd6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #a9b3e0; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #ffe27a; margin: 0; font-weight: 700; text-shadow: 0 0 10px rgba(255,226,122,.5); }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(110,231,255,.15), inset 0 0 60px rgba(0,0,0,.4); }
  canvas { display: block; }
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(6,8,26,.6); backdrop-filter: blur(2px); }
  .over.show { display: flex; }
  .over h2 { font-size: 34px; margin: 0 0 6px; color: #ff8bd6; text-shadow: 0 0 16px rgba(255,139,214,.6); }
  .over p { margin: 0; color: #cdd6ff; font-size: 18px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ Rocket Rush ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click the field) to fire your rocket upward and dodge the glowing crystals. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;h2&gt;Crashed!&lt;/h2&gt;&lt;p id=&quot;finalMsg&quot;&gt;Score: 0&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420, GROUND_H = 30, HERO_SIZE = 90;
  var GRAVITY = 0.6, JUMP_V = -13;
  var OBSTACLE_W = 30, OBSTACLE_SPEED = 3.5, SPAWN_INTERVAL = 2000;
  var running = false, animId = null, spawnId = null;
  var heroX = 70, heroY = FIELD_H - GROUND_H - HERO_SIZE, heroVY = 0;
  var obstacles = [], score = 0, gameOver = false, tilt = 0;
  var stars = [], groundScroll = 0, frame = 0;
  var nebulae = [], planets = [];
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;), finalMsg = document.getElementById(&#x27;finalMsg&#x27;);

  // ---- parallax starfield (3 depth layers) ----
  for (var i = 0; i &lt; 90; i++) {
    var layer = Math.floor(Math.random()*3);
    stars.push({ x: Math.random()*FIELD_W, y: Math.random()*(FIELD_H-GROUND_H), r: (layer+1)*.6+.3, sp: (layer+1)*.5+.2, layer: layer });
  }
  var nebColors = [&#x27;rgba(140,80,220,&#x27;, &#x27;rgba(60,140,220,&#x27;, &#x27;rgba(220,90,180,&#x27;, &#x27;rgba(90,200,220,&#x27;];
  for (var n = 0; n &lt; 5; n++) {
    nebulae.push({ x: Math.random()*FIELD_W, y: Math.random()*(FIELD_H-GROUND_H-60)+20, r: 70+Math.random()*90, sp: .2+Math.random()*.3, c: nebColors[n % nebColors.length] });
  }
  planets.push({ x: FIELD_W*0.7, y: 80, r: 34, sp: .15, c1:&#x27;#ffd27a&#x27;, c2:&#x27;#c47a2a&#x27;, ring:false });
  planets.push({ x: FIELD_W*0.25, y: 60, r: 22, sp: .25, c1:&#x27;#cfe8ff&#x27;, c2:&#x27;#7fa8d0&#x27;, ring:false });
  planets.push({ x: FIELD_W*1.4, y: 130, r: 40, sp: .1, c1:&#x27;#b7f0d0&#x27;, c2:&#x27;#4a9a7a&#x27;, ring:true });

  // ---- sound ----
  var actx = null, musicGain = null, musicTimer = null, musicStep = 0;
  function AC() { if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return actx; }
  function beep(freq, dur, type, vol) {
    var a = AC(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.value = vol || .15;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime;
    o.start(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur);
  }
  function sndJump() { var a=AC(); if(!a) return; var o=a.createOscillator(),g=a.createGain(); o.type=&#x27;triangle&#x27;; o.connect(g); g.connect(a.destination); var t=a.currentTime; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(720,t+.18); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.start(t); o.stop(t+.2); }
  function sndScore() { beep(880,.08,&#x27;square&#x27;,.12); setTimeout(function(){beep(1320,.1,&#x27;square&#x27;,.12);},70); }
  function sndCrash() { var a=AC(); if(!a) return; var o=a.createOscillator(),g=a.createGain(); o.type=&#x27;sawtooth&#x27;; o.connect(g); g.connect(a.destination); var t=a.currentTime; o.frequency.setValueAtTime(240,t); o.frequency.exponentialRampToValueAtTime(50,t+.5); g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+.55); o.start(t); o.stop(t+.55); }

  // ---- background music: looping synth arpeggio + soft bass ----
  // C minor-ish pattern; each step is a plucky note. Runs on an interval.
  var melody = [261.63,311.13,392.00,466.16,392.00,311.13, 349.23,415.30,523.25,415.30, 293.66,349.23,440.00,349.23];
  var bassLine = [65.41,65.41,77.78,77.78, 87.31,87.31,65.41,65.41];
  function musicTick() {
    var a = AC(); if (!a || !musicGain) return;
    var t = a.currentTime;
    // melody note
    var f = melody[musicStep % melody.length];
    var o = a.createOscillator(), g = a.createGain();
    o.type = &#x27;triangle&#x27;; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.3);
    // bass every 2 steps
    if (musicStep % 2 === 0) {
      var bf = bassLine[(musicStep/2) % bassLine.length];
      var bo = a.createOscillator(), bg = a.createGain();
      bo.type = &#x27;sine&#x27;; bo.frequency.value = bf;
      bg.gain.setValueAtTime(0.0001, t);
      bg.gain.exponentialRampToValueAtTime(0.14, t + 0.03);
      bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      bo.connect(bg); bg.connect(musicGain);
      bo.start(t); bo.stop(t + 0.5);
    }
    musicStep++;
  }
  function startMusic() {
    var a = AC(); if (!a) return;
    if (musicTimer) return;
    if (!musicGain) { musicGain = a.createGain(); musicGain.gain.value = 0.5; musicGain.connect(a.destination); }
    musicStep = 0;
    musicTick();
    musicTimer = setInterval(musicTick, 200);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function spawnObstacle() {
    var h = 26 + Math.random()*36;
    obstacles.push({ x: FIELD_W, h: h, scored: false });
  }
  function placeInitialObstacle() { obstacles = [{ x: FIELD_W - OBSTACLE_W - 12, h: 40, scored: false }]; }

  function jump() {
    if (!running || gameOver) return;
    if (heroY &gt;= FIELD_H - GROUND_H - HERO_SIZE - 1) { heroVY = JUMP_V; sndJump(); }
  }

  function drawRocket(x, y) {
    var S = HERO_SIZE;
    ctx.save();
    ctx.translate(x + S/2, y + S/2);
    ctx.rotate(tilt);
    var sc = S/40;
    ctx.scale(sc, sc);
    var fl = 10 + (Math.sin(frame*.6)*4);
    var grad = ctx.createLinearGradient(0, 20, 0, 20 + fl + 14);
    grad.addColorStop(0, &#x27;#fff2a8&#x27;); grad.addColorStop(.5, &#x27;#ff9d3c&#x27;); grad.addColorStop(1, &#x27;rgba(255,60,0,0)&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-7, 16);
    ctx.lineTo(0, 20 + fl + 14);
    ctx.lineTo(7, 16);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#e8ecff&#x27;;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.quadraticCurveTo(20, -6, 14, 14);
    ctx.lineTo(-14, 14);
    ctx.quadraticCurveTo(-20, -6, 0, -20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#ff6b9d&#x27;;
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.quadraticCurveTo(9,-10,0,-4); ctx.quadraticCurveTo(-9,-10,0,-20); ctx.fill();
    ctx.fillStyle = &#x27;#6ee7ff&#x27;; ctx.beginPath(); ctx.arc(0, -2, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;rgba(255,255,255,.6)&#x27;; ctx.beginPath(); ctx.arc(-2, -4, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#c084fc&#x27;;
    ctx.beginPath(); ctx.moveTo(-14,4); ctx.lineTo(-23,12); ctx.lineTo(-14,10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14,4); ctx.lineTo(23,12); ctx.lineTo(14,10); ctx.fill();
    ctx.restore();
  }

  function drawCrystal(o) {
    var topY = FIELD_H - GROUND_H - o.h;
    var cx = o.x + OBSTACLE_W/2;
    ctx.save();
    ctx.shadowColor = &#x27;#6ee7ff&#x27;; ctx.shadowBlur = 14;
    var g = ctx.createLinearGradient(o.x, topY, o.x + OBSTACLE_W, FIELD_H - GROUND_H);
    g.addColorStop(0, &#x27;#a8f0ff&#x27;); g.addColorStop(.5, &#x27;#3ba7d6&#x27;); g.addColorStop(1, &#x27;#1e6fa8&#x27;);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, topY);
    ctx.lineTo(o.x + OBSTACLE_W, topY + 12);
    ctx.lineTo(o.x + OBSTACLE_W, FIELD_H - GROUND_H);
    ctx.lineTo(o.x, FIELD_H - GROUND_H);
    ctx.lineTo(o.x, topY + 12);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = &#x27;rgba(255,255,255,.35)&#x27;; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx, FIELD_H-GROUND_H); ctx.stroke();
    ctx.restore();
  }

  function drawPlanet(p) {
    ctx.save();
    if (p.ring) {
      ctx.strokeStyle = &#x27;rgba(200,220,255,.35)&#x27;; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r*1.7, p.r*.5, -0.4, 0, Math.PI*2); ctx.stroke();
    }
    var g = ctx.createRadialGradient(p.x - p.r*.4, p.y - p.r*.4, p.r*.2, p.x, p.y, p.r);
    g.addColorStop(0, p.c1); g.addColorStop(1, p.c2);
    ctx.fillStyle = g;
    ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render() {
    var sky = ctx.createLinearGradient(0,0,0,FIELD_H);
    sky.addColorStop(0,&#x27;#1a1146&#x27;); sky.addColorStop(.6,&#x27;#2a1a5e&#x27;); sky.addColorStop(1,&#x27;#0b0e23&#x27;);
    ctx.fillStyle = sky; ctx.fillRect(0,0,FIELD_W,FIELD_H);
    for (var m=0;m&lt;nebulae.length;m++){
      var ne = nebulae[m];
      var ng = ctx.createRadialGradient(ne.x, ne.y, 0, ne.x, ne.y, ne.r);
      ng.addColorStop(0, ne.c + &#x27;0.22)&#x27;); ng.addColorStop(1, ne.c + &#x27;0)&#x27;);
      ctx.fillStyle = ng;
      ctx.beginPath(); ctx.arc(ne.x, ne.y, ne.r, 0, Math.PI*2); ctx.fill();
    }
    for (var p=0;p&lt;planets.length;p++) drawPlanet(planets[p]);
    for (var i=0;i&lt;stars.length;i++){ var s=stars[i]; ctx.globalAlpha=(.3+s.layer*.2)+Math.sin((frame*.05)+i)*.25+.2; ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    for (var j=0;j&lt;obstacles.length;j++) drawCrystal(obstacles[j]);
    var gg = ctx.createLinearGradient(0,FIELD_H-GROUND_H,0,FIELD_H);
    gg.addColorStop(0,&#x27;#5b3a8c&#x27;); gg.addColorStop(1,&#x27;#2a1a5e&#x27;);
    ctx.fillStyle = gg; ctx.fillRect(0,FIELD_H-GROUND_H,FIELD_W,GROUND_H);
    ctx.strokeStyle=&#x27;rgba(200,150,255,.4)&#x27;; ctx.lineWidth=2;
    for (var x=-((groundScroll)%40); x&lt;FIELD_W; x+=40){ ctx.beginPath(); ctx.moveTo(x,FIELD_H-GROUND_H); ctx.lineTo(x-14,FIELD_H); ctx.stroke(); }
    drawRocket(heroX, heroY);
  }

  function animateBackground() {
    frame++;
    for (var i=0;i&lt;stars.length;i++){ stars[i].x -= stars[i].sp; if (stars[i].x &lt; 0){ stars[i].x = FIELD_W; stars[i].y = Math.random()*(FIELD_H-GROUND_H); } }
    for (var m=0;m&lt;nebulae.length;m++){ nebulae[m].x -= nebulae[m].sp; if (nebulae[m].x + nebulae[m].r &lt; 0){ nebulae[m].x = FIELD_W + nebulae[m].r; nebulae[m].y = Math.random()*(FIELD_H-GROUND_H-60)+20; } }
    for (var p=0;p&lt;planets.length;p++){ planets[p].x -= planets[p].sp; if (planets[p].x + planets[p].r*2 &lt; 0){ planets[p].x = FIELD_W + planets[p].r*2 + Math.random()*200; planets[p].y = 40 + Math.random()*120; } }
  }

  function tick() {
    if (!running) return;
    animateBackground();
    groundScroll += OBSTACLE_SPEED;
    heroVY += GRAVITY; heroY += heroVY;
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    if (heroY &gt; floorY){ heroY = floorY; heroVY = 0; }
    if (heroY &lt; 0){ heroY = 0; heroVY = 0; }
    tilt = Math.max(-.4, Math.min(.4, heroVY * .03));

    for (var k=obstacles.length-1;k&gt;=0;k--){
      var o = obstacles[k];
      o.x -= OBSTACLE_SPEED;
      if (o.x + OBSTACLE_W &lt; 0){ obstacles.splice(k,1); continue; }
      if (!o.scored &amp;&amp; o.x + OBSTACLE_W &lt; heroX){ o.scored=true; score++; scoreEl.textContent=score; sndScore(); }
      var obstacleTop = FIELD_H - GROUND_H - o.h;
      if (heroX + HERO_SIZE - 22 &gt; o.x &amp;&amp; heroX + 22 &lt; o.x + OBSTACLE_W &amp;&amp; heroY + HERO_SIZE - 14 &gt; obstacleTop){
        gameOver = true; sndCrash(); stopMusic(); finalMsg.textContent = &#x27;Score: &#x27; + score; overEl.classList.add(&#x27;show&#x27;); stopGame(); render(); return;
      }
    }
    render();
    animId = requestAnimationFrame(tick);
  }

  var idleId = null;
  function idleLoop() {
    if (running) return;
    animateBackground();
    render();
    idleId = requestAnimationFrame(idleLoop);
  }

  function startGame() {
    if (running) return;
    if (idleId){ cancelAnimationFrame(idleId); idleId = null; }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    heroX = 70; heroY = FIELD_H - GROUND_H - HERO_SIZE; heroVY = 0; tilt = 0;
    gameOver = false; overEl.classList.remove(&#x27;show&#x27;);
    obstacles = []; spawnObstacle();
    running = true;
    startMusic();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnObstacle, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    stopMusic();
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    if (spawnId){ clearInterval(spawnId); spawnId=null; }
    idleLoop();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){ if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); } });
  cv.addEventListener(&#x27;click&#x27;, function(){ jump(); });
  window.addEventListener(&#x27;message&#x27;, function(e){ if (!e.data||typeof e.data!==&#x27;object&#x27;) return; if (e.data.type===&#x27;wd_start&#x27;) startGame(); else if (e.data.type===&#x27;wd_stop&#x27;) stopGame(); });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  placeInitialObstacle();
  render();
  idleLoop();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
