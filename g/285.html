<!doctype html>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  .controls button:hover:not(:disabled) { background: #195fcb; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>✦ BRICK BREAKER ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(160deg,#1a1035,#2d1a5e); color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff5eae,#ffd166,#4be0d5,#6a8bff);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #d5d0ff; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 20px; font-size: 18px; font-weight: 600; }
  .hud span { color: #ffd166; }
  .stage { display: flex; gap: 10px; align-items: flex-start; }
  canvas { background: radial-gradient(circle at 50% 15%, #241a4d, #100a26); border-radius: 10px; box-shadow: 0 0 30px rgba(120,90,255,.4); }
  .powers { width: 138px; display: flex; flex-direction: column; gap: 6px; }
  .powers h3 { margin: 0 0 2px; font-size: 13px; color: #b8aaff; letter-spacing: .5px; text-transform: uppercase; }
  .pw { background: rgba(255,255,255,.07); border-radius: 8px; padding: 5px 7px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  .pw .row { display: flex; justify-content: space-between; align-items: center; }
  .pw .nm { font-weight: 600; display:flex; gap:4px; align-items:center; }
  .pw .tm { color: #ffd166; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
  .bar &gt; i { display: block; height: 100%; background: linear-gradient(90deg,#4be0d5,#6a8bff); }
  .none { font-size: 12px; color: #8a80c0; font-style: italic; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ BRICK BREAKER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; or the mouse, press &lt;strong&gt;Space&lt;/strong&gt; to launch (and to fire lasers). Break bricks to catch falling power-ups — smash every brick for the next level!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp; Lives: &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt; &amp;nbsp; Level: &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;560&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;powers&quot;&gt;
      &lt;h3&gt;Power-ups&lt;/h3&gt;
      &lt;div id=&quot;pwlist&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById(&#x27;score&#x27;),
      livesEl = document.getElementById(&#x27;lives&#x27;),
      levelEl = document.getElementById(&#x27;level&#x27;),
      pwlist = document.getElementById(&#x27;pwlist&#x27;);

  var BASE_PADDLE_W = 110, PADDLE_H = 15, PADDLE_SPEED = 7;
  var BALL_R = 8;
  var running = false, animId = null, keys = {};

  var paddleX, launched, score, lives, level, baseSpeed;
  var balls = [];
  var bricks = [], powerups = [], bullets = [], particles = [];
  var COLS = 9, ROWS = 6, BRICK_H = 22, BRICK_GAP = 5, TOP_OFF = 40, SIDE_OFF = 10;
  var BRICK_W = (W - SIDE_OFF*2 - BRICK_GAP*(COLS-1)) / COLS;
  var COLORS = [&#x27;#ff5e7e&#x27;,&#x27;#ff9e4a&#x27;,&#x27;#ffd166&#x27;,&#x27;#6be36b&#x27;,&#x27;#4be0d5&#x27;,&#x27;#6a8bff&#x27;,&#x27;#c46bff&#x27;];
  var PADDLE_TOP = H - 40;

  function paddleW(){ return active.wide ? BASE_PADDLE_W*1.6 : BASE_PADDLE_W; }

  var PW_DUR = 10000;
  var PTYPES = {
    big:   { name:&#x27;Big Ball&#x27;,   color:&#x27;#ffd166&#x27;, emoji:&#x27;🔵&#x27; },
    sticky:{ name:&#x27;Sticky&#x27;,     color:&#x27;#4be0d5&#x27;, emoji:&#x27;🧲&#x27; },
    multi: { name:&#x27;Multi-Ball&#x27;, color:&#x27;#6a8bff&#x27;, emoji:&#x27;⚛️&#x27; },
    laser: { name:&#x27;Lasers&#x27;,     color:&#x27;#ff5e7e&#x27;, emoji:&#x27;🔫&#x27; },
    fire:  { name:&#x27;Fireball&#x27;,   color:&#x27;#ff9e4a&#x27;, emoji:&#x27;🔥&#x27; },
    wide:  { name:&#x27;Wide Paddle&#x27;,color:&#x27;#6be36b&#x27;, emoji:&#x27;↔️&#x27; }
  };
  var active = {};

  // ---- audio ----
  var AC = null, musicNodes = null, musicTimer = null;
  function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(freq, dur, type, vol, slideTo){
    var a = ac(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }
  function sBrick(){ beep(420+Math.random()*120, 0.08, &#x27;square&#x27;, 0.11); }
  function sPaddle(){ beep(220, 0.09, &#x27;sine&#x27;, 0.16, 160); }
  function sWall(){ beep(320, 0.05, &#x27;triangle&#x27;, 0.07); }
  function sLaunch(){ beep(180, 0.18, &#x27;sawtooth&#x27;, 0.14, 520); }
  function sPower(){ beep(520,0.1,&#x27;sine&#x27;,0.15,780); setTimeout(function(){beep(780,0.12,&#x27;sine&#x27;,0.15,1100);},90); }
  function sLaser(){ beep(900,0.08,&#x27;square&#x27;,0.08,300); }
  function sLose(){ beep(300,0.3,&#x27;sawtooth&#x27;,0.18,80); }
  function sExplode(){
    var a = ac(); if(!a) return;
    // noise burst
    var dur = 0.35;
    var buf = a.createBuffer(1, a.sampleRate*dur, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i&lt;d.length;i++){ d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,2); }
    var src = a.createBufferSource(); src.buffer = buf;
    var g = a.createGain(); g.gain.value = 0.22;
    var f = a.createBiquadFilter(); f.type=&#x27;lowpass&#x27;; f.frequency.value=900;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
    beep(120,0.3,&#x27;sawtooth&#x27;,0.2,50);
  }

  // background music — soft arpeggio loop
  var MELODY = [220,277,330,277, 246,330,392,330, 196,246,294,246, 261,330,392,494];
  var mIdx = 0;
  function musicStep(){
    var a = ac(); if(!a || !running) return;
    var f = MELODY[mIdx % MELODY.length];
    var o = a.createOscillator(), g = a.createGain();
    o.type=&#x27;triangle&#x27;; o.frequency.value=f;
    g.gain.setValueAtTime(0.0, a.currentTime);
    g.gain.linearRampToValueAtTime(0.045, a.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.4);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.42);
    // soft bass every 4
    if (mIdx % 4 === 0){
      var ob = a.createOscillator(), gb = a.createGain();
      ob.type=&#x27;sine&#x27;; ob.frequency.value = f/2;
      gb.gain.setValueAtTime(0.05, a.currentTime);
      gb.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.5);
      ob.connect(gb); gb.connect(a.destination); ob.start(); ob.stop(a.currentTime+0.5);
    }
    mIdx++;
  }
  function startMusic(){ stopMusic(); musicTimer = setInterval(musicStep, 300); }
  function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

  function newBall(x,y,vx,vy){ return {x:x,y:y,vx:vx,vy:vy,trail:[]}; }
  function curSpeed(){ return baseSpeed; }

  function buildBricks() {
    bricks = [];
    for (var r = 0; r &lt; ROWS; r++)
      for (var c = 0; c &lt; COLS; c++)
        bricks.push({ x: SIDE_OFF + c*(BRICK_W+BRICK_GAP), y: TOP_OFF + r*(BRICK_H+BRICK_GAP),
          color: COLORS[(r + level) % COLORS.length], alive:true, val:(ROWS-r)*10 });
  }

  function resetBallOnPaddle() {
    launched = false;
    paddleX = (W - paddleW()) / 2;
    balls = [ newBall(W/2, PADDLE_TOP - BALL_R, 0, 0) ];
  }

  function newLevel() {
    baseSpeed = 3.4 + level * 0.28;   // reduced starting speed
    buildBricks();
    resetBallOnPaddle();
    powerups = []; bullets = []; particles = [];
  }

  function startGame() {
    if (running) return;
    var a = ac(); if (a &amp;&amp; a.state === &#x27;suspended&#x27;) a.resume();
    score = 0; lives = 3; level = 1; active = {};
    updateHud(); renderPowers();
    newLevel();
    for (var k in keys) keys[k] = false;
    running = true;
    mIdx = 0; startMusic();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false; stopMusic();
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function updateHud() { scoreEl.textContent = score; livesEl.textContent = lives; levelEl.textContent = level; }

  function launch() {
    var a = ac(); if (a &amp;&amp; a.state === &#x27;suspended&#x27;) a.resume();
    if (!launched) {
      launched = true;
      var ang = (-Math.PI/2) + (Math.random()*0.5 - 0.25);
      balls[0].vx = Math.cos(ang)*curSpeed();
      balls[0].vy = Math.sin(ang)*curSpeed();
      sLaunch();
    } else if (active.sticky) {
      for (var i=0;i&lt;balls.length;i++){
        if (balls[i].stuck){
          balls[i].stuck = false;
          var ang2 = (-Math.PI/2) + (Math.random()*0.5-0.25);
          balls[i].vx = Math.cos(ang2)*curSpeed();
          balls[i].vy = Math.sin(ang2)*curSpeed();
          sLaunch();
        }
      }
    }
    if (active.laser) fireLasers();
  }

  function fireLasers(){
    if (!active.laser) return;
    if (fireLasers._cd &amp;&amp; Date.now()-fireLasers._cd &lt; 220) return;
    fireLasers._cd = Date.now();
    bullets.push({x:paddleX+6, y:PADDLE_TOP});
    bullets.push({x:paddleX+paddleW()-6, y:PADDLE_TOP});
    sLaser();
  }

  function loseLife() {
    lives--; updateHud(); sLose();
    if (lives &lt;= 0) {
      draw(); drawBanner(&#x27;GAME OVER&#x27;,&#x27;Press Start below to play again&#x27;);
      running = false; stopMusic();
      if (animId){ cancelAnimationFrame(animId); animId=null; }
      return;
    }
    active = {}; renderPowers();
    resetBallOnPaddle();
    powerups = []; bullets = [];
  }

  function grantPower(type){
    active[type] = Date.now() + PW_DUR;
    sPower();
    // spark ring on paddle
    for (var i=0;i&lt;18;i++){
      var a = Math.random()*Math.PI*2, sp=2+Math.random()*3;
      particles.push({x:paddleX+paddleW()/2, y:PADDLE_TOP, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1,
        life:1, color:PTYPES[type].color, size:3});
    }
    if (type === &#x27;multi&#x27;) {
      var extra = [];
      balls.forEach(function(b){
        if (b.stuck) return;
        for (var k=0;k&lt;2;k++){
          var ang = Math.atan2(b.vy,b.vx) + (k===0?0.5:-0.5);
          var s = curSpeed();
          extra.push(newBall(b.x,b.y,Math.cos(ang)*s,Math.sin(ang)*s));
        }
      });
      balls = balls.concat(extra);
    }
    renderPowers();
  }

  function spawnPowerup(x,y){
    var keysArr = Object.keys(PTYPES);
    var t = keysArr[Math.floor(Math.random()*keysArr.length)];
    powerups.push({x:x, y:y, type:t, vy:2.2, spin:0});
  }

  function ballRadius(){ return active.big ? BALL_R*1.9 : BALL_R; }

  function burst(x,y,color,n,speed,size){
    for (var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, sp = 1+Math.random()*(speed||3);
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color,size:size||3});
    }
  }
  // brick shatter fragments
  function shatter(b){
    var cols = 3, rows = 2, fw = BRICK_W/cols, fh = BRICK_H/rows;
    for (var r=0;r&lt;rows;r++) for(var c=0;c&lt;cols;c++){
      particles.push({x:b.x+c*fw+fw/2, y:b.y+r*fh+fh/2, vx:(Math.random()-0.5)*4, vy:-1-Math.random()*2.5,
        life:1, color:b.color, size:fw*0.8, rect:true, spin:Math.random()*0.3-0.15, rot:0});
    }
  }
  function explode(x,y,color){
    sExplode();
    burst(x,y,&#x27;#ffd166&#x27;,14,5,4);
    burst(x,y,&#x27;#ff5e2a&#x27;,12,6,5);
    burst(x,y,&#x27;#fff&#x27;,6,4,3);
    // shockwave ring
    particles.push({x:x,y:y,vx:0,vy:0,life:1,color:&#x27;#ff9e4a&#x27;,ring:true,radius:4});
  }

  function killBrick(b, viaFire){
    b.alive = false;
    score += b.val; updateHud();
    baseSpeed = Math.min(baseSpeed + 0.03, (3.4+level*0.28)+5);
    shatter(b);
    if (Math.random() &lt; 0.17) spawnPowerup(b.x+BRICK_W/2, b.y+BRICK_H/2);  // reduced chance
    if (viaFire) explode(b.x+BRICK_W/2, b.y+BRICK_H/2, b.color);
    else { burst(b.x+BRICK_W/2, b.y+BRICK_H/2, b.color, 6); sBrick(); }
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    for (var t in active){ if (active[t] &amp;&amp; now &gt; active[t]){ delete active[t]; renderPowers(); } }

    if (keys[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keys[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W - paddleW(), paddleX));

    var R = ballRadius();

    if (!launched) {
      balls[0].x = paddleX + paddleW()/2;
      balls[0].y = PADDLE_TOP - R;
    } else {
      for (var bi = balls.length-1; bi &gt;= 0; bi--) {
        var ball = balls[bi];
        if (ball.stuck) { ball.x = paddleX + ball.stickOff; ball.y = PADDLE_TOP - R; continue; }
        // trail
        ball.trail.push({x:ball.x, y:ball.y}); if (ball.trail.length&gt;10) ball.trail.shift();
        ball.x += ball.vx; ball.y += ball.vy;

        if (ball.x - R &lt;= 0) { ball.x = R; ball.vx = Math.abs(ball.vx); sWall(); }
        if (ball.x + R &gt;= W) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); sWall(); }
        if (ball.y - R &lt;= 0) { ball.y = R; ball.vy = Math.abs(ball.vy); sWall(); }

        var pw = paddleW();
        if (ball.vy &gt; 0 &amp;&amp; ball.y + R &gt;= PADDLE_TOP &amp;&amp; ball.y - R &lt;= PADDLE_TOP + PADDLE_H &amp;&amp;
            ball.x &gt;= paddleX &amp;&amp; ball.x &lt;= paddleX + pw) {
          if (active.sticky) {
            ball.stuck = true; ball.stickOff = ball.x - paddleX; ball.vx=0; ball.vy=0;
          } else {
            var hit = (ball.x - (paddleX + pw/2)) / (pw/2);
            var ang = hit * (Math.PI/3);
            var spd = curSpeed();
            ball.vx = Math.sin(ang)*spd;
            ball.vy = -Math.abs(Math.cos(ang)*spd);
            ball.y = PADDLE_TOP - R;
            sPaddle();
            burst(ball.x, PADDLE_TOP, &#x27;#4be0d5&#x27;, 4, 2, 2);
          }
        }

        for (var i = 0; i &lt; bricks.length; i++) {
          var b = bricks[i];
          if (!b.alive) continue;
          if (ball.x + R &gt;= b.x &amp;&amp; ball.x - R &lt;= b.x + BRICK_W &amp;&amp;
              ball.y + R &gt;= b.y &amp;&amp; ball.y - R &lt;= b.y + BRICK_H) {
            if (active.fire) { killBrick(b, true); }
            else {
              killBrick(b, false);
              var overX = Math.min(ball.x + R - b.x, b.x + BRICK_W - (ball.x - R));
              var overY = Math.min(ball.y + R - b.y, b.y + BRICK_H - (ball.y - R));
              if (overX &lt; overY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
              break;
            }
          }
        }

        if (!ball.stuck) {
          var cur = Math.hypot(ball.vx, ball.vy), want = curSpeed();
          if (cur &gt; 0.001) { ball.vx = ball.vx/cur*want; ball.vy = ball.vy/cur*want; }
        }

        if (ball.y - R &gt; H) { balls.splice(bi,1); }
      }
      if (balls.length === 0) { loseLife(); }
    }

    // bullets
    for (var bu = bullets.length-1; bu &gt;= 0; bu--) {
      var bl = bullets[bu]; bl.y -= 9;
      var hitB = false;
      for (var j=0;j&lt;bricks.length;j++){
        var br = bricks[j];
        if (!br.alive) continue;
        if (bl.x &gt;= br.x &amp;&amp; bl.x &lt;= br.x+BRICK_W &amp;&amp; bl.y &lt;= br.y+BRICK_H &amp;&amp; bl.y &gt;= br.y){
          killBrick(br, false); hitB = true; break;
        }
      }
      if (hitB || bl.y &lt; 0) bullets.splice(bu,1);
    }

    // powerups fall
    for (var p = powerups.length-1; p &gt;= 0; p--) {
      var pu = powerups[p]; pu.y += pu.vy; pu.spin += 0.05;
      if (pu.y+11 &gt;= PADDLE_TOP &amp;&amp; pu.y-11 &lt;= PADDLE_TOP+PADDLE_H &amp;&amp; pu.x &gt;= paddleX &amp;&amp; pu.x &lt;= paddleX+paddleW()) {
        grantPower(pu.type); powerups.splice(p,1);
      } else if (pu.y &gt; H) powerups.splice(p,1);
    }

    // particles
    for (var q = particles.length-1; q &gt;= 0; q--) {
      var pt = particles[q];
      if (pt.ring){ pt.radius += 3; pt.life -= 0.05; }
      else { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life -= 0.025; if(pt.rect) pt.rot += pt.spin; }
      if (pt.life &lt;= 0) particles.splice(q,1);
    }

    if (bricks.every(function(b){ return !b.alive; })) { level++; updateHud(); newLevel(); }

    draw();
    if (!launched) drawHint();
    animId = requestAnimationFrame(tick);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    // bricks
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i]; if (!b.alive) continue;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 5); ctx.fill();
      ctx.fillStyle = &#x27;rgba(255,255,255,0.30)&#x27;;
      roundRect(b.x+2, b.y+2, BRICK_W-4, 5, 3); ctx.fill();
      ctx.fillStyle = &#x27;rgba(0,0,0,0.20)&#x27;;

  setInterval(function(){ if(running) renderPowers(); }, 100);

  // input
  window.addEventListener(&#x27;keydown&#x27;, function(e){

  cv.addEventListener(&#x27;mousedown&#x27;, function(){ launch(); });

  window.addEventListener(&#x27;message&#x27;, function(e){

  // telemetry
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
