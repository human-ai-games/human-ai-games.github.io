&lt;html&gt;&lt;head&gt;&lt;style&gt;

  .critter { position: absolute; width: 68px; height: 68px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; font-size: 44px; transform: scale(0); animation: pop 0.25s ease-out forwards; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }

  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }

  @keyframes bannerpop { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);} 25%{opacity:1;transform:translate(-50%,-50%) scale(1.1);} 75%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1);} }
  #comboFx { position:absolute; top:30%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:46px; font-weight:900; pointer-events:none; z-index:7; text-shadow:0 0 18px rgba(255,209,102,0.9); }
  #comboFx.show { animation: combofx 0.9s ease-out forwards; }
  @keyframes combofx { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.3) rotate(-8deg);} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(4deg);} 60%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1);} }
  .flash-frenzy { box-shadow: inset 0 0 60px rgba(255,209,102,0.6); }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🎯 Critter Bash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;You have 60 seconds — bash critters to score, chain combos for animated bonuses, and defeat 👹 bosses. Watch for surprise Bonus Rush rounds and 🌈 rare jackpots; earn a medal at the end based on your score!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;pill&quot; id=&quot;timePill&quot;&gt;⏱️ &lt;b id=&quot;time&quot;&gt;60&lt;/b&gt;s&lt;/span&gt;
    &lt;span class=&quot;pill&quot;&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;pill mult&quot;&gt;Combo: ×&lt;span id=&quot;mult&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;pill&quot;&gt;Streak: &lt;b id=&quot;streak&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;pill&quot;&gt;🪙 &lt;b id=&quot;coins&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;p id=&quot;challenge&quot;&gt;Challenge: —&lt;/p&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div id=&quot;banner&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;comboFx&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;boss&quot;&gt;&lt;div class=&quot;face&quot;&gt;👹&lt;/div&gt;&lt;div id=&quot;bossbar&quot;&gt;&lt;div id=&quot;bossfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div id=&quot;shop&quot;&gt;
      &lt;h2&gt;🛍️ Skin Shop&lt;/h2&gt;
      &lt;div class=&quot;skins&quot; id=&quot;skinList&quot;&gt;&lt;/div&gt;
      &lt;button class=&quot;shopbtn&quot; id=&quot;closeShop&quot;&gt;Back to Game&lt;/button&gt;
    &lt;/div&gt;
    &lt;div id=&quot;results&quot;&gt;
      &lt;h2&gt;Time&#x27;s Up!&lt;/h2&gt;
      &lt;div id=&quot;medal&quot;&gt;🏅&lt;/div&gt;
      &lt;div id=&quot;medalName&quot;&gt;—&lt;/div&gt;

    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W=640, BOARD_H=372, SIZE=68, GAME_TIME=60;
  var score=0, best=0, combo=0, mult=1, coins=0, streak=0, difTime=0, timeLeft=GAME_TIME;
  var running=false, spawnId=null, timerId=null;
  var timeouts=[];
  var frenzy=false, frenzyTimeout=null, slowmo=false, slowmoTimeout=null;
  var bossActive=false, bossHp=0, bossHpMax=0, bossTimeout=null, nextBossScore=25;
  var bonusRush=false, bonusTimeout=null;
  var board=document.getElementById(&#x27;board&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;), multEl=document.getElementById(&#x27;mult&#x27;);
  var coinsEl=document.getElementById(&#x27;coins&#x27;), streakEl=document.getElementById(&#x27;streak&#x27;);
  var timeEl=document.getElementById(&#x27;time&#x27;), timePill=document.getElementById(&#x27;timePill&#x27;);
  var banner=document.getElementById(&#x27;banner&#x27;), comboFx=document.getElementById(&#x27;comboFx&#x27;);
  var challengeEl=document.getElementById(&#x27;challenge&#x27;);
  var bossEl=document.getElementById(&#x27;boss&#x27;), bossFill=document.getElementById(&#x27;bossfill&#x27;);
  var shop=document.getElementById(&#x27;shop&#x27;), skinList=document.getElementById(&#x27;skinList&#x27;);
  var results=document.getElementById(&#x27;results&#x27;);

  var SKINS=[
    {id:&#x27;classic&#x27;, name:&#x27;Classic&#x27;, cost:0, set:[&#x27;🐸&#x27;,&#x27;🐹&#x27;,&#x27;🐷&#x27;,&#x27;🐵&#x27;,&#x27;🐰&#x27;,&#x27;🐤&#x27;,&#x27;🦊&#x27;,&#x27;🐻&#x27;]},
    {id:&#x27;ocean&#x27;, name:&#x27;Ocean&#x27;, cost:30, set:[&#x27;🐠&#x27;,&#x27;🐙&#x27;,&#x27;🦀&#x27;,&#x27;🐡&#x27;,&#x27;🦑&#x27;,&#x27;🐬&#x27;,&#x27;🦈&#x27;,&#x27;🐳&#x27;]},
    {id:&#x27;space&#x27;, name:&#x27;Cosmic&#x27;, cost:60, set:[&#x27;👽&#x27;,&#x27;🛸&#x27;,&#x27;🌟&#x27;,&#x27;☄️&#x27;,&#x27;🪐&#x27;,&#x27;🌙&#x27;,&#x27;⚡&#x27;,&#x27;🌌&#x27;]},
    {id:&#x27;spooky&#x27;, name:&#x27;Spooky&#x27;, cost:100, set:[&#x27;👻&#x27;,&#x27;🎃&#x27;,&#x27;🦇&#x27;,&#x27;🕷️&#x27;,&#x27;💀&#x27;,&#x27;🧟&#x27;,&#x27;🧛&#x27;,&#x27;🕸️&#x27;]}
  ];
  var owned={classic:true}, activeSkin=&#x27;classic&#x27;;

  var challenge=null;
  var CHALLENGES=[
    {t:&#x27;Score 80 points&#x27;, check:function(){return score&gt;=80;}, reward:20},
    {t:&#x27;Reach a 12 streak&#x27;, check:function(){return maxStreak&gt;=12;}, reward:25},
    {t:&#x27;Defeat 2 bosses&#x27;, check:function(){return bossesKilled&gt;=2;}, reward:35},
    {t:&#x27;Catch 3 rare targets&#x27;, check:function(){return raresCaught&gt;=3;}, reward:30},
    {t:&#x27;Hit a ×5 combo&#x27;, check:function(){return maxMult&gt;=5;}, reward:20}
  ];
  var maxStreak=0, bossesKilled=0, raresCaught=0, maxMult=1, challengeDone=false;

  var actx=null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(f,d,t,v){ var c=ac(); if(!c)return; var o=c.createOscillator(),g=c.createGain(); o.type=t||&#x27;sine&#x27;; o.frequency.value=f; g.gain.setValueAtTime(v||0.15,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d); }
  function hitSound(n){ beep(400+Math.min(n,12)*40,0.11,&#x27;square&#x27;,0.13); }        // critter
  function starSound(){ beep(700,0.09,&#x27;triangle&#x27;,0.16); setTimeout(function(){beep(1050,0.13,&#x27;triangle&#x27;,0.16);},80); } // star
  function bombSound(){ beep(110,0.32,&#x27;sawtooth&#x27;,0.2); setTimeout(function(){beep(70,0.25,&#x27;sawtooth&#x27;,0.18);},60); } // bomb
  function giftSound(){ beep(500,0.08,&#x27;sine&#x27;,0.15); setTimeout(function(){beep(720,0.1,&#x27;sine&#x27;,0.15);},70); } // gift
  function coinSound(){ beep(950,0.05,&#x27;square&#x27;,0.13); setTimeout(function(){beep(1300,0.08,&#x27;square&#x27;,0.13);},55); } // coin
  function rareSound(){ [523,659,784,1046,1318].forEach(function(f,i){ setTimeout(function(){beep(f,0.12,&#x27;triangle&#x27;,0.17);},i*65); }); } // rare
  function bossSound(){ beep(80,0.5,&#x27;sawtooth&#x27;,0.22); }
  function bossHitSound(){ beep(180,0.09,&#x27;square&#x27;,0.14); }
  function winSound(){ [523,659,784,1046,1318].forEach(function(f,i){ setTimeout(function(){beep(f,0.15,&#x27;square&#x27;,0.15);},i*90); }); }
  function comboSound(n){ var base=520+n*30; [base,base*1.25,base*1.5].forEach(function(f,i){ setTimeout(function(){beep(f,0.1,&#x27;triangle&#x27;,0.15);},i*60); }); }
  function tickSound(){ beep(880,0.05,&#x27;sine&#x27;,0.1); }
  function bonusStartSound(){ [660,880,1100].forEach(function(f,i){ setTimeout(function(){beep(f,0.1,&#x27;sine&#x27;,0.15);},i*70); }); }

  function critterSet(){ for(var i=0;i&lt;SKINS.length;i++) if(SKINS[i].id===activeSkin) return SKINS[i].set; return SKINS[0].set; }

  function clearAll(){ for(var i=0;i&lt;timeouts.length;i++)clearTimeout(timeouts[i]); timeouts=[]; var k=board.querySelectorAll(&#x27;.critter,.float,.spark&#x27;); for(var j=0;j&lt;k.length;j++)k[j].remove(); hideBoss(); }
  function showFloat(x,y,txt,color){ var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;float&#x27;; f.textContent=txt; f.style.color=color||&#x27;#ffd166&#x27;; f.style.left=x+&#x27;px&#x27;; f.style.top=y+&#x27;px&#x27;; board.appendChild(f); setTimeout(function(){f.remove();},700); }
  function showBanner(txt){ banner.textContent=txt; banner.classList.remove(&#x27;show&#x27;); void banner.offsetWidth; banner.classList.add(&#x27;show&#x27;); }
  function sparkle(x,y){ var e=[&#x27;✨&#x27;,&#x27;⭐&#x27;,&#x27;💫&#x27;,&#x27;🌟&#x27;]; for(var i=0;i&lt;6;i++){ (function(i){ var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;spark&#x27;; s.textContent=e[i%e.length]; s.style.left=x+&#x27;px&#x27;; s.style.top=y+&#x27;px&#x27;; var a=Math.random()*6.28, d=30+Math.random()*30; s.style.setProperty(&#x27;--sv&#x27;,&#x27;translate(&#x27;+(Math.cos(a)*d)+&#x27;px,&#x27;+(Math.sin(a)*d)+&#x27;px)&#x27;); board.appendChild(s); setTimeout(function(){s.remove();},600); })(i); } }
  function shake(){ board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;); }
  function comboMilestone(n){ comboFx.textContent=&#x27;COMBO ×&#x27;+mult+&#x27;!&#x27;; comboFx.style.color=n&gt;=15?&#x27;#ff6b6b&#x27;:(n&gt;=9?&#x27;#ffd166&#x27;:&#x27;#4ecdc4&#x27;); comboFx.classList.remove(&#x27;show&#x27;); void comboFx.offsetWidth; comboFx.classList.add(&#x27;show&#x27;); shake(); comboSound(n); }

  function currentLife(){ return Math.max(650,1400-difTime*40); }
  function currentSpawn(){ var s=Math.max(360,850-difTime*25); if(bonusRush)s*=0.4; if(slowmo)s*=1.9; return s; }

  function pickType(){ var r=Math.random(); if(bonusRush){ if(r&lt;0.5)return&#x27;critter&#x27;; if(r&lt;0.7)return&#x27;star&#x27;; if(r&lt;0.85)return&#x27;coin&#x27;; return&#x27;rare&#x27;; } if(r&lt;0.04)return&#x27;rare&#x27;; if(r&lt;0.13)return&#x27;bomb&#x27;; if(r&lt;0.21)return&#x27;star&#x27;; if(r&lt;0.28)return&#x27;gift&#x27;; if(r&lt;0.34)return&#x27;coin&#x27;; return&#x27;critter&#x27;; }
  function addCoins(n){ coins+=n; coinsEl.textContent=coins; }

  function spawnMole(){
    if(bossActive) return;
    var type=pickType();
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;critter&#x27;;
    el.style.left=(Math.random()*(BOARD_W-SIZE))+&#x27;px&#x27;; el.style.top=(Math.random()*(BOARD_H-SIZE))+&#x27;px&#x27;;
    var emoji, gone=false;
    if(type===&#x27;bomb&#x27;){ emoji=&#x27;💣&#x27;; el.classList.add(&#x27;wiggle&#x27;); }
    else if(type===&#x27;star&#x27;){ emoji=&#x27;⭐&#x27;; }
    else if(type===&#x27;gift&#x27;){ emoji=&#x27;🎁&#x27;; }
    else if(type===&#x27;coin&#x27;){ emoji=&#x27;🪙&#x27;; }
    else if(type===&#x27;rare&#x27;){ emoji=&#x27;🌈&#x27;; el.classList.add(&#x27;rare&#x27;); }
    else { var s=critterSet(); emoji=s[Math.floor(Math.random()*s.length)]; }
    el.textContent=emoji;
    el.addEventListener(&#x27;mousedown&#x27;, function(){
      if(gone||!running) return; gone=true;
      var bx=parseFloat(el.style.left), by=parseFloat(el.style.top);
      if(type===&#x27;bomb&#x27;){ combo=0; mult=1; streak=0; updateHud(); bombSound(); shake(); showFloat(bx,by,&#x27;💥 STREAK LOST&#x27;,&#x27;#ff6b6b&#x27;); }
      else {
        streak++; if(streak&gt;maxStreak)maxStreak=streak;
        var prevMult=mult; combo++; updateMult();
        if(mult&gt;prevMult &amp;&amp; mult&gt;=2) comboMilestone(combo);
        var streakBonus= streak&gt;=5?Math.floor(streak/5)*2:0;
        if(type===&#x27;star&#x27;){ var pts=(5+streakBonus)*mult*(frenzy?2:1); score+=pts; starSound(); sparkle(bx,by); showFloat(bx,by,&#x27;+&#x27;+pts+&#x27; ⭐&#x27;,&#x27;#ffd166&#x27;); }
