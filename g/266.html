<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🌼 Garden Whack-a-Mole 🌼</b> &middot; Game 266 &middot; Professional producer &middot; Basic game: Whack-a-mole</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #2e5c1f; }
  .instructions { font-size: 16px; color: #555; max-width: 620px; margin: 0; line-height: 1.4; }

  /* Simple legend so the mole types are easy to understand */
  .legend { display: flex; gap: 18px; font-size: 15px; color: #444; font-weight: 600; margin: 0; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .board {
    position: relative; width: 660px; height: 440px; flex-shrink: 0; margin: 0;
    border-radius: 14px; overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.10) 0 70px, transparent 130px),
      radial-gradient(circle at 80% 85%, rgba(0,0,0,0.06) 0 90px, transparent 170px),
      linear-gradient(160deg, #7cc94a 0%, #62b23a 50%, #4f9e2f 100%);
    box-shadow: inset 0 0 50px rgba(0,0,0,0.16);
  }

  .scoreboard {
    position: absolute; top: 12px; left: 12px; z-index: 30;
    background: rgba(255,255,255,0.94); border: 2px solid #3ba55c;
    border-radius: 12px; padding: 8px 16px;
    font-size: 22px; font-weight: 800; color: #2e5c1f;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }

  .flower { position: absolute; font-size: 22px; pointer-events: none; user-select: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2)); z-index: 2; }

  /* Bigger moles &amp; holes */
  .hole { position: absolute; width: 120px; height: 78px; cursor: pointer; z-index: 6; }

  .hole-back {
    position: absolute; left: 4px; top: 8px; width: 112px; height: 58px;
    background: radial-gradient(ellipse at center 40%, #2b1c0e 0%, #3c2814 55%, #4e351d 100%);
    border-radius: 50%;
    box-shadow: inset 0 8px 12px rgba(0,0,0,0.7);
    z-index: 1;
  }
  .mole-clip {
    position: absolute; left: 12px; top: -48px; width: 96px; height: 112px;
    overflow: hidden; z-index: 2; pointer-events: none;
  }
  .mole {
    position: absolute; left: 0; bottom: 0; width: 96px; height: 96px;
    transform: translateY(112px);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
  }
  .hole.up .mole { transform: translateY(20px); }
  .hole-front {
    position: absolute; left: 4px; top: 40px; width: 112px; height: 34px;
    background: radial-gradient(ellipse at center top, #6b4a2b 0%, #543a22 60%, #3c2814 100%);
    border-radius: 0 0 50% 50%/0 0 100% 100%;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.4);
    z-index: 3;
  }

  .hole.hit .mole { animation: bonk 0.4s ease; }
  @keyframes bonk {
    0%   { transform: translateY(20px) scale(1,1) rotate(0deg); }
    25%  { transform: translateY(32px) scale(1.15,0.8) rotate(-6deg); }
    55%  { transform: translateY(34px) scale(1.1,0.85) rotate(6deg); }
    100% { transform: translateY(112px) scale(1,1) rotate(0deg); }
  }

  .stars { position: absolute; top: -44px; left: 50%; transform: translateX(-50%); font-size: 22px; opacity: 0; z-index: 5; pointer-events: none; }
  .hole.hit .stars { animation: spinstars 0.45s ease; }
  @keyframes spinstars {
    0% { opacity: 0; transform: translateX(-50%) scale(0.4); }
    40% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-16px) scale(1); }
  }

  .score-pop {
    position: absolute; z-index: 35; font-weight: 900; font-size: 30px;
    pointer-events: none; transform: translate(-50%,-50%);
    animation: scorePop 0.7s ease-out forwards;
    text-shadow: 0 2px 3px rgba(0,0,0,0.4);
  }
  @keyframes scorePop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
    30% { opacity: 1; transform: translate(-50%,-90%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%,-150%) scale(1); }
  }

  .boom {
    position: absolute; z-index: 40; font-size: 54px; pointer-events: none;
    transform: translate(-50%,-50%) scale(0.2); opacity: 0;
    animation: boomAnim 0.6s ease-out forwards;
    text-shadow: 0 0 24px #ff8800;
  }
  @keyframes boomAnim {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.2); }
    30% { opacity: 1; transform: translate(-50%,-50%) scale(2.8); }
    100% { opacity: 0.9; transform: translate(-50%,-50%) scale(3.6); }
  }

  .lose-overlay {
    position: absolute; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(120,0,0,0.35);
    animation: flashRed 0.5s ease;
  }
  .lose-overlay.show { display: flex; }
  @keyframes flashRed { 0% { background: rgba(255,60,0,0.7); } 100% { background: rgba(120,0,0,0.35); } }
  .lose-text {
    font-size: 78px; font-weight: 900; color: #fff;
    text-shadow: 0 0 12px #ff2200, 4px 4px 0 #7a0000;
    animation: loseZoom 0.6s cubic-bezier(.34,1.56,.64,1);
    letter-spacing: 2px;
  }
  @keyframes loseZoom { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .lose-sub { font-size: 22px; color: #ffe0d0; margin-top: 10px; font-weight: 600; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌼 Garden Whack-a-Mole 🌼&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack the moles as they pop up: brown = +10, golden = +50, but hitting a bomb mole ends the game! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;🟤 Brown +10&lt;/span&gt;
    &lt;span&gt;👑 Golden +50&lt;/span&gt;
    &lt;span&gt;💣 Bomb = LOSE&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;scoreboard&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lose-overlay&quot; id=&quot;loseOverlay&quot;&gt;
      &lt;div class=&quot;lose-text&quot;&gt;YOU LOSE&lt;/div&gt;
      &lt;div class=&quot;lose-sub&quot;&gt;Press Restart below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 660, BOARD_H = 440;
  var SPAWN_MS = 850, MOLE_LIFE_MS = 1100;
  var score = 0;
  var intervalId = null;
  var moleTimeouts = [];
  var running = false;
  var gameOver = false;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var loseOverlay = document.getElementById(&#x27;loseOverlay&#x27;);

  /* ---------- Sound (Web Audio, procedural) ---------- */
  var audioCtx = null;
  function ac() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) { audioCtx.resume(); }
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainVal) {
    var ctx = ac(); if (!ctx) return;
    var t0 = ctx.currentTime + start;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || &#x27;sine&#x27;;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gainVal || 0.3, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  // satisfying &quot;bonk&quot; for normal moles
  function soundNormal() {
    var ctx = ac(); if (!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = &#x27;sine&#x27;;
    osc.frequency.setValueAtTime(420, t0);
    osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.18);
    g.gain.setValueAtTime(0.4, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + 0.24);
  }
  // sparkly, extra-satisfying chime for golden mole (rising arpeggio)
  function soundGold() {
    var notes = [523, 659, 784, 1047, 1319];
    for (var i = 0; i &lt; notes.length; i++) {
      tone(notes[i], i * 0.06, 0.35, &#x27;triangle&#x27;, 0.28);
    }
    // shimmer on top
    tone(2093, 0.30, 0.4, &#x27;sine&#x27;, 0.15);
  }
  // big explosion boom for bomb
  function soundBoom() {
    var ctx = ac(); if (!ctx) return;
    var t0 = ctx.currentTime;
    // noise burst
    var bufLen = ctx.sampleRate * 0.6;
    var buffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i &lt; bufLen; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 2);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var nG = ctx.createGain();
    nG.gain.setValueAtTime(0.7, t0);
    nG.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    var lp = ctx.createBiquadFilter();
    lp.type = &#x27;lowpass&#x27;;
    lp.frequency.setValueAtTime(900, t0);
    lp.frequency.exponentialRampToValueAtTime(120, t0 + 0.5);
    noise.connect(lp); lp.connect(nG); nG.connect(ctx.destination);
    noise.start(t0); noise.stop(t0 + 0.6);
    // deep sub rumble
    var sub = ctx.createOscillator();
    var sG = ctx.createGain();
    sub.type = &#x27;sine&#x27;;
    sub.frequency.setValueAtTime(120, t0);
    sub.frequency.exponentialRampToValueAtTime(35, t0 + 0.5);
    sG.gain.setValueAtTime(0.7, t0);
    sG.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    sub.connect(sG); sG.connect(ctx.destination);
    sub.start(t0); sub.stop(t0 + 0.62);
  }

  /* ---------- Mole SVG ---------- */
  function moleSVG(type) {
    var bodyDark = &#x27;#8b6b4d&#x27;, bodyLight = &#x27;#c9a67f&#x27;;
    var extra = &#x27;&#x27;;
    if (type === &#x27;gold&#x27;) { bodyDark = &#x27;#d9a520&#x27;; bodyLight = &#x27;#ffe066&#x27;; }
    if (type === &#x27;bomb&#x27;) {
      bodyDark = &#x27;#4a4a4a&#x27;; bodyLight = &#x27;#8a8a8a&#x27;;
      extra = &#x27;&lt;circle cx=&quot;48&quot; cy=&quot;10&quot; r=&quot;4&quot; fill=&quot;#333&quot;/&gt;&#x27; +
              &#x27;&lt;path d=&quot;M48 10 Q56 2 62 8&quot; stroke=&quot;#333&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;&#x27; +
              &#x27;&lt;circle cx=&quot;63&quot; cy=&quot;7&quot; r=&quot;4&quot; fill=&quot;#ff8c00&quot;/&gt;&#x27; +
              &#x27;&lt;circle cx=&quot;63&quot; cy=&quot;7&quot; r=&quot;2&quot; fill=&quot;#ffec6e&quot;/&gt;&#x27;;
    }
    return &#x27;&#x27; +
    &#x27;&lt;svg width=&quot;96&quot; height=&quot;96&quot; viewBox=&quot;0 0 96 96&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;&#x27; +
      extra +
      &#x27;&lt;ellipse cx=&quot;48&quot; cy=&quot;56&quot; rx=&quot;37&quot; ry=&quot;38&quot; fill=&quot;&#x27; + bodyDark + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;48&quot; cy=&quot;64&quot; rx=&quot;24&quot; ry=&quot;23&quot; fill=&quot;&#x27; + bodyLight + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;23&quot; cy=&quot;34&quot; rx=&quot;10&quot; ry=&quot;11&quot; fill=&quot;&#x27; + bodyDark + &#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;73&quot; cy=&quot;34&quot; rx=&quot;10&quot; ry=&quot;11&quot; fill=&quot;&#x27; + bodyDark + &#x27;&quot;/&gt;&#x27; +
      (type === &#x27;gold&#x27; ? &#x27;&lt;text x=&quot;48&quot; y=&quot;24&quot; font-size=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;👑&lt;/text&gt;&#x27; : &#x27;&#x27;) +
      &#x27;&lt;g class=&quot;eyes-ok&quot;&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;37&quot; cy=&quot;48&quot; r=&quot;6.5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;38&quot; cy=&quot;49&quot; r=&quot;3.5&quot; fill=&quot;#222&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;59&quot; cy=&quot;48&quot; r=&quot;6.5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;49&quot; r=&quot;3.5&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&#x27; +
      &#x27;&lt;g class=&quot;eyes-x&quot; stroke=&quot;#222&quot; stroke-width=&quot;3.5&quot; stroke-linecap=&quot;round&quot; opacity=&quot;0&quot;&gt;&#x27; +
        &#x27;&lt;line x1=&quot;31&quot; y1=&quot;42&quot; x2=&quot;43&quot; y2=&quot;54&quot;/&gt;&lt;line x1=&quot;43&quot; y1=&quot;42&quot; x2=&quot;31&quot; y2=&quot;54&quot;/&gt;&#x27; +
        &#x27;&lt;line x1=&quot;53&quot; y1=&quot;42&quot; x2=&quot;65&quot; y2=&quot;54&quot;/&gt;&lt;line x1=&quot;65&quot; y1=&quot;42&quot; x2=&quot;53&quot; y2=&quot;54&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;48&quot; cy=&quot;62&quot; rx=&quot;6.5&quot; ry=&quot;5&quot; fill=&quot;#e07b8a&quot;/&gt;&#x27; +
      &#x27;&lt;g stroke=&quot;#5a422d&quot; stroke-width=&quot;1.6&quot;&gt;&#x27; +
        &#x27;&lt;line x1=&quot;28&quot; y1=&quot;63&quot; x2=&quot;10&quot; y2=&quot;60&quot;/&gt;&lt;line x1=&quot;28&quot; y1=&quot;67&quot; x2=&quot;10&quot; y2=&quot;69&quot;/&gt;&#x27; +
        &#x27;&lt;line x1=&quot;68&quot; y1=&quot;63&quot; x2=&quot;86&quot; y2=&quot;60&quot;/&gt;&lt;line x1=&quot;68&quot; y1=&quot;67&quot; x2=&quot;86&quot; y2=&quot;69&quot;/&gt;&#x27; +
      &#x27;&lt;/g&gt;&#x27; +
      &#x27;&lt;path class=&quot;mouth-ok&quot; d=&quot;M42 70 Q48 76 54 70&quot; stroke=&quot;#5a422d&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse class=&quot;mouth-hit&quot; cx=&quot;48&quot; cy=&quot;72&quot; rx=&quot;6&quot; ry=&quot;7&quot; fill=&quot;#8a3b48&quot; opacity=&quot;0&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;
  }

  function addFlowers() {
    var old = board.querySelectorAll(&#x27;.flower&#x27;);
    for (var k = 0; k &lt; old.length; k++) old[k].parentNode.removeChild(old[k]);
    var flowers = [&#x27;🌷&#x27;,&#x27;🌸&#x27;,&#x27;🌼&#x27;,&#x27;🌻&#x27;,&#x27;🌺&#x27;];
    var cols = 6, rows = 4;
    var cellW = BOARD_W / cols, cellH = (BOARD_H - 60) / rows;
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; cols; c++) {
        var f = document.createElement(&#x27;div&#x27;);
        f.className = &#x27;flower&#x27;;
        f.textContent = flowers[(r * cols + c) % flowers.length];
        var jx = (Math.random() - 0.5) * 18;
        var jy = (Math.random() - 0.5) * 18;
        f.style.left = (c * cellW + cellW / 2 - 11 + jx) + &#x27;px&#x27;;
        f.style.top = (60 + r * cellH + cellH / 2 - 11 + jy) + &#x27;px&#x27;;
        board.appendChild(f);
      }
    }
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var junk = board.querySelectorAll(&#x27;.hole, .boom, .score-pop&#x27;);
    for (var j = 0; j &lt; junk.length; j++) junk[j].parentNode.removeChild(junk[j]);
  }

  function showScorePop(x, y, text, color) {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;score-pop&#x27;;
    p.textContent = text;
    p.style.color = color;
    p.style.left = x + &#x27;px&#x27;;
    p.style.top = y + &#x27;px&#x27;;
    board.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 750);
  }

  function triggerLose(x, y) {
    gameOver = true;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    soundBoom();
    var boom = document.createElement(&#x27;div&#x27;);
    boom.className = &#x27;boom&#x27;;
    boom.textContent = &#x27;💥&#x27;;
    boom.style.left = x + &#x27;px&#x27;;
    boom.style.top = y + &#x27;px&#x27;;
    board.appendChild(boom);
    [&#x27;🔥&#x27;,&#x27;💣&#x27;,&#x27;✨&#x27;].forEach(function (em, idx) {
      var b2 = document.createElement(&#x27;div&#x27;);
      b2.className = &#x27;boom&#x27;;
      b2.textContent = em;
      b2.style.left = (x + (Math.random() - 0.5) * 100) + &#x27;px&#x27;;
      b2.style.top = (y + (Math.random() - 0.5) * 100) + &#x27;px&#x27;;
      b2.style.animationDelay = (idx * 0.08) + &#x27;s&#x27;;
      board.appendChild(b2);
    });
    setTimeout(function () { loseOverlay.classList.add(&#x27;show&#x27;); }, 350);
  }

  function pickType() {
    var r = Math.random();
    if (r &lt; 0.30) return &#x27;bomb&#x27;;
    if (r &lt; 0.45) return &#x27;gold&#x27;;
    return &#x27;normal&#x27;;
  }

  function spawnMole() {
    if (gameOver) return;
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;
    var hx = Math.random() * (BOARD_W - 120);
    var hy = 80 + Math.random() * (BOARD_H - 180);
    hole.style.left = hx + &#x27;px&#x27;;
    hole.style.top = hy + &#x27;px&#x27;;

    var type = pickType();

    hole.innerHTML =
      &#x27;&lt;div class=&quot;hole-back&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;mole-clip&quot;&gt;&lt;div class=&quot;mole&quot;&gt;&#x27; + moleSVG(type) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;hole-front&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;stars&quot;&gt;💫⭐💫&lt;/div&gt;&#x27;;

    board.appendChild(hole);

    moleTimeouts.push(setTimeout(function () { hole.classList.add(&#x27;up&#x27;); }, 30));

    var hit = false;
    hole.addEventListener(&#x27;mousedown&#x27;, function () {
      if (hit || gameOver || !hole.classList.contains(&#x27;up&#x27;)) return;
      hit = true;

      var cx = hx + 60, cy = hy + 10;

      if (type === &#x27;bomb&#x27;) {
        triggerLose(cx, cy);
        if (hole.parentNode === board) board.removeChild(hole);
        return;
      }

      if (type === &#x27;gold&#x27;) { score += 50; soundGold(); showScorePop(cx, cy, &#x27;+50&#x27;, &#x27;#e6a800&#x27;); }
      else { score += 10; soundNormal(); showScorePop(cx, cy, &#x27;+10&#x27;, &#x27;#ffffff&#x27;); }

      svg.querySelector(&#x27;.eyes-x&#x27;).setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
      svg.querySelector(&#x27;.mouth-ok&#x27;).setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;);
      svg.querySelector(&#x27;.mouth-hit&#x27;).setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);

  function startGame() {

    running = true;
    gameOver = false;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    loseOverlay.classList.remove(&#x27;show&#x27;);
    if (intervalId) clearInterval(intervalId);
    clearAllMoles();
    addFlowers();
    spawnMole();
    intervalId = setInterval(spawnMole, SPAWN_MS);
  }

  function stopGame() {
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllMoles();
  }

  addFlowers();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
