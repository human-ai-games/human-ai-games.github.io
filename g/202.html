&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Neon Paddle&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Bounce the ball with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; — green targets give 5 points, orange &lt;strong&gt;⚡&lt;/strong&gt; speed you up, and blue &lt;strong&gt;💥&lt;/strong&gt; lets the ball smash through stone blocks for 2 seconds. New blocks appear as you score, so keep the ball alive!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;smash&quot; id=&quot;smashHud&quot;&gt;💥 SMASH!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var PADDLE_W = 100, PADDLE_H = 16, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 18;
  var BASE_SPEED = 4.0, MAX_SPEED = 9.0;
  var TARGET_SIZE = 26, TARGET_COUNT = 4;
  var SMASH_DURATION = 2000; // ms
  var TARGETS_PER_OBSTACLE = 3;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BASE_SPEED, ballVY = BASE_SPEED;
  var speedMult = 1.0;
  var score = 0;
  var targetsCollected = 0;
  var smashUntil = 0;
  var targets = [];
  var obstacles = [];
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var smashHud = document.getElementById(&#x27;smashHud&#x27;);

  var OBSTACLE_DEFS = [
    { x: 90,  y: 140, w: 120, h: 18 },
    { x: 410, y: 140, w: 120, h: 18 },
    { x: 250, y: 220, w: 120, h: 18 },
    { x: 60,  y: 290, w: 18,  h: 60 },
    { x: 542, y: 290, w: 18,  h: 60 }
  ];
  // pool of possible new-obstacle sizes for random respawn
  var OBSTACLE_SIZES = [
    { w: 110, h: 18 }, { w: 80, h: 18 }, { w: 18, h: 60 },
    { w: 90, h: 18 }, { w: 18, h: 50 }, { w: 130, h: 18 }
  ];

  // ---- audio (procedural) ----
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function addObstacle(def) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    el.style.left = def.x + &#x27;px&#x27;;
    el.style.top = def.y + &#x27;px&#x27;;
    el.style.width = def.w + &#x27;px&#x27;;
    el.style.height = def.h + &#x27;px&#x27;;
    field.appendChild(el);
    obstacles.push({ el: el, x: def.x, y: def.y, w: def.w, h: def.h });
  }

  function buildObstacles() {
    obstacles.forEach(function(o){ if (o.el &amp;&amp; o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    obstacles = [];
    OBSTACLE_DEFS.forEach(function(d){ addObstacle(d); });
  }

  function spawnRandomObstacle() {
    var size = OBSTACLE_SIZES[Math.floor(Math.random() * OBSTACLE_SIZES.length)];
    var x, y, tries = 0, ok = false;
    do {
      x = 20 + Math.random() * (FIELD_W - 40 - size.w);
      y = 60 + Math.random() * 200;
      // avoid overlapping existing obstacles and the ball
      ok = true;
      for (var i = 0; i &lt; obstacles.length; i++) {
        var o = obstacles[i];
        if (x &lt; o.x + o.w + 12 &amp;&amp; x + size.w &gt; o.x - 12 &amp;&amp; y &lt; o.y + o.h + 12 &amp;&amp; y + size.h &gt; o.y - 12) { ok = false; break; }
      }
      if (ok &amp;&amp; ballX &lt; x + size.w + 20 &amp;&amp; ballX + BALL_SIZE &gt; x - 20 &amp;&amp; ballY &lt; y + size.h + 20 &amp;&amp; ballY + BALL_SIZE &gt; y - 20) ok = false;
      tries++;
    } while (!ok &amp;&amp; tries &lt; 40);
    if (ok) { addObstacle({ x: x, y: y, w: size.w, h: size.h }); beep(180, 0.1, &#x27;sine&#x27;); }
  }

  function overlapsObstacle(x, y, size) {
    for (var i = 0; i &lt; obstacles.length; i++) {
      var o = obstacles[i];
      if (x &lt; o.x + o.w + 6 &amp;&amp; x + size &gt; o.x - 6 &amp;&amp; y &lt; o.y + o.h + 6 &amp;&amp; y + size &gt; o.y - 6) return true;
    }
    return false;
  }

  function makeTargets() {
    targets.forEach(function(t){ if (t.el &amp;&amp; t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    targets = [];
    for (var i = 0; i &lt; TARGET_COUNT; i++) spawnTarget();
  }
  function spawnTarget() {
    var r = Math.random();
    var kind = &#x27;normal&#x27;;
    if (r &lt; 0.25) kind = &#x27;speed&#x27;;
    else if (r &lt; 0.5) kind = &#x27;smash&#x27;;
    var x, y, tries = 0;
    do {
      x = 20 + Math.random() * (FIELD_W - 40 - TARGET_SIZE);
      y = 30 + Math.random() * 230;
      tries++;
    } while (overlapsObstacle(x, y, TARGET_SIZE) &amp;&amp; tries &lt; 30);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27; + (kind === &#x27;speed&#x27; ? &#x27; speed icon&#x27; : kind === &#x27;smash&#x27; ? &#x27; smash icon&#x27; : &#x27;&#x27;);
    if (kind === &#x27;speed&#x27;) el.textContent = &#x27;⚡&#x27;;
    else if (kind === &#x27;smash&#x27;) el.textContent = &#x27;💥&#x27;;
    field.appendChild(el);
    var t = { el: el, x: x, y: y, kind: kind };
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    targets.push(t);
  }
  function removeTarget(idx) {
    var t = targets[idx];
    if (t.el &amp;&amp; t.el.parentNode) t.el.parentNode.removeChild(t.el);
    targets.splice(idx, 1);
    setTimeout(function(){ if (running) spawnTarget(); }, 700);
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    var dir = (Math.random() &lt; 0.5 ? -1 : 1);
    ballVX = dir * BASE_SPEED * speedMult;
    ballVY = BASE_SPEED * speedMult;
  }

  function destroyObstacle(idx) {
    var o = obstacles[idx];
    if (o.el &amp;&amp; o.el.parentNode) o.el.parentNode.removeChild(o.el);
    obstacles.splice(idx, 1);
    beep(140, 0.12, &#x27;sawtooth&#x27;);
  }

  function collideObstacles(smashOn) {
    for (var i = 0; i &lt; obstacles.length; i++) {
      var o = obstacles[i];
      if (ballX &lt; o.x + o.w &amp;&amp; ballX + BALL_SIZE &gt; o.x &amp;&amp;
          ballY &lt; o.y + o.h &amp;&amp; ballY + BALL_SIZE &gt; o.y) {
        if (smashOn) { destroyObstacle(i); return; }
        var overL = (ballX + BALL_SIZE) - o.x;
        var overR = (o.x + o.w) - ballX;
        var overT = (ballY + BALL_SIZE) - o.y;
        var overB = (o.y + o.h) - ballY;
        var minX = Math.min(overL, overR);
        var minY = Math.min(overT, overB);
        if (minX &lt; minY) {
          ballVX = -ballVX;
          if (overL &lt; overR) ballX = o.x - BALL_SIZE; else ballX = o.x + o.w;
        } else {
          ballVY = -ballVY;
          if (overT &lt; overB) ballY = o.y - BALL_SIZE; else ballY = o.y + o.h;
        }
        beep(240, 0.06, &#x27;square&#x27;);
        return;
      }
    }
  }

  function currentSpeed() { return Math.sqrt(ballVX*ballVX + ballVY*ballVY); }

  function onTargetCollected() {
    targetsCollected++;
    if (targetsCollected % TARGETS_PER_OBSTACLE === 0) spawnRandomObstacle();
  }

  function tick() {
    if (!running) return;
    var now = performance.now();
    var smashOn = now &lt; smashUntil;
    if (smashOn) { field.classList.add(&#x27;smash&#x27;); ball.classList.add(&#x27;smash&#x27;); smashHud.classList.add(&#x27;on&#x27;); }
    else { field.classList.remove(&#x27;smash&#x27;); ball.classList.remove(&#x27;smash&#x27;); smashHud.classList.remove(&#x27;on&#x27;); }

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; beep(300,0.05,&#x27;square&#x27;); }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; beep(300,0.05,&#x27;square&#x27;); }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; beep(300,0.05,&#x27;square&#x27;); }

    collideObstacles(smashOn);

    var bcx = ballX + BALL_SIZE/2, bcy = ballY + BALL_SIZE/2;
    for (var i = targets.length - 1; i &gt;= 0; i--) {
      var t = targets[i];
      var tcx = t.x + TARGET_SIZE/2, tcy = t.y + TARGET_SIZE/2;
      var dx = bcx - tcx, dy = bcy - tcy;
      var rad = (BALL_SIZE + TARGET_SIZE) / 2;
      if (dx*dx + dy*dy &lt;= rad*rad) {
        score += 5;
        scoreEl.textContent = score;
        if (t.kind === &#x27;speed&#x27;) {
          var sp = currentSpeed();
          var newSp = Math.min(MAX_SPEED, sp * 1.25);
          var scale = newSp / (sp || 1);
          ballVX *= scale; ballVY *= scale;
          speedMult = Math.min(MAX_SPEED/BASE_SPEED, speedMult * 1.25);
          beep(1200,0.18,&#x27;sawtooth&#x27;);
          setTimeout(function(){ beep(1600,0.12,&#x27;sawtooth&#x27;); }, 90);
        } else if (t.kind === &#x27;smash&#x27;) {
          smashUntil = performance.now() + SMASH_DURATION;
          beep(700,0.15,&#x27;square&#x27;);
          setTimeout(function(){ beep(500,0.15,&#x27;square&#x27;); }, 90);
        } else {
          beep(880,0.15,&#x27;triangle&#x27;);
        }
        removeTarget(i);
        onTargetCollected();
      }
    }

    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
      beep(520,0.08,&#x27;sine&#x27;);
    }
    if (ballY &gt;= FIELD_H) resetBall();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    speedMult = 1.0;
    targetsCollected = 0;
    smashUntil = 0;
    field.classList.remove(&#x27;smash&#x27;); ball.classList.remove(&#x27;smash&#x27;); smashHud.classList.remove(&#x27;on&#x27;);
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    buildObstacles();
    resetBall();
    makeTargets();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;
