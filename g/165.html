<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Snake</b> &middot; Game 165 &middot; Amateur producer &middot; Basic game: Snake</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; background: #9ccc65; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.08); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the snake with the arrow keys to eat apples (grow +1) and grab gold coins (bonus +3). Hitting a wall or your own tail ends the round — use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;canvas class=&quot;field&quot; id=&quot;field&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var TICK_MS = 150;
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var coins = [];
  var coinTimer = 0;
  var score = 0;
  var canvas = document.getElementById(&#x27;field&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    if (food.x === x &amp;&amp; food.y === y) return true;
    for (var c = 0; c &lt; coins.length; c++) if (coins[c].x === x &amp;&amp; coins[c].y === y) return true;
    return false;
  }

  function freeCell() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) return { x: x, y: y };
    }
    return null;
  }

  function placeFood() {
    var f = freeCell();
    if (f) food = f;
  }

  function spawnCoin() {
    if (coins.length &gt;= 3) return;
    var c = freeCell();
    if (c) { c.life = 60 + Math.floor(Math.random() * 40); coins.push(c); }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function drawApple(cx, cy) {
    var r = CELL * 0.68;   // larger apple
    ctx.beginPath();
    ctx.fillStyle = &#x27;#e53935&#x27;;
    ctx.arc(cx - 3, cy + 2, r, 0, Math.PI * 2);
    ctx.arc(cx + 3, cy + 2, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = &#x27;rgba(255,255,255,0.5)&#x27;;
    ctx.arc(cx - 4, cy - 3, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = &#x27;#6d4c41&#x27;;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r + 2);
    ctx.lineTo(cx + 3, cy - r - 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.fillStyle = &#x27;#43a047&#x27;;
    ctx.ellipse(cx + 7, cy - r - 4, 6, 3.2, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCoin(cx, cy) {
    var r = CELL * 0.4;
    var wob = Math.sin(Date.now() / 200 + cx) * 1.5;
    cy += wob;
    var grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r);
    grad.addColorStop(0, &#x27;#fff59d&#x27;);
    grad.addColorStop(0.6, &#x27;#ffd54f&#x27;);
    grad.addColorStop(1, &#x27;#f9a825&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = &#x27;#c17900&#x27;;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = &#x27;rgba(193,121,0,0.6)&#x27;;
    ctx.lineWidth = 1;
    ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = &#x27;#c17900&#x27;;
    ctx.font = &#x27;bold &#x27; + (r * 1.1) + &#x27;px system-ui, sans-serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillText(&#x27;$&#x27;, cx, cy + 0.5);
    ctx.beginPath();
    ctx.fillStyle = &#x27;rgba(255,255,255,0.7)&#x27;;
    ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBodySegment(cx, cy, t) {
    var r = CELL * (0.5 - 0.14 * t);
    var g = Math.round(150 - 50 * t);
    var g2 = Math.round(110 - 45 * t);
    var grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r);
    grad.addColorStop(0, &#x27;rgb(120,&#x27; + (g + 40) + &#x27;,60)&#x27;);
    grad.addColorStop(1, &#x27;rgb(40,&#x27; + g2 + &#x27;,40)&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = &#x27;rgba(20,60,20,0.35)&#x27;;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHead(cx, cy) {
    var r = CELL * 0.55;
    var grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r);
    grad.addColorStop(0, &#x27;#8bc34a&#x27;);
    grad.addColorStop(1, &#x27;#558b2f&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    var dx = dir.x, dy = dir.y;
    var px = -dy, py = dx;
    var eyeOff = r * 0.45;
    var eyeFwd = r * 0.25;
    var e1x = cx + dx * eyeFwd + px * eyeOff;
    var e1y = cy + dy * eyeFwd + py * eyeOff;
    var e2x = cx + dx * eyeFwd - px * eyeOff;
    var e2y = cy + dy * eyeFwd - py * eyeOff;
    ctx.fillStyle = &#x27;#fff8e1&#x27;;
    ctx.beginPath(); ctx.arc(e1x, e1y, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = &#x27;#1b1b1b&#x27;;
    ctx.beginPath(); ctx.arc(e1x + dx * 2, e1y + dy * 2, r * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x + dx * 2, e2y + dy * 2, r * 0.13, 0, Math.PI * 2); ctx.fill();

    if (Math.floor(Date.now() / 250) % 2 === 0) {
      var tx = cx + dx * r, ty = cy + dy * r;
      var t2x = tx + dx * 9, t2y = ty + dy * 9;
      ctx.strokeStyle = &#x27;#d32f2f&#x27;;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(t2x, t2y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(t2x, t2y);
      ctx.lineTo(t2x + px * 3 + dx * 3, t2y + py * 3 + dy * 3);
      ctx.moveTo(t2x, t2y);
      ctx.lineTo(t2x - px * 3 + dx * 3, t2y - py * 3 + dy * 3);
      ctx.stroke();
    }
  }

  function paint() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawApple(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
    for (var c = 0; c &lt; coins.length; c++) {
      drawCoin(coins[c].x * CELL + CELL / 2, coins[c].y * CELL + CELL / 2);
    }
    for (var i = snake.length - 1; i &gt;= 1; i--) {
      var t = i / snake.length;
      drawBodySegment(snake[i].x * CELL + CELL / 2, snake[i].y * CELL + CELL / 2, t);
    }
    drawHead(snake[0].x * CELL + CELL / 2, snake[0].y * CELL + CELL / 2);
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });

    for (var c = coins.length - 1; c &gt;= 0; c--) {
      if (coins[c].x === nx &amp;&amp; coins[c].y === ny) {
        score += 3;
        scoreEl.textContent = score;
        coins.splice(c, 1);
      }
    }

    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }

    for (var k = coins.length - 1; k &gt;= 0; k--) {
      coins[k].life--;
      if (coins[k].life &lt;= 0) coins.splice(k, 1);
    }
    coinTimer--;
    if (coinTimer &lt;= 0) {
      spawnCoin();
      coinTimer = 25 + Math.floor(Math.random() * 25);
    }

    paint();
  }

  var animId = null;
  function animate() {
    if (running) { paint(); animId = requestAnimationFrame(animate); }
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    initSnake();
    coins = [];
    placeFood();
    spawnCoin();
    coinTimer = 30;
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(animate);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initSnake();
  paint();
&lt;/script&gt;

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
