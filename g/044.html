  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d0d1a; color: #e8e8f0; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#0ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,255,255,.3); }
  .instructions { font-size: 16px; color: #9a9ac0; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #0ff; margin: 0; text-shadow: 0 0 10px rgba(0,255,255,.5); }

           background: linear-gradient(160deg,#15152b,#0a0a18);

    text-shadow:0 0 14px rgba(255,0,255,.6); z-index:5; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON DROP&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, drop faster with &lt;strong&gt;&amp;darr;&lt;/strong&gt;, and press &lt;strong&gt;C&lt;/strong&gt; to hold a piece for later. Fit the shapes to clear full rows, then hit the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;playrow&quot;&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;side-label&quot;&gt;HOLD (C)&lt;/div&gt;
      &lt;div class=&quot;hold-box&quot; id=&quot;holdBox&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;grid-lines&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;GAME OVER&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0;
  var holdType = null;      // stashed piece type
  var holdUsed = false;     // one hold per drop
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  var holdBox = document.getElementById(&#x27;holdBox&#x27;);

  var SHAPES = {
    I: { hue: 190, rot: [ [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]] ] },
    O: { hue: 50,  rot: [ [[1,0],[2,0],[1,1],[2,1]] ] },
    T: { hue: 285, rot: [ [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]],
                          [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },
    S: { hue: 130, rot: [ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]] ] },
    Z: { hue: 0,   rot: [ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]] ] },
    L: { hue: 30,  rot: [ [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]],
                          [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] },
    J: { hue: 220, rot: [ [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]],
                          [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] }
  };
  var SHAPE_KEYS = Object.keys(SHAPES);

  var actx = null;
  function ac() {
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    return actx;
  }
  function beep(freq, dur, type, vol) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.12;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime;
    o.start(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur);
  }
  function sMove(){ beep(330, 0.05, &#x27;square&#x27;, 0.06); }
  function sRotate(){ beep(520, 0.06, &#x27;square&#x27;, 0.07); }
  function sHold(){ beep(660, 0.08, &#x27;triangle&#x27;, 0.09); beep(880, 0.08, &#x27;triangle&#x27;, 0.06); }
  function sLand(){ beep(150, 0.12, &#x27;triangle&#x27;, 0.14); }
  function sClear(n){
    var a = ac(); if(!a) return;
    for (var i=0;i&lt;n*3;i++){
      (function(i){ setTimeout(function(){ beep(440 + i*90, 0.1, &#x27;sawtooth&#x27;, 0.1); }, i*45); })(i);
    }
  }
  function sOver(){
    [330,262,196,131].forEach(function(f,i){
      setTimeout(function(){ beep(f, 0.25, &#x27;sawtooth&#x27;, 0.12); }, i*140);
    });
  }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var states = SHAPES[p.type].rot;
    var offs = states[p.r % states.length];
    var out = [];
    for (var i = 0; i &lt; offs.length; i++) {
      out.push({ x: p.x + offs[i][0], y: p.y + offs[i][1] });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx] != null) return true;
    }
    return false;
  }

  function makePiece(type) {
    return { type: type, hue: SHAPES[type].hue, x: 3, y: 0, r: 0 };
  }

  function spawnPiece(type) {
    if (!type) type = SHAPE_KEYS[Math.floor(Math.random()*SHAPE_KEYS.length)];
    piece = makePiece(type);
    holdUsed = false;
    if (collides(piece)) return false;
    return true;
  }

  function holdPiece() {
    if (!running || !piece || holdUsed) return;
    var cur = piece.type;
    if (holdType == null) {
      holdType = cur;
      spawnPiece();
    } else {
      var swap = holdType;
      holdType = cur;
      piece = makePiece(swap);
      if (collides(piece)) { endGame(); paint(); return; }
    }
    holdUsed = true;
    sHold();
    paint();
  }

  function rotate() {
    if (!running || !piece) return;
    var states = SHAPES[piece.type].rot;
    var nextR = (piece.r + 1) % states.length;
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var cand = { type: piece.type, hue: piece.hue, x: piece.x + kicks[k], y: piece.y, r: nextR };
      if (!collides(cand)) { piece = cand; paint(); sRotate(); return; }
    }
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.hue;
    }
    piece = null;
    sLand();
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (grid[r][c] == null) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared * cleared;
      scoreEl.textContent = score;
      sClear(cleared);
    }
  }

  function paint() {
    var lines = field.querySelector(&#x27;.grid-lines&#x27;);
    field.innerHTML = &#x27;&#x27;;
    field.appendChild(lines);
    field.appendChild(overEl);
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c] != null) drawBlock(field, c*CELL, r*CELL, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(field, cells[i].x*CELL, cells[i].y*CELL, piece.hue);
      }
    }
    paintHold();
  }

  function paintHold() {
    holdBox.innerHTML = &#x27;&#x27;;
    if (holdType == null) return;
    var offs = SHAPES[holdType].rot[0];
    var hue = SHAPES[holdType].hue;
    // Bounds to center the shape in the 100px box.
    var minX=9,maxX=0,minY=9,maxY=0;
    for (var i=0;i&lt;offs.length;i++){
      minX=Math.min(minX,offs[i][0]); maxX=Math.max(maxX,offs[i][0]);
      minY=Math.min(minY,offs[i][1]); maxY=Math.max(maxY,offs[i][1]);
    }
    var mc = 20;
    var w = (maxX-minX+1)*mc, h = (maxY-minY+1)*mc;
    var ox = (100 - w)/2, oy = (100 - h)/2;
    for (var j=0;j&lt;offs.length;j++){
      var bx = ox + (offs[j][0]-minX)*mc;
      var by = oy + (offs[j][1]-minY)*mc;
      drawBlock(holdBox, bx, by, hue, mc);
    }
  }

  function drawBlock(parent, left, top, hue, size) {
    var s = size || CELL;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (left + 1) + &#x27;px&#x27;;
    el.style.top = (top + 1) + &#x27;px&#x27;;
    el.style.width = (s - 2) + &#x27;px&#x27;;
    el.style.height = (s - 2) + &#x27;px&#x27;;
    el.style.background = &#x27;linear-gradient(145deg, hsl(&#x27;+hue+&#x27;,90%,68%), hsl(&#x27;+hue+&#x27;,90%,42%))&#x27;;
    el.style.boxShadow = &#x27;0 0 8px hsla(&#x27;+hue+&#x27;,90%,60%,.8), inset 0 2px 3px hsla(&#x27;+hue+&#x27;,100%,85%,.6)&#x27;;
    el.style.border = &#x27;1px solid hsla(&#x27;+hue+&#x27;,90%,80%,.5)&#x27;;
    parent.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, hue: piece.hue, x: piece.x, y: piece.y + 1, r: piece.r };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, hue: piece.hue, x: piece.x + dx, y: piece.y, r: piece.r };
    if (!collides(next)) { piece = next; paint(); sMove(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    overEl.style.display = &#x27;flex&#x27;;
    sOver();
  }

  function startGame() {
    if (running) return;
    if (ac() &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    overEl.style.display = &#x27;none&#x27;;
    holdType = null;
    holdUsed = false;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
    else if (e.key === &#x27;c&#x27; || e.key === &#x27;C&#x27; || e.key === &#x27;Shift&#x27;) { holdPiece(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = makePiece(&#x27;T&#x27;);
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
