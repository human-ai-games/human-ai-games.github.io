&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐍 REAL SNAKE 🐍&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the snake with the arrow keys and eat the mice to grow longer. Walls wrap around, but biting your own body ends the round — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Length: &lt;span id=&quot;score&quot;&gt;3&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {

  var CELL = 20, COLS = 30, ROWS = 20;
  var BASE_TICK = 140;
  var running = false, tickId = null;
  var snake = [], dir = { x: 1, y: 0 }, pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 }, score = 3;
  var animT = 0, animId = null;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScore = document.getElementById(&#x27;finalScore&#x27;);

  function cellOccupied(x,y){ for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true; return false; }
  function placeFood(){ for(var t=0;t&lt;300;t++){ var x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS); if(!cellOccupied(x,y)){food={x:x,y:y};return;} } }
  function initSnake(){ snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}]; dir={x:1,y:0}; pendingDir={x:1,y:0}; }
  function speed(){ return Math.max(70, BASE_TICK - (score-3)*3); }

  // draw a mouse as food (bright pink)
  function drawMouse(cx, cy) {
    var wob = Math.sin(animT/6) * 1.5;
    ctx.save();
    ctx.translate(cx, cy + wob);
    // tail
    ctx.strokeStyle = &#x27;#ff9ec4&#x27;; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, 2); ctx.quadraticCurveTo(12, 4, 10, -3); ctx.stroke();
    // body
    ctx.fillStyle = &#x27;#ff77b0&#x27;;
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI*2); ctx.fill();
    // head
    ctx.beginPath(); ctx.ellipse(-6, -1, 4, 3.5, 0, 0, Math.PI*2); ctx.fill();
    // ears
    ctx.fillStyle = &#x27;#ffc0dd&#x27;;
    ctx.beginPath(); ctx.arc(-4, -4, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-8, -4, 2.5, 0, Math.PI*2); ctx.fill();
    // eye
    ctx.fillStyle = &#x27;#000&#x27;;
    ctx.beginPath(); ctx.arc(-8, -1, 0.9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawSnake() {
    if (snake.length === 0) return;
    var pts = snake.map(function(s){ return { x: s.x*CELL + CELL/2, y: s.y*CELL + CELL/2 }; });

    var maxW = 17;
    ctx.lineJoin = &#x27;round&#x27;; ctx.lineCap = &#x27;round&#x27;;
    for (var seg = pts.length-1; seg &gt;= 1; seg--) {
      var a = pts[seg], b = pts[seg-1];
      var tp = seg / pts.length;
      var w = maxW * (0.4 + 0.6*(1-tp));
      var grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, &#x27;#7ee02a&#x27;);
      grad.addColorStop(1, &#x27;#a6ff4d&#x27;);
      ctx.strokeStyle = grad; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      // bright belly highlight
      ctx.strokeStyle = &#x27;rgba(240,255,150,0.6)&#x27;; ctx.lineWidth = w*0.4;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // scale spots along body (golden)
    ctx.fillStyle = &#x27;rgba(255,180,40,0.7)&#x27;;
    for (var i = 1; i &lt; pts.length; i++) {
      var p = pts[i], tp2 = i/pts.length, r = maxW*(0.4+0.6*(1-tp2))*0.22;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
    }

    // head
    var h = pts[0];
    var ang = Math.atan2(dir.y, dir.x);
    ctx.save();
    ctx.translate(h.x, h.y); ctx.rotate(ang);
    ctx.fillStyle = &#x27;#a6ff4d&#x27;;
    ctx.beginPath(); ctx.ellipse(2, 0, 12, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#8cf030&#x27;;
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI*2); ctx.fill();
    // eyes
    ctx.fillStyle = &#x27;#fff7c0&#x27;;
    ctx.beginPath(); ctx.arc(4, -5, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, 5, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#000&#x27;;
    ctx.beginPath(); ctx.ellipse(5, -5, 0.9, 2.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, 5, 0.9, 2.2, 0, 0, Math.PI*2); ctx.fill();
    // nostrils
    ctx.fillStyle = &#x27;#5aa030&#x27;;
    ctx.beginPath(); ctx.arc(12, -2, 0.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, 2, 0.8, 0, Math.PI*2); ctx.fill();
    // flicking tongue
    var flick = Math.sin(animT/4);
    if (flick &gt; 0.2) {
      ctx.strokeStyle = &#x27;#ff2e6a&#x27;; ctx.lineWidth = 1.6; ctx.lineCap=&#x27;round&#x27;;
      var tl = 8 + flick*4;
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12+tl, 0);
      ctx.moveTo(12+tl, 0); ctx.lineTo(12+tl+4, -3);
      ctx.moveTo(12+tl, 0); ctx.lineTo(12+tl+4, 3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0,0,cv.width,cv.height);
    drawMouse(food.x*CELL + CELL/2, food.y*CELL + CELL/2);
    drawSnake();
  }

  function animLoop() { animT++; render(); animId = requestAnimationFrame(animLoop); }

  function tick(){
    if(!running) return;
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=(head.x+dir.x+COLS)%COLS, ny=(head.y+dir.y+ROWS)%ROWS;
    var ate=(nx===food.x&amp;&amp;ny===food.y);
    var body= ate ? snake : snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }
    snake.unshift({x:nx,y:ny});
    if(ate){ score++; scoreEl.textContent=score; placeFood(); clearInterval(tickId); tickId=setInterval(tick,speed()); }
    else snake.pop();
  }
  function endGame(){ running=false; if(tickId){clearInterval(tickId);tickId=null;} finalScore.textContent=&#x27;Length: &#x27;+score; overlay.classList.remove(&#x27;hidden&#x27;); }
  function startGame(){
    score=3; scoreEl.textContent=&#x27;3&#x27;; overlay.classList.add(&#x27;hidden&#x27;); initSnake(); placeFood();
    running=true; if(tickId)clearInterval(tickId); tickId=setInterval(tick,speed());
    if(!animId) animLoop();
  }
  function stopGame(){ running=false; if(tickId){clearInterval(tickId);tickId=null;} if(animId){cancelAnimationFrame(animId);animId=null;} }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){pendingDir={x:-1,y:0};e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){pendingDir={x:1,y:0};e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){pendingDir={x:0,y:-1};e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){pendingDir={x:0,y:1};e.preventDefault();}
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  initSnake(); render();
&lt;/script&gt;
