<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐟 Pike Feast</b> &middot; Game 213 &middot; Professional producer &middot; Basic game: Snake</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a3d62; color: #eaf6ff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; color: #d6f4ff; }
  .instructions { font-size: 16px; color: #eaf6ff; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #ffffff; margin: 0; font-weight: 600; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 3px #0a3b5c inset; }
  .cell { position: absolute; box-sizing: border-box; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐟 Pike Feast&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the toothy pike with the arrow keys and gobble the little fish to grow and score. Hitting a wall or your own body ends the round.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;canvas&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 26;
  var COLS = 23, ROWS = 17;
  var FIELD_W = 600, FIELD_H = 440;
  var TICK_MS = 160;
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 8 };
  var score = 0;
  var frame = 0;
  var canvas = document.getElementById(&#x27;canvas&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // ---- Sound ----
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
  }
  function chomp() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    for (var b = 0; b &lt; 2; b++) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = &#x27;square&#x27;;
      var start = t + b * 0.09;
      o.frequency.setValueAtTime(320, start);
      o.frequency.exponentialRampToValueAtTime(90, start + 0.07);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.25, start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, start + 0.08);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(start); o.stop(start + 0.1);
    }
    var o2 = audioCtx.createOscillator();
    var g2 = audioCtx.createGain();
    o2.type = &#x27;sine&#x27;;
    o2.frequency.setValueAtTime(600, t + 0.16);
    o2.frequency.exponentialRampToValueAtTime(200, t + 0.28);
    g2.gain.setValueAtTime(0.0001, t + 0.16);
    g2.gain.exponentialRampToValueAtTime(0.18, t + 0.18);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(t + 0.16); o2.stop(t + 0.32);
  }

  // ---- Background ----
  var bubbles = [];
  function initBubbles() {
    bubbles = [];
    for (var i = 0; i &lt; 22; i++) {
      bubbles.push({
        x: Math.random() * FIELD_W,
        y: Math.random() * FIELD_H,
        r: 1 + Math.random() * 3,
        s: 0.3 + Math.random() * 0.8
      });
    }
  }

  function drawBackground() {
    // Vivid multi-color water gradient.
    var grad = ctx.createLinearGradient(0, 0, 0, FIELD_H);
    grad.addColorStop(0, &#x27;#7ef0ff&#x27;);
    grad.addColorStop(0.35, &#x27;#39c6ec&#x27;);
    grad.addColorStop(0.7, &#x27;#2b7fd6&#x27;);
    grad.addColorStop(1, &#x27;#14539e&#x27;);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, FIELD_W, FIELD_H);

    // Bright light rays.
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = &#x27;#ffffff&#x27;;
    for (var r = 0; r &lt; 4; r++) {
      var x0 = 60 + r * 150;
      ctx.beginPath();
      ctx.moveTo(x0, 0);
      ctx.lineTo(x0 + 40, 0);
      ctx.lineTo(x0 + 120, FIELD_H);
      ctx.lineTo(x0 + 20, FIELD_H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // Colorful rocks on seabed.
    var rockColors = [&#x27;#9b59b6&#x27;, &#x27;#e67e22&#x27;, &#x27;#16a085&#x27;];
    for (var rk = 0; rk &lt; 3; rk++) {
      ctx.fillStyle = rockColors[rk];
      var rx = 90 + rk * 210;
      ctx.beginPath();
      ctx.ellipse(rx, FIELD_H - 22, 34 - rk*4, 20, 0, Math.PI, 0);
      ctx.fill();
    }

    // Sandy seabed.
    ctx.fillStyle = &#x27;#f6e4a0&#x27;;
    ctx.beginPath();
    ctx.moveTo(0, FIELD_H);
    ctx.lineTo(0, FIELD_H - 26);
    for (var x = 0; x &lt;= FIELD_W; x += 40) {
      ctx.quadraticCurveTo(x + 20, FIELD_H - 40, x + 40, FIELD_H - 26);
    }
    ctx.lineTo(FIELD_W, FIELD_H);
    ctx.closePath();
    ctx.fill();

    // Coral clusters.
    var coralColors = [&#x27;#ff5e8a&#x27;, &#x27;#ff9f43&#x27;, &#x27;#c56cf0&#x27;];
    for (var c = 0; c &lt; 3; c++) {
      var cxr = 150 + c * 180;
      ctx.strokeStyle = coralColors[c];
      ctx.lineWidth = 5;
      ctx.lineCap = &#x27;round&#x27;;
      for (var br = -1; br &lt;= 1; br++) {
        ctx.beginPath();
        ctx.moveTo(cxr, FIELD_H - 22);
        ctx.quadraticCurveTo(cxr + br * 14, FIELD_H - 44, cxr + br * 22, FIELD_H - 60);
        ctx.stroke();
      }
    }

    // Colorful seaweed.
    var weedColors = [&#x27;#27b85f&#x27;, &#x27;#7ed957&#x27;, &#x27;#1fbf9c&#x27;, &#x27;#27b85f&#x27;, &#x27;#7ed957&#x27;];
    for (var w = 0; w &lt; 5; w++) {
      var bx = 30 + w * 130;
      ctx.strokeStyle = weedColors[w];
      ctx.lineWidth = 6;
      ctx.lineCap = &#x27;round&#x27;;
      ctx.beginPath();
      ctx.moveTo(bx, FIELD_H - 20);
      for (var seg = 1; seg &lt;= 4; seg++) {
        var sway = Math.sin(frame * 0.05 + w + seg) * 10;
        ctx.lineTo(bx + sway, FIELD_H - 20 - seg * 22);
      }
      ctx.stroke();
    }

    drawSubmarine();

    // Bubbles rising.
    ctx.fillStyle = &#x27;rgba(255,255,255,0.6)&#x27;;
    for (var i = 0; i &lt; bubbles.length; i++) {
      var b = bubbles[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      b.y -= b.s;
      b.x += Math.sin((frame + i) * 0.05) * 0.3;
      if (b.y &lt; -5) { b.y = FIELD_H + 5; b.x = Math.random() * FIELD_W; }
    }
  }

  function drawSubmarine() {
    var sx = 420, sy = 80;
    var bob = Math.sin(frame * 0.03) * 6;
    ctx.save();
    ctx.translate(sx, sy + bob);
    // Body.
    ctx.fillStyle = &#x27;#ffb03a&#x27;;
    ctx.beginPath();
    ctx.ellipse(0, 0, 70, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail fin.
    ctx.beginPath();
    ctx.moveTo(-62, 0);
    ctx.lineTo(-92, -18);
    ctx.lineTo(-92, 18);
    ctx.closePath();
    ctx.fill();
    // Conning tower.
    ctx.fillStyle = &#x27;#e8912a&#x27;;
    ctx.fillRect(-14, -44, 30, 22);
    ctx.fillRect(2, -60, 5, 18);
    // Portholes.
    ctx.fillStyle = &#x27;#fff7cf&#x27;;
    for (var p = -40; p &lt;= 40; p += 26) {
      ctx.beginPath();
      ctx.arc(p, 0, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = &#x27;#7a3d00&#x27;;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    // Propeller bubbles.
    ctx.fillStyle = &#x27;rgba(255,255,255,0.6)&#x27;;
    for (var pb = 0; pb &lt; 3; pb++) {
      var px = -95 - (frame * 0.6 + pb * 12) % 40;
      ctx.beginPath();
      ctx.arc(px, (pb - 1) * 6, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFood() {
    var cx = food.x * CELL + CELL / 2;
    var cy = food.y * CELL + CELL / 2;
    var wob = Math.sin(frame * 0.2) * 2;
    ctx.save();
    ctx.translate(cx, cy + wob);
    // Larger little fish — bright orange for contrast.
    ctx.fillStyle = &#x27;#ff6a2b&#x27;;
    ctx.strokeStyle = &#x27;#8a2e00&#x27;;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Tail.
    ctx.beginPath();
    ctx.moveTo(13, 0);
    ctx.lineTo(24, -9);
    ctx.lineTo(24, 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Top fin.
    ctx.beginPath();
    ctx.moveTo(-2, -8);
    ctx.lineTo(3, -15);
    ctx.lineTo(7, -8);
    ctx.closePath();
    ctx.fill();
    // Stripe.
    ctx.strokeStyle = &#x27;#ffd28a&#x27;;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-2, -7);
    ctx.lineTo(-2, 7);
    ctx.stroke();
    // Eye.
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath();
    ctx.arc(-8, -2, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = &#x27;#222&#x27;;
    ctx.beginPath();
    ctx.arc(-8, -2, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPike() {
    for (var i = snake.length - 1; i &gt;= 0; i--) {
      var seg = snake[i];
      var cx = seg.x * CELL + CELL / 2;
      var cy = seg.y * CELL + CELL / 2;
      var t = i / Math.max(1, snake.length - 1);
      var g = Math.floor(190 - t * 60);
      ctx.fillStyle = &#x27;rgb(&#x27; + Math.floor(60 - t*20) + &#x27;,&#x27; + g + &#x27;,&#x27; + Math.floor(70 - t*20) + &#x27;)&#x27;;
      ctx.strokeStyle = &#x27;#0d3b1e&#x27;;
      ctx.lineWidth = 2;
      var rad = i === 0 ? CELL/2 + 2 : (CELL/2 + 1) * (1 - t * 0.3);
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (i &gt; 0 &amp;&amp; i % 2 === 0) {
        ctx.fillStyle = &#x27;rgba(240,255,210,0.7)&#x27;;
        ctx.beginPath();
        ctx.arc(cx, cy, rad * 0.35, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (snake.length &gt; 1) {
      var tail = snake[snake.length - 1];
      var prev = snake[snake.length - 2];
      var tx = tail.x * CELL + CELL / 2;
      var ty = tail.y * CELL + CELL / 2;
      var dx = tail.x - prev.x, dy = tail.y - prev.y;
      ctx.fillStyle = &#x27;#2e7d3e&#x27;;
      ctx.strokeStyle = &#x27;#0d3b1e&#x27;;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + dx * 16 - dy * 11, ty + dy * 16 - dx * 11);
      ctx.lineTo(tx + dx * 16 + dy * 11, ty + dy * 16 + dx * 11);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    drawHead();
  }

  function drawHead() {
    var head = snake[0];
    var cx = head.x * CELL + CELL / 2;
    var cy = head.y * CELL + CELL / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.atan2(dir.y, dir.x));
    ctx.fillStyle = &#x27;#5aa84f&#x27;;
    ctx.strokeStyle = &#x27;#0d3b1e&#x27;;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-6, -13);
    ctx.lineTo(22, -10);
    ctx.lineTo(22, 10);
    ctx.lineTo(-6, 13);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    var open = 5 + Math.abs(Math.sin(frame * 0.4)) * 6;
    ctx.fillStyle = &#x27;#8a1414&#x27;;
    ctx.beginPath();
    ctx.moveTo(6, -open);
    ctx.lineTo(23, -open * 0.4);
    ctx.lineTo(23, open * 0.4);
    ctx.lineTo(6, open);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = &#x27;#ffffff&#x27;;
    for (var t = 0; t &lt; 5; t++) {
      var tx = 8 + t * 3.4;
      ctx.beginPath();
      ctx.moveTo(tx, -open);
      ctx.lineTo(tx + 1.8, -open + 6);
      ctx.lineTo(tx + 3.6, -open);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(tx, open);
      ctx.lineTo(tx + 1.8, open - 6);
      ctx.lineTo(tx + 3.6, open);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = &#x27;#ffcf3f&#x27;;
    ctx.beginPath();
    ctx.arc(0, -4, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = &#x27;#0d3b1e&#x27;;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = &#x27;#222&#x27;;
    ctx.beginPath();
    ctx.arc(1, -4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function paint() {
    frame++;
    drawBackground();
    drawFood();
    drawPike();
    if (gameOver) {
      ctx.fillStyle = &#x27;rgba(0,0,0,0.5)&#x27;;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      ctx.fillStyle = &#x27;#ffe08a&#x27;;
      ctx.font = &#x27;bold 34px system-ui, sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(&#x27;The pike is stuffed!&#x27;, FIELD_W / 2, FIELD_H / 2 - 6);
      ctx.font = &#x27;20px system-ui, sans-serif&#x27;;
      ctx.fillStyle = &#x27;#dff3ff&#x27;;
      ctx.fillText(&#x27;Score: &#x27; + score + &#x27; — press Start to feed again&#x27;, FIELD_W / 2, FIELD_H / 2 + 28);
    }
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { food = { x: x, y: y }; return; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 8 }, { x: 4, y: 8 }, { x: 3, y: 8 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      chomp();
      placeFood();
    } else {
      snake.pop();
    }
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
    paint();
  }

  function startGame() {
    ensureAudio();
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    initSnake();
    initBubbles();
    placeFood();
    frame = 0;
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the scene before pressing Start.
  initSnake();
  initBubbles();
  placeFood();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the

  <div class="controls">

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;

  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
