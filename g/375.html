&lt;script&gt;

  var CELL = 20;
  var COLS = 30, ROWS = 20;
  var MIN_TICK = 90;        // fastest allowed
  var STEP_MS = 15;         // speed-up per level
  // starting speed per difficulty (ms per step)
  var DIFF = { easy: 280, medium: 210, hard: 150 };
  var difficulty = &#x27;medium&#x27;;

  var running = false, paused = false, started = false, tickId = null;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10, color: &#x27;#feca57&#x27; };
  var score = 0, high = 0, level = 1;

  var highEl = document.getElementById(&#x27;high&#x27;);
  var lvlEl = document.getElementById(&#x27;lvl&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var bannerMain = document.getElementById(&#x27;bannerMain&#x27;);
  var bannerSub = document.getElementById(&#x27;bannerSub&#x27;);
  var pauseBtn = document.getElementById(&#x27;pauseBtn&#x27;);
  var diffEl = document.getElementById(&#x27;diff&#x27;);

  var HUES = [340, 20, 45, 90, 160, 200, 260, 300]; // rainbow cycle for body
  var FOOD_COLORS = [&#x27;#ff6b6b&#x27;,&#x27;#feca57&#x27;,&#x27;#48dbfb&#x27;,&#x27;#1dd1a1&#x27;,&#x27;#ff9ff3&#x27;,&#x27;#54a0ff&#x27;,&#x27;#5f27cd&#x27;,&#x27;#ff9f43&#x27;,&#x27;#00d2d3&#x27;,&#x27;#f368e0&#x27;];

  function randFoodColor() { return FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)]; }

  function drawCell(cls, x, y, extraHTML, bg, shadow) {

    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    if (bg) el.style.background = bg;
    if (shadow) el.style.boxShadow = shadow;
    if (extraHTML) el.innerHTML = extraHTML;
    field.appendChild(el);
  }

  function paint() {
    var kids = Array.prototype.slice.call(field.children);
    for (var k = 0; k &lt; kids.length; k++) { if (kids[k] !== banner) field.removeChild(kids[k]); }

    var fbg = &#x27;radial-gradient(circle at 35% 30%, #fff, &#x27; + food.color + &#x27; 60%)&#x27;;
    drawCell(&#x27;food&#x27;, food.x, food.y, &#x27;&#x27;, fbg, &#x27;0 0 12px &#x27; + food.color);

    for (var i = snake.length - 1; i &gt;= 0; i--) {
      var seg = snake[i];
      var hue = HUES[i % HUES.length];
      if (i === 0) {
        var bg = &#x27;radial-gradient(circle at 40% 35%, hsl(&#x27; + hue + &#x27;,95%,72%), hsl(&#x27; + hue + &#x27;,85%,52%))&#x27;;
        var ex1, ey1, ex2, ey2;
        if (dir.x === 1) { ex1 = 12; ey1 = 4; ex2 = 12; ey2 = 12; }
        else if (dir.x === -1) { ex1 = 4; ey1 = 4; ex2 = 4; ey2 = 12; }
        else if (dir.y === -1) { ex1 = 4; ey1 = 4; ex2 = 12; ey2 = 4; }
        else { ex1 = 4; ey1 = 12; ex2 = 12; ey2 = 12; }

      } else {
        var bgb = &#x27;linear-gradient(135deg, hsl(&#x27; + hue + &#x27;,80%,60%), hsl(&#x27; + hue + &#x27;,70%,45%))&#x27;;
        drawCell(&#x27;seg&#x27;, seg.x, seg.y, &#x27;&#x27;, bgb);

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 300; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { food = { x: x, y: y, color: randFoodColor() }; return; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function currentTick() {
    var t = DIFF[difficulty] - (level - 1) * STEP_MS;
    return t &lt; MIN_TICK ? MIN_TICK : t;
  }

  function restartTimer() {
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, currentTick());
  }

  function tick() {
    if (!running || paused) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      if (score &gt; high) { high = score; highEl.textContent = high; }
      var newLevel = 1 + Math.floor(score / 5);
      if (newLevel !== level) { level = newLevel; lvlEl.textContent = level; restartTimer(); }
      placeFood();
    } else {
      snake.pop();
    }
    paint();
  }

  function endGame() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    bannerMain.textContent = &#x27;Game Over — Score &#x27; + score;
    bannerSub.textContent = &#x27;Press Start below to play again&#x27;;
    banner.style.display = &#x27;flex&#x27;;
    pauseBtn.textContent = &#x27;Pause&#x27;;
  }

  function startGame() {
    score = 0; level = 1; paused = false;
    scoreEl.textContent = &#x27;0&#x27;;
    lvlEl.textContent = &#x27;1&#x27;;
    highEl.textContent = high;
    banner.style.display = &#x27;none&#x27;;
    pauseBtn.textContent = &#x27;Pause&#x27;;
    initSnake();
    placeFood();
    paint();
    running = true; started = true;
    restartTimer();
  }
  function stopGame() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? &#x27;Resume&#x27; : &#x27;Pause&#x27;;
    if (paused) {
      bannerMain.textContent = &#x27;Paused&#x27;;
      bannerSub.textContent = &#x27;Press Resume or Spacebar&#x27;;
      banner.style.display = &#x27;flex&#x27;;
    } else {
      banner.style.display = &#x27;none&#x27;;

  }

  diffEl.addEventListener(&#x27;click&#x27;, function (e) {
    var btn = e.target.closest(&#x27;button&#x27;);
    if (!btn) return;
    difficulty = btn.getAttribute(&#x27;d&#x27;) || btn.getAttribute(&#x27;data-d&#x27;);
    var btns = diffEl.querySelectorAll(&#x27;button&#x27;);
    for (var i = 0; i &lt; btns.length; i++) btns[i].classList.remove(&#x27;active&#x27;);
    btn.classList.add(&#x27;active&#x27;);
    if (running) restartTimer(); // apply new speed live
  });

  pauseBtn.addEventListener(&#x27;click&#x27;, togglePause);

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.key === &#x27;Spacebar&#x27;) { togglePause(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {

  });

  initSnake();
  paint();
