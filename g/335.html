<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b> &middot; Game 335 &middot; Amateur producer &middot; Basic game: Falling blocks</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; }
  .block { position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; }
  .bomb { background: #222 !important; border-color: #ff5252 !important; animation: blink 0.4s steps(2, start) infinite; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  @keyframes blink { 0% { box-shadow: 0 0 0 0 rgba(255,82,82,0.9) inset; } 100% { box-shadow: 0 0 0 8px rgba(255,82,82,0.9) inset; } }
  .boom { background: #fff3b0 !important; border-color: #ff9800 !important; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, speed up with &lt;strong&gt;&amp;darr;&lt;/strong&gt;, and rotate with &lt;strong&gt;Space&lt;/strong&gt;. Pieces arrive rotated and sometimes mirrored — clear full rows to score, and dodge the blinking bomb that blows up whatever it touches. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null, bombTimeoutId = null;
  var grid = [];
  var piece = null;
  var score = 0;
  var lastShape = -1;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var SHAPES = [
    { name: &#x27;O&#x27;, color: &#x27;#e05a5a&#x27;, cells: [ {x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1} ] },
    { name: &#x27;L&#x27;, color: &#x27;#e0973a&#x27;, cells: [ {x:0,y:0},{x:0,y:1},{x:0,y:2},{x:1,y:2} ] },
    { name: &#x27;I&#x27;, color: &#x27;#3aa0e0&#x27;, cells: [ {x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0} ] },
    { name: &#x27;Z&#x27;, color: &#x27;#8e5ae0&#x27;, cells: [ {x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1} ] },
    { name: &#x27;U&#x27;, color: &#x27;#3ac07a&#x27;, cells: [ {x:0,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1} ] }
  ];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var out = [];
    for (var i = 0; i &lt; p.cells.length; i++) {
      out.push({ x: p.x + p.cells[i].x, y: p.y + p.cells[i].y });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function pickShape() {
    var idx;
    do { idx = Math.floor(Math.random() * SHAPES.length); }
    while (SHAPES.length &gt; 1 &amp;&amp; idx === lastShape);
    lastShape = idx;
    return SHAPES[idx];
  }

  function shapeWidth(cells) {
    var maxX = 0;
    for (var i = 0; i &lt; cells.length; i++) maxX = Math.max(maxX, cells[i].x);
    return maxX + 1;
  }

  // Mirror cells horizontally within their bounding box.
  function mirrorCells(cells) {
    var w = shapeWidth(cells);
    var out = [];
    for (var i = 0; i &lt; cells.length; i++) {
      out.push({ x: (w - 1) - cells[i].x, y: cells[i].y });
    }
    return out;
  }

  function makePiece(shape) {
    var cells = shape.cells.slice();
    // Randomly mirror the piece as it comes from above.
    if (Math.random() &lt; 0.5) cells = mirrorCells(cells);
    var w = shapeWidth(cells);
    return { cells: cells, color: shape.color, isBomb: false, x: Math.floor((COLS - w) / 2), y: 0 };
  }

  function makeBombPiece() {
    return { cells: [ {x:0,y:0} ], color: &#x27;#222&#x27;, isBomb: true, x: Math.floor(COLS / 2), y: 0 };
  }

  var pendingBomb = false;

  function scheduleBomb() {
    if (bombTimeoutId) clearTimeout(bombTimeoutId);
    var delay = 20000 + Math.random() * 15000; // 20–35 seconds
    bombTimeoutId = setTimeout(function () {
      if (running) { pendingBomb = true; scheduleBomb(); }
    }, delay);
  }

  function spawnPiece() {
    if (pendingBomb) {
      pendingBomb = false;
      piece = makeBombPiece();
    } else {
      piece = makePiece(pickShape());
    }
    if (collides(piece)) return false;
    return true;
  }

  function rotateCells(cells) {
    var maxY = 0;
    for (var i = 0; i &lt; cells.length; i++) maxY = Math.max(maxY, cells[i].y);
    var out = [];
    for (var j = 0; j &lt; cells.length; j++) {
      out.push({ x: maxY - cells[j].y, y: cells[j].x });
    }
    return out;
  }

  function rotatePiece() {
    if (!running || !piece || piece.isBomb) return;
    var rotated = rotateCells(piece.cells);
    var cand = { cells: rotated, color: piece.color, isBomb: false, x: piece.x, y: piece.y };
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      cand.x = piece.x + kicks[k];
      if (!collides(cand)) { piece = cand; paint(); return; }
    }
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    if (piece.isBomb) {
      var bc = cells[0];
      explodeAt(bc.x, bc.y);
      piece = null;
      return;
    }
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function explodeAt(bx, by) {
    var affected = [];
    for (var dy = -1; dy &lt;= 1; dy++) {
      for (var dx = -1; dx &lt;= 1; dx++) {
        var nx = bx + dx, ny = by + dy;
        if (nx &gt;= 0 &amp;&amp; nx &lt; COLS &amp;&amp; ny &gt;= 0 &amp;&amp; ny &lt; ROWS) {
          if (grid[ny][nx] || (dx === 0 &amp;&amp; dy === 0)) {
            affected.push({ x: nx, y: ny });
          }
        }
      }
    }
    var destroyed = 0;
    for (var i = 0; i &lt; affected.length; i++) {
      if (grid[affected[i].y][affected[i].x]) destroyed++;
      grid[affected[i].y][affected[i].x] = null;
    }
    score += destroyed;
    scoreEl.textContent = score;
    paint();
    for (var j = 0; j &lt; affected.length; j++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;block boom&#x27;;
      el.style.left = (affected[j].x * CELL) + &#x27;px&#x27;;
      el.style.top = (affected[j].y * CELL) + &#x27;px&#x27;;
      el.style.width = CELL + &#x27;px&#x27;;
      el.style.height = CELL + &#x27;px&#x27;;
      field.appendChild(el);
    }
    setTimeout(function () { if (running) paint(); }, 180);
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared;
      scoreEl.textContent = score;
    }
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c], false);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(cells[i].x, cells[i].y, piece.color, piece.isBomb);
      }
    }
  }

  function drawBlock(cx, cy, color, isBomb) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27; + (isBomb ? &#x27; bomb&#x27; : &#x27;&#x27;);
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    if (isBomb) el.textContent = &#x27;\uD83D\uDCA3&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { cells: piece.cells, color: piece.color, isBomb: piece.isBomb, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { cells: piece.cells, color: piece.color, isBomb: piece.isBomb, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (bombTimeoutId) { clearTimeout(bombTimeoutId); bombTimeoutId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    lastShape = -1;
    pendingBomb = false;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
    scheduleBomb();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (bombTimeoutId) { clearTimeout(bombTimeoutId); bombTimeoutId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.key === &#x27;Spacebar&#x27; || e.code === &#x27;Space&#x27;) { rotatePiece(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotatePiece(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial preview.
  newGrid();
  piece = makePiece(SHAPES[0]);
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
