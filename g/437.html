&lt;script&gt;
  var CELL = 25;
  var COLS = 10, ROWS = 16;
  var DROP_MS = 500;
  var running = false, dropId = null;
  var grid = [];
  var piece = null;
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var prizesEl = document.getElementById(&#x27;prizes&#x27;);
  var bigEl = document.getElementById(&#x27;big&#x27;);

  // Prize pools by rarity (rows cleared at once).
  var PRIZES = {
    1: [ {e:&#x27;🎧&#x27;,n:&#x27;Headphones&#x27;}, {e:&#x27;⌨️&#x27;,n:&#x27;Keyboard&#x27;}, {e:&#x27;🖱️&#x27;,n:&#x27;Mouse&#x27;}, {e:&#x27;💿&#x27;,n:&#x27;Game Disc&#x27;}, {e:&#x27;📱&#x27;,n:&#x27;Smartphone&#x27;} ],
    2: [ {e:&#x27;🎮&#x27;,n:&#x27;Game Console&#x27;}, {e:&#x27;📺&#x27;,n:&#x27;4K TV&#x27;}, {e:&#x27;⌚&#x27;,n:&#x27;Smartwatch&#x27;}, {e:&#x27;🎥&#x27;,n:&#x27;Camera&#x27;} ],
    3: [ {e:&#x27;🖥️&#x27;,n:&#x27;Gaming PC&#x27;}, {e:&#x27;💻&#x27;,n:&#x27;Laptop&#x27;}, {e:&#x27;🕹️&#x27;,n:&#x27;Arcade Cabinet&#x27;} ],
    4: [ {e:&#x27;🚗&#x27;,n:&#x27;Sports Car&#x27;}, {e:&#x27;🏆&#x27;,n:&#x27;Grand Prize&#x27;}, {e:&#x27;💎&#x27;,n:&#x27;Diamond&#x27;} ]
  };

  var SHAPES = [
    { color: &#x27;#ffd23f&#x27;, cells: [[0,0],[1,0],[0,1],[1,1]] },
    { color: &#x27;#3fa9ff&#x27;, cells: [[0,0],[1,0],[2,0],[3,0]] },
    { color: &#x27;#b06bff&#x27;, cells: [[0,0],[0,1],[1,1],[2,1]] },
    { color: &#x27;#ff8c3f&#x27;, cells: [[2,0],[0,1],[1,1],[2,1]] },
    { color: &#x27;#4dff88&#x27;, cells: [[1,0],[2,0],[0,1],[1,1]] },
    { color: &#x27;#ff4d6d&#x27;, cells: [[0,0],[1,0],[1,1],[2,1]] },
    { color: &#x27;#c77dff&#x27;, cells: [[1,0],[0,1],[1,1],[2,1]] },
    { color: &#x27;#ffdd55&#x27;, cells: [[0,0]] },
    { color: &#x27;#55ffee&#x27;, cells: [[0,0],[1,0]] },
    { color: &#x27;#ff9ec4&#x27;, cells: [[0,0],[1,0],[1,1]] },
  ];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var out = [];
    for (var i = 0; i &lt; p.cells.length; i++) {
      out.push({ x: p.x + p.cells[i][0], y: p.y + p.cells[i][1] });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function rotatedCells(cells) {
    var out = [];
    var minx = Infinity, miny = Infinity;
    for (var i = 0; i &lt; cells.length; i++) {
      var nx = -cells[i][1], ny = cells[i][0];
      out.push([nx, ny]);
      if (nx &lt; minx) minx = nx;
      if (ny &lt; miny) miny = ny;
    }
    for (var j = 0; j &lt; out.length; j++) { out[j][0] -= minx; out[j][1] -= miny; }
    return out;
  }

  function rotate() {
    if (!running || !piece) return;
    var newCells = rotatedCells(piece.cells);
    var test = { x: piece.x, y: piece.y, cells: newCells, color: piece.color };
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      test.x = piece.x + kicks[k];
      if (!collides(test)) { piece = test; paint(); return; }
    }
  }

  function spawnPiece() {
    var s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    var w = 0;
    for (var i = 0; i &lt; s.cells.length; i++) if (s.cells[i][0] &gt; w) w = s.cells[i][0];
    piece = {
      x: Math.floor((COLS - (w + 1)) / 2),
      y: 0,
      cells: s.cells.map(function (c) { return [c[0], c[1]]; }),
      color: s.color
    };
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function awardPrize(rows) {
    var tier = Math.min(4, rows);
    var pool = PRIZES[tier];
    var prize = pool[Math.floor(Math.random() * pool.length)];
    // Panel entry
    var li = document.createElement(&#x27;li&#x27;);
    var rareLabel = tier &gt;= 3 ? &#x27; &lt;span class=&quot;rare&quot;&gt;★RARE&lt;/span&gt;&#x27; : (tier === 2 ? &#x27; &lt;span class=&quot;rare&quot;&gt;✦&lt;/span&gt;&#x27; : &#x27;&#x27;);
    li.innerHTML = &#x27;&lt;span class=&quot;emo&quot;&gt;&#x27; + prize.e + &#x27;&lt;/span&gt;&lt;span&gt;&#x27; + prize.n + rareLabel + &#x27;&lt;/span&gt;&#x27;;
    prizesEl.insertBefore(li, prizesEl.firstChild);
    while (prizesEl.children.length &gt; 9) prizesEl.removeChild(prizesEl.lastChild);
    // Big burst animation on the field
    bigEl.textContent = prize.e;
    bigEl.classList.remove(&#x27;show&#x27;); void bigEl.offsetWidth; bigEl.classList.add(&#x27;show&#x27;);
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(0);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared;
      scoreEl.textContent = score;
      awardPrize(cleared);
    }
  }

  function paint() {
    // Keep the burst element, rebuild blocks.
    var kids = field.querySelectorAll(&#x27;.block&#x27;);
    for (var i = 0; i &lt; kids.length; i++) field.removeChild(kids[i]);
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var j = 0; j &lt; cells.length; j++) {
        if (cells[j].y &gt;= 0) drawBlock(cells[j].x, cells[j].y, piece.color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background =
      &#x27;linear-gradient(135deg,&#x27; + color + &#x27; 0%, &#x27; + shade(color, -0.35) + &#x27; 100%)&#x27;;
    el.style.boxShadow =
      &#x27;inset 2px 2px 3px rgba(255,255,255,0.55), &#x27; +
      &#x27;inset -3px -3px 4px rgba(0,0,0,0.45), &#x27; +
      &#x27;2px 3px 4px rgba(0,0,0,0.4)&#x27;;
    field.appendChild(el);
  }

  function shade(hex, amt) {
    var h = hex.replace(&#x27;#&#x27;, &#x27;&#x27;);
    var r = parseInt(h.substring(0,2),16);
    var g = parseInt(h.substring(2,4),16);
    var b = parseInt(h.substring(4,6),16);
    r = Math.max(0, Math.min(255, Math.round(r + r*amt)));
    g = Math.max(0, Math.min(255, Math.round(g + g*amt)));
    b = Math.max(0, Math.min(255, Math.round(b + b*amt)));
    return &#x27;rgb(&#x27; + r + &#x27;,&#x27; + g + &#x27;,&#x27; + b + &#x27;)&#x27;;
  }

  function stepDown() {
    if (!piece) return;
    var next = { x: piece.x, y: piece.y + 1, cells: piece.cells, color: piece.color };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { x: piece.x + dx, y: piece.y, cells: piece.cells, color: piece.color };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    prizesEl.innerHTML = &#x27;&#x27;;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.key === &#x27;Spacebar&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = { x: 4, y: 0, cells: [[0,0],[1,0],[0,1],[1,1]], color: &#x27;#ffd23f&#x27; };
  paint();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
