<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐍 Jungle Snake</b> &middot; Game 086 &middot; Professional producer &middot; Basic game: Snake</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1c2e14; color: #eaf5e0; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #d7f5a3; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #c3e0a8; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 20px; color: #f0ffdd; font-weight: 600; }
  .legend { display: flex; gap: 12px; font-size: 14px; color: #c3e0a8; margin: 0; align-items:center; }
  .legend span { white-space: nowrap; }
  .mutebtn { background: rgba(255,255,255,0.12); color:#eaf5e0; border:1px solid rgba(255,255,255,0.25); border-radius:6px; padding:2px 8px; font-size:14px; cursor:pointer; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 6px 18px rgba(0,0,0,0.4);
    background:
      radial-gradient(circle at 20% 15%, rgba(180,255,120,0.12), transparent 30%),
      radial-gradient(circle at 80% 75%, rgba(120,220,90,0.12), transparent 35%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0 14px, rgba(255,255,255,0.03) 14px 28px),
      linear-gradient(160deg, #2f5a1e, #1e3d12 55%, #16300d);
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐍 Jungle Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the snake with the arrow keys and eat fruit to grow — rarer fruit is worth more points. Don&#x27;t hit the walls or your own tail. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;p class=&quot;legend&quot;&gt;
    &lt;span&gt;🍒 1&lt;/span&gt;&lt;span&gt;🍊 2&lt;/span&gt;&lt;span&gt;🍎 3&lt;/span&gt;&lt;span&gt;🥭 5 (rare)&lt;/span&gt;
    &lt;button class=&quot;mutebtn&quot; id=&quot;mute&quot;&gt;🔊 Sound&lt;/button&gt;
  &lt;/p&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;canvas&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var TICK_MS = 150;
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var score = 0;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var canvas = document.getElementById(&#x27;canvas&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);

  // =========================================================
  // AUDIO (procedural via Web Audio API)
  // =========================================================
  var AC = null, masterGain = null, musicGain = null, muted = false;
  var musicTimer = null, birdTimer = null, musicStep = 0;
  function initAudio() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain();
      masterGain.gain.value = muted ? 0 : 0.9;
      masterGain.connect(AC.destination);
      musicGain = AC.createGain();
      musicGain.gain.value = 0.5;
      musicGain.connect(masterGain);
    } catch (_) { AC = null; }
  }

  function playTone(freq, dur, type, gainVal, dest, attack) {
    if (!AC) return;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || &#x27;sine&#x27;;
    o.frequency.value = freq;
    var now = AC.currentTime;
    var a = attack || 0.01;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gainVal, now + a);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g);
    g.connect(dest || masterGain);
    o.start(now);
    o.stop(now + dur + 0.05);
  }

  // Pentatonic-ish jungle melody + bass loop
  var BASS = [55, 55, 73.42, 65.41]; // A1, A1, D2, C2
  var MELODY = [220, 261.63, 293.66, 329.63, 293.66, 261.63, 220, 196];
  function musicTick() {
    if (!AC || muted) return;
    var bassNote = BASS[musicStep % BASS.length];
    playTone(bassNote, 0.5, &#x27;triangle&#x27;, 0.28, musicGain, 0.02);
    // melody every other step
    if (musicStep % 1 === 0) {
      var mel = MELODY[musicStep % MELODY.length];
      playTone(mel, 0.35, &#x27;sine&#x27;, 0.14, musicGain, 0.02);
    }
    // soft pad
    if (musicStep % 4 === 0) {
      playTone(bassNote * 2, 0.9, &#x27;sine&#x27;, 0.08, musicGain, 0.1);
    }
    musicStep++;
  }
  function birdTick() {
    if (!AC || muted) return;
    if (Math.random() &lt; 0.5) {
      // chirp: quick up-down
      var base = 1400 + Math.random() * 900;
      playTone(base, 0.08, &#x27;sine&#x27;, 0.10, masterGain, 0.005);
      setTimeout(function(){ playTone(base * 1.25, 0.07, &#x27;sine&#x27;, 0.08, masterGain, 0.005); }, 70);
    }
    // schedule next bird randomly
    birdTimer = setTimeout(birdTick, 1500 + Math.random() * 3500);
  }
  function startMusic() {
    if (!AC) return;
    musicStep = 0;
    if (musicTimer) clearInterval(musicTimer);
    musicTick();
    musicTimer = setInterval(musicTick, 480);
    if (birdTimer) clearTimeout(birdTimer);
    birdTimer = setTimeout(birdTick, 1200);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    if (birdTimer) { clearTimeout(birdTimer); birdTimer = null; }
  }
  function sfxEat(points) {
    if (!AC) return;
    var base = 440 + points * 40;
    playTone(base, 0.12, &#x27;square&#x27;, 0.16);
    setTimeout(function(){ playTone(base * 1.5, 0.12, &#x27;square&#x27;, 0.13); }, 60);
  }
  function sfxGolden() {
    if (!AC) return;
    var notes = [523, 659, 784, 1047];
    notes.forEach(function(n, i){ setTimeout(function(){ playTone(n, 0.18, &#x27;triangle&#x27;, 0.16); }, i * 70); });
  }
  function sfxGameOver() {
    if (!AC) return;
    var notes = [330, 294, 247, 196];
    notes.forEach(function(n, i){ setTimeout(function(){ playTone(n, 0.3, &#x27;sawtooth&#x27;, 0.16); }, i * 140); });
  }

  var muteBtn = document.getElementById(&#x27;mute&#x27;);
  muteBtn.addEventListener(&#x27;click&#x27;, function(){
    muted = !muted;
    if (masterGain) masterGain.gain.value = muted ? 0 : 0.9;
    muteBtn.textContent = muted ? &#x27;🔇 Muted&#x27; : &#x27;🔊 Sound&#x27;;
  });

  // =========================================================
  // FRUIT
  // =========================================================
  var FRUITS = [
    { name: &#x27;cherry&#x27;, points: 1, weight: 45, colorIn: &#x27;#ff8a8a&#x27;, colorMid: &#x27;#e83b3b&#x27;, colorOut: &#x27;#a51414&#x27;, r: 0.42 },
    { name: &#x27;orange&#x27;, points: 2, weight: 28, colorIn: &#x27;#ffd08a&#x27;, colorMid: &#x27;#ff9a2e&#x27;, colorOut: &#x27;#c96a10&#x27;, r: 0.46 },
    { name: &#x27;apple&#x27;,  points: 3, weight: 20, colorIn: &#x27;#c8ff8a&#x27;, colorMid: &#x27;#6fbf2e&#x27;, colorOut: &#x27;#3a7a14&#x27;, r: 0.46 },
    { name: &#x27;mango&#x27;,  points: 5, weight: 7,  colorIn: &#x27;#fff3a0&#x27;, colorMid: &#x27;#ffcf33&#x27;, colorOut: &#x27;#c98a00&#x27;, r: 0.48, golden: true }
  ];
  var food = { x: 10, y: 10, type: FRUITS[0] };

  function pickFruitType() {
    var total = 0, i;
    for (i = 0; i &lt; FRUITS.length; i++) total += FRUITS[i].weight;
    var r = Math.random() * total;
    for (i = 0; i &lt; FRUITS.length; i++) { r -= FRUITS[i].weight; if (r &lt;= 0) return FRUITS[i]; }
    return FRUITS[0];
  }

  // =========================================================
  // PARTICLES
  // =========================================================
  var particles = [];
  function spawnParticles(cx, cy, baseColor) {
    for (var i = 0; i &lt; 16; i++) {
      var ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.5;
      var spd = 1.2 + Math.random() * 2.4;
      particles.push({ x: cx, y: cy, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
        life: 1, decay: 0.02 + Math.random()*0.02, size: 2 + Math.random()*3, color: baseColor });
    }
  }
  function updateParticles() {
    for (var i = particles.length - 1; i &gt;= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.96; p.life -= p.decay;
      if (p.life &lt;= 0) particles.splice(i, 1);
    }
  }
  function drawParticles() {
    for (var i = 0; i &lt; particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // =========================================================
  // ANIMATED BACKGROUND PLANTS
  // =========================================================
  var ferns = [], floatLeaves = [], lightSpots = [];
  function buildPlants() {
    ferns = [];
    // ferns sprouting from bottom edge
    var fx = 30;
    while (fx &lt; 600) {
      ferns.push({
        x: fx + (Math.random()*20-10),
        h: 60 + Math.random()*70,
        fronds: 4 + Math.floor(Math.random()*3),
        phase: Math.random()*Math.PI*2,
        speed: 0.6 + Math.random()*0.6,
        sway: 0.12 + Math.random()*0.12,
        hue: 90 + Math.random()*30,
        light: 25 + Math.random()*15
      });
      fx += 55 + Math.random()*35;
    }
    floatLeaves = [];
    for (var i = 0; i &lt; 8; i++) {
      floatLeaves.push({
        x: Math.random()*600, y: Math.random()*440,
        r: 8 + Math.random()*10, rot: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-0.5)*0.02,
        vx: 0.15 + Math.random()*0.3, vy: (Math.random()-0.5)*0.15,
        alpha: 0.06 + Math.random()*0.08
      });
    }
    lightSpots = [];
    for (var j = 0; j &lt; 5; j++) {
      lightSpots.push({ x: Math.random()*600, y: Math.random()*440,
        r: 40 + Math.random()*50, phase: Math.random()*Math.PI*2, speed: 0.3+Math.random()*0.4 });
    }
  }
  buildPlants();

  var bgTime = 0;
  function drawFern(f) {
    var sway = Math.sin(bgTime * f.speed + f.phase) * f.sway;
    ctx.save();
    ctx.translate(f.x, 440);
    ctx.rotate(sway);
    // stem
    ctx.strokeStyle = &#x27;hsla(&#x27; + f.hue + &#x27;,55%,&#x27; + f.light + &#x27;%,0.5)&#x27;;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(f.h*0.15, -f.h*0.5, f.h*0.05, -f.h);
    ctx.stroke();
    // fronds along stem
    for (var i = 1; i &lt;= f.fronds; i++) {
      var t = i / (f.fronds + 1);
      var sy = -f.h * t;
      var sx = f.h * 0.05 * t + (f.h*0.15)*(1-t)*t*4*0.3;
      var flen = (f.h * 0.28) * (1 - t*0.5);
      var frondSway = Math.sin(bgTime * f.speed + f.phase + i) * 0.08;
      for (var side = -1; side &lt;= 1; side += 2) {
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(side * (0.7 + frondSway));
        ctx.fillStyle = &#x27;hsla(&#x27; + f.hue + &#x27;,55%,&#x27; + (f.light + 8) + &#x27;%,0.45)&#x27;;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(flen*0.5, -flen*0.25, flen, 0);
        ctx.quadraticCurveTo(flen*0.5, flen*0.12, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function drawFloatLeaf(l) {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.fillStyle = &#x27;rgba(150,220,100,&#x27; + l.alpha + &#x27;)&#x27;;
    ctx.beginPath();
    ctx.moveTo(0, -l.r);
    ctx.quadraticCurveTo(l.r*0.7, 0, 0, l.r);
    ctx.quadraticCurveTo(-l.r*0.7, 0, 0, -l.r);
    ctx.fill();
    ctx.restore();
  }

  function drawLightSpot(s) {
    var r = s.r * (0.85 + Math.sin(bgTime * s.speed + s.phase) * 0.15);
    var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r);
    g.addColorStop(0, &#x27;rgba(220,255,150,0.10)&#x27;);
    g.addColorStop(1, &#x27;rgba(220,255,150,0)&#x27;);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill();
  }

  function updatePlants() {
    for (var i = 0; i &lt; floatLeaves.length; i++) {
      var l = floatLeaves[i];
      l.x += l.vx; l.y += l.vy; l.rot += l.rotSpeed;
      if (l.x &gt; 615) { l.x = -15; l.y = Math.random()*440; }
      if (l.y &lt; -15) l.y = 455; if (l.y &gt; 455) l.y = -15;
    }
  }

  function drawBackground() {
    for (var i = 0; i &lt; lightSpots.length; i++) drawLightSpot(lightSpots[i]);
    for (var j = 0; j &lt; floatLeaves.length; j++) drawFloatLeaf(floatLeaves[j]);
    for (var k = 0; k &lt; ferns.length; k++) drawFern(ferns[k]);
  }

  // =========================================================
  // FOOD DRAW
  // =========================================================
  var glowPhase = 0;
  function drawFood() {
    var t = food.type;
    var cx = food.x * CELL + CELL / 2;
    var cy = food.y * CELL + CELL / 2;
    var rad = CELL * t.r;
    ctx.save();
    if (t.golden) { ctx.shadowColor = &#x27;rgba(255,215,0,0.9)&#x27;; ctx.shadowBlur = 6 + Math.sin(glowPhase)*4; }
    var grad = ctx.createRadialGradient(cx-3, cy-3, 2, cx, cy, rad);
    grad.addColorStop(0, t.colorIn); grad.addColorStop(0.5, t.colorMid); grad.addColorStop(1, t.colorOut);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;rgba(255,255,255,0.75)&#x27;;
    ctx.beginPath(); ctx.arc(cx - rad*0.3, cy - rad*0.35, rad*0.22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#3fa02f&#x27;;
    ctx.beginPath(); ctx.ellipse(cx+3, cy-rad+1, 4, 2.5, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = &#x27;#6b4218&#x27;; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx, cy-rad); ctx.lineTo(cx-1, cy-rad-3); ctx.stroke();
    ctx.restore();
  }

  // =========================================================
  // SNAKE DRAW
  // =========================================================
  var tonguePhase = 0;
  function segRadius(i, len) {
    var head = CELL * 0.60, tail = CELL * 0.28;
    var t = i / Math.max(1, len - 1);
    return head - (head - tail) * t;
  }
  function drawSnake() {
    var len = snake.length;
    for (var i = len - 1; i &gt;= 1; i--) {
      var s = snake[i];
      var cx = s.x*CELL + CELL/2, cy = s.y*CELL + CELL/2;
      var rad = segRadius(i, len);
      var grad = ctx.createRadialGradient(cx - rad*0.3, cy - rad*0.3, 1, cx, cy, rad);
      grad.addColorStop(0, &#x27;#9de85f&#x27;); grad.addColorStop(0.55, &#x27;#54ad30&#x27;); grad.addColorStop(1, &#x27;#2b6b18&#x27;);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = (i % 2 === 0) ? &#x27;rgba(30,80,18,0.40)&#x27; : &#x27;rgba(40,100,25,0.30)&#x27;;
      ctx.beginPath();
      var r = rad*0.5;
      ctx.moveTo(cx, cy-r); ctx.lineTo(cx+r, cy); ctx.lineTo(cx, cy+r); ctx.lineTo(cx-r, cy);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = &#x27;rgba(220,255,180,0.22)&#x27;;
      ctx.beginPath(); ctx.arc(cx - rad*0.35, cy - rad*0.35, rad*0.28, 0, Math.PI*2); ctx.fill();
    }
    var h = snake[0];
    var hx = h.x*CELL + CELL/2, hy = h.y*CELL + CELL/2;
    var ang = Math.atan2(dir.y, dir.x);
    var hr = CELL * 0.68;
    ctx.save();
    ctx.translate(hx, hy); ctx.rotate(ang);
    var flick = Math.sin(tonguePhase);
    var tLen = 9 + flick*6;
    if (flick &gt; -0.3) {
      ctx.strokeStyle = &#x27;#e0304a&#x27;; ctx.lineWidth = 2; ctx.lineCap = &#x27;round&#x27;;
      var base = hr - 1; var forkSpread = 3 + Math.abs(flick)*2.5;
      ctx.beginPath(); ctx.moveTo(base, 0); ctx.lineTo(base + tLen, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(base + tLen, 0); ctx.lineTo(base + tLen + 5, -forkSpread);
      ctx.moveTo(base + tLen, 0); ctx.lineTo(base + tLen + 5, forkSpread);
      ctx.stroke();
    }
    var hgrad = ctx.createRadialGradient(-hr*0.2, -hr*0.2, 1, 0, 0, hr);
    hgrad.addColorStop(0, &#x27;#aef070&#x27;); hgrad.addColorStop(0.55, &#x27;#5cc035&#x27;); hgrad.addColorStop(1, &#x27;#2b6b18&#x27;);
    ctx.fillStyle = hgrad;
    ctx.beginPath();
    ctx.moveTo(hr, 0);
    ctx.quadraticCurveTo(hr*0.5, -hr*0.85, -hr*0.35, -hr*0.9);
    ctx.quadraticCurveTo(-hr, -hr*0.5, -hr, 0);
    ctx.quadraticCurveTo(-hr, hr*0.5, -hr*0.35, hr*0.9);
    ctx.quadraticCurveTo(hr*0.5, hr*0.85, hr, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;rgba(30,80,18,0.20)&#x27;;
    ctx.beginPath(); ctx.ellipse(-hr*0.1, 0, hr*0.55, hr*0.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;rgba(20,60,10,0.7)&#x27;;
    ctx.beginPath(); ctx.arc(hr*0.7, -3, 1.1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hr*0.7, 3, 1.1, 0, Math.PI*2); ctx.fill();
    var ey = 6.5, eR = 4.6;
    for (var side = -1; side &lt;= 1; side += 2) {
      ctx.fillStyle = &#x27;#ffdf6b&#x27;;
      ctx.beginPath(); ctx.arc(0, side*ey, eR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;#161006&#x27;;
      ctx.beginPath(); ctx.ellipse(1.2, side*ey, 1.1, eR*0.75, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;rgba(255,255,255,0.85)&#x27;;
      ctx.beginPath(); ctx.arc(-1, side*ey - 1.4, 1, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function paint() {
    ctx.clearRect(0, 0, 600, 440);
    drawBackground();
    drawFood();
    drawSnake();
    drawParticles();
  }

  function cellOccupied(x, y) {
