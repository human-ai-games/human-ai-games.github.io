&lt;div class=&quot;game&quot;&gt;

  &lt;p class=&quot;instructions&quot;&gt;Bounce the ball to score and catch falling power-ups. Set difficulty &lt;strong&gt;1&lt;/strong&gt;/&lt;strong&gt;2&lt;/strong&gt;/&lt;strong&gt;3&lt;/strong&gt;, change background with &lt;strong&gt;B&lt;/strong&gt;, toggle 2-player with &lt;strong&gt;M&lt;/strong&gt;.&lt;/p&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var FIELD_W = 620, FIELD_H = 380;
  var PADDLE_BASE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_TOP = 10;
  var BALL_SIZE = 16;

  var DIFFS = {
    1: { name: &#x27;Easy&#x27;,   ballSpeed: 3.0, paddleSpeed: 7, puChance: 0.010 },
    2: { name: &#x27;Normal&#x27;, ballSpeed: 4.2, paddleSpeed: 6, puChance: 0.007 },
    3: { name: &#x27;Hard&#x27;,   ballSpeed: 5.6, paddleSpeed: 6, puChance: 0.005 }
  };
  var diffKey = 2, diff = DIFFS[2];

  var BGS = [&#x27;space&#x27;, &#x27;sunset&#x27;, &#x27;grid&#x27;];
  var BGNAMES = { space: &#x27;Space&#x27;, sunset: &#x27;Sunset&#x27;, grid: &#x27;Grid&#x27; };
  var bgIndex = 0;

  var twoPlayer = false;
  var running = false, animId = null;
  var keysDown = {};

  var paddleX = (FIELD_W - PADDLE_BASE_W) / 2, paddleW = PADDLE_BASE_W;
  var paddle2X = (FIELD_W - PADDLE_BASE_W) / 2, paddle2W = PADDLE_BASE_W;
  var ballX = FIELD_W / 2, ballY = 50, ballVX = 4, ballVY = 4;
  var score = 0, score2 = 0;

  var powerups = [];
  var wideUntil = 0, slowUntil = 0, x2Until = 0;

  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var paddle2 = document.getElementById(&#x27;paddle2&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var score2El = document.getElementById(&#x27;score2&#x27;);
  var score2wrap = document.getElementById(&#x27;score2wrap&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var diffNameEl = document.getElementById(&#x27;diffName&#x27;);
  var modeNameEl = document.getElementById(&#x27;modeName&#x27;);
  var bgNameEl = document.getElementById(&#x27;bgName&#x27;);
  var powerlabel = document.getElementById(&#x27;powerlabel&#x27;);

  var starEls = [];
  for (var i = 0; i &lt; 40; i++) {
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;star&#x27;;
    s.style.left = Math.random() * FIELD_W + &#x27;px&#x27;;
    s.style.top = Math.random() * FIELD_H + &#x27;px&#x27;;
    s.style.width = s.style.height = (Math.random() &lt; 0.3 ? 3 : 2) + &#x27;px&#x27;;
    s.style.opacity = (0.2 + Math.random() * 0.6).toFixed(2);
    field.appendChild(s);
    starEls.push(s);
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audioCtx = null; } }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq; g.gain.value = vol || 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now); o.stop(now + dur);
  }
  function sndPaddle() { ensureAudio(); beep(520, 0.12, &#x27;square&#x27;, 0.2); beep(780, 0.08, &#x27;square&#x27;, 0.12); }
  function sndPaddle2() { ensureAudio(); beep(440, 0.12, &#x27;square&#x27;, 0.2); beep(660, 0.08, &#x27;square&#x27;, 0.12); }
  function sndWall() { ensureAudio(); beep(300, 0.08, &#x27;triangle&#x27;, 0.15); }
  function sndMiss() { ensureAudio(); beep(160, 0.35, &#x27;sawtooth&#x27;, 0.2); }
  function sndPower() { ensureAudio(); beep(660, 0.1, &#x27;square&#x27;, 0.2); beep(990, 0.12, &#x27;square&#x27;, 0.18); beep(1320, 0.1, &#x27;square&#x27;, 0.14); }

  function setBg() {
    var bg = BGS[bgIndex];
    field.className = &#x27;field bg-&#x27; + bg;
    bgNameEl.textContent = BGNAMES[bg];
    var showStars = (bg === &#x27;space&#x27;);
    for (var i = 0; i &lt; starEls.length; i++) starEls[i].style.display = showStars ? &#x27;block&#x27; : &#x27;none&#x27;;
  }

  function paint() {
    paddle.style.width = paddleW + &#x27;px&#x27;;
    paddle.style.left = paddleX + &#x27;px&#x27;;
    paddle.style.bottom = PADDLE_BOTTOM + &#x27;px&#x27;;
    paddle2.style.width = paddle2W + &#x27;px&#x27;;
    paddle2.style.left = paddle2X + &#x27;px&#x27;;
    paddle2.style.top = PADDLE_TOP + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
    for (var i = 0; i &lt; powerups.length; i++) {
      powerups[i].el.style.left = powerups[i].x + &#x27;px&#x27;;
      powerups[i].el.style.top = powerups[i].y + &#x27;px&#x27;;
    }
  }

  function applyDiff(k) { diffKey = k; diff = DIFFS[k]; diffNameEl.textContent = diff.name; }

  function resetBall(towardTop) {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = FIELD_H / 2;
    var dir = (Math.random() &lt; 0.5 ? -1 : 1);
    ballVX = dir * diff.ballSpeed;
    ballVY = (towardTop ? -1 : 1) * diff.ballSpeed;
  }

  function clearPowerups() {
    for (var i = 0; i &lt; powerups.length; i++) field.removeChild(powerups[i].el);
    powerups = [];
  }
  function spawnPowerup() {
    var types = [&#x27;wide&#x27;, &#x27;slow&#x27;, &#x27;x2&#x27;];
    var type = types[Math.floor(Math.random() * types.length)];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;pu pu-&#x27; + type;
    el.textContent = type === &#x27;wide&#x27; ? &#x27;↔&#x27; : (type === &#x27;slow&#x27; ? &#x27;🐢&#x27; : &#x27;×2&#x27;);
    field.appendChild(el);
    powerups.push({ el: el, x: 20 + Math.random() * (FIELD_W - 60), y: FIELD_H/2 - 11, type: type, vy: (Math.random()&lt;0.5?-1:1)*1.8 });
  }
  function updatePowerLabel() {
    var now = Date.now(); var parts = [];
    if (now &lt; wideUntil) parts.push(&#x27;↔ Wide&#x27;);
    if (now &lt; slowUntil) parts.push(&#x27;🐢 Slow&#x27;);
    if (now &lt; x2Until) parts.push(&#x27;×2&#x27;);
    powerlabel.innerHTML = parts.length ? parts.join(&#x27; · &#x27;) : &#x27;&amp;nbsp;&#x27;;
  }
  function activatePower(type) {
    var now = Date.now();
    if (type === &#x27;wide&#x27;) wideUntil = now + 8000;
    else if (type === &#x27;slow&#x27;) slowUntil = now + 6000;
    else if (type === &#x27;x2&#x27;) x2Until = now + 8000;
    sndPower();
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    var wide = (now &lt; wideUntil);
    paddleW = wide ? PADDLE_BASE_W * 1.7 : PADDLE_BASE_W;
    paddle2W = wide ? PADDLE_BASE_W * 1.7 : PADDLE_BASE_W;

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= diff.paddleSpeed;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += diff.paddleSpeed;
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));

    if (twoPlayer) {
      if (keysDown[&#x27;a&#x27;] || keysDown[&#x27;A&#x27;]) paddle2X -= diff.paddleSpeed;
      if (keysDown[&#x27;d&#x27;] || keysDown[&#x27;D&#x27;]) paddle2X += diff.paddleSpeed;
      paddle2X = Math.max(0, Math.min(FIELD_W - paddle2W, paddle2X));
    }

    var speedFactor = (now &lt; slowUntil) ? 0.5 : 1.0;
    ballX += ballVX * speedFactor;
    ballY += ballVY * speedFactor;

    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; sndWall(); }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; sndWall(); }

    // top wall / P2 paddle
    var p2bottom = PADDLE_TOP + PADDLE_H;
    if (twoPlayer) {
      if (ballVY &lt; 0 &amp;&amp; ballY &lt;= p2bottom + 6 &amp;&amp; ballY &gt;= PADDLE_TOP - 6 &amp;&amp;
          ballX + BALL_SIZE &gt;= paddle2X &amp;&amp; ballX &lt;= paddle2X + paddle2W) {
        ballVY = Math.abs(ballVY);
        ballY = p2bottom;
        score2 += (now &lt; x2Until) ? 2 : 1;
        score2El.textContent = score2;
        sndPaddle2();
      } else if (ballY &lt;= 0) {
        // P2 missed
        sndMiss(); resetBall(false);
      }
    } else {
      if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; sndWall(); }
    }

    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + paddleW) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += (now &lt; x2Until) ? 2 : 1;
      scoreEl.textContent = score;
      sndPaddle();
    }

    if (ballY &gt;= FIELD_H) { sndMiss(); resetBall(true); }

    if (Math.random() &lt; diff.puChance) spawnPowerup();
    for (var i = powerups.length - 1; i &gt;= 0; i--) {
      var pu = powerups[i];
      pu.y += pu.vy;
      var caught = false;
      // P1 catch
      if (pu.y + 22 &gt;= paddleTop &amp;&amp; pu.y &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
          pu.x + 22 &gt;= paddleX &amp;&amp; pu.x &lt;= paddleX + paddleW) caught = true;
      // P2 catch
      if (twoPlayer &amp;&amp; pu.y &lt;= p2bottom + 6 &amp;&amp; pu.y + 22 &gt;= PADDLE_TOP &amp;&amp;
          pu.x + 22 &gt;= paddle2X &amp;&amp; pu.x &lt;= paddle2X + paddle2W) caught = true;
      if (caught) { activatePower(pu.type); field.removeChild(pu.el); powerups.splice(i, 1); continue; }
      if (pu.y &gt; FIELD_H || pu.y &lt; -30) { field.removeChild(pu.el); powerups.splice(i, 1); }
    }

    updatePowerLabel();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function setMode() {
    modeNameEl.textContent = twoPlayer ? &#x27;2 Players&#x27; : &#x27;1 Player&#x27;;
    paddle2.style.display = twoPlayer ? &#x27;block&#x27; : &#x27;none&#x27;;
    score2wrap.style.display = twoPlayer ? &#x27;block&#x27; : &#x27;none&#x27;;
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    score = 0; score2 = 0;
    scoreEl.textContent = &#x27;0&#x27;; score2El.textContent = &#x27;0&#x27;;
    paddleW = PADDLE_BASE_W; paddle2W = PADDLE_BASE_W;
    paddleX = (FIELD_W - paddleW) / 2;
    paddle2X = (FIELD_W - paddle2W) / 2;
    wideUntil = slowUntil = x2Until = 0;
    clearPowerups();
    updatePowerLabel();
    for (var k in keysDown) keysDown[k] = false;
    resetBall(false);
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    var k = e.key;
    if (k === &#x27;ArrowLeft&#x27; || k === &#x27;ArrowRight&#x27;) { keysDown[k] = true; e.preventDefault(); }
    else if (k === &#x27;a&#x27; || k === &#x27;A&#x27; || k === &#x27;d&#x27; || k === &#x27;D&#x27;) { keysDown[k.toLowerCase()] = true; keysDown[k] = true; }
    else if (k === &#x27;1&#x27;) applyDiff(1);
    else if (k === &#x27;2&#x27;) applyDiff(2);
    else if (k === &#x27;3&#x27;) applyDiff(3);
    else if (k === &#x27;b&#x27; || k === &#x27;B&#x27;) { bgIndex = (bgIndex + 1) % BGS.length; setBg(); }
    else if (k === &#x27;m&#x27; || k === &#x27;M&#x27;) { twoPlayer = !twoPlayer; setMode(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    var k = e.key;
    if (k === &#x27;ArrowLeft&#x27; || k === &#x27;ArrowRight&#x27;) keysDown[k] = false;
    else if (k === &#x27;a&#x27; || k === &#x27;A&#x27; || k === &#x27;d&#x27; || k === &#x27;D&#x27;) { keysDown[k.toLowerCase()] = false; keysDown[k] = false; }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  applyDiff(2);
  setMode();
  setBg();
  paint();
&lt;/script&gt;
