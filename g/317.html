<style>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a1a; color: #eee; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: linear-gradient(160deg,#0d0d24,#161638); height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 {
    margin: 0; font-size: 30px; font-weight: 700;
    background: linear-gradient(90deg,#ff5ecb,#5ec8ff,#8dff5e,#ffdd5e,#ff5ecb);

  @keyframes drift { from { transform: translateY(-10px);} to { transform: translateY(430px);} }

    background: linear-gradient(90deg,#5ec8ff,#8dff5e,#5ec8ff);

  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✨ Paddle Ball ✨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys. Each time the ball touches the paddle you score 5 points — use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 10;
  var BALL_SIZE = 16;
  var BALL_SPEED = 7.0;
  var POINTS_PER_HIT = 5;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var starsBox = document.getElementById(&#x27;stars&#x27;);

  // build twinkling drifting stars
  for (var i = 0; i &lt; 40; i++) {
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;star&#x27;;
    s.style.left = Math.random() * 620 + &#x27;px&#x27;;
    s.style.top = Math.random() * 420 + &#x27;px&#x27;;
    var d = 3 + Math.random() * 4;
    s.style.animationDuration = (2 + Math.random() * 3) + &#x27;s, &#x27; + (d) + &#x27;s&#x27;;
    s.style.animationDelay = (-Math.random() * d) + &#x27;s&#x27;;
    var sz = 1 + Math.random() * 2;
    s.style.width = sz + &#x27;px&#x27;; s.style.height = sz + &#x27;px&#x27;;
    starsBox.appendChild(s);
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function spawnTrail() {
    var t = document.createElement(&#x27;div&#x27;);
    t.className = &#x27;trail&#x27;;
    t.style.left = (ballX + 2) + &#x27;px&#x27;;
    t.style.top = (ballY + 2) + &#x27;px&#x27;;
    field.appendChild(t);
    var op = 0.5;
    var fade = setInterval(function () {
      op -= 0.08;
      t.style.opacity = op;
      var scale = op;
      t.style.transform = &#x27;scale(&#x27; + Math.max(0.2, scale + 0.4) + &#x27;)&#x27;;
      if (op &lt;= 0) { clearInterval(fade); t.remove(); }
    }, 30);
  }

  var COLORS = [&#x27;#ff5ecb&#x27;,&#x27;#5ec8ff&#x27;,&#x27;#8dff5e&#x27;,&#x27;#ffdd5e&#x27;,&#x27;#ffffff&#x27;];
  function burst(x, y) {
    for (var i = 0; i &lt; 12; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      p.style.left = x + &#x27;px&#x27;;
      p.style.top = y + &#x27;px&#x27;;
      p.style.background = COLORS[i % COLORS.length];
      p.style.boxShadow = &#x27;0 0 8px &#x27; + COLORS[i % COLORS.length];
      field.appendChild(p);
      var ang = (Math.PI * 2 * i) / 12 + Math.random();
      var spd = 2 + Math.random() * 3;
      var vx = Math.cos(ang) * spd, vy = Math.sin(ang) * spd - 1;
      var px = x, py = y, life = 1;
      (function (p, vx, vy, px, py, life) {
        var mv = setInterval(function () {
          px += vx; py += vy; vy += 0.15; life -= 0.05;
          p.style.left = px + &#x27;px&#x27;; p.style.top = py + &#x27;px&#x27;;
          p.style.opacity = life;
          if (life &lt;= 0) { clearInterval(mv); p.remove(); }
        }, 25);
      })(p, vx, vy, px, py, life);
    }
    var pop = document.createElement(&#x27;div&#x27;);
    pop.className = &#x27;popup&#x27;;
    pop.textContent = &#x27;+&#x27; + POINTS_PER_HIT;
    pop.style.left = x + &#x27;px&#x27;;
    pop.style.top = (y - 10) + &#x27;px&#x27;;
    field.appendChild(pop);
    var py2 = y - 10, op2 = 1;
    var rise = setInterval(function () {
      py2 -= 1.5; op2 -= 0.04;
      pop.style.top = py2 + &#x27;px&#x27;; pop.style.opacity = op2;
      if (op2 &lt;= 0) { clearInterval(rise); pop.remove(); }
    }, 25);
  }

  var trailCounter = 0;
  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    ballX += ballVX;
    ballY += ballVY;

    trailCounter++;
    if (trailCounter % 2 === 0) spawnTrail();

    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += POINTS_PER_HIT;
      scoreEl.textContent = score;
      burst(ballX + BALL_SIZE / 2, paddleTop);
    }
    if (ballY &gt;= FIELD_H) resetBall();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paint();
&lt;/script&gt;

<script>
