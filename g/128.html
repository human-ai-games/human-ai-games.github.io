  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: &#x27;Georgia&#x27;, &#x27;Times New Roman&#x27;, serif; margin: 0; padding: 0; background: #1a1220; color: #e8dcc0; overflow: hidden; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;⚔ DRAGON&#x27;S GAUNTLET ⚔&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Jump with &lt;strong&gt;Space&lt;/strong&gt; (again mid-air to double-jump) and dodge dragons, wizards &amp; spikes. Rescue the 👑 princess for double points — she shields one hit but flees when struck; grab ✦ shields and 🔥 fireballs (press &lt;strong&gt;F&lt;/strong&gt; to blast).&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Best: &lt;b id=&quot;best&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;pw princess&quot; id=&quot;princessbox&quot;&gt;👑 No&lt;/span&gt;
    &lt;span class=&quot;pw shielded&quot; id=&quot;shieldbox&quot;&gt;Shield: 0&lt;/span&gt;
    &lt;span class=&quot;pw hot&quot; id=&quot;firebox&quot;&gt;Fire: 0&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;canvas id=&quot;cv&quot; width=&quot;560&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;
        &lt;div&gt;⚰ You Fell ⚰&lt;/div&gt;
        &lt;small id=&quot;finalscore&quot;&gt;&lt;/small&gt;
        &lt;small&gt;Press Start below to fight again&lt;/small&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;board&quot;&gt;
      &lt;h2&gt;🏆 Champions&lt;/h2&gt;
      &lt;ol id=&quot;lb&quot;&gt;&lt;li style=&quot;list-style:none;color:#8a7a5a&quot;&gt;No scores yet&lt;/li&gt;&lt;/ol&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 560, H = 400, GROUND_H = 40;
var scoreEl = document.getElementById(&#x27;score&#x27;);
var bestEl = document.getElementById(&#x27;best&#x27;);
var shieldEl = document.getElementById(&#x27;shieldbox&#x27;);
var fireEl = document.getElementById(&#x27;firebox&#x27;);
var princessEl = document.getElementById(&#x27;princessbox&#x27;);
var overEl = document.getElementById(&#x27;over&#x27;);
var finalEl = document.getElementById(&#x27;finalscore&#x27;);
var lbEl = document.getElementById(&#x27;lb&#x27;);

var GRAVITY = 0.62;
var HERO_SIZE = 36, HERO_X = 70;
var running = false, animId = null;
var heroY, heroVY, onGround, jumpsLeft;
var jumpHeld = false, jumpFrames = 0;
var obstacles, items, fireballs, particles, fleeing, score, best = 0, gameOver;
var shields = 0, fires = 0, hasPrincess = false;
var spawnTimer, itemTimer, princessTimer;
var speed, elapsed, worldX;
var leaderboard = [];
var flash = 0, hitShake = 0;

var enemyTypes = [
  { key:&#x27;dragon&#x27;, w:64, h:70, fly:true,  hp:1 },
  { key:&#x27;wizard&#x27;, w:40, h:64, fly:false, hp:1 },
  { key:&#x27;knight&#x27;, w:44, h:60, fly:false, hp:1 },
  { key:&#x27;spikewall&#x27;, w:34, h:80, fly:false, hp:1 },
  { key:&#x27;gargoyle&#x27;, w:52, h:52, fly:true, hp:1 }
];

function floorY(){ return H - GROUND_H - HERO_SIZE; }

function reset(){
  heroY = floorY(); heroVY = 0; onGround = true; jumpsLeft = 2;
  jumpHeld = false; jumpFrames = 0;
  obstacles = []; items = []; fireballs = []; particles = []; fleeing = [];
  score = 0; gameOver = false;
  shields = 0; fires = 0; hasPrincess = false;
  speed = 4.4; elapsed = 0; worldX = 0;
  spawnTimer = 30; itemTimer = 240; princessTimer = 380;
  flash = 0; hitShake = 0;
  updateHud();
}

function updateHud(){
  scoreEl.textContent = score;
  bestEl.textContent = best;
  shieldEl.textContent = &#x27;Shield: &#x27; + shields;
  fireEl.textContent = &#x27;Fire: &#x27; + fires;
  princessEl.textContent = hasPrincess ? &#x27;👑 x2!&#x27; : &#x27;👑 No&#x27;;
  princessEl.style.opacity = hasPrincess ? &#x27;1&#x27; : &#x27;0.55&#x27;;
}

function spawnEnemy(){
  var t = enemyTypes[Math.floor(Math.random()*enemyTypes.length)];
  var y;
  if (t.fly){ y = H - GROUND_H - t.h - (30 + Math.random()*90); }
  else { y = H - GROUND_H - t.h; }
  obstacles.push({ x: W+20, y:y, baseY:y, w:t.w, h:t.h, type:t, hp:t.hp, scored:false, dead:false, deadT:0 });
}

function spawnItem(){
  var kind = Math.random()&lt;0.5 ? &#x27;shield&#x27; : &#x27;fire&#x27;;
  items.push({ x: W+20, y: H - GROUND_H - HERO_SIZE - (20+Math.random()*110), r:14, kind:kind });
}
function spawnPrincess(){
  if (hasPrincess) return;
  items.push({ x: W+20, y: H - GROUND_H - HERO_SIZE - (20+Math.random()*90), r:16, kind:&#x27;princess&#x27; });
}

function pts(n){ return hasPrincess ? n*2 : n; }

function jumpStart(){
  if (!running || gameOver) return;
  if (jumpsLeft&gt;0){
    heroVY = -9.2; onGround = false; jumpHeld = true; jumpFrames = 0;
    jumpsLeft--;
    beep(jumpsLeft===1?660:880,0.05,&#x27;square&#x27;,0.08);
    if (jumpsLeft===0){
      for(var i=0;i&lt;8;i++) particles.push({x:HERO_X+HERO_SIZE/2,y:heroY+HERO_SIZE,vx:(Math.random()-0.5)*3,vy:Math.random()*2+1,life:14,c:&#x27;#ccc&#x27;});
    }
  }
}
function jumpEnd(){ jumpHeld = false; }

function castFire(){
  if (!running || gameOver) return;
  if (fires&gt;0){
    fires--; updateHud();
    fireballs.push({ x: HERO_X+HERO_SIZE, y: heroY+HERO_SIZE/2, vx: 11, r:12, life:80 });
    beep(200,0.25,&#x27;sawtooth&#x27;,0.13);
    for(var i=0;i&lt;6;i++) particles.push({x:HERO_X+HERO_SIZE,y:heroY+HERO_SIZE/2,vx:Math.random()*3+2,vy:(Math.random()-0.5)*3,life:12,c:&#x27;#ff8a3c&#x27;});
  }
}

function losePrincess(){
  hasPrincess = false; updateHud();
  // princess flees off screen (jumps away)
  fleeing.push({ x: HERO_X+HERO_SIZE, y: heroY, vx: -3, vy: -7, life: 60 });
  for(var p=0;p&lt;14;p++) particles.push({x:HERO_X+HERO_SIZE/2,y:heroY+HERO_SIZE/2,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:18,c:&#x27;#ff6ac0&#x27;});
  beep(500,0.3,&#x27;sine&#x27;,0.12); beep(380,0.35,&#x27;sine&#x27;,0.1);
}

function tick(){
  if (!running) return;
  elapsed++;
  worldX += speed;
  speed = 4.4 + Math.min(6.5, elapsed/450);

  if (jumpHeld &amp;&amp; jumpFrames &lt; 11){ heroVY -= 0.5; jumpFrames++; }
  heroVY += GRAVITY;
  heroY += heroVY;
  if (heroY &gt;= floorY()){ heroY = floorY(); heroVY = 0; if(!onGround){onGround=true; jumpsLeft=2;} }
  if (heroY &lt; 0){ heroY = 0; heroVY = 0; }

  spawnTimer--;
  if (spawnTimer&lt;=0){
    spawnEnemy();
    var gap = Math.max(34, 80 - elapsed/18);
    spawnTimer = gap + Math.random()*Math.max(14, 40 - elapsed/25);
  }
  itemTimer--;
  if (itemTimer&lt;=0){ spawnItem(); itemTimer = 300 + Math.random()*260; }
  princessTimer--;
  if (princessTimer&lt;=0){ spawnPrincess(); princessTimer = 500 + Math.random()*400; }

  // fireballs
  for (var f=fireballs.length-1;f&gt;=0;f--){
    var fb=fireballs[f];
    fb.x += fb.vx; fb.life--;
    particles.push({x:fb.x-6,y:fb.y,vx:-1,vy:(Math.random()-0.5)*2,life:8,c:&#x27;#ff5a1c&#x27;});
    if (fb.x&gt;W+30 || fb.life&lt;=0){ fireballs.splice(f,1); continue; }
    for (var e=0;e&lt;obstacles.length;e++){
      var ob=obstacles[e];
      if (ob.dead) continue;
      if (fb.x+fb.r&gt;ob.x &amp;&amp; fb.x-fb.r&lt;ob.x+ob.w &amp;&amp; fb.y+fb.r&gt;ob.y &amp;&amp; fb.y-fb.r&lt;ob.y+ob.h){
        ob.dead=true; ob.deadT=18; if(!ob.scored){ob.scored=true; score+=pts(2); updateHud();}
        for(var p=0;p&lt;16;p++) particles.push({x:ob.x+ob.w/2,y:ob.y+ob.h/2,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:20,c:Math.random()&lt;0.5?&#x27;#ff8a3c&#x27;:&#x27;#ffd76b&#x27;});
        fireballs.splice(f,1); beep(120,0.2,&#x27;sawtooth&#x27;,0.14);
        break;
      }
    }
  }

  // enemies
  for (var i=obstacles.length-1;i&gt;=0;i--){
    var o = obstacles[i];
    o.x -= speed;
    if (o.type.fly) o.y = o.baseY + Math.sin((elapsed+i*20)/16)*10;
    if (o.dead){ o.deadT--; if(o.deadT&lt;=0 || o.x+o.w&lt;0){ obstacles.splice(i,1);} continue; }
    if (o.x + o.w &lt; 0){ obstacles.splice(i,1); continue; }
    if (!o.scored &amp;&amp; o.x + o.w &lt; HERO_X){ o.scored=true; score+=pts(1); updateHud(); if(score%10===0) beep(990,0.06,&#x27;triangle&#x27;,0.07); }
    if (HERO_X+HERO_SIZE-6 &gt; o.x &amp;&amp; HERO_X+6 &lt; o.x+o.w &amp;&amp;
        heroY+HERO_SIZE-6 &gt; o.y &amp;&amp; heroY+6 &lt; o.y+o.h){
      if (hasPrincess){
        losePrincess(); flash=10; hitShake=8;
        o.dead=true; o.deadT=14;
        for(var pr=0;pr&lt;10;pr++) particles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:16,c:&#x27;#ff6ac0&#x27;});
        continue;
      }
      if (shields&gt;0){ shields--; updateHud(); flash=10; hitShake=8; beep(300,0.2,&#x27;sawtooth&#x27;,0.14);
        o.dead=true; o.deadT=14;
        for(var p2=0;p2&lt;12;p2++) particles.push({x:o.x+o.w/2,y:o.y+o.h/2,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:16,c:&#x27;#4cc&#x27;});
        continue;
      }
      endGame(); return;
    }
  }

  // items
  for (var j=items.length-1;j&gt;=0;j--){
    var it = items[j];
    it.x -= speed;
    if (it.x + it.r &lt; 0){ items.splice(j,1); continue; }
    var cx = HERO_X+HERO_SIZE/2, cy = heroY+HERO_SIZE/2;
    var dx = cx-it.x, dy = cy-it.y;
    if (Math.sqrt(dx*dx+dy*dy) &lt; it.r+HERO_SIZE/2){
      if (it.kind===&#x27;shield&#x27;){ shields++; beep(1200,0.12,&#x27;sine&#x27;,0.1); }
      else if (it.kind===&#x27;fire&#x27;){ fires++; beep(500,0.14,&#x27;square&#x27;,0.1); }
      else if (it.kind===&#x27;princess&#x27;){
        if (!hasPrincess){ hasPrincess=true; beep(880,0.12,&#x27;sine&#x27;,0.1); beep(1100,0.16,&#x27;sine&#x27;,0.1);
          for(var pw=0;pw&lt;12;pw++) particles.push({x:cx,y:cy,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:20,c:&#x27;#ffc0e8&#x27;}); }
        else continue; // already have her, leave it (shouldn&#x27;t spawn anyway)
      }
      items.splice(j,1);
      updateHud();
    }
  }

  // fleeing princess animation
  for (var fl=fleeing.length-1;fl&gt;=0;fl--){
    var fp=fleeing[fl];
    fp.x+=fp.vx; fp.vy+=0.4; fp.y+=fp.vy; fp.life--;
    if (fp.life&lt;=0 || fp.y&gt;H){ fleeing.splice(fl,1); }
  }

  // particles
  for (var pp=particles.length-1;pp&gt;=0;pp--){
    var pt=particles[pp]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life--;
    if (pt.life&lt;=0) particles.splice(pp,1);
  }

  draw();
  animId = requestAnimationFrame(tick);
}

function draw(){
  var shakeX = hitShake&gt;0 ? (Math.random()-0.5)*hitShake : 0;
  var shakeY = hitShake&gt;0 ? (Math.random()-0.5)*hitShake : 0;
  if (hitShake&gt;0) hitShake*=0.85;
  ctx.save();
  ctx.translate(shakeX, shakeY);

  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#2a1830&#x27;); g.addColorStop(0.55,&#x27;#5a2838&#x27;); g.addColorStop(1,&#x27;#8a4a3a&#x27;);
  ctx.fillStyle=g; ctx.fillRect(-10,-10,W+20,H+20);

  ctx.beginPath(); ctx.arc(W-70,66,26,0,Math.PI*2); ctx.fillStyle=&#x27;#f0e6c0&#x27;; ctx.fill();
  ctx.beginPath(); ctx.arc(W-60,60,26,0,Math.PI*2); ctx.fillStyle=&#x27;#5a2838&#x27;; ctx.fill();

  ctx.fillStyle=&#x27;rgba(20,10,26,.6)&#x27;;
  var off = (worldX*0.25)%160;
  for (var c=-1;c&lt;W/160+2;c++){
    var bx = c*160 - off;
    ctx.fillRect(bx, H-GROUND_H-90, 60, 90);
    for(var m=0;m&lt;4;m++) ctx.fillRect(bx+m*15, H-GROUND_H-102, 9, 14);
    ctx.fillRect(bx+70, H-GROUND_H-120, 30, 120);
    ctx.beginPath();
    ctx.moveTo(bx+66,H-GROUND_H-120); ctx.lineTo(bx+85,H-GROUND_H-142); ctx.lineTo(bx+104,H-GROUND_H-120);
    ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle=&#x27;#3a3038&#x27;; ctx.fillRect(-10,H-GROUND_H,W+20,GROUND_H+10);
  ctx.fillStyle=&#x27;#4a3f48&#x27;; ctx.fillRect(-10,H-GROUND_H,W+20,6);
  ctx.strokeStyle=&#x27;rgba(0,0,0,.35)&#x27;; ctx.lineWidth=2;
  for (var st=0; st&lt;W/38+2; st++){
    var stx = (st*38 - worldX%38);
    ctx.beginPath(); ctx.moveTo(stx,H-GROUND_H+6); ctx.lineTo(stx,H); ctx.stroke();
  }

  for (var i=0;i&lt;obstacles.length;i++){
    var o=obstacles[i], t=o.type;
    ctx.save();
    ctx.globalAlpha = o.dead ? Math.max(0,o.deadT/18) : 1;
    drawEnemy(o,t);
    ctx.restore();
  }

  for (var j=0;j&lt;items.length;j++){
    var it=items[j];
    var pulse = 1+Math.sin(elapsed/8)*0.15;
    ctx.save();
    ctx.translate(it.x,it.y); ctx.scale(pulse,pulse);
    ctx.font=(it.kind===&#x27;princess&#x27;?&#x27;28px&#x27;:&#x27;24px&#x27;)+&#x27; serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(it.kind===&#x27;shield&#x27;?&#x27;✦&#x27;:(it.kind===&#x27;fire&#x27;?&#x27;🔥&#x27;:&#x27;👑&#x27;),0,0);
    ctx.restore();
  }

  for (var f=0;f&lt;fireballs.length;f++){
    var fb=fireballs[f];
    var rg=ctx.createRadialGradient(fb.x,fb.y,2,fb.x,fb.y,fb.r);
    rg.addColorStop(0,&#x27;#fff&#x27;); rg.addColorStop(0.4,&#x27;#ffd76b&#x27;); rg.addColorStop(1,&#x27;#ff4a1c&#x27;);
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(fb.x,fb.y,fb.r,0,Math.PI*2); ctx.fill();
  }

  // fleeing princesses
  for (var fl=0;fl&lt;fleeing.length;fl++){
    var fp=fleeing[fl];
    ctx.save(); ctx.globalAlpha=Math.max(0,fp.life/60);
    ctx.font=&#x27;26px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(&#x27;👑&#x27;,fp.x,fp.y);
    ctx.restore();
  }

  for (var pp=0;pp&lt;particles.length;pp++){
    var pt=particles[pp];
    ctx.globalAlpha=Math.max(0,pt.life/20);
    ctx.fillStyle=pt.c;
    ctx.fillRect(pt.x,pt.y,3,3);
  }
  ctx.globalAlpha=1;

  drawKnight();

  ctx.restore();
}

function drawEnemy(o,t){
  var x=o.x, y=o.y, w=o.w, h=o.h;
  if (t.key===&#x27;dragon&#x27;){
    ctx.fillStyle=&#x27;#3a7a3a&#x27;;
    ctx.beginPath(); ctx.ellipse(x+w*0.45,y+h*0.55,w*0.4,h*0.3,0,0,Math.PI*2); ctx.fill();
    var flap=Math.sin(elapsed/5)*14;
    ctx.fillStyle=&#x27;#2a5a2a&#x27;;
    ctx.beginPath(); ctx.moveTo(x+w*0.4,y+h*0.4); ctx.lineTo(x+w*0.1,y-flap); ctx.lineTo(x+w*0.55,y+h*0.35); ctx.closePath(); ctx.fill();
