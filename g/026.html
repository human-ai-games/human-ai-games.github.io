<!doctype html>
<html lang="en">
<head>

<title>🕊️ Sky Bird Shooter</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }

    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🕊️ Sky Bird Shooter</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(180deg, #4a90d9 0%, #87ceeb 100%); color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: linear-gradient(180deg, #cfeafd 0%, #eaf6ff 100%); height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; color: #1a3a6b; text-shadow: 0 1px 0 #fff; }
  .instructions { font-size: 16px; color: #33507a; max-width: 600px; margin: 0; line-height: 1.4; }
  .score { font-size: 22px; color: #1a3a6b; margin: 0; font-weight: 600; }
  .score span { color: #e74c3c; }
  .board { position: relative; width: 620px; height: 440px; flex-shrink: 0; margin: 0; background: linear-gradient(180deg, #6cb6f0 0%, #a8d8f8 55%, #d6f0ff 100%); border-radius: 14px; box-shadow: inset 0 0 30px rgba(0,0,0,0.08), 0 6px 20px rgba(0,0,0,0.15); overflow: hidden; cursor: crosshair; }
  .cloud { position: absolute; background: #fff; border-radius: 50px; opacity: 0.85; filter: blur(0.5px); }
  .bird { position: absolute; width: 68px; height: 68px; cursor: crosshair; display: flex; align-items: center; justify-content: center; font-size: 46px; transition: transform 0.08s ease; animation: pop-in 0.18s ease; filter: brightness(0.35) saturate(2) hue-rotate(200deg); }
  .bird:hover { transform: scale(1.12); }
  @keyframes pop-in { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bird.hit { animation: pop-out 0.16s ease forwards; }
  @keyframes pop-out { to { transform: scale(1.6) rotate(20deg); opacity: 0; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🕊️ Sky Bird Shooter&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the navy birds to shoot them and score a point. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;

  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 440, BIRD_SIZE = 68;
  var SPAWN_MS = 900, BIRD_LIFE_MS = 1200;
  var score = 0;
  var intervalId = null;
  var birdTimeouts = [];
  var running = false;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var BIRDS = [&#x27;🐦&#x27;,&#x27;🕊️&#x27;,&#x27;🦅&#x27;,&#x27;🐤&#x27;];

  // ---- Audio (Web Audio API, procedural) ----
  var audioCtx = null;
  var bgGain = null;
  var bgNodes = [];

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) {
      try { audioCtx.resume(); } catch (_) {}
    }
  }

  // Laser-style shoot zap when a bird is clicked.
  function playShoot() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = &#x27;sawtooth&#x27;;
    osc.frequency.setValueAtTime(900, t);
    osc.frequency.exponentialRampToValueAtTime(120, t + 0.18);
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.22);
  }

  // Soft looping background hum while playing.
  function startBackground() {
    if (!audioCtx || bgNodes.length) return;
    bgGain = audioCtx.createGain();
    bgGain.gain.value = 0.04;
    bgGain.connect(audioCtx.destination);
    var freqs = [110, 165];
    for (var i = 0; i &lt; freqs.length; i++) {
      var o = audioCtx.createOscillator();
      o.type = &#x27;sine&#x27;;
      o.frequency.value = freqs[i];
      var lfo = audioCtx.createOscillator();
      var lfoGain = audioCtx.createGain();
      lfo.frequency.value = 0.15 + i * 0.07;
      lfoGain.gain.value = 6;
      lfo.connect(lfoGain);
      lfoGain.connect(o.frequency);
      o.connect(bgGain);
      o.start();
      lfo.start();
      bgNodes.push(o, lfo);
    }
  }

  function stopBackground() {
    for (var i = 0; i &lt; bgNodes.length; i++) {
      try { bgNodes[i].stop(); } catch (_) {}
    }
    bgNodes = [];
    if (bgGain) { try { bgGain.disconnect(); } catch (_) {} bgGain = null; }
  }
  // -------------------------------------------

  function clearAllBirds() {
    for (var i = 0; i &lt; birdTimeouts.length; i++) clearTimeout(birdTimeouts[i]);
    birdTimeouts = [];
    var birds = board.querySelectorAll(&#x27;.bird&#x27;);
    for (var j = 0; j &lt; birds.length; j++) board.removeChild(birds[j]);
  }

  function spawnBird() {
    var bird = document.createElement(&#x27;div&#x27;);
    bird.className = &#x27;bird&#x27;;
    bird.style.left = Math.random() * (BOARD_W - BIRD_SIZE) + &#x27;px&#x27;;
    bird.style.top = Math.random() * (BOARD_H - BIRD_SIZE) + &#x27;px&#x27;;
    bird.textContent = BIRDS[Math.floor(Math.random() * BIRDS.length)];
    var hit = false;
    bird.addEventListener(&#x27;click&#x27;, function () {
      if (hit) return;
      hit = true;
      ensureAudio();
      playShoot();
      score += 1;
      scoreEl.textContent = score;
      bird.classList.add(&#x27;hit&#x27;);
      setTimeout(function () {
        if (bird.parentNode === board) board.removeChild(bird);
      }, 160);
    });
    board.appendChild(bird);
    birdTimeouts.push(setTimeout(function () {
      if (bird.parentNode === board) board.removeChild(bird);
    }, BIRD_LIFE_MS));
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    ensureAudio();
    startBackground();
    if (intervalId) clearInterval(intervalId);
    clearAllBirds();
    spawnBird();
    intervalId = setInterval(spawnBird, SPAWN_MS);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllBirds();
    stopBackground();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
