<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>⚾ Night Slugger</b> &middot; Game 173 &middot; Professional producer &middot; Basic game: Paddle and ball</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a14; color: #eee; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #ffd54a; text-shadow: 0 0 8px rgba(255,213,74,.5); }
  .instructions { font-size: 16px; color: #aab; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 18px; color: #ddd; margin: 0; }
  .score b { color: #4ade80; }
  .field { position: relative; width: 620px; height: 440px; flex-shrink: 0; margin: 0;
    background: radial-gradient(circle at 50% 20%, #1c2340 0%, #0a0c1a 70%);
    border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,.7); }
  canvas { display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;⚾ Night Slugger&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the bat with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and hit the ball into the falling bricks — hitting the ball at the bat&#x27;s center gives the strongest shot. Clear every brick before the wall reaches your bat! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt; &amp;nbsp; Bricks: &lt;b id=&quot;bricks&quot;&gt;0&lt;/b&gt; &amp;nbsp; Danger: &lt;b id=&quot;danger&quot;&gt;Safe&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), bricksEl = document.getElementById(&#x27;bricks&#x27;), dangerEl = document.getElementById(&#x27;danger&#x27;);

  var BAT_W = 110, BAT_H = 16, BAT_BOTTOM = 16, BAT_SPEED = 7;
  var BALL_R = 9;
  var BASE_SPEED = 3.4;    // ball vertical speed baseline
  var WALL_FALL = 0.16;    // px per frame the whole wall drops

  var running = false, gameOver = false, animId = null, keysDown = {};
  var batX, ballX, ballY, ballVX, ballVY, score;
  var bricks = [], particles = [], flashes = [];
  var wallOffset = 0;      // how far the wall has descended
  var swing = 0, homerText = 0;
  var brickBaseTop = 40, brickBaseBottom = 0;

  // brick color -&gt; points (rarest/top = highest)
  var BRICK_TYPES = [
    {color:&#x27;#5eff8f&#x27;, pts:10},  // green - top row, worth most
    {color:&#x27;#ffe14a&#x27;, pts:8},
    {color:&#x27;#ffb14a&#x27;, pts:5},
    {color:&#x27;#ff5e5e&#x27;, pts:3}    // red - bottom row, worth least
  ];

  // ---- audio ----
  var actx = null;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ actx=null; } } }
  function beep(freq, dur, type, vol){
    if(!actx) return;
    try{
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      g.gain.value=vol||0.15; o.connect(g); g.connect(actx.destination);
      var t=actx.currentTime;
      g.gain.setValueAtTime(vol||0.15,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur);
    }catch(_){}
  }
  function crack(power){
    if(!actx) return;
    try{
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=&#x27;square&#x27;;
      var f0 = 500 + power*600;
      o.frequency.setValueAtTime(f0,actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(110,actx.currentTime+0.12);
      g.gain.setValueAtTime(0.15+power*0.18,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.15);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+0.15);
    }catch(_){}
  }

  function buildBricks(){
    bricks = [];
    var cols = 10, rows = 4, pad = 6, side = 20;
    var bw = (FIELD_W - side*2 - pad*(cols-1)) / cols;
    var bh = 22;
    for(var r=0;r&lt;rows;r++){
      for(var c=0;c&lt;cols;c++){
        var type = BRICK_TYPES[r];
        bricks.push({
          bx: side + c*(bw+pad),
          by: brickBaseTop + r*(bh+pad),
          w: bw, h: bh,
          color: type.color, pts: type.pts,
          alive: true
        });
      }
    }
    // lowest brick bottom used for game-over check
    brickBaseBottom = brickBaseTop + (rows-1)*(bh+pad) + bh;
  }

  function resetBall(){
    ballX = FIELD_W/2;
    ballY = FIELD_H - 120;
    ballVX = (Math.random()&lt;0.5?-1:1)*2.4;
    ballVY = -BASE_SPEED;
  }

  function spawnParticles(x,y,color,n){
    for(var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, sp = 1+Math.random()*4;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
    }
  }
  function spawnFlash(x,y,color){ flashes.push({x:x,y:y,r:4,color:color,life:1}); }

  function batTop(){ return FIELD_H - BAT_BOTTOM - BAT_H; }
  function brickY(b){ return b.by + wallOffset; }

  function tick(){
    if(!running) return;
    if(keysDown[&#x27;ArrowLeft&#x27;]) batX -= BAT_SPEED;
    if(keysDown[&#x27;ArrowRight&#x27;]) batX += BAT_SPEED;
    batX = Math.max(0, Math.min(FIELD_W - BAT_W, batX));
    if(swing&gt;0) swing -= 0.06;
    if(homerText&gt;0) homerText -= 0.02;

    // wall descends
    wallOffset += WALL_FALL;

    ballX += ballVX; ballY += ballVY;

    // walls
    if(ballX - BALL_R &lt;= 0){ ballX=BALL_R; ballVX=-ballVX; wallHit(ballX,ballY); }
    if(ballX + BALL_R &gt;= FIELD_W){ ballX=FIELD_W-BALL_R; ballVX=-ballVX; wallHit(ballX,ballY); }
    if(ballY - BALL_R &lt;= 0){ ballY=BALL_R; ballVY=-ballVY; wallHit(ballX,ballY); }

    // bat: impact varies with contact point
    var bt = batTop();
    if(ballVY&gt;0 &amp;&amp; ballY+BALL_R&gt;=bt &amp;&amp; ballY+BALL_R&lt;=bt+BAT_H+8 &amp;&amp;
       ballX+BALL_R&gt;=batX &amp;&amp; ballX-BALL_R&lt;=batX+BAT_W){
      var rel = (ballX - (batX+BAT_W/2))/(BAT_W/2); // -1 edge .. 0 center .. 1 edge
      rel = Math.max(-1, Math.min(1, rel));
      var centerness = 1 - Math.abs(rel);           // 1 at center, 0 at edge
      // center = max power (fast, straight up); edge = weak, sharp angle
      var speed = BASE_SPEED * (0.9 + centerness*1.4); // ~0.9x..2.3x
      ballVY = -speed;
      ballVX = rel * (BASE_SPEED * 1.6);
      ballY = bt - BALL_R;

      score += 1; scoreEl.textContent = score;
      swing = 0.6 + centerness*0.6;
      crack(centerness);

      if(centerness &gt; 0.75){
        // solid center smash
        homerText = 1;
        spawnFlash(ballX, bt, &#x27;#ffffff&#x27;);
        spawnFlash(ballX, bt, &#x27;#ffd54a&#x27;);
        spawnParticles(ballX, bt, &#x27;#ffd54a&#x27;, 26);
        spawnParticles(ballX, bt, &#x27;#ff884a&#x27;, 12);
      } else {
        spawnFlash(ballX, bt, &#x27;#ffd54a&#x27;);
        spawnParticles(ballX, bt, &#x27;#ffd54a&#x27;, 8+Math.round(centerness*10));
      }
    }

    // bricks
    for(var i=0;i&lt;bricks.length;i++){
      var b=bricks[i];
      if(!b.alive) continue;
      var by = brickY(b);
      if(ballX+BALL_R&gt;b.bx &amp;&amp; ballX-BALL_R&lt;b.bx+b.w &amp;&amp;
         ballY+BALL_R&gt;by &amp;&amp; ballY-BALL_R&lt;by+b.h){
        b.alive=false;
        var overlapX = Math.min(ballX+BALL_R-b.bx, b.bx+b.w-(ballX-BALL_R));
        var overlapY = Math.min(ballY+BALL_R-by, by+b.h-(ballY-BALL_R));
        if(overlapX&lt;overlapY) ballVX=-ballVX; else ballVY=-ballVY;
        score += b.pts; scoreEl.textContent = score;
        spawnFlash(b.bx+b.w/2, by+b.h/2, b.color);
        spawnParticles(b.bx+b.w/2, by+b.h/2, b.color, 20);
        beep(500+b.pts*40,0.1,&#x27;square&#x27;,0.18);
        updateBrickCount();
        if(bricks.every(function(x){return !x.alive;})) { winRound(); }
        break;
      }
    }

    if(ballY - BALL_R &gt; FIELD_H) resetBall();

    // game over: lowest living brick reaches the bat line
    var bt2 = batTop();
    var lowest = 0;
    for(var m=0;m&lt;bricks.length;m++){
      if(bricks[m].alive){
        var yb = brickY(bricks[m]) + bricks[m].h;
        if(yb&gt;lowest) lowest = yb;
      }
    }
    updateDanger(lowest, bt2);
    if(lowest &gt;= bt2){ endGame(); return; }

    updateEffects();
    draw();
    animId = requestAnimationFrame(tick);
  }

  function updateDanger(lowest, bt){
    var margin = bt - lowest;
    if(margin &gt; 200){ dangerEl.textContent=&#x27;Safe&#x27;; dangerEl.style.color=&#x27;#4ade80&#x27;; }
    else if(margin &gt; 90){ dangerEl.textContent=&#x27;Watch out&#x27;; dangerEl.style.color=&#x27;#ffe14a&#x27;; }
    else { dangerEl.textContent=&#x27;DANGER!&#x27;; dangerEl.style.color=&#x27;#ff5e5e&#x27;; }
  }

  function winRound(){
    // cleared the wall — bonus, faster new wall
    score += 50; scoreEl.textContent = score;
    homerText = 1;
    wallOffset = 0;
    WALL_FALL += 0.06;
    buildBricks(); updateBrickCount();
    beep(880,0.15,&#x27;triangle&#x27;,0.2); beep(1100,0.15,&#x27;triangle&#x27;,0.15);
  }

  function wallHit(x,y){
    spawnFlash(x,y,&#x27;#88bbff&#x27;);
    spawnParticles(x,y,&#x27;#88bbff&#x27;,8);
    beep(330,0.06,&#x27;sine&#x27;,0.1);
  }

  function updateEffects(){
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.03;
      if(p.life&lt;=0) particles.splice(i,1);
    }
    for(var j=flashes.length-1;j&gt;=0;j--){
      var f=flashes[j];
      f.r+=3; f.life-=0.08;
      if(f.life&lt;=0) flashes.splice(j,1);
    }
  }

  function updateBrickCount(){
    bricksEl.textContent = bricks.filter(function(b){return b.alive;}).length;
  }

  function drawBat(){
    var bt = batTop();
    var cx = batX + BAT_W/2, cy = bt + BAT_H/2;
    ctx.save();
    ctx.translate(cx, cy);
    var lift = -14*swing;
    var rot = -swing*0.35*(ballVX&gt;=0?1:-1);
    ctx.translate(0, lift);
    ctx.rotate(rot);
    var w=BAT_W, h=BAT_H;
    var grad = ctx.createLinearGradient(0,-h/2,0,h/2);
    grad.addColorStop(0,&#x27;#e0a95a&#x27;); grad.addColorStop(0.5,&#x27;#c9924a&#x27;); grad.addColorStop(1,&#x27;#8a5a26&#x27;);
    ctx.fillStyle = grad;
    if(swing&gt;0){ ctx.shadowColor=&#x27;#ffd54a&#x27;; ctx.shadowBlur=24*swing; }
    var r=h/2;
    ctx.beginPath();
    ctx.moveTo(-w/2+r, -h/2);
    ctx.lineTo(w/2-r, -h/2);
    ctx.arcTo(w/2,-h/2,w/2,0,r);
    ctx.arcTo(w/2,h/2,w/2-r,h/2,r);
    ctx.lineTo(-w/2+r,h/2);
    ctx.arcTo(-w/2,h/2,-w/2,0,r);
    ctx.arcTo(-w/2,-h/2,-w/2+r,-h/2,r);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(255,255,255,.22)&#x27;;
    ctx.fillRect(-w/2+r, -h/2+2, w-2*r, h*0.28);
    // sweet-spot marker in the center
    ctx.fillStyle=&#x27;rgba(255,255,255,.5)&#x27;;
    ctx.fillRect(-3, -h/2+2, 6, h-4);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    ctx.strokeStyle=&#x27;rgba(255,255,255,.04)&#x27;; ctx.lineWidth=1;
    for(var g=0;g&lt;FIELD_W;g+=40){ ctx.beginPath(); ctx.moveTo(g,0); ctx.lineTo(g,FIELD_H); ctx.stroke(); }

    // bricks (drawn at descended position)
    for(var i=0;i&lt;bricks.length;i++){
      var b=bricks[i]; if(!b.alive) continue;
      var by=brickY(b);
      ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=8;
      roundRect(b.bx,by,b.w,b.h,4); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;rgba(255,255,255,.25)&#x27;;
      roundRect(b.bx,by,b.w,b.h*0.4,4); ctx.fill();
      // point value
      ctx.fillStyle=&#x27;rgba(0,0,0,.5)&#x27;; ctx.font=&#x27;bold 11px system-ui&#x27;;
      ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(b.pts, b.bx+b.w/2, by+b.h/2+1);
      ctx.textBaseline=&#x27;alphabetic&#x27;;
    }

    for(var p2 of particles){
      ctx.globalAlpha=Math.max(0,p2.life);
      ctx.fillStyle=p2.color;
      ctx.beginPath(); ctx.arc(p2.x,p2.y,3,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    for(var f of flashes){
      ctx.globalAlpha=Math.max(0,f.life);
      ctx.strokeStyle=f.color; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1;

    // ball
    ctx.shadowColor=&#x27;#fff&#x27;; ctx.shadowBlur=14;
    ctx.fillStyle=&#x27;#ffffff&#x27;;
    ctx.beginPath(); ctx.arc(ballX,ballY,BALL_R,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=&#x27;#e33&#x27;; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(ballX-3,ballY,BALL_R,-0.6,0.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(ballX+3,ballY,BALL_R,Math.PI-0.6,Math.PI+0.6); ctx.stroke();

    drawBat();

    if(homerText&gt;0){
      ctx.save();
      ctx.globalAlpha=Math.min(1,homerText*1.5);
      ctx.font=&#x27;bold 34px system-ui, sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillStyle=&#x27;#ffd54a&#x27;; ctx.shadowColor=&#x27;#ff884a&#x27;; ctx.shadowBlur=20;
      ctx.fillText(&#x27;HOME RUN!&#x27;, FIELD_W/2, FIELD_H/2);
      ctx.restore();
    }

    if(gameOver){
      ctx.save();
      ctx.fillStyle=&#x27;rgba(0,0,0,.6)&#x27;; ctx.fillRect(0,0,FIELD_W,FIELD_H);
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillStyle=&#x27;#ff5e5e&#x27;; ctx.font=&#x27;bold 40px system-ui&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, FIELD_W/2, FIELD_H/2-10);
      ctx.fillStyle=&#x27;#eee&#x27;; ctx.font=&#x27;20px system-ui&#x27;;
      ctx.fillText(&#x27;Final score: &#x27;+score, FIELD_W/2, FIELD_H/2+28);
      ctx.fillStyle=&#x27;#aab&#x27;; ctx.font=&#x27;16px system-ui&#x27;;
      ctx.fillText(&#x27;Press Restart below to play again&#x27;, FIELD_W/2, FIELD_H/2+58);
      ctx.restore();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function endGame(){
    running=false; gameOver=true;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    beep(160,0.4,&#x27;sawtooth&#x27;,0.2);
    draw();
  }

  function startGame(){
    if(running) return;
    ensureAudio();
    gameOver=false;
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    batX=(FIELD_W-BAT_W)/2;
    for(var k in keysDown) keysDown[k]=false;
    particles=[]; flashes=[]; swing=0; homerText=0;
    wallOffset=0; WALL_FALL=0.16;
    buildBricks(); updateBrickCount();
    resetBall();
    draw();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  batX=(FIELD_W-BAT_W)/2; buildBricks(); updateBrickCount(); resetBall(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
