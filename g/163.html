&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 52, SHIP_H = 54, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 6, BULLET_H = 18, BULLET_SPEED = 8;
  var TARGET_SIZE = 40, TARGET_SPEED = 1.9;
  var BOSS_W = 74, BOSS_H = 58, BOSS_SPEED = 1.4;
  var PU_SIZE = 30, PU_SPEED = 1.5, PU_DURATION = 10000;
  var SPAWN_INTERVAL = 1100;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], bosses = [], powerups = [];
  var score = 0, lastShot = 0, spawnCount = 0;
  var weapon = &#x27;basic&#x27;, weaponUntil = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var weaponEl = document.getElementById(&#x27;weapon&#x27;);

  var WEAPON_INFO = {
    basic:   { label: &#x27;BEAM RIFLE&#x27;, color: &#x27;#7fd4ff&#x27; },
    scatter: { label: &#x27;SCATTER SHOT&#x27;, color: &#x27;#3ddc6a&#x27; },
    beam:    { label: &#x27;LASER BEAM&#x27;, color: &#x27;#33e0ff&#x27; },
    rocket:  { label: &#x27;ROCKETS&#x27;, color: &#x27;#ff8a3d&#x27; }
  };
  function updateWeaponHud() {
    var info = WEAPON_INFO[weapon];
    weaponEl.innerHTML = &#x27;WEAPON: &lt;span style=&quot;color:&#x27;+info.color+&#x27;&quot;&gt;&#x27;+info.label+&#x27;&lt;/span&gt;&#x27;;
  }

  /* ---------- Starfield ---------- */
  var starCanvas = document.getElementById(&#x27;stars&#x27;);
  var sctx = starCanvas.getContext(&#x27;2d&#x27;);
  var stars = [];
  for (var s = 0; s &lt; 90; s++) {
    stars.push({ x: Math.random()*FIELD_W, y: Math.random()*FIELD_H, r: Math.random()*1.6+0.3, sp: Math.random()*1.5+0.4 });
  }
  function drawStars() {
    sctx.clearRect(0,0,FIELD_W,FIELD_H);
    for (var i=0;i&lt;stars.length;i++){
      var st=stars[i];
      st.y += st.sp;
      if (st.y &gt; FIELD_H) { st.y = 0; st.x = Math.random()*FIELD_W; }
      sctx.globalAlpha = 0.5 + Math.random()*0.5;
      sctx.fillStyle = &#x27;#cfe0ff&#x27;;
      sctx.beginPath(); sctx.arc(st.x, st.y, st.r, 0, 6.28); sctx.fill();
    }
    sctx.globalAlpha = 1;
  }

  /* ---------- Audio: epic soundtrack ---------- */
  var actx = null, musicTimer = null, musicStep = 0;
  var bassSeq  = [55, 55, 65.4, 65.4, 49, 49, 73.4, 73.4, 55, 55, 82.4, 82.4, 98, 98, 73.4, 65.4];
  var leadSeq  = [440, 523, 659, 587, 392, 523, 587, 494, 440, 659, 784, 659, 587, 523, 494, 440];
  var chordSeq = [
    [220,262,330],[220,262,330],[262,330,392],[262,330,392],
    [196,247,294],[196,247,294],[294,349,440],[294,349,440],
    [220,262,330],[220,262,330],[330,392,494],[330,392,494],
    [392,494,587],[392,494,587],[294,349,440],[262,330,392]
  ];
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ actx=null; } }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
  }
  function playTone(freq, dur, type, vol, when) {
    if (!actx) return;
    var t = when || actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.05);
  }
  function musicTick() {
    if (!actx) return;
    var i = musicStep % 16;
    var t = actx.currentTime;
    playTone(bassSeq[i], 0.16, &#x27;sawtooth&#x27;, 0.18, t);
    playTone(bassSeq[i], 0.12, &#x27;sawtooth&#x27;, 0.12, t+0.13);
    playTone(bassSeq[i]*0.5, 0.26, &#x27;sine&#x27;, 0.14, t);
    var ch = chordSeq[i];
    for (var c=0;c&lt;ch.length;c++) playTone(ch[c], 0.30, &#x27;triangle&#x27;, 0.05, t);
    playTone(leadSeq[i], 0.22, &#x27;square&#x27;, 0.07, t);
    playTone(leadSeq[i]*2, 0.20, &#x27;sine&#x27;, 0.03, t);
    if (i % 4 === 0) {
      var o=actx.createOscillator(),g=actx.createGain();
      o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(50,t+0.12);
      g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.14);
    }
    if (i % 2 === 1) playTone(1400, 0.04, &#x27;triangle&#x27;, 0.035, t);
    musicStep++;
  }
  function startMusic() {
    if (!actx) return;
    musicStep = 0;
    if (musicTimer) clearInterval(musicTimer);
    musicTick();
    musicTimer = setInterval(musicTick, 200);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
  function laserSound() {
    if (!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(300,t+0.15);
    g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.16);
  }
  function explosionSound() {
    if (!actx) return;
    var t = actx.currentTime;
    var bufSize = actx.sampleRate*0.3;
    var buf = actx.createBuffer(1, bufSize, actx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i=0;i&lt;bufSize;i++){ data[i] = (Math.random()*2-1)*(1-i/bufSize); }
    var noise = actx.createBufferSource(); noise.buffer = buf;
    var g = actx.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    var f = actx.createBiquadFilter(); f.type=&#x27;lowpass&#x27;; f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(200,t+0.3);
    noise.connect(f); f.connect(g); g.connect(actx.destination); noise.start(t); noise.stop(t+0.3);
  }
  function clankSound() {
    if (!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type=&#x27;square&#x27;; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(140,t+0.1);
    g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.11);
  }
  function powerupSound() {
    if (!actx) return;
    var t = actx.currentTime;
    [523,659,784,1047].forEach(function(f,idx){ playTone(f, 0.12, &#x27;square&#x27;, 0.08, t+idx*0.06); });
  }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;svg&#x27;);
    el.setAttribute(&#x27;class&#x27;,&#x27;alien&#x27;);
    el.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 40 40&#x27;);
    el.innerHTML = &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;24&quot; rx=&quot;18&quot; ry=&quot;7&quot; fill=&quot;#7a33cc&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;22&quot; rx=&quot;18&quot; ry=&quot;6&quot; fill=&quot;#b04aff&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M9 20 Q20 4 31 20 Z&quot; fill=&quot;#4de0c0&quot;/&gt;&#x27;+

      &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;16&quot; r=&quot;2&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;18&quot; r=&quot;2&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;8&quot; cy=&quot;27&quot; r=&quot;2&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;29&quot; r=&quot;2&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;32&quot; cy=&quot;27&quot; r=&quot;2&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBoss() {
    var b = {
      x: Math.random() * (FIELD_W - BOSS_W),
      y: 40 + Math.random()*80,
      dir: Math.random() &lt; 0.5 ? -1 : 1,

    var el = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;svg&#x27;);

    el.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 74 58&#x27;);
    el.innerHTML = &#x27;&lt;ellipse cx=&quot;37&quot; cy=&quot;40&quot; rx=&quot;35&quot; ry=&quot;13&quot; fill=&quot;#8a1030&quot;/&gt;&#x27;+
      &#x27;&lt;ellipse cx=&quot;37&quot; cy=&quot;36&quot; rx=&quot;35&quot; ry=&quot;12&quot; fill=&quot;#ff4a6a&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M12 34 Q37 6 62 34 Z&quot; fill=&quot;#ffb3c2&quot;/&gt;&#x27;+
      &#x27;&lt;path d=&quot;M18 30 Q37 14 56 30 Z&quot; fill=&quot;#4de0c0&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;25&quot; cy=&quot;26&quot; r=&quot;3&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;37&quot; cy=&quot;22&quot; r=&quot;3.5&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;49&quot; cy=&quot;26&quot; r=&quot;3&quot; fill=&quot;#fff&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;6&quot; y=&quot;38&quot; width=&quot;6&quot; height=&quot;6&quot; rx=&quot;2&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;rect x=&quot;62&quot; y=&quot;38&quot; width=&quot;6&quot; height=&quot;6&quot; rx=&quot;2&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;15&quot; cy=&quot;42&quot; r=&quot;2.5&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;45&quot; r=&quot;2.5&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;44&quot; cy=&quot;45&quot; r=&quot;2.5&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;+
      &#x27;&lt;circle cx=&quot;59&quot; cy=&quot;42&quot; r=&quot;2.5&quot; fill=&quot;#ffd166&quot;/&gt;&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bosses.push(b);
  }

  function spawnPowerup(x, y) {
    var types = [&#x27;scatter&#x27;,&#x27;beam&#x27;,&#x27;rocket&#x27;];
    var type = types[Math.floor(Math.random()*types.length)];
    var letter = { scatter:&#x27;S&#x27;, beam:&#x27;L&#x27;, rocket:&#x27;R&#x27; }[type];
    var p = { x: x, y: y, type: type, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup pu-&#x27;+type;
    el.textContent = letter;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    p.el = el;
    powerups.push(p);
  }

  function spawnWave() {
    spawnCount++;
    if (spawnCount % 5 === 0) spawnBoss();
    else spawnTarget();

  function makeBullet(x, y, vx, kind) {
    var b = { x: x, y: y, vx: vx || 0, kind: kind, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27; + (kind !== &#x27;basic&#x27; &amp;&amp; kind !== &#x27;scatter&#x27; ? &#x27; &#x27; + kind : &#x27;&#x27;);
    if (kind === &#x27;beam&#x27;) el.style.height = &#x27;48px&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    b.h = (kind === &#x27;beam&#x27;) ? 48 : BULLET_H;
    b.speed = (kind === &#x27;beam&#x27;) ? BULLET_SPEED*0.55 : BULLET_SPEED;
    bullets.push(b);

  function spawnBullet() {
    var now = Date.now();
    var cooldown = (weapon === &#x27;rocket&#x27;) ? 320 : 220;
    if (now - lastShot &lt; cooldown) return;
    lastShot = now;
    var cx = shipX + SHIP_W / 2 - BULLET_W / 2;
    var cy = FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H;
    if (weapon === &#x27;scatter&#x27;) {
      makeBullet(cx, cy, 0, &#x27;scatter&#x27;);
      makeBullet(cx, cy, -3, &#x27;scatter&#x27;);
      makeBullet(cx, cy, 3, &#x27;scatter&#x27;);

      makeBullet(cx, cy - 30, 0, &#x27;beam&#x27;);

  function hitEffect(x, y, big) {

        field.removeChild(t.el); targets.splice(j,1);

    for (var k = bosses.length - 1; k &gt;= 0; k--) {
      var bs = bosses[k];
      var bcx = bs.x + BOSS_W/2, bcy = bs.y + BOSS_H/2;
      if (Math.abs(bcx - bx) &lt; RAD &amp;&amp; Math.abs(bcy - by) &lt; RAD) {
        bs.hp -= 2;
        if (bs.hp &lt;= 0) {
          hitEffect(bs.x + BOSS_W/2 - 40, bs.y + BOSS_H/2 - 40, true);
          maybeDrop(bs.x + BOSS_W/2 - PU_SIZE/2, bs.y + BOSS_H/2, true);
          field.removeChild(bs.el); bosses.splice(k,1);
          score += 3;
        }

    scoreEl.textContent = score;

  function maybeDrop(x, y, isBoss) {
    var chance = isBoss ? 0.7 : 0.18;
    if (Math.random() &lt; chance) spawnPowerup(x, y);

  function tick() {

    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));

      b.el.style.left = b.x + &#x27;px&#x27;;

          break;
        }
      }
      if (consumed) continue;
      // vs bosses
      for (var k2 = bosses.length - 1; k2 &gt;= 0; k2--) {
        var bs2 = bosses[k2];
        if (b2.x &lt; bs2.x + BOSS_W &amp;&amp; b2.x + bw &gt; bs2.x &amp;&amp;
            b2.y &lt; bs2.y + BOSS_H &amp;&amp; b2.y + b2.h &gt; bs2.y) {
          if (b2.kind === &#x27;rocket&#x27;) {
            field.removeChild(b2.el); bullets.splice(i2, 1);
            rocketExplode(b2.x + bw/2, b2.y);
            break;
          }
          var dmg = (b2.kind === &#x27;beam&#x27;) ? 1 : 1;
          bs2.hp -= dmg;
          if (bs2.hp &lt;= 0) {
            hitEffect(bs2.x + BOSS_W/2 - 40, bs2.y + BOSS_H/2 - 40, true);
            explosionSound();
            maybeDrop(bs2.x + BOSS_W/2 - PU_SIZE/2, bs2.y + BOSS_H/2, true);
            field.removeChild(bs2.el); bosses.splice(k2, 1);
            score += 3; scoreEl.textContent = score;
          } else {
            hitEffect(b2.x - 10, b2.y - 10, false);
            clankSound();
            bs2.el.classList.add(&#x27;hurt&#x27;);
            (function(el){ setTimeout(function(){ if(el) el.classList.remove(&#x27;hurt&#x27;); }, 120); })(bs2.el);
          }
          if (b2.kind !== &#x27;beam&#x27;) { field.removeChild(b2.el); bullets.splice(i2, 1); }
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    bosses.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    powerups.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    bullets = []; targets = []; bosses = []; powerups = [];
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    clearAll();
    score = 0; spawnCount = 0;
    weapon = &#x27;basic&#x27;; weaponUntil = 0;
    updateWeaponHud();
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    startMusic();
    animId = requestAnimationFrame(tick);
    spawnWave();
    spawnId = setInterval(spawnWave, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    stopMusic();
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);

<script>

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;

  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
