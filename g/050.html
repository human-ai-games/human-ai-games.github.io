&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 350, T_SIZE = 64;
  var GAME_SECONDS = 60;
  var score = 0, timeLeft = GAME_SECONDS;
  var running = false;
  var spawnId = null, rafId = null, timerId = null;
  var targets = [];
  var highScores = [];
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreNum = document.getElementById(&#x27;scoreNum&#x27;);
  var timeNum = document.getElementById(&#x27;timeNum&#x27;);
  var barfill = document.getElementById(&#x27;barfill&#x27;);
  var sight = document.getElementById(&#x27;sight&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var bannerTitle = document.getElementById(&#x27;bannerTitle&#x27;);
  var bannerText = document.getElementById(&#x27;bannerText&#x27;);
  var recEls = document.getElementById(&#x27;records&#x27;).children;

  // Each positive value has its own color, ramping yellow -&gt; green.
  var POS = [
    { v: 1,  c: &#x27;#ffe600&#x27; },   // yellow
    { v: 5,  c: &#x27;#ff9800&#x27; },   // orange
    { v: 10, c: &#x27;#c7e02a&#x27; },   // lime
    { v: 20, c: &#x27;#3ba55c&#x27; }    // green
  ];
  var NEG = [
    { v: -1,  c: &#x27;#ff8a80&#x27; },
    { v: -5,  c: &#x27;#ff5252&#x27; },
    { v: -10, c: &#x27;#d50000&#x27; }

  var actx = null;
  function tone(good) {

      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = good ? &#x27;square&#x27; : &#x27;sawtooth&#x27;;
      var f0 = good ? 660 : 240, f1 = good ? 980 : 90;
      o.frequency.setValueAtTime(f0, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f1, actx.currentTime + 0.14);
      g.gain.setValueAtTime(0.16, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.16);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.17);
    } catch (_) {}
  }

  // Difficulty ramps with elapsed time (0..1 as clock runs down).
  function progress() { return 1 - (timeLeft / GAME_SECONDS); }

  function updateHud() {
    scoreNum.textContent = score;
    timeNum.textContent = timeLeft;
    barfill.style.width = (timeLeft / GAME_SECONDS * 100) + &#x27;%&#x27;;
  }

  function renderRecords() {
    var medals = [&#x27;🥇&#x27;, &#x27;🥈&#x27;, &#x27;🥉&#x27;];
    for (var i = 0; i &lt; 3; i++) {
      var v = (highScores[i] !== undefined) ? highScores[i] : &#x27;—&#x27;;
      recEls[i].textContent = medals[i] + &#x27; &#x27; + v;
    }
  }

  function clearAllTargets() {
    for (var i = 0; i &lt; targets.length; i++) {
      if (targets[i].el.parentNode === board) board.removeChild(targets[i].el);
    }
    targets = [];
  }

  function pickValue() {
    // Negatives ~1/5 of the time.
    if (Math.random() &lt; 0.2) {
      return NEG[Math.floor(Math.random() * NEG.length)];
    }
    // As game progresses, drop the lowest positive values so minimums rise.
    var p = progress();
    var minIdx = 0;
    if (p &gt; 0.66) minIdx = 2;
    else if (p &gt; 0.33) minIdx = 1;
    var pool = POS.slice(minIdx);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnTarget() {
    var pv = pickValue();
    var val = pv.v;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.background = &#x27;radial-gradient(circle at center, &#x27; +
      pv.c + &#x27; 0 40%, #fff 40% 55%, &#x27; + pv.c + &#x27; 55% 100%)&#x27;;
    var lbl = document.createElement(&#x27;span&#x27;);
    lbl.className = &#x27;lbl&#x27;;
    lbl.textContent = (val &gt; 0 ? &#x27;+&#x27; : &#x27;&#x27;) + val;
    lbl.style.color = val &lt; 0 ? &#x27;#b30000&#x27; : &#x27;#222&#x27;;
    el.appendChild(lbl);

    var dir = Math.random() &lt; 0.5 ? 1 : -1;
    var y = 40 + Math.random() * (BOARD_H - T_SIZE - 54);
    var x = dir === 1 ? -T_SIZE : BOARD_W;
    // Base speed grows with progress.
    var base = 1.8 + progress() * 3.5;
    var speed = (base + Math.random() * 2.2) * dir;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    var t = { el: el, x: x, speed: speed, hit: false, val: val };
    el.addEventListener(&#x27;mousedown&#x27;, function (e) {
      e.stopPropagation();
      if (t.hit || !running) return;
      t.hit = true;
      score += val;
      if (score &lt; 0) score = 0;
      updateHud();
      el.classList.add(&#x27;hit&#x27;);
      tone(val &gt;= 0);
      setTimeout(function () {
        if (el.parentNode === board) board.removeChild(el);
      }, 180);
    });
    board.appendChild(el);
    targets.push(t);
  }

  function tick() {
    if (!running) return;
    for (var i = targets.length - 1; i &gt;= 0; i--) {
      var t = targets[i];
      if (t.hit) { if (t.el.parentNode !== board) targets.splice(i, 1); continue; }
      t.x += t.speed;
      t.el.style.left = t.x + &#x27;px&#x27;;
      if (t.x &lt; -T_SIZE - 4 || t.x &gt; BOARD_W + 4) {
        if (t.el.parentNode === board) board.removeChild(t.el);
        targets.splice(i, 1);
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  var spawnAccum = 0, lastSpawn = 0;
  function tickTimer() {
    timeLeft -= 1;
    if (timeLeft &lt;= 0) { timeLeft = 0; updateHud(); endGame(); return; }
    updateHud();
    // Spawn faster as time runs down.
    var interval = 850 - progress() * 450; // 850ms -&gt; 400ms
    if (spawnId) clearInterval(spawnId);
    spawnId = setInterval(spawnTarget, interval);
  }

  board.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var r = board.getBoundingClientRect();
    sight.style.left = (e.clientX - r.left) + &#x27;px&#x27;;
    sight.style.top = (e.clientY - r.top) + &#x27;px&#x27;;
    sight.style.display = &#x27;block&#x27;;
  });
  board.addEventListener(&#x27;mouseleave&#x27;, function () { sight.style.display = &#x27;none&#x27;; });
  board.addEventListener(&#x27;mousedown&#x27;, function () { if (running) tone(true); });

  function startGame() {
    if (running) return;
    running = true;
    score = 0;
    timeLeft = GAME_SECONDS;
    banner.style.display = &#x27;none&#x27;;
    updateHud();
    clearAllTargets();
    spawnTarget();
    if (spawnId) clearInterval(spawnId);
    if (timerId) clearInterval(timerId);
    spawnId = setInterval(spawnTarget, 850);
    timerId = setInterval(tickTimer, 1000);
    rafId = requestAnimationFrame(tick);
  }

  function recordScore() {
    highScores.push(score);
    highScores.sort(function (a, b) { return b - a; });
    highScores = highScores.slice(0, 3);
    renderRecords();
  }

  function endGame() {
    running = false;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    clearAllTargets();
    sight.style.display = &#x27;none&#x27;;
    var isBest = highScores.length === 0 || score &gt; (highScores[0] || 0);
    recordScore();
    bannerTitle.textContent = isBest &amp;&amp; score &gt; 0 ? &#x27;🏆 New Record!&#x27; : &quot;Time&#x27;s Up!&quot;;
    bannerText.textContent = &#x27;Final score: &#x27; + score;
    banner.style.display = &#x27;flex&#x27;;
  }

  function stopGame() {
    running = false;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    clearAllTargets();
    sight.style.display = &#x27;none&#x27;;
  }

  updateHud();
  renderRecords();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}

  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
