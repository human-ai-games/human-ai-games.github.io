<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(160deg,#fff3e0,#ffe0f0); color: #333; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; color: #e0518a; text-shadow: 1px 1px 0 #fff; }
  .instructions { font-size: 16px; color: #7a5a66; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }

  .over span { font-size: 16px; color:#7a5a66; font-weight:500; margin-top:6px;}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐶 Puppy Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys to eat bones 🦴 and golden treats 🌟, and fill the bar to level up. Grab power-ups: ⚡ speed boost, 🧪 shrink, 🛡️ shield (survive one crash)! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;scores&quot;&gt;&lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lvl&quot;&gt;Level: &lt;span id=&quot;lvl&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pw&quot; id=&quot;pwstatus&quot;&gt;Power: none&lt;/div&gt;&lt;div class=&quot;hi&quot;&gt;Best: &lt;span id=&quot;hi&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;bar&quot;&gt;&lt;div id=&quot;barfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over!&lt;span id=&quot;overmsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var CELL = 20;
  var COLS = 28, ROWS = 18;
  var running = false, tickId = null;
  var snake = [], dir = { x: 1, y: 0 }, dirQueue = [];
  var bones = [];
  var bonus = null, bonusTimer = 0, bonusSpawnCd = 0;
  var power = null, powerTimer = 0, powerSpawnCd = 0;   // power-up on field {x,y,kind}
  var BONE_COUNT = 4;
  var score = 0, hiScore = 0, level = 1;
  var levelProgress = 0, LEVEL_GOAL = 6;
  var TICK_BASE = 150;
  var boostTicks = 0;      // remaining ticks of speed boost
  var hasShield = false;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var hiEl = document.getElementById(&#x27;hi&#x27;);
  var lvlEl = document.getElementById(&#x27;lvl&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  var overMsg = document.getElementById(&#x27;overmsg&#x27;);
  var barFill = document.getElementById(&#x27;barfill&#x27;);
  var pwStatus = document.getElementById(&#x27;pwstatus&#x27;);

  var puppyEmojis = [&#x27;🐶&#x27;,&#x27;🐕&#x27;,&#x27;🦮&#x27;,&#x27;🐩&#x27;,&#x27;🐕‍🦺&#x27;,&#x27;🐾&#x27;,&#x27;🦊&#x27;,&#x27;🐺&#x27;];
  var POWER_KINDS = [&#x27;⚡&#x27;,&#x27;🧪&#x27;,&#x27;🛡️&#x27;];

  // ---- sound ----
  var audioCtx = null;
  function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } }
  function beep(freq, dur, type, vol){
    if(!audioCtx) return;
    try{
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.15;
      o.connect(g); g.connect(audioCtx.destination);
      var t = audioCtx.currentTime;
      o.start(t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.stop(t + dur);
    }catch(_){}
  }
  function barkSound(){ beep(520,0.09,&#x27;square&#x27;,0.14); setTimeout(function(){beep(380,0.12,&#x27;square&#x27;,0.13);},70); }
  function bonusSound(){ beep(660,0.08,&#x27;triangle&#x27;,0.15); setTimeout(function(){beep(880,0.1,&#x27;triangle&#x27;,0.14);},80); setTimeout(function(){beep(1100,0.12,&#x27;triangle&#x27;,0.13);},170); }
  function levelSound(){ beep(523,0.12,&#x27;square&#x27;,0.14); setTimeout(function(){beep(659,0.12,&#x27;square&#x27;,0.14);},120); setTimeout(function(){beep(784,0.18,&#x27;square&#x27;,0.14);},240); }
  function powerSound(){ beep(700,0.07,&#x27;sawtooth&#x27;,0.13); setTimeout(function(){beep(1000,0.09,&#x27;sawtooth&#x27;,0.12);},70); setTimeout(function(){beep(1400,0.12,&#x27;sine&#x27;,0.12);},150); }
  function shieldBreakSound(){ beep(900,0.1,&#x27;square&#x27;,0.15); setTimeout(function(){beep(500,0.15,&#x27;square&#x27;,0.13);},90); }
  function gameOverSound(){ beep(300,0.15,&#x27;sawtooth&#x27;,0.15); setTimeout(function(){beep(200,0.2,&#x27;sawtooth&#x27;,0.15);},130); setTimeout(function(){beep(120,0.3,&#x27;sawtooth&#x27;,0.15);},290); }

  function clearField() {
    var kids = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i=0;i&lt;kids.length;i++) kids[i].remove();
  }
  function drawCell(txt, x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell&#x27;;
    el.style.left = (x*CELL)+&#x27;px&#x27;; el.style.top = (y*CELL)+&#x27;px&#x27;;
    el.style.width = CELL+&#x27;px&#x27;; el.style.height = CELL+&#x27;px&#x27;;
    el.textContent = txt;
    field.appendChild(el);
  }
  function paint() {
    clearField();
    for(var b=0;b&lt;bones.length;b++) drawCell(&#x27;🦴&#x27;, bones[b].x, bones[b].y);
    if(bonus) drawCell(&#x27;🌟&#x27;, bonus.x, bonus.y);
    if(power) drawCell(power.kind, power.x, power.y);
    for (var i=0;i&lt;snake.length;i++) {
      var emo = i===0 ? &#x27;🐶&#x27; : puppyEmojis[i % puppyEmojis.length];
      drawCell(emo, snake[i].x, snake[i].y);
    }
  }
  function occupiedBySnake(x,y){ for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true; return false; }
  function occupied(x,y){
    if(occupiedBySnake(x,y)) return true;
    for(var i=0;i&lt;bones.length;i++) if(bones[i].x===x&amp;&amp;bones[i].y===y) return true;
    if(bonus&amp;&amp;bonus.x===x&amp;&amp;bonus.y===y) return true;
    if(power&amp;&amp;power.x===x&amp;&amp;power.y===y) return true;
    return false;
  }
  function freeSpot(){ for(var t=0;t&lt;300;t++){ var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS); if(!occupied(x,y)) return {x:x,y:y}; } return null; }
  function refillBones(){ while(bones.length&lt;BONE_COUNT){ var s=freeSpot(); if(!s) break; bones.push(s); } }
  function initSnake(){ snake=[{x:5,y:9},{x:4,y:9},{x:3,y:9}]; dir={x:1,y:0}; dirQueue=[]; }

  function currentTickMs(){
    var base = Math.max(70, TICK_BASE - (level-1)*12);
    return boostTicks&gt;0 ? Math.max(45, base*0.55) : base;
  }
  function updateBar(){ barFill.style.width = Math.min(100,(levelProgress/LEVEL_GOAL)*100)+&#x27;%&#x27;; }
  function restartTimer(){ if(tickId) clearInterval(tickId); tickId=setInterval(tick, currentTickMs()); }

  function updatePowerStatus(){
    var parts=[];
    if(boostTicks&gt;0) parts.push(&#x27;⚡&#x27;);
    if(hasShield) parts.push(&#x27;🛡️&#x27;);
    pwStatus.textContent = &#x27;Power: &#x27; + (parts.length?parts.join(&#x27; &#x27;):&#x27;none&#x27;);
    field.classList.toggle(&#x27;boost&#x27;, boostTicks&gt;0);
    field.classList.toggle(&#x27;shield&#x27;, hasShield);
  }

  function advanceLevel(){
    level+=1; lvlEl.textContent=level;
    levelProgress=0; updateBar();
    levelSound();
    restartTimer();
  }

  function applyPower(kind){
    if(kind===&#x27;⚡&#x27;){ boostTicks=40; restartTimer(); }
    else if(kind===&#x27;🧪&#x27;){ // shrink: remove up to 3 tail segments (keep min 2)
      var remove=Math.min(3, snake.length-2);
      for(var i=0;i&lt;remove;i++) snake.pop();
    }
    else if(kind===&#x27;🛡️&#x27;){ hasShield=true; }
    powerSound();
    updatePowerStatus();
  }

  // effective next direction, blocking reversal against current dir
  function nextDir(){
    while(dirQueue.length){
      var d=dirQueue.shift();
      if(!(d.x===-dir.x &amp;&amp; d.y===-dir.y)) return d;
    }
    return dir;
  }

  function tick(){
    if(!running) return;
    dir = nextDir();
    var head = snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    var crash = (nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS);
    var boneIdx=-1; for(var i=0;i&lt;bones.length;i++) if(bones[i].x===nx&amp;&amp;bones[i].y===ny){ boneIdx=i; break; }
    var hitBonus = bonus &amp;&amp; bonus.x===nx &amp;&amp; bonus.y===ny;
    var hitPower = power &amp;&amp; power.x===nx &amp;&amp; power.y===ny;
    var grows = boneIdx&gt;=0 || hitBonus;
    if(!crash){
      var bodyCheck = grows ? snake : snake.slice(0, snake.length-1);
      for(var j=0;j&lt;bodyCheck.length;j++) if(bodyCheck[j].x===nx&amp;&amp;bodyCheck[j].y===ny){ crash=true; break; }
    }
    if(crash){
      if(hasShield){ // consume shield, bounce back (reverse direction)
        hasShield=false; shieldBreakSound(); updatePowerStatus();
        dir={x:-dir.x, y:-dir.y}; dirQueue=[];
        // recompute one safe step
        var rh=snake[0]; var rx=rh.x+dir.x, ry=rh.y+dir.y;
        if(rx&lt;0||rx&gt;=COLS||ry&lt;0||ry&gt;=ROWS){ endGame(); return; }
        snake.unshift({x:rx,y:ry}); snake.pop(); paint(); return;
      }
      endGame(); return;
    }
    snake.unshift({x:nx,y:ny});

    if(boneIdx&gt;=0){
      bones.splice(boneIdx,1);
      score+=1; scoreEl.textContent=score;
      levelProgress+=1; updateBar(); barkSound(); refillBones();
      if(levelProgress&gt;=LEVEL_GOAL) advanceLevel();
    } else if(hitBonus){
      score+=5; scoreEl.textContent=score;
      levelProgress+=1; updateBar(); bonus=null; bonusSound();
      if(levelProgress&gt;=LEVEL_GOAL) advanceLevel();
    } else {
      snake.pop();
    }

    if(hitPower){ var k=power.kind; power=null; applyPower(k); }

    // boost countdown
    if(boostTicks&gt;0){ boostTicks--; if(boostTicks===0){ restartTimer(); updatePowerStatus(); } }

    // bonus lifecycle
    if(bonus){ bonusTimer--; if(bonusTimer&lt;=0) bonus=null; }
    else { bonusSpawnCd--; if(bonusSpawnCd&lt;=0){ var s=freeSpot(); if(s){ bonus=s; bonusTimer=45; } bonusSpawnCd=60+Math.floor(Math.random()*40); } }

    // power-up lifecycle
    if(power){ powerTimer--; if(powerTimer&lt;=0) power=null; }
    else { powerSpawnCd--; if(powerSpawnCd&lt;=0){ var ps=freeSpot(); if(ps){ ps.kind=POWER_KINDS[Math.floor(Math.random()*POWER_KINDS.length)]; power=ps; powerTimer=55; } powerSpawnCd=90+Math.floor(Math.random()*60); } }

    paint();
  }

  function endGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
    if(score&gt;hiScore){ hiScore=score; hiEl.textContent=hiScore; }
    overMsg.textContent = &#x27;You reached level &#x27;+level+&#x27; with &#x27;+score+&#x27; points!&#x27;;
    overEl.style.display=&#x27;flex&#x27;;
    gameOverSound();
  }
  function startGame(){
    ensureAudio();
    if(audioCtx &amp;&amp; audioCtx.state===&#x27;suspended&#x27;) audioCtx.resume();
    if(running) return;
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    level=1; lvlEl.textContent=&#x27;1&#x27;;
    levelProgress=0; updateBar();
    overEl.style.display=&#x27;none&#x27;;
    bones=[]; bonus=null; bonusTimer=0; bonusSpawnCd=50;
    power=null; powerTimer=0; powerSpawnCd=70;
    boostTicks=0; hasShield=false; updatePowerStatus();
    initSnake(); refillBones(); paint();
    running=true;
    restartTimer();
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    var d=null;
    if(e.key===&#x27;ArrowLeft&#x27;) d={x:-1,y:0};
    else if(e.key===&#x27;ArrowRight&#x27;) d={x:1,y:0};
    else if(e.key===&#x27;ArrowUp&#x27;) d={x:0,y:-1};
    else if(e.key===&#x27;ArrowDown&#x27;) d={x:0,y:1};
    if(d){ if(dirQueue.length&lt;3) dirQueue.push(d); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  initSnake(); refillBones(); paint(); updateBar(); updatePowerStatus();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
