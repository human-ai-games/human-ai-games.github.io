<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Falling blocks</b> &middot; Game 418 &middot; Professional producer &middot; Basic game: Falling blocks</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .playarea { display: flex; align-items: flex-start; justify-content: space-between; width: 460px; gap: 20px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100px; }

  .next-box { position: relative; width: 100px; height: 100px; background: #ececec; border-radius: 8px; overflow: hidden; }

  .impact { animation: squash 0.18s ease-out; }
  @keyframes squash {
    0%   { transform: scaleY(1) scaleX(1); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the falling piece with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to slam it down, and &lt;strong&gt;&amp;uarr;&lt;/strong&gt; to rotate. Clear a full row to score 10 points, using the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;playarea&quot;&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel-label&quot;&gt;Score&lt;/div&gt;
      &lt;div class=&quot;score-box&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel-label&quot;&gt;Next&lt;/div&gt;
      &lt;div class=&quot;next-box&quot; id=&quot;next&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var DROP_MS = 500;
  var running = false, dropId = null, busy = false;
  var grid = [];
  var piece = null, nextDef = null;
  var score = 0;
  var impactCells = null;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var nextBox = document.getElementById(&#x27;next&#x27;);

  var SHAPES = [
    { name: &#x27;O&#x27;, color: &#x27;#e0a53a&#x27;, cells: [ {x:0,y:0},{x:1,y:0},{x:0,y:1},{x:1,y:1} ] },
    { name: &#x27;L&#x27;, color: &#x27;#3aa6e0&#x27;, cells: [ {x:0,y:0},{x:0,y:1},{x:0,y:2},{x:1,y:2} ] },
    { name: &#x27;T&#x27;, color: &#x27;#a44de0&#x27;, cells: [ {x:0,y:0},{x:1,y:0},{x:2,y:0},{x:1,y:1} ] },
    { name: &#x27;I&#x27;, color: &#x27;#e04d6b&#x27;, cells: [ {x:0,y:0},{x:1,y:0},{x:2,y:0},{x:3,y:0} ] }
  ];

  function randomDef() { return SHAPES[Math.floor(Math.random() * SHAPES.length)]; }

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(0);
      grid.push(row);
    }
  }

  function pieceCells(p) {
    var res = [];
    for (var i = 0; i &lt; p.cells.length; i++) {
      res.push({ x: p.x + p.cells[i].x, y: p.y + p.cells[i].y });
    }
    return res;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function rotateCells(cells) {
    var maxY = 0;
    for (var i = 0; i &lt; cells.length; i++) if (cells[i].y &gt; maxY) maxY = cells[i].y;
    var out = [];
    var minX = Infinity, minY = Infinity;
    for (var j = 0; j &lt; cells.length; j++) {
      var nx = maxY - cells[j].y;
      var ny = cells[j].x;
      out.push({ x: nx, y: ny });
      if (nx &lt; minX) minX = nx;
      if (ny &lt; minY) minY = ny;
    }
    for (var k = 0; k &lt; out.length; k++) { out[k].x -= minX; out[k].y -= minY; }
    return out;
  }

  function rotate() {
    if (!running || !piece || busy) return;
    var rotated = rotateCells(piece.cells);
    var trial = { x: piece.x, y: piece.y, color: piece.color, cells: rotated };
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i &lt; kicks.length; i++) {
      trial.x = piece.x + kicks[i];
      if (!collides(trial)) { piece = trial; paint(); return; }
    }
  }

  function defToPiece(def) {
    var cells = [];
    for (var i = 0; i &lt; def.cells.length; i++) cells.push({ x: def.cells[i].x, y: def.cells[i].y });
    var maxX = 0;
    for (var j = 0; j &lt; cells.length; j++) if (cells[j].x &gt; maxX) maxX = cells[j].x;
    var w = maxX + 1;
    return { x: Math.floor((COLS - w) / 2), y: 0, color: def.color, cells: cells };
  }

  function spawnPiece() {
    if (!nextDef) nextDef = randomDef();
    piece = defToPiece(nextDef);
    nextDef = randomDef();
    drawNext();
    if (collides(piece)) return false;
    return true;
  }

  function drawNext() {
    nextBox.innerHTML = &#x27;&#x27;;
    if (!nextDef) return;
    var cells = nextDef.cells;
    var maxX = 0, maxY = 0;
    for (var i = 0; i &lt; cells.length; i++) {
      if (cells[i].x &gt; maxX) maxX = cells[i].x;
      if (cells[i].y &gt; maxY) maxY = cells[i].y;
    }
    var w = maxX + 1, h = maxY + 1;
    var pc = 18;
    var offX = Math.floor((100 - w * pc) / 2);
    var offY = Math.floor((100 - h * pc) / 2);
    for (var j = 0; j &lt; cells.length; j++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;block&#x27;;
      el.style.left = (offX + cells[j].x * pc) + &#x27;px&#x27;;
      el.style.top = (offY + cells[j].y * pc) + &#x27;px&#x27;;
      el.style.width = pc + &#x27;px&#x27;;
      el.style.height = pc + &#x27;px&#x27;;
      el.style.background = nextDef.color;
      nextBox.appendChild(el);
    }
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    impactCells = [];
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) {
        grid[c.y][c.x] = piece.color;
        impactCells.push({ x: c.x, y: c.y });
      }
    }
    piece = null;
  }

  function fullRows() {
    var rows = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) rows.push(r);
    }
    return rows;
  }

  function removeRows(rows) {
    rows.sort(function(a,b){ return a-b; });
    for (var i = rows.length - 1; i &gt;= 0; i--) {
      grid.splice(rows[i], 1);
      var empty = [];
      for (var c = 0; c &lt; COLS; c++) empty.push(0);
      grid.unshift(empty);
    }
    score += rows.length * 10;
    scoreEl.textContent = score;
  }

  function key(cx, cy) { return cx + &#x27;,&#x27; + cy; }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    var impactSet = {};
    if (impactCells) {
      for (var i = 0; i &lt; impactCells.length; i++) impactSet[key(impactCells[i].x, impactCells[i].y)] = true;
    }
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) {
          var el = drawBlock(c, r, grid[r][c]);
          if (impactSet[key(c, r)]) el.classList.add(&#x27;impact&#x27;);
        }
      }
    }
    impactCells = null;
    if (piece) {
      var cells = pieceCells(piece);
      for (var j = 0; j &lt; cells.length; j++) {
        if (cells[j].y &gt;= 0) drawBlock(cells[j].x, cells[j].y, piece.color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    field.appendChild(el);
    return el;
  }

  function crumbleAndClear(rows, done) {
    busy = true;
    paint();
    for (var i = 0; i &lt; rows.length; i++) {
      var r = rows[i];
      for (var c = 0; c &lt; COLS; c++) {
        var el = drawBlock(c, r, grid[r][c]);
        el.classList.add(&#x27;crumble&#x27;);
      }
    }
    setTimeout(function () {
      removeRows(rows);
      busy = false;
      if (!spawnPiece()) { endGame(); paint(); return; }
      paint();
      if (done) done();
    }, 440);
  }

  function afterLock() {
    lockPiece();
    var rows = fullRows();
    if (rows.length &gt; 0) {
      crumbleAndClear(rows);
    } else {
      if (!spawnPiece()) { endGame(); paint(); return; }
      paint();
    }
  }

  function stepDown() {
    if (!piece || busy) return;
    var next = { x: piece.x, y: piece.y + 1, color: piece.color, cells: piece.cells };
    if (collides(next)) {
      afterLock();
    } else {
      piece = next;
      paint();
    }
  }

  function hardDrop() {
    if (!running || !piece || busy) return;
    var next = { x: piece.x, y: piece.y + 1, color: piece.color, cells: piece.cells };
    while (!collides(next)) {
      piece.y += 1;
      next = { x: piece.x, y: piece.y + 1, color: piece.color, cells: piece.cells };
    }
    afterLock();
  }

  function move(dx) {
    if (!running || !piece || busy) return;
    var next = { x: piece.x + dx, y: piece.y, color: piece.color, cells: piece.cells };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    busy = false;
    impactCells = null;
    nextDef = randomDef();
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, DROP_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) hardDrop(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial preview
  newGrid();
  nextDef = randomDef();
  drawNext();
  piece = defToPiece(SHAPES[0]);
  paint();
&lt;/script&gt;
