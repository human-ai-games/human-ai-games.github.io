<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Pop</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Color Pop</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .instructions { font-size: 16px; color: #fff; max-width: 620px; margin: 0; line-height: 1.35; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .score { font-size: 20px; color: #fff; margin: 0; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .board { position: relative; width: 640px; height: 440px; flex-shrink: 0; margin: 0; background: rgba(255,255,255,.14); border-radius: 10px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); overflow: hidden; }
  .mole { position: absolute; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .drag { cursor: grab; box-shadow: 0 0 0 3px #fff, 0 0 12px 3px rgba(255,255,255,.7); animation: dragPulse .7s infinite alternate; }
  .drag.grabbing { cursor: grabbing; animation: none; }
  @keyframes dragPulse {
    from { box-shadow: 0 0 0 3px #fff, 0 0 8px 2px rgba(255,255,255,.6); }
    to   { box-shadow: 0 0 0 4px #fff, 0 0 22px 8px rgba(255,255,255,1); }
  }
  .drag-label {
    position: absolute;
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,.7);
    padding: 3px 10px;
    border-radius: 10px;
    pointer-events: none;
    transform-origin: center bottom;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    white-space: nowrap;
    animation: popBounce .45s infinite alternate;
  }
  @keyframes popBounce {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.3); }
  }
  .trail {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Color Pop&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the plain circles to pop them for points — smaller ones are worth more! Circles marked &quot;DRAG!&quot; glow and flash: drag one onto another glowing circle for a big bonus.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 440;
  var SPAWN_MS = 380, MOLE_LIFE_MS = 1500;
  var score = 0;
  var intervalId = null, bgId = null;
  var moleTimeouts = [];
  var running = false;
  var hue = 0;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  function randColor() {
    return &#x27;hsl(&#x27; + Math.floor(Math.random()*360) + &#x27;,75%,55%)&#x27;;
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    board.innerHTML = &#x27;&#x27;;
  }

  function pointsForSize(size) {
    return Math.max(1, Math.round((90 - size) / 8) + 1);
  }

  function spawnMole() {
    var size = 30 + Math.random() * 55;
    var isDrag = Math.random() &lt; 0.32;
    var color = randColor();
    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27; + (isDrag ? &#x27; drag&#x27; : &#x27;&#x27;);
    mole.style.width = size + &#x27;px&#x27;;
    mole.style.height = size + &#x27;px&#x27;;
    mole.style.background = color;
    var x = Math.random() * (BOARD_W - size);
    var y = Math.random() * (BOARD_H - size);
    mole.style.left = x + &#x27;px&#x27;;
    mole.style.top = y + &#x27;px&#x27;;
    mole.dataset.size = size;
    mole.dataset.color = color;
    mole.dataset.drag = isDrag ? &#x27;1&#x27; : &#x27;0&#x27;;

    var hit = false;
    var label = null;

    if (!isDrag) {
      mole.addEventListener(&#x27;click&#x27;, function () {
        if (hit) return;
        hit = true;
        score += pointsForSize(size);
        scoreEl.textContent = score;
        mole.style.transition = &#x27;transform .12s&#x27;;
        mole.style.transform = &#x27;scale(0)&#x27;;
        setTimeout(function () { if (mole.parentNode === board) board.removeChild(mole); }, 120);
      });
    } else {
      label = document.createElement(&#x27;div&#x27;);
      label.className = &#x27;drag-label&#x27;;
      label.textContent = &#x27;DRAG!&#x27;;
      board.appendChild(label);
      moleTimeouts.push(setTimeout(function () {
        if (label.parentNode === board) board.removeChild(label);
      }, MOLE_LIFE_MS));
      positionLabel(mole, label, size);
      enableDrag(mole, size, label, color);
    }

    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (mole.parentNode === board) board.removeChild(mole);
      if (label &amp;&amp; label.parentNode === board) board.removeChild(label);
    }, MOLE_LIFE_MS));
  }

  function positionLabel(mole, label, size) {
    var cx = parseFloat(mole.style.left) + size/2;
    var ty = parseFloat(mole.style.top) - 24;
    if (ty &lt; 4) ty = parseFloat(mole.style.top) + size + 6;
    label.style.left = cx + &#x27;px&#x27;;
    label.style.top = ty + &#x27;px&#x27;;
  }

  function makeTrailDot(cx, cy, size, color) {
    var dot = document.createElement(&#x27;div&#x27;);
    dot.className = &#x27;trail&#x27;;
    var ds = size * 0.6;
    dot.style.width = ds + &#x27;px&#x27;;
    dot.style.height = ds + &#x27;px&#x27;;
    dot.style.left = cx + &#x27;px&#x27;;
    dot.style.top = cy + &#x27;px&#x27;;
    dot.style.background = color;
    dot.style.opacity = &#x27;0.55&#x27;;
    board.appendChild(dot);
    requestAnimationFrame(function () {
      dot.style.transition = &#x27;opacity .45s, transform .45s&#x27;;
      dot.style.opacity = &#x27;0&#x27;;
      dot.style.transform = &#x27;translate(-50%, -50%) scale(0.2)&#x27;;
    });
    setTimeout(function () { if (dot.parentNode === board) board.removeChild(dot); }, 460);
  }

  function enableDrag(mole, size, label, color) {
    var dragging = false, offsetX = 0, offsetY = 0;
    var lastTrail = 0;

    mole.addEventListener(&#x27;mousedown&#x27;, function (e) {
      dragging = true;
      mole.classList.add(&#x27;grabbing&#x27;);
      var r = board.getBoundingClientRect();
      offsetX = e.clientX - (r.left + parseFloat(mole.style.left));
      offsetY = e.clientY - (r.top + parseFloat(mole.style.top));
      e.preventDefault();
    });

    document.addEventListener(&#x27;mousemove&#x27;, function (e) {
      if (!dragging) return;
      var r = board.getBoundingClientRect();
      var nx = e.clientX - r.left - offsetX;
      var ny = e.clientY - r.top - offsetY;
      nx = Math.max(0, Math.min(BOARD_W - size, nx));
      ny = Math.max(0, Math.min(BOARD_H - size, ny));
      mole.style.left = nx + &#x27;px&#x27;;
      mole.style.top = ny + &#x27;px&#x27;;
      if (label &amp;&amp; label.parentNode === board) positionLabel(mole, label, size);
      var now = Date.now();
      if (now - lastTrail &gt; 30) {
        lastTrail = now;
        makeTrailDot(nx + size/2, ny + size/2, size, color);
      }
    });

    document.addEventListener(&#x27;mouseup&#x27;, function () {
      if (!dragging) return;
      dragging = false;
      mole.classList.remove(&#x27;grabbing&#x27;);
      checkDragCollision(mole);
    });
  }

  function checkDragCollision(mole) {
    if (mole.parentNode !== board) return;
    var others = board.querySelectorAll(&#x27;.drag&#x27;);
    var s1 = parseFloat(mole.dataset.size);
    var cx1 = parseFloat(mole.style.left) + s1/2;
    var cy1 = parseFloat(mole.style.top) + s1/2;
    for (var i = 0; i &lt; others.length; i++) {
      var o = others[i];
      if (o === mole) continue;
      var s2 = parseFloat(o.dataset.size);
      var cx2 = parseFloat(o.style.left) + s2/2;
      var cy2 = parseFloat(o.style.top) + s2/2;
      var dist = Math.hypot(cx1 - cx2, cy1 - cy2);
      if (dist &lt; (s1 + s2) / 2) {
        score += 10 + pointsForSize(s1) + pointsForSize(s2);
        scoreEl.textContent = score;
        popRemove(mole); popRemove(o);
        return;
      }
    }
  }

  function popRemove(el) {
    el.style.transition = &#x27;transform .15s&#x27;;
    el.style.transform = &#x27;scale(0)&#x27;;
    setTimeout(function () { if (el.parentNode === board) el.parentNode.removeChild(el); }, 150);
  }

  function shiftBg() {
    hue = (hue + 2) % 360;
    document.body.style.background =
      &#x27;linear-gradient(135deg, hsl(&#x27; + hue + &#x27;,65%,55%), hsl(&#x27; + ((hue+80)%360) + &#x27;,65%,50%))&#x27;;
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    if (intervalId) clearInterval(intervalId);
    if (bgId) clearInterval(bgId);
    clearAllMoles();
    shiftBg();
    spawnMole();
    intervalId = setInterval(spawnMole, SPAWN_MS);
    bgId = setInterval(shiftBg, 100);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    if (bgId) { clearInterval(bgId); bgId = null; }
    clearAllMoles();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
