<!doctype html>
<html lang="en">
<head>

<title>Neon Paddle Ball</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Neon Paddle Ball</b> &middot; Game 072 &middot; Amateur producer &middot; Basic game: Paddle and ball</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #12121e; color: #f0f0f5; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; background: linear-gradient(90deg,#ff6ec4,#7873f5,#42e695,#ffd166); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #c8c8d8; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .score { font-size: 20px; color: #fff; margin: 0; font-weight: 600; text-shadow: 0 0 8px rgba(120,115,245,0.8); }
  .lives { font-size: 20px; color: #fff; margin: 0; font-weight: 600; }
  .diff { display: flex; gap: 6px; }
  .diff button {
    font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08);
    color: #f0f0f5; cursor: pointer; transition: all 0.15s;
  }
  .diff button:hover { background: rgba(255,255,255,0.18); }
  .diff button.active { background: linear-gradient(90deg,#ff6ec4,#7873f5); border-color: #fff; box-shadow: 0 0 12px #7873f5; }
  .field {
    position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0;
    border-radius: 12px; overflow: hidden;
    background: linear-gradient(-45deg, #ff6ec4, #7873f5, #42e695, #ffd166, #ff6ec4);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    box-shadow: 0 0 30px rgba(120,115,245,0.5);
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .field::before {
    content: &quot;&quot;; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%);
    pointer-events: none;
  }
  .paddle {
    position: absolute; height: 14px; border-radius: 8px; bottom: 10px;
    background: linear-gradient(90deg,#ffffff,#e0e0ff);
    box-shadow: 0 0 16px #fff, 0 0 30px #7873f5;
  }
  .ball {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #ffd166);
    box-shadow: 0 0 12px #fff, 0 0 24px #ffd166, 0 0 40px #ff6ec4;
  }
  .overlay {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(10,10,25,0.72); backdrop-filter: blur(3px);
    text-align: center; z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 40px; font-weight: 800; color: #fff; text-shadow: 0 0 16px #ff6ec4; }
  .overlay p { margin: 0; font-size: 20px; color: #ffd166; font-weight: 600; }
  .overlay .hint { font-size: 18px; color: #e0e0ff; font-weight: 600; }
  .overlay .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Neon Paddle Ball&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys to bounce the ball — you have 3 lives. When you lose, press &lt;strong&gt;Space&lt;/strong&gt; to instantly play again, or use the button below.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot;&gt;Lives: &lt;span id=&quot;lives&quot;&gt;❤❤❤&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;diff&quot; id=&quot;diff&quot;&gt;
      &lt;button data-level=&quot;easy&quot;&gt;Easy&lt;/button&gt;
      &lt;button data-level=&quot;medium&quot; class=&quot;active&quot;&gt;Medium&lt;/button&gt;
      &lt;button data-level=&quot;hard&quot;&gt;Hard&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Game Over&lt;/h2&gt;
      &lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;
      &lt;div class=&quot;hint pulse&quot;&gt;Press Space to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var PADDLE_H = 14, PADDLE_BOTTOM = 10;
  var BALL_SIZE = 16;
  var START_LIVES = 3;

  var LEVELS = {
    easy:   { ballSpeed: 3.0, paddleW: 130, paddleSpeed: 7 },
    medium: { ballSpeed: 4.5, paddleW: 100, paddleSpeed: 6 },
    hard:   { ballSpeed: 6.5, paddleW: 70,  paddleSpeed: 8 }
  };
  var level = &#x27;medium&#x27;;
  var cfg = LEVELS[level];

  var running = false, animId = null, gameOver = false;
  var keysDown = {};
  var paddleX = (FIELD_W - cfg.paddleW) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = cfg.ballSpeed, ballVY = cfg.ballSpeed;
  var score = 0, lives = START_LIVES;
  var field = document.getElementById(&#x27;field&#x27;);
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var diffEl = document.getElementById(&#x27;diff&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var trails = [];

  function applyLevelVisual() { paddle.style.width = cfg.paddleW + &#x27;px&#x27;; }

  function updateLives() {
    livesEl.textContent = lives &gt; 0 ? &#x27;❤&#x27;.repeat(lives) : &#x27;—&#x27;;
  }

  function paint() {
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function spawnTrail() {
    var t = document.createElement(&#x27;div&#x27;);
    t.style.position = &#x27;absolute&#x27;;
    t.style.width = BALL_SIZE + &#x27;px&#x27;;
    t.style.height = BALL_SIZE + &#x27;px&#x27;;
    t.style.borderRadius = &#x27;50%&#x27;;
    t.style.left = ballX + &#x27;px&#x27;;
    t.style.top = ballY + &#x27;px&#x27;;
    t.style.background = &#x27;radial-gradient(circle,#fff,#ffd166)&#x27;;
    t.style.pointerEvents = &#x27;none&#x27;;
    t.style.opacity = &#x27;0.5&#x27;;
    t.style.transition = &#x27;opacity 0.4s linear&#x27;;
    field.appendChild(t);
    trails.push(t);
    requestAnimationFrame(function(){ t.style.opacity = &#x27;0&#x27;; });
    setTimeout(function(){
      if (t.parentNode) t.parentNode.removeChild(t);
      var i = trails.indexOf(t); if (i &gt;= 0) trails.splice(i,1);
    }, 400);
  }

  function clearTrails() {
    trails.forEach(function(t){ if (t.parentNode) t.parentNode.removeChild(t); });
    trails = [];
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = 50;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * cfg.ballSpeed;
    ballVY = cfg.ballSpeed;
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    finalScoreEl.textContent = &#x27;Score: &#x27; + score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  var trailCounter = 0;
  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= cfg.paddleSpeed;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += cfg.paddleSpeed;
    paddleX = Math.max(0, Math.min(FIELD_W - cfg.paddleW, paddleX));
    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + cfg.paddleW) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
      score += 1;
      scoreEl.textContent = score;
    }
    if (ballY &gt;= FIELD_H) {
      lives -= 1;
      updateLives();
      if (lives &lt;= 0) { endGame(); return; }
      resetBall();
    }
    if (++trailCounter % 2 === 0) spawnTrail();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    cfg = LEVELS[level];
    applyLevelVisual();
    gameOver = false;
    overlay.classList.remove(&#x27;show&#x27;);
    score = 0;
    lives = START_LIVES;
    scoreEl.textContent = &#x27;0&#x27;;
    updateLives();
    paddleX = (FIELD_W - cfg.paddleW) / 2;
    for (var k in keysDown) keysDown[k] = false;
    clearTrails();
    resetBall();
    paint();
    if (animId) cancelAnimationFrame(animId);
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  diffEl.addEventListener(&#x27;click&#x27;, function (e) {
    var btn = e.target.closest(&#x27;button&#x27;);
    if (!btn) return;
    level = btn.getAttribute(&#x27;data-level&#x27;);
    cfg = LEVELS[level];
    Array.prototype.forEach.call(diffEl.querySelectorAll(&#x27;button&#x27;), function (b) {
      b.classList.toggle(&#x27;active&#x27;, b === btn);
    });
    applyLevelVisual();
    if (!running) {
      paddleX = (FIELD_W - cfg.paddleW) / 2;
      paint();
    }
  });

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
    if (e.key === &#x27; &#x27; || e.key === &#x27;Spacebar&#x27;) {
      e.preventDefault();
      if (gameOver) startGame();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  applyLevelVisual();
  updateLives();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>

    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
