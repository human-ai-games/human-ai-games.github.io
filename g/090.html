<style>

  .header a { color: #1f6feb; }

    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐸 Travessia do Sapo</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { font-size: 18px; color: #555; margin: 0; display: flex; gap: 24px; align-items: center; }
  .field { position: relative; width: 660px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; }
  .hero { position: absolute; z-index: 5; transition: left 0.05s, top 0.05s; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .hero.shielded { filter: drop-shadow(0 0 6px #35e0ff) drop-shadow(0 0 3px #35e0ff); }
  .car { position: absolute; display:flex; align-items:center; justify-content:center; font-size:30px; }
  .log { position: absolute; background: #8a5a2b; border-radius: 6px; box-shadow: inset 0 3px 0 #a06a34; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 20; background: rgba(0,0,0,0.55); color: white; font-size: 30px; font-weight: 700; text-align:center; gap:8px; }
  .msg small { font-size: 16px; font-weight: 400; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Travessia do Sapo&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use as setas ou WASD para andar. Atravesse a estrada e pule sobre os troncos na água — toque a sapinha no topo para vencer; seu escudo azul quebra se te atropelarem e te devolve ao chão seguro.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Escudo: &lt;span id=&quot;shield&quot;&gt;🛡️&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var CELL = 44;
  var COLS = 15;
  var ROWS = 13;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 10;

  var GOAL_ROW = 0;
  var WATER_ROWS = [1,2,3,4];
  var MID_SAFE = 5;
  var ROAD_ROWS = [6,7,8,9,10,11];
  var START_ROW = 12;

  var running = false, animId = null, gameOver = false, won = false;
  var hero = { col: Math.floor(COLS / 2), row: START_ROW };
  var hasShield = true;
  var lanes = [];
  var goalCol = Math.floor(COLS / 2);

  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null, msgEl = null, goalEl = null;
  var shieldEl = document.getElementById(&#x27;shield&#x27;);

  field.style.height = FIELD_H + &#x27;px&#x27;;
  field.style.width = FIELD_W + &#x27;px&#x27;;

  function rowColor(r) {
    if (r === GOAL_ROW || r === MID_SAFE || r === START_ROW) return &#x27;#5fae4e&#x27;;
    if (WATER_ROWS.indexOf(r) &gt;= 0) return &#x27;#2f7fd6&#x27;;
    return &#x27;#4a4a4a&#x27;;
  }

  function drawBackground() {
    for (var r = 0; r &lt; ROWS; r++) {
      var band = document.createElement(&#x27;div&#x27;);
      band.style.position = &#x27;absolute&#x27;;
      band.style.left = &#x27;0&#x27;;
      band.style.right = &#x27;0&#x27;;
      band.style.top = (r * CELL) + &#x27;px&#x27;;
      band.style.height = CELL + &#x27;px&#x27;;
      band.style.background = rowColor(r);
      if (ROAD_ROWS.indexOf(r) &gt;= 0) {
        band.style.borderTop = &#x27;2px dashed rgba(255,255,255,0.25)&#x27;;
      }
      field.appendChild(band);
    }
  }

  function buildLanes() {
    lanes = [];
    ROAD_ROWS.forEach(function (row, i) {
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 1.0 + (i % 3) * 0.5;
      var count = 2 + (i % 2);
      var w = CELL - 6; // emoji-sized car
      var items = [];
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 40) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;car&#x27;;
        el.style.width = w + &#x27;px&#x27;;
        el.style.height = (CELL - 6) + &#x27;px&#x27;;
        el.style.top = (row * CELL + 3) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.textContent = dir &gt; 0 ? &#x27;🚗&#x27; : &#x27;🚙&#x27;;
        el.style.transform = dir &gt; 0 ? &#x27;scaleX(-1)&#x27; : &#x27;none&#x27;;
        field.appendChild(el);
        items.push({ x: x, el: el, w: w });
      }
      lanes.push({ row: row, type: &#x27;car&#x27;, dir: dir, speed: speed, items: items });
    });
    WATER_ROWS.forEach(function (row, i) {
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.8 + (i % 2) * 0.4;
      var count = 2;
      var w = CELL * 3 - 8;
      var items = [];
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 55) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;log&#x27;;
        el.style.width = w + &#x27;px&#x27;;
        el.style.height = (CELL - 12) + &#x27;px&#x27;;
        el.style.top = (row * CELL + 6) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        items.push({ x: x, el: el, w: w });
      }
      lanes.push({ row: row, type: &#x27;log&#x27;, dir: dir, speed: speed, items: items });
    });
  }

  function makeGoal() {
    goalEl = document.createElement(&#x27;div&#x27;);
    goalEl.style.position = &#x27;absolute&#x27;;
    goalEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    goalEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    goalEl.style.top = (GOAL_ROW * CELL + (CELL - HERO_SIZE) / 2) + &#x27;px&#x27;;
    goalEl.style.left = (goalCol * CELL + (CELL - HERO_SIZE) / 2) + &#x27;px&#x27;;
    goalEl.style.display = &#x27;flex&#x27;;
    goalEl.style.alignItems = &#x27;center&#x27;;
    goalEl.style.justifyContent = &#x27;center&#x27;;
    goalEl.style.fontSize = &#x27;26px&#x27;;
    goalEl.style.zIndex = &#x27;4&#x27;;
    goalEl.textContent = &#x27;🐸💕&#x27;;
    field.appendChild(goalEl);
  }

  function makeHero() {
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    field.appendChild(heroEl);
  }

  function updateShieldClass() {
    if (hasShield) heroEl.classList.add(&#x27;shielded&#x27;);
    else heroEl.classList.remove(&#x27;shielded&#x27;);
    shieldEl.textContent = hasShield ? &#x27;🛡️&#x27; : &#x27;❌ (quebrado)&#x27;;
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = START_ROW;
    paintHero();
  }

  function heroX() { return hero.col * CELL + (CELL - HERO_SIZE) / 2; }
  function heroY() { return hero.row * CELL + (CELL - HERO_SIZE) / 2; }

  function laneAt(row) {
    for (var i = 0; i &lt; lanes.length; i++) if (lanes[i].row === row) return lanes[i];
    return null;
  }

  function showMsg(title, sub) {
    if (msgEl) msgEl.remove();
    msgEl = document.createElement(&#x27;div&#x27;);
    msgEl.className = &#x27;msg&#x27;;
    msgEl.innerHTML = &#x27;&lt;div&gt;&#x27; + title + &#x27;&lt;/div&gt;&lt;small&gt;&#x27; + sub + &#x27;&lt;/small&gt;&#x27;;
    field.appendChild(msgEl);
  }

  function hitByCar() {
    if (hasShield) {
      hasShield = false;
      updateShieldClass();
      resetHero();
    } else {
      endGame(false);
    }
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.items.length; j++) {
        var it = lane.items[j];
        it.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; it.x &gt; FIELD_W) it.x = -it.w;
        else if (lane.dir &lt; 0 &amp;&amp; it.x + it.w &lt; 0) it.x = FIELD_W;
        it.el.style.left = it.x + &#x27;px&#x27;;
      }
    }

    var hx = heroX(), hy = heroY();

    if (ROAD_ROWS.indexOf(hero.row) &gt;= 0) {
      var carLane = laneAt(hero.row);
      for (var k = 0; k &lt; carLane.items.length; k++) {
        var c = carLane.items[k];
        if (hx &lt; c.x + c.w &amp;&amp; hx + HERO_SIZE &gt; c.x) {
          hitByCar();
          animId = requestAnimationFrame(tick);
          return;
        }
      }
    }

    if (WATER_ROWS.indexOf(hero.row) &gt;= 0) {
      var logLane = laneAt(hero.row);
      var onLog = null;
      for (var m = 0; m &lt; logLane.items.length; m++) {
        var lg = logLane.items[m];
        var hc = hx + HERO_SIZE / 2;
        if (hc &gt; lg.x &amp;&amp; hc &lt; lg.x + lg.w) { onLog = lg; break; }
      }
      if (onLog) {
        var newX = hx + logLane.dir * logLane.speed;
        var newCol = Math.round((newX - (CELL - HERO_SIZE) / 2) / CELL);
        hero.col = Math.max(0, Math.min(COLS - 1, newCol));
        paintHero();
      } else {
        if (hasShield) {
          hasShield = false;
          updateShieldClass();
          resetHero();
        } else {
          endGame(false);
        }
        animId = requestAnimationFrame(tick);
        return;
      }
    }

    if (hero.row === GOAL_ROW) {
      var gx = goalCol * CELL + (CELL - HERO_SIZE) / 2;
      if (Math.abs(hx - gx) &lt; CELL * 0.9) {
        endGame(true);
        return;
      }
    }

    if ((hero.row === MID_SAFE || hero.row === START_ROW) &amp;&amp; !hasShield) {
      hasShield = true;
      updateShieldClass();
    }

    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    hero.col = nc;
    hero.row = nr;
    paintHero();
  }

  function endGame(didWin) {
    running = false;
    gameOver = true;
    won = didWin;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (didWin) showMsg(&#x27;🎉 Você venceu!&#x27;, &#x27;Você encontrou a sapinha. Aperte Reiniciar para jogar de novo.&#x27;);
    else showMsg(&#x27;💥 Fim de jogo&#x27;, &#x27;Escudo já estava quebrado. Aperte Reiniciar.&#x27;);
  }

  function startGame() {
    if (running) return;
    field.innerHTML = &#x27;&#x27;;
    hasShield = true;
    gameOver = false; won = false;
    hero.col = Math.floor(COLS / 2); hero.row = START_ROW;
    goalCol = Math.floor(COLS / 2);
    drawBackground();
    buildLanes();
    makeGoal();
    makeHero();
    updateShieldClass();
    paintHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    var k = (e.key || &#x27;&#x27;).toLowerCase();
    if (e.key === &#x27;ArrowLeft&#x27; || k === &#x27;a&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27; || k === &#x27;d&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27; || k === &#x27;w&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27; || k === &#x27;s&#x27;) { move(0, 1); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  drawBackground();
  buildLanes();
  makeGoal();
  makeHero();
  updateShieldClass();
  paintHero();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });

  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
