<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>STAR HUNTER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #e8e8ff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 2px; color: #b9d0ff; text-shadow: 0 0 12px #4a6cff; }
  .instructions { font-size: 16px; color: #9aa4d6; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #cfe0ff; margin: 0; }
  .field { position: relative; width: 620px; height: 420px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, #1a1440 0%, #0a0620 55%, #04020c 100%);
    border: 1px solid #2a2a55; box-shadow: inset 0 0 60px #000; }

  /* Flying saucer */
  .ship { position: absolute; width: 56px; height: 34px; z-index: 5; }
  .ship .dome { position: absolute; left: 16px; top: 0; width: 24px; height: 20px; border-radius: 50% 50% 40% 40%;
    background: radial-gradient(circle at 40% 30%, #bff3ff, #4fb3d9 70%, #2a6a8a);
    box-shadow: 0 0 10px #7fe0ff; }
  .ship .body { position: absolute; left: 0; top: 16px; width: 56px; height: 18px; border-radius: 50%;
    background: linear-gradient(#c9cede, #7a8098 60%, #4a4f66);
    box-shadow: 0 0 14px #5a6cff; }
  .ship .light { position: absolute; top: 24px; width: 6px; height: 6px; border-radius: 50%; background: #ffd24a;
    box-shadow: 0 0 6px #ffd24a; animation: blink 0.8s infinite alternate; }
  .ship .l1 { left: 10px; } .ship .l2 { left: 25px; animation-delay: 0.3s; } .ship .l3 { left: 40px; animation-delay: 0.6s; }
  @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

  /* Laser bolt */
  .bullet { position: absolute; width: 4px; height: 16px; border-radius: 2px; z-index: 4;
    background: linear-gradient(#fff, #ff4a6c);
    box-shadow: 0 0 8px #ff6a8a, 0 0 4px #fff; }

  /* Falling objects */
  .target { position: absolute; width: 34px; height: 34px; font-size: 30px; line-height: 34px; text-align: center; z-index: 3; }
  .target.star { color: #fff; text-shadow: 0 0 10px #fff6a0, 0 0 18px #ffcf4a; animation: spin 3s linear infinite; }
  .target.alien { text-shadow: 0 0 10px #6cff8a, 0 0 18px #2aff6a; animation: wobble 0.7s ease-in-out infinite alternate; }
  .target.heart { text-shadow: 0 0 10px #ff9ac8, 0 0 18px #ff4a9c; animation: beat 0.6s ease-in-out infinite alternate; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes wobble { from { transform: translateX(-4px) rotate(-8deg); } to { transform: translateX(4px) rotate(8deg); } }
  @keyframes beat { from { transform: scale(0.85); } to { transform: scale(1.15); } }

  /* Background scenery */
  .bgstar { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: 0.6; z-index: 1; }
  .scenery { position: absolute; z-index: 2; pointer-events: none; }
  .planet { width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd9a0, #d98a4a 55%, #7a3a1a 100%);
    box-shadow: 0 0 30px #ffae6a, inset -12px -8px 24px rgba(0,0,0,0.5); }
  .astro { font-size: 40px; }
  .shooter { width: 3px; height: 3px; background: #fff; border-radius: 50%;
    box-shadow: 0 0 6px #fff; }
  .shooter::after { content: &#x27;&#x27;; position: absolute; right: 2px; top: 1px; width: 60px; height: 1.5px;
    background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;STAR HUNTER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Fly with the &lt;strong&gt;&amp;larr; &amp;rarr; &amp;uarr; &amp;darr;&lt;/strong&gt; arrows and press &lt;strong&gt;Space&lt;/strong&gt; to blast stars (+1) and aliens (+2). Catch the pink hearts by flying into them for a bonus point — don&#x27;t shoot those! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;
      &lt;div class=&quot;dome&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;body&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;light l1&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;light l2&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;light l3&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 56, SHIP_H = 34, SHIP_SPEED = 6;
  var BULLET_W = 4, BULLET_H = 16, BULLET_SPEED = 8;
  var TARGET_SIZE = 34;
  var SPAWN_INTERVAL = 1200;
  var running = false, animId = null, spawnId = null, sceneryId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var shipY = FIELD_H - SHIP_H - 12;
  var bullets = [], targets = [], scenery = [];
  var score = 0;
  var lastShot = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  (function () {
    for (var i = 0; i &lt; 60; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;bgstar&#x27;;
      s.style.left = Math.random() * FIELD_W + &#x27;px&#x27;;
      s.style.top = Math.random() * FIELD_H + &#x27;px&#x27;;
      s.style.opacity = (0.2 + Math.random() * 0.6).toFixed(2);
      var sz = (1 + Math.random() * 2).toFixed(1);
      s.style.width = sz + &#x27;px&#x27;; s.style.height = sz + &#x27;px&#x27;;
      field.appendChild(s);
    }
  })();

  var audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = &#x27;square&#x27;; o.frequency.setValueAtTime(880, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.12);
      g.gain.setValueAtTime(0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.12);
    } catch (_) {}
  }
  function pop() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = &#x27;triangle&#x27;; o.frequency.setValueAtTime(500, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.15);
    } catch (_) {}
  }
  function chime() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = audioCtx.currentTime;
      [660, 990].forEach(function (f, k) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = &#x27;sine&#x27;; o.frequency.setValueAtTime(f, t0 + k * 0.08);
        g.gain.setValueAtTime(0.1, t0 + k * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + k * 0.08 + 0.2);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t0 + k * 0.08); o.stop(t0 + k * 0.08 + 0.2);
      });
    } catch (_) {}
  }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; ship.style.top = shipY + &#x27;px&#x27;; }

  function spawnTarget() {
    var r = Math.random();
    var kind = r &lt; 0.35 ? &#x27;alien&#x27; : (r &lt; 0.6 ? &#x27;heart&#x27; : &#x27;star&#x27;);
    var t = {
      x: Math.random() * (FIELD_W - TARGET_SIZE),
      y: -TARGET_SIZE,
      speed: 1.0 + Math.random() * 3.5,
      kind: kind,
      el: null
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target &#x27; + kind;
    el.textContent = kind === &#x27;alien&#x27; ? &#x27;\uD83D\uDC7E&#x27; : (kind === &#x27;heart&#x27; ? &#x27;\u2764\uFE0F&#x27; : &#x27;\u2B50&#x27;);
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnScenery() {
    var type = Math.random();
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;scenery&#x27;;
    var obj = { el: el, vx: 0, vy: 0, x: 0, y: 0 };
    if (type &lt; 0.4) {
      // shooting star, quick diagonal
      el.classList.add(&#x27;shooter&#x27;);
      obj.x = -80; obj.y = Math.random() * (FIELD_H * 0.5);
      obj.vx = 5 + Math.random() * 4; obj.vy = 1.5 + Math.random() * 1.5;
    } else if (type &lt; 0.7) {
      // planet drifting slowly across upper area
      el.classList.add(&#x27;planet&#x27;);
      obj.x = -100; obj.y = 10 + Math.random() * 60;
      obj.vx = 0.4 + Math.random() * 0.3; obj.vy = 0;
      obj.w = 90;
    } else {
      // astronaut tumbling past
      el.classList.add(&#x27;astro&#x27;);
      el.textContent = &#x27;\uD83D\uDC68\u200D\uD83D\uDE80&#x27;;
      obj.x = -50; obj.y = Math.random() * (FIELD_H - 80);
      obj.vx = 0.8 + Math.random() * 0.8; obj.vy = (Math.random() - 0.5) * 0.6;
      obj.spin = true; obj.rot = 0; obj.rotSpeed = (Math.random() - 0.5) * 6;
    }
    el.style.left = obj.x + &#x27;px&#x27;;
    el.style.top = obj.y + &#x27;px&#x27;;
    field.appendChild(el);
    scenery.push(obj);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: shipY - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
    beep();
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    if (keysDown[&#x27;ArrowUp&#x27;]) shipY -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowDown&#x27;]) shipY += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    shipY = Math.max(0, Math.min(FIELD_H - SHIP_H, shipY));
    paintShip();

    // scenery
    for (var s = scenery.length - 1; s &gt;= 0; s--) {
      var o = scenery[s];
      o.x += o.vx; o.y += o.vy;
      if (o.spin) { o.rot += o.rotSpeed; o.el.style.transform = &#x27;rotate(&#x27; + o.rot + &#x27;deg)&#x27;; }
      if (o.x &gt; FIELD_W + 120) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); scenery.splice(s, 1); continue; }
      o.el.style.left = o.x + &#x27;px&#x27;; o.el.style.top = o.y + &#x27;px&#x27;;
    }

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += t.speed;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }

    // ship catches hearts
    for (var h = targets.length - 1; h &gt;= 0; h--) {
      var th = targets[h];
      if (th.kind !== &#x27;heart&#x27;) continue;
      if (shipX &lt; th.x + TARGET_SIZE &amp;&amp; shipX + SHIP_W &gt; th.x &amp;&amp;
          shipY &lt; th.y + TARGET_SIZE &amp;&amp; shipY + SHIP_H &gt; th.y) {
        field.removeChild(th.el); targets.splice(h, 1);
        score += 1; scoreEl.textContent = score;
        chime();
      }
    }

    // bullet hits
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (t2.kind === &#x27;heart&#x27;) continue; // hearts aren&#x27;t shootable
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += t2.kind === &#x27;alien&#x27; ? 2 : 1; scoreEl.textContent = score;
          pop();
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    scenery.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    bullets = []; targets = []; scenery = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    shipY = FIELD_H - SHIP_H - 12;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    spawnScenery();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    sceneryId = setInterval(spawnScenery, 3500);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (sceneryId) { clearInterval(sceneryId); sceneryId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowDown&#x27;) {
      keysDown[e.key] = true; e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowDown&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,

        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);

    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport

<script>
(function () {

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
