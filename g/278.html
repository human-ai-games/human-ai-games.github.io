<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross the lanes</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Cross the lanes</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(160deg,#fef6ff,#eef4ff); color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; background: linear-gradient(90deg,#ff5f6d,#ffc371,#42e695,#3bb2b8,#845ec2); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #555; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #444; margin: 0; font-weight: 600; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; background: linear-gradient(180deg,#fffbe6 0 48px,#e8fff0 48px,#e6f7ff); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(80,60,140,0.18); }
  .goal-zone { position: absolute; left: 0; right: 0; top: 0; height: 48px; background: linear-gradient(90deg,#ffe259,#ffa751); box-shadow: 0 2px 6px rgba(255,170,80,0.5) inset; }
  .goal-zone::after { content: &quot;★ GOAL ★&quot;; position: absolute; width: 100%; text-align: center; line-height: 48px; font-weight: 700; color: #a6690a; letter-spacing: 2px; }
  .hero { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7fd8ff, #2b8cff 70%, #1667d6); box-shadow: 0 0 12px rgba(43,140,255,0.8), 0 2px 4px rgba(0,0,0,0.25); z-index: 5; }
  .obstacle { position: absolute; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .lane-divider { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.6); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cross the lanes&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the arrow keys, one cell at a time, and dodge the colorful obstacles in each lane. Reach the golden goal at the top to score — getting hit ends the round. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var OBSTACLE_W = CELL * 2 - 12, OBSTACLE_H = CELL - 16;
  var SPEED_MULT = 2.4;
  var LANE_COLORS = [
    &#x27;linear-gradient(135deg,#ff5f6d,#ffc371)&#x27;,
    &#x27;linear-gradient(135deg,#42e695,#3bb2b8)&#x27;,
    &#x27;linear-gradient(135deg,#845ec2,#d65db1)&#x27;,
    &#x27;linear-gradient(135deg,#f7971e,#ffd200)&#x27;,
    &#x27;linear-gradient(135deg,#00c6fb,#005bea)&#x27;,
    &#x27;linear-gradient(135deg,#f857a6,#ff5858)&#x27;,
    &#x27;linear-gradient(135deg,#43cea2,#185a9d)&#x27;
  ];
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // ---- Sound effects (Web Audio, procedural) ----
  var audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (_) { audioCtx = null; }
    }
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) { try { audioCtx.resume(); } catch (_) {} }
    return audioCtx;
  }
  function tone(freq, dur, type, vol, slideTo) {
    var ctx = getCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || &#x27;sine&#x27;;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function soundMove() { tone(320, 0.08, &#x27;square&#x27;, 0.08, 380); }
  function soundScore() {
    tone(660, 0.12, &#x27;sine&#x27;, 0.22, 880);
    setTimeout(function(){ tone(990, 0.16, &#x27;sine&#x27;, 0.2, 1320); }, 90);
  }
  function soundCrash() {
    tone(180, 0.35, &#x27;sawtooth&#x27;, 0.28, 60);
    tone(90, 0.4, &#x27;square&#x27;, 0.2, 40);
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = (0.5 + (i % 3) * 0.2) * SPEED_MULT;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.style.background = LANE_COLORS[i % LANE_COLORS.length];
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function drawGoal() {
    var g = document.createElement(&#x27;div&#x27;);
    g.className = &#x27;goal-zone&#x27;;
    field.appendChild(g);
  }

  function drawDividers() {
    for (var r = 1; r &lt; ROWS; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane-divider&#x27;;
      d.style.top = (r * CELL) + &#x27;px&#x27;;
      field.appendChild(d);
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var lane = lanes[laneIdx];
      for (var k = 0; k &lt; lane.obstacles.length; k++) {
        var o2 = lane.obstacles[k];
        if (hx &lt; o2.x + OBSTACLE_W &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
            hy &lt; lane.y + OBSTACLE_H &amp;&amp; hy + HERO_SIZE &gt; lane.y) {
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    if (nc !== hero.col || nr !== hero.row) soundMove();
    hero.col = nc;
    hero.row = nr;
    paintHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      soundScore();
      resetHero();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    soundCrash();
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function startGame() {
    if (running) return;
    getCtx();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    field.innerHTML = &#x27;&#x27;;
    drawGoal();
    drawDividers();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the field before pressing Start.
  drawGoal();
  drawDividers();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
