&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON FROGGER 2088&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Arrow keys hop your shades-wearing frog upward, dodging the flying spaceships and riding drifting lilypads across the neon water. Reach the top datastream to score — a crash, or falling in the water, ends the run.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;SCORE: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; BEST: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANE_TYPES = [&#x27;c&#x27;,&#x27;c&#x27;,&#x27;w&#x27;,&#x27;w&#x27;,&#x27;c&#x27;,&#x27;w&#x27;,&#x27;c&#x27;];
  var LANES = LANE_TYPES.length;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 10;
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var heroX = 0;
  var lanes = [];
  var score = 0, best = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var overlay = null;
  var boostTimer = null;

  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
      o.start(t); o.stop(t + (dur || 0.1));
    } catch (_) {}
  }
  function hopSound() { beep(520, 0.07, &#x27;square&#x27;, 0.05); }
  function scoreSound() { beep(700, 0.09, &#x27;triangle&#x27;, 0.08); setTimeout(function(){beep(1000,0.12,&#x27;triangle&#x27;,0.08);}, 90); }
  function crashSound() { beep(160, 0.35, &#x27;sawtooth&#x27;, 0.09); setTimeout(function(){beep(90,0.4,&#x27;sawtooth&#x27;,0.09);}, 120); }
  function splashSound() { beep(300,0.15,&#x27;sine&#x27;,0.09); setTimeout(function(){beep(140,0.3,&#x27;sine&#x27;,0.08);},80); }
  function boostSound() { beep(880,0.08,&#x27;square&#x27;,0.06); }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

  function makeStars() {
    var wrap = document.createElement(&#x27;div&#x27;);
    wrap.className = &#x27;stars&#x27;;
    for (var i = 0; i &lt; 70; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      var sz = rand(1, 2.6);
      s.style.width = sz + &#x27;px&#x27;;
      s.style.height = sz + &#x27;px&#x27;;
      s.style.left = rand(0, FIELD_W) + &#x27;px&#x27;;
      s.style.top = rand(0, FIELD_H * 0.8) + &#x27;px&#x27;;
      s.style.animationDelay = rand(0, 3) + &#x27;s&#x27;;
      wrap.appendChild(s);
    }
    field.appendChild(wrap);
  }

  // A rocket / spaceship SVG. dir: 1 points right, -1 points left. w,h in px.
  function shipSVG(w, h, dir, kind, color) {
    var flip = dir &lt; 0 ? &#x27; transform=&quot;scale(-1,1)&quot; transform-origin=&quot;20 20&quot;&#x27; : &#x27;&#x27;;
    var body;
    if (kind === 0) {
      // sleek rocket
      body =
        &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
        &#x27;&lt;path d=&quot;M4 20 L28 12 Q38 20 28 28 Z&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M28 12 Q38 20 28 28 L34 24 L34 16 Z&quot; fill=&quot;#fff&quot; opacity=&quot;0.7&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;14&quot; cy=&quot;20&quot; r=&quot;3.5&quot; fill=&quot;#0a1030&quot; stroke=&quot;#00f0ff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M6 20 L2 15 L6 17 Z&quot; fill=&quot;#ff2d55&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M6 20 L2 25 L6 23 Z&quot; fill=&quot;#ff2d55&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M4 20 L-4 20&quot; stroke=&quot;#ffb400&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot; opacity=&quot;0.85&quot;/&gt;&#x27; +
        &#x27;&lt;/g&gt;&#x27;;
    } else if (kind === 1) {
      // flying saucer
      body =
        &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;24&quot; rx=&quot;17&quot; ry=&quot;6&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;18&quot; rx=&quot;9&quot; ry=&quot;7&quot; fill=&quot;#bfefff&quot; opacity=&quot;0.85&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;9&quot; cy=&quot;24&quot; r=&quot;1.6&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;26&quot; r=&quot;1.6&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;31&quot; cy=&quot;24&quot; r=&quot;1.6&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
        &#x27;&lt;/g&gt;&#x27;;
    } else {
      // chunky cargo ship
      body =
        &#x27;&lt;g&#x27; + flip + &#x27;&gt;&#x27; +
        &#x27;&lt;rect x=&quot;6&quot; y=&quot;14&quot; width=&quot;26&quot; height=&quot;12&quot; rx=&quot;4&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M32 14 L38 20 L32 26 Z&quot; fill=&quot;#fff&quot; opacity=&quot;0.65&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;10&quot; y=&quot;17&quot; width=&quot;5&quot; height=&quot;6&quot; rx=&quot;1&quot; fill=&quot;#0a1030&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;18&quot; y=&quot;17&quot; width=&quot;5&quot; height=&quot;6&quot; rx=&quot;1&quot; fill=&quot;#0a1030&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M6 20 L-2 20&quot; stroke=&quot;#ffb400&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot; opacity=&quot;0.85&quot;/&gt;&#x27; +
        &#x27;&lt;/g&gt;&#x27;;
    }
    return &#x27;&lt;svg viewBox=&quot;0 0 40 40&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot; style=&quot;filter: drop-shadow(0 0 6px &#x27; + color + &#x27;);&quot;&gt;&#x27; + body + &#x27;&lt;/svg&gt;&#x27;;
  }

  var shipColors = [&#x27;#00f0ff&#x27;,&#x27;#ff00e5&#x27;,&#x27;#7cff00&#x27;,&#x27;#ffb400&#x27;,&#x27;#ff2d55&#x27;,&#x27;#00b3ff&#x27;];

  function buildLanes() {
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var type = LANE_TYPES[i];
      var laneRow = i + 1;
      var dir = (i % 2 === 0) ? 1 : -1;
      var baseSpeed = 0.7 + Math.random() * 0.7;
      var color = shipColors[i % shipColors.length];
      var obstacles = [];

      if (type === &#x27;c&#x27;) {
        var count = randInt(2, 3);
        var gap = FIELD_W / count;
        for (var j = 0; j &lt; count; j++) {
          // random ship size
          var sizeUnits = rand(0.9, 1.9);
          var ow = CELL * sizeUnits;
          var oh = CELL * (0.7 + (sizeUnits - 0.9) * 0.15);
          var oy = laneRow * CELL + (CELL - oh) / 2;
          var kind = randInt(0, 2);
          var x = j * gap + Math.random() * Math.max(4, gap - ow);
          var el = document.createElement(&#x27;div&#x27;);
          el.className = &#x27;obstacle&#x27;;
          el.style.top = oy + &#x27;px&#x27;;
          el.style.left = x + &#x27;px&#x27;;
          el.style.width = ow + &#x27;px&#x27;;
          el.style.height = oh + &#x27;px&#x27;;
          el.innerHTML = shipSVG(ow, oh, dir, kind, color);
          field.appendChild(el);
          obstacles.push({ x: x, el: el, w: ow, h: oh, y: oy });
        }
        lanes.push({ type: &#x27;c&#x27;, row: laneRow, dir: dir, speed: baseSpeed, baseSpeed: baseSpeed, obstacles: obstacles, boost: false });
      } else {
        var padY = laneRow * CELL + 4;
        var padH = CELL - 8;
        var wpeed = 0.5 + Math.random() * 0.6;
        var xcur = Math.random() * 60;
        while (xcur &lt; FIELD_W + 120) {
          var pw = CELL * (Math.random() &lt; 0.4 ? 2 : 1) - 8;
          var el2 = document.createElement(&#x27;div&#x27;);
          el2.className = &#x27;lily&#x27;;
          el2.style.width = pw + &#x27;px&#x27;;
          el2.style.height = padH + &#x27;px&#x27;;
          el2.style.top = padY + &#x27;px&#x27;;
          el2.style.left = xcur + &#x27;px&#x27;;
          el2.style.borderRadius = &#x27;50% / 40%&#x27;;
          el2.style.background = &#x27;radial-gradient(ellipse at 40% 35%, #6fffb0, #16a85a 70%, #0c6b38)&#x27;;
          el2.style.boxShadow = &#x27;0 0 12px rgba(0,255,140,0.5)&#x27;;
          field.appendChild(el2);
          obstacles.push({ x: xcur, el: el2, w: pw });
          xcur += pw + rand(CELL * 0.8, CELL * 2.4);
        }
        lanes.push({ type: &#x27;w&#x27;, row: laneRow, y: padY, dir: dir, speed: wpeed, baseSpeed: wpeed, obstacles: obstacles, boost: false });
      }
    }
  }

  function drawDividers() {
    var goal = document.createElement(&#x27;div&#x27;);
    goal.className = &#x27;goal-row&#x27;;
    goal.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(goal);
    for (var i = 0; i &lt; LANES; i++) {
      if (LANE_TYPES[i] === &#x27;w&#x27;) {
        var wr = document.createElement(&#x27;div&#x27;);
        wr.className = &#x27;water-row&#x27;;
        wr.style.top = ((i + 1) * CELL) + &#x27;px&#x27;;
        wr.style.height = CELL + &#x27;px&#x27;;
        field.appendChild(wr);
      }
    }
    for (var r = 1; r &lt; ROWS; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane-divider&#x27;;
      d.style.top = (r * CELL) + &#x27;px&#x27;;
      field.appendChild(d);
    }
  }

  function makeHero() {
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = frogSVG();
    field.appendChild(heroEl);
  }

  function frogSVG() {
    return &#x27;&#x27; +
      &#x27;&lt;svg viewBox=&quot;0 0 40 40&quot; width=&quot;&#x27; + HERO_SIZE + &#x27;&quot; height=&quot;&#x27; + HERO_SIZE + &#x27;&quot; style=&quot;filter: drop-shadow(0 0 6px #7cff00);&quot;&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;24&quot; rx=&quot;14&quot; ry=&quot;12&quot; fill=&quot;#39d353&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;26&quot; rx=&quot;10&quot; ry=&quot;8&quot; fill=&quot;#8bef7a&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;11&quot; cy=&quot;12&quot; r=&quot;7&quot; fill=&quot;#39d353&quot;/&gt;&#x27; +
        &#x27;&lt;circle cx=&quot;29&quot; cy=&quot;12&quot; r=&quot;7&quot; fill=&quot;#39d353&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;4&quot; y=&quot;9&quot; width=&quot;14&quot; height=&quot;8&quot; rx=&quot;2.5&quot; fill=&quot;#0a0a0a&quot; stroke=&quot;#00f0ff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;22&quot; y=&quot;9&quot; width=&quot;14&quot; height=&quot;8&quot; rx=&quot;2.5&quot; fill=&quot;#0a0a0a&quot; stroke=&quot;#00f0ff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;17&quot; y=&quot;11&quot; width=&quot;6&quot; height=&quot;2.5&quot; fill=&quot;#0a0a0a&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;6&quot; y=&quot;10.5&quot; width=&quot;5&quot; height=&quot;2&quot; rx=&quot;1&quot; fill=&quot;#00f0ff&quot; opacity=&quot;0.7&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;24&quot; y=&quot;10.5&quot; width=&quot;5&quot; height=&quot;2&quot; rx=&quot;1&quot; fill=&quot;#ff00e5&quot; opacity=&quot;0.7&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;7&quot; cy=&quot;32&quot; rx=&quot;4&quot; ry=&quot;2.5&quot; fill=&quot;#2fb845&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;33&quot; cy=&quot;32&quot; rx=&quot;4&quot; ry=&quot;2.5&quot; fill=&quot;#2fb845&quot;/&gt;&#x27; +
        &#x27;&lt;path d=&quot;M15 25 Q20 29 25 25&quot; stroke=&quot;#1a7d2b&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function paintHero() {
    var x = heroX * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    heroX = hero.col;
    paintHero();
  }

  function scheduleBoost() {
    if (boostTimer) clearTimeout(boostTimer);
    boostTimer = setTimeout(function () {
      if (!running) return;
      for (var i = 0; i &lt; lanes.length; i++) {
        lanes[i].boost = false;
        lanes[i].speed = lanes[i].baseSpeed;
        lanes[i].obstacles.forEach(function (o) { o.el.classList.remove(&#x27;boosting&#x27;); });
      }
      var idx = randInt(0, LANES - 1);
      var lane = lanes[idx];
      lane.boost = true;
      lane.speed = lane.baseSpeed * rand(2.2, 3.2);
      lane.obstacles.forEach(function (o) { o.el.classList.add(&#x27;boosting&#x27;); });
      boostSound();
      scheduleBoost();
    }, rand(2500, 5500));
  }

  function tick() {
    if (!running) return;
    var laneIdx = hero.row - 1;

    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      var dx = lane.dir * lane.speed;
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += dx;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -o.w - rand(0, 60);
        else if (lane.dir &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = FIELD_W + rand(0, 60);
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES &amp;&amp; lanes[laneIdx].type === &#x27;w&#x27;) {
      var wlane = lanes[laneIdx];
      var hxpx = heroX * CELL + (CELL - HERO_SIZE) / 2;
      var found = null;
      for (var k = 0; k &lt; wlane.obstacles.length; k++) {
        var p = wlane.obstacles[k];
        if (hxpx + HERO_SIZE * 0.5 &gt; p.x &amp;&amp; hxpx + HERO_SIZE * 0.5 &lt; p.x + p.w) { found = p; break; }
      }
      if (found) {
        heroX += (wlane.dir * wlane.speed) / CELL;
        hero.col = Math.round(heroX);
        if (heroX &lt; 0 || heroX &gt; COLS - 1) { drown(); return; }
        paintHero();
      } else { drown(); return; }
    }

    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES &amp;&amp; lanes[laneIdx].type === &#x27;c&#x27;) {
      var hx = heroX * CELL + (CELL - HERO_SIZE) / 2;
      var hy = hero.row * CELL + (CELL - HERO_SIZE) / 2;
      var clane = lanes[laneIdx];
      for (var m = 0; m &lt; clane.obstacles.length; m++) {
        var o2 = clane.obstacles[m];
        // shrink hitbox slightly for fairness
        var pad = 6;
        if (hx + pad &lt; o2.x + o2.w - pad &amp;&amp; hx + HERO_SIZE - pad &gt; o2.x + pad &amp;&amp;
            hy + pad &lt; o2.y + o2.h - pad &amp;&amp; hy + HERO_SIZE - pad &gt; o2.y + pad) {
          endGame(); return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    if (nc === hero.col &amp;&amp; nr === hero.row) return;
    hero.col = nc;
    hero.row = nr;
    heroX = nc;
    paintHero();
    hopSound();

    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES &amp;&amp; lanes[laneIdx].type === &#x27;w&#x27;) {
      var wlane = lanes[laneIdx];
      var hxpx = heroX * CELL + (CELL - HERO_SIZE) / 2;
      var onPad = false;
      for (var k = 0; k &lt; wlane.obstacles.length; k++) {
        var p = wlane.obstacles[k];
        if (hxpx + HERO_SIZE * 0.5 &gt; p.x &amp;&amp; hxpx + HERO_SIZE * 0.5 &lt; p.x + p.w) { onPad = true; break; }
      }
      if (!onPad) { drown(); return; }
    }

    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      if (score &gt; best) { best = score; bestEl.textContent = best; }
      scoreSound();
      resetHero();
    }
  }

  function drown() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (boostTimer) { clearTimeout(boostTimer); boostTimer = null; }
    splashSound();
    showOverlay(&#x27;SPLASH!&#x27;, &#x27;Fell in the void · Score &#x27; + score);
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (boostTimer) { clearTimeout(boostTimer); boostTimer = null; }
    crashSound();
    showOverlay(&#x27;BOOM!&#x27;, &#x27;Score &#x27; + score + &#x27; · Press Start to run again&#x27;);
  }

  function showOverlay(big, sub) {
    overlay = document.createElement(&#x27;div&#x27;);
    overlay.className = &#x27;overlay&#x27;;
    overlay.style.display = &#x27;flex&#x27;;
    overlay.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;&#x27; + big + &#x27;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;&#x27; + sub + &#x27;&lt;/div&gt;&#x27;;
    field.appendChild(overlay);
  }

  function startGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (boostTimer) { clearTimeout(boostTimer); boostTimer = null; }
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    field.innerHTML = &#x27;&#x27;;
    makeStars();
    drawDividers();
    buildLanes();
    makeHero();
    resetHero();
    running = true;
    scheduleBoost();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (boostTimer) { clearTimeout(boostTimer); boostTimer = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint (stopped state).
  makeStars();
  drawDividers();
  buildLanes();
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);

    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
