  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #eef; overflow: hidden;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ Ethereal Block Buster ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; to bounce the ball and smash the glowing blocks; catch power-ups and press &lt;strong&gt;Space&lt;/strong&gt; to release a stuck ball or fire lasers. Clear the funny shape before the timer runs out, or the blocks start descending!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Lvl: &lt;b id=&quot;level&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Balls: &lt;b id=&quot;balls&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot; id=&quot;timer&quot;&gt;2:00&lt;/div&gt;
    &lt;div class=&quot;power&quot; id=&quot;power&quot;&gt;&amp;nbsp;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var FIELD_W = 620, FIELD_H = 440;
  var PADDLE_H = 14, PADDLE_BOTTOM = 12, PADDLE_SPEED = 7;
  var BALL_SIZE = 14, BALL_SPEED = 4.2;
  var running = false, animId = null, frame = 0;
  var keysDown = {};
  var score = 0, level = 1;

  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var ballsEl = document.getElementById(&#x27;balls&#x27;);
  var powerEl = document.getElementById(&#x27;power&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);

  var paddle = { x: (FIELD_W-100)/2, w: 100, guns:0, gunTimer:0, sticky:0, bigTimer:0 };
  var balls = [], blocks = [], powerups = [], lasers = [], particles = [];
  var slowmo = 0;
  var descendPending = false;
  var timeLeft = 120, lastSec = 0;

  var BS = 26;
  // ---- funny shapes; each level picks the next one ----
  var SHAPES = [
    { name:&quot;Smiley&quot;, pat:[
      &quot;001111111100&quot;,&quot;011111111110&quot;,&quot;111221221111&quot;,&quot;111221221111&quot;,
      &quot;111111111111&quot;,&quot;111111111111&quot;,&quot;110111111011&quot;,&quot;111011110111&quot;,
      &quot;011111111110&quot;,&quot;001111111100&quot;] },
    { name:&quot;Ghost&quot;, pat:[
      &quot;001111110000&quot;,&quot;011111111000&quot;,&quot;112211221100&quot;,&quot;112211221100&quot;,
      &quot;111111111100&quot;,&quot;111111111100&quot;,&quot;111111111100&quot;,&quot;111111111100&quot;,
      &quot;101101101100&quot;,&quot;010010010000&quot;] },
    { name:&quot;Cat&quot;, pat:[
      &quot;100000000100&quot;,&quot;110000001100&quot;,&quot;111111111100&quot;,&quot;112211221100&quot;,
      &quot;111111111100&quot;,&quot;111133111100&quot;,&quot;111111111100&quot;,&quot;011111111000&quot;,
      &quot;001111110000&quot;,&quot;000110110000&quot;] },
    { name:&quot;Mushroom&quot;, pat:[
      &quot;000111111000&quot;,&quot;001114411100&quot;,&quot;011444444110&quot;,&quot;114444444411&quot;,
      &quot;144111114441&quot;,&quot;011111111110&quot;,&quot;000011110000&quot;,&quot;000011110000&quot;,
      &quot;000111111000&quot;,&quot;000111111000&quot;] },
    { name:&quot;Alien&quot;, pat:[
      &quot;001000001000&quot;,&quot;000100010000&quot;,&quot;001111111100&quot;,&quot;011221221110&quot;,
      &quot;111111111111&quot;,&quot;111011110111&quot;,&quot;111111111111&quot;,&quot;010111111010&quot;,
      &quot;010100001010&quot;,&quot;000100010000&quot;] },
    { name:&quot;Poop&quot;, pat:[
      &quot;000011110000&quot;,&quot;000122210000&quot;,&quot;001111111100&quot;,&quot;012221222100&quot;,
      &quot;011111111110&quot;,&quot;112212212211&quot;,&quot;111111111111&quot;,&quot;111111111111&quot;,
      &quot;011111111110&quot;,&quot;001111111100&quot;] }
  ];
  var shapeOrder = [];
  var blockOffY = 40;

  // color per code
  var CODECOL = { &quot;1&quot;:true, &quot;2&quot;:true, &quot;3&quot;:true, &quot;4&quot;:true };

  // ---------- AUDIO ----------
  var AC=null,masterGain=null,musicTimer=null;
  function initAudio(){ if(AC)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();masterGain=AC.createGain();masterGain.gain.value=0.5;masterGain.connect(AC.destination);}catch(e){AC=null;} }
  function beep(f,d,t,v,sl){ if(!AC)return; var o=AC.createOscillator(),g=AC.createGain(); o.type=t||&quot;square&quot;;o.frequency.value=f; if(sl)o.frequency.exponentialRampToValueAtTime(sl,AC.currentTime+d); g.gain.value=(v||0.2); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d); o.connect(g);g.connect(masterGain);o.start();o.stop(AC.currentTime+d+0.02); }
  function sfxHit(){beep(520,0.08,&quot;square&quot;,0.16,700);}
  function sfxPaddle(){beep(300,0.09,&quot;triangle&quot;,0.2,220);}
  function sfxLaser(){beep(880,0.12,&quot;sawtooth&quot;,0.12,200);}
  function sfxPower(){beep(440,0.1,&quot;sine&quot;,0.22,880);setTimeout(function(){beep(660,0.12,&quot;sine&quot;,0.22,1100);},90);}
  function sfxExplode(){beep(140,0.25,&quot;sawtooth&quot;,0.22,40);}
  function sfxLose(){beep(200,0.3,&quot;sawtooth&quot;,0.2,60);}
  function sfxLevel(){beep(523,0.12,&quot;sine&quot;,0.2,784);setTimeout(function(){beep(659,0.12,&quot;sine&quot;,0.2,988);},120);setTimeout(function(){beep(784,0.18,&quot;sine&quot;,0.2,1200);},240);}

  var musicStep=0;
  var BASS=[55,55,82.4,55,49,49,73.4,49,65.4,65.4,98,65.4,43.6,43.6,65.4,49];
  var ARP=[220,277,330,415,196,247,294,392,262,330,392,523,174,220,262,349];
  function musicTick(){
    if(!AC||!running)return;
    var b=BASS[musicStep%BASS.length],a=ARP[musicStep%ARP.length];
    var o=AC.createOscillator(),g=AC.createGain();o.type=&quot;triangle&quot;;o.frequency.value=b;g.gain.value=0.18;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.24);o.connect(g);g.connect(masterGain);o.start();o.stop(AC.currentTime+0.26);
    var o2=AC.createOscillator(),g2=AC.createGain();o2.type=&quot;sine&quot;;o2.frequency.value=a;g2.gain.value=0.09;g2.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.18);o2.connect(g2);g2.connect(masterGain);o2.start();o2.stop(AC.currentTime+0.2);
    if(musicStep%2===1){var o3=AC.createOscillator(),g3=AC.createGain();o3.type=&quot;sine&quot;;o3.frequency.value=a*2;g3.gain.value=0.05;g3.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.12);o3.connect(g3);g3.connect(masterGain);o3.start();o3.stop(AC.currentTime+0.14);}
    musicStep++;
  }
  function startMusic(){if(!AC)return;stopMusic();musicStep=0;musicTimer=setInterval(musicTick,170);}
  function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}

  // ---------- STARS ----------
  var stars=[];
  function initStars(){stars=[];for(var i=0;i&lt;60;i++)stars.push({x:Math.random()*FIELD_W,y:Math.random()*FIELD_H,r:Math.random()*1.6+0.4,ph:Math.random()*6.28,sp:0.2+Math.random()*0.5});}

  // ---------- BLOCKS ----------
  function currentShape(){ return SHAPES[shapeOrder[(level-1)%shapeOrder.length]]; }
  function buildBlocks(){
    blocks=[]; blockOffY=40;
    var sh=currentShape(); var pat=sh.pat;
    var cols=pat[0].length; var offX=(FIELD_W-cols*BS)/2;
    for(var r=0;r&lt;pat.length;r++)for(var c=0;c&lt;pat[r].length;c++){
      if(pat[r][c]===&quot;0&quot;)continue;
      blocks.push({x:offX+c*BS,y:blockOffY+r*BS,w:BS-2,h:BS-2,row:r,hue:(c*22+r*14)%360});
    }
  }

  function newBall(x,y,vx,vy){return {x:x,y:y,vx:vx,vy:vy,fire:0,stuck:false,offset:0};}
  function resetBalls(){balls=[ newBall(FIELD_W/2,FIELD_H-120,(Math.random()&lt;.5?-1:1)*BALL_SPEED,-BALL_SPEED) ];}

  function spawnParticles(x,y,hue,n){for(var i=0;i&lt;n;i++){var a=Math.random()*6.28,s=1+Math.random()*3.5;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24+Math.random()*14,hue:hue});}}

  var PTYPES=[&quot;laser&quot;,&quot;multi&quot;,&quot;fire&quot;,&quot;big&quot;,&quot;slow&quot;,&quot;sticky&quot;];
  var PMETA={laser:{c:&quot;#39ff14&quot;,label:&quot;⚡&quot;},multi:{c:&quot;#3fa9ff&quot;,label:&quot;◉&quot;},fire:{c:&quot;#ff5a1f&quot;,label:&quot;🔥&quot;},big:{c:&quot;#ff6ec4&quot;,label:&quot;↔&quot;},slow:{c:&quot;#a78bfa&quot;,label:&quot;❄&quot;},sticky:{c:&quot;#facc15&quot;,label:&quot;⬒&quot;}};
  function maybeDropPowerup(x,y){if(Math.random()&lt;0.18){var t=PTYPES[Math.floor(Math.random()*PTYPES.length)];powerups.push({x:x,y:y,vy:2.2,type:t,ph:Math.random()*6.28});}}

  function destroyBlock(idx){var b=blocks[idx];if(!b)return;spawnParticles(b.x+b.w/2,b.y+b.h/2,b.hue,10);score+=10;scoreEl.textContent=score;sfxHit();maybeDropPowerup(b.x+b.w/2,b.y+b.h/2);blocks.splice(idx,1);}
  function fireExplode(cx,cy){var R=46;sfxExplode();for(var i=blocks.length-1;i&gt;=0;i--){var b=blocks[i],bx=b.x+b.w/2,by=b.y+b.h/2;if((bx-cx)*(bx-cx)+(by-cy)*(by-cy)&lt;R*R)destroyBlock(i);}spawnParticles(cx,cy,20,18);}

  function applyPower(type){
    sfxPower();
    if(type===&quot;laser&quot;){paddle.guns=2;paddle.gunTimer=600;showPower(&quot;⚡ Laser Guns! (Space)&quot;);}
    else if(type===&quot;multi&quot;){var add=[];balls.forEach(function(b){add.push(newBall(b.x,b.y,-BALL_SPEED,-BALL_SPEED));add.push(newBall(b.x,b.y,BALL_SPEED,-BALL_SPEED));});balls=balls.concat(add);showPower(&quot;◉ Multi Ball!&quot;);}
    else if(type===&quot;fire&quot;){balls.forEach(function(b){b.fire=480;});showPower(&quot;🔥 Fireball!&quot;);}
    else if(type===&quot;big&quot;){paddle.w=160;paddle.bigTimer=600;showPower(&quot;↔ Big Paddle!&quot;);}
    else if(type===&quot;slow&quot;){slowmo=420;showPower(&quot;❄ Slow-Mo!&quot;);}
    else if(type===&quot;sticky&quot;){paddle.sticky=600;showPower(&quot;⬒ Sticky Catch!&quot;);}
  }
  var powerMsgTimer=0;
  function showPower(m){powerEl.textContent=m;powerMsgTimer=180;}

  function fireLasers(){if(paddle.guns&lt;=0)return;sfxLaser();var top=FIELD_H-PADDLE_BOTTOM-PADDLE_H;lasers.push({x:paddle.x+8,y:top});lasers.push({x:paddle.x+paddle.w-8,y:top});}

  function descendBlocks(){var moved=false;for(var i=0;i&lt;blocks.length;i++){blocks[i].y+=BS;moved=true;}if(moved)sfxExplode();}

  // reset everything for a fresh level (new ball, cleared powerups, sticky start)
  function newLevelSetup(){
    powerups=[];lasers=[];particles=[];slowmo=0;descendPending=false;
    paddle.w=100;paddle.guns=0;paddle.gunTimer=0;paddle.bigTimer=0;
    paddle.sticky=99999; // always start sticky
    resetBalls();
    // stick the starting ball to the paddle
    var paddleTop=FIELD_H-PADDLE_BOTTOM-PADDLE_H;
    balls[0].stuck=true; balls[0].offset=paddle.w/2-BALL_SIZE/2;
    balls[0].x=paddle.x+balls[0].offset; balls[0].y=paddleTop-BALL_SIZE;
    buildBlocks();
    timeLeft=120;lastSec=0;timerEl.textContent=&quot;2:00&quot;;timerEl.className=&quot;timer&quot;;
    ballsEl.textContent=balls.length;
    levelEl.textContent=level;
    showPower(&quot;⬒ Sticky start — &quot;+currentShape().name+&quot;!&quot;);
  }

  function tick(){
    if(!running)return;
    frame++;
    var speedMul=slowmo&gt;0?0.5:1;
    if(slowmo&gt;0)slowmo--;

    if(keysDown[&#x27;ArrowLeft&#x27;])paddle.x-=PADDLE_SPEED;
    if(keysDown[&#x27;ArrowRight&#x27;])paddle.x+=PADDLE_SPEED;
    paddle.x=Math.max(0,Math.min(FIELD_W-paddle.w,paddle.x));
    var paddleTop=FIELD_H-PADDLE_BOTTOM-PADDLE_H;

    if(paddle.gunTimer&gt;0){paddle.gunTimer--;if(paddle.gunTimer===0)paddle.guns=0;}
    if(paddle.bigTimer&gt;0){paddle.bigTimer--;if(paddle.bigTimer===0)paddle.w=100;}
    if(paddle.sticky&gt;0&amp;&amp;paddle.sticky&lt;99999)paddle.sticky--;

    if(timeLeft&gt;0){timeLeft-=1/60;if(timeLeft&lt;0)timeLeft=0;var sec=Math.ceil(timeLeft);if(sec!==lastSec){lastSec=sec;var m=Math.floor(sec/60),s=sec%60;timerEl.textContent=m+&quot;:&quot;+(s&lt;10?&quot;0&quot;:&quot;&quot;)+s;timerEl.className=&quot;timer&quot;+(sec&lt;=15?&quot; low&quot;:&quot;&quot;);}}
    else{timerEl.textContent=&quot;DESCENDING&quot;;timerEl.className=&quot;timer low&quot;;}

    for(var bi=balls.length-1;bi&gt;=0;bi--){
      var ball=balls[bi];
      if(ball.stuck){ball.x=paddle.x+ball.offset;ball.y=paddleTop-BALL_SIZE;continue;}
      ball.x+=ball.vx*speedMul;ball.y+=ball.vy*speedMul;
      if(ball.fire&gt;0)ball.fire--;
      if(ball.x&lt;=0){ball.x=0;ball.vx=-ball.vx;}
      if(ball.x+BALL_SIZE&gt;=FIELD_W){ball.x=FIELD_W-BALL_SIZE;ball.vx=-ball.vx;}
      if(ball.y&lt;=0){ball.y=0;ball.vy=-ball.vy;}
      if(ball.vy&gt;0&amp;&amp;ball.y+BALL_SIZE&gt;=paddleTop&amp;&amp;ball.y+BALL_SIZE&lt;=paddleTop+PADDLE_H+8&amp;&amp;ball.x+BALL_SIZE&gt;=paddle.x&amp;&amp;ball.x&lt;=paddle.x+paddle.w){
        sfxPaddle();
        if(paddle.sticky&gt;0){ball.stuck=true;ball.offset=ball.x-paddle.x;}
        else{ball.vy=-Math.abs(ball.vy);ball.y=paddleTop-BALL_SIZE;var hit=(ball.x+BALL_SIZE/2-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*BALL_SPEED*1.1;}
        if(timeLeft&lt;=0&amp;&amp;!descendPending)descendPending=true;
      }
      var cx=ball.x+BALL_SIZE/2,cy=ball.y+BALL_SIZE/2;
      for(var i=blocks.length-1;i&gt;=0;i--){var b=blocks[i];if(ball.x&lt;b.x+b.w&amp;&amp;ball.x+BALL_SIZE&gt;b.x&amp;&amp;ball.y&lt;b.y+b.h&amp;&amp;ball.y+BALL_SIZE&gt;b.y){if(ball.fire&gt;0){fireExplode(b.x+b.w/2,b.y+b.h/2);ball.vy=-ball.vy;}else{destroyBlock(i);var ox=Math.min(ball.x+BALL_SIZE-b.x,b.x+b.w-ball.x),oy=Math.min(ball.y+BALL_SIZE-b.y,b.y+b.h-ball.y);if(ox&lt;oy)ball.vx=-ball.vx;else ball.vy=-ball.vy;}break;}}
      if(ball.y&gt;=FIELD_H){balls.splice(bi,1);sfxLose();}
    }

    if(descendPending){descendBlocks();descendPending=false;}

    if(balls.length===0)resetBalls();
    ballsEl.textContent=balls.length;

    if(blocks.length===0){ level++; sfxLevel(); newLevelSetup(); }

    for(var li=lasers.length-1;li&gt;=0;li--){var L=lasers[li];L.y-=9;var hb=false;for(var i=blocks.length-1;i&gt;=0;i--){var b=blocks[i];if(L.x&gt;=b.x&amp;&amp;L.x&lt;=b.x+b.w&amp;&amp;L.y&lt;=b.y+b.h&amp;&amp;L.y&gt;=b.y){destroyBlock(i);hb=true;break;}}if(hb||L.y&lt;0)lasers.splice(li,1);}

    for(var pi=powerups.length-1;pi&gt;=0;pi--){var p=powerups[pi];p.y+=p.vy;p.ph+=0.1;if(p.y+11&gt;=paddleTop&amp;&amp;p.x&gt;=paddle.x&amp;&amp;p.x&lt;=paddle.x+paddle.w&amp;&amp;p.y&lt;paddleTop+PADDLE_H+11){applyPower(p.type);powerups.splice(pi,1);}else if(p.y&gt;FIELD_H)powerups.splice(pi,1);}

    for(var qi=particles.length-1;qi&gt;=0;qi--){var q=particles[qi];q.x+=q.vx;q.y+=q.vy;q.vy+=0.1;q.life--;if(q.life&lt;=0)particles.splice(qi,1);}

    if(powerMsgTimer&gt;0){powerMsgTimer--;if(powerMsgTimer===0)powerEl.innerHTML=&quot;&amp;nbsp;&quot;;}

    draw();
    animId=requestAnimationFrame(tick);
  }

  function draw(){
    var g=ctx.createLinearGradient(0,0,FIELD_W,FIELD_H);
    g.addColorStop(0,&quot;hsl(&quot;+((frame*0.6)%360)+&quot;,55%,14%)&quot;);
    g.addColorStop(0.5,&quot;hsl(&quot;+((frame*0.6+120)%360)+&quot;,50%,10%)&quot;);
    g.addColorStop(1,&quot;hsl(&quot;+((frame*0.6+240)%360)+&quot;,55%,15%)&quot;);
    ctx.fillStyle=g;ctx.fillRect(0,0,FIELD_W,FIELD_H);
    for(var i=0;i&lt;stars.length;i++){var s=stars[i];s.y+=s.sp;if(s.y&gt;FIELD_H)s.y=0;var tw=0.4+0.6*Math.abs(Math.sin(frame*0.05+s.ph));ctx.globalAlpha=tw;ctx.fillStyle=&quot;#fff&quot;;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();}
    ctx.globalAlpha=1;
    blocks.forEach(function(b){var hue=(b.hue+frame*1.5)%360;ctx.shadowColor=&quot;hsl(&quot;+hue+&quot;,90%,60%)&quot;;ctx.shadowBlur=12;ctx.fillStyle=&quot;hsl(&quot;+hue+&quot;,85%,60%)&quot;;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;ctx.fillStyle=&quot;hsla(&quot;+hue+&quot;,90%,80%,0.5)&quot;;ctx.fillRect(b.x,b.y,b.w,4);});

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {

    window.addEventListener(t, function (e) {

        window.parent.postMessage(

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });

  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
