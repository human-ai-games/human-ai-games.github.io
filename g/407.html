&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Runner Duel 🏃 vs 🏃&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Two runners race at once — &lt;strong style=&quot;color:#2e9e4f&quot;&gt;P1 press W&lt;/strong&gt;, &lt;strong style=&quot;color:#2f6fd0&quot;&gt;P2 press ↑&lt;/strong&gt; to jump. Dodge 🔺 (collect 🛡️ for protection), grab ⭐💎 for points, and outscore your rival before they crash!&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;arena&quot;&gt;
      &lt;div class=&quot;lane p1&quot;&gt;
        &lt;h2&gt;Player 1 (W)&lt;/h2&gt;

          &lt;div&gt;Score: &lt;span id=&quot;score1&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

        &lt;/div&gt;

          &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;hero&quot; id=&quot;hero1&quot;&gt;🏃&lt;/div&gt;
          &lt;div class=&quot;flash&quot; id=&quot;flash1&quot;&gt;&lt;/div&gt;

        &lt;div class=&quot;hud&quot;&gt;

          &lt;div class=&quot;lives&quot;&gt;🛡️ &lt;span id=&quot;lives2&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;field p2&quot; id=&quot;field2&quot;&gt;
          &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;

          &lt;div class=&quot;flash&quot; id=&quot;flash2&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var FIELD_W = 300, FIELD_H = 380;
  var GROUND_H = 26, HERO_SIZE = 34;
  var GRAVITY = 0.6, JUMP_V = -12.5;
  var BASE_SPEED = 3.2;

  var TYPES = {
    spike:   { emoji: &#x27;🔺&#x27;, size: 30, danger: true },
    star:    { emoji: &#x27;⭐&#x27;, size: 28, points: 1 },
    diamond: { emoji: &#x27;💎&#x27;, size: 28, points: 3 },
    shield:  { emoji: &#x27;🛡️&#x27;, size: 28, life: 1 }
  };

  var running = false, animId = null, spawnId = null, frame = 0;
  var banner = document.getElementById(&#x27;banner&#x27;);

  function makePlayer(idx) {
    return {
      idx: idx,
      field: document.getElementById(&#x27;field&#x27; + idx),
      hero: document.getElementById(&#x27;hero&#x27; + idx),
      scoreEl: document.getElementById(&#x27;score&#x27; + idx),
      livesEl: document.getElementById(&#x27;lives&#x27; + idx),
      flashEl: document.getElementById(&#x27;flash&#x27; + idx),
      deadEl: document.getElementById(&#x27;dead&#x27; + idx),
      x: 55,
      y: FIELD_H - GROUND_H - HERO_SIZE,
      vy: 0,
      score: 0,
      lives: 0,
      alive: true,
      items: []
    };
  }
  var players = [makePlayer(1), makePlayer(2)];

  function paintHero(p) {
    p.hero.style.left = p.x + &#x27;px&#x27;;
    p.hero.style.top = p.y + &#x27;px&#x27;;
    p.hero.textContent = &#x27;🏃&#x27;;
    // tint player 2&#x27;s runner blue-ish so the two are distinguishable
    p.hero.style.filter = p.idx === 2 ? &#x27;hue-rotate(180deg) saturate(1.4)&#x27; : &#x27;none&#x27;;
  }

  function makeItem(p, type, x, floatY) {
    var def = TYPES[type];
    var o = { type: type, def: def, x: x, taken: false, hit: false, el: null, size: def.size };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;item&#x27;;
    el.textContent = def.emoji;
    el.style.fontSize = def.size + &#x27;px&#x27;;
    el.style.width = def.size + &#x27;px&#x27;;
    el.style.height = def.size + &#x27;px&#x27;;
    el.style.lineHeight = def.size + &#x27;px&#x27;;
    if (def.danger) {
      o.y = FIELD_H - GROUND_H - def.size;
    } else {
      o.y = floatY != null ? floatY : (FIELD_H - GROUND_H - HERO_SIZE - 70);
    }
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = o.y + &#x27;px&#x27;;
    p.field.appendChild(el);
    o.el = el;
    p.items.push(o);
  }

  function spawnWave() {
    if (!running) return;
    var r = Math.random();
    var plan = [];
    if (r &lt; 0.5) {
      plan.push({ type: &#x27;spike&#x27;, x: FIELD_W, floatY: null });
      if (Math.random() &lt; 0.55) {
        var rw = Math.random();
        var t = rw &lt; 0.6 ? &#x27;star&#x27; : (rw &lt; 0.9 ? &#x27;diamond&#x27; : &#x27;shield&#x27;);
        plan.push({ type: t, x: FIELD_W + 4, floatY: FIELD_H - GROUND_H - HERO_SIZE - 66 });
      }
    } else {
      var rw2 = Math.random();
      var t2 = rw2 &lt; 0.55 ? &#x27;star&#x27; : (rw2 &lt; 0.8 ? &#x27;diamond&#x27; : &#x27;shield&#x27;);
      plan.push({ type: t2, x: FIELD_W, floatY: FIELD_H - GROUND_H - HERO_SIZE - (30 + Math.random() * 40) });
    }
    players.forEach(function (p) {
      if (!p.alive) return;
      plan.forEach(function (it) { makeItem(p, it.type, it.x, it.floatY); });
    });
  }

  function jump(p) {
    if (!running || !p.alive) return;
    if (p.y &gt;= FIELD_H - GROUND_H - HERO_SIZE - 1) p.vy = JUMP_V;
  }

  function overlap(p, o) {
    var pad = 5;
    return p.x + HERO_SIZE - pad &gt; o.x &amp;&amp; p.x + pad &lt; o.x + o.size &amp;&amp;
           p.y + HERO_SIZE - pad &gt; o.y &amp;&amp; p.y + pad &lt; o.y + o.size;
  }

  function doFlash(p) {
    p.flashEl.style.transition = &#x27;none&#x27;;
    p.flashEl.style.opacity = &#x27;1&#x27;;
    requestAnimationFrame(function () {
      p.flashEl.style.transition = &#x27;opacity 0.4s&#x27;;
      p.flashEl.style.opacity = &#x27;0&#x27;;
    });
  }

  function updatePlayer(p, speed) {
    if (!p.alive) return;
    p.vy += GRAVITY;
    p.y += p.vy;
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    if (p.y &gt; floorY) { p.y = floorY; p.vy = 0; }
    if (p.y &lt; 0) { p.y = 0; p.vy = 0; }
    paintHero(p);

    for (var i = p.items.length - 1; i &gt;= 0; i--) {
      var o = p.items[i];
      o.x -= speed;
      o.el.style.left = o.x + &#x27;px&#x27;;
      if (o.x + o.size &lt; 0) {
        p.field.removeChild(o.el);
        p.items.splice(i, 1);
        continue;
      }
      if (o.taken || o.hit) continue;
      if (overlap(p, o)) {
        if (o.def.danger) {
          o.hit = true;
          if (p.lives &gt; 0) {
            p.lives--;
            p.livesEl.textContent = p.lives;
            doFlash(p);
            o.el.style.transition = &#x27;opacity 0.3s, transform 0.3s&#x27;;
            o.el.style.opacity = &#x27;0&#x27;;
            o.el.style.transform = &#x27;scale(0.3)&#x27;;
          } else {
            killPlayer(p);
          }
        } else {
          o.taken = true;
          if (o.def.points) { p.score += o.def.points; p.scoreEl.textContent = p.score; }
          if (o.def.life) { p.lives += o.def.life; p.livesEl.textContent = p.lives; }
          o.el.style.transition = &#x27;opacity 0.3s, transform 0.3s&#x27;;
          o.el.style.opacity = &#x27;0&#x27;;
          o.el.style.transform = &#x27;translateY(-28px) scale(1.4)&#x27;;
        }
      }
    }
  }

  function killPlayer(p) {
    p.alive = false;
    p.deadEl.style.display = &#x27;block&#x27;;
    p.hero.style.opacity = &#x27;0.3&#x27;;
    if (players.every(function (q) { return !q.alive; })) {
      endMatch();
    }
  }

  function clearItems(p) {
    p.items.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    p.items = [];
  }

  function tick() {
    if (!running) return;
    frame++;
    var maxScore = Math.max(players[0].score, players[1].score);
    var speed = BASE_SPEED + Math.min(3, maxScore * 0.03);
    players.forEach(function (p) { updatePlayer(p, speed); });
    animId = requestAnimationFrame(tick);
  }

  function endMatch() {
    stopGame();
    var s1 = players[0].score, s2 = players[1].score;
    var msg;
    if (s1 &gt; s2) msg = &#x27;🏆 Player 1 wins! &#x27; + s1 + &#x27; – &#x27; + s2;
    else if (s2 &gt; s1) msg = &#x27;🏆 Player 2 wins! &#x27; + s2 + &#x27; – &#x27; + s1;
    else msg = &quot;🤝 It&#x27;s a tie! &quot; + s1 + &#x27; – &#x27; + s2;
    banner.innerHTML = msg + &#x27;&lt;br&gt;&lt;span style=&quot;font-size:15px&quot;&gt;Press Start below to rematch&lt;/span&gt;&#x27;;
    banner.style.display = &#x27;block&#x27;;
  }

  function resetPlayer(p) {
    p.x = 55;
    p.y = FIELD_H - GROUND_H - HERO_SIZE;
    p.vy = 0;
    p.score = 0;
    p.lives = 0;
    p.alive = true;
    p.scoreEl.textContent = &#x27;0&#x27;;
    p.livesEl.textContent = &#x27;0&#x27;;
    p.deadEl.style.display = &#x27;none&#x27;;
    p.hero.style.opacity = &#x27;1&#x27;;
    clearItems(p);
    paintHero(p);
  }

  function startGame() {
    if (running) return;
    banner.style.display = &#x27;none&#x27;;
    frame = 0;
    players.forEach(resetPlayer);
    spawnWave();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnWave, 1500);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;w&#x27; || e.key === &#x27;W&#x27;) { jump(players[0]); e.preventDefault(); }
    if (e.key === &#x27;ArrowUp&#x27;) { jump(players[1]); e.preventDefault(); }
  });
  players[0].field.addEventListener(&#x27;click&#x27;, function () { jump(players[0]); });
  players[1].field.addEventListener(&#x27;click&#x27;, function () { jump(players[1]); });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  players.forEach(function (p) {
    paintHero(p);
    makeItem(p, &#x27;spike&#x27;, FIELD_W - 90);
    makeItem(p, &#x27;star&#x27;, FIELD_W - 190, FIELD_H - GROUND_H - HERO_SIZE - 60);
  });
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
