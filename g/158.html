<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blobby Bounce</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Blobby Bounce</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; color: #e05a2b; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .statusbar { display: flex; gap: 20px; align-items: center; font-size: 22px; color: #555; }
  .powerup-status { font-size: 18px; color: #d68a00; min-height: 22px; font-weight: 600; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden;
    background: linear-gradient(#8ed6ff 0%, #b9e8ff 55%, #d8f2ff 70%); }
  .field.shielded { box-shadow: inset 0 0 0 5px rgba(255,215,0,0.7); }
  .field.slowed { filter: hue-rotate(-15deg) brightness(0.95); }
  .sun { position: absolute; top: 24px; right: 40px; width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle, #fff2a8 40%, #ffd93b 70%); box-shadow: 0 0 30px #ffe066; }
  .cloud { position: absolute; background: #fff; border-radius: 50%; opacity: 0.9; }
  .cloud::before, .cloud::after { content: &#x27;&#x27;; position: absolute; background: #fff; border-radius: 50%; }
  .cloud1 { width: 60px; height: 26px; top: 60px; }
  .cloud1::before { width: 34px; height: 34px; top: -14px; left: 10px; }
  .cloud1::after { width: 26px; height: 26px; top: -8px; left: 34px; }
  .cloud2 { width: 46px; height: 20px; top: 110px; }
  .cloud2::before { width: 26px; height: 26px; top: -12px; left: 8px; }
  .cloud2::after { width: 20px; height: 20px; top: -6px; left: 26px; }
  .hill { position: absolute; bottom: 30px; border-radius: 50% 50% 0 0; }
  .hill1 { width: 300px; height: 120px; left: -40px; background: #7ec850; }
  .hill2 { width: 340px; height: 150px; right: -60px; background: #6bb43e; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #55912f; box-shadow: inset 0 4px 0 #6bb43e; }
  .hero { position: absolute; width: 40px; height: 40px; z-index: 5; }
  .obstacle { position: absolute; z-index: 4; }
  .powerup { position: absolute; z-index: 4; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Blobby Bounce&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click) to jump — double-jump over tall monsters and stay low under flying ones. Grab the golden &lt;strong&gt;star&lt;/strong&gt; for a shield and the blue &lt;strong&gt;clock&lt;/strong&gt; to slow time!&lt;/p&gt;
  &lt;div class=&quot;statusbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;powerup-status&quot; id=&quot;powerupStatus&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;sun&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cloud cloud1&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cloud cloud2&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hill hill1&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hill hill2&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hero&quot; id=&quot;hero&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  var FIELD_W = 620, FIELD_H = 400;
  var GROUND_H = 30, HERO_SIZE = 40;
  var GRAVITY = 0.6, JUMP_V = -14;
  var OBSTACLE_W = 34, BASE_SPEED = 3.5;
  var SMALL_H = 30, BIG_H = 62, FLY_H = 40;
  var FLY_OFFSET = HERO_SIZE + 18;
  var SPAWN_INTERVAL = 2000;
  var PU_SIZE = 30;
  var running = false, animId = null, spawnId = null, puSpawnId = null;
  var heroX = 60;
  var heroY = FIELD_H - GROUND_H - HERO_SIZE;
  var heroVY = 0;
  var jumpsUsed = 0;
  var obstacles = [];
  var powerups = [];
  var score = 0;
  var gameOver = false;
  var wobble = 0;
  var frame = 0;
  // power-up state
  var shieldActive = false;
  var slowTimer = 0;   // frames of slow remaining
  var field = document.getElementById(&#x27;field&#x27;);
  var hero = document.getElementById(&#x27;hero&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var statusEl = document.getElementById(&#x27;powerupStatus&#x27;);

  function currentSpeed() { return slowTimer &gt; 0 ? BASE_SPEED * 0.5 : BASE_SPEED; }

  function heroSVG(squash) {
    var ry = 20 - squash;
    var rx = 20 + squash * 0.6;
    var cy = 22 + squash;
    return &#x27;&lt;svg width=&quot;40&quot; height=&quot;40&quot; viewBox=&quot;0 0 40 40&quot;&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;&#x27;+cy+&#x27;&quot; rx=&quot;&#x27;+rx+&#x27;&quot; ry=&quot;&#x27;+ry+&#x27;&quot; fill=&quot;#ff5ea8&quot; stroke=&quot;#d63384&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;14&quot; cy=&quot;&#x27;+(cy-4)+&#x27;&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;&#x27;+(cy-4)+&#x27;&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;15&quot; cy=&quot;&#x27;+(cy-4)+&#x27;&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;27&quot; cy=&quot;&#x27;+(cy-4)+&#x27;&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M13 &#x27;+(cy+5)+&#x27; Q20 &#x27;+(cy+11)+&#x27; 27 &#x27;+(cy+5)+&#x27;&quot; stroke=&quot;#d63384&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function monsterSVG(w, h) {
    var color = h &gt; 45 ? &#x27;#7d3cff&#x27; : &#x27;#3ca55c&#x27;;
    var dark = h &gt; 45 ? &#x27;#5a24c9&#x27; : &#x27;#2b7a44&#x27;;
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 &#x27;+w+&#x27; &#x27;+h+&#x27;&quot;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;2&quot; y=&quot;&#x27;+(h*0.25)+&#x27;&quot; width=&quot;&#x27;+(w-4)+&#x27;&quot; height=&quot;&#x27;+(h*0.75)+&#x27;&quot; rx=&quot;8&quot; fill=&quot;&#x27;+color+&#x27;&quot; stroke=&quot;&#x27;+dark+&#x27;&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;polygon points=&quot;2,&#x27;+(h*0.28)+&#x27; &#x27;+(w*0.25)+&#x27;,&#x27;+(h*0.05)+&#x27; &#x27;+(w*0.5)+&#x27;,&#x27;+(h*0.28)+&#x27; &#x27;+(w*0.75)+&#x27;,&#x27;+(h*0.05)+&#x27; &#x27;+(w-2)+&#x27;,&#x27;+(h*0.28)+&#x27;&quot; fill=&quot;&#x27;+color+&#x27;&quot; stroke=&quot;&#x27;+dark+&#x27;&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.32)+&#x27;&quot; cy=&quot;&#x27;+(h*0.45)+&#x27;&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.68)+&#x27;&quot; cy=&quot;&#x27;+(h*0.45)+&#x27;&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.32)+&#x27;&quot; cy=&quot;&#x27;+(h*0.45)+&#x27;&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.68)+&#x27;&quot; cy=&quot;&#x27;+(h*0.45)+&#x27;&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;&#x27;+(w*0.22)+&#x27;&quot; y1=&quot;&#x27;+(h*0.32)+&#x27;&quot; x2=&quot;&#x27;+(w*0.42)+&#x27;&quot; y2=&quot;&#x27;+(h*0.4)+&#x27;&quot; stroke=&quot;#222&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;&#x27;+(w*0.78)+&#x27;&quot; y1=&quot;&#x27;+(h*0.32)+&#x27;&quot; x2=&quot;&#x27;+(w*0.58)+&#x27;&quot; y2=&quot;&#x27;+(h*0.4)+&#x27;&quot; stroke=&quot;#222&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M&#x27;+(w*0.32)+&#x27; &#x27;+(h*0.72)+&#x27; Q&#x27;+(w*0.5)+&#x27; &#x27;+(h*0.6)+&#x27; &#x27;+(w*0.68)+&#x27; &#x27;+(h*0.72)+&#x27;&quot; stroke=&quot;#222&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function flyerSVG(w, h, wingUp) {
    var wy = wingUp ? h*0.18 : h*0.42;
    return &#x27;&lt;svg width=&quot;&#x27;+w+&#x27;&quot; height=&quot;&#x27;+h+&#x27;&quot; viewBox=&quot;0 0 &#x27;+w+&#x27; &#x27;+h+&#x27;&quot;&gt;&#x27; +
      &#x27;&lt;path d=&quot;M&#x27;+(w*0.28)+&#x27; &#x27;+(h*0.5)+&#x27; Q&#x27;+(w*-0.1)+&#x27; &#x27;+wy+&#x27; 2 &#x27;+(h*0.6)+&#x27; Q&#x27;+(w*0.12)+&#x27; &#x27;+(h*0.55)+&#x27; &#x27;+(w*0.28)+&#x27; &#x27;+(h*0.62)+&#x27; Z&quot; fill=&quot;#c1440e&quot; stroke=&quot;#8a2e07&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M&#x27;+(w*0.72)+&#x27; &#x27;+(h*0.5)+&#x27; Q&#x27;+(w*1.1)+&#x27; &#x27;+wy+&#x27; &#x27;+(w-2)+&#x27; &#x27;+(h*0.6)+&#x27; Q&#x27;+(w*0.88)+&#x27; &#x27;+(h*0.55)+&#x27; &#x27;+(w*0.72)+&#x27; &#x27;+(h*0.62)+&#x27; Z&quot; fill=&quot;#c1440e&quot; stroke=&quot;#8a2e07&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;&#x27;+(w*0.5)+&#x27;&quot; cy=&quot;&#x27;+(h*0.55)+&#x27;&quot; rx=&quot;&#x27;+(w*0.26)+&#x27;&quot; ry=&quot;&#x27;+(h*0.32)+&#x27;&quot; fill=&quot;#ff7b3d&quot; stroke=&quot;#c1440e&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.4)+&#x27;&quot; cy=&quot;&#x27;+(h*0.5)+&#x27;&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.6)+&#x27;&quot; cy=&quot;&#x27;+(h*0.5)+&#x27;&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.4)+&#x27;&quot; cy=&quot;&#x27;+(h*0.5)+&#x27;&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;&#x27;+(w*0.6)+&#x27;&quot; cy=&quot;&#x27;+(h*0.5)+&#x27;&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M&#x27;+(w*0.4)+&#x27; &#x27;+(h*0.72)+&#x27; Q&#x27;+(w*0.5)+&#x27; &#x27;+(h*0.64)+&#x27; &#x27;+(w*0.6)+&#x27; &#x27;+(h*0.72)+&#x27;&quot; stroke=&quot;#222&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function starSVG(s) {
    return &#x27;&lt;svg width=&quot;&#x27;+s+&#x27;&quot; height=&quot;&#x27;+s+&#x27;&quot; viewBox=&quot;0 0 30 30&quot;&gt;&#x27; +
      &#x27;&lt;polygon points=&quot;15,2 19,11 29,11 21,17 24,27 15,21 6,27 9,17 1,11 11,11&quot; fill=&quot;#ffd400&quot; stroke=&quot;#d68a00&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }
  function clockSVG(s) {
    return &#x27;&lt;svg width=&quot;&#x27;+s+&#x27;&quot; height=&quot;&#x27;+s+&#x27;&quot; viewBox=&quot;0 0 30 30&quot;&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;15&quot; cy=&quot;15&quot; r=&quot;12&quot; fill=&quot;#4fa8ff&quot; stroke=&quot;#1e6fd6&quot; stroke-width=&quot;2&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;15&quot; y1=&quot;15&quot; x2=&quot;15&quot; y2=&quot;7&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;15&quot; y1=&quot;15&quot; x2=&quot;20&quot; y2=&quot;17&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function paintHero() {
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    var squash = 0;
    if (heroY &gt;= floorY - 1) squash = 4 + Math.sin(wobble) * 1.5;
    else squash = -2;
    hero.innerHTML = heroSVG(squash);
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;
  }

  function makeObstacle(x) {
    var r = Math.random();
    var type, h;
    if (r &lt; 0.45) { type = &#x27;small&#x27;; h = SMALL_H; }
    else if (r &lt; 0.75) { type = &#x27;big&#x27;; h = BIG_H; }
    else { type = &#x27;fly&#x27;; h = FLY_H; }

    var o = { x: x, h: h, type: type, scored: false, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    el.style.left = o.x + &#x27;px&#x27;;
    el.style.width = OBSTACLE_W + &#x27;px&#x27;;
    el.style.height = h + &#x27;px&#x27;;

    if (type === &#x27;fly&#x27;) {
      o.bottom = GROUND_H + FLY_OFFSET;
      el.style.bottom = o.bottom + &#x27;px&#x27;;
      el.innerHTML = flyerSVG(OBSTACLE_W, h, false);
    } else {
      o.bottom = GROUND_H;
      el.style.bottom = GROUND_H + &#x27;px&#x27;;
      el.innerHTML = monsterSVG(OBSTACLE_W, h);
    }
    field.appendChild(el);
    o.el = el;
    obstacles.push(o);
  }

  function spawnObstacle() { makeObstacle(FIELD_W); }

  function spawnPowerup() {
    if (!running) return;
    var kind = Math.random() &lt; 0.5 ? &#x27;shield&#x27; : &#x27;slow&#x27;;
    // float somewhere in the mid-air band so player must jump to reach it
    var bottom = GROUND_H + 40 + Math.random() * 120;
    var pu = { x: FIELD_W, bottom: bottom, kind: kind, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.style.left = pu.x + &#x27;px&#x27;;
    el.style.bottom = bottom + &#x27;px&#x27;;
    el.style.width = PU_SIZE + &#x27;px&#x27;;
    el.style.height = PU_SIZE + &#x27;px&#x27;;
    el.innerHTML = kind === &#x27;shield&#x27; ? starSVG(PU_SIZE) : clockSVG(PU_SIZE);
    field.appendChild(el);
    pu.el = el;
    powerups.push(pu);
  }

  function jump() {
    if (!running || gameOver) return;
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    if (heroY &gt;= floorY - 1) { heroVY = JUMP_V; jumpsUsed = 1; }
    else if (jumpsUsed &lt; 2) { heroVY = JUMP_V; jumpsUsed = 2; }
  }

  function updateStatus() {
    var parts = [];
    if (shieldActive) parts.push(&#x27;★ Shield&#x27;);
    if (slowTimer &gt; 0) parts.push(&#x27;⏱ Slow &#x27; + Math.ceil(slowTimer/60) + &#x27;s&#x27;);
    statusEl.textContent = parts.join(&#x27;   &#x27;);
    field.classList.toggle(&#x27;shielded&#x27;, shieldActive);
    field.classList.toggle(&#x27;slowed&#x27;, slowTimer &gt; 0);
  }

  function tick() {
    if (!running) return;
    wobble += 0.2;
    frame++;
    if (slowTimer &gt; 0) slowTimer--;
    var spd = currentSpeed();

    heroVY += GRAVITY;
    heroY += heroVY;
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    if (heroY &gt; floorY) { heroY = floorY; heroVY = 0; jumpsUsed = 0; }
    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }
    paintHero();

    var heroTop = heroY, heroBot = heroY + HERO_SIZE;

    // power-ups
    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.x -= spd;
      pu.el.style.left = pu.x + &#x27;px&#x27;;
      if (pu.x + PU_SIZE &lt; 0) {
        field.removeChild(pu.el);
        powerups.splice(p, 1);
        continue;
      }
      var puTop = FIELD_H - pu.bottom - PU_SIZE;
      var puBot = FIELD_H - pu.bottom;
      if (heroX + HERO_SIZE - 6 &gt; pu.x &amp;&amp; heroX + 6 &lt; pu.x + PU_SIZE &amp;&amp;
          heroBot &gt; puTop + 4 &amp;&amp; heroTop &lt; puBot - 4) {
        if (pu.kind === &#x27;shield&#x27;) shieldActive = true;
        else slowTimer = 5 * 60; // 5 seconds
        field.removeChild(pu.el);
        powerups.splice(p, 1);
        updateStatus();
        continue;
      }
    }

    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= spd;
      o.el.style.left = o.x + &#x27;px&#x27;;
      if (o.type === &#x27;fly&#x27;) {
        o.el.innerHTML = flyerSVG(OBSTACLE_W, o.h, (Math.floor(frame/8) % 2) === 0);
      }
      if (o.x + OBSTACLE_W &lt; 0) {
        field.removeChild(o.el);
        obstacles.splice(i, 1);
        continue;
      }
      if (!o.scored &amp;&amp; o.x + OBSTACLE_W &lt; heroX) {
        o.scored = true;
        score += 1;
        scoreEl.textContent = score;
      }
      var obTop = FIELD_H - o.bottom - o.h;
      var obBot = FIELD_H - o.bottom;
      var xOverlap = (heroX + HERO_SIZE - 4 &gt; o.x) &amp;&amp; (heroX + 4 &lt; o.x + OBSTACLE_W);
      var yOverlap = (heroBot &gt; obTop + 4) &amp;&amp; (heroTop &lt; obBot - 4);
      if (xOverlap &amp;&amp; yOverlap) {
        if (shieldActive) {
          // shield absorbs one hit and destroys the monster
          shieldActive = false;
          field.removeChild(o.el);
          obstacles.splice(i, 1);
          updateStatus();
          continue;
        }
        gameOver = true;
        stopGame();
        return;
      }
    }
    updateStatus();
    animId = requestAnimationFrame(tick);
  }

  function clearObstacles() {
