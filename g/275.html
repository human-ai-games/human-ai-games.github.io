<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .status { font-size: 22px; color: #555; margin: 0; display: flex; gap: 24px; }
  .slowmo { color: #1976d2; font-weight: 600; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; background: #6fae5f; border-radius: 8px; overflow: hidden; }
  .hero { position: absolute; background: #ffca28; border: 3px solid #f57f17; border-radius: 6px; z-index: 5; box-sizing: border-box; }
  .obstacle { position: absolute; border-radius: 5px; z-index: 2; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
  .powerup { position: absolute; background: #1976d2; border-radius: 50%; z-index: 3; box-shadow: 0 0 8px #64b5f6; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
  .lane { position: absolute; left: 0; right: 0; z-index: 1; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Endless lane climb&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the arrow keys and dodge the colorful vehicles as the road scrolls down beneath you. Score a point for every lane you cross going up, grab the blue ❄ to slow time, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;status&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;slowmo&quot; id=&quot;slowmo&quot; style=&quot;visibility:hidden&quot;&gt;Slow-mo: &lt;span id=&quot;slowmoTime&quot;&gt;0&lt;/span&gt;s&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var FIELD_W = COLS * CELL;      // 576... adjust field width below
  var VISIBLE_ROWS = 9;
  var FIELD_H = VISIBLE_ROWS * CELL; // 432
  var HERO_SIZE = CELL - 12;

  var running = false, animId = null, gameOver = false;
  var score = 0;
  var slowmoFrames = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var slowmoEl = document.getElementById(&#x27;slowmo&#x27;);
  var slowmoTimeEl = document.getElementById(&#x27;slowmoTime&#x27;);
  var heroEl = null;

  // World coordinates: y increases downward. The camera shows a window of the
  // world. hero.worldRow is the hero&#x27;s absolute row in the world (higher =
  // further up = climbed more). We keep the hero near the middle/bottom of
  // the visible window and scroll the world.

  var VEHICLE_COLORS = [&#x27;#e53935&#x27;, &#x27;#8e24aa&#x27;, &#x27;#3949ab&#x27;, &#x27;#00897b&#x27;, &#x27;#fb8c00&#x27;, &#x27;#d81b60&#x27;, &#x27;#43a047&#x27;, &#x27;#5e35b1&#x27;];
  var LANE_SIZES = [1, 2, 1.5, 3, 2, 2.5, 3.5];
  var LANE_HEIGHTS = [CELL - 22, CELL - 12, CELL - 16, CELL - 8, CELL - 12, CELL - 10, CELL - 6];

  // Camera: worldTop = world row at top of visible field.
  var camTop = 0;           // fractional world-row at top of the view
  var hero = { col: Math.floor(COLS / 2), worldRow: 0 };
  var lanes = {};           // worldRow -&gt; lane object (only obstacle lanes)
  var laneEls = {};         // worldRow -&gt; background stripe element
  var powerup = null;       // { col, worldRow, el }
  var maxRowReached = 0;    // highest (smallest worldRow value) climbed =&gt; for scoring
  var minWorldRow = 0;      // lowest world row = starting; hero starts here
  var generatedUpTo = 0;    // smallest worldRow we have generated lanes for

  function laneStripeColor(worldRow) {
    // Alternate two shades of grey for the road; every 5th is grass-safe.
    return (worldRow % 2 === 0) ? &#x27;#555b60&#x27; : &#x27;#4b5155&#x27;;
  }

  function makeLane(worldRow) {
    // worldRow negative = climbed up. Every lane above the start (worldRow&lt;0)
    // is a road lane with vehicles. Occasionally a safe grass row.
    if (lanes[worldRow] !== undefined || laneEls[worldRow] !== undefined) return;
    var isSafe = (worldRow % 4 === 0);   // safe strip every 4 rows
    var stripe = document.createElement(&#x27;div&#x27;);
    stripe.className = &#x27;lane&#x27;;
    stripe.style.height = CELL + &#x27;px&#x27;;
    stripe.style.background = isSafe ? &#x27;#6fae5f&#x27; : laneStripeColor(worldRow);
    field.appendChild(stripe);
    laneEls[worldRow] = stripe;

    if (isSafe || worldRow &gt;= 0) {
      lanes[worldRow] = { safe: true, obstacles: [] };
      return;
    }
    var idx = Math.abs(worldRow) % LANE_SIZES.length;
    var obW = LANE_SIZES[idx] * CELL - 8;
    var obH = LANE_HEIGHTS[idx];
    var dir = (worldRow % 2 === 0) ? 1 : -1;
    var speed = 1.2 + (3.5 - LANE_SIZES[idx]) * 0.6 + Math.min(Math.abs(worldRow) * 0.03, 2);
    var color = VEHICLE_COLORS[Math.abs(worldRow) % VEHICLE_COLORS.length];
    var count = LANE_SIZES[idx] &gt;= 3 ? 2 : 3;
    var gap = FIELD_W / count;
    var obstacles = [];
    for (var j = 0; j &lt; count; j++) {
      var x = j * gap + (Math.abs(worldRow) * 30) % gap;
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;obstacle&#x27;;
      el.style.width = obW + &#x27;px&#x27;;
      el.style.height = obH + &#x27;px&#x27;;
      el.style.background = color;
      field.appendChild(el);
      obstacles.push({ x: x, el: el });
    }
    lanes[worldRow] = { safe: false, obstacles: obstacles, obW: obW, obH: obH, dir: dir, speed: speed, obH2: obH };
  }

  function ensureGenerated() {
    // Generate lanes from a bit below the view to well above the view.
    var topRow = Math.floor(camTop) - 2;
    var botRow = Math.floor(camTop) + VISIBLE_ROWS + 2;
    for (var r = topRow; r &lt;= botRow; r++) makeLane(r);
    // Clean up lanes that are far below the view.
    for (var key in lanes) {
      var wr = parseInt(key, 10);
      if (wr &gt; botRow + 3) {
        var lane = lanes[wr];
        if (lane.obstacles) lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
        if (laneEls[wr] &amp;&amp; laneEls[wr].parentNode) laneEls[wr].parentNode.removeChild(laneEls[wr]);
        delete lanes[wr];
        delete laneEls[wr];
      }
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function worldRowToY(worldRow) {
    return (worldRow - camTop) * CELL;
  }

  function paint() {
    // Lane stripes.
    for (var key in laneEls) {
      var wr = parseInt(key, 10);
      laneEls[key].style.top = worldRowToY(wr) + &#x27;px&#x27;;
    }
    // Obstacles.
    for (var k2 in lanes) {
      var lane = lanes[k2];
      if (lane.safe) continue;
      var y = worldRowToY(parseInt(k2, 10)) + (CELL - lane.obH) / 2;
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.el.style.left = o.x + &#x27;px&#x27;;
        o.el.style.top = y + &#x27;px&#x27;;
      }
    }
    // Power-up.
    if (powerup) {
      var size = CELL - 16;
      powerup.el.style.left = (powerup.col * CELL + (CELL - size) / 2) + &#x27;px&#x27;;
      powerup.el.style.top = (worldRowToY(powerup.worldRow) + (CELL - size) / 2) + &#x27;px&#x27;;
    }
    // Hero.
    var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var hy = worldRowToY(hero.worldRow) + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = hx + &#x27;px&#x27;;
    heroEl.style.top = hy + &#x27;px&#x27;;
  }

  function spawnPowerup() {
    if (powerup) return;
    // Spawn a few rows above the hero, on a road lane if possible.
    var targetRow = hero.worldRow - (2 + Math.floor(Math.random() * 4));
    makeLane(targetRow);
    var col = Math.floor(Math.random() * COLS);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    var size = CELL - 16;
    el.style.width = size + &#x27;px&#x27;;
    el.style.height = size + &#x27;px&#x27;;
    el.textContent = &#x27;❄&#x27;;
    field.appendChild(el);
    powerup = { col: col, worldRow: targetRow, el: el };
  }

  function removePowerup() {
    if (powerup &amp;&amp; powerup.el.parentNode) powerup.el.parentNode.removeChild(powerup.el);
    powerup = null;
  }

  function updateSlowmoUI() {
    if (slowmoFrames &gt; 0) {
      slowmoEl.style.visibility = &#x27;visible&#x27;;
      slowmoTimeEl.textContent = Math.ceil(slowmoFrames / 60);
      field.classList.add(&#x27;slowmo-active&#x27;);
    } else {
      slowmoEl.style.visibility = &#x27;hidden&#x27;;
      field.classList.remove(&#x27;slowmo-active&#x27;);
    }
  }

  function checkPickup() {
    if (powerup &amp;&amp; powerup.col === hero.col &amp;&amp; powerup.worldRow === hero.worldRow) {
      slowmoFrames = 5 * 60;
      removePowerup();
      updateSlowmoUI();
    }
  }

  function tick() {
    if (!running) return;
    var speedFactor = slowmoFrames &gt; 0 ? 0.35 : 1;
    if (slowmoFrames &gt; 0) slowmoFrames--;

    // Smoothly scroll camera so the hero sits about 6 rows down from top.
    var targetCamTop = hero.worldRow - 6;
    camTop += (targetCamTop - camTop) * 0.15;
    if (Math.abs(targetCamTop - camTop) &lt; 0.01) camTop = targetCamTop;

    ensureGenerated();

    // Move obstacles.
    for (var key in lanes) {
      var lane = lanes[key];
      if (lane.safe) continue;
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed * speedFactor;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -lane.obW;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + lane.obW &lt; 0) o.x = FIELD_W;
      }
    }

    updateSlowmoUI();
    checkPickup();
    paint();

    // Collision check on the hero&#x27;s current lane.
    var lane2 = lanes[hero.worldRow];
    if (lane2 &amp;&amp; !lane2.safe) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var hy = worldRowToY(hero.worldRow) + (CELL - HERO_SIZE) / 2;
      var laneTop = worldRowToY(hero.worldRow) + (CELL - lane2.obH) / 2;
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var o2 = lane2.obstacles[k];
        if (hx &lt; o2.x + lane2.obW &amp;&amp; hx + HERO_SIZE &gt; o2.x &amp;&amp;
            hy &lt; laneTop + lane2.obH &amp;&amp; hy + HERO_SIZE &gt; laneTop) {
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var newRow = hero.worldRow + dr;
    // Prevent going below the starting row.
    if (newRow &gt; minWorldRow) newRow = minWorldRow;
    hero.worldRow = newRow;
    makeLane(hero.worldRow);
    // Score for every new highest lane crossed.
    if (hero.worldRow &lt; maxRowReached) {
      score += (maxRowReached - hero.worldRow);
      maxRowReached = hero.worldRow;
      scoreEl.textContent = score;
      if (!powerup &amp;&amp; Math.random() &lt; 0.25) spawnPowerup();
    }
    checkPickup();
    ensureGenerated();
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function clearField() {
    field.innerHTML = &#x27;&#x27;;
    lanes = {};
    laneEls = {};
    powerup = null;
    heroEl = null;
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    slowmoFrames = 0;
    gameOver = false;
    clearField();
    hero = { col: Math.floor(COLS / 2), worldRow: 0 };
    minWorldRow = 0;
    maxRowReached = 0;
    camTop = hero.worldRow - 6;
    ensureGenerated();
    makeHero();
    updateSlowmoUI();
    spawnPowerup();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the field before pressing Start.
  hero = { col: Math.floor(COLS / 2), worldRow: 0 };
  camTop = hero.worldRow - 6;
  ensureGenerated();
  makeHero();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
