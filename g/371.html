<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Snake</b> &middot; Game 371 &middot; Professional producer &middot; Basic game: Snake</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; overflow: hidden; transition: background 0.6s ease; }
  .cell { position: absolute; box-sizing: border-box; z-index: 2; }
  .snake { background: #2b2b2b; border-radius: 2px; box-shadow: 0 0 2px rgba(0,0,0,0.4); }
  .snake.eaten-green { background: #2ecc40; }
  .snake.eaten-red { background: #ff4136; }
  .food-green { background: #2ecc40; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.3); }
  .food-red { background: #ff4136; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.3); }
  .scenery { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the snake with the arrow keys to eat green circles to grow and score, while red circles shrink it. The scenery changes to a new landscape each time you eat — use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;scenery&quot; id=&quot;scenery&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var TICK_MS = 150;
  var running = false, tickId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10, type: &#x27;green&#x27; };
  var score = 0;
  var flashTicks = 0;
  var flashType = &#x27;green&#x27;;
  var sceneIndex = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var sceneryEl = document.getElementById(&#x27;scenery&#x27;);

  // Each landscape: a field background gradient (sky/ground) plus an SVG scenery overlay.
  var scenes = [
    { // Sunset
      bg: &#x27;linear-gradient(#ff9a56 0%, #ff6a88 45%, #6b4226 45%, #4a2d1a 100%)&#x27;,
      svg: &#x27;&lt;svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 600 440&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;300&quot; cy=&quot;180&quot; r=&quot;55&quot; fill=&quot;#ffe08a&quot; opacity=&quot;0.9&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M0 260 L120 150 L230 260 Z&quot; fill=&quot;#7a4a2a&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M180 260 L330 130 L470 260 Z&quot; fill=&quot;#68401f&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M380 260 L500 170 L600 260 Z&quot; fill=&quot;#7a4a2a&quot;/&gt;&lt;/svg&gt;&#x27;
    },
    { // Ocean
      bg: &#x27;linear-gradient(#89d0ff 0%, #4aa8e0 50%, #1f6fa8 50%, #0d4d78 100%)&#x27;,
      svg: &#x27;&lt;svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 600 440&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;480&quot; cy=&quot;90&quot; r=&quot;40&quot; fill=&quot;#fff6c8&quot; opacity=&quot;0.85&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M0 230 q75 -25 150 0 t150 0 t150 0 t150 0 V240 H0 Z&quot; fill=&quot;#2f88c0&quot; opacity=&quot;0.6&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M0 260 q75 -25 150 0 t150 0 t150 0 t150 0 V280 H0 Z&quot; fill=&quot;#1f6fa8&quot; opacity=&quot;0.6&quot;/&gt;&lt;/svg&gt;&#x27;
    },
    { // Forest
      bg: &#x27;linear-gradient(#bfe6ff 0%, #8ecae6 42%, #3a7d34 42%, #245a20 100%)&#x27;,
      svg: &#x27;&lt;svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 600 440&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27;
         + &#x27;&lt;g fill=&quot;#1f5c1a&quot;&gt;&#x27;
         + &#x27;&lt;polygon points=&quot;80,240 40,320 120,320&quot;/&gt;&lt;polygon points=&quot;80,200 45,270 115,270&quot;/&gt;&#x27;
         + &#x27;&lt;polygon points=&quot;220,250 175,340 265,340&quot;/&gt;&lt;polygon points=&quot;220,205 180,285 260,285&quot;/&gt;&#x27;
         + &#x27;&lt;polygon points=&quot;400,245 360,325 440,325&quot;/&gt;&lt;polygon points=&quot;520,255 480,345 560,345&quot;/&gt;&#x27;
         + &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;
    },
    { // Desert
      bg: &#x27;linear-gradient(#ffe7a0 0%, #ffce6b 45%, #e0a24a 45%, #c67f2e 100%)&#x27;,
      svg: &#x27;&lt;svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 600 440&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;120&quot; cy=&quot;110&quot; r=&quot;45&quot; fill=&quot;#fff2c0&quot; opacity=&quot;0.9&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M0 300 q150 -60 300 0 t300 0 V320 H0 Z&quot; fill=&quot;#d99b45&quot; opacity=&quot;0.7&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M0 340 q150 -50 300 0 t300 0 V360 H0 Z&quot; fill=&quot;#c67f2e&quot; opacity=&quot;0.8&quot;/&gt;&lt;/svg&gt;&#x27;
    },
    { // Snowy mountains
      bg: &#x27;linear-gradient(#d7f0ff 0%, #a9d8f0 45%, #e8f4fb 45%, #cfe4f0 100%)&#x27;,
      svg: &#x27;&lt;svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 600 440&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27;
         + &#x27;&lt;path d=&quot;M0 280 L140 130 L280 280 Z&quot; fill=&quot;#9db6c8&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M100 130 L140 155 L180 130 L140 100 Z&quot; fill=&quot;#ffffff&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M240 280 L400 110 L560 280 Z&quot; fill=&quot;#8aa4b8&quot;/&gt;&#x27;
         + &#x27;&lt;path d=&quot;M360 110 L400 140 L440 110 L400 80 Z&quot; fill=&quot;#ffffff&quot;/&gt;&lt;/svg&gt;&#x27;
    },
    { // Night sky
      bg: &#x27;linear-gradient(#0b1030 0%, #1a2350 55%, #10203a 55%, #0a1424 100%)&#x27;,
      svg: &#x27;&lt;svg width=&quot;100%&quot; height=&quot;100%&quot; viewBox=&quot;0 0 600 440&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;470&quot; cy=&quot;90&quot; r=&quot;38&quot; fill=&quot;#f5f3d0&quot;/&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;455&quot; cy=&quot;80&quot; r=&quot;38&quot; fill=&quot;#1a2350&quot;/&gt;&#x27;
         + &#x27;&lt;g fill=&quot;#ffffff&quot;&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;80&quot; cy=&quot;70&quot; r=&quot;2&quot;/&gt;&lt;circle cx=&quot;160&quot; cy=&quot;120&quot; r=&quot;1.6&quot;/&gt;&lt;circle cx=&quot;240&quot; cy=&quot;60&quot; r=&quot;2.2&quot;/&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;330&quot; cy=&quot;130&quot; r=&quot;1.5&quot;/&gt;&lt;circle cx=&quot;120&quot; cy=&quot;180&quot; r=&quot;1.8&quot;/&gt;&lt;circle cx=&quot;290&quot; cy=&quot;200&quot; r=&quot;1.6&quot;/&gt;&#x27;
         + &#x27;&lt;circle cx=&quot;380&quot; cy=&quot;70&quot; r=&quot;2&quot;/&gt;&lt;circle cx=&quot;200&quot; cy=&quot;160&quot; r=&quot;1.4&quot;/&gt;&lt;circle cx=&quot;50&quot; cy=&quot;140&quot; r=&quot;1.7&quot;/&gt;&#x27;
         + &#x27;&lt;/g&gt;&lt;/svg&gt;&#x27;
    }
  ];

  function applyScene(i) {
    sceneIndex = ((i % scenes.length) + scenes.length) % scenes.length;
    var s = scenes[sceneIndex];
    field.style.background = s.bg;
    sceneryEl.innerHTML = s.svg;
  }

  function nextScene() { applyScene(sceneIndex + 1); }

  function clearField() {
    // Remove only cells, keep scenery overlay.
    var cells = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i = 0; i &lt; cells.length; i++) cells[i].remove();
  }

  function drawCell(cls, x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function paint() {
    clearField();
    drawCell(&#x27;food-&#x27; + food.type, food.x, food.y);
    var snakeCls = &#x27;snake&#x27;;
    if (flashTicks &gt; 0) snakeCls = &#x27;snake eaten-&#x27; + flashType;
    for (var i = 0; i &lt; snake.length; i++) drawCell(snakeCls, snake[i].x, snake[i].y);
  }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function placeFood() {
    var type = &#x27;green&#x27;;
    if (snake.length &gt; 3 &amp;&amp; Math.random() &lt; 0.4) type = &#x27;red&#x27;;
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { food = { x: x, y: y, type: type }; return; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
    flashTicks = 0;
  }

  function tick() {
    if (!running) return;
    if (flashTicks &gt; 0) flashTicks--;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      if (food.type === &#x27;green&#x27;) {
        score += 1;
        scoreEl.textContent = score;
        flashTicks = 3;
        flashType = &#x27;green&#x27;;
      } else {
        flashTicks = 3;
        flashType = &#x27;red&#x27;;
        snake.pop();
        snake.pop();
        snake.pop();
        if (snake.length &lt; 2) { endGame(); return; }
      }
      nextScene(); // change landscape on every eat
      placeFood();
    } else {
      snake.pop();
    }
    paint();
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    initSnake();
    applyScene(0);
    placeFood();
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the participant sees the snake + food before pressing Start.
  applyScene(0);
  initSnake();
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
