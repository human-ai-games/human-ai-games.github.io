<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🐍 Snake</b> &middot; Game 465 &middot; Professional producer &middot; Basic game: Snake</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 3px #7fae4b; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐍 Snake&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the snake with the arrow keys and gobble apples to grow, but dodge the buzzing bees. Hitting a wall, your own body, or a bee ends the round — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;grass&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;canvas&quot; width=&quot;600&quot; height=&quot;440&quot; style=&quot;position:absolute;left:0;top:0;&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var TICK_MS = 150;
  var running = false, tickId = null, animId = null, gameOver = false;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDir = { x: 1, y: 0 };
  var food = { x: 10, y: 10 };
  var score = 0;
  var tongueFlick = 0;
  var bees = [];
  var beePhase = 0;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var canvas = document.getElementById(&#x27;canvas&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var grassCanvas = document.getElementById(&#x27;grass&#x27;);
  var gctx = grassCanvas.getContext(&#x27;2d&#x27;);

  // ---- Grass background (drawn once) ----
  function drawGrass() {
    var W = grassCanvas.width, H = grassCanvas.height;
    var g = gctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, &#x27;#a4d466&#x27;);
    g.addColorStop(1, &#x27;#8ec252&#x27;);
    gctx.fillStyle = g;
    gctx.fillRect(0, 0, W, H);
    for (var b = 0; b &lt; H; b += 44) {
      gctx.fillStyle = &#x27;rgba(255,255,255,0.03)&#x27;;
      gctx.fillRect(0, b, W, 22);
    }
    var seed = 12345;
    function rnd() { seed = (seed * 1103515245 + 12345) &amp; 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i &lt; 900; i++) {
      var x = rnd() * W;
      var y = rnd() * H;
      var h = 5 + rnd() * 9;
      var lean = (rnd() - 0.5) * 6;
      var shade = rnd();
      gctx.strokeStyle = shade &lt; 0.5 ? &#x27;rgba(80,150,50,0.55)&#x27; : &#x27;rgba(150,200,90,0.55)&#x27;;
      gctx.lineWidth = 1;
      gctx.beginPath();
      gctx.moveTo(x, y);
      gctx.quadraticCurveTo(x + lean * 0.5, y - h * 0.6, x + lean, y - h);
      gctx.stroke();
    }
    var petalColors = [&#x27;#f7d54b&#x27;, &#x27;#f28fb4&#x27;, &#x27;#ffffff&#x27;, &#x27;#c79bf0&#x27;];
    for (var f = 0; f &lt; 14; f++) {
      var fx = 20 + rnd() * (W - 40);
      var fy = 20 + rnd() * (H - 40);
      var col = petalColors[Math.floor(rnd() * petalColors.length)];
      for (var p = 0; p &lt; 5; p++) {
        var a = (p / 5) * Math.PI * 2;
        gctx.fillStyle = col;
        gctx.beginPath();
        gctx.arc(fx + Math.cos(a) * 3.2, fy + Math.sin(a) * 3.2, 2.1, 0, Math.PI * 2);
        gctx.fill();
      }
      gctx.fillStyle = &#x27;#f6b93b&#x27;;
      gctx.beginPath();
      gctx.arc(fx, fy, 1.8, 0, Math.PI * 2);
      gctx.fill();
    }
  }
  drawGrass();

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }

  function placeFood() {
    for (var tries = 0; tries &lt; 200; tries++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!cellOccupied(x, y)) { food = { x: x, y: y }; return; }
    }
  }

  function initSnake() {
    snake = [ { x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  // ---- Bees ----
  function makeBee() {
    // spawn away from the snake&#x27;s starting area
    var bx, by;
    do {
      bx = 60 + Math.random() * (FIELD_W - 120);
      by = 40 + Math.random() * (FIELD_H - 80);
    } while (bx &lt; 220 &amp;&amp; by &gt; 150 &amp;&amp; by &lt; 250);
    var ang = Math.random() * Math.PI * 2;
    var sp = 0.6 + Math.random() * 0.7;
    return {
      x: bx, y: by,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      turnT: 0
    };
  }
  function initBees(n) {
    bees = [];
    for (var i = 0; i &lt; n; i++) bees.push(makeBee());
  }
  function moveBees() {
    for (var i = 0; i &lt; bees.length; i++) {
      var b = bees[i];
      b.turnT--;
      if (b.turnT &lt;= 0) {
        // occasionally change heading a bit
        var ang = Math.atan2(b.vy, b.vx) + (Math.random() - 0.5) * 1.4;
        var sp = 0.6 + Math.random() * 0.8;
        b.vx = Math.cos(ang) * sp;
        b.vy = Math.sin(ang) * sp;
        b.turnT = 20 + Math.floor(Math.random() * 40);
      }
      b.x += b.vx;
      b.y += b.vy;
      // bounce off walls
      if (b.x &lt; 12) { b.x = 12; b.vx = Math.abs(b.vx); }
      if (b.x &gt; FIELD_W - 12) { b.x = FIELD_W - 12; b.vx = -Math.abs(b.vx); }
      if (b.y &lt; 12) { b.y = 12; b.vy = Math.abs(b.vy); }
      if (b.y &gt; FIELD_H - 12) { b.y = FIELD_H - 12; b.vy = -Math.abs(b.vy); }
    }
  }

  function cx(c) { return c.x * CELL + CELL / 2; }
  function cy(c) { return c.y * CELL + CELL / 2; }

  function drawApple(c) {
    var x = cx(c), y = cy(c), r = CELL * 0.42;
    ctx.beginPath();
    ctx.fillStyle = &#x27;#e23b3b&#x27;;
    ctx.arc(x - r * 0.35, y + 1, r * 0.75, 0, Math.PI * 2);
    ctx.arc(x + r * 0.35, y + 1, r * 0.75, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = &#x27;rgba(255,255,255,0.45)&#x27;;
    ctx.arc(x - r * 0.3, y - r * 0.25, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = &#x27;#7a4a1e&#x27;;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.7);
    ctx.lineTo(x + 2, y - r * 1.15);
    ctx.stroke();
    ctx.beginPath();
    ctx.fillStyle = &#x27;#3fa93f&#x27;;
    ctx.ellipse(x + 6, y - r * 1.0, 5, 2.6, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBee(b) {
    var x = b.x, y = b.y;
    var ang = Math.atan2(b.vy, b.vx);
    ctx.save();
    ctx.translate(x, y);
    // wing flutter
    var flap = Math.sin(beePhase * 0.9 + x) * 0.5 + 0.5;
    ctx.rotate(ang);
    // wings
    ctx.fillStyle = &#x27;rgba(255,255,255,0.6)&#x27;;
    ctx.beginPath();
    ctx.ellipse(-1, -5 - flap * 2, 5, 3, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-1, 5 + flap * 2, 5, 3, 0.5, 0, Math.PI * 2);
    ctx.fill();
    // body
    ctx.fillStyle = &#x27;#f5c518&#x27;;
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 5.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // stripes
    ctx.fillStyle = &#x27;#222&#x27;;
    ctx.fillRect(-1, -5.5, 2.4, 11);
    ctx.fillRect(-5, -4.5, 2.2, 9);
    // head
    ctx.fillStyle = &#x27;#333&#x27;;
    ctx.beginPath();
    ctx.arc(7.5, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSnake() {
    if (snake.length === 0) return;
    ctx.lineCap = &#x27;round&#x27;;
    ctx.lineJoin = &#x27;round&#x27;;
    ctx.strokeStyle = &#x27;#3c9d3c&#x27;;
    ctx.lineWidth = CELL * 0.82;
    ctx.beginPath();
    ctx.moveTo(cx(snake[0]), cy(snake[0]));
    for (var i = 1; i &lt; snake.length; i++) ctx.lineTo(cx(snake[i]), cy(snake[i]));
    ctx.stroke();
    ctx.strokeStyle = &#x27;rgba(180,235,120,0.5)&#x27;;
    ctx.lineWidth = CELL * 0.32;
    ctx.beginPath();
    ctx.moveTo(cx(snake[0]), cy(snake[0]));
    for (var i = 1; i &lt; snake.length; i++) ctx.lineTo(cx(snake[i]), cy(snake[i]));
    ctx.stroke();
    ctx.fillStyle = &#x27;rgba(30,110,30,0.5)&#x27;;
    for (var i = 1; i &lt; snake.length; i++) {
      ctx.beginPath();
      ctx.arc(cx(snake[i]), cy(snake[i]), 2, 0, Math.PI * 2);
      ctx.fill();
    }
    var head = snake[0];
    var hx = cx(head), hy = cy(head);
    ctx.beginPath();
    ctx.fillStyle = &#x27;#2f8f2f&#x27;;
    ctx.arc(hx, hy, CELL * 0.52, 0, Math.PI * 2);
    ctx.fill();
    var px = -dir.y, py = dir.x;
    var eyeOff = CELL * 0.28, eyeFwd = CELL * 0.18;
    var e1x = hx + px * eyeOff + dir.x * eyeFwd;
    var e1y = hy + py * eyeOff + dir.y * eyeFwd;
    var e2x = hx - px * eyeOff + dir.x * eyeFwd;
    var e2y = hy - py * eyeOff + dir.y * eyeFwd;
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(e1x, e1y, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = &#x27;#111&#x27;;
    ctx.beginPath(); ctx.arc(e1x + dir.x * 1.2, e1y + dir.y * 1.2, 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x + dir.x * 1.2, e2y + dir.y * 1.2, 1.7, 0, Math.PI * 2); ctx.fill();
    if (tongueFlick &gt; 0) {
      var baseX = hx + dir.x * CELL * 0.5;
      var baseY = hy + dir.y * CELL * 0.5;
      var tipX = hx + dir.x * CELL * (0.5 + 0.45 * tongueFlick);
      var tipY = hy + dir.y * CELL * (0.5 + 0.45 * tongueFlick);
      ctx.strokeStyle = &#x27;#e2325c&#x27;;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.lineTo(tipX, tipY);
      ctx.stroke();
      var fx = px * 3, fy = py * 3;
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX + dir.x * 3 + fx, tipY + dir.y * 3 + fy);
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX + dir.x * 3 - fx, tipY + dir.y * 3 - fy);
      ctx.stroke();
    }
  }

  function paint() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawApple(food);
    drawSnake();
    for (var i = 0; i &lt; bees.length; i++) drawBee(bees[i]);
  }

  // ---- Smooth animation loop (bees + wing flutter) ----
  function animate() {
    if (!running) return;
    beePhase += 1;
    moveBees();
    // bee-vs-head collision (pixel distance)
    var head = snake[0];
    if (head) {
      var hx = cx(head), hy = cy(head);
      for (var i = 0; i &lt; bees.length; i++) {
        var dx = bees[i].x - hx, dy = bees[i].y - hy;
        if (dx * dx + dy * dy &lt; 14 * 14) { endGame(); return; }
      }
    }
    paint();
    animId = requestAnimationFrame(animate);
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateFood = (nx === food.x &amp;&amp; ny === food.y);
    var body = ateFood ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }
    }
    snake.unshift({ x: nx, y: ny });
    if (ateFood) {
      score += 1;
      scoreEl.textContent = score;
      placeFood();
      tongueFlick = 1;
      // add a new bee every few apples to ramp difficulty
      if (score % 3 === 0) bees.push(makeBee());
    } else {
      snake.pop();
    }
    if (Math.random() &lt; 0.25) tongueFlick = 1;
    else if (tongueFlick &gt; 0) tongueFlick = Math.max(0, tongueFlick - 0.5);
  }

  function endGame() {
    running = false;
    gameOver = true;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    paint();
    ctx.fillStyle = &#x27;rgba(0,0,0,0.25)&#x27;;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.font = &#x27;bold 30px system-ui, sans-serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;Game Over&#x27;, canvas.width / 2, canvas.height / 2 - 6);
    ctx.font = &#x27;18px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Score: &#x27; + score, canvas.width / 2, canvas.height / 2 + 24);
  }

  function startGame() {
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false;
    tongueFlick = 1;
    beePhase = 0;
    initSnake();
    placeFood();
    initBees(3);
    paint();
    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, TICK_MS);
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(animate);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { pendingDir = { x: -1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { pendingDir = { x: 1, y: 0 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { pendingDir = { x: 0, y: -1 }; e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { pendingDir = { x: 0, y: 1 }; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  initSnake();
  initBees(3);
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
