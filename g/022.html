&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move pieces with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and drop faster with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Clear rows for points, grab the crystals 💎 for 5 bonus points, and beware — pieces fall faster once the stack passes the red line!&lt;/p&gt;

&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var BASE_DROP_MS = 500;
  var FAST_DROP_MS = Math.round(BASE_DROP_MS * 0.85);  // 15% faster
  var HALF_ROW = Math.floor(ROWS / 2);                 // stack past here = speed up
  var running = false, dropId = null;
  var currentDropMs = BASE_DROP_MS;
  var grid = [];
  var crystals = [];
  var piece = null;
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var midline = document.getElementById(&#x27;midline&#x27;);
  midline.style.top = (HALF_ROW * CELL) + &#x27;px&#x27;;

  var SHAPES = {
    I: { color: &#x27;#3fd0e0&#x27;, cells: [[0,1],[1,1],[2,1],[3,1]] },
    O: { color: &#x27;#f5d23f&#x27;, cells: [[1,0],[2,0],[1,1],[2,1]] },
    T: { color: &#x27;#c04ff0&#x27;, cells: [[1,0],[0,1],[1,1],[2,1]] },
    S: { color: &#x27;#5fe05f&#x27;, cells: [[1,0],[2,0],[0,1],[1,1]] },
    Z: { color: &#x27;#f05f5f&#x27;, cells: [[0,0],[1,0],[1,1],[2,1]] },
    J: { color: &#x27;#5f7ff0&#x27;, cells: [[0,0],[0,1],[1,1],[2,1]] },
    L: { color: &#x27;#f0a03f&#x27;, cells: [[2,0],[0,1],[1,1],[2,1]] }
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
  }

  function crystalAt(x, y) {
    for (var i = 0; i &lt; crystals.length; i++) {
      if (crystals[i].x === x &amp;&amp; crystals[i].y === y) return i;
    }
    return -1;
  }

  function spawnCrystals(n) {
    crystals = [];
    var attempts = 0;
    while (crystals.length &lt; n &amp;&amp; attempts &lt; 200) {
      attempts++;
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * (ROWS - 4)) + 4;
      if (grid[y][x] || crystalAt(x, y) !== -1) continue;
      crystals.push({ x: x, y: y });
    }
  }

  // Highest occupied row (smallest y index). Returns ROWS if empty.
  function stackTopRow() {
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) return r;
      }
    }
    return ROWS;
  }

  // Adjust drop speed based on how high the stack is.
  function updateSpeed() {
    if (!running) return;
    var top = stackTopRow();
    var target = (top &lt;= HALF_ROW) ? FAST_DROP_MS : BASE_DROP_MS;
    if (target !== currentDropMs) {
      currentDropMs = target;
      if (dropId) clearInterval(dropId);
      dropId = setInterval(stepDown, currentDropMs);
      midline.style.borderTopColor = (target === FAST_DROP_MS) ? &#x27;rgba(255,60,60,0.8)&#x27; : &#x27;rgba(255,120,120,0.4)&#x27;;
    }
  }

  function makePiece(type) {
    var s = SHAPES[type];
    var cells = s.cells.map(function (c) { return { x: c[0], y: c[1] }; });
    return { type: type, color: s.color, cells: cells, x: 3, y: 0 };
  }

  function pieceCells(p) {
    return p.cells.map(function (c) { return { x: p.x + c.x, y: p.y + c.y }; });
  }

  function collidesAt(p, cells) {
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = p.x + cells[i].x, cy = p.y + cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function collides(p) { return collidesAt(p, p.cells); }

  function rotatedCells(p) {
    if (p.type === &#x27;O&#x27;) return p.cells.slice();
    return p.cells.map(function (c) { return { x: -c.y + 2, y: c.x }; });
  }

  function rotate() {
    if (!running || !piece) return;
    var rc = rotatedCells(piece);
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var test = { x: piece.x + kicks[k], y: piece.y };
      if (!collidesAt(test, rc)) {
        piece.cells = rc;
        piece.x = test.x;
        paint();
        return;
      }
    }
  }

  function spawnPiece() {
    var type = TYPES[Math.floor(Math.random() * TYPES.length)];
    piece = makePiece(type);
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    var bonus = 0;
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) {
        grid[c.y][c.x] = piece.color;
        var ci = crystalAt(c.x, c.y);
        if (ci !== -1) {
          bonus += 5;
          showPop(c.x, c.y);
          crystals.splice(ci, 1);
        }
      }
    }
    if (bonus &gt; 0) {
      score += bonus;
      scoreEl.textContent = score;
    }
    piece = null;
  }

  function showPop(cx, cy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;pop&#x27;;
    el.textContent = &#x27;💥&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        crystals = crystals.filter(function (cr) { return cr.y !== r; });
        for (var q = 0; q &lt; crystals.length; q++) {
          if (crystals[q].y &lt; r) crystals[q].y += 1;
        }
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared * cleared;
      scoreEl.textContent = score;
    }
  }

  function paint() {
    // Remove all children except the midline marker.
    var kids = Array.prototype.slice.call(field.children);
    for (var m = 0; m &lt; kids.length; m++) {
      if (kids[m] !== midline) field.removeChild(kids[m]);
    }
    for (var i = 0; i &lt; crystals.length; i++) {
      drawCrystal(crystals[i].x, crystals[i].y);
    }
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c]) drawBlock(c, r, grid[r][c]);
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var j = 0; j &lt; cells.length; j++) {
        if (cells[j].y &gt;= 0) drawBlock(cells[j].x, cells[j].y, piece.color);
      }
    }
  }

  function drawBlock(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    field.appendChild(el);
  }

  function drawCrystal(cx, cy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;crystal&#x27;;
    el.textContent = &#x27;💎&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, color: piece.color, cells: piece.cells, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (crystals.length &lt; 5 &amp;&amp; Math.random() &lt; 0.4) spawnCrystals(crystals.length + 1);
      if (!spawnPiece()) { endGame(); paint(); return; }
      updateSpeed();
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, color: piece.color, cells: piece.cells, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    newGrid();
    spawnCrystals(4);
    if (!spawnPiece()) return;
    currentDropMs = BASE_DROP_MS;
    midline.style.borderTopColor = &#x27;rgba(255,120,120,0.4)&#x27;;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, currentDropMs);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint.
  newGrid();
  spawnCrystals(4);
  piece = makePiece(&#x27;T&#x27;);
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
