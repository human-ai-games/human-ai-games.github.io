<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

  .header a { color: #1f6feb; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🚗 Balloon Dash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #eef; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: #fff; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #234; }
  .instructions { font-size: 16px; color: #555; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 20px; color: #345; font-weight: 600; }
  .hud .lives { letter-spacing: 3px; }
  .field { position: relative; width: 640px; height: 420px; flex-shrink: 0; margin: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
  #cv { display: block; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: #fff; font-size: 30px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.6); pointer-events: none; }
  .overlay small { font-size: 17px; font-weight: 600; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🚗 Balloon Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click) to jump over the cars racing toward you. Pop the slow-drifting balloons mid-jump for bonus points — you have 3 lives, and the game speeds up over time.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
    &lt;div&gt;Speed: &lt;span id=&quot;spd&quot;&gt;1.0&lt;/span&gt;x&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press Start below to play!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 640, H = 420;
  var GROUND_H = 70;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var spdEl = document.getElementById(&#x27;spd&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  var HERO = { x: 80, w: 40, h: 46 };
  var floorY = H - GROUND_H - HERO.h;
  var GRAVITY = 0.28, JUMP_V = -10.5;

  var running = false, animId = null;
  var heroY, heroVY;
  var cars, balloons, particles;
  var score, lives, gameOver;
  var baseSpeed, speedMult;
  var elapsed, lastTime;
  var carTimer, balloonTimer, roadOffset;
  var invincible, invTimer;

  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function reset() {
    heroY = floorY; heroVY = 0;
    cars = []; balloons = []; particles = [];
    score = 0; lives = 3; gameOver = false;
    baseSpeed = 3.2; speedMult = 1.0;
    elapsed = 0; lastTime = 0;
    carTimer = 0; balloonTimer = 0; roadOffset = 0;
    invincible = false; invTimer = 0;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = Math.floor(score);
    livesEl.textContent = [&#x27;&#x27;,&#x27;❤️&#x27;,&#x27;❤️❤️&#x27;,&#x27;❤️❤️❤️&#x27;][Math.max(0,lives)] || &#x27;&#x27;;
    spdEl.textContent = speedMult.toFixed(1);
  }

  // Burst of physical particles that scatter and fall with gravity, fading.
  function burst(cx, cy, count, colors, spread, big) {
    for (var i = 0; i &lt; count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = (Math.random() * spread) + spread * 0.3;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - spread * 0.4,
        r: (big ? 3 : 2) + Math.random() * (big ? 4 : 3),
        color: colors[(Math.random()*colors.length)|0],
        life: 1
      });
    }
  }

  function spawnCar() {
    var h = 34 + Math.random()*10;
    var colors = [&#x27;#e53935&#x27;,&#x27;#8e24aa&#x27;,&#x27;#3949ab&#x27;,&#x27;#00897b&#x27;,&#x27;#f4511e&#x27;];
    cars.push({ x: W + 20, w: 52, h: h, color: colors[(Math.random()*colors.length)|0], scored: false });
  }
  function spawnBalloon() {
    // Highest balloon no higher than half the screen height.
    var minY = H * 0.5;
    var maxY = floorY - 30;
    var y = minY + Math.random() * (maxY - minY);
    var colors = [&#x27;#ff5ca2&#x27;,&#x27;#ffd54f&#x27;,&#x27;#4fc3f7&#x27;,&#x27;#81c784&#x27;,&#x27;#ba68c8&#x27;];
    balloons.push({ x: W + 20, y: y, r: 16, color: colors[(Math.random()*colors.length)|0] });
  }

  function jump() {
    if (!running || gameOver) return;
    if (heroY &gt;= floorY - 1) { heroVY = JUMP_V; beep(520, 0.12, &#x27;square&#x27;); }
  }

  function loseLife() {
    lives--;
    beep(140, 0.3, &#x27;sawtooth&#x27;);
    updateHud();
    if (lives &lt;= 0) {
      gameOver = true;
      running = false;
      overlay.style.display = &#x27;flex&#x27;;
      overlay.innerHTML = &#x27;Game Over&lt;small&gt;Score: &#x27; + Math.floor(score) + &#x27; — press Start to retry&lt;/small&gt;&#x27;;
    } else {
      invincible = true; invTimer = 1400;
    }
  }

  function tick(now) {
    if (!running) return;
    if (!lastTime) lastTime = now;
    var dt = now - lastTime; lastTime = now;
    if (dt &gt; 60) dt = 60;
    elapsed += dt;

    var steps = Math.floor(elapsed / 15000);
    speedMult = Math.pow(1.5, steps);
    var speed = baseSpeed * speedMult;

    score += dt * 0.008 * speedMult;

    heroVY += GRAVITY;
    heroY += heroVY;
    if (heroY &gt; floorY) { heroY = floorY; heroVY = 0; }
    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }

    if (invincible) { invTimer -= dt; if (invTimer &lt;= 0) invincible = false; }

    carTimer -= dt;
    var carInterval = Math.max(650, 1700 / speedMult);
    if (carTimer &lt;= 0) { spawnCar(); carTimer = carInterval + Math.random()*500; }
    balloonTimer -= dt;
    if (balloonTimer &lt;= 0) { spawnBalloon(); balloonTimer = 2600 + Math.random()*2000; }

    roadOffset = (roadOffset + speed) % 60;

    // cars
    for (var i = cars.length-1; i &gt;= 0; i--) {
      var c = cars[i];
      c.x -= speed;
      var carTop = H - GROUND_H - c.h;
      if (!c.scored &amp;&amp; c.x + c.w &lt; HERO.x) { c.scored = true; score += 5; }
      if (c.x + c.w &lt; -30) { cars.splice(i,1); continue; }
      if (!invincible &amp;&amp;
          HERO.x + HERO.w &gt; c.x &amp;&amp; HERO.x &lt; c.x + c.w &amp;&amp;
          heroY + HERO.h &gt; carTop) {
        // explode into particles
        burst(c.x + c.w/2, carTop + c.h/2, 34, [c.color,&#x27;#ffb300&#x27;,&#x27;#ff5722&#x27;,&#x27;#ffe082&#x27;,&#x27;#777&#x27;], 7, true);
        beep(90, 0.35, &#x27;sawtooth&#x27;);
        cars.splice(i,1);
        loseLife();
        if (gameOver) { draw(); updateHud(); return; }
      }
    }
    // balloons
    for (var j = balloons.length-1; j &gt;= 0; j--) {
      var b = balloons[j];
      b.x -= speed * 0.28;
      if (b.x + b.r &lt; -20) { balloons.splice(j,1); continue; }
      var hx = HERO.x + HERO.w/2, hy = heroY + HERO.h/2;
      var dx = hx - b.x, dy = hy - b.y;
      if (Math.sqrt(dx*dx+dy*dy) &lt; b.r + 22) {
        burst(b.x, b.y, 20, [b.color,&#x27;#ffffff&#x27;], 5, false);
        balloons.splice(j,1);
        score += 15;
        beep(880, 0.14, &#x27;triangle&#x27;);
      }
    }
    // particles physics
    for (var p = particles.length-1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.vy += 0.35;          // gravity
      pt.vx *= 0.98;          // air drag
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life -= dt / 900;    // fade over ~0.9s
      if (pt.life &lt;= 0) particles.splice(p,1);
    }

    updateHud();
    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    var g = ctx.createLinearGradient(0,0,0,H-GROUND_H);
    g.addColorStop(0,&#x27;#7ec8ff&#x27;); g.addColorStop(1,&#x27;#cfeeff&#x27;);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H-GROUND_H);

    ctx.fillStyle = &#x27;#fff3a0&#x27;; ctx.beginPath(); ctx.arc(560,60,34,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = &#x27;rgba(255,255,255,.85)&#x27;;
    cloud(120,70); cloud(340,110); cloud(470,55);

    ctx.fillStyle = &#x27;#7bc47b&#x27;; ctx.fillRect(0, H-GROUND_H-14, W, 14);
    ctx.fillStyle = &#x27;#444&#x27;; ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
    ctx.fillStyle = &#x27;#ffd54f&#x27;;
    for (var x = -roadOffset; x &lt; W; x += 60) {
      ctx.fillRect(x, H-GROUND_H+GROUND_H/2-3, 34, 6);
    }

    // balloons
    balloons.forEach(function(b){
      ctx.strokeStyle = &#x27;#888&#x27;; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y+b.r); ctx.lineTo(b.x, b.y+b.r+18); ctx.stroke();
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r*0.85, b.r, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;rgba(255,255,255,.5)&#x27;;
      ctx.beginPath(); ctx.ellipse(b.x-5, b.y-5, 4, 6, 0, 0, Math.PI*2); ctx.fill();
    });

    // cars
    cars.forEach(function(c){
      var top = H - GROUND_H - c.h;
      ctx.fillStyle = c.color;
      roundRect(c.x, top+c.h*0.35, c.w, c.h*0.65, 6); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(c.x+8, top+c.h*0.35);
      ctx.lineTo(c.x+16, top);
      ctx.lineTo(c.x+c.w-14, top);
      ctx.lineTo(c.x+c.w-6, top+c.h*0.35);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = &#x27;#bde3ff&#x27;;
      ctx.fillRect(c.x+16, top+3, c.w-30, c.h*0.3);
      ctx.fillStyle = &#x27;#111&#x27;;
      ctx.beginPath(); ctx.arc(c.x+14, top+c.h, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x+c.w-14, top+c.h, 7, 0, Math.PI*2); ctx.fill();
    });

    // hero
    var flash = invincible &amp;&amp; (Math.floor(invTimer/120) % 2 === 0);
    if (!flash) {
      ctx.fillStyle = &#x27;#333&#x27;;
      roundRect(HERO.x, heroY+10, HERO.w, HERO.h-10, 6); ctx.fill();
      ctx.fillStyle = &#x27;#ffcc99&#x27;;
      ctx.beginPath(); ctx.arc(HERO.x+HERO.w/2, heroY+8, 11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;#e53935&#x27;;
      ctx.beginPath(); ctx.arc(HERO.x+HERO.w/2, heroY+6, 11, Math.PI, Math.PI*2); ctx.fill();
      ctx.fillRect(HERO.x+HERO.w/2, heroY+4, 14, 3);
    }

    // particles (drawn on top of everything)
    particles.forEach(function(pt){
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function cloud(x,y){
    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2); ctx.arc(x+20,y+4,14,0,Math.PI*2);
    ctx.arc(x-18,y+5,13,0,Math.PI*2); ctx.arc(x+2,y+12,15,0,Math.PI*2);
    ctx.fill();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function startGame() {
    if (running) return;
    reset();
    overlay.style.display = &#x27;none&#x27;;
    running = true; lastTime = 0;
    spawnCar(); spawnBalloon();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (!gameOver) { overlay.style.display = &#x27;flex&#x27;; overlay.innerHTML = &#x27;Paused&#x27;; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;click&#x27;, jump);
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  reset();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

    try {

        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);

    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
