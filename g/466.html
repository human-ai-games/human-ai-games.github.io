  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #555; margin: 0; }
  .field { position: relative; width: 640px; height: 480px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 3px #333; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🚦 Highway Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to move the pixel man up the highway — every new lane you reach earns a point, so keep pushing forward past cars, semis, motorcycles, and cones. Stand on the striped crosswalk and traffic there pauses for you; get hit anywhere else and the round ends. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot; style=&quot;display:none;&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);

  var CELL = 40;
  var COLS = 16;
  var FIELD_W = 640, FIELD_H = 480;
  var ROWS = 12;
  var LANE_ROWS = [1,2,3,4,5,6,7,8];
  var CROSSWALK_COL = 8;   // column that is the crosswalk
  var START_ROW = 11;
  var GOAL_ROW = 0;

  var running = false, animId = null;
  var hero = { col: 8, row: START_ROW };
  var lanes = [];
  var cones = [];
  var score = 0, best = 0;
  var farthestRow = START_ROW;  // track how far up we&#x27;ve been this life (lower row = farther)

  function makeLanes() {
    lanes = [];
    var types = [&#x27;car&#x27;,&#x27;semi&#x27;,&#x27;moto&#x27;,&#x27;car&#x27;,&#x27;semi&#x27;,&#x27;moto&#x27;,&#x27;car&#x27;,&#x27;semi&#x27;];
    for (var i = 0; i &lt; LANE_ROWS.length; i++) {
      var row = LANE_ROWS[i];
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.7 + (i * 0.18) + Math.random()*0.25;
      var kind = types[i % types.length];
      var vw = kind === &#x27;semi&#x27; ? 96 : (kind === &#x27;moto&#x27; ? 34 : 60);
      var vh = kind === &#x27;semi&#x27; ? 28 : (kind === &#x27;moto&#x27; ? 18 : 26);
      var count = kind === &#x27;semi&#x27; ? 2 : (kind === &#x27;moto&#x27; ? 4 : 3);
      var gap = FIELD_W / count;
      var color = pickColor(i);
      var vehicles = [];
      for (var j = 0; j &lt; count; j++) {
        vehicles.push({ x: j * gap + Math.random()*40 });
      }
      lanes.push({ row: row, y: row*CELL, dir: dir, speed: speed, kind: kind, vw: vw, vh: vh, color: color, vehicles: vehicles });
    }
  }

  function makeCones() {
    cones = [];
    var used = {};
    var howMany = 5;
    var tries = 0;
    while (cones.length &lt; howMany &amp;&amp; tries &lt; 100) {
      tries++;
      var row = LANE_ROWS[Math.floor(Math.random()*LANE_ROWS.length)];
      var col = 1 + Math.floor(Math.random()*(COLS-2));
      if (col === CROSSWALK_COL) continue; // keep crosswalk clear
      var key = row + &#x27;:&#x27; + col;
      if (used[key]) continue;
      used[key] = true;
      cones.push({ row: row, col: col });
    }
  }

  function pickColor(i) {
    var cols = [&#x27;#e74c3c&#x27;,&#x27;#3498db&#x27;,&#x27;#f1c40f&#x27;,&#x27;#2ecc71&#x27;,&#x27;#9b59b6&#x27;,&#x27;#e67e22&#x27;,&#x27;#1abc9c&#x27;,&#x27;#ecf0f1&#x27;];
    return cols[i % cols.length];
  }

  function reset() {
    hero.col = 8; hero.row = START_ROW;
    farthestRow = START_ROW;
  }

  // Is the hero currently standing on the crosswalk column, in a lane row?
  function heroOnCrosswalk() {
    return hero.col === CROSSWALK_COL &amp;&amp; hero.row &gt;= 1 &amp;&amp; hero.row &lt;= 8;
  }

  // Should this lane&#x27;s traffic pause? Only when hero is on crosswalk AND
  // this lane is the one the hero is in OR adjacent-ish. We&#x27;ll pause the
  // lane the hero is standing in.
  function lanePaused(lane) {
    return heroOnCrosswalk() &amp;&amp; lane.row === hero.row;
  }

  function drawBackground() {
    drawGrass(0, GOAL_ROW*CELL, FIELD_W, CELL);
    drawGrass(0, 10*CELL, FIELD_W, 2*CELL);
    ctx.fillStyle = &#x27;#b0b0b0&#x27;;
    ctx.fillRect(0, 9*CELL, FIELD_W, CELL);
    ctx.fillStyle = &#x27;#8a8a8a&#x27;;
    for (var x=0;x&lt;FIELD_W;x+=20){ ctx.fillRect(x,9*CELL,10,CELL); }

    ctx.fillStyle = &#x27;#3a3a40&#x27;;
    ctx.fillRect(0, 1*CELL, FIELD_W, 8*CELL);

    // Crosswalk: vertical striped band at CROSSWALK_COL across all lanes
    var cwx = CROSSWALK_COL*CELL;
    ctx.fillStyle = &#x27;#4a4a52&#x27;;
    ctx.fillRect(cwx, 1*CELL, CELL, 8*CELL);
    ctx.fillStyle = &#x27;#f2f2f2&#x27;;
    for (var sy = 1*CELL; sy &lt; 9*CELL; sy += 16){
      ctx.fillRect(cwx+4, sy+3, CELL-8, 9);
    }

    ctx.strokeStyle = &#x27;#f5d020&#x27;;
    ctx.lineWidth = 3;
    ctx.setLineDash([22, 20]);
    for (var r=2; r&lt;=8; r++){
      ctx.beginPath();
      ctx.moveTo(0, r*CELL);
      ctx.lineTo(FIELD_W, r*CELL);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = &#x27;#ffffff&#x27;;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,1*CELL); ctx.lineTo(FIELD_W,1*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,9*CELL); ctx.lineTo(FIELD_W,9*CELL); ctx.stroke();

    ctx.font = &#x27;26px system-ui&#x27;;
    ctx.textAlign = &#x27;left&#x27;;
    ctx.fillText(&#x27;🏁&#x27;, 8, GOAL_ROW*CELL + 30);
    ctx.fillText(&#x27;🏁&#x27;, FIELD_W-38, GOAL_ROW*CELL + 30);
  }

  function drawGrass(x,y,w,h){
    ctx.fillStyle = &#x27;#4caf50&#x27;;
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle = &#x27;#43a047&#x27;;
    for (var gx=x; gx&lt;x+w; gx+=16){
      for (var gy=y; gy&lt;y+h; gy+=16){
        if (((gx+gy)/16)%2===0) ctx.fillRect(gx,gy,8,8);
      }
    }
  }

  function drawCone(col, row) {
    var cx = col*CELL + CELL/2;
    var by = row*CELL + CELL - 8;
    ctx.fillStyle = &#x27;#111&#x27;;
    ctx.fillRect(cx-11, by, 22, 5);
    ctx.fillStyle = &#x27;#e8571d&#x27;;
    ctx.beginPath();
    ctx.moveTo(cx, by-24);
    ctx.lineTo(cx-9, by);
    ctx.lineTo(cx+9, by);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath();
    ctx.moveTo(cx-5.5, by-9); ctx.lineTo(cx+5.5, by-9);
    ctx.lineTo(cx+7, by-4); ctx.lineTo(cx-7, by-4);
    ctx.closePath(); ctx.fill();
  }

  function drawVehicle(lane, vx, braking) {
    var vy = lane.y + (CELL - lane.vh)/2;
    var w = lane.vw, h = lane.vh, dir = lane.dir;
    ctx.save();
    if (lane.kind === &#x27;moto&#x27;) {
      ctx.fillStyle = &#x27;#222&#x27;;
      ctx.fillRect(vx, vy+h-6, w, 5);
      ctx.fillStyle = &#x27;#111&#x27;;
      ctx.beginPath(); ctx.arc(vx+5, vy+h-2, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(vx+w-5, vy+h-2, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = lane.color;
      ctx.fillRect(vx+6, vy+2, w-12, h-8);
      ctx.fillStyle = &#x27;#333&#x27;;
      ctx.fillRect(vx+w/2-4, vy-4, 8, 10);
      ctx.fillStyle = &#x27;#e0e0e0&#x27;;
      ctx.fillRect(vx+w/2-3, vy-6, 6, 4);
    } else {
      ctx.fillStyle = &#x27;#1a1a1a&#x27;;
      ctx.fillRect(vx+4, vy+h-4, w-8, 4);
      ctx.fillStyle = &#x27;#111&#x27;;
      ctx.beginPath(); ctx.arc(vx+10, vy+h-2, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(vx+w-10, vy+h-2, 4, 0, Math.PI*2); ctx.fill();
      if (lane.kind === &#x27;semi&#x27;) {
        var cabW = 26;
        ctx.fillStyle = &#x27;#dcdcdc&#x27;;
        if (dir &gt; 0) ctx.fillRect(vx, vy, w-cabW-2, h-2);
        else ctx.fillRect(vx+cabW+2, vy, w-cabW-2, h-2);
        ctx.fillStyle = lane.color;
        if (dir &gt; 0) ctx.fillRect(vx+w-cabW, vy+1, cabW, h-3);
        else ctx.fillRect(vx, vy+1, cabW, h-3);
        ctx.fillStyle = &#x27;#aee&#x27;;
        if (dir &gt; 0) ctx.fillRect(vx+w-cabW+4, vy+3, 8, 8);
        else ctx.fillRect(vx+cabW-12, vy+3, 8, 8);
      } else {
        ctx.fillStyle = lane.color;
        roundRect(vx, vy, w, h-2, 5);
        ctx.fill();
        ctx.fillStyle = shade(lane.color, -20);
        roundRect(vx+w*0.22, vy-6, w*0.5, 12, 4);
        ctx.fill();
        ctx.fillStyle = &#x27;#bfe9ff&#x27;;
        ctx.fillRect(vx+w*0.26, vy-3, w*0.4, 8);
        ctx.fillStyle = &#x27;#fff3a0&#x27;;
        if (dir &gt; 0) ctx.fillRect(vx+w-4, vy+4, 3, 5);
        else ctx.fillRect(vx+1, vy+4, 3, 5);
      }
    }
    // brake lights when paused
    if (braking) {
      ctx.fillStyle = &#x27;#ff3b30&#x27;;
      if (dir &gt; 0) ctx.fillRect(vx+1, vy+3, 3, h-8);
      else ctx.fillRect(vx+w-4, vy+3, 3, h-8);
    }
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function shade(hex, amt){
    var c = hex.replace(&#x27;#&#x27;,&#x27;&#x27;);
    if (c.length===3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function drawHero() {
    var x = hero.col*CELL + CELL/2;
    var y = hero.row*CELL + CELL/2;
    var s = 4;
    ctx.save();
    ctx.translate(x - 5*s/2, y - 8*s/2);
    ctx.fillStyle = &#x27;#f0c39b&#x27;; px(2,0,2,2);
    ctx.fillStyle = &#x27;#5a3b1b&#x27;; px(2,-1,2,1);
    ctx.fillStyle = &#x27;#e74c3c&#x27;; px(1,2,4,3);
    px(0,2,1,2); px(5,2,1,2);
    ctx.fillStyle = &#x27;#2c3e50&#x27;; px(1,5,1,3); px(3,5,1,3);
    ctx.fillStyle = &#x27;#111&#x27;; px(1,8,1,1); px(3,8,1,1);
    ctx.restore();
    function px(cx,cy,cw,ch){ ctx.fillRect(cx*s, cy*s, cw*s, ch*s); }
  }

  function render() {
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    drawBackground();
    for (var c=0;c&lt;cones.length;c++){ drawCone(cones[c].col, cones[c].row); }
    for (var i=0;i&lt;lanes.length;i++){
      var lane = lanes[i];
      var paused = lanePaused(lane);
      for (var j=0;j&lt;lane.vehicles.length;j++){
        // A vehicle brakes/shows red if the lane is paused and it&#x27;s near the crosswalk
        var vx = lane.vehicles[j].x;
        var cwx = CROSSWALK_COL*CELL;
        var nearCross = paused &amp;&amp; Math.abs((vx + lane.vw/2) - (cwx + CELL/2)) &lt; 180;
        drawVehicle(lane, vx, nearCross);
      }
    }
    drawHero();
  }

  function tick() {
    if (!running) return;
    var cwx = CROSSWALK_COL*CELL;
    for (var i=0;i&lt;lanes.length;i++){
      var lane = lanes[i];
      var paused = lanePaused(lane);
      for (var j=0;j&lt;lane.vehicles.length;j++){
        var v = lane.vehicles[j];
        // If lane is paused, vehicles approaching the crosswalk stop just
        // before it (leaving the crosswalk cell open). Vehicles already
        // past continue on.
        if (paused) {
          if (lane.dir &gt; 0) {
            // moving right: stop if front would enter crosswalk from left
            var front = v.x + lane.vw;
            if (front &lt; cwx &amp;&amp; front + lane.speed &gt;= cwx) { continue; }
            if (v.x &lt; cwx &amp;&amp; front &lt;= cwx + CELL) { continue; } // holding near
          } else {
            var frontL = v.x;
            if (frontL &gt; cwx + CELL &amp;&amp; frontL - lane.speed &lt;= cwx + CELL) { continue; }
            if (v.x + lane.vw &gt; cwx &amp;&amp; v.x &lt; cwx + CELL) { continue; }
          }
        }
        v.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; v.x &gt; FIELD_W) v.x = -lane.vw;
        else if (lane.dir &lt; 0 &amp;&amp; v.x + lane.vw &lt; 0) v.x = FIELD_W;
      }
    }
    // collision (only when NOT protected by crosswalk in this lane)
    var hx = hero.col*CELL + 8, hy = hero.row*CELL + 6;
    var hw = CELL-16, hh = CELL-12;
    for (var k=0;k&lt;lanes.length;k++){
      if (lanes[k].row !== hero.row) continue;
      var ln = lanes[k];
      if (lanePaused(ln)) continue; // safe on crosswalk in this lane
      var vy = ln.y + (CELL - ln.vh)/2;
      for (var m=0;m&lt;ln.vehicles.length;m++){
        var vx = ln.vehicles[m].x;
        if (hx &lt; vx + ln.vw &amp;&amp; hx + hw &gt; vx &amp;&amp; hy &lt; vy + ln.vh &amp;&amp; hy + hh &gt; vy){
          crash();
          return;
        }
      }
    }
    render();
    animId = requestAnimationFrame(tick);
  }

  function isCone(col, row){
    for (var i=0;i&lt;cones.length;i++){
      if (cones[i].col === col &amp;&amp; cones[i].row === row) return true;
    }
    return false;
  }

  function move(dc, dr){
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS-1, hero.col+dc));
    var nr = Math.max(0, Math.min(ROWS-1, hero.row+dr));
    if (isCone(nc, nr)) { return; }
    hero.col = nc; hero.row = nr;

    // Award a point for every NEW lane reached (moving up past the farthest point).
    if (hero.row &lt; farthestRow) {
      var gained = farthestRow - hero.row;
      score += gained;
      farthestRow = hero.row;
      scoreEl.textContent = score;
      if (score &gt; best){ best = score; bestEl.textContent = best; }
    }

    if (hero.row === GOAL_ROW){
      flash(&#x27;CROSSED! 🎉&#x27;);
      makeCones();
      makeLanes();
      // start next crossing back at bottom, reset farthest tracker
      reset();
    }
    render();
  }

  var flashTimer = null;
  function flash(msg){
    banner.textContent = msg;
    banner.style.display = &#x27;block&#x27;;
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(function(){ if(running) banner.style.display=&#x27;none&#x27;; }, 700);
  }

  function crash(){
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId = null; }
    banner.textContent = &#x27;💥 SPLAT! Press Restart&#x27;;
    banner.style.display = &#x27;block&#x27;;
    render();
  }

  function startGame(){
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    makeLanes();
    makeCones();
    reset();
    banner.style.display = &#x27;none&#x27;;
    running = true;
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(tick);
  }
  function stopGame(){
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  makeLanes();
  makeCones();
  reset();
  render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
