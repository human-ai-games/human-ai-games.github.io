&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Whack-a-mole&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack 🐹⭐🟢 moles, grab 🟣 power-ups, and dodge 💣 bombs to build combos and unlock badges. Every 20 seconds a golden bonus round rains moles for big points — use Start/Restart below!&lt;/p&gt;

&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 350, MOLE_SIZE = 60;
  var score = 0, combo = 0, comboExpire = 0, level = 1, elapsed = 0, best = 0;
  var totalHits = 0, maxCombo = 0;
  var spawnId = null, tickId = null, running = false;
  var moleTimeouts = [];
  var frozen = false, freezeUntil = 0, doubleUntil = 0;
  var bonusRound = false, bonusUntil = 0;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var statusEl = document.getElementById(&#x27;status&#x27;);
  var toastEl = document.getElementById(&#x27;toast&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;);
  var achEl = document.getElementById(&#x27;achievements&#x27;);
  var COMBO_WINDOW = 1500;

  var ACHIEVEMENTS = [
    { id: &#x27;first&#x27;, icon: &#x27;🎯&#x27;, label: &#x27;First Hit&#x27;, test: function () { return totalHits &gt;= 1; } },
    { id: &#x27;combo5&#x27;, icon: &#x27;🔥&#x27;, label: &#x27;Combo x5&#x27;, test: function () { return maxCombo &gt;= 12; } },
    { id: &#x27;score100&#x27;, icon: &#x27;💯&#x27;, label: &#x27;100 Points&#x27;, test: function () { return score &gt;= 100; } },
    { id: &#x27;score300&#x27;, icon: &#x27;👑&#x27;, label: &#x27;300 Points&#x27;, test: function () { return score &gt;= 300; } },
    { id: &#x27;hits50&#x27;, icon: &#x27;⚡&#x27;, label: &#x27;50 Hits&#x27;, test: function () { return totalHits &gt;= 50; } },
    { id: &#x27;speed5&#x27;, icon: &#x27;🚀&#x27;, label: &#x27;Speed 5&#x27;, test: function () { return level &gt;= 5; } }
  ];
  var earned = {};

  function buildAchievements() {
    achEl.innerHTML = &#x27;&#x27;;
    ACHIEVEMENTS.forEach(function (a) {
      var el = document.createElement(&#x27;span&#x27;);
      el.className = &#x27;badge&#x27; + (earned[a.id] ? &#x27; earned&#x27; : &#x27;&#x27;);
      el.textContent = a.icon;
      el.title = a.label;
      el.id = &#x27;badge-&#x27; + a.id;
      achEl.appendChild(el);
    });
  }

  function checkAchievements() {
    ACHIEVEMENTS.forEach(function (a) {
      if (!earned[a.id] &amp;&amp; a.test()) {
        earned[a.id] = true;
        var el = document.getElementById(&#x27;badge-&#x27; + a.id);
        if (el) el.className = &#x27;badge earned&#x27;;
        showToast(&#x27;🏆 &#x27; + a.label + &#x27;!&#x27;);
        beep(1046, 0.12, &#x27;sine&#x27;);
      }
    });
  }

  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  var toastTimer = null;
  function showToast(txt) {
    toastEl.textContent = txt;
    toastEl.classList.remove(&#x27;show&#x27;);
    void toastEl.offsetWidth;
    toastEl.classList.add(&#x27;show&#x27;);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove(&#x27;show&#x27;); }, 1600);
  }

  function showBanner(txt) {
    bannerEl.textContent = txt;
    bannerEl.classList.remove(&#x27;show&#x27;);
    void bannerEl.offsetWidth;
    bannerEl.classList.add(&#x27;show&#x27;);
  }

  function currentSpawnMs() {
    var base = Math.max(360, 900 - (level - 1) * 60);
    if (bonusRound) return 200;
    return frozen ? base * 2.2 : base;
  }
  function currentLifeMs() {
    var base = Math.max(650, 1200 - (level - 1) * 70);
    if (bonusRound) return 1400;
    return frozen ? base * 2.2 : base;
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var moles = board.querySelectorAll(&#x27;.mole&#x27;);
    for (var j = 0; j &lt; moles.length; j++) board.removeChild(moles[j]);
  }

  function floatText(x, y, txt, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = txt;
    f.style.left = x + &#x27;px&#x27;;
    f.style.top = y + &#x27;px&#x27;;
    if (color) f.style.color = color;
    board.appendChild(f);
    setTimeout(function () { if (f.parentNode === board) board.removeChild(f); }, 700);
  }

  function comboMultiplier() { return Math.min(5, 1 + Math.floor(combo / 3)); }

  function updateStats() {
    scoreEl.textContent = score;
    var mult = comboMultiplier();
    comboEl.textContent = &#x27;x&#x27; + mult;
    comboEl.className = mult &gt;= 3 ? &#x27;hot&#x27; : &#x27;&#x27;;
    levelEl.textContent = level;
    if (score &gt; best) { best = score; }
    bestEl.textContent = best;
  }

  function updateStatus() {
    var now = Date.now();
    var parts = [];
    if (bonusRound) parts.push(&#x27;🌟 BONUS ROUND &#x27; + Math.ceil((bonusUntil - now) / 1000) + &#x27;s&#x27;);
    if (now &lt; freezeUntil) parts.push(&#x27;❄️ FREEZE &#x27; + Math.ceil((freezeUntil - now) / 1000) + &#x27;s&#x27;);
    if (now &lt; doubleUntil) parts.push(&#x27;✨ 2× &#x27; + Math.ceil((doubleUntil - now) / 1000) + &#x27;s&#x27;);
    statusEl.textContent = parts.join(&#x27;   &#x27;);
  }

  function registerHit(base, x, y, color) {
    var now = Date.now();
    if (now &lt; comboExpire) combo += 1; else combo = 1;
    comboExpire = now + COMBO_WINDOW;
    if (combo &gt; maxCombo) maxCombo = combo;
    var mult = comboMultiplier();
    var gain = base * mult;
    if (now &lt; doubleUntil) gain *= 2;
    if (bonusRound) gain *= 2;
    score += gain;
    totalHits += 1;
    floatText(x, y, &#x27;+&#x27; + gain, color);
    updateStats();
    checkAchievements();
  }

  function makeMole(type, size, left, top, life, onHit) {
    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27; + (type ? &#x27; &#x27; + type : &#x27;&#x27;);
    mole.style.left = left + &#x27;px&#x27;;
    mole.style.top = top + &#x27;px&#x27;;
    var hit = false;
    mole.addEventListener(&#x27;mousedown&#x27;, function () {
      if (hit) return;
      hit = true;
      onHit(mole, left + size / 2 - 10, top);
    });
    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (mole.parentNode === board) { mole.classList.add(&#x27;pop&#x27;); setTimeout(function(){ if (mole.parentNode === board) board.removeChild(mole); }, 120); }
    }, life));
    return mole;
  }

  function pop(mole) {
    mole.classList.add(&#x27;pop&#x27;);
    setTimeout(function () { if (mole.parentNode === board) board.removeChild(mole); }, 120);
  }

  function spawnSwarm() {
    var count = 3 + Math.floor(Math.random() * 3);
    var cx = Math.random() * (BOARD_W - 180) + 90;
    var cy = Math.random() * (BOARD_H - 180) + 90;
    for (var i = 0; i &lt; count; i++) {
      var left = Math.max(0, Math.min(BOARD_W - 48, cx + (Math.random() - 0.5) * 160));
      var top = Math.max(0, Math.min(BOARD_H - 48, cy + (Math.random() - 0.5) * 160));
      var m = makeMole(&#x27;swarm&#x27;, 48, left, top, currentLifeMs() * 0.85, function (mole, fx, fy) {
        registerHit(2, fx, fy, &#x27;#2b8a3e&#x27;);
        beep(660, 0.08);
        pop(mole);
      });
      m.textContent = &#x27;🟢&#x27;;
    }
  }

  function spawnOne() {
    var r = Math.random();
    var left = Math.random() * (BOARD_W - MOLE_SIZE);
    var top = Math.random() * (BOARD_H - MOLE_SIZE);
    if (bonusRound) {
      // bonus round: mostly stars &amp; normal, no bombs
      var br = Math.random();
      if (br &lt; 0.5) {
        var mb = makeMole(&#x27;bonus&#x27;, MOLE_SIZE, left, top, currentLifeMs(), function (mole, fx, fy) {
          registerHit(5, fx, fy, &#x27;#f59f00&#x27;); beep(990, 0.1); pop(mole);
        });
        mb.textContent = &#x27;⭐&#x27;;
      } else {
        var mn = makeMole(&#x27;&#x27;, MOLE_SIZE, left, top, currentLifeMs(), function (mole, fx, fy) {
          registerHit(2, fx, fy, &#x27;#2b8a3e&#x27;); beep(560, 0.07); pop(mole);
        });
        mn.textContent = &#x27;🐹&#x27;;
      }
      return;
    }
    if (r &lt; 0.10) {
      var m = makeMole(&#x27;power&#x27;, MOLE_SIZE, left, top, currentLifeMs(), function (mole, fx, fy) {
        var kind = Math.random() &lt; 0.5 ? &#x27;freeze&#x27; : &#x27;double&#x27;;
        if (kind === &#x27;freeze&#x27;) { freezeUntil = Date.now() + 5000; floatText(fx, fy, &#x27;FREEZE!&#x27;, &#x27;#1971c2&#x27;); }
        else { doubleUntil = Date.now() + 6000; floatText(fx, fy, &#x27;2×!&#x27;, &#x27;#7048e8&#x27;); }
        beep(880, 0.15, &#x27;sine&#x27;); pop(mole); updateStatus();
      });
      m.textContent = &#x27;🟣&#x27;;
    } else if (r &lt; 0.24) {
      var m2 = makeMole(&#x27;bomb&#x27;, MOLE_SIZE, left, top, Math.max(700, currentLifeMs() * 0.9), function (mole, fx, fy) {
        combo = 0; comboExpire = 0; score = Math.max(0, score - 3);
        floatText(fx, fy, &#x27;💥 -3&#x27;, &#x27;#e03131&#x27;); beep(120, 0.25, &#x27;sawtooth&#x27;); pop(mole); updateStats();
      });
      m2.textContent = &#x27;💣&#x27;;
    } else if (r &lt; 0.37) {
      var m3 = makeMole(&#x27;bonus&#x27;, MOLE_SIZE, left, top, currentLifeMs(), function (mole, fx, fy) {
        registerHit(5, fx, fy, &#x27;#f59f00&#x27;); beep(990, 0.1); pop(mole);
      });
      m3.textContent = &#x27;⭐&#x27;;
    } else {
      var m4 = makeMole(&#x27;&#x27;, MOLE_SIZE, left, top, currentLifeMs(), function (mole, fx, fy) {
        registerHit(1, fx, fy, &#x27;#2b8a3e&#x27;); beep(520, 0.07); pop(mole);
      });
      m4.textContent = &#x27;🐹&#x27;;
    }
  }

  function spawnMole() {
    if (!bonusRound &amp;&amp; Math.random() &lt; 0.15) spawnSwarm();
    else spawnOne();
  }

  function scheduleSpawn() {
    if (spawnId) clearTimeout(spawnId);
    spawnMole();
    spawnId = setTimeout(scheduleSpawn, currentSpawnMs());
  }

  function tick() {
    elapsed += 1;
    if (elapsed % 6 === 0 &amp;&amp; level &lt; 10 &amp;&amp; !bonusRound) { level += 1; updateStats(); checkAchievements(); }
    if (Date.now() &gt;= comboExpire &amp;&amp; combo !== 0) { combo = 0; updateStats(); }
    // start bonus round every 20s
    if (elapsed % 20 === 0 &amp;&amp; !bonusRound) {
      bonusRound = true;
      bonusUntil = Date.now() + 6000;
      board.classList.add(&#x27;bonusround&#x27;);
      showBanner(&#x27;BONUS ROUND!&#x27;);
      beep(1318, 0.2, &#x27;sine&#x27;);
    }
    if (bonusRound &amp;&amp; Date.now() &gt;= bonusUntil) {
      bonusRound = false;
      board.classList.remove(&#x27;bonusround&#x27;);
    }
    var wasFrozen = frozen;
    frozen = Date.now() &lt; freezeUntil;
    if (wasFrozen !== frozen) board.classList.toggle(&#x27;frozen&#x27;, frozen &amp;&amp; !bonusRound);
    updateStatus();
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; combo = 0; comboExpire = 0; level = 1; elapsed = 0;
    totalHits = 0; maxCombo = 0;
    frozen = false; freezeUntil = 0; doubleUntil = 0;
    bonusRound = false; bonusUntil = 0;
    earned = {};
    board.classList.remove(&#x27;frozen&#x27;, &#x27;bonusround&#x27;);
    statusEl.textContent = &#x27;&#x27;;
    buildAchievements();
    updateStats();
    clearAllMoles();
    scheduleSpawn();
    tickId = setInterval(tick, 1000);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnId) { clearTimeout(spawnId); spawnId = null; }
    if (tickId) { clearInterval(tickId); tickId = null; }
    clearAllMoles();
  }

  buildAchievements();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
