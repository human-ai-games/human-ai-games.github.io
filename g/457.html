&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 30, SHIP_H = 24, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var AUTO_SPEED = 9;
  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 8;
  var TARGET_SIZE = 34, TARGET_SPEED = 1.8;
  var SPAWN_INTERVAL = 900;
  var AUTO_FIRE_MS = 180;
  var POINTS_PER_HIT = 3;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [];
  var score = 0;
  var lastShot = 0;
  var autoMode = true;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var starsEl = document.getElementById(&#x27;stars&#x27;);
  var autoToggle = document.getElementById(&#x27;autoToggle&#x27;);

  autoToggle.addEventListener(&#x27;change&#x27;, function () { autoMode = autoToggle.checked; });

  var starObjs = [];
  (function buildStars() {
    for (var i = 0; i &lt; 60; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      var size = Math.random() * 2 + 1;
      s.style.width = size + &#x27;px&#x27;;
      s.style.height = size + &#x27;px&#x27;;
      var x = Math.random() * FIELD_W;
      var y = Math.random() * FIELD_H;
      s.style.left = x + &#x27;px&#x27;;
      s.style.top = y + &#x27;px&#x27;;
      s.style.animationDelay = (Math.random() * 2) + &#x27;s&#x27;;
      starsEl.appendChild(s);
      starObjs.push({ el: s, y: y, speed: 0.3 + Math.random() * 0.9 });
    }
  })();

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;target&#x27;;
    el.style.left = t.x + &#x27;px&#x27;;
    el.style.top = t.y + &#x27;px&#x27;;
    el.style.animationDelay = (Math.random() * 0.9) + &#x27;s&#x27;;
    field.appendChild(el);
    t.el = el;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    fireBullet();
  }
  function fireBullet() {
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;bullet&#x27;;
    el.style.left = b.x + &#x27;px&#x27;;
    el.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(el);
    b.el = el;
    bullets.push(b);
  }

  function pickTarget() {
    var best = null, bestY = -Infinity;
    for (var i = 0; i &lt; targets.length; i++) {
      if (targets[i].y &gt; bestY) { bestY = targets[i].y; best = targets[i]; }
    }
    return best;
  }

  var effects = [];
  function burst(cx, cy) {
    var pop = document.createElement(&#x27;div&#x27;);
    pop.className = &#x27;pop&#x27;;
    pop.textContent = &#x27;+&#x27; + POINTS_PER_HIT;
    pop.style.left = (cx - 8) + &#x27;px&#x27;;
    pop.style.top = (cy - 10) + &#x27;px&#x27;;
    field.appendChild(pop);
    setTimeout(function () { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 700);
    var colors = [&#x27;#ffd45e&#x27;, &#x27;#ff4fb0&#x27;, &#x27;#7fdcff&#x27;, &#x27;#fff&#x27;, &#x27;#ff9d2b&#x27;];
    for (var i = 0; i &lt; 12; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      p.style.background = colors[i % colors.length];
      p.style.boxShadow = &#x27;0 0 6px &#x27; + colors[i % colors.length];
      p.style.left = cx + &#x27;px&#x27;;
      p.style.top = cy + &#x27;px&#x27;;
      field.appendChild(p);
      var ang = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
      var spd = 2 + Math.random() * 3;
      effects.push({ el: p, x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1 });
    }
  }

  function tick() {
    if (!running) return;

    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;

    if (autoMode) {
      var target = pickTarget();
      if (target) {
        var shipCenter = shipX + SHIP_W / 2;
        var targetCenter = target.x + TARGET_SIZE / 2;
        var diff = targetCenter - shipCenter;
        if (Math.abs(diff) &lt;= AUTO_SPEED) shipX += diff;
        else shipX += (diff &gt; 0 ? AUTO_SPEED : -AUTO_SPEED);
        var now = Date.now();
        if (Math.abs(diff) &lt; 18 &amp;&amp; now - lastShot &gt;= AUTO_FIRE_MS) {
          lastShot = now;
          fireBullet();
        }
      }
    }

    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    for (var si = 0; si &lt; starObjs.length; si++) {
      var st = starObjs[si];
      st.y += st.speed;
      if (st.y &gt; FIELD_H) { st.y = -2; st.el.style.left = (Math.random() * FIELD_W) + &#x27;px&#x27;; }
      st.el.style.top = st.y + &#x27;px&#x27;;
    }

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }
    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
    }
    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        if (b2.x &lt; t2.x + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; t2.x &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          burst(t2.x + TARGET_SIZE / 2, t2.y + TARGET_SIZE / 2);
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += POINTS_PER_HIT;
          scoreEl.textContent = score;
          break;
        }
      }
    }

    for (var e = effects.length - 1; e &gt;= 0; e--) {
      var fx = effects[e];
      fx.x += fx.vx; fx.y += fx.vy; fx.vy += 0.12; fx.life -= 0.04;
      if (fx.life &lt;= 0) { if (fx.el.parentNode) fx.el.parentNode.removeChild(fx.el); effects.splice(e, 1); continue; }
      fx.el.style.left = fx.x + &#x27;px&#x27;;
      fx.el.style.top = fx.y + &#x27;px&#x27;;
      fx.el.style.opacity = fx.life;
      fx.el.style.transform = &#x27;scale(&#x27; + (0.5 + fx.life) + &#x27;)&#x27;;
    }

    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    effects.forEach(function (fx) { if (fx.el.parentNode) fx.el.parentNode.removeChild(fx.el); });
    bullets = []; targets = []; effects = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
