<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }

</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🍬 Don&#x27;t hit me! 👻</b> &middot; Game 264 &middot; Amateur producer &middot; Basic game: Road crossing</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: #e0006c; text-shadow: 1px 1px 0 #ffd21a; }
  .instructions { font-size: 16px; color: #555; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #333; margin: 0; font-weight: 700; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden;
           background: #2b2b33; }
  .lane-divider { position: absolute; left: 0; right: 0; height: 4px; }
  .dash { position:absolute; height:4px; width:26px; background:#c9b93d; border-radius:2px; opacity:.7; }
  .obstacle { position: absolute; font-size: 34px; line-height: 1; text-align:center; will-change: left;
              filter: grayscale(.4) brightness(.75) drop-shadow(0 0 6px #9b5cff); }
  .ghost-eyes { position:absolute; z-index:6; pointer-events:none; font-size:12px; color:#c9f;
                text-shadow:0 0 6px #fff, 0 0 3px #9b5cff; animation: flick 1.4s infinite; }
  @keyframes flick { 0%,100%{opacity:.9} 45%{opacity:.3} 50%{opacity:.9} }
  .hero { position: absolute; font-size: 30px; text-align:center; line-height:1; z-index:8; }
  .candy { position:absolute; font-size:30px; text-align:center; z-index:4; filter:drop-shadow(0 0 6px #ff2d95); }
  .banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
            font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 6px #000; z-index:30; pointer-events:none; }
  .syrup { position:absolute; font-size:32px; z-index:20; pointer-events:none; }
  .spark { position:absolute; font-size:26px; z-index:24; pointer-events:none; }
  .rain { position:absolute; width:2px; height:14px; background:linear-gradient(#bcd3ff, transparent); z-index:12; pointer-events:none; opacity:.6; }
  .heartbit { position:absolute; z-index:28; pointer-events:none; }
  .congrats { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:29; pointer-events:none; }
  .congrats span { font-size:26px; font-weight:900; color:#fff; text-align:center; line-height:1.25; max-width:90%;
                   text-shadow:0 0 8px #ff2d95, 0 0 16px #ff8a00, 2px 2px 0 #000;
                   animation: pop .5s ease-out; }
  @keyframes pop { 0%{transform:scale(0.2);opacity:0} 60%{transform:scale(1.15);opacity:1} 100%{transform:scale(1);opacity:1} }
  .rainbow { position:absolute; left:-10%; top:-40%; width:120%; height:120%; z-index:6; pointer-events:none; opacity:0;
             background: conic-gradient(from 200deg at 50% 120%, #ff004c, #ff8a00, #ffe600, #33e000, #00c2ff, #7a00ff, #ff004c);
             mix-blend-mode: screen; border-radius:50%; transition:opacity .2s; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍬 Don&#x27;t hit me! 👻&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to guide the child across the rainy, haunted highway and grab the candy at the top for a point. Dodge every spooky car, bus, truck and spaceship — one bump ends the round, and traffic speeds up each time you score!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; Speed: &lt;span id=&quot;lvl&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 12;
  var running = false, animId = null, rainId = null;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0, speedMul = 1;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null, candyEl = null, rainbowEl = null, rainLayer = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var lvlEl = document.getElementById(&#x27;lvl&#x27;);
  var candyType = &#x27;🍬&#x27;;

  var VEHICLES = [
    { emoji:&#x27;🚗&#x27;, w:2 }, { emoji:&#x27;🚙&#x27;, w:2 }, { emoji:&#x27;🏎️&#x27;, w:2 },
    { emoji:&#x27;🚕&#x27;, w:2 }, { emoji:&#x27;🚌&#x27;, w:3 }, { emoji:&#x27;🚚&#x27;, w:3 },
    { emoji:&#x27;🚛&#x27;, w:3 }, { emoji:&#x27;🚐&#x27;, w:3 }, { emoji:&#x27;🛸&#x27;, w:2 }
  ];
  var CANDIES = [&#x27;🍬&#x27;,&#x27;🍭&#x27;,&#x27;🍫&#x27;,&#x27;🧁&#x27;,&#x27;🍩&#x27;,&#x27;🍪&#x27;];
  var SKINS = [
    &#x27;radial-gradient(circle at 30% 30%, #666 3px, transparent 4px), radial-gradient(circle at 70% 70%, #666 3px, transparent 4px), #4a2d66&#x27;,
    &#x27;radial-gradient(circle at 25% 60%, #557 3px, transparent 4px), radial-gradient(circle at 65% 30%, #557 3px, transparent 4px), #2d3a66&#x27;,
    &#x27;linear-gradient(45deg,#4a2d66,#663355,#2d3a66,#3a2d66)&#x27;,
    &#x27;radial-gradient(circle at 50% 50%, #567 2px, transparent 3px), #2d4d3d&#x27;,
    &#x27;linear-gradient(135deg,#5a1a4c,#4a2d66,#5a1a4c)&#x27;,
    &#x27;linear-gradient(45deg,#3a1a66,#1a4d66,#1a4d3d,#4d4d1a)&#x27;
  ];

  function skinFor(i){ return SKINS[i % SKINS.length]; }
  function clearField(){ field.innerHTML=&#x27;&#x27;; rainbowEl=null; heroEl=null; candyEl=null; rainLayer=null; }

  function drawRoad() {
    for (var r = 1; r &lt; ROWS; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane-divider&#x27;;
      d.style.top = (r * CELL - 2) + &#x27;px&#x27;;
      d.style.background = (r===1 || r===ROWS-1) ? &#x27;#889&#x27; : &#x27;transparent&#x27;;
      field.appendChild(d);
      if (r&gt;1 &amp;&amp; r&lt;ROWS-1) {
        for (var x=0;x&lt;FIELD_W;x+=52){
          var dash=document.createElement(&#x27;div&#x27;);
          dash.className=&#x27;dash&#x27;;
          dash.style.left=x+&#x27;px&#x27;; dash.style.top=(r*CELL-2)+&#x27;px&#x27;;
          field.appendChild(dash);
        }
      }
    }
    // dark rainy grass sidewalks top &amp; bottom
    var grassBg = &#x27;radial-gradient(circle at 20% 30%, #2a5f24 2px, transparent 3px), radial-gradient(circle at 60% 70%, #1f4f1a 2px, transparent 3px), repeating-linear-gradient(90deg,#2f6b28 0 10px,#285f22 10px 20px)&#x27;;
    var top=document.createElement(&#x27;div&#x27;);
    top.style.cssText=&#x27;position:absolute;left:0;right:0;top:0;height:&#x27;+CELL+&#x27;px;background:&#x27;+grassBg+&#x27;;&#x27;;
    field.appendChild(top);
    var bot=document.createElement(&#x27;div&#x27;);
    bot.style.cssText=&#x27;position:absolute;left:0;right:0;bottom:0;height:&#x27;+CELL+&#x27;px;background:&#x27;+grassBg+&#x27;;&#x27;;
    field.appendChild(bot);
    var deco = [&#x27;🥀&#x27;,&#x27;🍂&#x27;,&#x27;🌿&#x27;,&#x27;🍄&#x27;];
    for (var g=0; g&lt;COLS; g+=2){
      var t=document.createElement(&#x27;div&#x27;);
      t.textContent = deco[g % deco.length];
      t.style.cssText=&#x27;position:absolute;font-size:16px;top:4px;left:&#x27;+(g*CELL+6)+&#x27;px;z-index:2;&#x27;;
      field.appendChild(t);
      var bb=document.createElement(&#x27;div&#x27;);
      bb.textContent = deco[(g+1) % deco.length];
      bb.style.cssText=&#x27;position:absolute;font-size:16px;bottom:4px;left:&#x27;+(g*CELL+26)+&#x27;px;z-index:2;&#x27;;
      field.appendChild(bb);
    }
    // rain layer container
    rainLayer=document.createElement(&#x27;div&#x27;);
    rainLayer.style.cssText=&#x27;position:absolute;inset:0;z-index:12;pointer-events:none;&#x27;;
    field.appendChild(rainLayer);
  }

  function buildLanes() {
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL;
      var dir = (i % 2 === 0) ? 1 : -1;
      var baseSpeed = 0.6 + (i % 3) * 0.25;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var v = VEHICLES[(i*3+j) % VEHICLES.length];
        var w = v.w * CELL - 12;
        var x = j * gap + (i * 33) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.textContent = v.emoji;
        el.style.width = w + &#x27;px&#x27;;
        el.style.height = (CELL-14) + &#x27;px&#x27;;
        el.style.lineHeight = (CELL-14) + &#x27;px&#x27;;
        el.style.top = (y+7) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.style.background = skinFor(i+j);
        el.style.borderRadius = &#x27;10px&#x27;;
        el.style.boxShadow = &#x27;0 0 10px rgba(155,92,255,.6)&#x27;;
        if (dir&lt;0) el.style.transform=&#x27;scaleX(-1)&#x27;;
        field.appendChild(el);
        // haunted glowing eyes
        var eyes=document.createElement(&#x27;div&#x27;);
        eyes.className=&#x27;ghost-eyes&#x27;;
        eyes.textContent=&#x27;👁 👁&#x27;;
        eyes.style.top=(y+9)+&#x27;px&#x27;;
        eyes.style.left=x+&#x27;px&#x27;;
        eyes.style.width=w+&#x27;px&#x27;;
        eyes.style.textAlign=&#x27;center&#x27;;
        field.appendChild(eyes);
        obstacles.push({ x:x, w:w, el:el, eyes:eyes, vw: v.w });
      }
      lanes.push({ y:y, dir:dir, speed:baseSpeed, obstacles:obstacles });
    }
  }

  function makeHero() {
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🧒&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.lineHeight = HERO_SIZE + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  var candyCol = 0;
  function makeCandy() {
    candyType = CANDIES[Math.floor(Math.random()*CANDIES.length)];
    candyEl = document.createElement(&#x27;div&#x27;);
    candyEl.className = &#x27;candy&#x27;;
    candyEl.textContent = candyType;
    candyEl.style.width = CELL + &#x27;px&#x27;;
    candyEl.style.height = CELL + &#x27;px&#x27;;
    candyEl.style.lineHeight = CELL + &#x27;px&#x27;;
    candyEl.style.top = &#x27;0px&#x27;;
    candyCol = Math.floor(Math.random()*COLS);
    candyEl.style.left = (candyCol*CELL) + &#x27;px&#x27;;
    field.appendChild(candyEl);
  }

  function makeRainbow(){
    rainbowEl = document.createElement(&#x27;div&#x27;);
    rainbowEl.className=&#x27;rainbow&#x27;;
    field.appendChild(rainbowEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }
  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  // ---- rain animation ----
  var raindrops = [];
  function spawnRain(){
    if (!rainLayer) return;
    for (var i=0;i&lt;3;i++){
      var d=document.createElement(&#x27;div&#x27;);
      d.className=&#x27;rain&#x27;;
      var x=Math.random()*FIELD_W;
      d.style.left=x+&#x27;px&#x27;; d.style.top=&#x27;-14px&#x27;;
      rainLayer.appendChild(d);
      raindrops.push({el:d, x:x, y:-14, vy:8+Math.random()*5});
    }
  }
  function stepRain(){
    for (var i=raindrops.length-1;i&gt;=0;i--){
      var r=raindrops[i];
      r.y+=r.vy; r.x+=1.2;
      r.el.style.top=r.y+&#x27;px&#x27;; r.el.style.left=r.x+&#x27;px&#x27;;
      if (r.y&gt;FIELD_H){ if(r.el.parentNode) r.el.parentNode.removeChild(r.el); raindrops.splice(i,1); }
    }
  }
  function clearRain(){
    raindrops.forEach(function(r){ if(r.el.parentNode) r.el.parentNode.removeChild(r.el); });
    raindrops=[];
  }

  function tick() {
    if (!running) return;
    spawnRain(); stepRain();
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed * speedMul;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -o.w;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
        o.eyes.style.left = o.x + &#x27;px&#x27;;
      }
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL + (CELL - HERO_SIZE) / 2;
      var lane = lanes[laneIdx];
      for (var k = 0; k &lt; lane.obstacles.length; k++) {
        var o2 = lane.obstacles[k];
        if (hx &lt; o2.x + o2.w - 6 &amp;&amp; hx + HERO_SIZE &gt; o2.x + 6) {
          endGame();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function explosion(cx, cy){
    var bits = [&#x27;💥&#x27;,&#x27;✨&#x27;,&#x27;⭐&#x27;,&#x27;💖&#x27;,&#x27;🎉&#x27;,&#x27;💫&#x27;,&#x27;🌟&#x27;];
    for (var s=0; s&lt;22; s++){
      (function(){
        var el=document.createElement(&#x27;div&#x27;);
        el.className=&#x27;spark&#x27;;
        el.textContent = bits[Math.floor(Math.random()*bits.length)];
        el.style.left = cx+&#x27;px&#x27;; el.style.top = cy+&#x27;px&#x27;;
        field.appendChild(el);
        var ang = Math.random()*Math.PI*2, spd = 3+Math.random()*6;
        var vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd;
        var x=cx, y=cy, life=0;
        var iv=setInterval(function(){
          vy+=0.25; x+=vx; y+=vy; life++;
          el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
          el.style.opacity = Math.max(0, 1 - life/50);
          if (life&gt;50){ clearInterval(iv); if(el.parentNode) el.parentNode.removeChild(el); }
        },16);
      })();
    }
  }

  // hearts raining all over the winner screen
  function heartShower(){
    var hearts=[&#x27;❤️&#x27;,&#x27;💖&#x27;,&#x27;💗&#x27;,&#x27;💓&#x27;,&#x27;💕&#x27;,&#x27;💞&#x27;,&#x27;💘&#x27;,&#x27;🩷&#x27;,&#x27;💜&#x27;,&#x27;🧡&#x27;];
    for (var h=0; h&lt;40; h++){
      (function(){
        var el=document.createElement(&#x27;div&#x27;);
        el.className=&#x27;heartbit&#x27;;
        el.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        el.style.fontSize = (16+Math.random()*22)+&#x27;px&#x27;;
        var x=Math.random()*FIELD_W, y=-30;
        el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
        field.appendChild(el);
        var vy=2+Math.random()*4, sway=Math.random()*2-1, life=0;
        var iv=setInterval(function(){
          y+=vy; x+=Math.sin(life/8)*sway; life++;
          el.style.top=y+&#x27;px&#x27;; el.style.left=x+&#x27;px&#x27;;
          el.style.transform=&#x27;rotate(&#x27;+(life*4)+&#x27;deg)&#x27;;
          if (y&gt;FIELD_H+30 || life&gt;200){ clearInterval(iv); if(el.parentNode) el.parentNode.removeChild(el); }
        },16);
      })();
    }
  }

  function showCongrats(){
    var c=document.createElement(&#x27;div&#x27;);
    c.className=&#x27;congrats&#x27;;
    c.innerHTML=&#x27;&lt;span&gt;🎉 CONGRATULATIONS 🎉&lt;br&gt;YOU SEXY BITCH!&lt;br&gt;Mandi is in love with you 💖&lt;br&gt;Don\&#x27;t fuck it up 😘&lt;/span&gt;&#x27;;
    field.appendChild(c);
    setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 2200);
  }

  function celebrate() {
    if (rainbowEl) { rainbowEl.style.opacity = &#x27;0.85&#x27;; setTimeout(function(){ if(rainbowEl) rainbowEl.style.opacity=&#x27;0&#x27;; }, 1600); }
    explosion(FIELD_W/2, FIELD_H/2);
    heartShower();
    for (var s=0; s&lt;14; s++){
      (function(){
        var drop=document.createElement(&#x27;div&#x27;);
        drop.className=&#x27;syrup&#x27;;
        drop.textContent = Math.random()&lt;0.5 ? &#x27;🟤&#x27; : &#x27;🍫&#x27;;
        var sx = Math.random()*FIELD_W;
        drop.style.left = sx+&#x27;px&#x27;;
        drop.style.top = &#x27;-30px&#x27;;
        field.appendChild(drop);
        var vy = 4 + Math.random()*4, y=-30, life=0;
        var iv = setInterval(function(){
          vy += 0.6; y += vy; life++;
          drop.style.top = y+&#x27;px&#x27;;
          if (y&gt;FIELD_H || life&gt;120){ clearInterval(iv); if(drop.parentNode) drop.parentNode.removeChild(drop); }
        }, 16);
      })();
    }
    showCongrats();
    playWin();
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    if (hero.row === 0 &amp;&amp; Math.abs(hero.col - candyCol) &lt;= 1) {
      score += 1;
      speedMul += 0.25;
      scoreEl.textContent = score;
      lvlEl.textContent = (Math.round(speedMul*4)/4);
      celebrate();
      if (candyEl &amp;&amp; candyEl.parentNode) candyEl.parentNode.removeChild(candyEl);
      makeCandy();
      resetHero();
    } else if (hero.row === 0) {
      resetHero();
    }
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    playCrash();
    var b = document.createElement(&#x27;div&#x27;);
    b.className=&#x27;banner&#x27;;
    b.innerHTML = &#x27;💥 Ouch! 👻&lt;div style=&quot;font-size:20px;margin-top:8px&quot;&gt;Final score: &#x27;+score+&#x27;&lt;/div&gt;&lt;div style=&quot;font-size:16px;margin-top:6px&quot;&gt;Press Start below to try again&lt;/div&gt;&#x27;;
    field.appendChild(b);
  }

  function startGame() {
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    clearRain();
    score = 0; speedMul = 1;
    scoreEl.textContent = &#x27;0&#x27;; lvlEl.textContent = &#x27;1&#x27;;
    clearField();
    drawRoad();
    makeRainbow();
    buildLanes();
    makeCandy();
    makeHero();
    resetHero();
