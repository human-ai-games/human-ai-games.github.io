<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>★ STAR SIEGE ★</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>★ STAR SIEGE ★</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: radial-gradient(ellipse at 50% 0%, #1a1040 0%, #060812 70%); color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  h1 { margin: 0; font-size: 27px; font-weight: 900; letter-spacing: 3px;
       background: linear-gradient(90deg,#7fd7ff,#c77dff,#ff7dc0,#ffd24f,#7fd7ff);
       background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
       -webkit-text-fill-color: transparent; color: transparent;
       animation: hue 5s linear infinite; filter: drop-shadow(0 0 12px #7a5cff88); }
  @keyframes hue { 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
  .instructions { font-size: 16px; color: #c3caf0; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .legend { font-size: 16px; color: #aab4e0; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .legend span { white-space: nowrap; }
  .hud { display: flex; gap: 12px; font-size: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .hud .box { background: linear-gradient(180deg,#1a2246,#12172b); padding: 4px 12px; border-radius: 8px; border: 1px solid #3a4785; box-shadow: 0 0 10px #2a6cff33; }
  .hud b { color: #7fd7ff; }
  .field { position: relative; width: 620px; height: 380px; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 1px solid #3a4785; box-shadow: inset 0 0 50px #4a2a8055, 0 0 20px #2a6cff33; }
  #stars { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .ship { position: absolute; width: 34px; height: 26px; bottom: 12px; font-size: 26px; line-height: 26px; text-align: center; transition: filter .1s; z-index: 3; filter: drop-shadow(0 0 6px #7fd7ff); }
  .ship.shield { filter: drop-shadow(0 0 6px #4ff) drop-shadow(0 0 14px #4ff); }
  .ship.blink { opacity: .4; }
  .flame { position: absolute; width: 12px; height: 16px; bottom: -2px; left: 11px; z-index: 2;
           background: radial-gradient(circle at 50% 20%, #fff 0%, #ffd24f 35%, #ff6b3d 70%, transparent 80%);
           border-radius: 50% 50% 60% 60%; filter: blur(1px); animation: flick .12s infinite alternate; }
  @keyframes flick { from{transform:scaleY(1);opacity:.9} to{transform:scaleY(0.6);opacity:.6} }
  .bullet { position: absolute; width: 5px; height: 14px; background: linear-gradient(#fff,#ffd24f); border-radius: 3px; box-shadow: 0 0 10px #ffd24f, 0 0 4px #fff; z-index: 2; }
  .ebullet { position: absolute; width: 7px; height: 14px; background: linear-gradient(#fff,#ff3366); border-radius: 3px; box-shadow: 0 0 10px #ff3366; z-index: 2; }
  .enemy { position: absolute; width: 34px; height: 34px; font-size: 28px; line-height: 34px; text-align: center; z-index: 2; filter: drop-shadow(0 0 6px #b57dff); }
  .powerup { position: absolute; width: 30px; height: 30px; font-size: 23px; line-height: 30px; text-align: center; z-index: 2; filter: drop-shadow(0 0 9px #fff); animation: bob 1s ease-in-out infinite, spinpu 2.4s linear infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes spinpu { 0%{filter:drop-shadow(0 0 9px #7fd7ff)} 50%{filter:drop-shadow(0 0 12px #ff7dc0)} 100%{filter:drop-shadow(0 0 9px #7fd7ff)} }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; z-index: 2; pointer-events: none; }
  .flash { position: absolute; border-radius: 50%; z-index: 2; pointer-events: none; background: radial-gradient(circle, #fff 0%, #ffd24f 40%, transparent 70%); }
  .pop { position: absolute; z-index: 4; pointer-events: none; font-size: 15px; font-weight: 800; color: #ffe97f; text-shadow: 0 0 6px #ff9d3d; animation: rise .8s ease-out forwards; }
  @keyframes rise { 0%{opacity:0; transform: translateY(0) scale(.6)} 20%{opacity:1} 100%{opacity:0; transform: translateY(-30px) scale(1.1)} }
  .banner { position: absolute; top: 42%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; letter-spacing: 2px; color: #7fd7ff; text-shadow: 0 0 16px #2a6cff, 0 0 30px #7a5cff; pointer-events: none; opacity: 0; z-index: 4; }
  .banner.show { animation: flash2 1.6s ease-out; }
  @keyframes flash2 { 0%{opacity:0; transform: scale(1.6)} 18%{opacity:1; transform: scale(1)} 80%{opacity:1} 100%{opacity:0} }
  .timers { display: flex; gap: 8px; height: 8px; margin-top: 1px; }
  .tbar { width: 70px; height: 8px; border-radius: 4px; background: #1a2140; overflow: hidden; opacity: .3; transition: opacity .2s; }
  .tbar.on { opacity: 1; box-shadow: 0 0 8px currentColor; }
  .tbar i { display: block; height: 100%; width: 100%; }
  .msg { font-size: 16px; color: #ffd24f; height: 20px; margin: 0; text-align:center; text-shadow: 0 0 6px #ff9d3d55; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;&amp;#9733; STAR SIEGE &amp;#9733;&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Fly with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and hold &lt;strong&gt;Space&lt;/strong&gt; to fire at the aliens. Shoot every enemy to clear a level; there are 5 levels, 3 lives, and a brief shield flashes after each hit.&lt;/p&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&amp;#128121; alien = 50pts&lt;/span&gt;
    &lt;span&gt;&amp;#128126; gold = 150pts (2 hits)&lt;/span&gt;
    &lt;span&gt;&amp;#9889; rapid&lt;/span&gt;
    &lt;span&gt;&amp;#128305; spread&lt;/span&gt;
    &lt;span&gt;&amp;#128737;&amp;#65039; shield&lt;/span&gt;
    &lt;span&gt;&amp;#128142; +250&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;High &lt;b id=&quot;high&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Level &lt;b id=&quot;level&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Lives &lt;b id=&quot;lives&quot;&gt;&amp;#10084;&amp;#10084;&amp;#10084;&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;timers&quot;&gt;
    &lt;div class=&quot;tbar&quot; id=&quot;tRapid&quot; style=&quot;color:#ffd24f&quot;&gt;&lt;i style=&quot;background:#ffd24f&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;tbar&quot; id=&quot;tSpread&quot; style=&quot;color:#7fd7ff&quot;&gt;&lt;i style=&quot;background:#7fd7ff&quot;&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class=&quot;tbar&quot; id=&quot;tShield&quot; style=&quot;color:#4ff&quot;&gt;&lt;i style=&quot;background:#4ff&quot;&gt;&lt;/i&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/p&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;stars&quot; width=&quot;620&quot; height=&quot;380&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;layer&quot; id=&quot;layer&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&amp;#128640;&lt;div class=&quot;flame&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 380;
  var SHIP_W = 34, SHIP_H = 26, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 5, BULLET_H = 14, BULLET_SPEED = 8;
  var EBULLET_W = 7, EBULLET_H = 14, EBULLET_SPEED = 3.4;
  var ENEMY_SIZE = 34, PU_SIZE = 30;
  var TOTAL_LEVELS = 5;
  var PU_DUR = 420;

  var running = false, animId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], enemies = [], ebullets = [], powerups = [], particles = [], flashes = [];
  var score = 0, high = 0, level = 1, lives = 3;
  var lastShot = 0;
  var spawnQueue = 0, spawnTimer = 0, spawnGap = 60;
  var levelActive = false, levelTransition = 0;
  var rapidUntil = 0, spreadUntil = 0, shieldUntil = 0, invulnUntil = 0;
  var frame = 0, shake = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var layer = document.getElementById(&#x27;layer&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var highEl = document.getElementById(&#x27;high&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);
  var tRapid = document.getElementById(&#x27;tRapid&#x27;);
  var tSpread = document.getElementById(&#x27;tSpread&#x27;);
  var tShield = document.getElementById(&#x27;tShield&#x27;);

  // ---- starfield + nebula ----
  var starCanvas = document.getElementById(&#x27;stars&#x27;);
  var sctx = starCanvas.getContext(&#x27;2d&#x27;);
  var stars = [];
  var starColors = [&#x27;#cfe0ff&#x27;,&#x27;#ffd9f0&#x27;,&#x27;#d9ffe8&#x27;,&#x27;#fff4cf&#x27;];
  for (var i=0;i&lt;90;i++) stars.push({x:Math.random()*FIELD_W, y:Math.random()*FIELD_H, s:Math.random()*1.8+0.4, v:Math.random()*0.9+0.3, c:starColors[Math.floor(Math.random()*starColors.length)], tw:Math.random()*Math.PI*2});
  // static nebula blobs
  var nebula = [];
  for (var i=0;i&lt;5;i++) nebula.push({x:Math.random()*FIELD_W, y:Math.random()*FIELD_H, r:80+Math.random()*90, c:[&#x27;#4a2a80&#x27;,&#x27;#2a4a80&#x27;,&#x27;#802a5a&#x27;,&#x27;#2a6060&#x27;][i%4]});
  function drawStars() {
    // background gradient
    var g=sctx.createLinearGradient(0,0,0,FIELD_H);
    g.addColorStop(0,&#x27;#0d0a2a&#x27;); g.addColorStop(1,&#x27;#05060f&#x27;);
    sctx.fillStyle=g; sctx.fillRect(0,0,FIELD_W,FIELD_H);
    // nebula
    for (var i=0;i&lt;nebula.length;i++){
      var n=nebula[i];
      var rg=sctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      rg.addColorStop(0,n.c+&#x27;55&#x27;); rg.addColorStop(1,&#x27;transparent&#x27;);
      sctx.fillStyle=rg; sctx.beginPath(); sctx.arc(n.x,n.y,n.r,0,Math.PI*2); sctx.fill();
    }
    // stars
    for (var i=0;i&lt;stars.length;i++){
      var st=stars[i];
      if (running){ st.y+=st.v; st.tw+=0.08; if(st.y&gt;FIELD_H){st.y=0;st.x=Math.random()*FIELD_W;} }
      sctx.globalAlpha = 0.4+0.4*Math.abs(Math.sin(st.tw))+st.s/4;
      sctx.fillStyle = st.c;
      sctx.fillRect(st.x, st.y, st.s, st.s);
    }
    sctx.globalAlpha = 1;
  }

  // ---- sound ----
  var actx = null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq,dur,type,vol){
    var c=ac(); if(!c) return;
    try{
      var o=c.createOscillator(),g=c.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq; g.gain.value=vol||0.06;
      o.connect(g); g.connect(c.destination);
      var t=c.currentTime; o.start(t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.frequency.linearRampToValueAtTime(freq*0.7,t+dur);
      o.stop(t+dur);
    }catch(e){}
  }

  function paintShip(){ ship.style.left=shipX+&#x27;px&#x27;; }
  function updHud(){
    scoreEl.textContent=score; highEl.textContent=high; levelEl.textContent=level;
    var h=&#x27;&#x27;; for(var i=0;i&lt;lives;i++) h+=&#x27;\u2764&#x27;;
    livesEl.innerHTML=h||&#x27;\u2013&#x27;;
    setBar(tRapid,rapidUntil); setBar(tSpread,spreadUntil); setBar(tShield,shieldUntil);
  }
  function setBar(el,until){
    var rem=until-frame;
    if (rem&gt;0){ el.classList.add(&#x27;on&#x27;); el.firstElementChild.style.width=(rem/PU_DUR*100)+&#x27;%&#x27;; }
    else { el.classList.remove(&#x27;on&#x27;); el.firstElementChild.style.width=&#x27;0%&#x27;; }
  }
  function banner(txt){ bannerEl.textContent=txt; bannerEl.className=&#x27;banner&#x27;; void bannerEl.offsetWidth; bannerEl.className=&#x27;banner show&#x27;; }
  function msg(txt){ msgEl.textContent=txt; }

  function scorePop(x,y,txt){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;pop&#x27;; el.textContent=txt;
    el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
    layer.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },800);
  }
  function bigFlash(x,y,size){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;flash&#x27;;
    el.style.width=size+&#x27;px&#x27;; el.style.height=size+&#x27;px&#x27;;
    el.style.left=(x-size/2)+&#x27;px&#x27;; el.style.top=(y-size/2)+&#x27;px&#x27;;
    el.style.transition=&#x27;transform .3s ease-out, opacity .3s ease-out&#x27;;
    el.style.transform=&#x27;scale(0.3)&#x27;; el.style.opacity=&#x27;1&#x27;;
    layer.appendChild(el);
    requestAnimationFrame(function(){ el.style.transform=&#x27;scale(1.4)&#x27;; el.style.opacity=&#x27;0&#x27;; });
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },320);
  }

  function explosion(x,y,color,n){
    for (var i=0;i&lt;n;i++){
      var a=Math.random()*Math.PI*2, sp=Math.random()*3.5+1;
      var p={x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*14,el:document.createElement(&#x27;div&#x27;)};
      p.el.className=&#x27;particle&#x27;; p.el.style.background=color; p.el.style.boxShadow=&#x27;0 0 6px &#x27;+color;
      p.el.style.left=x+&#x27;px&#x27;; p.el.style.top=y+&#x27;px&#x27;;
      layer.appendChild(p.el); particles.push(p);
    }
  }

  function startLevel(n){
    level=n; spawnQueue=4+n*2; spawnTimer=0;
    spawnGap=Math.max(30,66-n*5); levelActive=true; levelTransition=0;
    banner(&#x27;LEVEL &#x27;+n); msg(&#x27;&#x27;); updHud();
  }

  function spawnEnemy(){
    var gold=Math.random()&lt;0.13;
    var e={ x:Math.random()*(FIELD_W-ENEMY_SIZE), y:-ENEMY_SIZE, baseX:0,
      phase:Math.random()*Math.PI*2, amp:24+Math.random()*(30+level*6),
      vy:0.75+level*0.2+Math.random()*0.35, swaySpeed:0.018+Math.random()*0.02+level*0.002,
      hp:gold?2:1, gold:gold, shootChance:0.0025+level*0.0016, el:document.createElement(&#x27;div&#x27;) };
    e.baseX=e.x; e.el.className=&#x27;enemy&#x27;; e.el.textContent=gold?&#x27;\uD83D\uDC7E&#x27;:&#x27;\uD83D\uDC7D&#x27;;
    if (gold) e.el.style.filter=&#x27;hue-rotate(40deg) saturate(2) brightness(1.4) drop-shadow(0 0 8px gold)&#x27;;
    e.el.style.left=e.x+&#x27;px&#x27;; e.el.style.top=e.y+&#x27;px&#x27;;
    layer.appendChild(e.el); enemies.push(e);
  }

  function spawnPowerup(x,y){
    var types=[&#x27;rapid&#x27;,&#x27;spread&#x27;,&#x27;shield&#x27;,&#x27;bonus&#x27;];
    var t=types[Math.floor(Math.random()*types.length)];
    var icons={rapid:&#x27;\u26A1&#x27;,spread:&#x27;\uD83D\uDD31&#x27;,shield:&#x27;\uD83D\uDEE1\uFE0F&#x27;,bonus:&#x27;\uD83D\uDC8E&#x27;};
    var p={x:x,y:y,vy:1.5,type:t,el:document.createElement(&#x27;div&#x27;)};
    p.el.className=&#x27;powerup&#x27;; p.el.textContent=icons[t];
    p.el.style.left=x+&#x27;px&#x27;; p.el.style.top=y+&#x27;px&#x27;;
    layer.appendChild(p.el); powerups.push(p);
  }

  function shipShoot(){
    var delay=frame&lt;rapidUntil?6:15;
    if (frame-lastShot&lt;delay) return;
    lastShot=frame;
    var cx=shipX+SHIP_W/2-BULLET_W/2, top=FIELD_H-SHIP_BOTTOM-SHIP_H-BULLET_H;
    var offsets=frame&lt;spreadUntil?[-14,0,14]:[0];
    var slopes=frame&lt;spreadUntil?[-1.6,0,1.6]:[0];
    for (var i=0;i&lt;offsets.length;i++){
      var b={x:cx+offsets[i],y:top,vx:slopes[i],el:document.createElement(&#x27;div&#x27;)};
      b.el.className=&#x27;bullet&#x27;; b.el.style.left=b.x+&#x27;px&#x27;; b.el.style.top=b.y+&#x27;px&#x27;;
      layer.appendChild(b.el); bullets.push(b);
    }
    beep(880,0.06,&#x27;square&#x27;,0.04);
  }

  function enemyShoot(e){
    var b={x:e.x+ENEMY_SIZE/2-EBULLET_W/2,y:e.y+ENEMY_SIZE,el:document.createElement(&#x27;div&#x27;)};
    b.el.className=&#x27;ebullet&#x27;; b.el.style.left=b.x+&#x27;px&#x27;; b.el.style.top=b.y+&#x27;px&#x27;;
    layer.appendChild(b.el); ebullets.push(b);
    beep(220,0.08,&#x27;sawtooth&#x27;,0.03);
  }

  function hitShip(){
    if (frame&lt;shieldUntil||frame&lt;invulnUntil) return;
    lives--; shake=16;
    bigFlash(shipX+SHIP_W/2,FIELD_H-SHIP_BOTTOM-SHIP_H/2,70);
    explosion(shipX+SHIP_W/2,FIELD_H-SHIP_BOTTOM-SHIP_H/2,&#x27;#ff6b8f&#x27;,20);
    beep(120,0.3,&#x27;sawtooth&#x27;,0.09);
    if (lives&lt;=0){ banner(&#x27;HIT!&#x27;); gameOver(); }
    else { banner(&#x27;HIT!&#x27;); invulnUntil=frame+100; }
    updHud();
  }

  function gameOver(){
    running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
    if (score&gt;high) high=score;
    banner(&#x27;GAME OVER&#x27;); msg(&#x27;Final score &#x27;+score+&#x27;  \u2022  press Start to play again&#x27;);
    beep(300,0.5,&#x27;triangle&#x27;,0.08); updHud();
  }

  function levelWin(){
    if (score&gt;high) high=score;
    if (level&gt;=TOTAL_LEVELS){
      running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
      banner(&#x27;YOU WIN!&#x27;); msg(&#x27;You cleared all 5 levels! Score &#x27;+score);
      beep(660,0.15,&#x27;square&#x27;,0.07); setTimeout(function(){beep(880,0.25,&#x27;square&#x27;,0.07);},150);
      updHud();
    } else {
      levelActive=false; levelTransition=80;
      beep(660,0.12,&#x27;square&#x27;,0.06); msg(&#x27;Level cleared! +100&#x27;); score+=100;
    }
  }

  function overlap(ax,ay,aw,ah,bx,by,bw,bh){return ax&lt;bx+bw&amp;&amp;ax+aw&gt;bx&amp;&amp;ay&lt;by+bh&amp;&amp;ay+ah&gt;by;}

  function tick(){
    if (!running) return;
    frame++; drawStars();

    if (keysDown[&#x27;ArrowRight&#x27;]) shipX+=SHIP_SPEED;

      pt.el.style.left=pt.x+&#x27;px&#x27;; pt.el.style.top=pt.y+&#x27;px&#x27;; pt.el.style.opacity=Math.max(0,pt.life/32);

    updHud();
    if (levelActive&amp;&amp;spawnQueue===0&amp;&amp;enemies.length===0) levelWin();
    if (running) animId=requestAnimationFrame(tick);

  function clearAll(){
    [bullets,enemies,ebullets,powerups,particles].forEach(function(arr){
      arr.forEach(function(o){ if(o.el&amp;&amp;o.el.parentNode) o.el.parentNode.removeChild(o.el); });

    score=0; lives=3; level=1; frame=0; lastShot=0;

    shipX=(FIELD_W-SHIP_W)/2;
    for (var k in keysDown) keysDown[k]=false;

  function stopGame(){

  window.addEventListener(&#x27;keydown&#x27;, function(e){

    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ keysDown[&#x27; &#x27;]=true; e.preventDefault(); }

  window.addEventListener(&#x27;keyup&#x27;, function(e){

    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;) keysDown[&#x27; &#x27;]=false;

  window.addEventListener(&#x27;message&#x27;, function(e){

 * scale the iframe to exactly fit its wrap. Idempotent: if a previous

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
