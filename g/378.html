&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Color Rush&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; and press &lt;strong&gt;Space&lt;/strong&gt; to switch your catcher&#x27;s color to match falling orbs. Chain 5 catches for bonuses — and survive the chaotic double-points Fever finale in the last 10 seconds!&lt;/p&gt;

    &lt;div class=&quot;streak&quot;&gt;🔥 &lt;span id=&quot;streak&quot;&gt;0&lt;/span&gt;&lt;span class=&quot;streak-pips&quot; id=&quot;pips&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

    &lt;div class=&quot;catcher&quot; id=&quot;catcher&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;STREAK!&lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 410;
  var CATCH_W = 70, CATCH_H = 26, CATCH_BOTTOM = 10, CATCH_SPEED = 8;
  var ORB_SIZE = 30;
  var COLORS = [&#x27;#ff5e62&#x27;,&#x27;#ffd452&#x27;,&#x27;#4facfe&#x27;,&#x27;#43e97b&#x27;,&#x27;#c56bff&#x27;];
  var FEVER_THRESHOLD = 10;
  var running = false, animId = null, lastTime = 0;
  var keysDown = {};
  var catchX = (FIELD_W - CATCH_W) / 2;
  var catchColor = 0;
  var orbs = [], confetti = [];
  var score = 0, streak = 0, timeLeft = 15, orbSpeed = 2.2, spawnEvery = 900, sinceSpawn = 0;
  var fever = false, feverPeak = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var catcher = document.getElementById(&#x27;catcher&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var timeBox = document.getElementById(&#x27;timeBox&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var feverAlert = document.getElementById(&#x27;feverAlert&#x27;);
  var pipsEl = document.getElementById(&#x27;pips&#x27;);

  var pips = [];
  for (var p = 0; p &lt; 5; p++) {
    var d = document.createElement(&#x27;span&#x27;);
    d.className = &#x27;pip&#x27;;
    pipsEl.appendChild(d);
    pips.push(d);
  }
  function paintPips() {
    var lit = streak % 5;
    if (streak &gt; 0 &amp;&amp; lit === 0) lit = 5;
    for (var i = 0; i &lt; 5; i++) pips[i].className = &#x27;pip&#x27; + (i &lt; lit ? &#x27; on&#x27; : &#x27;&#x27;);
  }

  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }
  function chime() {
    [523, 659, 784, 1047].forEach(function (f, i) {
      setTimeout(function () { beep(f, 0.25, &#x27;triangle&#x27;); }, i * 80);
    });
  }
  function feverSiren() {
    [880, 660, 880, 660, 990].forEach(function (f, i) {
      setTimeout(function () { beep(f, 0.18, &#x27;sawtooth&#x27;); }, i * 110);
    });
  }

  function paintCatcher() {
    catcher.style.left = catchX + &#x27;px&#x27;;
    catcher.style.background = COLORS[catchColor];
  }

  function spawnOrb() {
    var wild = fever ? Math.random() &lt; 0.5 : Math.random() &lt; 0.22;
    var c = Math.floor(Math.random() * COLORS.length);
    var o = { x: Math.random() * (FIELD_W - ORB_SIZE), y: -ORB_SIZE, c: c, wild: wild, shift: 0, el: document.createElement(&#x27;div&#x27;) };
    o.el.className = &#x27;orb&#x27; + (wild ? &#x27; wild&#x27; : &#x27;&#x27;);
    o.el.style.background = COLORS[c];
    o.el.style.left = o.x + &#x27;px&#x27;;
    o.el.style.top = o.y + &#x27;px&#x27;;
    field.appendChild(o.el);
    orbs.push(o);
  }

  function burstConfetti(x, y, count) {
    for (var i = 0; i &lt; (count || 18); i++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;confetti&#x27;;
      el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      el.style.left = x + &#x27;px&#x27;;
      el.style.top = y + &#x27;px&#x27;;
      field.appendChild(el);
      var ang = Math.random() * Math.PI * 2;
      var spd = 2 + Math.random() * 4;
      confetti.push({ el: el, x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2, life: 1 });
    }
  }

  function showBanner(text) {
    banner.textContent = text;
    banner.classList.remove(&#x27;show&#x27;);
    void banner.offsetWidth;
    banner.classList.add(&#x27;show&#x27;);
  }

  function enterFever() {
    fever = true;
    field.classList.add(&#x27;fever&#x27;);
    timeBox.classList.add(&#x27;fever&#x27;);
    feverAlert.classList.add(&#x27;show&#x27;);
    orbSpeed = Math.max(orbSpeed, 3.4) + 0.8;
    spawnEvery = Math.min(spawnEvery, 500);
    // all currently falling orbs become shifting
    orbs.forEach(function (o) { o.wild = true; o.el.classList.add(&#x27;wild&#x27;); });
    showBanner(&#x27;FEVER! 2X POINTS&#x27;);
    feverSiren();
    burstConfetti(FIELD_W / 2, FIELD_H / 2, 30);
  }
  function exitFever() {
    fever = false;
    field.classList.remove(&#x27;fever&#x27;);
    timeBox.classList.remove(&#x27;fever&#x27;);
    feverAlert.classList.remove(&#x27;show&#x27;);
  }

  function endGame(msg) {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    exitFever();
    overlay.textContent = msg + &#x27; — Score &#x27; + score + &#x27;. Press Start!&#x27;;
    overlay.style.display = &#x27;flex&#x27;;
  }

  function tick(ts) {
    if (!running) return;
    var dt = lastTime ? (ts - lastTime) : 16;
    lastTime = ts;

    timeLeft -= dt / 1000;
    if (timeLeft &lt;= 0) { timeLeft = 0; timeEl.textContent = &#x27;0.0&#x27;; endGame(&#x27;Time up!&#x27;); return; }
    timeEl.textContent = timeLeft.toFixed(1);

    // Fever mode logic: on whenever time is in the final 10 seconds
    if (!fever &amp;&amp; timeLeft &lt;= FEVER_THRESHOLD) enterFever();
    else if (fever &amp;&amp; timeLeft &gt; FEVER_THRESHOLD) exitFever();

    if (keysDown[&#x27;ArrowLeft&#x27;]) catchX -= CATCH_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) catchX += CATCH_SPEED;
    catchX = Math.max(0, Math.min(FIELD_W - CATCH_W, catchX));
    catcher.style.left = catchX + &#x27;px&#x27;;

    sinceSpawn += dt;
    if (sinceSpawn &gt;= spawnEvery) { sinceSpawn = 0; spawnOrb(); }

    var catchTop = FIELD_H - CATCH_BOTTOM - CATCH_H;
    var shiftEvery = fever ? 600 : 1000;
    for (var i = orbs.length - 1; i &gt;= 0; i--) {
      var o = orbs[i];
      o.y += orbSpeed;
      o.el.style.top = o.y + &#x27;px&#x27;;
      if (o.wild) {
        o.shift += dt;
        if (o.shift &gt;= shiftEvery) {
          o.shift -= shiftEvery;
          o.c = (o.c + 1 + Math.floor(Math.random() * (COLORS.length - 1))) % COLORS.length;
          o.el.style.background = COLORS[o.c];
        }
      }
      if (o.y + ORB_SIZE &gt;= catchTop &amp;&amp; o.y &lt;= catchTop + CATCH_H) {
        if (o.x + ORB_SIZE &gt; catchX &amp;&amp; o.x &lt; catchX + CATCH_W) {
          if (o.c === catchColor) {
            var pts = fever ? 2 : 1;
            score += pts; scoreEl.textContent = score;
            streak += 1; streakEl.textContent = streak;
            var boost = o.wild ? 2.0 : 1.5;
            timeLeft += boost;
            burstConfetti(o.x + ORB_SIZE / 2, catchTop, o.wild ? 26 : 16);
            beep(660 + streak * 12, 0.15, fever ? &#x27;square&#x27; : &#x27;triangle&#x27;);
            if (!fever) { orbSpeed = Math.min(orbSpeed + 0.05, 7); spawnEvery = Math.max(spawnEvery - 8, 380); }
            if (streak % 5 === 0) {
              timeLeft += 3;
              showBanner(&#x27;STREAK x&#x27; + streak + &#x27;! +3s&#x27;);
              burstConfetti(FIELD_W / 2, FIELD_H / 2, 40);
              chime();
            }
            paintPips();
          } else {
            timeLeft -= 1.0;
            streak = 0; streakEl.textContent = &#x27;0&#x27;; paintPips();
            beep(140, 0.2, &#x27;sawtooth&#x27;);
          }
          field.removeChild(o.el); orbs.splice(i, 1);
          continue;
        }
      }
      if (o.y &gt; FIELD_H) { field.removeChild(o.el); orbs.splice(i, 1); }
    }

    for (var j = confetti.length - 1; j &gt;= 0; j--) {
      var c2 = confetti[j];
      c2.vy += 0.2; c2.x += c2.vx; c2.y += c2.vy; c2.life -= 0.025;
      c2.el.style.left = c2.x + &#x27;px&#x27;; c2.el.style.top = c2.y + &#x27;px&#x27;;
      c2.el.style.opacity = Math.max(c2.life, 0);
      if (c2.life &lt;= 0) { field.removeChild(c2.el); confetti.splice(j, 1); }
    }

    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    orbs.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    confetti.forEach(function (c) { if (c.el.parentNode) c.el.parentNode.removeChild(c.el); });
    orbs = []; confetti = [];
  }

  function startGame() {
    clearAll();
    exitFever();
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    streak = 0; streakEl.textContent = &#x27;0&#x27;; paintPips();
    timeLeft = 15; timeEl.textContent = &#x27;15.0&#x27;;
    orbSpeed = 2.2; spawnEvery = 900; sinceSpawn = 0; lastTime = 0;
    catchX = (FIELD_W - CATCH_W) / 2; catchColor = 0;
    for (var k in keysDown) keysDown[k] = false;
    banner.classList.remove(&#x27;show&#x27;);
    paintCatcher();
    overlay.style.display = &#x27;none&#x27;;
    running = true;
    spawnOrb();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    exitFever();
    clearAll();
    overlay.textContent = &#x27;Paused — Press Start!&#x27;;
    overlay.style.display = &#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      if (running) { catchColor = (catchColor + 1) % COLORS.length; paintCatcher(); beep(400, 0.06, &#x27;square&#x27;); }
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}

  });

  paintCatcher();
  paintPips();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
