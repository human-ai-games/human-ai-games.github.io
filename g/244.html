<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endless Hopper</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Endless Hopper</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d0a1f; color: #e0e6ed; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #ffd166; text-shadow: 0 0 10px rgba(255,209,102,0.5); }
  .instructions { font-size: 16px; color: #a9b4c2; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #e0e6ed; margin: 0; }
  .field { position: relative; width: 620px; height: 460px; flex-shrink: 0; margin: 0; background: linear-gradient(#1a1236, #0d0a1f); border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.6); }
  .hero { position: absolute; background: #2ff3e0; border-radius: 4px; box-shadow: 0 0 14px rgba(47,243,224,0.9), 0 0 4px rgba(47,243,224,1); z-index: 5; }
  .platform { position: absolute; background: #b026ff; border-radius: 4px; box-shadow: 0 0 12px rgba(176,38,255,0.85), 0 2px 6px rgba(0,0,0,0.4); }
  .coin { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffd60a 60%, #e6a800); box-shadow: 0 0 12px rgba(255,214,10,0.95), 0 0 4px rgba(255,214,10,1); z-index: 4; }
  .msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 28px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.7); z-index: 10; }
  .count { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-size: 90px; font-weight: 800; color: #2ff3e0; text-shadow: 0 0 24px rgba(47,243,224,0.8); z-index: 11; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Endless Hopper&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;The world scrolls toward you — press Up (or Space) to jump onto the next neon platform, and use Left/Right to steer your landing. Each platform scores a point and grabbing a glowing coin adds a bonus; fall off the bottom and the run ends.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 460;
  var HERO_W = 30, HERO_H = 34;

  var GRAVITY = 0.8;
  var MOVE_SPEED = 4;

  var running = false, animId = null, countdownActive = false, countdownTimer = null;
  var score = 0, best = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var heroEl = null, msgEl = null, countEl = null;

  var hero = { x: 0, y: 0, vy: 0, onPlatform: null };
  var platforms = [];
  var coins = [];
  var keys = {};
  var nextPlatformX = 0;
  var platformIdCounter = 0;

  // Difficulty ramps with score.
  function scrollSpeed() { return Math.min(1.2 + score * 0.03, 4.2); }
  function jumpVelocity() {
    // Shorter (weaker) jumps early, taller later.
    return -(10 + Math.min(score * 0.12, 6));  // -10 -&gt; -16
  }
  function gapRange() {
    var extra = Math.min(score * 1.2, 90);
    return { min: 60 + extra * 0.4, max: 110 + extra };
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO_W + &#x27;px&#x27;;
    heroEl.style.height = HERO_H + &#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function addPlatform(x, y, w) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;platform&#x27;;
    el.style.width = w + &#x27;px&#x27;;
    el.style.height = &#x27;14px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    el.style.left = x + &#x27;px&#x27;;
    field.appendChild(el);
    var p = { id: platformIdCounter++, x: x, y: y, w: w, h: 14, el: el, scored: false };
    platforms.push(p);
    // Chance of a coin floating above the platform.
    if (Math.random() &lt; 0.55) {
      var cx = x + w / 2 - 9;
      var cy = y - 40 - Math.random() * 25;
      var cel = document.createElement(&#x27;div&#x27;);
      cel.className = &#x27;coin&#x27;;
      cel.style.left = cx + &#x27;px&#x27;;
      cel.style.top = cy + &#x27;px&#x27;;
      field.appendChild(cel);
      coins.push({ x: cx, y: cy, el: cel });
    }
    return p;
  }

  function spawnNextPlatform() {
    var w = 80 + Math.random() * 60;
    var minY = 160, maxY = FIELD_H - 70;
    var y = minY + Math.random() * (maxY - minY);
    var g = gapRange();
    var gap = g.min + Math.random() * (g.max - g.min);
    var x = nextPlatformX + gap;
    addPlatform(x, y, w);
    nextPlatformX = x + w;
  }

  function buildInitialPlatforms() {
    platforms.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    coins.forEach(function (c) { if (c.el.parentNode) c.el.parentNode.removeChild(c.el); });
    platforms = [];
    coins = [];
    platformIdCounter = 0;
    var startY = FIELD_H - 120;
    addPlatform(60, startY, 120);
    nextPlatformX = 60 + 120;
    while (nextPlatformX &lt; FIELD_W + 200) spawnNextPlatform();
  }

  function resetHero() {
    var p = platforms[0];
    hero.x = p.x + p.w / 2 - HERO_W / 2;
    hero.y = p.y - HERO_H;
    hero.vy = 0;
    hero.onPlatform = p;
    p.scored = true;
    paintHero();
  }

  function paintHero() {
    heroEl.style.left = hero.x + &#x27;px&#x27;;
    heroEl.style.top = hero.y + &#x27;px&#x27;;
  }

  function clearMsg() {
    if (msgEl &amp;&amp; msgEl.parentNode) { msgEl.parentNode.removeChild(msgEl); msgEl = null; }
  }
  function showMsg(text) {
    clearMsg();
    msgEl = document.createElement(&#x27;div&#x27;);
    msgEl.className = &#x27;msg&#x27;;
    msgEl.textContent = text;
    field.appendChild(msgEl);
  }
  function clearCount() {
    if (countEl &amp;&amp; countEl.parentNode) { countEl.parentNode.removeChild(countEl); countEl = null; }
  }
  function showCount(text) {
    clearCount();
    countEl = document.createElement(&#x27;div&#x27;);
    countEl.className = &#x27;count&#x27;;
    countEl.textContent = text;
    field.appendChild(countEl);
  }

  function tick() {
    if (!running) return;
    var SCROLL = scrollSpeed();

    for (var i = 0; i &lt; platforms.length; i++) {
      platforms[i].x -= SCROLL;
      platforms[i].el.style.left = platforms[i].x + &#x27;px&#x27;;
    }
    for (var c = 0; c &lt; coins.length; c++) {
      coins[c].x -= SCROLL;
      coins[c].el.style.left = coins[c].x + &#x27;px&#x27;;
    }
    nextPlatformX -= SCROLL;

    for (var r = platforms.length - 1; r &gt;= 0; r--) {
      if (platforms[r].x + platforms[r].w &lt; -20) {
        if (platforms[r].el.parentNode) platforms[r].el.parentNode.removeChild(platforms[r].el);
        platforms.splice(r, 1);
      }
    }
    for (var cr = coins.length - 1; cr &gt;= 0; cr--) {
      if (coins[cr].x + 18 &lt; -20) {
        if (coins[cr].el.parentNode) coins[cr].el.parentNode.removeChild(coins[cr].el);
        coins.splice(cr, 1);
      }
    }
    while (nextPlatformX &lt; FIELD_W + 200) spawnNextPlatform();

    if (hero.onPlatform) hero.x -= SCROLL;

    if (keys[&#x27;ArrowLeft&#x27;]) hero.x -= MOVE_SPEED;
    if (keys[&#x27;ArrowRight&#x27;]) hero.x += MOVE_SPEED;
    if (hero.x &lt; 0) hero.x = 0;
    if (hero.x + HERO_W &gt; FIELD_W) hero.x = FIELD_W - HERO_W;

    var prevBottom = hero.y + HERO_H;
    hero.vy += GRAVITY;
    hero.y += hero.vy;
    var newBottom = hero.y + HERO_H;

    hero.onPlatform = null;
    if (hero.vy &gt;= 0) {
      for (var j = 0; j &lt; platforms.length; j++) {
        var pl = platforms[j];
        var horiz = hero.x + HERO_W &gt; pl.x &amp;&amp; hero.x &lt; pl.x + pl.w;
        if (horiz &amp;&amp; prevBottom &lt;= pl.y + 2 &amp;&amp; newBottom &gt;= pl.y) {
          hero.y = pl.y - HERO_H;
          hero.vy = 0;
          hero.onPlatform = pl;
          if (!pl.scored) {
            pl.scored = true;
            score += 1;
            scoreEl.textContent = score;
            if (score &gt; best) { best = score; bestEl.textContent = best; }
          }
          break;
        }
      }
    }

    // Coin pickup.
    for (var ck = coins.length - 1; ck &gt;= 0; ck--) {
      var co = coins[ck];
      if (hero.x + HERO_W &gt; co.x &amp;&amp; hero.x &lt; co.x + 18 &amp;&amp;
          hero.y + HERO_H &gt; co.y &amp;&amp; hero.y &lt; co.y + 18) {
        if (co.el.parentNode) co.el.parentNode.removeChild(co.el);
        coins.splice(ck, 1);
        score += 3;
        scoreEl.textContent = score;
        if (score &gt; best) { best = score; bestEl.textContent = best; }
      }
    }

    paintHero();

    if (hero.y &gt; FIELD_H) { endGame(); return; }

    animId = requestAnimationFrame(tick);
  }

  function jump() {
    if (!running) return;
    if (hero.onPlatform) {
      hero.vy = jumpVelocity();
      hero.onPlatform = null;
    }
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    showMsg(&#x27;You fell! Press Start&#x27;);
  }

  function beginRun() {
    running = true;
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    running = false;
    countdownActive = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    clearMsg();
    clearCount();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    field.innerHTML = &#x27;&#x27;;
    buildInitialPlatforms();
    makeHero();
    resetHero();

    // 3-second countdown before the world starts moving.
    countdownActive = true;
    var n = 3;
    showCount(n);
    countdownTimer = setInterval(function () {
      n -= 1;
      if (n &gt; 0) {
        showCount(n);
      } else if (n === 0) {
        showCount(&#x27;GO!&#x27;);
      } else {
        clearInterval(countdownTimer);
        countdownTimer = null;
        clearCount();
        countdownActive = false;
        beginRun();
      }
    }, 1000);
  }

  function stopGame() {
    running = false;
    countdownActive = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    keys[e.key] = true;
    if (e.key === &#x27;ArrowUp&#x27; || e.key === &#x27; &#x27; || e.key === &#x27;Spacebar&#x27;) { jump(); e.preventDefault(); }
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) e.preventDefault();
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    keys[e.key] = false;
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial paint so the field is visible before Start.
  buildInitialPlatforms();
  makeHero();
  resetHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);

      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
