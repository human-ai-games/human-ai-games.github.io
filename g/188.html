<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Overboard!</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Baby Overboard!</b> &middot; Game 188 &middot; Amateur producer &middot; Basic game: Paddle and ball</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 440px; flex-shrink: 0; margin: 0;
    background: linear-gradient(#bfe6ff 0%, #a9dcff 55%, #7fc4f5 100%);
    border-radius: 8px; overflow: hidden; }
  .ocean { position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
    background: linear-gradient(#2a8fd6, #1c6fb0);
    box-shadow: inset 0 4px 8px rgba(255,255,255,0.3); }
  .wave { position: absolute; bottom: 74px; left: 0; width: 200%; height: 16px;
    background: radial-gradient(circle at 20px -2px, #2a8fd6 12px, transparent 13px) repeat-x;
    background-size: 40px 16px; animation: waveMove 2.5s linear infinite; opacity: 0.8; }
  @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-40px); } }
  canvas { position: absolute; left: 0; top: 0; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 30px; font-weight: 700; text-align: center;
    flex-direction: column; gap: 10px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .overlay.show { opacity: 1; }
  .overlay small { font-size: 18px; font-weight: 400; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Baby Overboard!&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the baby carriage with &lt;strong&gt;&amp;larr;&lt;/strong&gt; &lt;strong&gt;&amp;rarr;&lt;/strong&gt; to catch every bouncing baby (they split in two every few seconds!). Dodge the diving birds and dropped diaper bombs — one hit and it&#x27;s over. Use the &lt;strong&gt;Start&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; Babies: &lt;span id=&quot;babies&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;ocean&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;wave&quot;&gt;&lt;/div&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div id=&quot;ovtext&quot;&gt;Game Over&lt;/div&gt;&lt;small id=&quot;ovsub&quot;&gt;&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 440;
  var OCEAN_TOP = FIELD_H - 80;
  var PADDLE_W = 76, PADDLE_H = 48, PADDLE_BOTTOM = 56, PADDLE_SPEED = 7;
  var BALL_SIZE = 30;
  var BASE_SPEED = 3.6;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var babies = [];
  var birds = [];
  var poops = [];
  var score = 0;
  var lastSplit = 0, lastBird = 0, lastPoop = 0;
  var startTime = 0;
  // A baby may only poop when its head is in the upper half of the sky.
  var POOP_MAX_Y = OCEAN_TOP / 2;

  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var babyEl = document.getElementById(&#x27;babies&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var ovtext = document.getElementById(&#x27;ovtext&#x27;);
  var ovsub = document.getElementById(&#x27;ovsub&#x27;);

  function newBaby(x, y, vx) {
    return { x: x, y: y, vx: vx, vy: BASE_SPEED };
  }

  function reset() {
    paddleX = (FIELD_W - PADDLE_W) / 2;
    babies = [ newBaby(FIELD_W/2 - BALL_SIZE/2, 50, (Math.random()&lt;0.5?-1:1)*BASE_SPEED) ];
    birds = [];
    poops = [];
    score = 0;
    var now = performance.now();
    lastSplit = now; lastBird = now; lastPoop = now;
    startTime = now;
    scoreEl.textContent = &#x27;0&#x27;;
    babyEl.textContent = &#x27;1&#x27;;
  }

  function drawCarriage(x) {
    var top = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    ctx.save();
    // basket
    ctx.fillStyle = &#x27;#e94f8a&#x27;;
    ctx.beginPath();
    ctx.moveTo(x+6, top+16);
    ctx.lineTo(x+PADDLE_W-6, top+16);
    ctx.lineTo(x+PADDLE_W-14, top+38);
    ctx.lineTo(x+14, top+38);
    ctx.closePath();
    ctx.fill();
    // hood
    ctx.beginPath();
    ctx.moveTo(x+6, top+16);
    ctx.arc(x+26, top+16, 20, Math.PI, 0, false);
    ctx.closePath();
    ctx.fillStyle = &#x27;#c73c72&#x27;;
    ctx.fill();
    // hood stripes
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.5)&#x27;;
    ctx.lineWidth = 2;
    for (var r=6; r&lt;20; r+=6){
      ctx.beginPath(); ctx.arc(x+26, top+16, r, Math.PI, 0, false); ctx.stroke();
    }
    // handle
    ctx.strokeStyle = &#x27;#8a2c54&#x27;;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x+PADDLE_W-8, top+8);
    ctx.quadraticCurveTo(x+PADDLE_W+6, top+4, x+PADDLE_W+4, top+24);
    ctx.stroke();
    // wheels
    ctx.fillStyle = &#x27;#333&#x27;;
    ctx.beginPath(); ctx.arc(x+18, top+44, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+PADDLE_W-18, top+44, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;#bbb&#x27;;
    ctx.beginPath(); ctx.arc(x+18, top+44, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+PADDLE_W-18, top+44, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBaby(b) {
    ctx.font = BALL_SIZE + &#x27;px serif&#x27;;
    ctx.textBaseline = &#x27;top&#x27;;
    ctx.fillText(&#x27;👶&#x27;, b.x, b.y);
  }
  function drawBird(bd) {
    ctx.font = &#x27;28px serif&#x27;;
    ctx.textBaseline = &#x27;top&#x27;;
    ctx.fillText(&#x27;🐦&#x27;, bd.x, bd.y);
  }
  function drawPoop(p) {
    ctx.font = &#x27;26px serif&#x27;;
    ctx.textBaseline = &#x27;top&#x27;;
    ctx.fillText(&#x27;💩&#x27;, p.x, p.y);
  }

  function gameOver(reason) {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    ovtext.textContent = &#x27;Game Over&#x27;;
    ovsub.textContent = reason + &#x27; — Final score: &#x27; + score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax &lt; bx+bw &amp;&amp; ax+aw &gt; bx &amp;&amp; ay &lt; by+bh &amp;&amp; ay+ah &gt; by;
  }

  function tick() {
    if (!running) return;
    var now = performance.now();

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;

    // update babies
    for (var i=0; i&lt;babies.length; i++) {
      var b = babies[i];
      b.x += b.vx; b.y += b.vy;
      if (b.x &lt;= 0) { b.x = 0; b.vx = -b.vx; }
      if (b.x + BALL_SIZE &gt;= FIELD_W) { b.x = FIELD_W - BALL_SIZE; b.vx = -b.vx; }
      if (b.y &lt;= 0) { b.y = 0; b.vy = Math.abs(b.vy); }
      // catch on carriage
      if (b.vy &gt; 0 &amp;&amp;
          b.y + BALL_SIZE &gt;= paddleTop &amp;&amp;
          b.y + BALL_SIZE &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
          b.x + BALL_SIZE &gt;= paddleX &amp;&amp; b.x &lt;= paddleX + PADDLE_W) {
        b.vy = -Math.abs(b.vy);
        b.y = paddleTop - BALL_SIZE;
        score += 1;
        scoreEl.textContent = score;
      }
      // ocean splash
      if (b.y + BALL_SIZE &gt;= OCEAN_TOP &amp;&amp; b.vy &gt; 0) {
        b.y = OCEAN_TOP - BALL_SIZE;
        b.vy = -Math.abs(b.vy) * 1.04;
        b.vx = (Math.random()&lt;0.5?-1:1) * (BASE_SPEED + Math.random());
      }
    }

    // split every 3 seconds
    if (now - lastSplit &gt;= 3000 &amp;&amp; babies.length &lt; 12) {
      lastSplit = now;
      var src = babies[Math.floor(Math.random()*babies.length)];
      babies.push(newBaby(src.x, src.y, -src.vx || BASE_SPEED));
      babyEl.textContent = babies.length;
    }

    // spawn birds
    if (now - lastBird &gt;= 1400 + Math.random()*800) {
      lastBird = now;
      birds.push({ x: Math.random()*(FIELD_W-28), y: -30, vy: 2.6 + Math.random()*2.4, vx: (Math.random()-0.5)*2 });
    }
    // spawn poops — only from a baby that&#x27;s high enough in the sky
    if (now - lastPoop &gt;= 1800 + Math.random()*1200 &amp;&amp; babies.length) {
      var highBabies = [];
      for (var hb=0; hb&lt;babies.length; hb++) {
        if (babies[hb].y &lt;= POOP_MAX_Y) highBabies.push(babies[hb]);
      }
      if (highBabies.length) {
        lastPoop = now;
        var pb = highBabies[Math.floor(Math.random()*highBabies.length)];
        poops.push({ x: pb.x + 4, y: pb.y + BALL_SIZE, vy: 2.2 + Math.random()*1.6 });
      }
    }

    // update birds
    for (var j=birds.length-1; j&gt;=0; j--) {
      var bd = birds[j];
      bd.y += bd.vy; bd.x += bd.vx;
      if (bd.y &gt; FIELD_H) { birds.splice(j,1); continue; }
      if (rectHit(bd.x, bd.y, 24, 22, paddleX+6, paddleTop, PADDLE_W-12, PADDLE_H)) {
        drawAll(); gameOver(&#x27;A bird got you!&#x27;); return;
      }
    }
    // update poops
    for (var k=poops.length-1; k&gt;=0; k--) {
      var p = poops[k];
      p.y += p.vy;
      if (p.y &gt; FIELD_H) { poops.splice(k,1); continue; }
      if (rectHit(p.x, p.y, 22, 20, paddleX+6, paddleTop, PADDLE_W-12, PADDLE_H)) {
        drawAll(); gameOver(&#x27;A diaper bomb hit you!&#x27;); return;
      }
    }

    drawAll();
    animId = requestAnimationFrame(tick);
  }

  function drawAll() {
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    for (var i=0;i&lt;poops.length;i++) drawPoop(poops[i]);
    for (var j=0;j&lt;birds.length;j++) drawBird(birds[j]);
    for (var b=0;b&lt;babies.length;b++) drawBaby(babies[b]);
    drawCarriage(paddleX);
  }

  function startGame() {
    if (running) return;
    overlay.classList.remove(&#x27;show&#x27;);
    reset();
    for (var k in keysDown) keysDown[k] = false;
    running = true;
    drawAll();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  reset();
  drawAll();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
