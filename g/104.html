  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0b1026; color: #eef; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#ffd86b,#ff8ae0,#7ecbff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #aab6e0; max-width: 620px; margin: 0; line-height: 1.35; }
  .legend { font-size: 14px; color: #cdd6ff; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .hud { display: flex; gap: 22px; font-size: 19px; align-items: center; }
  .hud .val { font-weight: 700; color: #ffd86b; }

  .combo { color: #ff8ae0; font-weight: 700; min-height: 20px; font-size: 17px; }
  .board { position: relative; width: 620px; height: 380px; flex-shrink: 0; margin: 0; border-radius: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #1b2a5c 0%, #0b1026 70%); border: 1px solid #26305e; }
  .board.frozen { box-shadow: inset 0 0 60px rgba(126,203,255,.5); }
  .star { position: absolute; font-size: 42px; cursor: pointer; user-select: none; transition: transform .08s; filter: drop-shadow(0 0 6px #ffe08a); }
  .star.bomb { filter: drop-shadow(0 0 8px #ff6b6b); }
  .star.freeze { filter: drop-shadow(0 0 8px #7ecbff); }
  .star.lucky { filter: drop-shadow(0 0 8px #6bffb0); }
  .star:active { transform: scale(1.2); }
  .bg-dot { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; opacity: .5; }
  .pop { position: absolute; pointer-events: none; font-size: 22px; color: #ffd86b; font-weight: 700; animation: rise .6s ease-out forwards; text-shadow: 0 0 6px #000; }
  @keyframes rise { from { opacity: 1; transform: translateY(0);} to { opacity: 0; transform: translateY(-40px);} }
  .flash { position: absolute; inset: 0; background: rgba(255,120,120,.5); pointer-events: none; animation: fadeout .5s forwards; }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ Star Catcher ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click falling stars to score, and chain quick catches for a combo. You have 5 lives — lose one each time a regular star reaches the bottom!&lt;/p&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;⭐ = points&lt;/span&gt;&lt;span&gt;💣 = clear all&lt;/span&gt;&lt;span&gt;❄️ = slow time&lt;/span&gt;&lt;span&gt;🍀 = big bonus&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot;&gt;Lives: &lt;span id=&quot;lives&quot;&gt;❤️❤️❤️❤️❤️&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;gameover&quot; id=&quot;gameover&quot;&gt;
      &lt;h2&gt;Game Over&lt;/h2&gt;
      &lt;p&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
      &lt;small&gt;Press Start below to play again&lt;/small&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 380, MAX_LIVES = 5;
  var score = 0, lives = MAX_LIVES, combo = 0;
  var spawnId = null, fallId = null, comboTimer = null, freezeTimer = null;
  var running = false, freezeMult = 1;
  var stars = [];
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var gameoverEl = document.getElementById(&#x27;gameover&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var audioCtx = null;

  for (var i = 0; i &lt; 40; i++) {
    var d = document.createElement(&#x27;div&#x27;);
    d.className = &#x27;bg-dot&#x27;;
    d.style.left = Math.random()*BOARD_W + &#x27;px&#x27;;
    d.style.top = Math.random()*BOARD_H + &#x27;px&#x27;;
    d.style.opacity = (0.2 + Math.random()*0.6).toFixed(2);
    board.appendChild(d);
  }

  function updateLives() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; MAX_LIVES; i++) s += i &lt; lives ? &#x27;❤️&#x27; : &#x27;🖤&#x27;;
    livesEl.textContent = s;
  }

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;triangle&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur||0.25));
      o.start(); o.stop(audioCtx.currentTime + (dur||0.25));
    } catch (_) {}
  }

  function showCombo() {
    if (combo &gt;= 2) comboEl.textContent = &#x27;Combo x&#x27; + combo + &#x27;!&#x27;;
    else comboEl.textContent = &#x27;&#x27;;
  }

  function popText(x, y, txt, color) {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;pop&#x27;; p.textContent = txt;
    p.style.left = x + &#x27;px&#x27;; p.style.top = y + &#x27;px&#x27;;
    if (color) p.style.color = color;
    board.appendChild(p);
    setTimeout(function(){ if (p.parentNode) p.parentNode.removeChild(p); }, 600);
  }

  function removeStar(s) {
    if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
    stars = stars.filter(function(x){ return x !== s; });
  }

  function bumpCombo() {
    combo += 1;
    showCombo();
    if (comboTimer) clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){ combo = 0; showCombo(); }, 1400);
  }

  function doBomb(sx, sy) {
    var flash = document.createElement(&#x27;div&#x27;);
    flash.className = &#x27;flash&#x27;;
    board.appendChild(flash);
    setTimeout(function(){ if (flash.parentNode) flash.parentNode.removeChild(flash); }, 500);
    var caught = 0;
    var copy = stars.slice();
    for (var i = 0; i &lt; copy.length; i++) {
      var s = copy[i];
      if (s.type === &#x27;normal&#x27;) { removeStar(s); caught++; }
    }
    var bonus = 5 + caught * 2;
    score += bonus; scoreEl.textContent = score;
    popText(sx, sy, &#x27;+&#x27; + bonus + &#x27; BOOM!&#x27;, &#x27;#ff6b6b&#x27;);
    beep(120, 0.4, &#x27;sawtooth&#x27;);
    beep(80, 0.5, &#x27;square&#x27;);
  }

  function doFreeze(sx, sy) {
    freezeMult = 0.35;
    board.classList.add(&#x27;frozen&#x27;);
    if (freezeTimer) clearTimeout(freezeTimer);
    freezeTimer = setTimeout(function(){ freezeMult = 1; board.classList.remove(&#x27;frozen&#x27;); }, 4000);
    popText(sx, sy, &#x27;SLOW!&#x27;, &#x27;#7ecbff&#x27;);
    beep(900, 0.5, &#x27;sine&#x27;);
    beep(500, 0.5, &#x27;sine&#x27;);
  }

  function loseLife() {
    lives -= 1;
    if (lives &lt; 0) lives = 0;
    updateLives();
    combo = 0; showCombo();
    beep(160);
    if (lives &lt;= 0) gameOver();
  }

  function gameOver() {
    running = false;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (fallId) { clearInterval(fallId); fallId = null; }
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    if (freezeTimer) { clearTimeout(freezeTimer); freezeTimer = null; }
    board.classList.remove(&#x27;frozen&#x27;);
    clearAll();
    finalScoreEl.textContent = score;
    gameoverEl.classList.add(&#x27;show&#x27;);
    beep(300, 0.3); beep(200, 0.4); beep(120, 0.6);
  }

  function spawnStar() {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;star&#x27;;
    var r = Math.random();
    var type, symbol;
    if (r &lt; 0.06) { type = &#x27;bomb&#x27;; symbol = &#x27;💣&#x27;; el.classList.add(&#x27;bomb&#x27;); }
    else if (r &lt; 0.13) { type = &#x27;freeze&#x27;; symbol = &#x27;❄️&#x27;; el.classList.add(&#x27;freeze&#x27;); }
    else if (r &lt; 0.19) { type = &#x27;lucky&#x27;; symbol = &#x27;🍀&#x27;; el.classList.add(&#x27;lucky&#x27;); }
    else { type = &#x27;normal&#x27;; symbol = [&#x27;⭐&#x27;,&#x27;🌟&#x27;,&#x27;✨&#x27;,&#x27;💫&#x27;][Math.floor(Math.random()*4)]; }
    el.textContent = symbol;
    var x = Math.random() * (BOARD_W - 44);
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = &#x27;-44px&#x27;;
    var obj = { el: el, x: x, y: -44, speed: 1.6 + Math.random()*2.0, alive: true, type: type };
    el.addEventListener(&#x27;mousedown&#x27;, function () {
      if (!obj.alive || !running) return;
      obj.alive = false;
      bumpCombo();
      if (obj.type === &#x27;bomb&#x27;) {
        removeStar(obj);
        doBomb(obj.x, obj.y);
      } else if (obj.type === &#x27;freeze&#x27;) {
        removeStar(obj);
        doFreeze(obj.x, obj.y);
      } else if (obj.type === &#x27;lucky&#x27;) {
        var lb = 25;
        score += lb; scoreEl.textContent = score;
        popText(obj.x, obj.y, &#x27;+&#x27; + lb + &#x27; LUCKY!&#x27;, &#x27;#6bffb0&#x27;);
        beep(660, 0.15); beep(880, 0.2);
        removeStar(obj);
      } else {
        var gain = combo &gt;= 2 ? combo : 1;
        score += gain; scoreEl.textContent = score;
        popText(obj.x, obj.y, &#x27;+&#x27; + gain);
        beep(520 + combo*40);
        removeStar(obj);
      }
    });
    board.appendChild(el);
    stars.push(obj);
  }

  function tick() {
    for (var i = stars.length - 1; i &gt;= 0; i--) {
      var s = stars[i];
      s.y += s.speed * freezeMult;
      s.el.style.top = s.y + &#x27;px&#x27;;
      if (s.y &gt; BOARD_H) {
        removeStar(s);
        if (s.type === &#x27;normal&#x27;) loseLife();
      }
    }
  }

  function clearAll() {
    for (var i = 0; i &lt; stars.length; i++) {
      if (stars[i].el.parentNode) stars[i].el.parentNode.removeChild(stars[i].el);
    }
    stars = [];
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; lives = MAX_LIVES; combo = 0; freezeMult = 1;
    board.classList.remove(&#x27;frozen&#x27;);
    gameoverEl.classList.remove(&#x27;show&#x27;);
    scoreEl.textContent = &#x27;0&#x27;; updateLives(); comboEl.textContent = &#x27;&#x27;;
    clearAll();
    spawnStar();
    spawnId = setInterval(spawnStar, 850);
    fallId = setInterval(tick, 16);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (fallId) { clearInterval(fallId); fallId = null; }
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    if (freezeTimer) { clearTimeout(freezeTimer); freezeTimer = null; }
    board.classList.remove(&#x27;frozen&#x27;);
    clearAll();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
