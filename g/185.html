&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ METEOR BLASTER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your rocket with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to blast the falling space rocks. Explode each meteor, asteroid and comet for points — use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;

    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;🚀&lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var SHIP_W = 40, SHIP_H = 40, SHIP_BOTTOM = 12, SHIP_SPEED = 6;
  var BULLET_W = 8, BULLET_H = 16, BULLET_SPEED = 8;
  var TARGET_SIZE = 40, TARGET_SPEED = 1.8;
  var SPAWN_INTERVAL = 1100;
  var running = false, animId = null, spawnId = null, shootId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], targets = [], sparks = [], shocks = [];
  var score = 0;
  var lastShot = 0;
  var frame = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var ship = document.getElementById(&#x27;ship&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // Only space objects now.
  var SPACE_OBJECTS = [&#x27;☄️&#x27;,&#x27;🌑&#x27;,&#x27;🌘&#x27;,&#x27;🪐&#x27;,&#x27;🛸&#x27;,&#x27;🌠&#x27;,&#x27;🌌&#x27;,&#x27;⭐&#x27;,&#x27;🌟&#x27;,&#x27;🛰️&#x27;];
  var BULLET_COLORS = [&#x27;#ff6ec4&#x27;,&#x27;#4ADEDE&#x27;,&#x27;#ffd166&#x27;,&#x27;#7cf67c&#x27;,&#x27;#ff9f45&#x27;,&#x27;#a78bfa&#x27;];
  var FIRE_COLORS = [&#x27;#fff3b0&#x27;,&#x27;#ffcc33&#x27;,&#x27;#ff8c00&#x27;,&#x27;#ff5e00&#x27;,&#x27;#ff2a00&#x27;];
  var STAR_COLORS = [&#x27;#ffffff&#x27;,&#x27;#bcd8ff&#x27;,&#x27;#ffd6f5&#x27;,&#x27;#fff3b0&#x27;,&#x27;#c9fff0&#x27;];

  function el(cls, css) { var d = document.createElement(&#x27;div&#x27;); d.className = cls; for (var k in css) d.style[k] = css[k]; return d; }

  field.appendChild(el(&#x27;nebula&#x27;, { left:&#x27;340px&#x27;, top:&#x27;40px&#x27;, width:&#x27;220px&#x27;, height:&#x27;160px&#x27;, background:&#x27;radial-gradient(circle,#7873f5,transparent 70%)&#x27; }));
  field.appendChild(el(&#x27;nebula&#x27;, { left:&#x27;60px&#x27;, top:&#x27;220px&#x27;, width:&#x27;260px&#x27;, height:&#x27;180px&#x27;, background:&#x27;radial-gradient(circle,#ff6ec4,transparent 70%)&#x27; }));
  field.appendChild(el(&#x27;nebula&#x27;, { left:&#x27;380px&#x27;, top:&#x27;240px&#x27;, width:&#x27;200px&#x27;, height:&#x27;170px&#x27;, background:&#x27;radial-gradient(circle,#4ADEDE,transparent 70%)&#x27; }));

  for (var s = 0; s &lt; 70; s++) {
    var sz = (Math.random() &lt; 0.85) ? (1 + Math.random() * 2) : (2.5 + Math.random() * 2);
    var star = el(&#x27;star&#x27;, {
      left: (Math.random() * FIELD_W) + &#x27;px&#x27;,
      top: (Math.random() * FIELD_H) + &#x27;px&#x27;,
      width: sz + &#x27;px&#x27;, height: sz + &#x27;px&#x27;,
      background: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
      boxShadow: &#x27;0 0 &#x27; + (2 + Math.random() * 4) + &#x27;px currentColor&#x27;,
      animation: &#x27;tw &#x27; + (2 + Math.random() * 3).toFixed(1) + &#x27;s ease-in-out infinite&#x27;,
      animationDelay: (Math.random() * 3).toFixed(1) + &#x27;s&#x27;
    });
    star.style.color = star.style.background;
    field.appendChild(star);
  }

  field.appendChild(el(&#x27;sun&#x27;, {}));

  var moon = el(&#x27;moon&#x27;, {});
  [[14,12,10],[30,26,7],[20,34,6],[36,14,5]].forEach(function (c) {
    moon.appendChild(el(&#x27;crater&#x27;, { left: c[0] + &#x27;px&#x27;, top: c[1] + &#x27;px&#x27;, width: c[2] + &#x27;px&#x27;, height: c[2] + &#x27;px&#x27; }));
  });
  field.appendChild(moon);

  function makePlanet(x, y, d, grad, ring) {
    var p = el(&#x27;planet&#x27;, { left: x + &#x27;px&#x27;, top: y + &#x27;px&#x27;, width: d + &#x27;px&#x27;, height: d + &#x27;px&#x27;, background: grad, boxShadow: &#x27;0 0 14px rgba(255,255,255,0.15)&#x27; });
    if (ring) { var r = el(&#x27;ring&#x27;, { width: (d * 1.9) + &#x27;px&#x27;, height: (d * 1.9) + &#x27;px&#x27; }); r.style.borderColor = ring; p.appendChild(r); }
    field.appendChild(p);
  }
  makePlanet(150, 90, 30, &#x27;radial-gradient(circle at 35% 30%, #ff9f68, #d94f4f 70%, #7a1f3d)&#x27;, null);
  makePlanet(470, 120, 40, &#x27;radial-gradient(circle at 35% 30%, #a0e9ff, #3a7bd5 70%, #1f2f7a)&#x27;, &#x27;rgba(255,220,150,0.6)&#x27;);
  makePlanet(250, 170, 22, &#x27;radial-gradient(circle at 35% 30%, #d0ffd0, #4caf50 70%, #1b5e20)&#x27;, null);

  var comet = el(&#x27;comet&#x27;, { left: &#x27;-40px&#x27;, top: &#x27;70px&#x27; });
  field.appendChild(comet);
  var cometX = -40, cometY = 70;
  var shootStars = [];

  function spawnShootStar() {
    if (!running) return;
    var sh = el(&#x27;shoot&#x27;, { left: (Math.random() * FIELD_W * 0.7) + &#x27;px&#x27;, top: (Math.random() * FIELD_H * 0.5) + &#x27;px&#x27;, opacity: &#x27;1&#x27; });
    field.appendChild(sh);
    shootStars.push({ x: parseFloat(sh.style.left), y: parseFloat(sh.style.top), life: 30, el: sh });
  }

  function paintShip() { ship.style.left = shipX + &#x27;px&#x27;; }

  function spawnTarget() {
    var t = { x: Math.random() * (FIELD_W - TARGET_SIZE), y: -TARGET_SIZE, phase: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 6, rot: 0, el: null };
    var e = document.createElement(&#x27;div&#x27;);
    e.className = &#x27;target&#x27;;
    e.textContent = SPACE_OBJECTS[(Math.random() * SPACE_OBJECTS.length) | 0];
    e.style.left = t.x + &#x27;px&#x27;;
    e.style.top = t.y + &#x27;px&#x27;;
    field.appendChild(e);
    t.el = e;
    targets.push(t);
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 220) return;
    lastShot = now;
    var color = BULLET_COLORS[(Math.random() * BULLET_COLORS.length) | 0];
    var b = { x: shipX + SHIP_W / 2 - BULLET_W / 2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H, el: null };
    var e = document.createElement(&#x27;div&#x27;);
    e.className = &#x27;bullet&#x27;;
    e.style.background = color;
    e.style.color = color;
    e.style.left = b.x + &#x27;px&#x27;;
    e.style.top = b.y + &#x27;px&#x27;;
    field.appendChild(e);
    b.el = e;
    bullets.push(b);
    ship.style.filter = &#x27;drop-shadow(0 0 14px #ffd166)&#x27;;
    setTimeout(function(){ ship.style.filter = &#x27;drop-shadow(0 0 8px #4ADEDE)&#x27;; }, 90);
  }

  // Fiery meteor explosion.
  function explode(x, y) {
    // shockwave ring
    var ring = el(&#x27;shock&#x27;, { left: (x - 6) + &#x27;px&#x27;, top: (y - 6) + &#x27;px&#x27;, width: &#x27;12px&#x27;, height: &#x27;12px&#x27; });
    field.appendChild(ring);
    shocks.push({ x: x, y: y, r: 6, el: ring });
    // fiery debris
    for (var i = 0; i &lt; 16; i++) {
      var e = document.createElement(&#x27;div&#x27;);
      e.className = &#x27;spark&#x27;;
      var sz = 3 + Math.random() * 6;
      e.style.width = sz + &#x27;px&#x27;;
      e.style.height = sz + &#x27;px&#x27;;
      var col = FIRE_COLORS[(Math.random() * FIRE_COLORS.length) | 0];
      e.style.background = col;
      e.style.boxShadow = &#x27;0 0 6px &#x27; + col;
      e.style.left = x + &#x27;px&#x27;;
      e.style.top = y + &#x27;px&#x27;;
      field.appendChild(e);
      var ang = Math.random() * 6.28, spd = 2 + Math.random() * 4.5;
      sparks.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 26, max: 26, el: e });
    }
  }

  function tick() {
    if (!running) return;
    frame++;

    cometX += 1.4; cometY += 0.25;
    if (cometX &gt; FIELD_W + 60) { cometX = -60; cometY = 40 + Math.random() * 120; }
    comet.style.left = cometX + &#x27;px&#x27;;
    comet.style.top = cometY + &#x27;px&#x27;;

    for (var q = shootStars.length - 1; q &gt;= 0; q--) {
      var ss = shootStars[q];
      ss.x += 6; ss.y += 2.2; ss.life--;
      if (ss.life &lt;= 0) { field.removeChild(ss.el); shootStars.splice(q, 1); continue; }
      ss.el.style.left = ss.x + &#x27;px&#x27;;
      ss.el.style.top = ss.y + &#x27;px&#x27;;
      ss.el.style.opacity = (ss.life / 30).toFixed(2);
    }

    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));
    paintShip();

    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + BULLET_H &lt; 0) { field.removeChild(b.el); bullets.splice(i, 1); continue; }
      b.el.style.top = b.y + &#x27;px&#x27;;
    }

    for (var j = targets.length - 1; j &gt;= 0; j--) {
      var t = targets[j];
      t.y += TARGET_SPEED;
      t.rot += t.spin;
      var wob = Math.sin((frame + t.phase * 10) * 0.08) * 12;
      if (t.y &gt; FIELD_H) { field.removeChild(t.el); targets.splice(j, 1); continue; }
      t.el.style.top = t.y + &#x27;px&#x27;;
      t.el.style.left = (t.x + wob) + &#x27;px&#x27;;
      t.el.style.transform = &#x27;rotate(&#x27; + t.rot + &#x27;deg)&#x27;;
    }

    for (var k = sparks.length - 1; k &gt;= 0; k--) {
      var sp = sparks[k];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.12; sp.vx *= 0.98; sp.life--;
      if (sp.life &lt;= 0) { field.removeChild(sp.el); sparks.splice(k, 1); continue; }
      sp.el.style.left = sp.x + &#x27;px&#x27;;
      sp.el.style.top = sp.y + &#x27;px&#x27;;
      sp.el.style.opacity = (sp.life / sp.max).toFixed(2);
    }

    for (var m = shocks.length - 1; m &gt;= 0; m--) {
      var sc = shocks[m];
      sc.r += 3;
      if (sc.r &gt; 40) { field.removeChild(sc.el); shocks.splice(m, 1); continue; }
      sc.el.style.left = (sc.x - sc.r) + &#x27;px&#x27;;
      sc.el.style.top = (sc.y - sc.r) + &#x27;px&#x27;;
      sc.el.style.width = (sc.r * 2) + &#x27;px&#x27;;
      sc.el.style.height = (sc.r * 2) + &#x27;px&#x27;;
      sc.el.style.opacity = (1 - sc.r / 40).toFixed(2);
    }

    for (var i2 = bullets.length - 1; i2 &gt;= 0; i2--) {
      var b2 = bullets[i2];
      for (var j2 = targets.length - 1; j2 &gt;= 0; j2--) {
        var t2 = targets[j2];
        var tx = parseFloat(t2.el.style.left);
        if (b2.x &lt; tx + TARGET_SIZE &amp;&amp; b2.x + BULLET_W &gt; tx &amp;&amp;
            b2.y &lt; t2.y + TARGET_SIZE &amp;&amp; b2.y + BULLET_H &gt; t2.y) {
          explode(tx + TARGET_SIZE / 2, t2.y + TARGET_SIZE / 2);
          field.removeChild(b2.el); bullets.splice(i2, 1);
          field.removeChild(t2.el); targets.splice(j2, 1);
          score += 1;
          scoreEl.textContent = score;
          break;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    bullets.forEach(function (b) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); });
    targets.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    sparks.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    shocks.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    shootStars.forEach(function (p) { if (p.el.parentNode) p.el.parentNode.removeChild(p.el); });
    bullets = []; targets = []; sparks = []; shocks = []; shootStars = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var key in keysDown) keysDown[key] = false;
    lastShot = 0;
    cometX = -40; cometY = 70;
    paintShip();
    running = true;
    spawnTarget();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnTarget, SPAWN_INTERVAL);
    shootId = setInterval(spawnShootStar, 1600);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    if (shootId) { clearInterval(shootId); shootId = null; }
    clearAll();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  function _suppressIframeScroll() {
