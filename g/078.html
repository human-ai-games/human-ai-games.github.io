<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Squares</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Floating Squares</b> &middot; Game 078 &middot; Amateur producer &middot; Basic game: Gravity jumper</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d1030; color: #e8e8ff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 0 12px #66aaff; }
  .instructions { font-size: 16px; color: #aab; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .controls { display: flex; align-items: center; gap: 14px; font-size: 18px; color: #cce; }
  .controls label { display: flex; align-items: center; gap: 8px; }
  #speedVal { min-width: 62px; font-weight: 600; color: #6cf; }
  input[type=range] { width: 160px; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; margin: 0; background: radial-gradient(circle at 50% 40%, #1a2050, #0a0c22); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.5); }
  .hero { position: absolute; width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(135deg, #6cf, #39f); box-shadow: 0 0 18px #6cf, 0 0 4px #fff inset; }
  .obstacle { position: absolute; border-radius: 6px; }
  .laser { position: absolute; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #fff, #f6f); box-shadow: 0 0 10px #f6f, 0 0 4px #fff; }
  .gameover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #fff; background: rgba(10,12,34,0.7); text-shadow: 0 0 14px #f66; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Floating Squares&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;Arrow keys&lt;/strong&gt; or mouse to dodge the squares, and press &lt;strong&gt;Space&lt;/strong&gt; to fire lasers. Adjust the speed slider (or keys 1/2/3), and use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;label&gt;Speed: &lt;input type=&quot;range&quot; id=&quot;speed&quot; min=&quot;1&quot; max=&quot;3&quot; step=&quot;1&quot; value=&quot;2&quot;&gt;&lt;span id=&quot;speedVal&quot;&gt;Normal&lt;/span&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;hero&quot; id=&quot;hero&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var HERO_SIZE = 40;
  var running = false, animId = null, spawnId = null;
  var heroX = 70;
  var heroY = FIELD_H / 2 - HERO_SIZE / 2;
  var targetY = heroY;
  var bobPhase = 0;
  var drawY = heroY;
  var obstacles = [];
  var lasers = [];
  var score = 0;
  var gameOver = false;
  var frames = 0;
  var lastShot = 0;
  var colors = [&#x27;#f66&#x27;,&#x27;#fc6&#x27;,&#x27;#6f9&#x27;,&#x27;#c6f&#x27;,&#x27;#6cf&#x27;,&#x27;#f9c&#x27;];

  // speed settings: [label, base obstacle speed, spawn interval ms]
  var SPEEDS = {
    1: { label: &#x27;Slow&#x27;,   base: 2,   spawn: 1500 },
    2: { label: &#x27;Normal&#x27;, base: 3,   spawn: 1100 },
    3: { label: &#x27;Fast&#x27;,   base: 4.5, spawn: 800 }
  };
  var speedLevel = 2;

  var field = document.getElementById(&#x27;field&#x27;);
  var hero = document.getElementById(&#x27;hero&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var speedInput = document.getElementById(&#x27;speed&#x27;);
  var speedValEl = document.getElementById(&#x27;speedVal&#x27;);
  var overEl = null;

  function paintHero() {
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;
  }

  function applySpeed(level) {
    speedLevel = level;
    speedInput.value = level;
    speedValEl.textContent = SPEEDS[level].label;
    if (running &amp;&amp; spawnId) {
      clearInterval(spawnId);
      spawnId = setInterval(spawnObstacle, SPEEDS[speedLevel].spawn);
    }
  }

  function spawnObstacle() {
    if (!running) return;
    var size = 28 + Math.random() * 34;
    var y = Math.random() * (FIELD_H - size);
    var o = {
      x: FIELD_W, y: y, size: size, scored: false,
      speed: SPEEDS[speedLevel].base + Math.random() * 1.5 + frames / 1200,
      drift: (Math.random() - 0.5) * 1.4,
      el: null
    };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    var c = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = size + &#x27;px&#x27;;
    el.style.height = size + &#x27;px&#x27;;
    el.style.left = o.x + &#x27;px&#x27;;
    el.style.top = o.y + &#x27;px&#x27;;
    el.style.background = c;
    el.style.boxShadow = &#x27;0 0 14px &#x27; + c;
    field.appendChild(el);
    o.el = el;
    obstacles.push(o);
  }

  function fireLaser() {
    if (!running || gameOver) return;
    var now = Date.now();
    if (now - lastShot &lt; 250) return;
    lastShot = now;
    var startX = heroX + HERO_SIZE;
    var startY = drawY + HERO_SIZE / 2 - 2.5;
    var l = { x: startX, y: startY, speed: 12, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;laser&#x27;;
    el.style.width = &#x27;22px&#x27;;
    el.style.left = l.x + &#x27;px&#x27;;
    el.style.top = l.y + &#x27;px&#x27;;
    field.appendChild(el);
    l.el = el;
    lasers.push(l);
  }

  function removeObstacle(i) {
    var o = obstacles[i];
    if (o.el &amp;&amp; o.el.parentNode) o.el.parentNode.removeChild(o.el);
    obstacles.splice(i, 1);
  }

  function removeLaser(i) {
    var l = lasers[i];
    if (l.el &amp;&amp; l.el.parentNode) l.el.parentNode.removeChild(l.el);
    lasers.splice(i, 1);
  }

  function tick() {
    if (!running) return;
    frames++;
    heroY += (targetY - heroY) * 0.25;
    bobPhase += 0.08;
    var bob = Math.sin(bobPhase) * 4;
    var floorY = FIELD_H - HERO_SIZE;
    drawY = heroY + bob;
    if (drawY &lt; 0) drawY = 0;
    if (drawY &gt; floorY) drawY = floorY;
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = drawY + &#x27;px&#x27;;

    for (var j = lasers.length - 1; j &gt;= 0; j--) {
      var l = lasers[j];
      l.x += l.speed;
      l.el.style.left = l.x + &#x27;px&#x27;;
      if (l.x &gt; FIELD_W) { removeLaser(j); continue; }
    }

    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= o.speed;
      o.y += o.drift;
      if (o.y &lt; 0 || o.y &gt; FIELD_H - o.size) o.drift = -o.drift;
      o.el.style.left = o.x + &#x27;px&#x27;;
      o.el.style.top = o.y + &#x27;px&#x27;;
      if (o.x + o.size &lt; 0) { removeObstacle(i); continue; }
      if (!o.scored &amp;&amp; o.x + o.size &lt; heroX) {
        o.scored = true;
        score += 1;
        scoreEl.textContent = score;
      }

      var hit = false;
      for (var j = lasers.length - 1; j &gt;= 0; j--) {
        var l = lasers[j];
        if (l.x + 22 &gt; o.x &amp;&amp; l.x &lt; o.x + o.size &amp;&amp;
            l.y + 5 &gt; o.y &amp;&amp; l.y &lt; o.y + o.size) {
          removeLaser(j);
          hit = true;
          break;
        }
      }
      if (hit) {
        score += 3;
        scoreEl.textContent = score;
        removeObstacle(i);
        continue;
      }

      var pad = 4;
      if (heroX + HERO_SIZE - pad &gt; o.x + pad &amp;&amp; heroX + pad &lt; o.x + o.size - pad &amp;&amp;
          drawY + HERO_SIZE - pad &gt; o.y + pad &amp;&amp; drawY + pad &lt; o.y + o.size - pad) {
        endGame();
        return;
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearObstacles() {
    obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    obstacles = [];
  }

  function clearLasers() {
    lasers.forEach(function (l) { if (l.el.parentNode) l.el.parentNode.removeChild(l.el); });
    lasers = [];
  }

  function removeOver() {
    if (overEl &amp;&amp; overEl.parentNode) overEl.parentNode.removeChild(overEl);
    overEl = null;
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    gameOver = true;
    removeOver();
    overEl = document.createElement(&#x27;div&#x27;);
    overEl.className = &#x27;gameover&#x27;;
    overEl.textContent = &#x27;Crashed! Score: &#x27; + score;
    field.appendChild(overEl);
  }

  function placeInitialObstacles() {
    clearObstacles();
    for (var i = 0; i &lt; 2; i++) {
      var size = 32;
      var o = { x: FIELD_W - 60 - i * 90, y: 80 + i * 140, size: size, scored: false, speed: 3, drift: 0, el: null };
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;obstacle&#x27;;
      var c = colors[i % colors.length];
      el.style.width = size + &#x27;px&#x27;;
      el.style.height = size + &#x27;px&#x27;;
      el.style.left = o.x + &#x27;px&#x27;;
      el.style.top = o.y + &#x27;px&#x27;;
      el.style.background = c;
      el.style.boxShadow = &#x27;0 0 14px &#x27; + c;
      field.appendChild(el);
      o.el = el;
      obstacles.push(o);
    }
  }

  function startGame() {
    if (running) return;
    removeOver();
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    frames = 0;
    heroY = FIELD_H / 2 - HERO_SIZE / 2;
    targetY = heroY;
    drawY = heroY;
    bobPhase = 0;
    gameOver = false;
    lastShot = 0;
    clearObstacles();
    clearLasers();
    paintHero();
    spawnObstacle();
    running = true;
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnObstacle, SPEEDS[speedLevel].spawn);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;ArrowDown&#x27;) {
      var step = 34;
      if (e.key === &#x27;ArrowUp&#x27;) targetY -= step;
      else targetY += step;
      if (targetY &lt; 0) targetY = 0;
      if (targetY &gt; FIELD_H - HERO_SIZE) targetY = FIELD_H - HERO_SIZE;
      e.preventDefault();
    } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      fireLaser();
      e.preventDefault();
    } else if (e.key === &#x27;1&#x27; || e.key === &#x27;2&#x27; || e.key === &#x27;3&#x27;) {
      applySpeed(parseInt(e.key, 10));
    }
  });

  speedInput.addEventListener(&#x27;input&#x27;, function () {
    applySpeed(parseInt(speedInput.value, 10));
  });

  field.addEventListener(&#x27;mousemove&#x27;, function (e) {
    if (!running) return;
    var rect = field.getBoundingClientRect();
    var y = e.clientY - rect.top - HERO_SIZE / 2;
    if (y &lt; 0) y = 0;
    if (y &gt; FIELD_H - HERO_SIZE) y = FIELD_H - HERO_SIZE;
    targetY = y;
  });

  field.addEventListener(&#x27;mousedown&#x27;, function () { fireLaser(); });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  applySpeed(2);
  paintHero();
  placeInitialObstacles();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
