<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }

  .score { font-size: 22px; color: #555; margin: 0; }
  .board { position: relative; width: 620px; height: 440px; flex-shrink: 0; margin: 0; background: #cfe8f5; border-radius: 8px; overflow: hidden; }
  .mole { position: absolute; width: 78px; height: 78px; cursor: pointer; transition: transform 0.08s; }
  .mole:active { transform: scale(0.9); }
  .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; }
  @keyframes flyout {
    from { transform: translate(0,0) scale(1); opacity: 1; }

  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Whack-a-Pirate&lt;/h1&gt;

  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {

  var COLORS = [&#x27;#e74c3c&#x27;,&#x27;#f1c40f&#x27;,&#x27;#e67e22&#x27;,&#x27;#ffe0bd&#x27;,&#x27;#111&#x27;,&#x27;#fff&#x27;,&#x27;#c0392b&#x27;];

  function explode(cx, cy) {
    var count = 14;
    for (var i = 0; i &lt; count; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      p.style.left = (cx - 5) + &#x27;px&#x27;;
      p.style.top = (cy - 5) + &#x27;px&#x27;;
      p.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      var ang = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random() * 55;
      p.style.setProperty(&#x27;--dx&#x27;, (Math.cos(ang) * dist).toFixed(0) + &#x27;px&#x27;);
      p.style.setProperty(&#x27;--dy&#x27;, (Math.sin(ang) * dist).toFixed(0) + &#x27;px&#x27;);
      p.style.animation = &#x27;flyout 0.5s ease-out forwards&#x27;;
      board.appendChild(p);
      (function (el) {
        setTimeout(function () {
          if (el.parentNode === board) board.removeChild(el);
        }, 520);
      })(p);
    }
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    board.innerHTML = &#x27;&#x27;;
  }

  function spawnMole() {
    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27;;
    mole.innerHTML = PIRATE_SVG;
    var left = Math.random() * (BOARD_W - MOLE_SIZE);
    var top = Math.random() * (BOARD_H - MOLE_SIZE);
    mole.style.left = left + &#x27;px&#x27;;
    mole.style.top = top + &#x27;px&#x27;;
    var hit = false;
    mole.addEventListener(&#x27;click&#x27;, function () {
      if (hit) return;
      hit = true;
      score += 1;
      scoreEl.textContent = score;
      playPop();
      explode(left + MOLE_SIZE / 2, top + MOLE_SIZE / 2);
      if (mole.parentNode === board) board.removeChild(mole);
    });
    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (mole.parentNode === board) board.removeChild(mole);
    }, MOLE_LIFE_MS));
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    if (intervalId) clearInterval(intervalId);
    clearAllMoles();
    spawnMole();
    intervalId = setInterval(spawnMole, SPAWN_MS);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllMoles();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });
&lt;/script&gt;

    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
