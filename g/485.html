<!doctype html>

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }

</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>🚀 SPACE DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #dfe6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; color: #7fd0ff; text-shadow: 0 0 12px rgba(80,170,255,.6); }
  .instructions { font-size: 16px; color: #9fb0d8; max-width: 620px; margin: 0; line-height: 1.3; text-align: center; }
  .hud { display: flex; gap: 14px; font-size: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .hud .val { color: #ffd36b; font-weight: 700; }
  .combo { color: #ff8fae; }
  .perk { color: #7fffab; font-weight: 700; min-width: 100px; text-align: center; }
  .lives { color: #ff6b6b; letter-spacing: 2px; }
  .bar { width: 120px; height: 12px; background: #2a1a2a; border: 1px solid #55374f; border-radius: 6px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar &gt; i { display: block; height: 100%; background: linear-gradient(90deg,#ff5b5b,#ffb14b); width: 100%; }
  .field { position: relative; width: 660px; height: 448px; flex-shrink: 0; background: radial-gradient(ellipse at 50% 0%, #0d1633 0%, #05060f 70%); border: 1px solid #1c2a55; border-radius: 10px; overflow: hidden; cursor: none; }
  canvas { display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🚀 SPACE DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your rocketship with the mouse and press &lt;strong&gt;Space&lt;/strong&gt; to fire. Chain hits for perks — reach a x5 combo to summon a boss that shoots back, and survive with your 4 lives!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot;&gt;Combo: &lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;perk&quot; id=&quot;perk&quot;&gt;SINGLE SHOT&lt;/div&gt;
    &lt;div&gt;HP &lt;span class=&quot;bar&quot;&gt;&lt;i id=&quot;hpbar&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤❤❤❤&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;660&quot; height=&quot;448&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 660, H = 448;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), perkEl = document.getElementById(&#x27;perk&#x27;);
  var hpbarEl = document.getElementById(&#x27;hpbar&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

  var running = false, animId = null, spawnId = null;
  var score = 0, combo = 0;
  var lastShot = 0;
  var startTime = 0, speedMult = 1;
  var lives = 4, hp = 100, gameOver = false;
  var boss = null, bossBullets = [], bossSummoned = false;
  var ship = { x: W/2, y: H - 60, w: 34, h: 40 };
  var bullets = [], aliens = [], particles = [], stars = [];

  var MAX_HP = 100, BOSS_HP = 10;

  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 70; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.8+0.4, v: Math.random()*0.6+0.2 });
    }
  }

  var ALIEN_TYPES = [
    { shape:&#x27;saucer&#x27;, w:40, h:26, color:&#x27;#8affc4&#x27;, hp:1, speed:1.0, pts:10 },
    { shape:&#x27;bug&#x27;,    w:34, h:32, color:&#x27;#c79bff&#x27;, hp:1, speed:1.7, pts:15 },
    { shape:&#x27;big&#x27;,    w:58, h:40, color:&#x27;#ff9d6b&#x27;, hp:2, speed:0.7, pts:25 },
    { shape:&#x27;darter&#x27;, w:26, h:24, color:&#x27;#ffe27f&#x27;, hp:1, speed:2.6, pts:20 }
  ];

  function spawnAlien() {
    if (boss) return; // no small aliens during boss fight
    var t = ALIEN_TYPES[Math.floor(Math.random()*ALIEN_TYPES.length)];
    var x = Math.random()*(W - t.w) + t.w/2;
    aliens.push({
      x: x, y: -t.h, w: t.w, h: t.h, color: t.color, hp: t.hp, maxhp: t.hp,
      baseSpeed: t.speed + Math.random()*0.6, pts: t.pts, shape: t.shape,
      drift: (Math.random()-0.5)*1.2, phase: Math.random()*6.28
    });
  }

  function summonBoss() {
    boss = { x: W/2, y: -60, w: 120, h: 80, hp: BOSS_HP, dir: 1, phase: 0, fireT: 0, entering: true };
    bossBullets = [];
    beep(90, 0.5, &#x27;sawtooth&#x27;, 0.1);
  }

  function perkLevel() {
    if (combo &gt;= 12) return 3;
    if (combo &gt;= 6) return 2;
    return 1;
  }
  function updatePerkLabel() {
    var lvl = perkLevel();
    perkEl.textContent = lvl===3 ? &#x27;TRIPLE SHOT!&#x27; : lvl===2 ? &#x27;DOUBLE SHOT!&#x27; : &#x27;SINGLE SHOT&#x27;;
    perkEl.style.color = lvl===3 ? &#x27;#ff8fae&#x27; : lvl===2 ? &#x27;#7fffab&#x27; : &#x27;#9fb0d8&#x27;;
  }
  function updateHUD() {
    hpbarEl.style.width = Math.max(0, hp) + &#x27;%&#x27;;
    var s = &#x27;&#x27;;
    for (var i=0;i&lt;lives;i++) s += &#x27;❤&#x27;;
    for (var j=lives;j&lt;4;j++) s += &#x27;♡&#x27;;
    livesEl.textContent = s;
  }

  function fire() {
    var now = Date.now();
    if (now - lastShot &lt; 200) return;
    lastShot = now;
    var lvl = perkLevel();
    var bx = ship.x, by = ship.y - ship.h/2;
    if (lvl === 1) {
      bullets.push({ x: bx, y: by, vx: 0, vy: -9 });
    } else if (lvl === 2) {
      bullets.push({ x: bx-8, y: by, vx: 0, vy: -9 });
      bullets.push({ x: bx+8, y: by, vx: 0, vy: -9 });
    } else {
      bullets.push({ x: bx, y: by, vx: 0, vy: -9.5 });
      bullets.push({ x: bx-9, y: by+4, vx: -2, vy: -8.5 });
      bullets.push({ x: bx+9, y: by+4, vx: 2, vy: -8.5 });
    }
    beep(680, 0.09, &#x27;sawtooth&#x27;, 0.05);
  }

  function burst(x, y, color, n) {
    for (var i=0;i&lt;n;i++){
      var a = Math.random()*6.28, sp = Math.random()*3+1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
    }
  }

  function playerHit(dmg) {
    if (gameOver) return;
    hp -= dmg;
    combo = 0; comboEl.textContent = &#x27;x1&#x27;; updatePerkLabel();
    burst(ship.x, ship.y, &#x27;#ff5b5b&#x27;, 14);
    beep(160, 0.2, &#x27;square&#x27;, 0.08);
    if (hp &lt;= 0) {
      lives -= 1;
      hp = MAX_HP;
      burst(ship.x, ship.y, &#x27;#ffffff&#x27;, 30);
      beep(80, 0.4, &#x27;sawtooth&#x27;, 0.1);
      if (lives &lt;= 0) { lives = 0; endGame(); }
    }
    updateHUD();
  }

  function drawShip() {
    var x = ship.x, y = ship.y;
    ctx.save();
    var f = 6 + Math.random()*6;
    ctx.fillStyle = &#x27;rgba(255,150,60,0.9)&#x27;;
    ctx.beginPath();
    ctx.moveTo(x-6, y+ship.h/2-4); ctx.lineTo(x, y+ship.h/2+f); ctx.lineTo(x+6, y+ship.h/2-4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#e6ecff&#x27;;
    ctx.beginPath();
    ctx.moveTo(x, y-ship.h/2);
    ctx.quadraticCurveTo(x+ship.w/2, y+ship.h/4, x+ship.w/2-4, y+ship.h/2-2);
    ctx.lineTo(x-ship.w/2+4, y+ship.h/2-2);
    ctx.quadraticCurveTo(x-ship.w/2, y+ship.h/4, x, y-ship.h/2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#4fa8ff&#x27;;
    ctx.beginPath(); ctx.arc(x, y-2, 5, 0, 6.28); ctx.fill();
    ctx.fillStyle = &#x27;#ff6b6b&#x27;;
    ctx.beginPath(); ctx.moveTo(x-ship.w/2+4, y+ship.h/2-2); ctx.lineTo(x-ship.w/2-4, y+ship.h/2+4); ctx.lineTo(x-6, y+ship.h/2-6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+ship.w/2-4, y+ship.h/2-2); ctx.lineTo(x+ship.w/2+4, y+ship.h/2+4); ctx.lineTo(x+6, y+ship.h/2-6); ctx.fill();
    ctx.restore();
  }

  function drawAlien(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.fillStyle = a.color;
    if (a.shape === &#x27;saucer&#x27;) {
      ctx.beginPath(); ctx.ellipse(0, 4, a.w/2, a.h/3, 0, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -3, a.w/4, a.h/3, 0, 0, 6.28); ctx.fill();
    } else if (a.shape === &#x27;bug&#x27;) {
      ctx.beginPath(); ctx.ellipse(0,0,a.w/2,a.h/2,0,0,6.28); ctx.fill();
      ctx.fillStyle=&#x27;rgba(0,0,0,0.4)&#x27;;
      ctx.beginPath(); ctx.arc(-6,-2,3,0,6.28); ctx.arc(6,-2,3,0,6.28); ctx.fill();
    } else if (a.shape === &#x27;big&#x27;) {
      ctx.beginPath(); ctx.moveTo(-a.w/2,4); ctx.lineTo(0,-a.h/2); ctx.lineTo(a.w/2,4); ctx.quadraticCurveTo(0,a.h/2, -a.w/2,4); ctx.fill();
      ctx.fillStyle=&#x27;rgba(0,0,0,0.3)&#x27;;
      ctx.fillRect(-a.w/4, 0, a.w/2, 4);
    } else {
      ctx.beginPath(); ctx.moveTo(0,-a.h/2); ctx.lineTo(a.w/2,a.h/2); ctx.lineTo(-a.w/2,a.h/2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawBoss(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    // main hull
    var grd = ctx.createLinearGradient(0,-b.h/2,0,b.h/2);
    grd.addColorStop(0,&#x27;#ff7b9c&#x27;); grd.addColorStop(1,&#x27;#7a1f3a&#x27;);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.ellipse(0,0,b.w/2,b.h/2,0,0,6.28); ctx.fill();
    // dome
    ctx.fillStyle = &#x27;#ffd36b&#x27;;
    ctx.beginPath(); ctx.ellipse(0,-6,b.w/4,b.h/4,0,0,6.28); ctx.fill();
    // eye
    ctx.fillStyle = &#x27;#5b0000&#x27;;
    ctx.beginPath(); ctx.arc(0,-6,10,0,6.28); ctx.fill();
    ctx.fillStyle = &#x27;#ff2b2b&#x27;;
    ctx.beginPath(); ctx.arc(0,-6,5,0,6.28); ctx.fill();
    // cannons
    ctx.fillStyle = &#x27;#3a0f1a&#x27;;
    ctx.fillRect(-b.w/3, b.h/4, 10, 14);
    ctx.fillRect(b.w/3-10, b.h/4, 10, 14);
    ctx.restore();
    // hp bar above boss
    var bw = b.w, bx = b.x - bw/2, by = b.y - b.h/2 - 14;
    ctx.fillStyle = &#x27;#2a1a2a&#x27;; ctx.fillRect(bx, by, bw, 7);
    ctx.fillStyle = &#x27;#ff5b5b&#x27;; ctx.fillRect(bx, by, bw * (b.hp/BOSS_HP), 7);
  }

  function bossFire(b) {
    // aim roughly toward the player
    var dx = ship.x - b.x, dy = ship.y - (b.y + b.h/4);
    var d = Math.sqrt(dx*dx+dy*dy) || 1;
    var sp = 4.2;
    bossBullets.push({ x: b.x-b.w/3+5, y: b.y+b.h/4+10, vx: dx/d*sp, vy: dy/d*sp });
    bossBullets.push({ x: b.x+b.w/3-5, y: b.y+b.h/4+10, vx: dx/d*sp, vy: dy/d*sp });
    beep(200, 0.12, &#x27;sawtooth&#x27;, 0.06);
  }

  function drawCenterText(txt, sub) {
    ctx.fillStyle = &#x27;rgba(0,0,0,0.55)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#7fd0ff&#x27;; ctx.textAlign = &#x27;center&#x27;;
    ctx.font = &#x27;bold 40px system-ui, sans-serif&#x27;;
    ctx.fillText(txt, W/2, H/2 - 6);
    if (sub) { ctx.fillStyle = &#x27;#dfe6ff&#x27;; ctx.font = &#x27;18px system-ui, sans-serif&#x27;; ctx.fillText(sub, W/2, H/2 + 30); }
    ctx.textAlign = &#x27;left&#x27;;
  }

  function tick() {
    if (!running) return;

    var elapsed = (Date.now() - startTime) / 1000;
    speedMult = Math.min(2.4, 0.45 + elapsed * 0.026);

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = &#x27;#ffffff&#x27;;
    for (var s=0;s&lt;stars.length;s++){
      var st = stars[s];
      st.y += st.v; if (st.y &gt; H) { st.y = 0; st.x = Math.random()*W; }
      ctx.globalAlpha = st.s/2.2;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    // player bullets
    for (var i=bullets.length-1;i&gt;=0;i--){
      var b = bullets[i];
      b.x += b.vx; b.y += b.vy;
      if (b.y &lt; -20 || b.x &lt; -20 || b.x &gt; W+20) { bullets.splice(i,1); continue; }
      var grd = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,9);
      grd.addColorStop(0,&#x27;#ffd0d0&#x27;); grd.addColorStop(0.4,&#x27;#ff2b2b&#x27;); grd.addColorStop(1,&#x27;rgba(255,0,0,0)&#x27;);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x,b.y,9,0,6.28); ctx.fill();
      ctx.fillStyle = &#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(b.x,b.y,2.5,0,6.28); ctx.fill();
    }

    // aliens
    for (var j=aliens.length-1;j&gt;=0;j--){
      var a = aliens[j];
      a.phase += 0.05;
      a.y += a.baseSpeed * speedMult;
      a.x += (a.drift + Math.sin(a.phase)*0.6) * speedMult;
      if (a.x &lt; a.w/2) a.x = a.w/2; if (a.x &gt; W-a.w/2) a.x = W-a.w/2;
      if (a.y &gt; H + a.h) {
        aliens.splice(j,1);
        combo = 0; comboEl.textContent = &#x27;x1&#x27;; updatePerkLabel();
        continue;
      }
      drawAlien(a);
    }

    // boss logic
    if (boss) {
      if (boss.entering) {
        boss.y += 1.6;
        if (boss.y &gt;= 78) { boss.y = 78; boss.entering = false; }
      } else {
        boss.phase += 0.02;
        boss.x += boss.dir * 1.3;
        if (boss.x &lt; boss.w/2) { boss.x = boss.w/2; boss.dir = 1; }
        if (boss.x &gt; W-boss.w/2) { boss.x = W-boss.w/2; boss.dir = -1; }
        boss.y = 78 + Math.sin(boss.phase)*20;
        boss.fireT += 1;
        if (boss.fireT &gt; 70) { boss.fireT = 0; bossFire(boss); }
      }
      drawBoss(boss);
    }

    // boss bullets
    for (var bb=bossBullets.length-1;bb&gt;=0;bb--){
      var eb = bossBullets[bb];
      eb.x += eb.vx; eb.y += eb.vy;
      if (eb.y &gt; H+20 || eb.y &lt; -20 || eb.x &lt; -20 || eb.x &gt; W+20) { bossBullets.splice(bb,1); continue; }
      var eg = ctx.createRadialGradient(eb.x,eb.y,0,eb.x,eb.y,8);
      eg.addColorStop(0,&#x27;#fff&#x27;); eg.addColorStop(0.4,&#x27;#8affc4&#x27;); eg.addColorStop(1,&#x27;rgba(60,255,160,0)&#x27;);
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(eb.x,eb.y,8,0,6.28); ctx.fill();
      // hit player?
      if (Math.abs(eb.x-ship.x) &lt; ship.w/2 &amp;&amp; Math.abs(eb.y-ship.y) &lt; ship.h/2) {
        bossBullets.splice(bb,1);
        playerHit(20);
      }
    }

    // player bullet collisions (aliens + boss)
    for (var bi=bullets.length-1;bi&gt;=0;bi--){
      var bl = bullets[bi]; var hit = false;
      // boss
      if (boss &amp;&amp; !boss.entering &amp;&amp; Math.abs(bl.x-boss.x) &lt; boss.w/2 &amp;&amp; Math.abs(bl.y-boss.y) &lt; boss.h/2) {
        boss.hp -= 1; hit = true;
        burst(bl.x, bl.y, &#x27;#ffd36b&#x27;, 8);
        beep(320, 0.06, &#x27;square&#x27;, 0.05);
        if (boss.hp &lt;= 0) {
          burst(boss.x, boss.y, &#x27;#ff7b9c&#x27;, 50);
          score += 300; scoreEl.textContent = score;
          beep(120, 0.5, &#x27;sawtooth&#x27;, 0.1);
          boss = null; bossBullets = []; bossSummoned = false;
          combo = 0; comboEl.textContent = &#x27;x1&#x27;; updatePerkLabel();
        }
      }
      if (!hit) {
        for (var ai=aliens.length-1;ai&gt;=0;ai--){
          var al = aliens[ai];
          if (Math.abs(bl.x-al.x) &lt; al.w/2+4 &amp;&amp; Math.abs(bl.y-al.y) &lt; al.h/2+4) {
            al.hp -= 1; hit = true;
            burst(bl.x, bl.y, &#x27;#ff9a9a&#x27;, 6);
            if (al.hp &lt;= 0) {
              combo += 1;
              var mult = Math.min(5, 1 + Math.floor(combo/3));
              score += al.pts * mult;
              burst(al.x, al.y, al.color, 18);
              aliens.splice(ai,1);
              scoreEl.textContent = score;
              comboEl.textContent = &#x27;x&#x27; + mult + &#x27; (&#x27; + combo + &#x27;)&#x27;;
              updatePerkLabel();
              beep(240, 0.15, &#x27;square&#x27;, 0.06);
              if (!bossSummoned &amp;&amp; combo &gt;= 15) { bossSummoned = true; summonBoss(); }
            } else {
              beep(400, 0.05, &#x27;square&#x27;, 0.04);
            }
            break;
          }
        }
      }
      if (hit) bullets.splice(bi,1);
    }

    // small alien colliding with player
    for (var ci=aliens.length-1;ci&gt;=0;ci--){
      var ca = aliens[ci];
      if (Math.abs(ca.x-ship.x) &lt; (ca.w+ship.w)/2-6 &amp;&amp; Math.abs(ca.y-ship.y) &lt; (ca.h+ship.h)/2-6) {
        aliens.splice(ci,1);
        playerHit(15);
      }
    }

    // particles
