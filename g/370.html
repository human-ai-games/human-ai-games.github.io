<!doctype html>
<html lang="en">
<head>

<title>Fruit Catch</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  .header a { color: #1f6feb; }

    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Fruit Catch</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Fruit Catch&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the basket with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt; to catch falling fruit — each catch is worth 10 points. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;&lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 480, FIELD_H = 420;
  var running = false;
  var loopId = null, spawnId = null;
  var lastTime = 0;
  var score = 0;
  var basketX = FIELD_W / 2 - 30;
  var BASKET_W = 60, BASKET_Y = FIELD_H - 50;
  var items = [];
  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍓&#x27;,&#x27;🍇&#x27;,&#x27;🍒&#x27;,&#x27;🍑&#x27;,&#x27;🍐&#x27;];

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var basketEl = document.createElement(&#x27;div&#x27;);
  basketEl.className = &#x27;basket&#x27;;
  basketEl.textContent = &#x27;🧺&#x27;;

  function reset() {
    field.innerHTML = &#x27;&#x27;;
    items = [];
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    basketX = FIELD_W / 2 - BASKET_W / 2;
    field.appendChild(basketEl);
    positionBasket();
  }

  function positionBasket() {
    basketEl.style.left = basketX + &#x27;px&#x27;;
  }

  function spawnItem() {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;item&#x27;;
    el.textContent = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    var x = Math.random() * (FIELD_W - 32);
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = &#x27;-32px&#x27;;
    field.appendChild(el);
    items.push({ el: el, x: x, y: -32, speed: 120 + Math.random() * 120 });
  }

  function step(dt) {
    for (var i = items.length - 1; i &gt;= 0; i--) {
      var it = items[i];
      it.y += it.speed * dt;
      it.el.style.top = it.y + &#x27;px&#x27;;
      var itemCenter = it.x + 16;
      if (it.y + 32 &gt;= BASKET_Y &amp;&amp; it.y &lt;= BASKET_Y + 44 &amp;&amp;
          itemCenter &gt;= basketX &amp;&amp; itemCenter &lt;= basketX + BASKET_W) {
        score += 10;
        scoreEl.textContent = score;
        field.removeChild(it.el);
        items.splice(i, 1);
        continue;
      }
      if (it.y &gt; FIELD_H) {
        field.removeChild(it.el);
        items.splice(i, 1);
      }
    }
  }

  function loop(t) {
    if (!running) return;
    if (!lastTime) lastTime = t;
    var dt = (t - lastTime) / 1000;
    lastTime = t;
    if (dt &gt; 0.05) dt = 0.05;
    step(dt);
    loopId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    reset();
    running = true;
    lastTime = 0;
    spawnItem();
    loopId = requestAnimationFrame(loop);
    spawnId = setInterval(spawnItem, 900);
  }

  function stopGame() {
    running = false;
    if (loopId) { cancelAnimationFrame(loopId); loopId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  function move(dx) {
    if (!running) return;
    basketX += dx;
    if (basketX &lt; 0) basketX = 0;
    if (basketX &gt; FIELD_W - BASKET_W) basketX = FIELD_W - BASKET_W;
    positionBasket();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-32); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(32); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  reset();
&lt;/script&gt;

<script>

  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
