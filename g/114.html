<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whack-a-mole</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Whack-a-mole</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.35; }
  .legend { font-size: 15px; color: #444; margin: 0; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .hud { display: flex; gap: 24px; align-items: center; }
  .score, .streak, .timer { font-size: 20px; color: #555; margin: 0; }
  .board { position: relative; width: 620px; height: 380px; flex-shrink: 0; margin: 0; background: #ececec; border-radius: 8px; transition: background 0.3s; }
  .board.bonus { background: #1b1b2e; box-shadow: inset 0 0 40px rgba(255,215,60,0.3); }
  .mole { position: absolute; width: 68px; height: 68px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 -6px 10px rgba(0,0,0,0.2); }
  .bolt { position: absolute; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 32px; background: radial-gradient(circle, #fff7cc 0%, #ffd93b 70%, #f2b705 100%); box-shadow: 0 0 14px 4px rgba(255,215,60,0.8); animation: pulse 0.5s infinite alternate; }
  .bolt.bad { background: radial-gradient(circle, #ffd0d0 0%, #f25c5c 70%, #c02020 100%); box-shadow: 0 0 14px 4px rgba(235,87,87,0.8); }
  .bonusBanner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 700; color: #ffd93b; text-shadow: 0 0 12px rgba(0,0,0,0.6); pointer-events: none; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Whack-a-mole&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hit colored moles for points, dodge the red ones and red ⚡, and grab gold ⚡ for +10. Land 10 good hits in a row to trigger a 20-second lightning bonus round!&lt;/p&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#f2c94c&quot;&gt;&lt;/i&gt;+1&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#3ba55c&quot;&gt;&lt;/i&gt;+2&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#2f80ed&quot;&gt;&lt;/i&gt;+3&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#eb5757&quot;&gt;&lt;/i&gt;−3&lt;/span&gt;
    &lt;span&gt;⚡ +10&lt;/span&gt;
    &lt;span style=&quot;color:#c02020&quot;&gt;⚡ −10&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;p class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
    &lt;p class=&quot;streak&quot;&gt;Streak: &lt;span id=&quot;streak&quot;&gt;0&lt;/span&gt;/10&lt;/p&gt;
    &lt;p class=&quot;timer&quot; id=&quot;timerWrap&quot; style=&quot;display:none&quot;&gt;Bonus: &lt;span id=&quot;timer&quot;&gt;20&lt;/span&gt;s&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 380, MOLE_SIZE = 68, BOLT_SIZE = 52;
  var SPAWN_MS = 850, MOLE_LIFE_MS = 1300, BOLT_LIFE_MS = 750;
  var GOLD_BOLT_CHANCE = 0.08, RED_BOLT_CHANCE = 0.06;
  var STREAK_TARGET = 10, BONUS_DURATION = 20;
  var BONUS_SPAWN_MS = 380, BONUS_BOLT_LIFE_MS = 900, BONUS_BAD_CHANCE = 0.4;

  var score = 0, streak = 0;
  var intervalId = null, bonusTimerId = null, bonusCountId = null;
  var moleTimeouts = [];
  var running = false, inBonus = false;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);
  var timerWrap = document.getElementById(&#x27;timerWrap&#x27;);

  var MOLE_TYPES = [
    { color: &#x27;#f2c94c&#x27;, points: 1,  weight: 4 },
    { color: &#x27;#3ba55c&#x27;, points: 2,  weight: 3 },
    { color: &#x27;#2f80ed&#x27;, points: 3,  weight: 2 },
    { color: &#x27;#eb5757&#x27;, points: -3, weight: 3 }
  ];
  var TOTAL_WEIGHT = MOLE_TYPES.reduce(function (s, t) { return s + t.weight; }, 0);

  function pickType() {
    var r = Math.random() * TOTAL_WEIGHT;
    for (var i = 0; i &lt; MOLE_TYPES.length; i++) {
      r -= MOLE_TYPES[i].weight;
      if (r &lt;= 0) return MOLE_TYPES[i];
    }
    return MOLE_TYPES[0];
  }

  function clearAllMoles() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    board.innerHTML = &#x27;&#x27;;
  }

  function setScore(v) { score = v; scoreEl.textContent = score; }
  function setStreak(v) { streak = v; streakEl.textContent = streak; }

  function goodHit(pts) {
    setScore(score + pts);
    if (inBonus) return;
    setStreak(streak + 1);
    if (streak &gt;= STREAK_TARGET) startBonus();
  }

  function badHit(pts) {
    setScore(score + pts);
    if (!inBonus) setStreak(0);
  }

  function makeBolt(bad, lifeMs, points) {
    var bolt = document.createElement(&#x27;div&#x27;);
    bolt.className = &#x27;bolt&#x27; + (bad ? &#x27; bad&#x27; : &#x27;&#x27;);
    bolt.textContent = bad ? &#x27;✦&#x27; : &#x27;⚡&#x27;;
    bolt.style.left = Math.random() * (BOARD_W - BOLT_SIZE) + &#x27;px&#x27;;
    bolt.style.top = Math.random() * (BOARD_H - BOLT_SIZE) + &#x27;px&#x27;;
    var hit = false;
    bolt.addEventListener(&#x27;click&#x27;, function () {
      if (hit) return;
      hit = true;
      if (bad) badHit(points); else goodHit(points);
      bolt.style.background = bad ? &#x27;#7a1f1f&#x27; : &#x27;#ffffff&#x27;;
      setTimeout(function () {
        if (bolt.parentNode === board) board.removeChild(bolt);
      }, 120);
    });
    board.appendChild(bolt);
    moleTimeouts.push(setTimeout(function () {
      if (bolt.parentNode === board) board.removeChild(bolt);
    }, lifeMs));
  }

  function spawnMole() {
    var roll = Math.random();
    if (roll &lt; GOLD_BOLT_CHANCE) { makeBolt(false, BOLT_LIFE_MS, 10); return; }
    if (roll &lt; GOLD_BOLT_CHANCE + RED_BOLT_CHANCE) { makeBolt(true, BOLT_LIFE_MS, -10); return; }
    var type = pickType();
    var mole = document.createElement(&#x27;div&#x27;);
    mole.className = &#x27;mole&#x27;;
    mole.style.background = type.color;
    mole.style.left = Math.random() * (BOARD_W - MOLE_SIZE) + &#x27;px&#x27;;
    mole.style.top = Math.random() * (BOARD_H - MOLE_SIZE) + &#x27;px&#x27;;
    var hit = false;
    mole.addEventListener(&#x27;click&#x27;, function () {
      if (hit) return;
      hit = true;
      if (type.points &gt; 0) goodHit(type.points); else badHit(type.points);
      mole.style.background = type.points &gt; 0 ? &#x27;#ffffff&#x27; : &#x27;#7a1f1f&#x27;;
      setTimeout(function () {
        if (mole.parentNode === board) board.removeChild(mole);
      }, 120);
    });
    board.appendChild(mole);
    moleTimeouts.push(setTimeout(function () {
      if (mole.parentNode === board) board.removeChild(mole);
    }, MOLE_LIFE_MS));
  }

  function spawnBonusBolt() {
    var bad = Math.random() &lt; BONUS_BAD_CHANCE;
    makeBolt(bad, BONUS_BOLT_LIFE_MS, bad ? -20 : 10);
  }

  function startBonus() {
    inBonus = true;
    setStreak(0);
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    clearAllMoles();
    board.classList.add(&#x27;bonus&#x27;);
    var banner = document.createElement(&#x27;div&#x27;);
    banner.className = &#x27;bonusBanner&#x27;;
    banner.textContent = &#x27;BONUS ROUND!&#x27;;
    board.appendChild(banner);
    setTimeout(function () { if (banner.parentNode === board) board.removeChild(banner); }, 1200);

    var remaining = BONUS_DURATION;
    timerEl.textContent = remaining;
    timerWrap.style.display = &#x27;&#x27;;
    // First bolt right away so something moves immediately.
    spawnBonusBolt(); spawnBonusBolt();
    bonusTimerId = setInterval(function () { spawnBonusBolt(); spawnBonusBolt(); }, BONUS_SPAWN_MS);
    bonusCountId = setInterval(function () {
      remaining -= 1;
      timerEl.textContent = remaining;
      if (remaining &lt;= 0) endBonus();
    }, 1000);
  }

  function endBonus() {
    inBonus = false;
    if (bonusTimerId) { clearInterval(bonusTimerId); bonusTimerId = null; }
    if (bonusCountId) { clearInterval(bonusCountId); bonusCountId = null; }
    timerWrap.style.display = &#x27;none&#x27;;
    board.classList.remove(&#x27;bonus&#x27;);
    clearAllMoles();
    if (running) {
      spawnMole();
      intervalId = setInterval(spawnMole, SPAWN_MS);
    }
  }

  function startGame() {
    if (running) return;
    running = true;
    inBonus = false;
    setScore(0);
    setStreak(0);
    timerWrap.style.display = &#x27;none&#x27;;
    board.classList.remove(&#x27;bonus&#x27;);
    if (intervalId) clearInterval(intervalId);
    clearAllMoles();
    spawnMole();
    intervalId = setInterval(spawnMole, SPAWN_MS);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    inBonus = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    if (bonusTimerId) { clearInterval(bonusTimerId); bonusTimerId = null; }
    if (bonusCountId) { clearInterval(bonusCountId); bonusCountId = null; }
    timerWrap.style.display = &#x27;none&#x27;;
    board.classList.remove(&#x27;bonus&#x27;);
    clearAllMoles();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
