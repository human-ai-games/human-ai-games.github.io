  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .topbar { display: flex; align-items: center; gap: 24px; }

  .block { position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Falling blocks&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&lt;/strong&gt; / &lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and hold &lt;strong&gt;&amp;darr;&lt;/strong&gt; to drop faster. When landed pieces touch they merge into one colored shape — clear full rows to score. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;next&quot;&gt;
      &lt;span&gt;Next&lt;/span&gt;
      &lt;div class=&quot;nextfield&quot; id=&quot;nextfield&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24;
  var COLS = 10, ROWS = 16;
  var SLOW_MS = 900;
  var FAST_MS = 70;
  var running = false, dropId = null;
  var fastDrop = false;
  var grid = [];        // stores group-id (number) or null
  var groupColor = {};  // group-id -&gt; color
  var nextGroupId = 1;
  var piece = null;
  var nextType = null;
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var nextField = document.getElementById(&#x27;nextfield&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  // Palette used to color merged groups.
  var PALETTE = [&#x27;#3fbcd6&#x27;,&#x27;#f2c53d&#x27;,&#x27;#a25fd6&#x27;,&#x27;#f08a3c&#x27;,&#x27;#4d78d6&#x27;,&#x27;#5ec66b&#x27;,&#x27;#e05656&#x27;,&#x27;#e0669e&#x27;,&#x27;#66c2c2&#x27;];

  var SHAPES = {
    I: { rot: [
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:3,y:1}],
      [{x:2,y:0},{x:2,y:1},{x:2,y:2},{x:2,y:3}],
      [{x:0,y:2},{x:1,y:2},{x:2,y:2},{x:3,y:2}],
      [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:1,y:3}] ] },
    O: { rot: [
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:2,y:1}] ] },
    T: { rot: [
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:2}] ] },
    L: { rot: [
      [{x:2,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:1,y:2},{x:2,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:0,y:2}],
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:1,y:2}] ] },
    J: { rot: [
      [{x:0,y:0},{x:0,y:1},{x:1,y:1},{x:2,y:1}],
      [{x:1,y:0},{x:2,y:0},{x:1,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:2,y:1},{x:2,y:2}],
      [{x:1,y:0},{x:1,y:1},{x:0,y:2},{x:1,y:2}] ] },
    S: { rot: [
      [{x:1,y:0},{x:2,y:0},{x:0,y:1},{x:1,y:1}],
      [{x:1,y:0},{x:1,y:1},{x:2,y:1},{x:2,y:2}],
      [{x:1,y:1},{x:2,y:1},{x:0,y:2},{x:1,y:2}],
      [{x:0,y:0},{x:0,y:1},{x:1,y:1},{x:1,y:2}] ] },
    Z: { rot: [
      [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:2,y:1}],
      [{x:2,y:0},{x:1,y:1},{x:2,y:1},{x:1,y:2}],
      [{x:0,y:1},{x:1,y:1},{x:1,y:2},{x:2,y:2}],
      [{x:1,y:0},{x:0,y:1},{x:1,y:1},{x:0,y:2}] ] }
  };
  var TYPES = Object.keys(SHAPES);
  // A distinct color for the active (still-falling) piece.
  var ACTIVE_COLOR = &#x27;#444&#x27;;

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(null);
      grid.push(row);
    }
    groupColor = {};
    nextGroupId = 1;
  }

  function pieceCells(p) {
    var rot = SHAPES[p.type].rot;
    var state = rot[p.r % rot.length];
    var out = [];
    for (var i = 0; i &lt; state.length; i++) {
      out.push({ x: p.x + state[i].x, y: p.y + state[i].y });
    }
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx] !== null) return true;
    }
    return false;
  }

  function randType() {
    return TYPES[Math.floor(Math.random() * TYPES.length)];
  }

  function spawnPiece() {
    var type = nextType || randType();
    nextType = randType();
    drawNext();
    piece = { type: type, r: 0, x: 3, y: 0 };
    if (collides(piece)) return false;
    return true;
  }

  // After locking, merge all connected cells into single groups and recolor.
  function lockPiece() {
    var cells = pieceCells(piece);
    // Temporarily mark new cells with a placeholder (-1).
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = -1;
    }
    piece = null;
    recomputeGroups();
  }

  // Flood-fill the whole grid into connected groups; each connected cluster
  // gets one shared color so touching pieces look like one big shape.
  function recomputeGroups() {
    var visited = [];
    for (var r = 0; r &lt; ROWS; r++) { visited.push([]); for (var c = 0; c &lt; COLS; c++) visited[r].push(false); }
    var newGroupColor = {};
    var newGrid2 = [];
    for (var r2 = 0; r2 &lt; ROWS; r2++) { var row = []; for (var c2 = 0; c2 &lt; COLS; c2++) row.push(null); newGrid2.push(row); }
    var gid = 1;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c] !== null &amp;&amp; !visited[r][c]) {
          // BFS this cluster
          var stack = [{x:c,y:r}];
          var cluster = [];
          var oldColorSeen = null;
          visited[r][c] = true;
          while (stack.length) {
            var cur = stack.pop();
            cluster.push(cur);
            var oldVal = grid[cur.y][cur.x];
            if (oldVal !== -1 &amp;&amp; oldColorSeen === null &amp;&amp; groupColor[oldVal]) oldColorSeen = groupColor[oldVal];
            var nbrs = [{x:cur.x+1,y:cur.y},{x:cur.x-1,y:cur.y},{x:cur.x,y:cur.y+1},{x:cur.x,y:cur.y-1}];
            for (var n = 0; n &lt; nbrs.length; n++) {
              var nx = nbrs[n].x, ny = nbrs[n].y;
              if (nx&gt;=0&amp;&amp;nx&lt;COLS&amp;&amp;ny&gt;=0&amp;&amp;ny&lt;ROWS&amp;&amp;!visited[ny][nx]&amp;&amp;grid[ny][nx]!==null) {
                visited[ny][nx] = true;
                stack.push({x:nx,y:ny});
              }
            }
          }
          var color = oldColorSeen || PALETTE[(gid - 1) % PALETTE.length];
          newGroupColor[gid] = color;
          for (var k = 0; k &lt; cluster.length; k++) newGrid2[cluster[k].y][cluster[k].x] = gid;
          gid++;
        }
      }
    }
    grid = newGrid2;
    groupColor = newGroupColor;
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (grid[r][c] === null) { full = false; break; }
      if (full) {
        grid.splice(r, 1);
        var empty = [];
        for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
        grid.unshift(empty);
        cleared += 1;
        r += 1;
      }
    }
    if (cleared &gt; 0) {
      score += cleared * cleared;
      scoreEl.textContent = score;
      recomputeGroups(); // re-merge after rows removed
    }
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        if (grid[r][c] !== null) {
          var col = groupColor[grid[r][c]] || &#x27;#888&#x27;;
          drawBlock(field, c, r, col);
        }
      }
    }
    if (piece) {
      var cells = pieceCells(piece);
      for (var i = 0; i &lt; cells.length; i++) {
        if (cells[i].y &gt;= 0) drawBlock(field, cells[i].x, cells[i].y, ACTIVE_COLOR);
      }
    }
  }

  function drawNext() {
    nextField.innerHTML = &#x27;&#x27;;
    if (!nextType) return;
    var state = SHAPES[nextType].rot[0];
    // center within 4x4
    var minx=99,miny=99,maxx=-1,maxy=-1;
    for (var i=0;i&lt;state.length;i++){minx=Math.min(minx,state[i].x);miny=Math.min(miny,state[i].y);maxx=Math.max(maxx,state[i].x);maxy=Math.max(maxy,state[i].y);}
    var w = maxx-minx+1, h = maxy-miny+1;
    var offx = Math.floor((4-w)/2), offy = Math.floor((4-h)/2);
    var scale = 24;
    for (var i=0;i&lt;state.length;i++){
      var el = document.createElement(&#x27;div&#x27;);
      el.className=&#x27;block&#x27;;
      el.style.left = ((state[i].x-minx+offx)*scale)+&#x27;px&#x27;;
      el.style.top = ((state[i].y-miny+offy)*scale)+&#x27;px&#x27;;
      el.style.width = scale+&#x27;px&#x27;;
      el.style.height = scale+&#x27;px&#x27;;
      el.style.background = ACTIVE_COLOR;
      nextField.appendChild(el);
    }
  }

  function drawBlock(container, cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;block&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = color;
    container.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, r: piece.r, x: piece.x, y: piece.y + 1 };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); return; }
    } else {
      piece = next;
    }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, r: piece.r, x: piece.x + dx, y: piece.y };
    if (!collides(next)) { piece = next; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var rotCount = SHAPES[piece.type].rot.length;
    var next = { type: piece.type, r: (piece.r + 1) % rotCount, x: piece.x, y: piece.y };
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i &lt; kicks.length; i++) {
      var test = { type: next.type, r: next.r, x: next.x + kicks[i], y: next.y };
      if (!collides(test)) { piece = test; paint(); return; }
    }
  }

  function setDropSpeed(fast) {
    fastDrop = fast;
    if (!running) return;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, fast ? FAST_MS : SLOW_MS);
  }

  function endGame() {
    running = false;
    fastDrop = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    fastDrop = false;
    nextType = null;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, SLOW_MS);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    fastDrop = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) {
      if (running &amp;&amp; !fastDrop) { stepDown(); setDropSpeed(true); }
      e.preventDefault();
    }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowDown&#x27;) { setDropSpeed(false); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial preview
  newGrid();
  nextType = &#x27;L&#x27;;
  piece = { type: &#x27;T&#x27;, r: 0, x: 3, y: 0 };
  drawNext();
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
