&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

  .brick { position: absolute; border-radius: 4px; box-shadow: inset 0 -3px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.92); font-size: 12px; font-weight: 700; text-shadow: 0 1px 1px rgba(0,0,0,0.3); }

  @keyframes shake {

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Paddle ball&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; keys, smash bricks for points, and catch falling bonuses. You have 5 lives — don&#x27;t let the ball slip past — and use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot;&gt;Lives: &lt;span id=&quot;lives&quot;&gt;❤️❤️❤️❤️❤️&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;paddle&quot; id=&quot;paddle&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ball&quot; id=&quot;ball&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;big&quot;&gt;Game Over&lt;/div&gt;

    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var PADDLE_W_BASE = 100, PADDLE_H = 14, PADDLE_BOTTOM = 10, PADDLE_SPEED = 6;
  var BALL_SIZE = 16;
  var BALL_SPEED = 4.0;
  var START_LIVES = 5;
  var running = false, animId = null;
  var keysDown = {};
  var paddleW = PADDLE_W_BASE;
  var paddleX = (FIELD_W - paddleW) / 2;
  var ballX = FIELD_W / 2, ballY = 50;
  var ballVX = BALL_SPEED, ballVY = BALL_SPEED;
  var score = 0;
  var lives = START_LIVES;
  var widenTimer = 0;
  var paddle = document.getElementById(&#x27;paddle&#x27;);
  var ball = document.getElementById(&#x27;ball&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var overlaySub = document.getElementById(&#x27;overlaySub&#x27;);

  // Brick layout
  var COLS = 8, ROWS = 4;
  var BRICK_GAP = 6, BRICK_TOP = 30, BRICK_SIDE = 20;
  var BRICK_W = (FIELD_W - BRICK_SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;
  var BRICK_H = 22;
  var ROW_TYPES = [
    { color: &#x27;#e74c3c&#x27;, points: 50 },
    { color: &#x27;#e67e22&#x27;, points: 30 },
    { color: &#x27;#f1c40f&#x27;, points: 20 },
    { color: &#x27;#2ecc71&#x27;, points: 10 }
  ];
  var bricks = [];
  var powerups = [];

  var POWERUP_TYPES = [
    { type: &#x27;points&#x27;, icon: &#x27;⭐&#x27;, bg: &#x27;#f1c40f&#x27; },
    { type: &#x27;widen&#x27;,  icon: &#x27;↔&#x27;,  bg: &#x27;#3498db&#x27; },
    { type: &#x27;blast&#x27;,  icon: &#x27;💥&#x27;, bg: &#x27;#e74c3c&#x27; }
  ];

  function shake(big) {
    var cls = big ? &#x27;shake&#x27; : &#x27;shake-small&#x27;;
    field.classList.remove(&#x27;shake&#x27;, &#x27;shake-small&#x27;);
    // force reflow so the animation restarts if triggered rapidly
    void field.offsetWidth;
    field.classList.add(cls);
  }
  field.addEventListener(&#x27;animationend&#x27;, function () {
    field.classList.remove(&#x27;shake&#x27;, &#x27;shake-small&#x27;);
  });

  function renderLives() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; lives; i++) s += &#x27;❤️&#x27;;
    livesEl.textContent = s || &#x27;—&#x27;;
  }

  function buildBricks() {
    for (var i = 0; i &lt; bricks.length; i++) {
      if (bricks[i].el &amp;&amp; bricks[i].el.parentNode) bricks[i].el.parentNode.removeChild(bricks[i].el);
    }
    bricks = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var type = ROW_TYPES[r % ROW_TYPES.length];
      for (var c = 0; c &lt; COLS; c++) {
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;brick&#x27;;
        var x = BRICK_SIDE + c * (BRICK_W + BRICK_GAP);
        var y = BRICK_TOP + r * (BRICK_H + BRICK_GAP);
        el.style.left = x + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.width = BRICK_W + &#x27;px&#x27;;
        el.style.height = BRICK_H + &#x27;px&#x27;;
        el.style.background = type.color;
        el.textContent = type.points;
        field.appendChild(el);
        bricks.push({ x: x, y: y, w: BRICK_W, h: BRICK_H, el: el, alive: true, points: type.points });
      }
    }
  }

  function clearPowerups() {
    for (var i = 0; i &lt; powerups.length; i++) {
      if (powerups[i].el &amp;&amp; powerups[i].el.parentNode) powerups[i].el.parentNode.removeChild(powerups[i].el);
    }
    powerups = [];
  }

  function spawnPowerup(x, y) {
    var t = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;powerup&#x27;;
    el.style.background = t.bg;
    el.textContent = t.icon;
    el.style.left = x + &#x27;px&#x27;;
    el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    powerups.push({ x: x, y: y, el: el, type: t.type });
  }

  function aliveCount() {
    var n = 0;
    for (var i = 0; i &lt; bricks.length; i++) if (bricks[i].alive) n++;
    return n;
  }

  function paint() {
    paddle.style.width = paddleW + &#x27;px&#x27;;
    paddle.style.left = paddleX + &#x27;px&#x27;;
    ball.style.left = ballX + &#x27;px&#x27;;
    ball.style.top = ballY + &#x27;px&#x27;;
  }

  function resetBall() {
    ballX = (FIELD_W - BALL_SIZE) / 2;
    ballY = FIELD_H / 2 + 30;
    ballVX = (Math.random() &lt; 0.5 ? -1 : 1) * BALL_SPEED;
    ballVY = BALL_SPEED;
  }

  function checkBrickCollision() {
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ballX + BALL_SIZE &gt;= b.x &amp;&amp; ballX &lt;= b.x + b.w &amp;&amp;
          ballY + BALL_SIZE &gt;= b.y &amp;&amp; ballY &lt;= b.y + b.h) {
        b.alive = false;
        if (b.el &amp;&amp; b.el.parentNode) b.el.parentNode.removeChild(b.el);
        score += b.points;
        scoreEl.textContent = score;
        if (Math.random() &lt; 0.18) spawnPowerup(b.x + b.w / 2 - 12, b.y);
        var overlapLeft = (ballX + BALL_SIZE) - b.x;
        var overlapRight = (b.x + b.w) - ballX;
        var overlapTop = (ballY + BALL_SIZE) - b.y;
        var overlapBottom = (b.y + b.h) - ballY;
        var minX = Math.min(overlapLeft, overlapRight);
        var minY = Math.min(overlapTop, overlapBottom);
        if (minX &lt; minY) ballVX = -ballVX;
        else ballVY = -ballVY;
        if (aliveCount() === 0) buildBricks();
        break;
      }
    }
  }

  function applyPowerup(type) {
    if (type === &#x27;points&#x27;) {
      score += 100;
      scoreEl.textContent = score;
    } else if (type === &#x27;widen&#x27;) {
      paddleW = 160;
      widenTimer = 600;
    } else if (type === &#x27;blast&#x27;) {
      var destroyed = 0;
      for (var i = 0; i &lt; bricks.length &amp;&amp; destroyed &lt; 5; i++) {
        if (bricks[i].alive) {
          bricks[i].alive = false;
          if (bricks[i].el &amp;&amp; bricks[i].el.parentNode) bricks[i].el.parentNode.removeChild(bricks[i].el);
          score += bricks[i].points;
          destroyed++;
        }
      }
      scoreEl.textContent = score;
      shake(true);
      if (aliveCount() === 0) buildBricks();
    }
  }

  function updatePowerups() {
    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    for (var i = powerups.length - 1; i &gt;= 0; i--) {
      var p = powerups[i];
      p.y += 2.5;
      p.el.style.top = p.y + &#x27;px&#x27;;
      if (p.y + 24 &gt;= paddleTop &amp;&amp; p.y &lt;= paddleTop + PADDLE_H &amp;&amp;
          p.x + 24 &gt;= paddleX &amp;&amp; p.x &lt;= paddleX + paddleW) {
        applyPowerup(p.type);
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        powerups.splice(i, 1);
      } else if (p.y &gt; FIELD_H) {
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        powerups.splice(i, 1);
      }
    }
  }

  function loseLife() {
    lives--;
    renderLives();
    shake(false);
    if (lives &lt;= 0) {
      gameOver();
    } else {
      resetBall();
    }
  }

  function gameOver() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    overlaySub.textContent = &#x27;Final score: &#x27; + score + &#x27; — press Restart below to play again&#x27;;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - paddleW, paddleX));

    if (widenTimer &gt; 0) {
      widenTimer--;
      if (widenTimer === 0) {
        var center = paddleX + paddleW / 2;
        paddleW = PADDLE_W_BASE;
        paddleX = Math.max(0, Math.min(FIELD_W - paddleW, center - paddleW / 2));
      }
    }

    ballX += ballVX;
    ballY += ballVY;
    if (ballX &lt;= 0) { ballX = 0; ballVX = -ballVX; }
    if (ballX + BALL_SIZE &gt;= FIELD_W) { ballX = FIELD_W - BALL_SIZE; ballVX = -ballVX; }
    if (ballY &lt;= 0) { ballY = 0; ballVY = -ballVY; }

    checkBrickCollision();

    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_SIZE &gt;= paddleTop &amp;&amp;
        ballY + BALL_SIZE &lt;= paddleTop + PADDLE_H + 6 &amp;&amp;
        ballX + BALL_SIZE &gt;= paddleX &amp;&amp;
        ballX &lt;= paddleX + paddleW) {
      ballVY = -Math.abs(ballVY);
      ballY = paddleTop - BALL_SIZE;
    }
    if (ballY &gt;= FIELD_H) {
      loseLife();
      if (!running) return;
    }

    updatePowerups();
    paint();
    animId = requestAnimationFrame(tick);
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    lives = START_LIVES;
    renderLives();
    overlay.classList.remove(&#x27;show&#x27;);
    paddleW = PADDLE_W_BASE;
    widenTimer = 0;
    paddleX = (FIELD_W - paddleW) / 2;
    for (var k in keysDown) keysDown[k] = false;
    clearPowerups();
    buildBricks();
    resetBall();
    paint();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
      keysDown[e.key] = true;
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  buildBricks();
  renderLives();
  paint();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
