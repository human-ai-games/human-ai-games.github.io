<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Jumper</b> &middot; Game 312 &middot; Professional producer &middot; Basic game: Gravity jumper</div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }

  .bg { position: absolute; inset: 0; pointer-events: none; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #b58b4c; border-top: 4px solid #8fbf5a; z-index: 3; }
  .hero { position: absolute; width: 36px; height: 36px; z-index: 4; }
  .obstacle { position: absolute; z-index: 3; }
  .cloud { position: absolute; opacity: 0.9; }
  .hill { position: absolute; bottom: 30px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Jumper&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click the field) to jump over obstacles. Watch for floating drones — jump early to slip under them! Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;!-- Static sky decoration --&gt;
    &lt;svg class=&quot;bg&quot; viewBox=&quot;0 0 620 420&quot; preserveAspectRatio=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;
      &lt;circle cx=&quot;530&quot; cy=&quot;70&quot; r=&quot;34&quot; fill=&quot;#fff3b0&quot; opacity=&quot;0.9&quot;/&gt;
      &lt;circle cx=&quot;530&quot; cy=&quot;70&quot; r=&quot;46&quot; fill=&quot;#fff3b0&quot; opacity=&quot;0.35&quot;/&gt;
    &lt;/svg&gt;
    &lt;!-- Layers for parallax elements get injected here --&gt;
    &lt;div class=&quot;bg&quot; id=&quot;cloudLayer&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;bg&quot; id=&quot;hillLayer&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ground&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hero&quot; id=&quot;hero&quot;&gt;
      &lt;svg viewBox=&quot;0 0 36 36&quot; width=&quot;36&quot; height=&quot;36&quot;&gt;
        &lt;circle cx=&quot;18&quot; cy=&quot;6&quot; r=&quot;5&quot; fill=&quot;#f2c9a0&quot; stroke=&quot;#333&quot; stroke-width=&quot;1&quot;/&gt;
        &lt;line x1=&quot;18&quot; y1=&quot;11&quot; x2=&quot;18&quot; y2=&quot;24&quot; stroke=&quot;#333&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;line x1=&quot;18&quot; y1=&quot;15&quot; x2=&quot;10&quot; y2=&quot;20&quot; stroke=&quot;#333&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;line x1=&quot;18&quot; y1=&quot;15&quot; x2=&quot;26&quot; y2=&quot;20&quot; stroke=&quot;#333&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;line x1=&quot;18&quot; y1=&quot;24&quot; x2=&quot;12&quot; y2=&quot;34&quot; stroke=&quot;#333&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;
        &lt;line x1=&quot;18&quot; y1=&quot;24&quot; x2=&quot;24&quot; y2=&quot;34&quot; stroke=&quot;#333&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/&gt;
      &lt;/svg&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 420;
  var GROUND_H = 30, HERO_SIZE = 36;
  var GRAVITY = 0.6, JUMP_V = -15;
  var OBSTACLE_SPEED = 3.5;
  var running = false, animId = null, spawnId = null;
  var heroX = 60;
  var heroY = FIELD_H - GROUND_H - HERO_SIZE;
  var heroVY = 0;
  var obstacles = [];
  var score = 0;
  var gameOver = false;
  var field = document.getElementById(&#x27;field&#x27;);
  var hero = document.getElementById(&#x27;hero&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var cloudLayer = document.getElementById(&#x27;cloudLayer&#x27;);
  var hillLayer = document.getElementById(&#x27;hillLayer&#x27;);

  // ---- Background elements (parallax) ----
  var clouds = [];
  var hills = [];

  function cloudSVG(scale) {
    var w = 90 * scale, h = 40 * scale;
    return &#x27;&lt;svg width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot; viewBox=&quot;0 0 90 40&quot;&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;28&quot; cy=&quot;26&quot; rx=&quot;24&quot; ry=&quot;14&quot; fill=&quot;#ffffff&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;52&quot; cy=&quot;20&quot; rx=&quot;22&quot; ry=&quot;16&quot; fill=&quot;#ffffff&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;68&quot; cy=&quot;28&quot; rx=&quot;18&quot; ry=&quot;12&quot; fill=&quot;#ffffff&quot;/&gt;&lt;/svg&gt;&#x27;;
  }
  function hillSVG(w, h, color) {
    return &#x27;&lt;svg width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot; viewBox=&quot;0 0 &#x27; + w + &#x27; &#x27; + h + &#x27;&quot; preserveAspectRatio=&quot;none&quot;&gt;&#x27; +
      &#x27;&lt;path d=&quot;M0,&#x27; + h + &#x27; Q&#x27; + (w/2) + &#x27;,0 &#x27; + w + &#x27;,&#x27; + h + &#x27; Z&quot; fill=&quot;&#x27; + color + &#x27;&quot;/&gt;&lt;/svg&gt;&#x27;;
  }

  function buildBackground() {
    cloudLayer.innerHTML = &#x27;&#x27;;
    hillLayer.innerHTML = &#x27;&#x27;;
    clouds = [];
    hills = [];
    // Clouds: a few at varied heights, sizes and drift speeds.
    var cloudDefs = [
      { x: 80,  y: 40,  scale: 1.0, speed: 0.25 },
      { x: 300, y: 70,  scale: 0.7, speed: 0.18 },
      { x: 480, y: 30,  scale: 1.2, speed: 0.32 },
      { x: 200, y: 110, scale: 0.55, speed: 0.15 }
    ];
    cloudDefs.forEach(function (c) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;cloud&#x27;;
      el.style.left = c.x + &#x27;px&#x27;;
      el.style.top = c.y + &#x27;px&#x27;;
      el.innerHTML = cloudSVG(c.scale);
      cloudLayer.appendChild(el);
      clouds.push({ x: c.x, y: c.y, w: 90 * c.scale, speed: c.speed, el: el });
    });
    // Distant hills: two overlapping bands that scroll slowly.
    var hillDefs = [
      { x: 0,   w: 360, h: 120, color: &#x27;#9fd08a&#x27;, speed: 0.5 },
      { x: 340, w: 360, h: 120, color: &#x27;#9fd08a&#x27;, speed: 0.5 },
      { x: 0,   w: 300, h: 90,  color: &#x27;#7ec07a&#x27;, speed: 0.9 },
      { x: 300, w: 300, h: 90,  color: &#x27;#7ec07a&#x27;, speed: 0.9 }
    ];
    hillDefs.forEach(function (hd) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;hill&#x27;;
      el.style.left = hd.x + &#x27;px&#x27;;
      el.innerHTML = hillSVG(hd.w, hd.h, hd.color);
      hillLayer.appendChild(el);
      hills.push({ x: hd.x, w: hd.w, speed: hd.speed, el: el });
    });
  }

  function moveBackground() {
    // Clouds drift left slowly and wrap around.
    clouds.forEach(function (c) {
      c.x -= c.speed;
      if (c.x + c.w &lt; 0) c.x = FIELD_W + Math.random() * 60;
      c.el.style.left = c.x + &#x27;px&#x27;;
    });
    // Hills scroll a touch faster (closer) and wrap using their pair width.
    hills.forEach(function (h) {
      h.x -= h.speed;
      if (h.x + h.w &lt; 0) h.x += h.w * 2;
      h.el.style.left = h.x + &#x27;px&#x27;;
    });
  }

  // ---- Obstacles ----
  var TYPES = [
    { name: &#x27;spike&#x27;,  w: 22, h: 42, flying: false,
      shape: function (w, h) {
        return &#x27;&lt;svg viewBox=&quot;0 0 &#x27; + w + &#x27; &#x27; + h + &#x27;&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;polygon points=&quot;0,&#x27; + h + &#x27; &#x27; + (w/2) + &#x27;,0 &#x27; + w + &#x27;,&#x27; + h + &#x27;&quot; fill=&quot;#c0392b&quot; stroke=&quot;#7d1e12&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;&#x27;;
      }
    },
    { name: &#x27;block&#x27;,  w: 46, h: 26, flying: false,
      shape: function (w, h) {
        return &#x27;&lt;svg viewBox=&quot;0 0 &#x27; + w + &#x27; &#x27; + h + &#x27;&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;rect x=&quot;1&quot; y=&quot;1&quot; width=&quot;&#x27; + (w-2) + &#x27;&quot; height=&quot;&#x27; + (h-2) + &#x27;&quot; rx=&quot;3&quot; fill=&quot;#555&quot; stroke=&quot;#333&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/svg&gt;&#x27;;
      }
    },
    { name: &#x27;cactus&#x27;, w: 30, h: 50, flying: false,
      shape: function (w, h) {
        return &#x27;&lt;svg viewBox=&quot;0 0 &#x27; + w + &#x27; &#x27; + h + &#x27;&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;rect x=&quot;&#x27; + (w/2-4) + &#x27;&quot; y=&quot;6&quot; width=&quot;8&quot; height=&quot;&#x27; + (h-6) + &#x27;&quot; rx=&quot;3&quot; fill=&quot;#2e8b57&quot;/&gt;&#x27; +
          &#x27;&lt;rect x=&quot;2&quot; y=&quot;14&quot; width=&quot;8&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;#2e8b57&quot;/&gt;&#x27; +
          &#x27;&lt;rect x=&quot;&#x27; + (w-10) + &#x27;&quot; y=&quot;10&quot; width=&quot;8&quot; height=&quot;18&quot; rx=&quot;3&quot; fill=&quot;#2e8b57&quot;/&gt;&lt;/svg&gt;&#x27;;
      }
    },
    { name: &#x27;drone&#x27;,  w: 40, h: 24, flying: true, floatY: 46,
      shape: function (w, h) {
        return &#x27;&lt;svg viewBox=&quot;0 0 &#x27; + w + &#x27; &#x27; + h + &#x27;&quot; width=&quot;&#x27; + w + &#x27;&quot; height=&quot;&#x27; + h + &#x27;&quot;&gt;&#x27; +
          &#x27;&lt;ellipse cx=&quot;&#x27; + (w/2) + &#x27;&quot; cy=&quot;&#x27; + (h/2) + &#x27;&quot; rx=&quot;&#x27; + (w/2-2) + &#x27;&quot; ry=&quot;&#x27; + (h/2-4) + &#x27;&quot; fill=&quot;#2980b9&quot; stroke=&quot;#1c5980&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
          &#x27;&lt;rect x=&quot;2&quot; y=&quot;1&quot; width=&quot;10&quot; height=&quot;4&quot; rx=&quot;2&quot; fill=&quot;#7f8c8d&quot;/&gt;&#x27; +
          &#x27;&lt;rect x=&quot;&#x27; + (w-12) + &#x27;&quot; y=&quot;1&quot; width=&quot;10&quot; height=&quot;4&quot; rx=&quot;2&quot; fill=&quot;#7f8c8d&quot;/&gt;&lt;/svg&gt;&#x27;;
      }
    }
  ];

  function makeObstacle(type) {
    var t = TYPES[type];
    var bottom = t.flying ? (GROUND_H + t.floatY) : GROUND_H;
    var o = { x: FIELD_W, w: t.w, h: t.h, bottom: bottom, scored: false, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;obstacle&#x27;;
    el.style.left = o.x + &#x27;px&#x27;;
    el.style.bottom = bottom + &#x27;px&#x27;;
    el.style.width = t.w + &#x27;px&#x27;;
    el.style.height = t.h + &#x27;px&#x27;;
    el.innerHTML = t.shape(t.w, t.h);
    field.appendChild(el);
    o.el = el;
    obstacles.push(o);
    return o;
  }

  function spawnRandom() {
    var type = Math.floor(Math.random() * TYPES.length);
    makeObstacle(type);
  }

  function scheduleNextSpawn() {
    var delay = 1200 + Math.random() * 1600;
    spawnId = setTimeout(function () {
      if (!running) return;
      spawnRandom();
      scheduleNextSpawn();
    }, delay);
  }

  function jump() {
    if (!running || gameOver) return;
    if (heroY &gt;= FIELD_H - GROUND_H - HERO_SIZE - 1) heroVY = JUMP_V;
  }

  function tick() {
    if (!running) return;
    moveBackground();
    heroVY += GRAVITY;
    heroY += heroVY;
    var floorY = FIELD_H - GROUND_H - HERO_SIZE;
    if (heroY &gt; floorY) { heroY = floorY; heroVY = 0; }
    if (heroY &lt; 0) { heroY = 0; heroVY = 0; }
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;

    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= OBSTACLE_SPEED;
      o.el.style.left = o.x + &#x27;px&#x27;;
      if (o.x + o.w &lt; 0) {
        field.removeChild(o.el);
        obstacles.splice(i, 1);
        continue;
      }
      if (!o.scored &amp;&amp; o.x + o.w &lt; heroX) {
        o.scored = true;
        score += 1;
        scoreEl.textContent = score;
      }
      var obsTop = FIELD_H - o.bottom - o.h;
      var obsBottom = FIELD_H - o.bottom;
      var heroTop = heroY;
      var heroBottom = heroY + HERO_SIZE;
      if (heroX + HERO_SIZE &gt; o.x &amp;&amp; heroX &lt; o.x + o.w &amp;&amp;
          heroBottom &gt; obsTop &amp;&amp; heroTop &lt; obsBottom) {
        gameOver = true;
        stopGame();
        return;
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function clearObstacles() {
    obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    obstacles = [];
  }

  function placeInitialObstacle() {
    clearObstacles();
    var o = makeObstacle(0);
    o.x = FIELD_W - o.w - 8;
    o.el.style.left = o.x + &#x27;px&#x27;;
  }

  function startGame() {
    if (running) return;
    score = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    heroX = 60;
    heroY = FIELD_H - GROUND_H - HERO_SIZE;
    heroVY = 0;
    gameOver = false;
    hero.style.left = heroX + &#x27;px&#x27;;
    hero.style.top = heroY + &#x27;px&#x27;;
    buildBackground();
    clearObstacles();
    spawnRandom();
    running = true;
    animId = requestAnimationFrame(tick);
    scheduleNextSpawn();
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearTimeout(spawnId); spawnId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
      jump();
      e.preventDefault();
    }
  });
  field.addEventListener(&#x27;click&#x27;, function () { jump(); });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  hero.style.left = heroX + &#x27;px&#x27;;
  hero.style.top = heroY + &#x27;px&#x27;;
  buildBackground();
  placeInitialObstacle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
