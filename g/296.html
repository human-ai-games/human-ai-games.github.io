<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Cascade</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Gem Cascade</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: radial-gradient(circle at 50% 0%, #2a1a4a, #0d0620); color: #fff; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff5ec7,#7b5cff,#39e0ff,#ffd24d);
       -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
       text-shadow: 0 0 18px rgba(123,92,255,0.4); }
  .instructions { font-size: 16px; color: #cdbff0; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 22px; font-size: 20px; align-items: baseline; }
  .hud .val { font-weight: 800; color: #ffd24d; }
  .hud .time { color: #39e0ff; }
  .hud .time.low { color: #ff5e5e; }
  .combo { color: #39e0ff; font-weight: 800; min-height: 22px; font-size: 18px; }
  .field { position: relative; border-radius: 10px; overflow: hidden;
           background: rgba(255,255,255,0.04);
           box-shadow: 0 0 30px rgba(123,92,255,0.35), inset 0 0 20px rgba(0,0,0,0.5);
           border: 2px solid rgba(123,92,255,0.4); }
  canvas { display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Gem Cascade&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the falling pair of gems with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, swap their order with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and drop fast with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Pop 3+ same-colored gems and chain bursts for combos — score big before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div&gt;Best: &lt;span class=&quot;val&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div&gt;Time: &lt;span class=&quot;val time&quot; id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&amp;nbsp;&lt;/div&gt;
  &lt;div class=&quot;field&quot;&gt;&lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var COLS = 7, ROWS = 13, CELL = 40;
  var W = COLS * CELL, H = ROWS * CELL;
  var cv = document.getElementById(&#x27;cv&#x27;);
  cv.width = W; cv.height = H;
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);

  var COLORS = [
    { core:&#x27;#ff5ec7&#x27;, glow:&#x27;#ff9ee0&#x27; },
    { core:&#x27;#39e0ff&#x27;, glow:&#x27;#a8f3ff&#x27; },
    { core:&#x27;#ffd24d&#x27;, glow:&#x27;#fff0b0&#x27; },
    { core:&#x27;#7bff6b&#x27;, glow:&#x27;#c8ffbf&#x27; },
    { core:&#x27;#b06bff&#x27;, glow:&#x27;#dcc0ff&#x27; }
  ];

  var grid = [];
  var piece = null;
  var running = false, animId = null;
  var score = 0, best = 0, dropAcc = 0, DROP_MS = 520;
  var lastT = 0;
  var particles = [];
  var busy = false;
  var comboText = &#x27;&#x27;;
  var TIME_LIMIT = 60;
  var timeLeft = TIME_LIMIT, timeAcc = 0;

  // ---- audio ----
  var actx = null;
  function ensureCtx(){ try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
  function beep(freq, dur, type, vol) {
    try {
      ensureCtx();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(vol||0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      o.start(t); o.stop(t+dur);
    } catch(_){}
  }
  // bubble pop: quick pitch-rising sine blip with a soft attack
  function bubblePop(pitch) {
    try {
      ensureCtx();
      var t = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;sine&#x27;;
      o.frequency.setValueAtTime(pitch*0.6, t);
      o.frequency.exponentialRampToValueAtTime(pitch*1.6, t+0.05);
      o.frequency.exponentialRampToValueAtTime(pitch*0.9, t+0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+0.15);
    } catch(_){}
  }

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(-1); grid.push(row); }
  }
  function rnd(){ return Math.floor(Math.random()*COLORS.length); }

  function spawnPiece() {
    piece = { c: Math.floor(COLS/2), r: 0, a: rnd(), b: rnd() };
    if (grid[0][piece.c] !== -1 || grid[1][piece.c] !== -1) return false;
    return true;
  }
  function pieceCells(p) {
    return [ {c:p.c, r:p.r, col:p.a}, {c:p.c, r:p.r+1, col:p.b} ];
  }
  function canPlace(c, r) {
    if (c&lt;0||c&gt;=COLS) return false;
    if (r+1&gt;=ROWS) return false;
    if (grid[r][c]!==-1) return false;
    if (grid[r+1][c]!==-1) return false;
    return true;
  }
  function move(dc) {
    if (!running || busy || !piece) return;
    if (canPlace(piece.c+dc, piece.r)) { piece.c += dc; draw(); }
  }
  function swap() {
    if (!running || busy || !piece) return;
    var t = piece.a; piece.a = piece.b; piece.b = t; beep(600,0.06,&#x27;square&#x27;,0.08); draw();
  }
  function softDrop() {
    if (!running || busy || !piece) return;
    stepDown(true);
  }
  function lockPiece() {
    grid[piece.r][piece.c] = piece.a;
    grid[piece.r+1][piece.c] = piece.b;
    piece = null;
  }
  function applyGravity() {
    var moved = false;
    for (var c=0;c&lt;COLS;c++){
      var write = ROWS-1;
      for (var r=ROWS-1;r&gt;=0;r--){
        if (grid[r][c]!==-1){
          if (r!==write){ grid[write][c]=grid[r][c]; grid[r][c]=-1; moved=true; }
          write--;
        }
      }
    }
    return moved;
  }
  function findGroups() {
    var seen = [];
    for (var r=0;r&lt;ROWS;r++){ seen.push([]); for(var c=0;c&lt;COLS;c++) seen[r].push(false); }
    var groups = [];
    for (var r2=0;r2&lt;ROWS;r2++){
      for (var c2=0;c2&lt;COLS;c2++){
        if (grid[r2][c2]===-1 || seen[r2][c2]) continue;
        var col = grid[r2][c2];
        var stack = [[r2,c2]]; seen[r2][c2]=true; var cells=[];
        while(stack.length){
          var cur = stack.pop(); cells.push(cur);
          var nb = [[cur[0]+1,cur[1]],[cur[0]-1,cur[1]],[cur[0],cur[1]+1],[cur[0],cur[1]-1]];
          for (var i=0;i&lt;nb.length;i++){
            var rr=nb[i][0], cc=nb[i][1];
            if(rr&lt;0||rr&gt;=ROWS||cc&lt;0||cc&gt;=COLS) continue;
            if(seen[rr][cc]) continue;
            if(grid[rr][cc]===col){ seen[rr][cc]=true; stack.push([rr,cc]); }
          }
        }
        if (cells.length&gt;=3) groups.push(cells);
      }
    }
    return groups;
  }
  function burst(cells, col) {
    for (var i=0;i&lt;cells.length;i++){
      var r=cells[i][0], c=cells[i][1];
      spawnParticles(c*CELL+CELL/2, r*CELL+CELL/2, COLORS[col].glow);
      grid[r][c] = -1;
    }
  }
  function spawnParticles(x,y,color){
    for (var i=0;i&lt;8;i++){
      var ang = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
      particles.push({ x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-1,
        life:1, color:color, size:2+Math.random()*3 });
    }
  }
  function resolveCascade(chain) {
    if (!running) return;
    var groups = findGroups();
    if (groups.length === 0) {
      busy = false;
      comboText = &#x27;&#x27;;
      if (piece===null){ if(!spawnPiece()){ endGame(&#x27;Board full!&#x27;); } }
      draw();
      return;
    }
    busy = true;
    var totalBurst = 0;
    for (var g=0; g&lt;groups.length; g++){
      var cells = groups[g];
      var col = grid[cells[0][0]][cells[0][1]];
      totalBurst += cells.length;
      burst(cells, col);
    }
    var gained = totalBurst * 10 * chain;
    score += gained;
    scoreEl.textContent = score;
    if (score &gt; best){ best = score; bestEl.textContent = best; }
    comboText = (chain&gt;1 ? &#x27;CHAIN x&#x27;+chain+&#x27;!  &#x27; : &#x27;&#x27;) + &#x27;+&#x27; + gained;
    comboEl.textContent = comboText;
    // rising-pitch bubble pop, higher for bigger chains
    bubblePop(360 + chain*160);
    draw();
    setTimeout(function(){
      if (!running) return;
      applyGravity();
      draw();
      setTimeout(function(){ resolveCascade(chain+1); }, 130);
    }, 180);
  }
  function stepDown(soft) {
    if (busy || !piece) return;
    if (canPlace(piece.c, piece.r+1)) {
      piece.r++;
      if (soft){ score += 1; scoreEl.textContent = score; }
      draw();
    } else {
      lockPiece();
      applyGravity();
      resolveCascade(1);
    }
  }

  function drawGem(cx, cy, colIdx, scale) {
    scale = scale||1;
    var col = COLORS[colIdx];
    var rad = (CELL/2 - 3) * scale;
    var grad = ctx.createRadialGradient(cx-rad*0.3, cy-rad*0.3, rad*0.1, cx, cy, rad);
    grad.addColorStop(0, col.glow);
    grad.addColorStop(1, col.core);
    ctx.save();
    ctx.shadowColor = col.core; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(cx-rad*0.32, cy-rad*0.32, rad*0.28, 0, Math.PI*2);
    ctx.fillStyle = &#x27;rgba(255,255,255,0.6)&#x27;; ctx.fill();
    ctx.restore();
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.04)&#x27;;
    ctx.lineWidth = 1;
    for (var c=0;c&lt;=COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,H); ctx.stroke(); }
    for (var r=0;r&lt;=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(W,r*CELL); ctx.stroke(); }
    for (var r2=0;r2&lt;ROWS;r2++){
      for (var c2=0;c2&lt;COLS;c2++){
        if (grid[r2][c2]!==-1) drawGem(c2*CELL+CELL/2, r2*CELL+CELL/2, grid[r2][c2]);
      }
    }
    if (piece){
      var cells = pieceCells(piece);
      for (var i=0;i&lt;cells.length;i++){
        drawGem(cells[i].c*CELL+CELL/2, cells[i].r*CELL+CELL/2, cells[i].col);
      }
    }
    for (var p=0;p&lt;particles.length;p++){
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function animate(t) {
    if (!running) return;
    if (!lastT) lastT = t;
    var dt = t - lastT; lastT = t;
    // timer
    timeAcc += dt;
    if (timeAcc &gt;= 1000){
      var elapsed = Math.floor(timeAcc/1000);
      timeAcc -= elapsed*1000;
      timeLeft -= elapsed;
      if (timeLeft &lt;= 0){ timeLeft = 0; updateTime(); endGame(&#x27;Time up!&#x27;); return; }
      updateTime();
    }
    for (var i=particles.length-1;i&gt;=0;i--){
      var pt=particles[i];
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life-=0.03;
      if (pt.life&lt;=0) particles.splice(i,1);
    }
    if (!busy &amp;&amp; piece){
      dropAcc += dt;
      if (dropAcc &gt;= DROP_MS){ dropAcc = 0; stepDown(false); }
    }
    draw();
    animId = requestAnimationFrame(animate);
  }
  function updateTime(){
    timeEl.textContent = timeLeft;
    if (timeLeft &lt;= 10) timeEl.classList.add(&#x27;low&#x27;);
    else timeEl.classList.remove(&#x27;low&#x27;);
  }
  function endGame(reason) {
    running = false;
    if (animId) cancelAnimationFrame(animId);
    comboEl.textContent = (reason||&#x27;Game Over&#x27;) + &#x27;  Final: &#x27; + score;
    beep(160,0.4,&#x27;sawtooth&#x27;,0.15);
  }
  function startGame() {
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    particles = []; busy = false; comboText=&#x27;&#x27;; comboEl.innerHTML=&#x27;&amp;nbsp;&#x27;;
    dropAcc = 0; lastT = 0; timeAcc = 0; timeLeft = TIME_LIMIT;
    updateTime();
    newGrid();
    if (!spawnPiece()) return;
    running = true;
    ensureCtx();
    draw();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(animate);
  }
  function stopGame() {
    running = false;
    if (animId) cancelAnimationFrame(animId);
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ softDrop(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ swap(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid();
  piece = { c: Math.floor(COLS/2), r: 0, a: 0, b: 1 };
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
