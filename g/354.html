<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Crossing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html">&larr; All games</a> &middot; <b>Cat Crossing</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; overflow-y: auto; }
  .game { max-width: 720px; margin: 0 auto; padding: 18px; background: white; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .instructions { font-size: 16px; color: #666; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 22px; color: #555; margin: 0; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; margin: 0; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.45); }
  .lane { position: absolute; left: 0; right: 0; box-sizing: border-box; }
  .safe { position: absolute; left: 0; right: 0; }
  .car { position: absolute; }
  .cat { position: absolute; z-index: 5; transition: left 0.09s ease, top 0.09s ease; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.4)); }
  .puff { position: absolute; z-index: 4; pointer-events: none; color: #fff; opacity: 0.85; animation: puffanim 0.6s ease-out forwards; }
  @keyframes puffanim { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(1.6) translateY(6px); opacity: 0; } }
  .spark { position: absolute; z-index: 6; pointer-events: none; font-size: 20px; animation: sparkanim 0.8s ease-out forwards; }
  @keyframes sparkanim { 0% { transform: translate(0,0) scale(0.5); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; } }
  .bonus { position: absolute; z-index: 7; pointer-events: none; font-weight: bold; color: #fff; text-shadow: 0 0 6px #000; font-size: 20px; animation: bonusanim 0.9s ease-out forwards; }
  @keyframes bonusanim { 0% { transform: translateY(0) scale(0.7); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-30px) scale(1.2); opacity: 0; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cat Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to guide your cat one step at a time across the highway, dodging the cars. Each forward step scores a point and reaching the grass earns a bonus — getting hit ends the round.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;
  var LANES = 7;
  var ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO_SIZE = CELL - 6;
  var OBSTACLE_W = CELL * 2 - 8, OBSTACLE_H = CELL - 14;
  var running = false, animId = null, gameOver = false;
  var hero = { col: Math.floor(COLS / 2), row: ROWS - 1 };
  var lanes = [];
  var score = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  // realistic car color sets: {body, dark shade, highlight}
  var CAR_PALETTE = [
    { b: &#x27;#d0342c&#x27;, d: &#x27;#8f1f19&#x27;, h: &#x27;#ff6b60&#x27; },
    { b: &#x27;#e0b90a&#x27;, d: &#x27;#a17f00&#x27;, h: &#x27;#ffe57a&#x27; },
    { b: &#x27;#2d78c4&#x27;, d: &#x27;#184a80&#x27;, h: &#x27;#7bb6ec&#x27; },
    { b: &#x27;#d1741a&#x27;, d: &#x27;#93490a&#x27;, h: &#x27;#ffb066&#x27; },
    { b: &#x27;#7d4fb0&#x27;, d: &#x27;#4f2f75&#x27;, h: &#x27;#b98fe0&#x27; },
    { b: &#x27;#159c86&#x27;, d: &#x27;#0b5d50&#x27;, h: &#x27;#5fd8c2&#x27; },
    { b: &#x27;#e56aa0&#x27;, d: &#x27;#a53c6c&#x27;, h: &#x27;#ffa9cf&#x27; }
  ];

  function carSVG(pal, dir) {
    var flip = dir &lt; 0 ? &#x27;transform:scaleX(-1);transform-origin:center;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg width=&quot;&#x27; + OBSTACLE_W + &#x27;&quot; height=&quot;&#x27; + OBSTACLE_H + &#x27;&quot; viewBox=&quot;0 0 88 34&quot; style=&quot;&#x27; + flip + &#x27;display:block;&quot;&gt;&#x27; +
      &#x27;&lt;defs&gt;&#x27; +
        &#x27;&lt;linearGradient id=&quot;cg&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;&#x27; +
          &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;&#x27; + pal.h + &#x27;&quot;/&gt;&#x27; +
          &#x27;&lt;stop offset=&quot;45%&quot; stop-color=&quot;&#x27; + pal.b + &#x27;&quot;/&gt;&#x27; +
          &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;&#x27; + pal.d + &#x27;&quot;/&gt;&#x27; +
        &#x27;&lt;/linearGradient&gt;&#x27; +
        &#x27;&lt;linearGradient id=&quot;glass&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;&#x27; +
          &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#dff2ff&quot;/&gt;&#x27; +
          &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#8fb8d6&quot;/&gt;&#x27; +
        &#x27;&lt;/linearGradient&gt;&#x27; +
      &#x27;&lt;/defs&gt;&#x27; +
      // shadow under car
      &#x27;&lt;ellipse cx=&quot;44&quot; cy=&quot;31&quot; rx=&quot;42&quot; ry=&quot;4&quot; fill=&quot;#000&quot; opacity=&quot;0.28&quot;/&gt;&#x27; +
      // cabin/roof
      &#x27;&lt;path d=&quot;M24 11 L34 3 L58 3 L68 11 Z&quot; fill=&quot;&#x27; + pal.d + &#x27;&quot;/&gt;&#x27; +
      // body
      &#x27;&lt;rect x=&quot;2&quot; y=&quot;9&quot; width=&quot;84&quot; height=&quot;19&quot; rx=&quot;7&quot; fill=&quot;url(#cg)&quot;/&gt;&#x27; +
      // top highlight strip
      &#x27;&lt;rect x=&quot;8&quot; y=&quot;11&quot; width=&quot;72&quot; height=&quot;3&quot; rx=&quot;1.5&quot; fill=&quot;#fff&quot; opacity=&quot;0.35&quot;/&gt;&#x27; +
      // windshield
      &#x27;&lt;path d=&quot;M26 10 L34 4 L45 4 L45 10 Z&quot; fill=&quot;url(#glass)&quot;/&gt;&#x27; +
      // side windows
      &#x27;&lt;path d=&quot;M47 4 L57 4 L66 10 L47 10 Z&quot; fill=&quot;url(#glass)&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;45&quot; y=&quot;4&quot; width=&quot;2&quot; height=&quot;6&quot; fill=&quot;&#x27; + pal.d + &#x27;&quot;/&gt;&#x27; +
      // door line
      &#x27;&lt;line x1=&quot;44&quot; y1=&quot;14&quot; x2=&quot;44&quot; y2=&quot;26&quot; stroke=&quot;&#x27; + pal.d + &#x27;&quot; stroke-width=&quot;1&quot; opacity=&quot;0.6&quot;/&gt;&#x27; +
      // wheels
      &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;29&quot; r=&quot;6.5&quot; fill=&quot;#1a1a1a&quot;/&gt;&lt;circle cx=&quot;24&quot; cy=&quot;29&quot; r=&quot;2.6&quot; fill=&quot;#9aa&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;64&quot; cy=&quot;29&quot; r=&quot;6.5&quot; fill=&quot;#1a1a1a&quot;/&gt;&lt;circle cx=&quot;64&quot; cy=&quot;29&quot; r=&quot;2.6&quot; fill=&quot;#9aa&quot;/&gt;&#x27; +
      // headlight &amp; taillight
      &#x27;&lt;ellipse cx=&quot;84&quot; cy=&quot;14&quot; rx=&quot;2.4&quot; ry=&quot;2.8&quot; fill=&quot;#fff6c4&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;84&quot; cy=&quot;22&quot; rx=&quot;2.4&quot; ry=&quot;2.8&quot; fill=&quot;#fff6c4&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;3&quot; y=&quot;13&quot; width=&quot;3.5&quot; height=&quot;5&quot; rx=&quot;1.5&quot; fill=&quot;#ff5a4d&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function catSVG() {
    return &#x27;&lt;svg width=&quot;&#x27; + HERO_SIZE + &#x27;&quot; height=&quot;&#x27; + HERO_SIZE + &#x27;&quot; viewBox=&quot;0 0 48 48&quot; style=&quot;display:block;&quot;&gt;&#x27; +
      &#x27;&lt;defs&gt;&#x27; +
      &#x27;&lt;radialGradient id=&quot;bodyg&quot; cx=&quot;40%&quot; cy=&quot;35%&quot; r=&quot;70%&quot;&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;0%&quot; stop-color=&quot;#ffcf6b&quot;/&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;70%&quot; stop-color=&quot;#f39c12&quot;/&gt;&#x27; +
      &#x27;&lt;stop offset=&quot;100%&quot; stop-color=&quot;#d3800a&quot;/&gt;&#x27; +
      &#x27;&lt;/radialGradient&gt;&#x27; +
      &#x27;&lt;/defs&gt;&#x27; +
      &#x27;&lt;path d=&quot;M32 40 Q44 40 43 30 Q42 24 37 27&quot; stroke=&quot;#e08e0b&quot; stroke-width=&quot;5&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;14&quot; cy=&quot;38&quot; rx=&quot;4.5&quot; ry=&quot;6&quot; fill=&quot;#e08e0b&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;34&quot; cy=&quot;38&quot; rx=&quot;4.5&quot; ry=&quot;6&quot; fill=&quot;#e08e0b&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;13&quot; cy=&quot;22&quot; rx=&quot;4&quot; ry=&quot;5.5&quot; fill=&quot;#eea015&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;35&quot; cy=&quot;22&quot; rx=&quot;4&quot; ry=&quot;5.5&quot; fill=&quot;#eea015&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;24&quot; cy=&quot;30&quot; rx=&quot;13&quot; ry=&quot;15&quot; fill=&quot;url(#bodyg)&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M18 28 Q24 26 30 28&quot; stroke=&quot;#d3800a&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; opacity=&quot;0.6&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M17 34 Q24 32 31 34&quot; stroke=&quot;#d3800a&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; opacity=&quot;0.6&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M13 12 L10 3 L19 9 Z&quot; fill=&quot;#f39c12&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M35 12 L38 3 L29 9 Z&quot; fill=&quot;#f39c12&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M14 11 L12 6 L18 9 Z&quot; fill=&quot;#ffb6c1&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M34 11 L36 6 L30 9 Z&quot; fill=&quot;#ffb6c1&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;16&quot; r=&quot;11&quot; fill=&quot;url(#bodyg)&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;19&quot; cy=&quot;15&quot; r=&quot;2.6&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;29&quot; cy=&quot;15&quot; r=&quot;2.6&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;19&quot; cy=&quot;15&quot; r=&quot;1.4&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;29&quot; cy=&quot;15&quot; r=&quot;1.4&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M24 18 L22 20.5 L26 20.5 Z&quot; fill=&quot;#ffb6c1&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M24 20.5 Q21 22.5 18 21.5&quot; stroke=&quot;#8a5a00&quot; stroke-width=&quot;1&quot; fill=&quot;none&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M24 20.5 Q27 22.5 30 21.5&quot; stroke=&quot;#8a5a00&quot; stroke-width=&quot;1&quot; fill=&quot;none&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;7&quot; y1=&quot;16&quot; x2=&quot;16&quot; y2=&quot;17&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;7&quot; y1=&quot;19&quot; x2=&quot;16&quot; y2=&quot;19&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;41&quot; y1=&quot;16&quot; x2=&quot;32&quot; y2=&quot;17&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;41&quot; y1=&quot;19&quot; x2=&quot;32&quot; y2=&quot;19&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  function grassBg() {
    // green gradient plus scattered blade streaks
    return &quot;linear-gradient(180deg, #7ec850 0%, #63b23f 55%, #559a34 100%), &quot; +
      &quot;repeating-linear-gradient(88deg, rgba(40,110,30,0.25) 0 2px, transparent 2px 7px)&quot;;
  }

  function buildField() {
    field.innerHTML = &#x27;&#x27;;
    // road base as field background
    field.style.background =
      &quot;linear-gradient(180deg, #4a4a52 0%, #3a3a42 50%, #303038 100%)&quot;;
    // grass safe rows
    [0, ROWS - 1].forEach(function (r) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;safe&#x27;;
      s.style.top = (r * CELL) + &#x27;px&#x27;;
      s.style.height = CELL + &#x27;px&#x27;;
      s.style.background = grassBg();
      s.style.backgroundBlendMode = &#x27;multiply&#x27;;
      // little curb shadow between grass and road
      if (r === 0) s.style.boxShadow = &#x27;inset 0 -4px 6px rgba(0,0,0,0.25)&#x27;;
      else s.style.boxShadow = &#x27;inset 0 4px 6px rgba(0,0,0,0.25)&#x27;;
      field.appendChild(s);
    });
    // solid edge lines at road boundaries
    [1, LANES + 1].forEach(function (r) {
      var edge = document.createElement(&#x27;div&#x27;);
      edge.className = &#x27;lane&#x27;;
      edge.style.top = (r * CELL - 2) + &#x27;px&#x27;;
      edge.style.height = &#x27;3px&#x27;;
      edge.style.background = &#x27;#f2f2f2&#x27;;
      edge.style.opacity = &#x27;0.85&#x27;;
      field.appendChild(edge);
    });
    // dashed lane markings between road lanes
    for (var r = 2; r &lt;= LANES; r++) {
      var d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;lane&#x27;;
      d.style.top = (r * CELL - 2) + &#x27;px&#x27;;
      d.style.height = &#x27;4px&#x27;;
      d.style.background = &#x27;repeating-linear-gradient(to right, #f7e14a 0 26px, transparent 26px 50px)&#x27;;
      d.style.opacity = &#x27;0.9&#x27;;
      d.style.boxShadow = &#x27;0 0 3px rgba(247,225,74,0.5)&#x27;;
      field.appendChild(d);
    }
  }

  function buildLanes() {
    lanes.forEach(function (lane) {
      lane.obstacles.forEach(function (o) { if (o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    lanes = [];
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - OBSTACLE_H) / 2;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.7 + (i % 3) * 0.35;
      var obstacles = [];
      var count = 2 + (i % 2);
      var gap = FIELD_W / count;
      var pal = CAR_PALETTE[i % CAR_PALETTE.length];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 30) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;car&#x27;;
        el.style.width = OBSTACLE_W + &#x27;px&#x27;;
        el.style.height = OBSTACLE_H + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.innerHTML = carSVG(pal, dir);
        field.appendChild(el);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, obstacles: obstacles });
    }
  }

  function makeHero() {
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;cat&#x27;;
    heroEl.style.width = HERO_SIZE + &#x27;px&#x27;;
    heroEl.style.height = HERO_SIZE + &#x27;px&#x27;;
    heroEl.innerHTML = catSVG();
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO_SIZE) / 2;
    var y = hero.row * CELL + (CELL - HERO_SIZE) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function puffAt(col, row) {
    var puff = document.createElement(&#x27;div&#x27;);
    puff.className = &#x27;puff&#x27;;
    puff.textContent = &#x27;🐾&#x27;;
    puff.style.fontSize = &#x27;20px&#x27;;
    puff.style.left = (col * CELL + CELL / 2 - 12) + &#x27;px&#x27;;
    puff.style.top = (row * CELL + CELL - 10) + &#x27;px&#x27;;
    field.appendChild(puff);
    setTimeout(function () { if (puff.parentNode) puff.parentNode.removeChild(puff); }, 600);
  }

  function floatText(text, col, row, cls) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = cls;
    el.textContent = text;
    el.style.left = (col * CELL + CELL / 2 - 16) + &#x27;px&#x27;;
    el.style.top = (row * CELL) + &#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  }

  function sparkBurst(col, row) {
    var chars = [&#x27;✨&#x27;, &#x27;⭐&#x27;, &#x27;💫&#x27;, &#x27;✨&#x27;, &#x27;⭐&#x27;];
    var cx = col * CELL + CELL / 2;
    var cy = row * CELL + CELL / 2;
    for (var i = 0; i &lt; 8; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;spark&#x27;;
      s.textContent = chars[i % chars.length];
      s.style.left = (cx - 10) + &#x27;px&#x27;;
      s.style.top = (cy - 10) + &#x27;px&#x27;;
      var ang = (Math.PI * 2 * i) / 8;
      s.style.setProperty(&#x27;--dx&#x27;, (Math.cos(ang) * 40) + &#x27;px&#x27;);
      s.style.setProperty(&#x27;--dy&#x27;, (Math.sin(ang) * 40) + &#x27;px&#x27;);
      field.appendChild(s);
      (function (node) { setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 800); })(s);
    }
  }

  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;;
      o.frequency.value = freq;
      g.gain.value = 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -OBSTACLE_W;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + OBSTACLE_W &lt; 0) o.x = FIELD_W;
