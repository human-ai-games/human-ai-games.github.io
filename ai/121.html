<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#3af,#a3f,#f36); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 14px rgba(120,140,255,.4); }
  .instructions { font-size: 16px; color: #9aa6d8; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #ffe27a; margin: 0; text-shadow: 0 0 12px rgba(255,210,90,.6); }
  .score.pop { animation: pop .28s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.5)} 100%{transform:scale(1)} }
  .legend { font-size: 14px; color: #8892c0; display: flex; gap: 14px; margin: 0; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #070a18; box-shadow: 0 0 30px rgba(80,110,255,.25); }
  .over { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
          font-size:26px; font-weight:800; color:#ff6b8a; text-shadow:0 0 14px rgba(255,80,120,.6);
          background:rgba(5,8,20,.55); border-radius:10px; }
  .over span { font-size:16px; color:#cfd6ff; margin-top:6px; font-weight:500; }
  .pad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(2,44px); gap:6px; margin-top:2px; }
  .pad button { border:none; border-radius:8px; font-size:22px; color:#dfe6ff; cursor:pointer;
                background:#141a34; box-shadow:0 0 10px rgba(80,110,255,.2); transition:background .1s; }
  .pad button:active { background:#26305c; }
  .pad .up{grid-column:2;grid-row:1} .pad .left{grid-column:1;grid-row:2}
  .pad .down{grid-column:2;grid-row:2} .pad .right{grid-column:3;grid-row:2}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake to grab ⭐ stars and 💎 gems while dodging the drifting 💀 skull and your own tail. Use arrow keys or the buttons below — edges wrap around, so no walls to fear.&lt;/p&gt;
  &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
  &lt;p class=&quot;legend&quot;&gt;&lt;span&gt;⭐ +1&lt;/span&gt;&lt;span&gt;💎 +3 speed&lt;/span&gt;&lt;span&gt;💀 avoid!&lt;/span&gt;&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;GAME OVER&lt;span id=&quot;finalMsg&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pad&quot;&gt;
    &lt;button class=&quot;up&quot; data-d=&quot;up&quot;&gt;▲&lt;/button&gt;
    &lt;button class=&quot;left&quot; data-d=&quot;left&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;down&quot; data-d=&quot;down&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;right&quot; data-d=&quot;right&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 30, ROWS = 22;
  var W = COLS*CELL, H = ROWS*CELL;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;), finalMsg = document.getElementById(&#x27;finalMsg&#x27;);

  var BASE_MS = 130, FAST_MS = 70;
  var running=false, gameOver=false;
  var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0}, score=0;
  var boostUntil=0;
  var items=[];        // collectibles {type,x,y}
  var skull=null;      // {x,y,fx,fy, vx,vy}
  var particles=[];    // {x,y,vx,vy,life,max,color}
  var trail=[];        // {x,y,life,hue}
  var lastStep=0, pulse=0, rafId=null, prevT=0;

  function rand(n){return Math.floor(Math.random()*n);}

  function occupied(x,y){
    for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    for(var j=0;j&lt;items.length;j++) if(items[j].x===x&amp;&amp;items[j].y===y) return true;
    if(skull &amp;&amp; skull.x===x &amp;&amp; skull.y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){var x=rand(COLS),y=rand(ROWS); if(!occupied(x,y)) return {x:x,y:y};}
    return {x:rand(COLS),y:rand(ROWS)};
  }
  function spawnItem(){
    var r=Math.random(), type = r&lt;0.6?&#x27;star&#x27;:&#x27;gem&#x27;;
    var c=freeCell(); items.push({type:type,x:c.x,y:c.y});
  }
  function spawnSkull(){
    var c=freeCell();
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]]; var d=dirs[rand(4)];
    skull={x:c.x,y:c.y,fx:c.x,fy:c.y,vx:d[0],vy:d[1]};
  }

  function headHue(){
    var len=snake.length;
    var t=Math.min(1,(len-3)/25); // 0 cool -&gt; 1 fiery
    return 210 - t*210; // 210(blue) -&gt; 0(red)
  }

  function burst(cx,cy,color){
    var px=cx*CELL+CELL/2, py=cy*CELL+CELL/2;
    for(var i=0;i&lt;16;i++){
      var a=Math.random()*Math.PI*2, sp=1+Math.random()*3.5;
      particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,max:1,color:color});
    }
  }

  function reset(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    boostUntil=0; items=[]; particles=[]; trail=[];
    spawnItem(); spawnItem(); spawnSkull();
    gameOver=false; overEl.style.display=&#x27;none&#x27;;
  }

  function currentMs(){ return performance.now()&lt;boostUntil ? FAST_MS : BASE_MS; }

  function step(){
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=(head.x+dir.x+COLS)%COLS, ny=(head.y+dir.y+ROWS)%ROWS;

    // self collision
    var eating=false, eatIdx=-1;
    for(var k=0;k&lt;items.length;k++) if(items[k].x===nx&amp;&amp;items[k].y===ny){eating=true;eatIdx=k;break;}
    var body = eating ? snake : snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ return end(); }
    // skull collision
    if(skull &amp;&amp; skull.x===nx &amp;&amp; skull.y===ny){ return end(); }

    // add trail for old head
    trail.push({x:head.x,y:head.y,life:1,hue:headHue()});

    snake.unshift({x:nx,y:ny});
    if(eating){
      var it=items[eatIdx];
      if(it.type===&#x27;star&#x27;){ score+=1; burst(nx,ny,[255,220,90]); }
      else { score+=3; boostUntil=performance.now()+2000; burst(nx,ny,[190,110,255]); }
      items.splice(eatIdx,1);
      scoreEl.textContent=score;
      scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
      spawnItem();
    } else {
      snake.pop();
    }
  }

  function moveSkull(){
    if(!skull) return;
    // occasionally turn
    if(Math.random()&lt;0.12){
      var dirs=[[1,0],[-1,0],[0,1],[0,-1]]; var d=dirs[rand(4)];
      skull.vx=d[0]; skull.vy=d[1];
    }
    skull.x=(skull.x+skull.vx+COLS)%COLS;
    skull.y=(skull.y+skull.vy+ROWS)%ROWS;
    // if skull steps onto head, kill
    if(snake[0] &amp;&amp; skull.x===snake[0].x &amp;&amp; skull.y===snake[0].y) end();
  }

  var skullAccum=0, SKULL_MS=220;

  function loop(t){
    if(!running){ return; }
    if(!prevT) prevT=t;
    var dt=t-prevT; prevT=t;
    pulse+=dt;

    if(!gameOver){
      lastStep+=dt;
      var ms=currentMs();
      if(lastStep&gt;=ms){ lastStep=0; step(); }
      skullAccum+=dt;
      if(skullAccum&gt;=SKULL_MS){ skullAccum=0; if(!gameOver) moveSkull(); }
    }

    // update particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life-=dt/600;
      if(p.life&lt;=0) particles.splice(i,1);
    }
    // update trail
    for(var j=trail.length-1;j&gt;=0;j--){ trail[j].life-=dt/500; if(trail[j].life&lt;=0) trail.splice(j,1); }

    draw();
    rafId=requestAnimationFrame(loop);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // grid pulse synced to speed
    var speedFactor = BASE_MS/currentMs(); // &gt;1 when fast
    var glow = 0.10 + 0.06*Math.abs(Math.sin(pulse/ (currentMs()*1.6) ));
    ctx.strokeStyle=&#x27;rgba(90,120,255,&#x27;+glow.toFixed(3)+&#x27;)&#x27;;
    ctx.lineWidth=1;
    for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL+.5,0); ctx.lineTo(x*CELL+.5,H); ctx.stroke(); }
    for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL+.5); ctx.lineTo(W,y*CELL+.5); ctx.stroke(); }

    // trail
    for(var t=0;t&lt;trail.length;t++){
      var tr=trail[t];
      ctx.fillStyle=&#x27;hsla(&#x27;+tr.hue+&#x27;,90%,60%,&#x27;+(tr.life*0.35)+&#x27;)&#x27;;
      ctx.fillRect(tr.x*CELL+3,tr.y*CELL+3,CELL-6,CELL-6);
    }

    // items
    for(var k=0;k&lt;items.length;k++){
      var it=items[k];
      drawEmoji(it.type===&#x27;star&#x27;?&#x27;⭐&#x27;:&#x27;💎&#x27;, it.x, it.y);
    }
    // skull
    if(skull){
      var pulseS = 1+0.12*Math.sin(pulse/120);
      ctx.save();
      ctx.globalAlpha=1;
      drawEmoji(&#x27;💀&#x27;, skull.x, skull.y, pulseS);
      ctx.restore();
    }

    // snake
    var hue=headHue();
    for(var i=snake.length-1;i&gt;=0;i--){
      var s=snake[i];
      var isHead=(i===0);
      var h=hue - (i/snake.length)*40;
      var px=s.x*CELL, py=s.y*CELL;
      ctx.shadowColor=&#x27;hsl(&#x27;+h+&#x27;,95%,60%)&#x27;;
      ctx.shadowBlur=isHead?18:10;
      ctx.fillStyle=&#x27;hsl(&#x27;+h+&#x27;,90%,&#x27;+(isHead?62:52)+&#x27;%)&#x27;;
      roundRect(px+2,py+2,CELL-4,CELL-4,5); ctx.fill();
    }
    ctx.shadowBlur=0;
    // eyes on head
    if(snake.length){
      var hd=snake[0];
      ctx.fillStyle=&#x27;#fff&#x27;;
      var ex=hd.x*CELL, ey=hd.y*CELL;
      var eo=5;
      ctx.beginPath(); ctx.arc(ex+CELL/2-eo+dir.x*3, ey+CELL/2-eo+dir.y*3,2.2,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+CELL/2+eo+dir.x*3, ey+CELL/2-eo+dir.y*3,2.2,0,7); ctx.fill();
    }

    // particles
    for(var p2=0;p2&lt;particles.length;p2++){
      var pp=particles[p2];
      ctx.fillStyle=&#x27;rgba(&#x27;+pp.color[0]+&#x27;,&#x27;+pp.color[1]+&#x27;,&#x27;+pp.color[2]+&#x27;,&#x27;+Math.max(0,pp.life)+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(pp.x,pp.y,3*pp.life+1,0,7); ctx.fill();
    }
  }

  function drawEmoji(ch,x,y,scale){
    scale=scale||1;
    ctx.save();
    ctx.font=Math.round(CELL*scale)+&#x27;px serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(ch, x*CELL+CELL/2, y*CELL+CELL/2+1);
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function end(){
    gameOver=true; running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    finalMsg.textContent=&#x27;Score &#x27;+score+&#x27; — press Start to play again&#x27;;
    overEl.style.display=&#x27;flex&#x27;;
    draw();
  }

  function startGame(){
    reset();
    running=true; prevT=0; lastStep=0; skullAccum=0;
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }

  function setDir(d){
    if(d===&#x27;left&#x27;) pendingDir={x:-1,y:0};
    else if(d===&#x27;right&#x27;) pendingDir={x:1,y:0};
    else if(d===&#x27;up&#x27;) pendingDir={x:0,y:-1};
    else if(d===&#x27;down&#x27;) pendingDir={x:0,y:1};
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){setDir(&#x27;left&#x27;);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){setDir(&#x27;right&#x27;);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){setDir(&#x27;up&#x27;);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){setDir(&#x27;down&#x27;);e.preventDefault();}
  });
  Array.prototype.forEach.call(document.querySelectorAll(&#x27;.pad button&#x27;), function(b){
    b.addEventListener(&#x27;click&#x27;, function(){ setDir(b.getAttribute(&#x27;data-d&#x27;)); });
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  reset(); draw(); overEl.style.display=&#x27;none&#x27;; gameOver=false;
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
