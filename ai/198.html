<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff9d00,#ff4bd8,#00e5ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
       text-shadow: 0 0 18px rgba(255,75,216,.3); }
  .instructions { font-size: 16px; color: #a9b4d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: baseline; font-size: 18px; color: #9fe; }
  .hud b { font-size: 28px; color: #fff; text-shadow: 0 0 12px #00e5ff; }
  .combo { color: #ff9d00; text-shadow: 0 0 10px #ff9d00; }
  #cv { border-radius: 10px; box-shadow: 0 0 40px rgba(120,0,255,.35); background: #05030f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALACTIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with your mouse or the &amp;larr; &amp;rarr; keys to bounce the ball and shatter bricks. Catch falling capsules for power-ups and chain breaks for combo bonuses — press Start below to play!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;SCORE &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;COMBO &lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;WAVE &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 620, H = 470;
var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), waveEl = document.getElementById(&#x27;wave&#x27;);

var running = false, animId = null;
var keys = {};
var mouseX = null;

// audio
var actx = null;
function beep(freq, dur, type, vol){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.06;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.08));
    o.stop(actx.currentTime + (dur||0.08));
  }catch(_){}
}

// game state
var PADDLE_W_BASE = 96, PADDLE_H = 14, PADDLE_Y = H - 28;
var paddleX, paddleW, paddleExpireT;
var balls = [];
var bricks = [];
var particles = [];
var caps = [];
var score, displayScore, combo, comboTimer, wave, laserT;
var stars = [];

function initStars(){
  stars = [];
  for(var i=0;i&lt;70;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, z:Math.random()*0.8+0.2, r:Math.random()*1.6+0.4});
  }
}

var BRICK_COLS = 10, BRICK_W = 56, BRICK_H = 20, BRICK_GAPX = 4, BRICK_GAPY = 6, BRICK_TOP = 40, BRICK_LEFT = 6;

function makeWave(){
  bricks = [];
  var rows = Math.min(4 + wave, 8);
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;BRICK_COLS;c++){
      if(wave&gt;1 &amp;&amp; Math.random()&lt;0.10) continue; // occasional gaps in denser waves
      var pts, color, hp=1;
      if(r===0){ pts=5; color=&#x27;#ffd23f&#x27;; }
      else if(r===1){ pts=3; color=&#x27;#c9d6ff&#x27;; }
      else { pts=1; color=[&#x27;#ff4bd8&#x27;,&#x27;#00e5ff&#x27;,&#x27;#7cff5a&#x27;,&#x27;#ff7a00&#x27;][ (r+c)%4 ]; }
      var power = (Math.random()&lt;0.06);
      if(power){ color=&#x27;#ffe066&#x27;; pts=5; }
      bricks.push({
        x: BRICK_LEFT + c*(BRICK_W+BRICK_GAPX),
        y: BRICK_TOP + r*(BRICK_H+BRICK_GAPY),
        w: BRICK_W, h: BRICK_H, pts: pts, color: color, hp: hp, power: power, flash: 0
      });
    }
  }
}

function spawnBall(x,y,vx,vy){
  balls.push({x:x,y:y,vx:vx,vy:vy,trail:[],speed:Math.hypot(vx,vy)});
}

function resetGame(){
  score = 0; displayScore = 0; combo = 1; comboTimer = 0; wave = 1; laserT = 0;
  paddleW = PADDLE_W_BASE; paddleExpireT = 0;
  paddleX = (W - paddleW)/2;
  particles = []; caps = [];
  balls = [];
  var sp = 4.2;
  spawnBall(W/2, PADDLE_Y-30, (Math.random()&lt;0.5?-1:1)*sp*0.7, -sp);
  makeWave();
  initStars();
  updateHud();
}

function updateHud(){
  scoreEl.textContent = Math.round(displayScore);
  comboEl.textContent = &#x27;x&#x27;+combo;
  waveEl.textContent = wave;
}

function addParticles(x,y,color,n){
  for(var i=0;i&lt;(n||10);i++){
    var a = Math.random()*Math.PI*2, s = Math.random()*3+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

function dropCapsule(x,y){
  var types = [&#x27;expand&#x27;,&#x27;multi&#x27;,&#x27;laser&#x27;];
  var t = types[Math.floor(Math.random()*types.length)];
  caps.push({x:x,y:y,vy:2.2,type:t});
}

function applyPower(t){
  if(t===&#x27;expand&#x27;){ paddleW = 150; paddleExpireT = 60*8; beep(660,0.15,&#x27;sawtooth&#x27;,0.08); }
  else if(t===&#x27;multi&#x27;){
    beep(880,0.15,&#x27;square&#x27;,0.08);
    var cur = balls.slice();
    for(var i=0;i&lt;cur.length;i++){
      var b = cur[i];
      spawnBall(b.x,b.y,-b.vy*0.6+b.vx*0.4, b.vy);
    }
  }
  else if(t===&#x27;laser&#x27;){ laserT = 60*6; beep(1200,0.2,&#x27;sawtooth&#x27;,0.08); }
}

function tick(){
  if(!running) return;

  // input
  var pspeed = 8;
  if(keys[&#x27;ArrowLeft&#x27;]) paddleX -= pspeed;
  if(keys[&#x27;ArrowRight&#x27;]) paddleX += pspeed;
  if(mouseX !== null){ paddleX = mouseX - paddleW/2; }
  paddleX = Math.max(0, Math.min(W-paddleW, paddleX));

  if(paddleExpireT&gt;0){ paddleExpireT--; if(paddleExpireT===0) paddleW = PADDLE_W_BASE; }
  if(laserT&gt;0) laserT--;

  if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0){ combo=1; } }

  // stars drift
  for(var i=0;i&lt;stars.length;i++){
    var st = stars[i];
    st.y += st.z*0.4;
    if(st.y&gt;H){ st.y=0; st.x=Math.random()*W; }
  }

  // balls
  for(var bi=balls.length-1; bi&gt;=0; bi--){
    var b = balls[bi];
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length&gt;14) b.trail.shift();
    b.x += b.vx; b.y += b.vy;

    if(b.x&lt;8){ b.x=8; b.vx=Math.abs(b.vx); }
    if(b.x&gt;W-8){ b.x=W-8; b.vx=-Math.abs(b.vx); }
    if(b.y&lt;8){ b.y=8; b.vy=Math.abs(b.vy); }

    // paddle collision
    if(b.vy&gt;0 &amp;&amp; b.y+7&gt;=PADDLE_Y &amp;&amp; b.y-7&lt;=PADDLE_Y+PADDLE_H &amp;&amp; b.x&gt;=paddleX &amp;&amp; b.x&lt;=paddleX+paddleW){
      var hit = (b.x-(paddleX+paddleW/2))/(paddleW/2);
      var sp = Math.hypot(b.vx,b.vy)*1.03; // speed up
      sp = Math.min(sp, 9);
      var ang = hit*1.0;
      b.vx = sp*Math.sin(ang);
      b.vy = -Math.abs(sp*Math.cos(ang));
      b.y = PADDLE_Y-7;
      combo = 1; comboTimer = 0;
      beep(320,0.06,&#x27;square&#x27;,0.05);
    }

    // brick collision
    for(var k=bricks.length-1;k&gt;=0;k--){
      var br = bricks[k];
      if(b.x&gt;br.x-7 &amp;&amp; b.x&lt;br.x+br.w+7 &amp;&amp; b.y&gt;br.y-7 &amp;&amp; b.y&lt;br.y+br.h+7){
        // score with combo
        var gained = br.pts * combo;
        score += gained;
        addParticles(b.x,b.y,br.color,12);
        if(br.power) dropCapsule(br.x+br.w/2, br.y+br.h/2);
        bricks.splice(k,1);
        combo = Math.min(combo+1, 9);
        comboTimer = 90;
        beep(500+combo*40,0.05,&#x27;square&#x27;,0.05);
        if(laserT&lt;=0){
          // bounce
          var overX = Math.min(Math.abs(b.x-br.x), Math.abs(b.x-(br.x+br.w)));
          var overY = Math.min(Math.abs(b.y-br.y), Math.abs(b.y-(br.y+br.h)));
          if(overY&lt;overX) b.vy=-b.vy; else b.vx=-b.vx;
          break;
        }
        // laser mode passes through
      }
    }

    // ball fell
    if(b.y&gt;H+20){
      balls.splice(bi,1);
    }
  }

  // if all balls lost, respawn one (keeps action for full minute)
  if(balls.length===0){
    combo=1;
    var sp = 4.2;
    spawnBall(W/2, PADDLE_Y-30, (Math.random()&lt;0.5?-1:1)*sp*0.7, -sp);
    laserT=0;
    beep(160,0.2,&#x27;sine&#x27;,0.06);
  }

  // capsules
  for(var ci=caps.length-1;ci&gt;=0;ci--){
    var cp = caps[ci];
    cp.y += cp.vy;
    if(cp.y&gt;=PADDLE_Y-6 &amp;&amp; cp.y&lt;=PADDLE_Y+PADDLE_H+6 &amp;&amp; cp.x&gt;=paddleX &amp;&amp; cp.x&lt;=paddleX+paddleW){
      applyPower(cp.type);
      caps.splice(ci,1);
      continue;
    }
    if(cp.y&gt;H+20) caps.splice(ci,1);
  }

  // particles
  for(var pi=particles.length-1;pi&gt;=0;pi--){
    var p = particles[pi];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
    if(p.life&lt;=0) particles.splice(pi,1);
  }

  // new wave
  if(bricks.length===0){
    wave++;
    makeWave();
    beep(700,0.25,&#x27;triangle&#x27;,0.07);
  }

  // animate score counter
  if(displayScore&lt;score){ displayScore += Math.max(1,(score-displayScore)*0.2); if(displayScore&gt;score) displayScore=score; }
  updateHud();

  render();
  animId = requestAnimationFrame(tick);
}

function render(){
  ctx.clearRect(0,0,W,H);
  // bg gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#0a0520&#x27;); g.addColorStop(1,&#x27;#05030f&#x27;);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // stars
  for(var i=0;i&lt;stars.length;i++){
    var st=stars[i];
    ctx.globalAlpha = 0.3+st.z*0.6;
    ctx.fillStyle = st.z&gt;0.6?&#x27;#bff&#x27;:&#x27;#88f&#x27;;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // bricks
  for(var k=0;k&lt;bricks.length;k++){
    var br=bricks[k];
    ctx.shadowBlur = br.power?18:8;
    ctx.shadowColor = br.color;
    ctx.fillStyle = br.color;
    roundRect(br.x,br.y,br.w,br.h,4); ctx.fill();
    if(br.power){
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;rgba(255,255,255,.85)&#x27;;
      ctx.font=&#x27;bold 12px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;★&#x27;, br.x+br.w/2, br.y+br.h/2+4);
    }
  }
  ctx.shadowBlur=0;

  // capsules
  for(var ci=0;ci&lt;caps.length;ci++){
    var cp=caps[ci];
    var col = cp.type===&#x27;expand&#x27;?&#x27;#7cff5a&#x27;:(cp.type===&#x27;multi&#x27;?&#x27;#00e5ff&#x27;:&#x27;#ff9d00&#x27;);
    ctx.shadowBlur=14; ctx.shadowColor=col; ctx.fillStyle=col;
    roundRect(cp.x-13,cp.y-8,26,16,6); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle=&#x27;#05030f&#x27;; ctx.font=&#x27;bold 11px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(cp.type===&#x27;expand&#x27;?&#x27;W&#x27;:(cp.type===&#x27;multi&#x27;?&#x27;x2&#x27;:&#x27;L&#x27;), cp.x, cp.y+4);
  }

  // particles
  for(var pi=0;pi&lt;particles.length;pi++){
    var p=particles[pi];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
  }
  ctx.globalAlpha=1;

  // balls with trail
  for(var bi=0;bi&lt;balls.length;bi++){
    var b=balls[bi];
    for(var t=0;t&lt;b.trail.length;t++){
      var tp=b.trail[t];
      ctx.globalAlpha = (t/b.trail.length)*0.5;
      ctx.fillStyle = laserT&gt;0?&#x27;#ff9d00&#x27;:&#x27;#00e5ff&#x27;;
      ctx.beginPath(); ctx.arc(tp.x,tp.y,6*(t/b.trail.length),0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.shadowBlur=16; ctx.shadowColor=laserT&gt;0?&#x27;#ff9d00&#x27;:&#x27;#00e5ff&#x27;;
    ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(b.x,b.y,6,0,7); ctx.fill();
    ctx.shadowBlur=0;
  }

  // paddle
  ctx.shadowBlur=18; ctx.shadowColor=laserT&gt;0?&#x27;#ff9d00&#x27;:&#x27;#ff4bd8&#x27;;
  var pg = ctx.createLinearGradient(paddleX,0,paddleX+paddleW,0);
  pg.addColorStop(0,&#x27;#ff4bd8&#x27;); pg.addColorStop(0.5,&#x27;#00e5ff&#x27;); pg.addColorStop(1,&#x27;#ff4bd8&#x27;);
  ctx.fillStyle=pg;
  roundRect(paddleX,PADDLE_Y,paddleW,PADDLE_H,7); ctx.fill();
  ctx.shadowBlur=0;

  if(laserT&gt;0){
    ctx.fillStyle=&#x27;rgba(255,157,0,.6)&#x27;;
    ctx.font=&#x27;bold 14px sans-serif&#x27;; ctx.textAlign=&#x27;left&#x27;;
    ctx.fillText(&#x27;LASER MODE&#x27;, 10, 24);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function startGame(){
  if(running) return;
  for(var k in keys) keys[k]=false;
  resetGame();
  running = true;
  animId = requestAnimationFrame(tick);
}
function stopGame(){
  if(!running) return;
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; mouseX=null; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX-rect.left)*(W/rect.width);
});
cv.addEventListener(&#x27;touchmove&#x27;,function(e){
  var rect = cv.getBoundingClientRect();
  var t=e.touches[0];
  mouseX = (t.clientX-rect.left)*(W/rect.width);
  e.preventDefault();
},{passive:false});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static render
resetGame();
render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
