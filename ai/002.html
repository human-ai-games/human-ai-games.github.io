<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

  .header a { color: #1f6feb; }

    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#4df,#a6f,#f6a); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,120,255,.4); }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: baseline; font-size: 20px; }
  .hud b { color: #6cf; font-size: 24px; }
  #mult { color: #fb5; font-weight: 800; }
  #canvas { display: block; border-radius: 10px; box-shadow: 0 0 30px rgba(90,90,255,.25); background: #0a0322; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Jump over tall alien spikes with Space / Up / click, and duck under low gates with Down / S. Clear obstacles in a streak to build a COMBO multiplier — use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt; &lt;span id=&quot;mult&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;canvas&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;canvas&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 620, H = 440, GROUND = H - 50;
var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;);

var running = false, animId = null, spawnTimer = 0, spawnDelay = 95;
var score = 0, combo = 0, mult = 1, gameOver = false;
var speed = 4, shake = 0, comboFlash = 0, tickCount = 0;

var hero, obstacles, stars, particles, trail;

function reset() {
  hero = { x: 90, y: GROUND, w: 38, h: 34, vy: 0, ducking: false, onGround: true };
  obstacles = [];
  particles = [];
  trail = [];
  stars = [];
  for (var i = 0; i &lt; 90; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, z: 0.3 + Math.random()*1.4, s: 0.6 + Math.random()*1.8 });
  }
  score = 0; combo = 0; mult = 1; speed = 4; spawnTimer = 0; spawnDelay = 95;
  shake = 0; comboFlash = 0; gameOver = false; tickCount = 0;
  scoreEl.textContent = &#x27;0&#x27;; multEl.textContent = &#x27;x1&#x27;;
}

// color palette shift based on score (cool -&gt; fiery)
function danger() { return Math.min(1, score / 900); }
function lerp(a,b,t){ return a+(b-a)*t; }
function bgTop() { var d=danger(); return &#x27;rgb(&#x27;+Math.round(lerp(20,60,d))+&#x27;,&#x27;+Math.round(lerp(5,8,d))+&#x27;,&#x27;+Math.round(lerp(50,20,d))+&#x27;)&#x27;; }
function bgBot() { var d=danger(); return &#x27;rgb(&#x27;+Math.round(lerp(10,90,d))+&#x27;,&#x27;+Math.round(lerp(4,15,d))+&#x27;,&#x27;+Math.round(lerp(35,10,d))+&#x27;)&#x27;; }
function neon() { var d=danger(); return &#x27;rgb(&#x27;+Math.round(lerp(90,255,d))+&#x27;,&#x27;+Math.round(lerp(200,120,d))+&#x27;,&#x27;+Math.round(lerp(255,60,d))+&#x27;)&#x27;; }

function spawn() {
  // type: &#x27;spike&#x27; (jump over, tall on ground) or &#x27;gate&#x27; (duck under, hangs from top)
  var type = Math.random() &lt; 0.5 ? &#x27;spike&#x27; : &#x27;gate&#x27;;
  if (type === &#x27;spike&#x27;) {
    var h = 46 + Math.random()*28;
    obstacles.push({ type:&#x27;spike&#x27;, x: W+30, w: 34, h: h, phase: Math.random()*6, scored:false, hue: 120+Math.random()*80 });
  } else {
    // gate: gap near the ground, blocker hangs down; must duck
    var gapBottom = GROUND; // player ducks under
    var barH = 70 + Math.random()*20;
    obstacles.push({ type:&#x27;gate&#x27;, x: W+30, w: 40, h: barH, top: 0, phase: Math.random()*6, scored:false, hue: 190+Math.random()*80 });
  }
}

function jump() {
  if (!running || gameOver) return;
  if (hero.onGround) { hero.vy = -13; hero.onGround = false; }
}
function duckStart() { if (running &amp;&amp; !gameOver) hero.ducking = true; }
function duckEnd() { hero.ducking = false; }

function addBurst(x,y) {
  for (var i=0;i&lt;34;i++){
    var a = Math.random()*Math.PI*2, sp = 1.5+Math.random()*6;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, hue: Math.random()*360 });
  }
}

function update() {
  tickCount++;
  // hero physics
  hero.vy += 0.7;
  hero.y += hero.vy;
  var curH = hero.ducking &amp;&amp; hero.onGround ? 18 : 34;
  hero.h = curH;
  if (hero.y &gt;= GROUND) { hero.y = GROUND; hero.vy = 0; hero.onGround = true; }
  else hero.onGround = false;

  // trail
  trail.push({ x: hero.x-4, y: hero.y - hero.h/2, life: 1 });
  if (trail.length &gt; 14 + speed*2) trail.shift();
  for (var i=0;i&lt;trail.length;i++) trail[i].life -= 0.06;

  // stars
  for (var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    s.x -= speed * s.z * 1.3;
    if (s.x &lt; 0) { s.x = W; s.y = Math.random()*H; }
  }

  // spawn
  spawnTimer++;
  if (spawnTimer &gt;= spawnDelay) { spawn(); spawnTimer = 0; spawnDelay = Math.max(52, 95 - speed*3 + Math.random()*20); }

  // obstacles
  var hx1 = hero.x - hero.w/2, hx2 = hero.x + hero.w/2;
  var hy1 = hero.y - hero.h, hy2 = hero.y;
  for (var i=obstacles.length-1;i&gt;=0;i--){
    var o = obstacles[i];
    o.x -= speed;
    o.phase += 0.15;
    var oy1, oy2, ox1 = o.x, ox2 = o.x + o.w;
    if (o.type===&#x27;spike&#x27;){ oy2 = GROUND; oy1 = GROUND - o.h; }
    else { oy1 = 0; oy2 = o.h; }
    // collision
    if (hx2 &gt; ox1 &amp;&amp; hx1 &lt; ox2 &amp;&amp; hy2 &gt; oy1 &amp;&amp; hy1 &lt; oy2) {
      triggerGameOver();
      return;
    }
    if (!o.scored &amp;&amp; ox2 &lt; hx1) {
      o.scored = true;
      combo++;
      if (combo &gt; 0 &amp;&amp; combo % 3 === 0) { mult = Math.min(mult+1, 8); comboFlash = 40; }
      score += 10 * mult;
      scoreEl.textContent = score;
      multEl.textContent = &#x27;x&#x27;+mult;
      speed = 4 + score/220;
    }
    if (ox2 &lt; -10) obstacles.splice(i,1);
  }

  // particles
  for (var i=particles.length-1;i&gt;=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.02;
    if (p.life &lt;= 0) particles.splice(i,1);
  }

  if (comboFlash&gt;0) comboFlash--;
  if (shake&gt;0) shake *= 0.9;
}

function triggerGameOver() {
  gameOver = true;
  addBurst(hero.x, hero.y - hero.h/2);
  shake = 18;
  running = false;
  if (spawnTimer) spawnTimer = 0;
  // let render show explosion via a short cont loop
  var frames = 60;
  (function boom(){
    for (var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.02;
      if(p.life&lt;=0) particles.splice(i,1);
    }
    if (shake&gt;0) shake*=0.9;
    render();
    drawGameOver();
    frames--;
    if (frames&gt;0) requestAnimationFrame(boom);
  })();
}

function drawHeroCat(x, y, h) {
  var n = neon();
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = n; ctx.shadowBlur = 20;
  // body
  ctx.fillStyle = &#x27;#ffe&#x27;;
  ctx.strokeStyle = n; ctx.lineWidth = 2.5;
  var bw = 34, bh = h;
  roundRect(-bw/2, -bh, bw, bh, 8);
  ctx.fill(); ctx.stroke();
  // ears
  ctx.beginPath();
  ctx.moveTo(-bw/2+4, -bh); ctx.lineTo(-bw/2+2, -bh-10); ctx.lineTo(-bw/2+13, -bh);
  ctx.moveTo(bw/2-4, -bh); ctx.lineTo(bw/2-2, -bh-10); ctx.lineTo(bw/2-13, -bh);
  ctx.fillStyle = n; ctx.fill();
  // helmet glass
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.fillStyle = &#x27;rgba(120,220,255,0.5)&#x27;;
  ctx.arc(0, -bh+11, 11, 0, Math.PI*2); ctx.fill();
  // eyes
  ctx.shadowBlur = 0;
  ctx.fillStyle = &#x27;#123&#x27;;
  ctx.beginPath(); ctx.arc(-4, -bh+11, 2.2, 0, Math.PI*2); ctx.arc(4, -bh+11, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawAlien(o) {
  var wob = Math.sin(o.phase)*4;
  ctx.save();
  ctx.shadowBlur = 16;
  if (o.type===&#x27;spike&#x27;) {
    var x = o.x, y = GROUND, hh = o.h;
    ctx.translate(x + o.w/2 + wob, y);
    ctx.shadowColor = &#x27;hsl(&#x27;+o.hue+&#x27;,90%,60%)&#x27;;
    ctx.fillStyle = &#x27;hsl(&#x27;+o.hue+&#x27;,85%,55%)&#x27;;
    ctx.beginPath();
    ctx.moveTo(-o.w/2, 0); ctx.lineTo(0, -hh); ctx.lineTo(o.w/2, 0); ctx.closePath();
    ctx.fill();
    // eye
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(0, -hh*0.5, 5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#000&#x27;; ctx.beginPath(); ctx.arc(0+Math.sin(o.phase)*1.5, -hh*0.5, 2.4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.translate(o.x + o.w/2 + wob, 0);
    ctx.shadowColor = &#x27;hsl(&#x27;+o.hue+&#x27;,90%,60%)&#x27;;
    ctx.fillStyle = &#x27;hsl(&#x27;+o.hue+&#x27;,85%,55%)&#x27;;
    roundRect(-o.w/2, 0, o.w, o.h, 10);
    ctx.fill();
    // dangly eyes
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(-8, o.h, 6,0,Math.PI*2); ctx.arc(8, o.h, 6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#000&#x27;; ctx.beginPath(); ctx.arc(-8, o.h+2, 3,0,Math.PI*2); ctx.arc(8, o.h+2, 3,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function render() {
  ctx.save();
  var sx = (Math.random()-0.5)*shake, sy = (Math.random()-0.5)*shake;
  ctx.translate(sx, sy);

  // background gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, bgTop()); g.addColorStop(1, bgBot());
  ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);

  // stars (streak with speed)
  for (var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    var len = speed * s.z * 1.6;
    ctx.strokeStyle = &#x27;rgba(255,255,255,&#x27;+(0.3+s.z*0.4)+&#x27;)&#x27;;
    ctx.lineWidth = s.s*0.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x+len, s.y); ctx.stroke();
  }

  // ground glow line
  var n = neon();
  ctx.strokeStyle = n; ctx.lineWidth = 3; ctx.shadowColor = n; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
  ctx.shadowBlur = 0;

  // trail
  for (var i=0;i&lt;trail.length;i++){
    var t = trail[i];
    if (t.life&lt;=0) continue;
    ctx.fillStyle = &#x27;rgba(&#x27;+(120+i*8)+&#x27;,200,255,&#x27;+(t.life*0.4)+&#x27;)&#x27;;
    var r = 4 + i*0.6;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI*2); ctx.fill();
  }

  // obstacles
  for (var i=0;i&lt;obstacles.length;i++) drawAlien(obstacles[i]);

  // hero
  if (!gameOver) drawHeroCat(hero.x, hero.y, hero.h);

  // particles
  for (var i=0;i&lt;particles.length;i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = &#x27;hsl(&#x27;+p.hue+&#x27;,90%,60%)&#x27;;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // combo flash
  if (comboFlash&gt;0){
    ctx.globalAlpha = comboFlash/40;
    ctx.fillStyle = &#x27;#fd4&#x27;;
    ctx.font = &#x27;800 44px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = &#x27;#fa0&#x27;; ctx.shadowBlur = 24;
    ctx.fillText(&#x27;COMBO! x&#x27;+mult, W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = &#x27;rgba(0,0,0,0.45)&#x27;;
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = &#x27;center&#x27;;
  ctx.fillStyle = &#x27;#f45&#x27;;
  ctx.font = &#x27;800 56px system-ui&#x27;;
  ctx.shadowColor = &#x27;#f00&#x27;; ctx.shadowBlur = 30;
  ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 6);
  ctx.shadowBlur = 0;
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.font = &#x27;600 26px system-ui&#x27;;
  ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 40);
  ctx.restore();
}

function loop() {
  if (!running) return;
  update();
  if (!running) return; // may have ended in update
  render();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  reset();
  running = true;
  spawn(); // immediate obstacle for responsiveness
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27; || e.key === &#x27;ArrowUp&#x27; || e.key === &#x27;w&#x27; || e.key === &#x27;W&#x27;) { jump(); e.preventDefault(); }
  else if (e.key === &#x27;ArrowDown&#x27; || e.key === &#x27;s&#x27; || e.key === &#x27;S&#x27;) { duckStart(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if (e.key === &#x27;ArrowDown&#x27; || e.key === &#x27;s&#x27; || e.key === &#x27;S&#x27;) { duckEnd(); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ jump(); });

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static frame (stopped state)
reset();
render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
