<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐸 Frog Dash: Rush Hour</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash: Rush Hour</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a12; color: #e8e8f0; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #7fff7f; text-shadow: 0 0 10px rgba(127,255,127,0.6); letter-spacing: 0.5px; }
  .instructions { font-size: 16px; color: #aab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .scorebar { display: flex; gap: 26px; font-size: 20px; font-weight: 600; }
  .scorebar .best { color: #ffd54a; }
  .scorebar .cur { color: #7fff7f; }
  canvas { border-radius: 10px; box-shadow: 0 0 24px rgba(0,0,0,0.7); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash: Rush Hour&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys (or swipe on the road) to hop your frog from the grass up to the glowing lily pad without getting hit. Every third crossing flashes gold for double points, and traffic speeds up as your score climbs!&lt;/p&gt;
  &lt;div class=&quot;scorebar&quot;&gt;&lt;span class=&quot;cur&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;464&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var CELL = 62;
  var COLS = 10;                 // 620 / 62
  var LANES = 5;                 // road lanes
  var ROWS = LANES + 2;          // top lily pad row, 5 lanes, bottom grass row  -&gt; 7 rows * 62 = 434... adjust
  // Recompute so rows fit height nicely
  // H=464, ROWS=7 -&gt; CELL row height = 464/7 ~= 66.28. Use separate row height.
  var RH = H / ROWS;

  var running = false, animId = null;
  var score = 0, best = 0;
  var crossings = 0;             // successful crossings, for bonus streak
  var bonus = false;
  var lanes = [];
  var frog = { col: Math.floor(COLS/2), row: ROWS-1, x:0, y:0, sx:1, sy:1, state:&#x27;idle&#x27;, t:0 };
  var ripples = [];
  var streetlightPhase = 0;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);

  var VEHICLES = [
    { name:&#x27;taxi&#x27;,  body:&#x27;#ffcc00&#x27;, roof:&#x27;#e6a800&#x27;, w:1.7 },
    { name:&#x27;car&#x27;,   body:&#x27;#ff3b3b&#x27;, roof:&#x27;#c22&#x27;, w:1.6 },
    { name:&#x27;truck&#x27;, body:&#x27;#3b7bff&#x27;, roof:&#x27;#2a5ac2&#x27;, w:2.4 },
    { name:&#x27;moto&#x27;,  body:&#x27;#b060ff&#x27;, roof:&#x27;#8030d0&#x27;, w:0.9 }
  ];

  // ---------- Audio ----------
  var actx = null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
  function boing(){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(260,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(620,a.currentTime+0.09);
    o.frequency.exponentialRampToValueAtTime(300,a.currentTime+0.18);
    g.gain.setValueAtTime(0.18,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.22);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.24);
  }
  function chime(){
    var a=ac(); if(!a) return;
    [523,659,784,1046].forEach(function(f,i){
      var o=a.createOscillator(), g=a.createGain(); o.type=&#x27;triangle&#x27;;
      var t=a.currentTime+i*0.07; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+0.36);
    });
  }
  function splat(){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(320,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(60,a.currentTime+0.4);
    g.gain.setValueAtTime(0.22,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.45);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.46);
  }

  // ---------- Setup ----------
  function buildLanes() {
    lanes = [];
    for (var i=0;i&lt;LANES;i++){
      var laneRow = i+1;
      var dir = (i%2===0)?1:-1;
      var baseSpeed = 1.0 + i*0.25;
      var obstacles = [];
      var vt = VEHICLES[i % VEHICLES.length];
      var vw = vt.w * CELL;
      var count = (vt.name===&#x27;truck&#x27;)?2:3;
      var gap = W / count;
      for (var j=0;j&lt;count;j++){
        obstacles.push({ x: j*gap + (i*40)%gap, type: vt, vw: vw });
      }
      lanes.push({ row:laneRow, dir:dir, speed:baseSpeed, obstacles:obstacles, vt:vt });
    }
  }

  function speedMul(){ return 1 + Math.min(score,40)*0.045; }

  function resetFrog(){
    frog.col = Math.floor(COLS/2); frog.row = ROWS-1;
    frog.sx=1; frog.sy=1; frog.state=&#x27;idle&#x27;; frog.t=0;
    placeFrog();
  }
  function placeFrog(){
    frog.x = frog.col*CELL + CELL/2;
    frog.y = frog.row*RH + RH/2;
  }

  function startGame(){
    if(running) return;
    score=0; crossings=0; bonus=false; scoreEl.textContent=&#x27;0&#x27;;
    ripples=[];
    buildLanes();
    resetFrog();
    running=true;
    lastT = performance.now();
    animId = requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  // ---------- Movement ----------
  function hop(dc,dr){
    if(!running || frog.state===&#x27;splat&#x27; || frog.state===&#x27;spin&#x27;) return;
    var nc = Math.max(0, Math.min(COLS-1, frog.col+dc));
    var nr = Math.max(0, Math.min(ROWS-1, frog.row+dr));
    if(nc===frog.col &amp;&amp; nr===frog.row) return;
    frog.col=nc; frog.row=nr;
    placeFrog();
    boing();
    frog.state=&#x27;hop&#x27;; frog.t=0;
    if(frog.row===0){ win(); }
  }

  function win(){
    crossings++;
    var pts = bonus ? 2 : 1;
    score += pts;
    scoreEl.textContent = score;
    if(score&gt;best){ best=score; bestEl.textContent=best; }
    bonus = (crossings % 3 === 0);   // next crossing after every 3rd is bonus
    chime();
    ripples.push({ x:frog.x, y:frog.y, r:6, a:1 });
    frog.state=&#x27;win&#x27;; frog.t=0;
    setTimeout(function(){ if(running) resetFrog(); }, 350);
  }

  function die(){
    if(frog.state===&#x27;splat&#x27;||frog.state===&#x27;spin&#x27;) return;
    splat();
    frog.state=&#x27;spin&#x27;; frog.t=0;
  }

  // ---------- Loop ----------
  var lastT=0;
  function loop(now){
    if(!running) return;
    var dt = Math.min(40, now-lastT)/16.67; lastT=now;
    streetlightPhase += dt*0.05;

    // move vehicles
    var mul = speedMul();
    for(var i=0;i&lt;lanes.length;i++){
      var ln=lanes[i];
      for(var j=0;j&lt;ln.obstacles.length;j++){
        var o=ln.obstacles[j];
        o.x += ln.dir*ln.speed*mul*dt;
        if(ln.dir&gt;0 &amp;&amp; o.x &gt; W) o.x = -o.vw;
        else if(ln.dir&lt;0 &amp;&amp; o.x + o.vw &lt; 0) o.x = W;
      }
    }

    // frog animation timers
    frog.t += dt;
    if(frog.state===&#x27;hop&#x27;){
      var p = Math.min(1, frog.t/6);
      frog.sy = 1 + 0.35*Math.sin(p*Math.PI);
      frog.sx = 1 - 0.2*Math.sin(p*Math.PI);
      if(p&gt;=1){ frog.state=&#x27;idle&#x27;; frog.sx=1; frog.sy=1; }
    } else if(frog.state===&#x27;win&#x27;){
      var pw=Math.min(1,frog.t/18);
      frog.sy=1+0.5*Math.sin(pw*Math.PI);
    } else if(frog.state===&#x27;spin&#x27;){
      if(frog.t&gt;26){
        frog.state=&#x27;over&#x27;;
        setTimeout(function(){ if(running){ resetFrog(); } }, 250);
        frog.state=&#x27;idle&#x27;;
      }
    }

    // collision (only while alive and on a road lane)
    if(frog.state!==&#x27;spin&#x27; &amp;&amp; frog.state!==&#x27;win&#x27;){
      var laneIdx = frog.row-1;
      if(laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES){
        var ln2=lanes[laneIdx];
        var fh = CELL*0.66;
        var fx0 = frog.x - fh/2, fx1 = frog.x + fh/2;
        for(var k=0;k&lt;ln2.obstacles.length;k++){
          var ob=ln2.obstacles[k];
          if(fx0 &lt; ob.x+ob.vw-6 &amp;&amp; fx1 &gt; ob.x+6){ die(); break; }
        }
      }
    }

    // ripples
    for(var r=ripples.length-1;r&gt;=0;r--){
      ripples[r].r += dt*1.6; ripples[r].a -= dt*0.04;
      if(ripples[r].a&lt;=0) ripples.splice(r,1);
    }

    draw();
    animId=requestAnimationFrame(loop);
  }

  // ---------- Drawing ----------
  function draw(){
    // background asphalt
    ctx.fillStyle=&#x27;#15151d&#x27;;
    ctx.fillRect(0,0,W,H);

    // lily pad row (top)
    drawLilyRow();
    // road lanes
    for(var i=0;i&lt;LANES;i++){
      var y=(i+1)*RH;
      ctx.fillStyle = (i%2===0)?&#x27;#1c1c26&#x27;:&#x27;#191922&#x27;;
      ctx.fillRect(0,y,W,RH);
    }
    // grass curb (bottom)
    drawGrassRow();

    // lane dividers (glowing / gold if bonus)
    for(var d=1;d&lt;ROWS;d++){
      var yd=d*RH;
      if(d&gt;=1 &amp;&amp; d&lt;=LANES){
        drawDivider(yd, bonus);
      }
    }

    // streetlights at edges
    drawStreetlights();

    // vehicles
    for(var l=0;l&lt;lanes.length;l++){
      var ln=lanes[l];
      for(var j=0;j&lt;ln.obstacles.length;j++){
        drawVehicle(ln.obstacles[j], ln.dir, (ln.row)*RH);
      }
    }

    // ripples
    for(var r=0;r&lt;ripples.length;r++){
      var rp=ripples[r];
      ctx.strokeStyle=&#x27;rgba(120,220,255,&#x27;+rp.a+&#x27;)&#x27;;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2); ctx.stroke();
    }

    // frog
    drawFrog();
  }

  function drawLilyRow(){
    ctx.fillStyle=&#x27;#0d2b3a&#x27;;
    ctx.fillRect(0,0,W,RH);
    // water shimmer
    ctx.fillStyle=&#x27;rgba(60,150,180,0.15)&#x27;;
    for(var i=0;i&lt;COLS;i++){
      ctx.fillRect(i*CELL, RH*0.2, CELL*0.6, 3);
    }
    // a few lily pads
    for(var c=0;c&lt;COLS;c+=2){
      var cx=c*CELL+CELL*0.5, cy=RH*0.55;
      ctx.fillStyle=&#x27;#2f9e4f&#x27;;
      ctx.beginPath(); ctx.arc(cx,cy,RH*0.32,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=&#x27;#0d2b3a&#x27;;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,RH*0.32, -0.4, 0.4); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle=&#x27;rgba(255,255,255,0.85)&#x27;;
    ctx.font=&#x27;bold 13px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;🌸 SAFE LILY PAD 🌸&#x27;, W/2, RH*0.5+4);
  }

  function drawGrassRow(){
    var y=(ROWS-1)*RH;
    ctx.fillStyle=&#x27;#1f5c1f&#x27;;
    ctx.fillRect(0,y,W,RH);
    ctx.fillStyle=&#x27;#2c7a2c&#x27;;
    for(var i=0;i&lt;W;i+=8){
      var h=6+((i*7)%9);
      ctx.fillRect(i, y+RH-h, 3, h);
    }
    ctx.fillStyle=&#x27;rgba(230,255,230,0.8)&#x27;;
    ctx.font=&#x27;bold 12px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;START HERE&#x27;, W/2, y+14);
  }

  function drawDivider(y, gold){
    var dash=22, gap=18;
    if(gold){
      var g=Math.abs(Math.sin(streetlightPhase*4));
      ctx.strokeStyle=&#x27;rgba(255,&#x27;+Math.floor(200+50*g)+&#x27;,60,&#x27;+(0.7+0.3*g)+&#x27;)&#x27;;
      ctx.lineWidth=4; ctx.shadowColor=&#x27;#ffd54a&#x27;; ctx.shadowBlur=12;
    } else {
      ctx.strokeStyle=&#x27;rgba(255,255,255,0.35)&#x27;;
      ctx.lineWidth=3; ctx.shadowBlur=0;
    }
    ctx.beginPath();
    for(var x=0;x&lt;W;x+=dash+gap){
      ctx.moveTo(x,y); ctx.lineTo(x+dash,y);
    }
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  function drawStreetlights(){
    var glow = 0.4 + 0.25*Math.sin(streetlightPhase);
    for(var side=0; side&lt;2; side++){
      var x = side===0 ? 4 : W-4;
      for(var i=1;i&lt;=LANES;i+=2){
        var y=i*RH+RH/2;
        var grad=ctx.createRadialGradient(x,y,2,x,y,50);
        grad.addColorStop(0,&#x27;rgba(255,230,150,&#x27;+glow+&#x27;)&#x27;);
        grad.addColorStop(1,&#x27;rgba(255,230,150,0)&#x27;);
        ctx.fillStyle=grad;
        ctx.beginPath(); ctx.arc(x,y,50,0,Math.PI*2); ctx.fill();
      }
    }
  }

  function drawVehicle(o, dir, rowTop){
    var vw=o.vw, vh=RH*0.62;
    var x=o.x, y=rowTop + (RH-vh)/2;
    var t=o.type;

    // motion blur trail
    var tx = x - dir*vw*0.35;
    var tg=ctx.createLinearGradient(tx, y, tx+dir*vw, y);
    ctx.fillStyle=&#x27;rgba(&#x27;+hexToRgb(t.body)+&#x27;,0.18)&#x27;;
    ctx.fillRect(dir&gt;0 ? x-vw*0.4 : x+vw*0.15, y+vh*0.15, vw*0.4, vh*0.7);

    // headlight glow (front is direction of travel)
    var fx = dir&gt;0 ? x+vw : x;
    var hg=ctx.createRadialGradient(fx,y+vh/2,2,fx,y+vh/2,42);
    hg.addColorStop(0,&#x27;rgba(255,255,210,0.55)&#x27;); hg.addColorStop(1,&#x27;rgba(255,255,210,0)&#x27;);
    ctx.fillStyle=hg;
    ctx.beginPath(); ctx.arc(fx,y+vh/2,42,0,Math.PI*2); ctx.fill();

    // body
    ctx.fillStyle=t.body;
    roundRect(x, y+vh*0.28, vw, vh*0.6, 6); ctx.fill();
    // roof/cabin
    ctx.fillStyle=t.roof;
    if(t.name===&#x27;moto&#x27;){
      // motorcycle: simple compact shape
      ctx.fillStyle=t.body;
      roundRect(x, y+vh*0.35, vw, vh*0.4, 5); ctx.fill();
      ctx.fillStyle=&#x27;#222&#x27;;
      ctx.beginPath(); ctx.arc(x+vw*0.2, y+vh*0.85,vh*0.16,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+vw*0.8, y+vh*0.85,vh*0.16,0,Math.PI*2); ctx.fill();
    } else {
      roundRect(x+vw*0.22, y, vw*0.5, vh*0.42, 5); ctx.fill();
      // windows
      ctx.fillStyle=&#x27;rgba(180,230,255,0.85)&#x27;;
      roundRect(x+vw*0.28, y+vh*0.05, vw*0.38, vh*0.28, 3); ctx.fill();
      // wheels
      ctx.fillStyle=&#x27;#111&#x27;;
      ctx.beginPath(); ctx.arc(x+vw*0.22, y+vh*0.9, vh*0.14,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+vw*0.78, y+vh*0.9, vh*0.14,0,Math.PI*2); ctx.fill();
    }
    // headlight dots
    ctx.fillStyle=&#x27;#fffbe0&#x27;;
    ctx.beginPath(); ctx.arc(fx-dir*3, y+vh*0.45, 3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx-dir*3, y+vh*0.72, 3,0,Math.PI*2); ctx.fill();
  }

  function drawFrog(){
    ctx.save();
    ctx.translate(frog.x, frog.y);
    if(frog.state===&#x27;spin&#x27;){
      ctx.rotate(frog.t*0.5);
      var s=Math.max(0.2, 1 - frog.t/26);
      ctx.scale(s,s);
    } else {
      ctx.scale(frog.sx, frog.sy);
    }
    var R=CELL*0.32;
    // body
    ctx.fillStyle = frog.state===&#x27;spin&#x27; ? &#x27;#7aa87a&#x27; : &#x27;#4ade4a&#x27;;
    ctx.beginPath(); ctx.ellipse(0,4,R,R*0.9,0,0,Math.PI*2); ctx.fill();
    // belly
    ctx.fillStyle=&#x27;#c9ffc9&#x27;;
    ctx.beginPath(); ctx.ellipse(0,8,R*0.55,R*0.5,0,0,Math.PI*2); ctx.fill();
    // eyes
    ctx.fillStyle=frog.state===&#x27;spin&#x27;?&#x27;#4ade4a&#x27;:&#x27;#4ade4a&#x27;;
    ctx.beginPath(); ctx.arc(-R*0.5,-R*0.7,R*0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.5,-R*0.7,R*0.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(-R*0.5,-R*0.7,R*0.25,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(R*0.5,-R*0.7,R*0.25,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#111&#x27;;
    if(frog.state===&#x27;spin&#x27;){
      // X eyes
      ctx.strokeStyle=&#x27;#111&#x27;; ctx.lineWidth=2;
      [-1,1].forEach(function(sd){
        var ex=sd*R*0.5, ey=-R*0.7, e=R*0.18;
        ctx.beginPath(); ctx.moveTo(ex-e,ey-e); ctx.lineTo(ex+e,ey+e);
        ctx.moveTo(ex+e,ey-e); ctx.lineTo(ex-e,ey+e); ctx.stroke();
      });
    } else {
      ctx.beginPath(); ctx.arc(-R*0.5,-R*0.7,R*0.13,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(R*0.5,-R*0.7,R*0.13,0,Math.PI*2); ctx.fill();
      // smile
      ctx.strokeStyle=&#x27;#116611&#x27;; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,4,R*0.4,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  // helpers

    else if(e.key===&#x27;ArrowRight&#x27;){ hop(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ hop(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ hop(0,1); e.preventDefault(); }

    var dx=p.x-frog.x, dy=p.y-frog.y;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,

        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);

    try {

        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

      // fires repeatedly during layout/font load; we only need the latest.

      lastReportT = now;
      var d = document.documentElement;

      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor

  // layout to settle before measuring.

    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
