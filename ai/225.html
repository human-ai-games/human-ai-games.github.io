<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>GALAXY DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #04020a; color: #cfe8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 24px; font-weight: 800; letter-spacing: 2px;
       color: #7ad0ff; text-shadow: 0 0 8px #2b8cff, 0 0 18px #7a3cff; }
  .instructions { font-size: 16px; color: #9fb8dd; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 640px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
  .hud .score { color: #b48cff; text-shadow: 0 0 8px #7a3cff; font-weight: 700; }
  .hud .lives { display: flex; gap: 6px; }
  .field-wrap { position: relative; }
  canvas { display: block; background: #05030f; border: 2px solid #2b6cff;
           border-radius: 8px; box-shadow: 0 0 18px #2b6cff, inset 0 0 24px rgba(43,108,255,.25); }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             flex-direction: column; color: #9fd8ff; text-align: center; pointer-events: none; }
  .overlay .big { font-size: 26px; font-weight: 800; text-shadow: 0 0 10px #2b8cff; }
  .overlay .sub { font-size: 16px; margin-top: 6px; color: #9fb8dd; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALAXY DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the &amp;larr; &amp;rarr; arrow keys (or drag the mouse) to bounce the plasma orb and smash every alien brick. Catch falling power-ups to widen your ship or split the orb — don&#x27;t let it escape the bottom!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div class=&quot;big&quot;&gt;READY&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Press Start below to launch&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById(&#x27;score&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;), overlay = document.getElementById(&#x27;overlay&#x27;);

  var running = false, animId = null;
  var keys = {};
  var score = 0, lives = 3;

  // Ship
  var SHIP_W = 90, SHIP_H = 14, SHIP_BASE_W = 90;
  var shipX = (W - SHIP_W) / 2, shipY = H - 26, shipSpeed = 8;
  var widenTimer = 0, flicker = 0;

  // Balls
  var balls = [];
  function newBall(x, y, vx, vy) { return { x:x, y:y, vx:vx, vy:vy, r:7, trail:[] }; }

  // Bricks
  var bricks = [];
  var COLS = 10, ROWS = 5, BW = 56, BH = 20, GAP = 6, TOP = 30, LEFT = (W - (COLS*(BW+GAP)-GAP))/2;
  var rowColors = [&#x27;#ff4da6&#x27;,&#x27;#ff8c3c&#x27;,&#x27;#ffe14d&#x27;,&#x27;#4dff9e&#x27;,&#x27;#4dd8ff&#x27;];
  var rowPoints = [50,40,30,20,10];

  // particles, powerups, stars
  var particles = [], powerups = [], stars = [];

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime; o.start(t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.stop(t + dur);
    } catch(_){}
  }

  function buildStars() { stars = []; for (var i=0;i&lt;60;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+0.4,tw:Math.random()*6}); }

  function buildBricks() {
    bricks = [];
    for (var r=0;r&lt;ROWS;r++) {
      for (var c=0;c&lt;COLS;c++) {
        var armored = (r &lt; 2) &amp;&amp; (Math.random() &lt; 0.35);
        bricks.push({ x:LEFT+c*(BW+GAP), y:TOP+r*(BH+GAP), w:BW, h:BH,
          color:rowColors[r], pts:rowPoints[r], hp:armored?2:1, armored:armored, flash:0, alive:true });
      }
    }
  }

  function launchBall() {
    balls = [ newBall(W/2, shipY-16, (Math.random()&lt;0.5?-1:1)*3.2, -4.2) ];
  }

  function reset() {
    score = 0; lives = 3; SHIP_W = SHIP_BASE_W; widenTimer = 0; flicker = 0;
    shipX = (W - SHIP_W)/2;
    particles = []; powerups = [];
    buildStars(); buildBricks(); launchBall();
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    var s = &#x27;&#x27;;
    for (var i=0;i&lt;lives;i++) s += &#x27;&lt;span style=&quot;color:#7ad0ff;text-shadow:0 0 6px #2b8cff;font-size:18px&quot;&gt;▲&lt;/span&gt;&#x27;;
    livesEl.innerHTML = s;
  }

  function explode(x,y,color) {
    for (var i=0;i&lt;10;i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*3+1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
    }
    beep(520 + Math.random()*180, 0.09, &#x27;square&#x27;, 0.07);
  }

  function dropPowerup(x,y) {
    var kind = Math.random()&lt;0.5 ? &#x27;wide&#x27; : &#x27;split&#x27;;
    powerups.push({ x:x, y:y, vy:1.6, kind:kind });
  }

  function loseLife() {
    lives--; flicker = 30;
    beep(140, 0.3, &#x27;sawtooth&#x27;, 0.09);
    updateHud();
    if (lives &lt;= 0) { gameOver(); return; }
    launchBall();
  }

  function gameOver() {
    running = false; if (animId) cancelAnimationFrame(animId), animId=null;
    overlay.style.display = &#x27;flex&#x27;;
    overlay.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;GAME OVER&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Score &#x27;+score+&#x27; — press Start to play again&lt;/div&gt;&#x27;;
  }

  function win() {
    running = false; if (animId) cancelAnimationFrame(animId), animId=null;
    overlay.style.display = &#x27;flex&#x27;;
    overlay.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;SECTOR CLEARED!&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Score &#x27;+score+&#x27; — press Start to replay&lt;/div&gt;&#x27;;
  }

  function tick() {
    if (!running) return;
    // ship movement
    if (keys[&#x27;ArrowLeft&#x27;]) shipX -= shipSpeed;
    if (keys[&#x27;ArrowRight&#x27;]) shipX += shipSpeed;
    shipX = Math.max(0, Math.min(W - SHIP_W, shipX));
    if (widenTimer &gt; 0) { widenTimer--; if (widenTimer===0){ var cx=shipX+SHIP_W/2; SHIP_W=SHIP_BASE_W; shipX=cx-SHIP_W/2; } }
    if (flicker &gt; 0) flicker--;

    // balls
    for (var b=balls.length-1;b&gt;=0;b--) {
      var ball = balls[b];
      ball.trail.push({x:ball.x,y:ball.y}); if (ball.trail.length&gt;8) ball.trail.shift();
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x-ball.r&lt;0){ball.x=ball.r;ball.vx=-ball.vx;}
      if (ball.x+ball.r&gt;W){ball.x=W-ball.r;ball.vx=-ball.vx;}
      if (ball.y-ball.r&lt;0){ball.y=ball.r;ball.vy=-ball.vy;}
      // paddle
      if (ball.vy&gt;0 &amp;&amp; ball.y+ball.r&gt;=shipY-4 &amp;&amp; ball.y-ball.r&lt;=shipY+SHIP_H &amp;&amp;
          ball.x&gt;=shipX-2 &amp;&amp; ball.x&lt;=shipX+SHIP_W+2) {
        ball.y = shipY-4-ball.r;
        var hit = (ball.x-(shipX+SHIP_W/2))/(SHIP_W/2);
        var speed = Math.min(Math.hypot(ball.vx,ball.vy)*1.04, 10);
        var ang = hit * 1.0 - Math.PI/2;
        ball.vx = Math.cos(ang)*speed; ball.vy = Math.sin(ang)*speed;
        if (ball.vy&gt;-2) ball.vy=-2;
        beep(320,0.06,&#x27;square&#x27;,0.06);
      }
      // bricks
      for (var i=0;i&lt;bricks.length;i++) {
        var br = bricks[i]; if (!br.alive) continue;
        if (ball.x+ball.r&gt;br.x &amp;&amp; ball.x-ball.r&lt;br.x+br.w &amp;&amp; ball.y+ball.r&gt;br.y &amp;&amp; ball.y-ball.r&lt;br.y+br.h) {
          // reflect based on shallow overlap
          var ox = Math.min(ball.x+ball.r-br.x, br.x+br.w-(ball.x-ball.r));
          var oy = Math.min(ball.y+ball.r-br.y, br.y+br.h-(ball.y-ball.r));
          if (ox &lt; oy) ball.vx=-ball.vx; else ball.vy=-ball.vy;
          br.hp--;
          if (br.hp&lt;=0) {
            br.alive=false; score+=br.pts; updateHud();
            explode(br.x+br.w/2, br.y+br.h/2, br.color);
            if (Math.random()&lt;0.18) dropPowerup(br.x+br.w/2, br.y+br.h/2);
          } else { br.flash=8; beep(220,0.05,&#x27;square&#x27;,0.05); }
          break;
        }
      }
      // lost ball
      if (ball.y-ball.r&gt;H) { balls.splice(b,1); }
    }
    if (balls.length===0 &amp;&amp; running) loseLife();

    // win check
    var any=false; for (var k=0;k&lt;bricks.length;k++) if (bricks[k].alive) { any=true; break; }
    if (!any &amp;&amp; running) { win(); return; }

    // powerups
    for (var p=powerups.length-1;p&gt;=0;p--) {
      var pu = powerups[p]; pu.y += pu.vy;
      if (pu.y&gt;=shipY-6 &amp;&amp; pu.y&lt;=shipY+SHIP_H &amp;&amp; pu.x&gt;=shipX &amp;&amp; pu.x&lt;=shipX+SHIP_W) {
        if (pu.kind===&#x27;wide&#x27;) { var cx=shipX+SHIP_W/2; SHIP_W=140; shipX=cx-SHIP_W/2; widenTimer=480; }
        else { // split
          var extra=[];
          balls.forEach(function(bb){ extra.push(newBall(bb.x,bb.y,-bb.vx,bb.vy)); });
          balls = balls.concat(extra);
        }
        beep(700,0.12,&#x27;triangle&#x27;,0.08);
        powerups.splice(p,1); continue;
      }
      if (pu.y&gt;H) powerups.splice(p,1);
    }

    // particles
    for (var q=particles.length-1;q&gt;=0;q--) {
      var pt=particles[q]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=0.03;
      if (pt.life&lt;=0) particles.splice(q,1);
    }

    for (var s=0;s&lt;bricks.length;s++) if (bricks[s].flash&gt;0) bricks[s].flash--;

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    // stars
    for (var i=0;i&lt;stars.length;i++){ var st=stars[i]; st.tw+=0.05;
      ctx.globalAlpha=0.4+0.4*Math.abs(Math.sin(st.tw));
      ctx.fillStyle=&#x27;#bcd8ff&#x27;; ctx.fillRect(st.x,st.y,st.s,st.s); }
    ctx.globalAlpha=1;
    // radar grid
    ctx.strokeStyle=&#x27;rgba(43,108,255,0.10)&#x27;; ctx.lineWidth=1;
    for (var gx=0;gx&lt;=W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
    for (var gy=0;gy&lt;=H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

    // bricks
    for (var b=0;b&lt;bricks.length;b++){ var br=bricks[b]; if(!br.alive) continue;
      ctx.save();
      ctx.shadowColor=br.color; ctx.shadowBlur=8;
      ctx.fillStyle = br.flash&gt;0 ? &#x27;#ffffff&#x27; : br.color;
      ctx.globalAlpha = br.armored ? (br.hp&gt;1?1:0.75) : 1;
      roundRect(br.x,br.y,br.w,br.h,4); ctx.fill();
      if (br.armored &amp;&amp; br.hp&gt;1){ ctx.globalAlpha=1; ctx.shadowBlur=0;
        ctx.strokeStyle=&#x27;rgba(255,255,255,0.7)&#x27;; ctx.lineWidth=2; roundRect(br.x+3,br.y+3,br.w-6,br.h-6,3); ctx.stroke(); }
      ctx.restore();
    }

    // particles
    for (var q=0;q&lt;particles.length;q++){ var pt=particles[q];
      ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color;
      ctx.fillRect(pt.x-2,pt.y-2,4,4); }
    ctx.globalAlpha=1;

    // powerups
    for (var p=0;p&lt;powerups.length;p++){ var pu=powerups[p];
      ctx.save(); ctx.shadowBlur=10;
      ctx.shadowColor = pu.kind===&#x27;wide&#x27;?&#x27;#4dff9e&#x27;:&#x27;#ff8c3c&#x27;;
      ctx.fillStyle = pu.kind===&#x27;wide&#x27;?&#x27;#4dff9e&#x27;:&#x27;#ff8c3c&#x27;;
      roundRect(pu.x-11,pu.y-8,22,16,4); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle=&#x27;#04020a&#x27;; ctx.font=&#x27;bold 11px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(pu.kind===&#x27;wide&#x27;?&#x27;W&#x27;:&#x27;S&#x27;, pu.x, pu.y+1);
      ctx.restore();
    }

    // balls + trails
    for (var i2=0;i2&lt;balls.length;i2++){ var ball=balls[i2];
      for (var t=0;t&lt;ball.trail.length;t++){ var tr=ball.trail[t];
        ctx.globalAlpha=(t/ball.trail.length)*0.5; ctx.fillStyle=&#x27;#b48cff&#x27;;
        ctx.beginPath(); ctx.arc(tr.x,tr.y,ball.r*(t/ball.trail.length),0,Math.PI*2); ctx.fill(); }
      ctx.globalAlpha=1;
      ctx.save(); ctx.shadowColor=&#x27;#b48cff&#x27;; ctx.shadowBlur=14; ctx.fillStyle=&#x27;#eaddff&#x27;;
      ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    // ship
    if (!(flicker&gt;0 &amp;&amp; Math.floor(flicker/4)%2===0)) {
      ctx.save(); ctx.shadowColor=&#x27;#2b8cff&#x27;; ctx.shadowBlur=16;
      var grad=ctx.createLinearGradient(shipX,0,shipX+SHIP_W,0);
      grad.addColorStop(0,&#x27;#2b6cff&#x27;); grad.addColorStop(0.5,&#x27;#7ad0ff&#x27;); grad.addColorStop(1,&#x27;#7a3cff&#x27;);
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.moveTo(shipX, shipY+SHIP_H);
      ctx.lineTo(shipX+SHIP_W*0.15, shipY);
      ctx.lineTo(shipX+SHIP_W*0.85, shipY);
      ctx.lineTo(shipX+SHIP_W, shipY+SHIP_H);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // input
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    if (!running) return;
    var rect=cv.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(W/rect.width);
    shipX=Math.max(0,Math.min(W-SHIP_W, mx-SHIP_W/2));
  });

  function startGame(){
    overlay.style.display=&#x27;none&#x27;;
    reset();
    running=true;
    if (animId) cancelAnimationFrame(animId);
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false; if (animId){ cancelAnimationFrame(animId); animId=null; }
    overlay.style.display=&#x27;flex&#x27;;
    overlay.innerHTML=&#x27;&lt;div class=&quot;big&quot;&gt;PAUSED&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Press Start to resume&lt;/div&gt;&#x27;;
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  buildStars(); buildBricks(); draw(); updateHud();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);

<script>
