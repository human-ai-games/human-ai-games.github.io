<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Space Frog Escape</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0616; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 640px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; color: #7CFC00; text-shadow: 0 0 8px #7CFC00, 0 0 16px #2fbf2f; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #b9a9e6; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 18px; font-weight: 600; }
  .hud .combo { color: #ffd54a; text-shadow: 0 0 8px #ffb300; }
  .hud .score { color: #7CFC00; }
  #timerWrap { width: 620px; height: 10px; background: #241640; border-radius: 6px; overflow: hidden; box-shadow: 0 0 6px #4b2f8a; }
  #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg,#00e5ff,#7CFC00); transition: width 0.1s linear; }
  canvas { border-radius: 10px; box-shadow: 0 0 24px #4b2f8a; touch-action: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Space Frog Escape&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys (or swipe) to hop your frog up through the alien traffic to the mothership at the top. Avoid UFOs, asteroids and rockets, ride the lily pads, and chain crossings before the timer runs out to build your combo!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;Combo x&lt;span id=&quot;combo&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div id=&quot;timerWrap&quot;&gt;&lt;div id=&quot;timerBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;520&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var LANES = 6;                 // obstacle lanes
var ROWS = LANES + 2;          // top mothership row + lanes + bottom start row
var CELL = H / ROWS;
var COLS = 10;
var COLW = W / COLS;

var laneColors = [&#x27;#3a1d6e&#x27;,&#x27;#5a1d6e&#x27;,&#x27;#1d3a6e&#x27;,&#x27;#1d6e5a&#x27;,&#x27;#6e5a1d&#x27;,&#x27;#6e1d3a&#x27;];
var laneNeon   = [&#x27;#b06bff&#x27;,&#x27;#ff6bd5&#x27;,&#x27;#6ba8ff&#x27;,&#x27;#6bffd5&#x27;,&#x27;#ffe06b&#x27;,&#x27;#ff6b8a&#x27;];

var running = false, animId = null;
var hero, lanes, score, combo, best = 0, particles, flash, beam, redFlash, timer, timerMax, stars;
var lastT = 0;

var scoreEl = document.getElementById(&#x27;score&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);
var bestEl = document.getElementById(&#x27;best&#x27;);
var timerBar = document.getElementById(&#x27;timerBar&#x27;);

function rand(a,b){ return a + Math.random()*(b-a); }

function makeStars(){
  stars = [];
  for(var i=0;i&lt;70;i++) stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.5+0.3, tw:Math.random()*Math.PI*2, sp:rand(0.4,1.2)});
}

function buildLanes(){
  lanes = [];
  for(var i=0;i&lt;LANES;i++){
    var row = i+1;
    var y = row*CELL;
    var dir = (i%2===0)?1:-1;
    var speed = rand(50,120) + i*8;
    var obs = [];
    var count = 2 + (i%2);
    var types = [&#x27;ufo&#x27;,&#x27;asteroid&#x27;,&#x27;rocket&#x27;];
    var gap = W/count;
    for(var j=0;j&lt;count;j++){
      obs.push({ x: j*gap + rand(0,gap*0.4), w: COLW*1.5, type: types[(i+j)%3], spin: 0 });
    }
    // lily pads on some lanes
    var pads = [];
    if(i%2===1 &amp;&amp; i&lt;LANES){
      pads.push({ x: rand(0,W), w: COLW*1.3 });
    }
    lanes.push({ y:y, dir:dir, speed:speed, obs:obs, pads:pads, star: rand(0,W) });
  }
}

function resetHero(){
  hero = { col: Math.floor(COLS/2), row: ROWS-1, px:0, py:0, sx:1, sy:1, spin:0, dead:false, ridePad:null };
  hero.px = hero.col*COLW + COLW/2;
  hero.py = hero.row*CELL + CELL/2;
}

function startGame(){
  if(running) return;
  score = 0; combo = 1;
  scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;1&#x27;;
  particles = []; flash = 0; beam = 0; redFlash = 0;
  timerMax = 12; timer = timerMax;
  makeStars();
  buildLanes();
  resetHero();
  running = true;
  lastT = performance.now();
  animId = requestAnimationFrame(loop);
}
function stopGame(){
  running = false;
  if(animId){ cancelAnimationFrame(animId); animId = null; }
}

function jump(dc, dr){
  if(!running || hero.dead) return;
  var nc = Math.max(0, Math.min(COLS-1, hero.col+dc));
  var nr = Math.max(0, Math.min(ROWS-1, hero.row+dr));
  hero.col = nc; hero.row = nr;
  hero.ridePad = null;
  // squash-stretch
  hero.sx = 0.6; hero.sy = 1.4;
  if(hero.row === 0){
    // reached mothership
    beam = 1;
    score += 10 * combo;
    combo += 1;
    timer = Math.min(timerMax, timer + 4);
    scoreEl.textContent = score;
    comboEl.textContent = combo;
    if(score&gt;best){ best=score; bestEl.textContent=best; }
    setTimeout(function(){ if(running) resetHero(); }, 260);
    hero.row = ROWS-1; // hold until reset; visually beam handles it
    resetHero();
  }
}

function die(){
  hero.dead = true;
  redFlash = 1;
  combo = 1; comboEl.textContent = &#x27;1&#x27;;
  timer = Math.max(timer, 3);
  // explosion particles
  for(var i=0;i&lt;28;i++){
    particles.push({ x:hero.px, y:hero.py, vx:rand(-180,180), vy:rand(-220,60), life:1, col: Math.random()&lt;0.5?&#x27;#7CFC00&#x27;:laneNeon[Math.floor(Math.random()*6)], r:rand(2,5) });
  }
  setTimeout(function(){ if(running){ resetHero(); } }, 500);
}

function update(dt){
  // stars twinkle
  for(var s=0;s&lt;stars.length;s++){ stars[s].tw += dt*stars[s].sp*2; }

  timer -= dt;
  if(timer&lt;=0){ die(); timer = timerMax*0.6; }
  timerBar.style.width = Math.max(0,(timer/timerMax*100)) + &#x27;%&#x27;;

  // move lanes
  for(var i=0;i&lt;lanes.length;i++){
    var lane = lanes[i];
    lane.star = (lane.star + lane.dir*lane.speed*0.3*dt/1);
    for(var j=0;j&lt;lane.obs.length;j++){
      var o = lane.obs[j];
      o.x += lane.dir*lane.speed*dt;
      o.spin += dt*3;
      if(lane.dir&gt;0 &amp;&amp; o.x &gt; W) o.x = -o.w;
      else if(lane.dir&lt;0 &amp;&amp; o.x + o.w &lt; 0) o.x = W;
    }
    for(var p=0;p&lt;lane.pads.length;p++){
      var pd = lane.pads[p];
      pd.x += lane.dir*lane.speed*dt;
      if(lane.dir&gt;0 &amp;&amp; pd.x &gt; W) pd.x = -pd.w;
      else if(lane.dir&lt;0 &amp;&amp; pd.x + pd.w &lt; 0) pd.x = W;
    }
  }

  // ease squash back
  hero.sx += (1-hero.sx)*Math.min(1,dt*12);
  hero.sy += (1-hero.sy)*Math.min(1,dt*12);

  if(!hero.dead){
    // target position
    var targetX = hero.col*COLW + COLW/2;
    var targetY = hero.row*CELL + CELL/2;
    // if riding pad, follow it
    var laneIdx = hero.row-1;
    if(laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES){
      var lane = lanes[laneIdx];
      // check pad ride
      hero.ridePad = null;
      for(var p2=0;p2&lt;lane.pads.length;p2++){
        var pd2 = lane.pads[p2];
        if(hero.px &gt; pd2.x &amp;&amp; hero.px &lt; pd2.x+pd2.w){ hero.ridePad = pd2; }
      }
      if(hero.ridePad){
        hero.px += lane.dir*lane.speed*dt;
        hero.col = Math.max(0,Math.min(COLS-1,Math.round((hero.px-COLW/2)/COLW)));
        targetX = hero.px;
      }
    }
    hero.px += (targetX-hero.px)*Math.min(1,dt*16);
    hero.py += (targetY-hero.py)*Math.min(1,dt*16);

    // collision
    if(laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES){
      var lane2 = lanes[laneIdx];
      var hr = CELL*0.32;
      for(var k=0;k&lt;lane2.obs.length;k++){
        var o2 = lane2.obs[k];
        if(hero.px+hr &gt; o2.x &amp;&amp; hero.px-hr &lt; o2.x+o2.w){
          die(); break;
        }
      }
    }
  }

  // particles
  for(var q=particles.length-1;q&gt;=0;q--){
    var pa = particles[q];
    pa.vy += 400*dt;
    pa.x += pa.vx*dt; pa.y += pa.vy*dt;
    pa.life -= dt*1.6;
    if(pa.life&lt;=0) particles.splice(q,1);
  }

  if(flash&gt;0) flash -= dt*3;
  if(beam&gt;0) beam -= dt*2.5;
  if(redFlash&gt;0) redFlash -= dt*2;
}

function drawFrog(x,y,sx,sy,spin,alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x,y);
  ctx.rotate(spin);
  ctx.scale(sx,sy);
  var s = CELL*0.34;
  // glow
  ctx.shadowColor = &#x27;#7CFC00&#x27;; ctx.shadowBlur = 14;
  // body
  ctx.fillStyle = &#x27;#7CFC00&#x27;;
  ctx.beginPath(); ctx.ellipse(0, s*0.15, s, s*0.85, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // eyes
  ctx.fillStyle = &#x27;#c6ffb0&#x27;;
  ctx.beginPath(); ctx.arc(-s*0.45,-s*0.55,s*0.35,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.45,-s*0.55,s*0.35,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = &#x27;#111&#x27;;
  ctx.beginPath(); ctx.arc(-s*0.45,-s*0.55,s*0.16,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.45,-s*0.55,s*0.16,0,Math.PI*2); ctx.fill();
  // smile
  ctx.strokeStyle = &#x27;#0a4d0a&#x27;; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,s*0.15,s*0.5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  ctx.restore();
}

function drawObstacle(o, lane){
  var cy = lane.y + CELL/2;
  var cx = o.x + o.w/2;
  ctx.save();
  ctx.translate(cx, cy);
  if(o.type===&#x27;ufo&#x27;){
    ctx.shadowColor=&#x27;#6bffd5&#x27;; ctx.shadowBlur=12;
    ctx.fillStyle=&#x27;#9ce&#x27;; 
    ctx.beginPath(); ctx.ellipse(0,4,o.w*0.45,CELL*0.16,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#6bffd5&#x27;;
    ctx.beginPath(); ctx.ellipse(0,-4,o.w*0.22,CELL*0.18,0,Math.PI,0); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#fff&#x27;;
    for(var i=-1;i&lt;=1;i++){ ctx.beginPath(); ctx.arc(i*o.w*0.22,6,2.5,0,Math.PI*2); ctx.fill(); }
  } else if(o.type===&#x27;asteroid&#x27;){
    ctx.rotate(o.spin);
    ctx.shadowColor=&#x27;#ffae6b&#x27;; ctx.shadowBlur=10;
    ctx.fillStyle=&#x27;#8a6b4a&#x27;;
    ctx.beginPath();
    var R=CELL*0.32;
    for(var a=0;a&lt;8;a++){ var ang=a/8*Math.PI*2; var rr=R*(0.75+((a%3)*0.12)); ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr); }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#5c4630&#x27;;
    ctx.beginPath(); ctx.arc(-R*0.2,R*0.1,R*0.18,0,Math.PI*2); ctx.fill();
  } else { // rocket
    var facing = lane.dir;
    ctx.scale(facing,1);
    ctx.shadowColor=&#x27;#ff6b8a&#x27;; ctx.shadowBlur=12;
    ctx.fillStyle=&#x27;#e6e6ff&#x27;;
    ctx.beginPath();
    ctx.moveTo(o.w*0.4,0);
    ctx.lineTo(-o.w*0.1,-CELL*0.16);
    ctx.lineTo(-o.w*0.35,-CELL*0.16);
    ctx.lineTo(-o.w*0.35,CELL*0.16);
    ctx.lineTo(-o.w*0.1,CELL*0.16);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#ff6b8a&#x27;;
    ctx.beginPath(); ctx.moveTo(-o.w*0.35,-CELL*0.1); ctx.lineTo(-o.w*0.55,-CELL*0.18); ctx.lineTo(-o.w*0.35,0); ctx.closePath(); ctx.fill();
    // flame
    ctx.fillStyle=&#x27;#ffd54a&#x27;;
    ctx.beginPath(); ctx.moveTo(-o.w*0.35,0); ctx.lineTo(-o.w*0.55,-4); ctx.lineTo(-o.w*0.62,0); ctx.lineTo(-o.w*0.55,4); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function draw(){
  // background
  ctx.fillStyle = &#x27;#0a0616&#x27;;
  ctx.fillRect(0,0,W,H);
  // stars
  for(var s=0;s&lt;stars.length;s++){
    var st=stars[s];
    var a = 0.4+0.6*Math.abs(Math.sin(st.tw));
    ctx.globalAlpha=a;
    ctx.fillStyle=&#x27;#cbb8ff&#x27;;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // mothership row (top)
  var mg = ctx.createLinearGradient(0,0,0,CELL);
  mg.addColorStop(0,&#x27;#2a1550&#x27;); mg.addColorStop(1,&#x27;#150a2e&#x27;);
  ctx.fillStyle=mg; ctx.fillRect(0,0,W,CELL);
  ctx.save();
  ctx.shadowColor=&#x27;#b06bff&#x27;; ctx.shadowBlur=18;
  ctx.fillStyle=&#x27;#c9b0ff&#x27;;
  ctx.beginPath(); ctx.ellipse(W/2, CELL*0.55, W*0.28, CELL*0.28, 0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=&#x27;#7CFC00&#x27;;
  ctx.beginPath(); ctx.ellipse(W/2, CELL*0.35, W*0.10, CELL*0.16, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle=&#x27;#e9dcff&#x27;; ctx.font=&#x27;bold 13px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
  ctx.fillText(&#x27;MOTHERSHIP&#x27;, W/2, CELL*0.9);

  // lanes
  for(var i=0;i&lt;LANES;i++){
    var lane = lanes[i];
    ctx.fillStyle = laneColors[i];
    ctx.fillRect(0, lane.y, W, CELL);
    // parallax star strip
    ctx.globalAlpha=0.5;
    ctx.fillStyle = laneNeon[i];
    for(var d=0; d&lt;6; d++){
      var sx = ((lane.star + d*W/6) % W + W) % W;
      ctx.fillRect(sx, lane.y + (d*7)%CELL, 2,2);
    }
    ctx.globalAlpha=1;
    // neon borders
    ctx.strokeStyle = laneNeon[i]; ctx.lineWidth=2;
    ctx.shadowColor=laneNeon[i]; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(0,lane.y); ctx.lineTo(W,lane.y); ctx.stroke();
    ctx.shadowBlur=0;
    // pads
    for(var p=0;p&lt;lane.pads.length;p++){
      var pd=lane.pads[p];
      ctx.save();
      ctx.shadowColor=&#x27;#4dff88&#x27;; ctx.shadowBlur=14;
      ctx.fillStyle=&#x27;#2e8b3a&#x27;;
      ctx.beginPath(); ctx.ellipse(pd.x+pd.w/2, lane.y+CELL/2, pd.w/2, CELL*0.3, 0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=&#x27;#3fbf52&#x27;;
      ctx.beginPath(); ctx.ellipse(pd.x+pd.w/2, lane.y+CELL/2, pd.w/2.6, CELL*0.2, 0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // obstacles
    for(var k=0;k&lt;lane.obs.length;k++){ drawObstacle(lane.obs[k], lane); }
  }

  // bottom start row
  ctx.fillStyle=&#x27;#150a2e&#x27;; ctx.fillRect(0,(ROWS-1)*CELL,W,CELL);
  ctx.strokeStyle=&#x27;#7CFC00&#x27;; ctx.lineWidth=2;
  ctx.shadowColor=&#x27;#7CFC00&#x27;; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(0,(ROWS-1)*CELL); ctx.lineTo(W,(ROWS-1)*CELL); ctx.stroke();
  ctx.shadowBlur=0;

  // frog
  if(!hero.dead){
    drawFrog(hero.px,hero.py,hero.sx,hero.sy,0,1);
  }

  // particles
  for(var q=0;q&lt;particles.length;q++){
    var pa=particles[q];
    ctx.globalAlpha=Math.max(0,pa.life);
    ctx.fillStyle=pa.col;
    ctx.fillRect(pa.x-pa.r/2, pa.y-pa.r/2, pa.r, pa.r);
  }
  ctx.globalAlpha=1;

  // beam-up flash
  if(beam&gt;0){
    ctx.globalAlpha = Math.min(1,beam);
    var bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,&#x27;rgba(255,255,255,0.9)&#x27;);
    bg.addColorStop(1,&#x27;rgba(255,255,255,0)&#x27;);
    ctx.fillStyle=bg;
    ctx.fillRect(W/2-CELL, 0, CELL*2, H);
    ctx.globalAlpha=1;
  }

  // red death flash
  if(redFlash&gt;0){
    ctx.globalAlpha=Math.min(0.6,redFlash);
    ctx.fillStyle=&#x27;#ff2a2a&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
}

function loop(t){
  if(!running) return;
  var dt = Math.min(0.05,(t-lastT)/1000);
  lastT = t;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

// controls
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ jump(-1,0); e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ jump(1,0); e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ jump(0,-1); e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ jump(0,1); e.preventDefault(); }
});

// swipe
var touchStart=null;
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ if(e.touches.length){ touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; } }, {passive:true});
cv.addEventListener(&#x27;touchend&#x27;, function(e){
  if(!touchStart) return;
  var t=e.changedTouches[0];
  var dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  if(Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20){ jump(0,-1); }
  else if(Math.abs(dx)&gt;Math.abs(dy)){ jump(dx&gt;0?1:-1,0); }
  else { jump(0,dy&gt;0?1:-1); }
  touchStart=null;
}, {passive:true});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
buildLanes(); resetHero(); makeStars();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
