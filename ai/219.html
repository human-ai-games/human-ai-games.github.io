<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC BOUNCER ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #9fd8ff; text-shadow: 0 0 12px #4aa3ff, 0 0 24px #2266ff; }
  .instructions { font-size: 16px; color: #9aa6cc; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 40px; align-items: center; font-size: 22px; font-weight: 700; }

  .field { position: relative; width: 640px; height: 440px; flex-shrink: 0; margin: 0;

    border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 60px #000a, 0 0 20px #1a2a66; cursor: none; }

    font-size: 26px; font-weight: 700; color: #cfe0ff; text-shadow: 0 0 14px #4aa3ff; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BOUNCER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your glowing ship with the mouse or arrow keys to bounce the energy orbs — blue is worth 1, orange 2, purple 3. Missing an orb costs points; score as much as you can before the 60-second timer runs out. Use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;TIME&lt;/span&gt; &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;msg&quot;&gt;Press Start below to play&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 640, FIELD_H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), timeEl = document.getElementById(&#x27;time&#x27;), msgEl = document.getElementById(&#x27;msg&#x27;);

  var PADDLE_W = 110, PADDLE_H = 16, PADDLE_BOTTOM = 14, PADDLE_SPEED = 8;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX = (FIELD_W - PADDLE_W) / 2;
  var paddleFlash = 0;
  var score = 0, timeLeft = 60, lastTime = 0, timerAcc = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  // stars two layers
  var starsFar = [], starsNear = [];
  for (var i = 0; i &lt; 60; i++) starsFar.push({ x: Math.random()*FIELD_W, y: Math.random()*FIELD_H, r: Math.random()*1+0.3 });
  for (var i = 0; i &lt; 30; i++) starsNear.push({ x: Math.random()*FIELD_W, y: Math.random()*FIELD_H, r: Math.random()*1.6+0.8 });

  // asteroids (bumpers)
  var asteroids = [
    { x: 200, y: 180, r: 34 },
    { x: 450, y: 250, r: 40 }
  ];

  // orbs
  var ORB_COLORS = [
    { pts: 1, color: &#x27;#4aa3ff&#x27;, glow: &#x27;#2266ff&#x27; },
    { pts: 2, color: &#x27;#ff9a3c&#x27;, glow: &#x27;#ff6600&#x27; },
    { pts: 3, color: &#x27;#c46bff&#x27;, glow: &#x27;#8822ff&#x27; }
  ];
  var orbs = [];
  function makeOrbs() {
    orbs = [];
    for (var i = 0; i &lt; 3; i++) {
      var c = ORB_COLORS[i];
      orbs.push({
        x: 120 + i*200, y: 60 + i*20, r: 10,
        vx: (Math.random()&lt;0.5?-1:1)*(3+Math.random()),
        vy: 3 + Math.random(),
        baseSpeed: 4 + i*0.3,
        pts: c.pts, color: c.color, glow: c.glow
      });
    }
  }

  var ripples = [];
  function addRipple(x, y, color) { ripples.push({ x: x, y: y, r: 4, max: 46, color: color, life: 1 }); }

  function resetOrb(o) {
    o.x = 80 + Math.random()*(FIELD_W-160);
    o.y = 30;
    var sp = o.baseSpeed;
    o.vx = (Math.random()&lt;0.5?-1:1)*sp*0.7;
    o.vy = sp*0.7;
  }

  function speedup(o) {
    var sp = Math.min(Math.hypot(o.vx, o.vy)*1.06, 12);
    var ang = Math.atan2(o.vy, o.vx);
    o.vx = Math.cos(ang)*sp; o.vy = Math.sin(ang)*sp;
  }

  function update(dt) {
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, paddleX));
    if (paddleFlash &gt; 0) paddleFlash -= dt*4;

    // stars drift
    for (var i = 0; i &lt; starsFar.length; i++) { starsFar[i].y += 0.15; if (starsFar[i].y &gt; FIELD_H) { starsFar[i].y = 0; starsFar[i].x = Math.random()*FIELD_W; } }
    for (var i = 0; i &lt; starsNear.length; i++) { starsNear[i].y += 0.4; if (starsNear[i].y &gt; FIELD_H) { starsNear[i].y = 0; starsNear[i].x = Math.random()*FIELD_W; } }

    var paddleTop = FIELD_H - PADDLE_BOTTOM - PADDLE_H;

    for (var k = 0; k &lt; orbs.length; k++) {
      var o = orbs[k];
      o.x += o.vx; o.y += o.vy;
      // walls
      if (o.x - o.r &lt;= 0) { o.x = o.r; o.vx = Math.abs(o.vx); }
      if (o.x + o.r &gt;= FIELD_W) { o.x = FIELD_W - o.r; o.vx = -Math.abs(o.vx); }
      if (o.y - o.r &lt;= 0) { o.y = o.r; o.vy = Math.abs(o.vy); }
      // asteroid ricochet
      for (var a = 0; a &lt; asteroids.length; a++) {
        var ast = asteroids[a];
        var dx = o.x - ast.x, dy = o.y - ast.y, d = Math.hypot(dx, dy), min = o.r + ast.r;
        if (d &lt; min &amp;&amp; d &gt; 0) {
          var nx = dx/d, ny = dy/d;
          var dot = o.vx*nx + o.vy*ny;
          o.vx -= 2*dot*nx; o.vy -= 2*dot*ny;
          o.x = ast.x + nx*(min+0.5); o.y = ast.y + ny*(min+0.5);
          addRipple(o.x, o.y, &#x27;#9aa6cc&#x27;);
          beep(200, 0.08, &#x27;triangle&#x27;, 0.05);
        }
      }
      // paddle
      if (o.vy &gt; 0 &amp;&amp; o.y + o.r &gt;= paddleTop &amp;&amp; o.y + o.r &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
          o.x &gt;= paddleX - o.r &amp;&amp; o.x &lt;= paddleX + PADDLE_W + o.r) {
        o.vy = -Math.abs(o.vy);
        o.y = paddleTop - o.r;
        // angle based on hit position
        var hit = (o.x - (paddleX + PADDLE_W/2)) / (PADDLE_W/2);
        var sp = Math.hypot(o.vx, o.vy);
        o.vx = hit * sp * 0.8;
        speedup(o);
        score += o.pts;
        scoreEl.textContent = score;
        paddleFlash = 1;
        addRipple(o.x, paddleTop, o.color);
        beep(440 + o.pts*80, 0.12, &#x27;square&#x27;, 0.09);
      }
      // missed
      if (o.y - o.r &gt; FIELD_H) {
        score = Math.max(0, score - o.pts);
        scoreEl.textContent = score;
        beep(120, 0.2, &#x27;sawtooth&#x27;, 0.06);
        resetOrb(o);
      }
    }

    // ripples
    for (var r = ripples.length - 1; r &gt;= 0; r--) {
      ripples[r].r += 2.2; ripples[r].life -= dt*2.2;
      if (ripples[r].life &lt;= 0) ripples.splice(r, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);
    // stars
    ctx.fillStyle = &#x27;#4a5688&#x27;;
    for (var i = 0; i &lt; starsFar.length; i++) { ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(starsFar[i].x, starsFar[i].y, starsFar[i].r, 0, 7); ctx.fill(); }
    ctx.fillStyle = &#x27;#cfe0ff&#x27;;
    for (var i = 0; i &lt; starsNear.length; i++) { ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(starsNear[i].x, starsNear[i].y, starsNear[i].r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;

    // asteroids
    for (var a = 0; a &lt; asteroids.length; a++) {
      var ast = asteroids[a];
      ctx.save();
      ctx.shadowColor = &#x27;#556&#x27;; ctx.shadowBlur = 18;
      var g = ctx.createRadialGradient(ast.x-ast.r*0.3, ast.y-ast.r*0.3, 4, ast.x, ast.y, ast.r);
      g.addColorStop(0, &#x27;#6b7290&#x27;); g.addColorStop(1, &#x27;#2a2f45&#x27;);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ast.x, ast.y, ast.r, 0, 7); ctx.fill();
      ctx.restore();
    }

    // ripples
    for (var r = 0; r &lt; ripples.length; r++) {
      var rp = ripples[r];
      ctx.globalAlpha = Math.max(0, rp.life);
      ctx.strokeStyle = rp.color; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // orbs
    for (var k = 0; k &lt; orbs.length; k++) {
      var o = orbs[k];
      ctx.save();
      ctx.shadowColor = o.glow; ctx.shadowBlur = 22;
      ctx.fillStyle = o.color;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill();
      ctx.fillStyle = &#x27;#ffffff&#x27;; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(o.x - o.r*0.3, o.y - o.r*0.3, o.r*0.35, 0, 7); ctx.fill();
      ctx.restore();
    }

    // paddle (ship)
    var py = FIELD_H - PADDLE_BOTTOM - PADDLE_H;
    ctx.save();
    ctx.shadowColor = paddleFlash &gt; 0 ? &#x27;#fff&#x27; : &#x27;#4aa3ff&#x27;;
    ctx.shadowBlur = paddleFlash &gt; 0 ? 30 : 18;
    var pg = ctx.createLinearGradient(paddleX, py, paddleX, py+PADDLE_H);
    pg.addColorStop(0, paddleFlash &gt; 0 ? &#x27;#eafaff&#x27; : &#x27;#8fd6ff&#x27;);
    pg.addColorStop(1, &#x27;#2a72ff&#x27;);
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(paddleX, py + PADDLE_H);
    ctx.lineTo(paddleX + 18, py);
    ctx.lineTo(paddleX + PADDLE_W - 18, py);
    ctx.lineTo(paddleX + PADDLE_W, py + PADDLE_H);
    ctx.closePath();
    ctx.fill();
    // cockpit
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;#d0f0ff&#x27;;
    ctx.beginPath(); ctx.arc(paddleX + PADDLE_W/2, py + PADDLE_H*0.55, 5, 0, 7); ctx.fill();
    ctx.restore();
  }

  function tick(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = Math.min((ts - lastTime)/1000, 0.05);
    lastTime = ts;
    timerAcc += dt;
    if (timerAcc &gt;= 1) {
      timerAcc -= 1;
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft &lt;= 0) { endGame(); return; }
    }
    update(dt);
    draw();
    animId = requestAnimationFrame(tick);
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    timeEl.textContent = &#x27;0&#x27;;
    draw();
    msgEl.textContent = &#x27;Time! Final score: &#x27; + score;
    msgEl.style.display = &#x27;flex&#x27;;
    beep(660, 0.3, &#x27;sine&#x27;, 0.1);
  }

  function startGame() {
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    timeLeft = 60; timeEl.textContent = &#x27;60&#x27;; timerAcc = 0;
    paddleX = (FIELD_W - PADDLE_W) / 2;
    paddleFlash = 0;
    for (var k in keysDown) keysDown[k] = false;
    makeOrbs();
    ripples = [];
    msgEl.style.display = &#x27;none&#x27;;
    lastTime = 0;
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  document.getElementById(&#x27;field&#x27;).addEventListener(&#x27;mousemove&#x27;, function (e) {
    if (!running) return;
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (FIELD_W / rect.width);
    paddleX = Math.max(0, Math.min(FIELD_W - PADDLE_W, mx - PADDLE_W/2));
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial static paint
  makeOrbs();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
