<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍉 Fruit Drop 🍓</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(160deg,#fff0f5,#f0fff5); color: #333; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #666; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .scores { display: flex; gap: 24px; align-items: center; font-size: 18px; }
  .scorebox { text-align: center; }
  .scorebox .lbl { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  #score { font-size: 30px; font-weight: 800; color: #444; transition: transform .1s, color .1s; display: inline-block; }
  #score.pulse { transform: scale(1.4); color: #ffb700; text-shadow: 0 0 12px #ffd54a; }
  #best { font-size: 24px; font-weight: 800; color: #ff6b6b; }
  .arena { display: flex; align-items: center; gap: 10px; }
  .touchbtn { width: 64px; height: 130px; font-size: 34px; border: none; border-radius: 14px; background: #ffffffcc; box-shadow: 0 3px 8px rgba(0,0,0,.12); cursor: pointer; color: #ff6b6b; user-select: none; }
  .touchbtn:active { background: #ffe0e8; }
  .fieldwrap { position: relative; }
  .field { position: relative; width: 240px; height: 384px; background: rgba(255,255,255,.55); border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 2px #ffffff, 0 4px 14px rgba(0,0,0,.1); }
  .field.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 15%{transform:translate(-6px,3px)} 30%{transform:translate(6px,-3px)} 45%{transform:translate(-5px,-3px)} 60%{transform:translate(5px,3px)} 75%{transform:translate(-3px,2px)} }
  .cell { position: absolute; box-sizing: border-box; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .ghost { position: absolute; box-sizing: border-box; border-radius: 5px; border: 2px dashed rgba(0,0,0,.22); }
  .particle { position: absolute; border-radius: 2px; pointer-events: none; }
  .combo { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 900; color: #ff3b6b; text-shadow: 0 0 16px #ffd54a; pointer-events: none; opacity: 0; }
  .combo.show { animation: pop .8s; }
  @keyframes pop { 0%{opacity:0; transform:scale(.4)} 30%{opacity:1; transform:scale(1.2)} 70%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(1.1)} }
  .ctrlrow { display: flex; gap: 8px; }
  .ctrlrow button { font-size: 20px; padding: 8px 14px; border: none; border-radius: 10px; background: #ffffffcc; box-shadow: 0 2px 6px rgba(0,0,0,.12); cursor: pointer; }
  .ctrlrow button:active { background: #ffe0e8; }
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(255,255,255,.85); font-weight: 800; font-size: 22px; color: #ff3b6b; border-radius: 10px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ◀ ▶ (or arrows), Up rotates, Down soft-drops, Space hard-drops. Clear full rows for points — clear several at once for a juicy combo bonus!&lt;/p&gt;
  &lt;div class=&quot;scores&quot;&gt;
    &lt;div class=&quot;scorebox&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Score&lt;/div&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;scorebox&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Best&lt;/div&gt;&lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;arena&quot;&gt;
    &lt;button class=&quot;touchbtn&quot; id=&quot;btnL&quot;&gt;◀&lt;/button&gt;
    &lt;div class=&quot;fieldwrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
        &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;button class=&quot;touchbtn&quot; id=&quot;btnR&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ctrlrow&quot;&gt;
    &lt;button id=&quot;btnRot&quot;&gt;↻ Rotate&lt;/button&gt;
    &lt;button id=&quot;btnDown&quot;&gt;▼ Drop&lt;/button&gt;
    &lt;button id=&quot;btnHard&quot;&gt;⤓ Hard&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 16;
  var running = false, dropId = null, DROP_MS = 550;
  var grid = [], piece = null, score = 0, best = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);

  // Seven tetrominoes with fruit theme (emoji + color)
  var TYPES = {
    I: { color:&#x27;#48dbfb&#x27;, emoji:&#x27;🍋&#x27;, cells:[[0,1],[1,1],[2,1],[3,1]] },
    O: { color:&#x27;#feca57&#x27;, emoji:&#x27;🍊&#x27;, cells:[[1,0],[2,0],[1,1],[2,1]] },
    T: { color:&#x27;#ff9ff3&#x27;, emoji:&#x27;🍇&#x27;, cells:[[1,0],[0,1],[1,1],[2,1]] },
    S: { color:&#x27;#1dd1a1&#x27;, emoji:&#x27;🍏&#x27;, cells:[[1,0],[2,0],[0,1],[1,1]] },
    Z: { color:&#x27;#ff6b6b&#x27;, emoji:&#x27;🍓&#x27;, cells:[[0,0],[1,0],[1,1],[2,1]] },
    J: { color:&#x27;#54a0ff&#x27;, emoji:&#x27;🫐&#x27;, cells:[[0,0],[0,1],[1,1],[2,1]] },
    L: { color:&#x27;#ff9f43&#x27;, emoji:&#x27;🍑&#x27;, cells:[[2,0],[0,1],[1,1],[2,1]] }
  };
  var KEYS = Object.keys(TYPES);

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function rot(cells){ // rotate 90deg cw within 4x4 box
    return cells.map(function(p){ return [3-p[1], p[0]]; });
  }
  function normalize(cells){ // shift to touch left/top for tighter bounds not needed; keep as-is
    return cells;
  }

  function spawnPiece(){
    var t = KEYS[Math.floor(Math.random()*KEYS.length)];
    var def = TYPES[t];
    piece = { type:t, color:def.color, emoji:def.emoji, cells:def.cells.map(function(c){return c.slice();}), x:3, y:-1 };
    if (collides(piece,0,0,piece.cells)) return false;
    return true;
  }

  function absCells(p, dx, dy, cells){
    cells = cells||p.cells; dx=dx||0; dy=dy||0;
    return cells.map(function(c){ return { x:p.x+c[0]+dx, y:p.y+c[1]+dy }; });
  }
  function collides(p, dx, dy, cells){
    var cs = absCells(p,dx,dy,cells);
    for (var i=0;i&lt;cs.length;i++){
      var x=cs[i].x, y=cs[i].y;
      if (x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if (y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece(){
    var cs = absCells(piece);
    for (var i=0;i&lt;cs.length;i++){ var c=cs[i]; if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]={color:piece.color,emoji:piece.emoji}; }
    piece=null;
  }

  function ghostY(){
    if(!piece) return 0;
    var dy=0;
    while(!collides(piece,0,dy+1)) dy++;
    return dy;
  }

  function clearFullRows(){
    var rowsToClear=[];
    for (var r=0;r&lt;ROWS;r++){ var full=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;} if(full) rowsToClear.push(r); }
    var n = rowsToClear.length;
    if (n&gt;0){
      // particle burst
      rowsToClear.forEach(function(r){ for(var c=0;c&lt;COLS;c++){ if(grid[r][c]) burst(c,r,grid[r][c].color); } });
      rowsToClear.forEach(function(r){ grid.splice(r,1); var e=[]; for(var c=0;c&lt;COLS;c++)e.push(null); grid.unshift(e); });
      var mult = n===1?1 : n===2?2 : n===3?4 : 8;
      var gained = 10*n*mult;
      addScore(gained);
      if (n&gt;=2){ showCombo(n, mult); doShake(); }
    }
  }

  function addScore(g){
    var before = score;
    score += g;
    scoreEl.textContent = score;
    scoreEl.classList.remove(&#x27;pulse&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pulse&#x27;);
    if (score&gt;best){ best=score; bestEl.textContent=best; }
    // speed up every 50 points
    if (Math.floor(score/50) &gt; Math.floor(before/50)){
      DROP_MS = Math.max(120, 550 - Math.floor(score/50)*40);
      if (running){ clearInterval(dropId); dropId=setInterval(stepDown, DROP_MS); }
    }
  }

  function showCombo(n, mult){
    comboEl.textContent = (n===4?&#x27;FRUIT SLAM!&#x27;:&#x27;COMBO!&#x27;)+&#x27; x&#x27;+mult;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }
  function doShake(){
    field.classList.remove(&#x27;shake&#x27;); void field.offsetWidth; field.classList.add(&#x27;shake&#x27;);
  }

  function burst(cx, cy, color){
    for (var i=0;i&lt;6;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      var sz=4+Math.random()*5;
      p.style.width=sz+&#x27;px&#x27;; p.style.height=sz+&#x27;px&#x27;; p.style.background=color;
      var startX=cx*CELL+CELL/2, startY=cy*CELL+CELL/2;
      p.style.left=startX+&#x27;px&#x27;; p.style.top=startY+&#x27;px&#x27;;
      field.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=20+Math.random()*40;
      var ex=startX+Math.cos(ang)*dist, ey=startY+Math.sin(ang)*dist;
      (function(el,ex,ey){
        el.animate([{transform:&#x27;translate(0,0)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+(ex-startX)+&#x27;px,&#x27;+(ey-startY)+&#x27;px)&#x27;,opacity:0}],{duration:450,easing:&#x27;ease-out&#x27;});
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },450);
      })(p,ex,ey);
    }
  }

  function makeCell(x,y,def,ghost){
    var el=document.createElement(&#x27;div&#x27;);
    el.className = ghost?&#x27;ghost&#x27;:&#x27;cell&#x27;;
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    if(!ghost){ el.style.background=def.color; el.style.boxShadow=&#x27;inset 0 0 8px rgba(255,255,255,.7)&#x27;; el.textContent=def.emoji; }
    field.appendChild(el);
  }

  function paint(){
    // remove only cells/ghost, keep combo &amp; over
    var kids=field.querySelectorAll(&#x27;.cell,.ghost&#x27;);
    for(var i=0;i&lt;kids.length;i++) kids[i].remove();
    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) makeCell(c,r,grid[r][c],false);
    if (piece){
      var gy=ghostY();
      var gcs=absCells(piece,0,gy);
      for(var i=0;i&lt;gcs.length;i++) if(gcs[i].y&gt;=0) makeCell(gcs[i].x,gcs[i].y,null,true);
      var cs=absCells(piece);
      for(var i=0;i&lt;cs.length;i++) if(cs[i].y&gt;=0) makeCell(cs[i].x,cs[i].y,{color:piece.color,emoji:piece.emoji},false);
    }
  }

  function stepDown(){
    if(!piece) return;
    if (collides(piece,0,1)){ lockPiece(); clearFullRows(); if(!spawnPiece()){ endGame(); paint(); return; } }
    else piece.y++;
    paint();
  }
  function softDrop(){ if(running) stepDown(); }
  function hardDrop(){ if(!running||!piece) return; piece.y+=ghostY(); stepDown(); }
  function move(dx){ if(!running||!piece) return; if(!collides(piece,dx,0)){ piece.x+=dx; paint(); } }
  function rotate(){
    if(!running||!piece) return;
    var nc=rot(piece.cells);
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){ if(!collides(piece,kicks[k],0,nc)){ piece.cells=nc; piece.x+=kicks[k]; paint(); return; } }
  }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} overEl.style.display=&#x27;flex&#x27;; }

  function startGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
    score=0; scoreEl.textContent=&#x27;0&#x27;; DROP_MS=550;
    overEl.style.display=&#x27;none&#x27;;
    newGrid();
    if(!spawnPiece()) return;
    paint();
    running=true;
    dropId=setInterval(stepDown, DROP_MS);
  }
  function stopGame(){ if(!running) return; running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ softDrop(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if(e.key===&#x27; &#x27;){ hardDrop(); e.preventDefault(); }
  });
  document.getElementById(&#x27;btnL&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(-1); });
  document.getElementById(&#x27;btnR&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(1); });
  document.getElementById(&#x27;btnRot&#x27;).addEventListener(&#x27;click&#x27;, rotate);
  document.getElementById(&#x27;btnDown&#x27;).addEventListener(&#x27;click&#x27;, softDrop);
  document.getElementById(&#x27;btnHard&#x27;).addEventListener(&#x27;click&#x27;, hardDrop);

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static preview
  newGrid();
  piece = { type:&#x27;T&#x27;, color:TYPES.T.color, emoji:TYPES.T.emoji, cells:TYPES.T.cells.map(function(c){return c.slice();}), x:3, y:2 };
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
