  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #e8e8ff; overflow: hidden; }

       background: linear-gradient(90deg,#4af,#f4a,#4fa); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(90,120,255,.3); }
  .instructions { font-size: 16px; color: #9aa0d0; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }

  .hud .tmr { color: #ff9; text-shadow: 0 0 8px rgba(255,255,120,.5); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse left and right to slide the paddle and bounce the ball into the bricks. Catch falling power-ups and destroy as many bricks as you can before the 60-second timer runs out.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lbl&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tmr&quot;&gt;TIME &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span style=&quot;color:#5bd&quot;&gt;&lt;b&gt;◈&lt;/b&gt; Wide&lt;/span&gt;
    &lt;span style=&quot;color:#f93&quot;&gt;&lt;b&gt;✦&lt;/b&gt; Fireball&lt;/span&gt;
    &lt;span style=&quot;color:#5f8&quot;&gt;&lt;b&gt;❉&lt;/b&gt; Split&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 640, H = 440;
  var scoreEl = document.getElementById(&#x27;score&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);

  var running = false, animId = null;
  var score = 0, timeLeft = 60, lastTs = 0, timerAcc = 0;
  var gameOver = false;

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch(_) {}
  }

  // Paddle
  var basePW = 96, PW = 96, PH = 13, PY = H - 26, PX = (W-PW)/2;
  var targetPX = PX;

  // Balls
  var balls = [];
  function newBall(x, y, vx, vy) { return {x:x, y:y, vx:vx, vy:vy, trail:[]}; }
  var BALL_R = 7, BASE_SPEED = 4.4;

  // Bricks
  var bricks = [];
  var COLORS = [&#x27;#ff4d6d&#x27;,&#x27;#ff924d&#x27;,&#x27;#ffe14d&#x27;,&#x27;#4dff8f&#x27;,&#x27;#4dc9ff&#x27;,&#x27;#9d4dff&#x27;];
  var BCOLS = 10, BW = 56, BH = 20, BGAP = 4, BTOP = 40, BLEFT;
  var powerTypes = [&#x27;wide&#x27;,&#x27;fire&#x27;,&#x27;split&#x27;];

  // Effects
  var particles = [];
  var capsules = [];
  var floaters = [];
  var fireTimer = 0;      // ball fireball mode
  var flash = 0;          // screen flash intensity

  // Stars
  var stars = [];
  function initStars() {
    stars = [];
    for (var i=0;i&lt;70;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.8+0.4, sp:Math.random()*0.4+0.15});
  }

  function buildBricks() {
    bricks = [];
    var rows = 5;
    BLEFT = (W - (BCOLS*BW + (BCOLS-1)*BGAP))/2;
    for (var r=0;r&lt;rows;r++) {
      for (var c=0;c&lt;BCOLS;c++) {
        // fun pattern: skip corners of top/bottom rows a touch
        var b = {
          x: BLEFT + c*(BW+BGAP),
          y: BTOP + r*(BH+BGAP),
          alive: true,
          color: COLORS[r % COLORS.length],
          row: r,
          power: (Math.random() &lt; 0.14) ? powerTypes[Math.floor(Math.random()*3)] : null,
          flash: 0
        };
        bricks.push(b);
      }
    }
  }

  function reset() {
    score = 0; timeLeft = 60; timerAcc = 0; gameOver = false; flash = 0;
    PW = basePW; PX = (W-PW)/2; targetPX = PX; fireTimer = 0;
    balls = [newBall(W/2, PY-30, (Math.random()&lt;0.5?-1:1)*BASE_SPEED*0.6, -BASE_SPEED)];
    particles = []; capsules = []; floaters = [];
    buildBricks(); initStars();
    scoreEl.textContent = &#x27;0&#x27;; timeEl.textContent = &#x27;60&#x27;;
  }

  function shatter(b) {
    for (var i=0;i&lt;10;i++) {
      particles.push({
        x: b.x+BW/2, y: b.y+BH/2,
        vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
        life: 1, color: b.color, s: Math.random()*3+1
      });
    }
  }

  function spawnCapsule(b) {
    capsules.push({x: b.x+BW/2, y: b.y+BH/2, type: b.power, life: 1});
  }

  function floatText(txt, x, y, color) {
    floaters.push({txt:txt, x:x, y:y, life:1, color:color});
  }

  function checkRowClear(row) {
    var any = false;
    for (var i=0;i&lt;bricks.length;i++) if (bricks[i].row===row &amp;&amp; bricks[i].alive) { any=true; break; }
    if (!any) {
      score += 100;
      floatText(&#x27;+COMBO! ROW CLEAR&#x27;, W/2, BTOP + row*(BH+BGAP) + BH, &#x27;#ffe14d&#x27;);
      beep(660, 0.25, &#x27;triangle&#x27;, 0.1);
      beep(880, 0.25, &#x27;triangle&#x27;, 0.08);
    }
  }

  function applyPower(type) {
    beep(520, 0.2, &#x27;square&#x27;, 0.1);
    if (type === &#x27;wide&#x27;) {
      PW = Math.min(basePW*1.7, 170);
      floatText(&#x27;WIDE PADDLE&#x27;, W/2, PY-20, &#x27;#5bd&#x27;);
    } else if (type === &#x27;fire&#x27;) {
      fireTimer = 6; // seconds
      floatText(&#x27;FIREBALL!&#x27;, W/2, PY-20, &#x27;#f93&#x27;);
    } else if (type === &#x27;split&#x27;) {
      var add = [];
      balls.forEach(function(bl){
        if (balls.length + add.length &lt; 5) {
          add.push(newBall(bl.x, bl.y, -bl.vx, bl.vy));
        }
      });
      balls = balls.concat(add);
      floatText(&#x27;SPLIT BALL&#x27;, W/2, PY-20, &#x27;#5f8&#x27;);
    }
  }

  function loseBall(bl) {
    balls.splice(balls.indexOf(bl),1);
    if (balls.length === 0) {
      flash = 1;
      balls = [newBall(W/2, PY-30, (Math.random()&lt;0.5?-1:1)*BASE_SPEED*0.6, -BASE_SPEED)];
      beep(160, 0.3, &#x27;sawtooth&#x27;, 0.09);
    }
  }

  function update(dt) {
    // stars
    for (var i=0;i&lt;stars.length;i++){
      stars[i].y += stars[i].sp;
      if (stars[i].y &gt; H) { stars[i].y = 0; stars[i].x = Math.random()*W; }
    }

    if (!gameOver) {
      // timer
      timerAcc += dt;
      if (timerAcc &gt;= 1) { timeLeft -= Math.floor(timerAcc); timerAcc -= Math.floor(timerAcc); if (timeLeft &lt; 0) timeLeft = 0; timeEl.textContent = timeLeft; }
      if (timeLeft &lt;= 0) { gameOver = true; beep(220,0.6,&#x27;sine&#x27;,0.1); }

      // paddle follow
      PX += (targetPX - PX) * 0.35;
      PX = Math.max(0, Math.min(W-PW, PX));

      // fireball timer
      if (fireTimer &gt; 0) { fireTimer -= dt; if (fireTimer &lt; 0) fireTimer = 0; }

      // balls
      for (var bi = balls.length-1; bi &gt;= 0; bi--) {
        var bl = balls[bi];
        bl.trail.push({x:bl.x, y:bl.y});
        if (bl.trail.length &gt; 8) bl.trail.shift();
        bl.x += bl.vx; bl.y += bl.vy;

        if (bl.x &lt; BALL_R) { bl.x = BALL_R; bl.vx = -bl.vx; }
        if (bl.x &gt; W-BALL_R) { bl.x = W-BALL_R; bl.vx = -bl.vx; }
        if (bl.y &lt; BALL_R) { bl.y = BALL_R; bl.vy = -bl.vy; }

        // paddle
        if (bl.vy &gt; 0 &amp;&amp; bl.y+BALL_R &gt;= PY &amp;&amp; bl.y+BALL_R &lt;= PY+PH+8 &amp;&amp;
            bl.x &gt;= PX-BALL_R &amp;&amp; bl.x &lt;= PX+PW+BALL_R) {
          bl.vy = -Math.abs(bl.vy);
          bl.y = PY - BALL_R;
          var rel = (bl.x - (PX+PW/2))/(PW/2);
          bl.vx = rel * BASE_SPEED * 1.1;
          var sp = Math.sqrt(bl.vx*bl.vx + bl.vy*bl.vy);
          var tgt = BASE_SPEED;
          bl.vx = bl.vx/sp*tgt; bl.vy = bl.vy/sp*tgt;
          beep(440, 0.06, &#x27;square&#x27;, 0.06);
        }

        // brick collisions
        for (var k=0;k&lt;bricks.length;k++) {
          var b = bricks[k];
          if (!b.alive) continue;
          if (bl.x &gt; b.x-BALL_R &amp;&amp; bl.x &lt; b.x+BW+BALL_R &amp;&amp;
              bl.y &gt; b.y-BALL_R &amp;&amp; bl.y &lt; b.y+BH+BALL_R) {
            b.alive = false;
            score += 10;
            shatter(b);
            beep(300 + b.row*60, 0.05, &#x27;triangle&#x27;, 0.06);
            if (b.power) spawnCapsule(b);
            if (fireTimer &gt; 0) {
              // fireball plows through, no bounce
            } else {
              // simple bounce (vertical)
              bl.vy = -bl.vy;
            }
            checkRowClear(b.row);
            break;
          }
        }

        if (bl.y &gt; H + 20) loseBall(bl);
      }

      // all bricks cleared -&gt; rebuild
      var alive = false;
      for (var q=0;q&lt;bricks.length;q++) if (bricks[q].alive){alive=true;break;}
      if (!alive) { score += 200; floatText(&#x27;+STAGE CLEAR!&#x27;, W/2, H/2, &#x27;#4dff8f&#x27;); buildBricks(); }

      // capsules
      for (var ci=capsules.length-1; ci&gt;=0; ci--) {
        var cap = capsules[ci];
        cap.y += 1.6;
        if (cap.y &gt; PY-4 &amp;&amp; cap.y &lt; PY+PH+6 &amp;&amp; cap.x &gt; PX &amp;&amp; cap.x &lt; PX+PW) {
          applyPower(cap.type); capsules.splice(ci,1); continue;
        }
        if (cap.y &gt; H) capsules.splice(ci,1);
      }

      scoreEl.textContent = score;
    }

    // particles
    for (var pi=particles.length-1; pi&gt;=0; pi--) {
      var p = particles[pi];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.03;
      if (p.life &lt;= 0) particles.splice(pi,1);
    }
    // floaters
    for (var fi=floaters.length-1; fi&gt;=0; fi--) {
      floaters[fi].y -= 0.6; floaters[fi].life -= 0.012;
      if (floaters[fi].life &lt;= 0) floaters.splice(fi,1);
    }
    if (flash &gt; 0) flash -= 0.05;
  }

  function draw() {
    ctx.fillStyle = &#x27;#05030f&#x27;;
    ctx.fillRect(0,0,W,H);

    // stars
    for (var i=0;i&lt;stars.length;i++){
      ctx.globalAlpha = 0.4 + stars[i].s/3;
      ctx.fillStyle = &#x27;#cdd6ff&#x27;;
      ctx.fillRect(stars[i].x, stars[i].y, stars[i].s, stars[i].s);
    }
    ctx.globalAlpha = 1;

    // bricks
    for (var k=0;k&lt;bricks.length;k++) {
      var b = bricks[k];
      if (!b.alive) continue;
      ctx.shadowColor = b.color; ctx.shadowBlur = 8;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, BW, BH);
      ctx.shadowBlur = 0;
      if (b.power) {
        ctx.fillStyle = &#x27;rgba(255,255,255,.9)&#x27;;
        ctx.font = &#x27;13px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
        var icon = b.power===&#x27;wide&#x27;?&#x27;◈&#x27;:(b.power===&#x27;fire&#x27;?&#x27;✦&#x27;:&#x27;❉&#x27;);
        ctx.fillText(icon, b.x+BW/2, b.y+BH/2);
      }
    }

    // capsules
    for (var ci=0;ci&lt;capsules.length;ci++) {
      var cap = capsules[ci];
      var col = cap.type===&#x27;wide&#x27;?&#x27;#5bd&#x27;:(cap.type===&#x27;fire&#x27;?&#x27;#f93&#x27;:&#x27;#5f8&#x27;);
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(cap.x, cap.y, 11, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;#fff&#x27;; ctx.font=&#x27;11px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(cap.type===&#x27;wide&#x27;?&#x27;◈&#x27;:(cap.type===&#x27;fire&#x27;?&#x27;✦&#x27;:&#x27;❉&#x27;), cap.x, cap.y);
    }

    // particles
    for (var pi=0;pi&lt;particles.length;pi++) {
      var p = particles[pi];
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // balls + trails
    var fire = fireTimer &gt; 0;
    for (var bi=0;bi&lt;balls.length;bi++) {
      var bl = balls[bi];
      for (var t=0;t&lt;bl.trail.length;t++) {
        var tr = bl.trail[t];
        ctx.globalAlpha = (t/bl.trail.length)*0.5;
        ctx.fillStyle = fire ? &#x27;#f93&#x27; : &#x27;#8cf&#x27;;
        ctx.beginPath(); ctx.arc(tr.x, tr.y, BALL_R*(t/bl.trail.length), 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowColor = fire ? &#x27;#f93&#x27; : &#x27;#8cf&#x27;; ctx.shadowBlur = 16;
      ctx.fillStyle = fire ? &#x27;#ffb14d&#x27; : &#x27;#fff&#x27;;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, BALL_R, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // paddle
    var pgrad = ctx.createLinearGradient(PX,0,PX+PW,0);
    pgrad.addColorStop(0,&#x27;#4af&#x27;); pgrad.addColorStop(0.5,&#x27;#8ff&#x27;); pgrad.addColorStop(1,&#x27;#4af&#x27;);
    ctx.shadowColor = &#x27;#6cf&#x27;; ctx.shadowBlur = 18;
    ctx.fillStyle = pgrad;
    roundRect(PX, PY, PW, PH, 6); ctx.fill();
    ctx.shadowBlur = 0;

    // floaters
    for (var fi=0;fi&lt;floaters.length;fi++) {
      var f = floaters[fi];
      ctx.globalAlpha = Math.max(0,f.life);
      ctx.fillStyle = f.color;
      ctx.font = &#x27;bold 18px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.shadowColor = f.color; ctx.shadowBlur = 10;
      ctx.fillText(f.txt, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    // flash
    if (flash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(255,120,120,&#x27;+(flash*0.4)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
    }

    // fireball indicator bar
    if (fire) {
      ctx.fillStyle = &#x27;rgba(255,150,60,.8)&#x27;;
      ctx.fillRect(0, 0, W*(fireTimer/6), 3);
    }

    // game over
    if (gameOver) {
      ctx.fillStyle = &#x27;rgba(5,3,15,0.72)&#x27;;
      ctx.fillRect(0,0,W,H);
      var pulse = 1 + Math.sin(Date.now()/300)*0.06;
      ctx.save();
      ctx.translate(W/2, H/2);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = &#x27;#4dff8f&#x27;; ctx.font = &#x27;bold 30px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.shadowColor = &#x27;#4dff8f&#x27;; ctx.shadowBlur = 20;
      ctx.fillText(&quot;TIME&#x27;S UP!&quot;, 0, -24);
      ctx.fillStyle = &#x27;#fff&#x27;; ctx.font = &#x27;bold 26px sans-serif&#x27;;
      ctx.fillText(&#x27;FINAL SCORE: &#x27; + score, 0, 18);
      ctx.restore();
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;#9aa0d0&#x27;; ctx.font = &#x27;15px sans-serif&#x27;;
      ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2 + 56);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min((ts - lastTs)/1000, 0.05);
    lastTs = ts;
    update(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    reset();
    running = true; lastTs = 0;
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  // mouse control
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W/rect.width);
    targetPX = mx - PW/2;
  });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){
    if (!e.touches[0]) return;
    var rect = cv.getBoundingClientRect();
    var mx = (e.touches[0].clientX - rect.left) * (W/rect.width);
    targetPX = mx - PW/2;
    e.preventDefault();
  }, {passive:false});

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static render
  reset(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry

<script>
(function () {
  var iframe = document.getElementById('game');

  var stopBtn = document.getElementById('stop');

  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
