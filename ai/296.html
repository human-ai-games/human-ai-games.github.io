<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#ff0); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,0,255,.4); }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; }
  .lcd { font-family: &quot;Courier New&quot;, monospace; font-weight: bold; font-size: 22px; color: #4f8;
         background: #021a10; border: 2px solid #0a5; border-radius: 6px; padding: 4px 12px;
         box-shadow: inset 0 0 10px rgba(0,255,100,.3), 0 0 8px rgba(0,255,100,.2); text-shadow: 0 0 6px #0f6; }
  .lcd small { color: #396; font-size: 12px; display: block; letter-spacing: 1px; }
  #wrap { position: relative; width: 620px; height: 440px; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 30px rgba(80,0,180,.5); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC SURF ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click) to fire your thrusters and arc over the asteroids. Chain 5 clean dodges for a rainbow combo bonus — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lcd&quot;&gt;&lt;small&gt;SCORE&lt;/small&gt;&lt;span id=&quot;score&quot;&gt;000000&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lcd&quot;&gt;&lt;small&gt;COMBO&lt;/small&gt;&lt;span id=&quot;combo&quot;&gt;x0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lcd&quot;&gt;&lt;small&gt;BEST&lt;/small&gt;&lt;span id=&quot;best&quot;&gt;000000&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 440, WAVE_Y = 380;
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);

  var running=false, animId=null, best=0;
  var shipX=110, shipY, shipVY, shipSize=20;
  var GRAVITY=0.55, JUMP_V=-11;
  var obstacles=[], sparks=[], floats=[], rings=[], trail=[];
  var score, combo, gameOver, shake, waveT, flashT, deathT;
  var baseSpeed, spawnDist, distSinceSpawn;
  var stars=[[],[],[]];

  // audio
  var actx=null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ actx=null; } } return actx; }
  function beep(freq,dur,type,vol){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
    g.gain.value=vol||0.15;
    o.connect(g); g.connect(a.destination);
    var t=a.currentTime; o.start(t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.stop(t+dur);
  }
  function noiseBurst(dur,vol){
    var a=ac(); if(!a) return;
    var n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i&lt;n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var src=a.createBufferSource(); src.buffer=buf;
    var g=a.createGain(); g.gain.value=vol||0.4;
    src.connect(g); g.connect(a.destination); src.start();
  }

  function initStars(){
    stars=[[],[],[]];
    var counts=[40,30,20], speeds=[0.4,0.9,1.6], sizes=[1,1.6,2.4];
    for(var l=0;l&lt;3;l++){
      for(var i=0;i&lt;counts[l];i++){
        stars[l].push({x:Math.random()*W,y:Math.random()*WAVE_Y,s:speeds[l],r:sizes[l]});
      }
    }
  }

  function fmt(n){ n=Math.floor(n); var s=&#x27;&#x27;+n; while(s.length&lt;6)s=&#x27;0&#x27;+s; return s; }

  function reset(){
    score=0; combo=0; gameOver=false; shake=0; waveT=0; flashT=0; deathT=0;
    baseSpeed=3.2; spawnDist=300; distSinceSpawn=999;
    shipX=110; shipY=WAVE_Y-shipSize; shipVY=0;
    obstacles=[]; sparks=[]; floats=[]; rings=[]; trail=[];
    initStars();
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent=fmt(score);
    comboEl.textContent=&#x27;x&#x27;+combo;
    bestEl.textContent=fmt(best);
  }

  function waveHeight(x){
    // undulating neon wave
    return WAVE_Y + Math.sin((x*0.02)+waveT)*6 + Math.sin((x*0.05)-waveT*1.3)*3;
  }

  function jump(){
    if(!running||gameOver) return;
    var floorY=WAVE_Y-shipSize;
    if(shipY&gt;=floorY-2){
      shipVY=JUMP_V;
      beep(660,0.15,&#x27;triangle&#x27;,0.12);
      noiseBurst(0.12,0.15);
      // thruster sparks
      for(var i=0;i&lt;14;i++){
        sparks.push({
          x:shipX-shipSize*0.4, y:shipY+shipSize*0.5,
          vx:-(1.5+Math.random()*3), vy:(Math.random()-0.5)*2+1,
          life:1, r:1.5+Math.random()*2.5,
          c:Math.random()&lt;0.5?&#x27;#ff8800&#x27;:&#x27;#ffcc22&#x27;
        });
      }
    }
  }

  function spawnObstacle(){
    var heights=[26,42,60];
    var h=heights[(Math.random()*3)|0];
    obstacles.push({x:W+30,h:h,w:26,scored:false,
      rot:Math.random()*Math.PI, spin:(Math.random()-0.5)*0.06,
      seed:Math.random()*100});
  }

  function drawAsteroid(o){
    var cx=o.x+o.w/2, cy=waveHeight(o.x+o.w/2)-o.h/2;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(o.rot);
    var R=o.h/2;
    ctx.beginPath();
    for(var a=0;a&lt;Math.PI*2;a+=Math.PI/6){
      var wob=0.75+0.3*Math.sin(a*3+o.seed);
      var px=Math.cos(a)*R*wob, py=Math.sin(a)*R*wob;
      if(a===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    var g=ctx.createRadialGradient(-R*0.3,-R*0.3,2,0,0,R);
    g.addColorStop(0,&#x27;#8a7a6a&#x27;); g.addColorStop(1,&#x27;#3a2f28&#x27;);
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle=&#x27;rgba(255,150,80,.5)&#x27;; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }

  function drawShip(){
    var comboActive=combo&gt;=5;
    var floorY=WAVE_Y-shipSize;
    var bob = (shipY&gt;=floorY-2)? Math.sin(waveT*2)*2 : 0;
    var y=shipY+bob;
    var col = deathT&gt;0 ? &#x27;#ff3030&#x27; : &#x27;#3ff&#x27;;

    // rainbow trail
    if(comboActive){
      for(var i=0;i&lt;trail.length;i++){
        var t=trail[i];
        ctx.beginPath();
        ctx.arc(t.x,t.y,shipSize*0.6*(i/trail.length),0,Math.PI*2);
        ctx.fillStyle=&#x27;hsla(&#x27;+((waveT*60+i*20)%360)+&#x27;,100%,60%,&#x27;+(i/trail.length*0.4)+&#x27;)&#x27;;
        ctx.fill();
      }
    }

    ctx.save();
    ctx.translate(shipX,y);
    // pulsing halo
    var pulse=0.6+0.4*Math.sin(waveT*3);
    var hg=ctx.createRadialGradient(0,0,shipSize*0.4,0,0,shipSize*2);
    hg.addColorStop(0, deathT&gt;0?&#x27;rgba(255,60,60,&#x27;+(0.5*pulse)+&#x27;)&#x27;:&#x27;rgba(60,255,255,&#x27;+(0.5*pulse)+&#x27;)&#x27;);
    hg.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
    ctx.fillStyle=hg;
    ctx.beginPath(); ctx.arc(0,0,shipSize*2,0,Math.PI*2); ctx.fill();
    // body oval
    ctx.beginPath();
    ctx.ellipse(0,0,shipSize,shipSize*0.6,0,0,Math.PI*2);
    var bg=ctx.createLinearGradient(0,-shipSize,0,shipSize);
    bg.addColorStop(0,&#x27;#fff&#x27;); bg.addColorStop(0.5,col); bg.addColorStop(1,&#x27;#036&#x27;);
    ctx.fillStyle=bg; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    // cockpit
    ctx.beginPath(); ctx.ellipse(shipSize*0.3,-shipSize*0.1,shipSize*0.35,shipSize*0.25,0,0,Math.PI*2);
    ctx.fillStyle=&#x27;rgba(255,255,255,.8)&#x27;; ctx.fill();
    ctx.restore();
  }

  function drawWave(){
    ctx.beginPath();
    ctx.moveTo(0,H);
    for(var x=0;x&lt;=W;x+=6){ ctx.lineTo(x,waveHeight(x)); }
    ctx.lineTo(W,H); ctx.closePath();
    var g=ctx.createLinearGradient(0,WAVE_Y-20,0,H);
    g.addColorStop(0,&#x27;rgba(180,0,255,.35)&#x27;); g.addColorStop(1,&#x27;rgba(20,0,60,.1)&#x27;);
    ctx.fillStyle=g; ctx.fill();
    // neon crest line
    ctx.beginPath();
    for(var x2=0;x2&lt;=W;x2+=6){ var yy=waveHeight(x2); if(x2===0)ctx.moveTo(x2,yy);else ctx.lineTo(x2,yy); }
    ctx.strokeStyle=&#x27;#c0f&#x27;; ctx.lineWidth=2.5; ctx.shadowColor=&#x27;#e0f&#x27;; ctx.shadowBlur=12;
    ctx.stroke(); ctx.shadowBlur=0;
  }

  function tick(){
    if(!running) return;
    waveT+=0.04;

    var sx=0, sy=0;
    if(shake&gt;0){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; shake*=0.88; if(shake&lt;0.4)shake=0; }

    ctx.save();
    ctx.translate(sx,sy);

    // background
    ctx.fillStyle=&#x27;#05010f&#x27;; ctx.fillRect(-10,-10,W+20,H+20);
    // nebula glow
    var ng=ctx.createRadialGradient(W*0.7,120,20,W*0.7,120,300);
    ng.addColorStop(0,&#x27;rgba(80,0,120,.25)&#x27;); ng.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
    ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);

    // parallax stars
    var speed = (deathT&gt;0?0:baseSpeed);
    for(var l=0;l&lt;3;l++){
      var col=l===0?&#x27;rgba(150,150,255,.6)&#x27;:l===1?&#x27;rgba(200,220,255,.8)&#x27;:&#x27;#fff&#x27;;
      ctx.fillStyle=col;
      for(var i=0;i&lt;stars[l].length;i++){
        var st=stars[l][i];
        if(running &amp;&amp; deathT&lt;=0) st.x-=st.s*(speed/3.2);
        if(st.x&lt;0){ st.x=W; st.y=Math.random()*WAVE_Y; }
        ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
      }
    }

    drawWave();

    // physics
    if(deathT&lt;=0){
      shipVY+=GRAVITY; shipY+=shipVY;
      var floorY=WAVE_Y-shipSize;
      if(shipY&gt;floorY){ shipY=floorY; shipVY=0; }
      if(shipY&lt;0){ shipY=0; shipVY=0; }

      // difficulty scaling
      baseSpeed=3.2+Math.min(4, score*0.03);
      spawnDist=Math.max(170, 300-score*1.5);

      distSinceSpawn+=baseSpeed;
      if(distSinceSpawn&gt;=spawnDist){ spawnObstacle(); distSinceSpawn=0; }

      // trail record
      if(combo&gt;=5){
        trail.push({x:shipX,y:shipY});
        if(trail.length&gt;12) trail.shift();
      } else if(trail.length){ trail.shift(); }

      for(var oi=obstacles.length-1;oi&gt;=0;oi--){
        var o=obstacles[oi];
        o.x-=baseSpeed; o.rot+=o.spin;
        if(o.x+o.w&lt;-40){ obstacles.splice(oi,1); continue; }
        if(!o.scored &amp;&amp; o.x+o.w&lt;shipX-shipSize){
          o.scored=true; score+=1; combo+=1;
          floats.push({x:shipX,y:shipY-20,life:1,txt:&#x27;+1&#x27;});
          beep(880,0.08,&#x27;square&#x27;,0.08);
          if(combo&gt;0 &amp;&amp; combo%5===0){
            score+=10;
            floats.push({x:shipX,y:shipY-40,life:1.4,txt:&#x27;COMBO +10!&#x27;,rainbow:true});
            beep(1200,0.2,&#x27;sawtooth&#x27;,0.12);
            beep(1600,0.25,&#x27;sawtooth&#x27;,0.1);
          }
          updateHUD();
        }
        // collision
        var acx=o.x+o.w/2, acy=waveHeight(o.x+o.w/2)-o.h/2, ar=o.h*0.45;
        var dx=shipX-acx, dy=shipY-acy, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist&lt;ar+shipSize*0.6){
          triggerCrash(acx,acy);
        }
      }
    } else {
      deathT--;
      if(deathT&lt;=0){ endGame(); }
    }

    // draw asteroids
    for(var d=0;d&lt;obstacles.length;d++) drawAsteroid(obstacles[d]);

    // sparks
    for(var s=sparks.length-1;s&gt;=0;s--){
      var sp=sparks[s];
      sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.15; sp.life-=0.04;
      if(sp.life&lt;=0){ sparks.splice(s,1); continue; }
      ctx.globalAlpha=sp.life; ctx.fillStyle=sp.c;
      ctx.beginPath(); ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }

    // rings (shockwave)
    for(var r=rings.length-1;r&gt;=0;r--){
      var rg=rings[r]; rg.rad+=6; rg.life-=0.03;
      if(rg.life&lt;=0){ rings.splice(r,1); continue; }
      ctx.globalAlpha=rg.life; ctx.strokeStyle=&#x27;#ff5555&#x27;; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.rad,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }

    drawShip();

    // floats
    for(var f=floats.length-1;f&gt;=0;f--){
      var fl=floats[f]; fl.y-=1; fl.life-=0.02;
      if(fl.life&lt;=0){ floats.splice(f,1); continue; }
      ctx.globalAlpha=Math.min(1,fl.life);
      ctx.font=&#x27;bold &#x27;+(fl.rainbow?18:16)+&#x27;px Courier New&#x27;;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillStyle=fl.rainbow?&#x27;hsl(&#x27;+((waveT*120)%360)+&#x27;,100%,60%)&#x27;:&#x27;#4f8&#x27;;
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
      ctx.fillText(fl.txt,fl.x,fl.y);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }

    ctx.restore();

    // screen flash
    if(flashT&gt;0){
      ctx.fillStyle=&#x27;rgba(255,80,80,&#x27;+(flashT*0.5)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H); flashT-=0.06;
    }

    animId=requestAnimationFrame(tick);
  }

  function triggerCrash(cx,cy){
    if(deathT&gt;0) return;
    deathT=45; shake=18; flashT=1;
    combo=0; updateHUD();
    rings.push({x:shipX,y:shipY,rad:8,life:1});
    for(var i=0;i&lt;30;i++){
      sparks.push({x:shipX,y:shipY,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,
        life:1,r:2+Math.random()*3,c:Math.random()&lt;0.5?&#x27;#f33&#x27;:&#x27;#fa0&#x27;});
    }
    beep(120,0.4,&#x27;sawtooth&#x27;,0.2);
    noiseBurst(0.4,0.4);
  }

  function endGame(){
    gameOver=true;
    if(score&gt;best){ best=score; }
    updateHUD();
    stopGame();
    // draw final frame with GAME OVER
    ctx.fillStyle=&#x27;rgba(0,0,0,.55)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.textAlign=&#x27;center&#x27;;
    ctx.font=&#x27;bold 34px Courier New&#x27;;
    ctx.fillStyle=&#x27;#f55&#x27;; ctx.shadowColor=&#x27;#f00&#x27;; ctx.shadowBlur=16;
    ctx.fillText(&#x27;GAME OVER&#x27;,W/2,H/2-10);
    ctx.shadowBlur=0;
    ctx.font=&#x27;16px Courier New&#x27;; ctx.fillStyle=&#x27;#9ad&#x27;;
    ctx.fillText(&#x27;Score &#x27;+fmt(score)+&#x27;   •   Press Start to surf again&#x27;,W/2,H/2+24);
  }

  function drawIdle(){
    ctx.fillStyle=&#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
    for(var l=0;l&lt;3;l++){
      var col=l===0?&#x27;rgba(150,150,255,.5)&#x27;:l===1?&#x27;rgba(200,220,255,.7)&#x27;:&#x27;#fff&#x27;;
      ctx.fillStyle=col;
      for(var i=0;i&lt;stars[l].length;i++){ var st=stars[l][i]; ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill(); }
    }
    drawWave();
    drawShip();
    ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;16px Courier New&#x27;; ctx.fillStyle=&#x27;#6cf&#x27;;
    ctx.fillText(&#x27;Press Start to launch&#x27;, W/2, 60);
  }

  function startGame(){
    if(running) return;
    reset();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;click&#x27;,function(){ jump(); });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  initStars();
  reset();
  drawIdle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
