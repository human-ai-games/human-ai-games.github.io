&lt;html&gt;&lt;head&gt;&lt;style&gt;

  &lt;h1&gt;🐸 Froggy Fiesta 🎉&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop the frog to the golden lily pad at the top, dodging tacos, piñatas, mariachis and chili cars. Use arrow keys or swipe on the field — quick back-to-back crossings build a combo!&lt;/p&gt;

&lt;script&gt;
  var CELL = 48, COLS = 12, LANES = 7, ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [], score = 0, best = 0, speedMul = 1;
  var comboCount = 0, lastCrossTime = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var starsEl = document.getElementById(&#x27;stars&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var heroEl = null;

  // Lane themes: emoji + background color
  var THEMES = [
    { emoji:&#x27;🌮&#x27;, bg:&#x27;#c0392b&#x27;, w:2 },
    { emoji:&#x27;🎉&#x27;, bg:&#x27;#8e44ad&#x27;, w:1 },
    { emoji:&#x27;🌶️&#x27;, bg:&#x27;#27ae60&#x27;, w:1 },
    { emoji:&#x27;🎺&#x27;, bg:&#x27;#e67e22&#x27;, w:1 },
    { emoji:&#x27;🌮&#x27;, bg:&#x27;#c0392b&#x27;, w:2 },
    { emoji:&#x27;🌶️&#x27;, bg:&#x27;#27ae60&#x27;, w:1 },
    { emoji:&#x27;🎉&#x27;, bg:&#x27;#8e44ad&#x27;, w:1 }
  ];

  function clearField() {
    // remove lane backgrounds and cells but keep flash/combo/overlay
    var kids = Array.prototype.slice.call(field.children);
    kids.forEach(function(k){
      if (k !== flash &amp;&amp; k !== comboEl &amp;&amp; k !== overlay) field.removeChild(k);
    });
    lanes = [];
  }

  function buildLanes() {
    clearField();
    // top safe row (lily pad)
    var topLane = document.createElement(&#x27;div&#x27;);
    topLane.className = &#x27;lane&#x27;;
    topLane.style.top = &#x27;0px&#x27;; topLane.style.height = CELL + &#x27;px&#x27;;
    topLane.style.background = &#x27;linear-gradient(#2e7d32,#1b5e20)&#x27;;
    field.appendChild(topLane);
    var pad = document.createElement(&#x27;div&#x27;);
    pad.className = &#x27;cell&#x27;;
    pad.textContent = &#x27;🪷&#x27;;
    pad.style.fontSize = &#x27;36px&#x27;;
    pad.style.width = CELL + &#x27;px&#x27;; pad.style.height = CELL + &#x27;px&#x27;;
    pad.style.left = (Math.floor(COLS/2)*CELL) + &#x27;px&#x27;; pad.style.top = &#x27;0px&#x27;;
    pad.style.filter = &#x27;drop-shadow(0 0 8px gold)&#x27;;
    field.appendChild(pad);

    // bottom safe row
    var botLane = document.createElement(&#x27;div&#x27;);
    botLane.className = &#x27;lane&#x27;;
    botLane.style.top = ((ROWS-1)*CELL) + &#x27;px&#x27;; botLane.style.height = CELL + &#x27;px&#x27;;
    botLane.style.background = &#x27;linear-gradient(#3d2b1f,#2a1810)&#x27;;
    field.appendChild(botLane);

    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var theme = THEMES[i % THEMES.length];
      var laneBg = document.createElement(&#x27;div&#x27;);
      laneBg.className = &#x27;lane&#x27;;
      laneBg.style.top = (laneRow*CELL) + &#x27;px&#x27;;
      laneBg.style.height = CELL + &#x27;px&#x27;;
      laneBg.style.background = theme.bg;
      laneBg.style.opacity = &#x27;0.85&#x27;;
      field.appendChild(laneBg);

      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = 0.7 + (i % 3) * 0.35;
      var obW = theme.w * CELL;
      var count = theme.w === 2 ? 2 : 3;
      var gap = FIELD_W / count;
      var obstacles = [];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i * 33) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;cell&#x27;;
        el.textContent = theme.emoji;
        el.style.width = obW + &#x27;px&#x27;;
        el.style.height = CELL + &#x27;px&#x27;;
        el.style.top = (laneRow*CELL) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        obstacles.push({ x:x, el:el });
      }
      lanes.push({ row:laneRow, dir:dir, speed:speed, w:obW, obstacles:obstacles });
    }

    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    heroEl.style.width = CELL + &#x27;px&#x27;; heroEl.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(heroEl);
    resetHero();
  }

  function paintHero() {
    heroEl.style.left = (hero.col*CELL) + &#x27;px&#x27;;
    heroEl.style.top = (hero.row*CELL) + &#x27;px&#x27;;
  }
  function resetHero() {
    hero.col = Math.floor(COLS/2); hero.row = ROWS-1;
    heroEl.textContent = &#x27;🐸&#x27;;
    paintHero();
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed * speedMul;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -lane.w;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + lane.w &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col*CELL, hw = CELL;
      var lane = lanes[laneIdx];
      for (var k = 0; k &lt; lane.obstacles.length; k++) {
        var o2 = lane.obstacles[k];
        if (hx &lt; o2.x + lane.w - 8 &amp;&amp; hx + hw - 8 &gt; o2.x) { hit(); return; }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function showCombo(txt, color) {
    comboEl.textContent = txt;
    comboEl.style.color = color;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth;
    comboEl.classList.add(&#x27;show&#x27;);
  }

  function hit() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    flash.classList.remove(&#x27;on&#x27;); void flash.offsetWidth; flash.classList.add(&#x27;on&#x27;);
    heroEl.textContent = &#x27;💀&#x27;;
    comboCount = 0;
    setTimeout(function(){
      resetHero();
      if (!running) { running = true; animId = requestAnimationFrame(tick); }
    }, 700);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS-1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS-1, hero.row + dr));
    paintHero();
    heroEl.classList.remove(&#x27;pop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;pop&#x27;);
    if (hero.row === 0) crossed();
  }

  function crossed() {
    var now = Date.now();
    if (now - lastCrossTime &lt; 4000) comboCount++; else comboCount = 1;
    lastCrossTime = now;
    var mult = comboCount &gt;= 3 ? 3 : (comboCount === 2 ? 2 : 1);
    score += mult;
    starsEl.textContent = &#x27;⭐ &#x27; + score;
    if (score &gt; best) { best = score; bestEl.textContent = &#x27;Best: &#x27; + best; }
    if (mult === 2) showCombo(&#x27;2× COMBO!&#x27;, &#x27;#ffd23f&#x27;);
    else if (mult === 3) showCombo(&#x27;3× FIESTA!&#x27;, &#x27;#ff4d6d&#x27;);
    speedMul += 0.12;
    resetHero();
  }

  function startGame() {
    if (running) return;
    score = 0; speedMul = 1; comboCount = 0; lastCrossTime = 0;
    starsEl.textContent = &#x27;⭐ 0&#x27;;
    overlay.style.display = &#x27;none&#x27;;
    buildLanes();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    overlay.textContent = &#x27;Paused — press Start to play again&#x27;;
    overlay.style.display = &#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });

  // Swipe / tap controls on the field
  var touchStart = null;
  function getPoint(e){
    if (e.touches &amp;&amp; e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
    return {x:e.clientX, y:e.clientY};
  }
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ touchStart = getPoint(e); }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    if (!touchStart) return;
    var end = (e.changedTouches &amp;&amp; e.changedTouches[0]) ? {x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY} : touchStart;
    handleSwipe(end.x-touchStart.x, end.y-touchStart.y); touchStart = null;
  });
  field.addEventListener(&#x27;mousedown&#x27;, function(e){ touchStart = getPoint(e); });
  field.addEventListener(&#x27;mouseup&#x27;, function(e){
    if (!touchStart) return;
    var end = getPoint(e);
    handleSwipe(end.x-touchStart.x, end.y-touchStart.y); touchStart = null;
  });
  function handleSwipe(dx, dy){
    if (Math.abs(dx) &lt; 12 &amp;&amp; Math.abs(dy) &lt; 12){ move(0,-1); return; } // tap = hop up
    if (Math.abs(dx) &gt; Math.abs(dy)) move(dx&gt;0?1:-1, 0);
    else move(0, dy&gt;0?1:-1);
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial static paint
  buildLanes();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
