<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #07021a; color: #eaeaff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff3df0,#3df0ff,#b13dff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(120,80,255,.4); }
  .instructions { font-size: 16px; color: #9aa0d8; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; align-items: center; width: 620px; font-size: 18px; }
  .hud .lives { font-size: 20px; letter-spacing: 2px; }
  .hud b { color: #3df0ff; }
  .mult { color: #ff3df0; font-weight: 700; }
  canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(90,50,200,.5); background: #05010f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse left and right to slide the paddle and bounce the energy orb into the alien bricks. Clear waves, chain combos, and keep the orb alive — use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt; &amp;nbsp; &lt;span class=&quot;mult&quot; id=&quot;mult&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

var running = false, animId = null;
var score, lives, wave, hitsSincePaddle, comboDisplay;
var paddle, ball, bricks, particles, stars, paddleHits, ballSpeed;

var PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 30;
var BALL_R = 8;
var COLORS = [
  {c:&#x27;#ff3df0&#x27;, pts:50},  // pink
  {c:&#x27;#3df0ff&#x27;, pts:40},  // cyan
  {c:&#x27;#b13dff&#x27;, pts:30},  // purple
  {c:&#x27;#3dff8f&#x27;, pts:20},  // green
  {c:&#x27;#ffd23d&#x27;, pts:10}   // yellow
];

function initStars() {
  stars = [];
  for (var i=0;i&lt;90;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.8+0.4, v:Math.random()*0.4+0.15});
}

function makeBricks(density) {
  bricks = [];
  var cols = 10, rows = Math.min(3 + density, 7);
  var pad = 6, top = 40;
  var bw = (W - pad*(cols+1)) / cols, bh = 20;
  for (var r=0; r&lt;rows; r++) {
    for (var c=0; c&lt;cols; c++) {
      // fun pattern: skip some to make diamond-ish shapes on later waves
      var skip = false;
      if (density&gt;=2) {
        var mid = cols/2 - 0.5;
        if (r===0 &amp;&amp; Math.abs(c-mid) &gt; 3.5) skip = true;
      }
      if (skip) continue;
      var col = COLORS[r % COLORS.length];
      bricks.push({
        x: pad + c*(bw+pad), y: top + r*(bh+pad),
        w: bw, h: bh, color: col.c, pts: col.pts, alive: true
      });
    }
  }
}

function resetBall() {
  ball = { x: W/2, y: PADDLE_Y - 20, vx: (Math.random()&lt;.5?-1:1)*3, vy: -ballSpeed, launched:false };
}

function spawnParticles(x,y,color,n) {
  for (var i=0;i&lt;n;i++){
    var a = Math.random()*Math.PI*2, sp = Math.random()*3+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function startGame() {
  score = 0; lives = 3; wave = 1; hitsSincePaddle = 0; paddleHits = 0;
  ballSpeed = 4; comboDisplay = {t:0, val:0};
  paddle = { x: W/2 - PADDLE_W/2 };
  particles = [];
  initStars();
  makeBricks(1);
  resetBall();
  updateHUD();
  running = true;
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function updateHUD() {
  scoreEl.textContent = score;
  multEl.textContent = &#x27;x&#x27; + Math.max(1, hitsSincePaddle);
  livesEl.textContent = &#x27;❤️&#x27;.repeat(Math.max(0,lives)) || &#x27;—&#x27;;
}

cv.addEventListener(&#x27;mousemove&#x27;, function(e){
  if (!running) return;
  var rect = cv.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = Math.max(0, Math.min(W - PADDLE_W, mx - PADDLE_W/2));
});

var gameOver = false, goFlash = 0;

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function update() {
  // stars
  for (var i=0;i&lt;stars.length;i++){ stars[i].y += stars[i].v; if(stars[i].y&gt;H){stars[i].y=0;stars[i].x=Math.random()*W;} }

  if (gameOver) { goFlash += 0.05; return; }

  ball.x += ball.vx; ball.y += ball.vy;

  if (ball.x - BALL_R &lt; 0){ ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x + BALL_R &gt; W){ ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - BALL_R &lt; 0){ ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

  // paddle collision
  if (ball.vy &gt; 0 &amp;&amp; ball.y + BALL_R &gt;= PADDLE_Y &amp;&amp; ball.y + BALL_R &lt;= PADDLE_Y + PADDLE_H + 10 &amp;&amp;
      ball.x &gt;= paddle.x &amp;&amp; ball.x &lt;= paddle.x + PADDLE_W) {
    var rel = (ball.x - (paddle.x + PADDLE_W/2)) / (PADDLE_W/2);
    var speed = Math.hypot(ball.vx, ball.vy);
    ball.vx = rel * speed * 0.85;
    ball.vy = -Math.abs(Math.sqrt(Math.max(1, speed*speed - ball.vx*ball.vx)));
    ball.y = PADDLE_Y - BALL_R;
    hitsSincePaddle = 0;
    paddleHits++;
    if (paddleHits % 5 === 0) { ballSpeed += 0.6; var s=Math.hypot(ball.vx,ball.vy); var f=(ballSpeed)/s; ball.vx*=f; ball.vy*=f; }
    updateHUD();
  }

  // brick collision
  for (var i=0;i&lt;bricks.length;i++){
    var b = bricks[i];
    if (!b.alive) continue;
    if (ball.x + BALL_R &gt; b.x &amp;&amp; ball.x - BALL_R &lt; b.x + b.w &amp;&amp;
        ball.y + BALL_R &gt; b.y &amp;&amp; ball.y - BALL_R &lt; b.y + b.h) {
      b.alive = false;
      // decide bounce direction
      var overlapX = Math.min(ball.x+BALL_R-b.x, b.x+b.w-(ball.x-BALL_R));
      var overlapY = Math.min(ball.y+BALL_R-b.y, b.y+b.h-(ball.y-BALL_R));
      if (overlapX &lt; overlapY) ball.vx = -ball.vx; else ball.vy = -ball.vy;
      hitsSincePaddle++;
      var mult = Math.max(1, hitsSincePaddle);
      score += b.pts * mult;
      if (hitsSincePaddle &gt;= 2) comboDisplay = {t:1, val:hitsSincePaddle};
      spawnParticles(ball.x, ball.y, b.color, 14);
      updateHUD();
      break;
    }
  }

  // ball lost
  if (ball.y - BALL_R &gt; H) {
    lives--;
    hitsSincePaddle = 0;
    updateHUD();
    if (lives &lt;= 0) { gameOver = true; goFlash = 0; }
    else resetBall();
  }

  // wave clear
  var any = bricks.some(function(b){return b.alive;});
  if (!any) { wave++; makeBricks(wave); }

  // particles
  for (var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.06; pt.life-=0.03;
    if (pt.life&lt;=0) particles.splice(p,1);
  }
  if (comboDisplay.t&gt;0) comboDisplay.t -= 0.02;
}

function draw() {
  ctx.fillStyle = &#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
  // starfield
  for (var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha = 0.4 + s.s/2.5;
    ctx.fillStyle = &#x27;#bcd4ff&#x27;;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // bricks
  for (var i=0;i&lt;bricks.length;i++){
    var b = bricks[i]; if(!b.alive) continue;
    ctx.shadowColor = b.color; ctx.shadowBlur = 12;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // particles
  for (var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha = Math.max(0,pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // paddle
  ctx.shadowColor = &#x27;#3df0ff&#x27;; ctx.shadowBlur = 16;
  var grd = ctx.createLinearGradient(paddle.x,0,paddle.x+PADDLE_W,0);
  grd.addColorStop(0,&#x27;#3df0ff&#x27;); grd.addColorStop(1,&#x27;#b13dff&#x27;);
  ctx.fillStyle = grd;
  roundRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 7); ctx.fill();
  ctx.shadowBlur = 0;

  // ball (pulsing)
  if (!gameOver) {
    var pulse = 2 + Math.sin(Date.now()/120)*2;
    ctx.shadowColor = &#x27;#ffffff&#x27;; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R+pulse*0.3, 0, Math.PI*2);
    var g = ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,BALL_R+2);
    g.addColorStop(0,&#x27;#ffffff&#x27;); g.addColorStop(1,&#x27;#ff3df0&#x27;);
    ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0;
  }

  // combo flash
  if (comboDisplay.t &gt; 0) {
    ctx.save();
    ctx.globalAlpha = comboDisplay.t;
    var sz = 40 + (1-comboDisplay.t)*40;
    ctx.font = &#x27;700 &#x27; + sz + &#x27;px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillStyle = &#x27;#ff3df0&#x27;;
    ctx.shadowColor=&#x27;#ff3df0&#x27;; ctx.shadowBlur=20;
    ctx.fillText(&#x27;COMBO x&#x27; + comboDisplay.val + &#x27;!&#x27;, W/2, H/2);
    ctx.restore();
  }

  // game over
  if (gameOver) {
    ctx.save();
    ctx.globalAlpha = 0.7 + Math.sin(goFlash*3)*0.3;
    ctx.fillStyle = &#x27;rgba(10,0,25,0.6)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
    ctx.font = &#x27;700 52px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle = (Math.sin(goFlash*4)&gt;0) ? &#x27;#ff3df0&#x27; : &#x27;#3df0ff&#x27;;
    ctx.shadowColor=&#x27;#ff3df0&#x27;; ctx.shadowBlur=25;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
    ctx.shadowBlur=0;
    ctx.font = &#x27;600 24px system-ui&#x27;; ctx.fillStyle=&#x27;#eaeaff&#x27;;
    ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 34);
    ctx.font = &#x27;400 16px system-ui&#x27;; ctx.fillStyle=&#x27;#9aa0d8&#x27;;
    ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2 + 66);
    ctx.restore();
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) { gameOver=false; startGame(); }
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
paddle = { x: W/2 - PADDLE_W/2 };
ballSpeed = 4; hitsSincePaddle=0; particles=[]; comboDisplay={t:0,val:0};
initStars(); makeBricks(1); resetBall();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
