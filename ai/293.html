    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐠 Deep-Sea Aquarium 🐠</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #04121f; color: #eaf6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 12px #2aa9ff; }
  .instructions { font-size: 16px; color: #a9d8ff; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 18px; align-items: center; justify-content: center; font-weight: 800; }
  .pill { background: rgba(20,60,100,0.6); border: 1px solid #2aa9ff; border-radius: 999px; padding: 6px 16px; box-shadow: 0 0 12px rgba(42,169,255,0.35); }
  .score { font-size: 24px; color: #ffe27a; text-shadow: 0 0 8px #ffb800; }
  .combo { font-size: 22px; color: #6effc0; text-shadow: 0 0 8px #00ffaa; }
  .timer { font-size: 22px; color: #bfe4ff; }
  .board {
    position: relative; width: 640px; height: 400px; flex-shrink: 0; margin: 0;
    border-radius: 14px; overflow: hidden; border: 2px solid #17456e;
    background: linear-gradient(180deg, #0a3a63 0%, #072843 50%, #041826 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
  }
  .shimmer {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 30% 10%, rgba(80,180,255,0.22), transparent 45%),
                radial-gradient(circle at 75% 5%, rgba(120,220,255,0.18), transparent 40%);
    animation: pulse 5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  /* Coral / seaweed strip at the bottom */
  .coral { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; pointer-events: none; z-index: 5; }
  .weed { position: absolute; bottom: 0; font-size: 40px; transform-origin: bottom center; animation: sway 3.5s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .creature {
    position: absolute; width: 66px; height: 66px; font-size: 52px; line-height: 66px;
    text-align: center; cursor: pointer; z-index: 3; user-select: none;
    transform: translateY(80px); transition: transform 0.28s cubic-bezier(.2,1.3,.5,1);
    filter: drop-shadow(0 0 8px rgba(120,220,255,0.6));
  }
  .creature.up { transform: translateY(0); }
  .creature.down { transform: translateY(90px); }
  .golden { filter: drop-shadow(0 0 12px #ffd400); }
  .jelly { filter: drop-shadow(0 0 12px #ff5bb0); }
  .burst { position: absolute; pointer-events: none; z-index: 8; }
  .bubble {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, rgba(150,220,255,0.5));
    animation: pop 0.6s ease-out forwards;
  }
  @keyframes pop { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: var(--end); opacity: 0; } }
  .float { position: absolute; z-index: 9; font-weight: 800; font-size: 22px; pointer-events: none; animation: rise 0.8s ease-out forwards; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-40px); opacity: 0; } }
  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; background: rgba(4,18,31,0.82); font-weight: 800;

  .overlay .sub { font-size: 18px; color: #bfe4ff; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐠 Deep-Sea Aquarium 🐠&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap the fish 🐟 (+1) and golden pufferfish 🐡 (+3), but avoid the jellyfish 🎐 (−2). Chain hits without touching a jellyfish to build your combo multiplier!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;pill score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;pill combo&quot;&gt;Combo: x&lt;span id=&quot;combo&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;pill timer&quot;&gt;Time: &lt;span id=&quot;timer&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;shimmer&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;coral&quot; id=&quot;coral&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div class=&quot;big&quot;&gt;🐠 Deep-Sea Aquarium&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Press Start below to dive in!&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 400, SIZE = 66, GROUND = 60;
  var board = document.getElementById(&#x27;board&#x27;);
  var coral = document.getElementById(&#x27;coral&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);

  var score = 0, combo = 1, timeLeft = 60;
  var running = false;
  var spawnTimer = null, gameTimer = null, escalateTimer = null;
  var creatures = [];
  var spawnMs = 950, lifeMs = 1500;

  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function buildCoral() {
    coral.innerHTML = &#x27;&#x27;;
    var corals = [&#x27;🪸&#x27;,&#x27;🌿&#x27;,&#x27;🪸&#x27;,&#x27;🌿&#x27;,&#x27;🪸&#x27;,&#x27;🌿&#x27;,&#x27;🪸&#x27;,&#x27;🌿&#x27;];
    for (var i = 0; i &lt; corals.length; i++) {
      var w = document.createElement(&#x27;div&#x27;);
      w.className = &#x27;weed&#x27;;
      w.textContent = corals[i];
      w.style.left = (i * (BOARD_W / corals.length) + 8) + &#x27;px&#x27;;
      w.style.animationDelay = (i * 0.3) + &#x27;s&#x27;;
      coral.appendChild(w);
    }
  }
  buildCoral();

  var TYPES = [
    { emoji: &#x27;🐟&#x27;, cls: &#x27;&#x27;, pts: 1, weight: 62 },
    { emoji: &#x27;🐠&#x27;, cls: &#x27;&#x27;, pts: 1, weight: 0 }, // decorative alt fish, folded into fish below
    { emoji: &#x27;🐡&#x27;, cls: &#x27;golden&#x27;, pts: 3, weight: 16 },
    { emoji: &#x27;🎐&#x27;, cls: &#x27;jelly&#x27;, pts: -2, weight: 22 }
  ];
  var FISH_FACES = [&#x27;🐟&#x27;,&#x27;🐠&#x27;,&#x27;🐡&#x27;]; // regular fish variety (pts 1)

  function pickType() {
    var r = Math.random() * 100;
    if (r &lt; 62) {
      var face = FISH_FACES[Math.floor(Math.random() * 2)]; // 🐟 or 🐠
      return { emoji: face, cls: &#x27;&#x27;, pts: 1 };
    } else if (r &lt; 78) {
      return { emoji: &#x27;🐡&#x27;, cls: &#x27;golden&#x27;, pts: 3 };
    } else {
      return { emoji: &#x27;🎐&#x27;, cls: &#x27;jelly&#x27;, pts: -2 };
    }
  }

  function spawnCreature() {
    if (!running) return;
    var t = pickType();
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;creature &#x27; + t.cls;
    el.textContent = t.emoji;
    var x = 10 + Math.random() * (BOARD_W - SIZE - 20);
    el.style.left = x + &#x27;px&#x27;;
    el.style.bottom = (GROUND - 10) + &#x27;px&#x27;;
    board.appendChild(el);
    // rise up
    requestAnimationFrame(function(){ el.classList.add(&#x27;up&#x27;); });

    var obj = { el: el, hit: false, timeout: null };
    creatures.push(obj);

    el.addEventListener(&#x27;click&#x27;, function () {
      if (obj.hit || !running) return;
      obj.hit = true;
      clearTimeout(obj.timeout);
      handleHit(t, el);
      removeCreature(obj);
    });

    obj.timeout = setTimeout(function () {
      // sink back if missed
      el.classList.remove(&#x27;up&#x27;);
      el.classList.add(&#x27;down&#x27;);
      setTimeout(function(){ removeCreature(obj); }, 320);
    }, lifeMs);
  }

  function removeCreature(obj) {
    var i = creatures.indexOf(obj);
    if (i &gt;= 0) creatures.splice(i, 1);
    if (obj.el &amp;&amp; obj.el.parentNode) obj.el.parentNode.removeChild(obj.el);
  }

  function handleHit(t, el) {
    var cx = parseFloat(el.style.left) + SIZE/2;
    var cy = BOARD_H - GROUND - SIZE/2;
    if (t.pts &lt; 0) {
      // jellyfish: penalty, reset combo
      score += t.pts;
      combo = 1;
      beep(140, 0.3, &#x27;sawtooth&#x27;);
      showFloat(cx, cy, t.pts, &#x27;#ff7ac0&#x27;);
    } else {
      var gained = t.pts * combo;
      score += gained;
      combo = Math.min(combo + 1, 9);
      beep(t.pts &gt;= 3 ? 880 : 620, 0.15, &#x27;triangle&#x27;);
      showFloat(cx, cy, &#x27;+&#x27; + gained, t.pts &gt;= 3 ? &#x27;#ffd400&#x27; : &#x27;#6effc0&#x27;);
      bubbleBurst(cx, cy);
    }
    if (score &lt; 0) score = 0;
    scoreEl.textContent = score;
    comboEl.textContent = combo;
  }

  function showFloat(x, y, txt, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = txt;
    f.style.left = x + &#x27;px&#x27;;
    f.style.top = y + &#x27;px&#x27;;
    f.style.color = color;
    board.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 800);
  }

  function bubbleBurst(x, y) {
    var wrap = document.createElement(&#x27;div&#x27;);
    wrap.className = &#x27;burst&#x27;;
    wrap.style.left = x + &#x27;px&#x27;;
    wrap.style.top = y + &#x27;px&#x27;;
    for (var i = 0; i &lt; 8; i++) {
      var b = document.createElement(&#x27;div&#x27;);
      b.className = &#x27;bubble&#x27;;
      var ang = (Math.PI * 2 * i) / 8;
      var dist = 30 + Math.random() * 25;
      b.style.setProperty(&#x27;--end&#x27;, &#x27;translate(&#x27; + Math.cos(ang)*dist + &#x27;px,&#x27; + Math.sin(ang)*dist + &#x27;px) scale(0.2)&#x27;);
      wrap.appendChild(b);
    }
    board.appendChild(wrap);
    setTimeout(function(){ if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 650);
  }

  function clearAll() {
    for (var i = creatures.length - 1; i &gt;= 0; i--) {
      clearTimeout(creatures[i].timeout);
      if (creatures[i].el.parentNode) creatures[i].el.parentNode.removeChild(creatures[i].el);
    }
    creatures = [];
    var bursts = board.querySelectorAll(&#x27;.burst, .float&#x27;);
    for (var j = 0; j &lt; bursts.length; j++) bursts[j].remove();
  }

  function scheduleSpawn() {
    spawnTimer = setTimeout(function () {
      spawnCreature();
      scheduleSpawn();
    }, spawnMs);
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; combo = 1; timeLeft = 60;
    spawnMs = 950; lifeMs = 1500;
    scoreEl.textContent = &#x27;0&#x27;;
    comboEl.textContent = &#x27;1&#x27;;
    timerEl.textContent = &#x27;60&#x27;;
    overlay.classList.add(&#x27;hidden&#x27;);
    clearAll();
    spawnCreature(); // immediate action
    scheduleSpawn();
    gameTimer = setInterval(function () {
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft &lt;= 0) endGame();
    }, 1000);
    escalateTimer = setInterval(function () {
      spawnMs = Math.max(420, spawnMs - 110);
      lifeMs = Math.max(850, lifeMs - 130);
    }, 10000);
  }

  function stopTimers() {
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
    if (escalateTimer) { clearInterval(escalateTimer); escalateTimer = null; }
  }

  function endGame() {
    running = false;
    stopTimers();
    clearAll();
    overlay.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;🌊 Time\&#x27;s Up!&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Final Score: &#x27; + score + &#x27;&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Press Start below to dive again&lt;/div&gt;&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    stopTimers();
    clearAll();
    overlay.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;⏸ Paused&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Press Start below to dive in!&lt;/div&gt;&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
