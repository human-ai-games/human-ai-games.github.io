<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌻 Gopher Garden 🌻</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌻 Gopher Garden 🌻</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(#87ceeb 0%, #87ceeb 45%, #7ec850 45%, #5fae3a 100%); color: #223; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #2d5a1b; text-shadow: 1px 1px 0 #fff; }
  .instructions { font-size: 16px; color: #2d4a1b; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 22px; align-items: center; justify-content: center; }
  .score { font-size: 30px; font-weight: 800; color: #1c3d0e; transition: color .15s; }
  .score.penalty { color: #d81e1e; }
  .combo { font-size: 18px; font-weight: 700; color: #999; padding: 3px 10px; border-radius: 12px; background: #eee; transition: all .15s; }
  .combo.active { color: #fff; background: #ff8c00; box-shadow: 0 0 10px #ffb347; transform: scale(1.1); }
  .board { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; width: 480px; height: 400px; }
  .mound { position: relative; overflow: hidden; border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; background: radial-gradient(ellipse at 50% 35%, #8a5a2b 0%, #6e461f 70%); box-shadow: inset 0 -8px 12px rgba(0,0,0,.3); }
  .mound::before { content: &#x27;&#x27;; position: absolute; left: 12%; right: 12%; top: 8%; height: 34%; border-radius: 50%; background: #3a2410; }
  .mound::after { content: &#x27;&#x27;; position: absolute; left: 8%; right: 8%; top: 4%; height: 12%; border-radius: 50%; border: 4px solid #4caf2a; border-bottom: none; }
  .mound.wobble { animation: wob .3s ease-in-out infinite; }
  @keyframes wob { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }
  .num { position: absolute; bottom: 4px; left: 0; right: 0; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.5); }
  .gopher { position: absolute; left: 50%; bottom: 6px; transform: translate(-50%, 110%); font-size: 46px; cursor: pointer; transition: transform .18s cubic-bezier(.34,1.56,.64,1); user-select: none; z-index: 2; line-height: 1; }
  .gopher.up { transform: translate(-50%, 0%); }
  .gopher.golden { filter: drop-shadow(0 0 6px gold); animation: flash .5s infinite alternate; }
  @keyframes flash { from{filter:drop-shadow(0 0 3px gold);} to{filter:drop-shadow(0 0 12px #fff59d);} }
  .gopher.diamond { animation: spin 1.1s linear infinite; }
  @keyframes spin { from{transform:translate(-50%,0) rotate(0);} to{transform:translate(-50%,0) rotate(360deg);} }
  .splat { position: absolute; left: 50%; top: 30%; transform: translate(-50%,-50%); font-size: 40px; pointer-events: none; animation: splat .5s ease-out forwards; z-index: 3; }
  @keyframes splat { 0%{transform:translate(-50%,-50%) scale(.3);opacity:1;} 100%{transform:translate(-50%,-50%) scale(1.6);opacity:0;} }
  .floatscore { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); font-size: 22px; font-weight: 800; pointer-events: none; animation: fly 1s ease-out forwards; z-index: 4; text-shadow: 1px 1px 2px rgba(0,0,0,.4); }
  @keyframes fly { 0%{transform:translate(-50%,0);opacity:1;} 100%{transform:translate(-50%,-50px);opacity:0;} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌻 Gopher Garden 🌻&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the gophers popping from the holes to score — golden and sparkly diamond gophers are worth more! Avoid the red mole decoy, and hit fast for a combo bonus.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;Combo x1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var scoreBox = scoreEl.parentNode;
  var comboEl = document.getElementById(&#x27;combo&#x27;);

  var score = 0, running = false;
  var spawnTimer = null, speedTimer = null;
  var spawnMs = 1100;
  var moundTimeouts = [];
  var mounds = [];
  var comboCount = 1, lastHit = 0, comboTimer = null;

  // Build 3x3 grid
  for (var i = 0; i &lt; 9; i++) {
    var m = document.createElement(&#x27;div&#x27;);
    m.className = &#x27;mound&#x27;;
    var n = document.createElement(&#x27;div&#x27;);
    n.className = &#x27;num&#x27;; n.textContent = (i+1);
    m.appendChild(n);
    board.appendChild(m);
    mounds.push({ el: m, busy: false });
  }

  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(_){}
  }

  var TYPES = [
    { kind:&#x27;brown&#x27;,   emoji:&#x27;🐹&#x27;, cls:&#x27;&#x27;,        pts:1, weight:60, life:1300 },
    { kind:&#x27;golden&#x27;,  emoji:&#x27;🐹&#x27;, cls:&#x27;golden&#x27;,  pts:3, weight:20, life:1100 },
    { kind:&#x27;diamond&#x27;, emoji:&#x27;💎&#x27;, cls:&#x27;diamond&#x27;, pts:5, weight:8,  life:700  },
    { kind:&#x27;mole&#x27;,    emoji:&#x27;😈&#x27;, cls:&#x27;mole&#x27;,    pts:-1,weight:12, life:1200 }
  ];

  function pickType() {
    var total = 0; for (var i=0;i&lt;TYPES.length;i++) total += TYPES[i].weight;
    var r = Math.random()*total;
    for (var j=0;j&lt;TYPES.length;j++){ r -= TYPES[j].weight; if (r&lt;=0) return TYPES[j]; }
    return TYPES[0];
  }

  function setCombo(v) {
    comboCount = v;
    comboEl.textContent = &#x27;Combo x&#x27; + comboCount;
    if (comboCount &gt;= 2) comboEl.classList.add(&#x27;active&#x27;);
    else comboEl.classList.remove(&#x27;active&#x27;);
  }

  function registerHit() {
    var now = Date.now();
    if (now - lastHit &lt;= 1000) setCombo(comboCount + 1);
    else setCombo(1);
    lastHit = now;
    if (comboTimer) clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){ setCombo(1); }, 1000);
  }

  function showFloat(mound, text, color) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;floatscore&#x27;; f.textContent = text; f.style.color = color;
    mound.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 1000);
  }
  function showSplat(mound) {
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;splat&#x27;; s.textContent = &#x27;💥&#x27;;
    mound.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 500);
  }

  function spawnGopher() {
    var free = mounds.filter(function(m){ return !m.busy; });
    if (!free.length) return;
    var slot = free[Math.floor(Math.random()*free.length)];
    var type = pickType();
    slot.busy = true;

    slot.el.classList.add(&#x27;wobble&#x27;);
    var wobbleT = setTimeout(function(){
      slot.el.classList.remove(&#x27;wobble&#x27;);
      var g = document.createElement(&#x27;div&#x27;);
      g.className = &#x27;gopher &#x27; + type.cls;
      g.textContent = type.emoji;
      slot.el.appendChild(g);
      requestAnimationFrame(function(){ g.classList.add(&#x27;up&#x27;); });

      var alive = true;
      var lifeT = setTimeout(function(){
        alive = false;
        g.classList.remove(&#x27;up&#x27;);
        setTimeout(function(){ if (g.parentNode) g.parentNode.removeChild(g); slot.busy = false; }, 200);
      }, type.life);
      moundTimeouts.push(lifeT);

      g.addEventListener(&#x27;click&#x27;, function(ev){
        ev.stopPropagation();
        if (!alive) return;
        alive = false;
        clearTimeout(lifeT);
        if (g.parentNode) g.parentNode.removeChild(g);
        slot.busy = false;

        if (type.kind === &#x27;mole&#x27;) {
          score -= 1;
          scoreEl.textContent = score;
          scoreBox.classList.add(&#x27;penalty&#x27;);
          setTimeout(function(){ scoreBox.classList.remove(&#x27;penalty&#x27;); }, 400);
          showSplat(slot.el);
          showFloat(slot.el, &#x27;-1&#x27;, &#x27;#d81e1e&#x27;);
          setCombo(1);
          beep(120, .25, &#x27;sawtooth&#x27;);
        } else {
          registerHit();
          var gained = type.pts * comboCount;
          score += gained;
          scoreEl.textContent = score;
          showSplat(slot.el);
          var col = type.kind===&#x27;diamond&#x27; ? &#x27;#00bcd4&#x27; : (type.kind===&#x27;golden&#x27; ? &#x27;#ffb300&#x27; : &#x27;#2e7d32&#x27;);
          showFloat(slot.el, &#x27;+&#x27; + gained, col);
          beep(type.kind===&#x27;diamond&#x27;?900:(type.kind===&#x27;golden&#x27;?700:500), .12, &#x27;triangle&#x27;);
        }
      });
    }, 300);
    moundTimeouts.push(wobbleT);
  }

  function clearAll() {
    for (var i=0;i&lt;moundTimeouts.length;i++) clearTimeout(moundTimeouts[i]);
    moundTimeouts = [];
    for (var j=0;j&lt;mounds.length;j++){
      mounds[j].busy = false;
      mounds[j].el.classList.remove(&#x27;wobble&#x27;);
      var gs = mounds[j].el.querySelectorAll(&#x27;.gopher,.splat,.floatscore&#x27;);
      for (var k=0;k&lt;gs.length;k++) gs[k].parentNode.removeChild(gs[k]);
    }
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    setCombo(1); lastHit = 0;
    spawnMs = 1100;
    clearAll();
    spawnGopher();
    if (spawnTimer) clearInterval(spawnTimer);
    spawnTimer = setInterval(spawnGopher, spawnMs);
    if (speedTimer) clearInterval(speedTimer);
    speedTimer = setInterval(function(){
      if (spawnMs &gt; 450) {
        spawnMs -= 90;
        clearInterval(spawnTimer);
        spawnTimer = setInterval(spawnGopher, spawnMs);
      }
    }, 10000);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    if (speedTimer) { clearInterval(speedTimer); speedTimer = null; }
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    clearAll();
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
