&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a1f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;

       text-shadow: 0 0 18px rgba(255,122,198,.3); }
  .instructions { font-size: 16px; color: #aab; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 26px; font-size: 20px; font-weight: 600; }
  .hud .val { color: #8cff6b; text-shadow: 0 0 10px rgba(140,255,107,.6); }
  .hud .mult { color: #ff7ac6; text-shadow: 0 0 10px rgba(255,122,198,.6); }

           background: linear-gradient(#060618, #12123a 70%, #1a0e34);
           border-radius: 10px; overflow: hidden; box-shadow: 0 0 40px rgba(122,240,255,.12) inset; }

  .layer { position: absolute; inset: 0; }
  #stars canvas, #clouds canvas { display: block; }

  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
            border-top: 2px solid #8cff6b; box-shadow: 0 0 16px #8cff6b, 0 -4px 20px rgba(140,255,107,.3);
            background: linear-gradient(rgba(140,255,107,.08), transparent 60%); overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image:
            repeating-linear-gradient(90deg, rgba(140,255,107,.35) 0 2px, transparent 2px 46px); }

  .hero { position: absolute; width: 40px; height: 34px; z-index: 5; will-change: transform; }
  .fox { position: absolute; inset: 0; filter: drop-shadow(0 0 8px rgba(255,150,60,.8)); }
  .leg { transform-origin: top center; }
  .running .leg-front { animation: legFront .22s steps(2) infinite; }
  .running .leg-back { animation: legBack .22s steps(2) infinite; }
  @keyframes legFront { 0%{transform:rotate(22deg)} 50%{transform:rotate(-22deg)} 100%{transform:rotate(22deg)} }
  @keyframes legBack  { 0%{transform:rotate(-22deg)} 50%{transform:rotate(22deg)} 100%{transform:rotate(-22deg)} }
  .squish { transform: scaleX(1.25) scaleY(0.8) !important; }
  .stretch { transform: scaleY(1.2) scaleX(0.85) !important; }
  .tumble { animation: tumble .7s ease-out forwards; }
  @keyframes tumble { 0%{transform:rotate(0) translateY(0)} 100%{transform:rotate(720deg) translateY(-40px)} }

  .obstacle { position: absolute; z-index: 4; }
  .spike { filter: drop-shadow(0 0 6px #7af0ff); }
  .ghost { filter: drop-shadow(0 0 8px #c58cff); animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{margin-top:0} 50%{margin-top:-16px} }
  .orb { filter: drop-shadow(0 0 8px #ff7ac6); animation: roll .5s linear infinite; }
  @keyframes roll { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff;
           box-shadow: 0 0 6px #8cff6b; z-index: 6; pointer-events: none; }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 20; pointer-events: none; }
  .flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0%{opacity:.85} 100%{opacity:0} }

  .banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%) scale(.4);
            font-size: 46px; font-weight: 800; letter-spacing: 2px; z-index: 15; pointer-events: none; opacity: 0;
            color: #ff7ac6; text-shadow: 0 0 20px #ff7ac6, 0 0 40px #ff7ac6; }
  .banner.show { animation: pop 1.1s ease-out; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}
    45%{transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)} }

  .msg { position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%); z-index: 16;
         font-size: 24px; font-weight: 700; text-align: center; color: #7af0ff; text-shadow: 0 0 14px #7af0ff; display: none; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦊 NEON FOX&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click) to jump over crystal spikes, floating ghosts, and energy orbs. Clear 3 in a row to unlock a x2 streak — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;x2 STREAK!&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var FIELD_W=640, FIELD_H=430, GROUND_H=40, HERO_W=40, HERO_H=34;
var GRAVITY=0.62, JUMP_V=-13.2;
var field=document.getElementById(&#x27;field&#x27;), hero=document.getElementById(&#x27;hero&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), multEl=document.getElementById(&#x27;mult&#x27;), bestEl=document.getElementById(&#x27;best&#x27;);
var flash=document.getElementById(&#x27;flash&#x27;), banner=document.getElementById(&#x27;banner&#x27;), msg=document.getElementById(&#x27;msg&#x27;);
var grid=document.getElementById(&#x27;grid&#x27;);

// ---- Fox sprite (SVG) ----
hero.innerHTML =
&#x27;&lt;svg class=&quot;fox&quot; viewBox=&quot;0 0 40 34&quot;&gt;&#x27;+
&#x27;&lt;g class=&quot;leg leg-back&quot;&gt;&lt;rect x=&quot;26&quot; y=&quot;20&quot; width=&quot;5&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;#d86a2a&quot;/&gt;&lt;/g&gt;&#x27;+
&#x27;&lt;g class=&quot;leg leg-back&quot;&gt;&lt;rect x=&quot;9&quot; y=&quot;20&quot; width=&quot;5&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;#d86a2a&quot;/&gt;&lt;/g&gt;&#x27;+
&#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;18&quot; rx=&quot;14&quot; ry=&quot;8&quot; fill=&quot;#ff9642&quot;/&gt;&#x27;+
&#x27;&lt;path d=&quot;M2 16 Q -4 24 6 22 Z&quot; fill=&quot;#ff9642&quot;/&gt;&#x27;+  // tail
&#x27;&lt;circle cx=&quot;33&quot; cy=&quot;12&quot; r=&quot;7&quot; fill=&quot;#ffb26b&quot;/&gt;&#x27;+     // head
&#x27;&lt;path d=&quot;M28 6 L30 12 L26 11 Z&quot; fill=&quot;#ff9642&quot;/&gt;&#x27;+   // ear
&#x27;&lt;path d=&quot;M36 6 L38 12 L34 11 Z&quot; fill=&quot;#ff9642&quot;/&gt;&#x27;+   // ear
&#x27;&lt;circle cx=&quot;35&quot; cy=&quot;12&quot; r=&quot;1.6&quot; fill=&quot;#241&quot;&gt;&#x27;+&#x27;&lt;/circle&gt;&#x27;+
&#x27;&lt;circle cx=&quot;39&quot; cy=&quot;13&quot; r=&quot;1.4&quot; fill=&quot;#331&quot;/&gt;&#x27;+       // nose
&#x27;&lt;g class=&quot;leg leg-front&quot;&gt;&lt;rect x=&quot;22&quot; y=&quot;20&quot; width=&quot;5&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;#ff9642&quot;/&gt;&lt;/g&gt;&#x27;+
&#x27;&lt;g class=&quot;leg leg-front&quot;&gt;&lt;rect x=&quot;13&quot; y=&quot;20&quot; width=&quot;5&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;#ff9642&quot;/&gt;&lt;/g&gt;&#x27;+
&#x27;&lt;/svg&gt;&#x27;;

// ---- Parallax canvases ----
function mkCanvas(parent){ var c=document.createElement(&#x27;canvas&#x27;); c.width=FIELD_W; c.height=FIELD_H; parent.appendChild(c); return c; }
var starsC=mkCanvas(document.getElementById(&#x27;stars&#x27;)), starsCtx=starsC.getContext(&#x27;2d&#x27;);
var cloudsC=mkCanvas(document.getElementById(&#x27;clouds&#x27;)), cloudsCtx=cloudsC.getContext(&#x27;2d&#x27;);
var stars=[], clouds=[];
for(var i=0;i&lt;70;i++) stars.push({x:Math.random()*FIELD_W,y:Math.random()*(FIELD_H-GROUND_H),r:Math.random()*1.4+.4,ph:Math.random()*6.28});
for(var j=0;j&lt;7;j++) clouds.push({x:Math.random()*FIELD_W,y:40+Math.random()*(FIELD_H-GROUND_H-120),w:80+Math.random()*80,h:30+Math.random()*30});

var running=false, animId=null, spawnId=null, gameOver=false;
var heroY, heroVY, onGround, score, mult, streak, obstacles, speed, elapsed, gridOff, tPrev, spawnTimer, spawnGap;
var best=0;

function reset(){
  heroY=FIELD_H-GROUND_H-HERO_H; heroVY=0; onGround=true;
  score=0; mult=1; streak=0; speed=3.4; elapsed=0; gridOff=0; spawnTimer=0; spawnGap=1500;
  obstacles.forEach(function(o){if(o.el.parentNode)o.el.parentNode.removeChild(o.el);});
  obstacles=[]; gameOver=false;
  scoreEl.textContent=&#x27;0&#x27;; multEl.textContent=&#x27;x1&#x27;; msg.style.display=&#x27;none&#x27;;
  hero.className=&#x27;hero running&#x27;; hero.style.transform=&#x27;&#x27;;
  paintHero();
}
obstacles=[];

function paintHero(){ hero.style.left=&#x27;60px&#x27;; hero.style.top=heroY+&#x27;px&#x27;; }

function spawnObstacle(){
  var type=[&#x27;spike&#x27;,&#x27;ghost&#x27;,&#x27;orb&#x27;][Math.floor(Math.random()*3)];
  var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;obstacle &#x27;+type;
  var w,h,bottomOffset=GROUND_H, floaty=0;
  if(type===&#x27;spike&#x27;){
    w=26;h=34;
    el.innerHTML=&#x27;&lt;svg width=&quot;26&quot; height=&quot;34&quot; viewBox=&quot;0 0 26 34&quot;&gt;&lt;polygon points=&quot;13,0 20,34 6,34&quot; fill=&quot;#7af0ff&quot;/&gt;&lt;polygon points=&quot;13,6 16,34 10,34&quot; fill=&quot;#bff8ff&quot;/&gt;&lt;/svg&gt;&#x27;;
  } else if(type===&#x27;ghost&#x27;){
    w=32;h=30; floaty=48;
    el.innerHTML=&#x27;&lt;svg width=&quot;32&quot; height=&quot;30&quot; viewBox=&quot;0 0 32 30&quot;&gt;&lt;path d=&quot;M4 16 A12 12 0 0 1 28 16 L28 28 L23 24 L18 28 L13 24 L8 28 L4 24 Z&quot; fill=&quot;#c58cff&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;14&quot; r=&quot;2.4&quot; fill=&quot;#2a1a44&quot;/&gt;&lt;circle cx=&quot;20&quot; cy=&quot;14&quot; r=&quot;2.4&quot; fill=&quot;#2a1a44&quot;/&gt;&lt;/svg&gt;&#x27;;
  } else {
    w=30;h=30;
    el.innerHTML=&#x27;&lt;svg width=&quot;30&quot; height=&quot;30&quot; viewBox=&quot;0 0 30 30&quot;&gt;&lt;circle cx=&quot;15&quot; cy=&quot;15&quot; r=&quot;13&quot; fill=&quot;#ff7ac6&quot;/&gt;&lt;circle cx=&quot;15&quot; cy=&quot;15&quot; r=&quot;7&quot; fill=&quot;#ffd0ec&quot;/&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;2.5&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;&#x27;;
  }
  var o={type:type,x:FIELD_W,w:w,h:h,floaty:floaty,bottomOffset:bottomOffset,scored:false,el:el};
  el.style.left=o.x+&#x27;px&#x27;;
  el.style.bottom=(bottomOffset+floaty)+&#x27;px&#x27;;
  field.appendChild(el);
  obstacles.push(o);
}

function sparkleBurst(){
  var bx=60+HERO_W/2, by=FIELD_H-GROUND_H;
  for(var i=0;i&lt;8;i++){
    var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;spark&#x27;;
    s.style.left=bx+&#x27;px&#x27;; s.style.top=by+&#x27;px&#x27;;
    field.appendChild(s);
    var ang=Math.PI+Math.random()*Math.PI, dist=18+Math.random()*22;
    var dx=Math.cos(ang)*dist, dy=Math.abs(Math.sin(ang))*-dist;
    (function(el,dx,dy){
      var t0=performance.now();
      function anim(t){var p=(t-t0)/420; if(p&gt;=1){if(el.parentNode)el.parentNode.removeChild(el);return;}
        el.style.transform=&#x27;translate(&#x27;+(dx*p)+&#x27;px,&#x27;+(dy*p+p*p*20)+&#x27;px)&#x27;; el.style.opacity=1-p;
        requestAnimationFrame(anim);}
      requestAnimationFrame(anim);
    })(s,dx,dy);
  }
}

function jump(){
  if(!running||gameOver||!onGround) return;
  heroVY=JUMP_V; onGround=false;
  sparkleBurst();
  hero.classList.remove(&#x27;running&#x27;);
  hero.classList.add(&#x27;stretch&#x27;);
  setTimeout(function(){ hero.classList.remove(&#x27;stretch&#x27;); },140);
}

function showBanner(){ banner.classList.remove(&#x27;show&#x27;); void banner.offsetWidth; banner.classList.add(&#x27;show&#x27;); }

function die(){
  gameOver=true;
  flash.classList.remove(&#x27;on&#x27;); void flash.offsetWidth; flash.classList.add(&#x27;on&#x27;);
  hero.classList.remove(&#x27;running&#x27;);
  hero.className=&#x27;hero tumble&#x27;;
  if(score&gt;best){ best=score; bestEl.textContent=best; }
  msg.innerHTML=&#x27;CRASH!&lt;br&gt;Score &#x27;+score;
  msg.style.display=&#x27;block&#x27;;
  setTimeout(stopGame,700);
}

function tick(t){
  if(!running) return;
  if(!tPrev) tPrev=t;
  var dt=Math.min(50,t-tPrev); tPrev=t;
  elapsed+=dt;
  // speed ramp: approachable early, sprint late (~60s scale)
  speed=3.4 + Math.min(6.6, elapsed/60000*6.6);
  spawnGap=Math.max(680, 1500 - elapsed/60000*820);

  // physics
  heroVY+=GRAVITY; heroY+=heroVY;
  var floorY=FIELD_H-GROUND_H-HERO_H;
  if(heroY&gt;=floorY){
    heroY=floorY;
    if(!onGround){ onGround=true; hero.classList.add(&#x27;squish&#x27;); setTimeout(function(){hero.classList.remove(&#x27;squish&#x27;);hero.classList.add(&#x27;running&#x27;);},110); }
    heroVY=0;
  }
  paintHero();

  // parallax
  gridOff=(gridOff+speed)%46;
  grid.style.transform=&#x27;translateX(&#x27;+(-gridOff)+&#x27;px)&#x27;;
  starsCtx.clearRect(0,0,FIELD_W,FIELD_H);
  for(var i=0;i&lt;stars.length;i++){var s=stars[i]; s.x-=speed*0.15; if(s.x&lt;0)s.x+=FIELD_W; s.ph+=0.05;
    var a=0.4+0.5*Math.sin(s.ph); starsCtx.fillStyle=&#x27;rgba(200,230,255,&#x27;+a+&#x27;)&#x27;; starsCtx.beginPath(); starsCtx.arc(s.x,s.y,s.r,0,6.28); starsCtx.fill();}
  cloudsCtx.clearRect(0,0,FIELD_W,FIELD_H);
  for(var k=0;k&lt;clouds.length;k++){var c=clouds[k]; c.x-=speed*0.45; if(c.x+c.w&lt;0)c.x=FIELD_W+Math.random()*80;
    var g=cloudsCtx.createRadialGradient(c.x+c.w/2,c.y+c.h/2,4,c.x+c.w/2,c.y+c.h/2,c.w/2);
    g.addColorStop(0,&#x27;rgba(150,90,220,.28)&#x27;); g.addColorStop(1,&#x27;rgba(150,90,220,0)&#x27;);
    cloudsCtx.fillStyle=g; cloudsCtx.beginPath(); cloudsCtx.ellipse(c.x+c.w/2,c.y+c.h/2,c.w/2,c.h/2,0,0,6.28); cloudsCtx.fill();}

  // spawn
  spawnTimer+=dt;
  if(spawnTimer&gt;=spawnGap){ spawnTimer=0; spawnObstacle(); }

  // obstacles
  var heroLeft=60, heroRight=60+HERO_W, heroTop=heroY, heroBot=heroY+HERO_H;
  for(var m=obstacles.length-1;m&gt;=0;m--){
    var o=obstacles[m]; o.x-=speed; o.el.style.left=o.x+&#x27;px&#x27;;
    if(o.x+o.w&lt;0){ if(o.el.parentNode)o.el.parentNode.removeChild(o.el); obstacles.splice(m,1); continue; }
    if(!o.scored &amp;&amp; o.x+o.w&lt;heroLeft){
      o.scored=true; streak++;
      score+=1*mult; scoreEl.textContent=score;
      if(streak===3 &amp;&amp; mult===1){ mult=2; multEl.textContent=&#x27;x2&#x27;; showBanner(); }
    }
    // collision box (ghost bobs, so widen vertical tolerance a bit)
    var oTop=FIELD_H-o.bottomOffset-o.floaty-o.h, oBot=oTop+o.h;
    var extra=o.type===&#x27;ghost&#x27;?16:0;
    if(heroRight&gt;o.x+4 &amp;&amp; heroLeft&lt;o.x+o.w-4 &amp;&amp; heroBot&gt;oTop-extra &amp;&amp; heroTop&lt;oBot+extra){
      die(); return;
    }
  }
  animId=requestAnimationFrame(tick);
}

function startGame(){
  if(running) return;
  reset(); running=true; tPrev=0;
  spawnObstacle();
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  if(!running &amp;&amp; !animId) return;
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

window.addEventListener(&#x27;keydown&#x27;,function(e){ if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }});
field.addEventListener(&#x27;click&#x27;,function(){ jump(); });
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial paint (stopped state)
heroY=FIELD_H-GROUND_H-HERO_H; paintHero();
hero.classList.add(&#x27;running&#x27;);
starsCtx.fillStyle=&#x27;rgba(200,230,255,.6)&#x27;;
for(var q=0;q&lt;stars.length;q++){starsCtx.beginPath();starsCtx.arc(stars[q].x,stars[q].y,stars[q].r,0,6.28);starsCtx.fill();}
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
