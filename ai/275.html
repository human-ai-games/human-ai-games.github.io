  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍓 Fruit Drop Frenzy 🍉&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← → , rotate with ↑, and press ↓ to drop faster (or tap the left/right side, swipe down on touch). Clear rows for points — clear four at once for a COMBO FRENZY!&lt;/p&gt;
  &lt;div class=&quot;scoreboard&quot;&gt;
    &lt;div class=&quot;sb&quot;&gt;&lt;div class=&quot;label&quot;&gt;SCORE&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sb&quot;&gt;&lt;div class=&quot;label&quot;&gt;LEVEL&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board-wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;330&quot; height=&quot;528&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;frenzy&quot; id=&quot;frenzy&quot;&gt;COMBO FRENZY! +1000&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;GAME OVER&lt;br&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Press Start to play again&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var COLS = 10, ROWS = 16, CELL = 33;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), levelEl = document.getElementById(&#x27;level&#x27;);
  var frenzyEl = document.getElementById(&#x27;frenzy&#x27;), overEl = document.getElementById(&#x27;over&#x27;);

  // Tetromino defs: name -&gt; {color, emoji, cells (rotation states as coord lists)}
  var FRUITS = {
    I: { color:&#x27;#ff8f3c&#x27;, emoji:&#x27;🍊&#x27;, shape:[[1,1,1,1]] },      // orange
    O: { color:&#x27;#ffd23c&#x27;, emoji:&#x27;🍋&#x27;, shape:[[1,1],[1,1]] },     // lemon
    T: { color:&#x27;#c94ad6&#x27;, emoji:&#x27;🍇&#x27;, shape:[[1,1,1],[0,1,0]] }, // grape
    S: { color:&#x27;#4fd15a&#x27;, emoji:&#x27;🍏&#x27;, shape:[[0,1,1],[1,1,0]] }, // green apple
    Z: { color:&#x27;#ff4d6d&#x27;, emoji:&#x27;🍓&#x27;, shape:[[1,1,0],[0,1,1]] }, // strawberry
    L: { color:&#x27;#ff6b3c&#x27;, emoji:&#x27;🍑&#x27;, shape:[[1,0],[1,0],[1,1]] },// peach
    J: { color:&#x27;#3cb2ff&#x27;, emoji:&#x27;🫐&#x27;, shape:[[0,1],[0,1],[1,1]] } // blueberry
  };
  var KEYS = Object.keys(FRUITS);

  var grid, piece, score, level, linesCleared, running, dropId, dropMs;
  var pops = [];        // {c,r,t}
  var confetti = [];    // particles
  var flash = 0;
  var animId = null;

  function makeGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function rotateShape(sh){
    var h=sh.length, w=sh[0].length, out=[];
    for(var c=0;c&lt;w;c++){ var row=[]; for(var r=h-1;r&gt;=0;r--) row.push(sh[r][c]); out.push(row); }
    return out;
  }
  function spawnPiece(){
    var k=KEYS[Math.floor(Math.random()*KEYS.length)];
    var f=FRUITS[k];
    var sh=f.shape.map(function(r){return r.slice();});
    var p={key:k, shape:sh, x:Math.floor((COLS-sh[0].length)/2), y:0};
    if(collides(p,grid)) return null;
    return p;
  }
  function cellsOf(p){
    var out=[];
    for(var r=0;r&lt;p.shape.length;r++) for(var c=0;c&lt;p.shape[r].length;c++)
      if(p.shape[r][c]) out.push({x:p.x+c,y:p.y+r});
    return out;
  }
  function collides(p,g){
    var cs=cellsOf(p);
    for(var i=0;i&lt;cs.length;i++){ var x=cs[i].x,y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; g[y][x]) return true; }
    return false;
  }
  function lockPiece(){
    var cs=cellsOf(piece);
    for(var i=0;i&lt;cs.length;i++){ var x=cs[i].x,y=cs[i].y;
      if(y&gt;=0){ grid[y][x]=piece.key; pops.push({c:x,r:y,t:1}); } }
    piece=null;
  }
  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    var n=full.length;
    if(n===0) return;
    for(var i=0;i&lt;full.length;i++){ grid.splice(full[i],1); var e=[]; for(var c2=0;c2&lt;COLS;c2++)e.push(null); grid.unshift(e); }
    var pts = n===1?100 : n===2?300 : n===3?500 : 1000;
    score += pts;
    if(n&gt;=4){ triggerFrenzy(); }
    linesCleared += n;
    var newLevel = 1 + Math.floor(linesCleared/10);
    if(newLevel!==level){ level=newLevel; dropMs=Math.max(120, 500 - (level-1)*45); restartDrop(); }
    updateHUD();
  }
  function triggerFrenzy(){
    frenzyEl.classList.remove(&#x27;show&#x27;); void frenzyEl.offsetWidth; frenzyEl.classList.add(&#x27;show&#x27;);
    flash=1;
    for(var i=0;i&lt;90;i++){
      confetti.push({ x:Math.random()*cv.width, y:cv.height*0.4,
        vx:(Math.random()-0.5)*7, vy:-Math.random()*8-3,
        col:&#x27;hsl(&#x27;+Math.floor(Math.random()*360)+&#x27;,90%,60%)&#x27;,
        s:4+Math.random()*5, life:1 });
    }
    beep(660,0.15); setTimeout(function(){beep(880,0.15);},120); setTimeout(function(){beep(1100,0.2);},240);
  }
  function updateHUD(){ scoreEl.textContent=score; levelEl.textContent=level; }

  function ghostPiece(){
    if(!piece) return null;
    var g={key:piece.key,shape:piece.shape,x:piece.x,y:piece.y};
    while(!collides({key:g.key,shape:g.shape,x:g.x,y:g.y+1},grid)) g.y++;
    return g;
  }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // faint grid
    ctx.strokeStyle=&#x27;rgba(200,120,150,0.12)&#x27;;
    for(var c=0;c&lt;=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,ROWS*CELL);ctx.stroke();}
    for(var r=0;r&lt;=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(COLS*CELL,r*CELL);ctx.stroke();}
    // ghost
    var g=ghostPiece();
    if(g){ var gc=cellsOf(g); ctx.globalAlpha=0.28;
      for(var i=0;i&lt;gc.length;i++) drawTile(gc[i].x,gc[i].y,FRUITS[g.key],1,false);
      ctx.globalAlpha=1; }
    // locked
    for(var rr=0;rr&lt;ROWS;rr++) for(var cc=0;cc&lt;COLS;cc++){
      if(grid[rr][cc]){ var sc=1; for(var p=0;p&lt;pops.length;p++) if(pops[p].c===cc&amp;&amp;pops[p].r===rr) sc=1+0.25*pops[p].t;
        drawTile(cc,rr,FRUITS[grid[rr][cc]],sc,true); } }
    // active piece
    if(piece){ var cs=cellsOf(piece); for(var j=0;j&lt;cs.length;j++) if(cs[j].y&gt;=0) drawTile(cs[j].x,cs[j].y,FRUITS[piece.key],1,true); }
    // confetti
    for(var k=0;k&lt;confetti.length;k++){ var pt=confetti[k];
      ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.col;
      ctx.fillRect(pt.x,pt.y,pt.s,pt.s); }
    ctx.globalAlpha=1;
    // flash overlay
    if(flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.5)+&#x27;)&#x27;; ctx.fillRect(0,0,cv.width,cv.height); }
  }
  function drawTile(c,r,f,scale,withEmoji){
    var x=c*CELL, y=r*CELL, s=CELL, pad=2;
    ctx.save();
    ctx.translate(x+s/2,y+s/2); ctx.scale(scale,scale); ctx.translate(-s/2,-s/2);
    roundRect(pad,pad,s-2*pad,s-2*pad,7); 
    var grad=ctx.createLinearGradient(0,0,0,s);
    grad.addColorStop(0, lighten(f.color,25)); grad.addColorStop(1, f.color);
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle=&#x27;rgba(255,255,255,0.6)&#x27;; ctx.lineWidth=1.5; ctx.stroke();
    if(withEmoji){ ctx.font=(s*0.6)+&#x27;px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(f.emoji, s/2, s/2+1); }
    ctx.restore();
  }
  function roundRect(x,y,w,h,rad){ ctx.beginPath();
    ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath(); }
  function lighten(hex,amt){
    var n=parseInt(hex.slice(1),16), r=(n&gt;&gt;16)+amt, g=((n&gt;&gt;8)&amp;255)+amt, b=(n&amp;255)+amt;
    r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function stepDown(){
    if(!piece) return;
    var next={key:piece.key,shape:piece.shape,x:piece.x,y:piece.y+1};
    if(collides(next,grid)){ lockPiece(); clearRows(); piece=spawnPiece(); if(!piece){ endGame(); } }
    else piece=next;
  }
  function move(dx){ if(!running||!piece) return; var n={key:piece.key,shape:piece.shape,x:piece.x+dx,y:piece.y};
    if(!collides(n,grid)) piece=n; }
  function rotate(){ if(!running||!piece) return;
    var ns=rotateShape(piece.shape); var n={key:piece.key,shape:ns,x:piece.x,y:piece.y};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){ var t={key:n.key,shape:ns,x:piece.x+kicks[i],y:piece.y};
      if(!collides(t,grid)){ piece=t; return; } }
  }

  function loop(){
    // animate pops
    for(var i=pops.length-1;i&gt;=0;i--){ pops[i].t-=0.12; if(pops[i].t&lt;=0) pops.splice(i,1); }
    // confetti
    for(var k=confetti.length-1;k&gt;=0;k--){ var p=confetti[k];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.life-=0.012;
      if(p.life&lt;=0||p.y&gt;cv.height) confetti.splice(k,1); }
    if(flash&gt;0) flash-=0.04;
    draw();
    animId=requestAnimationFrame(loop);
  }

  function restartDrop(){ if(dropId) clearInterval(dropId); if(running) dropId=setInterval(stepDown,dropMs); }

  function startGame(){
    makeGrid(); score=0; level=1; linesCleared=0; dropMs=500;
    pops=[]; confetti=[]; flash=0;
    piece=spawnPiece(); running=true; overEl.style.display=&#x27;none&#x27;;
    updateHUD();
    if(dropId) clearInterval(dropId); dropId=setInterval(stepDown,dropMs);
    if(!animId) loop();
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }
  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} overEl.style.display=&#x27;block&#x27;; beep(200,0.3); }

  // sound
  var actx=null;
  function beep(freq,dur){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=freq; o.type=&#x27;triangle&#x27;;
    o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.15,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur); }catch(_){}}

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ if(running){stepDown(); score+=1; updateHUD();} e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });

  // touch: left third move left, right third move right, swipe down soft drop
  var tsx=0,tsy=0,tst=0;
  cv.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tst=Date.now(); e.preventDefault(); },{passive:false});
  cv.addEventListener(&#x27;touchend&#x27;,function(e){ var t=e.changedTouches[0];
    var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(dy&gt;30 &amp;&amp; Math.abs(dy)&gt;Math.abs(dx)){ if(running){stepDown();score+=1;updateHUD();} }
    else if(Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20){
      var rect=cv.getBoundingClientRect(); var rel=(t.clientX-rect.left)/rect.width;
      if(rel&lt;0.4) move(-1); else if(rel&gt;0.6) move(1); else rotate();
    }
    e.preventDefault();
  },{passive:false});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){ try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){} },true);
  });

  // initial paint (stopped)
  makeGrid(); score=0; level=1; linesCleared=0; running=false;
  piece=spawnPiece(); updateHUD(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor

<script>
