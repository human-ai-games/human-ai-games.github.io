<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash: River Rush</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0d2818; color: #eaf7ee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: #ffe27a; text-shadow: 2px 2px 0 #1a5a2a; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #bfe6c8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #ffe27a; margin: 0; font-weight: 700; }
  .score.pop { animation: scorepop 0.35s ease; }
  @keyframes scorepop { 0%{transform:scale(1);} 40%{transform:scale(1.5);} 100%{transform:scale(1);} }
  .field {
    position: relative; width: 620px; height: 460px; flex-shrink: 0;
    border-radius: 10px; overflow: hidden;
    background:
      linear-gradient(180deg, #2f7d4a 0 8%, #2f7d4a 8%, transparent 8%),
      linear-gradient(180deg, #2f7d4a 92%, #2f7d4a 100%),
      repeating-linear-gradient(180deg, #1b6ea3 0 20px, #1d78b0 20px 40px);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .bank { position: absolute; left: 0; right: 0; background: linear-gradient(#3ea15c, #2f7d4a); z-index: 1; }
  .bank .grass { position:absolute; bottom:0; left:0; right:0; height:6px; background: repeating-linear-gradient(90deg,#4fc06e 0 8px,#3ea15c 8px 16px); }
  .ripple { position: absolute; left: -40px; right: -40px; height: 2px; background: rgba(255,255,255,0.18); border-radius: 2px; }
  .obstacle { position: absolute; z-index: 3; }
  /* Log */
  .log { background: linear-gradient(180deg,#a86b3a,#7a4a24); border-radius: 8px; border: 2px solid #5c3518;
         box-shadow: inset 0 3px 0 rgba(255,255,255,0.15); }
  .log::before { content:&#x27;&#x27;; position:absolute; left:6px; top:50%; transform:translateY(-50%); width:10px; height:10px; border-radius:50%; background:#c98a52; box-shadow:0 0 0 3px #7a4a24; }
  .log::after { content:&#x27;&#x27;; position:absolute; right:6px; top:50%; transform:translateY(-50%); width:10px; height:10px; border-radius:50%; background:#c98a52; box-shadow:0 0 0 3px #7a4a24; }
  /* Croc */
  .croc { background: linear-gradient(180deg,#4caf50,#c0392b); border-radius: 10px; border:2px solid #7a1f14; display:flex; align-items:center; }
  .croc .snout { position:absolute; height:60%; top:20%; width:22px; background:#b0362a; border-radius:0 8px 8px 0; }
  .croc .teeth { position:absolute; height:5px; top:50%; background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 8px); }
  .croc .eye { position:absolute; top:3px; width:7px; height:7px; border-radius:50%; background:#ffde59; border:1px solid #000; }
  /* Fish */
  .fish { background: radial-gradient(circle at 30% 40%, #6fd4ff, #2481c4); border-radius: 50% 40% 40% 50%; border:2px solid #185a8c; }
  .fish .tail { position:absolute; right:-8px; top:50%; transform:translateY(-50%); width:0; height:0; border-top:9px solid transparent; border-bottom:9px solid transparent; border-left:12px solid #2481c4; }
  .fish .feye { position:absolute; left:22%; top:30%; width:6px; height:6px; border-radius:50%; background:#fff; border:1px solid #000; }
  /* Frog */
  .frog { position:absolute; z-index: 6; transition: left 0.09s ease, top 0.09s ease; }
  .frog .body { position:absolute; inset:6px; background: radial-gradient(circle at 40% 30%, #7ee06a, #3ba84a); border-radius:48% 48% 42% 42%; border:2px solid #24732f; }
  .frog .eye { position:absolute; width:11px; height:11px; background:#fff; border:2px solid #1c5926; border-radius:50%; top:2px; }
  .frog .eye.l { left:6px; } .frog .eye.r { right:6px; }
  .frog .eye .p { position:absolute; width:5px; height:5px; background:#111; border-radius:50%; top:2px; left:2px; }
  .frog .leg { position:absolute; width:8px; height:10px; background:#3ba84a; border:2px solid #24732f; border-radius:4px; bottom:0; }
  .frog .leg.l { left:0; transform-origin:top; }
  .frog .leg.r { right:0; transform-origin:top; }
  .frog.hop .body { animation: hopb 0.18s ease; }
  .frog.hop .leg.l { animation: legl 0.18s ease; }
  .frog.hop .leg.r { animation: legr 0.18s ease; }
  @keyframes hopb { 50%{ transform: scaleY(1.15) translateY(-3px);} }
  @keyframes legl { 50%{ transform: rotate(35deg);} }
  @keyframes legr { 50%{ transform: rotate(-35deg);} }
  /* Lily pad + sparkle */
  .lily { position:absolute; z-index:2; width:40px; height:40px; border-radius:50%;
          background: radial-gradient(circle at 40% 40%, #ffe27a, #e6a800); border:2px solid #b57e00; }
  .lily.bloom { animation: bloom 0.5s ease; }
  @keyframes bloom { 0%{ transform:scale(0.2); } 60%{ transform:scale(1.3);} 100%{ transform:scale(1);} }
  .sparkle { position:absolute; z-index:7; font-size:20px; animation: spark 0.6s ease forwards; pointer-events:none; }
  @keyframes spark { 0%{ transform:translate(0,0) scale(0.4); opacity:1;} 100%{ transform:translate(var(--dx),var(--dy)) scale(1.1); opacity:0;} }
  /* Splash + overlay */
  .splash { position:absolute; z-index:8; font-size:34px; animation: splashout 0.7s ease forwards; pointer-events:none; }
  @keyframes splashout { 0%{ transform:scale(0.3); opacity:1;} 100%{ transform:scale(2); opacity:0;} }
  .overlay { position:absolute; inset:0; z-index:9; display:none; flex-direction:column; align-items:center; justify-content:center; gap:8px;
             background: rgba(4,30,50,0.78); color:#fff; text-align:center; }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:34px; color:#ffe27a; text-shadow:2px 2px 0 #124; }
  .overlay p { margin:0; font-size:20px; }
  .overlay .hint { font-size:16px; color:#bfe6c8; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash: River Rush&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys (or swipe) across the river — ride the brown logs, dodge red crocs and blue fish, and don&#x27;t fall in the water. Reach the top bank to bloom a lily pad and score, using the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Ribbit! Game Over&lt;/h2&gt;
      &lt;p&gt;Final score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
      &lt;p class=&quot;hint&quot;&gt;Press Start below to play again&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 46;
  var COLS = 13;                 // 13 * 46 = 598, centered in 620
  var ROWS = 10;                 // row0 top bank, rows1-5 lanes, ... , row9 bottom bank... we use 7 rows visually
  var FIELD_W = 620, FIELD_H = 460;
  var GRID_ROWS = 7;             // 0 top bank, 1..5 river lanes, 6 bottom bank
  var ROW_H = FIELD_H / GRID_ROWS;  // ~65.7
  var GRID_W = COLS * CELL;         // 598
  var OFFX = (FIELD_W - GRID_W) / 2; // center offset

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  var running = false, animId = null;
  var score = 0, crossings = 0;
  var frog = { col: Math.floor(COLS/2), row: 6, x: 0 };  // x is pixel offset for log-riding/current
  var frogEl = null;
  var lanes = [];   // per river lane (rows 1..5)
  var ripples = [];
  var lastTime = 0;

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.15;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      o.start(t);
      g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      o.stop(t+dur);
    } catch(_){}
  }

  function colX(col) { return OFFX + col*CELL; }
  function rowY(row) { return row*ROW_H; }

  function buildRipples() {
    for (var i=0;i&lt;7;i++){
      var r = document.createElement(&#x27;div&#x27;);
      r.className=&#x27;ripple&#x27;;
      var y = 40 + i*55;
      r.style.top = y+&#x27;px&#x27;;
      field.appendChild(r);
      ripples.push({ el:r, y:y, x:(i*90)%FIELD_W, speed: 20+(i%3)*10, dir:(i%2?1:-1) });
    }
  }

  function makeFrog() {
    if (frogEl &amp;&amp; frogEl.parentNode) frogEl.parentNode.removeChild(frogEl);
    frogEl = document.createElement(&#x27;div&#x27;);
    frogEl.className=&#x27;frog&#x27;;
    frogEl.style.width = (CELL-8)+&#x27;px&#x27;;
    frogEl.style.height = (CELL-8)+&#x27;px&#x27;;
    frogEl.innerHTML =
      &#x27;&lt;div class=&quot;body&quot;&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;eye l&quot;&gt;&lt;div class=&quot;p&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;eye r&quot;&gt;&lt;div class=&quot;p&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;leg l&quot;&gt;&lt;/div&gt;&lt;div class=&quot;leg r&quot;&gt;&lt;/div&gt;&#x27;;
    field.appendChild(frogEl);
  }

  // Lane config. type: &#x27;log&#x27;,&#x27;croc&#x27;,&#x27;fish&#x27;,&#x27;current&#x27;
  // Rows 1..5. Design: row1 log, row2 croc, row3 current, row4 fish, row5 log
  function laneConfig(level) {
    var shrink = Math.min(level*10, 40);   // logs get shorter with level
    var speedBoost = level*0.15;
    return [
      { row:1, type:&#x27;log&#x27;,  dir:1,  speed:55+speedBoost*30, len:CELL*2.4-shrink, gap:CELL*3.2, count:3 },
      { row:2, type:&#x27;croc&#x27;, dir:-1, speed:70+speedBoost*45, len:CELL*1.8,        gap:CELL*3.0, count:3 },
      { row:3, type:&#x27;current&#x27;, dir:1, speed:45+speedBoost*20 },  // sweeps frog sideways
      { row:4, type:&#x27;fish&#x27;, dir:1,  speed:85+speedBoost*40, len:CELL*1.1,        gap:CELL*3.4, count:3 },
      { row:5, type:&#x27;log&#x27;,  dir:-1, speed:50+speedBoost*30, len:CELL*2.6-shrink, gap:CELL*3.4, count:3 }
    ];
  }

  function buildLanes() {
    // remove existing obstacle els
    lanes.forEach(function(l){ (l.items||[]).forEach(function(it){ if(it.el.parentNode) it.el.parentNode.removeChild(it.el); }); });
    lanes = [];
    var cfg = laneConfig(Math.floor(crossings/3));
    cfg.forEach(function(c){
      var y = rowY(c.row) + (ROW_H - (ROW_H*0.55))/2;
      var h = ROW_H*0.55;
      var items = [];
      if (c.type !== &#x27;current&#x27;) {
        var span = c.len + c.gap;
        var total = c.count;
        for (var j=0;j&lt;total;j++){
          var el = document.createElement(&#x27;div&#x27;);
          el.className = &#x27;obstacle &#x27;+c.type;
          el.style.width = c.len+&#x27;px&#x27;;
          el.style.height = h+&#x27;px&#x27;;
          el.style.top = y+&#x27;px&#x27;;
          if (c.type===&#x27;croc&#x27;){
            el.innerHTML=&#x27;&lt;div class=&quot;snout&quot; style=&quot;&#x27;+(c.dir&lt;0?&#x27;left&#x27;:&#x27;right&#x27;)+&#x27;:-14px&quot;&gt;&lt;/div&gt;&#x27;+
              &#x27;&lt;div class=&quot;teeth&quot; style=&quot;left:8px;right:8px&quot;&gt;&lt;/div&gt;&#x27;+
              &#x27;&lt;div class=&quot;eye&quot; style=&quot;left:14px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;eye&quot; style=&quot;left:30px&quot;&gt;&lt;/div&gt;&#x27;;
          } else if (c.type===&#x27;fish&#x27;){
            el.innerHTML=&#x27;&lt;div class=&quot;tail&quot; style=&quot;&#x27;+(c.dir&lt;0?&#x27;left:-8px;border-left:none;border-right:12px solid #2481c4&#x27;:&#x27;right:-8px&#x27;)+&#x27;&quot;&gt;&lt;/div&gt;&lt;div class=&quot;feye&quot;&gt;&lt;/div&gt;&#x27;;
          }
          field.appendChild(el);
          var x = j*span;
          el.style.left = x+&#x27;px&#x27;;
          items.push({ el:el, x:x, w:c.len });
        }
      }
      lanes.push({ row:c.row, type:c.type, dir:c.dir, speed:c.speed, span:(c.len||0)+(c.gap||0), items:items, y:y, h:h });
    });
  }

  function paintFrog(hop) {
    var baseX = colX(frog.col);
    frogEl.style.left = (baseX + frog.x) + &#x27;px&#x27;;
    frogEl.style.top = (rowY(frog.row) + (ROW_H-(CELL-8))/2) + &#x27;px&#x27;;
    if (hop) {
      frogEl.classList.remove(&#x27;hop&#x27;);
      void frogEl.offsetWidth;
      frogEl.classList.add(&#x27;hop&#x27;);
    }
  }

  function resetFrog() {
    frog.col = Math.floor(COLS/2);
    frog.row = 6;
    frog.x = 0;
    paintFrog(false);
  }

  function isRiverRow(row){ return row&gt;=1 &amp;&amp; row&lt;=5; }

  function laneForRow(row){
    for (var i=0;i&lt;lanes.length;i++) if (lanes[i].row===row) return lanes[i];
    return null;
  }

  function tick(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = Math.min((ts-lastTime)/1000, 0.05);
    lastTime = ts;

    // ripples
    ripples.forEach(function(r){
      r.x += r.dir*r.speed*dt;
      if (r.x &gt; FIELD_W) r.x = -80;
      if (r.x &lt; -80) r.x = FIELD_W;
      r.el.style.transform = &#x27;translateX(&#x27;+r.x+&#x27;px)&#x27;;
    });

    // move obstacles
    lanes.forEach(function(l){
      if (l.type===&#x27;current&#x27;) return;
      l.items.forEach(function(it){
        it.x += l.dir*l.speed*dt;
        if (l.dir&gt;0 &amp;&amp; it.x &gt; GRID_W) it.x -= l.span*l.items.length;
        if (l.dir&lt;0 &amp;&amp; it.x + it.w &lt; 0) it.x += l.span*l.items.length;
        it.el.style.left = it.x+&#x27;px&#x27;;
      });
    });

    // frog physics on river rows
    var lane = laneForRow(frog.row);
    if (lane) {
      if (lane.type===&#x27;log&#x27;) {
        // find the log the frog is on
        var onLog = null;
        var fx = colX(frog.col) - OFFX + frog.x;   // frog left in grid coords
        var fcx = fx + (CELL-8)/2;
        lane.items.forEach(function(it){
          if (fcx &gt;= it.x &amp;&amp; fcx &lt;= it.x+it.w) onLog = it;
        });
        if (onLog) {
          frog.x += lane.dir*lane.speed*dt;
          // fell off screen while riding?
          var absX = colX(frog.col) + frog.x;
          if (absX + (CELL-8) &lt; 0 || absX &gt; FIELD_W) { die(); return; }
          paintFrog(false);
        } else {
          die(); return;  // stepped into water gap in a log lane
        }
      } else if (lane.type===&#x27;current&#x27;) {
        // swept sideways
        frog.x += lane.dir*lane.speed*dt;
        var absX2 = colX(frog.col) + frog.x;
        if (absX2 + (CELL-8) &lt; 0 || absX2 &gt; FIELD_W) { die(); return; }
        paintFrog(false);
      } else {
        // croc / fish lane: any overlap = death
        var fgx = colX(frog.col) - OFFX + frog.x;
        var fgw = CELL-8;
        var hit = false;
        lane.items.forEach(function(it){
          if (fgx &lt; it.x+it.w &amp;&amp; fgx+fgw &gt; it.x) hit = true;
        });
        if (hit) { die(); return; }
      }
    }

    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = frog.col + dc;
    var nr = frog.row + dr;
    if (nr &lt; 0) nr = 0;
    if (nr &gt; 6) nr = 6;

    // Column bounds: account for accumulated x offset when moving horizontally.
    if (dc !== 0) {
      // convert current pixel position to nearest column when leaving a log/current
      // apply the offset into the column then move
      var effectiveX = colX(frog.col) + frog.x + dc*CELL;
      if (effectiveX &lt; OFFX) { effectiveX = OFFX; }
      if (effectiveX &gt; OFFX + GRID_W - CELL) { effectiveX = OFFX + GRID_W - CELL; }
      // snap to nearest column, keep residual as x
      var rel = (effectiveX - OFFX) / CELL;
      nc = Math.round(rel);
      nc = Math.max(0, Math.min(COLS-1, nc));
      frog.col = nc;
      frog.x = effectiveX - colX(frog.col);
      paintFrog(true);
      beep(420, 0.08, &#x27;square&#x27;, 0.08);
      return;
    }

    // vertical move: snap x offset into a whole column when landing on a fixed row
    frog.row = nr;
    // reconcile x -&gt; col so vertical logic is grid-aligned for non-log rows
    var newCol = Math.round((colX(frog.col)+frog.x - OFFX)/CELL);
    newCol = Math.max(0, Math.min(COLS-1, newCol));
    frog.col = newCol;
    frog.x = colX(frog.col)+frog.x - colX(newCol); // preserve; will be corrected below for safe rows

    // On banks, force alignment
    if (!isRiverRow(frog.row)) { frog.x = Math.max(-OFFX, Math.min(FIELD_W-OFFX-CELL, frog.x)); }

    paintFrog(true);
    beep(520, 0.08, &#x27;square&#x27;, 0.08);

    if (frog.row === 0) {
      succeed();
    } else if (isRiverRow(frog.row)) {
      // immediate check: landing in water gap of a log lane, or on a croc/fish
      var lane = laneForRow(frog.row);
      if (lane) {
        var fgx = colX(frog.col) - OFFX + frog.x;
        var fgw = CELL-8, fcx = fgx+fgw/2;
        if (lane.type===&#x27;log&#x27;) {
          var on = false;
          lane.items.forEach(function(it){ if (fcx&gt;=it.x &amp;&amp; fcx&lt;=it.x+it.w) on=true; });
          if (!on) { die(); }
        } else if (lane.type===&#x27;croc&#x27; || lane.type===&#x27;fish&#x27;) {
          var hit=false;
          lane.items.forEach(function(it){ if (fgx &lt; it.x+it.w &amp;&amp; fgx+fgw &gt; it.x) hit=true; });
          if (hit) die();
        }
      }
    }
  }

  function succeed() {
    score++; crossings++;
    scoreEl.textContent = score;
    scoreEl.parentNode.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.parentNode.classList.add(&#x27;pop&#x27;);
    beep(660,0.1,&#x27;sine&#x27;,0.15); setTimeout(function(){beep(880,0.14,&#x27;sine&#x27;,0.15);},90);
    // lily pad bloom at frog position on bank
    var lx = colX(frog.col)+frog.x + (CELL-8)/2 - 20;
    var ly = rowY(0) + (ROW_H-40)/2;
    var lily = document.createElement(&#x27;div&#x27;);
    lily.className=&#x27;lily bloom&#x27;;
    lily.style.left = lx+&#x27;px&#x27;; lily.style.top = ly+&#x27;px&#x27;;
    field.appendChild(lily);
    // sparkles
    var chars=[&#x27;✨&#x27;,&#x27;⭐&#x27;,&#x27;💫&#x27;,&#x27;✨&#x27;];
    for (var i=0;i&lt;6;i++){
      var s=document.createElement(&#x27;div&#x27;);
      s.className=&#x27;sparkle&#x27;; s.textContent=chars[i%chars.length];
      s.style.left=(lx+18)+&#x27;px&#x27;; s.style.top=(ly+10)+&#x27;px&#x27;;
      var ang=Math.random()*Math.PI*2, d=25+Math.random()*25;

      s.style.setProperty(&#x27;--dy&#x27;,(Math.sin(ang)*d)+&#x27;px&#x27;);
      field.appendChild(s);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },700); })(s);
    }
    setTimeout(function(){ if(lily.parentNode) lily.parentNode.removeChild(lily); }, 900);

    if (crossings % 3 === 0) buildLanes();
    resetFrog();

  function die() {
    if (!running) return;
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    beep(200,0.3,&#x27;sawtooth&#x27;,0.2);
    // splash
    var sp=document.createElement(&#x27;div&#x27;);
    sp.className=&#x27;splash&#x27;; sp.textContent=&#x27;💦&#x27;;
    sp.style.left=(colX(frog.col)+frog.x)+&#x27;px&#x27;;
    sp.style.top=(rowY(frog.row))+&#x27;px&#x27;;
    field.appendChild(sp);
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },700);
    if (frogEl) frogEl.style.display=&#x27;none&#x27;;
    finalScoreEl.textContent = score;
    setTimeout(function(){ overlay.classList.add(&#x27;show&#x27;); }, 300);
  }

  function startGame() {
    overlay.classList.remove(&#x27;show&#x27;);
    score = 0; crossings = 0; lastTime = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    // clear obstacle els
    lanes.forEach(function(l){ (l.items||[]).forEach(function(it){ if(it.el.parentNode) it.el.parentNode.removeChild(it.el); }); });
    lanes=[];
    buildLanes();
    makeFrog();
    frogEl.style.display=&#x27;&#x27;;
    resetFrog();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }

  // swipe support
  var tsx=0, tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20) return;
    if (Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0);
    else move(0, dy&gt;0?1:-1);

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();

  // telemetry
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // banks (visual) + initial paint
  (function(){
    var top=document.createElement(&#x27;div&#x27;); top.className=&#x27;bank&#x27;;
    top.style.top=&#x27;0&#x27;; top.style.height=rowY(1)+&#x27;px&#x27;;
    top.innerHTML=&#x27;&lt;div class=&quot;grass&quot;&gt;&lt;/div&gt;&#x27;;
    field.appendChild(top);
    var bot=document.createElement(&#x27;div&#x27;); bot.className=&#x27;bank&#x27;;
    bot.style.top=rowY(6)+&#x27;px&#x27;; bot.style.height=(FIELD_H-rowY(6))+&#x27;px&#x27;;
    field.appendChild(bot);
  })();
  buildRipples();
  buildLanes();
  makeFrog();
  paintFrog(false);

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;

        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}

    try {

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();

      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;

      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.

        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor

  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {

    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
