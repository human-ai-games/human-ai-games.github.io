<html lang="en">
<head>

<title>🦀 Crab Bop 🦀</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🦀 Crab Bop 🦀</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(#0a4d6e, #08607f); color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.4); letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #cdeffa; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 18px; width: 640px; }
  .coins { font-size: 22px; font-weight: 700; background: #14384b; padding: 4px 14px; border-radius: 20px; box-shadow: inset 0 0 0 2px #f5c542; }
  .timer { font-size: 20px; font-weight: 700; background: #14384b; padding: 4px 14px; border-radius: 20px; }
  .heatwrap { flex: 1; height: 20px; background: #0c2b3a; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 2px #2a5a72; position: relative; }
  .heatbar { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd23f,#ff7a1a,#ff2e63); transition: width .15s; }
  .heatlabel { position: absolute; inset: 0; font-size: 12px; font-weight: 700; line-height: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .board { position: relative; width: 640px; height: 430px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
    background: linear-gradient(#0d5f7d 0%, #0d5f7d 42%, #e9d29a 42%, #d8bd7f 100%); box-shadow: inset 0 0 40px rgba(0,0,0,.35); }
  .hole { position: absolute; transform: translate(-50%,-50%); }
  .crab { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 110%); cursor: pointer; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  .crab.up { transform: translate(-50%, -6px); }
  .crab .body { font-size: 42px; line-height: 1; user-select: none; }
  .crab.wiggle .body { animation: wig .5s ease-in-out infinite; }
  @keyframes wig { 0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)} }
  .banner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%) scale(0); font-size: 40px; font-weight: 900;
    color: #ffe14d; text-shadow: 0 0 14px #ff7a1a, 0 3px 6px rgba(0,0,0,.5); letter-spacing: 3px; pointer-events: none; transition: transform .2s; z-index: 5; }
  .banner.show { transform: translateX(-50%) scale(1); animation: pulse .4s ease-in-out infinite alternate; }
  @keyframes pulse { from{filter:brightness(1)} to{filter:brightness(1.5)} }
  .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,.5); box-shadow: inset 0 0 4px #fff; pointer-events: none; }
  .splat { position: absolute; transform: translate(-50%,-50%); font-size: 36px; pointer-events: none; animation: splatpop .4s ease-out forwards; }
  @keyframes splatpop { 0%{transform:translate(-50%,-50%) scale(.4);opacity:1} 100%{transform:translate(-50%,-50%) scale(1.4);opacity:0} }
  .floatscore { position: absolute; transform: translateX(-50%); font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.5); pointer-events: none; animation: rise .7s ease-out forwards; }
  @keyframes rise { 0%{opacity:1;transform:translate(-50%,0)} 100%{opacity:0;transform:translate(-50%,-40px)} }
  .final { position: absolute; inset: 0; background: rgba(6,40,55,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 10; }
  .final h2 { font-size: 34px; margin: 0; color: #ffe14d; text-shadow: 0 3px 6px rgba(0,0,0,.5); }
  .final .big { font-size: 46px; font-weight: 900; }
  .final .sub { font-size: 17px; color: #cdeffa; }
  .hidden { display: none !important; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦀 Crab Bop 🦀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Bop the top-hatted crabs before they duck back down — small ones are quick but worth more. Chain 3 fast hits for a FRENZY, and see your reef title when time&#x27;s up!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;coins&quot;&gt;🪙 &lt;span id=&quot;coins&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;heatwrap&quot;&gt;&lt;div class=&quot;heatbar&quot; id=&quot;heat&quot;&gt;&lt;/div&gt;&lt;div class=&quot;heatlabel&quot; id=&quot;heatlabel&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot;&gt;⏱ &lt;span id=&quot;timer&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;FRENZY!&lt;/div&gt;
    &lt;div class=&quot;final hidden&quot; id=&quot;final&quot;&gt;
      &lt;h2 id=&quot;finalTitle&quot;&gt;King of the Reef&lt;/h2&gt;
      &lt;div class=&quot;big&quot;&gt;🪙 &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sub&quot;&gt;Press Restart below to play again!&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 430;
  var board = document.getElementById(&#x27;board&#x27;);
  var coinsEl = document.getElementById(&#x27;coins&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);
  var heatEl = document.getElementById(&#x27;heat&#x27;);
  var heatLabel = document.getElementById(&#x27;heatlabel&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var finalEl = document.getElementById(&#x27;final&#x27;);
  var finalTitle = document.getElementById(&#x27;finalTitle&#x27;);
  var finalScore = document.getElementById(&#x27;finalScore&#x27;);

  // Hole positions (percent of board), scattered in the sand region.
  var HOLES = [
    {x:14,y:56},{x:38,y:50},{x:62,y:54},{x:86,y:58},
    {x:26,y:74},{x:52,y:78},{x:78,y:80},{x:44,y:64}
  ];
  var holeEls = [];

  var TYPES = {
    small:  {emoji:&#x27;🦀&#x27;, pts:3, life:820,  size:34, wiggle:820},
    medium: {emoji:&#x27;🦀&#x27;, pts:2, life:1350, size:44, wiggle:900},
    large:  {emoji:&#x27;🦀&#x27;, pts:1, life:1900, size:56, wiggle:1000, fake:true}
  };

  var score=0, timeLeft=60, running=false;
  var spawnId=null, timerId=null, spawnDelay=850;
  var comboHits=[], frenzyUntil=0;
  var occupied={};
  var moleTimers=[];
  var audioCtx=null;

  function initHoles(){
    holeEls.forEach(function(h){ if(h.parentNode) board.removeChild(h); });
    holeEls = [];
    HOLES.forEach(function(pos, i){
      var h = document.createElement(&#x27;div&#x27;);
      h.className=&#x27;hole&#x27;;
      h.style.left = pos.x + &#x27;%&#x27;;
      h.style.top = pos.y + &#x27;%&#x27;;
      h.innerHTML =
        &#x27;&lt;svg width=&quot;72&quot; height=&quot;46&quot; viewBox=&quot;0 0 72 46&quot;&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;36&quot; cy=&quot;30&quot; rx=&quot;34&quot; ry=&quot;15&quot; fill=&quot;#5a3d22&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;36&quot; cy=&quot;27&quot; rx=&quot;30&quot; ry=&quot;12&quot; fill=&quot;#2a1b0e&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;12&quot; cy=&quot;20&quot; rx=&quot;8&quot; ry=&quot;10&quot; fill=&quot;#ff6b8a&quot;/&gt;&#x27; +
        &#x27;&lt;ellipse cx=&quot;60&quot; cy=&quot;18&quot; rx=&quot;7&quot; ry=&quot;11&quot; fill=&quot;#ff9e42&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;30&quot; y=&quot;6&quot; width=&quot;4&quot; height=&quot;14&quot; rx=&quot;2&quot; fill=&quot;#7bd389&quot;/&gt;&#x27; +
        &#x27;&lt;rect x=&quot;40&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;#5cc9c9&quot;/&gt;&#x27; +
        &#x27;&lt;/svg&gt;&#x27;;
      board.appendChild(h);
      holeEls.push(h);
    });
  }

  function beep(freq, dur, type){
    if(!audioCtx) return;
    try {
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.28, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+dur);
      o.frequency.exponentialRampToValueAtTime(freq*0.4, audioCtx.currentTime+dur);
      o.start(); o.stop(audioCtx.currentTime+dur);
    } catch(_){}
  }
  function bonk(){ beep(320,.16,&#x27;square&#x27;); setTimeout(function(){beep(180,.12,&#x27;triangle&#x27;);},40); }

  function crabSVG(color){
    return &#x27;&lt;svg width=&quot;1em&quot; height=&quot;1em&quot; viewBox=&quot;0 0 100 100&quot; style=&quot;width:1em;height:1em;overflow:visible;display:block&quot;&gt;&#x27; +
      // top hat
      &#x27;&lt;rect x=&quot;35&quot; y=&quot;4&quot; width=&quot;30&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;26&quot; y=&quot;22&quot; width=&quot;48&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;35&quot; y=&quot;17&quot; width=&quot;30&quot; height=&quot;4&quot; fill=&quot;#c0392b&quot;/&gt;&#x27; +
      // body
      &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;62&quot; rx=&quot;34&quot; ry=&quot;24&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
      // eyes
      &#x27;&lt;circle cx=&quot;40&quot; cy=&quot;44&quot; r=&quot;6&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;44&quot; r=&quot;6&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;40&quot; cy=&quot;45&quot; r=&quot;3&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;45&quot; r=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      // claws
      &#x27;&lt;path d=&quot;M18 60 q-14 -6 -12 -18 q10 4 14 12z&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M82 60 q14 -6 12 -18 q-10 4 -14 12z&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
      // legs
      &#x27;&lt;line x1=&quot;24&quot; y1=&quot;70&quot; x2=&quot;10&quot; y2=&quot;82&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;4&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;30&quot; y1=&quot;80&quot; x2=&quot;20&quot; y2=&quot;94&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;4&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;76&quot; y1=&quot;70&quot; x2=&quot;90&quot; y2=&quot;82&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;4&quot;/&gt;&#x27; +
      &#x27;&lt;line x1=&quot;70&quot; y1=&quot;80&quot; x2=&quot;80&quot; y2=&quot;94&quot; stroke=&quot;&#x27;+color+&#x27;&quot; stroke-width=&quot;4&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }
  function winkSVG(color){
    return &#x27;&lt;svg width=&quot;1em&quot; height=&quot;1em&quot; viewBox=&quot;0 0 100 100&quot; style=&quot;width:1em;height:1em;overflow:visible;display:block&quot;&gt;&#x27; +
      &#x27;&lt;rect x=&quot;35&quot; y=&quot;4&quot; width=&quot;30&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;26&quot; y=&quot;22&quot; width=&quot;48&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;#222&quot;/&gt;&#x27; +
      &#x27;&lt;rect x=&quot;35&quot; y=&quot;17&quot; width=&quot;30&quot; height=&quot;4&quot; fill=&quot;#c0392b&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;62&quot; rx=&quot;34&quot; ry=&quot;24&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;circle cx=&quot;40&quot; cy=&quot;44&quot; r=&quot;6&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;40&quot; cy=&quot;45&quot; r=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M54 45 q6 -4 12 0&quot; stroke=&quot;#111&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M40 72 q10 8 20 0&quot; stroke=&quot;#111&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M18 60 q-14 -6 -12 -18 q10 4 14 12z&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M82 60 q14 -6 12 -18 q-10 4 -14 12z&quot; fill=&quot;&#x27;+color+&#x27;&quot;/&gt;&#x27; +
      &#x27;&lt;/svg&gt;&#x27;;
  }

  var COLORS = [&#x27;#ff5b4d&#x27;,&#x27;#ff7f3f&#x27;,&#x27;#e84393&#x27;,&#x27;#ff9f43&#x27;];

  function spawnCrab(){
    // pick a free hole
    var free = [];
    for(var i=0;i&lt;HOLES.length;i++){ if(!occupied[i]) free.push(i); }
    if(free.length===0) return;
    var hi = free[Math.floor(Math.random()*free.length)];
    occupied[hi]=true;

    var r = Math.random();
    var typeName = r&lt;0.4 ? &#x27;small&#x27; : (r&lt;0.75 ? &#x27;medium&#x27; : &#x27;large&#x27;);
    var t = TYPES[typeName];
    var color = COLORS[Math.floor(Math.random()*COLORS.length)];

    var crab = document.createElement(&#x27;div&#x27;);
    crab.className=&#x27;crab&#x27;;
    var pos = HOLES[hi];
    crab.style.left = pos.x + &#x27;%&#x27;;
    crab.style.top = pos.y + &#x27;%&#x27;;
    crab.style.fontSize = t.size + &#x27;px&#x27;;
    crab.innerHTML = &#x27;&lt;div class=&quot;body&quot;&gt;&#x27;+crabSVG(color)+&#x27;&lt;/div&gt;&#x27;;
    board.appendChild(crab);

    var bodyEl = crab.querySelector(&#x27;.body&#x27;);
    var done=false, ducked=false;

    // rise
    requestAnimationFrame(function(){ crab.classList.add(&#x27;up&#x27;,&#x27;wiggle&#x27;); });

    // large crabs may fake-out: duck &amp; wink partway through
    var fakeTimer=null;
    if(t.fake &amp;&amp; Math.random()&lt;0.45){
      fakeTimer = setTimeout(function(){
        if(done) return;
        ducked=true;
        bodyEl.innerHTML = winkSVG(color);
        crab.classList.remove(&#x27;up&#x27;,&#x27;wiggle&#x27;);
        setTimeout(finish, 260);
      }, t.life*0.6);
      moleTimers.push(fakeTimer);
    }

    function finish(){
      if(done) return; done=true;
      occupied[hi]=false;
      crab.classList.remove(&#x27;up&#x27;,&#x27;wiggle&#x27;);
      crab.style.transform=&#x27;translate(-50%,110%)&#x27;;
      setTimeout(function(){ if(crab.parentNode) board.removeChild(crab); }, 200);
    }

    var lifeTimer = setTimeout(finish, t.life);
    moleTimers.push(lifeTimer);

    crab.addEventListener(&#x27;click&#x27;, function(){
      if(done || ducked) { return; }
      done=true;
      clearTimeout(lifeTimer); if(fakeTimer) clearTimeout(fakeTimer);
      occupied[hi]=false;
      bonk();
      registerCombo();
      var mult = (Date.now()&lt;frenzyUntil)?2:1;
      var gained = t.pts*mult;
      score += gained;
      coinsEl.textContent = score;
      showSplat(pos, gained, color);
      if(crab.parentNode) board.removeChild(crab);
    });
  }

  function showSplat(pos, gained, color){
    var px = pos.x/100*BOARD_W, py = pos.y/100*BOARD_H;
    var s = document.createElement(&#x27;div&#x27;);
    s.className=&#x27;splat&#x27;; s.textContent=&#x27;💥&#x27;;
    s.style.left = pos.x+&#x27;%&#x27;; s.style.top = pos.y+&#x27;%&#x27;;
    board.appendChild(s);
    setTimeout(function(){ if(s.parentNode) board.removeChild(s); }, 420);

    var fs = document.createElement(&#x27;div&#x27;);
    fs.className=&#x27;floatscore&#x27;; fs.textContent=&#x27;+&#x27;+gained;
    fs.style.left = pos.x+&#x27;%&#x27;; fs.style.top = (pos.y-6)+&#x27;%&#x27;;
    board.appendChild(fs);
    setTimeout(function(){ if(fs.parentNode) board.removeChild(fs); }, 700);

    for(var i=0;i&lt;6;i++) makeBubble(px, py);
  }

  function makeBubble(px, py){
    var b = document.createElement(&#x27;div&#x27;);
    b.className=&#x27;bubble&#x27;;
    var sz = 6+Math.random()*12;
    b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
    b.style.left=(px + (Math.random()*40-20))+&#x27;px&#x27;;
    b.style.top=py+&#x27;px&#x27;;
    board.appendChild(b);
    var dur = 700+Math.random()*500;
    var rise = 60+Math.random()*80;
    var start=null;
    function step(ts){
      if(!start) start=ts;
      var p=(ts-start)/dur;
      if(p&gt;=1){ if(b.parentNode) board.removeChild(b); return; }
      b.style.transform=&#x27;translateY(-&#x27;+(rise*p)+&#x27;px)&#x27;;
      b.style.opacity=(1-p).toString();
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function registerCombo(){
    var now=Date.now();
    comboHits.push(now);
    comboHits = comboHits.filter(function(t){ return now-t &lt;= 2000; });
    var pct = Math.min(comboHits.length/3,1)*100;
    heatEl.style.width = pct+&#x27;%&#x27;;
    if(comboHits.length&gt;=3){
      triggerFrenzy();
      comboHits=[];
    } else {
      heatLabel.textContent = comboHits.length&gt;=1 ? &#x27;COMBO &#x27;+comboHits.length : &#x27;&#x27;;
    }
  }

  function triggerFrenzy(){
    frenzyUntil = Date.now()+4000;
    banner.classList.add(&#x27;show&#x27;);
    heatEl.style.width=&#x27;100%&#x27;;
    heatLabel.textContent=&#x27;x2 FRENZY!&#x27;;
    resetSpawn(420);
    setTimeout(function(){
      banner.classList.remove(&#x27;show&#x27;);
      heatEl.style.width=&#x27;0%&#x27;;
      heatLabel.textContent=&#x27;&#x27;;
      if(running) resetSpawn(850);
    }, 4000);
  }

  function resetSpawn(delay){
    spawnDelay=delay;
    if(spawnId) clearInterval(spawnId);
    if(running) spawnId=setInterval(spawnCrab, spawnDelay);
  }

  function clearBoard(){
    moleTimers.forEach(clearTimeout); moleTimers=[];
    var crabs = board.querySelectorAll(&#x27;.crab&#x27;);
    crabs.forEach(function(c){ if(c.parentNode) board.removeChild(c); });
    var junk = board.querySelectorAll(&#x27;.bubble,.splat,.floatscore&#x27;);
    junk.forEach(function(c){ if(c.parentNode) board.removeChild(c); });
    occupied={};
  }

  function titleFor(s){
    if(s&gt;=90) return &#x27;👑 King of the Reef&#x27;;
    if(s&gt;=60) return &#x27;🌊 Crab Whisperer&#x27;;
    if(s&gt;=35) return &#x27;🦀 Reef Ranger&#x27;;
    if(s&gt;=15) return &#x27;🫧 Tide Tapper&#x27;;
    return &#x27;🐚 Pebble Poker&#x27;;
  }

  function startGame(){
    if(running) return;
    if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
    if(audioCtx &amp;&amp; audioCtx.state===&#x27;suspended&#x27;) audioCtx.resume();
    running=true; score=0; timeLeft=60;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {

        window.parent.postMessage(

  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {

      // fires repeatedly during layout/font load; we only need the latest.

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
