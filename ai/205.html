<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐠 Reef Rumble 🦀</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #04283f; color: #eaf6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .instructions { font-size: 16px; color: #bfe4ff; max-width: 640px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 20px; }
  .score { font-weight: 700; }
  #score { display: inline-block; }
  #score.bounce { animation: bounce .3s ease; }
  @keyframes bounce { 0%{transform:scale(1)} 40%{transform:scale(1.6);color:#ffe066} 100%{transform:scale(1)} }
  .combo { color:#ffd23f; font-weight:700; min-width:90px; }
  .board { position: relative; width: 660px; height: 430px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg,#0a5a8a 0%, #073f66 55%, #05283f 100%); box-shadow: inset 0 0 60px rgba(0,0,0,.4); }
  .board.shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,3px)} 40%{transform:translate(6px,-3px)} 60%{transform:translate(-4px,-2px)} 80%{transform:translate(4px,2px)} }
  /* seabed */
  .seabed { position:absolute; bottom:0; left:0; width:100%; height:90px; background:linear-gradient(180deg,#0b4a2e,#063d24); }
  .coral { position:absolute; bottom:60px; width:40px; height:70px; border-radius:20px 20px 0 0; opacity:.85; animation: sway 4s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes sway { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  .weed { position:absolute; bottom:55px; width:14px; height:100px; background:linear-gradient(180deg,#2fbf6a,#0b6e3a); border-radius:8px; opacity:.75; animation: sway 3s ease-in-out infinite; transform-origin:bottom center; }
  .bubbleCol { position:absolute; bottom:-30px; width:14px; height:14px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(160,220,255,.25)); }
  .creature { position:absolute; width:74px; height:74px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:46px; transform: translateY(90px) scale(.4); opacity:0; transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s; z-index:5; }
  .creature.up { transform: translateY(0) scale(1); opacity:1; }
  .creature.hit { animation: spinAway .4s ease forwards; }
  @keyframes spinAway { to { transform: rotate(540deg) scale(0); opacity:0; } }
  .flash { position:absolute; inset:0; border-radius:50%; background:#fff; opacity:0; }
  .ring { position:absolute; inset:-6px; border-radius:50%; border:4px solid #7fffbf; box-sizing:border-box; opacity:.9; }
  .glow { filter: drop-shadow(0 0 10px #ffe066) drop-shadow(0 0 18px #ffb800); }
  .jelly { animation: drift linear forwards; opacity:.75; z-index:6; }
  @keyframes drift { from{opacity:.2} 10%{opacity:.8} 90%{opacity:.8} to{opacity:.1} }
  .particle { position:absolute; width:10px; height:10px; border-radius:50%; pointer-events:none; z-index:9; }
  .banner { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-size:44px; font-weight:800; color:#ffd23f;
    text-shadow:0 0 12px #ff8a00; pointer-events:none; opacity:0; z-index:10; }
  .banner.show { animation: pop .9s ease; }
  @keyframes pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.3)} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)} 70%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1)} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐠 Reef Rumble 🦀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the sea creatures as they pop up to score — glowing anglerfish are worth triple! Avoid the ghost jellyfish (they cost a point), and chain 3 quick hits for a combo.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;time&quot;&gt;Time: &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;seabed&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W=660, BOARD_H=430, SIZE=74;
  var score=0, running=false, timeLeft=60;
  var spawnTimer=null, tickTimer=null, jellyTimer=null;
  var moleTimeouts=[];
  var comboCount=0, comboMult=1, lastHit=0;
  var elapsed=0;
  var board=document.getElementById(&#x27;board&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var comboEl=document.getElementById(&#x27;combo&#x27;);
  var timeEl=document.getElementById(&#x27;time&#x27;);
  var banner=document.getElementById(&#x27;banner&#x27;);
  var audioCtx=null;

  // decorate seabed
  (function decorate(){
    var coralColors=[&#x27;#ff6f91&#x27;,&#x27;#ffa552&#x27;,&#x27;#c77dff&#x27;,&#x27;#ff5d8f&#x27;,&#x27;#ffb703&#x27;];
    for(var i=0;i&lt;7;i++){
      var c=document.createElement(&#x27;div&#x27;); c.className=&#x27;coral&#x27;;
      c.style.left=(20+i*95+Math.random()*20)+&#x27;px&#x27;;
      c.style.background=&#x27;linear-gradient(180deg,&#x27;+coralColors[i%coralColors.length]+&#x27;,#7a2d4a)&#x27;;
      c.style.height=(50+Math.random()*40)+&#x27;px&#x27;;
      c.style.animationDelay=(Math.random()*2)+&#x27;s&#x27;;
      board.appendChild(c);
    }
    for(var j=0;j&lt;12;j++){
      var w=document.createElement(&#x27;div&#x27;); w.className=&#x27;weed&#x27;;
      w.style.left=(10+j*55+Math.random()*15)+&#x27;px&#x27;;
      w.style.height=(70+Math.random()*50)+&#x27;px&#x27;;
      w.style.animationDelay=(Math.random()*2)+&#x27;s&#x27;;
      board.appendChild(w);
    }
  })();

  function initAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function pop(freq, type){
    if(!audioCtx) return;
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||&#x27;sine&#x27;; o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*2,audioCtx.currentTime+.12);
    g.gain.setValueAtTime(.25,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.2);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.2);
  }
  function sadBleat(){
    if(!audioCtx) return;
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(180,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(90,audioCtx.currentTime+.4);
    g.gain.setValueAtTime(.2,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.45);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.45);
  }

  // bubble columns
  function makeBubble(){
    if(!running) return;
    var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;bubbleCol&#x27;;
    var size=8+Math.random()*14; b.style.width=size+&#x27;px&#x27;; b.style.height=size+&#x27;px&#x27;;
    b.style.left=Math.random()*BOARD_W+&#x27;px&#x27;;
    var dur=4+Math.random()*4;
    b.style.transition=&#x27;transform &#x27;+dur+&#x27;s linear, opacity &#x27;+dur+&#x27;s linear&#x27;;
    board.appendChild(b);
    requestAnimationFrame(function(){
      b.style.transform=&#x27;translateY(-&#x27;+(BOARD_H+40)+&#x27;px) translateX(&#x27;+((Math.random()-.5)*40)+&#x27;px)&#x27;;
      b.style.opacity=&#x27;0&#x27;;
    });
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, dur*1000);
  }

  var TYPES=[
    {emoji:&#x27;🦀&#x27;, pts:1, color:&#x27;#ff6b4a&#x27;},
    {emoji:&#x27;🐡&#x27;, pts:1, color:&#x27;#ffd23f&#x27;},
    {emoji:&#x27;🐙&#x27;, pts:1, color:&#x27;#c77dff&#x27;},
    {emoji:&#x27;🐠&#x27;, pts:1, color:&#x27;#4ac6ff&#x27;}
  ];

  function spawnCreature(){
    if(!running) return;
    var isAngler=Math.random()&lt;0.14;
    var t=TYPES[Math.floor(Math.random()*TYPES.length)];
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;creature&#x27;;
    var flash=document.createElement(&#x27;div&#x27;); flash.className=&#x27;flash&#x27;;
    var ring=document.createElement(&#x27;div&#x27;); ring.className=&#x27;ring&#x27;;
    var emoji, pts, ringColor;
    if(isAngler){ emoji=&#x27;🎏&#x27;; pts=3; el.classList.add(&#x27;glow&#x27;); ringColor=&#x27;#ffe066&#x27;; el.innerHTML=&#x27;&lt;span style=&quot;font-size:46px&quot;&gt;🐟&lt;/span&gt;&#x27;; }
    else { emoji=t.emoji; pts=1; ringColor=&#x27;#7fffbf&#x27;; el.textContent=t.emoji; }
    ring.style.borderColor=ringColor;
    el.appendChild(flash); el.appendChild(ring);
    el.style.left=(20+Math.random()*(BOARD_W-SIZE-40))+&#x27;px&#x27;;
    el.style.top=(20+Math.random()*(BOARD_H-SIZE-120))+&#x27;px&#x27;;
    board.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add(&#x27;up&#x27;); });

    // life scales with elapsed time (speeds up)
    var life=Math.max(650, 1500 - elapsed*16);
    // shrinking ring animation
    ring.style.transition=&#x27;transform &#x27;+life+&#x27;ms linear, opacity &#x27;+life+&#x27;ms linear, border-color &#x27;+life+&#x27;ms linear&#x27;;
    requestAnimationFrame(function(){
      ring.style.transform=&#x27;scale(0.2)&#x27;;
      ring.style.borderColor=&#x27;#ff4d4d&#x27;;
    });

    var done=false;
    el.addEventListener(&#x27;mousedown&#x27;, function(e){
      e.stopPropagation();
      if(done) return; done=true;
      initAudio();
      pop(isAngler?880:560, &#x27;triangle&#x27;);
      registerHit(pts, el);
      flash.style.transition=&#x27;opacity .1s&#x27;; flash.style.opacity=&#x27;.9&#x27;;
      el.classList.add(&#x27;hit&#x27;);
      burst(el, isAngler?&#x27;#ffe066&#x27;:t.color);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 400);
    });

    moleTimeouts.push(setTimeout(function(){
      if(done) return;
      el.classList.remove(&#x27;up&#x27;);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 350);
    }, life));
  }

  function spawnJelly(){
    if(!running) return;
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;creature jelly&#x27;;
    el.textContent=&#x27;🎐&#x27;;
    var fromLeft=Math.random()&lt;.5;
    var y=30+Math.random()*(BOARD_H-160);
    el.style.top=y+&#x27;px&#x27;;
    el.style.opacity=&#x27;.75&#x27;; el.style.transform=&#x27;none&#x27;;
    el.style.transition=&#x27;none&#x27;;
    el.style.left=(fromLeft?-80:BOARD_W+10)+&#x27;px&#x27;;
    board.appendChild(el);
    var dur=5000;
    el.style.transition=&#x27;left &#x27;+dur+&#x27;ms linear, opacity &#x27;+dur+&#x27;ms linear&#x27;;
    requestAnimationFrame(function(){
      el.style.left=(fromLeft?BOARD_W+10:-80)+&#x27;px&#x27;;
    });
    var done=false;
    el.addEventListener(&#x27;mousedown&#x27;, function(e){
      e.stopPropagation();
      if(done) return; done=true;
      initAudio(); sadBleat();
      score=Math.max(0,score-1); updateScore(false);
      comboCount=0; comboMult=1; comboEl.textContent=&#x27;&#x27;;
      burst(el,&#x27;#88aaff&#x27;);
      el.classList.add(&#x27;hit&#x27;);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },400);
    });
    moleTimeouts.push(setTimeout(function(){ if(el.parentNode &amp;&amp; !done) el.parentNode.removeChild(el); }, dur+100));
  }

  function registerHit(pts, el){
    var now=Date.now();
    if(now-lastHit&lt;2000){ comboCount++; } else { comboCount=1; }
    lastHit=now;
    if(comboCount&gt;=3){
      comboMult=2;
      comboEl.textContent=&#x27;x2&#x27;;
      showBanner(&#x27;COMBO x2!&#x27;);
      board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;);
    }
    score+=pts*comboMult;
    updateScore(true);
  }

  function updateScore(bounce){
    scoreEl.textContent=score;
    if(bounce){ scoreEl.classList.remove(&#x27;bounce&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;bounce&#x27;); }
  }

  function showBanner(txt){
    banner.textContent=txt;
    banner.classList.remove(&#x27;show&#x27;); void banner.offsetWidth; banner.classList.add(&#x27;show&#x27;);
  }

  function burst(el, color){
    var rect=el.getBoundingClientRect(), brect=board.getBoundingClientRect();
    var cx=rect.left-brect.left+rect.width/2, cy=rect.top-brect.top+rect.height/2;
    for(var i=0;i&lt;12;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      p.style.background=color; p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
      board.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=30+Math.random()*50;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.style.transition=&#x27;transform .5s ease-out, opacity .5s ease-out&#x27;;
      (function(p,dx,dy){ requestAnimationFrame(function(){
        p.style.transform=&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(0)&#x27;; p.style.opacity=&#x27;0&#x27;;
      }); })(p,dx,dy);
      setTimeout(function(pp){ return function(){ if(pp.parentNode) pp.parentNode.removeChild(pp); }; }(p),520);
    }
  }

  function scheduleSpawn(){
    if(!running) return;
    spawnCreature();
    var gap=Math.max(450, 950 - elapsed*10);
    spawnTimer=setTimeout(scheduleSpawn, gap);
  }
  function scheduleJelly(){
    if(!running) return;
    spawnJelly();
    jellyTimer=setTimeout(scheduleJelly, 3500+Math.random()*3000);
  }
  var bubbleTimer=null;
  function scheduleBubble(){
    if(!running) return;
    makeBubble();
    bubbleTimer=setTimeout(scheduleBubble, 350+Math.random()*400);
  }

  function tick(){
    if(!running) return;
    elapsed++; timeLeft--; timeEl.textContent=Math.max(0,timeLeft);
    if(Date.now()-lastHit&gt;2000 &amp;&amp; comboMult&gt;1){ comboMult=1; comboCount=0; comboEl.textContent=&#x27;&#x27;; }
    if(timeLeft&lt;=0){ endGame(); return; }
    tickTimer=setTimeout(tick,1000);
  }

  function clearAll(){
    for(var i=0;i&lt;moleTimeouts.length;i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts=[];
    var els=board.querySelectorAll(&#x27;.creature,.bubbleCol,.particle&#x27;);
    for(var k=0;k&lt;els.length;k++) els[k].parentNode.removeChild(els[k]);
  }

  function startGame(){
    if(running) return;
    initAudio();
    running=true; score=0; timeLeft=60; elapsed=0; comboCount=0; comboMult=1; lastHit=0;
    updateScore(false); comboEl.textContent=&#x27;&#x27;; timeEl.textContent=&#x27;60&#x27;;
    clearAll();
    spawnCreature();
    scheduleSpawn();
    jellyTimer=setTimeout(scheduleJelly, 4000);
    scheduleBubble();
    tickTimer=setTimeout(tick,1000);
  }

  function stopGame(){
    running=false;
    clearTimeout(spawnTimer); clearTimeout(tickTimer); clearTimeout(jellyTimer); clearTimeout(bubbleTimer);
  }

  function endGame(){
    running=false;
    clearTimeout(spawnTimer); clearTimeout(tickTimer); clearTimeout(jellyTimer); clearTimeout(bubbleTimer);
    showBanner(&#x27;Time! &#x27;+score+&#x27; pts&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;

 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,

        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}

  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;

        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
