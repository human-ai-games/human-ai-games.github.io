&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍹 Fruit Drop Frenzy&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← / →, rotate with ↑, and soft-drop with ↓. Complete full rows to blend them into smoothies — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Smoothies Made: &lt;span id=&quot;score&quot; style=&quot;font-weight:800;color:#8ce99a&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stack&quot;&gt;
      &lt;div id=&quot;field&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next Fruit&lt;/div&gt;&lt;div id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Rows&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;rows&quot;&gt;0&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var COLS = 10, ROWS = 18, CELL = 26;
var FW = COLS*CELL, FH = ROWS*CELL;
var field = document.getElementById(&#x27;field&#x27;);
field.style.width = FW+&#x27;px&#x27;; field.style.height = FH+&#x27;px&#x27;;
var nextBox = document.getElementById(&#x27;next&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;), levelEl = document.getElementById(&#x27;level&#x27;), rowsEl = document.getElementById(&#x27;rows&#x27;);

var FRUITS = {
  I: {emoji:&#x27;🍉&#x27;, color:&#x27;#4caf50&#x27;},
  O: {emoji:&#x27;🍊&#x27;, color:&#x27;#ff9800&#x27;},
  T: {emoji:&#x27;🍇&#x27;, color:&#x27;#9c27b0&#x27;},
  S: {emoji:&#x27;🍏&#x27;, color:&#x27;#8bc34a&#x27;},
  Z: {emoji:&#x27;🍓&#x27;, color:&#x27;#f44336&#x27;},
  J: {emoji:&#x27;🫐&#x27;, color:&#x27;#3f51b5&#x27;},
  L: {emoji:&#x27;🍋&#x27;, color:&#x27;#ffeb3b&#x27;}
};
var SHAPES = {
  I: [[0,1],[1,1],[2,1],[3,1]],
  O: [[1,0],[2,0],[1,1],[2,1]],
  T: [[1,0],[0,1],[1,1],[2,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]]
};
var KEYS = Object.keys(SHAPES);

var grid, piece, next, score, rowsCleared, level, dropMs, dropId, running=false;

function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

function randKey(){ return KEYS[Math.floor(Math.random()*KEYS.length)]; }

function makePiece(type){
  return { type:type, cells: SHAPES[type].map(function(p){return[p[0],p[1]];}), x:3, y:0 };
}

function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }

function collides(p){
  var cs=absCells(p);
  for(var i=0;i&lt;cs.length;i++){
    var x=cs[i].x, y=cs[i].y;
    if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
    if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
  }
  return false;
}

function rotate(p){
  // rotate around center of bounding box
  var xs=p.cells.map(function(c){return c[0];}), ys=p.cells.map(function(c){return c[1];});
  var rc = p.cells.map(function(c){ return [ -(c[1]) , c[0] ]; });
  // normalize
  var minx=Math.min.apply(null,rc.map(function(c){return c[0];}));
  var miny=Math.min.apply(null,rc.map(function(c){return c[1];}));
  rc = rc.map(function(c){return [c[0]-minx, c[1]-miny];});
  var test = {type:p.type, cells:rc, x:p.x, y:p.y};
  // wall kicks
  var kicks=[0,-1,1,-2,2];
  for(var k=0;k&lt;kicks.length;k++){
    var t={type:p.type,cells:rc,x:p.x+kicks[k],y:p.y};
    if(!collides(t)){ piece=t; return true; }
  }
  return false;
}

function ghostPiece(){
  var g={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y};
  while(!collides({type:g.type,cells:g.cells,x:g.x,y:g.y+1})) g.y++;
  return g;
}

function drawFruitCell(x,y,type,parent,alpha){
  var el=document.createElement(&#x27;div&#x27;);
  el.className=&#x27;cell&#x27;;
  el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
  el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
  el.style.fontSize=(CELL-4)+&#x27;px&#x27;;
  el.style.filter=&#x27;drop-shadow(1px 2px 2px rgba(0,0,0,0.6))&#x27;;
  if(alpha) el.style.opacity=alpha;
  el.textContent=FRUITS[type].emoji;
  parent.appendChild(el);
}

function paint(){
  // preserve particle/burst overlays: remove only cells+ghost
  var kids=field.querySelectorAll(&#x27;.cell,.ghost&#x27;);
  for(var i=0;i&lt;kids.length;i++) kids[i].remove();
  for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawFruitCell(c,r,grid[r][c],field);
  if(piece){
    var g=ghostPiece();
    absCells(g).forEach(function(cc){
      if(cc.y&lt;0) return;
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
      el.style.left=(cc.x*CELL)+&#x27;px&#x27;; el.style.top=(cc.y*CELL)+&#x27;px&#x27;;
      el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(el);
    });
    absCells(piece).forEach(function(cc){ if(cc.y&gt;=0) drawFruitCell(cc.x,cc.y,piece.type,field); });
  }
}

function paintNext(){
  nextBox.innerHTML=&#x27;&#x27;;
  if(!next) return;
  var cells=SHAPES[next];
  var xs=cells.map(function(c){return c[0];}), ys=cells.map(function(c){return c[1];});
  var minx=Math.min.apply(null,xs), maxx=Math.max.apply(null,xs);
  var miny=Math.min.apply(null,ys), maxy=Math.max.apply(null,ys);
  var w=maxx-minx+1, h=maxy-miny+1, s=20;
  var offx=(96-w*s)/2, offy=(96-h*s)/2;
  cells.forEach(function(c){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
    el.style.left=(offx+(c[0]-minx)*s)+&#x27;px&#x27;; el.style.top=(offy+(c[1]-miny)*s)+&#x27;px&#x27;;
    el.style.width=s+&#x27;px&#x27;; el.style.height=s+&#x27;px&#x27;; el.style.fontSize=(s-2)+&#x27;px&#x27;;
    el.style.textContent; el.textContent=FRUITS[next].emoji;
    nextBox.appendChild(el);
  });
}

function splat(rowIndex,colorSeed){
  for(var c=0;c&lt;COLS;c++){
    var color = grid[rowIndex] &amp;&amp; grid[rowIndex][c] ? FRUITS[grid[rowIndex][c]].color : &#x27;#ff6b9d&#x27;;
    for(var n=0;n&lt;3;n++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      var sz=6+Math.random()*8;
      p.style.width=sz+&#x27;px&#x27;; p.style.height=sz+&#x27;px&#x27;; p.style.background=color;
      p.style.left=(c*CELL+CELL/2)+&#x27;px&#x27;; p.style.top=(rowIndex*CELL+CELL/2)+&#x27;px&#x27;;
      field.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=30+Math.random()*70;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
      p.animate([{transform:&#x27;translate(0,0)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;,opacity:0}],{duration:600,easing:&#x27;ease-out&#x27;});
      (function(el){setTimeout(function(){el.remove();},600);})(p);
    }
  }
}

function bigBurst(txt){
  var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;burst&#x27;; b.textContent=txt;
  b.style.animation=&#x27;fly 1.2s ease-out forwards&#x27;;
  field.appendChild(b);
  setTimeout(function(){b.remove();},1200);
}

function clearRows(){
  var full=[];
  for(var r=0;r&lt;ROWS;r++){ var all=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){all=false;break;} if(all) full.push(r); }
  if(full.length===0) return;
  full.forEach(function(r){ splat(r); });
  full.forEach(function(r){ grid.splice(r,1); var e=[]; for(var c=0;c&lt;COLS;c++)e.push(null); grid.unshift(e); });
  var n=full.length;
  rowsCleared+=n;
  var pts=[0,10,30,60,100][n] || 100;
  score+=pts;
  var labels={2:&#x27;DOUBLE BLEND!&#x27;,3:&#x27;TRIPLE BLEND!&#x27;,4:&#x27;FRUIT TETRIS!&#x27;};
  if(n&gt;=2) bigBurst(labels[n]+&#x27; +&#x27;+pts);
  scoreEl.textContent=score; rowsEl.textContent=rowsCleared;
  var newLevel=Math.floor(rowsCleared/10)+1;
  if(newLevel&gt;level){ level=newLevel; levelEl.textContent=level; dropMs=Math.max(120,600-(level-1)*45); restartDrop(); levelUpShake(); }
}

function levelUpShake(){ field.classList.remove(&#x27;shake&#x27;); void field.offsetWidth; field.classList.add(&#x27;shake&#x27;); }

function spawn(){
  piece=makePiece(next||randKey());
  next=randKey();
  paintNext();
  if(collides(piece)){ endGame(); return false; }
  return true;
}

function step(){
  if(!piece) return;
  var t={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
  if(collides(t)){
    absCells(piece).forEach(function(cc){ if(cc.y&gt;=0&amp;&amp;cc.y&lt;ROWS) grid[cc.y][cc.x]=piece.type; });
    clearRows();
    if(!spawn()){ paint(); return; }
  } else piece=t;
  paint();
}

function move(dx){
  if(!running||!piece) return;
  var t={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
  if(!collides(t)){ piece=t; paint(); }
}

function restartDrop(){ if(dropId) clearInterval(dropId); dropId=setInterval(step,dropMs); }

function endGame(){
  running=false; if(dropId){clearInterval(dropId);dropId=null;}
  var o=document.createElement(&#x27;div&#x27;); o.className=&#x27;over&#x27;;
  o.innerHTML=&#x27;🍹 Blended Out!&lt;br&gt;&lt;span style=&quot;font-size:16px;font-weight:600&quot;&gt;Smoothies: &#x27;+score+&#x27;&lt;/span&gt;&#x27;;
  field.appendChild(o);
}

function startGame(){
  var o=field.querySelector(&#x27;.over&#x27;); if(o)o.remove();
  score=0; rowsCleared=0; level=1; dropMs=600;
  scoreEl.textContent=0; levelEl.textContent=1; rowsEl.textContent=0;
  newGrid(); next=randKey();
  running=true;
  if(!spawn()) return;
  paint();
  restartDrop();
}
function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(!running) return;
  if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
  else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
  else if(e.key===&#x27;ArrowDown&#x27;){step();e.preventDefault();}
  else if(e.key===&#x27;ArrowUp&#x27;){rotate(piece);paint();e.preventDefault();}
});

// touch controls
var tsx=0,tsy=0,tst=0;
field.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;tst=Date.now();},{passive:true});
field.addEventListener(&#x27;touchend&#x27;,function(e){
  if(!running)return;
  var t=e.changedTouches[0];var dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20){rotate(piece);paint();return;}
  if(Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); } else if(dy&gt;0){ step(); }
},{passive:true});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static preview
newGrid(); next=randKey(); piece=makePiece(randKey()); piece.y=1; paint(); paintNext();
&lt;/script&gt;

&lt;script&gt;

 * Reports engagement events to the parent so customer-phase telemetry

 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,

        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

    } catch (_) {}

        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

    } catch (_) {}
  });

  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
