&lt;div class=&quot;game&quot;&gt;

  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← → , rotate with ↑, and press ↓ to drop faster (or swipe/tap on touch). Fill full rows to score — clear several at once for bonus points!&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;

      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Best&lt;/div&gt;&lt;div class=&quot;hi&quot; id=&quot;hi&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div class=&quot;preview&quot; id=&quot;preview&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;hi&quot; id=&quot;level&quot; style=&quot;color:#42a5f5&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var preview = document.getElementById(&#x27;preview&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var hiEl = document.getElementById(&#x27;hi&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScore = document.getElementById(&#x27;finalScore&#x27;);

  var FRUITS = {
    I: {e:&#x27;🍉&#x27;, c:&#x27;#ef5350&#x27;}, O: {e:&#x27;🍊&#x27;, c:&#x27;#ffa726&#x27;}, T: {e:&#x27;🍇&#x27;, c:&#x27;#ab47bc&#x27;},
    S: {e:&#x27;🍓&#x27;, c:&#x27;#ec407a&#x27;}, Z: {e:&#x27;🍒&#x27;, c:&#x27;#e53935&#x27;}, L: {e:&#x27;🍋&#x27;, c:&#x27;#fdd835&#x27;}, J: {e:&#x27;🫐&#x27;, c:&#x27;#5c6bc0&#x27;}
  };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]]
  };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, next, score, hi = 0, level, dropMs, running = false, dropId = null, bag = [];

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) { var row = []; for (var c = 0; c &lt; COLS; c++) row.push(null); grid.push(row); }
  }

  function refillBag() {
    bag = KEYS.slice();
    for (var i = bag.length - 1; i &gt; 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
  }
  function nextType() { if (!bag.length) refillBag(); return bag.pop(); }

  function makePiece(type) {
    return { type: type, cells: SHAPES[type].map(function(c){return [c[0],c[1]];}), x: 3, y: 0 };
  }

  function absCells(p) { return p.cells.map(function(c){ return [p.x + c[0], p.y + c[1]]; }); }

  function collides(p) {
    var cells = absCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var x = cells[i][0], y = cells[i][1];
      if (x &lt; 0 || x &gt;= COLS || y &gt;= ROWS) return true;
      if (y &gt;= 0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function rotate() {
    if (!running || !piece || piece.type === &#x27;O&#x27;) return;
    // rotate around center of bounding box (3x3 or 4x4 for I)
    var size = piece.type === &#x27;I&#x27; ? 4 : 3;
    var rotated = piece.cells.map(function(c){ return [size - 1 - c[1], c[0]]; });
    var test = { type: piece.type, cells: rotated, x: piece.x, y: piece.y };
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      test.x = piece.x + kicks[k];
      if (!collides(test)) { piece.cells = rotated; piece.x = test.x; paint(); return; }
    }
  }

  function ghostY() {
    var p = { type: piece.type, cells: piece.cells, x: piece.x, y: piece.y };
    while (!collides({type:p.type,cells:p.cells,x:p.x,y:p.y+1})) p.y++;
    return p.y;
  }

  function spawn() {
    piece = makePiece(next);
    next = nextType();
    drawPreview();
    if (collides(piece)) return false;
    return true;
  }

  function lock() {
    var cells = absCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var x = cells[i][0], y = cells[i][1];
      if (y &gt;= 0) grid[y][x] = piece.type;
    }
    piece = null;
  }

  function clearRows() {
    var full = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var isFull = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { isFull = false; break; }
      if (isFull) full.push(r);
    }
    if (!full.length) return 0;
    // burst animation on those rows
    burstRows(full);
    for (var i = full.length - 1; i &gt;= 0; i--) {
      grid.splice(full[i], 1);
      var empty = []; for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
      grid.unshift(empty);
    }
    var pts = [0,1,3,6,10][full.length];
    score += pts;
    var lv = Math.floor(score / 10) + 1;
    if (lv !== level) { level = lv; dropMs = Math.max(120, 500 - (level - 1) * 45); restartTimer(); }
    scoreEl.textContent = score;
    scoreEl.classList.remove(&#x27;flash&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;flash&#x27;);
    levelEl.textContent = level;
    if (score &gt; hi) { hi = score; hiEl.textContent = hi; }
    return full.length;
  }

  function burstRows(rows) {
    for (var i = 0; i &lt; rows.length; i++) {
      for (var c = 0; c &lt; COLS; c++) {
        var t = grid[rows[i]][c];
        if (!t) continue;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;cell tile burst&#x27;;
        el.style.left = (c * CELL) + &#x27;px&#x27;;
        el.style.top = (rows[i] * CELL) + &#x27;px&#x27;;
        el.style.width = CELL + &#x27;px&#x27;; el.style.height = CELL + &#x27;px&#x27;;
        el.style.background = FRUITS[t].c;
        el.textContent = FRUITS[t].e;
        field.appendChild(el);
        (function(node){ setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); }, 320); })(el);
      }
    }
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    // background checkerboard
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        var bg = document.createElement(&#x27;div&#x27;);
        bg.className = &#x27;cell bg&#x27; + ((r + c) % 2 ? &#x27; alt&#x27; : &#x27;&#x27;);
        bg.style.left = (c * CELL) + &#x27;px&#x27;; bg.style.top = (r * CELL) + &#x27;px&#x27;;
        bg.style.width = CELL + &#x27;px&#x27;; bg.style.height = CELL + &#x27;px&#x27;;
        field.appendChild(bg);
      }
    }
    // locked tiles
    for (var r2 = 0; r2 &lt; ROWS; r2++) {
      for (var c2 = 0; c2 &lt; COLS; c2++) {
        if (grid[r2][c2]) drawTile(c2, r2, grid[r2][c2]);
      }
    }
    // ghost
    if (piece) {
      var gy = ghostY();
      var gc = piece.cells;
      for (var i = 0; i &lt; gc.length; i++) {
        var x = piece.x + gc[i][0], y = gy + gc[i][1];
        if (y &gt;= 0) drawGhost(x, y);
      }
      // active piece
      var ac = absCells(piece);
      for (var j = 0; j &lt; ac.length; j++) {
        if (ac[j][1] &gt;= 0) drawTile(ac[j][0], ac[j][1], piece.type);
      }
    }
  }

  function drawTile(cx, cy, type) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell tile&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;; el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;; el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = FRUITS[type].c;
    el.textContent = FRUITS[type].e;
    field.appendChild(el);
  }
  function drawGhost(cx, cy) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell ghost&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;; el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;; el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function drawPreview() {
    preview.innerHTML = &#x27;&#x27;;
    var cells = SHAPES[next];
    var minx = 9, maxx = -9, miny = 9, maxy = -9;
    cells.forEach(function(c){ minx=Math.min(minx,c[0]); maxx=Math.max(maxx,c[0]); miny=Math.min(miny,c[1]); maxy=Math.max(maxy,c[1]); });
    var w = maxx - minx + 1, h = maxy - miny + 1, s = 20;
    var offx = (96 - w * s) / 2, offy = (96 - h * s) / 2;
    cells.forEach(function(c){
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;cell tile&#x27;;
      el.style.left = (offx + (c[0]-minx) * s) + &#x27;px&#x27;;
      el.style.top = (offy + (c[1]-miny) * s) + &#x27;px&#x27;;
      el.style.width = s + &#x27;px&#x27;; el.style.height = s + &#x27;px&#x27;;
      el.style.background = FRUITS[next].c;
      el.style.fontSize = &#x27;13px&#x27;;
      el.textContent = FRUITS[next].e;
      preview.appendChild(el);
    });
  }

  function stepDown() {
    if (!piece) return;
    var moved = { type: piece.type, cells: piece.cells, x: piece.x, y: piece.y + 1 };
    if (collides(moved)) {
      lock();
      clearRows();
      if (!spawn()) { endGame(); return; }
    } else { piece.y++; }
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var moved = { type: piece.type, cells: piece.cells, x: piece.x + dx, y: piece.y };
    if (!collides(moved)) { piece.x += dx; paint(); }
  }

  function hardStep() { if (running) stepDown(); }

  function restartTimer() {
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropMs);
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    finalScore.textContent = &#x27;Score: &#x27; + score;
    overlay.classList.add(&#x27;show&#x27;);
    paint();
  }

  function startGame() {
    overlay.classList.remove(&#x27;show&#x27;);
    score = 0; level = 1; dropMs = 500;
    scoreEl.textContent = &#x27;0&#x27;; levelEl.textContent = &#x27;1&#x27;;
    newGrid(); refillBag();
    next = nextType();
    if (!spawn()) return;
    paint();
    running = true;
    restartTimer();
  }
  function stopGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { hardStep(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });

  // Touch / swipe support
  var tsx = 0, tsy = 0, tmoved = false;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tmoved=false; }, {passive:true});
  field.addEventListener(&#x27;touchmove&#x27;, function(e){
    var t=e.touches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx) &gt; 24) { move(dx&gt;0?1:-1); tsx=t.clientX; tmoved=true; }
    else if (dy &gt; 30) { hardStep(); tsy=t.clientY; tmoved=true; }
  }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(){ if(!tmoved) rotate(); });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // Initial static paint
  newGrid(); refillBag(); next = nextType(); piece = makePiece(nextType());
  drawPreview(); paint();
&lt;/script&gt;

 * Reports engagement events to the parent so customer-phase telemetry

 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the

        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);

    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
