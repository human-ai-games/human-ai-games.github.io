<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>☄ Comet Surfer</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0018; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#6cf,#c6f,#fc6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #b8a8d8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #9df; margin: 0; font-variant-numeric: tabular-nums; }
  .best { font-size: 14px; color: #c9f; }
  canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(120,80,220,0.4); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;☄ Comet Surfer&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to jump your comet over the glowing crystal spires. Survive as far as you can — the run speeds up over time. Use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Distance: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; km &lt;span class=&quot;best&quot; id=&quot;best&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);

var running = false, animId = null, gameOver = false;
var t0 = 0, lastTime = 0;
var scrollX = 0;          // world scroll (for terrain)
var speed = 0;            // px per frame
var distance = 0;         // km
var best = 0;

// hero
var heroX = 130, heroY = 0, heroVY = 0;
var GRAVITY = 0.55, JUMP_V = -12.5;
var onGround = false, coyote = 0;

// terrain: undulating sine-based ground height
function groundY(worldX) {
  return H - 90
    + Math.sin(worldX * 0.008) * 26
    + Math.sin(worldX * 0.021 + 1.3) * 14
    + Math.sin(worldX * 0.045 + 2.1) * 6;
}

// stars parallax layers
var stars = [];
function initStars() {
  stars = [];
  for (var i=0;i&lt;70;i++){
    var layer = i%3;
    stars.push({ x: Math.random()*W, y: Math.random()*(H-120),
      r: layer===0?0.8:(layer===1?1.4:2.2),
      sp: layer===0?0.15:(layer===1?0.35:0.65),
      c: layer===2?&#x27;#dcefff&#x27;:&#x27;#9fbfff&#x27; });
  }
}

// spires
var spires = [];  // {wx: worldX, warn: frames until emerged, h: full height, cur: current height, hit}
var spawnTimer = 0;

// particles
var trail = [];   // comet trail
var sparks = [];  // explosion

function reset() {
  scrollX = 0; speed = 3.2; distance = 0;
  heroY = groundY(heroX + scrollX) - 18; heroVY = 0;
  onGround = true; coyote = 0; gameOver = false;
  spires = []; trail = []; sparks = []; spawnTimer = 40;
  t0 = performance.now(); lastTime = t0;
  initStars();
  scoreEl.textContent = &#x27;0&#x27;;
  updateBest();
}

function updateBest(){
  bestEl.textContent = best&gt;0 ? &#x27;· Best: &#x27;+best+&#x27; km&#x27; : &#x27;&#x27;;
}

function spawnSpire(offset){
  var wx = scrollX + W + 40 + (offset||0);
  spires.push({ wx: wx, warn: 32, h: 70 + Math.random()*70, cur: 0, hit:false });
}

function jump(){
  if (!running || gameOver) return;
  if (onGround || coyote &gt; 0){
    heroVY = JUMP_V;
    onGround = false; coyote = 0;
    beep(520, 0.08);
  }
}

// audio
var actx = null;
function beep(freq, dur, type){
  try {
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  } catch(_){}
}

function explode(){
  gameOver = true;
  beep(120,0.5,&#x27;sawtooth&#x27;);
  var colors = [&#x27;#6cf&#x27;,&#x27;#c6f&#x27;,&#x27;#fc6&#x27;,&#x27;#f6a&#x27;,&#x27;#9fc&#x27;,&#x27;#fff&#x27;];
  for (var i=0;i&lt;60;i++){
    var a = Math.random()*Math.PI*2, sp = 2+Math.random()*7;
    sparks.push({ x: heroX, y: heroY, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2,
      life: 1, c: colors[(Math.random()*colors.length)|0], r: 2+Math.random()*3 });
  }
  distance = Math.round(distance);
  if (distance &gt; best){ best = distance; }
  updateBest();
}

function tick(now){
  if (!running) return;
  var dt = now - lastTime; lastTime = now;

  ctx.clearRect(0,0,W,H);

  // --- background sky (cycling purple/blue) ---
  var cyc = (now - t0) * 0.00008;
  var hue1 = 250 + Math.sin(cyc)*20;
  var hue2 = 220 + Math.sin(cyc+1)*20;
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, &#x27;hsl(&#x27;+hue1+&#x27;,60%,12%)&#x27;);
  grad.addColorStop(1, &#x27;hsl(&#x27;+hue2+&#x27;,70%,6%)&#x27;);
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  if (!gameOver){
    // accelerate
    var elapsed = (now - t0)/1000;
    speed = 3.2 + elapsed*0.14;
    scrollX += speed;
    distance += speed * 0.018;
  }

  // --- parallax stars ---
  for (var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    if (!gameOver) { s.x -= s.sp * speed; if (s.x &lt; -3){ s.x = W+3; s.y = Math.random()*(H-120);} }
    ctx.globalAlpha = 0.5 + s.r*0.2;
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // --- ghost best line ---
  if (best&gt;0 &amp;&amp; !gameOver){
    // horizontal marker showing best distance progress within current run window
    var gy = 40;
    ctx.strokeStyle = &#x27;rgba(200,150,255,0.35)&#x27;;
    ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = &#x27;rgba(200,150,255,0.6)&#x27;; ctx.font = &#x27;12px system-ui&#x27;;
    ctx.fillText(&#x27;◄ last best: &#x27;+best+&#x27; km&#x27;, 8, gy-6);
  }

  // --- terrain ---
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var px=0; px&lt;=W; px+=6){
    ctx.lineTo(px, groundY(px + scrollX));
  }
  ctx.lineTo(W, H); ctx.closePath();
  var tg = ctx.createLinearGradient(0,H-140,0,H);
  tg.addColorStop(0,&#x27;#3a1d6e&#x27;); tg.addColorStop(1,&#x27;#150838&#x27;);
  ctx.fillStyle = tg; ctx.fill();
  // glowing terrain edge
  ctx.beginPath();
  for (var px2=0; px2&lt;=W; px2+=6){
    if (px2===0) ctx.moveTo(px2, groundY(px2+scrollX));
    else ctx.lineTo(px2, groundY(px2+scrollX));
  }
  ctx.strokeStyle = &#x27;#7cf&#x27;; ctx.lineWidth = 2;
  ctx.shadowColor = &#x27;#6cf&#x27;; ctx.shadowBlur = 12;
  ctx.stroke(); ctx.shadowBlur = 0;

  // --- spires spawn ---
  if (!gameOver){
    spawnTimer -= 1;
    if (spawnTimer &lt;= 0){
      spawnSpire(0);
      var elapsed2 = (now - t0)/1000;
      // occasional tight pairs, more likely later
      if (Math.random() &lt; 0.15 + elapsed2*0.008){
        spawnSpire(55 + Math.random()*20);
      }
      var base = 90 - Math.min(elapsed2*1.5, 45);  // frames between spawns, decreasing
      spawnTimer = base + Math.random()*30;
    }
  }

  // --- spires update &amp; draw ---
  for (var j=spires.length-1;j&gt;=0;j--){
    var sp2 = spires[j];
    var screenX = sp2.wx - scrollX;
    if (screenX &lt; -40){ spires.splice(j,1); continue; }
    var gY = groundY(sp2.wx);
    // emerge
    if (sp2.warn &gt; 0){
      sp2.warn -= 1;
      // warning glow
      var wa = 0.3 + 0.4*Math.sin(now*0.02);
      ctx.fillStyle = &#x27;rgba(255,180,255,&#x27;+wa+&#x27;)&#x27;;
      ctx.beginPath(); ctx.ellipse(screenX, gY, 14, 5, 0, 0, 6.283); ctx.fill();
    } else {
      if (sp2.cur &lt; sp2.h) sp2.cur = Math.min(sp2.h, sp2.cur + 8);
    }
    if (sp2.cur &gt; 0){
      var topY = gY - sp2.cur;
      // crystal spire
      var cg = ctx.createLinearGradient(screenX, topY, screenX, gY);
      cg.addColorStop(0,&#x27;#bffcff&#x27;); cg.addColorStop(0.5,&#x27;#6ce&#x27;); cg.addColorStop(1,&#x27;#42a&#x27;);
      ctx.fillStyle = cg;
      ctx.shadowColor = &#x27;#8ef&#x27;; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(screenX, topY);
      ctx.lineTo(screenX+12, gY);
      ctx.lineTo(screenX-12, gY);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      // highlight
      ctx.strokeStyle = &#x27;rgba(255,255,255,0.6)&#x27;; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(screenX, topY); ctx.lineTo(screenX-3, gY); ctx.stroke();
    }
    sp2._screenX = screenX; sp2._gY = gY;
  }

  // --- hero physics ---
  if (!gameOver){
    var groundHere = groundY(heroX + scrollX) - 18;
    heroVY += GRAVITY;
    heroY += heroVY;
    if (heroY &gt;= groundHere){
      heroY = groundHere; heroVY = 0;
      onGround = true; coyote = 6;
    } else {
      if (onGround) { onGround = false; }
      if (coyote &gt; 0) coyote -= 1;
    }
    if (heroY &lt; 4){ heroY = 4; heroVY = 0; }

    // trail
    trail.push({ x: heroX, y: heroY, life: 1 });
    if (trail.length &gt; 24) trail.shift();

    // collision with spires
    for (var k=0;k&lt;spires.length;k++){
      var s3 = spires[k];
      if (s3.cur &lt;= 4) continue;
      var sx = s3._screenX;
      if (Math.abs(sx - heroX) &lt; 12){
        var spireTop = s3._gY - s3.cur;
        if (heroY + 10 &gt; spireTop){
          explode();
          break;
        }
      }
    }
  }

  // --- draw trail ---
  for (var m=0;m&lt;trail.length;m++){
    var tr = trail[m];
    tr.life -= 0.045;
    if (tr.life&lt;=0) continue;
    var frac = m/trail.length;
    ctx.globalAlpha = tr.life*0.6;
    ctx.fillStyle = m%2? &#x27;#6cf&#x27;:&#x27;#c6f&#x27;;
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 8*frac, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  trail = trail.filter(function(x){return x.life&gt;0;});

  // --- draw comet ---
  if (!gameOver){
    var cg2 = ctx.createRadialGradient(heroX-3, heroY-3, 2, heroX, heroY, 14);
    cg2.addColorStop(0,&#x27;#fff&#x27;); cg2.addColorStop(0.4,&#x27;#fd8&#x27;); cg2.addColorStop(1,&#x27;#f84&#x27;);
    ctx.fillStyle = cg2;
    ctx.shadowColor = &#x27;#fc6&#x27;; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(heroX, heroY, 10, 0, 6.283); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // --- sparks (explosion) ---
  var alive = false;
  for (var n=0;n&lt;sparks.length;n++){
    var p = sparks[n];
    p.vy += 0.2; p.x += p.vx; p.y += p.vy; p.life -= 0.015;
    if (p.life&lt;=0) continue;
    alive = true;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.c;
    ctx.shadowColor = p.c; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // score
  if (!gameOver){
    scoreEl.textContent = Math.round(distance);
  }

  // game over overlay
  if (gameOver){
    ctx.fillStyle = &#x27;rgba(10,0,24,0.55)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#fff&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.font = &#x27;bold 34px system-ui&#x27;;
    ctx.fillText(&#x27;💥 CRASH!&#x27;, W/2, H/2-20);
    ctx.font = &#x27;22px system-ui&#x27;;
    ctx.fillStyle = &#x27;#9df&#x27;;
    ctx.fillText(&#x27;Distance: &#x27;+Math.round(distance)+&#x27; km&#x27;, W/2, H/2+16);
    ctx.font=&#x27;16px system-ui&#x27;; ctx.fillStyle=&#x27;#c9f&#x27;;
    ctx.fillText(&#x27;Press Start below to surf again&#x27;, W/2, H/2+48);
    ctx.textAlign=&#x27;left&#x27;;
    if (!alive){
      // stop the loop once sparks settle
      cancelAnimationFrame(animId); animId = null; running = false;
      return;
    }
  }

  animId = requestAnimationFrame(tick);
}

function startGame(){
  if (running) return;
  running = true;
  reset();
  lastTime = performance.now();
  animId = requestAnimationFrame(tick);
}
function stopGame(){
  running = false;
  if (animId){ cancelAnimationFrame(animId); animId = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ jump(); });
window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if (e.data.type===&#x27;wd_start&#x27;) startGame();
  else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
initStars();
ctx.fillStyle = &#x27;#0a0018&#x27;; ctx.fillRect(0,0,W,H);
ctx.fillStyle = &#x27;#8af&#x27;; ctx.font=&#x27;20px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
ctx.fillText(&#x27;☄ Press Start to surf the comet&#x27;, W/2, H/2);
ctx.textAlign=&#x27;left&#x27;;
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
