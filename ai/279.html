<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC BREAKOUT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#ffd54a,#ff5ecb,#5ec8ff);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(255,120,220,0.35); }
  .instructions { font-size: 16px; color: #9fa8d8; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 620px; font-size: 18px; }
  .hud .stat { display: flex; align-items: center; gap: 6px; }
  .hud .label { color: #8a8fc0; font-size: 14px; }
  .hud .val { font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(94,200,255,0.6); }
  #lives { letter-spacing: 2px; font-size: 20px; }
  .wrap { position: relative; width: 620px; height: 460px; }
  canvas { display: block; border-radius: 10px; background: #07051a;
           box-shadow: 0 0 32px rgba(94,120,255,0.35), inset 0 0 40px rgba(20,10,60,0.8); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to slide the spaceship and bounce the plasma orb into the bricks to score. Don&#x27;t let the orb fall — you have three lives, and each cleared grid speeds things up.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;label&quot;&gt;SCORE&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;label&quot;&gt;BEST COMBO&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;combo&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;label&quot;&gt;LIVES&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;lives&quot;&gt;❤❤❤&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 460;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);

  // Paddle
  var PADDLE_W = 96, PADDLE_H = 14, PADDLE_Y = H - 30;
  var paddleX = (W - PADDLE_W) / 2;
  var targetX = paddleX;

  // Ball
  var BALL_R = 8;
  var baseSpeed = 4.0;
  var ballX, ballY, ballVX, ballVY, ballSpeed;
  var trail = [];

  // State
  var running = false, animId = null, pulse = 0;
  var score = 0, combo = 0, bestCombo = 0, lives = 3;
  var gameOver = false, goT = 0;
  var bricks = [], particles = [];

  // Brick grid config
  var COLS = 10, ROWS = 4, BGAP = 6;
  var B_TOP = 40, B_LEFT = 20;
  var BW = (W - B_LEFT * 2 - (COLS - 1) * BGAP) / COLS;
  var BH = 22;
  var rowColors = [
    { c: &#x27;#ffd54a&#x27;, pts: 5 }, // gold
    { c: &#x27;#c86bff&#x27;, pts: 3 }, // purple
    { c: &#x27;#5e9bff&#x27;, pts: 2 }, // blue
    { c: &#x27;#4ce0c8&#x27;, pts: 1 }  // teal
  ];

  var stars = [];
  for (var i = 0; i &lt; 70; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.4+0.3, tw: Math.random()*Math.PI*2 });
  }

  function buildBricks() {
    bricks = [];
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        bricks.push({
          x: B_LEFT + c * (BW + BGAP),
          y: B_TOP + r * (BH + BGAP),
          w: BW, h: BH,
          color: rowColors[r].c,
          pts: rowColors[r].pts,
          alive: true
        });
      }
    }
  }

  function resetBall() {
    ballX = W / 2;
    ballY = PADDLE_Y - 40;
    var ang = (-Math.PI/2) + (Math.random()*0.8 - 0.4);
    ballVX = Math.cos(ang) * ballSpeed;
    ballVY = Math.sin(ang) * ballSpeed;
    trail = [];
  }

  function startGame() {
    if (running) return;
    score = 0; combo = 0; bestCombo = 0; lives = 3;
    gameOver = false; goT = 0;
    ballSpeed = baseSpeed;
    particles = [];
    paddleX = (W - PADDLE_W) / 2;
    targetX = paddleX;
    buildBricks();
    resetBall();
    updateHUD();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    comboEl.textContent = bestCombo;
    var h = &#x27;&#x27;;
    for (var i = 0; i &lt; 3; i++) h += i &lt; lives ? &#x27;❤&#x27; : &#x27;♡&#x27;;
    livesEl.textContent = h;
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i &lt; 12; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = Math.random() * 3 + 1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
    }
  }

  function loseLife() {
    lives--;
    combo = 0;
    updateHUD();
    if (lives &lt;= 0) {
      gameOver = true;
      goT = 0;
    } else {
      resetBall();
    }
  }

  function tick() {
    if (!running) return;
    pulse += 0.15;

    if (gameOver) {
      goT += 0.05;
      draw();
      animId = requestAnimationFrame(tick);
      return;
    }

    // Paddle follows mouse smoothly
    paddleX += (targetX - paddleX) * 0.35;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    // Move ball
    ballX += ballVX;
    ballY += ballVY;

    // Walls
    if (ballX - BALL_R &lt;= 0) { ballX = BALL_R; ballVX = Math.abs(ballVX); }
    if (ballX + BALL_R &gt;= W) { ballX = W - BALL_R; ballVX = -Math.abs(ballVX); }
    if (ballY - BALL_R &lt;= 0) { ballY = BALL_R; ballVY = Math.abs(ballVY); }

    // Paddle collision
    if (ballVY &gt; 0 &amp;&amp;
        ballY + BALL_R &gt;= PADDLE_Y &amp;&amp;
        ballY + BALL_R &lt;= PADDLE_Y + PADDLE_H + 8 &amp;&amp;
        ballX &gt;= paddleX - BALL_R &amp;&amp;
        ballX &lt;= paddleX + PADDLE_W + BALL_R) {
      var hit = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2); // -1..1
      hit = Math.max(-1, Math.min(1, hit));
      ballSpeed = Math.min(ballSpeed + 0.15, 11);
      var ang = -Math.PI/2 + hit * (Math.PI/3);
      ballVX = Math.cos(ang) * ballSpeed;
      ballVY = Math.sin(ang) * ballSpeed;
      ballY = PADDLE_Y - BALL_R;
      combo = 0; // combo resets on paddle touch (measures brick streaks)
    }

    // Brick collision
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ballX + BALL_R &gt;= b.x &amp;&amp; ballX - BALL_R &lt;= b.x + b.w &amp;&amp;
          ballY + BALL_R &gt;= b.y &amp;&amp; ballY - BALL_R &lt;= b.y + b.h) {
        b.alive = false;
        // decide bounce direction based on overlap
        var overlapL = (ballX + BALL_R) - b.x;
        var overlapR = (b.x + b.w) - (ballX - BALL_R);
        var overlapT = (ballY + BALL_R) - b.y;
        var overlapB = (b.y + b.h) - (ballY - BALL_R);
        var minO = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (minO === overlapT || minO === overlapB) ballVY = -ballVY;
        else ballVX = -ballVX;
        spawnParticles(ballX, ballY, b.color);
        score += b.pts;
        combo++;
        if (combo &gt; bestCombo) bestCombo = combo;
        updateHUD();
        break;
      }
    }

    // Trail
    trail.push({ x: ballX, y: ballY });
    if (trail.length &gt; 12) trail.shift();

    // Particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= 0.04;
      if (pt.life &lt;= 0) particles.splice(p, 1);
    }

    // Fell off bottom
    if (ballY - BALL_R &gt; H) loseLife();

    // Cleared all bricks?
    var anyAlive = false;
    for (var k = 0; k &lt; bricks.length; k++) if (bricks[k].alive) { anyAlive = true; break; }
    if (!anyAlive) {
      baseSpeed += 0.6;
      ballSpeed = baseSpeed;
      buildBricks();
      resetBall();
    }

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Stars
    for (var s = 0; s &lt; stars.length; s++) {
      var st = stars[s];
      var a = 0.4 + 0.4 * Math.sin(pulse * 0.5 + st.tw);
      ctx.globalAlpha = a;
      ctx.fillStyle = &#x27;#cfe0ff&#x27;;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bricks
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3 * pt.life + 0.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (!gameOver) {
      // Trail
      for (var t = 0; t &lt; trail.length; t++) {
        var tp = trail[t];
        var frac = t / trail.length;
        ctx.globalAlpha = frac * 0.5;
        ctx.fillStyle = &#x27;#8affff&#x27;;
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, BALL_R * frac, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Plasma orb
      var pr = BALL_R + Math.sin(pulse) * 1.5;
      ctx.shadowColor = &#x27;#5efaff&#x27;;
      ctx.shadowBlur = 22;
      var grad = ctx.createRadialGradient(ballX, ballY, 1, ballX, ballY, pr);
      grad.addColorStop(0, &#x27;#ffffff&#x27;);
      grad.addColorStop(0.5, &#x27;#7ef4ff&#x27;);
      grad.addColorStop(1, &#x27;#2a7bff&#x27;);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ballX, ballY, pr, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Paddle (spaceship)
    ctx.shadowColor = &#x27;#ff5ecb&#x27;;
    ctx.shadowBlur = 16;
    var pg = ctx.createLinearGradient(paddleX, 0, paddleX + PADDLE_W, 0);
    pg.addColorStop(0, &#x27;#ff5ecb&#x27;);
    pg.addColorStop(0.5, &#x27;#ffffff&#x27;);
    pg.addColorStop(1, &#x27;#5ec8ff&#x27;);
    ctx.fillStyle = pg;
    ctx.beginPath();
    // trapezoid-ish ship
    ctx.moveTo(paddleX + 12, PADDLE_Y);
    ctx.lineTo(paddleX + PADDLE_W - 12, PADDLE_Y);
    ctx.lineTo(paddleX + PADDLE_W, PADDLE_Y + PADDLE_H);
    ctx.lineTo(paddleX, PADDLE_Y + PADDLE_H);
    ctx.closePath();
    ctx.fill();
    // cockpit
    ctx.fillStyle = &#x27;rgba(255,255,255,0.9)&#x27;;
    ctx.beginPath();
    ctx.arc(paddleX + PADDLE_W/2, PADDLE_Y + 4, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (gameOver) drawGameOver();
  }

  function drawGameOver() {
    ctx.fillStyle = &#x27;rgba(5,3,15,0.72)&#x27;;
    ctx.fillRect(0, 0, W, H);
    var scale = 1 + Math.sin(goT * 3) * 0.06;
    ctx.save();
    ctx.translate(W/2, H/2 - 20);
    ctx.scale(scale, scale);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.font = &#x27;800 52px system-ui, sans-serif&#x27;;
    ctx.shadowColor = &#x27;#ff5ecb&#x27;;
    ctx.shadowBlur = 30;
    ctx.fillStyle = &#x27;#ff5ecb&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.font = &#x27;700 24px system-ui, sans-serif&#x27;;
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 30);
    ctx.font = &#x27;600 16px system-ui, sans-serif&#x27;;
    ctx.fillStyle = &#x27;#9fa8d8&#x27;;
    ctx.fillText(&#x27;Best Combo: &#x27; + bestCombo + &#x27;   •   Press Restart below&#x27;, W/2, H/2 + 60);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Mouse control
  cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W / rect.width);
    targetX = mx - PADDLE_W / 2;
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial static frame
  ballSpeed = baseSpeed;
  buildBricks();
  ballX = W/2; ballY = PADDLE_Y - 40;
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
