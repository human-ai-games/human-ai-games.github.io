<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #cde; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #4ef0ff; text-shadow: 0 0 10px #14a0d0; }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; width: 620px; font-size: 18px; }
  .hud .score { color: #ffe27a; text-shadow: 0 0 8px #b8860b; }
  .hud .warp { color: #ff6ad5; text-shadow: 0 0 8px #a01080; }
  .shields { display: flex; gap: 8px; }
  #field { display: block; border-radius: 8px; background: #05060f; box-shadow: 0 0 24px #0a2540 inset, 0 0 12px #0a2540; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the mouse or arrow keys and bounce the energy orb up to destroy falling aliens. Don&#x27;t let the orb slip past you — three misses and it&#x27;s game over.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;shields&quot; id=&quot;shields&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;warp&quot;&gt;WARP x&lt;span id=&quot;warp&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;field&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var W = 620, H = 470;
var canvas = document.getElementById(&#x27;field&#x27;);
var ctx = canvas.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var warpEl = document.getElementById(&#x27;warp&#x27;);
var shieldsEl = document.getElementById(&#x27;shields&#x27;);

var PADDLE_W = 104, PADDLE_H = 14, PADDLE_BOTTOM = 16, PADDLE_SPEED = 7;
var ORB_R = 8, BASE_SPEED = 3.6;
var running = false, animId = null;
var keys = {};
var score = 0, lives = 3, speedMult = 1;
var paddleX, orbX, orbY, orbVX, orbVY;
var aliens = [], particles = [], stars = [], trail = [];
var spawnTimer = 0;

// audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (_) {}
}

function initStars() {
  stars = [];
  for (var i = 0; i &lt; 90; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.8+0.3, v: Math.random()*0.5+0.15 });
  }
}

function renderShields() {
  shieldsEl.innerHTML = &#x27;&#x27;;
  for (var i = 0; i &lt; 3; i++) {
    var s = document.createElement(&#x27;span&#x27;);
    s.textContent = i &lt; lives ? &#x27;🛡️&#x27; : &#x27;▫️&#x27;;
    shieldsEl.appendChild(s);
  }
}

function resetOrb() {
  orbX = paddleX + PADDLE_W/2;
  orbY = H - PADDLE_BOTTOM - PADDLE_H - 40;
  orbVX = (Math.random() &lt; 0.5 ? -1 : 1) * BASE_SPEED * speedMult;
  orbVY = -BASE_SPEED * speedMult;
  trail = [];
}

var ALIEN_TYPES = {
  drone:  { pts: 1, color: &#x27;#5cff9d&#x27;, icon: &#x27;👾&#x27;, r: 15, zig: 0 },
  scout:  { pts: 2, color: &#x27;#4ef0ff&#x27;, icon: &#x27;🛸&#x27;, r: 15, zig: 1 },
  boss:   { pts: 5, color: &#x27;#ffe27a&#x27;, icon: &#x27;👑&#x27;, r: 18, zig: 0 }
};

function spawnAlien() {
  var roll = Math.random();
  var type = roll &lt; 0.6 ? &#x27;drone&#x27; : (roll &lt; 0.9 ? &#x27;scout&#x27; : &#x27;boss&#x27;);
  var t = ALIEN_TYPES[type];
  var x = t.r + Math.random() * (W - 2*t.r);
  aliens.push({ type: type, x: x, baseX: x, y: -t.r, vy: 0.7 + Math.random()*0.5 + score*0.002, phase: Math.random()*6.28 });
}

function explode(x, y, color) {
  for (var i = 0; i &lt; 16; i++) {
    var a = Math.random()*6.28, sp = Math.random()*3+1;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color: color });
  }
}

function endGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  drawFrame(true);
}

function startGame() {
  score = 0; lives = 3; speedMult = 1;
  scoreEl.textContent = &#x27;0&#x27;; warpEl.textContent = &#x27;1&#x27;;
  paddleX = (W - PADDLE_W)/2;
  aliens = []; particles = []; spawnTimer = 0;
  for (var k in keys) keys[k] = false;
  initStars();
  renderShields();
  resetOrb();
  spawnAlien();
  running = true;
  if (!animId) animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function updateSpeed() {
  var newMult = 1 + Math.floor(score/5)*0.25;
  if (newMult !== speedMult) {
    var factor = newMult / speedMult;
    orbVX *= factor; orbVY *= factor;
    speedMult = newMult;
    warpEl.textContent = (Math.round(speedMult*10)/10);
  }
}

function loop() {
  if (!running) return;
  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    stars[i].y += stars[i].v;
    if (stars[i].y &gt; H) { stars[i].y = 0; stars[i].x = Math.random()*W; }
  }
  // paddle
  if (keys[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
  if (keys[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
  paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

  // orb
  orbX += orbVX; orbY += orbVY;
  trail.push({ x: orbX, y: orbY }); if (trail.length &gt; 10) trail.shift();
  if (orbX - ORB_R &lt;= 0) { orbX = ORB_R; orbVX = Math.abs(orbVX); }
  if (orbX + ORB_R &gt;= W) { orbX = W - ORB_R; orbVX = -Math.abs(orbVX); }
  if (orbY - ORB_R &lt;= 0) { orbY = ORB_R; orbVY = Math.abs(orbVY); }

  var paddleTop = H - PADDLE_BOTTOM - PADDLE_H;
  if (orbVY &gt; 0 &amp;&amp; orbY + ORB_R &gt;= paddleTop &amp;&amp; orbY + ORB_R &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
      orbX &gt;= paddleX &amp;&amp; orbX &lt;= paddleX + PADDLE_W) {
    orbVY = -Math.abs(orbVY);
    orbY = paddleTop - ORB_R;
    // angle based on hit position
    var rel = (orbX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2);
    var speed = Math.sqrt(orbVX*orbVX + orbVY*orbVY);
    orbVX = rel * speed * 0.75;
    orbVY = -Math.sqrt(Math.max(speed*speed - orbVX*orbVX, 1));
    beep(320, 0.08, &#x27;square&#x27;, 0.06);
  }

  // aliens
  for (var i = aliens.length - 1; i &gt;= 0; i--) {
    var a = aliens[i], t = ALIEN_TYPES[a.type];
    a.y += a.vy;
    if (t.zig) { a.phase += 0.06; a.x = a.baseX + Math.sin(a.phase) * 55; }
    // orb hit
    var dx = orbX - a.x, dy = orbY - a.y;
    if (dx*dx + dy*dy &lt; (ORB_R + t.r)*(ORB_R + t.r)) {
      explode(a.x, a.y, t.color);
      score += t.pts;
      scoreEl.textContent = score;
      updateSpeed();
      beep(t.pts &gt;= 5 ? 660 : 480, 0.12, &#x27;sawtooth&#x27;, 0.08);
      aliens.splice(i, 1);
      orbVY = Math.abs(orbVY);
      continue;
    }
    if (a.y - t.r &gt; H) aliens.splice(i, 1);
  }

  // orb missed
  if (orbY - ORB_R &gt; H) {
    lives--;
    renderShields();
    beep(120, 0.3, &#x27;sawtooth&#x27;, 0.09);
    if (lives &lt;= 0) { endGame(); return; }
    resetOrb();
  }

  // spawn
  spawnTimer++;
  var spawnRate = Math.max(45, 110 - score);
  if (spawnTimer &gt;= spawnRate) { spawnTimer = 0; spawnAlien(); }

  // particles
  for (var i = particles.length - 1; i &gt;= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.04;
    if (p.life &lt;= 0) particles.splice(i, 1);
  }

  drawFrame(false);
  animId = requestAnimationFrame(loop);
}

function drawFrame(gameover) {
  ctx.fillStyle = &#x27;#05060f&#x27;;
  ctx.fillRect(0, 0, W, H);
  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    var s = stars[i];
    ctx.fillStyle = &#x27;rgba(200,220,255,&#x27; + (0.3 + s.s/2.5) + &#x27;)&#x27;;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  // aliens
  ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
  for (var i = 0; i &lt; aliens.length; i++) {
    var a = aliens[i], t = ALIEN_TYPES[a.type];
    ctx.font = (t.r*2) + &#x27;px serif&#x27;;
    ctx.shadowColor = t.color; ctx.shadowBlur = 12;
    ctx.fillText(t.icon, a.x, a.y);
    ctx.shadowBlur = 0;
  }
  // particles
  for (var i = 0; i &lt; particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // orb trail
  for (var i = 0; i &lt; trail.length; i++) {
    var tr = trail[i], a = i / trail.length;
    ctx.globalAlpha = a * 0.6;
    ctx.fillStyle = &#x27;#ff6ad5&#x27;;
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, ORB_R * a, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // orb
  var grad = ctx.createRadialGradient(orbX, orbY, 1, orbX, orbY, ORB_R+4);
  grad.addColorStop(0, &#x27;#ffffff&#x27;); grad.addColorStop(0.5, &#x27;#ff8ce0&#x27;); grad.addColorStop(1, &#x27;rgba(255,106,213,0)&#x27;);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(orbX, orbY, ORB_R+4, 0, 6.28); ctx.fill();

  // paddle (neon ship)
  var pT = H - PADDLE_BOTTOM - PADDLE_H;
  ctx.shadowColor = &#x27;#4ef0ff&#x27;; ctx.shadowBlur = 16;
  ctx.fillStyle = &#x27;#0af&#x27;;
  ctx.beginPath();
  ctx.moveTo(paddleX, pT + PADDLE_H);
  ctx.lineTo(paddleX + 18, pT);
  ctx.lineTo(paddleX + PADDLE_W - 18, pT);
  ctx.lineTo(paddleX + PADDLE_W, pT + PADDLE_H);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = &#x27;#9ff&#x27;;
  ctx.fillRect(paddleX + PADDLE_W/2 - 4, pT - 6, 8, 8);
  ctx.shadowBlur = 0;

  if (gameover) {
    ctx.fillStyle = &#x27;rgba(5,6,15,0.7)&#x27;;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = &#x27;#ff6ad5&#x27;; ctx.shadowBlur = 24;
    ctx.fillStyle = &#x27;#ff6ad5&#x27;;
    ctx.font = &#x27;bold 56px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 20);
    ctx.shadowColor = &#x27;#ffe27a&#x27;; ctx.shadowBlur = 18;
    ctx.fillStyle = &#x27;#ffe27a&#x27;;
    ctx.font = &#x27;bold 28px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;FINAL SCORE: &#x27; + score, W/2, H/2 + 34);
    ctx.shadowBlur = 0;
  }
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keys[e.key] = true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
});
canvas.addEventListener(&#x27;mousemove&#x27;, function(e) {
  if (!running) return;
  var rect = canvas.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (W / rect.width);
  paddleX = Math.max(0, Math.min(W - PADDLE_W, mx - PADDLE_W/2));
});
window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static state
paddleX = (W - PADDLE_W)/2;
orbX = W/2; orbY = H - 80; orbVX = 0; orbVY = 0;
initStars();
renderShields();
drawFrame(false);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
