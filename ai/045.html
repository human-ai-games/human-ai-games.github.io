<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash: Rush Hour Rampage</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a14; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .5px;
       background: linear-gradient(90deg,#39ff14,#00e5ff,#ff2bd6); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 12px rgba(57,255,20,.3); }
  .instructions { font-size: 16px; color: #9fb0c8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 18px; }
  .hud b { font-size: 22px; }
  #score { color: #ffd93b; }
  #streak { color: #ff2bd6; }
  #best { color: #00e5ff; }
  canvas { border-radius: 10px; box-shadow: 0 0 24px rgba(0,229,255,.15); background:#12121f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash: Rush Hour Rampage&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys (or swipe) to hop your frog up through traffic and across the river logs to the far bank. Reach the top to score — build a streak, but don&#x27;t get splatted or fall in the water!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Streak &lt;b id=&quot;streak&quot;&gt;x1&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Best &lt;b id=&quot;best&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;496&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var CELL = 62;                 // logical cell size
var COLS = 10;
var ROWS = 8;                  // row0 = far bank, rows1-3 river, row4 median, rows5-7 traffic, plus start bank
// Layout (top-&gt;bottom): 0 far-bank, 1-3 river, 4 median, 5-7 road, 8 start-bank
var GRID_ROWS = 9;
CELL = W / COLS;               // fit width
var ROWH = H / GRID_ROWS;

var scoreEl = document.getElementById(&#x27;score&#x27;);
var streakEl = document.getElementById(&#x27;streak&#x27;);
var bestEl = document.getElementById(&#x27;best&#x27;);

var running = false, rafId = null;
var score = 0, best = 0, streak = 1, level = 1, crossings = 0;
var frog, lanes, particles, shake, splatting, splatTimer, hitFlash;
var lastT = 0;

// ---- Web Audio ----
var AC = null;
function actx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){AC=null;} } return AC; }
function tone(freq, dur, type, vol, slideTo){
  var a = actx(); if(!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.15, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
}
function ribbit(){ tone(180,0.09,&#x27;square&#x27;,0.16,90); setTimeout(function(){tone(140,0.11,&#x27;square&#x27;,0.16,70);},70); }
function coinSfx(){ tone(880,0.08,&#x27;square&#x27;,0.14); setTimeout(function(){tone(1320,0.14,&#x27;square&#x27;,0.14);},70); }
function splatSfx(){ tone(200,0.25,&#x27;sawtooth&#x27;,0.2,40); }
function splashSfx(){ tone(400,0.2,&#x27;sine&#x27;,0.18,120); }

// ---- Frog ----
function resetFrog(){
  frog = { col: Math.floor(COLS/2), row: 8, sx:1, sy:1, hopT:0, dead:false, onLog:null };
}

// ---- Lanes ----
function rowType(r){
  if(r===0) return &#x27;bank&#x27;;
  if(r&gt;=1 &amp;&amp; r&lt;=3) return &#x27;river&#x27;;
  if(r===4) return &#x27;median&#x27;;
  if(r&gt;=5 &amp;&amp; r&lt;=7) return &#x27;road&#x27;;
  return &#x27;bank&#x27;;
}

var CARS = [
  {c:&#x27;#ffd93b&#x27;, c2:&#x27;#ffb400&#x27;, name:&#x27;taxi&#x27;, w:1.6},
  {c:&#x27;#ff4d6d&#x27;, c2:&#x27;#c81d3f&#x27;, name:&#x27;sport&#x27;, w:1.4},
  {c:&#x27;#5ec6ff&#x27;, c2:&#x27;#2288cc&#x27;, name:&#x27;bus&#x27;, w:2.4},
  {c:&#x27;#a06bff&#x27;, c2:&#x27;#6a3bcc&#x27;, name:&#x27;van&#x27;, w:1.8}
];

function buildLanes(){
  lanes = [];
  for(var r=1;r&lt;=7;r++){
    var t = rowType(r);
    if(t===&#x27;median&#x27;) { lanes[r]=null; continue; }
    var dir = (r%2===0)?1:-1;
    var base = t===&#x27;river&#x27; ? 26 : 40;
    var speed = (base + level*10) * dir / 1000; // cells per ms
    var lane = { row:r, dir:dir, type:t, speed:speed, items:[] };
    if(t===&#x27;river&#x27;){
      var n = 2 + (r%2);
      var gap = COLS/n;
      var len = 2 + (r%2); // log length in cells
      for(var i=0;i&lt;n;i++){
        lane.items.push({ x: i*gap + (r*1.3), len:len });
      }
    } else {
      var cnt = 2 + (r%2);
      var g2 = COLS/cnt;
      for(var j=0;j&lt;cnt;j++){
        var car = CARS[(r+j)%CARS.length];
        lane.items.push({ x: j*g2 + (r*0.9), len:car.w, car:car });
      }
    }
    lanes[r] = lane;
  }
}

function startGame(){
  score=0; streak=1; level=1; crossings=0;
  scoreEl.textContent=&#x27;0&#x27;; streakEl.textContent=&#x27;x1&#x27;;
  particles=[]; shake=0; splatting=false; splatTimer=0; hitFlash=0;
  resetFrog();
  buildLanes();
  running=true;
  lastT = performance.now();
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

// ---- Movement ----
function hop(dc,dr){
  if(!running || splatting || frog.dead) return;
  var nc = frog.col+dc, nr = frog.row+dr;
  if(nc&lt;0||nc&gt;COLS-1||nr&lt;0||nr&gt;8) { // wall
    frog.sx=0.7; frog.sy=1.3; frog.hopT=1; return;
  }
  frog.col=nc; frog.row=nr; frog.hopT=1;
  frog.sx = dr!==0?0.75:0.9; frog.sy = dr!==0?1.3:1.1;
  ribbit();
  if(nr===0){ succeed(); }
}

function succeed(){
  crossings++;
  var gain = 10*streak;
  score += gain;
  streak = Math.min(streak+1, 9);
  streakEl.textContent = &#x27;x&#x27;+streak;
  scoreEl.textContent = score;
  if(score&gt;best){ best=score; bestEl.textContent=best; }
  coinSfx();
  spawnCoin(frog.col*CELL+CELL/2, 0.5*ROWH, gain);
  if(crossings % 3 === 0){ level++; buildLanes(); }
  resetFrog();
}

function die(reason){
  if(splatting) return;
  splatting=true; splatTimer=0; shake=14; hitFlash=1;
  if(reason===&#x27;water&#x27;){ splashSfx(); } else { splatSfx(); }
  streak=1; streakEl.textContent=&#x27;x1&#x27;;
  frog.dead=true; frog.deadReason=reason;
}

// ---- Particles ----
function spawnCoin(x,y,val){
  particles.push({type:&#x27;coin&#x27;,x:x,y:y,vy:-0.06,life:1,val:val});
}
function spawnSplat(x,y){
  for(var i=0;i&lt;10;i++){
    var a = Math.random()*Math.PI*2, sp=0.05+Math.random()*0.12;
    particles.push({type:&#x27;goo&#x27;,x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1});
  }
}

// ---- Update ----
function update(dt){
  // lanes
  for(var r=1;r&lt;=7;r++){
    var lane = lanes[r]; if(!lane) continue;
    for(var i=0;i&lt;lane.items.length;i++){
      var it = lane.items[i];
      it.x += lane.speed*dt;
      if(lane.dir&gt;0 &amp;&amp; it.x &gt; COLS) it.x = -it.len;
      else if(lane.dir&lt;0 &amp;&amp; it.x + it.len &lt; 0) it.x = COLS;
    }
  }

  if(splatting){
    splatTimer += dt;
    if(splatTimer&gt;60 &amp;&amp; particles.filter(function(p){return p.type===&#x27;goo&#x27;;}).length===0 &amp;&amp; frog.deadReason!==&#x27;water&#x27;){
      spawnSplat(frog.col*CELL+CELL/2, (frog.row+0.5)*ROWH);
    }
    if(splatTimer&gt;700){ splatting=false; resetFrog(); }
  } else if(running &amp;&amp; !frog.dead){
    var t = rowType(frog.row);
    if(t===&#x27;road&#x27;){
      var lane = lanes[frog.row];
      var fx = frog.col + 0.5;
      for(var k=0;k&lt;lane.items.length;k++){
        var it2=lane.items[k];
        if(fx &gt; it2.x+0.15 &amp;&amp; fx &lt; it2.x+it2.len-0.15){ die(&#x27;splat&#x27;); break; }
      }
    } else if(t===&#x27;river&#x27;){
      var lane2 = lanes[frog.row];
      var onLog=null;
      var fx2 = frog.col+0.5;
      for(var m=0;m&lt;lane2.items.length;m++){
        var lg=lane2.items[m];
        if(fx2 &gt; lg.x &amp;&amp; fx2 &lt; lg.x+lg.len){ onLog=lg; break; }
      }
      if(onLog){
        // ride the log
        frog.rideX = (frog.rideX===undefined? frog.col: frog.rideX) + lane2.speed*dt;
        frog.col = Math.round(frog.rideX);
        if(frog.col&lt;0 || frog.col&gt;COLS-1){ die(&#x27;water&#x27;); }
      } else {
        die(&#x27;water&#x27;);
      }
    } else {
      frog.rideX = undefined;
    }
  }

  // frog hop anim
  if(frog.hopT&gt;0){ frog.hopT -= dt/120; if(frog.hopT&lt;0)frog.hopT=0; }
  frog.sx += (1-frog.sx)*Math.min(1,dt/80);
  frog.sy += (1-frog.sy)*Math.min(1,dt/80);

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x += (pt.vx||0)*dt; pt.y += (pt.vy||0)*dt;
    if(pt.vy!==undefined &amp;&amp; pt.type===&#x27;goo&#x27;) pt.vy += 0.0006*dt;
    pt.life -= dt/ (pt.type===&#x27;coin&#x27;?900:600);
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  if(shake&gt;0){ shake -= dt/20; if(shake&lt;0)shake=0; }
  if(hitFlash&gt;0){ hitFlash -= dt/500; if(hitFlash&lt;0)hitFlash=0; }
}

// ---- Draw ----
function drawFrog(cx,cy,sx,sy){
  var s = CELL*0.62;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(sx,sy);
  // body
  ctx.fillStyle = &#x27;#39ff14&#x27;;
  ctx.strokeStyle = &#x27;#1f8f0a&#x27;; ctx.lineWidth=2;
  roundRect(-s/2, -s/2, s, s, s*0.3, true, true);
  // legs
  ctx.fillStyle=&#x27;#2fd60f&#x27;;
  roundRect(-s/2-s*0.14, s*0.1, s*0.22, s*0.35, 4, true, false);
  roundRect(s/2-s*0.08, s*0.1, s*0.22, s*0.35, 4, true, false);
  // eyes
  ctx.fillStyle=&#x27;#eafff0&#x27;;
  circle(-s*0.2,-s*0.32,s*0.16);
  circle(s*0.2,-s*0.32,s*0.16);
  ctx.fillStyle=&#x27;#111&#x27;;
  circle(-s*0.2,-s*0.30,s*0.08);
  circle(s*0.2,-s*0.30,s*0.08);
  // smile
  ctx.strokeStyle=&#x27;#0a4d06&#x27;; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,s*0.05,s*0.22,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  ctx.restore();
}
function drawCar(x,y,w,h,car,dir){
  ctx.save();
  ctx.translate(x,y);
  var grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,car.c); grad.addColorStop(1,car.c2);
  ctx.fillStyle=grad;
  roundRect(0,0,w,h,8,true,false);
  // windows
  ctx.fillStyle=&#x27;rgba(180,240,255,0.85)&#x27;;
  var ww = w*0.22;
  roundRect(w*0.16, h*0.18, ww, h*0.4, 3, true, false);
  roundRect(w*0.5, h*0.18, ww, h*0.4, 3, true, false);
  // headlights (front = direction of travel)
  ctx.fillStyle=&#x27;#fff6c0&#x27;;
  ctx.shadowColor=&#x27;#fff6a0&#x27;; ctx.shadowBlur=10;
  if(dir&gt;0){ ctx.fillRect(w-4,h*0.3,4,6); ctx.fillRect(w-4,h*0.65,4,6); }
  else { ctx.fillRect(0,h*0.3,4,6); ctx.fillRect(0,h*0.65,4,6); }
  ctx.shadowBlur=0;
  // wheels
  ctx.fillStyle=&#x27;#111&#x27;;
  ctx.fillRect(w*0.15,h-3,w*0.18,4);
  ctx.fillRect(w*0.67,h-3,w*0.18,4);
  ctx.restore();
}
function drawLog(x,y,w,h){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=&#x27;#6b3f22&#x27;;
  roundRect(0,0,w,h,h*0.4,true,false);
  ctx.strokeStyle=&#x27;#4a2a15&#x27;; ctx.lineWidth=1.5;
  for(var i=1;i&lt;w/12;i++){ ctx.beginPath(); ctx.moveTo(i*12,3); ctx.lineTo(i*12,h-3); ctx.stroke(); }
  // end rings
  ctx.fillStyle=&#x27;#8a5a33&#x27;; circle(6,h/2,h*0.28);
  ctx.fillStyle=&#x27;#8a5a33&#x27;; circle(w-6,h/2,h*0.28);
  ctx.restore();
}

function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill)ctx.fill(); if(stroke)ctx.stroke();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

function draw(){
  ctx.save();
  var sh = shake&gt;0 ? (Math.random()-0.5)*shake : 0;
  ctx.translate(sh, shake&gt;0?(Math.random()-0.5)*shake:0);

  // rows background
  for(var r=0;r&lt;GRID_ROWS;r++){
    var t = rowType(r);
    var y = r*ROWH;
    if(t===&#x27;bank&#x27;){
      ctx.fillStyle = r===0? &#x27;#123a1a&#x27;:&#x27;#123a1a&#x27;;
      ctx.fillRect(0,y,W,ROWH);
      // lily pad texture on far bank
      if(r===0){
        ctx.fillStyle=&#x27;#1c5a28&#x27;;
        for(var b=0;b&lt;COLS;b+=2){ circle(b*CELL+CELL,y+ROWH*0.5,ROWH*0.28); }
      }
    } else if(t===&#x27;river&#x27;){
      var rg = ctx.createLinearGradient(0,y,0,y+ROWH);
      rg.addColorStop(0,&#x27;#0d2b4a&#x27;); rg.addColorStop(1,&#x27;#123a63&#x27;);
      ctx.fillStyle=rg; ctx.fillRect(0,y,W,ROWH);
      // shimmer
      ctx.fillStyle=&#x27;rgba(120,200,255,0.08)&#x27;;
      for(var s2=0;s2&lt;W;s2+=40){ ctx.fillRect(s2+((performance.now()/40+r*20)%40),y+ROWH*0.4,18,2); }
    } else if(t===&#x27;median&#x27;){
      ctx.fillStyle=&#x27;#2a3a20&#x27;; ctx.fillRect(0,y,W,ROWH);
      ctx.fillStyle=&#x27;#3a5a28&#x27;;
      for(var g=0;g&lt;COLS;g++){ ctx.fillRect(g*CELL+8,y+6,CELL-16,ROWH-12); }
    } else { // road
      ctx.fillStyle=&#x27;#1c1c26&#x27;; ctx.fillRect(0,y,W,ROWH);
      // dashed lane marking
      ctx.strokeStyle= r===5?&#x27;#ffdd33&#x27;:&#x27;#ffffff&#x27;;
      ctx.setLineDash([16,14]); ctx.lineWidth=3; ctx.globalAlpha=0.55;
      ctx.beginPath(); ctx.moveTo(0,y+2); ctx.lineTo(W,y+2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
    }
  }
  // streetlamp glow at edges
  var lg = ctx.createLinearGradient(0,0,60,0);
  lg.addColorStop(0,&#x27;rgba(255,220,120,0.12)&#x27;); lg.addColorStop(1,&#x27;rgba(255,220,120,0)&#x27;);
  ctx.fillStyle=lg; ctx.fillRect(0,0,60,H);
  var lg2 = ctx.createLinearGradient(W,0,W-60,0);
  lg2.addColorStop(0,&#x27;rgba(255,220,120,0.12)&#x27;); lg2.addColorStop(1,&#x27;rgba(255,220,120,0)&#x27;);
  ctx.fillStyle=lg2; ctx.fillRect(W-60,0,60,H);

  // items
  for(var rr=1;rr&lt;=7;rr++){
    var lane=lanes[rr]; if(!lane) continue;
    var ly = rr*ROWH;
    for(var i=0;i&lt;lane.items.length;i++){
      var it=lane.items[i];
      var px = it.x*CELL;
      if(lane.type===&#x27;river&#x27;){
        drawLog(px, ly+ROWH*0.22, it.len*CELL, ROWH*0.56);
      } else {
        drawCar(px, ly+ROWH*0.18, it.len*CELL, ROWH*0.64, it.car, lane.dir);
      }
    }
  }

  // frog
  if(!(splatting &amp;&amp; frog.deadReason===&#x27;splat&#x27;)){
    var fx = (frog.col+0.5)*CELL;
    var fy = (frog.row+0.5)*ROWH;
    var lift = frog.hopT&gt;0 ? Math.sin(frog.hopT*Math.PI)*ROWH*0.25 : 0;
    if(splatting &amp;&amp; frog.deadReason===&#x27;water&#x27;){
      ctx.globalAlpha = 0.5;
      drawFrog(fx, fy, 1.2, 0.6);
      ctx.globalAlpha=1;
    } else {
      drawFrog(fx, fy-lift, frog.sx, frog.sy);
    }
  } else {
    // splat mark
    var fx2=(frog.col+0.5)*CELL, fy2=(frog.row+0.5)*ROWH;
    ctx.fillStyle=&#x27;rgba(57,255,20,0.5)&#x27;;
    circle(fx2,fy2,CELL*0.4);
    ctx.fillStyle=&#x27;#39ff14&#x27;;
    ctx.font=&#x27;bold 22px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;💥&#x27;, fx2, fy2+8);
  }

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    if(pt.type===&#x27;coin&#x27;){
      ctx.globalAlpha=Math.max(0,pt.life);
      ctx.fillStyle=&#x27;#ffd93b&#x27;;
      ctx.font=&#x27;bold 20px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;+&#x27;+pt.val, pt.x, pt.y);
      ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=Math.max(0,pt.life);
      ctx.fillStyle=&#x27;#39ff14&#x27;;
      circle(pt.x,pt.y,5);
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();

  if(hitFlash&gt;0){
    ctx.fillStyle=&#x27;rgba(255,50,80,&#x27;+(hitFlash*0.35)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  if(!running &amp;&amp; !splatting){
    ctx.fillStyle=&#x27;rgba(0,0,0,0.45)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#eafff0&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.font=&#x27;bold 26px system-ui&#x27;;
    ctx.fillText(&#x27;🐸 Press Start to hop!&#x27;, W/2, H/2);
  }
}

function loop(t){
  if(!running){ return; }
  var dt = Math.min(50, t-lastT); lastT=t;
  update(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}

// ---- Input ----
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ hop(-1,0); e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ hop(1,0); e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ hop(0,-1); e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ hop(0,1); e.preventDefault(); }
});
// swipe
var tsx=0,tsy=0;
cv.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
cv.addEventListener(&#x27;touchend&#x27;,function(e){
  var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20) return;
  if(Math.abs(dx)&gt;Math.abs(dy)) hop(dx&gt;0?1:-1,0); else hop(0,dy&gt;0?1:-1);
});
// click to hop up (mouse-friendly)
cv.addEventListener(&#x27;mousedown&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  var mx=(e.clientX-rect.left)/rect.width*W;
  var fx=(frog?frog.col:0+0.5)*CELL;
  if(mx &lt; fx-CELL*0.6) hop(-1,0);
  else if(mx &gt; fx+CELL*0.6) hop(1,0);
  else hop(0,-1);
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
resetFrog(); buildLanes(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
