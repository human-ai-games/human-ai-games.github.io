<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #e8e8ff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALACTIC DEFLECTOR&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your paddle with the mouse or &amp;larr; &amp;rarr; keys to bounce the energy orb into the alien invaders. Don&#x27;t let the orb fall past the bottom — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var running = false, animId = null;
  var keysDown = {};
  var PADDLE_W = 96, PADDLE_H = 14, PADDLE_Y = H - 26;
  var paddleX = (W - PADDLE_W) / 2;
  var mouseX = null;
  var BALL_R = 8;
  var baseSpeed = 4.2, speed = baseSpeed;
  var ballX = W/2, ballY = H - 60, ballVX = 3, ballVY = -3;
  var score = 0, wave = 0;
  var paddleFlash = 0, shake = 0;
  var aliens = [], particles = [], stars = [], trail = [], starShower = [];

  // background stars
  for (var i = 0; i &lt; 70; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, tw: Math.random()*Math.PI*2 });
  }

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch(_) {}
  }

  var COLORS = { std:&#x27;#4dd2ff&#x27;, armor:&#x27;#b04dff&#x27;, gold:&#x27;#ffd24d&#x27; };

  function spawnWave() {
    aliens = [];
    wave++;
    var rows = Math.min(3 + wave, 6);
    var cols = 8;
    var aw = 58, ah = 24, gapX = 8, gapY = 10;
    var totalW = cols*aw + (cols-1)*gapX;
    var startX = (W - totalW)/2;
    var startY = 30;
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; cols; c++) {
        var roll = Math.random();
        var type = &#x27;std&#x27;;
        if (roll &lt; 0.12) type = &#x27;gold&#x27;;
        else if (roll &lt; 0.12 + Math.min(0.35, 0.1 + wave*0.05)) type = &#x27;armor&#x27;;
        aliens.push({
          x: startX + c*(aw+gapX), y: startY + r*(ah+gapY),
          w: aw, h: ah, type: type, hp: type===&#x27;armor&#x27;?2:1,
          flash: 0, wob: Math.random()*Math.PI*2, baseX: startX + c*(aw+gapX)
        });
      }
    }
  }

  function starShowerBurst() {
    for (var i = 0; i &lt; 60; i++) {
      starShower.push({ x: Math.random()*W, y: -10, vy: Math.random()*3+2, life: 1,
        c: [&#x27;#ff4d6d&#x27;,&#x27;#ffd24d&#x27;,&#x27;#4dff9e&#x27;,&#x27;#4dd2ff&#x27;,&#x27;#b04dff&#x27;][Math.floor(Math.random()*5)] });
    }
  }

  function explode(x, y, color, n) {
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, c:color });
    }
  }

  function resetBall(lost) {
    if (lost) { paddleFlash = 20; shake = 16; beep(120, 0.4, &#x27;sawtooth&#x27;, 0.12); }
    ballX = paddleX + PADDLE_W/2;
    ballY = PADDLE_Y - 20;
    var ang = (-Math.PI/2) + (Math.random()*0.6 - 0.3);
    ballVX = Math.cos(ang)*speed;
    ballVY = Math.sin(ang)*speed;
    trail = [];
  }

  function updateSpeed() {
    speed = baseSpeed + Math.floor(score/5)*0.35;
    var mag = Math.sqrt(ballVX*ballVX + ballVY*ballVY) || 1;
    ballVX = ballVX/mag*speed; ballVY = ballVY/mag*speed;
  }

  function tick() {
    if (!running) return;
    // paddle control
    if (mouseX !== null) {
      paddleX += (mouseX - PADDLE_W/2 - paddleX) * 0.4;
    }
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= 7;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += 7;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    // ball
    ballX += ballVX; ballY += ballVY;
    if (ballX - BALL_R &lt;= 0) { ballX = BALL_R; ballVX = Math.abs(ballVX); }
    if (ballX + BALL_R &gt;= W) { ballX = W - BALL_R; ballVX = -Math.abs(ballVX); }
    if (ballY - BALL_R &lt;= 0) { ballY = BALL_R; ballVY = Math.abs(ballVY); }

    // paddle collision
    if (ballVY &gt; 0 &amp;&amp; ballY + BALL_R &gt;= PADDLE_Y &amp;&amp; ballY - BALL_R &lt;= PADDLE_Y + PADDLE_H &amp;&amp;
        ballX &gt;= paddleX - BALL_R &amp;&amp; ballX &lt;= paddleX + PADDLE_W + BALL_R) {
      ballY = PADDLE_Y - BALL_R;
      var hit = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2);
      var ang = -Math.PI/2 + hit * (Math.PI/3);
      ballVX = Math.cos(ang)*speed; ballVY = Math.sin(ang)*speed;
      beep(440, 0.08, &#x27;square&#x27;, 0.06);
    }

    // lost
    if (ballY - BALL_R &gt; H) resetBall(true);

    // trail
    trail.push({ x: ballX, y: ballY });
    if (trail.length &gt; 12) trail.shift();

    // aliens
    for (var i = aliens.length - 1; i &gt;= 0; i--) {
      var al = aliens[i];
      if (al.type === &#x27;gold&#x27;) { al.wob += 0.08; al.x = al.baseX + Math.sin(al.wob)*10; }
      if (al.flash &gt; 0) al.flash--;
      if (ballX + BALL_R &gt;= al.x &amp;&amp; ballX - BALL_R &lt;= al.x + al.w &amp;&amp;
          ballY + BALL_R &gt;= al.y &amp;&amp; ballY - BALL_R &lt;= al.y + al.h) {
        // reflect
        var overlapL = (ballX + BALL_R) - al.x;
        var overlapR = (al.x + al.w) - (ballX - BALL_R);
        var overlapT = (ballY + BALL_R) - al.y;
        var overlapB = (al.y + al.h) - (ballY - BALL_R);
        var m = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (m === overlapT || m === overlapB) ballVY = -ballVY; else ballVX = -ballVX;
        al.hp--;
        if (al.hp &gt; 0) {
          al.flash = 8;
          beep(300, 0.06, &#x27;square&#x27;, 0.05);
        } else {
          var col = COLORS[al.type];
          explode(al.x + al.w/2, al.y + al.h/2, col, al.type===&#x27;gold&#x27;?24:14);
          score += al.type === &#x27;gold&#x27; ? 5 : 1;
          scoreEl.textContent = score;
          updateSpeed();
          beep(al.type===&#x27;gold&#x27;?880:600, 0.09, &#x27;triangle&#x27;, 0.07);
          aliens.splice(i, 1);
        }
      }
    }

    if (aliens.length === 0) { starShowerBurst(); beep(700, 0.3, &#x27;triangle&#x27;, 0.08); spawnWave(); }

    // particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= 0.03;
      if (pt.life &lt;= 0) particles.splice(p, 1);
    }
    for (var s = starShower.length - 1; s &gt;= 0; s--) {
      var ss = starShower[s]; ss.y += ss.vy; ss.life -= 0.01;
      if (ss.y &gt; H || ss.life &lt;= 0) starShower.splice(s, 1);
    }

    if (paddleFlash &gt; 0) paddleFlash--;
    if (shake &gt; 0) shake--;

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.save();
    var sx = 0, sy = 0;
    if (shake &gt; 0) { sx = (Math.random()-0.5)*shake; sy = (Math.random()-0.5)*shake; }
    ctx.translate(sx, sy);

    ctx.fillStyle = &#x27;#05030f&#x27;;
    ctx.fillRect(-20, -20, W+40, H+40);

    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var st = stars[i]; st.tw += 0.05;
      var a = 0.4 + Math.sin(st.tw)*0.35;
      ctx.globalAlpha = a; ctx.fillStyle = &#x27;#cfd6ff&#x27;;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // aliens
    for (var j = 0; j &lt; aliens.length; j++) {
      var al = aliens[j];
      var col = COLORS[al.type];
      ctx.fillStyle = al.flash &gt; 0 ? &#x27;#ffffff&#x27; : col;
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      roundRect(al.x, al.y, al.w, al.h, 6); ctx.fill();
      ctx.shadowBlur = 0;
      // eyes
      ctx.fillStyle = &#x27;#05030f&#x27;;
      ctx.beginPath(); ctx.arc(al.x+al.w*0.35, al.y+al.h*0.5, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(al.x+al.w*0.65, al.y+al.h*0.5, 3, 0, Math.PI*2); ctx.fill();
      if (al.type === &#x27;armor&#x27; &amp;&amp; al.hp === 2) {
        ctx.strokeStyle = &#x27;rgba(255,255,255,.6)&#x27;; ctx.lineWidth = 2;
        roundRect(al.x+3, al.y+3, al.w-6, al.h-6, 4); ctx.stroke();
      }
    }

    // trail
    for (var t = 0; t &lt; trail.length; t++) {
      var tr = trail[t], f = t/trail.length;
      ctx.globalAlpha = f*0.6;
      ctx.fillStyle = f &gt; 0.6 ? &#x27;#ffd24d&#x27; : &#x27;#ff6b3d&#x27;;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, BALL_R*f, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ball
    ctx.fillStyle = &#x27;#fff&#x27;; ctx.shadowColor = &#x27;#4dd2ff&#x27;; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(ballX, ballY, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // paddle
    ctx.fillStyle = paddleFlash &gt; 0 ? &#x27;#ff3355&#x27; : &#x27;#4dff9e&#x27;;
    ctx.shadowColor = paddleFlash &gt; 0 ? &#x27;#ff3355&#x27; : &#x27;#4dff9e&#x27;; ctx.shadowBlur = 18;
    roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7); ctx.fill();
    ctx.shadowBlur = 0;

    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.c;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
    }
    // star shower
    for (var s = 0; s &lt; starShower.length; s++) {
      var ss = starShower[s];
      ctx.globalAlpha = Math.max(0, ss.life);
      ctx.fillStyle = ss.c;
      ctx.beginPath(); ctx.arc(ss.x, ss.y, 2.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function startGame() {
    if (running) return;
    score = 0; wave = 0; scoreEl.textContent = &#x27;0&#x27;;
    baseSpeed = 4.2; speed = baseSpeed;
    particles = []; starShower = []; trail = [];
    paddleX = (W - PADDLE_W)/2; paddleFlash = 0; shake = 0;
    for (var k in keysDown) keysDown[k] = false;
    spawnWave();
    resetBall(false);
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  cv.addEventListener(&#x27;mousemove&#x27;, function(e) {
    var rect = cv.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  window.addEventListener(&#x27;keydown&#x27;, function(e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function(e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  draw();
&lt;/script&gt;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }

  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
