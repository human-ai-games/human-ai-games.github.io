<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash Inferno 🔥</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b2138; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#ffd54f,#ff6ec7,#6ee7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #cfe3ff; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; font-weight: 800; }

  .field { position: relative; width: 600px; height: 480px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
           box-shadow: 0 0 0 3px #14324d, 0 8px 30px rgba(0,0,0,.5); }
  .row { position: absolute; left: 0; width: 100%; }
  .mover { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; will-change: transform; }
  .frog { position: absolute; font-size: 34px; z-index: 20; transition: left .09s ease, top .09s ease; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .cloud { position: absolute; font-size: 34px; opacity: .85; z-index: 1; }
  #banner { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 40px; font-weight: 900; z-index: 30; pointer-events: none; opacity: 0; transition: opacity .2s; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash Inferno 🔥&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use arrow keys (or swipe) to hop your frog to the golden lily pad up top — surf logs and turtles, dodge the cars! Each point speeds everything up; the round lasts one minute.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;big&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;⏱ &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var CELL = 48, COLS = 12, ROWS = 10;
var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL; // 576x480 -&gt; use 600 wide field, center grid
// We&#x27;ll use FIELD_W=600, so recompute
FIELD_W = 600;
var GRID_X = (FIELD_W - COLS*CELL)/2; // 12px margin
var field = document.getElementById(&#x27;field&#x27;);
var banner = document.getElementById(&#x27;banner&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);

// Row layout (row 0 = top goal):
// row0: goal (lily pads)  water zone rows 1-4 (logs/turtles), median row5, road rows 6-8, bank row 9
var rows = [
  {type:&#x27;goal&#x27;},
  {type:&#x27;water&#x27;, dir:1,  speed:0.9, kind:&#x27;log&#x27;,    gap:190, w:2},
  {type:&#x27;water&#x27;, dir:-1, speed:1.3, kind:&#x27;turtle&#x27;, gap:150, w:1},
  {type:&#x27;water&#x27;, dir:1,  speed:1.6, kind:&#x27;log&#x27;,    gap:220, w:3},
  {type:&#x27;water&#x27;, dir:-1, speed:1.1, kind:&#x27;turtle&#x27;, gap:130, w:1},
  {type:&#x27;median&#x27;},
  {type:&#x27;road&#x27;, dir:-1, speed:2.2, kind:&#x27;car&#x27;,   gap:200, w:1},
  {type:&#x27;road&#x27;, dir:1,  speed:1.5, kind:&#x27;truck&#x27;, gap:260, w:2},
  {type:&#x27;road&#x27;, dir:-1, speed:2.8, kind:&#x27;moto&#x27;,  gap:180, w:1},
  {type:&#x27;bank&#x27;}
];

var LOG = &#x27;🪵&#x27;, TURTLE = &#x27;🐢&#x27;, CAR = &#x27;🚗&#x27;, TRUCK = &#x27;🚚&#x27;, MOTO = &#x27;🏍️&#x27;, LILY = &#x27;🌸&#x27;, GOAL = &#x27;⭐&#x27;;

var running=false, animId=null, gameOver=false;
var score=0, best=0, speedMul=1, timeLeft=60, timerId=null;
var frog = {col:6, row:9, el:null};
var lanes=[]; // per row: {el, dir, speed, movers:[{x,w,el}]}
var clouds=[];
var goalCols=[]; // filled goal positions
var lastTs=0;

function rowY(r){ return r*CELL; }

function buildStatic(){
  field.innerHTML=&#x27;&#x27;; field.appendChild(banner);
  banner.style.opacity=0;
  // backgrounds + clouds
  for(var r=0;r&lt;ROWS;r++){
    var t=rows[r].type;
    var div=document.createElement(&#x27;div&#x27;);
    div.className=&#x27;row&#x27;;
    div.style.top=rowY(r)+&#x27;px&#x27;; div.style.height=CELL+&#x27;px&#x27;;
    if(t===&#x27;goal&#x27;) div.style.background=&#x27;linear-gradient(#0a5c3a,#0d7a4d)&#x27;;
    else if(t===&#x27;water&#x27;) div.style.background = (r%2? &#x27;#1b6fc4&#x27;:&#x27;#2280d8&#x27;);
    else if(t===&#x27;median&#x27;) div.style.background=&#x27;#3aa856&#x27;;
    else if(t===&#x27;road&#x27;) div.style.background=&#x27;#222&#x27;;
    else if(t===&#x27;bank&#x27;) div.style.background=&#x27;linear-gradient(#3aa856,#2e8c46)&#x27;;
    field.appendChild(div);
    // road lane dashes
    if(t===&#x27;road&#x27;){
      div.style.borderTop=&#x27;2px dashed #ffe94d&#x27;;
    }
    // water ripple text
    if(t===&#x27;water&#x27;){
      div.style.color=&#x27;rgba(255,255,255,.15)&#x27;;
      div.textContent=&#x27;~~~~~~~~~~~~~~~~~~&#x27;;
      div.style.fontSize=&#x27;20px&#x27;; div.style.overflow=&#x27;hidden&#x27;; div.style.whiteSpace=&#x27;nowrap&#x27;;
    }
  }
  // goal lily pads
  goalCols=[];
  var slots=[1,4,7,10];
  for(var i=0;i&lt;slots.length;i++){
    var pad=document.createElement(&#x27;div&#x27;);
    pad.className=&#x27;mover&#x27;;
    pad.style.left=(GRID_X+slots[i]*CELL)+&#x27;px&#x27;; pad.style.top=&#x27;7px&#x27;;
    pad.style.width=CELL+&#x27;px&#x27;; pad.style.height=CELL+&#x27;px&#x27;;
    pad.textContent=LILY;
    field.appendChild(pad);
    goalCols.push({col:slots[i], filled:false, el:pad});
  }
  // clouds
  clouds=[];
  for(var c=0;c&lt;3;c++){
    var cl=document.createElement(&#x27;div&#x27;);
    cl.className=&#x27;cloud&#x27;; cl.textContent=&#x27;☁️&#x27;;
    cl.style.top=(5+c*14)+&#x27;px&#x27;;
    var cx=c*220+30;
    cl.style.left=cx+&#x27;px&#x27;;
    field.appendChild(cl);
    clouds.push({x:cx, sp:0.15+c*0.08, el:cl});
  }
}

function buildLanes(){
  lanes=[];
  for(var r=0;r&lt;ROWS;r++){
    var cfg=rows[r];
    if(cfg.type!==&#x27;water&#x27; &amp;&amp; cfg.type!==&#x27;road&#x27;){ lanes.push(null); continue; }
    var laneEl=document.createElement(&#x27;div&#x27;);
    laneEl.className=&#x27;row&#x27;;
    laneEl.style.top=rowY(r)+&#x27;px&#x27;; laneEl.style.height=CELL+&#x27;px&#x27;; laneEl.style.zIndex=5;
    field.appendChild(laneEl);
    var movers=[];
    var glyph = cfg.kind===&#x27;log&#x27;?LOG: cfg.kind===&#x27;turtle&#x27;?TURTLE: cfg.kind===&#x27;car&#x27;?CAR: cfg.kind===&#x27;truck&#x27;?TRUCK:MOTO;
    var x = (cfg.dir&gt;0? -100 : FIELD_W+50);
    var count = Math.ceil((FIELD_W+300)/cfg.gap);
    for(var j=0;j&lt;count;j++){
      var mw = cfg.w*CELL;
      var mx = cfg.dir&gt;0 ? j*cfg.gap - 100 : FIELD_W - j*cfg.gap;
      var m=document.createElement(&#x27;div&#x27;);
      m.className=&#x27;mover&#x27;;
      m.style.width=mw+&#x27;px&#x27;; m.style.height=(CELL-6)+&#x27;px&#x27;; m.style.top=&#x27;3px&#x27;;
      m.style.borderRadius=&#x27;8px&#x27;;
      if(cfg.type===&#x27;water&#x27;){
        m.style.background= cfg.kind===&#x27;log&#x27;? &#x27;rgba(120,72,30,.0)&#x27;:&#x27;rgba(0,0,0,0)&#x27;;
        if(cfg.kind===&#x27;log&#x27;){ m.style.background=&#x27;#7a4a1e&#x27;; }
      }
      // fill glyphs across width
      var g=&#x27;&#x27;;
      var n=Math.max(1,cfg.w);
      for(var k=0;k&lt;n;k++) g+=glyph;
      m.textContent=g;
      if(cfg.kind===&#x27;moto&#x27;) m.style.filter=&#x27;drop-shadow(0 0 6px #ff2d6d)&#x27;;
      if(cfg.kind===&#x27;car&#x27;) m.style.filter=&#x27;drop-shadow(0 0 6px #6ee7ff)&#x27;;
      laneEl.appendChild(m);
      movers.push({x:mx, w:mw, el:m});
    }
    lanes.push({el:laneEl, dir:cfg.dir, speed:cfg.speed, type:cfg.type, movers:movers});
  }
}

function makeFrog(){
  if(frog.el &amp;&amp; frog.el.parentNode) frog.el.parentNode.removeChild(frog.el);
  frog.el=document.createElement(&#x27;div&#x27;);
  frog.el.className=&#x27;frog&#x27;; frog.el.textContent=&#x27;🐸&#x27;;
  field.appendChild(frog.el);
}
function paintFrog(){
  frog.el.style.left=(GRID_X+frog.col*CELL+2)+&#x27;px&#x27;;
  frog.el.style.top=(frog.row*CELL+4)+&#x27;px&#x27;;
}
function resetFrog(){ frog.col=6; frog.row=9; frog.el.textContent=&#x27;🐸&#x27;; paintFrog(); }

function showBanner(txt,color){
  banner.textContent=txt; banner.style.color=color||&#x27;#fff&#x27;;
  banner.style.opacity=1;
  setTimeout(function(){ banner.style.opacity=0; },700);
}

// sound
var audioCtx=null;
function beep(freqs, dur, type){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var t=audioCtx.currentTime;
    freqs.forEach(function(f,i){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type||&#x27;sine&#x27;; o.frequency.value=f;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.15,t+i*0.06);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+dur);
      o.start(t+i*0.06); o.stop(t+i*0.06+dur);
    });
  }catch(_){}
}
function ribbit(){ beep([220,330,180],0.15,&#x27;triangle&#x27;); }
function splash(){ beep([500,200,80],0.18,&#x27;sawtooth&#x27;); }
function squish(){ beep([150,90,50],0.2,&#x27;square&#x27;); }

function frogWorldX(){ return GRID_X+frog.col*CELL+2; }

function tick(ts){
  if(!running) return;
  var dt = lastTs? (ts-lastTs)/16.7 : 1; lastTs=ts;
  if(dt&gt;3) dt=3;
  // clouds
  clouds.forEach(function(c){
    c.x += c.sp*dt;
    if(c.x&gt;FIELD_W+40) c.x=-60;
    c.el.style.left=c.x+&#x27;px&#x27;;
  });
  var onPlatform=false, platformDx=0;
  for(var r=0;r&lt;ROWS;r++){
    var lane=lanes[r]; if(!lane) continue;
    var v=lane.dir*lane.speed*speedMul*dt;
    for(var j=0;j&lt;lane.movers.length;j++){
      var m=lane.movers[j];
      m.x+=v;
      if(lane.dir&gt;0 &amp;&amp; m.x&gt;FIELD_W+20) m.x=-m.w-20;
      else if(lane.dir&lt;0 &amp;&amp; m.x+m.w&lt; -20) m.x=FIELD_W+20;
      m.el.style.left=m.x+&#x27;px&#x27;;
    }
    // interaction with frog if in this row
    if(frog.row===r){
      var fx=frogWorldX(), fw=CELL;
      if(lane.type===&#x27;water&#x27;){
        // must be on a mover, else drown
        for(var k=0;k&lt;lane.movers.length;k++){
          var mm=lane.movers[k];
          if(fx+fw*0.5 &gt; mm.x &amp;&amp; fx+fw*0.5 &lt; mm.x+mm.w){ onPlatform=true; platformDx=v; break; }
        }
      } else if(lane.type===&#x27;road&#x27;){
        for(var q=0;q&lt;lane.movers.length;q++){
          var mc=lane.movers[q];
          if(fx &lt; mc.x+mc.w-6 &amp;&amp; fx+fw &gt; mc.x+6){ die(&#x27;squish&#x27;); return; }
        }
      }
    }
  }
  // water drowning / drifting
  var frtype=rows[frog.row].type;
  if(frtype===&#x27;water&#x27; || frog.row&gt;=1 &amp;&amp; frog.row&lt;=4){
    if(rows[frog.row].type===&#x27;water&#x27;){
      if(!onPlatform){ die(&#x27;splash&#x27;); return; }
      else {
        // drift frog with platform
        var newLeftPx = parseFloat(frog.el.style.left)+platformDx;
        // convert back to col approx: keep pixel drift but clamp
        var minX=GRID_X+2, maxX=GRID_X+(COLS-1)*CELL+2;
        newLeftPx=Math.max(minX-CELL*0.6, Math.min(maxX+CELL*0.6,newLeftPx));
        frog.el.style.transition=&#x27;none&#x27;;
        frog.el.style.left=newLeftPx+&#x27;px&#x27;;
        // update col from pixel
        frog.col=Math.round((newLeftPx-GRID_X-2)/CELL);
        if(newLeftPx &lt; -CELL || newLeftPx&gt;FIELD_W){ die(&#x27;splash&#x27;); return; }
      }
    }
  }
  animId=requestAnimationFrame(tick);
}

function die(kind){
  if(kind===&#x27;splash&#x27;){ frog.el.textContent=&#x27;💦&#x27;; splash(); showBanner(&#x27;SPLASH!&#x27;,&#x27;#6ee7ff&#x27;); }
  else { frog.el.textContent=&#x27;💥&#x27;; squish(); showBanner(&#x27;SQUISH!&#x27;,&#x27;#ff6b6b&#x27;); }
  running=false;
  if(animId){cancelAnimationFrame(animId); animId=null;}
  setTimeout(function(){
    if(gameOver) return;
    frog.el.style.transition=&#x27;left .09s ease, top .09s ease&#x27;;
    resetFrog();
    running=true; lastTs=0; animId=requestAnimationFrame(tick);
  },600);
}

function reachGoal(){
  // find nearest empty lily
  var best=null,bd=999;
  for(var i=0;i&lt;goalCols.length;i++){
    var g=goalCols[i]; if(g.filled) continue;
    var d=Math.abs(g.col-frog.col);
    if(d&lt;bd){bd=d;best=g;}
  }
  if(best &amp;&amp; bd&lt;=1){
    best.filled=true; best.el.textContent=GOAL; best.el.style.filter=&#x27;drop-shadow(0 0 8px gold)&#x27;;
    score++; scoreEl.textContent=score;
    if(score&gt;window._best){ window._best=score; bestEl.textContent=score; }
    speedMul += 0.12;
    ribbit(); showBanner(&#x27;RIBBIT! +1&#x27;,&#x27;#ffd54f&#x27;);
    // reset pads when all filled
    var allFilled=goalCols.every(function(g){return g.filled;});
    if(allFilled){ goalCols.forEach(function(g){g.filled=false; g.el.textContent=LILY; g.el.style.filter=&#x27;&#x27;;}); showBanner(&#x27;ALL PADS! 🎉&#x27;,&#x27;#ff6ec7&#x27;); }
    resetFrog();
  } else {
    die(&#x27;splash&#x27;);
  }
}

function move(dc,dr){
  if(!running || gameOver) return;
  frog.el.style.transition=&#x27;left .09s ease, top .09s ease&#x27;;
  var nc=Math.max(0,Math.min(COLS-1,frog.col+dc));
  var nr=Math.max(0,Math.min(ROWS-1,frog.row+dr));
  frog.col=nc; frog.row=nr;
  if(frog.row===0){ reachGoal(); return; }
  paintFrog();
}

function startGame(){
  if(running) return;
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  speedMul=1; timeLeft=60; timeEl.textContent=&#x27;60&#x27;;
  gameOver=false; lastTs=0;
  if(window._best===undefined) window._best=0;
  bestEl.textContent=window._best;
  buildStatic(); buildLanes(); makeFrog(); resetFrog();
  running=true;
  animId=requestAnimationFrame(tick);
  if(timerId) clearInterval(timerId);
  timerId=setInterval(function(){
    if(!running) return;
    timeLeft--; timeEl.textContent=timeLeft;
    if(timeLeft&lt;=0){ endRound(); }
  },1000);
}
function endRound(){
  gameOver=true; running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(timerId){clearInterval(timerId);timerId=null;}
  showBanner(&#x27;TIME! Score &#x27;+score,&#x27;#ffd54f&#x27;);
}
function stopGame(){
  running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(timerId){clearInterval(timerId);timerId=null;}
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){move(-1,0);e.preventDefault();}
  else if(e.key===&#x27;ArrowRight&#x27;){move(1,0);e.preventDefault();}
  else if(e.key===&#x27;ArrowUp&#x27;){move(0,-1);e.preventDefault();}
  else if(e.key===&#x27;ArrowDown&#x27;){move(0,1);e.preventDefault();}
});
// swipe
var tsx=0,tsy=0;
field.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
field.addEventListener(&#x27;touchend&#x27;,function(e){
  var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
  if(Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0);
  else move(0,dy&gt;0?1:-1);
},{passive:true});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial paint
window._best=0;
buildStatic(); buildLanes(); makeFrog(); resetFrog();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
