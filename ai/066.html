&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a0e2e; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; background: linear-gradient(90deg,#ff6b9d,#ffd93d,#6bcB77); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #cbb8e8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }

  .cell { position: absolute; box-sizing: border-box; border-radius: 7px; display: flex; align-items: center; justify-content: center; transition: none; }

  @keyframes floatUp { 0%{opacity:0; transform:translate(-50%,10px) scale(.6)} 20%{opacity:1; transform:translate(-50%,-4px) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-60px) scale(1)} }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍓 Fruit Drop 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with ← / →, rotate with ↑, and press ↓ to drop faster. On touch: swipe to move, swipe down to hard-drop, tap to rotate — clear full rows to score!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Level &lt;span class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Rows &lt;span class=&quot;val&quot; id=&quot;rows&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over&lt;br&gt;&lt;span style=&quot;font-size:18px;color:#cbb8e8&quot;&gt;Press Start to play again&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 30, COLS = 11, ROWS = 18;
  var FIELD_W = COLS*CELL, FIELD_H = ROWS*CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  var over = document.getElementById(&#x27;over&#x27;);
  field.style.width = FIELD_W+&#x27;px&#x27;;
  field.style.height = FIELD_H+&#x27;px&#x27;;
  field.style.backgroundImage =
    &#x27;linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),&#x27;+
    &#x27;linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px)&#x27;;
  field.style.backgroundSize = CELL+&#x27;px &#x27;+CELL+&#x27;px&#x27;;

  // Piece definitions: rotation states as [x,y] offsets.
  var SHAPES = {
    I: { fruit:&#x27;🍉&#x27;, color:&#x27;#e84545&#x27;, cells:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]] },
    O: { fruit:&#x27;🍊&#x27;, color:&#x27;#ff9f1c&#x27;, cells:[[[0,0],[1,0],[0,1],[1,1]]] },
    T: { fruit:&#x27;🍇&#x27;, color:&#x27;#9b5de5&#x27;, cells:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] },
    S: { fruit:&#x27;🍏&#x27;, color:&#x27;#57cc99&#x27;, cells:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]] },
    Z: { fruit:&#x27;🍓&#x27;, color:&#x27;#f15bb5&#x27;, cells:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]] },
    J: { fruit:&#x27;🫐&#x27;, color:&#x27;#4361ee&#x27;, cells:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] },
    L: { fruit:&#x27;🍋&#x27;, color:&#x27;#ffd60a&#x27;, cells:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }
  };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, score, rowsCleared, level, running, dropId;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var rowsEl = document.getElementById(&#x27;rows&#x27;);

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function pieceCells(p, rot){
    var s = SHAPES[p.type];
    var st = s.cells[(rot!==undefined?rot:p.rot) % s.cells.length];
    return st.map(function(o){ return {x:p.x+o[0], y:p.y+o[1]}; });
  }

  function collides(p, rot){
    var cells = pieceCells(p, rot);
    for(var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if(cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawn(){
    var t = KEYS[Math.floor(Math.random()*KEYS.length)];
    piece = { type:t, x:Math.floor(COLS/2)-2, y:-1, rot:0 };
    // nudge into board
    piece.y = 0;
    return !collides(piece);
  }

  function lock(){
    var cells = pieceCells(piece);
    var s = SHAPES[piece.type];
    for(var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if(c.y&gt;=0 &amp;&amp; c.y&lt;ROWS &amp;&amp; c.x&gt;=0 &amp;&amp; c.x&lt;COLS) grid[c.y][c.x] = {fruit:s.fruit, color:s.color};
    }
    piece=null;
  }

  var SCORES = {1:100,2:300,3:600,4:1000};

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    if(full.length===0) return;
    // flash
    paint(full);
    var n=full.length;
    score += SCORES[n]||1000;
    rowsCleared += n;
    var newLevel = Math.floor(rowsCleared/5)+1;
    if(newLevel&gt;level){ level=newLevel; restartDrop(); }
    scoreEl.textContent=score; rowsEl.textContent=rowsCleared; levelEl.textContent=level;
    if(n&gt;=2){
      field.classList.remove(&#x27;shake&#x27;); void field.offsetWidth; field.classList.add(&#x27;shake&#x27;);
      var burst=document.createElement(&#x27;div&#x27;); burst.className=&#x27;combo&#x27;; burst.textContent=&#x27;+COMBO x&#x27;+n+&#x27;!&#x27;;
      field.appendChild(burst); setTimeout(function(){ if(burst.parentNode)burst.parentNode.removeChild(burst); },1000);
    }
    beep(n);
    setTimeout(function(){
      for(var i=full.length-1;i&gt;=0;i--){ grid.splice(full[i],1); var e=[]; for(var c=0;c&lt;COLS;c++)e.push(null); grid.unshift(e); }
      paint();
    }, 300);
  }

  function makeCell(cx,cy,data,extra){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(extra?&#x27; &#x27;+extra:&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=data.color;
    el.style.fontSize=(CELL-8)+&#x27;px&#x27;;
    el.textContent=data.fruit;
    field.appendChild(el);
  }

  function paint(flashRows){
    field.innerHTML=&#x27;&#x27;;
    // ghost
    if(piece){
      var g={type:piece.type,x:piece.x,y:piece.y,rot:piece.rot};
      while(!collides({type:g.type,x:g.x,y:g.y+1,rot:g.rot})) g.y++;
      var gc=pieceCells(g), s=SHAPES[piece.type];
      for(var i=0;i&lt;gc.length;i++) if(gc[i].y&gt;=0) makeCell(gc[i].x,gc[i].y,{fruit:s.fruit,color:s.color},&#x27;ghost&#x27;);
    }
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]){
      var fl = flashRows &amp;&amp; flashRows.indexOf(r)&gt;=0 ? &#x27;flash&#x27;:&#x27;&#x27;;
      makeCell(c,r,grid[r][c],fl);
    }
    if(piece){
      var cells=pieceCells(piece), s2=SHAPES[piece.type];
      for(var j=0;j&lt;cells.length;j++) if(cells[j].y&gt;=0) makeCell(cells[j].x,cells[j].y,{fruit:s2.fruit,color:s2.color});
    }
  }

  function stepDown(){
    if(!piece) return;
    var next={type:piece.type,x:piece.x,y:piece.y+1,rot:piece.rot};
    if(collides(next)){ lock(); clearRows(); if(!spawn()){ endGame(); paint(); return; } }
    else piece=next;
    paint();
  }

  function hardDrop(){
    if(!piece) return;
    while(!collides({type:piece.type,x:piece.x,y:piece.y+1,rot:piece.rot})) piece.y++;
    stepDown();
  }

  function move(dx){
    if(!running||!piece) return;
    var next={type:piece.type,x:piece.x+dx,y:piece.y,rot:piece.rot};
    if(!collides(next)){ piece=next; paint(); }
  }

  function rotate(){
    if(!running||!piece) return;
    var nr=(piece.rot+1)%SHAPES[piece.type].cells.length;
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      var np={type:piece.type,x:piece.x+kicks[k],y:piece.y,rot:nr};
      if(!collides(np)){ piece=np; paint(); return; }
    }
  }

  function dropInterval(){ return Math.max(120, 600 - (level-1)*55); }
  function restartDrop(){ if(dropId)clearInterval(dropId); dropId=setInterval(stepDown, dropInterval()); }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} over.style.display=&#x27;flex&#x27;; }

  function startGame(){
    score=0; rowsCleared=0; level=1; running=true;
    scoreEl.textContent=0; rowsEl.textContent=0; levelEl.textContent=1;
    over.style.display=&#x27;none&#x27;;
    newGrid(); spawn(); paint();
    restartDrop();
  }
  function stopGame(){ if(!running)return; running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  // sound
  var actx;
  function beep(n){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.frequency.value=300+n*120; o.type=&#x27;triangle&#x27;;
      g.gain.setValueAtTime(.15,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.25);
      o.start(); o.stop(actx.currentTime+.25);
    }catch(_){}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ if(running)stepDown(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if(e.key===&#x27; &#x27;){ if(running)hardDrop(); e.preventDefault(); }
  });

  // touch
  var tsx,tsy,tst,moved;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tst=Date.now(); moved=false; },{passive:true});
  field.addEventListener(&#x27;touchmove&#x27;,function(e){
    if(!running) return;
    var t=e.touches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&gt;CELL &amp;&amp; Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); tsx=t.clientX; moved=true; }
  },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    var dy=(e.changedTouches[0].clientY-tsy);
    if(!moved){
      if(dy&gt;CELL*2) hardDrop();
      else if(Date.now()-tst&lt;300) rotate();
    }
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial preview
  newGrid(); piece={type:&#x27;T&#x27;,x:Math.floor(COLS/2)-2,y:1,rot:0}; paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
