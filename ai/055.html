<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a12; color: #e8e8f0; overflow: hidden; }

       text-shadow: 0 0 18px rgba(0,240,255,0.4); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys, grab the glowing pickups, and route around your growing tail. Walls wrap around — you only lose by biting yourself. Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;speedwrap&quot; id=&quot;speedwrap&quot;&gt;&lt;div class=&quot;speedbar&quot; id=&quot;speedbar&quot;&gt;&lt;/div&gt;&lt;span class=&quot;speedlabel&quot;&gt;SPEED&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fieldwrap&quot; id=&quot;fieldwrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;div class=&quot;fs&quot; id=&quot;finalScore&quot;&gt;Score: 0&lt;/div&gt;
      &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var CELL = 20, COLS = 30, ROWS = 22, W = COLS*CELL, H = ROWS*CELL;
var BASE_TICK = 150, MIN_TICK = 70;
var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;), bannerEl = document.getElementById(&#x27;banner&#x27;);
var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;), msgEl = document.getElementById(&#x27;msg&#x27;);
var speedbar = document.getElementById(&#x27;speedbar&#x27;), speedwrap = document.getElementById(&#x27;speedwrap&#x27;);
var fieldwrap = document.getElementById(&#x27;fieldwrap&#x27;);

var running = false, gameOver = false;
var snake, dir, pendingDir, score, pickups, particles;
var lastTick = 0, tickAcc = 0, boostUntil = 0, redFlashUntil = 0;
var t0 = 0;

function mod(a,n){ return ((a%n)+n)%n; }

function initSnake(){
  snake = [{x:5,y:11},{x:4,y:11},{x:3,y:11}];
  dir = {x:1,y:0}; pendingDir = {x:1,y:0};
}
function occupied(x,y){ for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  for(var j=0;j&lt;pickups.length;j++) if(pickups[j].x===x&amp;&amp;pickups[j].y===y) return true; return false; }
function freeCell(){ for(var k=0;k&lt;300;k++){ var x=Math.floor(Math.random()*COLS),y=Math.floor(Math.random()*ROWS); if(!occupied(x,y)) return {x:x,y:y}; } return {x:0,y:0}; }

function spawnPickup(type){
  var c = freeCell();
  var p = {x:c.x,y:c.y,type:type};
  if(type===&#x27;star&#x27;) p.expire = performance.now()+5000;
  pickups.push(p);
}
function ensurePickups(){
  var has={orb:false,bolt:false,star:false};
  for(var i=0;i&lt;pickups.length;i++) has[pickups[i].type]=true;
  if(!has.orb) spawnPickup(&#x27;orb&#x27;);
  if(!has.bolt) spawnPickup(&#x27;bolt&#x27;);
  if(!has.star) spawnPickup(&#x27;star&#x27;);
}

function burst(cx,cy,color){
  for(var i=0;i&lt;14;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color,r:2+Math.random()*2});
  }
}

function currentTick(){
  var speedLevel = Math.floor(score/5);
  var t = BASE_TICK - speedLevel*8;
  if(t &lt; MIN_TICK) t = MIN_TICK;
  if(performance.now() &lt; boostUntil) t = t*0.5;
  return t;
}

function bumpScore(){
  scoreEl.textContent = score;
  scoreEl.classList.remove(&#x27;bump&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;bump&#x27;);
}

function step(){
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0];
  var nx=mod(head.x+dir.x,COLS), ny=mod(head.y+dir.y,ROWS);
  // check pickup
  var eatIdx=-1;
  for(var i=0;i&lt;pickups.length;i++) if(pickups[i].x===nx&amp;&amp;pickups[i].y===ny){ eatIdx=i; break; }
  var ate = eatIdx&gt;=0;
  var body = ate ? snake : snake.slice(0,snake.length-1);
  for(var b=0;b&lt;body.length;b++) if(body[b].x===nx&amp;&amp;body[b].y===ny){ endGame(); return; }
  snake.unshift({x:nx,y:ny});
  if(ate){
    var p=pickups[eatIdx];
    var px=nx*CELL+CELL/2, py=ny*CELL+CELL/2;
    if(p.type===&#x27;orb&#x27;){ score+=1; burst(px,py,[77,255,140]); }
    else if(p.type===&#x27;star&#x27;){ score+=3; burst(px,py,[255,211,77]); }
    else if(p.type===&#x27;bolt&#x27;){ boostUntil=performance.now()+4000; burst(px,py,[255,80,80]); snake.pop(); }
    pickups.splice(eatIdx,1);
    ensurePickups();
    bumpScore();
  } else {
    snake.pop();
  }
}

function endGame(){
  running=false; gameOver=true;
  redFlashUntil=performance.now()+600;
  fieldwrap.classList.remove(&#x27;shake&#x27;); void fieldwrap.offsetWidth; fieldwrap.classList.add(&#x27;shake&#x27;);
  finalScoreEl.textContent=&#x27;Score: &#x27;+score;
  var msgs=[&#x27;Slick moves!&#x27;,&#x27;So close — go again!&#x27;,&#x27;Nice run, serpent!&#x27;,&#x27;You had the flow!&#x27;,&#x27;Coil tighter next time!&#x27;];
  msgEl.textContent=msgs[Math.floor(Math.random()*msgs.length)];
  bannerEl.classList.add(&#x27;show&#x27;);
}

// ---- rendering ----
function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=&#x27;#0d0d16&#x27;; ctx.fillRect(0,0,W,H);
  // pulsing grid
  var pulse = 0.5+0.5*Math.sin(now/900);
  ctx.strokeStyle=&#x27;rgba(90,120,200,&#x27;+(0.06+0.05*pulse)+&#x27;)&#x27;; ctx.lineWidth=1;
  ctx.beginPath();
  for(var gx=0;gx&lt;=COLS;gx++){ ctx.moveTo(gx*CELL+0.5,0); ctx.lineTo(gx*CELL+0.5,H); }
  for(var gy=0;gy&lt;=ROWS;gy++){ ctx.moveTo(0,gy*CELL+0.5); ctx.lineTo(W,gy*CELL+0.5); }
  ctx.stroke();

  // pickups
  for(var i=0;i&lt;pickups.length;i++){
    var p=pickups[i], cx=p.x*CELL+CELL/2, cy=p.y*CELL+CELL/2;
    if(p.type===&#x27;orb&#x27;) drawOrb(cx,cy,now);
    else if(p.type===&#x27;star&#x27;) drawStar(cx,cy,now,p);
    else if(p.type===&#x27;bolt&#x27;) drawBolt(cx,cy,now);
  }

  // snake
  var redFlash = now&lt;redFlashUntil;
  for(var s=snake.length-1;s&gt;=0;s--){
    var seg=snake[s], f=s/Math.max(1,snake.length-1);
    var col;
    if(redFlash) col=&#x27;rgba(255,60,60,0.95)&#x27;;
    else {
      // cyan -&gt; teal -&gt; purple
      var r,g,b;
      if(f&lt;0.5){ var u=f/0.5; r=0+u*(60-0); g=240+u*(255-240); b=255+u*(184-255); }
      else { var v=(f-0.5)/0.5; r=60+v*(140-60); g=255+v*(60-255); b=184+v*(220-184); }
      col=&#x27;rgb(&#x27;+Math.round(r)+&#x27;,&#x27;+Math.round(g)+&#x27;,&#x27;+Math.round(b)+&#x27;)&#x27;;
    }
    var px=seg.x*CELL, py=seg.y*CELL;
    ctx.fillStyle=col;
    if(s===0){ ctx.shadowColor=&#x27;rgba(0,240,255,0.9)&#x27;; ctx.shadowBlur=16; }
    else { ctx.shadowColor=col; ctx.shadowBlur=6; }
    roundRect(px+1.5,py+1.5,CELL-3,CELL-3,4); ctx.fill();
    ctx.shadowBlur=0;
    if(s===0){
      ctx.fillStyle=&#x27;#fff&#x27;;
      var ex=px+CELL/2+dir.x*3, ey=py+CELL/2+dir.y*3;
      ctx.beginPath(); ctx.arc(ex-dir.y*3,ey-dir.x*3,1.8,0,7); ctx.arc(ex+dir.y*3,ey+dir.x*3,1.8,0,7); ctx.fill();
    }
  }

  // particles
  for(var q=particles.length-1;q&gt;=0;q--){
    var pt=particles[q];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=&#x27;rgb(&#x27;+pt.color[0]+&#x27;,&#x27;+pt.color[1]+&#x27;,&#x27;+pt.color[2]+&#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pt.life,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawOrb(cx,cy,now){
  var pl=0.6+0.4*Math.sin(now/300);
  ctx.shadowColor=&#x27;rgba(77,255,140,0.9)&#x27;; ctx.shadowBlur=14*pl;
  ctx.fillStyle=&#x27;#4dff8c&#x27;; ctx.beginPath(); ctx.arc(cx,cy,6,0,7); ctx.fill();
  ctx.shadowBlur=0;
}
function drawStar(cx,cy,now,p){
  var left=(p.expire-now)/5000;
  var flash = left&lt;0.35 ? (0.4+0.6*Math.abs(Math.sin(now/120))) : 1;
  var rot=now/500;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.shadowColor=&#x27;rgba(255,211,77,0.95)&#x27;; ctx.shadowBlur=16;
  ctx.globalAlpha=flash;
  ctx.fillStyle=&#x27;#ffd34d&#x27;;
  ctx.beginPath();
  for(var i=0;i&lt;10;i++){ var ang=Math.PI/5*i-Math.PI/2; var rad=(i%2===0)?8:3.5;
    ctx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad); }
  ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
}
function drawBolt(cx,cy,now){
  var pl=0.5+0.5*Math.abs(Math.sin(now/180));
  ctx.save(); ctx.translate(cx,cy);
  ctx.shadowColor=&#x27;rgba(255,70,70,0.95)&#x27;; ctx.shadowBlur=10+8*pl;
  ctx.fillStyle=&#x27;#ff4d4d&#x27;;
  ctx.beginPath();
  ctx.moveTo(2,-8); ctx.lineTo(-4,1); ctx.lineTo(0,1); ctx.lineTo(-2,8); ctx.lineTo(4,-1); ctx.lineTo(0,-1);
  ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}

// ---- loop ----
function loop(now){
  if(!t0) t0=now;
  if(running){
    // star expiry
    for(var i=pickups.length-1;i&gt;=0;i--){ if(pickups[i].type===&#x27;star&#x27;&amp;&amp;pickups[i].expire&lt;=now){ pickups.splice(i,1); ensurePickups(); } }
    tickAcc += now-lastTick;
    var tk=currentTick();
    while(tickAcc&gt;=tk){ tickAcc-=tk; if(running) step(); tk=currentTick(); }
  }
  lastTick=now;
  // particles update always (ambient)
  for(var q=particles?particles.length-1:-1;q&gt;=0;q--){ var pt=particles[q]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.92; pt.vy*=0.92; pt.life-=0.035; if(pt.life&lt;=0) particles.splice(q,1); }
  // speed bar
  var boosting = now&lt;boostUntil;
  if(boosting){ speedwrap.classList.add(&#x27;active&#x27;); speedbar.style.width=((boostUntil-now)/4000*100)+&#x27;%&#x27;; }
  else { speedwrap.classList.remove(&#x27;active&#x27;); speedbar.style.width=&#x27;0%&#x27;; }
  if(snake) draw(now);
  requestAnimationFrame(loop);
}

function resetState(){
  score=0; scoreEl.textContent=&#x27;0&#x27;; gameOver=false;
  pickups=[]; particles=[]; boostUntil=0; redFlashUntil=0; tickAcc=0;
  initSnake(); ensurePickups();
  bannerEl.classList.remove(&#x27;show&#x27;);
}

function startGame(){ resetState(); running=true; lastTick=performance.now(); }
function stopGame(){ running=false; }

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
});
window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial paint (stopped state)
resetState();
requestAnimationFrame(loop);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
