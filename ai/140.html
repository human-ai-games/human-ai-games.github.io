<style>

<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(180deg,#0a4d6e 0%,#0d7a9e 45%,#12a8c4 100%); color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .5px; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .instructions { font-size: 16px; color: #eaffff; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .scorebox { font-size: 30px; font-weight: 800; color: #fff7d6; text-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .scorebox.bump { animation: bump .25s ease; }
  @keyframes bump { 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .combo { font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,.12); color:#cffdff; transition: all .2s; }
  .combo.hot { background: linear-gradient(90deg,#ffcf3f,#ff8a3d); color:#5a2c00; box-shadow: 0 0 16px #ffcf3f, 0 0 30px #ff8a3d; transform: scale(1.08); }
  .board { position: relative; display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 12px; width: 420px; height: 420px; padding: 12px; box-sizing: border-box; background: linear-gradient(180deg,#c9a76a,#b8925a); border-radius: 18px; box-shadow: inset 0 0 30px rgba(0,0,0,.25), 0 8px 20px rgba(0,0,0,.3); }
  .hole { position: relative; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #5c3d1f 0%, #3a2412 70%, #24160b 100%); box-shadow: inset 0 6px 14px rgba(0,0,0,.55); overflow: visible; display: flex; align-items: center; justify-content: center; }
  .hole.dark { filter: brightness(.35) saturate(.4); }
  .hole.miss { animation: missflash .4s ease; }
  @keyframes missflash { 0%,100%{box-shadow: inset 0 6px 14px rgba(0,0,0,.55);} 40%{box-shadow: inset 0 0 0 6px #ff4d4d, 0 0 20px #ff4d4d;} }
  .critter { position: absolute; width: 78%; height: 78%; cursor: pointer; transform: translateY(120%) scale(.4); transition: transform .28s cubic-bezier(.2,1.4,.5,1); display:flex; align-items:center; justify-content:center; user-select:none; }
  .critter.up { transform: translateY(0) scale(1); }
  .critter.down { transform: translateY(120%) scale(.4); }
  .critter .face { font-size: 46px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform: translateY(0);} 50%{transform: translateY(-4px);} }
  .critter .pts { position: absolute; bottom: -2px; right: 4px; font-size: 14px; font-weight: 800; background:#fff; color:#0a4d6e; border-radius:10px; padding:0 6px; box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .ring { position: absolute; top:-6px; left:-6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events:none; }
  .ring circle { fill:none; stroke-width: 5; }
  .ring .bg { stroke: rgba(255,255,255,.25); }
  .ring .fg { stroke:#ffe45e; stroke-linecap:round; }
  .splat { position:absolute; font-size: 44px; pointer-events:none; animation: splat .4s ease forwards; }
  @keyframes splat { 0%{transform:scale(.5); opacity:1;} 100%{transform:scale(1.7); opacity:0;} }
  .popup { position:absolute; font-weight:800; font-size:22px; pointer-events:none; text-shadow:0 2px 3px rgba(0,0,0,.4); animation: floatup .8s ease forwards; }
  @keyframes floatup { 0%{transform:translateY(0); opacity:1;} 100%{transform:translateY(-60px); opacity:0;} }
  .bubble { position:absolute; border-radius:50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(255,255,255,.2)); pointer-events:none; animation: rise linear forwards; }
  @keyframes rise { 0%{opacity:.8; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-70px) scale(.4);} }
  .endscreen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; background: rgba(6,40,60,.82); backdrop-filter: blur(2px); z-index:20; }
  .endscreen.show { display:flex; animation: rise-end .5s ease; }
  @keyframes rise-end { from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .badge { font-size: 30px; font-weight:900; padding:10px 22px; border-radius:16px; background:linear-gradient(90deg,#ffd54a,#ff9d3d); color:#5a2c00; box-shadow:0 0 24px #ffcf3f; }
  .endscreen .final { font-size: 22px; font-weight:800; }
  .endscreen .sub { font-size:16px; color:#cffdff; }
  .idle { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; color:#eaffff; z-index:5; pointer-events:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐙 Reef Whack 🦀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack crabs 🦀 (1pt), puffers 🐡 (2pts) and golden octopuses 🐙 (3pts) before they sink — misses cost a point! Chain 3 hits to light up a glowing combo that doubles your score.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;scorebox&quot; id=&quot;scorebox&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;Combo x1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;idle&quot; id=&quot;idle&quot;&gt;Press Start below to dive in!&lt;/div&gt;
    &lt;div class=&quot;endscreen&quot; id=&quot;endscreen&quot;&gt;
      &lt;div class=&quot;badge&quot; id=&quot;badge&quot;&gt;DIVER&lt;/div&gt;
      &lt;div class=&quot;final&quot; id=&quot;final&quot;&gt;Score: 0&lt;/div&gt;
      &lt;div class=&quot;sub&quot; id=&quot;best&quot;&gt;Best combo: x1&lt;/div&gt;
      &lt;div class=&quot;sub&quot;&gt;Press Restart to dive again!&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var scorebox = document.getElementById(&#x27;scorebox&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var endscreen = document.getElementById(&#x27;endscreen&#x27;);
  var idle = document.getElementById(&#x27;idle&#x27;);
  var badge = document.getElementById(&#x27;badge&#x27;);
  var finalEl = document.getElementById(&#x27;final&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);

  var holes = [];
  for (var i=0;i&lt;9;i++){
    var h = document.createElement(&#x27;div&#x27;);
    h.className = &#x27;hole&#x27;;
    board.insertBefore(h, idle);
    holes.push({el:h, busy:false});
  }

  var TYPES = [
    {emoji:&#x27;🦀&#x27;, pts:1, color:&#x27;#ff8a5c&#x27;, weight:5},
    {emoji:&#x27;🐡&#x27;, pts:2, color:&#x27;#ffe45e&#x27;, weight:3},
    {emoji:&#x27;🐙&#x27;, pts:3, color:&#x27;#ffb3ec&#x27;, weight:1.4}
  ];

  var running=false, score=0, combo=0, bestCombo=0;
  var spawnTimer=null, ambienceTimer=null;
  var actx=null;

  function initAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function beep(freq,dur,type,vol){
    if(!actx) return;
    try{
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
      g.gain.value=vol||0.08;
      o.connect(g); g.connect(actx.destination);
      var t=actx.currentTime;
      g.gain.setValueAtTime(vol||0.08,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }

  function difficulty(){
    // returns spawn interval &amp; creature life shrinking with score
    var s = score&gt;0?score:0;
    var spawn = Math.max(430, 950 - s*8);
    var life = Math.max(650, 1400 - s*9);
    return {spawn:spawn, life:life};
  }

  function pickType(){
    var total=0; for(var i=0;i&lt;TYPES.length;i++) total+=TYPES[i].weight;
    var r=Math.random()*total;
    for(var j=0;j&lt;TYPES.length;j++){ r-=TYPES[j].weight; if(r&lt;=0) return TYPES[j]; }
    return TYPES[0];
  }

  function setCombo(){
    var mult = combo&gt;=3?2:1;
    comboEl.textContent = &#x27;Combo x&#x27;+mult+(combo&gt;0?&#x27; (&#x27;+combo+&#x27;)&#x27;:&#x27;&#x27;);
    comboEl.classList.toggle(&#x27;hot&#x27;, combo&gt;=3);
  }

  function bumpScore(){
    scorebox.classList.remove(&#x27;bump&#x27;); void scorebox.offsetWidth; scorebox.classList.add(&#x27;bump&#x27;);
  }

  function spawnBubbles(hole,n){
    for(var i=0;i&lt;n;i++){
      var b=document.createElement(&#x27;div&#x27;);
      var sz=6+Math.random()*12;
      b.className=&#x27;bubble&#x27;;
      b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
      b.style.left=(20+Math.random()*60)+&#x27;%&#x27;;
      b.style.top=(30+Math.random()*40)+&#x27;%&#x27;;
      b.style.animationDuration=(0.5+Math.random()*0.6)+&#x27;s&#x27;;
      hole.appendChild(b);
      (function(el){ setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },1100); })(b);
    }
  }

  function makeSplat(hole){
    var s=document.createElement(&#x27;div&#x27;);
    s.className=&#x27;splat&#x27;; s.textContent=&#x27;💥&#x27;;
    s.style.left=&#x27;28%&#x27;; s.style.top=&#x27;24%&#x27;;
    hole.appendChild(s);
    setTimeout(function(){ if(s.parentNode)s.parentNode.removeChild(s); },400);
  }

  function makePopup(hole,txt,color){
    var p=document.createElement(&#x27;div&#x27;);
    p.className=&#x27;popup&#x27;; p.textContent=txt; p.style.color=color||&#x27;#fff&#x27;;
    p.style.left=&#x27;30%&#x27;; p.style.top=&#x27;20%&#x27;;
    hole.appendChild(p);
    setTimeout(function(){ if(p.parentNode)p.parentNode.removeChild(p); },800);
  }

  function spawn(){
    if(!running) return;
    // pick a free hole
    var free=[]; for(var i=0;i&lt;holes.length;i++) if(!holes[i].busy) free.push(i);
    if(free.length===0){ scheduleNext(); return; }
    var idx=free[Math.floor(Math.random()*free.length)];
    var hole=holes[idx];
    hole.busy=true;
    var type=pickType();
    var d=difficulty();

    var c=document.createElement(&#x27;div&#x27;);
    c.className=&#x27;critter&#x27;;
    c.innerHTML=&#x27;&lt;div class=&quot;face&quot;&gt;&#x27;+type.emoji+&#x27;&lt;/div&gt;&lt;div class=&quot;pts&quot;&gt;&#x27;+type.pts+&#x27;&lt;/div&gt;&#x27;;
    // timer ring
    var R=40, C=2*Math.PI*R;
    var ring=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;svg&#x27;);
    ring.setAttribute(&#x27;class&#x27;,&#x27;ring&#x27;); ring.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 100 100&#x27;);
    ring.innerHTML=&#x27;&lt;circle class=&quot;bg&quot; cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;&#x27;+R+&#x27;&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;fg&quot; cx=&quot;50&quot; cy=&quot;50&quot; r=&quot;&#x27;+R+&#x27;&quot; stroke-dasharray=&quot;&#x27;+C+&#x27;&quot; stroke-dashoffset=&quot;0&quot;&gt;&lt;/circle&gt;&#x27;;
    c.appendChild(ring);
    var fg=ring.querySelector(&#x27;.fg&#x27;);
    fg.style.stroke = type.color;

    hole.el.appendChild(c);
    void c.offsetWidth;
    c.classList.add(&#x27;up&#x27;);
    beep(500+type.pts*120,0.12,&#x27;sine&#x27;,0.06);
    spawnBubbles(hole.el,4);

    var alive=true;
    var start=performance.now();
    var lifeMs=d.life;
    var raf;
    function tick(now){
      if(!alive||!running) return;
      var frac=Math.min(1,(now-start)/lifeMs);
      fg.style.strokeDashoffset=(C*frac);
      if(frac&gt;=1){ miss(); return; }
      raf=requestAnimationFrame(tick);
    }
    raf=requestAnimationFrame(tick);

    function cleanup(){ if(raf) cancelAnimationFrame(raf); }

    function hit(e){
      if(e){ e.stopPropagation(); }
      if(!alive) return; alive=false; cleanup();
      var mult=combo&gt;=3?2:1;
      combo++;
      if(combo&gt;bestCombo) bestCombo=combo;
      var gained=type.pts*mult;
      score+=gained;
      scoreEl.textContent=score;
      bumpScore(); setCombo();
      makeSplat(hole.el); spawnBubbles(hole.el,8);
      makePopup(hole.el,&#x27;+&#x27;+gained,&#x27;#fff26b&#x27;);
      beep(700+type.pts*160,0.18,&#x27;triangle&#x27;,0.09);
      if(combo===3) beep(900,0.25,&#x27;square&#x27;,0.07);
      c.classList.remove(&#x27;up&#x27;); c.classList.add(&#x27;down&#x27;);
      setTimeout(function(){ if(c.parentNode)c.parentNode.removeChild(c); hole.busy=false; },260);
    }

    function miss(){
      if(!alive) return; alive=false; cleanup();
      // penalty &amp; combo reset
      combo=0; setCombo();
      score=Math.max(0,score-1); scoreEl.textContent=score; bumpScore();
      makePopup(hole.el,&#x27;-1&#x27;,&#x27;#ff6b6b&#x27;);
      hole.el.classList.remove(&#x27;miss&#x27;); void hole.el.offsetWidth; hole.el.classList.add(&#x27;miss&#x27;);
      beep(180,0.2,&#x27;sawtooth&#x27;,0.06);
      c.classList.remove(&#x27;up&#x27;); c.classList.add(&#x27;down&#x27;);
      setTimeout(function(){ if(c.parentNode)c.parentNode.removeChild(c); hole.busy=false; hole.el.classList.remove(&#x27;miss&#x27;); },300);
    }

    c.addEventListener(&#x27;mousedown&#x27;, hit);

    scheduleNext();
  }

  function scheduleNext(){
    if(!running) return;
    if(spawnTimer) clearTimeout(spawnTimer);
    var d=difficulty();
    spawnTimer=setTimeout(spawn, d.spawn*(0.7+Math.random()*0.6));
  }

  function ambience(){
    if(!running) return;
    beep(220,0.15,&#x27;sine&#x27;,0.03);
    var d=difficulty();
    // faster ambience as difficulty rises
    ambienceTimer=setTimeout(ambience, Math.max(500,1600 - score*10));
  }

  function clearBoard(){
    for(var i=0;i&lt;holes.length;i++){
      holes[i].el.innerHTML=&#x27;&#x27;;
      holes[i].el.classList.remove(&#x27;dark&#x27;,&#x27;miss&#x27;);
      holes[i].busy=false;
    }
  }

  function startGame(){
    initAudio();
    if(actx &amp;&amp; actx.state===&#x27;suspended&#x27;){ try{actx.resume();}catch(e){} }
    running=true; score=0; combo=0; bestCombo=0;
    scoreEl.textContent=&#x27;0&#x27;; setCombo();
    endscreen.classList.remove(&#x27;show&#x27;);
    idle.style.display=&#x27;none&#x27;;
    clearBoard();
    spawn();
    ambience();
  }

  function stopGame(){
    if(!running) return;
    running=false;
    if(spawnTimer){ clearTimeout(spawnTimer); spawnTimer=null; }
    if(ambienceTimer){ clearTimeout(ambienceTimer); ambienceTimer=null; }
    // freeze &amp; darken holes
    for(var i=0;i&lt;holes.length;i++){ holes[i].el.classList.add(&#x27;dark&#x27;); }
    // end screen
    var tier, sub;
    if(score&gt;=60){ tier=&#x27;🌟 LEGENDARY DIVER&#x27;; }
    else if(score&gt;=35){ tier=&#x27;🐬 REEF MASTER&#x27;; }
    else if(score&gt;=18){ tier=&#x27;🐠 SKILLED DIVER&#x27;; }
    else if(score&gt;=6){ tier=&#x27;🐚 NOVICE DIVER&#x27;; }
    else { tier=&#x27;🫧 LITTLE SNORKELER&#x27;; }
    badge.textContent=tier;
    finalEl.textContent=&#x27;Final Score: &#x27;+score;
    bestEl.textContent=&#x27;Best combo streak: &#x27;+bestCombo;
    endscreen.classList.add(&#x27;show&#x27;);
    beep(500,0.15,&#x27;sine&#x27;,0.06); setTimeout(function(){beep(660,0.2,&#x27;sine&#x27;,0.06);},160);
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // telemetry
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');

    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
