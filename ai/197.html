<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #060618; color: #e8e8ff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALACTIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to slide the energy paddle and bounce the plasma ball into the alien bricks. Catch falling gems for power-ups, and use the Start/Restart button below to play.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv=document.getElementById(&#x27;cv&#x27;),ctx=cv.getContext(&#x27;2d&#x27;);
var W=cv.width,H=cv.height;
var scoreEl=document.getElementById(&#x27;score&#x27;);
var running=false,animId=null;

// paddle
var basePW=100,PW=100,PH=14,paddleX=(W-PW)/2,paddleY=H-30;
var mouseX=W/2;
// balls
var balls=[];
var baseSpeed=4.2,speed=baseSpeed;
// bricks
var bricks=[];
var BC=10,ROWS=5,GAP=5,BW,BH=20,TOP=40;
var tierColors=[&#x27;#f6f&#x27;,&#x27;#f6a&#x27;,&#x27;#fa5&#x27;,&#x27;#5fa&#x27;,&#x27;#4df&#x27;]; // top-&gt;bottom
var tierPoints=[3,3,2,2,1];
var particles=[],gems=[],stars=[];
var score=0,destroyed=0;
var wideTimer=0,fireTimer=0;
var missFlash=0,missText=0;

function initStars(){
  stars=[];
  for(var i=0;i&lt;70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.3,v:Math.random()*.4+.1});
}
function buildBricks(){
  bricks=[];
  BW=(W-GAP*(BC+1))/BC;
  for(var r=0;r&lt;ROWS;r++){
    for(var c=0;c&lt;BC;c++){
      bricks.push({x:GAP+c*(BW+GAP),y:TOP+r*(BH+GAP),w:BW,h:BH,alive:true,
        color:tierColors[r],pts:tierPoints[r],flash:Math.random()&lt;0.18});
    }
  }
}
function newBall(x,y,vx,vy){
  balls.push({x:x,y:y,vx:vx,vy:vy,r:8});
}
function resetBall(){
  balls=[];
  var ang=(-0.35-Math.random()*0.3)*Math.PI - Math.PI*0.15;
  newBall(W/2,paddleY-40,speed*(Math.random()&lt;.5?-.5:.5),-speed);
}
function spawnParticles(x,y,color){
  for(var i=0;i&lt;10;i++){
    var a=Math.random()*Math.PI*2,sp=Math.random()*3+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}
var gemTypes=[&#x27;wide&#x27;,&#x27;split&#x27;,&#x27;fire&#x27;];
var gemColors={wide:&#x27;#4df&#x27;,split:&#x27;#f6f&#x27;,fire:&#x27;#fa5&#x27;};
function spawnGem(x,y){
  gems.push({x:x,y:y,t:gemTypes[Math.floor(Math.random()*3)],vy:2});
}

function startGame(){
  if(running) return;
  score=0;destroyed=0;speed=baseSpeed;PW=basePW;
  wideTimer=0;fireTimer=0;missFlash=0;missText=0;
  scoreEl.textContent=&#x27;0&#x27;;
  particles=[];gems=[];
  initStars();buildBricks();
  paddleX=(W-PW)/2;
  resetBall();
  running=true;
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  if(!running) return;
  running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

function bumpScore(){
  scoreEl.parentElement.style.transform=&#x27;scale(1.15)&#x27;;
  setTimeout(function(){scoreEl.parentElement.style.transform=&#x27;scale(1)&#x27;;},100);
}

function tick(){
  if(!running) return;
  update();
  draw();
  animId=requestAnimationFrame(tick);
}

function update(){
  PW=wideTimer&gt;0?basePW*1.7:basePW;
  paddleX=mouseX-PW/2;
  if(paddleX&lt;0)paddleX=0;
  if(paddleX&gt;W-PW)paddleX=W-PW;
  if(wideTimer&gt;0)wideTimer--;
  if(fireTimer&gt;0)fireTimer--;
  if(missFlash&gt;0)missFlash--;
  if(missText&gt;0)missText--;

  // stars
  for(var i=0;i&lt;stars.length;i++){var s=stars[i];s.y+=s.v;if(s.y&gt;H){s.y=0;s.x=Math.random()*W;}}

  // balls
  for(var b=balls.length-1;b&gt;=0;b--){
    var ba=balls[b];
    ba.x+=ba.vx;ba.y+=ba.vy;
    if(ba.x-ba.r&lt;0){ba.x=ba.r;ba.vx=Math.abs(ba.vx);}
    if(ba.x+ba.r&gt;W){ba.x=W-ba.r;ba.vx=-Math.abs(ba.vx);}
    if(ba.y-ba.r&lt;0){ba.y=ba.r;ba.vy=Math.abs(ba.vy);}
    // paddle
    if(ba.vy&gt;0 &amp;&amp; ba.y+ba.r&gt;=paddleY &amp;&amp; ba.y-ba.r&lt;=paddleY+PH &amp;&amp;
       ba.x&gt;=paddleX &amp;&amp; ba.x&lt;=paddleX+PW){
      ba.y=paddleY-ba.r;
      var hit=(ba.x-(paddleX+PW/2))/(PW/2);
      var ang=hit*1.05;
      ba.vx=speed*Math.sin(ang);
      ba.vy=-Math.abs(speed*Math.cos(ang));
    }
    // bricks
    for(var i=0;i&lt;bricks.length;i++){
      var br=bricks[i];
      if(!br.alive)continue;
      if(ba.x+ba.r&gt;br.x &amp;&amp; ba.x-ba.r&lt;br.x+br.w &amp;&amp; ba.y+ba.r&gt;br.y &amp;&amp; ba.y-ba.r&lt;br.y+br.h){
        br.alive=false;
        score+=br.pts;scoreEl.textContent=score;bumpScore();
        destroyed++;
        spawnParticles(br.x+br.w/2,br.y+br.h/2,br.color);
        if(br.flash) spawnGem(br.x+br.w/2,br.y+br.h/2);
        if(destroyed%5===0){speed+=0.35;}
        if(fireTimer&lt;=0){
          // bounce
          var ox=Math.min(ba.x+ba.r-br.x,br.x+br.w-(ba.x-ba.r));
          var oy=Math.min(ba.y+ba.r-br.y,br.y+br.h-(ba.y-ba.r));
          if(ox&lt;oy)ba.vx=-ba.vx; else ba.vy=-ba.vy;
        }
        break;
      }
    }
    // normalize speed
    var sp=Math.hypot(ba.vx,ba.vy);
    if(sp&gt;0){ba.vx=ba.vx/sp*speed;ba.vy=ba.vy/sp*speed;}
    // lost
    if(ba.y-ba.r&gt;H){
      balls.splice(b,1);
    }
  }
  if(balls.length===0){
    missFlash=12;missText=45;
    resetBall();
  }
  // all bricks cleared -&gt; rebuild
  if(bricks.every(function(x){return !x.alive;})) buildBricks();

  // gems
  for(var g=gems.length-1;g&gt;=0;g--){
    var gm=gems[g];gm.y+=gm.vy;
    if(gm.y&gt;=paddleY-6 &amp;&amp; gm.y&lt;=paddleY+PH+6 &amp;&amp; gm.x&gt;=paddleX &amp;&amp; gm.x&lt;=paddleX+PW){
      applyGem(gm.t);gems.splice(g,1);continue;
    }
    if(gm.y&gt;H)gems.splice(g,1);
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.08;pt.life-=0.03;
    if(pt.life&lt;=0)particles.splice(p,1);
  }
}

function applyGem(t){
  if(t===&#x27;wide&#x27;)wideTimer=600;
  else if(t===&#x27;fire&#x27;)fireTimer=420;
  else if(t===&#x27;split&#x27;){
    var copies=[];
    balls.forEach(function(ba){copies.push({x:ba.x,y:ba.y,vx:-ba.vx,vy:ba.vy,r:8});});
    balls=balls.concat(copies).slice(0,6);
  }
  spawnParticles(paddleX+PW/2,paddleY,gemColors[t]);
}

function draw(){
  ctx.fillStyle=&#x27;#070720&#x27;;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle=&#x27;#fff&#x27;;
  for(var i=0;i&lt;stars.length;i++){var s=stars[i];ctx.globalAlpha=s.s/1.8;ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;

  // bricks
  for(var i=0;i&lt;bricks.length;i++){
    var br=bricks[i];if(!br.alive)continue;
    ctx.fillStyle=br.color;
    ctx.shadowColor=br.color;ctx.shadowBlur=br.flash?14:6;
    roundRect(br.x,br.y,br.w,br.h,4);ctx.fill();
    if(br.flash){ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(0.3+0.3*Math.sin(Date.now()/150))+&#x27;)&#x27;;roundRect(br.x,br.y,br.w,br.h,4);ctx.fill();}
    ctx.shadowBlur=0;
  }

  // gems
  for(var g=0;g&lt;gems.length;g++){
    var gm=gems[g];
    ctx.save();ctx.translate(gm.x,gm.y);ctx.rotate(Date.now()/300);
    ctx.fillStyle=gemColors[gm.t];ctx.shadowColor=gemColors[gm.t];ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,0);ctx.lineTo(0,8);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();
    ctx.restore();ctx.shadowBlur=0;
  }

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;ctx.fillRect(pt.x-2,pt.y-2,4,4);
  }
  ctx.globalAlpha=1;

  // paddle
  var grad=ctx.createLinearGradient(paddleX,0,paddleX+PW,0);
  grad.addColorStop(0,&#x27;#4df&#x27;);grad.addColorStop(1,&#x27;#a4f&#x27;);
  ctx.fillStyle=grad;ctx.shadowColor=&#x27;#6cf&#x27;;ctx.shadowBlur=18;
  roundRect(paddleX,paddleY,PW,PH,7);ctx.fill();ctx.shadowBlur=0;

  // balls
  for(var b=0;b&lt;balls.length;b++){
    var ba=balls[b];
    var bc=fireTimer&gt;0?&#x27;#fa5&#x27;:&#x27;#fff&#x27;;
    ctx.fillStyle=bc;ctx.shadowColor=fireTimer&gt;0?&#x27;#f60&#x27;:&#x27;#8cf&#x27;;ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(ba.x,ba.y,ba.r,0,7);ctx.fill();ctx.shadowBlur=0;
  }

  // power-up indicators
  ctx.font=&#x27;12px system-ui&#x27;;ctx.textAlign=&#x27;left&#x27;;
  var yy=H-8;
  if(wideTimer&gt;0){ctx.fillStyle=&#x27;#4df&#x27;;ctx.fillText(&#x27;WIDE&#x27;,8,yy);}
  if(fireTimer&gt;0){ctx.fillStyle=&#x27;#fa5&#x27;;ctx.fillText(&#x27;FIRE&#x27;,60,yy);}

  // miss
  if(missFlash&gt;0){ctx.fillStyle=&#x27;rgba(255,80,120,&#x27;+(missFlash/24)+&#x27;)&#x27;;ctx.fillRect(0,0,W,H);}
  if(missText&gt;0){
    ctx.fillStyle=&#x27;rgba(255,90,120,&#x27;+Math.min(1,missText/30)+&#x27;)&#x27;;
    ctx.font=&#x27;800 46px system-ui&#x27;;ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;MISS!&#x27;,W/2,H/2);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
});
cv.addEventListener(&#x27;touchmove&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);
  e.preventDefault();
},{passive:false});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;)startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
});

// static initial render
initStars();buildBricks();draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
