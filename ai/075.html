<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎣 Deep-Sea Fishing Pier</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🎣 Deep-Sea Fishing Pier</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #04141f; color: #eaf6ff; overflow: hidden; }
  .game { width: 720px; height: 640px; margin: 0 auto; box-sizing: border-box; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 2px 6px #001; }
  .instructions { font-size: 16px; color: #bfe6ff; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 18px; font-weight: 600; }
  .hud .val { color: #ffe27a; }
  #timebar { width: 620px; height: 8px; background: #0a2a3a; border-radius: 5px; overflow: hidden; }
  #timefill { height: 100%; width: 100%; background: linear-gradient(90deg,#38e1c4,#2aa0ff); transition: width .2s linear; }
  #score.pop { animation: scorepop .3s ease; }
  @keyframes scorepop { 0%{transform:scale(1);} 40%{transform:scale(1.5); color:#fff;} 100%{transform:scale(1);} }

  .board { position: relative; width: 620px; height: 440px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg,#0b3b52 0%, #0a2b45 45%, #072033 100%); box-shadow: inset 0 0 40px #001a2b; }
  .board.storm { background: linear-gradient(180deg,#1a1030 0%, #10142e 45%, #05070f 100%); }

  .wave { position: absolute; left: -20%; width: 140%; height: 90px; opacity: .35;
    background: radial-gradient(circle at 50% 100%, transparent 0, transparent 18px, #2aa0ff 19px, transparent 22px) repeat-x;
    background-size: 60px 40px; }
  .wave.w1 { top: 30%; animation: wavemove 6s linear infinite; }
  .wave.w2 { top: 55%; animation: wavemove 9s linear infinite reverse; opacity:.22; }
  .wave.w3 { top: 78%; animation: wavemove 12s linear infinite; opacity:.15; }
  @keyframes wavemove { from{transform:translateX(0);} to{transform:translateX(60px);} }

  .bubble { position: absolute; bottom: -20px; border-radius: 50%; background: rgba(180,240,255,.35);
    box-shadow: inset 0 0 4px rgba(255,255,255,.6); pointer-events: none; }

  .hole { position: absolute; width: 78px; height: 34px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(3,20,30,.9) 0%, rgba(10,50,70,.7) 70%, transparent 100%);
    box-shadow: 0 0 0 3px rgba(80,200,230,.15); transform: translate(-50%,-50%); }

  .fish { position: absolute; width: 60px; height: 60px; transform: translate(-50%, 40px) scale(.3);
    cursor: pointer; text-align: center; line-height: 60px; font-size: 44px; opacity: 0; pointer-events: none;
    filter: drop-shadow(0 0 8px currentColor); user-select: none; }
  .fish.up { animation: fishup .3s cubic-bezier(.34,1.56,.64,1) forwards; pointer-events: auto; opacity: 1; }
  @keyframes fishup { from{transform:translate(-50%,40px) scale(.3);} 60%{transform:translate(-50%,-14px) scale(1.15);} to{transform:translate(-50%,-6px) scale(1);} }
  .fish.down { animation: fishdown .3s ease-in forwards; pointer-events: none; }
  @keyframes fishdown { from{transform:translate(-50%,-6px) scale(1); opacity:1;} to{transform:translate(-50%,40px) scale(.3); opacity:0;} }

  .splash { position: absolute; width: 60px; height: 20px; transform: translate(-50%,-50%);
    border-radius: 50%; border: 3px solid rgba(150,230,255,.8); pointer-events: none; animation: splashring .4s ease-out forwards; }
  @keyframes splashring { from{transform:translate(-50%,-50%) scale(.2); opacity:1;} to{transform:translate(-50%,-50%) scale(1.6); opacity:0;} }

  .star { position: absolute; font-size: 20px; pointer-events: none; transform: translate(-50%,-50%); }

  .banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 40px; font-weight: 800;
    color: #ffde59; text-shadow: 0 0 12px #ff9f1c, 0 2px 4px #000; pointer-events: none; opacity: 0; z-index: 20; }
  .banner.show { animation: bannerpop .8s ease forwards; }
  @keyframes bannerpop { 0%{transform:translate(-50%,-50%) scale(.4); opacity:0;} 30%{transform:translate(-50%,-50%) scale(1.2); opacity:1;} 70%{opacity:1;} 100%{transform:translate(-50%,-50%) scale(1); opacity:0;} }

  .lightning { position: absolute; inset: 0; background: #dfefff; opacity: 0; pointer-events: none; z-index: 15; }
  .lightning.flash { animation: flash .3s ease; }
  @keyframes flash { 0%{opacity:0;} 20%{opacity:.75;} 40%{opacity:.1;} 60%{opacity:.6;} 100%{opacity:0;} }

  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(2,15,25,.9); z-index: 30; border-radius: 12px; gap: 8px; }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 30px; color: #ffe27a; }
  .overlay .anchors { font-size: 40px; letter-spacing: 6px; }
  .overlay .fin { font-size: 20px; }
  .overlay .hint { font-size: 15px; color: #9fd2e8; }
  .combolabel { position:absolute; top:8px; right:12px; font-size:16px; font-weight:700; color:#7dfad0; z-index:16; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🎣 Deep-Sea Fishing Pier&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the glowing fish as they leap from the water holes — small yellow fish are worth the most, big orange ones the least. Land quick hits in a row for combo multipliers and survive the 60-second Storm finale!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;Score: &lt;span id=&quot;score&quot; class=&quot;val&quot;&gt;0&lt;/span&gt; &amp;nbsp;|&amp;nbsp; Best Combo: &lt;span id=&quot;bestcombo&quot; class=&quot;val&quot;&gt;0&lt;/span&gt; &amp;nbsp;|&amp;nbsp; Time: &lt;span id=&quot;time&quot; class=&quot;val&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
  &lt;div id=&quot;timebar&quot;&gt;&lt;div id=&quot;timefill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;wave w1&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wave w2&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wave w3&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;combolabel&quot; id=&quot;combolabel&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;lightning&quot; id=&quot;lightning&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2 id=&quot;ovtitle&quot;&gt;Cast Off!&lt;/h2&gt;
      &lt;div class=&quot;anchors&quot; id=&quot;anchors&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;fin&quot; id=&quot;finscore&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start / Restart below to play again.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BW = 620, BH = 440;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var bestComboEl = document.getElementById(&#x27;bestcombo&#x27;);
  var timefill = document.getElementById(&#x27;timefill&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var lightning = document.getElementById(&#x27;lightning&#x27;);
  var comboLabel = document.getElementById(&#x27;combolabel&#x27;);

  // 12 staggered holes (lily-pad grid). Positions relative to board.
  var holes = [];
  var rows = [ {y:120, xs:[110,250,390,530]}, {y:250, xs:[180,320,460,565]}, {y:360, xs:[110,250,390,530]} ];
  rows.forEach(function(r){ r.xs.forEach(function(x){ holes.push({x:x, y:r.y, busy:false}); }); });
  holes.forEach(function(h){
    var d = document.createElement(&#x27;div&#x27;);
    d.className=&#x27;hole&#x27;; d.style.left=h.x+&#x27;px&#x27;; d.style.top=h.y+&#x27;px&#x27;;
    board.insertBefore(d, board.querySelector(&#x27;.combolabel&#x27;));
  });

  var TYPES = {
    small:  { emoji:&#x27;🐠&#x27;, points:3, color:&#x27;#ffe14d&#x27;, life:850 },
    medium: { emoji:&#x27;🐟&#x27;, points:2, color:&#x27;#4db8ff&#x27;, life:1250 },
    large:  { emoji:&#x27;🐡&#x27;, points:1, color:&#x27;#ff9f43&#x27;, life:1800 }
  };

  var running=false, score=0, combo=0, bestCombo=0, timeLeft=60;
  var spawnTimer=null, tickTimer=null, bubbleTimer=null, stormTimer=null;
  var moleTimeouts=[], activeFish=[];
  var spawnMs=1000, storm=false;

  // ---- Audio ----
  var actx=null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){actx=null;} } return actx; }
  function splat(){ var c=ac(); if(!c) return;
    var o=c.createOscillator(), g=c.createGain();
    o.type=&#x27;square&#x27;; o.frequency.setValueAtTime(420,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(90,c.currentTime+0.12);
    g.gain.setValueAtTime(0.25,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.16);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.17);
  }
  function chime(f){ var c=ac(); if(!c) return;
    var o=c.createOscillator(), g=c.createGain();
    o.type=&#x27;triangle&#x27;; o.frequency.setValueAtTime(f,c.currentTime);
    g.gain.setValueAtTime(0.2,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.36);
  }
  function thunder(){ var c=ac(); if(!c) return;
    var o=c.createOscillator(), g=c.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(70,c.currentTime);
    o.frequency.exponentialRampToValueAtTime(30,c.currentTime+0.5);
    g.gain.setValueAtTime(0.3,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.6);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.6);
  }

  function bubble(){
    var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;bubble&#x27;;
    var sz=4+Math.random()*10;
    b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
    b.style.left=Math.random()*BW+&#x27;px&#x27;;
    var dur=3+Math.random()*3;
    b.style.transition=&#x27;transform &#x27;+dur+&#x27;s linear, opacity &#x27;+dur+&#x27;s linear&#x27;;
    board.insertBefore(b, board.querySelector(&#x27;.combolabel&#x27;));
    requestAnimationFrame(function(){
      b.style.transform=&#x27;translateY(-&#x27;+(BH+30)+&#x27;px)&#x27;; b.style.opacity=&#x27;0&#x27;;
    });
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, dur*1000+100);
  }

  function pickType(){
    // becomes weighted toward faster fish over time
    var r=Math.random();
    var frac = (60-timeLeft)/60;
    var smallW = 0.3 + frac*0.3;
    if(r &lt; smallW) return &#x27;small&#x27;;
    if(r &lt; smallW+0.4) return &#x27;medium&#x27;;
    return &#x27;large&#x27;;
  }

  function splashAt(x,y){
    var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;splash&#x27;;
    s.style.left=x+&#x27;px&#x27;; s.style.top=y+&#x27;px&#x27;;
    board.appendChild(s); setTimeout(function(){ if(s.parentNode)s.parentNode.removeChild(s); },420);
  }
  function starBurst(x,y,color){
    var chars=[&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;🌟&#x27;,&#x27;💫&#x27;];
    for(var i=0;i&lt;7;i++){
      var st=document.createElement(&#x27;div&#x27;); st.className=&#x27;star&#x27;;
      st.textContent=chars[i%chars.length];
      st.style.left=x+&#x27;px&#x27;; st.style.top=y+&#x27;px&#x27;; st.style.color=color;
      board.appendChild(st);
      var ang=Math.random()*Math.PI*2, dist=40+Math.random()*50;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      st.style.transition=&#x27;transform .5s ease-out, opacity .5s ease-out&#x27;;
      (function(st,dx,dy){ requestAnimationFrame(function(){
        st.style.transform=&#x27;translate(calc(-50% + &#x27;+dx+&#x27;px), calc(-50% + &#x27;+dy+&#x27;px)) scale(.3)&#x27;;
        st.style.opacity=&#x27;0&#x27;;
      });})(st,dx,dy);
      setTimeout((function(st){return function(){ if(st.parentNode)st.parentNode.removeChild(st); };})(st),520);
    }
  }

  function spawnFish(){
    var free=holes.filter(function(h){return !h.busy;});
    if(!free.length) return;
    var hole=free[Math.floor(Math.random()*free.length)];
    hole.busy=true;
    var key=pickType(); var t=TYPES[key];
    var life=t.life; if(storm) life=life/2;

    var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;fish&#x27;;
    f.textContent=t.emoji; f.style.left=hole.x+&#x27;px&#x27;; f.style.top=hole.y+&#x27;px&#x27;;
    f.style.color=t.color;
    board.appendChild(f);
    requestAnimationFrame(function(){ f.className=&#x27;fish up&#x27;; });

    var done=false;
    function finish(hit){
      if(done) return; done=true;
      hole.busy=false;
      var idx=activeFish.indexOf(f); if(idx&gt;=0)activeFish.splice(idx,1);
    }
    f.addEventListener(&#x27;click&#x27;, function(){
      if(done) return;
      finish(true);
      combo++;
      if(combo&gt;bestCombo){ bestCombo=combo; bestComboEl.textContent=bestCombo; }
      var mult=1;
      if(combo&gt;=5) mult=3; else if(combo&gt;=3) mult=2;
      var gained=t.points*mult;
      score+=gained;
      scoreEl.textContent=score;
      scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
      splat();
      starBurst(hole.x, hole.y-6, t.color);
      // combo banners
      if(combo===3){ showBanner(&#x27;COMBO x2!&#x27;,&#x27;#7dfad0&#x27;); chime(660); }
      else if(combo===5){ showBanner(&#x27;FRENZY x3!&#x27;,&#x27;#ff6ec7&#x27;); chime(880); }
      if(mult&gt;1){ comboLabel.textContent=(mult===3?&#x27;FRENZY x3&#x27;:&#x27;COMBO x2&#x27;)+&#x27; 🔥&#x27;; }
      if(f.parentNode) f.parentNode.removeChild(f);
    });

    activeFish.push({el:f, finish:finish, hole:hole});
    var to=setTimeout(function(){
      if(done) return; finish(false);
      f.className=&#x27;fish down&#x27;;
      splashAt(hole.x, hole.y);
      // miss breaks combo
      combo=0; comboLabel.textContent=&#x27;&#x27;;
      setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },300);
    }, life);
    moleTimeouts.push(to);
  }

  function showBanner(text,color){
    banner.textContent=text; banner.style.color=color;
    banner.classList.remove(&#x27;show&#x27;); void banner.offsetWidth; banner.classList.add(&#x27;show&#x27;);
  }

  function scheduleSpawn(){
    if(!running) return;
    spawnFish();
    spawnTimer=setTimeout(scheduleSpawn, spawnMs*(0.6+Math.random()*0.6));
  }

  function lightningFlash(){
    if(!running || !storm) return;
    lightning.classList.remove(&#x27;flash&#x27;); void lightning.offsetWidth; lightning.classList.add(&#x27;flash&#x27;);
    thunder();
  }

  function tick(){
    if(!running) return;
    timeLeft--;
    if(timeLeft&lt;0) timeLeft=0;
    timeEl.textContent=timeLeft;
    timefill.style.width=(timeLeft/60*100)+&#x27;%&#x27;;

    // accelerate spawn every 10s
    var elapsed=60-timeLeft;
    if(elapsed&gt;0 &amp;&amp; elapsed%10===0){ spawnMs=Math.max(380, spawnMs-140); }

    // storm at 40s elapsed (20s left)
    if(elapsed&gt;=40 &amp;&amp; !storm){
      storm=true; board.classList.add(&#x27;storm&#x27;);
      stormTimer=setInterval(function(){ if(Math.random()&lt;0.7) lightningFlash(); }, 1400);
      lightningFlash();
    }

    if(timeLeft&lt;=0){ endGame(); }
  }

  function clearAll(){
    if(spawnTimer){ clearTimeout(spawnTimer); spawnTimer=null; }
    if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
    if(bubbleTimer){ clearInterval(bubbleTimer); bubbleTimer=null; }
    if(stormTimer){ clearInterval(stormTimer); stormTimer=null; }
    moleTimeouts.forEach(function(t){clearTimeout(t);}); moleTimeouts=[];
    activeFish.forEach(function(a){ if(a.el.parentNode) a.el.parentNode.removeChild(a.el); a.hole.busy=false; });
    activeFish=[];
    holes.forEach(function(h){h.busy=false;});
    // remove stray fish/bubbles/stars
    Array.prototype.slice.call(board.querySelectorAll(&#x27;.fish,.bubble,.star,.splash&#x27;)).forEach(function(n){ if(n.parentNode)n.parentNode.removeChild(n); });
  }

  function ratingAnchors(s){
    if(s&gt;=90) return 5; if(s&gt;=65) return 4; if(s&gt;=42) return 3; if(s&gt;=22) return 2; if(s&gt;=8) return 1; return 0;
  }

  function endGame(){
    running=false;
    clearAll();
    var n=ratingAnchors(score);
    document.getElementById(&#x27;ovtitle&#x27;).textContent = n&gt;=4 ? &#x27;Master Angler!&#x27; : (n&gt;=2 ? &#x27;Nice Catch!&#x27; : &#x27;Better Luck Next Time&#x27;);
    document.getElementById(&#x27;anchors&#x27;).textContent = n&gt;0 ? &#x27;⚓&#x27;.repeat(n) : &#x27;🎣&#x27;;
    document.getElementById(&#x27;finscore&#x27;).textContent = &#x27;Final Score: &#x27;+score+&#x27;  •  Best Combo: &#x27;+bestCombo;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    clearAll();
    overlay.classList.remove(&#x27;show&#x27;);
    running=true; score=0; combo=0; bestCombo=0; timeLeft=60;
    spawnMs=1000; storm=false; board.classList.remove(&#x27;storm&#x27;);
    scoreEl.textContent=&#x27;0&#x27;; bestComboEl.textContent=&#x27;0&#x27;; timeEl.textContent=&#x27;60&#x27;;
    timefill.style.width=&#x27;100%&#x27;; comboLabel.textContent=&#x27;&#x27;;
    ac();
    // immediate feedback
    for(var i=0;i&lt;6;i++) bubble();
    spawnFish();
    scheduleSpawn();
    tickTimer=setInterval(tick,1000);
    bubbleTimer=setInterval(bubble,600);
  }

  function stopGame(){
    running=false; clearAll();
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
