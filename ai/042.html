&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .5px;
       background: linear-gradient(90deg,#7cf,#f7c,#fc7); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(120,200,255,.3); }
  .instructions { font-size: 16px; color: #bcd; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 20px; font-weight: 700; }

  .hud .best { color: #8fd; font-size: 16px; }
  .field { position: relative; width: 620px; height: 468px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
           box-shadow: 0 0 40px rgba(80,120,255,.25), inset 0 0 60px rgba(0,0,0,.6); background: #060018; }

  @keyframes dangerFlash { 0%,100%{ box-shadow: inset 0 0 0 rgba(255,0,60,0);} 50%{ box-shadow: inset 0 0 40px rgba(255,40,70,.65);} }
  .home { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(180deg, rgba(60,255,180,.28), rgba(60,255,180,.05));
          display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: 2px; color: #9fffcf; text-shadow: 0 0 12px #3fffb0; }

  @keyframes frogDie { 0%{ transform: rotate(0) scale(1); opacity:1;} 100%{ transform: rotate(720deg) scale(.2); opacity:0;} }

         animation: popUp .8s ease forwards; }
  @keyframes popUp { 0%{ transform: translateY(0) scale(.6); opacity: 0;} 20%{ opacity:1;} 100%{ transform: translateY(-40px) scale(1.2); opacity:0;} }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
             background: rgba(4,0,20,.72); z-index: 20; text-align: center; padding: 16px; box-sizing: border-box; }
  .overlay h2 { margin: 0; font-size: 30px; color: #fc7; }
  .overlay p { margin: 0; font-size: 17px; color: #cde; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Space Frog vs. The Galaxy Highway 🚀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys (or swipe) to dodge rockets, asteroids, and UFOs across the neon highway. Reach the green home planet to score — cross fast and often to build a flaming combo streak!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;streak&quot;&gt;🔥 &lt;span id=&quot;streak&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;h2&gt;Ready?&lt;/h2&gt;&lt;p&gt;Press Start below to launch!&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 44;
  var COLS = 14;
  var LANES = 8;
  var ROWS = LANES + 2;                 // home row + lanes + bottom safe row
  var FIELD_W = COLS * CELL;            // 616 ~ fits 620
  var FIELD_H = ROWS * CELL;            // 440
  var FROG = CELL;
  var running = false, animId = null;
  var score = 0, best = 0, streak = 1, crossSinceHit = 0;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [];
  var laneColors = [&#x27;#a24bff&#x27;,&#x27;#20d0c0&#x27;,&#x27;#ff8a3d&#x27;,&#x27;#ff5fb0&#x27;];
  var obstacleGlyphs = [&#x27;🚀&#x27;,&#x27;☄️&#x27;,&#x27;🛸&#x27;,&#x27;🪐&#x27;,&#x27;🛰️&#x27;];
  var frozen = false;

  var field = document.getElementById(&#x27;field&#x27;);
  var starsBox = document.getElementById(&#x27;stars&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var heroEl = null;

  // ---- audio (procedural) ----
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.06;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.1));
      o.stop(actx.currentTime + (dur||0.1));
    } catch(_) {}
  }

  // ---- starfield ----
  var starEls = [];
  function buildStars() {
    starsBox.innerHTML = &#x27;&#x27;;
    starEls = [];
    for (var i=0;i&lt;70;i++){
      var s = document.createElement(&#x27;div&#x27;);
      s.className=&#x27;star&#x27;;
      var sz = Math.random()&lt;0.2 ? 3 : (Math.random()&lt;0.5?2:1);
      s.style.width=sz+&#x27;px&#x27;; s.style.height=sz+&#x27;px&#x27;;
      s.style.left=(Math.random()*FIELD_W)+&#x27;px&#x27;;
      var y = Math.random()*FIELD_H;
      s.style.top=y+&#x27;px&#x27;;
      starsBox.appendChild(s);
      starEls.push({el:s, y:y, sp: 0.2+Math.random()*0.9});
    }
  }

  function laneObstacleWidth() { return CELL*1.4; }

  function buildLanes() {
    lanes.forEach(function(l){ l.obstacles.forEach(function(o){ if(o.el.parentNode) o.el.parentNode.removeChild(o.el); }); if(l.el&amp;&amp;l.el.parentNode) l.el.parentNode.removeChild(l.el); });
    lanes = [];
    // home zone
    var existingHome = field.querySelector(&#x27;.home&#x27;);
    if (existingHome) existingHome.parentNode.removeChild(existingHome);
    var home = document.createElement(&#x27;div&#x27;);
    home.className=&#x27;home&#x27;;
    home.style.height = CELL+&#x27;px&#x27;; home.style.top=&#x27;0px&#x27;;
    home.textContent=&#x27;🌍 HOME&#x27;;
    field.insertBefore(home, overlay);

    var OW = laneObstacleWidth();
    for (var i=0;i&lt;LANES;i++){
      var laneRow = i+1;
      var y = laneRow*CELL;
      var laneEl = document.createElement(&#x27;div&#x27;);
      laneEl.className=&#x27;lane&#x27;;
      laneEl.style.top=y+&#x27;px&#x27;; laneEl.style.height=CELL+&#x27;px&#x27;;
      var col = laneColors[i%laneColors.length];
      laneEl.style.background=&#x27;linear-gradient(180deg,&#x27;+hexA(col,0.22)+&#x27;,&#x27;+hexA(col,0.05)+&#x27;)&#x27;;
      laneEl.style.borderTop=&#x27;1px solid &#x27;+hexA(col,0.4);
      field.insertBefore(laneEl, overlay);

      var dir = (i%2===0)?1:-1;
      var speed = 0.7 + (i%3)*0.35;
      var count = 2 + (i%3);
      var gap = FIELD_W/count;
      var glyph = obstacleGlyphs[i%obstacleGlyphs.length];
      var obstacles = [];
      for (var j=0;j&lt;count;j++){
        var x = j*gap + (i*37)%gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className=&#x27;obstacle&#x27;;
        el.style.width=OW+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
        el.style.top=y+&#x27;px&#x27;; el.style.left=x+&#x27;px&#x27;;
        el.textContent=glyph;
        el.style.transform = dir&lt;0 ? &#x27;scaleX(-1)&#x27; : &#x27;&#x27;;
        el.style.filter=&#x27;drop-shadow(0 0 6px &#x27;+col+&#x27;)&#x27;;
        field.insertBefore(el, overlay);
        obstacles.push({x:x, el:el, spin: glyph===&#x27;☄️&#x27;||glyph===&#x27;🪐&#x27;});
      }
      lanes.push({y:y, dir:dir, baseSpeed:speed, speed:speed, obstacles:obstacles, el:laneEl, ow:OW, danger:false, spinPhase:0});
    }
  }

  function hexA(hex, a){
    var n = parseInt(hex.slice(1),16);
    var r=(n&gt;&gt;16)&amp;255,g=(n&gt;&gt;8)&amp;255,b=n&amp;255;
    return &#x27;rgba(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;,&#x27;+a+&#x27;)&#x27;;
  }

  function makeHero(){
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className=&#x27;frog&#x27;;
    heroEl.style.width=FROG+&#x27;px&#x27;; heroEl.style.height=FROG+&#x27;px&#x27;;
    heroEl.textContent=&#x27;🐸&#x27;;
    field.insertBefore(heroEl, overlay);
  }
  function paintHero(){
    heroEl.style.left=(hero.col*CELL + (CELL-FROG)/2)+&#x27;px&#x27;;
    heroEl.style.top=(hero.row*CELL + (CELL-FROG)/2)+&#x27;px&#x27;;
  }
  function resetHero(){ hero.col=Math.floor(COLS/2); hero.row=ROWS-1; paintHero(); }

  function speedFactor(){ return 1 + Math.min(score*0.05, 2.2); }

  function tick(){
    if(!running) return;
    // stars
    for (var s=0;s&lt;starEls.length;s++){
      var st=starEls[s]; st.y+=st.sp; if(st.y&gt;FIELD_H){st.y=-2; st.el.style.left=(Math.random()*FIELD_W)+&#x27;px&#x27;;}
      st.el.style.top=st.y+&#x27;px&#x27;;
    }
    var sf = speedFactor();
    var heroCX = hero.col*CELL + CELL/2;
    for (var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i];
      lane.speed = lane.baseSpeed*sf;
      var dangerNow=false;
      lane.spinPhase += 8;
      for (var j=0;j&lt;lane.obstacles.length;j++){
        var o=lane.obstacles[j];
        o.x += lane.dir*lane.speed;
        if(lane.dir&gt;0 &amp;&amp; o.x&gt;FIELD_W) o.x=-lane.ow;
        else if(lane.dir&lt;0 &amp;&amp; o.x+lane.ow&lt;0) o.x=FIELD_W;
        o.el.style.left=o.x+&#x27;px&#x27;;
        if(o.spin){ o.el.style.transform=&#x27;rotate(&#x27;+lane.spinPhase+&#x27;deg)&#x27;; }
        // danger prediction: obstacle approaching hero column within ~1.2 cells
        var ocx=o.x+lane.ow/2;
        var dist=(ocx-heroCX)*lane.dir; // positive = coming toward
        if(dist&gt;-lane.ow &amp;&amp; dist&lt;CELL*2.2 &amp;&amp; (i===hero.row-1 || i===hero.row-2)) dangerNow=true;
      }
      if(dangerNow!==lane.danger){ lane.danger=dangerNow; lane.el.classList.toggle(&#x27;danger&#x27;,dangerNow); }
    }
    // collision
    var laneIdx=hero.row-1;
    if(laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES &amp;&amp; !frozen){
      var hx=hero.col*CELL + (CELL-FROG)/2 + 6;
      var hw=FROG-12;
      var lane2=lanes[laneIdx];
      for(var k=0;k&lt;lane2.obstacles.length;k++){
        var o2=lane2.obstacles[k];
        if(hx &lt; o2.x+lane2.ow-6 &amp;&amp; hx+hw &gt; o2.x+6){ die(); return; }
      }
    }
    animId=requestAnimationFrame(tick);
  }

  function burst(px,py){
    var colors=[&#x27;#ff5fb0&#x27;,&#x27;#7cf&#x27;,&#x27;#fc7&#x27;,&#x27;#9fffcf&#x27;,&#x27;#a24bff&#x27;];
    for(var i=0;i&lt;24;i++){
      var p=document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;;
      p.style.background=colors[i%colors.length];
      p.style.left=px+&#x27;px&#x27;; p.style.top=py+&#x27;px&#x27;;
      field.insertBefore(p, overlay);
      var ang=Math.random()*Math.PI*2, spd=2+Math.random()*4;
      (function(el,vx,vy){
        var x=px,y=py,life=0;
        function step(){
          life++; vy+=0.15; x+=vx; y+=vy;
          el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;; el.style.opacity=Math.max(0,1-life/40);
          if(life&lt;40) requestAnimationFrame(step); else if(el.parentNode) el.parentNode.removeChild(el);
        }
        step();
      })(p, Math.cos(ang)*spd, Math.sin(ang)*spd);
    }
  }

  function showPop(text,px,py){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;pop&#x27;; el.textContent=text;
    el.style.left=px+&#x27;px&#x27;; el.style.top=py+&#x27;px&#x27;;
    field.insertBefore(el, overlay);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 850);
  }

  function move(dc,dr){
    if(!running||frozen) return;
    var nc=Math.max(0,Math.min(COLS-1,hero.col+dc));
    var nr=Math.max(0,Math.min(ROWS-1,hero.row+dr));
    if(nc===hero.col &amp;&amp; nr===hero.row) return;
    hero.col=nc; hero.row=nr;
    paintHero();
    heroEl.classList.remove(&#x27;hop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hop&#x27;);
    beep(520+Math.random()*80,0.06,&#x27;square&#x27;,0.04);
    if(hero.row===0){
      crossSinceHit++;
      streak = 1 + Math.floor(crossSinceHit/2);
      var gain = streak;
      score+=gain;
      if(score&gt;best){best=score; bestEl.textContent=best;}
      scoreEl.textContent=score;
      streakEl.textContent=&#x27;x&#x27;+streak;
      var px=hero.col*CELL+CELL/2, py=CELL/2;
      burst(px,py);
      showPop(&#x27;+&#x27;+gain, px-14, py);
      beep(880,0.12,&#x27;triangle&#x27;,0.08); setTimeout(function(){beep(1180,0.12,&#x27;triangle&#x27;,0.08);},90);
      resetHero();
    }
  }

  function die(){
    if(frozen) return;
    frozen=true;
    beep(160,0.35,&#x27;sawtooth&#x27;,0.09);
    heroEl.classList.add(&#x27;dead&#x27;);
    crossSinceHit=0; streak=1; streakEl.textContent=&#x27;x1&#x27;;
    setTimeout(function(){
      heroEl.classList.remove(&#x27;dead&#x27;);
      resetHero();
      frozen=false;
    }, 750);
  }

  function startGame(){
    if(running) return;
    overlay.style.display=&#x27;none&#x27;;
    score=0; streak=1; crossSinceHit=0; frozen=false;
    scoreEl.textContent=&#x27;0&#x27;; streakEl.textContent=&#x27;x1&#x27;;
    buildStars(); buildLanes(); makeHero(); resetHero();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId); animId=null;}
    overlay.querySelector(&#x27;h2&#x27;).textContent=&#x27;Paused&#x27;;
    overlay.querySelector(&#x27;p&#x27;).textContent=&#x27;Press Start below to launch!&#x27;;
    overlay.style.display=&#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){move(0,-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){move(0,1);e.preventDefault();}
  });

  // swipe support
  var tsx=0,tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0];var dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0); else move(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial paint
  buildStars(); buildLanes(); makeHero(); paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,

<script>
