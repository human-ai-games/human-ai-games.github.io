&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with the arrow keys to eat ⭐ (1 pt), 🍒 (3 pts, vanishes fast) and 💎 (5 pts, rare &amp;amp; fleeting). Chain eats quickly to build a combo multiplier — use the Start/Restart button below.&lt;/p&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var BASE_TICK = 150, MIN_TICK = 70;
  var tickMs = BASE_TICK;
  var running = false, tickId = null, timerId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0, combo = 1;
  var lastEatTime = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  // Collectibles
  // star: permanent, 1pt. cherry: 5s life, 3pt. gem: 3s life, 5pt (rare)
  var star = null, cherry = null, gem = null;
  var now = 0; // ms accumulator via Date.now

  // Web Audio
  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(_) {}
  }

  function clearSprites() {
    var kids = field.querySelectorAll(&#x27;.cell, .particle&#x27;);
    for (var i=0;i&lt;kids.length;i++) kids[i].remove();
  }

  function drawSnake() {
    var n = snake.length;
    for (var i=0;i&lt;n;i++){
      var s = snake[i];
      var el = document.createElement(&#x27;div&#x27;);
      var t = n&gt;1 ? i/(n-1) : 0; // 0 head -&gt; 1 tail
      // gradient cyan -&gt; violet
      var r = Math.round(0 + t*140);
      var g = Math.round(234 - t*160);
      var b = Math.round(255 - t*10);
      el.className = &#x27;cell seg&#x27; + (i===0?&#x27; head&#x27;:&#x27;&#x27;);
      el.style.left = (s.x*CELL)+&#x27;px&#x27;;
      el.style.top = (s.y*CELL)+&#x27;px&#x27;;
      el.style.width = CELL+&#x27;px&#x27;;
      el.style.height = CELL+&#x27;px&#x27;;
      el.style.background = &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      el.style.color = &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      if (i===0) el.style.boxShadow = &#x27;0 0 16px rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      field.appendChild(el);
    }
  }

  function drawItem(item, cls, emoji) {
    if (!item) return;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (item.x*CELL)+&#x27;px&#x27;;
    el.style.top = (item.y*CELL)+&#x27;px&#x27;;
    el.style.width = CELL+&#x27;px&#x27;;
    el.style.height = CELL+&#x27;px&#x27;;
    el.textContent = emoji;
    field.appendChild(el);
  }

  function paint() {
    clearSprites();
    drawItem(star, &#x27;star&#x27;, &#x27;⭐&#x27;);
    drawItem(cherry, &#x27;cherry&#x27;, &#x27;🍒&#x27;);
    drawItem(gem, &#x27;gem&#x27;, &#x27;💎&#x27;);
    drawSnake();
  }

  function occupied(x,y){
    for (var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    if(star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
    if(cherry&amp;&amp;cherry.x===x&amp;&amp;cherry.y===y) return true;
    if(gem&amp;&amp;gem.x===x&amp;&amp;gem.y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function spawnStar(){ var c=freeCell(); star={x:c.x,y:c.y}; }
  function spawnCherry(){ var c=freeCell(); cherry={x:c.x,y:c.y,expire:now+5000}; }
  function spawnGem(){ var c=freeCell(); gem={x:c.x,y:c.y,expire:now+3000}; }

  function doFlash(color){
    flashEl.style.background = &#x27;radial-gradient(circle at center, &#x27;+color+&#x27;, transparent 70%)&#x27;;
    flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;);
  }
  function popScore(){
    scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
  }

  function eat(points, color, freq){
    // combo logic
    if (now - lastEatTime &lt;= 4000) combo = Math.min(combo+1, 9);
    else combo = 1;
    lastEatTime = now;
    score += points * combo;
    scoreEl.textContent = score;
    comboEl.textContent = &#x27;x&#x27;+combo;
    comboEl.classList.toggle(&#x27;hot&#x27;, combo&gt;=3);
    popScore();
    doFlash(color);
    beep(freq, 0.14, &#x27;triangle&#x27;);
    // slight speed up
    tickMs = Math.max(MIN_TICK, tickMs - 3);
    restartTick();
  }

  function restartTick(){
    if(tickId) clearInterval(tickId);
    tickId = setInterval(tick, tickMs);
  }

  function initSnake(){
    snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function tick(){
    if(!running) return;
    now = Date.now();
    // expire timed items
    if(cherry &amp;&amp; now&gt;cherry.expire) cherry=null;
    if(gem &amp;&amp; now&gt;gem.expire) gem=null;
    // combo decay
    if(combo&gt;1 &amp;&amp; now-lastEatTime&gt;4000){ combo=1; comboEl.textContent=&#x27;x1&#x27;; comboEl.classList.remove(&#x27;hot&#x27;); }
    // occasional gem spawn
    if(!gem &amp;&amp; Math.random()&lt;0.012) spawnGem();

    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }

    var ate = (star&amp;&amp;nx===star.x&amp;&amp;ny===star.y)||(cherry&amp;&amp;nx===cherry.x&amp;&amp;ny===cherry.y)||(gem&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y);
    var body = ate ? snake : snake.slice(0, snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }

    snake.unshift({x:nx,y:ny});
    if(star&amp;&amp;nx===star.x&amp;&amp;ny===star.y){ star=null; eat(1,&#x27;rgba(255,224,102,0.8)&#x27;,660); spawnStar(); }
    else if(cherry&amp;&amp;nx===cherry.x&amp;&amp;ny===cherry.y){ cherry=null; eat(3,&#x27;rgba(255,77,109,0.85)&#x27;,520); }
    else if(gem&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y){ gem=null; eat(5,&#x27;rgba(168,85,247,0.9)&#x27;,880); }
    else { snake.pop(); }

    // random cherry spawn if none
    if(!cherry &amp;&amp; Math.random()&lt;0.03) spawnCherry();

    paint();
  }

  function explode(){
    for(var i=0;i&lt;snake.length;i++){
      var s=snake[i];
      var p=document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;;
      var sz=6+Math.random()*10;
      p.style.width=sz+&#x27;px&#x27;; p.style.height=sz+&#x27;px&#x27;;
      p.style.left=(s.x*CELL+CELL/2)+&#x27;px&#x27;;
      p.style.top=(s.y*CELL+CELL/2)+&#x27;px&#x27;;
      var t=snake.length&gt;1?i/(snake.length-1):0;
      var r=Math.round(t*140),g=Math.round(234-t*160),b=Math.round(255-t*10);
      p.style.background=&#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      p.style.boxShadow=&#x27;0 0 10px rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      var ang=Math.random()*Math.PI*2, dist=40+Math.random()*120;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.style.transition=&#x27;transform 0.7s ease-out, opacity 0.7s ease-out&#x27;;
      field.appendChild(p);
      (function(pp,ddx,ddy){ requestAnimationFrame(function(){ requestAnimationFrame(function(){
        pp.style.transform=&#x27;translate(&#x27;+ddx+&#x27;px,&#x27;+ddy+&#x27;px)&#x27;; pp.style.opacity=&#x27;0&#x27;;
      });});})(p,dx,dy);
    }
  }

  function endGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
    beep(140,0.5,&#x27;sawtooth&#x27;);
    doFlash(&#x27;rgba(255,50,80,0.9)&#x27;);
    var segs=field.querySelectorAll(&#x27;.seg&#x27;);
    for(var i=0;i&lt;segs.length;i++) segs[i].remove();
    explode();
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    if(tickId){ clearInterval(tickId); tickId=null; }
    clearSprites();
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; combo=1; tickMs=BASE_TICK;
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;x1&#x27;; comboEl.classList.remove(&#x27;hot&#x27;);
    now=Date.now(); lastEatTime=now;
    initSnake();
    star=null; cherry=null; gem=null;
    spawnStar();
    spawnCherry();
    paint();
    running=true;
    restartTick();
  }
  function stopGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static paint
  now=Date.now();
  initSnake();
  spawnStar();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  window.__v5_heartbeat_v2 = true;

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);

  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,

        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
