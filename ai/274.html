<html lang="en">

<title>🌻 Gopher Garden Defense</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌻 Gopher Garden Defense</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #7ec8e3; color: #2a2a2a; overflow: hidden; }
  .game { position: relative; width: 720px; height: 640px; margin: 0 auto; box-sizing: border-box; overflow: hidden;
    background: linear-gradient(#8fd4ef 0%, #b9e6f7 45%, #7cc85b 45%, #5fae42 100%); }

  /* Sun */
  .sun { position: absolute; top: 14px; left: 22px; width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff5b0, #ffd93b); box-shadow: 0 0 30px 8px rgba(255,217,59,.6); z-index: 1; }
  .sun::before, .sun::after { content:&#x27;&#x27;; position:absolute; inset:-10px; border-radius:50%;
    box-shadow: 0 -22px 0 -8px #ffd93b, 0 22px 0 -8px #ffd93b, -22px 0 0 -8px #ffd93b, 22px 0 0 -8px #ffd93b; }
  /* Clouds */
  .cloud { position:absolute; background:#fff; border-radius:40px; opacity:.9; z-index:1; }
  .cloud::before, .cloud::after { content:&#x27;&#x27;; position:absolute; background:#fff; border-radius:50%; }
  .c1 { width:70px; height:24px; top:40px; left:520px; animation: drift 26s linear infinite; }
  .c1::before { width:34px; height:34px; top:-14px; left:10px; }
  .c1::after { width:26px; height:26px; top:-10px; left:38px; }
  .c2 { width:55px; height:20px; top:100px; left:300px; animation: drift 34s linear infinite; }
  .c2::before { width:26px; height:26px; top:-12px; left:8px; }
  .c2::after { width:20px; height:20px; top:-8px; left:30px; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-820px); } }

  .topbar { position:absolute; top:0; left:0; right:0; z-index:5; padding:10px 14px 4px; text-align:center; }
  h1 { margin:0; font-size:26px; font-weight:800; color:#3a6b1f; text-shadow: 1px 1px 0 #fff; }
  .instructions { font-size:16px; color:#2f4d18; max-width:600px; margin:4px auto 0; line-height:1.35; font-weight:600; text-shadow:0 1px 0 rgba(255,255,255,.5); }

  /* Seed-packet score */
  .packet { position:absolute; top:12px; right:14px; z-index:6; width:120px; background:#fffbe6;
    border:3px solid #c98f2b; border-radius:8px; padding:6px 4px; text-align:center; box-shadow:2px 3px 0 rgba(0,0,0,.2); transform: rotate(2deg); }
  .packet .lbl { font-size:11px; font-weight:800; color:#8a5a12; letter-spacing:1px; }
  .packet .num { font-size:32px; font-weight:900; color:#3a6b1f; line-height:1; }
  .packet .time { font-size:12px; font-weight:800; color:#b34; margin-top:2px; }

  .board { position:absolute; left:50%; top:150px; transform:translateX(-50%); width:480px; height:420px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:14px; z-index:3; }
  .hole { position:relative; overflow:hidden; border-radius:50% / 30%; }
  .dirt { position:absolute; bottom:0; left:8%; width:84%; height:44%;
    background: radial-gradient(ellipse at 50% 30%, #7a4a24, #5a3418); border-radius:50% / 60%; box-shadow: inset 0 6px 10px rgba(0,0,0,.35); }
  .grass { position:absolute; bottom:20%; left:0; width:100%; height:22%;
    background: radial-gradient(ellipse at 50% 100%, #4f9e33 60%, transparent 62%); z-index:4; }

  /* Gopher */
  .gopher { position:absolute; bottom:14%; left:50%; width:66px; height:72px; margin-left:-33px;
    transform: translateY(120%); transition: transform .16s cubic-bezier(.34,1.56,.64,1); cursor:pointer; z-index:3; }
  .gopher.up { transform: translateY(0); }
  .gopher.down { transform: translateY(120%); transition: transform .18s ease-in; }
  .body { position:absolute; bottom:0; left:8px; width:50px; height:52px; border-radius:50% 50% 46% 46%;
    background: radial-gradient(circle at 40% 30%, #b98a5e, #8a5f36); }
  .golden .body { background: radial-gradient(circle at 40% 30%, #ffe680, #e8a91d); }
  .belly { position:absolute; bottom:4px; left:50%; margin-left:-13px; width:26px; height:24px; border-radius:50%; background:#e8d3b4; }
  .ear { position:absolute; top:2px; width:14px; height:14px; border-radius:50%; background:#8a5f36; }
  .golden .ear { background:#e8a91d; }
  .earL { left:6px; } .earR { right:6px; }
  .face { position:absolute; top:14px; left:50%; margin-left:-17px; width:34px; height:30px; }
  .eye { position:absolute; top:0; width:8px; height:8px; border-radius:50%; background:#fff; }
  .eye::after { content:&#x27;&#x27;; position:absolute; top:2px; left:2px; width:4px; height:4px; border-radius:50%; background:#222; }
  .eyeL { left:2px; } .eyeR { right:2px; }
  .grin { position:absolute; bottom:0; left:50%; margin-left:-8px; width:16px; height:8px;
    border:2px solid #5a3418; border-top:none; border-radius:0 0 10px 10px; }
  .teeth { position:absolute; bottom:2px; left:50%; margin-left:-4px; width:8px; height:6px; background:#fff; border-radius:0 0 2px 2px; }
  /* hard hat */
  .hat { position:absolute; top:-6px; left:50%; margin-left:-18px; width:36px; height:16px;
    background:#ffcf33; border-radius:18px 18px 0 0; border-bottom:3px solid #e0a800; z-index:5; }
  .hat::after { content:&#x27;&#x27;; position:absolute; bottom:-4px; left:-4px; width:44px; height:5px; background:#ffcf33; border-radius:3px; }
  .golden .hat { background:#fff2b0; border-bottom-color:#d4a017; }

  /* Splat state */
  .gopher.hit .eye::after { top:1px; left:5px; }
  .gopher.hit .eyeL::after { left:1px; }
  .gopher.hit .grin { border-radius:10px 10px 0 0; border-top:2px solid #5a3418; border-bottom:none; bottom:-2px; }
  .stars { position:absolute; top:-4px; left:50%; margin-left:-30px; width:60px; height:60px; z-index:6; pointer-events:none;
    animation: spin .5s linear infinite; opacity:0; }
  .gopher.hit .stars { opacity:1; }
  .stars span { position:absolute; font-size:16px; }
  .stars span:nth-child(1){ top:0; left:24px; } .stars span:nth-child(2){ top:24px; left:0; }
  .stars span:nth-child(3){ top:24px; right:0; } .stars span:nth-child(4){ bottom:0; left:24px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .float { position:absolute; z-index:8; font-size:30px; font-weight:900; color:#ffe14d;
    -webkit-text-stroke:2px #b37f00; text-stroke:2px #b37f00; text-shadow:0 2px 3px rgba(0,0,0,.35); pointer-events:none;
    animation: floatUp .8s ease-out forwards; }
  @keyframes floatUp { from{ transform:translateY(0); opacity:1;} to{ transform:translateY(-60px); opacity:0;} }

  .frenzy { position:absolute; top:118px; left:50%; transform:translateX(-50%); z-index:9;
    font-size:34px; font-weight:900; color:#ff4d4d; -webkit-text-stroke:2px #fff; text-stroke:2px #fff;
    opacity:0; transition:opacity .2s; pointer-events:none; }
  .frenzy.show { opacity:1; animation: frenzyPulse .5s ease-in-out infinite; }
  @keyframes frenzyPulse { 0%,100%{ transform:translateX(-50%) scale(1);} 50%{ transform:translateX(-50%) scale(1.15);} }

  .combo { position:absolute; top:120px; left:14px; z-index:6; font-size:16px; font-weight:900; color:#e05a00; text-shadow:0 1px 0 #fff; }

  .shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(-360px);} 20%{transform:translate(-368px,3px);} 40%{transform:translate(-352px,-3px);} 60%{transform:translate(-364px,2px);} 80%{transform:translate(-356px,-2px);} }
  /* board is translateX(-50%) so shake keyframes above are board-local; use wrapper instead */

  .overlay { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(0,0,0,.4); color:#fff; text-align:center; }
  .overlay h2 { font-size:34px; margin:0 0 6px; }
  .overlay p { font-size:18px; margin:2px; }
  .hidden { display:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot; id=&quot;game&quot;&gt;
  &lt;div class=&quot;sun&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;cloud c1&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;cloud c2&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;topbar&quot;&gt;
    &lt;h1&gt;🌻 Gopher Garden Defense&lt;/h1&gt;
    &lt;p class=&quot;instructions&quot;&gt;Click the cheeky gophers as they pop up before they duck back down. Golden hard-hat gophers are worth 3 but vanish fast — chain quick hits for a FRENZY combo!&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;packet&quot;&gt;
    &lt;div class=&quot;lbl&quot;&gt;🌱 SCORE 🌱&lt;/div&gt;
    &lt;div class=&quot;num&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
    &lt;div class=&quot;time&quot; id=&quot;time&quot;&gt;1:00&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;frenzy&quot; id=&quot;frenzy&quot;&gt;FRENZY!&lt;/div&gt;

  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
    &lt;h2&gt;🌻 Gopher Garden 🌻&lt;/h2&gt;
    &lt;p&gt;Press &lt;strong&gt;Start&lt;/strong&gt; below to defend the garden!&lt;/p&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var frenzyEl = document.getElementById(&#x27;frenzy&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var gameEl = document.getElementById(&#x27;game&#x27;);

  var holes = [];
  for (var i = 0; i &lt; 9; i++) {
    var h = document.createElement(&#x27;div&#x27;);
    h.className = &#x27;hole&#x27;;
    h.innerHTML = &#x27;&lt;div class=&quot;dirt&quot;&gt;&lt;/div&gt;&lt;div class=&quot;grass&quot;&gt;&lt;/div&gt;&#x27;;
    board.appendChild(h);
    holes.push({ el: h, busy: false });
  }

  var running = false, score = 0, timeLeft = 60;
  var spawnTimer = null, tickTimer = null, gameTimer = null;
  var combo = 0, comboTimer = null, frenzyOn = false;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function level() { return Math.floor(score / 10); }
  function maxSimul() { return Math.min(4, 1 + Math.floor(level() / 1.5)); }
  function activeCount() { var n = 0; for (var i=0;i&lt;holes.length;i++) if (holes[i].busy) n++; return n; }
  function spawnInterval() { return Math.max(420, 900 - level() * 70); }
  function visibleTime() { return Math.max(700, 1300 - level() * 90); }

  function spawnGopher() {
    if (!running) return;
    if (activeCount() &gt;= maxSimul()) return;
    // pick a free hole
    var free = [];
    for (var i=0;i&lt;holes.length;i++) if (!holes[i].busy) free.push(i);
    if (!free.length) return;
    var idx = free[Math.floor(Math.random()*free.length)];
    var hole = holes[idx];
    hole.busy = true;

    var golden = Math.random() &lt; 0.14;
    var g = document.createElement(&#x27;div&#x27;);
    g.className = &#x27;gopher&#x27; + (golden ? &#x27; golden&#x27; : &#x27;&#x27;);
    g.innerHTML =
      &#x27;&lt;div class=&quot;stars&quot;&gt;&lt;span&gt;⭐&lt;/span&gt;&lt;span&gt;✨&lt;/span&gt;&lt;span&gt;⭐&lt;/span&gt;&lt;span&gt;✨&lt;/span&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;hat&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;ear earL&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ear earR&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;body&quot;&gt;&#x27; +
        &#x27;&lt;div class=&quot;belly&quot;&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;div class=&quot;face&quot;&gt;&#x27; +
          &#x27;&lt;div class=&quot;eye eyeL&quot;&gt;&lt;/div&gt;&lt;div class=&quot;eye eyeR&quot;&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;div class=&quot;grin&quot;&gt;&lt;div class=&quot;teeth&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
        &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;/div&gt;&#x27;;
    hole.el.appendChild(g);

    var life = golden ? visibleTime() / 2 : visibleTime();
    var hit = false, downTimer, removeTimer;

    // pop up
    requestAnimationFrame(function(){ g.classList.add(&#x27;up&#x27;); });

    function cleanup() {
      if (removeTimer) clearTimeout(removeTimer);
      if (downTimer) clearTimeout(downTimer);
      if (g.parentNode) g.parentNode.removeChild(g);
      hole.busy = false;
    }

    function duckDown() {
      if (hit) return;
      g.classList.remove(&#x27;up&#x27;); g.classList.add(&#x27;down&#x27;);
      // missed -&gt; break combo
      breakCombo();
      removeTimer = setTimeout(cleanup, 220);
    }

    function whack(e) {
      if (hit || !running) return;
      hit = true;
      var pts = golden ? 3 : 1;
      registerCombo();
      var mult = frenzyOn ? 2 : 1;
      var gained = pts * mult;
      score += gained;
      scoreEl.textContent = score;
      g.classList.add(&#x27;hit&#x27;);
      floatText(hole, &#x27;+&#x27; + gained);
      // slide down after splat
      setTimeout(function(){ g.classList.remove(&#x27;up&#x27;); g.classList.add(&#x27;down&#x27;); }, 260);
      removeTimer = setTimeout(cleanup, 480);
      beep(golden ? 880 : 620);
    }

    g.addEventListener(&#x27;mousedown&#x27;, whack);
    downTimer = setTimeout(duckDown, life);
    hole._cleanup = cleanup;
  }

  function floatText(hole, txt) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = txt;
    var r = hole.el;
    f.style.left = (r.offsetLeft + r.offsetWidth/2 - 16) + &#x27;px&#x27;;
    f.style.top = (r.offsetTop + 10) + &#x27;px&#x27;;
    board.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 800);
  }

  function registerCombo() {
    combo++;
    if (comboTimer) clearTimeout(comboTimer);
    comboTimer = setTimeout(breakCombo, 1400);
    if (combo &gt;= 4 &amp;&amp; !frenzyOn) startFrenzy();
    comboEl.textContent = combo &gt; 1 ? (&#x27;COMBO x&#x27; + combo) : &#x27;&#x27;;
  }
  function breakCombo() {
    combo = 0;
    comboEl.textContent = &#x27;&#x27;;
    if (frenzyOn) endFrenzy();
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
  }
  function startFrenzy() {
    frenzyOn = true;
    frenzyEl.classList.add(&#x27;show&#x27;);
    gameEl.classList.add(&#x27;shake&#x27;);
    setTimeout(function(){ gameEl.classList.remove(&#x27;shake&#x27;); }, 400);
  }
  function endFrenzy() {
    frenzyOn = false;
    frenzyEl.classList.remove(&#x27;show&#x27;);
  }

  // Web Audio beep
  var actx = null;
  function beep(freq) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), gg = actx.createGain();
      o.type = &#x27;square&#x27;; o.frequency.value = freq;
      gg.gain.value = 0.08;
      o.connect(gg); gg.connect(actx.destination);
      o.start();
      gg.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.12);
      o.stop(actx.currentTime + 0.13);
    } catch(_) {}
  }

  function loopSpawn() {
    if (!running) return;
    spawnGopher();
    spawnTimer = setTimeout(loopSpawn, spawnInterval());
  }

  function tick() {
    if (!running) return;
    timeLeft--;
    var m = Math.floor(timeLeft/60), s = timeLeft%60;
    timeEl.textContent = m + &#x27;:&#x27; + (s&lt;10?&#x27;0&#x27;:&#x27;&#x27;) + s;
    if (timeLeft &lt;= 0) { endGame(); return; }
    tickTimer = setTimeout(tick, 1000);
  }

  function clearBoard() {
    for (var i=0;i&lt;holes.length;i++) {
      if (holes[i]._cleanup) holes[i]._cleanup();
      holes[i].busy = false;
      var gs = holes[i].el.querySelectorAll(&#x27;.gopher, .float&#x27;);
      for (var j=0;j&lt;gs.length;j++) gs[j].parentNode.removeChild(gs[j]);
    }
    var fs = board.querySelectorAll(&#x27;.float&#x27;);
    for (var k=0;k&lt;fs.length;k++) fs[k].parentNode.removeChild(fs[k]);
  }

  function startGame() {
    stopTimers();
    clearBoard();
    running = true;
    score = 0; timeLeft = 60; combo = 0; frenzyOn = false;
    scoreEl.textContent = &#x27;0&#x27;;
    timeEl.textContent = &#x27;1:00&#x27;;
    comboEl.textContent = &#x27;&#x27;;
    frenzyEl.classList.remove(&#x27;show&#x27;);
    overlay.classList.add(&#x27;hidden&#x27;);
    spawnGopher(); // instant first gopher
    spawnTimer = setTimeout(loopSpawn, spawnInterval());
    tickTimer = setTimeout(tick, 1000);
  }

  function stopTimers() {
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
  }

  function stopGame() {
    running = false;
    stopTimers();
    clearBoard();
    endFrenzy();
  }

  function endGame() {
    running = false;
    stopTimers();
    clearBoard();
    endFrenzy();
    overlay.innerHTML = &#x27;&lt;h2&gt;⏰ Time\&#x27;s Up!&lt;/h2&gt;&lt;p&gt;Garden defended with&lt;/p&gt;&lt;p style=&quot;font-size:40px;font-weight:900;color:#ffe14d;&quot;&gt;&#x27; + score + &#x27; points&lt;/p&gt;&lt;p&gt;Press &lt;strong&gt;Start&lt;/strong&gt; to play again!&lt;/p&gt;&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
