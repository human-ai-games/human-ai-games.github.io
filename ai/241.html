<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌊 Deep-Sea Tap Reef 🐟</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #021019; color: #cfefff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #7fe8ff; text-shadow: 0 0 8px #2fb8ff, 0 0 18px #1a7fc0; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #9fd4e8; max-width: 620px; margin: 0; line-height: 1.35; }
  .topbar { display: flex; align-items: center; justify-content: center; gap: 22px; }
  .score { font-size: 22px; font-weight: 700; color: #aef7d0; text-shadow: 0 0 8px #2fffb0, 0 0 16px #12b070; transition: transform 0.12s ease; }
  .score.pulse { transform: scale(1.35); }
  .combo-meter { display: flex; gap: 6px; align-items: center; }
  .combo-fish { font-size: 22px; filter: grayscale(1) brightness(0.6); transition: all 0.2s; }
  .combo-fish.lit { filter: none; text-shadow: 0 0 10px gold, 0 0 20px orange; transform: scale(1.2); }
  .combo-label { font-size: 13px; color: #ffe27f; text-shadow: 0 0 8px #ffb300; }
  .board {
    position: relative; width: 640px; height: 448px; flex-shrink: 0; overflow: hidden;
    border-radius: 12px;
    background: linear-gradient(180deg, #0a4c66 0%, #063049 40%, #031a2c 75%, #010a14 100%);
    box-shadow: inset 0 0 60px #000a14, 0 0 20px #0a3a55;
  }
  .board.doubled { box-shadow: inset 0 0 80px #ffcc0033, 0 0 30px #ffcc00aa; }
  .shimmer { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(120deg, transparent, #ffe27f33, transparent); background-size: 200% 200%; }
  .board.doubled .shimmer { opacity: 1; animation: shim 1.5s linear infinite; }
  @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .coral { position: absolute; bottom: 0; font-size: 42px; pointer-events: none; opacity: 0.85; filter: drop-shadow(0 0 4px #000); }

  .creature {
    position: absolute; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; text-align: center;

  }
  .creature .emoji { font-size: var(--sz); line-height: 1; filter: drop-shadow(0 0 6px currentColor); }
  .creature .pts { position: absolute; font-size: 15px; color: #041018; font-weight: 900; text-shadow: 0 0 3px #fff; }
  @keyframes rise {
    0% { transform: translateY(40px) scale(0.4); opacity: 0; }
    18% { transform: translateY(0) scale(1); opacity: 1; }
    80% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(40px) scale(0.4); opacity: 0; }
  }
  .creature.popped { animation: none !important; transform: scale(1.4); opacity: 0; transition: all 0.15s; }

  .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffffaa, #7fd4ff22); pointer-events: none; }
  @keyframes floatup { to { transform: translateY(-480px); opacity: 0; } }

  .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }

  .overlay-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 30px; font-weight: 800; color: #ffe27f; text-shadow: 0 0 12px #ff9500; pointer-events: none; opacity: 0; }
  .overlay-msg.show { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); } 40% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌊 Deep-Sea Tap Reef 🐟&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the sea creatures before they sink — anglerfish (3), jellyfish (2) and pufferfish (1) give different points. Hit three in a row to light the golden combo and double your points for 5 seconds!&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo-meter&quot;&gt;
      &lt;span class=&quot;combo-fish&quot; id=&quot;cf0&quot;&gt;🐠&lt;/span&gt;
      &lt;span class=&quot;combo-fish&quot; id=&quot;cf1&quot;&gt;🐠&lt;/span&gt;
      &lt;span class=&quot;combo-fish&quot; id=&quot;cf2&quot;&gt;🐠&lt;/span&gt;
      &lt;span class=&quot;combo-label&quot; id=&quot;comboLabel&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;shimmer&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay-msg&quot; id=&quot;overlayMsg&quot;&gt;DOUBLE POINTS!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 448;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var scoreWrap = scoreEl.parentNode;
  var overlayMsg = document.getElementById(&#x27;overlayMsg&#x27;);
  var comboFish = [document.getElementById(&#x27;cf0&#x27;), document.getElementById(&#x27;cf1&#x27;), document.getElementById(&#x27;cf2&#x27;)];
  var comboLabel = document.getElementById(&#x27;comboLabel&#x27;);

  var score = 0, running = false;
  var spawnTimer = null, bubbleTimer = null, elapsedTimer = null;
  var creatureTimeouts = [];
  var bubbleEls = [];
  var elapsed = 0;
  var comboStreak = 0;
  var doubleUntil = 0;

  var TYPES = [
    { emoji: &#x27;🐡&#x27;, pts: 1, sz: 62, life: 2600, color: &#x27;#ffb347&#x27; },   // pufferfish - slow, big
    { emoji: &#x27;🪼&#x27;, pts: 2, sz: 48, life: 1900, color: &#x27;#c78bff&#x27; },   // jellyfish - medium
    { emoji: &#x27;🎣&#x27;, pts: 3, sz: 36, life: 1300, color: &#x27;#7fffd4&#x27; }    // anglerfish (using lure) - fast, small
  ];
  // Use a glowing fish emoji for anglerfish; fallback handled by rendering
  TYPES[2].emoji = &#x27;🐟&#x27;;

  var CORALS = [&#x27;🪸&#x27;,&#x27;🌿&#x27;,&#x27;🪸&#x27;,&#x27;🌱&#x27;,&#x27;🪸&#x27;];

  function addCorals() {
    var xs = [20, 170, 340, 480, 590];
    for (var i = 0; i &lt; xs.length; i++) {
      var c = document.createElement(&#x27;div&#x27;);
      c.className = &#x27;coral&#x27;;
      c.textContent = CORALS[i];
      c.style.left = xs[i] + &#x27;px&#x27;;
      c.style.fontSize = (34 + Math.random()*20) + &#x27;px&#x27;;
      board.appendChild(c);
    }
  }

  function isDoubled() { return Date.now() &lt; doubleUntil; }

  function setCombo(n) {
    comboStreak = n;
    for (var i = 0; i &lt; 3; i++) {
      comboFish[i].classList.toggle(&#x27;lit&#x27;, i &lt; n || (n &gt;= 3));
    }
    if (n &gt;= 3) {
      for (var j = 0; j &lt; 3; j++) comboFish[j].classList.add(&#x27;lit&#x27;);
    } else if (n === 0) {
      for (var j = 0; j &lt; 3; j++) comboFish[j].classList.remove(&#x27;lit&#x27;);
    }
  }

  function triggerDouble() {
    doubleUntil = Date.now() + 5000;
    board.classList.add(&#x27;doubled&#x27;);
    overlayMsg.classList.remove(&#x27;show&#x27;);
    void overlayMsg.offsetWidth;
    overlayMsg.classList.add(&#x27;show&#x27;);
    comboLabel.textContent = &#x27;x2!&#x27;;
    setTimeout(function () {
      if (!isDoubled()) { board.classList.remove(&#x27;doubled&#x27;); comboLabel.textContent = &#x27;&#x27;; }
    }, 5050);
  }

  function pulseScore() {
    scoreWrap.classList.remove(&#x27;pulse&#x27;);
    void scoreWrap.offsetWidth;
    scoreWrap.classList.add(&#x27;pulse&#x27;);
    setTimeout(function () { scoreWrap.classList.remove(&#x27;pulse&#x27;); }, 130);
  }

  function burst(x, y, color) {
    var colors = [&#x27;#7fffd4&#x27;, &#x27;#ffe27f&#x27;, &#x27;#ff7fa8&#x27;, &#x27;#7fd4ff&#x27;, color];
    for (var i = 0; i &lt; 12; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      p.style.left = x + &#x27;px&#x27;;
      p.style.top = y + &#x27;px&#x27;;
      p.style.background = colors[i % colors.length];
      board.appendChild(p);
      var ang = Math.random() * Math.PI * 2;
      var dist = 30 + Math.random() * 40;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      (function (pp, ddx, ddy) {
        pp.animate([
          { transform: &#x27;translate(0,0) scale(1)&#x27;, opacity: 1 },
          { transform: &#x27;translate(&#x27; + ddx + &#x27;px,&#x27; + ddy + &#x27;px) scale(0)&#x27;, opacity: 0 }
        ], { duration: 500 + Math.random()*250, easing: &#x27;ease-out&#x27; });
        setTimeout(function () { if (pp.parentNode) pp.parentNode.removeChild(pp); }, 760);
      })(p, dx, dy);
    }
  }

  function spawnCreature() {
    var t = TYPES[Math.floor(Math.random() * TYPES.length)];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;creature&#x27;;
    el.style.setProperty(&#x27;--sz&#x27;, t.sz + &#x27;px&#x27;);
    el.style.setProperty(&#x27;--life&#x27;, t.life + &#x27;ms&#x27;);
    el.style.color = t.color;
    var maxX = BOARD_W - t.sz - 10;
    var maxY = BOARD_H - t.sz - 40;
    el.style.left = (10 + Math.random() * maxX) + &#x27;px&#x27;;
    el.style.top = (20 + Math.random() * maxY) + &#x27;px&#x27;;

    var em = document.createElement(&#x27;span&#x27;);
    em.className = &#x27;emoji&#x27;;
    em.textContent = t.emoji;
    var pts = document.createElement(&#x27;span&#x27;);
    pts.className = &#x27;pts&#x27;;
    pts.textContent = t.pts;
    el.appendChild(em);
    el.appendChild(pts);

    var done = false;
    el.addEventListener(&#x27;mousedown&#x27;, function (ev) {
      if (done || !running) return;
      done = true;
      var rect = board.getBoundingClientRect();
      var gain = t.pts * (isDoubled() ? 2 : 1);
      score += gain;
      scoreEl.textContent = score;
      pulseScore();
      burst(ev.clientX - rect.left, ev.clientY - rect.top, t.color);
      // combo
      var newStreak = comboStreak + 1;
      if (newStreak &gt;= 3) {
        setCombo(3);
        triggerDouble();
        setCombo(0);
      } else {
        setCombo(newStreak);
      }
      el.classList.add(&#x27;popped&#x27;);
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 160);
    });

    board.appendChild(el);
    // if it disappears un-clicked, break combo
    var to = setTimeout(function () {
      if (!done &amp;&amp; el.parentNode) {
        el.parentNode.removeChild(el);
        setCombo(0);
      }
    }, t.life);
    creatureTimeouts.push(to);
  }

  function currentSpawnInterval() {
    // starts ~1000ms, speeds up as time passes, min 380ms
    return Math.max(380, 1000 - elapsed * 12);
  }

  function scheduleSpawn() {
    if (!running) return;
    // spawn 1-2 creatures, more as time goes on
    var count = 1 + (elapsed &gt; 20 ? 1 : 0) + (Math.random() &lt; Math.min(0.5, elapsed/60) ? 1 : 0);
    for (var i = 0; i &lt; count; i++) spawnCreature();
    spawnTimer = setTimeout(scheduleSpawn, currentSpawnInterval());
  }

  function spawnBubble() {
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;bubble&#x27;;
    var size = 4 + Math.random() * 14;
    b.style.width = size + &#x27;px&#x27;;
    b.style.height = size + &#x27;px&#x27;;
    b.style.left = Math.random() * BOARD_W + &#x27;px&#x27;;
    b.style.top = (BOARD_H + 10) + &#x27;px&#x27;;
    board.appendChild(b);
    bubbleEls.push(b);
    var dur = 4000 + Math.random() * 4000;
    b.animate([
      { transform: &#x27;translateY(0) translateX(0)&#x27;, opacity: 0.7 },
      { transform: &#x27;translateY(-&#x27; + (BOARD_H + 40) + &#x27;px) translateX(&#x27; + (Math.random()*40-20) + &#x27;px)&#x27;, opacity: 0 }
    ], { duration: dur, easing: &#x27;ease-in&#x27; });
    setTimeout(function () {
      if (b.parentNode) b.parentNode.removeChild(b);
      var idx = bubbleEls.indexOf(b); if (idx &gt;= 0) bubbleEls.splice(idx, 1);
    }, dur);
  }

  function clearBoard() {
    for (var i = 0; i &lt; creatureTimeouts.length; i++) clearTimeout(creatureTimeouts[i]);
    creatureTimeouts = [];
    var creatures = board.querySelectorAll(&#x27;.creature, .particle, .bubble&#x27;);
    for (var j = 0; j &lt; creatures.length; j++) creatures[j].parentNode.removeChild(creatures[j]);
    bubbleEls = [];
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; elapsed = 0; comboStreak = 0; doubleUntil = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    comboLabel.textContent = &#x27;&#x27;;
    board.classList.remove(&#x27;doubled&#x27;);
    setCombo(0);
    clearBoard();
    // immediate visible action
    spawnCreature();
    spawnBubble(); spawnBubble(); spawnBubble();
    scheduleSpawn();
    bubbleTimer = setInterval(spawnBubble, 500);
    elapsedTimer = setInterval(function () { elapsed++; }, 1000);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (bubbleTimer) { clearInterval(bubbleTimer); bubbleTimer = null; }
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    clearBoard();
  }

  addCorals();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
