<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #04060f; color: #cfe8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 18px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #6ef2ff; text-shadow: 0 0 8px #29c6ff, 0 0 18px #1084ff; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #8fb6d8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; align-items: center; width: 620px; font-size: 18px; }
  .hud .lbl { color: #6ef2ff; text-shadow: 0 0 6px #1084ff; }
  #combo { color: #ffd166; text-shadow: 0 0 8px #ff8c00; font-weight: 700; }
  #lives { letter-spacing: 2px; }
  .field { position: relative; width: 620px; height: 440px; flex-shrink: 0; background: linear-gradient(#061027, #020814 70%, #041a2e); border-radius: 10px; overflow: hidden; box-shadow: 0 0 24px rgba(20,120,255,0.35) inset, 0 0 12px rgba(30,150,255,0.4); }
  .sub { position: absolute; width: 46px; height: 26px; bottom: 40px; background: radial-gradient(circle at 30% 30%, #7ef9ff, #1789d6); border-radius: 50% 50% 45% 45%/60% 60% 40% 40%; box-shadow: 0 0 14px #29c6ff, 0 0 26px #1084ff; z-index: 5; }
  .sub::after { content:&#x27;&#x27;; position:absolute; right:-8px; top:8px; width:12px; height:10px; background:#1789d6; border-radius:2px; box-shadow:0 0 8px #29c6ff; }
  .bullet { position: absolute; width: 5px; height: 14px; background: #baffff; border-radius: 3px; box-shadow: 0 0 8px #6ef2ff, 0 0 14px #29c6ff; }
  .bullet.rapid { background:#ffe08a; box-shadow:0 0 8px #ffd166, 0 0 14px #ff8c00; }
  .creature { position: absolute; font-size: 30px; line-height: 1; text-align:center; z-index: 3; filter: drop-shadow(0 0 8px currentColor); }
  .orb { position:absolute; width:24px; height:24px; border-radius:50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ff9a1f); box-shadow:0 0 12px #ffd166, 0 0 22px #ff8c00; z-index:3; }
  .part { position:absolute; width:6px; height:6px; border-radius:50%; z-index:4; pointer-events:none; }
  .seaweed { position:absolute; bottom:0; left:0; width:200%; height:44px; z-index:1; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:20; color:#ff5b8a; font-size:44px; font-weight:800; text-shadow:0 0 14px #ff2d6f, 0 0 28px #ff004c; opacity:0; pointer-events:none; }
  .overlay .sub2 { font-size:22px; color:#cfe8ff; text-shadow:0 0 8px #29c6ff; margin-top:8px; }
  @keyframes flashIn { 0%{opacity:0; transform:scale(0.5);} 30%{opacity:1; transform:scale(1.1);} 100%{opacity:1; transform:scale(1);} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;◈ NEON REEF ◈&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and fire torpedoes with &lt;strong&gt;Space&lt;/strong&gt; — blast jellyfish, eels &amp;amp; crabs, and grab glowing orbs for rapid fire. Use the Start/Restart button below; don&#x27;t let creatures reach the bottom!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Score&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div id=&quot;combo&quot;&gt;x1&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Lives&lt;/span&gt; &lt;span id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;svg class=&quot;seaweed&quot; id=&quot;seaweed&quot; viewBox=&quot;0 0 1240 44&quot; preserveAspectRatio=&quot;none&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sub&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div&gt;GAME OVER&lt;/div&gt;&lt;div class=&quot;sub2&quot; id=&quot;finalScore&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W=620, FIELD_H=440;
  var SUB_W=46, SUB_H=26, SUB_BOTTOM=40, SUB_SPEED=6;
  var BW=5, BH=14, BSPEED=8;
  var running=false, animId=null, spawnId=null, orbId=null;
  var keysDown={};
  var subX=(FIELD_W-SUB_W)/2;
  var bullets=[], creatures=[], orbs=[], parts=[], bubbles=[];
  var score=0, lives=3, combo=1, lastShot=0, rapidUntil=0, shakeUntil=0;
  var seaweedOff=0;
  var field=document.getElementById(&#x27;field&#x27;);
  var sub=document.getElementById(&#x27;sub&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var comboEl=document.getElementById(&#x27;combo&#x27;);
  var livesEl=document.getElementById(&#x27;lives&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;);
  var finalScore=document.getElementById(&#x27;finalScore&#x27;);
  var seaweed=document.getElementById(&#x27;seaweed&#x27;);

  // build seaweed
  (function(){
    var s=&#x27;&#x27;;
    for(var i=0;i&lt;24;i++){
      var x=i*52+10, h=18+Math.random()*22, sway=8+Math.random()*8;
      var col=i%2?&#x27;#0fae6e&#x27;:&#x27;#1bd48c&#x27;;
      s+=&#x27;&lt;path d=&quot;M&#x27;+x+&#x27; 44 Q&#x27;+(x-sway)+&#x27; &#x27;+(44-h/2)+&#x27; &#x27;+x+&#x27; &#x27;+(44-h)+&#x27;&quot; stroke=&quot;&#x27;+col+&#x27;&quot; stroke-width=&quot;4&quot; fill=&quot;none&quot; opacity=&quot;0.6&quot;/&gt;&#x27;;
    }
    seaweed.innerHTML=s;
  })();

  function paintSub(){ sub.style.left=subX+&#x27;px&#x27;; }

  var TYPES={
    jelly:{emoji:&#x27;🎐&#x27;,w:34,pts:1,hp:1,speed:1.2,color:&#x27;#ff6ff2&#x27;},
    eel:{emoji:&#x27;🐍&#x27;,w:32,pts:2,hp:1,speed:2.6,color:&#x27;#7dff5b&#x27;},
    crab:{emoji:&#x27;🦀&#x27;,w:34,pts:3,hp:2,speed:1.4,color:&#x27;#ff9a1f&#x27;}
  };

  function spawnCreature(){
    var r=Math.random(), key= r&lt;0.5?&#x27;jelly&#x27;: r&lt;0.8?&#x27;eel&#x27;:&#x27;crab&#x27;;
    var t=TYPES[key];
    var c={key:key,t:t,x:Math.random()*(FIELD_W-t.w),y:-t.w,hp:t.hp,phase:Math.random()*6,el:null};
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;creature&#x27;;
    el.textContent=t.emoji;
    el.style.color=t.color;
    el.style.left=c.x+&#x27;px&#x27;; el.style.top=c.y+&#x27;px&#x27;;
    field.appendChild(el); c.el=el; creatures.push(c);
  }

  function spawnOrb(){
    var o={x:Math.random()*(FIELD_W-24),y:-24,el:null};
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;orb&#x27;;
    el.style.left=o.x+&#x27;px&#x27;; el.style.top=o.y+&#x27;px&#x27;;
    field.appendChild(el); o.el=el; orbs.push(o);
  }

  function fire(){
    var now=Date.now();
    var interval= now&lt;rapidUntil?125:280;
    if(now-lastShot&lt;interval) return;
    lastShot=now;
    var b={x:subX+SUB_W/2-BW/2,y:FIELD_H-SUB_BOTTOM-SUB_H-BH,rapid:now&lt;rapidUntil,el:null};
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;bullet&#x27;+(b.rapid?&#x27; rapid&#x27;:&#x27;&#x27;);
    el.style.left=b.x+&#x27;px&#x27;; el.style.top=b.y+&#x27;px&#x27;;
    field.appendChild(el); b.el=el; bullets.push(b);
  }

  function burst(x,y,color){
    for(var i=0;i&lt;10;i++){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;part&#x27;;
      el.style.background=color; el.style.boxShadow=&#x27;0 0 8px &#x27;+color;
      el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
      field.appendChild(el);
      var a=Math.random()*Math.PI*2, sp=1.5+Math.random()*3;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24,el:el});
    }
  }

  function setCombo(v){ combo=v; comboEl.textContent=&#x27;x&#x27;+combo; }
  function loseLife(){
    lives--; livesEl.textContent=&#x27;❤️&#x27;.repeat(Math.max(0,lives))+&#x27;🖤&#x27;.repeat(3-Math.max(0,lives));
    if(lives&lt;=0) endGame();
  }

  function tick(){
    if(!running) return;
    if(keysDown[&#x27;ArrowLeft&#x27;]) subX-=SUB_SPEED;
    if(keysDown[&#x27;ArrowRight&#x27;]) subX+=SUB_SPEED;
    subX=Math.max(0,Math.min(FIELD_W-SUB_W,subX));
    paintSub();

    // screen shake
    var now=Date.now();
    if(now&lt;shakeUntil){ var m=4; field.style.transform=&#x27;translate(&#x27;+((Math.random()-.5)*m)+&#x27;px,&#x27;+((Math.random()-.5)*m)+&#x27;px)&#x27;; }
    else field.style.transform=&#x27;&#x27;;

    // seaweed parallax
    seaweedOff=(seaweedOff+0.4)%620;
    seaweed.style.transform=&#x27;translateX(-&#x27;+seaweedOff+&#x27;px)&#x27;;

    // bullets
    for(var i=bullets.length-1;i&gt;=0;i--){
      var b=bullets[i]; b.y-=BSPEED;
      if(b.y+BH&lt;0){ field.removeChild(b.el); bullets.splice(i,1); setCombo(1); continue; }
      b.el.style.top=b.y+&#x27;px&#x27;;
    }
    // creatures
    for(var j=creatures.length-1;j&gt;=0;j--){
      var c=creatures[j]; c.y+=c.t.speed;
      if(c.key===&#x27;eel&#x27;){ c.phase+=0.12; c.x+=Math.sin(c.phase)*3.2; c.x=Math.max(0,Math.min(FIELD_W-c.t.w,c.x)); c.el.style.left=c.x+&#x27;px&#x27;; }
      if(c.y&gt;FIELD_H-6){ field.removeChild(c.el); creatures.splice(j,1); loseLife(); continue; }
      c.el.style.top=c.y+&#x27;px&#x27;;
    }
    // orbs
    for(var o=orbs.length-1;o&gt;=0;o--){
      var orb=orbs[o]; orb.y+=1.6;
      if(orb.y&gt;FIELD_H){ field.removeChild(orb.el); orbs.splice(o,1); continue; }
      orb.el.style.top=orb.y+&#x27;px&#x27;;
    }
    // particles
    for(var p=parts.length-1;p&gt;=0;p--){
      var pt=parts[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life--;
      if(pt.life&lt;=0){ field.removeChild(pt.el); parts.splice(p,1); continue; }
      pt.el.style.left=pt.x+&#x27;px&#x27;; pt.el.style.top=pt.y+&#x27;px&#x27;; pt.el.style.opacity=(pt.life/24);
    }
    // bubbles
    for(var bu=bubbles.length-1;bu&gt;=0;bu--){
      var bb=bubbles[bu]; bb.y-=bb.sp; bb.x+=Math.sin(bb.y*0.05)*0.4;
      if(bb.y&lt;-10){ field.removeChild(bb.el); bubbles.splice(bu,1); continue; }
      bb.el.style.top=bb.y+&#x27;px&#x27;; bb.el.style.left=bb.x+&#x27;px&#x27;;
    }
    if(Math.random()&lt;0.15) makeBubble();

    // collisions bullet vs creature/orb
    for(var bi=bullets.length-1;bi&gt;=0;bi--){
      var bl=bullets[bi]; var hit=false;
      for(var oi=orbs.length-1;oi&gt;=0;oi--){
        var ob=orbs[oi];
        if(bl.x&lt;ob.x+24&amp;&amp;bl.x+BW&gt;ob.x&amp;&amp;bl.y&lt;ob.y+24&amp;&amp;bl.y+BH&gt;ob.y){
          burst(ob.x+12,ob.y+12,&#x27;#ffd166&#x27;);
          field.removeChild(ob.el); orbs.splice(oi,1);
          rapidUntil=Date.now()+5000; hit=true; break;
        }
      }
      if(hit){ field.removeChild(bl.el); bullets.splice(bi,1); continue; }
      for(var ci=creatures.length-1;ci&gt;=0;ci--){
        var cr=creatures[ci];
        if(bl.x&lt;cr.x+cr.t.w&amp;&amp;bl.x+BW&gt;cr.x&amp;&amp;bl.y&lt;cr.y+cr.t.w&amp;&amp;bl.y+BH&gt;cr.y){
          burst(cr.x+cr.t.w/2,cr.y+cr.t.w/2,cr.t.color);
          field.removeChild(bl.el); bullets.splice(bi,1);
          cr.hp--;
          if(cr.hp&lt;=0){
            score+=cr.t.pts*combo; scoreEl.textContent=score;
            setCombo(combo+1);
            if(cr.key===&#x27;crab&#x27;) shakeUntil=Date.now()+220;
            field.removeChild(cr.el); creatures.splice(ci,1);
          } else {
            cr.el.style.filter=&#x27;drop-shadow(0 0 14px #fff)&#x27;;
            setTimeout((function(e){return function(){ if(e)e.style.filter=&#x27;drop-shadow(0 0 8px currentColor)&#x27;; };})(cr.el),80);
          }
          hit=true; break;
        }
      }
    }
    animId=requestAnimationFrame(tick);
  }

  function makeBubble(){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;part&#x27;;
    var sz=3+Math.random()*5;
    el.style.width=sz+&#x27;px&#x27;; el.style.height=sz+&#x27;px&#x27;;
    el.style.background=&#x27;rgba(120,200,255,0.25)&#x27;;
    el.style.boxShadow=&#x27;0 0 6px rgba(80,180,255,0.4)&#x27;;
    el.style.zIndex=&#x27;0&#x27;;
    var x=Math.random()*FIELD_W, y=FIELD_H+5;
    el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
    field.appendChild(el);
    bubbles.push({x:x,y:y,sp:0.5+Math.random()*1.2,el:el});
  }

  function clearAll(){
    [bullets,creatures,orbs,parts,bubbles].forEach(function(arr){
      arr.forEach(function(o){ if(o.el&amp;&amp;o.el.parentNode) o.el.parentNode.removeChild(o.el); });
    });
    bullets=[]; creatures=[]; orbs=[]; parts=[]; bubbles=[];
  }

  function startGame(){
    if(running) return;
    clearAll();
    score=0; lives=3; combo=1; rapidUntil=0; shakeUntil=0;
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;x1&#x27;; livesEl.textContent=&#x27;❤️❤️❤️&#x27;;
    overlay.style.opacity=&#x27;0&#x27;; overlay.style.animation=&#x27;&#x27;;
    subX=(FIELD_W-SUB_W)/2;
    for(var k in keysDown) keysDown[k]=false;
    lastShot=0; paintSub();
    running=true;
    spawnCreature();
    animId=requestAnimationFrame(tick);
    spawnId=setInterval(spawnCreature,1100);
    orbId=setInterval(function(){ if(Math.random()&lt;0.7) spawnOrb(); },6000);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    if(orbId){clearInterval(orbId);orbId=null;}
    field.style.transform=&#x27;&#x27;;
    clearAll();
  }
  function endGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    if(orbId){clearInterval(orbId);orbId=null;}
    field.style.transform=&#x27;&#x27;;
    finalScore.textContent=&#x27;Final Score: &#x27;+score;
    overlay.style.animation=&#x27;flashIn 0.6s ease forwards&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
    else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) fire(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  paintSub();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
