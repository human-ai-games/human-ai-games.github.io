<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC DEFENDER ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #cfe8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#4df,#a6f,#f6a); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(90,180,255,.4); }
  .instructions { font-size: 16px; color: #8fb6d9; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 640px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }

  .hud .stat b { color: #6ff; font-size: 19px; }
  #wrap { position: relative; width: 640px; height: 460px; border-radius: 10px; overflow: hidden;
          box-shadow: 0 0 30px rgba(60,120,255,.25), inset 0 0 40px rgba(20,40,90,.6); }
  canvas { display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC DEFENDER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your neon ship with the mouse or ← → keys to bounce the energy orb into the alien rows. Catch falling capsules for power-ups and clear every wave without dropping the orb three times.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;SCORE &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;WAVE &lt;b id=&quot;wave&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;LIVES &lt;span id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var W=640, H=460;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), waveEl=document.getElementById(&#x27;wave&#x27;), livesEl=document.getElementById(&#x27;lives&#x27;);

var running=false, animId=null;
var keys={};
var mouseX=null;

// audio
var AC=null;
function beep(freq,dur,type,vol){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
    g.gain.value=(vol||0.08); o.connect(g); g.connect(AC.destination);
    var t=AC.currentTime; o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.stop(t+(dur||0.12));
  }catch(_){}
}

// state
var PADDLE_BASE=100, PADDLE_H=14, PADDLE_BOTTOM=18;
var paddle;
var balls=[];
var aliens=[];
var particles=[];
var caps=[];
var stars=[[],[],[]];
var score=0, wave=1, lives=3;
var shake=0, flash=0;
var combo=0, comboTimer=0, comboPop=0;
var slowmo=0;

var COLORS=[&#x27;#ff5d73&#x27;,&#x27;#ffb14d&#x27;,&#x27;#ffe14d&#x27;,&#x27;#5dff9e&#x27;,&#x27;#4dd4ff&#x27;,&#x27;#b085ff&#x27;];

function initStars(){
  stars=[[],[],[]];
  var counts=[40,30,20], speeds=[0.25,0.55,1.0], sizes=[1,1.5,2.2];
  for(var l=0;l&lt;3;l++){
    for(var i=0;i&lt;counts[l];i++){
      stars[l].push({x:Math.random()*W, y:Math.random()*H, s:speeds[l], r:sizes[l]});
    }
  }
}

function makePaddle(){
  return {w:PADDLE_BASE, x:(W-PADDLE_BASE)/2, wide:0, trail:[]};
}

function spawnBall(x,y,vx,vy){
  balls.push({x:x,y:y,vx:vx,vy:vy,r:8,speed:Math.hypot(vx,vy)});
}

function buildWave(){
  aliens=[];
  var rows=4+Math.min(2,Math.floor((wave-1)/2));
  var cols=8;
  var aw=58, ah=24, gx=8, gy=10;
  var totalW=cols*aw+(cols-1)*gx;
  var startX=(W-totalW)/2, startY=44;
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;cols;c++){
      aliens.push({
        x:startX+c*(aw+gx), y:startY+r*(ah+gy),
        w:aw, h:ah, alive:true,
        color:COLORS[r%COLORS.length],
        pts:(rows-r)*10,
        row:r
      });
    }
  }
}

function resetBallOnPaddle(){
  balls=[];
  var spd=3.6+0.25*(wave-1);
  spawnBall(paddle.x+paddle.w/2, H-PADDLE_BOTTOM-PADDLE_H-10, spd*(Math.random()&lt;.5?-1:1)*0.6, -spd);
}

function startGame(){
  running=true;
  score=0; wave=1; lives=3;
  paddle=makePaddle();
  initStars();
  buildWave();
  particles=[]; caps=[]; combo=0; comboTimer=0; comboPop=0; slowmo=0; shake=0; flash=0;
  resetBallOnPaddle();
  updateHud();
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

function updateHud(){
  scoreEl.textContent=score;
  waveEl.textContent=wave;
  livesEl.textContent = lives&gt;0 ? &#x27;❤️&#x27;.repeat(lives) : &#x27;💀&#x27;;
}

function explode(x,y,color,n){
  for(var i=0;i&lt;(n||14);i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function maybeCapsule(x,y){
  if(Math.random()&lt;0.12){
    var types=[&#x27;wide&#x27;,&#x27;multi&#x27;,&#x27;slow&#x27;];
    var t=types[Math.floor(Math.random()*types.length)];
    caps.push({x:x,y:y,vy:1.4,type:t});
  }
}

function applyCap(t){
  if(t===&#x27;wide&#x27;){ paddle.wide=600; beep(880,0.15,&#x27;sine&#x27;,0.1); }
  else if(t===&#x27;multi&#x27;){
    beep(1046,0.15,&#x27;sine&#x27;,0.1);
    var cur=balls.slice();
    cur.forEach(function(b){
      spawnBall(b.x,b.y,-b.vy*0.5+ (Math.random()-.5)*2, -Math.abs(b.vy));
    });
  }
  else if(t===&#x27;slow&#x27;){ slowmo=360; beep(440,0.2,&#x27;sine&#x27;,0.1); }
}

function loseLife(){
  lives--;
  paddle.w=Math.max(50, paddle.w-12);
  shake=14; flash=0.6; combo=0;
  beep(120,0.3,&#x27;sawtooth&#x27;,0.12);
  updateHud();
  if(lives&lt;=0){ running=false; gameOver=true; return; }
  resetBallOnPaddle();
}
var gameOver=false;

function rectCircle(cx,cy,r,rx,ry,rw,rh){
  var nx=Math.max(rx,Math.min(cx,rx+rw));
  var ny=Math.max(ry,Math.min(cy,ry+rh));
  var dx=cx-nx, dy=cy-ny;
  return dx*dx+dy*dy&lt;=r*r;
}

function loop(){
  if(!running){ return; }
  var dt = slowmo&gt;0 ? 0.55 : 1;
  if(slowmo&gt;0) slowmo--;

  // input paddle
  var px=paddle.x;
  if(mouseX!==null){ px=mouseX-paddle.w/2; }
  if(keys[&#x27;ArrowLeft&#x27;]) px-=7;
  if(keys[&#x27;ArrowRight&#x27;]) px+=7;
  px=Math.max(0,Math.min(W-paddle.w, px));
  paddle.x=px;

  if(paddle.wide&gt;0){ paddle.wide--; paddle.w=Math.min(PADDLE_BASE*1.7, paddle.w+2); }
  else if(paddle.w&gt;PADDLE_BASE){ paddle.w-=2; }

  var py=H-PADDLE_BOTTOM-PADDLE_H;
  paddle.trail.push({x:paddle.x+paddle.w/2, life:1});
  if(paddle.trail.length&gt;18) paddle.trail.shift();
  paddle.trail.forEach(function(t){ t.life-=0.06; });
  paddle.trail=paddle.trail.filter(function(t){return t.life&gt;0;});

  // stars
  for(var l=0;l&lt;3;l++){
    stars[l].forEach(function(s){
      s.y+=s.s*dt;
      if(s.y&gt;H){ s.y=0; s.x=Math.random()*W; }
    });
  }

  // balls
  for(var i=balls.length-1;i&gt;=0;i--){
    var b=balls[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x-b.r&lt;0){ b.x=b.r; b.vx=-b.vx; }
    if(b.x+b.r&gt;W){ b.x=W-b.r; b.vx=-b.vx; }
    if(b.y-b.r&lt;0){ b.y=b.r; b.vy=-b.vy; }

    // paddle
    if(b.vy&gt;0 &amp;&amp; rectCircle(b.x,b.y,b.r,paddle.x,py,paddle.w,PADDLE_H)){
      b.vy=-Math.abs(b.vy);
      b.y=py-b.r;
      var hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      var spd=Math.min(9, b.speed+0.15);
      b.speed=spd;
      var ang=hit*1.0;
      b.vx=Math.sin(ang)*spd;
      b.vy=-Math.abs(Math.cos(ang)*spd);
      combo=0;
      flash=0.15;
      beep(300,0.06,&#x27;square&#x27;,0.06);
    }

    // aliens
    for(var a=0;a&lt;aliens.length;a++){
      var al=aliens[a];
      if(!al.alive) continue;
      if(rectCircle(b.x,b.y,b.r,al.x,al.y,al.w,al.h)){
        al.alive=false;
        // bounce direction
        var ox=b.x-(al.x+al.w/2), oy=b.y-(al.y+al.h/2);
        if(Math.abs(ox/al.w)&gt;Math.abs(oy/al.h)) b.vx=-b.vx; else b.vy=-b.vy;
        combo++;
        comboTimer=90;
        if(combo&gt;1) comboPop=1;
        var mult=combo&gt;1?combo:1;
        score+=al.pts*mult;
        explode(al.x+al.w/2, al.y+al.h/2, al.color, 16);
        maybeCapsule(al.x+al.w/2, al.y+al.h/2);
        shake=Math.min(10,shake+4); flash=Math.max(flash,0.25);
        beep(500+al.pts*4,0.07,&#x27;square&#x27;,0.07);
        updateHud();
        break;
      }
    }

    if(b.y-b.r&gt;H){ balls.splice(i,1); }
  }

  if(balls.length===0 &amp;&amp; running){
    loseLife();
  }

  // combo decay
  if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0) combo=0; }
  if(comboPop&gt;0) comboPop-=0.04;

  // wave clear
  var anyAlive=aliens.some(function(a){return a.alive;});
  if(!anyAlive &amp;&amp; running){
    wave++;
    flash=0.5; shake=8;
    beep(700,0.3,&#x27;sine&#x27;,0.1);
    buildWave();
    resetBallOnPaddle();
    updateHud();
  }

  // caps
  for(var c=caps.length-1;c&gt;=0;c--){
    var cap=caps[c];
    cap.y+=cap.vy*dt;
    if(cap.y&gt;py-8 &amp;&amp; cap.y&lt;py+PADDLE_H+8 &amp;&amp; cap.x&gt;paddle.x-6 &amp;&amp; cap.x&lt;paddle.x+paddle.w+6){
      applyCap(cap.type); caps.splice(c,1); flash=0.2; continue;
    }
    if(cap.y&gt;H) caps.splice(c,1);
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=0.06*dt; pt.life-=0.03;
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  if(shake&gt;0) shake*=0.85;
  if(flash&gt;0) flash-=0.04;

  draw();
  animId=requestAnimationFrame(loop);
}

function draw(){
  ctx.save();
  var sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);

  // bg
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#0a0620&#x27;); g.addColorStop(1,&#x27;#03010a&#x27;);
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

  // stars
  var scol=[&#x27;#3a5a8a&#x27;,&#x27;#7fa8d8&#x27;,&#x27;#eaf4ff&#x27;];
  for(var l=0;l&lt;3;l++){
    ctx.fillStyle=scol[l];
    stars[l].forEach(function(s){
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    });
  }

  // aliens
  aliens.forEach(function(al){
    if(!al.alive) return;
    ctx.save();
    ctx.shadowColor=al.color; ctx.shadowBlur=10;
    ctx.fillStyle=al.color;
    roundRect(al.x,al.y,al.w,al.h,6); ctx.fill();
    // eyes
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(0,0,0,.55)&#x27;;
    ctx.beginPath(); ctx.arc(al.x+al.w*0.35,al.y+al.h*0.5,3.2,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(al.x+al.w*0.65,al.y+al.h*0.5,3.2,0,7); ctx.fill();
    ctx.restore();
  });

  // capsules
  caps.forEach(function(cap){
    var col= cap.type===&#x27;wide&#x27;?&#x27;#5dff9e&#x27;:cap.type===&#x27;multi&#x27;?&#x27;#ffe14d&#x27;:&#x27;#4dd4ff&#x27;;
    var lbl= cap.type===&#x27;wide&#x27;?&#x27;W&#x27;:cap.type===&#x27;multi&#x27;?&#x27;M&#x27;:&#x27;S&#x27;;
    ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col;
    roundRect(cap.x-13,cap.y-7,26,14,7); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle=&#x27;#04030a&#x27;; ctx.font=&#x27;bold 11px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(lbl,cap.x,cap.y);
    ctx.restore();
  });

  // paddle trail
  paddle.trail.forEach(function(t){
    ctx.fillStyle=&#x27;rgba(80,230,255,&#x27;+(t.life*0.18)+&#x27;)&#x27;;
    var py=H-PADDLE_BOTTOM-PADDLE_H;
    ctx.beginPath(); ctx.arc(t.x, py+PADDLE_H/2, 8*t.life+3, 0, 7); ctx.fill();
  });

  // paddle
  var py=H-PADDLE_BOTTOM-PADDLE_H;
  ctx.save();
  ctx.shadowColor=&#x27;#4df&#x27;; ctx.shadowBlur=18;
  var pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  pg.addColorStop(0,&#x27;#2ad&#x27;); pg.addColorStop(0.5,&#x27;#9ff&#x27;); pg.addColorStop(1,&#x27;#2ad&#x27;);
  ctx.fillStyle=pg;
  roundRect(paddle.x,py,paddle.w,PADDLE_H,7); ctx.fill();
  ctx.restore();

  // balls
  balls.forEach(function(b){
    ctx.save();
    ctx.shadowColor=&#x27;#fff&#x27;; ctx.shadowBlur=16;
    var bg=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r);
    bg.addColorStop(0,&#x27;#fff&#x27;); bg.addColorStop(0.5,&#x27;#7ff&#x27;); bg.addColorStop(1,&#x27;#08f&#x27;);
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    ctx.restore();
  });

  // particles
  particles.forEach(function(pt){
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3*pt.life+1,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;

  // combo pop
  if(combo&gt;1 &amp;&amp; comboTimer&gt;0){
    var sc=1+ (comboPop&gt;0?comboPop*0.6:0);
    ctx.save();
    ctx.translate(W/2, 150);
    ctx.scale(sc,sc);
    ctx.font=&#x27;bold 40px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.shadowColor=&#x27;#f6a&#x27;; ctx.shadowBlur=20;
    ctx.fillStyle=&#x27;#ffdf6b&#x27;;
    ctx.fillText(&#x27;x&#x27;+combo+&#x27; COMBO!&#x27;,0,0);
    ctx.restore();
  }

  if(slowmo&gt;0){
    ctx.fillStyle=&#x27;rgba(77,212,255,&#x27;+(0.06)+&#x27;)&#x27;;
    ctx.fillRect(-20,-20,W+40,H+40);
  }

  ctx.restore();

  // flash overlay
  if(flash&gt;0){
    ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.4)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  if(gameOver){
    ctx.fillStyle=&#x27;rgba(0,0,0,.65)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#ff6b8b&#x27;; ctx.font=&#x27;bold 44px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.shadowColor=&#x27;#f06&#x27;; ctx.shadowBlur=20;
    ctx.fillText(&#x27;GAME OVER&#x27;,W/2,H/2-10);
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#cfe8ff&#x27;; ctx.font=&#x27;20px system-ui&#x27;;
    ctx.fillText(&#x27;Score &#x27;+score+&#x27; · Wave &#x27;+wave,W/2,H/2+30);
    ctx.font=&#x27;16px system-ui&#x27;; ctx.fillStyle=&#x27;#8fb6d9&#x27;;
    ctx.fillText(&#x27;Press Restart below to play again&#x27;,W/2,H/2+60);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; mouseX=null; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;){ gameOver=false; startGame(); }
  else if(e.data.type===&#x27;wd_stop&#x27;){ stopGame(); }
});

// initial static frame
paddle=makePaddle(); initStars(); buildWave(); resetBallOnPaddle();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
