<html lang="en">
<head>

<title>NEON SERPENT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05070d; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #0ff;
       text-shadow: 0 0 8px #0ff, 0 0 18px #077; }
  .instructions { font-size: 16px; color: #8ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 22px; width: 600px; }
  .score { font-size: 30px; font-weight: 800; color: #0ff; text-shadow: 0 0 8px #0ff; transition: color .12s, text-shadow .12s; }
  .score.pulse { color: #fff; text-shadow: 0 0 14px #fff, 0 0 24px #0ff; }
  .sub { font-size: 15px; color: #79a; }
  .tier { font-size: 15px; color: #f6c; text-shadow: 0 0 6px #a29; }

  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0;
           background:
             repeating-linear-gradient(0deg, transparent 0 19px, #10161f 19px 20px),
             repeating-linear-gradient(90deg, transparent 0 19px, #10161f 19px 20px),
             #080b12;
           border-radius: 8px; overflow: hidden;
           border: 2px solid #0aa; box-shadow: 0 0 12px #077 inset, 0 0 10px #044; }
  .field.pulseWall { animation: wallPulse 1.6s ease-in-out infinite; }
  @keyframes wallPulse {
    0%,100% { box-shadow: 0 0 10px #044 inset, 0 0 6px #033; border-color:#088; }
    50% { box-shadow: 0 0 20px #0dd inset, 0 0 18px #0aa; border-color:#0ff; }
  }
  .cell { position: absolute; box-sizing: border-box; }

  .seg { border-radius: 3px; background: #0ff; }
  .seg.head { background:#8ffff0; box-shadow:0 0 10px #0ff, 0 0 16px #0aa; }
  .seg.dead { background:#f33 !important; box-shadow:0 0 12px #f00 !important; }

  .star { color:#fd3; font-size:16px; text-align:center; line-height:20px;
          text-shadow:0 0 8px #fa0; animation: starPulse .8s ease-in-out infinite; }
  @keyframes starPulse { 0%,100%{transform:scale(.85);} 50%{transform:scale(1.15);} }
  .gem { color:#f2f; font-size:16px; text-align:center; line-height:20px;
         text-shadow:0 0 10px #f0f; animation: gemFlash .35s steps(1) infinite; }
  @keyframes gemFlash { 0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;} }
  .orb { font-size:16px; text-align:center; line-height:20px; animation: orbSpin 1s linear infinite; }
  @keyframes orbSpin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }

  .particle { position:absolute; width:6px; height:6px; border-radius:50%; pointer-events:none; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(3,5,10,.82); opacity:0; pointer-events:none; transition:opacity .5s; text-align:center; }
  .overlay.show { opacity:1; }
  .overlay .go { font-size:38px; font-weight:800; color:#f44; text-shadow:0 0 14px #f00; letter-spacing:2px; }
  .overlay .fs { font-size:22px; color:#0ff; text-shadow:0 0 8px #0ff; margin-top:10px; }
  .overlay .bs { font-size:18px; color:#fd3; text-shadow:0 0 6px #fa0; margin-top:4px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys (or swipe) to eat glowing pickups: gold star = 1, magenta gem = 3, rainbow orb = 5. Avoid the walls and your own tail — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
    &lt;div class=&quot;sub&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tier&quot;&gt;Speed &lt;span id=&quot;tier&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;go&quot;&gt;GAME OVER&lt;/div&gt;
      &lt;div class=&quot;fs&quot;&gt;Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bs&quot;&gt;Best: &lt;span id=&quot;bestScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL=20, COLS=30, ROWS=22;
  var running=false, tickId=null;
  var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
  var score=0, best=0, tier=1;
  var field=document.getElementById(&#x27;field&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var bestEl=document.getElementById(&#x27;best&#x27;);
  var tierEl=document.getElementById(&#x27;tier&#x27;);

  // pickups
  var star=null;              // {x,y} always present
  var gem=null, gemUntil=0;   // 3 pts, 5s life
  var orb=null, orbUntil=0;   // 5 pts, 3s life, rare
  var lastGemTry=0, lastOrbTry=0;

  var segEls=[]; // reuse

  function baseSpeed(){ return Math.max(60, 150 - (tier-1)*16); }

  function occupied(x,y){
    for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    return false;
  }
  function pickupHere(x,y){
    if(star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
    if(gem&amp;&amp;gem.x===x&amp;&amp;gem.y===y) return true;
    if(orb&amp;&amp;orb.x===x&amp;&amp;orb.y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)&amp;&amp;!pickupHere(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function initSnake(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function clearDynamic(){
    // remove everything except overlay
    var kids=Array.prototype.slice.call(field.children);
    for(var i=0;i&lt;kids.length;i++) if(kids[i]!==overlay) field.removeChild(kids[i]);
    segEls=[];
  }

  function makeCell(cls,x,y){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell &#x27;+cls;
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
    return el;
  }

  function paint(){
    clearDynamic();
    if(star){ var s=makeCell(&#x27;star&#x27;,star.x,star.y); s.textContent=&#x27;★&#x27;; }
    if(gem){ var g=makeCell(&#x27;gem&#x27;,gem.x,gem.y); g.textContent=&#x27;◆&#x27;; }
    if(orb){ var o=makeCell(&#x27;orb&#x27;,orb.x,orb.y); o.textContent=&#x27;🌈&#x27;; }
    for(var i=0;i&lt;snake.length;i++){
      var isHead=(i===0);
      var e=makeCell(&#x27;seg&#x27;+(isHead?&#x27; head&#x27;:&#x27;&#x27;),snake[i].x,snake[i].y);
      var fade=1-(i/snake.length)*0.7;
      e.style.opacity=fade.toFixed(2);
      segEls.push(e);
    }
  }

  function burst(x,y,colors){
    var cx=x*CELL+CELL/2, cy=y*CELL+CELL/2;
    for(var i=0;i&lt;10;i++){
      var p=document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;;
      p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
      p.style.background=colors[i%colors.length];
      p.style.boxShadow=&#x27;0 0 6px &#x27;+colors[i%colors.length];
      field.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=18+Math.random()*22;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.animate([
        {transform:&#x27;translate(0,0)&#x27;,opacity:1},
        {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;,opacity:0}
      ],{duration:450,easing:&#x27;ease-out&#x27;});
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },460); })(p);
    }
  }

  function pulseScore(){
    scoreEl.classList.add(&#x27;pulse&#x27;);
    setTimeout(function(){ scoreEl.classList.remove(&#x27;pulse&#x27;); },160);
  }

  function addScore(n){
    score+=n;
    scoreEl.textContent=score;
    pulseScore();
    var newTier=Math.floor(score/5)+1;
    if(newTier!==tier){ tier=newTier; tierEl.textContent=tier; restartTimer(); }
  }

  function restartTimer(){
    if(tickId) clearInterval(tickId);
    if(running) tickId=setInterval(tick,baseSpeed());
  }

  function maybeSpawnExtras(now){
    if(!gem &amp;&amp; now-lastGemTry&gt;1500){
      lastGemTry=now;
      if(Math.random()&lt;0.5){ gem=freeCell(); gemUntil=now+5000; }
    }
    if(gem &amp;&amp; now&gt;gemUntil) gem=null;

    if(!orb &amp;&amp; now-lastOrbTry&gt;4000){
      lastOrbTry=now;
      if(Math.random()&lt;0.28){ orb=freeCell(); orbUntil=now+3000; }
    }
    if(orb &amp;&amp; now&gt;orbUntil) orb=null;
  }

  function tick(){
    if(!running) return;
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }

    var ateStar=(star&amp;&amp;nx===star.x&amp;&amp;ny===star.y);
    var ateGem=(gem&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y);
    var ateOrb=(orb&amp;&amp;nx===orb.x&amp;&amp;ny===orb.y);
    var grow=ateStar||ateGem||ateOrb;

    var body=grow?snake:snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }

    snake.unshift({x:nx,y:ny});
    if(ateStar){ addScore(1); burst(nx,ny,[&#x27;#fd3&#x27;,&#x27;#fa0&#x27;,&#x27;#fff&#x27;]); star=freeCell(); }
    else if(ateGem){ addScore(3); burst(nx,ny,[&#x27;#f2f&#x27;,&#x27;#f0f&#x27;,&#x27;#c0f&#x27;,&#x27;#fff&#x27;]); gem=null; }
    else if(ateOrb){ addScore(5); burst(nx,ny,[&#x27;#f33&#x27;,&#x27;#3f3&#x27;,&#x27;#33f&#x27;,&#x27;#ff3&#x27;,&#x27;#f3f&#x27;]); orb=null; }
    else snake.pop();

    var now=Date.now();
    maybeSpawnExtras(now);
    paint();
  }

  function deathRipple(){
    for(var i=0;i&lt;segEls.length;i++){
      (function(el,idx){
        setTimeout(function(){ if(el) el.classList.add(&#x27;dead&#x27;); }, idx*45);
      })(segEls[i],i);
    }
    setTimeout(function(){
      field.classList.remove(&#x27;pulseWall&#x27;);
      overlay.classList.add(&#x27;show&#x27;);
    }, segEls.length*45+250);
  }

  function endGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
    if(score&gt;best){ best=score; bestEl.textContent=best; }
    document.getElementById(&#x27;finalScore&#x27;).textContent=score;
    document.getElementById(&#x27;bestScore&#x27;).textContent=best;
    deathRipple();
  }

  function startGame(){
    if(tickId){ clearInterval(tickId); tickId=null; }
    running=true;
    score=0; tier=1;
    scoreEl.textContent=&#x27;0&#x27;; tierEl.textContent=&#x27;1&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    field.classList.add(&#x27;pulseWall&#x27;);
    initSnake();
    star=freeCell(); gem=null; orb=null;
    lastGemTry=Date.now(); lastOrbTry=Date.now();
    paint();
    tickId=setInterval(tick,baseSpeed());
  }
  function stopGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
  });

  // swipe controls
  var tsx=0, tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){
    var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY;
  },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;12&amp;&amp;Math.abs(dy)&lt;12) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) setDir(dx&gt;0?1:-1,0);
    else setDir(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial idle paint
  initSnake();
  star={x:20,y:11};
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
