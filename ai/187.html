&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Slide falling fruit with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt; (or tap field sides) and &lt;strong&gt;&amp;darr;&lt;/strong&gt; (or tap center) to slam down. Line up 3+ matching fruit to burst them for points!&lt;/p&gt;
  &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;
    &lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Combo&lt;/div&gt;&lt;div class=&quot;val combo&quot; id=&quot;combo&quot;&gt;x1&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
  var CELL = 56, COLS = 6, ROWS = 8;
  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;];
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;), banner = document.getElementById(&#x27;banner&#x27;);
  var over = document.getElementById(&#x27;over&#x27;), finalScore = document.getElementById(&#x27;finalscore&#x27;);
  var TIER_COLORS = [&#x27;#1b5e20&#x27;,&#x27;#00695c&#x27;,&#x27;#5d4037&#x27;,&#x27;#4527a0&#x27;,&#x27;#ad1457&#x27;];

  var grid, piece, score, combo, comboTimer, running, dropId, tickId;
  var dropMs, tier, timeLeft;
  var audioCtx;

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(_) {}
  }

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function spawnPiece() {
    piece = { x: Math.floor(COLS/2), y: 0, f: FRUITS[Math.floor(Math.random()*FRUITS.length)] };
    if (grid[0][piece.x]) return false;
    return true;
  }

  function drawCell(cx, cy, fruit, extraClass) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell&#x27; + (extraClass?(&#x27; &#x27;+extraClass):&#x27;&#x27;);
    el.style.left = (cx*CELL)+&#x27;px&#x27;;
    el.style.top = (cy*CELL)+&#x27;px&#x27;;
    el.style.width = CELL+&#x27;px&#x27;; el.style.height = CELL+&#x27;px&#x27;;
    el.textContent = fruit;
    field.appendChild(el);
    return el;
  }

  function paint() {
    // remove existing cells (keep grass + over)
    var cells = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i=0;i&lt;cells.length;i++) cells[i].remove();
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++) if (grid[r][c]) drawCell(c,r,grid[r][c]);
    if (piece) drawCell(piece.x, piece.y, piece.f);
  }

  function landRow(x) {
    for (var r=ROWS-1;r&gt;=0;r--) if (!grid[r][x]) return r;
    return -1;
  }

  function lockPiece() {
    var r = landRow(piece.x);
    if (r &lt; 0) { piece.y = 0; return false; }
    grid[r][piece.x] = piece.f;
    piece = null;
    return true;
  }

  function findMatches() {
    var toClear = {};
    // horizontal
    for (var r=0;r&lt;ROWS;r++){
      var run=1;
      for (var c=1;c&lt;=COLS;c++){
        if (c&lt;COLS &amp;&amp; grid[r][c] &amp;&amp; grid[r][c]===grid[r][c-1]) run++;
        else { if (run&gt;=3) for(var k=c-run;k&lt;c;k++) toClear[r+&#x27;,&#x27;+k]=true; run=1; }
      }
    }
    // vertical
    for (var c=0;c&lt;COLS;c++){
      var run2=1;
      for (var r2=1;r2&lt;=ROWS;r2++){
        if (r2&lt;ROWS &amp;&amp; grid[r2][c] &amp;&amp; grid[r2][c]===grid[r2-1][c]) run2++;
        else { if (run2&gt;=3) for(var k2=r2-run2;k2&lt;r2;k2++) toClear[k2+&#x27;,&#x27;+c]=true; run2=1; }
      }
    }
    return toClear;
  }

  function runMatch(cascade) {
    var toClear = findMatches();
    var keys = Object.keys(toClear);
    if (keys.length === 0) {
      spawnAndCheck();
      return;
    }
    // score by number cleared this pass
    var n = keys.length;
    var pts = n&gt;=5?50 : n&gt;=4?25 : 10;
    combo = Math.min(combo + 1, 9);
    var gained = pts * combo;
    score += gained;
    scoreEl.textContent = score;
    comboEl.textContent = &#x27;x&#x27; + combo;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function(){ combo=1; comboEl.textContent=&#x27;x1&#x27;; }, 2200);
    beep(660 + n*40, 0.18, &#x27;triangle&#x27;);

    // burst animation
    for (var i=0;i&lt;keys.length;i++){
      var p = keys[i].split(&#x27;,&#x27;); var r=+p[0], c=+p[1];
      var b = drawCell(c, r, grid[r][c], &#x27;burst&#x27;);
      (function(b){ setTimeout(function(){ b.remove(); }, 350); })(b);
      grid[r][c] = null;
    }
    // gravity
    setTimeout(function(){
      applyGravity();
      paint();
      setTimeout(function(){ runMatch(true); }, 100);
    }, 300);
  }

  function applyGravity() {
    for (var c=0;c&lt;COLS;c++){
      var stack=[];
      for (var r=ROWS-1;r&gt;=0;r--) if (grid[r][c]) stack.push(grid[r][c]);
      for (var r2=ROWS-1;r2&gt;=0;r2--) grid[r2][c] = stack[ROWS-1-r2] || null;
    }
  }

  function spawnAndCheck() {
    if (!spawnPiece()) { doGameOver(); return; }
    paint();
  }

  function doGameOver() {
    // shake the fullest column red
    var colEl = document.createElement(&#x27;div&#x27;);
    colEl.className = &#x27;colshake&#x27;;
    var fullX = piece ? piece.x : 0;
    colEl.style.left = (fullX*CELL)+&#x27;px&#x27;;
    colEl.style.top = &#x27;0px&#x27;;
    colEl.style.width = CELL+&#x27;px&#x27;;
    colEl.style.height = (ROWS*CELL)+&#x27;px&#x27;;
    field.insertBefore(colEl, over);
    field.classList.add(&#x27;shake&#x27;);
    beep(160,0.4,&#x27;sawtooth&#x27;);
    setTimeout(function(){ endRun(); }, 700);
  }

  function endRun() {
    running = false;
    clearInterval(dropId); clearInterval(tickId);
    finalScore.textContent = &#x27;Score: &#x27; + score;
    over.style.display = &#x27;flex&#x27;;
  }

  function stepDown() {
    if (!piece || !running) return;
    var below = piece.y + 1;
    if (below &gt;= ROWS || grid[below][piece.x]) {
      lockPiece();
      runMatch(false);
    } else {
      piece.y = below;
      paint();
    }
  }

  function slamDown() {
    if (!piece || !running) return;
    var r = landRow(piece.x);
    if (r &lt; 0) { doGameOver(); return; }
    piece.y = r;
    paint();
    lockPiece();
    runMatch(false);
  }

  function move(dx) {
    if (!running || !piece) return;
    var nx = piece.x + dx;
    if (nx &lt; 0 || nx &gt;= COLS) return;
    if (grid[piece.y][nx]) return;
    piece.x = nx;
    paint();
  }

  function tick() {
    if (!running) return;
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft % 15 === 0 &amp;&amp; timeLeft &gt; 0) {
      tier = Math.min(tier+1, TIER_COLORS.length-1);
      dropMs = Math.max(180, dropMs - 90);
      clearInterval(dropId);
      dropId = setInterval(stepDown, dropMs);
      banner.style.background = TIER_COLORS[tier];
      beep(880,0.15,&#x27;square&#x27;);
    }
    if (timeLeft &lt;= 0) endRun();
  }

  function startGame() {
    if (running) return;
    newGrid();
    score = 0; combo = 1; tier = 0; dropMs = 620; timeLeft = 60;
    scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;x1&#x27;; timeEl.textContent = &#x27;60&#x27;;
    banner.style.background = TIER_COLORS[0];
    over.style.display = &#x27;none&#x27;;
    field.classList.remove(&#x27;shake&#x27;);
    var cs = field.querySelectorAll(&#x27;.colshake&#x27;); for(var i=0;i&lt;cs.length;i++) cs[i].remove();
    if (!spawnPiece()) return;
    paint();
    running = true;
    dropId = setInterval(stepDown, dropMs);
    tickId = setInterval(tick, 1000);
  }

  function stopGame() {
    running = false;
    clearInterval(dropId); clearInterval(tickId);
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { slamDown(); e.preventDefault(); }
  });

  field.addEventListener(&#x27;mousedown&#x27;, function(e){
    if (!running) return;
    var rect = field.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (x &lt; rect.width*0.35) move(-1);
    else if (x &gt; rect.width*0.65) move(1);
    else slamDown();
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint
  newGrid();
  piece = { x: Math.floor(COLS/2), y: 0, f: FRUITS[0] };
  paint();
&lt;/script&gt;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM

 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {

      }
    } catch (_) {}

  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;

        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });

  function reportSize() {
    try {

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
