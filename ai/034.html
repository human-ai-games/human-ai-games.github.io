<!doctype html>
<html lang="en">
<head>

<title>COSMIC DEFENDER</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#b34dff,#4dd2ff,#ff7a1a);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(140,80,255,.4); }
  .instructions { font-size: 16px; color: #9fb; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; color:#8fd; }
  .hud { display:flex; gap:18px; align-items:center; justify-content:center; }
  .hud .box { text-align:center; }
  .hud .lbl { font-size:12px; letter-spacing:1px; color:#7a7ab0; text-transform:uppercase; }
  #score { font-size:34px; font-weight:900; color:#4dd2ff; text-shadow:0 0 14px #4dd2ff; line-height:1; }
  #combo { font-size:22px; font-weight:800; color:#ff7a1a; text-shadow:0 0 12px #ff7a1a; line-height:1; }
  #wave { font-size:22px; font-weight:800; color:#b34dff; text-shadow:0 0 12px #b34dff; line-height:1; }
  .field { position: relative; width: 640px; height: 470px; flex-shrink: 0;
           background:#05010f; border-radius:10px; overflow:hidden;
           box-shadow:0 0 30px rgba(120,60,255,.25), inset 0 0 40px rgba(0,0,0,.8);
           border:1px solid #2a1b55; }
  canvas { display:block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your neon ship with the mouse or arrow keys and bounce the plasma orb into the falling asteroids to smash them. Small asteroids score more, keep your combo alive, and don&#x27;t let the orb slip past!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Score&lt;/div&gt;&lt;div id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Combo&lt;/div&gt;&lt;div id=&quot;combo&quot;&gt;x1&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Wave&lt;/div&gt;&lt;div id=&quot;wave&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var W = 640, H = 470;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;),
      comboEl = document.getElementById(&#x27;combo&#x27;),
      waveEl  = document.getElementById(&#x27;wave&#x27;);

  var running = false, animId = null;
  var keysDown = {};

  // ship paddle
  var PADDLE_W = 110, PADDLE_H = 16, PADDLE_BOTTOM = 14, PADDLE_SPEED = 8;
  var paddleX, paddleFlash = 0, paddleColor = &#x27;#4dd2ff&#x27;;

  // orb
  var ORB_R = 9;
  var orbX, orbY, orbVX, orbVY, orbSpeed;
  var trail = [];

  var score, combo, wave, spawnedForWave;
  var asteroids = [];
  var particles = [];

  // starfield parallax layers
  var stars = [];
  function initStars() {
    stars = [];
    var layers = [{n:40,s:0.3,sz:1,c:&#x27;#556&#x27;},{n:30,s:0.7,sz:1.6,c:&#x27;#88a&#x27;},{n:18,s:1.3,sz:2.3,c:&#x27;#cce&#x27;}];
    layers.forEach(function(L){
      for (var i=0;i&lt;L.n;i++){
        stars.push({x:Math.random()*W, y:Math.random()*H, s:L.s, sz:L.sz, c:L.c});
      }
    });
  }

  var AST_COLORS = [&#x27;#b34dff&#x27;,&#x27;#4dd2ff&#x27;,&#x27;#ff7a1a&#x27;,&#x27;#ff4d88&#x27;,&#x27;#66ff99&#x27;];

  function makeAsteroid(speedBoost) {
    var r = 14 + Math.random()*26;
    return {
      x: 30 + Math.random()*(W-60),
      y: -r - Math.random()*120,
      r: r,
      vx: (Math.random()-0.5)*1.6,
      vy: 1 + Math.random()*1.6 + speedBoost,
      color: AST_COLORS[(Math.random()*AST_COLORS.length)|0],
      rot: Math.random()*Math.PI, vr:(Math.random()-0.5)*0.06
    };
  }

  function asteroidValue(r){
    // small = more points. r ranges ~14..40
    return Math.max(1, Math.round((44 - r) / 5)); // ~1..6
  }

  function spawnWave() {
    var count = 3 + wave;
    var boost = (wave-1)*0.35;
    for (var i=0;i&lt;count;i++) asteroids.push(makeAsteroid(boost));
  }

  function resetOrb() {
    orbX = W/2; orbY = H/2;
    orbSpeed = 4.4;
    var ang = -Math.PI/2 + (Math.random()-0.5)*1.2;
    // send downward-ish or up; start going down toward paddle occasionally
    orbVX = Math.cos(ang)*orbSpeed;
    orbVY = Math.abs(Math.sin(ang))*orbSpeed; // start moving down
    if (Math.random()&lt;0.5) orbVX = -orbVX;
    trail = [];
  }

  function startGame() {
    if (running) return;
    score = 0; combo = 1; wave = 1; spawnedForWave = 0;
    paddleX = (W-PADDLE_W)/2;
    paddleFlash = 0;
    asteroids = []; particles = [];
    initStars();
    for (var k in keysDown) keysDown[k]=false;
    resetOrb();
    spawnWave();
    updateHUD();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    comboEl.textContent = &#x27;x&#x27; + combo;
    waveEl.textContent = wave;
  }

  function burst(x,y,color,n){
    for (var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, sp=1+Math.random()*4;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
    }
  }

  function tick() {
    if (!running) return;

    // paddle keys
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

    // stars
    for (var i=0;i&lt;stars.length;i++){
      stars[i].y += stars[i].s;
      if (stars[i].y &gt; H){ stars[i].y = 0; stars[i].x = Math.random()*W; }
    }

    // orb move
    orbX += orbVX; orbY += orbVY;
    trail.push({x:orbX,y:orbY});
    if (trail.length&gt;16) trail.shift();

    if (orbX &lt; ORB_R){ orbX=ORB_R; orbVX=Math.abs(orbVX); }
    if (orbX &gt; W-ORB_R){ orbX=W-ORB_R; orbVX=-Math.abs(orbVX); }
    if (orbY &lt; ORB_R){ orbY=ORB_R; orbVY=Math.abs(orbVY); }

    // paddle collision
    var paddleTop = H - PADDLE_BOTTOM - PADDLE_H;
    if (orbVY&gt;0 &amp;&amp; orbY+ORB_R&gt;=paddleTop &amp;&amp; orbY+ORB_R&lt;=paddleTop+PADDLE_H+8 &amp;&amp;
        orbX&gt;=paddleX-ORB_R &amp;&amp; orbX&lt;=paddleX+PADDLE_W+ORB_R){
      // deflect based on where it hits
      var rel = (orbX - (paddleX+PADDLE_W/2))/(PADDLE_W/2); // -1..1
      orbSpeed += 0.25;
      var ang = -Math.PI/2 + rel*1.0;
      orbVX = Math.cos(ang)*orbSpeed;
      orbVY = Math.sin(ang)*orbSpeed;
      orbY = paddleTop - ORB_R;
      paddleFlash = 1;
      paddleColor = AST_COLORS[(Math.random()*AST_COLORS.length)|0];
      burst(orbX, paddleTop, paddleColor, 12);
    }

    // orb missed (past bottom)
    if (orbY - ORB_R &gt; H){
      combo = 1;
      score = Math.max(0, score-1);
      updateHUD();
      resetOrb();
    }

    // asteroids
    for (var i=asteroids.length-1;i&gt;=0;i--){
      var a = asteroids[i];
      a.x += a.vx; a.y += a.vy; a.rot += a.vr;
      if (a.x &lt; a.r || a.x &gt; W-a.r) a.vx = -a.vx;

      // orb hit asteroid
      var dx = orbX-a.x, dy=orbY-a.y, dist=Math.sqrt(dx*dx+dy*dy);
      if (dist &lt; a.r+ORB_R){
        var val = asteroidValue(a.r)*combo;
        score += val;
        combo++;
        // reflect orb
        var nx=dx/dist, ny=dy/dist;
        var dot = orbVX*nx+orbVY*ny;
        orbVX -= 2*dot*nx; orbVY -= 2*dot*ny;
        orbSpeed += 0.1;
        burst(a.x, a.y, a.color, 18);
        asteroids.splice(i,1);
        updateHUD();
        // wave check
        if (score &gt;= wave*5){
          wave++;
          spawnWave();
          updateHUD();
        }
        continue;
      }

      // asteroid slipped past bottom
      if (a.y - a.r &gt; H){
        asteroids.splice(i,1);
        score = Math.max(0, score-1);
        combo = 1;
        burst(a.x, H-4, &#x27;#ff4d88&#x27;, 8);
        updateHUD();
      }
    }

    // keep asteroids topped up
    if (asteroids.length &lt; 2){
      var boost = (wave-1)*0.35;
      asteroids.push(makeAsteroid(boost));
    }

    // particles
    for (var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
      if (p.life&lt;=0) particles.splice(i,1);
    }

    if (paddleFlash&gt;0) paddleFlash -= 0.06;

    render();
    animId = requestAnimationFrame(tick);
  }

  function render() {
    ctx.fillStyle = &#x27;#05010f&#x27;;
    ctx.fillRect(0,0,W,H);

    // stars
    for (var i=0;i&lt;stars.length;i++){
      var s=stars[i];
      ctx.fillStyle=s.c;
      ctx.fillRect(s.x, s.y, s.sz, s.sz);
    }

    // asteroids
    for (var i=0;i&lt;asteroids.length;i++){
      var a=asteroids[i];
      ctx.save();
      ctx.translate(a.x,a.y); ctx.rotate(a.rot);
      ctx.shadowColor=a.color; ctx.shadowBlur=15;
      ctx.beginPath();
      var sides=7;
      for (var j=0;j&lt;sides;j++){
        var ang=(j/sides)*Math.PI*2;
        var rr=a.r*(0.8+0.2*Math.sin(j*3.3));
        var px=Math.cos(ang)*rr, py=Math.sin(ang)*rr;
        if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle=a.color; ctx.globalAlpha=0.85; ctx.fill();
      ctx.globalAlpha=1; ctx.lineWidth=2; ctx.strokeStyle=&#x27;#fff&#x27;; ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur=0;

    // orb trail
    for (var i=0;i&lt;trail.length;i++){
      var t=trail[i], al=i/trail.length;
      ctx.beginPath();
      ctx.arc(t.x,t.y,ORB_R*al*0.9,0,Math.PI*2);
      ctx.fillStyle=&#x27;rgba(77,210,255,&#x27;+(al*0.5)+&#x27;)&#x27;;
      ctx.fill();
    }
    // orb
    var pulse = ORB_R + Math.sin(Date.now()/120)*2;
    ctx.save();
    ctx.shadowColor=&#x27;#4dd2ff&#x27;; ctx.shadowBlur=25;
    var g=ctx.createRadialGradient(orbX,orbY,1,orbX,orbY,pulse);
    g.addColorStop(0,&#x27;#fff&#x27;); g.addColorStop(0.4,&#x27;#4dd2ff&#x27;); g.addColorStop(1,&#x27;#1a4dff&#x27;);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(orbX,orbY,pulse,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // particles
    for (var i=0;i&lt;particles.length;i++){
      var p=particles[i];
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x,p.y,3,3);
    }
    ctx.globalAlpha=1;

    // paddle (ship)
    var pt = H - PADDLE_BOTTOM - PADDLE_H;
    ctx.save();
    ctx.shadowColor = paddleFlash&gt;0 ? paddleColor : &#x27;#4dd2ff&#x27;;
    ctx.shadowBlur = 20 + paddleFlash*25;
    ctx.fillStyle = paddleFlash&gt;0 ? paddleColor : &#x27;#4dd2ff&#x27;;
    // trapezoid ship shape
    ctx.beginPath();
    ctx.moveTo(paddleX+14, pt);
    ctx.lineTo(paddleX+PADDLE_W-14, pt);
    ctx.lineTo(paddleX+PADDLE_W, pt+PADDLE_H);
    ctx.lineTo(paddleX, pt+PADDLE_H);
    ctx.closePath();
    ctx.fill();
    // cockpit glow
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(0.5+paddleFlash*0.5)+&#x27;)&#x27;;
    ctx.fillRect(paddleX+PADDLE_W/2-8, pt+3, 16, 5);
    ctx.restore();
  }

  // input
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX-rect.left) * (W/rect.width);
    paddleX = Math.max(0, Math.min(W-PADDLE_W, mx-PADDLE_W/2));
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static paint
  initStars();
  score=0; combo=1; wave=1;
  paddleX=(W-PADDLE_W)/2; orbX=W/2; orbY=H/2; orbVX=0; orbVY=0;
  render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

    <button id="stop" disabled>Stop</button>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
