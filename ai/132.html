  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: linear-gradient(160deg,#12d3c4,#0aa0d8); color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box;
    height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px; font-size: 26px; font-weight: 800; text-shadow: 2px 2px 0 #0007; letter-spacing:1px; }

  .cell { position: absolute; box-sizing: border-box; border-radius: 5px;

  .ghost { position:absolute; box-sizing:border-box; border-radius:5px;

  .nextgrid { position:relative; width:66px; height:66px; margin:4px auto 0; }

    font-size:30px; font-weight:900; color:#fff; text-shadow:2px 2px 0 #000, 0 0 14px #ff0;

  @keyframes bannerPop { 0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0;}
    30%{transform:translate(-50%,-50%) scale(1.3) rotate(6deg);opacity:1;}
    60%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1;}

  .controls { display:flex; gap:10px; margin-top:2px; }

  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 #0004; }
  .overlay { position:absolute; inset:0; background:rgba(0,30,50,0.85); border-radius:10px;

  .overlay.show { transform:translateY(0); }
  .overlay h2 { font-size:34px; margin:0; text-shadow:2px 2px 0 #000; }
  .overlay p { font-size:18px; margin:2px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← / →, rotate with ↑, and soft-drop with ↓ (or use the buttons). Fill full rows to pop them for points — clear several at once for combo bonuses!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Best Combo: &lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;h2&gt;Game Over&lt;/h2&gt;
        &lt;p&gt;Score: &lt;span id=&quot;foScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
        &lt;p&gt;Best Combo: &lt;span id=&quot;foCombo&quot;&gt;x1&lt;/span&gt;&lt;/p&gt;
        &lt;p style=&quot;font-size:14px;opacity:.8&quot;&gt;Press Start below to play again&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;nextbox&quot;&gt;NEXT&lt;div class=&quot;nextgrid&quot; id=&quot;nextgrid&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bLeft&quot;&gt;←&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bRot&quot;&gt;⟳&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bRight&quot;&gt;→&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bDown&quot;&gt;↓&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 22, COLS = 10, ROWS = 18;
  var field = document.getElementById(&#x27;field&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var nextgrid = document.getElementById(&#x27;nextgrid&#x27;);

  // Fruit definitions: emoji + color per tetromino type
  var FRUITS = {
    I:{e:&#x27;🍉&#x27;,c:&#x27;#ff5566&#x27;,g:&#x27;#ff4466&#x27;},
    O:{e:&#x27;🍋&#x27;,c:&#x27;#f7d300&#x27;,g:&#x27;#ffe233&#x27;},
    T:{e:&#x27;🍇&#x27;,c:&#x27;#9b59d0&#x27;,g:&#x27;#b06ff0&#x27;},
    S:{e:&#x27;🍏&#x27;,c:&#x27;#7ed957&#x27;,g:&#x27;#8fff66&#x27;},
    Z:{e:&#x27;🍓&#x27;,c:&#x27;#ff4d6d&#x27;,g:&#x27;#ff6688&#x27;},
    J:{e:&#x27;🫐&#x27;,c:&#x27;#4d79ff&#x27;,g:&#x27;#6699ff&#x27;},
    L:{e:&#x27;🍊&#x27;,c:&#x27;#ff9c33&#x27;,g:&#x27;#ffb84d&#x27;}
  };
  var SHAPES = {
    I:[[0,1],[1,1],[2,1],[3,1]],
    O:[[1,0],[2,0],[1,1],[2,1]],
    T:[[1,0],[0,1],[1,1],[2,1]],
    S:[[1,0],[2,0],[0,1],[1,1]],
    Z:[[0,0],[1,0],[1,1],[2,1]],
    J:[[0,0],[0,1],[1,1],[2,1]],
    L:[[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  var grid, piece, nextType, score, bestCombo, running=false, dropId=null, dropMs=550;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  // Rotate a set of cells 90deg clockwise within a 4x4 bounding box
  function rotate(cells){
    return cells.map(function(p){ return [3-p[1], p[0]]; });
  }
  function normalize(cells){
    var minx=99,miny=99;
    cells.forEach(function(p){minx=Math.min(minx,p[0]);miny=Math.min(miny,p[1]);});
    return cells.map(function(p){return [p[0]-minx,p[1]-miny];});
  }

  function makePiece(type){
    return { type:type, cells:SHAPES[type].map(function(p){return[p[0],p[1]];}), x:3, y:0 };
  }
  function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }

  function collides(p){
    var a=absCells(p);
    for(var i=0;i&lt;a.length;i++){
      var c=a[i];
      if(c.x&lt;0||c.x&gt;=COLS||c.y&gt;=ROWS) return true;
      if(c.y&gt;=0 &amp;&amp; grid[c.y][c.x]) return true;
    }
    return false;
  }

  function spawn(){
    piece = makePiece(nextType || TYPES[Math.floor(Math.random()*7)]);
    nextType = TYPES[Math.floor(Math.random()*7)];
    drawNext();
    if(collides(piece)){ return false; }
    return true;
  }

  function ghostY(){
    var p={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y};
    while(!collides({type:p.type,cells:p.cells,x:p.x,y:p.y+1})) p.y++;
    return p.y;
  }

  function lock(){
    absCells(piece).forEach(function(c){ if(c.y&gt;=0) grid[c.y][c.x]=piece.type; });
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){
      var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;}
      if(f) full.push(r);
    }
    if(full.length){
      // particles + flash
      var col = FRUITS[grid[full[0]][0]].c;
      doFlash(col);
      full.forEach(function(r){
        for(var c=0;c&lt;COLS;c++) spawnParticle(c, r, FRUITS[grid[r][c]].e);
      });
      // remove
      full.sort(function(a,b){return a-b;});
      full.forEach(function(r){ grid.splice(r,1); var e=[];for(var c=0;c&lt;COLS;c++)e.push(null);grid.unshift(e); });
      var pts=[0,1,3,6,10][full.length];
      score+=pts;
      scoreEl.textContent=score;
      if(full.length&gt;bestCombo){ bestCombo=full.length; comboEl.textContent=&#x27;x&#x27;+bestCombo; }
      if(full.length&gt;1) showBanner(&#x27;COMBO x&#x27;+full.length+&#x27;!&#x27;);
      else showBanner(&#x27;+&#x27;+pts);
      // speed ramp every 5 points
      var newMs = Math.max(120, 550 - Math.floor(score/5)*40);
      if(newMs!==dropMs){ dropMs=newMs; if(running){clearInterval(dropId); dropId=setInterval(step,dropMs);} }
    }
  }

  function step(){
    if(!piece) return;
    var np={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
    if(collides(np)){ lock(); clearRows(); if(!spawn()){ endGame(); paint(); return; } }
    else piece.y++;
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    var np={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
    if(!collides(np)){ piece.x+=dx; paint(); }
  }
  function softDrop(){ if(running) step(); }
  function doRotate(){
    if(!running||!piece) return;
    var rc=normalize(rotate(piece.cells));
    var test={type:piece.type,cells:rc,x:piece.x,y:piece.y};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.x=piece.x+kicks[k];
      if(!collides(test)){ piece.cells=rc; piece.x=test.x; paint(); return; }
    }
  }

  function drawCell(container,cx,cy,type,size,glow){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;;
    var s=size||CELL;
    el.style.left=(cx*s)+&#x27;px&#x27;; el.style.top=(cy*s)+&#x27;px&#x27;;
    el.style.width=s+&#x27;px&#x27;; el.style.height=s+&#x27;px&#x27;;
    el.style.fontSize=(s*0.72)+&#x27;px&#x27;;
    el.style.background=FRUITS[type].c;
    el.textContent=FRUITS[type].e;
    if(glow){ el.style.setProperty(&#x27;--gc&#x27;,FRUITS[type].g); el.style.animation=&#x27;pulse 1.4s ease-in-out infinite&#x27;; }
    else { el.style.boxShadow=&#x27;inset 0 0 0 1px rgba(255,255,255,0.3)&#x27;; }
    container.appendChild(el);
  }

  function paint(){
    // clear only cells/ghosts (keep overlay/flash/banner)
    var olds=field.querySelectorAll(&#x27;.cell,.ghost&#x27;);
    for(var i=0;i&lt;olds.length;i++) olds[i].remove();
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawCell(field,c,r,grid[r][c],CELL,true);
    if(piece){
      var gy=ghostY();
      piece.cells.forEach(function(cc){
        var gx=piece.x+cc[0], gyy=gy+cc[1];
        if(gyy&gt;=0){ var g=document.createElement(&#x27;div&#x27;); g.className=&#x27;ghost&#x27;;
          g.style.left=(gx*CELL)+&#x27;px&#x27;; g.style.top=(gyy*CELL)+&#x27;px&#x27;;
          g.style.width=CELL+&#x27;px&#x27;; g.style.height=CELL+&#x27;px&#x27;; field.appendChild(g); }
      });
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) drawCell(field,c.x,c.y,piece.type,CELL,true); });
    }
  }

  function drawNext(){
    nextgrid.innerHTML=&#x27;&#x27;;
    if(!nextType) return;
    var cells=normalize(SHAPES[nextType].map(function(p){return[p[0],p[1]];}));
    var maxx=0,maxy=0; cells.forEach(function(p){maxx=Math.max(maxx,p[0]);maxy=Math.max(maxy,p[1]);});
    var offx=(3-maxx)/2, offy=(3-maxy)/2;
    cells.forEach(function(p){ drawCell(nextgrid,p[0]+offx,p[1]+offy,nextType,16,false); });
  }

  function spawnParticle(cx,cy,emoji){
    var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
    p.textContent=emoji;
    var x=cx*CELL, y=cy*CELL;
    p.style.left=x+&#x27;px&#x27;; p.style.top=y+&#x27;px&#x27;;
    field.appendChild(p);
    var ang=Math.random()*Math.PI*2, dist=30+Math.random()*50;
    var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    var start=null;
    function anim(t){ if(!start)start=t; var e=(t-start)/600;
      if(e&gt;=1){ p.remove(); return; }
      p.style.transform=&#x27;translate(&#x27;+(dx*e)+&#x27;px,&#x27;+(dy*e+e*e*40)+&#x27;px) scale(&#x27;+(1-e*0.5)+&#x27;)&#x27;;
      p.style.opacity=1-e;
      requestAnimationFrame(anim); }
    requestAnimationFrame(anim);
  }

  function doFlash(color){
    flash.style.background=color;
    flash.style.transition=&#x27;none&#x27;; flash.style.opacity=&#x27;0.55&#x27;;
    requestAnimationFrame(function(){ flash.style.transition=&#x27;opacity .5s&#x27;; flash.style.opacity=&#x27;0&#x27;; });
  }

  function showBanner(text){
    banner.textContent=text;
    banner.style.animation=&#x27;none&#x27;;
    void banner.offsetWidth;
    banner.style.animation=&#x27;bannerPop 1s ease forwards&#x27;;
  }

  function endGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
    document.getElementById(&#x27;foScore&#x27;).textContent=score;
    document.getElementById(&#x27;foCombo&#x27;).textContent=&#x27;x&#x27;+bestCombo;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; bestCombo=1; dropMs=550;
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;x1&#x27;;
    newGrid(); nextType=null;
    if(!spawn()){ return; }
    paint();
    running=true;
    if(dropId)clearInterval(dropId);
    dropId=setInterval(step,dropMs);
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){softDrop();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){doRotate();e.preventDefault();}
  });
  document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;,function(){move(-1);});
  document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;,function(){move(1);});
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;,doRotate);
  document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;,softDrop);

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial preview
  newGrid();
  nextType=&#x27;T&#x27;;
  piece=makePiece(&#x27;L&#x27;); piece.y=1;
  drawNext(); paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
