<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>◈ COSMIC DEFENDER ◈</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#0ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,255,255,.4); }
  .instructions { font-size: 16px; color: #9fd; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 640px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
  .score { font-weight: 800; font-size: 22px; color: #0ff; text-shadow: 0 0 12px #0ff; }
  .combo { font-weight: 800; color: #ff0; text-shadow: 0 0 12px #ff0; }
  .lives { font-size: 20px; letter-spacing: 2px; }
  .wrap { position: relative; width: 640px; height: 440px; }
  canvas { display: block; background: #04010c; border: 2px solid #144; border-radius: 8px; box-shadow: 0 0 24px rgba(0,255,255,.25) inset; }
  .scan { position: absolute; inset: 0; pointer-events: none; border-radius: 8px;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0, rgba(255,255,255,.04) 1px, transparent 2px, transparent 3px); }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    pointer-events: none; text-align: center; }
  .msg span { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #f0f; text-shadow: 0 0 20px #f0f; }
  .msg small { font-size: 16px; color: #9fd; margin-top: 6px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;◈ COSMIC DEFENDER ◈&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your energy paddle with the mouse or ←/→ keys to bounce the plasma ball and smash every alien brick. Catch falling power-ups, build combos, and don&#x27;t let the ball fall past you three times!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;COMBO x1&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;scan&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;span id=&quot;msgT&quot;&gt;&lt;/span&gt;&lt;small id=&quot;msgS&quot;&gt;&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var W=640,H=440;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;),
    livesEl=document.getElementById(&#x27;lives&#x27;), msg=document.getElementById(&#x27;msg&#x27;),
    msgT=document.getElementById(&#x27;msgT&#x27;), msgS=document.getElementById(&#x27;msgS&#x27;);

var running=false, animId=null;
var keys={};
var score=0, combo=1, lives=3, wave=1;
var flashRed=0, waveFlash=0;
var paddle, balls, bricks, particles, powerups, stars;
var ballWait=0;
var paddleWideT=0;

// audio
var AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(f,d,type,vol){ var a=ac(); if(!a)return; var o=a.createOscillator(),g=a.createGain();
  o.type=type||&#x27;square&#x27;; o.frequency.value=f; o.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(vol||0.08,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
  o.start(); o.stop(a.currentTime+d); }

function initStars(){ stars=[]; for(var i=0;i&lt;70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.3,sp:Math.random()*0.4+0.1}); }

function newPaddle(){ return {w:110,h:14,x:(W-110)/2,y:H-26,speed:8}; }
function pw(){ return paddleWideT&gt;0?170:paddle.w; }

function newBall(x,y,vx,vy){ return {x:x,y:y,r:8,vx:vx,vy:vy,speed:5}; }

var BTYPES={
  crystal:{color:&#x27;#0ff&#x27;,pts:10,hp:1},
  armor:{color:&#x27;#b0b0ff&#x27;,pts:25,hp:2},
  gold:{color:&#x27;#fd0&#x27;,pts:50,hp:1}
};

function buildWave(){
  bricks=[];
  var cols=11, bw=52, bh=20, gap=4, ox=(W-(cols*(bw+gap)-gap))/2, oy=48;
  var rows=Math.min(4+wave,8);
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;cols;c++){
      // pattern: skip some cells to make shapes
      var skip = ((r+c)%7===0 &amp;&amp; wave&lt;3) ? true : false;
      if(skip) continue;
      var type=&#x27;crystal&#x27;;
      var rnd=Math.random();
      if(rnd&lt;0.10) type=&#x27;gold&#x27;;
      else if(rnd&lt;0.10+Math.min(0.15+wave*0.05,0.5)) type=&#x27;armor&#x27;;
      var t=BTYPES[type];
      bricks.push({x:ox+c*(bw+gap),y:oy+r*(bh+gap),w:bw,h:bh,type:type,hp:t.hp,color:t.color,flash:0});
    }
  }
}

function reset(){
  score=0; combo=1; lives=3; wave=1; ballWait=0; paddleWideT=0;
  paddle=newPaddle();
  balls=[newBall(W/2,H-60,4,-5)];
  particles=[]; powerups=[];
  buildWave(); initStars();
  updateHud();
  hideMsg();
}

function updateHud(){
  scoreEl.textContent=score;
  comboEl.textContent=&#x27;COMBO x&#x27;+combo;
  livesEl.textContent=[&#x27;❤️&#x27;,&#x27;❤️❤️&#x27;,&#x27;❤️❤️❤️&#x27;][Math.max(0,lives-1)]||&#x27;&#x27;;
  if(lives&lt;=0) livesEl.textContent=&#x27;&#x27;;
}

function showMsg(t,s){ msgT.textContent=t; msgS.textContent=s||&#x27;&#x27;; msg.style.display=&#x27;flex&#x27;; }
function hideMsg(){ msg.style.display=&#x27;none&#x27;; }

function burst(x,y,color,n){ for(var i=0;i&lt;(n||10);i++){ var a=Math.random()*6.28,sp=Math.random()*4+1;
  particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color}); } }

function loseLife(){
  lives--; flashRed=1; combo=1; updateHud(); beep(90,0.4,&#x27;sawtooth&#x27;,0.12);
  if(lives&lt;=0){ endGame(); return; }
  ballWait=60;
  balls=[newBall(W/2,H-60,4,-5)];
  paddleWideT=0;
}

function endGame(){
  running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
  showMsg(&#x27;GAME OVER&#x27;,&#x27;Final Score: &#x27;+score+&#x27; — press Restart&#x27;);
}

function catchPU(p){
  beep(660,0.15,&#x27;triangle&#x27;,0.1); beep(990,0.2,&#x27;triangle&#x27;,0.08);
  if(p.kind===&#x27;wide&#x27;){ paddleWideT=600; }
  else if(p.kind===&#x27;split&#x27;){
    var base=balls[0]||newBall(paddle.x+pw()/2,H-60,4,-5);
    var extra=[];
    for(var i=0;i&lt;2;i++){ var ang=(-Math.PI/2)+(i? 0.5:-0.5); var sp=base.speed;
      extra.push({x:base.x,y:base.y,r:8,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,speed:sp}); }
    balls=balls.concat(extra);
  }
}

function hitBrick(ball,b){
  b.hp--;
  if(b.hp&gt;0){ b.flash=6; beep(300,0.06,&#x27;square&#x27;,0.06); return false; }
  var t=BTYPES[b.type];
  score += t.pts*combo; combo++;
  burst(b.x+b.w/2,b.y+b.h/2,b.color,12);
  beep(500+combo*20,0.08,&#x27;square&#x27;,0.08);
  if(b.type===&#x27;gold&#x27;){
    powerups.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:2,kind:Math.random()&lt;0.5?&#x27;wide&#x27;:&#x27;split&#x27;});
  }
  updateHud();
  return true;
}

function tick(){
  if(!running) return;
  // clear
  ctx.fillStyle=&#x27;#04010c&#x27;; ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle=&#x27;#89f&#x27;;
  for(var i=0;i&lt;stars.length;i++){ var s=stars[i]; s.y+=s.sp; if(s.y&gt;H)s.y=0;
    ctx.globalAlpha=0.4+s.s/2; ctx.fillRect(s.x,s.y,s.s,s.s); }
  ctx.globalAlpha=1;

  // paddle move
  if(keys[&#x27;ArrowLeft&#x27;]) paddle.x-=paddle.speed;
  if(keys[&#x27;ArrowRight&#x27;]) paddle.x+=paddle.speed;
  paddle.x=Math.max(0,Math.min(W-pw(),paddle.x));
  if(paddleWideT&gt;0) paddleWideT--;

  // ball wait after death
  if(ballWait&gt;0){ ballWait--; }

  // update balls
  for(var bi=balls.length-1;bi&gt;=0;bi--){
    var ball=balls[bi];
    if(ballWait&gt;0){ ball.x=paddle.x+pw()/2; ball.y=paddle.y-14; }
    else { ball.x+=ball.vx; ball.y+=ball.vy; }
    // walls
    if(ball.x-ball.r&lt;=0){ ball.x=ball.r; ball.vx=Math.abs(ball.vx); }
    if(ball.x+ball.r&gt;=W){ ball.x=W-ball.r; ball.vx=-Math.abs(ball.vx); }
    if(ball.y-ball.r&lt;=0){ ball.y=ball.r; ball.vy=Math.abs(ball.vy); }
    // paddle
    if(ball.vy&gt;0 &amp;&amp; ball.y+ball.r&gt;=paddle.y &amp;&amp; ball.y+ball.r&lt;=paddle.y+paddle.h+8 &amp;&amp;
       ball.x&gt;=paddle.x-ball.r &amp;&amp; ball.x&lt;=paddle.x+pw()+ball.r){
      var hit=(ball.x-(paddle.x+pw()/2))/(pw()/2); // -1..1
      ball.speed=Math.min(ball.speed+0.25,11);
      var ang=hit*1.05; // spread
      ball.vx=Math.sin(ang)*ball.speed;
      ball.vy=-Math.abs(Math.cos(ang)*ball.speed);
      ball.y=paddle.y-ball.r-1;
      combo=1; updateHud();
      beep(220,0.06,&#x27;square&#x27;,0.07);
    }
    // fell
    if(ball.y-ball.r&gt;H){
      balls.splice(bi,1);
      if(balls.length===0){ loseLife(); return requestAnimationFrame(tick); }
      continue;
    }
    // bricks
    for(var k=bricks.length-1;k&gt;=0;k--){
      var b=bricks[k];
      if(ball.x+ball.r&gt;b.x &amp;&amp; ball.x-ball.r&lt;b.x+b.w &amp;&amp; ball.y+ball.r&gt;b.y &amp;&amp; ball.y-ball.r&lt;b.y+b.h){
        // determine bounce side
        var ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));
        var oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
        if(ox&lt;oy) ball.vx=-ball.vx; else ball.vy=-ball.vy;
        if(hitBrick(ball,b)) bricks.splice(k,1);
        break;
      }
    }
  }

  // wave clear
  if(bricks.length===0 &amp;&amp; running){
    wave++; waveFlash=30; beep(700,0.15,&#x27;triangle&#x27;,0.1); beep(900,0.2,&#x27;triangle&#x27;,0.09);
    buildWave();
    balls=[newBall(paddle.x+pw()/2,H-60,4,-5)];
    ballWait=40;
  }

  // powerups
  for(var pi=powerups.length-1;pi&gt;=0;pi--){
    var p=powerups[pi]; p.y+=p.vy;
    if(p.y&gt;=paddle.y &amp;&amp; p.y&lt;=paddle.y+paddle.h+8 &amp;&amp; p.x&gt;=paddle.x &amp;&amp; p.x&lt;=paddle.x+pw()){
      catchPU(p); powerups.splice(pi,1); continue;
    }
    if(p.y&gt;H){ powerups.splice(pi,1); continue; }
    ctx.save();
    ctx.shadowBlur=14; ctx.shadowColor=p.kind===&#x27;wide&#x27;?&#x27;#0f0&#x27;:&#x27;#f0f&#x27;;
    ctx.fillStyle=p.kind===&#x27;wide&#x27;?&#x27;#0f0&#x27;:&#x27;#f0f&#x27;;
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#000&#x27;; ctx.font=&#x27;bold 12px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(p.kind===&#x27;wide&#x27;?&#x27;W&#x27;:&#x27;3&#x27;,p.x,p.y);
    ctx.restore();
  }

  // draw bricks
  for(var k=0;k&lt;bricks.length;k++){
    var b=bricks[k];
    ctx.save();
    var col=b.flash&gt;0?&#x27;#fff&#x27;:b.color;
    if(b.flash&gt;0)b.flash--;
    ctx.shadowBlur=10; ctx.shadowColor=b.color;
    ctx.fillStyle=col;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.shadowBlur=0;
    ctx.strokeStyle=&#x27;rgba(255,255,255,.5)&#x27;; ctx.strokeRect(b.x,b.y,b.w,b.h);
    if(b.type===&#x27;gold&#x27;){ ctx.fillStyle=&#x27;#a70&#x27;; ctx.font=&#x27;bold 11px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;; ctx.fillText(&#x27;★&#x27;,b.x+b.w/2,b.y+b.h/2); }
    ctx.restore();
  }

  // particles
  for(var i=particles.length-1;i&gt;=0;i--){ var pt=particles[i];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=0.03;
    if(pt.life&lt;=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=pt.life; ctx.fillStyle=pt.color; ctx.fillRect(pt.x,pt.y,3,3); ctx.globalAlpha=1;
  }

  // paddle
  ctx.save();
  ctx.shadowBlur=18; ctx.shadowColor=paddleWideT&gt;0?&#x27;#0f0&#x27;:&#x27;#0ff&#x27;;
  var grad=ctx.createLinearGradient(paddle.x,0,paddle.x+pw(),0);
  grad.addColorStop(0,&#x27;#0ff&#x27;); grad.addColorStop(0.5,&#x27;#fff&#x27;); grad.addColorStop(1,&#x27;#0ff&#x27;);
  ctx.fillStyle=paddleWideT&gt;0?&#x27;#0f0&#x27;:grad;
  ctx.beginPath();
  var rr=7;
  ctx.roundRect(paddle.x,paddle.y,pw(),paddle.h,rr); ctx.fill();
  ctx.restore();

  // balls
  for(var bi=0;bi&lt;balls.length;bi++){ var ball=balls[bi];
    ctx.save(); ctx.shadowBlur=16; ctx.shadowColor=&#x27;#f0f&#x27;;
    var g=ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,ball.r);
    g.addColorStop(0,&#x27;#fff&#x27;); g.addColorStop(1,&#x27;#f0f&#x27;);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,6.28); ctx.fill(); ctx.restore();
  }

  // wave flash text
  if(waveFlash&gt;0){ waveFlash--;
    ctx.save(); ctx.globalAlpha=waveFlash/30; ctx.fillStyle=&#x27;#f0f&#x27;; ctx.font=&#x27;bold 34px sans-serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.shadowBlur=20; ctx.shadowColor=&#x27;#f0f&#x27;;
    ctx.fillText(&#x27;WAVE &#x27;+wave+&#x27;!&#x27;,W/2,H/2); ctx.restore();
  }

  // red flash
  if(flashRed&gt;0){ ctx.fillStyle=&#x27;rgba(255,0,0,&#x27;+(flashRed*0.4)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); flashRed-=0.05; }

  animId=requestAnimationFrame(tick);
}

// polyfill roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keys[e.key]=true;e.preventDefault();} });
window.addEventListener(&#x27;keyup&#x27;,function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;)keys[e.key]=false; });
cv.addEventListener(&#x27;mousemove&#x27;,function(e){ if(!paddle)return; var r=cv.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(W/r.width); paddle.x=Math.max(0,Math.min(W-pw(),mx-pw()/2)); });
cv.addEventListener(&#x27;touchmove&#x27;,function(e){ if(!paddle)return; var r=cv.getBoundingClientRect();
  var mx=(e.touches[0].clientX-r.left)*(W/r.width); paddle.x=Math.max(0,Math.min(W-pw(),mx-pw()/2)); e.preventDefault(); },{passive:false});

function startGame(){ if(running)return; if(ac()&amp;&amp;AC.state===&#x27;suspended&#x27;)AC.resume(); reset(); running=true; animId=requestAnimationFrame(tick); }
function stopGame(){ running=false; if(animId){cancelAnimationFrame(animId);animId=null;} }

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;)startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
});

// initial static render
paddle=newPaddle(); balls=[newBall(W/2,H-60,0,0)]; bricks=[]; particles=[]; powerups=[]; initStars();
buildWave();
ctx.fillStyle=&#x27;#04010c&#x27;; ctx.fillRect(0,0,W,H);
for(var k=0;k&lt;bricks.length;k++){var b=bricks[k];ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);}
showMsg(&#x27;READY&#x27;,&#x27;Press Start below to defend the cosmos&#x27;);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
