<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍎 Fruit Drop Frenzy 🍇</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #fff0f6; color: #333; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(90deg,#ff5e7e,#ffab40,#7ed957,#4dd0e1,#b388ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #666; max-width: 560px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; }
  .score { font-size: 30px; font-weight: 800; color: #d81b60; }
  .combo { font-size: 20px; font-weight: 700; color: #999; transition: color .2s, transform .2s; }
  .combo.hot { color: #ff8f00; transform: scale(1.15); text-shadow: 0 0 8px rgba(255,143,0,.6); }
  .wrap { position: relative; }
  #field { display: block; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .pop { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 26px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.4); pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ←/→, rotate with ↑, and hard-drop with ↓ (or swipe &amp; tap on touch). Fill a full row to pop it for points — clear several at once for big bonuses!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;Combo x0&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot; id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;field&quot; width=&quot;240&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var canvas = document.getElementById(&#x27;field&#x27;), ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), wrap = document.getElementById(&#x27;wrap&#x27;);

  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;,&#x27;🍒&#x27;];
  var COLORS = [&#x27;#ff5252&#x27;,&#x27;#ffa726&#x27;,&#x27;#ffee58&#x27;,&#x27;#ba68c8&#x27;,&#x27;# f06292&#x27;,&#x27;#66bb6a&#x27;,&#x27;#ec407a&#x27;];
  var COLORS2 = [&#x27;#ff5252&#x27;,&#x27;#ffa726&#x27;,&#x27;#ffee58&#x27;,&#x27;#ba68c8&#x27;,&#x27;#f06292&#x27;,&#x27;#66bb6a&#x27;,&#x27;#ec407a&#x27;];
  // tetromino shapes (rotations computed)
  var SHAPES = [
    [[1,1,1,1]],            // I
    [[1,1,1],[1,0,0]],      // J
    [[1,1,1],[0,0,1]],      // L
    [[1,1],[1,1]],          // O
    [[0,1,1],[1,1,0]],      // S
    [[1,1,1],[0,1,0]],      // T
    [[1,1,0],[0,1,1]]       // Z
  ];

  var grid, piece, score, combo, dropMs, running, dropId, hue, flashRows, pops;

  function reset() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(-1); grid.push(row); }
    score=0; combo=0; dropMs=600; hue=0; flashRows=[]; pops=[];
    scoreEl.textContent=&#x27;0&#x27;; setCombo(0);
    spawn();
  }

  function rotateMatrix(m){
    var h=m.length,w=m[0].length,out=[];
    for(var c=0;c&lt;w;c++){ var row=[]; for(var r=h-1;r&gt;=0;r--) row.push(m[r][c]); out.push(row); }
    return out;
  }

  function spawn(){
    var t=Math.floor(Math.random()*SHAPES.length);
    var m=SHAPES[t].map(function(r){return r.slice();});
    piece={ type:t, m:m, x:Math.floor((COLS-m[0].length)/2), y:0 };
    if(collides(piece.m,piece.x,piece.y)){ endGame(); }
  }

  function collides(m,px,py){
    for(var r=0;r&lt;m.length;r++) for(var c=0;c&lt;m[r].length;c++){
      if(!m[r][c]) continue;
      var x=px+c, y=py+r;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]&gt;=0) return true;
    }
    return false;
  }

  function lock(){
    for(var r=0;r&lt;piece.m.length;r++) for(var c=0;c&lt;piece.m[r].length;c++){
      if(piece.m[r][c]){ var y=piece.y+r,x=piece.x+c; if(y&gt;=0&amp;&amp;y&lt;ROWS) grid[y][x]=piece.type; }
    }
    clearRows();
  }

  function clearRows(){
    var full=[];
    for(var r=ROWS-1;r&gt;=0;r--){ var f=true; for(var c=0;c&lt;COLS;c++) if(grid[r][c]&lt;0){f=false;break;} if(f) full.push(r); }
    if(full.length){
      flashRows = full.slice();
      // remove after brief flash
      var rows=full.length;
      var pts = 100 * rows * (rows&gt;1?rows:1);
      score += pts;
      combo += 1;
      scoreEl.textContent = score;
      setCombo(combo);
      var label = rows&gt;1 ? (&#x27;+&#x27;+pts+&#x27;! &#x27;+(rows===2?&#x27;DOUBLE&#x27;:rows===3?&#x27;TRIPLE&#x27;:&#x27;FRENZY&#x27;)+&#x27;!&#x27;) : (&#x27;+&#x27;+pts+&#x27;!&#x27;);
      addPop(label, full[full.length-1]);
      sparkle(full);
      // speed up
      dropMs = Math.max(120, 600 - score/50);
      hue = (hue + 25) % 360;
      setTimeout(function(){
        for(var i=0;i&lt;full.length;i++){ grid.splice(full[i],1); var e=[]; for(var c=0;c&lt;COLS;c++) e.push(-1); grid.unshift(e); }
        // note: splicing by descending index keeps order valid
        flashRows=[];
        if(running){ clearInterval(dropId); dropId=setInterval(step,dropMs); }
      },120);
    } else {
      combo=0; setCombo(0);
    }
    spawn();
  }

  function setCombo(n){
    comboEl.textContent=&#x27;Combo x&#x27;+n;
    if(n&gt;=2) comboEl.classList.add(&#x27;hot&#x27;); else comboEl.classList.remove(&#x27;hot&#x27;);
  }

  var particles=[];
  function sparkle(rows){
    for(var i=0;i&lt;rows.length;i++){
      var y=rows[i]*CELL+CELL/2;
      for(var c=0;c&lt;COLS;c++){
        var x=c*CELL+CELL/2;
        for(var k=0;k&lt;3;k++){
          particles.push({x:x,y:y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,life:1,hue:Math.random()*360});
        }
      }
    }
  }

  function addPop(text,rowIdx){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;pop&#x27;; el.textContent=text;
    el.style.top=(rowIdx*CELL)+&#x27;px&#x27;;
    wrap.appendChild(el);
    var start=performance.now();
    function anim(t){
      var p=(t-start)/900;
      if(p&gt;=1){ el.remove(); return; }
      el.style.transform=&#x27;translateY(&#x27;+(-40*p)+&#x27;px)&#x27;;
      el.style.opacity=(1-p);
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  function ghostY(){
    var y=piece.y;
    while(!collides(piece.m,piece.x,y+1)) y++;
    return y;
  }

  function step(){
    if(!piece) return;
    if(collides(piece.m,piece.x,piece.y+1)){ lock(); }
    else piece.y++;
    draw();
  }

  function move(dx){
    if(!running||!piece) return;
    if(!collides(piece.m,piece.x+dx,piece.y)){ piece.x+=dx; draw(); }
  }
  function rotate(){
    if(!running||!piece) return;
    var rm=rotateMatrix(piece.m);
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){
      if(!collides(rm,piece.x+kicks[i],piece.y)){ piece.m=rm; piece.x+=kicks[i]; draw(); return; }
    }
  }
  function hardDrop(){
    if(!running||!piece) return;
    piece.y=ghostY();
    draw();
    lock();
    draw();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function drawCell(cx,cy,type,ghost,flash){
    var x=cx*CELL, y=cy*CELL;
    if(ghost){
      ctx.globalAlpha=0.28;
      ctx.fillStyle=COLORS2[type];
      roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.fill();
      ctx.globalAlpha=1;
      return;
    }
    // shadow
    ctx.shadowColor=&#x27;rgba(0,0,0,.3)&#x27;; ctx.shadowBlur=4; ctx.shadowOffsetY=2;
    ctx.fillStyle=COLORS2[type];
    roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.fill();
    ctx.shadowColor=&#x27;transparent&#x27;; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    // glowing border
    ctx.strokeStyle=&#x27;rgba(255,255,255,.8)&#x27;; ctx.lineWidth=2;
    roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.stroke();
    // fruit emoji
    ctx.font=&#x27;16px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(FRUITS[type], x+CELL/2, y+CELL/2+1);
    if(flash){ ctx.fillStyle=&#x27;rgba(255,255,255,.85)&#x27;; roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.fill(); }
  }

  function draw(){
    // rainbow background
    var g=ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,&#x27;hsl(&#x27;+hue+&#x27;,80%,88%)&#x27;);
    g.addColorStop(1,&#x27;hsl(&#x27;+((hue+60)%360)+&#x27;,80%,80%)&#x27;);
    ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
    // grid subtle lines
    ctx.strokeStyle=&#x27;rgba(255,255,255,.25)&#x27;; ctx.lineWidth=1;
    for(var c=0;c&lt;=COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,canvas.height); ctx.stroke(); }
    for(var r=0;r&lt;=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(canvas.width,r*CELL); ctx.stroke(); }
    // locked
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]&gt;=0){
      drawCell(c,r,grid[r][c],false,flashRows.indexOf(r)&gt;=0);
    }
    // ghost + piece
    if(piece){
      var gy=ghostY();
      for(var r=0;r&lt;piece.m.length;r++) for(var c=0;c&lt;piece.m[r].length;c++) if(piece.m[r][c]){
        var yy=gy+r; if(yy&gt;=0) drawCell(piece.x+c,yy,piece.type,true,false);
      }
      for(var r=0;r&lt;piece.m.length;r++) for(var c=0;c&lt;piece.m[r].length;c++) if(piece.m[r][c]){
        var yy=piece.y+r; if(yy&gt;=0) drawCell(piece.x+c,yy,piece.type,false,false);
      }
    }
    // particles
    for(var i=0;i&lt;particles.length;i++){
      var p=particles[i];
      ctx.globalAlpha=p.life;
      ctx.fillStyle=&#x27;hsl(&#x27;+p.hue+&#x27;,90%,60%)&#x27;;
      ctx.beginPath(); ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  var animId;
  function loop(){
    if(particles.length){
      for(var i=particles.length-1;i&gt;=0;i--){
        var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.03;
        if(p.life&lt;=0) particles.splice(i,1);
      }
      draw();
    }
    animId=requestAnimationFrame(loop);
  }

  function startGame(){
    if(running) return;
    reset(); running=true;
    if(dropId) clearInterval(dropId);
    dropId=setInterval(step,dropMs);
    draw();
    cancelAnimationFrame(animId); loop();
  }
  function stopGame(){
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
    cancelAnimationFrame(animId);
  }
  function endGame(){
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
    addPop(&#x27;GAME OVER&#x27;, 8);
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ hardDrop(); e.preventDefault(); }
  });

  // touch swipe
  var tsx,tsy,tt,moved;
  canvas.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tt=Date.now(); moved=false; },{passive:true});
  canvas.addEventListener(&#x27;touchmove&#x27;,function(e){
    var t=e.touches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&gt;26 &amp;&amp; Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); tsx=t.clientX; tsy=t.clientY; moved=true; }
    else if(dy&gt;40){ hardDrop(); moved=true; tsy=t.clientY; tsx=t.clientX; }
  },{passive:true});
  canvas.addEventListener(&#x27;touchend&#x27;,function(e){
    if(!moved &amp;&amp; Date.now()-tt&lt;300) rotate();
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  reset(); running=false; if(dropId){clearInterval(dropId);dropId=null;}
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
