<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

  .controls { margin-top: 14px; display: flex; gap: 10px; }

  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #06060f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#25f4ee,#a24bff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,80,255,.4); }
  .instructions { font-size: 16px; color: #9fa8c8; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; margin: 0; color: #25f4ee;
           text-shadow: 0 0 10px #25f4ee, 0 0 22px rgba(37,244,238,.6); }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #0a0a18; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys and eat pickups: yellow star = 1, orange gem = 3, rare white orb = 5 (grab it fast!). Avoid the walls and your own tail — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var CELL = 20, COLS = 30, ROWS = 22;
var W = COLS * CELL, H = ROWS * CELL;

var running = false, gameOver = false;
var snake, dir, pendingDir, score, moveTimer, moveInterval;
var pickups, particles, flash, glow, endAnim;
var lastTime = 0, rafId = null;

function baseInterval() {
  // speeds up as score climbs: 150ms down to ~65ms
  return Math.max(65, 150 - score * 3);
}

function initSnake() {
  snake = [{x:5,y:11},{x:4,y:11},{x:3,y:11}];
  dir = {x:1,y:0};
  pendingDir = {x:1,y:0};
}

function occupied(x,y){
  for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  for(var i=0;i&lt;pickups.length;i++) if(pickups[i].x===x&amp;&amp;pickups[i].y===y) return true;
  return false;
}
function freeCell(){
  for(var t=0;t&lt;300;t++){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if(!occupied(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}

function spawnPickup(type){
  var c = freeCell();
  var p = {x:c.x, y:c.y, type:type, born:performance.now()};
  if(type===&#x27;star&#x27;){ p.points=1; }
  else if(type===&#x27;gem&#x27;){ p.points=3; }
  else { p.points=5; p.life=4000; }
  pickups.push(p);
}

function ensurePickups(){
  var hasStar=false, hasGem=false;
  for(var i=0;i&lt;pickups.length;i++){
    if(pickups[i].type===&#x27;star&#x27;) hasStar=true;
    if(pickups[i].type===&#x27;gem&#x27;) hasGem=true;
  }
  if(!hasStar) spawnPickup(&#x27;star&#x27;);
  if(!hasGem) spawnPickup(&#x27;gem&#x27;);
  // rare orb: chance to appear if none present
  var hasOrb=false;
  for(var i=0;i&lt;pickups.length;i++) if(pickups[i].type===&#x27;orb&#x27;) hasOrb=true;
  if(!hasOrb &amp;&amp; Math.random()&lt;0.012) spawnPickup(&#x27;orb&#x27;);
}

function burst(px,py,color){
  for(var i=0;i&lt;18;i++){
    var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3.5;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function cellCenter(cx,cy){ return {x:cx*CELL+CELL/2, y:cy*CELL+CELL/2}; }

function startGame(){
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  gameOver=false; endAnim=null;
  initSnake();
  pickups=[]; particles=[]; flash=0; glow=0;
  spawnPickup(&#x27;star&#x27;); spawnPickup(&#x27;gem&#x27;);
  moveTimer=0; moveInterval=baseInterval();
  running=true;
  lastTime=performance.now();
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

function step(){
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0];
  var nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ triggerEnd(); return; }
  var ateIdx=-1;
  for(var i=0;i&lt;pickups.length;i++) if(pickups[i].x===nx&amp;&amp;pickups[i].y===ny) ateIdx=i;
  var willEat = ateIdx&gt;=0;
  var body = willEat ? snake : snake.slice(0,snake.length-1);
  for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ triggerEnd(); return; }
  snake.unshift({x:nx,y:ny});
  if(willEat){
    var p=pickups[ateIdx];
    score+=p.points; scoreEl.textContent=score;
    var cc=cellCenter(p.x,p.y);
    var col = p.type===&#x27;star&#x27;?&#x27;#ffe14d&#x27;:(p.type===&#x27;gem&#x27;?&#x27;#ff9b2e&#x27;:&#x27;#ffffff&#x27;);
    burst(cc.x,cc.y,col);
    flash=Math.min(1, 0.5 + p.points*0.08);
    pickups.splice(ateIdx,1);
    moveInterval=baseInterval();
  } else {
    snake.pop();
  }
}

function triggerEnd(){
  gameOver=true; running=false;
  endAnim={t:0, phase:&#x27;flash&#x27;};
  moveTimer=0;
}

function loop(ts){
  var dt = ts-lastTime; lastTime=ts;
  if(running &amp;&amp; !gameOver){
    moveTimer+=dt;
    if(moveTimer&gt;=moveInterval){ moveTimer-=moveInterval; step(); }
    // expire orbs
    for(var i=pickups.length-1;i&gt;=0;i--){
      var p=pickups[i];
      if(p.type===&#x27;orb&#x27; &amp;&amp; ts-p.born&gt;p.life){
        var cc=cellCenter(p.x,p.y); burst(cc.x,cc.y,&#x27;#8888ff&#x27;);
        pickups.splice(i,1);
      }
    }
    ensurePickups();
  }
  // particles
  for(var i=particles.length-1;i&gt;=0;i--){
    var pt=particles[i];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.92; pt.vy*=0.92;
    pt.life-=dt/650;
    if(pt.life&lt;=0) particles.splice(i,1);
  }
  if(flash&gt;0) flash=Math.max(0, flash-dt/250);
  glow += dt*0.002;
  if(gameOver &amp;&amp; endAnim) endAnim.t+=dt;
  draw(ts);
  rafId=requestAnimationFrame(loop);
}

function roundedSeg(x,y,w,h,r,color,shadow){
  ctx.fillStyle=color;
  if(shadow){ ctx.shadowColor=shadow; ctx.shadowBlur=14; } else ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
}

function lerpColor(a,b,t){
  return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];
}

function draw(ts){
  // background with subtle pulsing glow
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=&#x27;#0a0a18&#x27;; ctx.fillRect(0,0,W,H);
  var pulse = 0.5+0.5*Math.sin(glow);
  var g=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,W*0.7);
  g.addColorStop(0,&#x27;rgba(50,30,90,&#x27;+(0.18+pulse*0.12)+&#x27;)&#x27;);
  g.addColorStop(1,&#x27;rgba(10,10,24,0)&#x27;);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle=&#x27;rgba(80,80,140,0.12)&#x27;; ctx.lineWidth=1;
  for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
  for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }

  // wall warning
  var head = snake[0];
  var near = head.x&lt;=1 || head.x&gt;=COLS-2 || head.y&lt;=1 || head.y&gt;=ROWS-2;
  if(!gameOver){
    var wp = near ? (0.5+0.5*Math.sin(ts*0.02)) : 0.25;
    ctx.strokeStyle = near ? &#x27;rgba(255,50,60,&#x27;+wp+&#x27;)&#x27; : &#x27;rgba(120,80,255,0.25)&#x27;;
    ctx.lineWidth = near ? 4 : 2;
    ctx.shadowColor = near ? &#x27;rgba(255,40,50,0.8)&#x27; : &#x27;rgba(120,80,255,0.4)&#x27;;
    ctx.shadowBlur = near ? 16 : 6;
    ctx.strokeRect(2,2,W-4,H-4);
    ctx.shadowBlur=0;
  }

  // pickups
  for(var i=0;i&lt;pickups.length;i++){
    var p=pickups[i], cc=cellCenter(p.x,p.y);
    if(p.type===&#x27;star&#x27;){
      var bl=0.5+0.5*Math.sin(ts*0.006);
      drawStar(cc.x,cc.y, CELL*0.4, &#x27;#ffe14d&#x27;, 0.5+bl*0.5);
    } else if(p.type===&#x27;gem&#x27;){
      var pu=0.7+0.3*Math.sin(ts*0.009);
      drawGem(cc.x,cc.y, CELL*0.42*pu, ts*0.004);
    } else {
      var rem = 1-(ts-p.born)/p.life;
      var fl = (Math.floor(ts*0.012)%2)===0;
      if(fl){
        ctx.save();
        ctx.shadowColor=&#x27;#ffffff&#x27;; ctx.shadowBlur=20;
        ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(0.6+0.4*rem)+&#x27;)&#x27;;
        ctx.beginPath(); ctx.arc(cc.x,cc.y,CELL*0.42,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  }

  // snake gradient ribbon
  var cyan=[37,244,238], purple=[120,40,180];
  var flashSnake = gameOver &amp;&amp; endAnim &amp;&amp; endAnim.phase===&#x27;flash&#x27; &amp;&amp; (Math.floor(endAnim.t/150)%2===0) &amp;&amp; endAnim.t&lt;900;
  for(var i=snake.length-1;i&gt;=0;i--){
    var s=snake[i];
    var t=i/Math.max(1,snake.length-1);
    var c=lerpColor(cyan,purple,t);
    var col = flashSnake ? &#x27;#ffffff&#x27; : &#x27;rgb(&#x27;+c[0]+&#x27;,&#x27;+c[1]+&#x27;,&#x27;+c[2]+&#x27;)&#x27;;
    var pad = 1.5 + (1-t)*1;
    var sh = i===0 ? (flashSnake?&#x27;#ffffff&#x27;:&#x27;rgba(37,244,238,0.9)&#x27;) : null;
    roundedSeg(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 6, col, sh);
  }
  // eyes on head
  if(!flashSnake){
    var hh=snake[0];
    ctx.fillStyle=&#x27;#04121a&#x27;;
    var ex=hh.x*CELL+CELL/2, ey=hh.y*CELL+CELL/2;
    var ox=dir.x*3, oy=dir.y*3;
    ctx.beginPath(); ctx.arc(ex-dir.y*4+ox, ey-dir.x*4+oy,2.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+dir.y*4+ox, ey+dir.x*4+oy,2.2,0,Math.PI*2); ctx.fill();
  }

  // particles
  for(var i=0;i&lt;particles.length;i++){
    var pt=particles[i];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.shadowColor=pt.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,2.5*pt.life+1,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // screen flash
  if(flash&gt;0){
    ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.35)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  // game over overlay
  if(gameOver &amp;&amp; endAnim){
    if(endAnim.t&gt;=900) endAnim.phase=&#x27;msg&#x27;;
    var dim = Math.min(0.72, endAnim.t/900*0.72);
    ctx.fillStyle=&#x27;rgba(4,4,14,&#x27;+dim+&#x27;)&#x27;; ctx.fillRect(0,0,W,H);
    if(endAnim.phase===&#x27;msg&#x27;){
      var a=Math.min(1,(endAnim.t-900)/600);
      ctx.globalAlpha=a;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillStyle=&#x27;#ff4d6d&#x27;;
      ctx.shadowColor=&#x27;#ff2d55&#x27;; ctx.shadowBlur=24;
      ctx.font=&#x27;800 46px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-8);
      ctx.shadowBlur=10;
      ctx.fillStyle=&#x27;#25f4ee&#x27;;
      ctx.font=&#x27;700 26px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27;+score, W/2, H/2+34);
      ctx.globalAlpha=1; ctx.shadowBlur=0;
    }
  }
}

function drawStar(cx,cy,r,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=14;
  ctx.beginPath();
  for(var i=0;i&lt;10;i++){
    var ang=Math.PI/2 + i*Math.PI/5;
    var rad = i%2===0 ? r : r*0.45;
    var x=cx+Math.cos(ang)*rad, y=cy-Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawGem(cx,cy,r,rot){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.fillStyle=&#x27;#ff9b2e&#x27;; ctx.shadowColor=&#x27;#ff7b00&#x27;; ctx.shadowBlur=16;
  ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r,0); ctx.lineTo(0,r); ctx.lineTo(-r,0); ctx.closePath();
  ctx.fill();
  ctx.fillStyle=&#x27;rgba(255,220,150,0.7)&#x27;;
  ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r*0.5,-r*0.2); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
  ctx.restore();
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
});
window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
initSnake();
pickups=[{x:20,y:8,type:&#x27;star&#x27;,born:0},{x:12,y:15,type:&#x27;gem&#x27;,born:0}];
particles=[]; flash=0; glow=0; gameOver=false; endAnim=null; score=0;
draw(performance.now());
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
