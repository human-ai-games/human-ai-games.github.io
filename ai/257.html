<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #000; color: #0ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #b0f0ff; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; }
  .score { color: #0ff; text-shadow: 0 0 8px #0ff; }
  .lives { font-size: 20px; letter-spacing: 3px; }
  #wrap { position: relative; width: 620px; height: 460px; }
  canvas { display: block; border-radius: 8px; background: #050008; box-shadow: 0 0 20px #204 inset; filter: saturate(1.3); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON NEBULA&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &amp;larr; &amp;rarr; arrow keys and hold &lt;strong&gt;Space&lt;/strong&gt; to auto-fire lasers at the descending aliens. Don&#x27;t let them reach the bottom — use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;🚀🚀🚀&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 460;
  var scoreEl = document.getElementById(&#x27;score&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

  var running = false, animId = null, spawnId = null;
  var keys = {};
  var ship, bullets, enemies, particles, stars, score, lives, lastShot;
  var combo, comboMult, comboTimer, gameOver, flash;

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 90; i++) {
      var layer = Math.floor(Math.random() * 3);
      stars.push({ x: Math.random() * W, y: Math.random() * H, layer: layer,
        r: 0.5 + layer * 0.6, s: 0.3 + layer * 0.7 });
    }
  }

  function reset() {
    ship = { x: W / 2, y: H - 30, w: 34, h: 26, speed: 5.2, hurt: 0 };
    bullets = []; enemies = []; particles = [];
    score = 0; lives = 3; lastShot = 0;
    combo = 0; comboMult = 1; comboTimer = 0; gameOver = false; flash = 0;
    initStars();
    scoreEl.textContent = &#x27;0&#x27;;
    updateLives();
  }

  function updateLives() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; lives; i++) s += &#x27;🚀&#x27;;
    livesEl.textContent = s || &#x27;💀&#x27;;
  }

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  var ENEMY_TYPES = {
    drone:    { r: 10, color: &#x27;#b060ff&#x27;, hp: 1, points: 1, speed: 1.9, pattern: &#x27;zig&#x27; },
    jelly:    { r: 15, color: &#x27;#ff9020&#x27;, hp: 1, points: 3, speed: 1.3, pattern: &#x27;spiral&#x27; },
    beetle:   { r: 20, color: &#x27;#ff2040&#x27;, hp: 2, points: 10, speed: 1.0, pattern: &#x27;dive&#x27; }
  };

  function spawnEnemy() {
    var roll = Math.random();
    var key = roll &lt; 0.6 ? &#x27;drone&#x27; : (roll &lt; 0.9 ? &#x27;jelly&#x27; : &#x27;beetle&#x27;);
    var t = ENEMY_TYPES[key];
    var x = t.r + Math.random() * (W - 2 * t.r);
    enemies.push({ key: key, x: x, baseX: x, y: -t.r, r: t.r, color: t.color,
      hp: t.hp, maxhp: t.hp, points: t.points, speed: t.speed, pattern: t.pattern,
      phase: Math.random() * Math.PI * 2, flash: 0, pulse: Math.random() * Math.PI * 2 });
  }

  function shoot() {
    var now = Date.now();
    if (now - lastShot &lt; 130) return;
    lastShot = now;
    bullets.push({ x: ship.x, y: ship.y - ship.h / 2, vy: -9 });
    beep(880, 0.06, &#x27;square&#x27;, 0.03);
  }

  function explode(x, y, color, n) {
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, color: color, size: 2 + Math.random() * 2.5 });
    }
  }

  function loseLife() {
    lives--;
    updateLives();
    ship.hurt = 30;
    flash = 12;
    combo = 0; comboMult = 1;
    beep(140, 0.3, &#x27;sawtooth&#x27;, 0.06);
    if (lives &lt;= 0) { gameOver = true; }
  }

  function addCombo() {
    combo++;
    comboTimer = 90;
    if (combo &gt;= 3) comboMult = 2;
    else comboMult = 1;
  }

  function tick() {
    if (!running) return;
    // input
    if (!gameOver) {
      if (keys[&#x27;ArrowLeft&#x27;]) ship.x -= ship.speed;
      if (keys[&#x27;ArrowRight&#x27;]) ship.x += ship.speed;
      ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
      if (keys[&#x27;Space&#x27;]) shoot();
    }

    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var st = stars[i];
      st.y += st.s;
      if (st.y &gt; H) { st.y = 0; st.x = Math.random() * W; }
    }

    if (!gameOver) {
      // bullets
      for (var b = bullets.length - 1; b &gt;= 0; b--) {
        bullets[b].y += bullets[b].vy;
        if (bullets[b].y &lt; -10) bullets.splice(b, 1);
      }
      // enemies movement
      for (var e = enemies.length - 1; e &gt;= 0; e--) {
        var en = enemies[e];
        en.y += en.speed;
        en.phase += 0.06;
        en.pulse += 0.15;
        if (en.pattern === &#x27;zig&#x27;) en.x = en.baseX + Math.sin(en.phase) * 40;
        else if (en.pattern === &#x27;spiral&#x27;) en.x = en.baseX + Math.sin(en.phase * 1.5) * 60;
        else if (en.pattern === &#x27;dive&#x27;) { en.speed += 0.02; }
        en.x = Math.max(en.r, Math.min(W - en.r, en.x));
        if (en.flash &gt; 0) en.flash--;
        if (en.y - en.r &gt; H) {
          enemies.splice(e, 1);
          if (!gameOver) loseLife();
        }
      }
      // collisions
      for (var bi = bullets.length - 1; bi &gt;= 0; bi--) {
        var bu = bullets[bi];
        for (var ei = enemies.length - 1; ei &gt;= 0; ei--) {
          var em = enemies[ei];
          var dx = bu.x - em.x, dy = bu.y - em.y;
          if (dx * dx + dy * dy &lt; (em.r + 4) * (em.r + 4)) {
            bullets.splice(bi, 1);
            em.hp--;
            if (em.hp &lt;= 0) {
              explode(em.x, em.y, em.color, em.key === &#x27;beetle&#x27; ? 26 : (em.key === &#x27;jelly&#x27; ? 18 : 10));
              addCombo();
              score += em.points * comboMult;
              scoreEl.textContent = score;
              enemies.splice(ei, 1);
              beep(em.key === &#x27;beetle&#x27; ? 320 : 520, 0.12, &#x27;triangle&#x27;, 0.05);
            } else {
              em.flash = 8;
              beep(660, 0.05, &#x27;square&#x27;, 0.03);
            }
            break;
          }
        }
      }
      // particles
      for (var p = particles.length - 1; p &gt;= 0; p--) {
        var pt = particles[p];
        pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life -= 0.03;
        if (pt.life &lt;= 0) particles.splice(p, 1);
      }
      if (comboTimer &gt; 0) comboTimer--;
      else { combo = 0; comboMult = 1; }
      if (ship.hurt &gt; 0) ship.hurt--;
      if (flash &gt; 0) flash--;
    }

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = &#x27;#050008&#x27;;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.3 + st.layer * 0.3;
      ctx.fillStyle = st.layer === 2 ? &#x27;#8ff&#x27; : (st.layer === 1 ? &#x27;#adf&#x27; : &#x27;#557&#x27;);
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.shadowBlur = 12;

    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.shadowColor = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.fillStyle = &#x27;#0ff&#x27;;
    ctx.shadowColor = &#x27;#0ff&#x27;;
    for (var b = 0; b &lt; bullets.length; b++) {
      ctx.fillRect(bullets[b].x - 2, bullets[b].y - 8, 4, 14);
    }

    // enemies
    for (var e = 0; e &lt; enemies.length; e++) {
      var en = enemies[e];
      var col = en.flash &gt; 0 ? &#x27;#ffffff&#x27; : en.color;
      ctx.fillStyle = col;
      ctx.strokeStyle = col;
      ctx.shadowColor = col;
      if (en.key === &#x27;drone&#x27;) {
        ctx.beginPath();
        ctx.moveTo(en.x, en.y - en.r);
        ctx.lineTo(en.x + en.r, en.y + en.r);
        ctx.lineTo(en.x - en.r, en.y + en.r);
        ctx.closePath();
        ctx.fill();
      } else if (en.key === &#x27;jelly&#x27;) {
        var pr = en.r + Math.sin(en.pulse) * 2;
        ctx.beginPath();
        ctx.arc(en.x, en.y, pr, Math.PI, 0);
        ctx.lineTo(en.x + pr, en.y + pr * 0.4);
        ctx.lineTo(en.x - pr, en.y + pr * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 2;
        for (var t = -2; t &lt;= 2; t++) {
          ctx.beginPath();
          ctx.moveTo(en.x + t * pr * 0.4, en.y + pr * 0.4);
          ctx.lineTo(en.x + t * pr * 0.4, en.y + pr * 0.4 + 8 + Math.sin(en.pulse + t) * 3);
          ctx.stroke();
        }
      } else {
        ctx.beginPath();
        ctx.ellipse(en.x, en.y, en.r, en.r * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = &#x27;#ffaa00&#x27;;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(en.x - en.r, en.y);
        ctx.lineTo(en.x + en.r, en.y);
        ctx.stroke();
        if (en.hp &lt; en.maxhp) {
          ctx.fillStyle = &#x27;#fff&#x27;;
          ctx.beginPath(); ctx.arc(en.x, en.y - 4, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // ship
    ctx.globalAlpha = (ship.hurt &gt; 0 &amp;&amp; Math.floor(ship.hurt / 3) % 2 === 0) ? 0.3 : 1;
    var shipCol = ship.hurt &gt; 0 ? &#x27;#ff3040&#x27; : &#x27;#0ff&#x27;;
    ctx.fillStyle = shipCol;
    ctx.shadowColor = shipCol;
    ctx.beginPath();
    ctx.moveTo(ship.x, ship.y - ship.h / 2);
    ctx.lineTo(ship.x + ship.w / 2, ship.y + ship.h / 2);
    ctx.lineTo(ship.x, ship.y + ship.h / 4);
    ctx.lineTo(ship.x - ship.w / 2, ship.y + ship.h / 2);
    ctx.closePath();
    ctx.fill();
    // thruster
    ctx.fillStyle = &#x27;#f0f&#x27;;
    ctx.shadowColor = &#x27;#f0f&#x27;;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y + ship.h / 4 + 3, 3 + Math.random() * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();

    // hurt flash overlay
    if (flash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(255,40,60,&#x27; + (flash / 30) + &#x27;)&#x27;;
      ctx.fillRect(0, 0, W, H);
    }

    // combo text
    if (comboMult &gt;= 2 &amp;&amp; comboTimer &gt; 0) {
      ctx.save();
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(Date.now() / 100);
      ctx.fillStyle = &#x27;#ffd000&#x27;;
      ctx.shadowColor = &#x27;#ffd000&#x27;;
      ctx.shadowBlur = 20;
      ctx.font = &#x27;bold 34px system-ui, sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(&#x27;COMBO x&#x27; + comboMult, W / 2, H / 2);
      ctx.restore();
    }

    // game over
    if (gameOver) {
      ctx.fillStyle = &#x27;rgba(0,0,0,0.7)&#x27;;
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillStyle = &#x27;#ff2050&#x27;;
      ctx.shadowColor = &#x27;#ff2050&#x27;;
      ctx.shadowBlur = 25;
      ctx.font = &#x27;bold 48px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, W / 2, H / 2 - 10);
      ctx.fillStyle = &#x27;#0ff&#x27;;
      ctx.shadowColor = &#x27;#0ff&#x27;;
      ctx.font = &#x27;bold 26px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27; + score, W / 2, H / 2 + 38);
      ctx.restore();
    }
  }

  function startGame() {
    if (running) return;
    reset();
    running = true;
    spawnEnemy();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(function () { if (!gameOver) spawnEnemy(); }, 900);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { keys[&#x27;ArrowLeft&#x27;] = true; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { keys[&#x27;ArrowRight&#x27;] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { keys[&#x27;Space&#x27;] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) keys[&#x27;ArrowLeft&#x27;] = false;
    else if (e.key === &#x27;ArrowRight&#x27;) keys[&#x27;ArrowRight&#x27;] = false;
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) keys[&#x27;Space&#x27;] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static render
  reset();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }

<script>
