&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌊 COSMIC REEF DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Pilot your sub with &lt;strong&gt;← →&lt;/strong&gt; and fire homing bubbles with &lt;strong&gt;Space&lt;/strong&gt; — jellyfish pop in 1 hit, urchins in 3, boss crabs in 8. Use the Start/Restart button below to dive in.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;scoreVal&quot;&gt;0&lt;/span&gt; &lt;span class=&quot;mult&quot; id=&quot;multVal&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;← → Move &amp;nbsp;|&amp;nbsp; Space = Shoot&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;threatbar&quot;&gt;
    &lt;span class=&quot;lbl&quot;&gt;NEXT WAVE:&lt;/span&gt;
    &lt;span class=&quot;swatch&quot; id=&quot;nextSwatch&quot; style=&quot;color:#5cff9e&quot;&gt;&lt;/span&gt;
    &lt;span id=&quot;nextName&quot;&gt;Jellyfish&lt;/span&gt;
    &lt;span class=&quot;lbl&quot; style=&quot;margin-left:auto&quot; id=&quot;depthLbl&quot;&gt;Depth 0m&lt;/span&gt;

    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press &lt;strong&gt;&amp;nbsp;Start&amp;nbsp;&lt;/strong&gt; below to begin your dive.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 430;
var scoreEl = document.getElementById(&#x27;scoreVal&#x27;), multEl = document.getElementById(&#x27;multVal&#x27;);
var nextSwatch = document.getElementById(&#x27;nextSwatch&#x27;), nextName = document.getElementById(&#x27;nextName&#x27;);
var depthLbl = document.getElementById(&#x27;depthLbl&#x27;), overlay = document.getElementById(&#x27;overlay&#x27;);

var running=false, animId=null, lastT=0, elapsed=0;
var keys={}, shipX=W/2, score=0, mult=1, multTimer=0;
var bullets=[], enemies=[], particles=[], floats=[], corals=[], motes=[];
var shake=0, lastShot=0, spawnTimer=0, bossTimer=0, combo=0, comboTimer=0;
var nextType=&#x27;jelly&#x27;;

var TYPES={
  jelly:{name:&#x27;Jellyfish&#x27;,color:&#x27;#5cff9e&#x27;,hp:1,r:16,speed:0.9,score:10},
  urchin:{name:&#x27;Sea Urchin&#x27;,color:&#x27;#ff8a3d&#x27;,hp:3,r:20,speed:0.7,score:30},
  boss:{name:&#x27;Boss Crab&#x27;,color:&#x27;#ff5d7a&#x27;,hp:8,r:38,speed:0.5,score:150}
};

// audio
var AC=null;
function actx(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(f,d,type,g){ var a=actx(); if(!a)return; var o=a.createOscillator(),gn=a.createGain();
  o.type=type||&#x27;sine&#x27;; o.frequency.value=f; gn.gain.value=g||0.06;
  o.connect(gn); gn.connect(a.destination); o.start();
  gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d); o.stop(a.currentTime+d); }

function initBg(){
  corals=[]; motes=[];
  for(var i=0;i&lt;10;i++) corals.push({x:Math.random()*W, w:40+Math.random()*70, h:40+Math.random()*90, layer:Math.random()&lt;0.5?0:1});
  for(var j=0;j&lt;40;j++) motes.push({x:Math.random()*W, y:Math.random()*H, s:0.3+Math.random()*1.2, r:0.5+Math.random()*1.8});
}

function pickNext(){
  var r=Math.random();
  nextType = r&lt;0.62?&#x27;jelly&#x27;:&#x27;urchin&#x27;;
  var t=TYPES[nextType];
  nextSwatch.style.color=t.color;
  nextName.textContent=t.name;
}

function spawnEnemy(type){
  var t=TYPES[type];
  var x=t.r+Math.random()*(W-2*t.r);
  var diff=1+elapsed/25;
  enemies.push({type:type, x:x, y:-t.r, hp:t.hp, maxhp:t.hp, r:t.r,
    vy:t.speed*diff, phase:Math.random()*Math.PI*2, amp:20+Math.random()*40, flash:0});
}

function shoot(){
  var now=performance.now();
  if(now-lastShot&lt;220) return;
  lastShot=now;
  bullets.push({x:shipX, y:H-46, vy:-6, target:null});
  beep(720,0.08,&#x27;square&#x27;,0.04);
}

function nearestEnemy(x,y){
  var best=null,bd=1e9;
  for(var i=0;i&lt;enemies.length;i++){ var e=enemies[i]; var d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y); if(d&lt;bd){bd=d;best=e;} }
  return best;
}

function burst(x,y,color,n){
  for(var i=0;i&lt;n;i++){ var a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color,r:2+Math.random()*3}); }
}

function addFloat(x,y,txt,color){ floats.push({x:x,y:y,txt:txt,color:color,life:1}); }

function hitEnemy(e,bIndex){
  e.hp--; e.flash=1;
  var t=TYPES[e.type];
  burst(e.x,e.y,t.color,6);
  shake=Math.min(shake+3,10);
  bullets.splice(bIndex,1);
  beep(300,0.06,&#x27;sine&#x27;,0.05);
  if(e.hp&lt;=0){
    // combo
    combo++; comboTimer=1.2;
    if(combo&gt;=2){ mult=Math.min(1+Math.floor(combo/2),5); multTimer=2.5; }
    var gain=Math.round(t.score*mult);
    score+=gain;
    scoreEl.textContent=score;
    burst(e.x,e.y,t.color,e.type===&#x27;boss&#x27;?40:16);
    shake=Math.min(shake+ (e.type===&#x27;boss&#x27;?14:5),18);
    beep(e.type===&#x27;boss&#x27;?140:520,0.2,&#x27;triangle&#x27;,0.07);
    if(combo&gt;=2) addFloat(e.x,e.y-10,&#x27;+COMBO x&#x27;+mult+&#x27;!&#x27;,&#x27;#ffde5c&#x27;);
    else addFloat(e.x,e.y-10,&#x27;+&#x27;+gain,t.color);
    if(e.type===&#x27;boss&#x27;){ mult=Math.min(mult+2,5); multTimer=6; addFloat(e.x,e.y-30,&#x27;💎 x&#x27;+mult+&#x27; GEM!&#x27;,&#x27;#7fe7ff&#x27;); }
    var ei=enemies.indexOf(e); if(ei&gt;=0) enemies.splice(ei,1);
  }
}

function update(dt){
  elapsed+=dt;
  var diff=1+elapsed/25;
  depthLbl.textContent=&#x27;Depth &#x27;+Math.floor(elapsed*8)+&#x27;m&#x27;;

  // ship move
  if(keys[&#x27;ArrowLeft&#x27;]) shipX-=5;
  if(keys[&#x27;ArrowRight&#x27;]) shipX+=5;
  shipX=Math.max(24,Math.min(W-24,shipX));

  // spawn
  spawnTimer-=dt;
  if(spawnTimer&lt;=0){ spawnEnemy(nextType); spawnTimer=Math.max(0.6,1.6-elapsed/40); pickNext(); }
  bossTimer-=dt;
  if(bossTimer&lt;=0){ spawnEnemy(&#x27;boss&#x27;); bossTimer=15; }

  // bullets
  for(var i=bullets.length-1;i&gt;=0;i--){ var b=bullets[i];
    if(!b.target||b.target.hp&lt;=0||enemies.indexOf(b.target)&lt;0) b.target=nearestEnemy(b.x,b.y);
    if(b.target){ var dx=b.target.x-b.x, dy=b.target.y-b.y, d=Math.hypot(dx,dy)||1;
      b.x+=dx/d*2.5; }
    b.y+=b.vy;
    if(b.y&lt;-10){ bullets.splice(i,1); continue; }
    var hitDone=false;
    for(var j=0;j&lt;enemies.length;j++){ var e=enemies[j];
      if(Math.hypot(e.x-b.x,e.y-b.y)&lt;e.r+5){ hitEnemy(e,i); hitDone=true; break; } }
    if(hitDone) continue;
  }

  // enemies
  for(var k=enemies.length-1;k&gt;=0;k--){ var en=enemies[k];
    en.phase+=dt*2;
    en.x+=Math.sin(en.phase)*en.amp*dt;
    en.x=Math.max(en.r,Math.min(W-en.r,en.x));
    en.y+=en.vy;
    if(en.flash&gt;0) en.flash-=dt*3;
    if(en.y&gt;H+en.r){ enemies.splice(k,1); combo=0; }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){ var pt=particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=dt*1.6;
    if(pt.life&lt;=0) particles.splice(p,1); }

  // floats
  for(var f=floats.length-1;f&gt;=0;f--){ var fl=floats[f]; fl.y-=0.5; fl.life-=dt*0.9; if(fl.life&lt;=0) floats.splice(f,1); }

  // motes parallax
  for(var m=0;m&lt;motes.length;m++){ var mo=motes[m]; mo.y+=mo.s*diff*0.4; if(mo.y&gt;H){ mo.y=-4; mo.x=Math.random()*W; } }

  if(multTimer&gt;0){ multTimer-=dt; if(multTimer&lt;=0){ mult=1; } }
  if(comboTimer&gt;0){ comboTimer-=dt; if(comboTimer&lt;=0) combo=0; }
  multEl.textContent = mult&gt;1 ? &#x27;×&#x27;+mult : &#x27;&#x27;;

  if(shake&gt;0) shake=Math.max(0,shake-dt*30);
}

function drawShip(){
  ctx.save();
  ctx.translate(shipX,H-30);
  ctx.shadowColor=&#x27;#37b6ff&#x27;; ctx.shadowBlur=18;
  ctx.fillStyle=&#x27;#2b8fe0&#x27;;
  ctx.beginPath(); ctx.ellipse(0,0,22,13,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=&#x27;#bff0ff&#x27;;
  ctx.beginPath(); ctx.ellipse(0,-4,9,6,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#ffd85c&#x27;;
  ctx.beginPath(); ctx.moveTo(-4,-13); ctx.lineTo(4,-13); ctx.lineTo(0,-22); ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  var t=TYPES[e.type];
  ctx.save(); ctx.translate(e.x,e.y);
  var glow=e.flash&gt;0?26:14;
  ctx.shadowColor=t.color; ctx.shadowBlur=glow;
  if(e.type===&#x27;jelly&#x27;){
    ctx.fillStyle=e.flash&gt;0?&#x27;#ffffff&#x27;:t.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,0,e.r,e.r*0.6,0,0,Math.PI); ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle=t.color; ctx.lineWidth=2;
    for(var i=-2;i&lt;=2;i++){ ctx.beginPath(); ctx.moveTo(i*6,e.r*0.4);
      ctx.quadraticCurveTo(i*6+Math.sin(e.phase+i)*4,e.r+8,i*6,e.r+16); ctx.stroke(); }
  } else if(e.type===&#x27;urchin&#x27;){
    ctx.fillStyle=e.flash&gt;0?&#x27;#ffffff&#x27;:t.color;
    ctx.beginPath(); ctx.arc(0,0,e.r*0.7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=t.color; ctx.lineWidth=3;
    for(var s=0;s&lt;12;s++){ var a=s/12*Math.PI*2; ctx.beginPath();
      ctx.moveTo(Math.cos(a)*e.r*0.6,Math.sin(a)*e.r*0.6);
      ctx.lineTo(Math.cos(a)*e.r*1.3,Math.sin(a)*e.r*1.3); ctx.stroke(); }
    // crack indicator
    var dmg=e.maxhp-e.hp;
    ctx.shadowBlur=0; ctx.strokeStyle=&#x27;#000&#x27;; ctx.lineWidth=2;
    for(var c=0;c&lt;dmg;c++){ var ca=c*2.1; ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(Math.cos(ca)*e.r*0.6,Math.sin(ca)*e.r*0.6); ctx.stroke(); }
  } else {
    ctx.fillStyle=e.flash&gt;0?&#x27;#ffffff&#x27;:t.color;
    ctx.beginPath(); ctx.ellipse(0,0,e.r,e.r*0.7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#ff8fa3&#x27;;
    ctx.beginPath(); ctx.arc(-e.r*0.7,-e.r*0.3,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e.r*0.7,-e.r*0.3,6,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle=&#x27;#111&#x27;;
    ctx.beginPath(); ctx.arc(-8,-4,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-4,3,0,Math.PI*2); ctx.fill();
    // hp bar
    ctx.fillStyle=&#x27;#300&#x27;; ctx.fillRect(-e.r,-e.r-10,e.r*2,5);
    ctx.fillStyle=&#x27;#5cff9e&#x27;; ctx.fillRect(-e.r,-e.r-10,e.r*2*(e.hp/e.maxhp),5);
  }
  ctx.restore();
}

function render(){
  var ox = shake&gt;0 ? (Math.random()-0.5)*shake : 0;
  var oy = shake&gt;0 ? (Math.random()-0.5)*shake : 0;
  ctx.save(); ctx.translate(ox,oy);
  // darkening overlay w/ time
  var dark=Math.min(0.55,elapsed/120);
  ctx.clearRect(-20,-20,W+40,H+40);
  // corals silhouettes
  for(var i=0;i&lt;corals.length;i++){ var c=corals[i];
    ctx.fillStyle=c.layer===0?&#x27;rgba(10,40,80,0.5)&#x27;:&#x27;rgba(6,24,55,0.7)&#x27;;
    ctx.beginPath(); ctx.moveTo(c.x,H); ctx.lineTo(c.x-c.w/2,H-c.h*0.4); ctx.lineTo(c.x-c.w/4,H); 
    ctx.moveTo(c.x,H); ctx.lineTo(c.x,H-c.h); ctx.lineTo(c.x+c.w/4,H);
    ctx.moveTo(c.x,H); ctx.lineTo(c.x+c.w/2,H-c.h*0.5); ctx.lineTo(c.x+c.w/3,H); ctx.fill(); }
  // motes
  for(var m=0;m&lt;motes.length;m++){ var mo=motes[m];
    ctx.fillStyle=&#x27;rgba(120,190,255,0.5)&#x27;; ctx.beginPath(); ctx.arc(mo.x,mo.y,mo.r,0,Math.PI*2); ctx.fill(); }
  // bullets
  for(var b=0;b&lt;bullets.length;b++){ ctx.save(); ctx.shadowColor=&#x27;#8ff&#x27;; ctx.shadowBlur=10;
    ctx.strokeStyle=&#x27;#bff&#x27;; ctx.fillStyle=&#x27;rgba(150,240,255,0.4)&#x27;; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(bullets[b].x,bullets[b].y,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore(); }
  // enemies
  for(var e=0;e&lt;enemies.length;e++) drawEnemy(enemies[e]);
  // particles
  for(var p=0;p&lt;particles.length;p++){ var pt=particles[p]; ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  drawShip();
  // floats
  for(var f=0;f&lt;floats.length;f++){ var fl=floats[f]; ctx.globalAlpha=Math.max(0,fl.life);
    ctx.fillStyle=fl.color; ctx.font=&#x27;bold 16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(fl.txt,fl.x,fl.y); }
  ctx.globalAlpha=1;
  // darkness
  ctx.fillStyle=&#x27;rgba(0,0,10,&#x27;+dark+&#x27;)&#x27;; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.restore();
}

function loop(t){
  if(!running) return;
  var dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  update(dt); render();
  animId=requestAnimationFrame(loop);
}

function startGame(){
  if(running) return;
  score=0; mult=1; multTimer=0; combo=0; comboTimer=0; elapsed=0;
  shipX=W/2; bullets=[]; enemies=[]; particles=[]; floats=[];
  spawnTimer=0; bossTimer=15; shake=0; lastShot=0;
  for(var k in keys) keys[k]=false;
  scoreEl.textContent=&#x27;0&#x27;; multEl.textContent=&#x27;&#x27;;
  initBg(); pickNext();
  overlay.classList.add(&#x27;hidden&#x27;);
  spawnEnemy(nextType); pickNext();
  running=true; lastT=performance.now(); animId=requestAnimationFrame(loop);
}
function stopGame(){
  if(!running) return;
  running=false; if(animId){cancelAnimationFrame(animId); animId=null;}
  overlay.textContent=&#x27;Dive paused — press Start below to dive again.&#x27;;
  overlay.classList.remove(&#x27;hidden&#x27;);
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) shoot(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

initBg(); render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer

(function () {
