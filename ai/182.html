<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8f6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 18px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       color: #39ff14; text-shadow: 0 0 8px #39ff14, 0 0 18px #16b70a; }
  .instructions { font-size: 16px; color: #9fb8c8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; gap: 22px; font-size: 20px; font-weight: 700; }
  .hud .score { color: #ffe14d; text-shadow: 0 0 8px #ffe14d; }
  .hud .hi { color: #ff43c8; text-shadow: 0 0 8px #ff43c8; }
  .hud .flames { color: #ff7a1a; letter-spacing: 2px; }
  .field { position: relative; width: 560px; height: 400px; flex-shrink: 0;
           background: #0a0d1c; border-radius: 6px; overflow: hidden;
           border: 3px solid #1c3a4a; box-shadow: 0 0 22px rgba(57,255,20,.15) inset; }
  .grid-bg { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(40,90,120,.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(40,90,120,.15) 1px, transparent 1px);
    background-size: 20px 20px; }
  .cell { position: absolute; box-sizing: border-box; }
  .snake { background: #39ff14; border-radius: 3px; box-shadow: 0 0 6px #39ff14; }
  .snake.head { background: #b8ffb0; border-radius: 4px; box-shadow: 0 0 12px #39ff14, 0 0 20px #39ff14; z-index:3; }
  .trail { border-radius: 3px; }
  .star { color:#ffe14d; text-shadow:0 0 8px #ffe14d; animation: blink 1s infinite; }
  .diamond { color:#22e6ff; text-shadow:0 0 8px #22e6ff; animation: spin 1.6s linear infinite; }
  .orb { color:#ff43c8; text-shadow:0 0 10px #ff43c8; animation: pulse .9s ease-in-out infinite; }
  .item { display:flex; align-items:center; justify-content:center; font-size:16px; z-index:2; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @keyframes spin { from{transform:rotate(0);} to{transform:rotate(360deg);} }
  @keyframes pulse { 0%,100%{transform:scale(.8);} 50%{transform:scale(1.25);} }
  .flash { position:absolute; inset:0; pointer-events:none; z-index:5; border-radius:6px;
           box-shadow: 0 0 0 3px transparent inset; transition: box-shadow .05s; }
  .combo { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
           font-size:60px; font-weight:900; color:#fff; z-index:6; pointer-events:none;
           text-shadow:0 0 14px #ff43c8,0 0 28px #22e6ff; opacity:0; }
  .combo.show { animation: comboPop .8s ease-out; }
  @keyframes comboPop { 0%{transform:translate(-50%,-50%) scale(0); opacity:0;}
    30%{transform:translate(-50%,-50%) scale(1.3); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1); opacity:0;} }
  .overlay { position:absolute; inset:0; z-index:9; background:rgba(5,6,15,.86);
             display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px; border-radius:6px; }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:34px; color:#ff43c8; text-shadow:0 0 12px #ff43c8; }
  .overlay .fin { font-size:22px; color:#ffe14d; }
  .overlay .quip { font-size:18px; color:#9fb8c8; max-width:420px; text-align:center; font-style:italic; }
  .overlay .hint { font-size:15px; color:#5f7688; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys — grab the ★1, ◆3 and ●5 collectibles for points. Side walls wrap around but the top and bottom are deadly, so use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;hi&quot;&gt;Best &lt;span id=&quot;hi&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;flames&quot; id=&quot;flames&quot;&gt;🔥&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;grid-bg&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;div class=&quot;fin&quot; id=&quot;finScore&quot;&gt;Score 0&lt;/div&gt;
      &lt;div class=&quot;fin&quot; id=&quot;finStreak&quot;&gt;Top streak x1&lt;/div&gt;
      &lt;div class=&quot;quip&quot; id=&quot;quip&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 28, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var hiEl = document.getElementById(&#x27;hi&#x27;);
  var flamesEl = document.getElementById(&#x27;flames&#x27;);

  var running=false, tickId=null, orbTimer=null;
  var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
  var score=0, hiScore=0, tier=1;
  var items=[]; // {type,x,y,el,pts,color}
  var lastEatTime=0, streak=0, topStreak=1;
  var audioCtx=null;

  var ITEM_DEFS = {
    star:    {pts:1, color:&#x27;#ffe14d&#x27;, glyph:&#x27;★&#x27;, cls:&#x27;star&#x27;},
    diamond: {pts:3, color:&#x27;#22e6ff&#x27;, glyph:&#x27;◆&#x27;, cls:&#x27;diamond&#x27;},
    orb:     {pts:5, color:&#x27;#ff43c8&#x27;, glyph:&#x27;●&#x27;, cls:&#x27;orb&#x27;}
  };

  function tickMs(){ return Math.max(70, 150 - (tier-1)*18); }

  function beep(freq,dur){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=&#x27;square&#x27;; o.frequency.value=freq;
      g.gain.value=0.06; o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
      o.stop(audioCtx.currentTime+dur);
    }catch(_){}
  }

  function clearItemsFromDom(){ items.forEach(function(it){ if(it.el&amp;&amp;it.el.parentNode) it.el.parentNode.removeChild(it.el); }); }

  function occupied(x,y){
    for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    for(var j=0;j&lt;items.length;j++) if(items[j].x===x&amp;&amp;items[j].y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function makeItem(type){
    var def=ITEM_DEFS[type], pos=freeCell();
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell item &#x27;+def.cls;
    el.textContent=def.glyph;
    el.style.left=(pos.x*CELL)+&#x27;px&#x27;; el.style.top=(pos.y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
    return {type:type,x:pos.x,y:pos.y,el:el,pts:def.pts,color:def.color};
  }

  function scheduleOrb(){
    if(orbTimer) clearTimeout(orbTimer);
    orbTimer=setTimeout(function(){
      if(!running) return;
      var idx=-1;
      for(var i=0;i&lt;items.length;i++) if(items[i].type===&#x27;orb&#x27;) idx=i;
      if(idx&gt;=0){ var old=items[idx]; if(old.el&amp;&amp;old.el.parentNode) old.el.parentNode.removeChild(old.el);
        items[idx]=makeItem(&#x27;orb&#x27;); }
      scheduleOrb();
    },5000);
  }

  function spawnAllItems(){
    clearItemsFromDom(); items=[];
    items.push(makeItem(&#x27;star&#x27;));
    items.push(makeItem(&#x27;diamond&#x27;));
    items.push(makeItem(&#x27;orb&#x27;));
    scheduleOrb();
  }

  function replaceItem(idx){
    var type=items[idx].type;
    if(items[idx].el&amp;&amp;items[idx].el.parentNode) items[idx].el.parentNode.removeChild(items[idx].el);
    items[idx]=makeItem(type);
    if(type===&#x27;orb&#x27;) scheduleOrb();
  }

  function initSnake(){
    snake=[{x:6,y:10},{x:5,y:10},{x:4,y:10}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  var snakeEls=[];
  function paintSnake(){
    while(snakeEls.length&gt;snake.length){ var e=snakeEls.pop(); if(e.parentNode) e.parentNode.removeChild(e); }
    while(snakeEls.length&lt;snake.length){
      var d=document.createElement(&#x27;div&#x27;); d.className=&#x27;cell snake&#x27;; field.appendChild(d); snakeEls.push(d);
    }
    for(var i=0;i&lt;snake.length;i++){
      var el=snakeEls[i];
      el.className=&#x27;cell snake&#x27;+(i===0?&#x27; head&#x27;:&#x27;&#x27;);
      el.style.left=(snake[i].x*CELL)+&#x27;px&#x27;; el.style.top=(snake[i].y*CELL)+&#x27;px&#x27;;
      el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
      if(i&gt;0){ var fade=Math.max(.35,1-i*0.05); el.style.opacity=fade; }
      else el.style.opacity=1;
    }
  }

  function updateFlames(){
    var s=&#x27;&#x27;; for(var i=0;i&lt;tier;i++) s+=&#x27;🔥&#x27;; flamesEl.textContent=s;
  }

  function doFlash(color){
    flashEl.style.boxShadow=&#x27;0 0 0 3px &#x27;+color+&#x27; inset, 0 0 26px &#x27;+color+&#x27; inset&#x27;;
    setTimeout(function(){ flashEl.style.boxShadow=&#x27;0 0 0 3px transparent inset&#x27;; },160);
  }

  function showCombo(mult){
    comboEl.textContent=&#x27;x&#x27;+mult+&#x27;!&#x27;;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  function tick(){
    if(!running) return;
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    // wrap left/right, deadly top/bottom
    if(nx&lt;0) nx=COLS-1; else if(nx&gt;=COLS) nx=0;
    if(ny&lt;0||ny&gt;=ROWS){ endGame(); return; }

    var eatIdx=-1;
    for(var k=0;k&lt;items.length;k++) if(items[k].x===nx&amp;&amp;items[k].y===ny){ eatIdx=k; break; }
    var ate=eatIdx&gt;=0;
    var body=ate?snake:snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }

    snake.unshift({x:nx,y:ny});
    if(ate){
      var it=items[eatIdx];
      var now=Date.now();
      if(now-lastEatTime&lt;=3000) streak++; else streak=1;
      lastEatTime=now;
      var mult=Math.min(streak,3); // 1,2,3
      if(mult&gt;topStreak) topStreak=mult;
      var gained=it.pts*mult;
      score+=gained;
      scoreEl.textContent=score;
      if(score&gt;hiScore){ hiScore=score; hiEl.textContent=hiScore; }
      var newTier=Math.min(5, 1+Math.floor(score/5));
      if(newTier!==tier){ tier=newTier; updateFlames(); if(tickId){clearInterval(tickId); tickId=setInterval(tick,tickMs());} }
      doFlash(it.color);
      beep(it.type===&#x27;orb&#x27;?880:(it.type===&#x27;diamond&#x27;?660:440),0.12);
      if(mult&gt;1){ showCombo(mult); beep(1100,0.14); }
      replaceItem(eatIdx);
    } else {
      snake.pop();
    }
    paintSnake();
  }

  var QUIPS_LOW=[&quot;Blink and you missed it.&quot;,&quot;The snake barely stretched its legs.&quot;,&quot;We&#x27;ve seen worms move faster.&quot;,&quot;Warm-up round, right?&quot;];
  var QUIPS_MID=[&quot;Now we&#x27;re glowing!&quot;,&quot;Solid neon hustle.&quot;,&quot;Respectable slithering.&quot;,&quot;The grid salutes you.&quot;];
  var QUIPS_HIGH=[&quot;Absolute serpent royalty!&quot;,&quot;The arena bows to you.&quot;,&quot;Legendary neon reflexes!&quot;,&quot;You ARE the grid.&quot;];
  function quipFor(s){
    var arr = s&lt;10?QUIPS_LOW:(s&lt;30?QUIPS_MID:QUIPS_HIGH);
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function endGame(){
    running=false;
    if(tickId){clearInterval(tickId); tickId=null;}
    if(orbTimer){clearTimeout(orbTimer); orbTimer=null;}
    beep(160,0.3);
    document.getElementById(&#x27;finScore&#x27;).textContent=&#x27;Score &#x27;+score;
    document.getElementById(&#x27;finStreak&#x27;).textContent=&#x27;Top streak x&#x27;+topStreak;
    document.getElementById(&#x27;quip&#x27;).textContent=quipFor(score);
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    if(tickId) clearInterval(tickId);
    if(orbTimer) clearTimeout(orbTimer);
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; tier=1; streak=0; topStreak=1; lastEatTime=0;
    scoreEl.textContent=&#x27;0&#x27;; hiEl.textContent=hiScore;
    updateFlames();
    initSnake();
    // remove old snake els
    snakeEls.forEach(function(e){ if(e.parentNode)e.parentNode.removeChild(e); }); snakeEls=[];
    spawnAllItems();
    paintSnake();
    running=true;
    tickId=setInterval(tick,tickMs());
  }
  function stopGame(){
    running=false;
    if(tickId){clearInterval(tickId); tickId=null;}
    if(orbTimer){clearTimeout(orbTimer); orbTimer=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){pendingDir={x:-1,y:0};e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){pendingDir={x:1,y:0};e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){pendingDir={x:0,y:-1};e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){pendingDir={x:0,y:1};e.preventDefault();}
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // Initial static paint
  initSnake(); paintSnake();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
