<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐸 Frog Dash</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(#0b3d2e, #10261f); color: #eafff2; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: #7dffb0; text-shadow: 0 2px 0 #06462c; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #cbeede; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 20px; font-weight: 700; }
  .combo { transition: color .2s, transform .2s; }
  .flashScore { animation: greenpop .5s ease; }
  @keyframes greenpop { 0%{color:#7dffb0;transform:scale(1.5);} 100%{color:inherit;transform:scale(1);} }
  .field { position: relative; width: 620px; height: 456px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .shake { animation: shk .4s; }
  @keyframes shk { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-8px,4px);} 40%{transform:translate(8px,-4px);} 60%{transform:translate(-6px,-4px);} 80%{transform:translate(6px,4px);} }
  .lane { position: absolute; left: 0; right: 0; }
  .obstacle { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 30px; border-radius: 8px; will-change: left; }
  .hero { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 34px; z-index: 20; transition: transform .09s ease; filter: drop-shadow(0 2px 1px rgba(0,0,0,.4)); }
  .hop { animation: hop .16s ease; }
  @keyframes hop { 0%{transform:scale(.7,1.2);} 50%{transform:scale(1.2,.75);} 100%{transform:scale(1,1);} }
  .splat { position: absolute; z-index: 40; font-size: 40px; pointer-events: none; animation: splatp .6s ease forwards; }
  @keyframes splatp { 0%{transform:scale(.3);opacity:0;} 30%{transform:scale(1.4);opacity:1;} 100%{transform:scale(1.1);opacity:0;} }
  .star { position: absolute; z-index: 40; font-size: 18px; pointer-events: none; }
  .overlay { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(6,30,20,.72); color: #eafff2; text-align: center; gap: 8px; }
  .overlay h2 { margin: 0; font-size: 30px; color: #7dffb0; }
  .overlay p { margin: 0; font-size: 18px; }
  .hidden { display: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop your frog to the top lily pads with the arrow keys or swipe. Ride logs and pads, dodge the boat, and stack combos — you have 60 seconds!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot; class=&quot;flashScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;Combo x1&lt;/div&gt;
    &lt;div&gt;⏱ &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;h2&gt;Frog Dash&lt;/h2&gt;&lt;p&gt;Press Start below to play!&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 44;
  var COLS = 14;               // 620/44 ≈ 14
  var ROWS = 10;               // row0 top pads, rows1..8 lanes, row9 grass bank
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO = 34;

  var field = document.getElementById(&#x27;field&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);

  var running = false, animId = null, timerId = null;
  var hero = { col: 6, row: ROWS - 1 };
  var heroEl = null, onLane = null; // lane index frog rides (or null on land)
  var lanes = [];
  var score = 0, combo = 1, timeLeft = 60, crossings = 0, elapsed = 0;

  // Lane templates. type: log/water float (safe ride), turtle (safe when up),
  // boat (deadly fast), pad (safe ride). Water rows require riding.
  function baseLanes() {
    return [
      { type:&#x27;pad&#x27;,    emoji:&#x27;🌸&#x27;, tint:&#x27;rgba(180,120,200,.25)&#x27;, dir:1,  speed:.9, w:2, count:3, deadly:false },
      { type:&#x27;log&#x27;,    emoji:&#x27;🪵&#x27;, tint:&#x27;rgba(120,80,50,.3)&#x27;,    dir:-1, speed:1.1, w:3, count:2, deadly:false },
      { type:&#x27;turtle&#x27;, emoji:&#x27;🐢&#x27;, tint:&#x27;rgba(60,140,120,.28)&#x27;,  dir:1,  speed:1.0, w:1, count:5, deadly:false, submerge:true },
      { type:&#x27;boat&#x27;,   emoji:&#x27;🚤&#x27;, tint:&#x27;rgba(220,120,40,.3)&#x27;,   dir:-1, speed:2.6, w:2, count:2, deadly:true },
      { type:&#x27;log&#x27;,    emoji:&#x27;🪵&#x27;, tint:&#x27;rgba(120,80,50,.3)&#x27;,    dir:1,  speed:1.3, w:3, count:2, deadly:false },
      { type:&#x27;turtle&#x27;, emoji:&#x27;🐢&#x27;, tint:&#x27;rgba(60,140,120,.28)&#x27;,  dir:-1, speed:1.2, w:1, count:6, deadly:false, submerge:true },
      { type:&#x27;pad&#x27;,    emoji:&#x27;🌺&#x27;, tint:&#x27;rgba(180,120,200,.25)&#x27;, dir:1,  speed:1.0, w:2, count:3, deadly:false },
      { type:&#x27;log&#x27;,    emoji:&#x27;🪵&#x27;, tint:&#x27;rgba(120,80,50,.3)&#x27;,    dir:-1, speed:1.5, w:2, count:2, deadly:false }
    ];
  }

  function laneBg(t) {
    // Water lanes get animated-ish blue; grass/pad zones distinct.
    return &#x27;linear-gradient(90deg, rgba(30,90,140,.55), rgba(40,120,170,.55))&#x27;;
  }

  function buildField() {
    field.innerHTML = &#x27;&#x27;;
    field.appendChild(overlay);
    lanes = [];
    // Top safe pad zone (row 0)
    var top = document.createElement(&#x27;div&#x27;);
    top.className = &#x27;lane&#x27;;
    top.style.top = &#x27;0px&#x27;; top.style.height = CELL + &#x27;px&#x27;;
    top.style.background = &#x27;linear-gradient(#2e8b57,#256b45)&#x27;;
    top.textContent = &#x27;&#x27;;
    field.appendChild(top);
    for (var c = 0; c &lt; COLS; c += 2) {
      var pad = document.createElement(&#x27;div&#x27;);
      pad.style.position=&#x27;absolute&#x27;; pad.style.left=(c*CELL)+&#x27;px&#x27;; pad.style.top=&#x27;4px&#x27;;
      pad.style.fontSize=&#x27;26px&#x27;; pad.textContent=&#x27;🌷&#x27;;
      field.appendChild(pad);
    }

    var templates = baseLanes();
    for (var i = 0; i &lt; templates.length; i++) {
      var t = templates[i];
      var laneRow = i + 1;
      var y = laneRow * CELL;
      var laneDiv = document.createElement(&#x27;div&#x27;);
      laneDiv.className = &#x27;lane&#x27;;
      laneDiv.style.top = y + &#x27;px&#x27;;
      laneDiv.style.height = CELL + &#x27;px&#x27;;
      laneDiv.style.background = laneBg(t) + &#x27;,&#x27; + &#x27;&#x27;;
      laneDiv.style.backgroundImage = &#x27;linear-gradient(90deg, rgba(28,84,130,.7), rgba(46,128,180,.7))&#x27;;
      // overlay pastel tint
      var tintDiv = document.createElement(&#x27;div&#x27;);
      tintDiv.style.position=&#x27;absolute&#x27;; tintDiv.style.inset=&#x27;0&#x27;; tintDiv.style.background=t.tint;
      laneDiv.appendChild(tintDiv);
      field.appendChild(laneDiv);

      var obstacles = [];
      var gap = FIELD_W / t.count;
      var owPx = t.w * CELL - 6;
      for (var j = 0; j &lt; t.count; j++) {
        var x = j * gap + (i * 37) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.style.width = owPx + &#x27;px&#x27;;
        el.style.height = (CELL - 8) + &#x27;px&#x27;;
        el.style.top = (y + 4) + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        el.textContent = t.emoji;
        el.style.background = t.deadly ? &#x27;transparent&#x27; : (t.type===&#x27;turtle&#x27; ? &#x27;transparent&#x27; : &#x27;rgba(0,0,0,0)&#x27;);
        field.appendChild(el);
        obstacles.push({ x:x, w:owPx, el:el, subState:0 });
      }
      lanes.push({ y:y, row:laneRow, dir:t.dir, speed:t.speed, base:t.speed, type:t.type,
                   deadly:t.deadly, submerge:!!t.submerge, obstacles:obstacles, subTimer:Math.random()*120 });
    }

    // Bottom grass bank (last row)
    var bank = document.createElement(&#x27;div&#x27;);
    bank.className=&#x27;lane&#x27;;
    bank.style.top=((ROWS-1)*CELL)+&#x27;px&#x27;; bank.style.height=CELL+&#x27;px&#x27;;
    bank.style.background=&#x27;linear-gradient(#3aa76d,#2e8b57)&#x27;;
    field.appendChild(bank);
    for (var g=0; g&lt;COLS; g+=2){
      var gr=document.createElement(&#x27;div&#x27;);
      gr.style.position=&#x27;absolute&#x27;; gr.style.left=(g*CELL+6)+&#x27;px&#x27;; gr.style.top=((ROWS-1)*CELL+6)+&#x27;px&#x27;;
      gr.style.fontSize=&#x27;22px&#x27;; gr.textContent=&#x27;🌿&#x27;;
      field.appendChild(gr);
    }

    makeHero();
    resetHero();
  }

  function addFastLane() {
    // Speed up an existing water lane and add an extra obstacle for tension.
    var candidates = lanes.filter(function(l){ return l.type===&#x27;log&#x27;||l.type===&#x27;pad&#x27;; });
    if (!candidates.length) return;
    var lane = candidates[Math.floor(Math.random()*candidates.length)];
    lane.speed += 0.6;
    var owPx = 2*CELL - 6;
    var el = document.createElement(&#x27;div&#x27;);
    el.className=&#x27;obstacle&#x27;;
    el.style.width=owPx+&#x27;px&#x27;; el.style.height=(CELL-8)+&#x27;px&#x27;;
    el.style.top=(lane.y+4)+&#x27;px&#x27;; el.style.left=(-owPx)+&#x27;px&#x27;;
    el.textContent = lane.type===&#x27;pad&#x27; ? &#x27;🌸&#x27; : &#x27;🪵&#x27;;
    field.appendChild(el);
    lane.obstacles.push({ x:-owPx, w:owPx, el:el, subState:0 });
  }

  function makeHero() {
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.style.width = HERO + &#x27;px&#x27;;
    heroEl.style.height = HERO + &#x27;px&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    field.appendChild(heroEl);
  }

  function paintHero() {
    var x = hero.col * CELL + (CELL - HERO) / 2;
    var y = hero.row * CELL + (CELL - HERO) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = 6; hero.row = ROWS - 1; onLane = null;
    paintHero();
  }

  function bounce() {
    heroEl.classList.remove(&#x27;hop&#x27;);
    void heroEl.offsetWidth;
    heroEl.classList.add(&#x27;hop&#x27;);
  }

  function isWaterRow(row) {
    var idx = row - 1;
    return idx &gt;= 0 &amp;&amp; idx &lt; lanes.length;
  }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      // submerge turtles
      if (lane.submerge) {
        lane.subTimer -= 1;
        if (lane.subTimer &lt;= 0) {
          lane.subTimer = 100 + Math.random()*120;
          for (var s = 0; s &lt; lane.obstacles.length; s++) {
            var ob = lane.obstacles[s];
            ob.subState = ob.subState ? 0 : 1;
            ob.el.textContent = ob.subState ? &#x27;🟥&#x27; : &#x27;🐢&#x27;;
            ob.el.style.opacity = ob.subState ? &#x27;.7&#x27; : &#x27;1&#x27;;
          }
        }
      }
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -o.w;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    // If frog is on a water lane, ride the obstacle it stands on.
    if (isWaterRow(hero.row)) {
      var lane2 = lanes[hero.row - 1];
      var hx = hero.col * CELL + (CELL - HERO) / 2;
      var hcx = hx + HERO/2;

      if (lane2.deadly) {
        // Boat lane: any overlap = death.
        for (var b = 0; b &lt; lane2.obstacles.length; b++) {
          var bo = lane2.obstacles[b];
          if (hx &lt; bo.x + bo.w &amp;&amp; hx + HERO &gt; bo.x) { die(); return; }
        }
      } else {
        // Must be standing on a rideable obstacle, else fall in water.
        var riding = null;
        for (var r = 0; r &lt; lane2.obstacles.length; r++) {
          var ro = lane2.obstacles[r];
          // submerged turtle = not safe
          if (lane2.submerge &amp;&amp; ro.subState) continue;
          if (hcx &gt; ro.x &amp;&amp; hcx &lt; ro.x + ro.w) { riding = ro; break; }
        }
        if (!riding) { die(); return; }
        // carry the frog with the log
        var newX = hx + lane2.dir * lane2.speed;
        hero.col = Math.round((newX) / CELL);
        if (hero.col &lt; 0 || hero.col &gt;= COLS) { die(); return; }
        paintHero();
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    var nc = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    var nr = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    hero.col = nc; hero.row = nr;
    bounce();
    paintHero();
    if (hero.row === 0) win();
  }

  function starBurst(col, row) {
    var cx = col * CELL + CELL/2, cy = row * CELL + CELL/2;
    var chars = [&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;🌟&#x27;,&#x27;💫&#x27;];
    for (var i=0;i&lt;8;i++){
      (function(i){
        var st = document.createElement(&#x27;div&#x27;);
        st.className=&#x27;star&#x27;;
        st.textContent = chars[i%chars.length];
        st.style.left = cx+&#x27;px&#x27;; st.style.top = cy+&#x27;px&#x27;;
        field.appendChild(st);
        var ang = (i/8)*Math.PI*2, dist = 30+Math.random()*30;
        var t0 = performance.now();
        function anim(t){
          var p = Math.min(1,(t-t0)/500);
          st.style.left = (cx + Math.cos(ang)*dist*p) + &#x27;px&#x27;;
          st.style.top = (cy + Math.sin(ang)*dist*p) + &#x27;px&#x27;;
          st.style.opacity = String(1-p);
          if (p&lt;1) requestAnimationFrame(anim); else st.remove();
        }
        requestAnimationFrame(anim);
      })(i);
    }
  }

  function win() {
    starBurst(hero.col, 0);
    score += 10 * combo;
    combo += 1;
    crossings += 1;
    updateHud(true);
    beep(660, .08); beep(880, .08, .05);
    if (crossings % 3 === 0) addFastLane();
    resetHero();
  }

  function die() {
    combo = 1;
    updateHud(false);
    field.classList.remove(&#x27;shake&#x27;); void field.offsetWidth; field.classList.add(&#x27;shake&#x27;);
    var sp = document.createElement(&#x27;div&#x27;);
    sp.className=&#x27;splat&#x27;; sp.textContent=&#x27;💥&#x27;;
    var x = hero.col*CELL, y=hero.row*CELL;
    sp.style.left=x+&#x27;px&#x27;; sp.style.top=y+&#x27;px&#x27;;
    field.appendChild(sp);
    setTimeout(function(){ sp.remove(); }, 600);
    beep(160, .18);
    resetHero();
  }

  function comboColor() {
    if (combo &gt;= 8) return &#x27;#ffd700&#x27;;
    if (combo &gt;= 5) return &#x27;#ffe680&#x27;;
    if (combo &gt;= 3) return &#x27;#fff3b0&#x27;;
    return &#x27;#ffffff&#x27;;
  }

  function updateHud(good) {
    scoreEl.textContent = score;
    comboEl.textContent = &#x27;Combo x&#x27; + combo;
    comboEl.style.color = comboColor();
    comboEl.style.transform = combo&gt;=3 ? &#x27;scale(1.15)&#x27; : &#x27;scale(1)&#x27;;
    if (good) {
      scoreEl.classList.remove(&#x27;flashScore&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;flashScore&#x27;);
    }
  }

  // Web Audio beeps
  var actx = null;
  function beep(freq, dur, delay) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var t = actx.currentTime + (delay||0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.type=&#x27;square&#x27;;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.12, t);
      g.gain.exponentialRampToValueAtTime(.001, t+dur);
      o.start(t); o.stop(t+dur);
    } catch(_){}
  }

  function tickTimer() {
    if (!running) return;
    timeLeft -= 1; elapsed += 1;
    timeEl.textContent = timeLeft;
    // Gradually speed all lanes up over time
    for (var i=0;i&lt;lanes.length;i++){ lanes[i].speed = lanes[i].base + elapsed*0.03; }
    if (timeLeft &lt;= 0) endGame();
  }

  function startGame() {
    if (running) return;
    score = 0; combo = 1; timeLeft = 60; crossings = 0; elapsed = 0;
    scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;Combo x1&#x27;; comboEl.style.color=&#x27;#fff&#x27;;
    comboEl.style.transform=&#x27;scale(1)&#x27;; timeEl.textContent = &#x27;60&#x27;;
    buildField();
    overlay.classList.add(&#x27;hidden&#x27;);
    running = true;
    animId = requestAnimationFrame(tick);
    timerId = setInterval(tickTimer, 1000);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function endGame() {
    stopGame();
    overlay.innerHTML = &#x27;&lt;h2&gt;Time!&lt;/h2&gt;&lt;p&gt;Score: &#x27;+score+&#x27;&lt;/p&gt;&lt;p&gt;Press Start below to play again.&lt;/p&gt;&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  // Keyboard
  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0, 1); e.preventDefault(); }
  });

  // Swipe support
  var tsx=0, tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){
    var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY;
  }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20) return;
    if (Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0);
    else move(0, dy&gt;0?1:-1);
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function (e) {

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,

        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
