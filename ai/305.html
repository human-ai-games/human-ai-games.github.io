<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍎 Fruit Drop Frenzy 🍇</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, #ff5f6d, #ffc371, #47cf73, #4facfe, #b06ab3);
    background-size: 400% 400%; animation: bg 12s ease infinite; }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; height: 640px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; }
  h1 { margin: 0; font-size: 26px; text-shadow: 0 2px 6px rgba(0,0,0,.4); letter-spacing: 1px; }
  .instructions { font-size: 16px; margin: 0; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.5); line-height:1.3; }
  .topbar { display:flex; align-items:center; gap:16px; }
  .score { font-size: 30px; font-weight: 800; text-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .1s; }
  .score.bump { transform: scale(1.3); }
  .combo { font-size: 18px; font-weight:700; color:#fff2a8; min-width:70px; text-align:left; }
  .main { display: flex; gap: 12px; align-items: flex-start; }
  .field { position: relative; width: 240px; height: 480px; background: rgba(0,0,0,.28);

  .side { display:flex; flex-direction:column; gap:8px; }

  .nextgrid { position:relative; width:96px; height:96px; margin:6px auto 0; }

    border-radius:6px; font-size:18px; }

  .spark { position:absolute; font-size:16px; pointer-events:none; }
  .rowflash { position:absolute; left:0; width:100%; background:#fff; opacity:.9; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ←/→, rotate with ↑, and press ↓ to drop faster. Fill full rows to burst them for points before time runs out!&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot; id=&quot;timer&quot;&gt;1:00&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;big&quot; id=&quot;ovEmoji&quot;&gt;🍉&lt;/div&gt;
        &lt;div class=&quot;rate&quot; id=&quot;ovRate&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;fin&quot; id=&quot;ovScore&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;nextbox&quot;&gt;
        &lt;div class=&quot;lbl&quot;&gt;NEXT&lt;/div&gt;
        &lt;div class=&quot;nextgrid&quot; id=&quot;nextgrid&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var running = false, dropId = null, tickId = null;
  var grid = [], piece = null, nextType = null, score = 0, combo = 0, comboTimer = 0;
  var dropMs = 650, elapsed = 0, timeLeft = 60;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);
  var nextgrid = document.getElementById(&#x27;nextgrid&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  var FRUIT = { I:&#x27;🍉&#x27;, O:&#x27;🍋&#x27;, T:&#x27;🍇&#x27;, S:&#x27;🍏&#x27;, Z:&#x27;🍓&#x27;, J:&#x27;🫐&#x27;, L:&#x27;🍊&#x27; };
  var GLOW = { I:&#x27;#ff6b8a&#x27;, O:&#x27;#ffe14d&#x27;, T:&#x27;#c77dff&#x27;, S:&#x27;#7be07b&#x27;, Z:&#x27;#ff5a5a&#x27;, J:&#x27;#5aa0ff&#x27;, L:&#x27;#ffa94d&#x27; };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = Object.keys(SHAPES);

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(0);grid.push(row);} }
  function randType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function makePiece(type){
    var cells = SHAPES[type].map(function(p){return {x:p[0],y:p[1]};});
    return { type:type, cells:cells, ox:3, oy:0 };
  }
  function absCells(p){ return p.cells.map(function(c){return {x:p.ox+c.x, y:p.oy+c.y};}); }

  function collides(p){
    var cs = absCells(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x, y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function rotate(){
    if(!running||!piece||piece.type===&#x27;O&#x27;) return;
    var rc = piece.cells.map(function(c){return {x:c.y, y:-c.x};});
    // normalize to non-negative
    var minx=Math.min.apply(null,rc.map(function(c){return c.x;}));
    var miny=Math.min.apply(null,rc.map(function(c){return c.y;}));
    rc = rc.map(function(c){return {x:c.x-minx, y:c.y-miny};});
    var np = { type:piece.type, cells:rc, ox:piece.ox, oy:piece.oy };
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      np.ox = piece.ox + kicks[k];
      if(!collides(np)){ piece=np; paint(); return; }
    }
  }

  function spawn(){
    piece = makePiece(nextType || randType());
    nextType = randType();
    drawNext();
    if(collides(piece)){ return false; }
    return true;
  }

  function lock(){
    var cs=absCells(piece);
    for(var i=0;i&lt;cs.length;i++){ if(cs[i].y&gt;=0) grid[cs[i].y][cs[i].x]=piece.type; }
    piece=null;
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    if(full.length===0){ combo=0; comboEl.textContent=&#x27;&#x27;; return; }
    // burst animation on full rows
    full.forEach(function(r){ burstRow(r); });
    // remove rows
    full.sort(function(a,b){return a-b;});
    for(var i=full.length-1;i&gt;=0;i--){
      grid.splice(full[i],1);
      var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(0);
      grid.unshift(empty);
    }
    combo++;
    var base = {1:100,2:300,3:600,4:1000}[full.length] || full.length*300;
    var gained = base * combo;
    score += gained;
    scoreEl.textContent = score;
    scoreEl.classList.add(&#x27;bump&#x27;); setTimeout(function(){scoreEl.classList.remove(&#x27;bump&#x27;);},120);
    comboTimer = 30;
    if(combo&gt;1){ comboEl.textContent = &#x27;🔥 x&#x27;+combo; } else { comboEl.textContent=&#x27;&#x27;; }
  }

  function burstRow(r){
    var flash=document.createElement(&#x27;div&#x27;);
    flash.className=&#x27;rowflash&#x27;;
    flash.style.top=(r*CELL)+&#x27;px&#x27;; flash.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(flash);
    setTimeout(function(){ if(flash.parentNode) flash.parentNode.removeChild(flash); },220);
    var emojis=[&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;];
    for(var c=0;c&lt;COLS;c++){
      var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;spark&#x27;;
      s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      var sx=c*CELL+4, sy=r*CELL;
      s.style.left=sx+&#x27;px&#x27;; s.style.top=sy+&#x27;px&#x27;;
      field.appendChild(s);
      (function(el){
        var vx=(Math.random()-.5)*80, vy=-Math.random()*90-20, t=0;
        var id=setInterval(function(){
          t+=0.05; vy+=6;
          el.style.transform=&#x27;translate(&#x27;+(vx*t)+&#x27;px,&#x27;+(vy*t*0.6+t*t*40)+&#x27;px) scale(&#x27;+Math.max(0,1-t)+&#x27;)&#x27;;
          el.style.opacity=Math.max(0,1-t);
          if(t&gt;=1){ clearInterval(id); if(el.parentNode) el.parentNode.removeChild(el); }
        },30);
      })(s);
    }
  }

  function paint(){
    // remove all cell elements (keep overlay)
    var kids=field.querySelectorAll(&#x27;.cell&#x27;);
    for(var i=0;i&lt;kids.length;i++) kids[i].remove();
    // locked
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawCell(c,r,grid[r][c],false);
    // ghost
    if(piece){
      var g={type:piece.type,cells:piece.cells,ox:piece.ox,oy:piece.oy};
      while(!collides({type:g.type,cells:g.cells,ox:g.ox,oy:g.oy+1})) g.oy++;
      absCells(g).forEach(function(cc){ if(cc.y&gt;=0) drawCell(cc.x,cc.y,piece.type,true); });
      absCells(piece).forEach(function(cc){ if(cc.y&gt;=0) drawCell(cc.x,cc.y,piece.type,false); });
    }
  }

  function drawCell(cx,cy,type,ghost){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(ghost?&#x27; ghost&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.textContent=FRUIT[type];
    el.style.background=GLOW[type];
    if(!ghost) el.style.boxShadow=&#x27;0 0 8px &#x27;+GLOW[type];
    field.appendChild(el);
  }

  function drawNext(){
    nextgrid.innerHTML=&#x27;&#x27;;
    if(!nextType) return;
    var cs=SHAPES[nextType];
    var minx=Math.min.apply(null,cs.map(function(p){return p[0];}));
    var maxx=Math.max.apply(null,cs.map(function(p){return p[0];}));
    var miny=Math.min.apply(null,cs.map(function(p){return p[1];}));
    var w=maxx-minx+1;
    var offx=(4-w)/2;
    cs.forEach(function(p){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
      el.style.left=((p[0]-minx+offx)*24)+&#x27;px&#x27;; el.style.top=((p[1]-miny)*24)+&#x27;px&#x27;;
      el.style.width=&#x27;24px&#x27;; el.style.height=&#x27;24px&#x27;;
      el.textContent=FRUIT[nextType]; el.style.background=GLOW[nextType];
      el.style.boxShadow=&#x27;0 0 6px &#x27;+GLOW[nextType];
      nextgrid.appendChild(el);
    });
  }

  function step(){
    if(!piece) return;
    var np={type:piece.type,cells:piece.cells,ox:piece.ox,oy:piece.oy+1};
    if(collides(np)){
      lock(); clearRows();
      if(!spawn()){ endGame(); paint(); return; }
    } else piece=np;
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    var np={type:piece.type,cells:piece.cells,ox:piece.ox+dx,oy:piece.oy};
    if(!collides(np)){ piece=np; paint(); }
  }

  function tick(){
    elapsed++; timeLeft--;
    if(timeLeft&lt;0) timeLeft=0;
    var m=Math.floor(timeLeft/60), s=timeLeft%60;
    timerEl.textContent=m+&#x27;:&#x27;+(s&lt;10?&#x27;0&#x27;:&#x27;&#x27;)+s;
    // speed up every 10s
    if(elapsed%10===0 &amp;&amp; dropMs&gt;150){
      dropMs=Math.max(150,dropMs-90);
      clearInterval(dropId); dropId=setInterval(step,dropMs);
      document.body.style.animationDuration=Math.max(4,12-elapsed/8)+&#x27;s&#x27;;
    }
    if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0){ combo=0; comboEl.textContent=&#x27;&#x27;; } }
    if(timeLeft&lt;=0) endGame();
  }

  function rating(sc){
    if(sc&gt;=6000) return {e:&#x27;🍉&#x27;,t:&#x27;Watermelon Master!&#x27;};
    if(sc&gt;=3500) return {e:&#x27;🍇&#x27;,t:&#x27;Grape Champion!&#x27;};
    if(sc&gt;=2000) return {e:&#x27;🍊&#x27;,t:&#x27;Orange Ace!&#x27;};
    if(sc&gt;=800)  return {e:&#x27;🍋&#x27;,t:&#x27;Lemon Learner!&#x27;};
    return {e:&#x27;🍓&#x27;,t:&#x27;Strawberry Starter&#x27;};
  }

  function endGame(){
    if(!running) return;
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(tickId){clearInterval(tickId);tickId=null;}
    var r=rating(score);
    document.getElementById(&#x27;ovEmoji&#x27;).textContent=r.e;
    document.getElementById(&#x27;ovRate&#x27;).textContent=r.t;
    document.getElementById(&#x27;ovScore&#x27;).textContent=&#x27;Final Score: &#x27;+score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; combo=0; comboTimer=0; dropMs=650; elapsed=0; timeLeft=60;
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;&#x27;; timerEl.textContent=&#x27;1:00&#x27;;
    document.body.style.animationDuration=&#x27;12s&#x27;;
    newGrid(); nextType=randType();
    if(!spawn()){ return; }
    paint();
    running=true;
    if(dropId)clearInterval(dropId); if(tickId)clearInterval(tickId);
    dropId=setInterval(step,dropMs);
    tickId=setInterval(tick,1000);
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(tickId){clearInterval(tickId);tickId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)step();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){rotate();e.preventDefault();}
    else if(e.key===&#x27; &#x27;){ if(running&amp;&amp;piece){ while(!collides({type:piece.type,cells:piece.cells,ox:piece.ox,oy:piece.oy+1}))piece.oy++; step(); } e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial preview
  newGrid(); nextType=randType(); piece=makePiece(randType()); paint(); drawNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
