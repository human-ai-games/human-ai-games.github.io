<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0018; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff2ec4,#7a5cff,#2ee9ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(122,92,255,0.4); }
  .instructions { font-size: 16px; color: #b7a9e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; font-size: 18px; color: #d6ccff; font-weight: 600; }
  .hud .mult { color: #ffd54a; }
  .hud .time { color: #2ee9ff; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #06000f; box-shadow: 0 0 30px rgba(122,92,255,0.35); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the mouse left and right to slide your paddle and bounce the orb into the bricks. Smash golden bricks for power-ups, and rack up points before the timer runs out — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;mult&quot;&gt;Multi: x&lt;span id=&quot;mult&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;time&quot;&gt;Time: &lt;span id=&quot;time&quot;&gt;90&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);

  var running = false, animId = null, lastT = 0;

  // Audio
  var AC = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(AC.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur||0.08));
      o.stop(AC.currentTime + (dur||0.08));
    } catch(_) {}
  }

  // Paddle
  var basePW = 100, PW = basePW, PH = 14, paddleX = (W-PW)/2, paddleY = H - 30;
  var wideTimer = 0;

  // Ball
  var BR = 8, ballX = W/2, ballY = H/2, ballVX = 3, ballVY = -3.2, ballSpeed = 4.6;
  var hotTimer = 0;
  var launchDelay = 0;

  // Bricks
  var COLS = 10, ROWS = 6, brickW, brickH = 22, bTop = 40, bGap = 4;
  var rowColors = [&#x27;#ff2ec4&#x27;,&#x27;#ff5c4d&#x27;,&#x27;#ffd54a&#x27;,&#x27;#5cff8f&#x27;,&#x27;#2ee9ff&#x27;,&#x27;#7a5cff&#x27;];
  var bricks = [];

  var score = 0, mult = 1, hitStreak = 0, timeLeft = 90;
  var particles = [], powerups = [], trail = [];
  var flash = 0, redFlash = 0, paddleFlash = 0;
  var stars = [];

  function initStars() {
    stars = [];
    for (var i=0;i&lt;70;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.6+0.4, v:Math.random()*0.4+0.15});
  }

  function buildBricks() {
    bricks = [];
    brickW = (W - (COLS+1)*bGap) / COLS;
    for (var r=0;r&lt;ROWS;r++){
      for (var c=0;c&lt;COLS;c++){
        var golden = Math.random() &lt; 0.09;
        bricks.push({
          x: bGap + c*(brickW+bGap),
          y: bTop + r*(brickH+bGap),
          alive: true,
          color: golden ? &#x27;#ffd24a&#x27; : rowColors[r % rowColors.length],
          points: (ROWS - r) * 10,
          golden: golden
        });
      }
    }
  }

  function resetBall() {
    ballX = W/2; ballY = H/2;
    var ang = (Math.random()*0.6 - 0.3) - Math.PI/2;
    ballVX = Math.cos(ang)*ballSpeed;
    ballVY = Math.sin(ang)*ballSpeed;
    hotTimer = 0; trail = [];
  }

  function spawnParticles(x,y,color,n) {
    for (var i=0;i&lt;(n||14);i++){
      var a = Math.random()*Math.PI*2, sp = Math.random()*3+1;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color,size:Math.random()*3+1});
    }
  }

  function dropPowerup(x,y) {
    var kind = Math.random()&lt;0.5 ? &#x27;wide&#x27; : &#x27;hot&#x27;;
    powerups.push({x:x,y:y,vy:2,kind:kind});
  }

  function startGame() {
    if (running) return;
    score=0; mult=1; hitStreak=0; timeLeft=90;
    PW=basePW; wideTimer=0; hotTimer=0;
    paddleX=(W-PW)/2;
    ballSpeed=4.6;
    particles=[]; powerups=[]; trail=[]; flash=0; redFlash=0; paddleFlash=0; launchDelay=0;
    initStars(); buildBricks(); resetBall();
    updateHud();
    running=true; lastT=performance.now();
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    if (!running) return;
    running=false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
  }

  function updateHud(){
    scoreEl.textContent = score;
    multEl.textContent = mult;
    timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
  }

  function aliveCount(){ var n=0; for(var i=0;i&lt;bricks.length;i++) if(bricks[i].alive) n++; return n; }

  function loop(t){
    if (!running) return;
    var dt = Math.min(50, t - lastT)/16.667; lastT = t;
    update(dt, (t-lastT));
    render();
    animId = requestAnimationFrame(loop);
  }

  var frameMs = 16.667;
  function update(dt){
    timeLeft -= (dt*frameMs)/1000;
    if (timeLeft &lt;= 0){ timeLeft = 0; updateHud(); render(); gameOver(); return; }

    // stars
    for (var i=0;i&lt;stars.length;i++){ stars[i].y += stars[i].v*dt; if(stars[i].y&gt;H){stars[i].y=0;stars[i].x=Math.random()*W;} }

    // timers
    if (wideTimer&gt;0){ wideTimer -= dt*frameMs/1000; if(wideTimer&lt;=0){ PW=basePW; } }
    if (hotTimer&gt;0){ hotTimer -= dt*frameMs/1000; }
    if (flash&gt;0) flash -= dt*0.08;
    if (redFlash&gt;0) redFlash -= dt*0.05;
    if (paddleFlash&gt;0) paddleFlash -= dt*0.1;

    if (launchDelay&gt;0){ launchDelay -= dt*frameMs/1000; if(launchDelay&lt;=0) resetBall(); }
    else {
      ballX += ballVX*dt; ballY += ballVY*dt;
      if (hotTimer&gt;0){ trail.push({x:ballX,y:ballY,life:1}); if(trail.length&gt;18) trail.shift(); }

      if (ballX-BR&lt;=0){ ballX=BR; ballVX=Math.abs(ballVX); }
      if (ballX+BR&gt;=W){ ballX=W-BR; ballVX=-Math.abs(ballVX); }
      if (ballY-BR&lt;=0){ ballY=BR; ballVY=Math.abs(ballVY); }

      // paddle collision
      if (ballVY&gt;0 &amp;&amp; ballY+BR&gt;=paddleY &amp;&amp; ballY-BR&lt;=paddleY+PH &amp;&amp; ballX&gt;=paddleX-BR &amp;&amp; ballX&lt;=paddleX+PW+BR){
        ballVY = -Math.abs(ballVY);
        ballY = paddleY - BR;
        var rel = (ballX - (paddleX+PW/2)) / (PW/2);
        var sp = Math.hypot(ballVX,ballVY);
        var ang = rel * (Math.PI/3);
        ballVX = Math.sin(ang)*sp; ballVY = -Math.abs(Math.cos(ang)*sp);
        flash = 1; paddleFlash = 1;
        hitStreak = 0; mult = 1; updateHud();
        beep(320,0.06,&#x27;square&#x27;,0.05);
      }

      // brick collisions
      for (var b=0;b&lt;bricks.length;b++){
        var br = bricks[b];
        if (!br.alive) continue;
        if (ballX+BR&gt;br.x &amp;&amp; ballX-BR&lt;br.x+brickW &amp;&amp; ballY+BR&gt;br.y &amp;&amp; ballY-BR&lt;br.y+brickH){
          br.alive = false;
          // decide bounce direction
          var overlapX = Math.min(ballX+BR-br.x, br.x+brickW-(ballX-BR));
          var overlapY = Math.min(ballY+BR-br.y, br.y+brickH-(ballY-BR));
          if (overlapX &lt; overlapY) ballVX = -ballVX; else ballVY = -ballVY;

          hitStreak++;
          mult = Math.min(8, 1 + Math.floor(hitStreak/3));
          var gain = br.points * mult * (hotTimer&gt;0?2:1);
          score += gain;
          spawnParticles(br.x+brickW/2, br.y+brickH/2, br.color, br.golden?22:14);
          beep(br.golden?880:520 + (ROWS)*30, 0.06, &#x27;triangle&#x27;, 0.05);
          if (br.golden) dropPowerup(br.x+brickW/2, br.y+brickH/2);
          updateHud();

          if (aliveCount()===0){ buildBricks(); ballSpeed += 0.4; score += 200; updateHud(); }
          break;
        }
      }

      // miss
      if (ballY-BR &gt; H){
        redFlash = 1;
        hitStreak = 0; mult = 1; updateHud();
        launchDelay = 0.5;
        beep(120,0.25,&#x27;sawtooth&#x27;,0.06);
      }
    }

    // powerups fall
    for (var p=powerups.length-1;p&gt;=0;p--){
      var pu = powerups[p];
      pu.y += pu.vy*dt;
      if (pu.y&gt;=paddleY-10 &amp;&amp; pu.y&lt;=paddleY+PH+10 &amp;&amp; pu.x&gt;=paddleX &amp;&amp; pu.x&lt;=paddleX+PW){
        if (pu.kind===&#x27;wide&#x27;){ PW = basePW*1.6; wideTimer = 8; paddleX = Math.min(paddleX, W-PW); }
        else { hotTimer = 8; }
        beep(700,0.15,&#x27;sine&#x27;,0.06);
        powerups.splice(p,1);
        continue;
      }
      if (pu.y&gt;H) powerups.splice(p,1);
    }

    // particles
    for (var q=particles.length-1;q&gt;=0;q--){
      var pt=particles[q];
      pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=0.08*dt; pt.life-=0.02*dt;
      if (pt.life&lt;=0) particles.splice(q,1);
    }
    for (var tr=trail.length-1;tr&gt;=0;tr--){ trail[tr].life -= 0.05*dt; if(trail[tr].life&lt;=0) trail.splice(tr,1); }
  }

  var overScreen = false;
  function gameOver(){
    stopGame();
    overScreen = true;
    render();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    // background gradient
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,&#x27;#12002e&#x27;); g.addColorStop(1,&#x27;#06000f&#x27;);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // stars
    for (var i=0;i&lt;stars.length;i++){ ctx.globalAlpha=0.7; ctx.fillStyle=&#x27;#cfc6ff&#x27;; ctx.fillRect(stars[i].x,stars[i].y,stars[i].s,stars[i].s); }
    ctx.globalAlpha=1;

    // bricks
    for (var b=0;b&lt;bricks.length;b++){
      var br=bricks[b]; if(!br.alive) continue;
      ctx.shadowColor = br.color; ctx.shadowBlur = br.golden?16:8;
      ctx.fillStyle = br.color;
      roundRect(br.x,br.y,brickW,brickH,4); ctx.fill();
      if (br.golden){ ctx.shadowBlur=0; ctx.fillStyle=&#x27;rgba(255,255,255,0.6)&#x27;; ctx.font=&#x27;bold 14px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;★&#x27;, br.x+brickW/2, br.y+brickH/2+5); }
    }
    ctx.shadowBlur=0;

    // trail
    for (var tr=0;tr&lt;trail.length;tr++){ var t2=trail[tr]; ctx.globalAlpha=t2.life*0.6; ctx.fillStyle=&#x27;#ff9a2e&#x27;; ctx.beginPath(); ctx.arc(t2.x,t2.y,BR*t2.life,0,7); ctx.fill(); }
    ctx.globalAlpha=1;

    // particles
    for (var q=0;q&lt;particles.length;q++){ var pt=particles[q]; ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color; ctx.fillRect(pt.x,pt.y,pt.size,pt.size); }
    ctx.globalAlpha=1;

    // powerups
    for (var p=0;p&lt;powerups.length;p++){ var pu=powerups[p];
      ctx.shadowBlur=12; ctx.shadowColor = pu.kind===&#x27;wide&#x27;?&#x27;#2ee9ff&#x27;:&#x27;#ff9a2e&#x27;;
      ctx.fillStyle = pu.kind===&#x27;wide&#x27;?&#x27;#2ee9ff&#x27;:&#x27;#ff9a2e&#x27;;
      ctx.beginPath(); ctx.arc(pu.x,pu.y,7,0,7); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle=&#x27;#000&#x27;; ctx.font=&#x27;bold 10px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(pu.kind===&#x27;wide&#x27;?&#x27;W&#x27;:&#x27;H&#x27;, pu.x, pu.y+3.5);
    }

    // paddle
    if (launchDelay&lt;=0 || overScreen || true){
      ctx.shadowBlur = 14 + paddleFlash*20; ctx.shadowColor = wideTimer&gt;0?&#x27;#2ee9ff&#x27;:&#x27;#ff2ec4&#x27;;
      var pg = ctx.createLinearGradient(paddleX,0,paddleX+PW,0);
      pg.addColorStop(0, wideTimer&gt;0?&#x27;#2ee9ff&#x27;:&#x27;#ff2ec4&#x27;); pg.addColorStop(1,&#x27;#7a5cff&#x27;);
      ctx.fillStyle = pg;
      roundRect(paddleX,paddleY,PW,PH,7); ctx.fill();
      ctx.shadowBlur=0;
    }

    // ball
    if (launchDelay&lt;=0){
      ctx.shadowBlur=16; ctx.shadowColor = hotTimer&gt;0?&#x27;#ff9a2e&#x27;:&#x27;#2ee9ff&#x27;;
      ctx.fillStyle = hotTimer&gt;0?&#x27;#ffd24a&#x27;:&#x27;#e8faff&#x27;;
      ctx.beginPath(); ctx.arc(ballX,ballY,BR,0,7); ctx.fill();
      ctx.shadowBlur=0;
    } else {
      // countdown pulse in center
      ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(0.3+0.3*Math.sin(performance.now()/80))+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(W/2,H/2,BR+4,0,7); ctx.fill();
    }

    // paddle hit flash
    if (flash&gt;0){ ctx.globalAlpha=flash*0.3; ctx.fillStyle=&#x27;#fff&#x27;; ctx.fillRect(0,paddleY-6,W,PH+12); ctx.globalAlpha=1; }
    // red miss flash
    if (redFlash&gt;0){ ctx.globalAlpha=redFlash*0.5; ctx.fillStyle=&#x27;#ff2020&#x27;; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }

    if (overScreen){
      ctx.fillStyle=&#x27;rgba(6,0,15,0.75)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=&#x27;#2ee9ff&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;bold 34px sans-serif&#x27;;
      ctx.fillText(&quot;TIME&#x27;S UP&quot;, W/2, H/2-10);
      ctx.fillStyle=&#x27;#ffd54a&#x27;; ctx.font=&#x27;bold 22px sans-serif&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27;+score, W/2, H/2+28);
      ctx.fillStyle=&#x27;#b7a9e0&#x27;; ctx.font=&#x27;16px sans-serif&#x27;;
      ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2+58);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  // mouse control
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W/rect.width);
    paddleX = Math.max(0, Math.min(W-PW, mx - PW/2));
  });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var mx = (e.touches[0].clientX - rect.left) * (W/rect.width);
    paddleX = Math.max(0, Math.min(W-PW, mx - PW/2));
    e.preventDefault();
  }, {passive:false});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;){ overScreen=false; startGame(); }
    else if (e.data.type===&#x27;wd_stop&#x27;){ stopGame(); }
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;, kind:t, key:e.key||null}, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static render
  initStars(); buildBricks(); resetBall(); render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
