<!doctype html>

<meta charset="utf-8">

<title>☄ COMET DASH</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>☄ COMET DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#ff9a3c,#ffd36e,#ff6a3c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9aa6d6; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 18px; }
  .hud .best { color: #ffd36e; }
  .combo { font-size: 18px; font-weight: 800; color: #ff7a2c; min-width: 60px; text-align: left; }
  .wrap { position: relative; width: 620px; height: 440px; }
  canvas { display: block; width: 620px; height: 440px; border-radius: 10px; background: #05060f; box-shadow: 0 0 30px rgba(80,120,255,0.15); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;☄ COMET DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to launch your comet over the satellites and asteroids. Clear three in a row without landing to build a combo — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 440;
  var GROUND_H = 46;
  var floorTop = H - GROUND_H;
  var COMET_R = 17;
  var GRAVITY = 0.62, JUMP_V = -13.2;

  var running = false, animId = null;
  var score = 0, best = 0;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);

  var cometX = 90, cometY, cometVY = 0, onGround = true;
  var obstacles = [], particles = [], popups = [], shockwaves = [];
  var stars = [];
  var shake = 0, redFlash = 0, glowPulse = 0;
  var speed = 3.4, baseSpeed = 3.4, maxSpeed = 7.2;
  var elapsed = 0, sessionLen = 60000;
  var spawnTimer = 0, spawnGap = 1500;
  var trailTimer = 0;
  var comboCount = 0, comboMult = 1;
  var gameOver = false;
  var lastTime = 0;

  // audio
  var actx = null;
  function ensureAudio(){ if(!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } }
  function whoosh(){
    if(!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type=&#x27;sawtooth&#x27;;
    o.frequency.setValueAtTime(220,t);
    o.frequency.exponentialRampToValueAtTime(660,t+0.18);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.22,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+0.3);
  }
  function boom(){
    if(!actx) return;
    var t=actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=&#x27;square&#x27;;
    o.frequency.setValueAtTime(160,t);
    o.frequency.exponentialRampToValueAtTime(40,t+0.4);
    g.gain.setValueAtTime(0.3,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+0.46);
  }
  function land(){
    if(!actx) return;
    var t=actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=&#x27;sine&#x27;;
    o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(60,t+0.12);
    g.gain.setValueAtTime(0.16,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+0.16);
  }

  function initStars(){
    stars = [];
    var layers = [
      {n:40, sp:0.15, r:0.8, c:&#x27;rgba(140,150,220,0.5)&#x27;},
      {n:28, sp:0.4, r:1.3, c:&#x27;rgba(190,200,255,0.7)&#x27;},
      {n:16, sp:0.9, r:2.0, c:&#x27;rgba(255,255,255,0.95)&#x27;}
    ];
    layers.forEach(function(L){
      for(var i=0;i&lt;L.n;i++){
        stars.push({x:Math.random()*W, y:Math.random()*(floorTop-10), r:L.r, sp:L.sp, c:L.c});
      }
    });
  }

  function reset(){
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    cometX=90; cometY=floorTop-COMET_R; cometVY=0; onGround=true;
    obstacles=[]; particles=[]; popups=[]; shockwaves=[];
    shake=0; redFlash=0; glowPulse=0;
    speed=baseSpeed; elapsed=0; spawnTimer=0; spawnGap=1500;
    comboCount=0; comboMult=1; comboEl.textContent=&#x27;&#x27;;
    gameOver=false;
    initStars();
    spawnObstacle();
  }

  var kinds = [&#x27;sat&#x27;,&#x27;ast&#x27;];
  function spawnObstacle(){
    var kind = kinds[Math.floor(Math.random()*kinds.length)];
    var h = 26 + Math.floor(Math.random()*34);
    var w = kind===&#x27;sat&#x27; ? 30 : 34;
    var hue = kind===&#x27;sat&#x27; ? (170+Math.random()*80) : (20+Math.random()*30);
    obstacles.push({x:W+20, w:w, h:h, kind:kind, hue:hue, rot:0, scored:false});
  }

  function jump(){
    if(!running || gameOver) return;
    if(onGround){
      cometVY = JUMP_V;
      onGround = false;
      shake = 6;
      whoosh();
      // burst particles at feet
      for(var i=0;i&lt;16;i++){
        var a = Math.PI + (Math.random()-0.5)*1.6;
        var s = 2+Math.random()*4;
        particles.push({x:cometX, y:floorTop, vx:Math.cos(a)*s, vy:Math.sin(a)*s*0.6+1, life:1, r:2+Math.random()*3, c:&#x27;rgba(255,&#x27;+(160+Math.random()*80|0)+&#x27;,80,&#x27;});
      }
    }
  }

  function doLanding(){
    onGround=true; cometVY=0; cometY=floorTop-COMET_R;
    shockwaves.push({x:cometX, r:6, life:1});
    land();
    // reset combo on landing
    comboCount=0; comboMult=1; comboEl.textContent=&#x27;&#x27;;
  }

  function addPopup(x,y,mult){
    var txt = mult&gt;1 ? &#x27;+&#x27;+mult : &#x27;+1&#x27;;
    popups.push({x:x, y:y, txt:txt, life:1, mult:mult});
  }

  function explode(){
    boom();
    redFlash=1; shake=16; glowPulse=1;
    for(var i=0;i&lt;40;i++){
      var a=Math.random()*Math.PI*2;
      var s=2+Math.random()*6;
      particles.push({x:cometX, y:cometY, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, r:2+Math.random()*4, c:&#x27;rgba(255,&#x27;+(120+Math.random()*100|0)+&#x27;,60,&#x27;});
    }
  }

  function update(dt){
    elapsed += dt;
    // ramp speed over session
    var prog = Math.min(1, elapsed/sessionLen);
    speed = baseSpeed + (maxSpeed-baseSpeed)*prog;
    spawnGap = 1500 - 600*prog;

    // comet physics
    if(!gameOver){
      cometVY += GRAVITY;
      cometY += cometVY;
      if(cometY &gt;= floorTop-COMET_R){
        if(!onGround) doLanding();
        cometY = floorTop-COMET_R;
      }
      if(cometY&lt;COMET_R){ cometY=COMET_R; cometVY=0; }
    }

    // stars
    for(var i=0;i&lt;stars.length;i++){
      stars[i].x -= stars[i].sp*speed;
      if(stars[i].x&lt;0){ stars[i].x=W; stars[i].y=Math.random()*(floorTop-10); }
    }

    // trail particles
    if(!gameOver){
      trailTimer+=dt;
      if(trailTimer&gt;28){
        trailTimer=0;
        particles.push({x:cometX-COMET_R, y:cometY, vx:-1-Math.random()*1.5, vy:(Math.random()-0.5)*1.2, life:1, r:3+Math.random()*3, c:&#x27;rgba(255,&#x27;+(150+Math.random()*90|0)+&#x27;,60,&#x27;});
      }
    }

    // spawn obstacles
    if(!gameOver){
      spawnTimer += dt;
      if(spawnTimer&gt;spawnGap){ spawnTimer=0; spawnObstacle(); }
    }

    // obstacles
    for(var i=obstacles.length-1;i&gt;=0;i--){
      var o=obstacles[i];
      if(!gameOver) o.x -= speed;
      o.rot += 0.05;
      if(o.x + o.w &lt; 0){ obstacles.splice(i,1); continue; }
      if(!o.scored &amp;&amp; o.x + o.w &lt; cometX &amp;&amp; !gameOver){
        o.scored=true;
        if(!onGround){
          comboCount++;
          if(comboCount&gt;=3) comboMult = comboCount-1; // 3rd clear -&gt; x2
          else comboMult = 1;
        } else { comboMult=1; }
        var add = comboMult;
        score += add;
        scoreEl.textContent = score;
        if(score&gt;best){ best=score; bestEl.textContent=best; }
        addPopup(o.x+o.w/2, floorTop-o.h-10, comboMult);
        if(comboMult&gt;1){ comboEl.textContent=&#x27;x&#x27;+comboMult+&#x27;!&#x27;; }
      }
      // collision
      var ot = floorTop - o.h;
      if(!gameOver &amp;&amp; cometX+COMET_R*0.8 &gt; o.x &amp;&amp; cometX-COMET_R*0.8 &lt; o.x+o.w &amp;&amp; cometY+COMET_R*0.8 &gt; ot){
        gameOver=true;
        explode();
        stopGame();
      }
    }

    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=dt/700;
      if(p.life&lt;=0) particles.splice(i,1);
    }
    // popups
    for(var i=popups.length-1;i&gt;=0;i--){
      var pp=popups[i]; pp.y-=0.7; pp.life-=dt/900;
      if(pp.life&lt;=0) popups.splice(i,1);
    }
    // shockwaves
    for(var i=shockwaves.length-1;i&gt;=0;i--){
      var s=shockwaves[i]; s.r+=3; s.life-=dt/500;
      if(s.life&lt;=0) shockwaves.splice(i,1);
    }

    if(shake&gt;0) shake*=0.85;
    if(redFlash&gt;0) redFlash-=dt/500;
    if(glowPulse&gt;0) glowPulse-=dt/1200;
  }

  function drawSatellite(o){
    var x=o.x+o.w/2, top=floorTop-o.h, cy=top+o.h/2;
    ctx.save();
    ctx.translate(x,cy);
    // body
    ctx.fillStyle=&#x27;hsl(&#x27;+o.hue+&#x27;,70%,55%)&#x27;;
    ctx.shadowColor=&#x27;hsl(&#x27;+o.hue+&#x27;,80%,60%)&#x27;; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,0,o.w*0.32,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // panels
    ctx.fillStyle=&#x27;hsl(&#x27;+o.hue+&#x27;,60%,72%)&#x27;;
    ctx.fillRect(-o.w*0.7,-3,o.w*0.35,6);
    ctx.fillRect(o.w*0.35,-3,o.w*0.35,6);
    ctx.fillStyle=&#x27;rgba(255,255,255,0.9)&#x27;;
    ctx.beginPath(); ctx.arc(-o.w*0.08,-o.w*0.08,2.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawAsteroid(o){
    var x=o.x+o.w/2, top=floorTop-o.h, cy=top+o.h/2, R=o.w*0.42;
    ctx.save();
    ctx.translate(x,cy); ctx.rotate(o.rot);
    ctx.fillStyle=&#x27;hsl(&#x27;+o.hue+&#x27;,55%,45%)&#x27;;
    ctx.shadowColor=&#x27;hsl(&#x27;+o.hue+&#x27;,70%,50%)&#x27;; ctx.shadowBlur=10;
    ctx.beginPath();
    for(var i=0;i&lt;8;i++){
      var a=i/8*Math.PI*2;
      var rr=R*(0.75+((i%3)*0.12));
      var px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(0,0,0,0.25)&#x27;;
    ctx.beginPath(); ctx.arc(R*0.2,-R*0.2,R*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-R*0.25,R*0.15,R*0.15,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    var sx = (Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
    ctx.save();
    ctx.translate(sx,sy);

    // bg gradient
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,&#x27;#0a0d24&#x27;); g.addColorStop(1,&#x27;#05060f&#x27;);
    ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

    // stars
    for(var i=0;i&lt;stars.length;i++){
      var s=stars[i];
      ctx.fillStyle=s.c;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }

    // ground surface with pulsing neon glow
    var dim = gameOver ? 0.3 : 1;
    var pulse = 0.5+0.5*Math.sin(Date.now()/400);
    ctx.save();
    ctx.shadowColor=&#x27;rgba(0,220,255,&#x27;+(0.6*dim)+&#x27;)&#x27;;
    ctx.shadowBlur=18+8*pulse;
    var gg=ctx.createLinearGradient(0,floorTop,0,H);
    gg.addColorStop(0,&#x27;rgba(0,&#x27;+(200*dim|0)+&#x27;,&#x27;+(255*dim|0)+&#x27;,&#x27;+(0.9*dim)+&#x27;)&#x27;);
    gg.addColorStop(1,&#x27;rgba(20,10,50,&#x27;+dim+&#x27;)&#x27;);
    ctx.fillStyle=gg;
    ctx.fillRect(0,floorTop,W,GROUND_H);
    ctx.restore();
    // neon top line
    ctx.strokeStyle=&#x27;rgba(120,240,255,&#x27;+(0.9*dim)+&#x27;)&#x27;;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,floorTop); ctx.lineTo(W,floorTop); ctx.stroke();

    // shockwaves
    for(var i=0;i&lt;shockwaves.length;i++){
      var sw=shockwaves[i];
      ctx.strokeStyle=&#x27;rgba(120,240,255,&#x27;+(sw.life*0.7)+&#x27;)&#x27;;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(sw.x,floorTop,sw.r,sw.r*0.35,0,0,Math.PI*2); ctx.stroke();
    }

    // obstacles
    for(var i=0;i&lt;obstacles.length;i++){
      if(obstacles[i].kind===&#x27;sat&#x27;) drawSatellite(obstacles[i]);
      else drawAsteroid(obstacles[i]);
    }

    // particles
    for(var i=0;i&lt;particles.length;i++){
      var p=particles[i];
      ctx.fillStyle=p.c+Math.max(0,p.life)+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
    }

    // comet
    if(!gameOver){
      ctx.save();
      ctx.shadowColor=&#x27;rgba(255,160,60,0.9)&#x27;; ctx.shadowBlur=25;
      var cg=ctx.createRadialGradient(cometX-4,cometY-4,2,cometX,cometY,COMET_R);
      cg.addColorStop(0,&#x27;#fff4d0&#x27;); cg.addColorStop(0.5,&#x27;#ffb347&#x27;); cg.addColorStop(1,&#x27;#ff6a1a&#x27;);
      ctx.fillStyle=cg;
      ctx.beginPath(); ctx.arc(cometX,cometY,COMET_R,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // popups
    for(var i=0;i&lt;popups.length;i++){
      var pp=popups[i];
      ctx.globalAlpha=Math.max(0,pp.life);
      ctx.fillStyle= pp.mult&gt;1 ? &#x27;#ff7a2c&#x27; : &#x27;#ffd36e&#x27;;
      ctx.font=&#x27;bold &#x27;+(pp.mult&gt;1?20:16)+&#x27;px system-ui&#x27;;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(pp.txt, pp.x, pp.y);
      ctx.globalAlpha=1;
    }

    ctx.restore();

    // red flash overlay
    if(redFlash&gt;0){
      ctx.fillStyle=&#x27;rgba(255,40,40,&#x27;+(redFlash*0.5)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
    }

    // game over text
    if(gameOver){
      ctx.fillStyle=&#x27;rgba(255,255,255,0.95)&#x27;;
      ctx.font=&#x27;bold 30px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;COMET DESTROYED&#x27;, W/2, H/2-10);
      ctx.font=&#x27;18px system-ui&#x27;;
      ctx.fillStyle=&#x27;#ffd36e&#x27;;
      ctx.fillText(&#x27;Score: &#x27;+score+&#x27;   Best: &#x27;+best, W/2, H/2+22);
    }
  }

  function loop(t){
    if(!running){ return; }
    if(!lastTime) lastTime=t;
    var dt=Math.min(50, t-lastTime); lastTime=t;
    update(dt);
    render();
    animId=requestAnimationFrame(loop);
  }

  function startGame(){
    if(running) return;
    ensureAudio();
    if(actx &amp;&amp; actx.state===&#x27;suspended&#x27;) actx.resume();
    reset();
    running=true; lastTime=0;
    animId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;click&#x27;, function(){ ensureAudio(); if(actx&amp;&amp;actx.state===&#x27;suspended&#x27;)actx.resume(); jump(); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static render
  cometY=floorTop-COMET_R;
  initStars();
  render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
