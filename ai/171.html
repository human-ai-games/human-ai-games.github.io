&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with your &lt;strong&gt;mouse&lt;/strong&gt; or &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; keys to bounce the plasma ball and smash every alien brick. Grab golden bricks for power-ups and don&#x27;t let the ball fall past you!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot;&gt;Wave &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot;&gt;Lives &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;sub power&quot; id=&quot;power&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var W=cv.width, H=cv.height;
var scoreEl=document.getElementById(&#x27;score&#x27;), waveEl=document.getElementById(&#x27;wave&#x27;),
    livesEl=document.getElementById(&#x27;lives&#x27;), powerEl=document.getElementById(&#x27;power&#x27;);

var running=false, animId=null, lastT=0;
var score, wave, lives;
var paddle, ball, bricks, trail, sparks, stars, shake, keys, mouseX;
var fireball, wideTimer, descTimer, slowmo, gameOver;

var PAD_Y = H-26, PAD_H=13, BASE_PW=100;
var COLS=10, BRICK_W=56, BRICK_H=22, GAP=4, TOP_OFF=40, LEFT_OFF=(W-(COLS*(BRICK_W+GAP)-GAP))/2;

function initStars(){
  stars=[];
  for(var i=0;i&lt;90;i++){
    var layer=Math.floor(Math.random()*3);
    stars.push({x:Math.random()*W,y:Math.random()*H,layer:layer,
      s:layer===0?0.5:layer===1?1:1.7,sp:layer===0?0.12:layer===1?0.28:0.5});
  }
}

var patterns=[&#x27;chevron&#x27;,&#x27;wave&#x27;,&#x27;diamond&#x27;,&#x27;block&#x27;,&#x27;arrow&#x27;];
function brickTypeFor(r,c,rows){
  var rr=Math.random();
  if(rr&lt;0.09) return &#x27;gold&#x27;;
  if(rr&lt;0.30) return &#x27;armor&#x27;;
  return &#x27;std&#x27;;
}
function buildBricks(){
  bricks=[];
  var patt=patterns[(wave-1)%patterns.length];
  var rows=4+Math.min(3,Math.floor((wave-1)/2));
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;COLS;c++){
      var on=true;
      if(patt===&#x27;chevron&#x27;){ var d=Math.abs(c-(COLS-1)/2); on = r&gt;= d*0.6 &amp;&amp; r&lt;rows; }
      else if(patt===&#x27;wave&#x27;){ on = (Math.sin(c*0.9)+1)*1.6 &gt;= (rows-1-r); }
      else if(patt===&#x27;diamond&#x27;){ var dd=Math.abs(c-(COLS-1)/2)+Math.abs(r-(rows-1)/2); on = dd &lt; rows-0.5; }
      else if(patt===&#x27;arrow&#x27;){ var da=Math.abs(c-(COLS-1)/2); on = da &lt;= r; }
      else on=true;
      if(!on) continue;
      var t=brickTypeFor(r,c,rows);
      bricks.push({
        x:LEFT_OFF+c*(BRICK_W+GAP), y:TOP_OFF+r*(BRICK_H+GAP),
        w:BRICK_W,h:BRICK_H,type:t,hp:t===&#x27;armor&#x27;?2:1,alive:true
      });
    }
  }
}

function resetBall(centerLaunch){
  ball={x:W/2,y:PAD_Y-40,r:8,vx:(Math.random()&lt;.5?-1:1)*2.4,vy:-3.6,speed:4.6};
  var m=Math.hypot(ball.vx,ball.vy); ball.vx=ball.vx/m*ball.speed; ball.vy=-Math.abs(ball.vy/m*ball.speed);
  trail=[]; slowmo=centerLaunch?40:0;
}

function startGame(){
  score=0; wave=1; lives=3; gameOver=false;
  fireball=0; wideTimer=0; descTimer=15;
  shake={x:0,y:0,t:0};
  keys={}; mouseX=null;
  sparks=[];
  paddle={w:BASE_PW,x:W/2-BASE_PW/2};
  initStars(); buildBricks(); resetBall(true);
  updateHUD();
  running=true; lastT=performance.now();
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}
function stopGame(){ running=false; if(animId){cancelAnimationFrame(animId);animId=null;} }

function updateHUD(){
  scoreEl.textContent=score; waveEl.textContent=wave; livesEl.textContent=lives;
  var p=[];
  if(fireball&gt;0) p.push(&#x27;🔥 FIREBALL &#x27;+Math.ceil(fireball));
  if(wideTimer&gt;0) p.push(&#x27;⬌ WIDE &#x27;+Math.ceil(wideTimer));
  powerEl.textContent=p.join(&#x27;   &#x27;);
}

function addSparks(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2, sp=Math.random()*4+1;
    sparks.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}
function doShake(m){ shake.t=1; shake.mag=m; }

function loseLife(){
  lives--; updateHUD();
  shake.t=1; shake.mag=14; redFlash=1;
  if(lives&lt;=0){ gameOver=true; running=false; return; }
  resetBall(true);
}
var redFlash=0;

function nextWave(){
  wave++; updateHUD();
  buildBricks(); resetBall(true);
  descTimer=15;
}

function loop(now){
  if(!running){ return; }
  var dt=Math.min(40,now-lastT)/16.67; lastT=now;
  update(dt); draw();
  animId=requestAnimationFrame(loop);
}

function update(dt){
  // stars parallax
  for(var i=0;i&lt;stars.length;i++){ var s=stars[i]; s.y+=s.sp*dt; if(s.y&gt;H){s.y=0;s.x=Math.random()*W;} }

  // paddle control
  var pw=paddle.w;
  if(keys[&#x27;ArrowLeft&#x27;]) paddle.x-=7*dt;
  if(keys[&#x27;ArrowRight&#x27;]) paddle.x+=7*dt;
  if(mouseX!==null) paddle.x=mouseX-pw/2;
  paddle.x=Math.max(0,Math.min(W-pw,paddle.x));

  // timers
  if(fireball&gt;0){ fireball-=dt/60; if(fireball&lt;0)fireball=0; }
  if(wideTimer&gt;0){ wideTimer-=dt/60; if(wideTimer&lt;=0){wideTimer=0; paddle.w=BASE_PW;} }
  descTimer-=dt/60;
  if(descTimer&lt;=0){ descTimer=15; descendBricks(); }
  if(redFlash&gt;0) redFlash-=dt/20;

  var step=slowmo&gt;0?0.35:1; if(slowmo&gt;0) slowmo-=dt;

  // ball move
  ball.x+=ball.vx*dt*step; ball.y+=ball.vy*dt*step;
  trail.push({x:ball.x,y:ball.y}); if(trail.length&gt;16) trail.shift();

  if(ball.x-ball.r&lt;0){ball.x=ball.r; ball.vx=Math.abs(ball.vx);}
  if(ball.x+ball.r&gt;W){ball.x=W-ball.r; ball.vx=-Math.abs(ball.vx);}
  if(ball.y-ball.r&lt;0){ball.y=ball.r; ball.vy=Math.abs(ball.vy);}

  // paddle collide
  if(ball.vy&gt;0 &amp;&amp; ball.y+ball.r&gt;=PAD_Y &amp;&amp; ball.y-ball.r&lt;=PAD_Y+PAD_H &amp;&amp;
     ball.x&gt;=paddle.x-4 &amp;&amp; ball.x&lt;=paddle.x+pw+4){
    ball.y=PAD_Y-ball.r;
    var hit=(ball.x-(paddle.x+pw/2))/(pw/2);
    var ang=hit*1.05;
    ball.vx=Math.sin(ang)*ball.speed;
    ball.vy=-Math.abs(Math.cos(ang)*ball.speed);
    doShake(4);
  }

  // brick collide
  for(var b=0;b&lt;bricks.length;b++){
    var br=bricks[b]; if(!br.alive) continue;
    if(ball.x+ball.r&gt;br.x &amp;&amp; ball.x-ball.r&lt;br.x+br.w &amp;&amp;
       ball.y+ball.r&gt;br.y &amp;&amp; ball.y-ball.r&lt;br.y+br.h){
      if(fireball&gt;0){
        killBrick(br); addSparks(br.x+br.w/2,br.y+br.h/2,&#x27;#ff8a3c&#x27;,10);
      } else {
        // bounce - determine axis
        var ox=Math.min(ball.x+ball.r-br.x, br.x+br.w-(ball.x-ball.r));
        var oy=Math.min(ball.y+ball.r-br.y, br.y+br.h-(ball.y-ball.r));
        if(ox&lt;oy) ball.vx=-ball.vx; else ball.vy=-ball.vy;
        if(br.type===&#x27;armor&#x27; &amp;&amp; br.hp&gt;1){ br.hp--; addSparks(br.x+br.w/2,br.y+br.h/2,&#x27;#dfeaff&#x27;,5); doShake(3); }
        else { killBrick(br); doShake(3); }
      }
      if(!(fireball&gt;0)) break;
    }
  }

  // sparks
  for(var i=sparks.length-1;i&gt;=0;i--){
    var sp=sparks[i]; sp.x+=sp.vx*dt; sp.y+=sp.vy*dt; sp.vy+=0.08*dt; sp.life-=0.03*dt;
    if(sp.life&lt;=0) sparks.splice(i,1);
  }

  // fall
  if(ball.y-ball.r&gt;H){ loseLife(); }

  // wave clear
  if(bricks.every(function(x){return !x.alive;})) nextWave();

  // shake decay
  if(shake.t&gt;0){ shake.t-=dt/6; shake.x=(Math.random()-.5)*shake.mag*shake.t; shake.y=(Math.random()-.5)*shake.mag*shake.t; }
  else { shake.x=0; shake.y=0; }

  updateHUD();
}

function killBrick(br){
  br.alive=false;
  var pts= br.type===&#x27;gold&#x27;?5: br.type===&#x27;armor&#x27;?3:1;
  score+=pts;
  var col= br.type===&#x27;gold&#x27;?&#x27;#ffd34d&#x27;: br.type===&#x27;armor&#x27;?&#x27;#cfd8e6&#x27;:&#x27;#4de1ff&#x27;;
  addSparks(br.x+br.w/2,br.y+br.h/2,col,br.type===&#x27;gold&#x27;?22:9);
  if(br.type===&#x27;gold&#x27;){
    if(Math.random()&lt;0.5){ fireball=5; }
    else { paddle.w=BASE_PW*1.6; wideTimer=8; paddle.x-=BASE_PW*0.3; }
  }
}

function descendBricks(){
  var maxY=0; var any=false;
  for(var i=0;i&lt;bricks.length;i++){ if(bricks[i].alive){ bricks[i].y+=BRICK_H+GAP; maxY=Math.max(maxY,bricks[i].y+bricks[i].h); any=true; } }
  if(any &amp;&amp; maxY&gt;=PAD_Y-4){ loseLife(); }
}

function draw(){
  ctx.save();
  ctx.translate(shake.x,shake.y);
  ctx.clearRect(-20,-20,W+40,H+40);
  ctx.fillStyle=&#x27;#04010c&#x27;; ctx.fillRect(-20,-20,W+40,H+40);

  // stars
  for(var i=0;i&lt;stars.length;i++){ var s=stars[i];
    ctx.globalAlpha=s.layer===0?0.5:s.layer===1?0.8:1;
    ctx.fillStyle=s.layer===2?&#x27;#bcdcff&#x27;:&#x27;#88aacc&#x27;;
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;

  // bricks
  for(var b=0;b&lt;bricks.length;b++){ var br=bricks[b]; if(!br.alive) continue;
    var col,glow;
    if(br.type===&#x27;gold&#x27;){col=&#x27;#ffd34d&#x27;;glow=&#x27;#ff9d00&#x27;;}
    else if(br.type===&#x27;armor&#x27;){col=br.hp&gt;1?&#x27;#c8d2e4&#x27;:&#x27;#9aa8c0&#x27;;glow=&#x27;#7f92b8&#x27;;}
    else {col=&#x27;#31c8ff&#x27;;glow=&#x27;#0077ff&#x27;;}
    ctx.shadowColor=glow; ctx.shadowBlur=10;
    ctx.fillStyle=col; roundRect(br.x,br.y,br.w,br.h,4); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(255,255,255,0.22)&#x27;; roundRect(br.x+2,br.y+2,br.w-4,br.h*0.38,3); ctx.fill();
    if(br.type===&#x27;armor&#x27; &amp;&amp; br.hp===1){
      ctx.strokeStyle=&#x27;rgba(30,40,60,0.8)&#x27;; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(br.x+br.w*0.3,br.y+2); ctx.lineTo(br.x+br.w*0.5,br.y+br.h-2);
      ctx.moveTo(br.x+br.w*0.6,br.y+2); ctx.lineTo(br.x+br.w*0.72,br.y+br.h-3); ctx.stroke();
    }
  }

  // trail
  for(var i=0;i&lt;trail.length;i++){
    var a=i/trail.length; ctx.globalAlpha=a*0.5;
    ctx.fillStyle=fireball&gt;0?&#x27;#ff8a3c&#x27;:&#x27;#a6f0ff&#x27;;
    ctx.beginPath(); ctx.arc(trail[i].x,trail[i].y,ball.r*a,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  ctx.shadowColor=fireball&gt;0?&#x27;#ff6a00&#x27;:&#x27;#00eaff&#x27;; ctx.shadowBlur=18;
  var grd=ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,ball.r);
  grd.addColorStop(0,&#x27;#ffffff&#x27;); grd.addColorStop(1,fireball&gt;0?&#x27;#ff7a1a&#x27;:&#x27;#3fd0ff&#x27;);
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
  ctx.shadowBlur=0;

  // sparks
  for(var i=0;i&lt;sparks.length;i++){ var sp=sparks[i];
    ctx.globalAlpha=Math.max(0,sp.life); ctx.fillStyle=sp.color;
    ctx.fillRect(sp.x,sp.y,2.5,2.5);
  }
  ctx.globalAlpha=1;

  // paddle
  var pw=paddle.w;
  ctx.shadowColor=&#x27;#b967ff&#x27;; ctx.shadowBlur=16;
  var pg=ctx.createLinearGradient(paddle.x,0,paddle.x+pw,0);
  pg.addColorStop(0,&#x27;#00eaff&#x27;); pg.addColorStop(.5,&#x27;#b967ff&#x27;); pg.addColorStop(1,&#x27;#ff5edb&#x27;);
  ctx.fillStyle=pg; roundRect(paddle.x,PAD_Y,pw,PAD_H,6); ctx.fill();
  ctx.shadowBlur=0;

  // red flash
  if(redFlash&gt;0){ ctx.fillStyle=&#x27;rgba(255,20,40,&#x27;+(redFlash*0.4)+&#x27;)&#x27;; ctx.fillRect(-20,-20,W+40,H+40); }

  ctx.restore();

  if(gameOver){
    ctx.fillStyle=&#x27;rgba(0,0,0,0.6)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle=&#x27;#ff5edb&#x27;; ctx.font=&#x27;800 40px system-ui&#x27;;
    ctx.shadowColor=&#x27;#ff5edb&#x27;; ctx.shadowBlur=20;
    ctx.fillText(&#x27;GAME OVER&#x27;,W/2,H/2-10);
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#cfe8ff&#x27;; ctx.font=&#x27;600 20px system-ui&#x27;;
    ctx.fillText(&#x27;Score &#x27;+score+&#x27; — press Restart below&#x27;,W/2,H/2+28);
    ctx.textAlign=&#x27;left&#x27;;
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; mouseX=null; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false; });
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial idle paint
score=0;wave=1;lives=3;gameOver=false;fireball=0;wideTimer=0;
shake={x:0,y:0,t:0};keys={};mouseX=null;sparks=[];
paddle={w:BASE_PW,x:W/2-BASE_PW/2};
initStars();buildBricks();resetBall(false);
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the

<script>

  var iframe = document.getElementById('game');

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
