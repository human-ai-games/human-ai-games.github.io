<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060d; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#a0f,#f0a); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,0,255,.4); }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; gap: 22px; }
  .lcd { font-family: &#x27;Courier New&#x27;, monospace; font-weight: 800; font-size: 26px; color: #2fff6a;
         text-shadow: 0 0 8px rgba(47,255,106,.8); letter-spacing: 2px; }
  .flames { font-size: 20px; letter-spacing: 1px; }
  .combo { font-size: 16px; font-weight: 800; color: #ff7; min-width: 90px; text-align: center;
           text-shadow: 0 0 10px rgba(255,220,80,.8); opacity: 0; transition: opacity .2s; }
  .combo.on { opacity: 1; }
  .fieldwrap { position: relative; }
  .field { position: relative; width: 560px; height: 400px; border-radius: 8px; overflow: hidden;
           box-shadow: 0 0 40px rgba(0,200,255,.15) inset, 0 0 24px rgba(120,0,255,.25); }
  #cv { display: block; }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; border-radius: 8px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the neon snake with the arrow keys and eat the glowing collectibles to score. Grab the orange bolt and rainbow orb for big points and a double-score combo — avoid the walls and your own tail!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lcd&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;flames&quot; id=&quot;flames&quot;&gt;🔥&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;2× COMBO&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;fieldwrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;canvas id=&quot;cv&quot; width=&quot;560&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 28, ROWS = 20;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var flamesEl = document.getElementById(&#x27;flames&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);

  var running = false, tickId = null, animId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0, speedTier = 1;
  var baseTick = 150, tickAcc = 0, lastTime = 0;
  var rot = 0, scan = 0;

  // collectibles
  var star = null;     // always present {x,y}
  var bolt = null;     // {x,y, born}
  var orb = null;      // {x,y, born}
  var boltTimer = 0, orbTimer = 0;
  var comboUntil = 0;
  var pops = []; // {x,y, text, color, age}

  function occupied(x,y){
    for (var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    if (star &amp;&amp; star.x===x &amp;&amp; star.y===y) return true;
    if (bolt &amp;&amp; bolt.x===x &amp;&amp; bolt.y===y) return true;
    if (orb &amp;&amp; orb.x===x &amp;&amp; orb.y===y) return true;
    return false;
  }
  function freeCell(){
    for (var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function initSnake(){
    snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function spawnStar(){ star = freeCell(); }
  function spawnBolt(){ var c=freeCell(); bolt={x:c.x,y:c.y,born:performance.now()}; }
  function spawnOrb(){ var c=freeCell(); orb={x:c.x,y:c.y,born:performance.now()}; }

  function speedFor(){ return baseTick / (1 + (speedTier-1)*0.18); }

  function updateFlames(){
    var s=&#x27;&#x27;; for(var i=0;i&lt;speedTier;i++) s+=&#x27;🔥&#x27;;
    flamesEl.textContent = s;
  }

  function comboActive(now){ return now &lt; comboUntil; }

  function flash(color){
    flashEl.style.background = color;
    flashEl.style.transition=&#x27;none&#x27;;
    flashEl.style.opacity=&#x27;0.55&#x27;;
    // force reflow
    void flashEl.offsetWidth;
    flashEl.style.transition=&#x27;opacity .45s ease-out&#x27;;
    flashEl.style.opacity=&#x27;0&#x27;;
  }

  function addPop(cx,cy,text,color){
    pops.push({x:cx*CELL+CELL/2, y:cy*CELL, text:text, color:color, age:0});
  }

  function eat(points, color, cx, cy, isBig){
    var now=performance.now();
    var mult = comboActive(now)?2:1;
    var gained = points*mult;
    score += gained;
    scoreEl.textContent = score;
    var newTier = 1+Math.floor(score/5);
    if(newTier!==speedTier){ speedTier=newTier; updateFlames(); }
    flash(color);
    addPop(cx,cy,&#x27;+&#x27;+gained, color);
    if(isBig){
      comboUntil = now + 3000;
      comboEl.classList.add(&#x27;on&#x27;);
    }
  }

  function tick(){
    if(!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }
    var ateStar = star &amp;&amp; nx===star.x &amp;&amp; ny===star.y;
    var ateBolt = bolt &amp;&amp; nx===bolt.x &amp;&amp; ny===bolt.y;
    var ateOrb = orb &amp;&amp; nx===orb.x &amp;&amp; ny===orb.y;
    var grow = ateStar||ateBolt||ateOrb;
    var body = grow?snake:snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }
    snake.unshift({x:nx,y:ny});
    if(ateStar){ eat(1,&#x27;#ffe14d&#x27;,nx,ny,false); spawnStar(); }
    if(ateBolt){ eat(3,&#x27;#ff9020&#x27;,nx,ny,true); bolt=null; boltTimer=performance.now()+4000; }
    if(ateOrb){ eat(5,&#x27;#ff6bd6&#x27;,nx,ny,true); orb=null; orbTimer=performance.now()+15000; }
    if(!grow) snake.pop();
  }

  // ---- rendering ----
  function lerp(a,b,t){ return a+(b-a)*t; }

  function drawGrid(){
    ctx.fillStyle=&#x27;#080a14&#x27;;
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle=&#x27;rgba(60,90,150,0.15)&#x27;;
    ctx.lineWidth=1;
    for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,cv.height); ctx.stroke(); }
    for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(cv.width,y*CELL); ctx.stroke(); }
    // scanline
    var sy = (scan % (cv.height+80)) - 40;
    var g = ctx.createLinearGradient(0,sy-40,0,sy+40);
    g.addColorStop(0,&#x27;rgba(0,255,255,0)&#x27;);
    g.addColorStop(0.5,&#x27;rgba(0,255,255,0.06)&#x27;);
    g.addColorStop(1,&#x27;rgba(0,255,255,0)&#x27;);
    ctx.fillStyle=g;
    ctx.fillRect(0,sy-40,cv.width,80);
  }

  function drawWalls(){
    var head=snake[0];
    var warn = head.x&lt;=0||head.x&gt;=COLS-1||head.y&lt;=0||head.y&gt;=ROWS-1;
    var col = warn ? &#x27;rgba(255,50,60,0.9)&#x27; : &#x27;rgba(0,220,255,0.5)&#x27;;
    ctx.strokeStyle=col;
    ctx.lineWidth= warn?5:3;
    ctx.shadowBlur= warn?18:10;
    ctx.shadowColor= warn?&#x27;rgba(255,40,40,0.9)&#x27;:&#x27;rgba(0,200,255,0.6)&#x27;;
    ctx.strokeRect(2,2,cv.width-4,cv.height-4);
    ctx.shadowBlur=0;
  }

  function drawSnake(){
    var n=snake.length;
    for(var i=n-1;i&gt;=0;i--){
      var t = n&gt;1 ? i/(n-1) : 0;
      var r=Math.round(lerp(0,150,t));
      var gg=Math.round(lerp(255,40,t));
      var b=Math.round(lerp(255,220,t));
      var s=snake[i];
      ctx.fillStyle=&#x27;rgb(&#x27;+r+&#x27;,&#x27;+gg+&#x27;,&#x27;+b+&#x27;)&#x27;;
      ctx.shadowBlur=12; ctx.shadowColor=&#x27;rgba(&#x27;+r+&#x27;,&#x27;+gg+&#x27;,&#x27;+b+&#x27;,0.7)&#x27;;
      roundRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, 5);
      ctx.fill();
    }
    ctx.shadowBlur=0;
    // eyes on head
    var h=snake[0];
    ctx.fillStyle=&#x27;#012&#x27;;
    var ex=h.x*CELL+CELL/2, ey=h.y*CELL+CELL/2;
    ctx.beginPath(); ctx.arc(ex+dir.x*3-dir.y*3, ey+dir.y*3-dir.x*3,2,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+dir.x*3+dir.y*3, ey+dir.y*3+dir.x*3,2,0,7); ctx.fill();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawStar(){
    if(!star) return;
    var cx=star.x*CELL+CELL/2, cy=star.y*CELL+CELL/2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot*0.5);
    ctx.fillStyle=&#x27;#ffe14d&#x27;; ctx.shadowBlur=14; ctx.shadowColor=&#x27;#ffe14d&#x27;;
    star5(0,0,8,3.5);
    ctx.fill(); ctx.restore(); ctx.shadowBlur=0;
  }
  function star5(cx,cy,outer,inner){
    ctx.beginPath();
    for(var i=0;i&lt;10;i++){
      var rr=i%2?inner:outer;
      var a=Math.PI/5*i - Math.PI/2;
      var px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function drawBolt(now){
    if(!bolt) return;
    var cx=bolt.x*CELL+CELL/2, cy=bolt.y*CELL+CELL/2;
    var pulse = 0.6+0.4*Math.sin(now*0.012);
    ctx.save(); ctx.translate(cx,cy);
    ctx.fillStyle=&#x27;#ff9020&#x27;; ctx.globalAlpha=pulse; ctx.shadowBlur=16; ctx.shadowColor=&#x27;#ff9020&#x27;;
    ctx.beginPath();
    ctx.moveTo(2,-8); ctx.lineTo(-4,1); ctx.lineTo(0,1);
    ctx.lineTo(-2,8); ctx.lineTo(4,-1); ctx.lineTo(0,-1);
    ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;
  }

  function drawOrb(now){
    if(!orb) return;
    var cx=orb.x*CELL+CELL/2, cy=orb.y*CELL+CELL/2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
    var hue=(now*0.2)%360;
    var g=ctx.createLinearGradient(-8,-8,8,8);
    g.addColorStop(0,&#x27;hsl(&#x27;+hue+&#x27;,100%,60%)&#x27;);
    g.addColorStop(0.5,&#x27;hsl(&#x27;+((hue+120)%360)+&#x27;,100%,60%)&#x27;);
    g.addColorStop(1,&#x27;hsl(&#x27;+((hue+240)%360)+&#x27;,100%,60%)&#x27;);
    ctx.fillStyle=g; ctx.shadowBlur=18; ctx.shadowColor=&#x27;hsl(&#x27;+hue+&#x27;,100%,60%)&#x27;;
    ctx.beginPath(); ctx.arc(0,0,8,0,7); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
  }

  function drawPops(){
    for(var i=pops.length-1;i&gt;=0;i--){
      var p=pops[i];
      p.age++;
      var a=1-p.age/40;
      if(a&lt;=0){ pops.splice(i,1); continue; }
      ctx.globalAlpha=a;
      ctx.fillStyle=p.color;
      ctx.font=&#x27;bold 16px Courier New&#x27;;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(p.text, p.x, p.y - p.age*0.9);
    }
    ctx.globalAlpha=1;
  }

  function draw(now){
    if(comboActive(now)){
      // board tint
    }
    drawGrid();
    if(comboActive(now)){
      ctx.fillStyle=&#x27;rgba(160,0,255,0.10)&#x27;;
      ctx.fillRect(0,0,cv.width,cv.height);
    }
    drawWalls();
    drawStar();
    drawBolt(now);
    drawOrb(now);
    drawSnake();
    drawPops();
  }

  function loop(now){
    if(!running) return;
    if(!lastTime) lastTime=now;
    var dt=now-lastTime; lastTime=now;
    rot += dt*0.003;
    scan += dt*0.06;

    // timed collectibles
    if(bolt &amp;&amp; now-bolt.born&gt;5000){ bolt=null; boltTimer=now+3000; }
    if(!bolt &amp;&amp; now&gt;boltTimer){ spawnBolt(); }
    if(orb &amp;&amp; now-orb.born&gt;4000){ orb=null; orbTimer=now+15000; }
    if(!orb &amp;&amp; now&gt;orbTimer){ spawnOrb(); }

    if(!comboActive(now)) comboEl.classList.remove(&#x27;on&#x27;);

    tickAcc+=dt;
    var interval=speedFor();
    while(tickAcc&gt;=interval &amp;&amp; running){
      tickAcc-=interval;
      tick();
      if(!running) break;
    }
    draw(now);
    animId=requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;
    flash(&#x27;rgba(255,30,40,0.9)&#x27;);
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  function startGame(){
    score=0; speedTier=1; scoreEl.textContent=&#x27;0&#x27;; updateFlames();
    initSnake();
    star=null; bolt=null; orb=null; pops=[];
    comboUntil=0; comboEl.classList.remove(&#x27;on&#x27;);
    var now=performance.now();
    boltTimer=now+3000; orbTimer=now+8000;
    spawnStar();
    tickAcc=0; lastTime=0;
    running=true;
    if(animId) cancelAnimationFrame(animId);
    animId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  initSnake(); spawnStar(); updateFlames();
  draw(performance.now());
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
