<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1a1030; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px; background: linear-gradient(90deg,#ff6b9d,#ffd166,#6bffb0); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #d8cfff; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .main { display: flex; gap: 14px; align-items: flex-start; }
  .field-wrap { position: relative; }
  .field { position: relative; width: 250px; height: 400px; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); border: 2px solid rgba(255,255,255,.15); background: linear-gradient(160deg, hsl(280 60% 22%), hsl(320 55% 16%)); transition: background .6s; }
  .cell { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 6px; }
  .ghost { opacity: .28; }
  .pop { animation: pop .35s ease forwards; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.4);} 100%{transform:scale(0);opacity:0;} }
  .flash { position:absolute; left:0; width:100%; background: rgba(255,255,255,.85); border-radius:6px; animation: flash .35s ease forwards; pointer-events:none; }
  @keyframes flash { 0%{opacity:.9;} 100%{opacity:0;} }
  .shake { animation: shake .5s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
  .side { display: flex; flex-direction: column; gap: 10px; width: 120px; }
  .panel { background: rgba(255,255,255,.08); border-radius: 10px; padding: 10px; text-align: center; }

  .panel .val { font-size: 28px; font-weight: 800; }

  @keyframes bump { 0%{transform:scale(1);} 50%{transform:scale(1.4);color:#ffd166;} 100%{transform:scale(1);} }

  .controls { display: flex; gap: 8px; margin-top: 2px; }
  .btn { flex: 1; padding: 12px 0; font-size: 20px; border: none; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; user-select: none; }
  .btn:active { background: rgba(255,255,255,.3); }

  .overlay.show { display: flex; }
  .overlay .big { font-size: 30px; font-weight: 800; color: #ffd166; }
  .overlay .fin { font-size: 46px; font-weight: 800; margin: 6px 0; }
  .overlay .sub { font-size: 15px; color: #d8cfff; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍒 Fruit Drop 🍉&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← → , rotate with ↑, and drop faster with ↓ (or use the buttons). Clear full rows to score — speed rises every 10 points!&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field-wrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
        &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
          &lt;div class=&quot;big&quot;&gt;Game Over&lt;/div&gt;
          &lt;div class=&quot;fin&quot; id=&quot;finalScore&quot;&gt;0&lt;/div&gt;
          &lt;div class=&quot;sub&quot;&gt;Press Restart below to play again&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div class=&quot;next&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;bLeft&quot;&gt;◀&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;bRot&quot;&gt;⟳&lt;/button&gt;
        &lt;button class=&quot;btn&quot; id=&quot;bRight&quot;&gt;▶&lt;/button&gt;
      &lt;/div&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;button class=&quot;btn&quot; id=&quot;bDown&quot; style=&quot;flex:1&quot;&gt;▼ Drop&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 25, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var nextEl = document.getElementById(&#x27;next&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  // Fruit definitions: emoji + candy background
  var FRUITS = [
    { e:&#x27;🍒&#x27;, bg:&#x27;#ff5d73&#x27; },
    { e:&#x27;🍋&#x27;, bg:&#x27;#ffd23f&#x27; },
    { e:&#x27;🍇&#x27;, bg:&#x27;#a45de8&#x27; },
    { e:&#x27;🍉&#x27;, bg:&#x27;#3ddc84&#x27; },
    { e:&#x27;🍓&#x27;, bg:&#x27;#ff7bac&#x27; }
  ];

  // Tetromino shapes, each a list of rotation states (cells relative coords)
  var SHAPES = [
    // O
    [ [[0,0],[1,0],[0,1],[1,1]] ],
    // I
    [ [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]] ],
    // T
    [ [[0,1],[1,1],[2,1],[1,0]], [[1,0],[1,1],[1,2],[2,1]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[1,1],[1,2],[0,1]] ],
    // L
    [ [[0,1],[1,1],[2,1],[2,0]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ],
    // J
    [ [[0,1],[1,1],[2,1],[0,0]], [[1,0],[1,1],[1,2],[2,0]], [[0,1],[1,1],[2,1],[2,2]], [[0,2],[1,0],[1,1],[1,2]] ],
    // S
    [ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]] ],
    // Z
    [ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]] ]
  ];

  var grid, piece, next, score, level, running, dropId, dropMs;

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function randPiece() {
    var s = Math.floor(Math.random()*SHAPES.length);
    var f = Math.floor(Math.random()*FRUITS.length);
    return { shape:s, rot:0, fruit:f, x: 3, y: -1 };
  }

  function cellsOf(p, rot) {
    var states = SHAPES[p.shape];
    var st = states[(rot===undefined?p.rot:rot) % states.length];
    var out = [];
    for (var i=0;i&lt;st.length;i++) out.push({ x: p.x + st[i][0], y: p.y + st[i][1] });
    return out;
  }

  function collides(cells) {
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.x&lt;0||c.x&gt;=COLS||c.y&gt;=ROWS) return true;
      if (c.y&gt;=0 &amp;&amp; grid[c.y][c.x]) return true;
    }
    return false;
  }

  function spawn() {
    piece = next || randPiece();
    next = randPiece();
    piece.x = 3; piece.y = -1; piece.rot = 0;
    drawNext();
    if (collides(cellsOf(piece))) return false;
    return true;
  }

  function lock() {
    var cells = cellsOf(piece);
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS) grid[c.y][c.x] = piece.fruit;
    }
    piece = null;
  }

  function clearRows() {
    var fullRows = [];
    for (var r=0;r&lt;ROWS;r++){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if (grid[r][c]===null){ full=false; break; }
      if (full) fullRows.push(r);
    }
    if (fullRows.length===0) return 0;
    // animate pop
    animateClear(fullRows);
    // remove rows
    for (var i=0;i&lt;fullRows.length;i++){
      grid.splice(fullRows[i],1);
      var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
      grid.unshift(empty);
    }
    return fullRows.length;
  }

  function animateClear(rows) {
    for (var i=0;i&lt;rows.length;i++){
      var r = rows[i];
      var fl = document.createElement(&#x27;div&#x27;);
      fl.className=&#x27;flash&#x27;;
      fl.style.top = (r*CELL)+&#x27;px&#x27;;
      fl.style.height = CELL+&#x27;px&#x27;;
      field.appendChild(fl);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 400); })(fl);
    }
  }

  function ghostY() {
    var gp = { shape:piece.shape, rot:piece.rot, x:piece.x, y:piece.y, fruit:piece.fruit };
    while (!collides(cellsOf({shape:gp.shape,rot:gp.rot,x:gp.x,y:gp.y+1}))) gp.y++;
    return gp.y;
  }

  function makeCell(cls, fruit, x, y) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + (cls||&#x27;&#x27;);
    el.style.width = CELL+&#x27;px&#x27;; el.style.height = CELL+&#x27;px&#x27;;
    el.style.left = (x*CELL)+&#x27;px&#x27;; el.style.top = (y*CELL)+&#x27;px&#x27;;
    el.style.background = FRUITS[fruit].bg;
    el.textContent = FRUITS[fruit].e;
    return el;
  }

  function paint() {
    // remove all cells but keep flashes &amp; overlay
    var kids = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i=0;i&lt;kids.length;i++) kids[i].remove();
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++)
      if (grid[r][c]!==null) field.appendChild(makeCell(&#x27;&#x27;, grid[r][c], c, r));
    if (piece) {
      var gy = ghostY();
      var gcells = cellsOf({shape:piece.shape,rot:piece.rot,x:piece.x,y:gy});
      for (var i=0;i&lt;gcells.length;i++) if (gcells[i].y&gt;=0)
        field.appendChild(makeCell(&#x27;ghost&#x27;, piece.fruit, gcells[i].x, gcells[i].y));
      var cells = cellsOf(piece);
      for (var j=0;j&lt;cells.length;j++) if (cells[j].y&gt;=0)
        field.appendChild(makeCell(&#x27;&#x27;, piece.fruit, cells[j].x, cells[j].y));
    }
  }

  function drawNext() {
    nextEl.innerHTML=&#x27;&#x27;;
    if (!next) return;
    var st = SHAPES[next.shape][0];
    var c = 16;
    for (var i=0;i&lt;st.length;i++){
      var el=document.createElement(&#x27;div&#x27;);
      el.className=&#x27;cell&#x27;;
      el.style.width=c+&#x27;px&#x27;; el.style.height=c+&#x27;px&#x27;; el.style.fontSize=&#x27;13px&#x27;;
      el.style.left=(st[i][0]*c+8)+&#x27;px&#x27;; el.style.top=(st[i][1]*c+8)+&#x27;px&#x27;;
      el.style.background=FRUITS[next.fruit].bg;
      el.textContent=FRUITS[next.fruit].e;
      nextEl.appendChild(el);
    }
  }

  function updateLevelBg() {
    var hue = 280 - (level-1)*22;
    field.style.background = &#x27;linear-gradient(160deg, hsl(&#x27;+hue+&#x27; 60% 22%), hsl(&#x27;+(hue+40)+&#x27; 55% 16%))&#x27;;
  }

  function addScore(rows) {
    if (rows&lt;=0) return;
    var pts = [0,1,3,5,8][rows] || rows*2;
    score += pts;
    scoreEl.textContent = score;
    scoreEl.classList.remove(&#x27;bump&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;bump&#x27;);
    var newLevel = Math.floor(score/10)+1;
    if (newLevel !== level) {
      level = newLevel;
      levelEl.textContent = level;
      dropMs = Math.max(120, 500 - (level-1)*45);
      if (running){ clearInterval(dropId); dropId=setInterval(stepDown, dropMs); }
      updateLevelBg();
    }
  }

  function step() {
    var down = cellsOf({shape:piece.shape,rot:piece.rot,x:piece.x,y:piece.y+1});
    if (collides(down)) {
      lock();
      addScore(clearRows());
      if (!spawn()) { endGame(); return false; }
    } else {
      piece.y++;
    }
    return true;
  }

  function stepDown() {
    if (!running || !piece) return;
    if (step()) paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var nc = cellsOf({shape:piece.shape,rot:piece.rot,x:piece.x+dx,y:piece.y});
    if (!collides(nc)){ piece.x+=dx; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var states = SHAPES[piece.shape];
    var nr = (piece.rot+1)%states.length;
    var kicks = [0,-1,1,-2,2];
    for (var i=0;i&lt;kicks.length;i++){
      var nc = cellsOf({shape:piece.shape,rot:nr,x:piece.x+kicks[i],y:piece.y});
      if (!collides(nc)){ piece.rot=nr; piece.x+=kicks[i]; paint(); return; }
    }
  }

  function endGame() {
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
    finalScoreEl.textContent = score;
    overlay.classList.add(&#x27;show&#x27;);
    field.classList.add(&#x27;shake&#x27;);
    setTimeout(function(){ field.classList.remove(&#x27;shake&#x27;); }, 500);
  }

  function startGame() {
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; level=1; dropMs=500;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    newGrid();
    next = randPiece();
    if (!spawn()) return;
    updateLevelBg();
    paint();
    running=true;
    if (dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, dropMs);
  }

  function stopGame() {
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });

  document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(-1); });
  document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(1); });
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;, function(){ rotate(); });
  document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;, function(){ stepDown(); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // telemetry
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static preview
  newGrid();
  next = randPiece();
  piece = randPiece(); piece.x=3; piece.y=2;
  drawNext();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s

  <div class="controls">

    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
