  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>METEOR SURFER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       color: #6ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 40px; align-items: baseline; }
  .hud .lbl { font-size: 13px; color: #789; letter-spacing: 1px; }
  .hud .val { font-size: 34px; font-weight: 800; color: #fe6; text-shadow: 0 0 10px #f80, 0 0 22px #f40; }
  .hud .best .val { color: #9ff; text-shadow: 0 0 10px #0ff, 0 0 20px #08f; }
  .hud .col { display: flex; flex-direction: column; align-items: center; }
  canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(80,120,255,.3); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;METEOR SURFER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to boost your ship upward and dodge the tumbling meteors. Every 10th meteor cleared triggers a golden SURGE — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;col&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;col best&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;BEST&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;660&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height, RAIL_Y = H - 46;
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);

  var running = false, animId = null, gameOver = false;
  var score = 0, best = 0;
  var ship, meteors, particles, stars, spawnTimer, bobT;
  var surgeTimer = 0, shock = null, screenFlash = 0;
  var speedFactor = 1;

  // audio
  var actx = null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq, dur, type, vol){
    var a = ac(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.12;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime;
    o.start(t);
    o.frequency.exponentialRampToValueAtTime(freq*0.5, t+dur);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.stop(t+dur+0.02);
  }
  function popSound(){ beep(620+Math.random()*160, 0.14, &#x27;triangle&#x27;, 0.14); }
  function surgeSound(){
    beep(300, 0.5, &#x27;sawtooth&#x27;, 0.16);
    setTimeout(function(){ beep(600, 0.4, &#x27;sine&#x27;, 0.14); }, 60);
    setTimeout(function(){ beep(900, 0.35, &#x27;sine&#x27;, 0.12); }, 130);
  }
  function crashSound(){ beep(160, 0.5, &#x27;sawtooth&#x27;, 0.2); }

  function initStars(){
    stars = [];
    for(var i=0;i&lt;90;i++){
      stars.push({ x: Math.random()*W, y: Math.random()*H,
        z: 0.3+Math.random()*1.2, r: 0.5+Math.random()*1.6 });
    }
  }

  function resetState(){
    ship = { x: 110, y: RAIL_Y-16, vy: 0, r: 15 };
    meteors = []; particles = [];
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    gameOver = false; spawnTimer = 0; bobT = 0;
    surgeTimer = 0; shock = null; screenFlash = 0; speedFactor = 1;
    initStars();
  }

  function spawnMeteor(){
    var kind = Math.random();
    var m;
    if(kind &lt; 0.35){ // small fast
      m = { r: 8+Math.random()*4, spd: 3.6+Math.random()*1.6 };
    } else if(kind &lt; 0.7){ // medium
      m = { r: 15+Math.random()*8, spd: 2.4+Math.random()*1.2 };
    } else { // wide slow
      m = { r: 24+Math.random()*12, spd: 1.6+Math.random()*0.9 };
    }
    m.x = W + m.r + 10;
    m.y = 40 + Math.random()*(RAIL_Y - 60);
    m.rot = 0; m.rv = (Math.random()-0.5)*0.15;
    m.scored = false;
    m.hue = 15 + Math.random()*30;
    meteors.push(m);
    // clusters
    if(kind &gt;= 0.7 &amp;&amp; Math.random()&lt;0.4){
      for(var c=0;c&lt;2;c++){
        meteors.push({ x: W + 40 + c*40, y: m.y + (c-0.5)*70,
          r: 7+Math.random()*4, spd: m.spd+0.4, rot:0, rv:(Math.random()-0.5)*0.2,
          scored:false, hue:m.hue });
      }
    }
  }

  function boost(){
    if(!running || gameOver) return;
    ship.vy = -6.4;
    beep(500, 0.08, &#x27;square&#x27;, 0.06);
  }

  function burst(x,y,hue,n){
    for(var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, s = 1+Math.random()*3.5;
      particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:1, hue: hue });
    }
  }

  function bgColor(){
    // shift indigo -&gt; purple -&gt; red as score climbs
    var t = Math.min(score/60, 1);
    var r = Math.round(15 + t*90);
    var g = Math.round(5 + t*4);
    var b = Math.round(40 - t*30);
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function tick(){
    if(!running) return;
    speedFactor = 1 + Math.min(score,60)*0.03;
    bobT += 0.08;

    // physics
    ship.vy += 0.32;
    ship.y += ship.vy;
    var floor = RAIL_Y - ship.r - 1;
    if(ship.y &gt; floor){ ship.y = floor; ship.vy = 0; }
    if(ship.y &lt; ship.r){ ship.y = ship.r; ship.vy = 0; }
    // gentle bob when resting
    var restY = floor;
    if(Math.abs(ship.y - floor) &lt; 1 &amp;&amp; ship.vy===0){
      ship.y = floor - Math.sin(bobT)*3 - 3;
    }

    // spawn
    spawnTimer -= 1;
    if(spawnTimer &lt;= 0){
      spawnMeteor();
      spawnTimer = Math.max(28, 70 - score*1.2);
    }

    if(surgeTimer&gt;0) surgeTimer--;
    if(screenFlash&gt;0) screenFlash -= 0.05;

    // ---- draw background ----
    ctx.fillStyle = bgColor();
    ctx.fillRect(0,0,W,H);

    // stars / warp
    var warp = Math.min(score/50, 1);
    for(var i=0;i&lt;stars.length;i++){
      var st = stars[i];
      var sp = st.z * (1.5 + speedFactor*1.8);
      st.x -= sp;
      if(st.x &lt; 0){ st.x = W; st.y = Math.random()*H; }
      if(warp &gt; 0.15){
        ctx.strokeStyle = &#x27;rgba(180,200,255,&#x27;+(0.3+st.z*0.4)+&#x27;)&#x27;;
        ctx.lineWidth = st.r*0.7;
        ctx.beginPath();
        ctx.moveTo(st.x, st.y);
        ctx.lineTo(st.x + sp*warp*7, st.y);
        ctx.stroke();
      } else {
        ctx.fillStyle = &#x27;rgba(200,215,255,&#x27;+(0.4+st.z*0.4)+&#x27;)&#x27;;
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
      }
    }

    // rail
    var railGrad = ctx.createLinearGradient(0,RAIL_Y,0,H);
    railGrad.addColorStop(0,&#x27;rgba(0,255,255,0.9)&#x27;);
    railGrad.addColorStop(1,&#x27;rgba(0,100,255,0)&#x27;);
    ctx.fillStyle = railGrad;
    ctx.fillRect(0, RAIL_Y, W, 6);
    ctx.strokeStyle = &#x27;rgba(120,255,255,0.9)&#x27;;
    ctx.lineWidth = 2; ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(0,RAIL_Y); ctx.lineTo(W,RAIL_Y); ctx.stroke();
    ctx.shadowBlur = 0;

    // shockwave
    if(shock){
      shock.r += 22;
      ctx.strokeStyle = &#x27;rgba(255,220,80,&#x27;+Math.max(0,1-shock.r/W)+&#x27;)&#x27;;
      ctx.lineWidth = 6; ctx.shadowColor=&#x27;#fe6&#x27;; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(shock.x, shock.y, shock.r, 0, 7); ctx.stroke();
      ctx.shadowBlur = 0;
      if(shock.r &gt; W*1.2) shock = null;
    }

    // meteors
    for(var i=meteors.length-1;i&gt;=0;i--){
      var m = meteors[i];
      m.x -= m.spd * speedFactor;
      m.rot += m.rv;

      // draw
      ctx.save();
      ctx.translate(m.x, m.y); ctx.rotate(m.rot);
      var mg = ctx.createRadialGradient(0,0,2,0,0,m.r);
      mg.addColorStop(0,&#x27;hsl(&#x27;+m.hue+&#x27;,90%,65%)&#x27;);
      mg.addColorStop(1,&#x27;hsl(&#x27;+m.hue+&#x27;,80%,28%)&#x27;);
      ctx.fillStyle = mg;
      ctx.shadowColor = &#x27;hsl(&#x27;+m.hue+&#x27;,90%,55%)&#x27;; ctx.shadowBlur = 12;
      ctx.beginPath();
      for(var a=0;a&lt;8;a++){
        var ang = a/8*Math.PI*2;
        var rr = m.r*(0.8+0.25*Math.sin(a*2.3+m.hue));
        ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();

      // scoring
      if(!m.scored &amp;&amp; m.x + m.r &lt; ship.x - ship.r){
        m.scored = true;
        score++; scoreEl.textContent = score;
        popSound();
        burst(ship.x+20, ship.y, m.hue, 8);
        if(score % 10 === 0){
          surgeTimer = 90;
          shock = { x: ship.x, y: ship.y, r: 10 };
          screenFlash = 1;
          surgeSound();
        }
      }

      // collision
      var dx = m.x - ship.x, dy = m.y - ship.y;
      if(Math.hypot(dx,dy) &lt; m.r + ship.r*0.8){
        if(surgeTimer &gt; 0){
          // vaporize
          burst(m.x, m.y, m.hue, 14);
          popSound();
          meteors.splice(i,1);
          continue;
        } else {
          gameOver = true;
          crashSound();
          burst(ship.x, ship.y, 20, 30);
          endGame();
          return;
        }
      }

      if(m.x &lt; -m.r-20) meteors.splice(i,1);
    }

    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.03;
      if(p.life&lt;=0){ particles.splice(i,1); continue; }
      ctx.fillStyle = &#x27;hsla(&#x27;+p.hue+&#x27;,100%,65%,&#x27;+p.life+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5*p.life+0.5,0,7); ctx.fill();
    }

    // ship
    drawShip();

    // screen flash
    if(screenFlash&gt;0){
      ctx.fillStyle = &#x27;rgba(255,220,90,&#x27;+screenFlash*0.35+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
    }

    animId = requestAnimationFrame(tick);
  }

  function drawShip(){
    var surging = surgeTimer &gt; 0;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    var tilt = Math.max(-0.4, Math.min(0.4, ship.vy*0.05));
    ctx.rotate(tilt);
    // engine glow
    ctx.fillStyle = &#x27;rgba(0,200,255,0.6)&#x27;;
    ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=18;
    ctx.beginPath();
    ctx.moveTo(-ship.r, -5); ctx.lineTo(-ship.r-14-Math.random()*8,0); ctx.lineTo(-ship.r,5);
    ctx.closePath(); ctx.fill();
    // body
    var col = surging ? &#x27;#ffd84a&#x27; : &#x27;#3af&#x27;;
    ctx.fillStyle = col;
    ctx.strokeStyle = surging ? &#x27;#fff2a0&#x27; : &#x27;#bff&#x27;;
    ctx.lineWidth = 2;
    ctx.shadowColor = surging ? &#x27;#fe6&#x27; : &#x27;#0ff&#x27;;
    ctx.shadowBlur = surging ? 26 : 16;
    ctx.beginPath();
    ctx.moveTo(ship.r+4, 0);
    ctx.lineTo(-ship.r, -ship.r*0.75);
    ctx.lineTo(-ship.r*0.5, 0);
    ctx.lineTo(-ship.r, ship.r*0.75);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // cockpit
    ctx.shadowBlur = 0;
    ctx.fillStyle = surging ? &#x27;#fff&#x27; : &#x27;#dff&#x27;;
    ctx.beginPath(); ctx.arc(2,0,4,0,7); ctx.fill();
    ctx.restore();
  }

  function endGame(){
    running = false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    if(score &gt; best){ best = score; bestEl.textContent = best; }
    // draw overlay
    setTimeout(function(){
      ctx.fillStyle = &#x27;rgba(5,0,20,0.7)&#x27;;
      ctx.fillRect(0,0,W,H);
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillStyle=&#x27;#f66&#x27;; ctx.shadowColor=&#x27;#f00&#x27;; ctx.shadowBlur=16;
      ctx.font=&#x27;bold 40px system-ui&#x27;; ctx.fillText(&#x27;CRASHED!&#x27;, W/2, H/2-10);
      ctx.shadowBlur=0; ctx.fillStyle=&#x27;#9cf&#x27;; ctx.font=&#x27;20px system-ui&#x27;;
      ctx.fillText(&#x27;Score &#x27;+score+&#x27;  ·  Best &#x27;+best, W/2, H/2+28);
      ctx.fillStyle=&#x27;#89a&#x27;; ctx.font=&#x27;16px system-ui&#x27;;
      ctx.fillText(&#x27;Press Start below to surf again&#x27;, W/2, H/2+58);
    }, 40);
  }

  function startGame(){
    if(running) return;
    ac();
    resetState();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame(){
    running = false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  function drawIdle(){
    ctx.fillStyle = bgColor(); ctx.fillRect(0,0,W,H);
    if(!stars) initStars();
    for(var i=0;i&lt;stars.length;i++){
      var st = stars[i];
      ctx.fillStyle=&#x27;rgba(200,215,255,&#x27;+(0.4+st.z*0.4)+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
    }
    ctx.strokeStyle=&#x27;rgba(120,255,255,0.9)&#x27;; ctx.lineWidth=2;
    ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(0,RAIL_Y); ctx.lineTo(W,RAIL_Y); ctx.stroke();
    ctx.shadowBlur=0;
    if(!ship) ship = { x:110, y:RAIL_Y-16, vy:0, r:15 };
    drawShip();
    ctx.textAlign=&#x27;center&#x27;; ctx.fillStyle=&#x27;#9cf&#x27;; ctx.font=&#x27;18px system-ui&#x27;;
    ctx.fillText(&#x27;Press Start below to launch&#x27;, W/2, 70);
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ boost(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;mousedown&#x27;, function(){ boost(); });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });

  initStars();
  drawIdle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
