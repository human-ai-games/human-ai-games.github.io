  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: &#x27;Courier New&#x27;, monospace; background: #000; color: #fff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEBULA BLITZ&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr;&amp;rarr;&lt;/strong&gt; and hold &lt;strong&gt;Space&lt;/strong&gt; to fire plasma bolts at descending aliens. Chain hits to grow your multiplier, but don&#x27;t let invaders reach the bottom — press Start below to play.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;mult&quot;&gt;STREAK x&lt;span id=&quot;mult&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;time&quot;&gt;TIME &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;canvas&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;banner&quot;&gt;READY&lt;small&gt;Press Start below&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var W = 620, H = 470;
var canvas = document.getElementById(&#x27;canvas&#x27;), ctx = canvas.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;),
    timeEl = document.getElementById(&#x27;time&#x27;), flashEl = document.getElementById(&#x27;flash&#x27;),
    banner = document.getElementById(&#x27;banner&#x27;);

var running = false, animId = null;
var keys = {};
var ship, bullets, enemies, particles, stars;
var score, streak, mult, lastShot, gameTime, spawnTimer, spawnInterval, elapsedWave;
var lastFrame;

// audio
var AC = null;
function beep(freq, dur, type, vol) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  } catch (_) {}
}

var TYPES = {
  drone:      { r: 11, color: &#x27;#c0f&#x27;, points: 1, speed: 90,  hp: 1 },
  jellyfish:  { r: 17, color: &#x27;#f90&#x27;, points: 2, speed: 60,  hp: 2 },
  mothership: { r: 26, color: &#x27;#f22&#x27;, points: 5, speed: 38,  hp: 4 }
};

function reset() {
  ship = { x: W/2, y: H - 28, w: 34, h: 24 };
  bullets = []; enemies = []; particles = [];
  stars = [];
  for (var i = 0; i &lt; 90; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, s: 0.5 + Math.random()*2, sp: 20 + Math.random()*80 });
  }
  score = 0; streak = 0; mult = 1; lastShot = 0;
  gameTime = 60; spawnTimer = 0; spawnInterval = 1.1; elapsedWave = 0;
  keys = {};
  updateHud();
}

function updateHud() {
  scoreEl.textContent = score;
  multEl.textContent = mult;
  timeEl.textContent = Math.ceil(gameTime);
}

function spawnEnemy() {
  var roll = Math.random();
  var type = roll &lt; 0.6 ? &#x27;drone&#x27; : (roll &lt; 0.88 ? &#x27;jellyfish&#x27; : &#x27;mothership&#x27;);
  var t = TYPES[type];
  var x = t.r + Math.random() * (W - 2*t.r);
  enemies.push({
    type: type, r: t.r, color: t.color, points: t.points, hp: t.hp,
    x: x, baseX: x, y: -t.r, speed: t.speed,
    amp: 30 + Math.random()*70, freq: 1 + Math.random()*2, phase: Math.random()*6.28,
    flash: 0
  });
}

function fire() {
  var now = performance.now();
  if (now - lastShot &lt; 140) return;
  lastShot = now;
  bullets.push({ x: ship.x, y: ship.y - 16, vy: -520 });
  beep(880, 0.06, &#x27;square&#x27;, 0.04);
}

function explode(x, y, color, count) {
  for (var i = 0; i &lt; count; i++) {
    var a = Math.random()*6.28, s = 40 + Math.random()*180;
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.5 + Math.random()*0.4, max: 0.9, color: color, r: 1.5 + Math.random()*2.5 });
  }
}

function doFlash() {
  flashEl.style.transition = &#x27;none&#x27;;
  flashEl.style.opacity = &#x27;0.28&#x27;;
  requestAnimationFrame(function() {
    flashEl.style.transition = &#x27;opacity 0.18s&#x27;;
    flashEl.style.opacity = &#x27;0&#x27;;
  });
}

function update(dt) {
  // timer
  gameTime -= dt;
  if (gameTime &lt;= 0) { gameTime = 0; endGame(); return; }

  // difficulty ramps every 10s
  elapsedWave += dt;
  spawnInterval = Math.max(0.32, 1.1 - Math.floor((60 - gameTime) / 10) * 0.15);

  // move ship
  if (keys[&#x27;ArrowLeft&#x27;]) ship.x -= 360 * dt;
  if (keys[&#x27;ArrowRight&#x27;]) ship.x += 360 * dt;
  ship.x = Math.max(20, Math.min(W - 20, ship.x));
  if (keys[&#x27; &#x27;]) fire();

  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    var st = stars[i];
    st.y += st.sp * dt;
    if (st.y &gt; H) { st.y = 0; st.x = Math.random()*W; }
  }

  // spawn
  spawnTimer += dt;
  if (spawnTimer &gt;= spawnInterval) { spawnTimer = 0; spawnEnemy(); }

  // bullets
  for (var b = bullets.length - 1; b &gt;= 0; b--) {
    var bl = bullets[b];
    bl.y += bl.vy * dt;
    if (bl.y &lt; -10) bullets.splice(b, 1);
  }

  // enemies
  for (var e = enemies.length - 1; e &gt;= 0; e--) {
    var en = enemies[e];
    en.y += en.speed * dt;
    en.phase += en.freq * dt;
    en.x = en.baseX + Math.sin(en.phase) * en.amp;
    en.x = Math.max(en.r, Math.min(W - en.r, en.x));
    if (en.flash &gt; 0) en.flash -= dt;
    if (en.y - en.r &gt; H) {
      // reached bottom -&gt; reset streak/mult
      enemies.splice(e, 1);
      streak = 0; mult = 1;
      beep(120, 0.25, &#x27;sawtooth&#x27;, 0.08);
      updateHud();
      continue;
    }
    // collision with bullets
    for (var b2 = bullets.length - 1; b2 &gt;= 0; b2--) {
      var bb = bullets[b2];
      var dx = bb.x - en.x, dy = bb.y - en.y;
      if (dx*dx + dy*dy &lt; (en.r + 4)*(en.r + 4)) {
        bullets.splice(b2, 1);
        en.hp -= 1;
        en.flash = 0.12;
        explode(bb.x, bb.y, en.color, 6);
        if (en.hp &lt;= 0) {
          explode(en.x, en.y, en.color, 22);
          streak += 1;
          mult = 1 + Math.floor(streak / 3);
          score += en.points * mult;
          doFlash();
          beep(220 + en.points*40, 0.12, &#x27;triangle&#x27;, 0.07);
          enemies.splice(e, 1);
          updateHud();
        } else {
          beep(300, 0.05, &#x27;square&#x27;, 0.03);
        }
        break;
      }
    }
  }

  // particles
  for (var p = particles.length - 1; p &gt;= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= dt;
    if (pt.life &lt;= 0) particles.splice(p, 1);
  }
}

function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.shadowBlur = 14; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillStyle = &#x27;#0ff&#x27;;
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(15, 12);
  ctx.lineTo(6, 8);
  ctx.lineTo(-6, 8);
  ctx.lineTo(-15, 12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.beginPath(); ctx.arc(0, -2, 3, 0, 6.28); ctx.fill();
  // thruster
  ctx.shadowColor = &#x27;#f80&#x27;;
  ctx.fillStyle = &#x27;rgba(255,150,0,&#x27; + (0.5 + Math.random()*0.4) + &#x27;)&#x27;;
  ctx.beginPath();
  ctx.moveTo(-4, 10); ctx.lineTo(4, 10); ctx.lineTo(0, 16 + Math.random()*8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemy(en) {
  ctx.save();
  ctx.translate(en.x, en.y);
  ctx.shadowBlur = 16; ctx.shadowColor = en.color;
  ctx.fillStyle = en.flash &gt; 0 ? &#x27;#fff&#x27; : en.color;
  if (en.type === &#x27;drone&#x27;) {
    ctx.beginPath();
    ctx.moveTo(0, -en.r); ctx.lineTo(en.r, 0); ctx.lineTo(0, en.r); ctx.lineTo(-en.r, 0);
    ctx.closePath(); ctx.fill();
  } else if (en.type === &#x27;jellyfish&#x27;) {
    ctx.beginPath();
    ctx.arc(0, 0, en.r, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = en.flash &gt; 0 ? &#x27;#fff&#x27; : en.color;
    ctx.lineWidth = 2;
    for (var k = -2; k &lt;= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(k*5, 0);
      ctx.quadraticCurveTo(k*5 + Math.sin(en.phase + k)*4, en.r, k*5, en.r + 6);
      ctx.stroke();
    }
  } else {
    ctx.beginPath(); ctx.ellipse(0, 0, en.r, en.r*0.62, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = en.flash &gt; 0 ? &#x27;#fdd&#x27; : &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(0, -3, en.r*0.4, Math.PI, 0); ctx.fill();
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  // starfield
  for (var i = 0; i &lt; stars.length; i++) {
    var st = stars[i];
    ctx.globalAlpha = 0.3 + st.s/2.5*0.5;
    ctx.fillStyle = &#x27;#9cf&#x27;;
    ctx.fillRect(st.x, st.y, st.s, st.s*2);
  }
  ctx.globalAlpha = 1;

  // particles
  for (var p = 0; p &lt; particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life / pt.max);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // bullets
  ctx.shadowBlur = 8; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillStyle = &#x27;#cff&#x27;;
  for (var b = 0; b &lt; bullets.length; b++) {
    ctx.fillRect(bullets[b].x - 2, bullets[b].y - 8, 4, 12);
  }
  ctx.shadowBlur = 0;

  // enemies
  for (var e = 0; e &lt; enemies.length; e++) drawEnemy(enemies[e]);

  drawShip();
}

function loop(now) {
  if (!running) return;
  var dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  update(dt);
  if (!running) { render(); return; }
  render();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  reset();
  banner.style.display = &#x27;none&#x27;;
  running = true;
  lastFrame = performance.now();
  spawnEnemy();
  animId = requestAnimationFrame(loop);
}

function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  banner.innerHTML = &#x27;PAUSED&lt;small&gt;Press Start below&lt;/small&gt;&#x27;;
  banner.style.display = &#x27;flex&#x27;;
}

function endGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  render();
  banner.innerHTML = &#x27;GAME OVER&lt;small&gt;Score: &#x27; + score + &#x27; — Press Start to play again&lt;/small&gt;&#x27;;
  banner.style.display = &#x27;flex&#x27;;
  beep(160, 0.4, &#x27;sawtooth&#x27;, 0.09);
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keys[e.key] = true; e.preventDefault(); }
  else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { keys[&#x27; &#x27;] = true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
  else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) keys[&#x27; &#x27;] = false;
});

window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

reset();
render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
