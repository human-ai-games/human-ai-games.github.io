<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060d; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff5bef,#5bd7ff,#8bff5b,#ffd75b); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,160,255,.4); }
  .instructions { font-size: 16px; color: #9fb0e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 18px; }
  .hud .score { color: #fff; font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #b9c4ea; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #080a16; }
  .speedbar { width: 100%; height: 12px; background: #10142a; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 6px #000; }
  .speedfill { height: 100%; width: 10%; background: linear-gradient(90deg,#3affc2,#5bd7ff,#ff5bef);
       box-shadow: 0 0 12px #5bd7ff; transition: width .3s; }
  .speedrow { width: 480px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9fb0e0; }
  /* arrow pad */
  .pad { position: absolute; right: 8px; bottom: 8px; display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 3px; opacity: .85; }
  .pad button { border: 1px solid #3a4a80; background: rgba(20,28,60,.7); color: #bcd0ff; font-size: 16px; border-radius: 7px; cursor: pointer; }
  .pad button:active { background: rgba(90,215,255,.4); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with arrow keys, swipes, or the on-screen pad to eat orbs, gold stars, and rare purple gems. Avoid the walls and your own tail — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;
      &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#ffffff;box-shadow:0 0 6px #fff&quot;&gt;&lt;/i&gt;1&lt;/span&gt;
      &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#ffd75b;box-shadow:0 0 6px #ffd75b&quot;&gt;&lt;/i&gt;3&lt;/span&gt;
      &lt;span&gt;&lt;i class=&quot;dot&quot; style=&quot;background:#c05bff;box-shadow:0 0 6px #c05bff&quot;&gt;&lt;/i&gt;5&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;480&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;pad&quot;&gt;
      &lt;button class=&quot;up&quot; data-dir=&quot;up&quot;&gt;▲&lt;/button&gt;
      &lt;button class=&quot;left&quot; data-dir=&quot;left&quot;&gt;◀&lt;/button&gt;
      &lt;button class=&quot;right&quot; data-dir=&quot;right&quot;&gt;▶&lt;/button&gt;
      &lt;button class=&quot;down&quot; data-dir=&quot;down&quot;&gt;▼&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;speedrow&quot;&gt;
    &lt;span&gt;SPEED&lt;/span&gt;
    &lt;div class=&quot;speedbar&quot;&gt;&lt;div class=&quot;speedfill&quot; id=&quot;speedfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;), speedfill = document.getElementById(&#x27;speedfill&#x27;);
var CELL = 20, COLS = 24, ROWS = 20;
var W = COLS*CELL, H = ROWS*CELL;

var running=false, gameOver=false, rafId=null;
var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
var score=0, moveAcc=0, lastTime=0, timeNow=0;
var trail=[], popups=[], particles=[], flash=null;

// collectibles
var orb=null, star=null, gem=null;
var starTimer=0, gemTimer=0, gemVisible=false;
var STAR_LIFE=5000, GEM_CYCLE=15000, GEM_LIFE=3000;

function baseInterval(){ return Math.max(70, 150 - score*2); }

function occupied(x,y){
  for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  return false;
}
function isItem(x,y){
  if(orb&amp;&amp;orb.x===x&amp;&amp;orb.y===y) return true;
  if(star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
  if(gem&amp;&amp;gemVisible&amp;&amp;gem.x===x&amp;&amp;gem.y===y) return true;
  return false;
}
function randCell(){
  for(var t=0;t&lt;300;t++){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if(!occupied(x,y)&amp;&amp;!isItem(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}
function spawnOrb(){ orb=randCell(); }
function spawnStar(){ star=randCell(); starTimer=STAR_LIFE; }
function spawnGem(){ gem=randCell(); gemVisible=true; gemTimer=GEM_LIFE; }

function initSnake(){
  snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  dir={x:1,y:0}; pendingDir={x:1,y:0};
}

function hsl(h,s,l,a){ return &#x27;hsla(&#x27;+h+&#x27;,&#x27;+s+&#x27;%,&#x27;+l+&#x27;%,&#x27;+(a==null?1:a)+&#x27;)&#x27;; }

function addPopup(x,y,text,color){
  popups.push({x:x*CELL+CELL/2, y:y*CELL, text:text, color:color, life:1});
}
function doFlash(color){ flash={color:color, life:1}; }

function explode(){
  for(var i=0;i&lt;snake.length;i++){
    var s=snake[i];
    var h=(i/snake.length*300+timeNow*0.05)%360;
    for(var k=0;k&lt;3;k++){
      particles.push({
        x:s.x*CELL+CELL/2, y:s.y*CELL+CELL/2,
        vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
        life:1, color:hsl(h,90,60,1)
      });
    }
  }
}

function eat(kind){
  if(kind===&#x27;orb&#x27;){ score+=1; doFlash(&#x27;rgba(255,255,255,&#x27;); addPopup(orb.x,orb.y,&#x27;+1&#x27;,&#x27;#ffffff&#x27;); spawnOrb(); }
  else if(kind===&#x27;star&#x27;){ score+=3; doFlash(&#x27;rgba(255,215,91,&#x27;); addPopup(star.x,star.y,&#x27;+3&#x27;,&#x27;#ffd75b&#x27;); spawnStar(); }
  else if(kind===&#x27;gem&#x27;){ score+=5; doFlash(&#x27;rgba(192,91,255,&#x27;); addPopup(gem.x,gem.y,&#x27;+5&#x27;,&#x27;#c05bff&#x27;); gemVisible=false; gem=null; gemTimer=0; }
  scoreEl.textContent=score;
  speedfill.style.width=Math.min(100, 10+(150-baseInterval())/0.8)+&#x27;%&#x27;;
}

function step(){
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0];
  var nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
  // trail from current head
  trail.push({x:head.x*CELL+CELL/2, y:head.y*CELL+CELL/2, life:1, hue:(timeNow*0.05)%360});

  var willEat = (orb&amp;&amp;nx===orb.x&amp;&amp;ny===orb.y) || (star&amp;&amp;nx===star.x&amp;&amp;ny===star.y) || (gem&amp;&amp;gemVisible&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y);
  var body = willEat ? snake : snake.slice(0, snake.length-1);
  for(var i=0;i&lt;body.length;i++){ if(body[i].x===nx&amp;&amp;body[i].y===ny){ die(); return; } }

  snake.unshift({x:nx,y:ny});
  if(orb&amp;&amp;nx===orb.x&amp;&amp;ny===orb.y) eat(&#x27;orb&#x27;);
  else if(star&amp;&amp;nx===star.x&amp;&amp;ny===star.y) eat(&#x27;star&#x27;);
  else if(gem&amp;&amp;gemVisible&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y) eat(&#x27;gem&#x27;);
  else snake.pop();
}

function die(){
  running=false; gameOver=true;
  explode();
  // keep animating for particles/final text via a light loop
  drawLoopFinal();
}

function drawLoopFinal(){
  timeNow=performance.now();
  render();
  var alive=false;
  for(var i=0;i&lt;particles.length;i++) if(particles[i].life&gt;0) alive=true;
  if(gameOver &amp;&amp; !running){ rafId=requestAnimationFrame(drawLoopFinal); }
}

function drawBorders(){
  var t=timeNow*0.06;
  ctx.lineWidth=3;
  var segs=4;
  // top, right, bottom, left, each shifting hue
  function border(x1,y1,x2,y2,off){
    var grad=ctx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0,hsl((t+off)%360,90,60,.9));
    grad.addColorStop(1,hsl((t+off+80)%360,90,60,.9));
    ctx.strokeStyle=grad;
    ctx.shadowColor=hsl((t+off)%360,90,60,1); ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  var m=1.5;
  border(m,m,W-m,m,0);
  border(W-m,m,W-m,H-m,90);
  border(W-m,H-m,m,H-m,180);
  border(m,H-m,m,m,270);
  ctx.shadowBlur=0;
}

function render(){
  ctx.clearRect(0,0,W,H);
  // subtle pulsing background grid glow
  var pulse=0.06+0.03*Math.sin(timeNow*0.002);
  ctx.fillStyle=&#x27;rgba(20,30,70,&#x27;+pulse+&#x27;)&#x27;;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=&#x27;rgba(60,80,150,0.08)&#x27;;
  ctx.lineWidth=1;
  for(var gx=0;gx&lt;=COLS;gx++){ ctx.beginPath(); ctx.moveTo(gx*CELL,0); ctx.lineTo(gx*CELL,H); ctx.stroke(); }
  for(var gy=0;gy&lt;=ROWS;gy++){ ctx.beginPath(); ctx.moveTo(0,gy*CELL); ctx.lineTo(W,gy*CELL); ctx.stroke(); }

  // trail
  for(var i=0;i&lt;trail.length;i++){
    var tr=trail[i];
    ctx.fillStyle=hsl(tr.hue,90,60,tr.life*0.35);
    ctx.shadowColor=hsl(tr.hue,90,60,tr.life*0.5); ctx.shadowBlur=10;
    var r=CELL*0.4*tr.life;
    ctx.beginPath(); ctx.arc(tr.x,tr.y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;

  // collectibles
  if(orb){
    var op=0.5+0.5*Math.sin(timeNow*0.008);
    drawItem(orb,&#x27;#ffffff&#x27;,CELL*0.32,10+op*6);
  }
  if(star){
    var sp=Math.abs(Math.sin(timeNow*0.012));
    ctx.globalAlpha=0.4+0.6*sp;
    drawItem(star,&#x27;#ffd75b&#x27;,CELL*0.36,14);
    ctx.globalAlpha=1;
  }
  if(gem&amp;&amp;gemVisible){
    var gp=0.5+0.5*Math.sin(timeNow*0.01);
    drawItem(gem,&#x27;#c05bff&#x27;,CELL*(0.30+gp*0.12),16);
  }

  // snake
  for(var i=snake.length-1;i&gt;=0;i--){
    var s=snake[i];
    var hue=(i/Math.max(1,snake.length)*300+timeNow*0.05)%360;
    ctx.fillStyle=hsl(hue,90,60,1);
    ctx.shadowColor=hsl(hue,90,60,1); ctx.shadowBlur=i===0?18:10;
    var pad=i===0?2:3;
    roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 5);
    ctx.fill();
  }
  ctx.shadowBlur=0;

  drawBorders();

  // popups
  for(var i=0;i&lt;popups.length;i++){
    var p=popups[i];
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.font=&#x27;bold 18px system-ui&#x27;;
    ctx.textAlign=&#x27;center&#x27;;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.fillText(p.text,p.x,p.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // particles
  for(var i=0;i&lt;particles.length;i++){
    var pt=particles[i];
    if(pt.life&lt;=0) continue;
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.shadowColor=pt.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // flash overlay
  if(flash){
    ctx.fillStyle=flash.color+(flash.life*0.4)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  // game over text
  if(gameOver){
    ctx.fillStyle=&#x27;rgba(5,6,13,0.55)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle=&#x27;#5bd7ff&#x27;;
    ctx.shadowColor=&#x27;#5bd7ff&#x27;; ctx.shadowBlur=20;
    ctx.font=&#x27;bold 34px system-ui&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-10);
    ctx.font=&#x27;bold 26px system-ui&#x27;;
    ctx.fillStyle=&#x27;#ffd75b&#x27;; ctx.shadowColor=&#x27;#ffd75b&#x27;;
    ctx.fillText(&#x27;Score &#x27;+score, W/2, H/2+28);
    ctx.shadowBlur=0;
  }
}

function drawItem(item,color,r,blur){
  var cx=item.x*CELL+CELL/2, cy=item.y*CELL+CELL/2;
  ctx.fillStyle=color;
  ctx.shadowColor=color; ctx.shadowBlur=blur;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function update(dt){
  moveAcc+=dt;
  var interval=baseInterval();
  while(moveAcc&gt;=interval &amp;&amp; running){ moveAcc-=interval; step(); }

  // timers
  if(star){ starTimer-=dt; if(starTimer&lt;=0) spawnStar(); }
  gemTimer-=dt;
  if(gemVisible){ if(gemTimer&lt;=0){ gemVisible=false; gem=null; gemTimer=GEM_CYCLE; } }
  else { if(gemTimer&lt;=0){ spawnGem(); } }

  // trail fade
  for(var i=0;i&lt;trail.length;i++) trail[i].life-=dt*0.004;
  trail=trail.filter(function(t){return t.life&gt;0;});
  // popups
  for(var i=0;i&lt;popups.length;i++){ popups[i].y-=dt*0.03; popups[i].life-=dt*0.0015; }
  popups=popups.filter(function(p){return p.life&gt;0;});
  // flash
  if(flash){ flash.life-=dt*0.004; if(flash.life&lt;=0) flash=null; }
  // particles
  for(var i=0;i&lt;particles.length;i++){
    var pt=particles[i];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.96; pt.vy*=0.96; pt.life-=dt*0.0015;
  }
  particles=particles.filter(function(p){return p.life&gt;0;});
}

function loop(ts){
  if(!running) return;
  timeNow=ts;
  var dt=ts-lastTime; lastTime=ts;
  if(dt&gt;100) dt=100;
  update(dt);
  render();
  rafId=requestAnimationFrame(loop);
}

function startGame(){
  if(rafId) cancelAnimationFrame(rafId);
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  gameOver=false; running=true;
  moveAcc=0;
  trail=[]; popups=[]; particles=[]; flash=null;
  initSnake();
  spawnOrb(); spawnStar();
  gemVisible=false; gem=null; gemTimer=GEM_CYCLE;
  speedfill.style.width=&#x27;10%&#x27;;
  lastTime=performance.now(); timeNow=lastTime;
  rafId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

function setDir(d){
  if(d===&#x27;left&#x27;) pendingDir={x:-1,y:0};
  else if(d===&#x27;right&#x27;) pendingDir={x:1,y:0};
  else if(d===&#x27;up&#x27;) pendingDir={x:0,y:-1};
  else if(d===&#x27;down&#x27;) pendingDir={x:0,y:1};
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ setDir(&#x27;left&#x27;); e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ setDir(&#x27;right&#x27;); e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ setDir(&#x27;up&#x27;); e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ setDir(&#x27;down&#x27;); e.preventDefault(); }
});

// arrow pad
var padButtons=document.querySelectorAll(&#x27;.pad button&#x27;);
for(var i=0;i&lt;padButtons.length;i++){
  padButtons[i].addEventListener(&#x27;click&#x27;, function(){ setDir(this.getAttribute(&#x27;data-dir&#x27;)); });
}

// swipe
var touchStart=null;
cv.addEventListener(&#x27;touchstart&#x27;, function(e){
  var t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY};
}, {passive:true});
cv.addEventListener(&#x27;touchend&#x27;, function(e){
  if(!touchStart) return;
  var t=e.changedTouches[0];
  var dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
  if(Math.abs(dx)&lt;15&amp;&amp;Math.abs(dy)&lt;15) return;
  if(Math.abs(dx)&gt;Math.abs(dy)) setDir(dx&gt;0?&#x27;right&#x27;:&#x27;left&#x27;);
  else setDir(dy&gt;0?&#x27;down&#x27;:&#x27;up&#x27;);
  touchStart=null;
}, {passive:true});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
timeNow=performance.now();
initSnake(); spawnOrb(); spawnStar();
render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
