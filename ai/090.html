  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#ff0); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,255,255,0.4); }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 20px; font-weight: 700; }
  .hud .score { color: #0ff; text-shadow: 0 0 10px rgba(0,255,255,0.6); }
  .hud .combo { color: #f6f; text-shadow: 0 0 10px rgba(255,0,255,0.6); }
  canvas { background: #05030f; border-radius: 10px; box-shadow: 0 0 24px rgba(80,0,160,0.5); display:block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to slide the glowing paddle and bounce the orb up to smash the bricks. Keep long rallies going to build combo multipliers, and grab the golden WIDE brick for a bigger paddle.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot;&gt;COMBO &lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);

var running = false, animId = null;
var score = 0, combo = 1;

// Audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.08;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (_) {}
}

// Paddle
var basePW = 110, PW = basePW, PH = 14, paddleX = (W - PW) / 2, paddleY = H - 28;
var targetX = paddleX;
var wideTimer = 0;

// Ball
var BR = 9, ballX = W/2, ballY = paddleY - 40, ballVX = 3.2, ballVY = -3.8;
var baseSpeed = 4.8;

// Bricks
var bricks = [];
var COLS = 10, ROWS = 6, BW = 56, BH = 22, GAP = 4;
var GX = (W - (COLS * (BW+GAP) - GAP)) / 2, GY = 40;
var COLORS = [&#x27;#ff3b6b&#x27;,&#x27;#ff9e2c&#x27;,&#x27;#ffe23b&#x27;,&#x27;#38e66b&#x27;,&#x27;#2cc9ff&#x27;,&#x27;#b46bff&#x27;];

function makeLayout() {
  bricks = [];
  var wideCount = 0, wideMax = 2;
  for (var r = 0; r &lt; ROWS; r++) {
    for (var c = 0; c &lt; COLS; c++) {
      // fun pattern: skip some for shape variety
      if (Math.random() &lt; 0.12 &amp;&amp; r &gt; 0) continue;
      var reinforced = Math.random() &lt; 0.3;
      var isWide = false;
      if (wideCount &lt; wideMax &amp;&amp; Math.random() &lt; 0.04) { isWide = true; wideCount++; }
      bricks.push({
        x: GX + c*(BW+GAP), y: GY + r*(BH+GAP), w: BW, h: BH,
        color: COLORS[r % COLORS.length],
        hp: reinforced ? 2 : 1,
        maxhp: reinforced ? 2 : 1,
        pts: reinforced ? 3 : 1,
        wide: isWide,
        alive: true, hit: 0
      });
    }
  }
}

// Particles
var particles = [];
function explode(x, y, color, n) {
  for (var i = 0; i &lt; n; i++) {
    var a = Math.random() * Math.PI * 2, sp = 1 + Math.random()*4;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color, size:2+Math.random()*3 });
  }
}

// Popups
var popups = [];
function popup(text, x, y, color) {
  popups.push({ text:text, x:x, y:y, life:1, color:color });
}

// Starfield parallax
var stars1 = [], stars2 = [];
function initStars() {
  stars1 = []; stars2 = [];
  for (var i = 0; i &lt; 40; i++) stars1.push({ x:Math.random()*W, y:Math.random()*H, s:0.6 });
  for (var i = 0; i &lt; 25; i++) stars2.push({ x:Math.random()*W, y:Math.random()*H, s:1.6 });
}
initStars();

var flash = 0;

function resetBall() {
  ballX = paddleX + PW/2; ballY = paddleY - 30;
  var ang = (-Math.PI/2) + (Math.random()-0.5)*0.6;
  ballVX = Math.cos(ang) * baseSpeed;
  ballVY = Math.sin(ang) * baseSpeed;
}

function setPaddleWidth(w) {
  var cx = paddleX + PW/2;
  PW = w;
  paddleX = cx - PW/2;
}

function resetGame() {
  score = 0; combo = 1;
  scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;x1&#x27;;
  PW = basePW; wideTimer = 0;
  paddleX = (W - PW)/2; targetX = paddleX;
  baseSpeed = 4.8;
  makeLayout();
  particles = []; popups = [];
  resetBall();
}

function speedFromCombo() {
  return 4.8 + Math.min(combo - 1, 8) * 0.5;
}

function applyBallSpeed() {
  var mag = Math.sqrt(ballVX*ballVX + ballVY*ballVY) || 1;
  var target = speedFromCombo();
  ballVX = ballVX/mag*target; ballVY = ballVY/mag*target;
}

function loseBall() {
  combo = 1; comboEl.textContent = &#x27;x1&#x27;;
  beep(120, 0.3, &#x27;sawtooth&#x27;, 0.1);
  popup(&#x27;MISS&#x27;, paddleX + PW/2, paddleY - 30, &#x27;#f55&#x27;);
  resetBall();
}

function tick() {
  if (!running) return;

  // Stars scroll (parallax hurtling down)
  for (var i = 0; i &lt; stars1.length; i++) { stars1[i].y += 0.4; if (stars1[i].y &gt; H) { stars1[i].y = 0; stars1[i].x = Math.random()*W; } }
  for (var i = 0; i &lt; stars2.length; i++) { stars2[i].y += 1.1; if (stars2[i].y &gt; H) { stars2[i].y = 0; stars2[i].x = Math.random()*W; } }

  // Paddle smooth follow
  paddleX += (targetX - paddleX) * 0.25;
  paddleX = Math.max(0, Math.min(W - PW, paddleX));

  // Wide timer
  if (wideTimer &gt; 0) {
    wideTimer--;
    if (wideTimer === 0) setPaddleWidth(basePW);
  }

  // Ball move
  ballX += ballVX; ballY += ballVY;

  if (ballX - BR &lt;= 0) { ballX = BR; ballVX = -ballVX; }
  if (ballX + BR &gt;= W) { ballX = W - BR; ballVX = -ballVX; }
  if (ballY - BR &lt;= 0) { ballY = BR; ballVY = -ballVY; }

  // Paddle collision
  if (ballVY &gt; 0 &amp;&amp; ballY + BR &gt;= paddleY &amp;&amp; ballY + BR &lt;= paddleY + PH + 8 &amp;&amp;
      ballX &gt;= paddleX - BR &amp;&amp; ballX &lt;= paddleX + PW + BR) {
    var rel = (ballX - (paddleX + PW/2)) / (PW/2); // -1..1
    var mag = speedFromCombo();
    var ang = rel * (Math.PI/3); // up to 60deg
    ballVX = Math.sin(ang) * mag;
    ballVY = -Math.abs(Math.cos(ang) * mag);
    ballY = paddleY - BR;
    beep(440, 0.06, &#x27;square&#x27;, 0.06);
  }

  // Fell below
  if (ballY - BR &gt; H) loseBall();

  // Brick collisions
  for (var i = 0; i &lt; bricks.length; i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    if (ballX + BR &gt; b.x &amp;&amp; ballX - BR &lt; b.x + b.w &amp;&amp; ballY + BR &gt; b.y &amp;&amp; ballY - BR &lt; b.y + b.h) {
      // determine bounce direction
      var overL = (ballX + BR) - b.x;
      var overR = (b.x + b.w) - (ballX - BR);
      var overT = (ballY + BR) - b.y;
      var overB = (b.y + b.h) - (ballY - BR);
      var minH = Math.min(overL, overR), minV = Math.min(overT, overB);
      if (minH &lt; minV) ballVX = -ballVX; else ballVY = -ballVY;

      b.hp--;
      b.hit = 6;
      if (b.hp &lt;= 0) {
        b.alive = false;
        explode(b.x + b.w/2, b.y + b.h/2, b.color, 16);
        combo++;
        var gained = b.pts * combo;
        score += gained;
        scoreEl.textContent = score;
        comboEl.textContent = &#x27;x&#x27; + combo;
        flash = 8;
        applyBallSpeed();
        beep(660 + combo*40, 0.08, &#x27;square&#x27;, 0.08);
        if (combo &gt;= 2) popup(&#x27;x&#x27; + combo + &#x27;!&#x27;, paddleX + PW/2, paddleY - 34, &#x27;#ff0&#x27;);
        if (b.wide) {
          setPaddleWidth(Math.min(basePW * 2, 220));
          wideTimer = 60 * 8;
          popup(&#x27;WIDE!&#x27;, ballX, b.y, &#x27;#ffd54a&#x27;);
          beep(880, 0.2, &#x27;triangle&#x27;, 0.1);
        }
      } else {
        explode(ballX, ballY, b.color, 6);
        beep(300, 0.05, &#x27;square&#x27;, 0.05);
      }
      break;
    }
  }

  // Level clear
  var remaining = 0;
  for (var i = 0; i &lt; bricks.length; i++) if (bricks[i].alive) remaining++;
  if (remaining === 0) {
    popup(&#x27;CLEARED!&#x27;, W/2, H/2, &#x27;#0ff&#x27;);
    beep(523, 0.15, &#x27;triangle&#x27;, 0.12);
    setTimeout(function(){ beep(784, 0.2, &#x27;triangle&#x27;, 0.12); }, 120);
    makeLayout();
    resetBall();
  }

  // Update particles
  for (var i = particles.length - 1; i &gt;= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.03;
    if (p.life &lt;= 0) particles.splice(i, 1);
  }
  // Update popups
  for (var i = popups.length - 1; i &gt;= 0; i--) {
    popups[i].y -= 0.6; popups[i].life -= 0.02;
    if (popups[i].life &lt;= 0) popups.splice(i, 1);
  }
  if (flash &gt; 0) flash--;

  draw();
  animId = requestAnimationFrame(tick);
}

function drawStatic() {
  // draw one frame while stopped
  draw();
}

function draw() {
  ctx.clearRect(0,0,W,H);
  // background gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#0a0620&#x27;); g.addColorStop(1,&#x27;#05030f&#x27;);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars
  ctx.fillStyle = &#x27;rgba(150,180,255,0.5)&#x27;;
  for (var i = 0; i &lt; stars1.length; i++) { ctx.beginPath(); ctx.arc(stars1[i].x, stars1[i].y, stars1[i].s, 0, 6.28); ctx.fill(); }
  ctx.fillStyle = &#x27;rgba(220,230,255,0.9)&#x27;;
  for (var i = 0; i &lt; stars2.length; i++) { ctx.beginPath(); ctx.arc(stars2[i].x, stars2[i].y, stars2[i].s, 0, 6.28); ctx.fill(); }

  // flash overlay
  if (flash &gt; 0) { ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+(flash/40)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }

  // bricks
  for (var i = 0; i &lt; bricks.length; i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    var col = b.wide ? &#x27;#ffd54a&#x27; : b.color;
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = b.hit &gt; 0 ? 18 : 8;
    ctx.fillStyle = col;
    if (b.hp &lt; b.maxhp) ctx.globalAlpha = 0.6; // cracked reinforced
    roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    // crack lines for reinforced not-yet-broken
    if (b.maxhp &gt; 1 &amp;&amp; b.hp &lt; b.maxhp) {
      ctx.strokeStyle = &#x27;rgba(0,0,0,0.5)&#x27;; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(b.x+b.w*0.3, b.y); ctx.lineTo(b.x+b.w*0.5, b.y+b.h*0.6); ctx.lineTo(b.x+b.w*0.4, b.y+b.h);
      ctx.stroke();
    }
    // label
    ctx.fillStyle = &#x27;rgba(0,0,0,0.75)&#x27;;
    ctx.font = &#x27;bold 11px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillText(b.wide ? &#x27;WIDE&#x27; : b.pts, b.x + b.w/2, b.y + b.h/2 + 1);
  }

  // paddle
  ctx.save();
  ctx.shadowColor = wideTimer &gt; 0 ? &#x27;#ffd54a&#x27; : &#x27;#0ff&#x27;;
  ctx.shadowBlur = 16;
  var pg = ctx.createLinearGradient(paddleX,0,paddleX+PW,0);
  pg.addColorStop(0, wideTimer&gt;0 ? &#x27;#ffd54a&#x27;:&#x27;#0ff&#x27;);
  pg.addColorStop(1, wideTimer&gt;0 ? &#x27;#ff9e2c&#x27;:&#x27;#a0f&#x27;);
  ctx.fillStyle = pg;
  roundRect(paddleX, paddleY, PW, PH, 7); ctx.fill();
  ctx.restore();

  // ball (pulsing)
  var pulse = 1 + Math.sin(Date.now()/120)*0.15;
  ctx.save();
  ctx.shadowColor = &#x27;#fff&#x27;; ctx.shadowBlur = 20;
  var bg = ctx.createRadialGradient(ballX, ballY, 1, ballX, ballY, BR*pulse);
  bg.addColorStop(0,&#x27;#fff&#x27;); bg.addColorStop(0.5,&#x27;#8ff&#x27;); bg.addColorStop(1,&#x27;#08f&#x27;);
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(ballX, ballY, BR*pulse, 0, 6.28); ctx.fill();
  ctx.restore();

  // particles
  for (var i = 0; i &lt; particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // popups
  for (var i = 0; i &lt; popups.length; i++) {
    var pu = popups[i];
    ctx.globalAlpha = Math.max(0, pu.life);
    ctx.fillStyle = pu.color;
    ctx.font = &#x27;bold 22px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.shadowColor = pu.color; ctx.shadowBlur = 12;
    ctx.fillText(pu.text, pu.x, pu.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// Mouse / touch control
function moveToClientX(clientX) {
  var rect = cv.getBoundingClientRect();
  var scale = W / rect.width;
  var x = (clientX - rect.left) * scale;
  targetX = x - PW/2;
}
cv.addEventListener(&#x27;mousemove&#x27;, function(e){ moveToClientX(e.clientX); });
cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if (e.touches[0]) { moveToClientX(e.touches[0].clientX); e.preventDefault(); } }, { passive:false });
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ if (e.touches[0]) moveToClientX(e.touches[0].clientX); });

function startGame() {
  if (running) return;
  resetGame();
  running = true;
  animId = requestAnimationFrame(tick);
}
function stopGame() {
  if (!running) return;
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
makeLayout();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;

<script>

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
