<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON CASCADE</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON CASCADE</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: &#x27;Courier New&#x27;, monospace; background: #05010f; color: #e8f0ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 3px; color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .wrap { position: relative; }
  canvas { display: block; background: #05010f; border-radius: 8px; box-shadow: 0 0 24px rgba(0,200,255,.35); }
  #banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 40px; font-weight: 900; color: #ff0; text-shadow: 0 0 12px #ff0, 0 0 24px #f80; letter-spacing: 3px; opacity: 0; pointer-events: none; }
  #over { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; font-size: 30px; font-weight: 900; color: #0ff; text-shadow: 0 0 12px #0ff; opacity: 0; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON CASCADE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &amp;larr; &amp;rarr; and press Space to fire lasers at the alien invaders before the timer hits zero. Chain quick hits to build a COMBO x2 and rack up your score — use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;520&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;banner&quot;&gt;COMBO x2&lt;/div&gt;
    &lt;div id=&quot;over&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var banner = document.getElementById(&#x27;banner&#x27;), overEl = document.getElementById(&#x27;over&#x27;);

  var running = false, animId = null;
  var keys = {};
  var ship, bullets, enemies, particles, popups, stars, trail;
  var score, timeLeft, lastTime, spawnTimer, spawnInterval;
  var comboHits, comboExpire, comboActive, level;
  var lastShot;

  var BG_COLORS = [&#x27;#05010f&#x27;,&#x27;#0a0018&#x27;,&#x27;#001410&#x27;,&#x27;#140012&#x27;,&#x27;#0a1000&#x27;,&#x27;#100010&#x27;];

  function initStars() {
    stars = [];
    for (var i=0;i&lt;80;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5});
  }

  function reset() {
    ship = {x: W/2, y: H-30, w: 30, h: 22};
    bullets = []; enemies = []; particles = []; popups = []; trail = [];
    score = 0; timeLeft = 60; lastTime = 0;
    spawnInterval = 900; spawnTimer = 0;
    comboHits = 0; comboExpire = 0; comboActive = false; level = 0;
    lastShot = 0;
    initStars();
    for (var k in keys) keys[k]=false;
    banner.style.opacity = 0; overEl.style.opacity = 0;
  }

  function spawnEnemy() {
    var r = Math.random();
    var type, x = Math.random()*(W-60)+30;
    if (r &lt; 0.5) type = &#x27;dart&#x27;;
    else if (r &lt; 0.82) type = &#x27;blob&#x27;;
    else type = &#x27;cruiser&#x27;;
    createEnemy(type, x, -20, 0);
  }

  function createEnemy(type, x, y, sizeMult) {
    var e = {type:type, x:x, y:y, t:Math.random()*Math.PI*2, baseX:x, flash:0};
    var erratic = 1 + level*0.35;
    if (type===&#x27;dart&#x27;) {
      e.r=10; e.hp=1; e.pts=1; e.color=&#x27;#c04bff&#x27;; e.vy=(2.2+level*0.5); e.amp=50*erratic; e.freq=0.09;
    } else if (type===&#x27;blob&#x27;) {
      e.r = sizeMult ? 10 : 16; e.hp=1; e.pts=sizeMult?1:2; e.color=&#x27;#ff9020&#x27;;
      e.vy=(1.4+level*0.4)*(sizeMult?1.3:1); e.amp=30*erratic; e.freq=0.05; e.split=!sizeMult;
      e.pulse=0;
    } else {
      e.r=24; e.hp=3; e.pts=5; e.color=&#x27;#ff3050&#x27;; e.vy=(0.9+level*0.25); e.amp=40*erratic; e.freq=0.03; e.spiral=true;
    }
    enemies.push(e);
  }

  function fire() {
    var now = performance.now();
    if (now - lastShot &lt; 180) return;
    lastShot = now;
    bullets.push({x:ship.x, y:ship.y-14, vy:-9});
    beep(880, 0.05, &#x27;square&#x27;, 0.06);
  }

  // audio
  var actx = null;
  function beep(f, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||&#x27;sine&#x27;; o.frequency.value=f;
      g.gain.value=vol||0.1;
      o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    } catch(_){}
  }

  function explode(x,y,color,n) {
    for (var i=0;i&lt;n;i++){
      var a=Math.random()*Math.PI*2, sp=Math.random()*4+1;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
    }
    flash = 0.5;
  }
  var flash = 0;

  function addPopup(x,y,text,color){ popups.push({x:x,y:y,text:text,color:color,life:1}); }

  function registerHit(e) {
    var mult = comboActive ? 2 : 1;
    var gained = e.pts * mult;
    score += gained;
    addPopup(e.x, e.y, &#x27;+&#x27;+gained, mult&gt;1?&#x27;#ff0&#x27;:e.color);
    explode(e.x, e.y, e.color, e.type===&#x27;cruiser&#x27;?24:14);
    beep(e.type===&#x27;cruiser&#x27;?200:440, 0.15, &#x27;sawtooth&#x27;, 0.12);
    // combo tracking
    var now = performance.now();
    if (now &lt; comboExpire) comboHits++; else comboHits = 1;
    comboExpire = now + 2000;
    if (comboHits &gt;= 3 &amp;&amp; !comboActive) {
      comboActive = true;
      banner.style.opacity = 1; banner.style.transition=&#x27;none&#x27;;
      setTimeout(function(){ banner.style.transition=&#x27;opacity 1s&#x27;; banner.style.opacity=0; }, 50);
    }
    // level up
    var newLevel = Math.floor(score/10);
    if (newLevel &gt; level) {
      level = newLevel;
      spawnInterval = Math.max(350, 900 - level*90);
      document.querySelector(&#x27;.wrap&#x27;).style.setProperty(&#x27;--bg&#x27;, BG_COLORS[level % BG_COLORS.length]);
    }
  }

  function update(dt) {
    // ship
    if (keys[&#x27;ArrowLeft&#x27;]) ship.x -= 5;
    if (keys[&#x27;ArrowRight&#x27;]) ship.x += 5;
    ship.x = Math.max(18, Math.min(W-18, ship.x));
    trail.push({x:ship.x,y:ship.y,life:1});
    if (trail.length&gt;18) trail.shift();

    // combo expire
    if (comboActive &amp;&amp; performance.now() &gt; comboExpire) { comboActive=false; comboHits=0; }

    // stars
    var starSpd = 0.6 + level*0.35;
    for (var i=0;i&lt;stars.length;i++){ stars[i].y += stars[i].s*starSpd; if(stars[i].y&gt;H){stars[i].y=0;stars[i].x=Math.random()*W;} }

    // bullets
    for (var b=bullets.length-1;b&gt;=0;b--){ bullets[b].y+=bullets[b].vy; if(bullets[b].y&lt;-10) bullets.splice(b,1); }

    // spawn
    spawnTimer += dt;
    if (spawnTimer &gt; spawnInterval) { spawnTimer = 0; spawnEnemy(); }

    // enemies
    for (var e=enemies.length-1;e&gt;=0;e--){
      var en = enemies[e];
      en.t += en.freq;
      en.y += en.vy;
      if (en.spiral) en.x = en.baseX + Math.sin(en.t)*en.amp * (en.y/H+0.3);
      else en.x = en.baseX + Math.sin(en.t)*en.amp;
      if (en.pulse!==undefined) en.pulse += 0.15;
      if (en.flash&gt;0) en.flash -= dt/120;
      if (en.y &gt; H+30) { enemies.splice(e,1); continue; }
    }

    // collisions
    for (var b2=bullets.length-1;b2&gt;=0;b2--){
      var bl=bullets[b2];
      for (var e2=enemies.length-1;e2&gt;=0;e2--){
        var en2=enemies[e2];
        var dx=bl.x-en2.x, dy=bl.y-en2.y;
        if (dx*dx+dy*dy &lt; (en2.r+4)*(en2.r+4)) {
          bullets.splice(b2,1);
          en2.hp--; en2.flash=1;
          if (en2.hp&lt;=0) {
            registerHit(en2);
            if (en2.split) {
              createEnemy(&#x27;blob&#x27;, en2.x-10, en2.y, 1);
              createEnemy(&#x27;blob&#x27;, en2.x+10, en2.y, 1);
            }
            enemies.splice(e2,1);
          }
          break;
        }
      }
    }

    // particles
    for (var p=particles.length-1;p&gt;=0;p--){
      var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=0.025;
      if(pt.life&lt;=0) particles.splice(p,1);
    }
    // popups
    for (var pu=popups.length-1;pu&gt;=0;pu--){ popups[pu].y-=0.7; popups[pu].life-=0.015; if(popups[pu].life&lt;=0) popups.splice(pu,1); }

    if (flash&gt;0) flash -= dt/300;

    // timer
    timeLeft -= dt/1000;
    if (timeLeft &lt;= 0) { timeLeft=0; endGame(); }
  }

  function draw() {
    ctx.fillStyle = BG_COLORS[level % BG_COLORS.length];
    ctx.fillRect(0,0,W,H);
    // stars
    for (var i=0;i&lt;stars.length;i++){ ctx.fillStyle=&#x27;rgba(200,220,255,&#x27;+(0.3+stars[i].s*0.25)+&#x27;)&#x27;; ctx.fillRect(stars[i].x,stars[i].y,stars[i].s,stars[i].s*2); }
    // flash
    if (flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.3)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }
    // trail
    for (var t=0;t&lt;trail.length;t++){ var tr=trail[t]; var a=t/trail.length*0.4; ctx.fillStyle=&#x27;rgba(0,220,255,&#x27;+a+&#x27;)&#x27;; ctx.beginPath(); ctx.arc(tr.x,tr.y,6*(t/trail.length),0,7); ctx.fill(); }
    // bullets
    ctx.fillStyle=&#x27;#0ff&#x27;; ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=8;
    for (var b=0;b&lt;bullets.length;b++){ ctx.fillRect(bullets[b].x-2,bullets[b].y-8,4,12); }
    ctx.shadowBlur=0;
    // enemies
    for (var e=0;e&lt;enemies.length;e++){
      var en=enemies[e];
      var col = en.flash&gt;0 ? &#x27;#fff&#x27; : en.color;
      var r = en.r + (en.pulse!==undefined?Math.sin(en.pulse)*3:0);
      ctx.fillStyle=col; ctx.shadowColor=en.color; ctx.shadowBlur=14;
      ctx.beginPath();
      if (en.type===&#x27;dart&#x27;){ ctx.moveTo(en.x,en.y+r); ctx.lineTo(en.x-r*0.7,en.y-r); ctx.lineTo(en.x+r*0.7,en.y-r); ctx.closePath(); }
      else if (en.type===&#x27;cruiser&#x27;){ ctx.rect(en.x-r,en.y-r*0.6,r*2,r*1.2); }
      else { ctx.arc(en.x,en.y,r,0,7); }
      ctx.fill();
      if (en.type===&#x27;cruiser&#x27;){ ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;11px Courier New&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(en.hp, en.x, en.y+4); }
      ctx.shadowBlur=0;
    }
    // ship
    ctx.fillStyle=&#x27;#0ff&#x27;; ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(ship.x,ship.y-14); ctx.lineTo(ship.x-14,ship.y+10); ctx.lineTo(ship.x+14,ship.y+10); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // particles
    for (var p=0;p&lt;particles.length;p++){ var pt=particles[p]; ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color; ctx.fillRect(pt.x-2,pt.y-2,4,4); }
    ctx.globalAlpha=1;
    // popups
    ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;bold 18px Courier New&#x27;;
    for (var pu=0;pu&lt;popups.length;pu++){ ctx.globalAlpha=Math.max(0,popups[pu].life); ctx.fillStyle=popups[pu].color; ctx.fillText(popups[pu].text, popups[pu].x, popups[pu].y); }
    ctx.globalAlpha=1;
    // HUD
    ctx.textAlign=&#x27;left&#x27;; ctx.font=&#x27;bold 18px Courier New&#x27;; ctx.fillStyle=&#x27;#0ff&#x27;;
    ctx.fillText(&#x27;SCORE &#x27;+score, 12, 24);
    ctx.textAlign=&#x27;center&#x27;; ctx.fillStyle = timeLeft&lt;10?&#x27;#f44&#x27;:&#x27;#ff0&#x27;;
    ctx.fillText(&#x27;⏱ &#x27;+Math.ceil(timeLeft), W/2, 24);
    ctx.textAlign=&#x27;right&#x27;; ctx.fillStyle = comboActive?&#x27;#ff0&#x27;:&#x27;#8af&#x27;;
    ctx.fillText(comboActive?&#x27;COMBO x2&#x27;:(&#x27;STREAK &#x27;+comboHits), W-12, 24);
    ctx.textAlign=&#x27;left&#x27;;
    ctx.fillStyle=&#x27;#456&#x27;; ctx.font=&#x27;12px Courier New&#x27;; ctx.fillText(&#x27;LEVEL &#x27;+(level+1), 12, H-8);
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = Math.min(50, ts - lastTime); lastTime = ts;
    update(dt); draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    reset();
    running = true; lastTime = 0;
    spawnEnemy();
    draw();
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId=null; }
  }
  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId=null; }
    overEl.innerHTML = &#x27;GAME OVER&lt;br&gt;&lt;span style=&quot;font-size:22px;color:#ff0&quot;&gt;SCORE &#x27;+score+&#x27;&lt;/span&gt;&lt;br&gt;&lt;span style=&quot;font-size:16px;color:#8af&quot;&gt;Press Start to play again&lt;/span&gt;&#x27;;
    overEl.style.opacity = 1;
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) fire(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false; });

  cv.addEventListener(&#x27;mousedown&#x27;, function(){ if(running) fire(); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  reset(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
