<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐙 Reef Bonkers 🦀</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: linear-gradient(180deg, #0a4d6b 0%, #0d6a8a 50%, #0a4d6b 100%); color: #eaf6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 12px; box-sizing: border-box; height: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .5px;
    text-shadow: 0 2px 0 #05364d, 0 0 12px #35c7ff; }
  .instructions { font-size: 16px; color: #cbeeff; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .chest { display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg,#8a5a2b,#5c3813);
    border: 3px solid #d4a24e; border-radius: 12px; padding: 5px 14px; box-shadow: 0 3px 8px rgba(0,0,0,.4); }
  .chest .coin { font-size: 22px; }
  .chest .val { font-size: 24px; font-weight: 800; color: #ffe08a; min-width: 34px; text-align: left; }
  .tier { font-size: 14px; color: #bfe9ff; background: rgba(255,255,255,.08); padding: 4px 10px; border-radius: 10px; }
  .board-wrap { position: relative; }
  .board { position: relative; width: 480px; height: 480px; display: grid;
    grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); gap: 10px;
    padding: 16px; box-sizing: border-box;
    background: radial-gradient(circle at 50% 30%, #13809f, #0a5570);
    border-radius: 22px;
    border: 6px solid transparent;
    box-shadow: 0 0 0 4px #ff7ab6, 0 0 24px #ff7ab6, inset 0 0 30px rgba(0,0,0,.3);
    animation: reefPulse 2.4s ease-in-out infinite;
  }
  @keyframes reefPulse {
    0%,100% { box-shadow: 0 0 0 4px #ff7ab6, 0 0 18px #ff7ab6, inset 0 0 30px rgba(0,0,0,.3); }
    50% { box-shadow: 0 0 0 5px #ffd166, 0 0 34px #59e6c1, inset 0 0 30px rgba(0,0,0,.3); }
  }
  .hole { position: relative; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #1b4256 40%, #0a2836 100%);
    box-shadow: inset 0 8px 16px rgba(0,0,0,.55); overflow: hidden; display: flex;
    align-items: flex-end; justify-content: center; }
  .hole::after { content:&#x27;&#x27;; position:absolute; bottom:-6px; left:0; right:0; height: 36%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%); }
  .critter { position: absolute; bottom: -100%; font-size: 64px; line-height: 1; cursor: pointer;
    user-select: none; transition: bottom .18s cubic-bezier(.34,1.56,.64,1); filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  .critter.up { bottom: 4%; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0) rotate(-3deg);} 50%{ transform: translateY(-6px) rotate(3deg);} }
  .critter.splat { animation: splat .3s ease-out forwards; }
  @keyframes splat { 0%{ transform: scale(1);} 40%{ transform: scale(1.35) rotate(8deg);} 100%{ transform: scale(0); opacity:0;} }
  .badge { position: absolute; top: 6%; left: 50%; transform: translateX(-50%);
    font-size: 13px; font-weight: 800; color: #fff; padding: 1px 7px; border-radius: 10px;
    background: #1fa845; box-shadow: 0 1px 3px rgba(0,0,0,.4); pointer-events: none; z-index: 3; }
  .badge.p2 { background:#2b8bd6; } .badge.p3 { background:#e0a000; } .badge.neg { background:#c0392b; }
  .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, rgba(180,235,255,.4));
    pointer-events: none; z-index: 5; animation: rise .7s ease-out forwards; }
  @keyframes rise { from{ transform: translateY(0) scale(.4); opacity:.9;} to{ transform: translateY(-70px) scale(1.1); opacity:0;} }
  .float { position: absolute; font-size: 26px; font-weight: 900; pointer-events: none; z-index: 6;
    text-shadow: 0 2px 4px rgba(0,0,0,.5); animation: floatUp .8s ease-out forwards; }
  @keyframes floatUp { from{ transform: translate(-50%,0); opacity:1;} to{ transform: translate(-50%,-50px); opacity:0;} }
  .combo { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    font-size: 44px; font-weight: 900; color: #ffd166; z-index: 8; pointer-events: none;
    text-shadow: 0 0 12px #ff7ab6, 0 3px 0 #b25b00; animation: comboPop .9s ease-out forwards; }
  @keyframes comboPop { 0%{ transform: translate(-50%,-50%) scale(.2); opacity:0;} 20%{ transform: translate(-50%,-50%) scale(1.3); opacity:1;}
    70%{ transform: translate(-50%,-50%) scale(1);} 100%{ transform: translate(-50%,-90%) scale(1); opacity:0;} }
  .msg { font-size: 15px; color: #ffe08a; min-height: 18px; margin: 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐙 Reef Bonkers 🦀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the crabs, puffer fish and octopuses as they pop up to earn the points shown on each badge — but never click the starfish or you&#x27;ll lose a point! Chain three quick hits for a combo bonus.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;chest&quot;&gt;&lt;span class=&quot;coin&quot;&gt;🪙&lt;/span&gt;&lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tier&quot; id=&quot;tier&quot;&gt;Tier 1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board-wrap&quot;&gt;
    &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press Start below to dive in!&lt;/p&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var tierEl = document.getElementById(&#x27;tier&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var CREATURES = [
    { emoji:&#x27;🦀&#x27;, pts:1, cls:&#x27;&#x27;, weight:5 },
    { emoji:&#x27;🐡&#x27;, pts:2, cls:&#x27;p2&#x27;, weight:3 },
    { emoji:&#x27;🐙&#x27;, pts:3, cls:&#x27;p3&#x27;, weight:1 },
  ];
  var STARFISH = { emoji:&#x27;⭐&#x27;, pts:-1, cls:&#x27;neg&#x27; };

  var holes = [];
  var running = false;
  var score = 0;
  var startTime = 0;
  var spawnTimer = null;
  var tickTimer = null;
  var tier = 1;
  var comboCount = 0;
  var lastHitTime = 0;

  // build holes
  for (var i=0;i&lt;9;i++){
    var h = document.createElement(&#x27;div&#x27;);
    h.className = &#x27;hole&#x27;;
    board.appendChild(h);
    holes.push({ el:h, occupied:false, timeout:null });
  }

  // ---- audio ----
  var actx = null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){}} return actx; }
  function bonk(){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;square&#x27;; o.frequency.setValueAtTime(420,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(120,a.currentTime+0.12);
    g.gain.setValueAtTime(0.25,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.16);
  }
  function buzz(){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(180,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(60,a.currentTime+0.25);
    g.gain.setValueAtTime(0.2,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.3);
  }
  function whoosh(){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(200,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(900,a.currentTime+0.4);
    g.gain.setValueAtTime(0.15,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.45);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.45);
  }
  function chime(){
    var a=ac(); if(!a) return;
    [660,880,1100].forEach(function(f,i){
      var o=a.createOscillator(), g=a.createGain();
      o.type=&#x27;triangle&#x27;; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,a.currentTime+i*0.06);
      g.gain.exponentialRampToValueAtTime(0.2,a.currentTime+i*0.06+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+i*0.06+0.25);
      o.connect(g); g.connect(a.destination); o.start(a.currentTime+i*0.06); o.stop(a.currentTime+i*0.06+0.3);
    });
  }

  function pickCreature(){
    // small chance of starfish decoy, scaling slightly with tier
    if (Math.random() &lt; 0.12 + tier*0.02) return STARFISH;
    var total = CREATURES.reduce(function(s,c){return s+c.weight;},0);
    var r = Math.random()*total;
    for (var i=0;i&lt;CREATURES.length;i++){ r-=CREATURES[i].weight; if(r&lt;=0) return CREATURES[i]; }
    return CREATURES[0];
  }

  function currentLife(){
    return Math.max(650, 1500 - tier*160);
  }

  function makeBubbles(hole){
    for (var i=0;i&lt;6;i++){
      var b=document.createElement(&#x27;div&#x27;);
      var sz = 6+Math.random()*12;
      b.className=&#x27;bubble&#x27;;
      b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
      b.style.left=(20+Math.random()*60)+&#x27;%&#x27;;
      b.style.bottom=(10+Math.random()*30)+&#x27;%&#x27;;
      b.style.animationDelay=(Math.random()*0.1)+&#x27;s&#x27;;
      hole.appendChild(b);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },800); })(b);
    }
  }

  function floatText(hole, txt, color){
    var f=document.createElement(&#x27;div&#x27;);
    f.className=&#x27;float&#x27;; f.textContent=txt; f.style.color=color;
    f.style.left=&#x27;50%&#x27;; f.style.top=&#x27;30%&#x27;;
    hole.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },800);
  }

  function showCombo(mult){
    var c=document.createElement(&#x27;div&#x27;);
    c.className=&#x27;combo&#x27;; c.textContent=&#x27;COMBO x&#x27;+mult+&#x27;!&#x27;;
    board.appendChild(c);
    setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },900);
    // confetti bubbles
    for (var i=0;i&lt;14;i++){
      var b=document.createElement(&#x27;div&#x27;);
      var sz=8+Math.random()*14;
      b.className=&#x27;bubble&#x27;;
      b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
      b.style.left=(20+Math.random()*60)+&#x27;%&#x27;;
      b.style.top=(30+Math.random()*30)+&#x27;%&#x27;;
      b.style.animationDuration=(0.7+Math.random()*0.5)+&#x27;s&#x27;;
      board.appendChild(b);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1200); })(b);
    }
  }

  function clearHole(h){
    if (h.timeout){ clearTimeout(h.timeout); h.timeout=null; }
    h.occupied=false;
    // remove critter only
    var c = h.el.querySelector(&#x27;.critter&#x27;);
    if (c &amp;&amp; c.parentNode) c.parentNode.removeChild(c);
  }

  function spawn(){
    // find free holes
    var free=[];
    for (var i=0;i&lt;holes.length;i++) if(!holes[i].occupied) free.push(holes[i]);
    if (!free.length) return;
    var h = free[Math.floor(Math.random()*free.length)];
    var creature = pickCreature();
    h.occupied = true;

    var cr = document.createElement(&#x27;div&#x27;);
    cr.className = &#x27;critter&#x27;;
    cr.textContent = creature.emoji;

    var badge = document.createElement(&#x27;div&#x27;);
    badge.className = &#x27;badge &#x27; + creature.cls;
    badge.textContent = (creature.pts&gt;0?&#x27;+&#x27;:&#x27;&#x27;) + creature.pts;

    cr.appendChild(badge);
    h.el.appendChild(cr);
    // rise
    requestAnimationFrame(function(){ cr.classList.add(&#x27;up&#x27;); });

    var hit=false;
    cr.addEventListener(&#x27;click&#x27;, function(ev){
      ev.stopPropagation();
      if (hit || !running) return;
      hit = true;
      cr.classList.remove(&#x27;up&#x27;);
      cr.classList.add(&#x27;splat&#x27;);
      makeBubbles(h.el);

      if (creature.pts &gt; 0){
        bonk();
        var now = Date.now();
        if (now - lastHitTime &lt; 900) comboCount++; else comboCount = 1;
        lastHitTime = now;
        var gain = creature.pts;
        if (comboCount &gt;= 3){
          gain += 2;
          showCombo(comboCount);
          chime();
          comboCount = 0;
        }
        score += gain;
        floatText(h.el, &#x27;+&#x27;+gain, &#x27;#8ff59b&#x27;);
      } else {
        buzz();
        score = Math.max(0, score-1);
        comboCount = 0;
        floatText(h.el, &#x27;-1&#x27;, &#x27;#ff9b9b&#x27;);
      }
      scoreEl.textContent = score;

      if (h.timeout){ clearTimeout(h.timeout); h.timeout=null; }
      setTimeout(function(){
        if (cr.parentNode) cr.parentNode.removeChild(cr);
        h.occupied=false;
      }, 300);
    });

    var life = currentLife();
    h.timeout = setTimeout(function(){
      if (hit) return;
      cr.classList.remove(&#x27;up&#x27;);
      cr.style.transition=&#x27;bottom .18s ease-in&#x27;;
      cr.style.bottom=&#x27;-100%&#x27;;
      setTimeout(function(){ if(cr.parentNode) cr.parentNode.removeChild(cr); h.occupied=false; },200);
      h.timeout=null;
    }, life);
  }

  function spawnInterval(){ return Math.max(420, 1100 - tier*110); }

  function scheduleSpawn(){
    if (!running) return;
    spawn();
    spawnTimer = setTimeout(scheduleSpawn, spawnInterval());
  }

  function tick(){
    if (!running) return;
    var elapsed = (Date.now()-startTime)/1000;
    var newTier = Math.min(6, 1 + Math.floor(elapsed/12));
    if (newTier !== tier){
      tier = newTier;
      tierEl.textContent = &#x27;Tier &#x27;+tier;
      whoosh();
      msgEl.textContent = &#x27;Speed up! Creatures move faster now!&#x27;;
    }
  }

  function startGame(){
    if (running) return;
    running = true;
    score = 0; tier = 1; comboCount = 0; lastHitTime = 0;
    startTime = Date.now();
    scoreEl.textContent = &#x27;0&#x27;;
    tierEl.textContent = &#x27;Tier 1&#x27;;
    msgEl.textContent = &#x27;Bonk the reef critters!&#x27;;
    for (var i=0;i&lt;holes.length;i++) clearHole(holes[i]);
    scheduleSpawn();
    tickTimer = setInterval(tick, 1000);
  }

  function stopGame(){
    if (!running) return;
    running = false;
    if (spawnTimer){ clearTimeout(spawnTimer); spawnTimer=null; }
    if (tickTimer){ clearInterval(tickTimer); tickTimer=null; }
    for (var i=0;i&lt;holes.length;i++) clearHole(holes[i]);
    msgEl.textContent = &#x27;Paused. Press Start to dive again!&#x27;;
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for

  window.addEventListener(&#x27;message&#x27;, function (e) {
