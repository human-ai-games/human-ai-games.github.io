<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060a; color: #dfe8f5; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#0f8,#fd0); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,255,220,0.35); }
  .instructions { font-size: 16px; color: #8fa3c0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 24px; font-size: 18px; font-weight: 600; }
  .hud .best { color: #fd0; }
  .wrap { position: relative; }
  canvas { display: block; background: #070912; border-radius: 10px; box-shadow: 0 0 30px rgba(0,200,255,0.15), inset 0 0 40px rgba(0,80,120,0.15); }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(5,6,12,0.78); border-radius: 10px; text-align: center; gap: 8px; }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 40px; color: #ff3b5c; text-shadow: 0 0 20px rgba(255,60,90,0.6); }
  .overlay .sup { font-size: 20px; color: #fd0; margin: 0; }
  .overlay .fin { font-size: 22px; margin: 0; }
  .overlay .hint { font-size: 15px; color: #8fa3c0; margin-top: 6px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with the arrow keys (or swipe) to eat orbs, stars, and lightning. Chain two quick bites for a x2 combo — but grab the gold bolt fast before it vanishes!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;p class=&quot;sup&quot; id=&quot;sup&quot;&gt;&lt;/p&gt;
      &lt;p class=&quot;fin&quot;&gt;Score: &lt;span id=&quot;finscore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
      &lt;p class=&quot;hint&quot;&gt;Press Start / Restart below to play again.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var CELL = 20, COLS = 30, ROWS = 20, BAR = 12;
var GRID_TOP = BAR + 6;
var GRID_W = COLS * CELL, GRID_H = ROWS * CELL;
cv.width = GRID_W; cv.height = GRID_H + GRID_TOP;

var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;), supEl = document.getElementById(&#x27;sup&#x27;), finEl = document.getElementById(&#x27;finscore&#x27;);

var running = false, animId = null, lastTick = 0, dead = false;
var snake = [], dir, pendingDir, score = 0, best = 0;
var items = [];          // collectibles
var particles = [];      // sparks
var flash = null;        // {color, t}
var comboPops = [];      // floating x2
var lastEatTime = -9999;
var boltTimer = 0;       // ms until bolt respawn
var deathParts = [];     // exploding segments
var now = 0;

var SPEED_TIERS = [170, 140, 115, 95, 78];
function tier() { return Math.min(4, Math.floor(score / 8)); }
function tickMs() { return SPEED_TIERS[tier()]; }

function rndCell() {
  return { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
}
function occupied(x,y) {
  for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  for (var j=0;j&lt;items.length;j++) if (items[j].x===x&amp;&amp;items[j].y===y) return true;
  return false;
}
function freeCell() {
  for (var t=0;t&lt;300;t++){ var c=rndCell(); if(!occupied(c.x,c.y)) return c; }
  return rndCell();
}

function spawnItem(type) {
  var c = freeCell();
  var it = { x:c.x, y:c.y, type:type };
  if (type===&#x27;bolt&#x27;) { it.life = 4000; }
  items.push(it);
}
function ensureItems() {
  var has = { orb:false, star:false, bolt:false };
  for (var i=0;i&lt;items.length;i++) has[items[i].type]=true;
  if(!has.orb) spawnItem(&#x27;orb&#x27;);
  if(!has.star) spawnItem(&#x27;star&#x27;);
  if(!has.bolt) spawnItem(&#x27;bolt&#x27;);
}

function initSnake() {
  snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  dir = {x:1,y:0}; pendingDir = {x:1,y:0};
}

function burst(cx, cy, color, n) {
  for (var i=0;i&lt;n;i++){
    var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3.5;
    particles.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color, r:2+Math.random()*2 });
  }
}

function itemColor(t){ return t===&#x27;orb&#x27;?&#x27;#ffffff&#x27;:t===&#x27;star&#x27;?&#x27;#ff36d0&#x27;:&#x27;#ffd400&#x27;; }
function itemValue(t){ return t===&#x27;orb&#x27;?1:t===&#x27;star&#x27;?3:5; }

function eatItem(idx) {
  var it = items[idx];
  var cx = GRID_W===0?0:(it.x*CELL+CELL/2), cy = GRID_TOP+it.y*CELL+CELL/2;
  var val = itemValue(it.type);
  var combo = (now - lastEatTime) &lt;= 2000;
  if (combo) { val *= 2; comboPops.push({ x:cx, y:cy, t:1 }); }
  lastEatTime = now;
  score += val;
  scoreEl.textContent = score;
  if (score&gt;best){ best=score; bestEl.textContent=best; }
  flash = { color: itemColor(it.type), t: 1 };
  burst(cx, cy, itemColor(it.type), 18);
  items.splice(idx,1);
  ensureItems();
}

function step() {
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head = snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
  var ateIdx=-1;
  for(var k=0;k&lt;items.length;k++) if(items[k].x===nx&amp;&amp;items[k].y===ny) ateIdx=k;
  var willGrow = ateIdx&gt;=0;
  var body = willGrow ? snake : snake.slice(0, snake.length-1);
  for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ die(); return; }
  snake.unshift({x:nx,y:ny});
  if(willGrow) eatItem(ateIdx); else snake.pop();
}

function die() {
  dead = true; running = false;
  flash = { color:&#x27;#ff2030&#x27;, t:1 };
  for(var i=0;i&lt;snake.length;i++){
    var cx=snake[i].x*CELL+CELL/2, cy=GRID_TOP+snake[i].y*CELL+CELL/2;
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    deathParts.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, r:CELL*0.4 });
  }
  var sup;
  if(score&gt;=60) sup=&quot;LEGENDARY SERPENT!&quot;;
  else if(score&gt;=35) sup=&quot;Dazzling run!&quot;;
  else if(score&gt;=18) sup=&quot;Nicely done.&quot;;
  else if(score&gt;=6) sup=&quot;Getting warmed up.&quot;;
  else sup=&quot;Ouch — try again!&quot;;
  supEl.textContent = sup;
  finEl.textContent = score;
  overlay.classList.add(&#x27;show&#x27;);
}

// ---- rendering ----
function lerpColor(c1,c2,t){
  return [Math.round(c1[0]+(c2[0]-c1[0])*t),Math.round(c1[1]+(c2[1]-c1[1])*t),Math.round(c1[2]+(c2[2]-c1[2])*t)];
}
function ribbonColor(f){
  // f: 0 head -&gt; 1 tail. cyan -&gt; green -&gt; gold
  var cyan=[0,255,230], green=[40,230,90], gold=[255,210,0];
  var c = f&lt;0.5 ? lerpColor(cyan,green,f*2) : lerpColor(green,gold,(f-0.5)*2);
  return &#x27;rgb(&#x27;+c[0]+&#x27;,&#x27;+c[1]+&#x27;,&#x27;+c[2]+&#x27;)&#x27;;
}

function drawGrid(){
  ctx.strokeStyle=&#x27;rgba(0,140,180,0.13)&#x27;; ctx.lineWidth=1;
  for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL+.5,GRID_TOP); ctx.lineTo(x*CELL+.5,GRID_TOP+GRID_H); ctx.stroke(); }
  for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,GRID_TOP+y*CELL+.5); ctx.lineTo(GRID_W,GRID_TOP+y*CELL+.5); ctx.stroke(); }
}

function drawSpeedBar(){
  var w=GRID_W, cellW=w/5, cur=tier();
  ctx.fillStyle=&#x27;rgba(255,255,255,0.06)&#x27;;
  ctx.fillRect(0,0,w,BAR);
  for(var i=0;i&lt;5;i++){
    if(i&lt;=cur){
      var g=ctx.createLinearGradient(i*cellW,0,(i+1)*cellW,0);
      g.addColorStop(0,&#x27;rgba(0,255,220,0.85)&#x27;); g.addColorStop(1,&#x27;rgba(255,210,0,0.85)&#x27;);
      ctx.fillStyle=g;
      ctx.fillRect(i*cellW+1,0,cellW-2,BAR);
    }
  }
  ctx.strokeStyle=&#x27;rgba(255,255,255,0.15)&#x27;;
  for(var j=1;j&lt;5;j++){ ctx.beginPath(); ctx.moveTo(j*cellW,0); ctx.lineTo(j*cellW,BAR); ctx.stroke(); }
}

function drawItems(){
  for(var i=0;i&lt;items.length;i++){
    var it=items[i], cx=it.x*CELL+CELL/2, cy=GRID_TOP+it.y*CELL+CELL/2;
    ctx.save();
    if(it.type===&#x27;orb&#x27;){
      var blink=0.55+0.45*Math.sin(now/220);
      ctx.shadowBlur=14; ctx.shadowColor=&#x27;#fff&#x27;;
      ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+blink+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(cx,cy,CELL*0.32,0,Math.PI*2); ctx.fill();
    } else if(it.type===&#x27;star&#x27;){
      var throb=1+0.18*Math.sin(now/160);
      ctx.translate(cx,cy); ctx.rotate(now/500); ctx.scale(throb,throb);
      ctx.shadowBlur=16; ctx.shadowColor=&#x27;#ff36d0&#x27;;
      ctx.fillStyle=&#x27;#ff36d0&#x27;;
      drawStar(0,0,5,CELL*0.42,CELL*0.18);
    } else { // bolt
      var pulse=0.6+0.4*Math.sin(now/120);
      var fade = it.life&lt;1000 ? (it.life/1000) : 1;
      ctx.globalAlpha=fade;
      ctx.translate(cx,cy);
      ctx.shadowBlur=18; ctx.shadowColor=&#x27;#ffd400&#x27;;
      ctx.fillStyle=&#x27;rgba(255,212,0,&#x27;+pulse+&#x27;)&#x27;;
      var s=CELL*0.45;
      ctx.beginPath();
      ctx.moveTo(-s*0.3,-s); ctx.lineTo(s*0.4,-s*0.15); ctx.lineTo(0,-s*0.05);
      ctx.lineTo(s*0.35,s); ctx.lineTo(-s*0.4,s*0.1); ctx.lineTo(s*0.05,0);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}
function drawStar(cx,cy,pts,outer,inner){
  ctx.beginPath();
  for(var i=0;i&lt;pts*2;i++){
    var r=i%2?inner:outer, a=Math.PI*i/pts - Math.PI/2;
    var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill();
}

function drawSnake(){
  for(var i=snake.length-1;i&gt;=0;i--){
    var f = snake.length&gt;1 ? i/(snake.length-1) : 0;
    var col = ribbonColor(f);
    var s=snake[i], cx=s.x*CELL, cy=GRID_TOP+s.y*CELL;
    ctx.save();
    ctx.shadowBlur = i===0?18:10;
    ctx.shadowColor = col;
    ctx.fillStyle = col;
    roundRect(cx+1.5, cy+1.5, CELL-3, CELL-3, 6);
    ctx.fill();
    ctx.restore();
  }
  // eyes on head
  if(snake.length){
    var h=snake[0], hx=h.x*CELL, hy=GRID_TOP+h.y*CELL;
    ctx.fillStyle=&#x27;#04121a&#x27;;
    var ex=hx+CELL/2+dir.x*4, ey=hy+CELL/2+dir.y*4;
    var ox=dir.x!==0?0:4, oy=dir.y!==0?0:4;
    ctx.beginPath(); ctx.arc(ex-ox,ey-oy,2,0,Math.PI*2); ctx.arc(ex+ox,ey+oy,2,0,Math.PI*2); ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawParticles(dt){
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=dt/600;
    if(p.life&lt;=0){ particles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color; ctx.shadowBlur=8; ctx.shadowColor=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawDeathParts(dt){
  for(var i=deathParts.length-1;i&gt;=0;i--){
    var p=deathParts[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life-=dt/900;
    if(p.life&lt;=0){ deathParts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=&#x27;#ff2f4d&#x27;; ctx.shadowBlur=12; ctx.shadowColor=&#x27;#ff2f4d&#x27;;
    roundRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r,3); ctx.fill();
    ctx.restore();
  }
}
function drawCombos(dt){
  for(var i=comboPops.length-1;i&gt;=0;i--){
    var c=comboPops[i]; c.t-=dt/1000; c.y-=0.5;
    if(c.t&lt;=0){ comboPops.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,c.t);
    var sz=28+ (1-c.t)*22;
    ctx.font=&#x27;bold &#x27;+sz+&#x27;px system-ui, sans-serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.fillStyle=&#x27;#fd0&#x27;;
    ctx.shadowBlur=16; ctx.shadowColor=&#x27;#fd0&#x27;;
    ctx.fillText(&#x27;x2&#x27;, c.x, c.y);
    ctx.restore();
  }
}
function drawFlash(dt){
  if(!flash) return;
  flash.t-=dt/450;
  if(flash.t&lt;=0){ flash=null; return; }
  ctx.save(); ctx.globalAlpha=flash.t*0.35;
  ctx.fillStyle=flash.color; ctx.fillRect(0,GRID_TOP,GRID_W,GRID_H);
  ctx.restore();
}

function render(dt){
  ctx.clearRect(0,0,cv.width,cv.height);
  drawSpeedBar();
  drawGrid();
  drawItems();
  if(!dead) drawSnake();
  drawParticles(dt);
  drawDeathParts(dt);
  drawFlash(dt);
  drawCombos(dt);
}

function loop(ts){
  if(!animId &amp;&amp; !dead) return;
  var dt = now? ts-now : 16; now=ts;
  if(running){
    if(ts-lastTick &gt;= tickMs()){ lastTick=ts; step(); }
    // bolt lifetime
    for(var i=items.length-1;i&gt;=0;i--){
      if(items[i].type===&#x27;bolt&#x27;){
        items[i].life -= dt;
        if(items[i].life&lt;=0){ items.splice(i,1); }
      }
    }
    ensureItems();
  }
  render(dt);
  if(running || particles.length || deathParts.length || comboPops.length || flash){
    animId = requestAnimationFrame(loop);
  } else { animId=null; }
}

function startGame(){
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  dead=false; overlay.classList.remove(&#x27;show&#x27;);
  items=[]; particles=[]; deathParts=[]; comboPops=[]; flash=null;
  lastEatTime=-9999;
  initSnake();
  ensureItems();
  running=true; lastTick=0; now=0;
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

function setDir(x,y){ pendingDir={x:x,y:y}; }
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
});
// swipe
var tsx=0, tsy=0;
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
cv.addEventListener(&#x27;touchend&#x27;, function(e){
  var t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
  if(Math.abs(dx)&gt;Math.abs(dy)) setDir(dx&gt;0?1:-1,0); else setDir(0,dy&gt;0?1:-1);
}, {passive:true});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
initSnake(); ensureItems(); render(16);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
