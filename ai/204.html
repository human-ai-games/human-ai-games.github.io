<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Superstar</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0a14; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; background: linear-gradient(90deg,#0ff,#f0f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 12px rgba(255,0,255,.3); }
  .instructions { font-size: 16px; color: #aab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 22px; color: #0ff; margin: 0; font-weight: 700; transition: transform .12s; }
  .score.pop { transform: scale(1.5); }
  .field { position: relative; width: 620px; height: 456px; flex-shrink: 0; background: #050510; border-radius: 10px; overflow: hidden; box-shadow: 0 0 24px rgba(0,255,255,.15) inset; }
  .safe { position: absolute; left: 0; right: 0; background: #0d3320; overflow: hidden; white-space: nowrap; font-size: 30px; line-height: 48px; letter-spacing: 2px; color: rgba(120,255,160,.35); }
  .hero { position: absolute; font-size: 34px; line-height: 44px; text-align: center; z-index: 5; transition: left .08s, top .08s; }
  .hero.hop { animation: hop .18s; }
  @keyframes hop { 0%{transform:scale(1)} 50%{transform:scale(1.35)} 100%{transform:scale(1)} }
  .vehicle { position: absolute; font-size: 34px; line-height: 48px; text-align: center; z-index: 3; }
  .lane-glow { position: absolute; left: 0; right: 0; height: 2px; z-index: 1; }
  .flash-red { position: absolute; inset: 0; background: rgba(255,0,0,.5); z-index: 8; opacity: 0; pointer-events: none; }
  .flash-red.on { animation: rf .4s; }
  @keyframes rf { 0%{opacity:.6} 100%{opacity:0} }
  .center-msg { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 800; color: #ff0; text-shadow: 0 0 14px #f80; z-index: 9; pointer-events: none; opacity: 0; }
  .center-msg.show { animation: cm 1s; }
  @keyframes cm { 0%{opacity:0;transform:scale(.5)} 30%{opacity:1;transform:scale(1.1)} 100%{opacity:0;transform:scale(1.3)} }
  .plus1 { position: absolute; font-size: 32px; font-weight: 800; color: #0f8; text-shadow: 0 0 10px #0f8; z-index: 9; pointer-events: none; }
  .plus1.go { animation: p1 1s forwards; }
  @keyframes p1 { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-70px)} }
  .confetti { position: absolute; z-index: 7; pointer-events: none; font-size: 20px; }
  .ripple { position: absolute; z-index: 4; border: 3px solid rgba(120,200,255,.8); border-radius: 50%; pointer-events: none; }
  .ripple.go { animation: rip .6s forwards; }
  @keyframes rip { 0%{width:10px;height:10px;opacity:.9} 100%{width:70px;height:70px;opacity:0} }
  .splat { position: absolute; inset: 0; background: rgba(10,0,0,.85); z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; }
  .splat.show { display: flex; }
  .splat h2 { font-size: 58px; margin: 0; color: #f33; text-shadow: 0 0 18px #f00; }
  .splat p { font-size: 24px; color: #eee; margin: 8px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Superstar&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with arrow keys or WASD across the neon highway, dodging every car, and reach the glowing lily pad at the top to score. Every three crossings the traffic speeds up — get hit and it&#x27;s SPLAT!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48;
  var COLS = 12;         // 12*48 = 576, plus margin
  var LANES = 7;
  var ROWS = LANES + 2;  // top safe + 7 lanes + bottom safe
  var FIELD_W = 620, FIELD_H = ROWS * CELL;  // 456
  var GRID_W = COLS * CELL;
  var XOFF = (FIELD_W - GRID_W) / 2;

  var VEHICLES = [&#x27;🚕&#x27;,&#x27;🏎️&#x27;,&#x27;🚚&#x27;,&#x27;🏍️&#x27;,&#x27;🚗&#x27;,&#x27;🚛&#x27;,&#x27;🛵&#x27;];
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [];
  var score = 0, speedTier = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var heroEl = null, redFlash = null, splatEl = null;

  function buildStatic() {
    field.innerHTML = &#x27;&#x27;;
    // safe rows
    var grass = &#x27; 🌿&#x27;.repeat(30);
    var top = document.createElement(&#x27;div&#x27;);
    top.className = &#x27;safe&#x27;;
    top.style.top = &#x27;0px&#x27;; top.style.height = CELL + &#x27;px&#x27;;
    top.textContent = &#x27;🌟 LILY PAD 🌟&#x27; + grass;
    field.appendChild(top);
    var bot = document.createElement(&#x27;div&#x27;);
    bot.className = &#x27;safe&#x27;;
    bot.style.top = ((ROWS-1)*CELL) + &#x27;px&#x27;; bot.style.height = CELL + &#x27;px&#x27;;
    bot.textContent = grass;
    field.appendChild(bot);
    // lane glows
    for (var i = 0; i &lt; LANES; i++) {
      var g = document.createElement(&#x27;div&#x27;);
      g.className = &#x27;lane-glow&#x27;;
      g.style.top = ((i+1)*CELL - 1) + &#x27;px&#x27;;
      g.style.background = (i % 2 === 0)
        ? &#x27;linear-gradient(90deg,transparent,#0ff,transparent)&#x27;
        : &#x27;linear-gradient(90deg,transparent,#f0f,transparent)&#x27;;
      g.style.boxShadow = (i % 2 === 0) ? &#x27;0 0 8px #0ff&#x27; : &#x27;0 0 8px #f0f&#x27;;
      field.appendChild(g);
    }
    redFlash = document.createElement(&#x27;div&#x27;);
    redFlash.className = &#x27;flash-red&#x27;;
    field.appendChild(redFlash);

    splatEl = document.createElement(&#x27;div&#x27;);
    splatEl.className = &#x27;splat&#x27;;
    splatEl.innerHTML = &#x27;&lt;h2&gt;💀 SPLAT!&lt;/h2&gt;&lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;&#x27;;
    field.appendChild(splatEl);

    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    field.appendChild(heroEl);
  }

  function buildLanes() {
    // remove any old vehicle elements
    lanes.forEach(function(l){ l.vehicles.forEach(function(v){ if(v.el.parentNode) v.el.parentNode.removeChild(v.el); }); });
    lanes = [];
    var speedMul = 1 + speedTier * 0.35;
    var extra = Math.min(speedTier, 3);
    for (var i = 0; i &lt; LANES; i++) {
      var y = (i+1)*CELL;
      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = (0.6 + (i % 3) * 0.25) * speedMul;
      var emoji = VEHICLES[i % VEHICLES.length];
      var count = 2 + (i % 2) + extra;   // density grows
      var gap = GRID_W / count;
      var vehicles = [];
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + XOFF;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;vehicle&#x27;;
        el.textContent = emoji;
        el.style.width = CELL + &#x27;px&#x27;;
        el.style.top = y + &#x27;px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        if (dir &lt; 0) el.style.transform = &#x27;scaleX(-1)&#x27;;
        field.appendChild(el);
        vehicles.push({ x: x, el: el });
      }
      lanes.push({ y: y, dir: dir, speed: speed, vehicles: vehicles });
    }
  }

  function paintHero() {
    heroEl.style.left = (hero.col*CELL + XOFF) + &#x27;px&#x27;;
    heroEl.style.top = (hero.row*CELL + 2) + &#x27;px&#x27;;
  }
  function resetHero() { hero.col = Math.floor(COLS/2); hero.row = ROWS-1; paintHero(); }

  function tick() {
    if (!running) return;
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.vehicles.length; j++) {
        var v = lane.vehicles[j];
        v.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; v.x &gt; FIELD_W) v.x = -CELL;
        else if (lane.dir &lt; 0 &amp;&amp; v.x + CELL &lt; 0) v.x = FIELD_W;
        v.el.style.left = v.x + &#x27;px&#x27;;
      }
    }
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col*CELL + XOFF;
      var lane = lanes[laneIdx];
      for (var k = 0; k &lt; lane.vehicles.length; k++) {
        var v2 = lane.vehicles[k];
        if (hx &lt; v2.x + CELL - 10 &amp;&amp; hx + CELL - 10 &gt; v2.x) { endGame(); return; }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS-1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS-1, hero.row + dr));
    paintHero();
    heroEl.classList.remove(&#x27;hop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hop&#x27;);
    if (hero.row === 0) crossing();
  }

  function crossing() {
    score += 1;
    scoreEl.textContent = score;
    scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
    plus1(); confetti();
    ripple(Math.floor(COLS/2)*CELL + XOFF + CELL/2, (ROWS-1)*CELL + CELL/2);
    if (score % 3 === 0) { speedTier++; buildLanes(); centerMsg(&#x27;⚡ Speed Up!&#x27;, &#x27;#0ff&#x27;); }
    resetHero();
  }

  function plus1() {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;plus1&#x27;;
    p.textContent = &#x27;🎉 +1&#x27;;
    p.style.left = &#x27;46%&#x27;; p.style.top = &#x27;10px&#x27;;
    field.appendChild(p);
    void p.offsetWidth; p.classList.add(&#x27;go&#x27;);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 1000);
  }

  function confetti() {
    var chars = [&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;🌟&#x27;,&#x27;💫&#x27;];
    for (var i = 0; i &lt; 24; i++) {
      (function(){
        var c = document.createElement(&#x27;div&#x27;);
        c.className = &#x27;confetti&#x27;;
        c.textContent = chars[i % chars.length];
        var startX = Math.random()*FIELD_W;
        c.style.left = startX + &#x27;px&#x27;;
        c.style.top = &#x27;-20px&#x27;;
        field.appendChild(c);
        var dur = 900 + Math.random()*700;
        var end = FIELD_H + 20;
        var drift = (Math.random()-0.5)*60;
        c.animate([
          { transform: &#x27;translate(0,0) rotate(0deg)&#x27;, opacity: 1 },
          { transform: &#x27;translate(&#x27;+drift+&#x27;px,&#x27;+end+&#x27;px) rotate(360deg)&#x27;, opacity: 0.2 }
        ], { duration: dur, easing: &#x27;linear&#x27; });
        setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, dur);
      })();
    }
  }

  function ripple(x, y) {
    var r = document.createElement(&#x27;div&#x27;);
    r.className = &#x27;ripple&#x27;;
    r.style.left = (x-5) + &#x27;px&#x27;; r.style.top = (y-5) + &#x27;px&#x27;;
    field.appendChild(r);
    void r.offsetWidth; r.classList.add(&#x27;go&#x27;);
    setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 600);
  }

  function centerMsg(txt, color) {
    var m = document.createElement(&#x27;div&#x27;);
    m.className = &#x27;center-msg&#x27;;
    m.textContent = txt;
    if (color) m.style.color = color;
    field.appendChild(m);
    void m.offsetWidth; m.classList.add(&#x27;show&#x27;);
    setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); }, 1000);
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    heroEl.textContent = &#x27;💀&#x27;;
    redFlash.classList.remove(&#x27;on&#x27;); void redFlash.offsetWidth; redFlash.classList.add(&#x27;on&#x27;);
    document.getElementById(&#x27;finalScore&#x27;).textContent = &#x27;Score: &#x27; + score;
    splatEl.classList.add(&#x27;show&#x27;);
  }

  function startGame() {
    score = 0; speedTier = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    buildStatic();
    buildLanes();
    heroEl.textContent = &#x27;🐸&#x27;;
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e) {
    var k = e.key.toLowerCase();
    if (k === &#x27;arrowleft&#x27; || k === &#x27;a&#x27;) { move(-1,0); e.preventDefault(); }
    else if (k === &#x27;arrowright&#x27; || k === &#x27;d&#x27;) { move(1,0); e.preventDefault(); }
    else if (k === &#x27;arrowup&#x27; || k === &#x27;w&#x27;) { move(0,-1); e.preventDefault(); }
    else if (k === &#x27;arrowdown&#x27; || k === &#x27;s&#x27;) { move(0,1); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // Initial static paint (stopped state)
  buildStatic();
  buildLanes();
  paintHero();
&lt;/script&gt;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });

    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
