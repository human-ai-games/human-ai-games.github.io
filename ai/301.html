<title>✦ COSMIC BREAKOUT ✦</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC BREAKOUT ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#00e5ff,#ff00d4,#ffe600); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(120,80,255,.4); }
  .instructions { font-size: 16px; color: #9ea0d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 26px; font-size: 20px; font-weight: 600; }
  .hud .combo { color: #ffe600; text-shadow: 0 0 12px rgba(255,230,0,.6); }
  .hud .score { color: #00e5ff; text-shadow: 0 0 12px rgba(0,229,255,.5); }
  canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(80,40,180,.5); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with your mouse or the ← → arrow keys to bounce the energy ball and smash the alien bricks. Keep the ball alive to build your ×combo multiplier — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;Combo: ×&lt;span id=&quot;combo&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Wave: &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 470;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), waveEl = document.getElementById(&#x27;wave&#x27;);

  var running = false, animId = null;
  var keysDown = {};
  var score = 0, combo = 1, wave = 1;

  // paddle
  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_SPEED = 8;
  var paddleX = (W - PADDLE_W) / 2, prevPaddleX = paddleX, paddleStretch = 0;

  // ball
  var BALL_R = 8;
  var ballX, ballY, ballVX, ballVY, baseSpeed;

  var bricks = [], stars = [], particles = [];
  var missFlash = 0, waveFlash = 0;

  var COLORS = [
    { c: &#x27;#ff2e63&#x27;, pts: 3, hits: 2 },  // tough pink
    { c: &#x27;#ffe600&#x27;, pts: 2, hits: 1 },  // yellow
    { c: &#x27;#00e5ff&#x27;, pts: 1, hits: 1 },  // cyan
    { c: &#x27;#7cff00&#x27;, pts: 1, hits: 1 },  // green
    { c: &#x27;#c77dff&#x27;, pts: 2, hits: 1 }   // purple
  ];

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 70; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.8+0.3, v: Math.random()*0.4+0.1 });
    }
  }

  function buildWave() {
    bricks = [];
    var rows = Math.min(3 + wave, 7);
    var cols = 10;
    var bw = 54, bh = 20, gap = 4;
    var startX = (W - (cols*(bw+gap) - gap)) / 2;
    var startY = 40;
    for (var r = 0; r &lt; rows; r++) {
      for (var col = 0; col &lt; cols; col++) {
        // fun pattern: skip some to make shapes, denser on higher waves
        var skip = false;
        if (wave === 1 &amp;&amp; (r+col) % 5 === 0) skip = false;
        if (Math.random() &lt; Math.max(0.05, 0.18 - wave*0.03)) skip = true;
        if (skip) continue;
        var def = COLORS[(r + col) % COLORS.length];
        // higher waves: more tough bricks
        if (r === 0 &amp;&amp; wave &gt; 1) def = COLORS[0];
        bricks.push({
          x: startX + col*(bw+gap), y: startY + r*(bh+gap),
          w: bw, h: bh, c: def.c, pts: def.pts, hp: def.hits, maxhp: def.hits
        });
      }
    }
  }

  function resetBall() {
    ballX = W/2; ballY = H - 60;
    baseSpeed = 4.2 + wave*0.4;
    var ang = (-Math.PI/2) + (Math.random()*0.8 - 0.4);
    ballVX = Math.cos(ang) * baseSpeed;
    ballVY = Math.sin(ang) * baseSpeed;
  }

  function spawnParticles(x, y, color) {
    for (var i = 0; i &lt; 12; i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*3+1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, c:color, sz:Math.random()*3+1.5 });
    }
  }

  function startGame() {
    if (running) return;
    score = 0; combo = 1; wave = 1;
    scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;1&#x27;; waveEl.textContent = &#x27;1&#x27;;
    paddleX = (W - PADDLE_W)/2; prevPaddleX = paddleX; paddleStretch = 0;
    for (var k in keysDown) keysDown[k] = false;
    initStars(); buildWave(); resetBall();
    particles = []; missFlash = 0; waveFlash = 8;
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function tick() {
    if (!running) return;
    update();
    draw();
    animId = requestAnimationFrame(tick);
  }

  function update() {
    // paddle keyboard
    prevPaddleX = paddleX;
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));
    var dx = paddleX - prevPaddleX;
    paddleStretch += (dx - paddleStretch) * 0.3;

    // stars drift
    for (var i = 0; i &lt; stars.length; i++) {
      stars[i].y += stars[i].v;
      if (stars[i].y &gt; H) { stars[i].y = 0; stars[i].x = Math.random()*W; }
    }

    // ball movement
    ballX += ballVX; ballY += ballVY;
    // gradual speed up
    var sp = Math.hypot(ballVX, ballVY);
    var target = baseSpeed + 0.0009 * (score);
    if (sp &gt; 0) { var f = target / sp; if (f &gt; 1) { ballVX *= 1 + (f-1)*0.5; ballVY *= 1 + (f-1)*0.5; } }

    if (ballX - BALL_R &lt;= 0) { ballX = BALL_R; ballVX = Math.abs(ballVX); }
    if (ballX + BALL_R &gt;= W) { ballX = W - BALL_R; ballVX = -Math.abs(ballVX); }
    if (ballY - BALL_R &lt;= 0) { ballY = BALL_R; ballVY = Math.abs(ballVY); }

    // paddle collision
    var pTop = H - 24 - PADDLE_H;
    if (ballVY &gt; 0 &amp;&amp; ballY + BALL_R &gt;= pTop &amp;&amp; ballY + BALL_R &lt;= pTop + PADDLE_H + 8 &amp;&amp;
        ballX &gt;= paddleX &amp;&amp; ballX &lt;= paddleX + PADDLE_W) {
      ballY = pTop - BALL_R;
      var hitPos = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2); // -1..1
      var speed = Math.hypot(ballVX, ballVY);
      var ang = -Math.PI/2 + hitPos * (Math.PI/3);
      ballVX = Math.cos(ang) * speed;
      ballVY = Math.sin(ang) * speed;
    }

    // brick collision
    for (var b = bricks.length - 1; b &gt;= 0; b--) {
      var bk = bricks[b];
      if (ballX + BALL_R &gt; bk.x &amp;&amp; ballX - BALL_R &lt; bk.x + bk.w &amp;&amp;
          ballY + BALL_R &gt; bk.y &amp;&amp; ballY - BALL_R &lt; bk.y + bk.h) {
        // determine bounce side
        var overlapL = (ballX + BALL_R) - bk.x;
        var overlapR = (bk.x + bk.w) - (ballX - BALL_R);
        var overlapT = (ballY + BALL_R) - bk.y;
        var overlapB = (bk.y + bk.h) - (ballY - BALL_R);
        var minO = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (minO === overlapT || minO === overlapB) ballVY = -ballVY;
        else ballVX = -ballVX;

        bk.hp--;
        if (bk.hp &lt;= 0) {
          score += bk.pts * combo;
          combo++;
          spawnParticles(bk.x + bk.w/2, bk.y + bk.h/2, bk.c);
          bricks.splice(b, 1);
          scoreEl.textContent = score;
          comboEl.textContent = combo;
        } else {
          spawnParticles(ballX, ballY, bk.c);
        }
        break;
      }
    }

    // miss
    if (ballY - BALL_R &gt; H) {
      combo = 1; comboEl.textContent = &#x27;1&#x27;;
      missFlash = 30;
      resetBall();
    }

    // wave clear
    if (bricks.length === 0) {
      wave++;
      waveEl.textContent = wave;
      waveFlash = 8;
      buildWave();
      resetBall();
    }

    // particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= 0.03;
      if (pt.life &lt;= 0) particles.splice(p, 1);
    }

    if (missFlash &gt; 0) missFlash--;
    if (waveFlash &gt; 0) waveFlash--;
  }

  function draw() {
    // space gradient bg
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, &#x27;#0a0326&#x27;); g.addColorStop(0.5, &#x27;#0d0530&#x27;); g.addColorStop(1, &#x27;#05010f&#x27;);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.5 + s.s/2.5;
      ctx.fillStyle = &#x27;#cfe0ff&#x27;;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // bricks
    for (var b = 0; b &lt; bricks.length; b++) {
      var bk = bricks[b];
      var cracked = bk.hp &lt; bk.maxhp;
      ctx.shadowBlur = 12; ctx.shadowColor = bk.c;
      ctx.fillStyle = bk.c;
      ctx.globalAlpha = cracked ? (0.55 + 0.45*Math.abs(Math.sin(Date.now()/120))) : 1;
      roundRect(bk.x, bk.y, bk.w, bk.h, 4); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      if (cracked) {
        ctx.strokeStyle = &#x27;rgba(255,255,255,.7)&#x27;; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bk.x + bk.w*0.3, bk.y); ctx.lineTo(bk.x + bk.w*0.5, bk.y + bk.h);
        ctx.moveTo(bk.x + bk.w*0.7, bk.y); ctx.lineTo(bk.x + bk.w*0.55, bk.y + bk.h*0.6);
        ctx.stroke();
      }
    }

    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.c;
      ctx.shadowBlur = 8; ctx.shadowColor = pt.c;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.sz, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    // paddle (glow + stretch)
    var stretch = Math.min(24, Math.abs(paddleStretch)*4);
    var pw = PADDLE_W + stretch, ph = PADDLE_H - stretch*0.12;
    var px = paddleX - stretch/2 + (paddleStretch &gt; 0 ? stretch/4 : -stretch/4);
    var pTop = H - 24 - PADDLE_H;
    ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#00e5ff&#x27;;
    var pg = ctx.createLinearGradient(px, 0, px+pw, 0);
    pg.addColorStop(0, &#x27;#00e5ff&#x27;); pg.addColorStop(0.5, &#x27;#a0f8ff&#x27;); pg.addColorStop(1, &#x27;#00e5ff&#x27;);
    ctx.fillStyle = pg;
    roundRect(px, pTop, pw, ph, 6); ctx.fill();
    ctx.shadowBlur = 0;

    // ball (glowing)
    ctx.shadowBlur = 18; ctx.shadowColor = &#x27;#ffe600&#x27;;
    var bg = ctx.createRadialGradient(ballX, ballY, 1, ballX, ballY, BALL_R);
    bg.addColorStop(0, &#x27;#ffffff&#x27;); bg.addColorStop(0.5, &#x27;#ffe600&#x27;); bg.addColorStop(1, &#x27;#ff8a00&#x27;);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(ballX, ballY, BALL_R, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // wave flash
    if (waveFlash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(120,80,255,&#x27; + (waveFlash/8*0.4) + &#x27;)&#x27;;
      ctx.fillRect(0, 0, W, H);
    }

    // miss flash
    if (missFlash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(255,40,80,&#x27; + (missFlash/30*0.35) + &#x27;)&#x27;;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = missFlash/30;
      ctx.fillStyle = &#x27;#ff2e63&#x27;;
      ctx.font = &#x27;bold 48px system-ui, sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#ff2e63&#x27;;
      ctx.fillText(&#x27;MISS!&#x27;, W/2, H/2);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // draw a static idle frame so page is visible while stopped
  function idleFrame() {
    initStars(); buildWave();
    ballX = W/2; ballY = H - 60; ballVX = 0; ballVY = 0; baseSpeed = 4;
    draw();
  }

  // input
  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W / rect.width);
    prevPaddleX = paddleX;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, mx - PADDLE_W/2));
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  idleFrame();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
