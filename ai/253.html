<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON REEF</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #030818; color: #cfe9ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 6px 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #6ff2ff; text-shadow: 0 0 10px #17c8ff, 0 0 22px #0b7fff; }
  .instructions { font-size: 16px; color: #9fd0ff; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 660px; max-width: 100%; gap: 10px; }
  .score { font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 0 12px #00e5ff, 0 0 24px #0088ff; }
  .combo { font-size: 16px; font-weight: 800; padding: 2px 8px; border-radius: 10px; opacity: 0; transition: opacity .15s; }
  .combo.on { opacity: 1; }
  .cx2 { color: #ffe14d; text-shadow: 0 0 10px #ff9d00; }
  .cx3 { color: #ff6bd6; text-shadow: 0 0 10px #ff00a6; }
  .timer { font-size: 20px; font-weight: 700; color: #a6ffea; text-shadow: 0 0 8px #00ffc3; }
  .meterwrap { flex: 1; max-width: 180px; }
  .meterlabel { font-size: 11px; color: #7fd0ff; margin-bottom: 2px; letter-spacing: 1px; }
  .meter { height: 10px; border-radius: 6px; background: #0a1830; overflow: hidden; box-shadow: inset 0 0 4px #000; }
  .meterfill { height: 100%; width: 0%; background: linear-gradient(90deg,#00ffc3,#00e5ff); box-shadow: 0 0 8px #00e5ff; transition: width .1s; }
  .field { position: relative; width: 660px; max-width: 100%; height: 400px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(0,120,255,.35), inset 0 0 40px rgba(0,0,0,.6); }
  canvas { display: block; width: 100%; height: 100%; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 14px #00e5ff; text-align: center; pointer-events: none; padding: 20px; box-sizing: border-box; }
  .controls { display: flex; gap: 10px; align-items: center; margin-top: 2px; }
  .btn { user-select: none; width: 66px; height: 44px; border-radius: 12px; background: linear-gradient(#123a5e,#0a2038); color: #7ff0ff; border: 1px solid #1e6aa8; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 10px rgba(0,180,255,.3); }
  .btn:active { background: #1c5c8c; }
  .fire { width: 110px; color: #ffd24d; border-color: #b06a00; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON REEF&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &amp;larr; &amp;rarr; and press Space (or the buttons) to fire plasma bubbles up at the drifting creatures. Every 5th shot is a screen-clearing sonar blast — score fast for combo multipliers before time runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;COMBO x2&lt;/div&gt;
    &lt;div class=&quot;meterwrap&quot;&gt;
      &lt;div class=&quot;meterlabel&quot;&gt;SONAR CHARGE&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;div class=&quot;meterfill&quot; id=&quot;meter&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;timer&quot;&gt;⏱ &lt;span id=&quot;timer&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;660&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press Start below to dive in!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;div class=&quot;btn&quot; id=&quot;left&quot;&gt;◀&lt;/div&gt;
    &lt;div class=&quot;btn fire&quot; id=&quot;fireBtn&quot;&gt;FIRE&lt;/div&gt;
    &lt;div class=&quot;btn&quot; id=&quot;right&quot;&gt;▶&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 660, H = 400;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), timerEl = document.getElementById(&#x27;timer&#x27;);
  var meterEl = document.getElementById(&#x27;meter&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var running = false, animId = null, spawnId = null, secId = null;
  var keys = {};
  var subX, bullets, enemies, particles, bubbles, score, shotCount, timeLeft;
  var comboHits, comboTime, ripple;
  var lastShot = 0;
  var bgT = 0;

  // audio
  var AC = null;
  function beep(freq, dur, type, vol){
    try{
      if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
      g.gain.value=vol||0.08; o.connect(g); g.connect(AC.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
      o.stop(AC.currentTime+dur);
    }catch(e){}
  }

  var TYPES = [
    { name:&#x27;jelly&#x27;, pts:1, r:16, color:&#x27;#ff6bd6&#x27;, glow:&#x27;#ff00a6&#x27;, speed:1.2 },
    { name:&#x27;urchin&#x27;, pts:2, r:15, color:&#x27;#8bff5a&#x27;, glow:&#x27;#3cff00&#x27;, speed:1.6 },
    { name:&#x27;angler&#x27;, pts:3, r:18, color:&#x27;#ffd24d&#x27;, glow:&#x27;#ff9d00&#x27;, speed:2.1 }
  ];

  function reset(){
    subX = W/2; bullets=[]; enemies=[]; particles=[]; bubbles=[];
    score=0; shotCount=0; timeLeft=60; comboHits=0; comboTime=0; ripple=0;
    scoreEl.textContent=&#x27;0&#x27;; timerEl.textContent=&#x27;60&#x27;; meterEl.style.width=&#x27;0%&#x27;;
    comboEl.className=&#x27;combo&#x27;;
    for(var i=0;i&lt;24;i++) bubbles.push(newBubble(Math.random()*H));
  }
  function newBubble(y){ return {x:Math.random()*W, y:y, r:1+Math.random()*3, s:0.4+Math.random()*1.1}; }

  function spawn(){
    var maxT = score&gt;=30?3 : score&gt;=12?2 : 1;
    var t = TYPES[Math.floor(Math.random()*maxT)];
    var boost = 1 + Math.min(score/60, 1.2);
    enemies.push({ x:t.r+Math.random()*(W-2*t.r), y:-t.r, t:t, speed:t.speed*boost, ph:Math.random()*6.28 });
  }

  function fire(){
    if(!running) return;
    var now=Date.now(); if(now-lastShot&lt;160) return; lastShot=now;
    shotCount++;
    var charge = (shotCount%5)/5;
    meterEl.style.width = (charge*100)+&#x27;%&#x27;;
    if(shotCount%5===0){
      // sonar blast
      ripple = 1;
      beep(120,0.5,&#x27;sawtooth&#x27;,0.12);
      for(var i=enemies.length-1;i&gt;=0;i--){ killEnemy(enemies[i], true); }
      enemies=[];
      meterEl.style.width=&#x27;0%&#x27;;
    } else {
      bullets.push({x:subX, y:H-40});
      beep(700,0.08,&#x27;square&#x27;,0.05);
    }
  }

  function killEnemy(e, sonar){
    var mult = comboMult();
    score += e.t.pts*mult;
    scoreEl.textContent=score;
    // burst
    for(var i=0;i&lt;14;i++){
      var a=Math.PI*2*i/14;
      particles.push({x:e.x,y:e.y,vx:Math.cos(a)*(2+Math.random()*2),vy:Math.sin(a)*(2+Math.random()*2),life:1,color:e.t.color});
    }
    if(!sonar){
      comboHits++; comboTime=2;
      beep(400+e.t.pts*120,0.12,&#x27;triangle&#x27;,0.07);
      updateCombo();
    }
  }

  function comboMult(){ return comboHits&gt;=5?3 : comboHits&gt;=3?2 : 1; }
  function updateCombo(){
    var m=comboMult();
    if(m===3){ comboEl.textContent=&#x27;COMBO x3&#x27;; comboEl.className=&#x27;combo cx3 on&#x27;; }
    else if(m===2){ comboEl.textContent=&#x27;COMBO x2&#x27;; comboEl.className=&#x27;combo cx2 on&#x27;; }
    else { comboEl.className=&#x27;combo&#x27;; }
  }

  function tick(){
    if(!running) return;
    if(keys.left) subX-=5.5;
    if(keys.right) subX+=5.5;
    subX=Math.max(24,Math.min(W-24,subX));

    // background shift
    bgT += 0.003;
    var c1 = hsl(210+30*Math.sin(bgT), 70, 12);
    var c2 = hsl(270+40*Math.sin(bgT*0.7+1), 65, 16);
    var c3 = hsl(180+30*Math.sin(bgT*1.3+2), 70, 14);
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,c1); g.addColorStop(0.5,c2); g.addColorStop(1,c3);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // bubbles
    for(var i=0;i&lt;bubbles.length;i++){
      var b=bubbles[i]; b.y-=b.s; b.x+=Math.sin(b.y*0.05)*0.3;
      if(b.y&lt;-5){ bubbles[i]=newBubble(H+5); }
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28);
      ctx.fillStyle=&#x27;rgba(150,220,255,0.18)&#x27;; ctx.fill();
    }

    // enemies
    for(var i=enemies.length-1;i&gt;=0;i--){
      var e=enemies[i]; e.y+=e.speed; e.ph+=0.08;
      if(e.y&gt;H+e.t.r){ enemies.splice(i,1); comboHits=0; comboTime=0; updateCombo(); continue; }
      drawEnemy(e);
    }

    // bullets
    for(var i=bullets.length-1;i&gt;=0;i--){
      var bl=bullets[i]; bl.y-=8;
      if(bl.y&lt;-10){ bullets.splice(i,1); continue; }
      ctx.beginPath(); ctx.arc(bl.x,bl.y,4,0,6.28);
      ctx.fillStyle=&#x27;#aef6ff&#x27;; ctx.shadowColor=&#x27;#00e5ff&#x27;; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
      // collide
      for(var j=enemies.length-1;j&gt;=0;j--){
        var e=enemies[j], dx=bl.x-e.x, dy=bl.y-e.y;
        if(dx*dx+dy*dy &lt; (e.t.r+4)*(e.t.r+4)){
          killEnemy(e,false); enemies.splice(j,1); bullets.splice(i,1); break;
        }
      }
    }

    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=0.03;
      if(p.life&lt;=0){ particles.splice(i,1); continue; }
      ctx.globalAlpha=p.life; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,6.28);
      ctx.fillStyle=p.color; ctx.fill(); ctx.globalAlpha=1;
    }

    // combo timer
    if(comboTime&gt;0){ comboTime-=1/60; if(comboTime&lt;=0){ comboHits=0; updateCombo(); } }

    drawCoral();
    drawSub();

    // ripple
    if(ripple&gt;0){
      ctx.strokeStyle=&#x27;rgba(0,229,255,&#x27;+ripple+&#x27;)&#x27;; ctx.lineWidth=6;
      var rad=(1-ripple)*W;
      ctx.beginPath(); ctx.arc(subX,H-40,rad,0,6.28); ctx.stroke();
      ctx.strokeStyle=&#x27;rgba(180,80,255,&#x27;+ripple*0.7+&#x27;)&#x27;; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(subX,H-40,rad*0.6,0,6.28); ctx.stroke();
      ripple-=0.03; if(ripple&lt;0) ripple=0;
    }

    animId=requestAnimationFrame(tick);
  }

  function hsl(h,s,l){ return &#x27;hsl(&#x27;+h+&#x27;,&#x27;+s+&#x27;%,&#x27;+l+&#x27;%)&#x27;; }

  function drawEnemy(e){
    var t=e.t;
    ctx.shadowColor=t.glow; ctx.shadowBlur=16;
    ctx.fillStyle=t.color;
    if(t.name===&#x27;jelly&#x27;){
      ctx.beginPath(); ctx.arc(e.x,e.y,t.r,Math.PI,0); ctx.fill();
      ctx.beginPath();
      for(var k=0;k&lt;4;k++){ var tx=e.x-t.r+ (k+0.5)*t.r/2*(k?1:1); }
      ctx.strokeStyle=t.color; ctx.lineWidth=2;
      for(var k=-3;k&lt;=3;k+=2){
        ctx.beginPath(); ctx.moveTo(e.x+k*4,e.y);
        ctx.quadraticCurveTo(e.x+k*4+Math.sin(e.ph+k)*4,e.y+t.r*0.9,e.x+k*4,e.y+t.r*1.3);
        ctx.stroke();
      }
    } else if(t.name===&#x27;urchin&#x27;){
      ctx.beginPath();
      for(var a=0;a&lt;12;a++){
        var ang=a/12*6.28, rr=(a%2?t.r*1.5:t.r*0.7);
        var px=e.x+Math.cos(ang)*rr, py=e.y+Math.sin(ang)*rr;
        a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(e.x,e.y,t.r,t.r*0.8,0,0,6.28); ctx.fill();
      ctx.strokeStyle=t.glow; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(e.x,e.y-t.r); ctx.lineTo(e.x,e.y-t.r-6); ctx.stroke();
      ctx.beginPath(); ctx.arc(e.x,e.y-t.r-8,3,0,6.28); ctx.fillStyle=&#x27;#fff&#x27;; ctx.fill();
      ctx.fillStyle=&#x27;#111&#x27;; ctx.beginPath(); ctx.arc(e.x-6,e.y-2,3,0,6.28); ctx.fill();
    }
    ctx.shadowBlur=0;
    // points label
    ctx.fillStyle=&#x27;#001018&#x27;; ctx.font=&#x27;bold 13px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(t.pts, e.x, e.y+ (t.name===&#x27;jelly&#x27;? -4 : 0));
  }

  function drawCoral(){
    ctx.fillStyle=&#x27;rgba(20,5,40,0.7)&#x27;;
    for(var x=0;x&lt;W;x+=40){
      var h=14+8*Math.sin(x*0.3);
      ctx.beginPath(); ctx.moveTo(x,H); ctx.lineTo(x+8,H-h-10); ctx.lineTo(x+16,H-h); ctx.lineTo(x+24,H-h-14); ctx.lineTo(x+32,H); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle=&#x27;rgba(255,80,180,0.25)&#x27;;
    ctx.fillRect(0,H-6,W,6);
  }

  function drawSub(){
    var x=subX, y=H-40;
    ctx.shadowColor=&#x27;#00e5ff&#x27;; ctx.shadowBlur=18;
    ctx.fillStyle=&#x27;#12406a&#x27;;
    ctx.beginPath(); ctx.ellipse(x,y,24,13,0,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#6ff2ff&#x27;;
    ctx.beginPath(); ctx.arc(x+6,y-2,6,0,6.28); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#ffd24d&#x27;;
    ctx.fbeginPath &amp;&amp; 0;
    ctx.beginPath(); ctx.moveTo(x-6,y-13); ctx.lineTo(x+2,y-24); ctx.lineTo(x+8,y-13); ctx.closePath(); ctx.fill();
  }

  function everySecond(){
    if(!running) return;
    timeLeft--; timerEl.textContent=Math.max(0,timeLeft);
    if(timeLeft&lt;=0){ endGame(); }
  }

  function endGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    if(secId){clearInterval(secId);secId=null;}
    msgEl.textContent=&#x27;Time! Final Score: &#x27;+score+&#x27; 🐙&#x27;;
    msgEl.style.display=&#x27;flex&#x27;;
  }

  function startGame(){
    if(running) return;
    reset();
    msgEl.style.display=&#x27;none&#x27;;
    running=true;
    spawn(); spawn();
    animId=requestAnimationFrame(tick);
    spawnId=setInterval(function(){
      if(!running) return;
      spawn();
    }, 900);
    secId=setInterval(everySecond,1000);
    // ramp spawn rate with score handled by interval; keep simple
  }
  function stopGame(){
    if(!running){ return; }
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    if(secId){clearInterval(secId);secId=null;}
    msgEl.textContent=&#x27;Paused&#x27;;
    msgEl.style.display=&#x27;flex&#x27;;
  }

  // input
  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){keys.left=true;e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){keys.right=true;e.preventDefault();}
    else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){fire();e.preventDefault();}
  });
  window.addEventListener(&#x27;keyup&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;)keys.left=false;
    else if(e.key===&#x27;ArrowRight&#x27;)keys.right=false;
  });
  function hold(el,on,off){
    [&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(ev){el.addEventListener(ev,function(e){e.preventDefault();on();},{passive:false});});
    [&#x27;mouseup&#x27;,&#x27;mouseleave&#x27;,&#x27;touchend&#x27;].forEach(function(ev){el.addEventListener(ev,function(e){off&amp;&amp;off();});});
  }
  hold(document.getElementById(&#x27;left&#x27;),function(){keys.left=true;},function(){keys.left=false;});
  hold(document.getElementById(&#x27;right&#x27;),function(){keys.right=true;},function(){keys.right=false;});
  var fb=document.getElementById(&#x27;fireBtn&#x27;);
  [&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(ev){fb.addEventListener(ev,function(e){e.preventDefault();fire();},{passive:false});});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static frame
  reset();
  ctx.fillStyle=&#x27;#0a1230&#x27;; ctx.fillRect(0,0,W,H);
  drawCoral(); drawSub();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
