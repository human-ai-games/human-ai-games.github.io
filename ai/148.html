<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>Cosmic Candy Blaster</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(90deg,#ff4fd8,#4ff0ff,#ffe74f); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #bcb6d6; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; width: 620px; font-size: 18px; }
  .score { font-weight: 700; color: #ffe74f; transition: transform .12s; }
  .score.flash { transform: scale(1.4); }
  .best { color: #4ff0ff; }
  .wrap { position: relative; width: 620px; height: 400px; }
  canvas { position: absolute; top: 0; left: 0; border-radius: 10px; background: #05010f; box-shadow: 0 0 24px #2a0a4a inset; }
  .redflash { position: absolute; inset: 0; border-radius: 10px; box-shadow: 0 0 0 4px #ff2d55 inset; opacity: 0; pointer-events: none; transition: opacity .1s; }
  .redflash.on { opacity: 1; }
  .miss { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%) rotate(-12deg); font-size: 48px; font-weight: 900; color: #ff2d55; text-shadow: 0 0 12px #ff2d55; opacity: 0; pointer-events: none; }
  .miss.on { opacity: 1; animation: pop .5s ease-out; }
  @keyframes pop { 0%{transform:translate(-50%,-50%) scale(1.6) rotate(-12deg);} 100%{transform:translate(-50%,-50%) scale(1) rotate(-12deg);} }
  .combo { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 900; color: #4ff0ff; text-shadow: 0 0 10px #4ff0ff; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .combo.on { opacity: 1; }
  .controls { display: flex; gap: 12px; margin-top: 2px; }
  .btn { width: 90px; height: 46px; font-size: 22px; font-weight: 800; border: none; border-radius: 10px; background: #241146; color: #fff; box-shadow: 0 0 10px #6a2ac0; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .btn:active { background: #4b1f8f; }
  .fire { background: #7a0f3a; box-shadow: 0 0 10px #ff2d78; }
  .fire:active { background: #b51555; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Cosmic Candy Blaster&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with ← → (or the buttons) and press Space (or FIRE) to blast the candy aliens raining down. Chain hits without letting one escape to build your combo multiplier — golden ones are worth the most!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot; id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;redflash&quot; id=&quot;redflash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;miss&quot; id=&quot;miss&quot;&gt;MISS!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;leftBtn&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;btn fire&quot; id=&quot;fireBtn&quot;&gt;FIRE&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;rightBtn&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 400;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;), missEl = document.getElementById(&#x27;miss&#x27;);
  var redflash = document.getElementById(&#x27;redflash&#x27;), wrap = document.getElementById(&#x27;wrap&#x27;);
  var scoreBox = scoreEl.parentNode;

  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = W/2, shipY = H - 26, SHIP_W = 34, SHIP_SPEED = 6;
  var bullets = [], aliens = [], sparks = [], stars = [], trail = [];
  var score = 0, best = 0, combo = 0, lastShot = 0;
  var shake = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (dur||0.1));
      o.stop(actx.currentTime + (dur||0.1));
    } catch(_) {}
  }

  // star init
  for (var i=0;i&lt;80;i++) stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, v: Math.random()*1.5+0.5 });

  var TYPES = {
    small:  { emoji:&#x27;👾&#x27;, size:26, speed:2.6, pts:3,  color:&#x27;#a6ff4f&#x27; },
    tank:   { emoji:&#x27;🍬&#x27;, size:44, speed:1.1, pts:1,  color:&#x27;#ff8bd0&#x27; },
    candy:  { emoji:&#x27;🍭&#x27;, size:34, speed:1.8, pts:3,  color:&#x27;#ffb84f&#x27; },
    gold:   { emoji:&#x27;⭐&#x27;, size:30, speed:3.2, pts:10, color:&#x27;#ffe74f&#x27; }
  };

  function spawnAlien() {
    var r = Math.random(), key;
    if (r &lt; 0.08) key=&#x27;gold&#x27;; else if (r&lt;0.38) key=&#x27;small&#x27;; else if (r&lt;0.68) key=&#x27;candy&#x27;; else key=&#x27;tank&#x27;;
    var t = TYPES[key];
    var x = Math.random()*(W - t.size) + t.size/2;
    aliens.push({ type:key, x:x, y:-t.size, baseX:x, size:t.size, speed:t.speed, pts:t.pts,
      emoji:t.emoji, color:t.color, amp: 20+Math.random()*50, freq: 0.02+Math.random()*0.03, phase: Math.random()*6 });
  }

  function spawnBullet() {
    var now = Date.now();
    if (now - lastShot &lt; 200) return;
    lastShot = now;
    bullets.push({ x: shipX, y: shipY - 18 });
    beep(880, 0.08, &#x27;square&#x27;, 0.05);
  }

  function burst(x, y, color) {
    for (var i=0;i&lt;16;i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
      sparks.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
    }
  }

  function showCombo() {
    if (combo &gt;= 2) { comboEl.textContent = &#x27;COMBO x&#x27; + combo; comboEl.classList.add(&#x27;on&#x27;); }
    else comboEl.classList.remove(&#x27;on&#x27;);
  }

  function flashScore() {
    scoreBox.classList.add(&#x27;flash&#x27;);
    setTimeout(function(){ scoreBox.classList.remove(&#x27;flash&#x27;); }, 130);
  }

  function doMiss() {
    combo = 0; showCombo();
    shake = 10;
    redflash.classList.add(&#x27;on&#x27;);
    missEl.classList.remove(&#x27;on&#x27;); void missEl.offsetWidth; missEl.classList.add(&#x27;on&#x27;);
    setTimeout(function(){ redflash.classList.remove(&#x27;on&#x27;); }, 120);
    setTimeout(function(){ missEl.classList.remove(&#x27;on&#x27;); }, 500);
    beep(140, 0.25, &#x27;sawtooth&#x27;, 0.09);
  }

  function tick() {
    if (!running) return;
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(SHIP_W/2, Math.min(W - SHIP_W/2, shipX));

    // shake offset
    var ox=0, oy=0;
    if (shake &gt; 0) { ox = (Math.random()-0.5)*shake; oy=(Math.random()-0.5)*shake; shake -= 0.8; }

    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(ox, oy);

    // stars
    for (var i=0;i&lt;stars.length;i++) {
      var s = stars[i];
      s.y += s.v; if (s.y &gt; H) { s.y = 0; s.x = Math.random()*W; }
      ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+(0.3+s.s*0.25)+&#x27;)&#x27;;
      ctx.fillRect(s.x, s.y, s.s, s.s*2);
    }

    // ship trail
    trail.push({ x: shipX, y: shipY, life: 1 });
    if (trail.length &gt; 14) trail.shift();
    for (var i=0;i&lt;trail.length;i++) {
      var tr = trail[i]; tr.life -= 0.07;
      if (tr.life &gt; 0) {
        ctx.beginPath();
        ctx.fillStyle = &#x27;rgba(120,220,255,&#x27;+(tr.life*0.4)+&#x27;)&#x27;;
        ctx.arc(tr.x, tr.y+4, 10*tr.life, 0, Math.PI*2); ctx.fill();
      }
    }

    // ship
    ctx.save();
    ctx.shadowColor = &#x27;#4ff0ff&#x27;; ctx.shadowBlur = 16;
    ctx.fillStyle = &#x27;#4ff0ff&#x27;;
    ctx.beginPath();
    ctx.moveTo(shipX, shipY-16);
    ctx.lineTo(shipX-16, shipY+12);
    ctx.lineTo(shipX+16, shipY+12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#ff4fd8&#x27;;
    ctx.beginPath(); ctx.arc(shipX, shipY, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // bullets - pulsing beams
    var pulse = 0.6 + 0.4*Math.sin(Date.now()/60);
    for (var i=bullets.length-1;i&gt;=0;i--) {
      var b = bullets[i]; b.y -= 9;
      if (b.y &lt; -20) { bullets.splice(i,1); continue; }
      ctx.save();
      ctx.shadowColor = &#x27;#ff4fd8&#x27;; ctx.shadowBlur = 12;
      ctx.fillStyle = &#x27;rgba(255,&#x27;+Math.floor(120+120*pulse)+&#x27;,255,&#x27;+pulse+&#x27;)&#x27;;
      ctx.fillRect(b.x-3, b.y-10, 6, 18);
      ctx.restore();
    }

    // aliens
    for (var i=aliens.length-1;i&gt;=0;i--) {
      var a = aliens[i];
      a.y += a.speed;
      a.x = a.baseX + Math.sin(a.y*a.freq + a.phase)*a.amp;
      if (a.y &gt; H + a.size) { aliens.splice(i,1); doMiss(); continue; }
      ctx.font = a.size + &#x27;px serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.fillText(a.emoji, a.x, a.y);
    }

    // collisions
    for (var i=bullets.length-1;i&gt;=0;i--) {
      var b = bullets[i]; var hit=false;
      for (var j=aliens.length-1;j&gt;=0;j--) {
        var a = aliens[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        if (dx*dx + dy*dy &lt; (a.size/2+6)*(a.size/2+6)) {
          burst(a.x, a.y, a.color);
          combo++;
          var gained = a.pts * combo;
          score += gained;
          scoreEl.textContent = score;
          flashScore(); showCombo();
          beep(a.type===&#x27;gold&#x27;?1400:660, 0.1, &#x27;triangle&#x27;, 0.07);
          aliens.splice(j,1); hit=true; break;
        }
      }
      if (hit) bullets.splice(i,1);
    }

    // sparks
    for (var i=sparks.length-1;i&gt;=0;i--) {
      var sp = sparks[i];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.12; sp.life -= 0.04;
      if (sp.life &lt;= 0) { sparks.splice(i,1); continue; }
      ctx.globalAlpha = sp.life;
      ctx.fillStyle = sp.color;
      ctx.fillRect(sp.x-2, sp.y-2, 4, 4);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
    animId = requestAnimationFrame(tick);
  }

  function reset() {
    bullets=[]; aliens=[]; sparks=[]; trail=[];
    score=0; combo=0; shake=0; lastShot=0;
    shipX=W/2;
    scoreEl.textContent=&#x27;0&#x27;;
    comboEl.classList.remove(&#x27;on&#x27;);
    for (var k in keysDown) keysDown[k]=false;
  }

  function startGame() {
    if (running) return;
    reset();
    running = true;
    spawnAlien();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnAlien, 900);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    if (spawnId){ clearInterval(spawnId); spawnId=null; }
    if (score &gt; best) { best = score; bestEl.textContent = best; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) spawnBullet(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
  });

  function holdBtn(el, key) {
    el.addEventListener(&#x27;mousedown&#x27;, function(e){ e.preventDefault(); keysDown[key]=true; });
    document.addEventListener(&#x27;mouseup&#x27;, function(){ keysDown[key]=false; });
    el.addEventListener(&#x27;touchstart&#x27;, function(e){ e.preventDefault(); keysDown[key]=true; }, {passive:false});
    el.addEventListener(&#x27;touchend&#x27;, function(e){ e.preventDefault(); keysDown[key]=false; }, {passive:false});
  }
  holdBtn(document.getElementById(&#x27;leftBtn&#x27;), &#x27;ArrowLeft&#x27;);
  holdBtn(document.getElementById(&#x27;rightBtn&#x27;), &#x27;ArrowRight&#x27;);
  var fireBtn = document.getElementById(&#x27;fireBtn&#x27;);
  fireBtn.addEventListener(&#x27;mousedown&#x27;, function(e){ e.preventDefault(); if(running) spawnBullet(); });
  fireBtn.addEventListener(&#x27;touchstart&#x27;, function(e){ e.preventDefault(); if(running) spawnBullet(); }, {passive:false});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // draw a static frame so it&#x27;s visible while stopped
  ctx.fillStyle = &#x27;#fff&#x27;;
  for (var i=0;i&lt;stars.length;i++){ var s=stars[i]; ctx.globalAlpha=0.5; ctx.fillRect(s.x,s.y,s.s,s.s*2); }
  ctx.globalAlpha=1;
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
