  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e6f3ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#00eaff,#4dffb0,#b060ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,234,255,0.35); }
  .instructions { font-size: 16px; color: #8fb6cc; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 24px; color: #eafff6; margin: 2px 0; font-weight: 700; text-shadow: 0 0 12px rgba(77,255,176,0.6); }
  #scoreVal { display: inline-block; }
  .score.pop #scoreVal { animation: pop 0.28s ease; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.6); color:#fff;} 100%{transform:scale(1);} }
  .fieldWrap { position: relative; }
  #field { display:block; background: radial-gradient(circle at 50% 45%, #0d1428 0%, #060814 70%); border-radius: 10px;
           box-shadow: 0 0 30px rgba(30,80,160,0.35), inset 0 0 40px rgba(0,60,120,0.25); }
  #flash { position:absolute; inset:0; border-radius:10px; pointer-events:none; opacity:0; }
  #flash.go { animation: flashfade 0.35s ease forwards; }
  @keyframes flashfade { 0%{opacity:0.55;} 100%{opacity:0;} }
  #particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:10px; }
  .spark { position:absolute; width:6px; height:6px; border-radius:50%; }
  #overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
             background: rgba(5,6,15,0.55); border-radius:10px; }
  #overlay.show { display:flex; }
  #overlay .go { font-size:38px; font-weight:800; letter-spacing:2px; color:#ff5b7a;
                 text-shadow: 0 0 20px rgba(255,80,120,0.8); }
  #overlay .fin { font-size:24px; margin-top:8px; color:#eafff6; text-shadow:0 0 14px rgba(77,255,176,0.6); }
  #overlay .hint { font-size:16px; margin-top:10px; color:#9fb8cc; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys (or swipe) to eat glowing collectibles — star=1, diamond=3, orb=5. Avoid the walls and your own tail; use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot; id=&quot;scoreBox&quot;&gt;Score: &lt;span id=&quot;scoreVal&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;fieldWrap&quot;&gt;
    &lt;canvas id=&quot;field&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;particles&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;go&quot;&gt;GAME OVER&lt;/div&gt;
      &lt;div class=&quot;fin&quot;&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Restart below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 22, COLS = 26, ROWS = 18;
  var FIELD_W = COLS*CELL, FIELD_H = ROWS*CELL;
  var canvas = document.getElementById(&#x27;field&#x27;);
  canvas.width = FIELD_W; canvas.height = FIELD_H;
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var particlesEl = document.getElementById(&#x27;particles&#x27;);
  var overlayEl = document.getElementById(&#x27;overlay&#x27;);
  var scoreBox = document.getElementById(&#x27;scoreBox&#x27;);
  var scoreVal = document.getElementById(&#x27;scoreVal&#x27;);
  var finalScore = document.getElementById(&#x27;finalScore&#x27;);

  var running=false, tickId=null, rafId=null, gameOver=false;
  var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0}, score=0;
  var speed=150;
  var collectibles=[]; // {type,x,y,born,life}
  var orbTimer=0;
  var scatter=[]; // for explosion
  var startTime=0;

  function occupied(x,y){ for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true; return false; }
  function collectibleAt(x,y){ for(var i=0;i&lt;collectibles.length;i++) if(collectibles[i].x===x&amp;&amp;collectibles[i].y===y) return true; return false; }
  function freeCell(){
    for(var t=0;t&lt;300;t++){ var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)&amp;&amp;!collectibleAt(x,y)) return {x:x,y:y}; }
    return {x:0,y:0};
  }
  function spawn(type,life){ var c=freeCell(); collectibles.push({type:type,x:c.x,y:c.y,born:performance.now(),life:life}); }

  function initSnake(){ snake=[{x:6,y:9},{x:5,y:9},{x:4,y:9}]; dir={x:1,y:0}; pendingDir={x:1,y:0}; }

  function ensureCollectibles(){
    var hasStar=false,hasDiamond=false;
    for(var i=0;i&lt;collectibles.length;i++){ if(collectibles[i].type===&#x27;star&#x27;)hasStar=true; if(collectibles[i].type===&#x27;diamond&#x27;)hasDiamond=true; }
    if(!hasStar) spawn(&#x27;star&#x27;, Infinity);
    if(!hasDiamond) spawn(&#x27;diamond&#x27;, 5000);
  }

  function doFlash(color){ flashEl.style.background=color; flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;); }

  function burst(cx,cy,color){
    for(var i=0;i&lt;12;i++){
      var sp=document.createElement(&#x27;div&#x27;); sp.className=&#x27;spark&#x27;;
      sp.style.background=color; sp.style.boxShadow=&#x27;0 0 8px &#x27;+color;
      sp.style.left=cx+&#x27;px&#x27;; sp.style.top=cy+&#x27;px&#x27;;
      particlesEl.appendChild(sp);
      var ang=(Math.PI*2*i)/12 + Math.random()*0.4;
      var dist=30+Math.random()*40;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      (function(el,dx,dy){
        el.animate([
          {transform:&#x27;translate(0,0) scale(1)&#x27;,opacity:1},
          {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(0.2)&#x27;,opacity:0}
        ],{duration:600,easing:&#x27;ease-out&#x27;}).onfinish=function(){ el.remove(); };
      })(sp,dx,dy);
    }
  }

  var typeColor={star:&#x27;#ffe14d&#x27;, diamond:&#x27;#ff5bc0&#x27;, orb:&#x27;#ffd24d&#x27;};

  function tick(){
    if(!running) return;
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0]; var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }
    // check eat
    var eatenIdx=-1;
    for(var i=0;i&lt;collectibles.length;i++){ if(collectibles[i].x===nx&amp;&amp;collectibles[i].y===ny){ eatenIdx=i; break; } }
    var ate=eatenIdx&gt;=0;
    var body=ate?snake:snake.slice(0,snake.length-1);
    for(var j=0;j&lt;body.length;j++){ if(body[j].x===nx&amp;&amp;body[j].y===ny){ endGame(); return; } }
    snake.unshift({x:nx,y:ny});
    if(ate){
      var c=collectibles[eatenIdx];
      var pts=c.type===&#x27;star&#x27;?1:c.type===&#x27;diamond&#x27;?3:5;
      var prev=score; score+=pts;
      scoreVal.textContent=score;
      scoreBox.classList.remove(&#x27;pop&#x27;); void scoreBox.offsetWidth; scoreBox.classList.add(&#x27;pop&#x27;);
      doFlash(typeColor[c.type]);
      burst(c.x*CELL+CELL/2, c.y*CELL+CELL/2, typeColor[c.type]);
      collectibles.splice(eatenIdx,1);
      // speed escalation at each multiple of 5 crossed
      var crossed=Math.floor(score/5)-Math.floor(prev/5);
      if(crossed&gt;0){ speed=Math.max(60,speed-5*crossed); restartLoop(); }
      ensureCollectibles();
    } else {
      snake.pop();
    }
  }

  function updateTimed(now){
    // remove expired diamonds/orbs
    for(var i=collectibles.length-1;i&gt;=0;i--){
      var c=collectibles[i];
      if(c.life!==Infinity &amp;&amp; now-c.born&gt;c.life){ collectibles.splice(i,1); }
    }
    ensureCollectibles();
    // occasionally spawn a golden orb
    if(now&gt;orbTimer){
      var hasOrb=false; for(var k=0;k&lt;collectibles.length;k++) if(collectibles[k].type===&#x27;orb&#x27;) hasOrb=true;
      if(!hasOrb &amp;&amp; Math.random()&lt;0.35){ spawn(&#x27;orb&#x27;,3000); }
      orbTimer=now+3500+Math.random()*4000;
    }
  }

  // ---- Drawing ----
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function lerpColor(a,b,t){
    return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];
  }
  var cHead=[0,234,255], cMid=[60,220,150], cTail=[150,80,255];

  function snakeColor(idx,len){
    var t=len&lt;=1?0:idx/(len-1); var col;
    if(t&lt;0.5) col=lerpColor(cHead,cMid,t/0.5); else col=lerpColor(cMid,cTail,(t-0.5)/0.5);
    return &#x27;rgb(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;)&#x27;;
  }

  function drawGrid(now){
    var glow=0.06+0.03*Math.sin(now/700);
    ctx.strokeStyle=&#x27;rgba(60,120,200,&#x27;+glow+&#x27;)&#x27;; ctx.lineWidth=1;
    for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,FIELD_H); ctx.stroke(); }
    for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(FIELD_W,y*CELL); ctx.stroke(); }
  }

  function drawCollectible(c,now){
    var cx=c.x*CELL+CELL/2, cy=c.y*CELL+CELL/2;
    if(c.type===&#x27;star&#x27;){
      var blink=0.55+0.45*Math.abs(Math.sin(now/500));
      drawStar(cx,cy,CELL*0.42,CELL*0.18,&#x27;rgba(255,225,77,&#x27;+blink+&#x27;)&#x27;,&#x27;#ffe14d&#x27;);
    } else if(c.type===&#x27;diamond&#x27;){
      var frac=1-(now-c.born)/c.life; if(frac&lt;0)frac=0;
      var sz=CELL*0.42*(0.5+0.5*frac);
      var rot=now/400;
      drawDiamond(cx,cy,sz,rot,&#x27;#ff5bc0&#x27;);
    } else if(c.type===&#x27;orb&#x27;){
      var puls=0.6+0.4*Math.abs(Math.sin(now/180));
      var r=CELL*0.4*(0.85+0.15*Math.sin(now/180));
      ctx.save(); ctx.shadowColor=&#x27;#ffd24d&#x27;; ctx.shadowBlur=20*puls;
      ctx.fillStyle=&#x27;rgba(255,210,77,&#x27;+(0.7+0.3*puls)+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
  function drawStar(cx,cy,ro,ri,fill,glow){
    ctx.save(); ctx.shadowColor=glow; ctx.shadowBlur=14; ctx.fillStyle=fill; ctx.beginPath();
    for(var i=0;i&lt;10;i++){ var r=i%2===0?ro:ri; var a=-Math.PI/2+i*Math.PI/5;
      var px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function drawDiamond(cx,cy,s,rot,fill){
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); ctx.shadowColor=fill; ctx.shadowBlur=14;
    ctx.fillStyle=fill; ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.7,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.7,0);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawSnake(){
    for(var i=snake.length-1;i&gt;=0;i--){
      var s=snake[i]; var x=s.x*CELL, y=s.y*CELL;
      var col=snakeColor(i,snake.length);
      ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=i===0?18:10; ctx.fillStyle=col;
      roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.fill(); ctx.restore();
    }
    // eyes on head
    var h=snake[0]; var hx=h.x*CELL+CELL/2, hy=h.y*CELL+CELL/2;
    var ox=dir.x, oy=dir.y;
    // perpendicular
    var px=-oy, py=ox;
    var eyeOff=CELL*0.18, fwd=CELL*0.14;
    ctx.fillStyle=&#x27;#001018&#x27;;
    for(var e=-1;e&lt;=1;e+=2){
      var ex=hx+ox*fwd+px*eyeOff*e, ey=hy+oy*fwd+py*eyeOff*e;
      ctx.beginPath(); ctx.arc(ex,ey,2.6,0,Math.PI*2); ctx.fill();
    }
  }

  function drawScatter(now){
    var t=(now-startTime)/700; if(t&gt;1)t=1;
    for(var i=0;i&lt;scatter.length;i++){
      var p=scatter[i];
      var x=p.x0+p.vx*t*80, y=p.y0+p.vy*t*80;
      ctx.save(); ctx.globalAlpha=1-t; ctx.shadowColor=p.col; ctx.shadowBlur=12; ctx.fillStyle=p.col;
      roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.fill(); ctx.restore();
    }
  }

  function render(){
    var now=performance.now();
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    drawGrid(now);
    if(!gameOver){
      if(running) updateTimed(now);
      for(var i=0;i&lt;collectibles.length;i++) drawCollectible(collectibles[i],now);
      drawSnake();
    } else {
      drawScatter(now);
    }
    rafId=requestAnimationFrame(render);
  }

  function restartLoop(){ if(tickId) clearInterval(tickId); tickId=setInterval(tick,speed); }

  function endGame(){
    running=false; gameOver=true;
    if(tickId){ clearInterval(tickId); tickId=null; }
    doFlash(&#x27;#ff2b4a&#x27;);
    scatter=[]; startTime=performance.now();
    for(var i=0;i&lt;snake.length;i++){
      var s=snake[i]; var cx=s.x*CELL+CELL/2, cy=s.y*CELL+CELL/2;
      var mx=FIELD_W/2, my=FIELD_H/2;
      var vx=(cx-mx)/FIELD_W*2+(Math.random()-0.5), vy=(cy-my)/FIELD_H*2+(Math.random()-0.5);
      scatter.push({x0:s.x*CELL,y0:s.y*CELL,vx:vx,vy:vy,col:snakeColor(i,snake.length)});
    }
    finalScore.textContent=score;
    overlayEl.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    if(running) return;
    score=0; scoreVal.textContent=&#x27;0&#x27;; speed=150; gameOver=false;
    overlayEl.classList.remove(&#x27;show&#x27;);
    collectibles=[]; scatter=[];
    initSnake();
    ensureCollectibles();
    orbTimer=performance.now()+2000;
    running=true;
    restartLoop();
    if(!rafId) rafId=requestAnimationFrame(render);
  }
  function stopGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }
  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){setDir(-1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){setDir(1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){setDir(0,-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){setDir(0,1);e.preventDefault();}
  });
  // swipe support
  var tsx=0,tsy=0;
  window.addEventListener(&#x27;touchstart&#x27;,function(e){ if(e.touches.length){tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;} },{passive:true});
  window.addEventListener(&#x27;touchend&#x27;,function(e){
    if(!e.changedTouches.length) return;
    var dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) setDir(dx&gt;0?1:-1,0); else setDir(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  initSnake();
  collectibles=[{type:&#x27;star&#x27;,x:15,y:6,born:0,life:Infinity},{type:&#x27;diamond&#x27;,x:19,y:12,born:performance.now(),life:5000}];
  ctx.clearRect(0,0,FIELD_W,FIELD_H);
  drawGrid(performance.now());
  drawSnake();
  drawCollectible(collectibles[0],performance.now());
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
