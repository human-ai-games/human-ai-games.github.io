<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>GRAVITY FLIPPER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg,#00e5ff,#ff00e5,#ffd000); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(0,229,255,.3); }
  .instructions { font-size: 16px; color: #9fb0d0; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; font-size: 20px; font-weight: 700; color: #cfe; }
  .hud .lbl { color: #7f8fb0; font-weight: 600; font-size: 15px; }
  canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(80,0,255,.35); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GRAVITY FLIPPER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to flip gravity and snap your rocket between the floor and ceiling. Dodge the neon asteroids to build your combo — use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;BEST&lt;/span&gt; &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;680&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var WALL = 18;               // guide-line thickness zone
  var SHIP_W = 30, SHIP_H = 18;
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);

  var running = false, animId = null, gameOver = false, best = 0;
  var t = 0, score = 0, combo = 1, comboFlash = 0;
  var speed, spawnTimer;
  var ship, gravDown, obstacles, particles, stars, trail;
  var comboPop = 0;

  // ---- audio (procedural) ----
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtGain ? null : g.gain.setValueAtTime(vol||0.08, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function makeStars() {
    stars = [];
    for (var d = 0; d &lt; 3; d++) {
      var count = [24, 18, 12][d];
      for (var i = 0; i &lt; count; i++) {
        stars.push({
          x: Math.random() * W, y: Math.random() * H,
          depth: d, r: [0.8, 1.4, 2.2][d]
        });
      }
    }
  }

  function reset() {
    t = 0; score = 0; combo = 1; comboFlash = 0; comboPop = 0;
    speed = 3.4; spawnTimer = 0;
    gravDown = true;
    ship = { x: 90, y: H - WALL - SHIP_H, vy: 0 };
    obstacles = []; particles = []; trail = [];
    gameOver = false;
    makeStars();
    // spawn first cluster immediately so something moves within 1s
    spawnCluster(true);
  }

  function spawnCluster(topSide) {
    // topSide param optional; alternate to force flips
    var top = (topSide === true) ? true : (topSide === false ? false : Math.random() &lt; 0.5);
    var n = 2 + Math.floor(Math.random() * 3);
    var baseX = W + 20;
    var hue = Math.floor(Math.random() * 360);
    for (var i = 0; i &lt; n; i++) {
      var r = 12 + Math.random() * 12;
      var y = top ? (WALL + 8 + Math.random() * 70) : (H - WALL - 8 - Math.random() * 70);
      obstacles.push({
        x: baseX + i * (r * 1.6 + Math.random() * 20),
        y: y, r: r, hue: (hue + i * 20) % 360, spin: Math.random() * Math.PI, top: top
      });
    }
    // remember last side to alternate next time
    spawnCluster._last = top;
  }

  function nextCluster() {
    var last = spawnCluster._last;
    spawnCluster(last === undefined ? undefined : !last);
  }

  function explode(x, y) {
    for (var i = 0; i &lt; 40; i++) {
      var a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 6;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, hue: Math.floor(Math.random() * 360)
      });
    }
  }

  function flip() {
    if (!running || gameOver) return;
    gravDown = !gravDown;
    beep(gravDown ? 320 : 520, 0.09, &#x27;square&#x27;, 0.05);
  }

  function bgColor() {
    // score-driven shift blue -&gt; purple -&gt; orange
    var p = Math.min(score / 3000, 1);
    var c1 = [8, 6, 30], c2, c3;
    if (p &lt; 0.5) { var q = p / 0.5; c2 = [20 + 40*q, 6, 40 + 30*q]; }
    else { var q2 = (p - 0.5) / 0.5; c2 = [60 + 100*q2, 6 + 40*q2, 70 - 60*q2]; }
    return { top: &#x27;rgb(&#x27; + c1.join(&#x27;,&#x27;) + &#x27;)&#x27;, bot: &#x27;rgb(&#x27; + c2.map(function(v){return Math.round(v);}).join(&#x27;,&#x27;) + &#x27;)&#x27; };
  }

  function tick() {
    if (!running) return;
    t++;
    if (!gameOver) {
      score += Math.round(1 + combo * 0.4);
      speed += 0.0016;
    }

    // ---- ship physics ----
    var grav = gravDown ? 1.1 : -1.1;
    ship.vy += grav;
    ship.vy *= 0.86;
    ship.y += ship.vy;
    var floorY = H - WALL - SHIP_H, ceilY = WALL;
    if (ship.y &gt; floorY) { ship.y = floorY; ship.vy = 0; }
    if (ship.y &lt; ceilY) { ship.y = ceilY; ship.vy = 0; }

    // trail
    trail.push({ x: ship.x, y: ship.y + SHIP_H / 2, life: 1, hue: (t * 6) % 360 });
    if (trail.length &gt; 18) trail.shift();
    for (var ti = 0; ti &lt; trail.length; ti++) trail[ti].life *= 0.9;

    // ---- obstacles ----
    for (var i = obstacles.length - 1; i &gt;= 0; i--) {
      var o = obstacles[i];
      o.x -= speed;
      o.spin += 0.05;
      if (o.x + o.r &lt; 0) {
        obstacles.splice(i, 1);
        if (!gameOver) { combo++; comboPop = 1; comboFlash = 12; beep(700 + combo * 15, 0.06, &#x27;sine&#x27;, 0.04); }
        continue;
      }
      // collision
      if (!gameOver) {
        var sx = ship.x + SHIP_W / 2, sy = ship.y + SHIP_H / 2;
        var dx = sx - o.x, dy = sy - o.y;
        if (dx * dx + dy * dy &lt; (o.r + 12) * (o.r + 12)) {
          gameOver = true;
          explode(sx, sy);
          beep(120, 0.4, &#x27;sawtooth&#x27;, 0.09);
          combo = 1;
        }
      }
    }

    // spawn
    spawnTimer -= speed;
    if (spawnTimer &lt;= 0 &amp;&amp; !gameOver) {
      nextCluster();
      spawnTimer = 190 + Math.random() * 90;
    }

    // ---- particles ----
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.02;
      if (pt.life &lt;= 0) particles.splice(p, 1);
    }

    // ---- stars parallax ----
    for (var s = 0; s &lt; stars.length; s++) {
      var st = stars[s];
      st.x -= speed * (0.25 + st.depth * 0.4);
      if (st.x &lt; 0) { st.x = W; st.y = Math.random() * H; }
    }

    if (gameOver &amp;&amp; particles.length === 0) {
      // let it linger a moment then stop naturally handled by button; keep score
      if (score &gt; best) { best = score; }
      bestEl.textContent = best;
    }
    if (score &gt; best) { best = score; bestEl.textContent = best; }

    comboFlash = Math.max(0, comboFlash - 1);
    comboPop *= 0.88;

    draw();
    scoreEl.textContent = score;
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    // background gradient
    var bg = bgColor();
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, bg.top); g.addColorStop(1, bg.bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars
    for (var s = 0; s &lt; stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.4 + st.depth * 0.25;
      ctx.fillStyle = &#x27;#dfe8ff&#x27;;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // pulsing guide walls
    var pulse = 0.5 + 0.5 * Math.sin(t * 0.12);
    ctx.shadowBlur = 12; 
    ctx.shadowColor = &#x27;rgba(0,229,255,&#x27; + (0.4 + pulse * 0.5) + &#x27;)&#x27;;
    ctx.fillStyle = &#x27;rgba(0,229,255,&#x27; + (0.5 + pulse * 0.4) + &#x27;)&#x27;;
    ctx.fillRect(0, WALL - 3, W, 3);
    ctx.shadowColor = &#x27;rgba(255,0,229,&#x27; + (0.4 + pulse * 0.5) + &#x27;)&#x27;;
    ctx.fillStyle = &#x27;rgba(255,0,229,&#x27; + (0.5 + pulse * 0.4) + &#x27;)&#x27;;
    ctx.fillRect(0, H - WALL, W, 3);
    ctx.shadowBlur = 0;

    // trail (rainbow)
    for (var ti = 0; ti &lt; trail.length; ti++) {
      var tr = trail[ti];
      var stretch = Math.min(3, Math.abs(ship.vy) * 0.4 + 1);
      ctx.globalAlpha = tr.life * 0.7;
      ctx.fillStyle = &#x27;hsl(&#x27; + tr.hue + &#x27;,100%,60%)&#x27;;
      ctx.beginPath();
      ctx.arc(tr.x - ti * 2 * stretch, tr.y, 6 * tr.life, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // obstacles
    for (var i = 0; i &lt; obstacles.length; i++) {
      var o = obstacles[i];
      ctx.save();
      ctx.translate(o.x, o.y); ctx.rotate(o.spin);
      ctx.shadowBlur = 16; ctx.shadowColor = &#x27;hsl(&#x27; + o.hue + &#x27;,100%,55%)&#x27;;
      ctx.fillStyle = &#x27;hsl(&#x27; + o.hue + &#x27;,90%,55%)&#x27;;
      ctx.beginPath();
      for (var k = 0; k &lt; 7; k++) {
        var ang = (k / 7) * Math.PI * 2;
        var rr = o.r * (0.75 + 0.25 * Math.sin(k * 3 + o.hue));
        ctx[k === 0 ? &#x27;moveTo&#x27; : &#x27;lineTo&#x27;](Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // ship
    if (!gameOver) {
      var flash = 1;
      ctx.save();
      ctx.translate(ship.x + SHIP_W / 2, ship.y + SHIP_H / 2);
      if (!gravDown) ctx.scale(1, -1);
      ctx.shadowBlur = 18; ctx.shadowColor = &#x27;#00e5ff&#x27;;
      ctx.fillStyle = &#x27;#e8fbff&#x27;;
      ctx.beginPath();
      ctx.moveTo(SHIP_W / 2, 0);
      ctx.lineTo(-SHIP_W / 2, -SHIP_H / 2);
      ctx.lineTo(-SHIP_W / 3, 0);
      ctx.lineTo(-SHIP_W / 2, SHIP_H / 2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = &#x27;#00e5ff&#x27;;
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    }

    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = &#x27;hsl(&#x27; + pt.hue + &#x27;,100%,65%)&#x27;;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3 + pt.life * 2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // combo pulsing center
    var sz = 60 + comboPop * 40;
    ctx.save();
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.globalAlpha = 0.14 + comboFlash / 40;
    ctx.font = &#x27;800 &#x27; + sz + &#x27;px system-ui, sans-serif&#x27;;
    ctx.fillStyle = comboFlash &gt; 0 ? &#x27;#fff&#x27; : &#x27;hsl(&#x27; + (t * 2 % 360) + &#x27;,100%,70%)&#x27;;
    ctx.shadowBlur = 20; ctx.shadowColor = &#x27;hsl(&#x27; + (t * 2 % 360) + &#x27;,100%,60%)&#x27;;
    ctx.fillText(&#x27;x&#x27; + combo, W / 2, H / 2);
    ctx.restore();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    if (gameOver) {
      ctx.save();
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.fillStyle = &#x27;rgba(0,0,0,0.45)&#x27;; ctx.fillRect(0, H/2 - 50, W, 100);
      ctx.fillStyle = &#x27;#ff5577&#x27;;
      ctx.font = &#x27;800 40px system-ui, sans-serif&#x27;;
      ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#ff0044&#x27;;
      ctx.fillText(&#x27;CRASHED!&#x27;, W / 2, H / 2 - 6);
      ctx.font = &#x27;600 18px system-ui, sans-serif&#x27;;
      ctx.fillStyle = &#x27;#cfe&#x27;;
      ctx.fillText(&#x27;Press Start below to fly again&#x27;, W / 2, H / 2 + 26);
      ctx.restore();
      ctx.shadowBlur = 0;
    }
  }

  function drawIdle() {
    reset();
    draw();
    // draw a &quot;press start&quot; prompt over idle
    ctx.save();
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillStyle = &#x27;#cfe&#x27;;
    ctx.font = &#x27;600 20px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Press Start below to launch&#x27;, W / 2, H / 2 + 90);
    ctx.restore();
  }

  function startGame() {
    reset();
    running = true;
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { flip(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;mousedown&#x27;, function () { flip(); });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  drawIdle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
