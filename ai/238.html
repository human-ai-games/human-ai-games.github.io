<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMET DASH</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COMET DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0620; color: #e8e6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#3af,#f3c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #a8a4d8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .scoreline { font-size: 18px; color: #cfe; margin: 0; letter-spacing: 1px; }
  .scoreline .best { color: #f7a; }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 24px rgba(80,60,180,.5); background:#0a0620; }
  #prompt { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 16px; color: #9ff; text-shadow: 0 0 8px #3cf; transition: opacity 1s; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COMET DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Pilot your comet through the neon lane — press &lt;strong&gt;Space&lt;/strong&gt; or click to jump (double-jump allowed!). Use the Start/Restart button below the game.&lt;/p&gt;
  &lt;p class=&quot;scoreline&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; &lt;span class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;
  &lt;div id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;prompt&quot;&gt;SPACE or TAP to jump, double-jump allowed!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height, GROUND = H - 40;
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
  var promptEl = document.getElementById(&#x27;prompt&#x27;);

  var running = false, animId = null, gameOver = false;
  var score = 0, best = 0;
  var baseSpeed = 3.5, speed = 3.5;
  var burstFlash = 0, dodged = 0;

  var comet = { x: 90, y: GROUND - 20, r: 15, vy: 0, jumps: 0 };
  var GRAVITY = 0.6, JUMP_V = -11;
  var trail = [], particles = [], obstacles = [];
  var spawnTimer = 0;

  // three star layers for parallax
  var stars = [[],[],[]];
  function initStars(){
    var counts=[40,28,18], sizes=[1,1.6,2.4], speeds=[0.3,0.6,1.0];
    for(var l=0;l&lt;3;l++){ stars[l]=[]; for(var i=0;i&lt;counts[l];i++){
      stars[l].push({x:Math.random()*W, y:Math.random()*H, s:sizes[l], sp:speeds[l]});
    }}
  }
  initStars();

  function makeAsteroid(){
    var w = 26 + Math.random()*34;
    var h = 24 + Math.random()*46;
    // pre-generate craters
    var craters=[];
    var nc = 2+Math.floor(Math.random()*3);
    for(var i=0;i&lt;nc;i++){ craters.push({x:0.2+Math.random()*0.6, y:0.2+Math.random()*0.6, r:0.08+Math.random()*0.12}); }
    // jagged polygon points
    var pts=[]; var n=7+Math.floor(Math.random()*3);
    for(var j=0;j&lt;n;j++){
      var ang = (j/n)*Math.PI*2;
      var rad = 0.5 + Math.random()*0.15;
      pts.push({a:ang, r:rad});
    }
    return { x: W+20, w:w, h:h, craters:craters, pts:pts, scored:false, rot:Math.random()*0.4-0.2 };
  }

  function spawnObstacle(){ obstacles.push(makeAsteroid()); }

  function jump(){
    if(!running || gameOver) return;
    if(comet.jumps &lt; 2){ comet.vy = JUMP_V; comet.jumps++; spawnJumpParticles(); }
  }

  function spawnJumpParticles(){
    for(var i=0;i&lt;8;i++){
      particles.push({x:comet.x, y:comet.y+comet.r, vx:(Math.random()-0.5)*3, vy:Math.random()*2+1,
        life:1, color: Math.random()&lt;0.5?&#x27;#3cf&#x27;:&#x27;#f3c&#x27;, sz:2+Math.random()*2});
    }
  }
  function spawnBurst(x,y){
    for(var i=0;i&lt;40;i++){
      var a=Math.random()*Math.PI*2, sp=1+Math.random()*5;
      particles.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
        life:1, color: Math.random()&lt;0.5?&#x27;#5ff&#x27;:&#x27;#f7f&#x27;, sz:2+Math.random()*3});
    }
  }

  function reset(){
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    speed=baseSpeed; dodged=0; burstFlash=0;
    comet.y=GROUND-20; comet.vy=0; comet.jumps=0;
    trail=[]; particles=[]; obstacles=[]; spawnTimer=0;
    gameOver=false;
    initStars();
  }

  function update(){
    // stars
    for(var l=0;l&lt;3;l++){ for(var i=0;i&lt;stars[l].length;i++){ var s=stars[l][i];
      s.x -= s.sp*speed; if(s.x&lt;0){ s.x=W; s.y=Math.random()*H; } } }

    // comet physics
    comet.vy += GRAVITY; comet.y += comet.vy;
    if(comet.y &gt; GROUND-comet.r){ comet.y=GROUND-comet.r; comet.vy=0; comet.jumps=0; }
    if(comet.y &lt; comet.r){ comet.y=comet.r; comet.vy=0; }

    // trail
    trail.push({x:comet.x-comet.r, y:comet.y, life:1});
    if(trail.length&gt;26) trail.shift();
    for(var t=0;t&lt;trail.length;t++) trail[t].life-=0.04;

    // speed grows with score
    speed = baseSpeed + score*0.06;
    var effSpeed = speed + (burstFlash&gt;0 ? 3 : 0);
    if(burstFlash&gt;0) burstFlash--;

    // obstacles
    spawnTimer -= effSpeed;
    if(spawnTimer&lt;=0){ spawnObstacle(); spawnTimer = 200 + Math.random()*120; }
    for(var o=obstacles.length-1;o&gt;=0;o--){
      var ob=obstacles[o]; ob.x -= effSpeed;
      if(ob.x+ob.w&lt;0){ obstacles.splice(o,1); continue; }
      if(!ob.scored &amp;&amp; ob.x+ob.w &lt; comet.x){
        ob.scored=true; score++; scoreEl.textContent=score;
        if(score&gt;best){ best=score; bestEl.textContent=best; }
        dodged++;
        if(dodged%5===0){ burstFlash=14; spawnBurst(comet.x, comet.y); }
      }
      // collision (circle vs box)
      var top = GROUND-ob.h;
      if(comet.x+comet.r &gt; ob.x &amp;&amp; comet.x-comet.r &lt; ob.x+ob.w &amp;&amp; comet.y+comet.r &gt; top){
        gameOver=true; stopGame(); return;
      }
    }

    // particles
    for(var p=particles.length-1;p&gt;=0;p--){ var pa=particles[p];
      pa.x+=pa.vx; pa.y+=pa.vy; pa.vy+=0.08; pa.life-=0.02;
      if(pa.life&lt;=0) particles.splice(p,1);
    }
  }

  function draw(){
    // background gradient
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,&#x27;#0d0730&#x27;); g.addColorStop(0.6,&#x27;#160a3a&#x27;); g.addColorStop(1,&#x27;#0a0620&#x27;);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // stars
    var colors=[&#x27;#5a5a9a&#x27;,&#x27;#9a9adf&#x27;,&#x27;#ffffff&#x27;];
    for(var l=0;l&lt;3;l++){ ctx.fillStyle=colors[l];
      for(var i=0;i&lt;stars[l].length;i++){ var s=stars[l][i];
        ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill(); } }

    // burst flash overlay
    if(burstFlash&gt;0){ ctx.fillStyle=&#x27;rgba(120,255,255,&#x27;+(burstFlash/14*0.15)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }

    // ground neon line
    ctx.strokeStyle=&#x27;#2ff&#x27;; ctx.lineWidth=2; ctx.shadowColor=&#x27;#2ff&#x27;; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(40,20,80,0.6)&#x27;; ctx.fillRect(0,GROUND,W,H-GROUND);

    // asteroids
    for(var o=0;o&lt;obstacles.length;o++){ var ob=obstacles[o];
      var cx=ob.x+ob.w/2, cy=GROUND-ob.h/2, rx=ob.w/2, ry=ob.h/2;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(ob.rot);
      ctx.beginPath();
      for(var j=0;j&lt;ob.pts.length;j++){ var pt=ob.pts[j];
        var px=Math.cos(pt.a)*pt.r*ob.w, py=Math.sin(pt.a)*pt.r*ob.h;
        if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.closePath();
      var ag=ctx.createLinearGradient(-rx,-ry,rx,ry);
      ag.addColorStop(0,&#x27;#5b4a7a&#x27;); ag.addColorStop(1,&#x27;#2e2145&#x27;);
      ctx.fillStyle=ag; ctx.fill();
      ctx.strokeStyle=&#x27;#a58fd8&#x27;; ctx.lineWidth=1.5; ctx.stroke();
      // craters
      ctx.fillStyle=&#x27;rgba(20,12,40,0.7)&#x27;;
      for(var c=0;c&lt;ob.craters.length;c++){ var cr=ob.craters[c];
        ctx.beginPath();
        ctx.arc((cr.x-0.5)*ob.w,(cr.y-0.5)*ob.h,cr.r*Math.min(ob.w,ob.h),0,Math.PI*2);
        ctx.fill(); }
      ctx.restore();
    }

    // trail
    for(var t=0;t&lt;trail.length;t++){ var tr=trail[t]; if(tr.life&lt;=0) continue;
      ctx.globalAlpha=tr.life*0.6;
      ctx.fillStyle= t%2? &#x27;#3cf&#x27;:&#x27;#f3c&#x27;;
      ctx.beginPath(); ctx.arc(tr.x,tr.y,comet.r*tr.life*0.9,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // comet
    var cg=ctx.createRadialGradient(comet.x,comet.y,2,comet.x,comet.y,comet.r+6);
    cg.addColorStop(0,&#x27;#ffffff&#x27;); cg.addColorStop(0.4,&#x27;#7ff&#x27;); cg.addColorStop(1,&#x27;rgba(60,200,255,0)&#x27;);
    ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r+6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#eafcff&#x27;; ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r*0.6,0,Math.PI*2); ctx.fill();

    // particles
    for(var p=0;p&lt;particles.length;p++){ var pa=particles[p];
      ctx.globalAlpha=Math.max(0,pa.life);
      ctx.fillStyle=pa.color;
      ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.sz,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // game over text
    if(gameOver){
      ctx.fillStyle=&#x27;rgba(10,6,32,0.7)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=&#x27;#f3c&#x27;; ctx.font=&#x27;bold 34px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;CRASHED!&#x27;, W/2, H/2-10);
      ctx.fillStyle=&#x27;#9ff&#x27;; ctx.font=&#x27;16px system-ui&#x27;;
      ctx.fillText(&#x27;Score &#x27;+score+&#x27;  ·  Best &#x27;+best+&#x27;  — press Restart below&#x27;, W/2, H/2+22);
      ctx.textAlign=&#x27;left&#x27;;
    }
  }

  function loop(){ if(!running) return; update(); if(!running){ draw(); return; } draw(); animId=requestAnimationFrame(loop); }

  function startGame(){
    if(running) return;
    reset();
    promptEl.style.opacity=&#x27;1&#x27;;
    setTimeout(function(){ promptEl.style.opacity=&#x27;0&#x27;; }, 3500);
    running=true;
    animId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    draw();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;click&#x27;, jump);
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static frame
  draw();

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
