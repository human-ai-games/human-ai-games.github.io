  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a0b2e; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 640px; position: relative; z-index: 1; }

  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← →, rotate with ↑, and slam down with Space for bonus points. Fill a full row to clear it — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;scores&quot;&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt; &amp;nbsp; High: &lt;b id=&quot;high&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over!&lt;br&gt;&lt;span style=&quot;font-size:18px&quot;&gt;Press Start to play again&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

      &lt;div class=&quot;next-label&quot;&gt;Next&lt;/div&gt;

    &lt;button data-a=&quot;rot&quot;&gt;⟳&lt;/button&gt;
    &lt;button data-a=&quot;right&quot;&gt;→&lt;/button&gt;
    &lt;button data-a=&quot;drop&quot;&gt;⤓&lt;/button&gt;

&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 18;
  var field = document.getElementById(&#x27;field&#x27;);
  var nextBox = document.getElementById(&#x27;next&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var highEl = document.getElementById(&#x27;high&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  var bg = document.getElementById(&#x27;bg&#x27;);
  field.style.width = COLS*CELL+&#x27;px&#x27;; field.style.height = ROWS*CELL+&#x27;px&#x27;;
  nextBox.style.width = 4*20+&#x27;px&#x27;; nextBox.style.height = 4*20+&#x27;px&#x27;;

  var FRUIT = [&#x27;🍓&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍊&#x27;,&#x27;🍉&#x27;,&#x27;🍒&#x27;,&#x27;🫐&#x27;];
  var COLORS = [&#x27;#ff4d6d&#x27;,&#x27;#ffd43b&#x27;,&#x27;#b388ff&#x27;,&#x27;#ff922b&#x27;,&#x27;#69db7c&#x27;,&#x27;#f06595&#x27;,&#x27;#4dabf7&#x27;];
  var SHAPES = [
    [[1,1,1,1]],               // I
    [[1,1],[1,1]],             // O
    [[0,1,0],[1,1,1]],         // T
    [[0,1,1],[1,1,0]],         // S
    [[1,1,0],[0,1,1]],         // Z
    [[1,0,0],[1,1,1]],         // J
    [[0,0,1],[1,1,1]]          // L
  ];

  var grid, piece, nextPiece, score, high=0, running=false, dropId=null, dropMs, speedId=null;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(-1);grid.push(row);} }

  function makePiece(){
    var t = Math.floor(Math.random()*SHAPES.length);
    var m = SHAPES[t].map(function(r){return r.slice();});
    return { m:m, t:t, x:Math.floor((COLS-m[0].length)/2), y:0 };
  }

  function rotate(m){
    var R=m.length, C=m[0].length, out=[];
    for(var c=0;c&lt;C;c++){var row=[];for(var r=R-1;r&gt;=0;r--)row.push(m[r][c]);out.push(row);}
    return out;
  }

  function cells(p){
    var out=[];
    for(var r=0;r&lt;p.m.length;r++)for(var c=0;c&lt;p.m[r].length;c++)
      if(p.m[r][c]) out.push({x:p.x+c,y:p.y+r});
    return out;
  }

  function collides(p){
    var cs=cells(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x,y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0&amp;&amp;grid[y][x]&gt;=0) return true;
    }
    return false;
  }

  function spawn(){
    piece = nextPiece || makePiece();
    piece.x = Math.floor((COLS-piece.m[0].length)/2); piece.y=0;
    nextPiece = makePiece();
    drawNext();
    return !collides(piece);
  }

  function lock(){
    var cs=cells(piece);
    for(var i=0;i&lt;cs.length;i++){var c=cs[i];if(c.y&gt;=0)grid[c.y][c.x]=piece.t;}
    piece=null;
  }

  function clearRows(){
    var cleared=[];
    for(var r=ROWS-1;r&gt;=0;r--){
      var full=true; for(var c=0;c&lt;COLS;c++)if(grid[r][c]&lt;0){full=false;break;}
      if(full)cleared.push(r);
    }
    if(cleared.length){
      cleared.forEach(function(r){ burst(r); });
      // remove from bottom-most to top preserving indices
      cleared.sort(function(a,b){return a-b;}).forEach(function(r,i){
        grid.splice(r,1);
        var empty=[]; for(var c=0;c&lt;COLS;c++)empty.push(-1);
        grid.unshift(empty);
      });
      var gain = cleared.length*100 + (cleared.length&gt;1?(cleared.length-1)*50:0);
      addScore(gain, cleared[0]);
    }
  }

  function addScore(n, rowHint){
    score+=n;
    scoreEl.textContent=score;
    if(score&gt;high){high=score;highEl.textContent=high;}
    updateBg();
    if(rowHint!=null) popup(&#x27;+&#x27;+n+&#x27;!&#x27;, rowHint);
  }

  function updateBg(){
    var hue = (score*3) % 360;
    bg.style.background = &#x27;linear-gradient(135deg, hsl(&#x27;+hue+&#x27;,70%,25%), hsl(&#x27;+((hue+80)%360)+&#x27;,70%,18%))&#x27;;
  }

  function popup(txt,row){
    var p=document.createElement(&#x27;div&#x27;);
    p.className=&#x27;popup&#x27;; p.textContent=txt;
    p.style.left=&#x27;50%&#x27;; p.style.top=(row*CELL)+&#x27;px&#x27;; p.style.transform=&#x27;translateX(-50%)&#x27;;
    field.appendChild(p);
    var start=null;
    function anim(t){
      if(!start)start=t; var e=(t-start)/900;
      if(e&gt;=1){p.remove();return;}
      p.style.top=(row*CELL - e*40)+&#x27;px&#x27;; p.style.opacity=1-e;
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  function burst(row){
    for(var i=0;i&lt;18;i++){
      var s=document.createElement(&#x27;div&#x27;);
      s.className=&#x27;spark&#x27;;
      s.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
      s.style.left=(Math.random()*COLS*CELL)+&#x27;px&#x27;;
      s.style.top=(row*CELL+CELL/2)+&#x27;px&#x27;;
      field.appendChild(s);
      var vx=(Math.random()-0.5)*8, vy=(Math.random()-0.5)*8-2;
      var x=parseFloat(s.style.left), y=parseFloat(s.style.top), start=null;
      (function(s,vx,vy,x,y){
        function anim(t){
          if(!start)start=t; var e=(t-start)/700;
          if(e&gt;=1){s.remove();return;}
          s.style.left=(x+vx*e*40)+&#x27;px&#x27;; s.style.top=(y+vy*e*40+e*e*60)+&#x27;px&#x27;; s.style.opacity=1-e;
          requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);
      })(s,vx,vy,x,y);
    }
  }

  function ghostY(){
    if(!piece)return 0;
    var gy=piece.y;
    while(!collides({m:piece.m,t:piece.t,x:piece.x,y:gy+1}))gy++;
    return gy;
  }

  function paint(){
    // clear cells but keep overlay &amp; popups/sparks
    var olds=field.querySelectorAll(&#x27;.cell&#x27;);
    olds.forEach(function(e){e.remove();});
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++)if(grid[r][c]&gt;=0)drawCell(field,c,r,CELL,grid[r][c],1);
    if(piece){
      // ghost
      var gy=ghostY();
      var gp={m:piece.m,t:piece.t,x:piece.x,y:gy};
      cells(gp).forEach(function(cl){ if(cl.y&gt;=0)drawGhost(cl.x,cl.y); });
      cells(piece).forEach(function(cl){ if(cl.y&gt;=0)drawCell(field,cl.x,cl.y,CELL,piece.t,1); });
    }
  }

  function drawCell(container,cx,cy,size,type,scale){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;;
    el.style.left=(cx*size)+&#x27;px&#x27;; el.style.top=(cy*size)+&#x27;px&#x27;;
    el.style.width=size+&#x27;px&#x27;; el.style.height=size+&#x27;px&#x27;;
    el.style.fontSize=(size*0.7)+&#x27;px&#x27;;
    el.style.background=&#x27;radial-gradient(circle at 30% 30%, &#x27;+COLORS[type]+&#x27;cc, &#x27;+COLORS[type]+&#x27;66)&#x27;;
    el.style.boxShadow=&#x27;0 0 8px &#x27;+COLORS[type]+&#x27;88&#x27;;
    el.textContent=FRUIT[type];
    container.appendChild(el);
  }

  function drawGhost(cx,cy){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.border=&#x27;2px dashed rgba(255,255,255,.5)&#x27;;
    field.appendChild(el);
  }

  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;;
    if(!nextPiece)return;
    var m=nextPiece.m, sz=20;
    var ox=Math.floor((4-m[0].length)/2), oy=Math.floor((4-m.length)/2);
    for(var r=0;r&lt;m.length;r++)for(var c=0;c&lt;m[r].length;c++)
      if(m[r][c])drawCell(nextBox,c+ox,r+oy,sz,nextPiece.t,1);
  }

  function step(){
    if(!piece)return;
    var next={m:piece.m,t:piece.t,x:piece.x,y:piece.y+1};
    if(collides(next)){ lock(); clearRows(); if(!spawn()){endGame();return;} }
    else piece=next;
    paint();
  }

  function move(dx){
    if(!running||!piece)return;
    var next={m:piece.m,t:piece.t,x:piece.x+dx,y:piece.y};
    if(!collides(next)){piece=next;paint();}
  }

  function doRotate(){
    if(!running||!piece)return;
    var rm=rotate(piece.m);
    var np={m:rm,t:piece.t,x:piece.x,y:piece.y};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      var t={m:rm,t:piece.t,x:piece.x+kicks[k],y:piece.y};
      if(!collides(t)){piece=t;paint();return;}
    }
  }

  function hardDrop(){
    if(!running||!piece)return;
    var gy=ghostY();
    var dist=gy-piece.y;
    piece.y=gy;
    if(dist&gt;0)addScore(dist*2,null);
    step();
  }

  function endGame(){
    running=false;
    if(dropId)clearInterval(dropId),dropId=null;
    if(speedId)clearInterval(speedId),speedId=null;
    overEl.style.display=&#x27;flex&#x27;;
    paint();
  }

  function speedUp(){
    dropMs=Math.max(120,dropMs-45);
    if(dropId)clearInterval(dropId);
    dropId=setInterval(step,dropMs);
  }

  function startGame(){
    if(running)return;
    overEl.style.display=&#x27;none&#x27;;
    score=0; scoreEl.textContent=&#x27;0&#x27;; dropMs=550;
    newGrid(); nextPiece=makePiece();
    if(!spawn()){return;}
    updateBg(); paint();
    running=true;
    if(dropId)clearInterval(dropId);
    dropId=setInterval(step,dropMs);
    if(speedId)clearInterval(speedId);
    speedId=setInterval(speedUp,10000);
  }
  function stopGame(){
    running=false;
    if(dropId)clearInterval(dropId),dropId=null;
    if(speedId)clearInterval(speedId),speedId=null;
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)step();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){doRotate();e.preventDefault();}
    else if(e.key===&#x27; &#x27;){hardDrop();e.preventDefault();}
  });

  document.querySelectorAll(&#x27;.controls button&#x27;).forEach(function(b){
    b.addEventListener(&#x27;click&#x27;,function(){
      var a=b.getAttribute(&#x27;data-a&#x27;);
      if(a===&#x27;left&#x27;)move(-1);
      else if(a===&#x27;right&#x27;)move(1);
      else if(a===&#x27;rot&#x27;)doRotate();
      else if(a===&#x27;drop&#x27;)hardDrop();
    });
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial view
  newGrid(); nextPiece=makePiece(); piece=makePiece();
  updateBg(); paint(); drawNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
