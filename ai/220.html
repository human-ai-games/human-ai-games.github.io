<!doctype html>
<html lang="en">
<head>

<title>🛸 Cow Rescue 🐄</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🛸 Cow Rescue 🐄</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .5px; }
  .instructions { font-size: 16px; color: #9fb0e0; max-width: 640px; margin: 0; line-height: 1.35; }
  .scoreboard { display: flex; gap: 18px; font-size: 18px; }
  .scoreboard b { color: #ffe27a; }
  .miss b { color: #ff7a7a; }
  .combo b { color: #7affc0; }
  canvas { background: #05060f; border-radius: 8px; display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🛸 Cow Rescue 🐄&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the cows caught in the tractor beam before they reach the saucer. Save three in a row for a HERO FARMER bonus — use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;scoreboard&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot;&gt;Best Combo: &lt;b id=&quot;combo&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;miss&quot;&gt;Missed: &lt;b id=&quot;miss&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;),
    comboEl = document.getElementById(&#x27;combo&#x27;),
    missEl = document.getElementById(&#x27;miss&#x27;);

var running = false, rafId = null, lastT = 0;
var score = 0, missed = 0, bestCombo = 0, combo = 0;
var cows = [], stars = [], stack = [], spawnAcc = 0;
var saucer, hillOffset = 0, heroFlash = 0, missFlash = 0;
var GROUND_Y = H - 60;

// ---- audio ----
var actx = null;
function ac() { if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_) {} } return actx; }
function moo() {
  var a = ac(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = &#x27;sawtooth&#x27;;
  var t = a.currentTime;
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.35);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.42);
}
function splat() {
  var a = ac(); if (!a) return;
  var t = a.currentTime;
  var buf = a.createBuffer(1, a.sampleRate * 0.15, a.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i &lt; d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  var s = a.createBufferSource(); s.buffer = buf;
  var g = a.createGain();
  g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  var f = a.createBiquadFilter(); f.type = &#x27;lowpass&#x27;; f.frequency.value = 800;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
function ding() {
  var a = ac(); if (!a) return;
  var t = a.currentTime;
  [660, 880, 1100].forEach(function(fr, i){
    var o = a.createOscillator(), g = a.createGain();
    o.type = &#x27;triangle&#x27;; o.frequency.value = fr;
    g.gain.setValueAtTime(0.0001, t + i*0.06);
    g.gain.exponentialRampToValueAtTime(0.2, t + i*0.06 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.06 + 0.3);
    o.connect(g); g.connect(a.destination); o.start(t + i*0.06); o.stop(t + i*0.06 + 0.32);
  });
}

// ---- stars ----
function initStars() {
  stars = [];
  for (var i = 0; i &lt; 90; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*(GROUND_Y-20), z: Math.random()*0.8+0.2, r: Math.random()*1.4+0.4 });
  }
}

function reset() {
  score = 0; missed = 0; bestCombo = 0; combo = 0;
  cows = []; stack = []; spawnAcc = 0; hillOffset = 0; heroFlash = 0; missFlash = 0;
  saucer = { x: 120, y: 55, dir: 1, speed: 40, ring: 0 };
  initStars();
  scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;0&#x27;; missEl.textContent = &#x27;0&#x27;;
}

function difficulty() {
  return Math.min(1, score / 60); // 0..1
}

function spawnCow() {
  var d = difficulty();
  cows.push({
    x: 60 + Math.random() * (W - 120),
    y: GROUND_Y,
    rise: 55 + d * 90 + Math.random()*20,
    grabbed: true,
    wob: Math.random()*Math.PI*2,
    beam: 1,
    dead: false, falling: false, vy: 0, spin: 0, rot: 0
  });
}

function maxCows() { return 1 + Math.floor(difficulty() * 3); } // up to 4

function update(dt) {
  hillOffset = (hillOffset + dt * 12) % W;
  saucer.ring += dt * 3;

  // saucer movement, speed climbs with score
  saucer.speed = 40 + difficulty() * 90;
  saucer.x += saucer.dir * saucer.speed * dt;
  if (saucer.x &gt; W - 60) { saucer.x = W - 60; saucer.dir = -1; }
  if (saucer.x &lt; 60) { saucer.x = 60; saucer.dir = 1; }

  // stars drift
  for (var i = 0; i &lt; stars.length; i++) {
    stars[i].x -= dt * 8 * stars[i].z;
    if (stars[i].x &lt; 0) { stars[i].x = W; stars[i].y = Math.random()*(GROUND_Y-20); }
  }

  // spawn
  var activeGrab = cows.filter(function(c){ return c.grabbed &amp;&amp; !c.dead; }).length;
  spawnAcc += dt;
  var spawnGap = 1.6 - difficulty() * 0.9;
  if (spawnAcc &gt; spawnGap &amp;&amp; activeGrab &lt; maxCows()) {
    spawnAcc = 0; spawnCow();
  }

  // cows
  for (var j = cows.length - 1; j &gt;= 0; j--) {
    var c = cows[j];
    c.wob += dt * 6;
    if (c.grabbed) {
      c.y -= c.rise * dt;
      c.beam = Math.min(1, c.beam + dt*3);
      if (c.y &lt;= saucer.y + 30) {
        // reached saucer -&gt; missed
        cows.splice(j, 1);
        missed++; missEl.textContent = missed;
        combo = 0;
        missFlash = 1;
      }
    } else if (c.falling) {
      c.vy += 900 * dt;
      c.y += c.vy * dt;
      c.rot += c.spin * dt;
      if (c.y &gt;= GROUND_Y) {
        cows.splice(j, 1);
      }
    }
  }

  // star particles
  for (var k = stack.length - 1; k &gt;= 0; k--) {
    var p = stack[k];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    p.life -= dt;
    if (p.life &lt;= 0) stack.splice(k, 1);
  }

  if (heroFlash &gt; 0) heroFlash -= dt;
  if (missFlash &gt; 0) missFlash -= dt;
}

function burst(x, y) {
  for (var i = 0; i &lt; 12; i++) {
    var a = Math.random()*Math.PI*2, s = 100 + Math.random()*160;
    stack.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 80, life: 0.6 + Math.random()*0.4, size: 4+Math.random()*4 });
  }
}

// ---- drawing ----
function drawSaucer() {
  var x = saucer.x, y = saucer.y;
  if (missFlash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(255,60,60,&#x27; + (missFlash*0.5) + &#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }
  // dome
  ctx.fillStyle = &#x27;#8fe0ff&#x27;;
  ctx.beginPath(); ctx.ellipse(x, y-8, 22, 18, 0, Math.PI, 0); ctx.fill();
  // body
  var grd = ctx.createLinearGradient(x-50, y, x+50, y);
  grd.addColorStop(0, &#x27;#555&#x27;); grd.addColorStop(0.5, &#x27;#bbb&#x27;); grd.addColorStop(1, &#x27;#555&#x27;);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(x, y, 52, 16, 0, 0, Math.PI*2); ctx.fill();
  // ring lights
  var cols = [&#x27;#ff5a5a&#x27;,&#x27;#ffe27a&#x27;,&#x27;#7affc0&#x27;,&#x27;#7ab8ff&#x27;,&#x27;#d67aff&#x27;,&#x27;#ff9a5a&#x27;];
  for (var i = 0; i &lt; 6; i++) {
    var ang = saucer.ring + i * (Math.PI*2/6);
    var lx = x + Math.cos(ang) * 40;
    var ly = y + Math.sin(ang) * 3 + 6;
    ctx.fillStyle = cols[i];
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI*2); ctx.fill();
  }
}

function drawBeam(c) {
  var topX = c.x, topY = saucer.y + 12;
  var w = 26 * c.beam;
  var g = ctx.createLinearGradient(0, topY, 0, c.y + 20);
  g.addColorStop(0, &#x27;rgba(255,240,150,0.45)&#x27;);
  g.addColorStop(1, &#x27;rgba(255,240,150,0.05)&#x27;);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(topX - 8, topY);
  ctx.lineTo(topX + 8, topY);
  ctx.lineTo(topX + w, c.y + 20);
  ctx.lineTo(topX - w, c.y + 20);
  ctx.closePath(); ctx.fill();
}

function drawCow(c) {
  ctx.save();
  var wob = c.grabbed ? Math.sin(c.wob) * 0.15 : 0;
  ctx.translate(c.x, c.y);
  ctx.rotate(c.falling ? c.rot : wob);
  // body
  ctx.fillStyle = &#x27;#f2f2f2&#x27;;
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 13, 0, 0, Math.PI*2); ctx.fill();
  // spots
  ctx.fillStyle = &#x27;#333&#x27;;
  ctx.beginPath(); ctx.ellipse(-6, -2, 5, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, 3, 4, 3, 0, 0, Math.PI*2); ctx.fill();
  // head
  ctx.fillStyle = &#x27;#f2f2f2&#x27;;
  ctx.beginPath(); ctx.ellipse(17, -4, 9, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = &#x27;#f0b6c0&#x27;;
  ctx.beginPath(); ctx.ellipse(23, -2, 4, 5, 0, 0, Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle = &#x27;#222&#x27;;
  ctx.beginPath(); ctx.arc(17, -8, 1.6, 0, Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle = &#x27;#ddd&#x27;;
  ctx.fillRect(-12, 10, 4, 8); ctx.fillRect(8, 10, 4, 8);
  ctx.restore();
}

function drawHills() {
  ctx.fillStyle = &#x27;#0d2a12&#x27;;
  for (var pass = 0; pass &lt; 2; pass++) {
    var off = -hillOffset + pass * W;
    ctx.beginPath();
    ctx.moveTo(off, GROUND_Y);
    for (var x = 0; x &lt;= W; x += 20) {
      var y = GROUND_Y - 18 - Math.sin((x + off) * 0.01) * 14;
      ctx.lineTo(off + x, y);
    }
    ctx.lineTo(off + W, H); ctx.lineTo(off, H);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = &#x27;#16401d&#x27;;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
}

function draw() {
  // sky
  var sky = ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0, &#x27;#050615&#x27;); sky.addColorStop(1, &#x27;#0f1230&#x27;);
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,GROUND_Y);
  // moon
  ctx.fillStyle = &#x27;#f4f1d0&#x27;;
  ctx.beginPath(); ctx.arc(W-70, 90, 26, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = &#x27;rgba(15,18,48,0.6)&#x27;;
  ctx.beginPath(); ctx.arc(W-60, 82, 24, 0, Math.PI*2); ctx.fill();
  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    var s = stars[i];
    ctx.fillStyle = &#x27;rgba(255,255,255,&#x27; + (0.4 + s.z*0.6) + &#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  drawHills();
  // beams behind cows
  for (var j = 0; j &lt; cows.length; j++) if (cows[j].grabbed) drawBeam(cows[j]);
  drawSaucer();
  for (var k = 0; k &lt; cows.length; k++) drawCow(cows[k]);
  // particles
  for (var p = 0; p &lt; stack.length; p++) {
    var pt = stack[p];
    ctx.fillStyle = &#x27;rgba(255,240,120,&#x27; + Math.max(0, pt.life) + &#x27;)&#x27;;
    ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.life*6);
    ctx.font = pt.size*3 + &#x27;px sans-serif&#x27;; ctx.fillText(&#x27;✦&#x27;, -pt.size, pt.size);
    ctx.restore();
  }
  // hero flash
  if (heroFlash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(120,255,192,&#x27; + (heroFlash*0.35) + &#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;rgba(255,255,255,&#x27; + Math.min(1, heroFlash*2) + &#x27;)&#x27;;
    ctx.font = &#x27;bold 40px sans-serif&#x27;; ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;HERO FARMER!&#x27;, W/2, H/2);
    ctx.textAlign = &#x27;start&#x27;;
  }

  if (!running) {
    ctx.fillStyle = &#x27;rgba(0,0,0,0.5)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#fff&#x27;; ctx.font = &#x27;bold 26px sans-serif&#x27;; ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;Press Start below to begin&#x27;, W/2, H/2);
    ctx.textAlign = &#x27;start&#x27;;
  }
}

function loop(t) {
  if (!running) return;
  var dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  update(dt);
  draw();
  rafId = requestAnimationFrame(loop);
}

cv.addEventListener(&#x27;mousedown&#x27;, function(e) {
  if (!running) return;
  var r = cv.getBoundingClientRect();
  var mx = (e.clientX - r.left) * (W / r.width);
  var my = (e.clientY - r.top) * (H / r.height);
  for (var i = cows.length - 1; i &gt;= 0; i--) {
    var c = cows[i];
    if (!c.grabbed) continue;
    var dx = mx - c.x, dy = my - c.y;
    if (dx*dx + dy*dy &lt; 28*28) {
      c.grabbed = false; c.falling = true; c.vy = -120;
      c.spin = (Math.random()-0.5) * 10;
      combo++;
      var pts = 1;
      if (combo &gt; 0 &amp;&amp; combo % 3 === 0) {
        pts += 5; heroFlash = 1; ding();
      }
      score += pts;
      if (combo &gt; bestCombo) { bestCombo = combo; comboEl.textContent = bestCombo; }
      scoreEl.textContent = score;
      burst(c.x, c.y);
      moo(); splat();
      return;
    }
  }
});

window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) {
    reset(); running = true; lastT = performance.now();
    spawnCow();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  } else if (e.data.type === &#x27;wd_stop&#x27;) {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    draw();
  }
});

// initial static frame
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s

  <div class="controls">

    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
