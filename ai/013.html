<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #eee; overflow: hidden; }

       text-shadow: 0 0 12px rgba(120,180,255,.3); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with your mouse or the arrow keys to bounce the orb and smash all the alien bricks. Grab the flashing gold star bricks for FEVER mode — double points! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;fever&quot; id=&quot;fever&quot;&gt;FEVER! &lt;span id=&quot;feverT&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 470;
  var scoreEl = document.getElementById(&#x27;score&#x27;), feverEl = document.getElementById(&#x27;fever&#x27;), feverTEl = document.getElementById(&#x27;feverT&#x27;);

  var running = false, animId = null, lastT = 0;
  var score = 0;
  var keysDown = {};

  // Paddle
  var PADDLE_W = 96, PADDLE_H = 14, paddleX = (W-PADDLE_W)/2, PADDLE_Y = H-26, PADDLE_SPEED = 8;

  // Ball
  var BALL_R = 8, baseSpeed = 4.2;
  var ballX, ballY, ballVX, ballVY, ballSpeed;
  var trail = [];

  // Fever
  var feverUntil = 0;

  // Stars background
  var stars = [];
  for (var i=0;i&lt;70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,tw:Math.random()*6.28});

  // Bricks
  var COLS = 10, ROWS = 5, BRICK_W = 56, BRICK_H = 20, GAP = 4, TOP = 40, LEFT = (W - (COLS*(BRICK_W+GAP)-GAP))/2;
  var palette = [
    {c:&#x27;#ff5c8a&#x27;, h:1}, {c:&#x27;#5cffb0&#x27;, h:1}, {c:&#x27;#5cc8ff&#x27;, h:2},
    {c:&#x27;#c78cff&#x27;, h:2}, {c:&#x27;#ffd34d&#x27;, h:3}, {c:&#x27;#ff9a5c&#x27;, h:1}, {c:&#x27;#6affea&#x27;, h:2}
  ];
  var bricks = [];
  var particles = [];

  function buildBricks() {
    bricks = [];
    for (var r=0;r&lt;ROWS;r++){
      for (var c=0;c&lt;COLS;c++){
        if (Math.random() &lt; 0.08) continue; // gaps
        var p = palette[Math.floor(Math.random()*palette.length)];
        var isStar = Math.random() &lt; 0.06;
        bricks.push({
          x: LEFT + c*(BRICK_W+GAP), y: TOP + r*(BRICK_H+GAP),
          w: BRICK_W, h: BRICK_H,
          color: isStar ? &#x27;#ffd34d&#x27; : p.c,
          hits: isStar ? 1 : p.h, maxHits: isStar ? 1 : p.h,
          star: isStar, flash: Math.random()*6.28
        });
      }
    }
  }

  function resetBall() {
    ballX = W/2; ballY = H-70;
    var ang = (-Math.PI/2) + (Math.random()*0.8-0.4);
    ballSpeed = baseSpeed + Math.floor(score/5)*0.4;
    ballVX = Math.cos(ang)*ballSpeed; ballVY = Math.sin(ang)*ballSpeed;
    trail = [];
  }

  function updateSpeed() {
    var target = baseSpeed + Math.floor(score/5)*0.4;
    var mag = Math.hypot(ballVX, ballVY) || 1;
    ballVX = ballVX/mag*target; ballVY = ballVY/mag*target;
    ballSpeed = target;
  }

  function paddleColor() {
    var tier = Math.floor(score/10)%4;
    return [&#x27;#5cc8ff&#x27;,&#x27;#5cffb0&#x27;,&#x27;#c78cff&#x27;,&#x27;#ff5c8a&#x27;][tier];
  }

  function addScore(n) {
    if (Date.now() &lt; feverUntil) n *= 2;
    score += n; scoreEl.textContent = score;
    updateSpeed();
  }

  function explode(x,y,color,count) {
    for (var i=0;i&lt;count;i++){
      var a = Math.random()*6.28, s = Math.random()*3+1;
      particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color,r:Math.random()*3+1});
    }
  }

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.06; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    } catch(_){}
  }

  function tick(t) {
    if (!running) return;
    var dt = 1;
    // keyboard paddle
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

    // ball
    trail.push({x:ballX,y:ballY});
    if (trail.length&gt;14) trail.shift();
    ballX += ballVX; ballY += ballVY;
    if (ballX-BALL_R&lt;=0){ballX=BALL_R;ballVX=-ballVX;beep(300,.05,&#x27;sine&#x27;);}
    if (ballX+BALL_R&gt;=W){ballX=W-BALL_R;ballVX=-ballVX;beep(300,.05,&#x27;sine&#x27;);}
    if (ballY-BALL_R&lt;=0){ballY=BALL_R;ballVY=-ballVY;beep(300,.05,&#x27;sine&#x27;);}

    // paddle collide
    if (ballVY&gt;0 &amp;&amp; ballY+BALL_R&gt;=PADDLE_Y &amp;&amp; ballY-BALL_R&lt;=PADDLE_Y+PADDLE_H &amp;&amp;
        ballX&gt;=paddleX-BALL_R &amp;&amp; ballX&lt;=paddleX+PADDLE_W+BALL_R) {
      ballY = PADDLE_Y-BALL_R;
      var hit = (ballX-(paddleX+PADDLE_W/2))/(PADDLE_W/2); // -1..1
      var ang = -Math.PI/2 + hit*(Math.PI/3);
      ballVX = Math.cos(ang)*ballSpeed; ballVY = Math.sin(ang)*ballSpeed;
      beep(440,.06,&#x27;square&#x27;);
    }

    // brick collide
    for (var i=bricks.length-1;i&gt;=0;i--){
      var b = bricks[i];
      if (ballX+BALL_R&gt;b.x &amp;&amp; ballX-BALL_R&lt;b.x+b.w &amp;&amp; ballY+BALL_R&gt;b.y &amp;&amp; ballY-BALL_R&lt;b.y+b.h){
        // determine bounce direction by overlap
        var overL = ballX+BALL_R-b.x, overR = b.x+b.w-(ballX-BALL_R);
        var overT = ballY+BALL_R-b.y, overB = b.y+b.h-(ballY-BALL_R);
        var minH = Math.min(overL,overR), minV = Math.min(overT,overB);
        if (minH&lt;minV) ballVX=-ballVX; else ballVY=-ballVY;
        b.hits--;
        if (b.hits&lt;=0){
          explode(b.x+b.w/2, b.y+b.h/2, b.color, b.star?24:12);
          if (b.star){ feverUntil = Date.now()+5000; beep(880,.25,&#x27;sine&#x27;,.1); }
          else beep(600,.06,&#x27;square&#x27;);
          addScore(b.star?3:b.maxHits);
          bricks.splice(i,1);
        } else {
          beep(500,.05,&#x27;square&#x27;); addScore(0.0000001); score=Math.round(score); scoreEl.textContent=score;
        }
        break;
      }
    }

    // lost ball
    if (ballY-BALL_R&gt;H) { resetBall(); score = Math.max(0, score-2); scoreEl.textContent=score; beep(150,.2,&#x27;sawtooth&#x27;); }

    // regen bricks
    if (bricks.length===0) buildBricks();

    // fever HUD
    if (Date.now()&lt;feverUntil){ feverEl.classList.add(&#x27;on&#x27;); feverTEl.textContent = Math.ceil((feverUntil-Date.now())/1000)+&#x27;s&#x27;; }
    else feverEl.classList.remove(&#x27;on&#x27;);

    // particles
    for (var j=particles.length-1;j&gt;=0;j--){
      var p=particles[j]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
      if (p.life&lt;=0) particles.splice(j,1);
    }

    draw(t);
    animId = requestAnimationFrame(tick);
  }

  function draw(t) {
    ctx.clearRect(0,0,W,H);
    // starfield
    for (var i=0;i&lt;stars.length;i++){
      var s=stars[i]; var tw = 0.5+0.5*Math.sin(t/500+s.tw);
      ctx.globalAlpha = 0.4+0.6*tw;
      ctx.fillStyle = &#x27;#9db8ff&#x27;;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bricks
    for (var b of bricks){
      var col = b.color;
      if (b.star){ var f=0.5+0.5*Math.sin(t/120+b.flash); ctx.shadowBlur=15; ctx.shadowColor=&#x27;#ffd34d&#x27;; col = f&gt;0.5?&#x27;#fff0a0&#x27;:&#x27;#ffd34d&#x27;; }
      else { ctx.shadowBlur=8; ctx.shadowColor=col; }
      var alpha = b.hits/b.maxHits*0.55+0.45;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = col;
      roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
      if (b.star){ ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.fillStyle=&#x27;#7a5a00&#x27;; ctx.font=&#x27;14px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;★&#x27;,b.x+b.w/2,b.y+b.h-5); }
      ctx.globalAlpha=1; ctx.shadowBlur=0;
    }

    // trail
    for (var i=0;i&lt;trail.length;i++){
      var tr=trail[i]; var a=i/trail.length;
      ctx.globalAlpha = a*0.5;
      ctx.fillStyle = (Date.now()&lt;feverUntil)?&#x27;#ffd34d&#x27;:&#x27;#6af&#x27;;
      ctx.beginPath(); ctx.arc(tr.x,tr.y,BALL_R*a,0,6.28); ctx.fill();
    }
    ctx.globalAlpha=1;

    // ball
    var fever = Date.now()&lt;feverUntil;
    ctx.shadowBlur = fever?22:14; ctx.shadowColor = fever?&#x27;#ffd34d&#x27;:&#x27;#6cf&#x27;;
    var pulse = BALL_R + Math.sin(t/100)*1.5;
    ctx.fillStyle = fever?&#x27;#fff0a0&#x27;:&#x27;#cfefff&#x27;;
    ctx.beginPath(); ctx.arc(ballX,ballY,pulse,0,6.28); ctx.fill();
    ctx.shadowBlur=0;

    // paddle
    var pc = paddleColor();
    ctx.shadowBlur = 16; ctx.shadowColor = pc;
    ctx.fillStyle = pc;
    roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7); ctx.fill();
    ctx.shadowBlur = 0;

    // particles
    for (var p of particles){
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function startGame(){
    if (running) return;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    feverUntil = 0; feverEl.classList.remove(&#x27;on&#x27;);
    paddleX = (W-PADDLE_W)/2;
    for (var k in keysDown) keysDown[k]=false;
    particles = [];
    buildBricks();
    resetBall();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame(){
    if (!running) return;
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
  }

  // input
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX-rect.left) * (W/rect.width);
    paddleX = Math.max(0, Math.min(W-PADDLE_W, x-PADDLE_W/2));
  });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    var x = (e.touches[0].clientX-rect.left) * (W/rect.width);
    paddleX = Math.max(0, Math.min(W-PADDLE_W, x-PADDLE_W/2));
    e.preventDefault();
  }, {passive:false});
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static frame
  buildBricks(); ballX=W/2; ballY=H-70; draw(0);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
