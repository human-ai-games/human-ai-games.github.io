  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1a0a2a; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(255,120,60,.6); }
  .instructions { font-size: 16px; color: #ffe; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; opacity: .92; }
  .hud { display: flex; align-items: center; gap: 18px; }

  .juice-wrap { display: flex; flex-direction: column; gap: 3px; }

  .juice-bar { width: 150px; height: 14px; background: rgba(0,0,0,.35); border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 4px rgba(0,0,0,.5); }
  .juice-fill { height: 100%; width: 10%; background: linear-gradient(90deg,#ffd54f,#ff7043,#e91e63); transition: width .15s; }
  .stage { position: relative; }
  .field { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  canvas { display: block; border-radius: 10px; }

  .combo.show { animation: comboPop 1.1s ease-out; }
  @keyframes comboPop {
    0% { transform: translate(-50%,-50%) scale(.2); opacity: 0; }
    25% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; }
    60% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
  }
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,.55); border-radius: 10px; font-size: 24px; font-weight: 800; gap: 6px; }
  .over.show { display: flex; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← / → , rotate with ↑, and press ↓ to drop faster (or swipe on touch). Clear full rows for points — clear several at once for a juicy COMBO!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;juice-wrap&quot;&gt;
      &lt;div class=&quot;juice-label&quot;&gt;Juiciness ×&lt;span id=&quot;mult&quot;&gt;1.0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;juice-bar&quot;&gt;&lt;div class=&quot;juice-fill&quot; id=&quot;juice&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;div class=&quot;field&quot;&gt;
      &lt;canvas id=&quot;cv&quot; width=&quot;264&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;COMBO!&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;div&gt;Game Over&lt;/div&gt;&lt;div style=&quot;font-size:16px;opacity:.85&quot;&gt;Press Start to play again&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 11, ROWS = 20;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;);
  var juiceEl = document.getElementById(&#x27;juice&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), overEl = document.getElementById(&#x27;over&#x27;);

  // Fruit definitions: emoji + color per shape
  var FRUITS = [
    { emoji:&#x27;🍉&#x27;, color:&#x27;#ff5a7a&#x27; }, // I
    { emoji:&#x27;🍋&#x27;, color:&#x27;#ffe14d&#x27; }, // O
    { emoji:&#x27;🍇&#x27;, color:&#x27;#b06cff&#x27; }, // T
    { emoji:&#x27;🍊&#x27;, color:&#x27;#ff9a3d&#x27; }, // L
    { emoji:&#x27;🫐&#x27;, color:&#x27;#5a8bff&#x27; }, // J
    { emoji:&#x27;🍓&#x27;, color:&#x27;#ff4d6d&#x27; }, // S
    { emoji:&#x27;🍏&#x27;, color:&#x27;#7fe05a&#x27; }  // Z
  ];
  var SHAPES = [
    [[1,1,1,1]],           // I
    [[1,1],[1,1]],         // O
    [[0,1,0],[1,1,1]],     // T
    [[0,0,1],[1,1,1]],     // L
    [[1,0,0],[1,1,1]],     // J
    [[0,1,1],[1,1,0]],     // S
    [[1,1,0],[0,1,1]]      // Z
  ];

  var grid, piece, score, running, dropId, mult, juiceTimer, speed;
  var particles = [], animId = null;
  var bounceCells = []; // {x,y,t}
  var bgHueSets = [
    [&#x27;#ff9a56&#x27;,&#x27;#ff6a88&#x27;,&#x27;#7a3ca8&#x27;],
    [&#x27;#ff6a56&#x27;,&#x27;#c93cff&#x27;,&#x27;#3c5fff&#x27;],
    [&#x27;#ffb84d&#x27;,&#x27;#ff5e7e&#x27;,&#x27;#8a2be2&#x27;],
    [&#x27;#56c8ff&#x27;,&#x27;#5e7eff&#x27;,&#x27;#a83cff&#x27;],
    [&#x27;#ff5e5e&#x27;,&#x27;#ff9a3d&#x27;,&#x27;#c93c9a&#x27;]
  ];
  var bgIndex = 0, bgPhase = 0;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function rotate(m){
    var R=m.length,C=m[0].length,out=[];
    for(var c=0;c&lt;C;c++){var row=[];for(var r=R-1;r&gt;=0;r--)row.push(m[r][c]);out.push(row);}
    return out;
  }

  function collides(p){
    for(var r=0;r&lt;p.m.length;r++)for(var c=0;c&lt;p.m[r].length;c++){
      if(!p.m[r][c])continue;
      var x=p.x+c,y=p.y+r;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS)return true;
      if(y&gt;=0&amp;&amp;grid[y][x])return true;
    }
    return false;
  }

  function spawn(){
    var t=Math.floor(Math.random()*7);
    piece={m:SHAPES[t],type:t,x:Math.floor((COLS-SHAPES[t][0].length)/2),y:-1};
    return !collides(piece);
  }

  function lock(){
    for(var r=0;r&lt;piece.m.length;r++)for(var c=0;c&lt;piece.m[r].length;c++){
      if(piece.m[r][c]){
        var x=piece.x+c,y=piece.y+r;
        if(y&gt;=0&amp;&amp;y&lt;ROWS&amp;&amp;x&gt;=0&amp;&amp;x&lt;COLS){ grid[y][x]=piece.type; bounceCells.push({x:x,y:y,t:0}); }
      }
    }
    piece=null;
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){var ok=true;for(var c=0;c&lt;COLS;c++)if(!grid[r][c]){ok=false;break;}if(ok)full.push(r);}
    if(full.length===0)return;
    // particles for each cleared row
    full.forEach(function(r){
      for(var c=0;c&lt;COLS;c++){ spawnSplat(c,r,grid[r][c]); }
    });
    // remove
    full.sort(function(a,b){return a-b;});
    full.forEach(function(r){ grid.splice(r,1); var e=[];for(var c=0;c&lt;COLS;c++)e.push(null); grid.unshift(e); });
    var n=full.length;
    var gained=Math.round((n*n)*10*mult);
    score+=gained;
    scoreEl.textContent=score;
    if(n&gt;=2){
      mult=Math.min(9.9, mult+0.4*n);
      showCombo(n);
      screenBurst();
    } else {
      mult=Math.min(9.9, mult+0.15);
    }
    updateJuice();
    checkSpeed();
    chime(n);
  }

  var lastThreshold=0;
  function checkSpeed(){
    var th=Math.floor(score/100);
    if(th&gt;lastThreshold){
      lastThreshold=th;
      speed=Math.max(120, speed-60);
      if(dropId){clearInterval(dropId);dropId=setInterval(step,speed);}
      bgIndex=(bgIndex+1)%bgHueSets.length;
      chime(3);
    }
  }

  function spawnSplat(cx,cy,type){
    var color=FRUITS[type?type:0].color;
    for(var i=0;i&lt;6;i++){
      particles.push({
        x:cx*CELL+CELL/2, y:cy*CELL+CELL/2,
        vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6-2,
        life:1, color:color, size:3+Math.random()*4
      });
    }
  }
  function screenBurst(){
    for(var i=0;i&lt;60;i++){
      particles.push({
        x:Math.random()*cv.width, y:Math.random()*cv.height*0.6,
        vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8,
        life:1, color:FRUITS[Math.floor(Math.random()*7)].color, size:3+Math.random()*5
      });
    }
  }
  function showCombo(n){
    comboEl.textContent = n&gt;=4 ? &#x27;MEGA COMBO!&#x27; : &#x27;COMBO!&#x27;;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  function updateJuice(){
    multEl.textContent=mult.toFixed(1);
    juiceEl.style.width=Math.min(100,(mult/9.9)*100)+&#x27;%&#x27;;
  }

  function step(){
    if(!piece)return;
    var np={m:piece.m,type:piece.type,x:piece.x,y:piece.y+1};
    if(collides(np)){
      lock(); clearRows();
      if(!spawn()){ endGame(); }
    } else piece=np;
  }

  function hardDrop(){
    if(!piece||!running)return;
    while(true){
      var np={m:piece.m,type:piece.type,x:piece.x,y:piece.y+1};
      if(collides(np))break; piece=np;
    }
    step();
  }

  function move(dx){
    if(!piece||!running)return;
    var np={m:piece.m,type:piece.type,x:piece.x+dx,y:piece.y};
    if(!collides(np))piece=np;
  }
  function tryRotate(){
    if(!piece||!running)return;
    var rm=rotate(piece.m);
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){
      var np={m:rm,type:piece.type,x:piece.x+kicks[i],y:piece.y};
      if(!collides(np)){piece=np;return;}
    }
  }

  // ---- Audio ----
  var actx=null;
  function chime(n){
    try{
      if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
      var base=n&gt;=3?[523,659,784,1047]:n&gt;=2?[440,554,659]:[440,660];
      base.forEach(function(f,i){
        var o=actx.createOscillator(),g=actx.createGain();
        o.type=&#x27;triangle&#x27;; o.frequency.value=f;
        var t=actx.currentTime+i*0.06;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.18,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
        o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.28);
      });
    }catch(e){}
  }

  // ---- Rendering ----
  function lerp(a,b,t){return a+(b-a)*t;}
  function hexToRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function mixHex(h1,h2,t){var a=hexToRgb(h1),b=hexToRgb(h2);return &#x27;rgb(&#x27;+Math.round(lerp(a[0],b[0],t))+&#x27;,&#x27;+Math.round(lerp(a[1],b[1],t))+&#x27;,&#x27;+Math.round(lerp(a[2],b[2],t))+&#x27;)&#x27;;}

  function drawBg(){
    var set=bgHueSets[bgIndex];
    // cycle phase for slow shimmer
    var p=(Math.sin(bgPhase)*0.5+0.5);
    var g=ctx.createLinearGradient(0,0,cv.width,cv.height);
    g.addColorStop(0, mixHex(set[0],set[1],p*0.4));
    g.addColorStop(0.5, mixHex(set[1],set[2],p));
    g.addColorStop(1, mixHex(set[2],set[0],p*0.5));
    ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
    // shimmering grid lines
    ctx.strokeStyle=&#x27;rgba(255,255,255,&#x27;+(0.06+0.05*p)+&#x27;)&#x27;;
    ctx.lineWidth=1;
    for(var c=0;c&lt;=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,cv.height);ctx.stroke();}
    for(var r=0;r&lt;=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(cv.width,r*CELL);ctx.stroke();}
  }

  function drawFruit(cx,cy,type,scale){
    var f=FRUITS[type];
    var px=cx*CELL, py=cy*CELL;
    var s=scale||1;
    var size=CELL*s;
    var off=(CELL-size)/2;
    // glow tile
    ctx.save();
    ctx.shadowColor=f.color; ctx.shadowBlur=10;
    ctx.fillStyle=f.color;
    roundRect(px+off+2,py+off+2,size-4,size-4,5);
    ctx.fill();
    ctx.restore();
    // emoji
    ctx.font=(size-6)+&#x27;px serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(f.emoji, px+CELL/2, py+CELL/2+1);
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function render(){
    drawBg();
    // locked blocks
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++){
      if(grid[r][c]!==null){
        var sc=1;
        for(var i=0;i&lt;bounceCells.length;i++){
          var b=bounceCells[i];
          if(b.x===c&amp;&amp;b.y===r){ sc=1+0.25*Math.sin(b.t*Math.PI); }
        }
        drawFruit(c,r,grid[r][c],sc);
      }
    }
    // piece
    if(piece){
      for(var r2=0;r2&lt;piece.m.length;r2++)for(var c2=0;c2&lt;piece.m[r2].length;c2++){
        if(piece.m[r2][c2]){ var y=piece.y+r2; if(y&gt;=0) drawFruit(piece.x+c2,y,piece.type,1); }
      }
    }
    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();
      ctx.restore();
    }
  }

  function animate(){
    bgPhase+=0.01;
    // update particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life-=0.03;
      if(p.life&lt;=0)particles.splice(i,1);
    }
    // update bounce
    for(var j=bounceCells.length-1;j&gt;=0;j--){
      bounceCells[j].t+=0.12;
      if(bounceCells[j].t&gt;=1)bounceCells.splice(j,1);
    }
    render();
    animId=requestAnimationFrame(animate);
  }

  function endGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(juiceTimer){clearInterval(juiceTimer);juiceTimer=null;}
    overEl.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overEl.classList.remove(&#x27;show&#x27;);
    newGrid(); score=0; mult=1.0; speed=550; lastThreshold=0; bgIndex=0; particles=[]; bounceCells=[];
    scoreEl.textContent=&#x27;0&#x27;; updateJuice();
    if(!spawn())return;
    running=true;
    if(dropId)clearInterval(dropId);
    dropId=setInterval(step,speed);
    if(juiceTimer)clearInterval(juiceTimer);
    juiceTimer=setInterval(function(){
      if(mult&gt;1.0){ mult=Math.max(1.0, mult-0.05); updateJuice(); }
    },800);
    if(!animId)animId=requestAnimationFrame(animate);
    try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state===&#x27;suspended&#x27;)actx.resume();}catch(e){}
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(juiceTimer){clearInterval(juiceTimer);juiceTimer=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);render();e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);render();e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)step();render();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){tryRotate();render();e.preventDefault();}
    else if(e.key===&#x27; &#x27;){hardDrop();render();e.preventDefault();}
  });

  // touch swipe
  var tsx=0,tsy=0,tst=0;
  cv.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;tst=Date.now();},{passive:true});
  cv.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;15&amp;&amp;Math.abs(dy)&lt;15){ tryRotate(); render(); return; }
    if(Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); }
    else { if(dy&gt;0)hardDrop(); }
    render();
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static paint
  newGrid(); score=0; mult=1.0; speed=550; render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
