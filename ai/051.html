<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMIC DEFENDER</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: &#x27;Courier New&#x27;, monospace; background: #05010f; color: #cfe8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 3px; color: #7df9ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #8fb8d8; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .wrap { position: relative; }
  canvas { display: block; background: #05010f; border: 2px solid #1b2a55; border-radius: 8px; box-shadow: 0 0 22px rgba(0,150,255,0.25) inset; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with the &amp;larr; &amp;rarr; arrow keys or your mouse to bounce the energy ball and smash the alien bricks. Grab falling capsules for boosts and don&#x27;t let the ball fall past you — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;660&quot; height=&quot;540&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var HUD_H = 40;

// Audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.15;
    o.connect(g); g.connect(actx.destination);
    var t = actx.currentTime;
    o.start(t);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur);
  } catch (_) {}
}

var running = false, animId = null;
var keys = {};
var paddle, ball, balls, bricks, particles, powerups, stars;
var score, lives, bounces, speedMult, shake, shakeMag, gameOver;
var reinforceTimer, splitTimer, widenTimer;
var BASE_SPEED = 4.0;

var PW_BASE = 100, PW_WIDE = 160, PH = 12;

function initStars() {
  stars = [];
  for (var i = 0; i &lt; 70; i++) {
    stars.push({ x: Math.random()*W, y: HUD_H + Math.random()*(H-HUD_H), s: Math.random()*1.5+0.3, sp: Math.random()*0.4+0.1 });
  }
}

function makeBrickGrid() {
  bricks = [];
  var cols = 11, rows = 5;
  var bw = 52, bh = 20, gap = 4;
  var startX = (W - (cols*bw + (cols-1)*gap)) / 2;
  var startY = HUD_H + 14;
  for (var r = 0; r &lt; rows; r++) {
    for (var c = 0; c &lt; cols; c++) {
      var type = &#x27;reg&#x27;;
      var roll = Math.random();
      if (r === 0 &amp;&amp; roll &lt; 0.5) type = &#x27;gold&#x27;;
      else if (roll &lt; 0.28) type = &#x27;armor&#x27;;
      else if (roll &lt; 0.4) type = &#x27;gold&#x27;;
      bricks.push(newBrick(startX + c*(bw+gap), startY + r*(bh+gap), bw, bh, type));
    }
  }
}

function newBrick(x, y, w, h, type) {
  var hp = type === &#x27;armor&#x27; ? 2 : 1;
  return { x:x, y:y, w:w, h:h, type:type, hp:hp, flash:0 };
}

function brickColor(b) {
  if (b.type === &#x27;gold&#x27;) return &#x27;#ffd24a&#x27;;
  if (b.type === &#x27;armor&#x27;) return b.hp === 2 ? &#x27;#c85cff&#x27; : &#x27;#8a3aff&#x27;;
  return &#x27;#3affc0&#x27;;
}

function resetGame() {
  paddle = { x: (W-PW_BASE)/2, w: PW_BASE, y: H-28 };
  ball = null;
  balls = [ newBall() ];
  makeBrickGrid();
  particles = [];
  powerups = [];
  score = 0; lives = 3; bounces = 0; speedMult = 1;
  shake = 0; shakeMag = 0; gameOver = false;
  reinforceTimer = 0; splitTimer = 0; widenTimer = 0;
  initStars();
}

function newBall(x, y, vx, vy) {
  var sp = BASE_SPEED * speedMult;
  if (x === undefined) {
    x = W/2; y = H - 80;
    var ang = (Math.random()*0.6 - 0.3) - Math.PI/2;
    vx = Math.cos(ang)*sp; vy = Math.sin(ang)*sp;
  }
  return { x:x, y:y, vx:vx, vy:vy, r:7 };
}

function startGame() {
  if (running) return;
  resetGame();
  running = true;
  if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){} }
  animId = requestAnimationFrame(tick);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function addExplosion(x, y, color) {
  for (var i = 0; i &lt; 12; i++) {
    var a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
  }
}

function maybeDropPowerup(x, y) {
  if (Math.random() &lt; 0.16) {
    var t = [&#x27;wide&#x27;,&#x27;split&#x27;,&#x27;slow&#x27;][Math.floor(Math.random()*3)];
    powerups.push({ x:x, y:y, type:t, vy:2.2, w:22, h:14 });
  }
}

function screenShake(mag) { shake = 12; shakeMag = mag; }

function reinforce() {
  // push all bricks down and add a new top row
  var minY = Infinity, bw=52, bh=20, gap=4, cols=11;
  for (var i=0;i&lt;bricks.length;i++) minY = Math.min(minY, bricks[i].y);
  if (minY === Infinity) minY = HUD_H + 14 + bh + gap;
  for (var i=0;i&lt;bricks.length;i++) bricks[i].y += bh+gap;
  var startX = (W - (cols*bw + (cols-1)*gap)) / 2;
  var newY = HUD_H + 14;
  for (var c=0;c&lt;cols;c++) {
    var roll = Math.random(), type=&#x27;reg&#x27;;
    if (roll&lt;0.3) type=&#x27;armor&#x27;; else if (roll&lt;0.42) type=&#x27;gold&#x27;;
    bricks.push(newBrick(startX + c*(bw+gap), newY, bw, bh, type));
  }
  beep(160, 0.25, &#x27;sawtooth&#x27;, 0.1);
}

function tick() {
  if (!running) return;

  // paddle move
  var pspeed = 8;
  if (keys[&#x27;ArrowLeft&#x27;]) paddle.x -= pspeed;
  if (keys[&#x27;ArrowRight&#x27;]) paddle.x += pspeed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // stars
  for (var i=0;i&lt;stars.length;i++){ stars[i].y += stars[i].sp; if (stars[i].y &gt; H){ stars[i].y = HUD_H; stars[i].x = Math.random()*W; } }

  // timers
  reinforceTimer++;
  if (reinforceTimer &gt;= 900) { reinforceTimer = 0; if (!gameOver) reinforce(); }
  if (splitTimer &gt; 0) { splitTimer--; }
  if (widenTimer &gt; 0) { widenTimer--; if (widenTimer === 0){ var cx=paddle.x+paddle.w/2; paddle.w=PW_BASE; paddle.x=cx-paddle.w/2; } }

  // balls
  for (var bi = balls.length-1; bi &gt;= 0; bi--) {
    var bl = balls[bi];
    bl.x += bl.vx; bl.y += bl.vy;
    if (bl.x - bl.r &lt;= 0) { bl.x = bl.r; bl.vx = Math.abs(bl.vx); beep(300,0.04,&#x27;square&#x27;,0.06); }
    if (bl.x + bl.r &gt;= W) { bl.x = W-bl.r; bl.vx = -Math.abs(bl.vx); beep(300,0.04,&#x27;square&#x27;,0.06); }
    if (bl.y - bl.r &lt;= HUD_H) { bl.y = HUD_H + bl.r; bl.vy = Math.abs(bl.vy); beep(300,0.04,&#x27;square&#x27;,0.06); }

    // paddle collision
    if (bl.vy &gt; 0 &amp;&amp; bl.y + bl.r &gt;= paddle.y &amp;&amp; bl.y + bl.r &lt;= paddle.y + PH + 8 &amp;&amp;
        bl.x &gt;= paddle.x - bl.r &amp;&amp; bl.x &lt;= paddle.x + paddle.w + bl.r) {
      var hit = (bl.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
      var sp = BASE_SPEED * speedMult;
      var ang = -Math.PI/2 + hit * (Math.PI/3);
      bl.vx = Math.cos(ang)*sp; bl.vy = Math.sin(ang)*sp;
      bl.y = paddle.y - bl.r;
      bounces++;
      beep(420, 0.05, &#x27;triangle&#x27;, 0.09);
      if (bounces % 5 === 0) {
        speedMult = Math.min(2.6, speedMult + 0.15);
        // rescale current balls
        for (var k=0;k&lt;balls.length;k++){ var m=Math.hypot(balls[k].vx,balls[k].vy)||1; var ns=BASE_SPEED*speedMult; balls[k].vx=balls[k].vx/m*ns; balls[k].vy=balls[k].vy/m*ns; }
        beep(660, 0.08, &#x27;sine&#x27;, 0.08);
      }
    }

    // brick collision
    for (var j = bricks.length-1; j &gt;= 0; j--) {
      var b = bricks[j];
      if (bl.x + bl.r &gt; b.x &amp;&amp; bl.x - bl.r &lt; b.x + b.w &amp;&amp; bl.y + bl.r &gt; b.y &amp;&amp; bl.y - bl.r &lt; b.y + b.h) {
        // determine bounce direction
        var overlapL = (bl.x + bl.r) - b.x;
        var overlapR = (b.x + b.w) - (bl.x - bl.r);
        var overlapT = (bl.y + bl.r) - b.y;
        var overlapB = (b.y + b.h) - (bl.y - bl.r);
        var minO = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (minO === overlapT || minO === overlapB) bl.vy = -bl.vy;
        else bl.vx = -bl.vx;

        b.hp--;
        b.flash = 6;
        if (b.hp &lt;= 0) {
          var pts = b.type === &#x27;gold&#x27; ? 3 : (b.type === &#x27;armor&#x27; ? 2 : 1);
          score += pts;
          addExplosion(b.x + b.w/2, b.y + b.h/2, brickColor(b));
          maybeDropPowerup(b.x + b.w/2, b.y + b.h/2);
          bricks.splice(j, 1);
          screenShake(4);
          beep(b.type===&#x27;gold&#x27;?880:520, 0.07, &#x27;square&#x27;, 0.09);
        } else {
          beep(240, 0.05, &#x27;sawtooth&#x27;, 0.08);
          screenShake(2);
        }
        break;
      }
    }

    // fell past
    if (bl.y - bl.r &gt; H) {
      balls.splice(bi, 1);
    }
  }

  // lost all balls -&gt; lose life
  if (balls.length === 0 &amp;&amp; !gameOver) {
    lives--;
    screenShake(9);
    beep(120, 0.3, &#x27;sawtooth&#x27;, 0.14);
    if (lives &lt;= 0) {
      gameOver = true;
    } else {
      speedMult = Math.max(1, speedMult - 0.3);
      balls = [ newBall() ];
    }
  }

  // refill grid if empty
  if (bricks.length === 0 &amp;&amp; !gameOver) { makeBrickGrid(); }

  // powerups
  for (var p = powerups.length-1; p &gt;= 0; p--) {
    var pu = powerups[p];
    pu.y += pu.vy;
    if (pu.y + pu.h &gt;= paddle.y &amp;&amp; pu.y &lt;= paddle.y + PH &amp;&amp; pu.x + pu.w/2 &gt;= paddle.x &amp;&amp; pu.x - pu.w/2 &lt;= paddle.x + paddle.w) {
      applyPowerup(pu.type);
      powerups.splice(p, 1);
      beep(720, 0.12, &#x27;sine&#x27;, 0.1);
    } else if (pu.y &gt; H) {
      powerups.splice(p, 1);
    }
  }

  // particles
  for (var q = particles.length-1; q &gt;= 0; q--) {
    var pt = particles[q];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= 0.03;
    if (pt.life &lt;= 0) particles.splice(q, 1);
  }

  // brick flash decay
  for (var f=0; f&lt;bricks.length; f++) if (bricks[f].flash&gt;0) bricks[f].flash--;

  if (shake &gt; 0) shake--;

  draw();

  if (gameOver) { running = false; if (animId){cancelAnimationFrame(animId);animId=null;} return; }
  animId = requestAnimationFrame(tick);
}

function applyPowerup(t) {
  if (t === &#x27;wide&#x27;) {
    var cx = paddle.x + paddle.w/2;
    paddle.w = PW_WIDE; paddle.x = cx - paddle.w/2;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    widenTimer = 480;
  } else if (t === &#x27;split&#x27;) {
    var extra = [];
    for (var i=0;i&lt;balls.length;i++){
      var b = balls[i];
      var m = Math.hypot(b.vx,b.vy)||1, s=BASE_SPEED*speedMult;
      extra.push(newBall(b.x, b.y, -b.vx, b.vy));
    }
    balls = balls.concat(extra);
    if (balls.length &gt; 6) balls = balls.slice(0,6);
    splitTimer = 600;
  } else if (t === &#x27;slow&#x27;) {
    speedMult = Math.max(0.7, speedMult - 0.5);
    for (var k=0;k&lt;balls.length;k++){ var m=Math.hypot(balls[k].vx,balls[k].vy)||1; var ns=BASE_SPEED*speedMult; balls[k].vx=balls[k].vx/m*ns; balls[k].vy=balls[k].vy/m*ns; }
  }
}

function draw() {
  ctx.save();
  var ox = 0, oy = 0;
  if (shake &gt; 0) { ox = (Math.random()-0.5)*shakeMag; oy = (Math.random()-0.5)*shakeMag; }
  ctx.translate(ox, oy);

  // bg
  ctx.fillStyle = &#x27;#05010f&#x27;;
  ctx.fillRect(-20, -20, W+40, H+40);

  // stars
  for (var i=0;i&lt;stars.length;i++){ var s=stars[i]; ctx.fillStyle=&#x27;rgba(150,200,255,&#x27;+(0.3+s.s*0.4)+&#x27;)&#x27;; ctx.fillRect(s.x, s.y, s.s, s.s*3); }

  // bricks
  for (var j=0;j&lt;bricks.length;j++){
    var b=bricks[j];
    var col = brickColor(b);
    if (b.flash&gt;0 &amp;&amp; b.type===&#x27;gold&#x27;) col = &#x27;#ffffff&#x27;;
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = &#x27;rgba(255,255,255,0.25)&#x27;;
    ctx.strokeRect(b.x+0.5, b.y+0.5, b.w-1, b.h-1);
    if (b.type===&#x27;armor&#x27; &amp;&amp; b.hp===1) {
      // crack
      ctx.strokeStyle = &#x27;rgba(0,0,0,0.55)&#x27;;
      ctx.beginPath();
      ctx.moveTo(b.x+b.w*0.3, b.y+2);
      ctx.lineTo(b.x+b.w*0.5, b.y+b.h*0.5);
      ctx.lineTo(b.x+b.w*0.35, b.y+b.h-2);
      ctx.moveTo(b.x+b.w*0.6, b.y+b.h*0.5);
      ctx.lineTo(b.x+b.w*0.8, b.y+b.h-3);
      ctx.stroke();
    }
  }

  // powerups
  for (var p=0;p&lt;powerups.length;p++){
    var pu=powerups[p];
    var c = pu.type===&#x27;wide&#x27;?&#x27;#3affc0&#x27;:(pu.type===&#x27;split&#x27;?&#x27;#ff4a6e&#x27;:&#x27;#4aa8ff&#x27;);
    ctx.fillStyle=c; ctx.shadowColor=c; ctx.shadowBlur=10;
    ctx.fillRect(pu.x-pu.w/2, pu.y, pu.w, pu.h);
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#001&#x27;;
    ctx.font=&#x27;bold 11px Courier New&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(pu.type===&#x27;wide&#x27;?&#x27;W&#x27;:(pu.type===&#x27;split&#x27;?&#x27;S&#x27;:&#x27;●&#x27;), pu.x, pu.y+11);
  }

  // particles
  for (var q=0;q&lt;particles.length;q++){
    var pt=particles[q];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // paddle
  ctx.fillStyle = &#x27;#7df9ff&#x27;;
  ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=14;
  ctx.beginPath();
  var pr=6;
  roundRect(paddle.x, paddle.y, paddle.w, PH, pr);
  ctx.fill();
  ctx.shadowBlur=0;

  // balls
  for (var bi=0;bi&lt;balls.length;bi++){
    var bl=balls[bi];
    ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.shadowColor=&#x27;#7df9ff&#x27;; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // HUD
  ctx.fillStyle=&#x27;rgba(10,15,40,0.85)&#x27;;
  ctx.fillRect(0,0,W,HUD_H);
  ctx.strokeStyle=&#x27;#1b2a55&#x27;; ctx.beginPath(); ctx.moveTo(0,HUD_H); ctx.lineTo(W,HUD_H); ctx.stroke();

  ctx.fillStyle=&#x27;#7df9ff&#x27;; ctx.textAlign=&#x27;left&#x27;;
  ctx.font=&#x27;bold 16px Courier New&#x27;;
  ctx.fillText(&#x27;SCORE &#x27;+score, 12, 26);

  ctx.textAlign=&#x27;center&#x27;;
  ctx.fillStyle= speedMult&gt;=1.8 ? &#x27;#ff4a6e&#x27; : &#x27;#ffd24a&#x27;;
  ctx.fillText(&#x27;SPEED x&#x27;+speedMult.toFixed(2), W/2, 26);

  // lives orbs
  ctx.textAlign=&#x27;right&#x27;;
  ctx.fillStyle=&#x27;#8fb8d8&#x27;; ctx.fillText(&#x27;LIVES&#x27;, W-100, 26);
  for (var L=0;L&lt;3;L++){
    ctx.beginPath();
    var lx = W-72 + L*22;
    if (L &lt; lives) { ctx.fillStyle=&#x27;#ff4a6e&#x27;; ctx.shadowColor=&#x27;#ff4a6e&#x27;; ctx.shadowBlur=10; }
    else { ctx.fillStyle=&#x27;rgba(120,120,140,0.35)&#x27;; ctx.shadowBlur=0; }
    ctx.arc(lx, 20, 7, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // status text (active powerups)
  ctx.textAlign=&#x27;left&#x27;; ctx.font=&#x27;11px Courier New&#x27;; ctx.fillStyle=&#x27;#3affc0&#x27;;
  var sy = HUD_H + 12; var sx = 8;
  // (kept minimal to avoid clutter)

  ctx.restore();

  if (gameOver) {
    ctx.fillStyle=&#x27;rgba(5,1,15,0.82)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle=&#x27;#ff4a6e&#x27;; ctx.shadowColor=&#x27;#ff4a6e&#x27;; ctx.shadowBlur=20;
    ctx.font=&#x27;bold 46px Courier New&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-10);
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#7df9ff&#x27;; ctx.font=&#x27;bold 22px Courier New&#x27;;
    ctx.fillText(&#x27;FINAL SCORE  &#x27;+score, W/2, H/2+34);
    ctx.fillStyle=&#x27;#8fb8d8&#x27;; ctx.font=&#x27;15px Courier New&#x27;;
    ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2+70);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// input
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function(e){
  if (!running || !paddle) return;
  var rect = cv.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (W/rect.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w/2));
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static draw
resetGame();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
