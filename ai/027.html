<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC BREAKOUT ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#4df,#a6f,#f4a); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,120,255,.4); }
  .instructions { font-size: 16px; color: #9aa0d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 26px; font-size: 20px; font-weight: 700; margin: 0; }
  .hud .mult { color: #6fffa0; text-shadow: 0 0 12px rgba(80,255,140,.6); }
  #wrap { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(100,80,255,.35); }
  canvas { display: block; background: radial-gradient(ellipse at 50% 20%, #150a30 0%, #05010f 70%); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse left and right to slide the paddle and bounce the ball into the bricks. Keep the rally alive to build your combo multiplier — grab power-ups and clear every wave!&lt;/p&gt;
  &lt;p class=&quot;hud&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp; &lt;span class=&quot;mult&quot;&gt;×&lt;span id=&quot;mult&quot;&gt;1&lt;/span&gt;&lt;/span&gt;&lt;/p&gt;
  &lt;div id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 470;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;);

  var running = false, animId = null;
  var score = 0, mult = 1, rally = 0;
  var shake = 0;

  // Paddle
  var basePW = 100, PW = basePW, PH = 13;
  var paddleX = (W - PW) / 2, paddleY = H - 28;
  var wideTimer = 0;

  // Ball
  var BR = 8;
  var ball, tail = [];
  var fireTimer = 0;

  // Bricks
  var bricks = [], wave = 0;
  var rowColors = [&#x27;#ff5d8f&#x27;,&#x27;#ff9d4d&#x27;,&#x27;#ffe14d&#x27;,&#x27;#6fffa0&#x27;,&#x27;#4dd2ff&#x27;,&#x27;#a678ff&#x27;];
  var rowPoints = [30, 25, 20, 15, 10, 5]; // top row least, moving down worth more

  // Power-ups &amp; particles
  var powerups = [], particles = [];
  var brickDestroyCount = 0;

  // Combo popups
  var popups = [];

  // Stars
  var stars = [];
  for (var i = 0; i &lt; 70; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.6+0.3, s: Math.random()*0.3+0.05 });
  }

  var mouseX = W/2;

  function resetBall() {
    ball = { x: W/2, y: H - 60, vx: (Math.random()&lt;.5?-1:1)*3.2, vy: -4.2, r: BR };
    tail = [];
  }

  function buildWave() {
    bricks = [];
    var rows = Math.min(6, 4 + Math.floor(wave/2));
    var cols = 9 + Math.min(3, Math.floor(wave/2));
    var pad = 6, top = 42, left = 12;
    var bw = (W - left*2 - pad*(cols-1)) / cols;
    var bh = 20;
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; cols; c++) {
        bricks.push({
          x: left + c*(bw+pad), y: top + r*(bh+pad),
          w: bw, h: bh,
          color: rowColors[r % rowColors.length],
          pts: rowPoints[r % rowPoints.length],
          alive: true
        });
      }
    }
  }

  function startGame() {
    if (running) return;
    score = 0; mult = 1; rally = 0; wave = 0;
    brickDestroyCount = 0; shake = 0;
    PW = basePW; wideTimer = 0; fireTimer = 0;
    powerups = []; particles = []; popups = [];
    scoreEl.textContent = &#x27;0&#x27;; multEl.textContent = &#x27;1&#x27;;
    buildWave();
    resetBall();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function updateMult() {
    var m = 1 + Math.floor(rally / 4);
    if (m &gt; mult) {
      mult = m;
      popups.push({ txt: &#x27;×&#x27;+mult+&#x27; COMBO!&#x27;, life: 60, max: 60, x: W/2, y: H/2 });
      shake = Math.max(shake, 6);
    } else {
      mult = m;
    }
    multEl.textContent = mult;
  }

  function loseRally() {
    rally = 0; mult = 1; multEl.textContent = &#x27;1&#x27;;
  }

  function burst(x, y, color) {
    for (var i = 0; i &lt; 12; i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*3+1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:24, max:24, color:color });
    }
  }

  function dropPowerup(x, y) {
    var kind = Math.random() &lt; 0.5 ? &#x27;wide&#x27; : &#x27;fire&#x27;;
    powerups.push({ x:x, y:y, kind:kind, vy:2.2 });
  }

  function tick() {
    if (!running) return;

    // paddle follow mouse
    paddleX = mouseX - PW/2;
    paddleX = Math.max(0, Math.min(W - PW, paddleX));

    // timers
    if (wideTimer &gt; 0) { wideTimer--; if (wideTimer === 0) PW = basePW; }
    if (fireTimer &gt; 0) fireTimer--;

    // ball tail
    tail.push({ x: ball.x, y: ball.y });
    if (tail.length &gt; 10) tail.shift();

    ball.x += ball.vx; ball.y += ball.vy;

    // walls
    if (ball.x - ball.r &lt;= 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r &gt;= W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r &lt;= 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // paddle collision
    if (ball.vy &gt; 0 &amp;&amp; ball.y + ball.r &gt;= paddleY &amp;&amp; ball.y + ball.r &lt;= paddleY + PH + 8 &amp;&amp;
        ball.x &gt;= paddleX - 4 &amp;&amp; ball.x &lt;= paddleX + PW + 4) {
      ball.vy = -Math.abs(ball.vy);
      ball.y = paddleY - ball.r;
      var hit = (ball.x - (paddleX + PW/2)) / (PW/2);
      ball.vx = hit * 5;
      var sp = Math.hypot(ball.vx, ball.vy);
      var target = 5.6;
      ball.vx = ball.vx/sp*target; ball.vy = ball.vy/sp*target;
    }

    // brick collisions
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r &gt; b.x &amp;&amp; ball.x - ball.r &lt; b.x + b.w &amp;&amp;
          ball.y + ball.r &gt; b.y &amp;&amp; ball.y - ball.r &lt; b.y + b.h) {
        b.alive = false;
        burst(b.x + b.w/2, b.y + b.h/2, b.color);
        score += b.pts * mult;
        scoreEl.textContent = score;
        rally++; updateMult();
        shake = Math.max(shake, 3);
        brickDestroyCount++;
        if (brickDestroyCount % 5 === 0) dropPowerup(b.x + b.w/2, b.y + b.h/2);

        if (fireTimer &gt; 0) {
          // fireball smashes through, no bounce
        } else {
          // reflect based on overlap
          var ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          var oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (ox &lt; oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
          break;
        }
      }
    }

    // wave clear
    var anyAlive = false;
    for (var j = 0; j &lt; bricks.length; j++) if (bricks[j].alive) { anyAlive = true; break; }
    if (!anyAlive) { wave++; buildWave(); shake = Math.max(shake, 5); }

    // power-ups fall
    for (var p = powerups.length - 1; p &gt;= 0; p--) {
      var pu = powerups[p];
      pu.y += pu.vy;
      if (pu.y &gt;= paddleY &amp;&amp; pu.y &lt;= paddleY + PH + 10 &amp;&amp; pu.x &gt;= paddleX &amp;&amp; pu.x &lt;= paddleX + PW) {
        if (pu.kind === &#x27;wide&#x27;) { PW = basePW * 1.7; wideTimer = 420; }
        else { fireTimer = 300; }
        powerups.splice(p, 1);
        continue;
      }
      if (pu.y &gt; H) powerups.splice(p, 1);
    }

    // particles
    for (var q = particles.length - 1; q &gt;= 0; q--) {
      var pt = particles[q];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life--;
      if (pt.life &lt;= 0) particles.splice(q, 1);
    }

    // popups
    for (var u = popups.length - 1; u &gt;= 0; u--) {
      popups[u].life--; popups[u].y -= 0.5;
      if (popups[u].life &lt;= 0) popups.splice(u, 1);
    }

    // stars drift
    for (var s = 0; s &lt; stars.length; s++) {
      stars[s].y += stars[s].s;
      if (stars[s].y &gt; H) { stars[s].y = 0; stars[s].x = Math.random()*W; }
    }

    // ball missed
    if (ball.y - ball.r &gt; H) {
      loseRally();
      resetBall();
      shake = Math.max(shake, 8);
    }

    if (shake &gt; 0) shake *= 0.85;
    if (shake &lt; 0.3) shake = 0;

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake &gt; 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    // stars
    for (var s = 0; s &lt; stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.5 + st.r/2;
      ctx.fillStyle = &#x27;#cfd0ff&#x27;;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    // bricks
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.shadowBlur = 10; ctx.shadowColor = b.color;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;rgba(255,255,255,0.22)&#x27;;
      ctx.fillRect(b.x+2, b.y+2, b.w-4, 3);
    }

    // particles
    for (var q = 0; q &lt; particles.length; q++) {
      var pt = particles[q];
      ctx.globalAlpha = pt.life/pt.max;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // power-ups
    for (var p = 0; p &lt; powerups.length; p++) {
      var pu = powerups[p];
      var col = pu.kind === &#x27;wide&#x27; ? &#x27;#6fffa0&#x27; : &#x27;#ff8a3d&#x27;;
      ctx.shadowBlur = 14; ctx.shadowColor = col;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(pu.x, pu.y, 9, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;#05010f&#x27;; ctx.font = &#x27;bold 11px sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.fillText(pu.kind === &#x27;wide&#x27; ? &#x27;W&#x27; : &#x27;F&#x27;, pu.x, pu.y + 0.5);
    }

    // ball tail
    for (var t = 0; t &lt; tail.length; t++) {
      var a = t / tail.length;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = fireTimer &gt; 0 ? &#x27;#ff8a3d&#x27; : &#x27;#8fd8ff&#x27;;
      ctx.beginPath(); ctx.arc(tail[t].x, tail[t].y, ball.r * a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ball
    var bc = fireTimer &gt; 0 ? &#x27;#ff8a3d&#x27; : &#x27;#ffffff&#x27;;
    ctx.shadowBlur = 18; ctx.shadowColor = fireTimer &gt; 0 ? &#x27;#ff5d1a&#x27; : &#x27;#7cc4ff&#x27;;
    ctx.fillStyle = bc;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // paddle
    var pc = wideTimer &gt; 0 ? &#x27;#6fffa0&#x27; : &#x27;#4dd2ff&#x27;;
    ctx.shadowBlur = 16; ctx.shadowColor = pc;
    ctx.fillStyle = pc;
    roundRect(paddleX, paddleY, PW, PH, 6); ctx.fill();
    ctx.shadowBlur = 0;

    // combo popups
    for (var u = 0; u &lt; popups.length; u++) {
      var po = popups[u];
      var pa = po.life / po.max;
      var scale = 1 + (1 - pa) * 0.6;
      ctx.globalAlpha = Math.min(1, pa*1.5);
      ctx.save();
      ctx.translate(po.x, po.y);
      ctx.scale(scale, scale);
      ctx.font = &#x27;bold 30px sans-serif&#x27;;
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#6fffa0&#x27;;
      ctx.fillStyle = &#x27;#6fffa0&#x27;;
      ctx.fillText(po.txt, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
    var rect = cv.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  cv.addEventListener(&#x27;touchmove&#x27;, function (e) {
    var rect = cv.getBoundingClientRect();
    var t = e.touches[0];
    mouseX = (t.clientX - rect.left) * (W / rect.width);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static frame
  buildWave(); resetBall(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
