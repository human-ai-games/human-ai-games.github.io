<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#5ce1ff,#b98bff,#ff6ad5); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,150,255,0.3); }

  canvas { border-radius: 10px; box-shadow: 0 0 26px rgba(90,120,255,0.35), inset 0 0 30px rgba(0,0,0,0.6); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALACTIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with your mouse or the &amp;larr; &amp;rarr; arrow keys to bounce the orb and smash the alien bricks. Top rows score more — clear rows before your three rockets run out. Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

var running = false, animId = null;
var score = 0, lives = 3;
var keys = {};
var flashRed = 0, gameOver = false;

// Paddle
var PW = 100, PH = 12;
var paddleX = (W - PW)/2;

// Ball
var BR = 8;
var ball = { x: W/2, y: H-80, vx: 3, vy: -3 };
var baseSpeed = 4.2;
var trail = [];

// Bricks
var COLS = 10, ROWS = 5;
var BW = 56, BH = 20, GAP = 4;
var MARGIN_X = (W - (COLS*BW + (COLS-1)*GAP))/2;
var MARGIN_Y = 34;
var bricks = [];

// Star particles
var stars = [];
function initStars(){
  stars = [];
  for (var i=0;i&lt;70;i++){
    stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.6+0.4, sp: Math.random()*0.5+0.15 });
  }
}

// Explosion particles
var particles = [];

var ROW_COLORS = [&#x27;#ff6ad5&#x27;,&#x27;#b98bff&#x27;,&#x27;#5ce1ff&#x27;,&#x27;#5cff9d&#x27;,&#x27;#ffd75c&#x27;]; // top-&gt;bottom
function pointsForRow(r){ if(r===0) return 3; if(r===1||r===2) return 2; return 1; }

function makeBrick(col,row){
  return {
    x: MARGIN_X + col*(BW+GAP),
    y: MARGIN_Y + row*(BH+GAP),
    col: col, row: row,
    color: ROW_COLORS[row % ROW_COLORS.length],
    pts: pointsForRow(row),
    alive: true, flash: 0
  };
}
function initBricks(){
  bricks = [];
  for (var r=0;r&lt;ROWS;r++)
    for (var c=0;c&lt;COLS;c++)
      bricks.push(makeBrick(c,r));
}

// If any full row is cleared, drop a new row from top and shift others down
function refillRows(){
  // count alive per row index
  var byRow = {};
  bricks.forEach(function(b){ if(b.alive){ byRow[b.row]=(byRow[b.row]||0)+1; }});
  // find lowest row (largest index) fully cleared among the standard grid
  var rowsPresent = [];
  for (var i=0;i&lt;ROWS;i++) if(byRow[i]) rowsPresent.push(i);
  if (rowsPresent.length &lt; ROWS) {
    // shift everything down by one row and add a new top row
    bricks.forEach(function(b){
      if(b.alive){ b.row += 1; b.y += (BH+GAP); }
    });
    // remove ones pushed off bottom (safety)
    bricks = bricks.filter(function(b){ return b.y + BH &lt; H - 40; });
    // add fresh top row
    for (var c=0;c&lt;COLS;c++){
      var nb = makeBrick(c,0);
      bricks.push(nb);
    }
  }
}

function resetBall(){
  ball.x = W/2; ball.y = H-80;
  var ang = (-Math.PI/2) + (Math.random()*0.8-0.4);
  var sp = baseSpeed + Math.min(score*0.02, 4);
  ball.vx = Math.cos(ang)*sp;
  ball.vy = Math.sin(ang)*sp;
  trail = [];
}

function updateLivesUI(){
  var s = &#x27;&#x27;;
  for (var i=0;i&lt;lives;i++) s += &#x27;🚀&#x27;;
  livesEl.textContent = s;
}
function bumpScore(){
  scoreEl.textContent = score;
  scoreEl.parentElement.style.transform = &#x27;scale(1.25)&#x27;;
  setTimeout(function(){ scoreEl.parentElement.style.transform=&#x27;scale(1)&#x27;; },120);
}

function spawnExplosion(x,y,color){
  for (var i=0;i&lt;10;i++){
    var a = Math.random()*Math.PI*2, s = Math.random()*3+1;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color:color });
  }
}

function step(){
  if (!running) return;

  // stars
  for (var i=0;i&lt;stars.length;i++){
    stars[i].y += stars[i].sp;
    if (stars[i].y &gt; H){ stars[i].y = 0; stars[i].x = Math.random()*W; }
  }

  if (!gameOver){
    // paddle keyboard
    if (keys[&#x27;ArrowLeft&#x27;]) paddleX -= 8;
    if (keys[&#x27;ArrowRight&#x27;]) paddleX += 8;
    paddleX = Math.max(0, Math.min(W-PW, paddleX));

    // ball
    var sp = baseSpeed + Math.min(score*0.02, 4);
    var cur = Math.hypot(ball.vx, ball.vy) || sp;
    ball.vx = ball.vx/cur*sp; ball.vy = ball.vy/cur*sp;

    trail.push({x:ball.x, y:ball.y});
    if (trail.length &gt; 10) trail.shift();

    ball.x += ball.vx; ball.y += ball.vy;

    if (ball.x - BR &lt;= 0){ ball.x = BR; ball.vx = Math.abs(ball.vx); }
    if (ball.x + BR &gt;= W){ ball.x = W-BR; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - BR &lt;= 0){ ball.y = BR; ball.vy = Math.abs(ball.vy); }

    // paddle collision
    var py = H - 22;
    if (ball.vy &gt; 0 &amp;&amp; ball.y + BR &gt;= py &amp;&amp; ball.y + BR &lt;= py + PH + 6 &amp;&amp;
        ball.x &gt;= paddleX - BR &amp;&amp; ball.x &lt;= paddleX + PW + BR){
      ball.y = py - BR;
      var hit = (ball.x - (paddleX + PW/2)) / (PW/2); // -1..1
      var speed = Math.hypot(ball.vx, ball.vy);
      var ang = -Math.PI/2 + hit*(Math.PI/3);
      ball.vx = Math.cos(ang)*speed;
      ball.vy = Math.sin(ang)*speed;
    }

    // brick collision
    for (var b=0;b&lt;bricks.length;b++){
      var br = bricks[b];
      if (!br.alive) continue;
      if (ball.x + BR &gt; br.x &amp;&amp; ball.x - BR &lt; br.x+BW &amp;&amp;
          ball.y + BR &gt; br.y &amp;&amp; ball.y - BR &lt; br.y+BH){
        br.alive = false; br.flash = 1;
        spawnExplosion(br.x+BW/2, br.y+BH/2, br.color);
        score += br.pts; bumpScore();
        // determine bounce direction
        var ox = Math.min(ball.x+BR - br.x, br.x+BW - (ball.x-BR));
        var oy = Math.min(ball.y+BR - br.y, br.y+BH - (ball.y-BR));
        if (ox &lt; oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        refillRows();
        break;
      }
    }

    // ball lost
    if (ball.y - BR &gt; H){
      lives--; updateLivesUI();
      flashRed = 1;
      if (lives &lt;= 0){ gameOver = true; }
      else resetBall();
    }
  }

  // particles
  for (var p=particles.length-1;p&gt;=0;p--){
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life -= 0.04;
    if (pt.life &lt;= 0) particles.splice(p,1);
  }
  if (flashRed &gt; 0) flashRed -= 0.05;

  draw();
  animId = requestAnimationFrame(step);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  // background
  ctx.fillStyle = &#x27;#05060f&#x27;;
  ctx.fillRect(0,0,W,H);

  // stars
  ctx.fillStyle = &#x27;#fff&#x27;;
  for (var i=0;i&lt;stars.length;i++){
    ctx.globalAlpha = 0.4 + stars[i].sp;
    ctx.fillRect(stars[i].x, stars[i].y, stars[i].s, stars[i].s);
  }
  ctx.globalAlpha = 1;

  // bricks
  for (var b=0;b&lt;bricks.length;b++){
    var br = bricks[b];
    if (!br.alive) continue;
    ctx.shadowColor = br.color; ctx.shadowBlur = 10;
    ctx.fillStyle = br.color;
    roundRect(br.x, br.y, BW, BH, 4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;rgba(255,255,255,0.25)&#x27;;
    roundRect(br.x+2, br.y+2, BW-4, 5, 2); ctx.fill();
  }

  // particles
  for (var p=0;p&lt;particles.length;p++){
    var pt = particles[p];
    ctx.globalAlpha = Math.max(pt.life,0);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // ball trail
  for (var t=0;t&lt;trail.length;t++){
    var a = t/trail.length;
    ctx.globalAlpha = a*0.5;
    ctx.fillStyle = &#x27;#8fe9ff&#x27;;
    ctx.beginPath(); ctx.arc(trail[t].x, trail[t].y, BR*a, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ball (pulsing orb)
  var pulse = 1 + Math.sin(Date.now()/120)*0.15;
  ctx.shadowColor = &#x27;#5ce1ff&#x27;; ctx.shadowBlur = 20;
  ctx.fillStyle = &#x27;#dffaff&#x27;;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BR*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // paddle (glowing)
  var py = H - 22;
  ctx.shadowColor = &#x27;#5ce1ff&#x27;; ctx.shadowBlur = 18;
  var grad = ctx.createLinearGradient(paddleX,0,paddleX+PW,0);
  grad.addColorStop(0,&#x27;#5ce1ff&#x27;); grad.addColorStop(0.5,&#x27;#b98bff&#x27;); grad.addColorStop(1,&#x27;#ff6ad5&#x27;);
  ctx.fillStyle = grad;
  roundRect(paddleX, py, PW, PH, 6); ctx.fill();
  ctx.shadowBlur = 0;

  // red flash on life loss
  if (flashRed &gt; 0){
    ctx.fillStyle = &#x27;rgba(255,40,40,&#x27;+ (flashRed*0.5) +&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  // game over
  if (gameOver){
    ctx.fillStyle = &#x27;rgba(3,4,12,0.78)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = &#x27;#ff6ad5&#x27;; ctx.shadowBlur = 24;
    ctx.fillStyle = &#x27;#ff6ad5&#x27;;
    ctx.font = &#x27;800 44px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;#e8ecff&#x27;;
    ctx.font = &#x27;600 24px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 34);
    ctx.font = &#x27;400 16px system-ui, sans-serif&#x27;;
    ctx.fillStyle = &#x27;#9fb0e0&#x27;;
    ctx.fillText(&#x27;Press Start below to play again&#x27;, W/2, H/2 + 66);
    ctx.textAlign = &#x27;left&#x27;;
  }
}

function startGame(){
  if (running) return;
  score = 0; lives = 3; gameOver = false; flashRed = 0;
  scoreEl.textContent = &#x27;0&#x27;; updateLivesUI();
  paddleX = (W-PW)/2;
  particles = [];
  initStars(); initBricks(); resetBall();
  running = true;
  animId = requestAnimationFrame(step);
}
function stopGame(){
  running = false;
  if (animId){ cancelAnimationFrame(animId); animId = null; }
}

// input
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
function moveToClientX(clientX){
  var rect = cv.getBoundingClientRect();
  var x = (clientX - rect.left) * (W / rect.width);
  paddleX = Math.max(0, Math.min(W-PW, x - PW/2));
}
cv.addEventListener(&#x27;mousemove&#x27;, function(e){ if(running &amp;&amp; !gameOver) moveToClientX(e.clientX); });
cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if(running &amp;&amp; !gameOver &amp;&amp; e.touches[0]){ moveToClientX(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static render
initStars(); initBricks(); updateLivesUI(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
