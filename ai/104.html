<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🕳️ Mole Mayhem 🔨</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #bfe6ff; color: #222; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #2e7d32; text-shadow: 1px 1px 0 #fff; }
  .instructions { font-size: 16px; color: #375; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 20px; font-weight: 600; }
  .score.gold { color: #f5a623; text-shadow: 0 0 8px rgba(245,166,35,.6); }
  .tier { font-size: 15px; color: #555; }
  .board {
    position: relative; width: 560px; height: 400px; flex-shrink: 0;
    background: linear-gradient(#7cc043, #5aa832);
    border-radius: 16px; border: 6px solid #4a8f28;
    box-shadow: inset 0 0 30px rgba(0,0,0,.15);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 14px; gap: 8px; box-sizing: border-box;
  }
  .hole {
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .burrow {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 44px; border-radius: 50%;
    background: radial-gradient(ellipse at center, #3a2414 0%, #2a1810 70%, #1c0f08 100%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,.6), 0 3px 0 #6b4a2a;
  }
  .mole {
    position: absolute; bottom: 20px; left: 50%;
    width: 62px; height: 74px;
    transform: translateX(-50%) translateY(100%);
    cursor: pointer;
    transition: transform .18s cubic-bezier(.34,1.6,.64,1);
    z-index: 2;
  }
  .mole.up { transform: translateX(-50%) translateY(0); }
  .mole.tip { transform: translateX(-50%) translateY(78%); transition: transform .3s ease; }
  .mole.squish { transform: translateX(-50%) translateY(30%) scaleY(.5) scaleX(1.2); transition: transform .12s ease; }
  .mole.missed { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(-50%) translateY(0) rotate(0); }
    25% { transform: translateX(-58%) translateY(0) rotate(-8deg); }
    75% { transform: translateX(-42%) translateY(0) rotate(8deg); }
  }
  .float {
    position: absolute; left: 50%; top: 20px; transform: translateX(-50%);
    font-weight: 800; font-size: 24px; pointer-events: none; z-index: 5;
    animation: floatUp 1s ease-out forwards; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-50px); }
  }
  .star {
    position: absolute; left: 50%; top: 30%; width: 10px; height: 10px;
    pointer-events: none; z-index: 4; font-size: 16px;
    animation: starBurst .6s ease-out forwards;
  }
  @keyframes starBurst {
    0% { opacity: 1; transform: translate(0,0) scale(.4); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); }
  }
  .combo {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0);
    font-size: 40px; font-weight: 900; color: #f5a623; z-index: 10;
    text-shadow: 0 0 12px rgba(245,166,35,.9), 2px 2px 0 #fff; pointer-events: none;
  }
  .combo.show { animation: comboPop 1.1s ease-out forwards; }
  @keyframes comboPop {
    0% { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity: 0; }
    30% { transform: translate(-50%,-50%) scale(1.3) rotate(6deg); opacity: 1; }
    70% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.1); opacity: 0; }
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35); color: #fff; font-size: 24px; font-weight: 700;
    border-radius: 12px; z-index: 20;
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🕳️ Mole Mayhem 🔨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Watch for a hard hat tipping up from a burrow, then click the mole before it dives back down — yellow=1, blue=2, red=3 (fastest!). Hit 3 in a row without missing for a gold combo bonus; the game speeds up every 10 seconds.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot; id=&quot;scoreWrap&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tier&quot;&gt;Tier &lt;span id=&quot;tier&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo-status&quot; id=&quot;comboStatus&quot; style=&quot;color:#f5a623;font-weight:700;min-width:90px;&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var board = document.getElementById(&#x27;board&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var scoreWrap = document.getElementById(&#x27;scoreWrap&#x27;);
var tierEl = document.getElementById(&#x27;tier&#x27;);
var comboStatus = document.getElementById(&#x27;comboStatus&#x27;);

var HOLES = 9;
var holes = [];
var running = false;
var score = 0;
var tier = 1;
var streak = 0;
var comboActive = false;
var spawnTimer = null, tierTimer = null;
var audioCtx = null;

// hat colors: type -&gt; {color, points, life multiplier}
var TYPES = {
  yellow: { color: &#x27;#ffd23f&#x27;, dark: &#x27;#e0a800&#x27;, points: 1, life: 1.3 },
  blue:   { color: &#x27;#3f8bff&#x27;, dark: &#x27;#1e5fd0&#x27;, points: 2, life: 1.0 },
  red:    { color: &#x27;#ff4d4d&#x27;, dark: &#x27;#c62828&#x27;, points: 3, life: 0.65 }
};

function buildBoard() {
  board.innerHTML = &#x27;&#x27;;
  holes = [];
  for (var i = 0; i &lt; HOLES; i++) {
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;
    var burrow = document.createElement(&#x27;div&#x27;);
    burrow.className = &#x27;burrow&#x27;;
    hole.appendChild(burrow);
    board.appendChild(hole);
    holes.push({ el: hole, busy: false, timeouts: [], moleEl: null });
  }
}

function moleSVG(type) {
  var t = TYPES[type];
  return &#x27;&lt;svg viewBox=&quot;0 0 62 74&quot; width=&quot;62&quot; height=&quot;74&quot;&gt;&#x27; +
    // body
    &#x27;&lt;ellipse cx=&quot;31&quot; cy=&quot;52&quot; rx=&quot;24&quot; ry=&quot;22&quot; fill=&quot;#8a6a4a&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;31&quot; cy=&quot;46&quot; rx=&quot;20&quot; ry=&quot;19&quot; fill=&quot;#a07d57&quot;/&gt;&#x27; +
    // belly
    &#x27;&lt;ellipse cx=&quot;31&quot; cy=&quot;54&quot; rx=&quot;12&quot; ry=&quot;12&quot; fill=&quot;#c9a877&quot;/&gt;&#x27; +
    // eyes
    &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;42&quot; r=&quot;4.5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;38&quot; cy=&quot;42&quot; r=&quot;4.5&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
    &#x27;&lt;circle class=&quot;pupil&quot; cx=&quot;24&quot; cy=&quot;43&quot; r=&quot;2.4&quot; fill=&quot;#222&quot;/&gt;&lt;circle class=&quot;pupil&quot; cx=&quot;38&quot; cy=&quot;43&quot; r=&quot;2.4&quot; fill=&quot;#222&quot;/&gt;&#x27; +
    // nose
    &#x27;&lt;ellipse cx=&quot;31&quot; cy=&quot;50&quot; rx=&quot;4&quot; ry=&quot;3&quot; fill=&quot;#e06a8a&quot;/&gt;&#x27; +
    // hard hat
    &#x27;&lt;path class=&quot;hat&quot; d=&quot;M12 34 Q31 8 50 34 Z&quot; fill=&quot;&#x27; + t.color + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;rect class=&quot;hat&quot; x=&quot;10&quot; y=&quot;32&quot; width=&quot;42&quot; height=&quot;5&quot; rx=&quot;2.5&quot; fill=&quot;&#x27; + t.dark + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;28&quot; y=&quot;14&quot; width=&quot;6&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;&#x27; + t.dark + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;
}

function beep(freq, dur, type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || &#x27;sine&#x27;;
    o.frequency.value = freq;
    g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

function whoosh() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = &#x27;sawtooth&#x27;;
    o.frequency.setValueAtTime(200, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.35);
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  } catch (_) {}
}

function pickType() {
  var r = Math.random();
  if (r &lt; 0.55) return &#x27;yellow&#x27;;
  if (r &lt; 0.85) return &#x27;blue&#x27;;
  return &#x27;red&#x27;;
}

function updateScore() { scoreEl.textContent = score; }

function setCombo(on) {
  comboActive = on;
  if (on) { scoreWrap.classList.add(&#x27;gold&#x27;); comboStatus.textContent = &#x27;×2 COMBO!&#x27;; }
  else { scoreWrap.classList.remove(&#x27;gold&#x27;); comboStatus.textContent = &#x27;&#x27;; }
}

function showCombo() {
  var c = document.createElement(&#x27;div&#x27;);
  c.className = &#x27;combo show&#x27;;
  c.textContent = &#x27;COMBO ×2!&#x27;;
  board.appendChild(c);
  setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 1100);
}

function spawnMole() {
  if (!running) return;
  // count free holes
  var free = holes.filter(function(h){ return !h.busy; });
  if (free.length === 0) return;
  var hole = free[Math.floor(Math.random() * free.length)];
  var type = pickType();
  var t = TYPES[type];
  hole.busy = true;

  var mole = document.createElement(&#x27;div&#x27;);
  mole.className = &#x27;mole&#x27;;
  mole.innerHTML = moleSVG(type);
  hole.el.appendChild(mole);
  hole.moleEl = mole;

  var hit = false;
  var baseLife = Math.max(500, (1500 * t.life) - (tier - 1) * 120);

  // telegraph: hat tip
  mole.classList.add(&#x27;tip&#x27;);

  var tipTimeout = setTimeout(function() {
    if (!running) return;
    mole.classList.remove(&#x27;tip&#x27;);
    mole.classList.add(&#x27;up&#x27;);
  }, 450);
  hole.timeouts.push(tipTimeout);

  function cleanup() {
    if (mole.parentNode) mole.parentNode.removeChild(mole);
    hole.busy = false; hole.moleEl = null;
    hole.timeouts.forEach(clearTimeout); hole.timeouts = [];
  }

  var lifeTimeout = setTimeout(function() {
    if (hit || !running) return;
    // missed! angry shake, shrink
    mole.classList.remove(&#x27;up&#x27;);
    mole.classList.add(&#x27;missed&#x27;);
    // frustrated eyes
    var pupils = mole.querySelectorAll(&#x27;.pupil&#x27;);
    pupils.forEach(function(p){ p.setAttribute(&#x27;r&#x27;,&#x27;1.5&#x27;); });
    streak = 0;
    setCombo(false);
    beep(150, 0.2, &#x27;square&#x27;);
    setTimeout(cleanup, 300);
  }, 450 + baseLife);
  hole.timeouts.push(lifeTimeout);

  mole.addEventListener(&#x27;click&#x27;, function(ev) {
    ev.stopPropagation();
    if (hit || !running) return;
    hit = true;
    hole.timeouts.forEach(clearTimeout); hole.timeouts = [];

    var pts = t.points * (comboActive ? 2 : 1);
    score += pts;
    updateScore();
    streak++;
    beep(type === &#x27;red&#x27; ? 660 : type === &#x27;blue&#x27; ? 520 : 420, 0.12, &#x27;triangle&#x27;);

    if (streak === 3 &amp;&amp; !comboActive) {
      setCombo(true);
      showCombo();
      beep(880, 0.3, &#x27;sine&#x27;);
    }

    // squish
    mole.classList.remove(&#x27;up&#x27;, &#x27;tip&#x27;);
    mole.classList.add(&#x27;squish&#x27;);

    // floating score
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = &#x27;+&#x27; + pts;
    f.style.color = t.color;
    hole.el.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 1000);

    // stars
    for (var i = 0; i &lt; 6; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      s.textContent = &#x27;⭐&#x27;;
      var ang = (Math.PI * 2 * i) / 6;
      s.style.setProperty(&#x27;--dx&#x27;, Math.cos(ang) * 45 + &#x27;px&#x27;);
      s.style.setProperty(&#x27;--dy&#x27;, Math.sin(ang) * 45 + &#x27;px&#x27;);
      hole.el.appendChild(s);
      (function(star){ setTimeout(function(){ if (star.parentNode) star.parentNode.removeChild(star); }, 600); })(s);
    }

    setTimeout(cleanup, 200);
  });
}

function spawnWave() {
  if (!running) return;
  var count = Math.min(4, 1 + Math.floor((tier - 1) / 1.5));
  var n = 1 + Math.floor(Math.random() * count);
  for (var i = 0; i &lt; n; i++) {
    (function(delay){ setTimeout(spawnMole, delay); })(i * 180);
  }
}

function scheduleSpawn() {
  if (!running) return;
  var interval = Math.max(500, 1200 - (tier - 1) * 120);
  spawnTimer = setTimeout(function() {
    spawnWave();
    scheduleSpawn();
  }, interval);
}

function nextTier() {
  if (!running) return;
  tier++;
  tierEl.textContent = tier;
  whoosh();
  tierTimer = setTimeout(nextTier, 10000);
}

function startGame() {
  if (running) return;
  running = true;
  score = 0; tier = 1; streak = 0;
  updateScore(); tierEl.textContent = &#x27;1&#x27;;
  setCombo(false);
  buildBoard();
  // resume audio if needed
  try { if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume(); } catch(_) {}
  spawnWave();       // immediate action
  scheduleSpawn();
  tierTimer = setTimeout(nextTier, 10000);
}

function stopGame() {
  running = false;
  if (spawnTimer) clearTimeout(spawnTimer);
  if (tierTimer) clearTimeout(tierTimer);
  holes.forEach(function(h){ h.timeouts.forEach(clearTimeout); });
}

buildBoard();

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');

  function applyFit() {
    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
