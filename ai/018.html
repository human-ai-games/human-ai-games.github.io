  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #07070f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#00eaff,#b14cff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(90,160,255,.3); }
  .instructions { font-size: 16px; color: #9aa; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .scorebar { display: flex; gap: 34px; align-items: baseline; }
  .score-big { font-size: 32px; font-weight: 800; color: #00eaff; text-shadow: 0 0 12px rgba(0,234,255,.6); }
  .best { font-size: 18px; color: #b14cff; }
  .field-wrap { position: relative; }
  .field { position: relative; width: 480px; height: 400px; background:
      radial-gradient(circle at 50% 50%, #10102a 0%, #08081a 70%);
      border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(60,90,255,.25), inset 0 0 40px rgba(40,60,160,.2);
      border: 1px solid rgba(90,120,255,.3); }
  .field.flash { animation: redflash .5s ease; }
  @keyframes redflash { 0%,100%{ box-shadow:0 0 30px rgba(60,90,255,.25);} 30%{ box-shadow:0 0 60px rgba(255,40,60,.9), inset 0 0 80px rgba(255,30,40,.6);} }
  .glowbg { position:absolute; inset:0; background:
      radial-gradient(circle at 50% 50%, rgba(80,120,255,.12), transparent 60%);
      animation: pulse 3s ease-in-out infinite; pointer-events:none; }
  @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
  .cell { position: absolute; box-sizing: border-box; }
  .seg { border-radius: 45%; box-shadow: 0 0 8px currentColor; }
  .seg.scatter { animation: shake .5s ease; }
  @keyframes shake { 0%{transform:translate(0,0) rotate(0);} 25%{transform:translate(6px,-5px) rotate(20deg);} 50%{transform:translate(-7px,6px) rotate(-25deg);} 75%{transform:translate(5px,4px) rotate(15deg);} 100%{transform:translate(-4px,-6px) rotate(-10deg); opacity:.3;} }
  .star { color:#ffd23a; text-align:center; font-weight:900; animation: starpulse 1s ease-in-out infinite; }
  @keyframes starpulse { 0%,100%{transform:scale(.8);} 50%{transform:scale(1.15);} }
  .gem { color:#ff45c8; text-align:center; font-weight:900; animation: gemflash .4s steps(2) infinite; }
  @keyframes gemflash { 0%{opacity:1;} 100%{opacity:.4;} }
  .orb { color:#37c8ff; text-align:center; font-weight:900; animation: orbpulse .8s ease-in-out infinite; }
  @keyframes orbpulse { 0%,100%{transform:scale(.85); filter:drop-shadow(0 0 4px #37c8ff);} 50%{transform:scale(1.1); filter:drop-shadow(0 0 12px #37c8ff);} }
  .spark { position:absolute; width:6px; height:6px; border-radius:50%; pointer-events:none;
           animation: fly .5s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity:0; } }
  .speedwrap { width: 480px; }
  .speedlabel { font-size:13px; color:#889; margin:2px 0; display:flex; justify-content:space-between; }
  .speedbar { height:12px; background:#161630; border-radius:6px; overflow:hidden; border:1px solid rgba(90,120,255,.3); }
  .speedfill { height:100%; width:10%; background: linear-gradient(90deg,#00eaff,#b14cff); transition: width .4s ease; box-shadow:0 0 10px rgba(0,234,255,.5); }
  .overlay { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
             background: rgba(6,6,20,.82); border-radius:10px; text-align:center; gap:8px; }
  .overlay.show { display:flex; }
  .over-title { font-size:34px; font-weight:800; color:#ff45c8; text-shadow:0 0 14px rgba(255,69,200,.6);}
  .over-score { font-size:22px; color:#00eaff; }
  .over-msg { font-size:16px; color:#bcc; max-width:360px; }
  .legend { font-size:13px; color:#99a; display:flex; gap:14px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with the arrow keys to eat collectibles: gold star = 1, pink gem = 3 (it flees!), blue orb = 5 (vanishes fast!). Avoid the walls and your own tail — you speed up every 5 points.&lt;/p&gt;
  &lt;div class=&quot;scorebar&quot;&gt;
    &lt;div class=&quot;score-big&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;Best &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;glowbg&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;over-title&quot;&gt;GAME OVER&lt;/div&gt;
        &lt;div class=&quot;over-score&quot; id=&quot;overScore&quot;&gt;Score: 0&lt;/div&gt;
        &lt;div class=&quot;over-msg&quot; id=&quot;overMsg&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;speedwrap&quot;&gt;
    &lt;div class=&quot;speedlabel&quot;&gt;&lt;span&gt;Speed&lt;/span&gt;&lt;span id=&quot;speedTxt&quot;&gt;1x&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;speedbar&quot;&gt;&lt;div class=&quot;speedfill&quot; id=&quot;speedFill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span style=&quot;color:#ffd23a&quot;&gt;★ Star +1&lt;/span&gt;
    &lt;span style=&quot;color:#ff45c8&quot;&gt;◆ Gem +3&lt;/span&gt;
    &lt;span style=&quot;color:#37c8ff&quot;&gt;● Orb +5&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 24, ROWS = 20;
  var BASE_TICK = 160, MIN_TICK = 65;
  var running = false, tickId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0, best = 0, tickCount = 0;
  var star=null, gem=null, orb=null, orbTimer=0;
  var ORB_TICKS = 5000; // recomputed from speed on spawn

  var field = document.getElementById(&#x27;field&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var speedFill = document.getElementById(&#x27;speedFill&#x27;);
  var speedTxt = document.getElementById(&#x27;speedTxt&#x27;);
  var overScore = document.getElementById(&#x27;overScore&#x27;);
  var overMsg = document.getElementById(&#x27;overMsg&#x27;);

  function occupied(x,y){
    for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    if(star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
    if(gem&amp;&amp;gem.x===x&amp;&amp;gem.y===y) return true;
    if(orb&amp;&amp;orb.x===x&amp;&amp;orb.y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function currentTick(){
    var steps = Math.floor(score/5);
    return Math.max(MIN_TICK, BASE_TICK - steps*12);
  }
  function updateSpeedBar(){
    var t = currentTick();
    var frac = (BASE_TICK - t)/(BASE_TICK - MIN_TICK); // 0..1
    speedFill.style.width = (10 + frac*90) + &#x27;%&#x27;;
    var mult = (BASE_TICK / t).toFixed(1);
    speedTxt.textContent = mult + &#x27;x&#x27;;
  }

  function spawnStar(){ star = freeCell(); }
  function spawnGem(){ gem = freeCell(); }
  function spawnOrb(){ orb = freeCell(); orbTimer = 0; }

  function initSnake(){
    snake = [{x:6,y:10},{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
  }

  function makeCell(cls,x,y){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell &#x27;+cls;
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    return el;
  }

  function paint(scatter){
    // remove existing cells/sparks except glowbg &amp; overlay
    var kids = field.querySelectorAll(&#x27;.cell&#x27;);
    for(var i=0;i&lt;kids.length;i++) kids[i].remove();

    if(star){ var s=makeCell(&#x27;star&#x27;,star.x,star.y); s.style.lineHeight=CELL+&#x27;px&#x27;; s.style.fontSize=&#x27;16px&#x27;; s.textContent=&#x27;★&#x27;; field.appendChild(s); }
    if(gem){ var g=makeCell(&#x27;gem&#x27;,gem.x,gem.y); g.style.lineHeight=CELL+&#x27;px&#x27;; g.style.fontSize=&#x27;15px&#x27;; g.textContent=&#x27;◆&#x27;; field.appendChild(g); }
    if(orb){ var o=makeCell(&#x27;orb&#x27;,orb.x,orb.y); o.style.lineHeight=CELL+&#x27;px&#x27;; o.style.fontSize=&#x27;16px&#x27;; o.textContent=&#x27;●&#x27;; field.appendChild(o); }

    var n = snake.length;
    for(var j=0;j&lt;n;j++){
      var frac = n&lt;=1?0:j/(n-1);
      var seg = makeCell(&#x27;seg&#x27;, snake[j].x, snake[j].y);
      // gradient cyan -&gt; violet
      var r = Math.round(0 + frac*(177-0));
      var gg = Math.round(234 + frac*(76-234));
      var b = Math.round(255 + frac*(255-255));
      var col = &#x27;rgb(&#x27;+r+&#x27;,&#x27;+gg+&#x27;,&#x27;+b+&#x27;)&#x27;;
      seg.style.background = col;
      seg.style.color = col;
      var pad = Math.round(frac*2);
      seg.style.margin = pad+&#x27;px&#x27;;
      seg.style.width = (CELL-pad*2)+&#x27;px&#x27;;
      seg.style.height = (CELL-pad*2)+&#x27;px&#x27;;
      if(scatter) seg.classList.add(&#x27;scatter&#x27;);
      field.appendChild(seg);
    }
  }

  function burst(x,y,color){
    var cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
    for(var i=0;i&lt;10;i++){
      var sp=document.createElement(&#x27;div&#x27;);
      sp.className=&#x27;spark&#x27;;
      sp.style.left=cx+&#x27;px&#x27;; sp.style.top=cy+&#x27;px&#x27;;
      sp.style.background=color;
      sp.style.boxShadow=&#x27;0 0 6px &#x27;+color;
      var ang=Math.random()*Math.PI*2, dist=14+Math.random()*22;
      sp.style.setProperty(&#x27;--dx&#x27;,(Math.cos(ang)*dist)+&#x27;px&#x27;);
      sp.style.setProperty(&#x27;--dy&#x27;,(Math.sin(ang)*dist)+&#x27;px&#x27;);
      field.appendChild(sp);
      (function(node){ setTimeout(function(){ if(node.parentNode) node.remove(); },520); })(sp);
    }
  }

  function tick(){
    if(!running) return;
    tickCount++;
    // gem wanders every ~4 ticks
    if(gem &amp;&amp; tickCount%4===0){
      var dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      var d=dirs[Math.floor(Math.random()*4)];
      var gx=gem.x+d.x, gy=gem.y+d.y;
      if(gx&gt;=0&amp;&amp;gx&lt;COLS&amp;&amp;gy&gt;=0&amp;&amp;gy&lt;ROWS){
        var blocked=false;
        for(var s=0;s&lt;snake.length;s++) if(snake[s].x===gx&amp;&amp;snake[s].y===gy) blocked=true;
        if(star&amp;&amp;star.x===gx&amp;&amp;star.y===gy) blocked=true;
        if(orb&amp;&amp;orb.x===gx&amp;&amp;orb.y===gy) blocked=true;
        if(!blocked) gem={x:gx,y:gy};
      }
    }
    // orb lifetime
    if(orb){
      orbTimer += currentTick();
      if(orbTimer &gt;= 5000){ spawnOrb(); }
    }

    if(!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }

    var ate = (star&amp;&amp;nx===star.x&amp;&amp;ny===star.y) || (gem&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y) || (orb&amp;&amp;nx===orb.x&amp;&amp;ny===orb.y);
    var body = ate ? snake : snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }

    snake.unshift({x:nx,y:ny});

    var grew=false;
    if(star&amp;&amp;nx===star.x&amp;&amp;ny===star.y){ score+=1; burst(nx,ny,&#x27;#ffd23a&#x27;); spawnStar(); grew=true; }
    else if(gem&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y){ score+=3; burst(nx,ny,&#x27;#ff45c8&#x27;); spawnGem(); grew=true; }
    else if(orb&amp;&amp;nx===orb.x&amp;&amp;ny===orb.y){ score+=5; burst(nx,ny,&#x27;#37c8ff&#x27;); spawnOrb(); grew=true; }

    if(grew){
      scoreEl.textContent=score;
      updateSpeedBar();
      // restart interval if speed changed
      var nt=currentTick();
      if(tickId){ clearInterval(tickId); tickId=setInterval(tick,nt); }
    } else {
      snake.pop();
    }
    paint(false);
  }

  function endGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
    if(score&gt;best){ best=score; bestEl.textContent=best; }
    field.classList.add(&#x27;flash&#x27;);
    setTimeout(function(){ field.classList.remove(&#x27;flash&#x27;); },500);
    paint(true); // scatter animation
    overScore.textContent=&#x27;Score: &#x27;+score;
    var msgs = [&#x27;Nice run! Try to beat your best.&#x27;,&#x27;So close — go again!&#x27;,&#x27;The serpent grows stronger each time.&#x27;,&#x27;Great glowing! One more round?&#x27;];
    overMsg.textContent = score&gt;=best&amp;&amp;score&gt;0 ? &#x27;New personal best! Superb.&#x27; : msgs[Math.floor(Math.random()*msgs.length)];
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    field.classList.remove(&#x27;flash&#x27;);
    score=0; tickCount=0;
    scoreEl.textContent=&#x27;0&#x27;;
    initSnake();
    spawnStar(); spawnGem(); spawnOrb();
    updateSpeedBar();
    paint(false);
    running=true;
    if(tickId) clearInterval(tickId);
    tickId=setInterval(tick,currentTick());
  }
  function stopGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static paint
  initSnake();
  spawnStar(); spawnGem(); spawnOrb();
  updateSpeedBar();
  paint(false);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
