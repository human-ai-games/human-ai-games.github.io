&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← / →, rotate with ↑, and soft-drop with ↓; the faint outline shows where it lands. Clear full rows to score — four at once is a rainbow Tetris! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;

      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div class=&quot;next-box&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;), nextBox = document.getElementById(&#x27;next&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), levelEl = document.getElementById(&#x27;level&#x27;),
      linesEl = document.getElementById(&#x27;lines&#x27;), overEl = document.getElementById(&#x27;over&#x27;),
      rainbowEl = document.getElementById(&#x27;rainbow&#x27;);

  var SHAPES = {
    I: { color:&#x27;#39d0ff&#x27;, fruit:&#x27;🍋&#x27;, rot:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]] },
    O: { color:&#x27;#ffd23f&#x27;, fruit:&#x27;🍊&#x27;, rot:[[[1,0],[2,0],[1,1],[2,1]]] },
    T: { color:&#x27;#c46bff&#x27;, fruit:&#x27;🍇&#x27;, rot:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] },
    S: { color:&#x27;#5bf074&#x27;, fruit:&#x27;🍏&#x27;, rot:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]] },
    Z: { color:&#x27;#ff5e5e&#x27;, fruit:&#x27;🍓&#x27;, rot:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]] },
    J: { color:&#x27;#5b8bff&#x27;, fruit:&#x27;🫐&#x27;, rot:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] },
    L: { color:&#x27;#ff9838&#x27;, fruit:&#x27;🍑&#x27;, rot:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }
  };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, next, score, lines, level, running, dropId, dropMs;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }
  function randKey(){ return KEYS[Math.floor(Math.random()*KEYS.length)]; }
  function makePiece(k){ return { key:k, rot:0, x:3, y:0 }; }
  function cells(p){ var s=SHAPES[p.key], cs=s.rot[p.rot%s.rot.length]; return cs.map(function(c){return {x:p.x+c[0],y:p.y+c[1]};}); }
  function collides(p){ var cs=cells(p); for(var i=0;i&lt;cs.length;i++){var x=cs[i].x,y=cs[i].y; if(x&lt;0||x&gt;=COLS||y&gt;=ROWS)return true; if(y&gt;=0&amp;&amp;grid[y][x])return true;} return false; }

  function spawn(){ piece=makePiece(next); next=randKey(); drawNext(); if(collides(piece))return false; return true; }

  function lock(){ var s=SHAPES[piece.key], cs=cells(piece); for(var i=0;i&lt;cs.length;i++){var c=cs[i]; if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS)grid[c.y][c.x]={color:s.color,fruit:s.fruit};} piece=null; }

  function findFull(){ var full=[]; for(var r=0;r&lt;ROWS;r++){var f=true;for(var c=0;c&lt;COLS;c++)if(!grid[r][c]){f=false;break;} if(f)full.push(r);} return full; }
  function removeRows(rows){ rows.sort(function(a,b){return a-b;}); for(var i=0;i&lt;rows.length;i++){ grid.splice(rows[i]-i,1); var e=[];for(var c=0;c&lt;COLS;c++)e.push(null); grid.unshift(e);} }

  function score4(n){ return [0,100,300,600,1200][n]||0; }

  function ghostPiece(){ if(!piece)return null; var g={key:piece.key,rot:piece.rot,x:piece.x,y:piece.y}; while(!collides({key:g.key,rot:g.rot,x:g.x,y:g.y+1}))g.y++; return g; }

  function paint(flashRows){
    field.innerHTML=&#x27;&#x27;;
    // ghost
    var g=ghostPiece();
    if(g){ var gc=cells(g); for(var i=0;i&lt;gc.length;i++){ if(gc[i].y&gt;=0){ var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;; el.style.left=(gc[i].x*CELL)+&#x27;px&#x27;; el.style.top=(gc[i].y*CELL)+&#x27;px&#x27;; el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;; field.appendChild(el);} } }
    // locked
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++){ if(grid[r][c]) drawCell(c,r,grid[r][c],flashRows&amp;&amp;flashRows.indexOf(r)&gt;=0); }
    // piece
    if(piece){ var s=SHAPES[piece.key], cs=cells(piece); for(var i=0;i&lt;cs.length;i++){ if(cs[i].y&gt;=0) drawCell(cs[i].x,cs[i].y,{color:s.color,fruit:s.fruit},false);} }
  }
  function drawCell(cx,cy,data,flash){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;+(flash?&#x27; flashrow&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;; el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    if(!flash){ el.style.background=data.color; el.textContent=data.fruit; }
    field.appendChild(el);
  }
  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;; var s=SHAPES[next], cs=s.rot[0];
    var minx=99,miny=99,maxx=-9,maxy=-9;
    cs.forEach(function(c){minx=Math.min(minx,c[0]);miny=Math.min(miny,c[1]);maxx=Math.max(maxx,c[0]);maxy=Math.max(maxy,c[1]);});
    var w=(maxx-minx+1),h=(maxy-miny+1), sz=18;
    var ox=(100-w*sz)/2, oy=(80-h*sz)/2;
    cs.forEach(function(c){ var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;; el.style.left=(ox+(c[0]-minx)*sz)+&#x27;px&#x27;; el.style.top=(oy+(c[1]-miny)*sz)+&#x27;px&#x27;; el.style.width=sz+&#x27;px&#x27;; el.style.height=sz+&#x27;px&#x27;; el.style.fontSize=&#x27;12px&#x27;; el.style.background=s.color; el.textContent=s.fruit; nextBox.appendChild(el); });
  }

  function afterLock(){
    var full=findFull();
    if(full.length){
      paint(full);
      var n=full.length;
      setTimeout(function(){
        removeRows(full);
        score+=score4(n); lines+=n;
        var newLevel=Math.floor(lines/10)+1;
        if(newLevel!==level){ level=newLevel; dropMs=Math.max(90,500-(level-1)*45); resetTimer(); }
        scoreEl.textContent=score; linesEl.textContent=lines; levelEl.textContent=level;
        if(n===4){ rainbowEl.classList.remove(&#x27;go&#x27;); void rainbowEl.offsetWidth; rainbowEl.classList.add(&#x27;go&#x27;); beepTetris(); } else beep(n);
        if(!spawn()){ endGame(); paint(); return; }
        paint();
      },180);
    } else {
      if(!spawn()){ endGame(); paint(); return; }
      paint();
    }
  }

  function step(){
    if(!piece)return;
    var n={key:piece.key,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(n)){ lock(); afterLock(); }
    else { piece=n; paint(); }
  }
  function move(dx){ if(!running||!piece)return; var n={key:piece.key,rot:piece.rot,x:piece.x+dx,y:piece.y}; if(!collides(n)){piece=n;paint();} }
  function rotate(){ if(!running||!piece)return; var s=SHAPES[piece.key], nr=(piece.rot+1)%s.rot.length; var kicks=[0,-1,1,-2,2]; for(var i=0;i&lt;kicks.length;i++){var n={key:piece.key,rot:nr,x:piece.x+kicks[i],y:piece.y}; if(!collides(n)){piece=n;paint();return;}} }
  function softDrop(){ if(running)step(); }

  function resetTimer(){ if(dropId)clearInterval(dropId); dropId=setInterval(step,dropMs); }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} overEl.style.display=&#x27;flex&#x27;; }
  function startGame(){ score=0;lines=0;level=1;dropMs=500;running=true; overEl.style.display=&#x27;none&#x27;; newGrid(); next=randKey(); if(!spawn())return; scoreEl.textContent=&#x27;0&#x27;;linesEl.textContent=&#x27;0&#x27;;levelEl.textContent=&#x27;1&#x27;; paint(); resetTimer(); }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  // audio
  var actx=null;
  function tone(f,d,t){ try{ if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.type=t||&#x27;square&#x27;; o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.15,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);}catch(_){} }
  function beep(n){ tone(440+n*80,.12); }
  function beepTetris(){ [523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.18,&#x27;triangle&#x27;);},i*70);}); }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){softDrop();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){rotate();e.preventDefault();}
  });
  window.addEventListener(&#x27;message&#x27;,function(e){ if(!e.data||typeof e.data!==&#x27;object&#x27;)return; if(e.data.type===&#x27;wd_start&#x27;)startGame(); else if(e.data.type===&#x27;wd_stop&#x27;)stopGame(); });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){ window.addEventListener(t,function(e){ try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){} },true); });

  // initial static view
  newGrid(); next=randKey(); piece=makePiece(&#x27;T&#x27;); drawNext(); paint();
&lt;/script&gt;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer

  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};

        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);

        kind: &#x27;iframe_error&#x27;,

        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}

    try {

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

  function init() {

    });

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
