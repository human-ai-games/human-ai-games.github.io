&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  field.style.width = (COLS*CELL)+&#x27;px&#x27;;
  field.style.height = (ROWS*CELL)+&#x27;px&#x27;;

  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;,&#x27;🍒&#x27;];
  var COLORS = [&#x27;#ff4d5e&#x27;,&#x27;#ff9b3d&#x27;,&#x27;#ffe14a&#x27;,&#x27;#b96cff&#x27;,&#x27;#ff5ea3&#x27;,&#x27;#4aff7a&#x27;,&#x27;#ff3d5e&#x27;];

  // Tetromino shapes (rotation states as coordinate lists)
  var SHAPES = [
    { c:0, rot:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]] }, // I
    { c:1, rot:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] }, // J
    { c:2, rot:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }, // L
    { c:3, rot:[[[1,0],[2,0],[1,1],[2,1]]] }, // O
    { c:4, rot:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]] }, // S
    { c:5, rot:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] }, // T
    { c:6, rot:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]] }  // Z
  ];

  var grid=[], running=false, dropId=null, speedId=null;
  var piece=null, next=null, score=0, lines=0, dropMs=650, level=0;
  var scoreEl=document.getElementById(&#x27;score&#x27;), linesEl=document.getElementById(&#x27;lines&#x27;);
  var speedEl=document.getElementById(&#x27;speed&#x27;), nextBox=document.getElementById(&#x27;nextBox&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;), ovEmoji=document.getElementById(&#x27;ovEmoji&#x27;), ovScore=document.getElementById(&#x27;ovScore&#x27;);
  var comboEl=document.getElementById(&#x27;combo&#x27;), rainbowEl=document.getElementById(&#x27;rainbow&#x27;);

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(-1);grid.push(row);} }

  function randPiece(){ var i=Math.floor(Math.random()*SHAPES.length);
    return { type:i, rot:0, x:Math.floor((COLS-4)/2), y:-1 }; }

  function cells(p){ var s=SHAPES[p.type]; var r=s.rot[p.rot%s.rot.length];
    return r.map(function(c){return {x:p.x+c[0],y:p.y+c[1],ci:s.c};}); }

  function collides(p){ var cs=cells(p);
    for(var i=0;i&lt;cs.length;i++){var c=cs[i];
      if(c.x&lt;0||c.x&gt;=COLS||c.y&gt;=ROWS)return true;
      if(c.y&gt;=0&amp;&amp;grid[c.y][c.x]&gt;=0)return true;} return false; }

  function ghostPiece(){ var g={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y};
    while(!collides({type:g.type,rot:g.rot,x:g.x,y:g.y+1}))g.y++; return g; }

  function spawn(){ piece=next||randPiece(); piece.x=Math.floor((COLS-4)/2); piece.y=-1; piece.rot=piece.rot||0;
    next=randPiece(); drawNext(); return !collides(piece); }

  function lock(){ var cs=cells(piece);
    for(var i=0;i&lt;cs.length;i++){var c=cs[i]; if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS)grid[c.y][c.x]=c.ci;} piece=null; }

  function clearRows(){ var cleared=0;
    for(var r=ROWS-1;r&gt;=0;r--){ var full=true;
      for(var c=0;c&lt;COLS;c++)if(grid[r][c]&lt;0){full=false;break;}
      if(full){ grid.splice(r,1); var e=[];for(var c2=0;c2&lt;COLS;c2++)e.push(-1); grid.unshift(e); cleared++; r++; } }
    if(cleared&gt;0){ lines+=cleared;
      var pts=[0,100,300,600,1000][cleared]; score+=pts;
      scoreEl.textContent=score; linesEl.textContent=lines;
      field.classList.add(&#x27;pulse&#x27;); setTimeout(function(){field.classList.remove(&#x27;pulse&#x27;);},300);
      beep(cleared);
      if(cleared&gt;=4){ triggerCombo(); }
      else if(cleared&gt;=2){ showCombo(cleared+&#x27; ROWS!&#x27;); }
    } }

  function triggerCombo(){ showCombo(&#x27;TETRIS!&#x27;); 
    rainbowEl.classList.remove(&#x27;go&#x27;); void rainbowEl.offsetWidth; rainbowEl.classList.add(&#x27;go&#x27;); }
  function showCombo(t){ comboEl.textContent=t; comboEl.classList.remove(&#x27;go&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;go&#x27;); }

  function drawTile(container,cx,cy,ci,ghost){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;tile&#x27;+(ghost?&#x27; ghost&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL+1)+&#x27;px&#x27;; el.style.top=(cy*CELL+1)+&#x27;px&#x27;;
    el.style.width=(CELL-2)+&#x27;px&#x27;; el.style.height=(CELL-2)+&#x27;px&#x27;;
    el.style.fontSize=(CELL-6)+&#x27;px&#x27;; el.style.background=COLORS[ci]+&#x27;44&#x27;;
    el.style.border=&#x27;1px solid &#x27;+COLORS[ci];
    el.textContent=FRUITS[ci]; container.appendChild(el); }

  function paint(){
    // remove tiles only
    var old=field.querySelectorAll(&#x27;.tile&#x27;); for(var i=0;i&lt;old.length;i++)old[i].remove();
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++)if(grid[r][c]&gt;=0)drawTile(field,c,r,grid[r][c],false);
    if(piece){ var g=ghostPiece(); cells(g).forEach(function(c){if(c.y&gt;=0)drawTile(field,c.x,c.y,c.ci,true);});
      cells(piece).forEach(function(c){if(c.y&gt;=0)drawTile(field,c.x,c.y,c.ci,false);}); }
  }

  function drawNext(){ nextBox.innerHTML=&#x27;&#x27;; if(!next)return;
    var s=SHAPES[next.type]; var r=s.rot[0];
    var minx=99,miny=99; r.forEach(function(c){minx=Math.min(minx,c[0]);miny=Math.min(miny,c[1]);});
    r.forEach(function(c){ var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;tile&#x27;;
      el.style.left=((c[0]-minx)*22+18)+&#x27;px&#x27;; el.style.top=((c[1]-miny)*22+8)+&#x27;px&#x27;;
      el.style.width=&#x27;20px&#x27;; el.style.height=&#x27;20px&#x27;; el.style.fontSize=&#x27;16px&#x27;;
      el.style.background=COLORS[s.c]+&#x27;44&#x27;; el.style.border=&#x27;1px solid &#x27;+COLORS[s.c];
      el.textContent=FRUITS[s.c]; nextBox.appendChild(el); }); }

  function stepDown(){ if(!piece)return;
    var nx={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(nx)){ lock(); clearRows(); if(!spawn()){ endGame(); paint(); return; } }
    else piece.y++; paint(); }

  function move(dx){ if(!running||!piece)return;
    var nx={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if(!collides(nx)){piece.x+=dx;paint();} }

  function rotate(){ if(!running||!piece)return;
    var nr=(piece.rot+1)%SHAPES[piece.type].rot.length;
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      var nx={type:piece.type,rot:nr,x:piece.x+kicks[k],y:piece.y};
      if(!collides(nx)){piece.rot=nr;piece.x+=kicks[k];paint();return;} } }

  function hardDrop(){ if(!running||!piece)return; stepDown(); }

  function updateSpeed(){ level++; dropMs=Math.max(120,650-level*70);
    speedEl.textContent= dropMs&gt;450?&#x27;🐢&#x27;:(dropMs&gt;250?&#x27;🐇&#x27;:&#x27;🚀&#x27;);
    if(dropId){clearInterval(dropId);dropId=setInterval(stepDown,dropMs);} }

  function endGame(){ running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(speedId){clearInterval(speedId);speedId=null;}
    field.classList.add(&#x27;shake&#x27;); setTimeout(function(){field.classList.remove(&#x27;shake&#x27;);},500);
    ovEmoji.textContent= score&gt;=1000?&#x27;🔥&#x27;:(score&gt;=400?&#x27;😊&#x27;:&#x27;😢&#x27;);
    ovScore.textContent=&#x27;Score: &#x27;+score; overlay.classList.add(&#x27;show&#x27;); }

  function startGame(){ overlay.classList.remove(&#x27;show&#x27;);
    if(dropId)clearInterval(dropId); if(speedId)clearInterval(speedId);
    score=0;lines=0;level=0;dropMs=650; scoreEl.textContent=&#x27;0&#x27;;linesEl.textContent=&#x27;0&#x27;;speedEl.textContent=&#x27;🐢&#x27;;
    newGrid(); next=randPiece(); if(!spawn())return; paint(); running=true;
    dropId=setInterval(stepDown,dropMs); speedId=setInterval(updateSpeed,10000); }

  function stopGame(){ running=false;
    if(dropId){clearInterval(dropId);dropId=null;} if(speedId){clearInterval(speedId);speedId=null;} }

  // Sound
  var AC=null;
  function beep(n){ try{ if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain(); o.connect(g);g.connect(AC.destination);
    o.type=&#x27;triangle&#x27;; o.frequency.value=330+n*120; g.gain.setValueAtTime(0.15,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.25);
    o.start(); o.stop(AC.currentTime+0.25);}catch(e){} }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){hardDrop();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;w&#x27;||e.key===&#x27;W&#x27;){rotate();e.preventDefault();}
  });
  document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;,function(){move(-1);});
  document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;,function(){move(1);});
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;,function(){rotate();});
  document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;,function(){hardDrop();});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame(); });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){ try{ window.parent.postMessage(
      {type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){} },true); });

  // initial preview
  newGrid(); next=randPiece(); piece=randPiece(); paint(); drawNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
