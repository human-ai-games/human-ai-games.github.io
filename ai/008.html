&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#0ff,#f0f,#0ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 10px rgba(0,255,255,0.3); }
  .instructions { font-size: 16px; color: #9ad; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }

  #wrap { position: relative; }
  canvas { background: #05010f; border-radius: 10px; box-shadow: 0 0 24px rgba(80,0,180,0.5); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ GALACTIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the plasma paddle with your mouse or the ← → keys to bounce the comet and smash alien bricks. Catch falling power-ups and rack up combos before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;Combo &lt;b id=&quot;combo&quot; style=&quot;color:#f0f;text-shadow:0 0 8px rgba(255,0,255,0.6)&quot;&gt;x1&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Time &lt;b id=&quot;time&quot;&gt;60&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Wave &lt;b id=&quot;wave&quot;&gt;1&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;c&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
var cv = document.getElementById(&#x27;c&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
var timeEl = document.getElementById(&#x27;time&#x27;), waveEl = document.getElementById(&#x27;wave&#x27;);

var running = false, animId = null, lastT = 0;
var score = 0, wave = 1, timeLeft = 60;
var combo = 1, comboTimer = 0;
var flash = 0, banner = null, bannerT = 0;
var destroyedCount = 0;

// paddle
var PADDLE_BASE_W = 100, PADDLE_H = 14;
var paddle = { x: W/2 - 50, w: PADDLE_BASE_W };
var keys = {};
var mouseX = null;
var wideTimer = 0;

// balls
var balls = [];
var fireTimer = 0;
var baseSpeed = 4.2;

// bricks
var bricks = [];
var BRICK_ROWS, BRICK_COLS = 10;
var BW = 56, BH = 22, BGAP = 4, BTOP = 46, BLEFT;

// stars
var stars = [];
for (var i=0;i&lt;70;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5, sp:Math.random()*0.4+0.1});

// particles &amp; ripples
var particles = [], ripples = [];

// powerups falling
var powerups = [];
var PU_TYPES = [&#x27;wide&#x27;,&#x27;fire&#x27;,&#x27;multi&#x27;];
var PU_COLORS = { wide:&#x27;#3f6&#x27;, fire:&#x27;#f80&#x27;, multi:&#x27;#4cf&#x27; };
var PU_LABEL = { wide:&#x27;W&#x27;, fire:&#x27;F&#x27;, multi:&#x27;M&#x27; };

var BRICK_COLORS = [
  {c:&#x27;#f44&#x27;, pts:50}, {c:&#x27;#fa3&#x27;, pts:40}, {c:&#x27;#ff5&#x27;, pts:30},
  {c:&#x27;#4f8&#x27;, pts:20}, {c:&#x27;#4cf&#x27;, pts:20}, {c:&#x27;#a6f&#x27;, pts:10}
];

// audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.08;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.08));
    o.stop(actx.currentTime + (dur||0.08));
  } catch(e){}
}

BLEFT = (W - (BRICK_COLS*BW + (BRICK_COLS-1)*BGAP))/2;

function buildWave() {
  bricks = [];
  BRICK_ROWS = Math.min(4 + wave, 8);
  for (var r=0; r&lt;BRICK_ROWS; r++) {
    var col = BRICK_COLORS[r % BRICK_COLORS.length];
    for (var c=0; c&lt;BRICK_COLS; c++) {
      // fun pattern: skip some for pyramid-ish edges on higher waves
      bricks.push({
        x: BLEFT + c*(BW+BGAP), y: BTOP + r*(BH+BGAP),
        w: BW, h: BH, color: col.c, pts: col.pts, alive: true,
        pu: Math.random() &lt; 0.14
      });
    }
  }
}

function spawnBall(x, y, vx, vy) {
  balls.push({ x:x, y:y, vx:vx, vy:vy, r:8 });
}

function resetBallsAndPaddle() {
  paddle.x = W/2 - PADDLE_BASE_W/2;
  paddle.w = PADDLE_BASE_W;
  balls = [];
  var ang = (Math.random()*0.6 - 0.3);
  spawnBall(W/2, H-60, baseSpeed*Math.sin(ang), -baseSpeed*Math.cos(ang));
}

function startGame() {
  if (running) return;
  score = 0; wave = 1; timeLeft = 60; combo = 1; comboTimer = 0;
  destroyedCount = 0; baseSpeed = 4.2;
  wideTimer = 0; fireTimer = 0;
  particles = []; ripples = []; powerups = [];
  flash = 0; banner = null;
  for (var k in keys) keys[k]=false;
  buildWave();
  resetBallsAndPaddle();
  updateHUD();
  showBanner(&#x27;WAVE 1!&#x27;, &#x27;#0ff&#x27;);
  running = true; lastT = performance.now();
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  if (!running) return;
  running = false;
  if (animId) cancelAnimationFrame(animId); animId = null;
}

function updateHUD() {
  scoreEl.textContent = score;
  comboEl.textContent = &#x27;x&#x27; + combo;
  timeEl.textContent = Math.ceil(timeLeft);
  waveEl.textContent = wave;
}

function showBanner(text, color) { banner = {text:text, color:color}; bannerT = 1.4; }

function addParticles(x, y, color) {
  for (var i=0;i&lt;12;i++) {
    var a = Math.random()*Math.PI*2, sp = Math.random()*3+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}
function addRipple(x,y,color){ ripples.push({x:x,y:y,r:2,life:1,color:color}); }

function hitBrick(b, ball) {
  b.alive = false;
  addParticles(b.x+b.w/2, b.y+b.h/2, b.color);
  addRipple(b.x+b.w/2, b.y+b.h/2, b.color);
  flash = 0.35;
  score += b.pts * combo;
  destroyedCount++;
  comboTimer = 1.2;
  combo = Math.min(combo+1, 9);
  if (combo &gt;= 3) showBanner(&#x27;COMBO x&#x27;+combo+&#x27;!&#x27;, &#x27;#f0f&#x27;);
  beep(400 + combo*40, 0.06, &#x27;square&#x27;, 0.06);
  if (b.pu) {
    var t = PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
    powerups.push({x:b.x+b.w/2, y:b.y+b.h/2, type:t, vy:1.6});
  }
  // speed up every 5 bricks
  if (destroyedCount % 5 === 0) {
    baseSpeed += 0.35;
    for (var i=0;i&lt;balls.length;i++){
      var bl=balls[i], mag=Math.hypot(bl.vx,bl.vy);
      var f=(mag+0.35)/mag; bl.vx*=f; bl.vy*=f;
    }
  }
}

function applyPU(type) {
  beep(700, 0.12, &#x27;triangle&#x27;, 0.09);
  if (type === &#x27;wide&#x27;) { paddle.w = PADDLE_BASE_W*1.7; wideTimer = 5; showBanner(&#x27;WIDE PADDLE!&#x27;, &#x27;#3f6&#x27;); }
  else if (type === &#x27;fire&#x27;) { fireTimer = 3; showBanner(&#x27;FIREBALL!&#x27;, &#x27;#f80&#x27;); }
  else if (type === &#x27;multi&#x27;) {
    showBanner(&#x27;MULTI-BALL!&#x27;, &#x27;#4cf&#x27;);
    var cur = balls.slice();
    for (var i=0;i&lt;cur.length;i++){
      var b=cur[i];
      spawnBall(b.x,b.y,-b.vy*0.6+b.vx*0.5, b.vy);
    }
  }
}

function loop(now) {
  if (!running) return;
  var dt = Math.min((now-lastT)/1000, 0.05); lastT = now;

  timeLeft -= dt;
  if (timeLeft &lt;= 0) { timeLeft = 0; endGame(); return; }

  // timers
  if (comboTimer &gt; 0) { comboTimer -= dt; if (comboTimer&lt;=0) combo=1; }
  if (wideTimer &gt; 0) { wideTimer -= dt; if (wideTimer&lt;=0) paddle.w = PADDLE_BASE_W; }
  if (fireTimer &gt; 0) { fireTimer -= dt; }
  if (flash &gt; 0) flash -= dt*1.2;
  if (bannerT &gt; 0) bannerT -= dt;

  // stars
  for (var i=0;i&lt;stars.length;i++){ stars[i].y += stars[i].sp*(1+wave*0.3); if(stars[i].y&gt;H){stars[i].y=0;stars[i].x=Math.random()*W;} }

  // paddle
  var PSPD = 8;
  if (keys[&#x27;ArrowLeft&#x27;]) paddle.x -= PSPD;
  if (keys[&#x27;ArrowRight&#x27;]) paddle.x += PSPD;
  if (mouseX !== null) paddle.x = mouseX - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  var pTop = H - 28;

  // balls
  for (var bi=balls.length-1; bi&gt;=0; bi--) {
    var b = balls[bi];
    b.x += b.vx; b.y += b.vy;
    if (b.x - b.r &lt;= 0) { b.x=b.r; b.vx=Math.abs(b.vx); addRipple(b.x,b.y,&#x27;#0ff&#x27;); }
    if (b.x + b.r &gt;= W) { b.x=W-b.r; b.vx=-Math.abs(b.vx); addRipple(b.x,b.y,&#x27;#0ff&#x27;); }
    if (b.y - b.r &lt;= 0) { b.y=b.r; b.vy=Math.abs(b.vy); addRipple(b.x,b.y,&#x27;#0ff&#x27;); }
    // paddle collision
    if (b.vy&gt;0 &amp;&amp; b.y+b.r &gt;= pTop &amp;&amp; b.y+b.r &lt;= pTop+PADDLE_H+8 &amp;&amp;
        b.x &gt;= paddle.x &amp;&amp; b.x &lt;= paddle.x+paddle.w) {
      var hitPos = (b.x - (paddle.x+paddle.w/2))/(paddle.w/2);
      var mag = Math.hypot(b.vx,b.vy);
      b.vx = hitPos*mag*0.8;
      b.vy = -Math.sqrt(Math.max(mag*mag - b.vx*b.vx, mag*mag*0.25));
      b.y = pTop - b.r;
      addRipple(b.x,b.y,&#x27;#0ff&#x27;);
      beep(300, 0.05, &#x27;sine&#x27;, 0.05);
    }
    // brick collision
    var fire = fireTimer&gt;0;
    for (var k=0;k&lt;bricks.length;k++){
      var br = bricks[k]; if(!br.alive) continue;
      if (b.x+b.r &gt; br.x &amp;&amp; b.x-b.r &lt; br.x+br.w &amp;&amp; b.y+b.r &gt; br.y &amp;&amp; b.y-b.r &lt; br.y+br.h) {
        if (!fire) {
          // decide bounce axis
          var overlapL = (b.x+b.r)-br.x, overlapR = (br.x+br.w)-(b.x-b.r);
          var overlapT = (b.y+b.r)-br.y, overlapB = (br.y+br.h)-(b.y-b.r);
          var minX = Math.min(overlapL,overlapR), minY = Math.min(overlapT,overlapB);
          if (minX &lt; minY) b.vx = -b.vx; else b.vy = -b.vy;
        }
        hitBrick(br, b);
        if (!fire) break;
      }
    }
    // lost ball
    if (b.y - b.r &gt; H) { balls.splice(bi,1); }
  }

  // out of balls -&gt; respawn (costs combo reset)
  if (balls.length === 0) {
    combo = 1;
    var ang=(Math.random()*0.6-0.3);
    spawnBall(paddle.x+paddle.w/2, H-60, baseSpeed*Math.sin(ang), -baseSpeed*Math.cos(ang));
  }

  // powerups
  for (var pi=powerups.length-1; pi&gt;=0; pi--){
    var p = powerups[pi]; p.y += p.vy;
    if (p.y &gt; pTop-10 &amp;&amp; p.y &lt; pTop+PADDLE_H+10 &amp;&amp; p.x &gt; paddle.x &amp;&amp; p.x &lt; paddle.x+paddle.w) {
      applyPU(p.type); powerups.splice(pi,1); continue;
    }
    if (p.y &gt; H) powerups.splice(pi,1);
  }

  // wave clear
  var anyAlive = false;
  for (var q=0;q&lt;bricks.length;q++) if(bricks[q].alive){anyAlive=true;break;}
  if (!anyAlive) {
    wave++;
    baseSpeed += 0.4;
    buildWave();
    showBanner(&#x27;WAVE &#x27;+wave+&#x27;!&#x27;, &#x27;#0ff&#x27;);
    flash = 0.5;
    beep(500,0.2,&#x27;sawtooth&#x27;,0.08);
  }

  // particles
  for (var pp=particles.length-1; pp&gt;=0; pp--){
    var pt=particles[pp]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=dt*2;
    if(pt.life&lt;=0) particles.splice(pp,1);
  }
  for (var rr=ripples.length-1; rr&gt;=0; rr--){
    var rp=ripples[rr]; rp.r+=3; rp.life-=dt*2.2;
    if(rp.life&lt;=0) ripples.splice(rr,1);
  }

  updateHUD();
  draw();
  animId = requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0,0,W,H);
  // starfield
  for (var i=0;i&lt;stars.length;i++){
    var s=stars[i]; ctx.globalAlpha=0.5+s.s*0.2;
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;

  // bricks
  for (var k=0;k&lt;bricks.length;k++){
    var b=bricks[k]; if(!b.alive) continue;
    ctx.fillStyle=b.color;
    ctx.shadowColor=b.color; ctx.shadowBlur=8;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.shadowBlur=0;
    if (b.pu){ ctx.fillStyle=&#x27;rgba(255,255,255,0.85)&#x27;; ctx.font=&#x27;bold 12px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;★&#x27;, b.x+b.w/2, b.y+b.h/2+4); }
  }

  // ripples
  for (var rr=0; rr&lt;ripples.length; rr++){
    var rp=ripples[rr]; ctx.strokeStyle=rp.color; ctx.globalAlpha=rp.life; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;

  // particles
  for (var pp=0; pp&lt;particles.length; pp++){
    var pt=particles[pp]; ctx.globalAlpha=Math.max(pt.life,0); ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-2,pt.y-2,4,4);
  }
  ctx.globalAlpha=1;

  // powerups
  for (var pi=0; pi&lt;powerups.length; pi++){
    var p=powerups[pi]; var col=PU_COLORS[p.type];
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(p.x,p.y,10,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle=&#x27;#000&#x27;; ctx.font=&#x27;bold 12px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(PU_LABEL[p.type], p.x, p.y+4);
  }

  // paddle
  var pTop = H - 28;
  var pcol = wideTimer&gt;0 ? &#x27;#3f6&#x27; : &#x27;#0ff&#x27;;
  ctx.fillStyle=pcol; ctx.shadowColor=pcol; ctx.shadowBlur=16;
  roundRect(paddle.x, pTop, paddle.w, PADDLE_H, 7); ctx.fill();
  ctx.shadowBlur=0;

  // balls
  for (var bi=0; bi&lt;balls.length; bi++){
    var b=balls[bi];
    var bc = fireTimer&gt;0 ? &#x27;#f80&#x27; : &#x27;#fff&#x27;;
    ctx.fillStyle=bc; ctx.shadowColor=bc; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // screen flash
  if (flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.35)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }

  // banner
  if (bannerT&gt;0 &amp;&amp; banner){
    ctx.globalAlpha=Math.min(bannerT,1);
    ctx.fillStyle=banner.color; ctx.font=&#x27;bold 46px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.shadowColor=banner.color; ctx.shadowBlur=20;
    ctx.fillText(banner.text, W/2, H/2);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function endGame() {
  running = false;
  if (animId) cancelAnimationFrame(animId); animId=null;
  draw();
  ctx.fillStyle=&#x27;rgba(5,1,15,0.75)&#x27;; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=&#x27;#0ff&#x27;; ctx.font=&#x27;bold 40px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
  ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=20;
  ctx.fillText(&#x27;TIME UP!&#x27;, W/2, H/2-20);
  ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;bold 26px sans-serif&#x27;;
  ctx.fillText(&#x27;Score: &#x27;+score+&#x27;   Wave: &#x27;+wave, W/2, H/2+24);
  ctx.shadowBlur=0;
  beep(200,0.4,&#x27;sawtooth&#x27;,0.08);
}

// input
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; mouseX=null; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function(e){
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W/rect.width);
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t, function(e){
    try { window.parent.postMessage({type:&#x27;game_input&#x27;, kind:t, key:e.key||null}, &#x27;*&#x27;); } catch(_){}
  }, true);
});

// initial static frame
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
