<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GALACTIC BREAKOUT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>GALACTIC BREAKOUT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff4fd8,#4ff0ff,#ffb14f); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,180,255,0.3); }
  .instructions { font-size: 16px; color: #9fb3d0; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; font-size: 20px; font-weight: 700; }
  .hud .lab { color: #6fa; text-shadow: 0 0 10px rgba(80,255,180,0.5); }
  #cv { border-radius: 10px; box-shadow: 0 0 30px rgba(80,120,255,0.25); background: #05030f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALACTIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your spaceship with the &lt;strong&gt;&amp;larr;&lt;/strong&gt; and &lt;strong&gt;&amp;rarr;&lt;/strong&gt; arrow keys (or drag with the mouse) to bounce the energy orb into the alien bricks. Clear waves for points — higher rows are worth more — using the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;SCORE&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;WAVE&lt;/span&gt; &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lab&quot;&gt;TIME&lt;/span&gt; &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 460;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), waveEl = document.getElementById(&#x27;wave&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);

  var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 22, PADDLE_SPEED = 8;
  var ORB_R = 8;
  var COLS = 9, ROWS = 5, BRICK_GAP = 5, BRICK_TOP = 50, BRICK_H = 22;
  var ROW_COLORS = [&#x27;#ff4fd8&#x27;,&#x27;#4ff0ff&#x27;,&#x27;#ffb14f&#x27;,&#x27;#5dff8f&#x27;,&#x27;#c07bff&#x27;];
  var ROW_POINTS = [50,40,30,20,10];

  var running = false, animId = null;
  var keysDown = {};
  var paddleX, orbX, orbY, orbVX, orbVY, baseSpeed;
  var score, wave, destroyed, bricks, stars, trail, shake, missFlash, missTimer;
  var timeLeft, timeAcc, lastT, ended;

  // Stars
  function initStars() {
    stars = [];
    for (var i=0;i&lt;80;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.5+0.4, sp:Math.random()*0.5+0.2});
  }

  function spawnBricks() {
    bricks = [];
    var bw = (W - BRICK_GAP*(COLS+1)) / COLS;
    for (var r=0;r&lt;ROWS;r++) {
      for (var c=0;c&lt;COLS;c++) {
        bricks.push({
          x: BRICK_GAP + c*(bw+BRICK_GAP),
          y: BRICK_TOP + r*(BRICK_H+BRICK_GAP),
          w: bw, h: BRICK_H,
          color: ROW_COLORS[r], pts: ROW_POINTS[r],
          alive: true, flash: 0
        });
      }
    }
  }

  function resetOrb() {
    orbX = W/2; orbY = H - 90;
    var ang = (-Math.PI/2) + (Math.random()*0.8 - 0.4);
    orbVX = Math.cos(ang)*baseSpeed;
    orbVY = Math.sin(ang)*baseSpeed;
    trail = [];
  }

  function startGame() {
    if (running) return;
    score = 0; wave = 1; destroyed = 0; baseSpeed = 4.2;
    paddleX = (W - PADDLE_W)/2;
    timeLeft = 60; timeAcc = 0; ended = false;
    shake = 0; missFlash = 0; missTimer = 0;
    for (var k in keysDown) keysDown[k]=false;
    initStars(); spawnBricks(); resetOrb();
    scoreEl.textContent=&#x27;0&#x27;; waveEl.textContent=&#x27;1&#x27;; timeEl.textContent=&#x27;60&#x27;;
    running = true; lastT = performance.now();
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId=null; }
  }

  function onHit() {
    destroyed++;
    if (destroyed % 10 === 0) {
      var sp = Math.hypot(orbVX,orbVY);
      var nsp = sp*1.10;
      orbVX = orbVX/sp*nsp; orbVY = orbVY/sp*nsp;
      baseSpeed = Math.min(baseSpeed*1.06, 8);
      shake = 12;
    }
  }

  function tick(now) {
    if (!running) return;
    var dt = (now - lastT)/1000; lastT = now;
    if (dt &gt; 0.05) dt = 0.05;

    // timer
    timeAcc += dt;
    if (timeAcc &gt;= 1) { timeLeft -= Math.floor(timeAcc); timeAcc -= Math.floor(timeAcc); if(timeLeft&lt;0)timeLeft=0; timeEl.textContent=timeLeft; }
    if (timeLeft &lt;= 0 &amp;&amp; !ended) { ended = true; }

    // paddle
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

    // stars
    for (var i=0;i&lt;stars.length;i++){ stars[i].y += stars[i].sp; if(stars[i].y&gt;H){stars[i].y=0;stars[i].x=Math.random()*W;} }

    if (!ended) {
      // orb
      orbX += orbVX; orbY += orbVY;
      trail.push({x:orbX,y:orbY}); if(trail.length&gt;12) trail.shift();

      if (orbX-ORB_R&lt;=0){orbX=ORB_R;orbVX=-orbVX;}
      if (orbX+ORB_R&gt;=W){orbX=W-ORB_R;orbVX=-orbVX;}
      if (orbY-ORB_R&lt;=0){orbY=ORB_R;orbVY=-orbVY;}

      // paddle collision
      var pTop = H - PADDLE_BOTTOM - PADDLE_H;
      if (orbVY&gt;0 &amp;&amp; orbY+ORB_R&gt;=pTop &amp;&amp; orbY-ORB_R&lt;=pTop+PADDLE_H &amp;&amp;
          orbX&gt;=paddleX-ORB_R &amp;&amp; orbX&lt;=paddleX+PADDLE_W+ORB_R) {
        var hitPos = (orbX - (paddleX+PADDLE_W/2))/(PADDLE_W/2); // -1..1
        var sp = Math.hypot(orbVX,orbVY);
        var ang = -Math.PI/2 + hitPos*(Math.PI/3);
        orbVX = Math.cos(ang)*sp; orbVY = Math.sin(ang)*sp;
        orbY = pTop - ORB_R;
      }

      // brick collision
      for (var b=0;b&lt;bricks.length;b++){
        var bk=bricks[b];
        if(!bk.alive) continue;
        if (orbX+ORB_R&gt;bk.x &amp;&amp; orbX-ORB_R&lt;bk.x+bk.w &amp;&amp; orbY+ORB_R&gt;bk.y &amp;&amp; orbY-ORB_R&lt;bk.y+bk.h) {
          bk.alive=false; bk.flash=8;
          score += bk.pts; scoreEl.textContent=score;
          // reflect based on penetration
          var overL = orbX+ORB_R-bk.x, overR = bk.x+bk.w-(orbX-ORB_R);
          var overT = orbY+ORB_R-bk.y, overB = bk.y+bk.h-(orbY-ORB_R);
          var minX = Math.min(overL,overR), minY = Math.min(overT,overB);
          if (minX &lt; minY) orbVX=-orbVX; else orbVY=-orbVY;
          onHit();
          break;
        }
      }

      // wave clear
      var anyAlive=false;
      for (var b2=0;b2&lt;bricks.length;b2++){ if(bricks[b2].alive){anyAlive=true;break;} }
      if (!anyAlive) { wave++; waveEl.textContent=wave; spawnBricks(); }

      // miss
      if (orbY-ORB_R&gt;H) { missFlash=1; missTimer=45; resetOrb(); }
    }

    if (missTimer&gt;0){ missTimer--; missFlash=missTimer/45; }
    if (shake&gt;0) shake--;

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.save();
    // shake
    if (shake&gt;0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }

    // bg
    ctx.fillStyle=&#x27;#05030f&#x27;; ctx.fillRect(-20,-20,W+40,H+40);
    // stars
    for (var i=0;i&lt;stars.length;i++){ var s=stars[i]; ctx.globalAlpha=0.4+s.s*0.3; ctx.fillStyle=&#x27;#cfe4ff&#x27;; ctx.fillRect(s.x,s.y,s.s,s.s); }
    ctx.globalAlpha=1;

    // bricks
    for (var b=0;b&lt;bricks.length;b++){
      var bk=bricks[b];
      if(bk.alive){
        ctx.fillStyle=bk.color; ctx.shadowColor=bk.color; ctx.shadowBlur=10;
        roundRect(bk.x,bk.y,bk.w,bk.h,4); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle=&#x27;rgba(255,255,255,0.18)&#x27;;
        roundRect(bk.x,bk.y,bk.w,bk.h/2,4); ctx.fill();
      } else if(bk.flash&gt;0){
        ctx.globalAlpha=bk.flash/8; ctx.fillStyle=&#x27;#fff&#x27;; ctx.shadowColor=&#x27;#fff&#x27;; ctx.shadowBlur=20;
        roundRect(bk.x,bk.y,bk.w,bk.h,4); ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
        bk.flash--;
      }
    }

    // trail
    for (var t=0;t&lt;trail.length;t++){
      var a=(t+1)/trail.length;
      ctx.globalAlpha=a*0.5; ctx.fillStyle=&#x27;#8ff&#x27;;
      ctx.beginPath(); ctx.arc(trail[t].x,trail[t].y,ORB_R*a,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // orb (pulse)
    var pulse = 1+0.2*Math.sin(performance.now()/100);
    ctx.shadowColor=&#x27;#6ff&#x27;; ctx.shadowBlur=25; ctx.fillStyle=&#x27;#dffcff&#x27;;
    ctx.beginPath(); ctx.arc(orbX,orbY,ORB_R*pulse,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    // paddle (spaceship)
    var pTop = H - PADDLE_BOTTOM - PADDLE_H;
    var g = ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
    g.addColorStop(0,&#x27;#4ff0ff&#x27;); g.addColorStop(0.5,&#x27;#8fdfff&#x27;); g.addColorStop(1,&#x27;#4ff0ff&#x27;);
    ctx.shadowColor=&#x27;#4ff0ff&#x27;; ctx.shadowBlur=18; ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(paddleX, pTop+PADDLE_H);
    ctx.lineTo(paddleX+14, pTop);
    ctx.lineTo(paddleX+PADDLE_W-14, pTop);
    ctx.lineTo(paddleX+PADDLE_W, pTop+PADDLE_H);
    ctx.closePath(); ctx.fill();
    // engine glow
    ctx.shadowBlur=12; ctx.fillStyle=&#x27;#ff7fd8&#x27;;
    ctx.fillRect(paddleX+PADDLE_W/2-10, pTop+PADDLE_H, 20, 4);
    ctx.shadowBlur=0;

    ctx.restore();

    // miss flash &amp; message (screen-space, no shake)
    if (missFlash&gt;0){
      ctx.fillStyle=&#x27;rgba(255,40,60,&#x27;+(missFlash*0.35)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=Math.min(1,missFlash*1.5);
      ctx.fillStyle=&#x27;#ff5a6e&#x27;; ctx.font=&#x27;bold 48px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.shadowColor=&#x27;#ff2a3e&#x27;; ctx.shadowBlur=20;
      ctx.fillText(&#x27;MISS!&#x27;, W/2, H/2);
      ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign=&#x27;left&#x27;;
    }

    if (ended){
      ctx.fillStyle=&#x27;rgba(5,3,15,0.75)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.textAlign=&#x27;center&#x27;; ctx.shadowColor=&#x27;#4ff0ff&#x27;; ctx.shadowBlur=20;
      ctx.fillStyle=&#x27;#4ff0ff&#x27;; ctx.font=&#x27;bold 40px system-ui&#x27;;
      ctx.fillText(&quot;TIME&#x27;S UP&quot;, W/2, H/2-10);
      ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;bold 26px system-ui&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27;+score, W/2, H/2+34);
      ctx.shadowBlur=0; ctx.textAlign=&#x27;left&#x27;;
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // input
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    if(!running) return;
    var rect=cv.getBoundingClientRect();
    var mx=(e.clientX-rect.left)*(W/rect.width);
    paddleX = Math.max(0, Math.min(W-PADDLE_W, mx-PADDLE_W/2));
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static frame
  initStars(); score=0; wave=1; baseSpeed=4.2; paddleX=(W-PADDLE_W)/2;
  timeLeft=60; ended=false; missFlash=0; shake=0; spawnBricks(); resetOrb();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>

    <button id="stop" disabled>Stop</button>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
