&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with ← →, rotate with ↑, and slam down with ↓ (swipe on touch). Fill full rows to score — clear several at once for big combo points!&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field-wrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;big&quot;&gt;🎉🍉🎉&lt;/div&gt;
        &lt;div class=&quot;fin&quot;&gt;Game Over!&lt;/div&gt;
        &lt;div class=&quot;sc&quot; id=&quot;finalScore&quot;&gt;0&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Press Restart below to play again&lt;/div&gt;

    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div id=&quot;nextBox&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
  var CELL = 30, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  field.style.width = (COLS*CELL)+&#x27;px&#x27;;
  field.style.height = (ROWS*CELL)+&#x27;px&#x27;;

  var scoreEl=document.getElementById(&#x27;score&#x27;), levelEl=document.getElementById(&#x27;level&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;), finalScoreEl=document.getElementById(&#x27;finalScore&#x27;);
  var nextBox=document.getElementById(&#x27;nextBox&#x27;);

  // Tetromino definitions: rotation states as list of [x,y] offsets.
  var SHAPES = {
    I: { color:&#x27;#ff5c8a&#x27;, emoji:&#x27;🍓&#x27;, rots:[ [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]], [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]] ] },
    O: { color:&#x27;#ffb043&#x27;, emoji:&#x27;🍊&#x27;, rots:[ [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]], [[1,0],[2,0],[1,1],[2,1]] ] },
    T: { color:&#x27;#c56bff&#x27;, emoji:&#x27;🍇&#x27;, rots:[ [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },
    L: { color:&#x27;#ff7a3c&#x27;, emoji:&#x27;🍎&#x27;, rots:[ [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] },
    J: { color:&#x27;#4facff&#x27;, emoji:&#x27;🍉&#x27;, rots:[ [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] },
    S: { color:&#x27;#7ed957&#x27;, emoji:&#x27;🍋&#x27;, rots:[ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]], [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]] ] },
    Z: { color:&#x27;#ff4d6d&#x27;, emoji:&#x27;🍇&#x27;, rots:[ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]] ] }
  };
  var KEYS = Object.keys(SHAPES);

  var grid=[], piece=null, next=null, score=0, level=1, running=false, dropId=null, dropMs=600;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); } }

  function randPiece(){ var k=KEYS[Math.floor(Math.random()*KEYS.length)]; return { type:k, rot:0, x:3, y:-1 }; }

  function cellsOf(p){ var offs=SHAPES[p.type].rots[p.rot]; var out=[]; for(var i=0;i&lt;offs.length;i++) out.push({x:p.x+offs[i][0], y:p.y+offs[i][1]}); return out; }

  function collides(p){ var cs=cellsOf(p); for(var i=0;i&lt;cs.length;i++){ var c=cs[i]; if(c.x&lt;0||c.x&gt;=COLS||c.y&gt;=ROWS) return true; if(c.y&gt;=0 &amp;&amp; grid[c.y][c.x]) return true; } return false; }

  function spawn(){ piece=next||randPiece(); piece.x=3; piece.y=-1; piece.rot=0; next=randPiece(); drawNext(); if(collides(piece)){ endGame(); return false; } return true; }

  function lock(){ var cs=cellsOf(piece); for(var i=0;i&lt;cs.length;i++){ var c=cs[i]; if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]={color:SHAPES[piece.type].color, emoji:SHAPES[piece.type].emoji}; } piece=null; }

  function findFullRows(){ var rows=[]; for(var r=0;r&lt;ROWS;r++){ var full=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){ full=false; break; } if(full) rows.push(r); } return rows; }

  function clearRows(rows){
    var n=rows.length;
    var pts=[0,10,30,60,100][n]||100;
    score+=pts; scoreEl.textContent=score;
    var newLevel=1+Math.floor(score/20);
    if(newLevel&gt;level){ level=newLevel; levelEl.textContent=level; dropMs=Math.max(120, 600-(level-1)*45); if(dropId){ clearInterval(dropId); dropId=setInterval(stepDown, dropMs); } }
    // remove rows top-down
    rows.sort(function(a,b){return a-b;});
    for(var i=0;i&lt;rows.length;i++){ grid.splice(rows[i],1); var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null); grid.unshift(empty); }
  }

  function flashAndClear(rows){
    // draw current grid, flash rows white, then clear
    paint();
    var els=field.querySelectorAll(&#x27;.cell&#x27;);
    els.forEach(function(el){
      var ry=parseInt(el.dataset.r,10);
      if(rows.indexOf(ry)&gt;=0) el.classList.add(&#x27;flash&#x27;);
    });
    running=false; if(dropId){ clearInterval(dropId); dropId=null; }
    setTimeout(function(){
      clearRows(rows);
      if(!spawn()){ paint(); return; }
      running=true; dropId=setInterval(stepDown, dropMs);
      paint();
    }, 180);
  }

  function drawBlock(container, cx, cy, cell, size, cls){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(cls?(&#x27; &#x27;+cls):&#x27;&#x27;);
    el.dataset.r=cy;
    el.style.left=(cx*size)+&#x27;px&#x27;; el.style.top=(cy*size)+&#x27;px&#x27;;
    el.style.width=size+&#x27;px&#x27;; el.style.height=size+&#x27;px&#x27;;
    if(cell){ el.style.background=cell.color; el.style.boxShadow=&#x27;inset 0 2px 4px rgba(255,255,255,.5), inset 0 -3px 5px rgba(0,0,0,.2)&#x27;; }
    container.appendChild(el);
    return el;
  }

  function ghostPos(){ if(!piece) return null; var g={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y}; while(!collides({type:g.type,rot:g.rot,x:g.x,y:g.y+1})) g.y++; return g; }

  function paint(){
    field.innerHTML=&#x27;&#x27;;
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawEmojiCell(field, c, r, grid[r][c], CELL);
    if(piece){
      var g=ghostPos();
      if(g){ var gcs=cellsOf(g); for(var i=0;i&lt;gcs.length;i++){ if(gcs[i].y&gt;=0) drawBlock(field, gcs[i].x, gcs[i].y, null, CELL, &#x27;ghost&#x27;); } }
      var cs=cellsOf(piece); var mid=Math.floor(cs.length/2);
      for(var j=0;j&lt;cs.length;j++){ if(cs[j].y&gt;=0) drawEmojiCell(field, cs[j].x, cs[j].y, {color:SHAPES[piece.type].color, emoji: j===1?SHAPES[piece.type].emoji:null}, CELL); }
    }
  }

  function drawEmojiCell(container, cx, cy, cell, size){
    var el=drawBlock(container, cx, cy, cell, size);
    if(cell.emoji){ var sp=document.createElement(&#x27;span&#x27;); sp.className=&#x27;emoji&#x27;; sp.style.fontSize=Math.floor(size*0.62)+&#x27;px&#x27;; sp.textContent=cell.emoji; el.appendChild(sp); }
    return el;
  }

  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;;
    var s=20;
    nextBox.style.width=(4*s)+&#x27;px&#x27;; nextBox.style.height=(4*s)+&#x27;px&#x27;;
    if(!next) return;
    var offs=SHAPES[next.type].rots[0]; var col=SHAPES[next.type].color; var em=SHAPES[next.type].emoji;
    for(var i=0;i&lt;offs.length;i++){
      var el=drawBlock(nextBox, offs[i][0], offs[i][1]+0.3, {color:col}, s);
      if(i===1){ var sp=document.createElement(&#x27;span&#x27;); sp.className=&#x27;emoji&#x27;; sp.style.fontSize=Math.floor(s*0.7)+&#x27;px&#x27;; sp.textContent=em; el.appendChild(sp); }
    }
  }

  function stepDown(){
    if(!piece){ return; }
    var nx={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(nx)){
      lock();
      var rows=findFullRows();
      if(rows.length){ flashAndClear(rows); return; }
      if(!spawn()){ paint(); return; }
    } else { piece=nx; }
    paint();
  }

  function move(dx){ if(!running||!piece) return; var nx={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y}; if(!collides(nx)){ piece=nx; paint(); } }

  function rotate(){ if(!running||!piece) return; var nr=(piece.rot+1)%4; var kicks=[0,-1,1,-2,2]; for(var i=0;i&lt;kicks.length;i++){ var nx={type:piece.type,rot:nr,x:piece.x+kicks[i],y:piece.y}; if(!collides(nx)){ piece=nx; paint(); return; } } }

  function hardDrop(){ if(!running||!piece) return; while(!collides({type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1})) piece.y++; stepDown(); }

  function endGame(){ running=false; if(dropId){ clearInterval(dropId); dropId=null; } finalScoreEl.textContent=score; overlay.classList.add(&#x27;show&#x27;); }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; level=1; dropMs=600; scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    newGrid(); next=randPiece();
    if(!spawn()) return;
    paint(); running=true;
    if(dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, dropMs);
  }
  function stopGame(){ running=false; if(dropId){ clearInterval(dropId); dropId=null; } }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(!running) return;
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ hardDrop(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });

  // Touch / swipe controls
  var tsx=0, tsy=0, tmoved=false;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; tmoved=false; }, {passive:true});
  field.addEventListener(&#x27;touchmove&#x27;, function(e){ e.preventDefault(); }, {passive:false});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    if(!running) return;
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    var ax=Math.abs(dx), ay=Math.abs(dy);
    if(ax&lt;20&amp;&amp;ay&lt;20){ rotate(); return; }
    if(ax&gt;ay){ move(dx&gt;0?1:-1); } else { if(dy&gt;0) hardDrop(); else rotate(); }
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial preview render (stopped state)
  newGrid(); next=randPiece(); piece=randPiece(); piece.x=3; piece.y=1;
  paint(); drawNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }

    init();

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
