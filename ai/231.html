  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0316; color: #eee; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;★ STAR SURFER ★&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to fire your thruster and arc over the asteroids. Grab golden stars for bonuses and keep your combo alive — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;680&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;

&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height, GROUND = H - 34;
  var running = false, animId = null, startTime = 0;
  var RUN_LEN = 60; // seconds
  var best = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.12;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch(_){}
  }

  var hero, obstacles, pickups, particles, stars, farStars, score, combo, gameOver, elapsed, shake, flash;

  function makeStars(n, layer) {
    var a = [];
    for (var i=0;i&lt;n;i++) a.push({x:Math.random()*W, y:Math.random()*GROUND, r:Math.random()*1.6+0.4, tw:Math.random()*Math.PI*2, layer:layer});
    return a;
  }

  function reset() {
    hero = { x: 110, y: GROUND - 30, vy: 0, size: 26 };
    obstacles = []; pickups = []; particles = [];
    stars = makeStars(70, 1); farStars = makeStars(45, 0.35);
    score = 0; combo = 1; gameOver = false; elapsed = 0; shake = 0; flash = 0;
    spawnTimer = 40; pickupTimer = 200;
  }

  var spawnTimer = 40, pickupTimer = 200;

  function speedFactor() {
    // ramps from 1 to ~2.2 over the run
    return 1 + Math.min(elapsed / RUN_LEN, 1) * 1.4;
  }

  function spawnObstacle() {
    var h = 24 + Math.random()*46;
    var w = 26 + Math.random()*30;
    obstacles.push({ x: W + 20, y: GROUND - h, w: w, h: h, scored:false, rot:Math.random()*Math.PI, spin:(Math.random()-0.5)*0.06 });
  }
  function spawnPickup() {
    pickups.push({ x: W + 20, y: GROUND - 90 - Math.random()*90, r: 13, got:false });
  }

  function thrust() {
    if (!running || gameOver) return;
    hero.vy = -7.2;
    // flame burst particles
    for (var i=0;i&lt;6;i++)
      particles.push({x:hero.x-14, y:hero.y+6, vx:-Math.random()*3-1, vy:(Math.random()-0.5)*2, life:16, col:&#x27;#ffb347&#x27;, r:Math.random()*4+2});
    beep(520, 0.12, &#x27;square&#x27;, 0.06);
  }

  function burst(x,y,col,n) {
    for (var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, s = Math.random()*4+1;
      particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24,col:col,r:Math.random()*3+1});
    }
  }

  function update() {
    var sf = speedFactor();
    var scroll = 3.1 * sf;

    // stars parallax
    for (var i=0;i&lt;farStars.length;i++){ var s=farStars[i]; s.x -= scroll*0.25; if(s.x&lt;0){s.x+=W;} s.tw+=0.05; }
    for (var i=0;i&lt;stars.length;i++){ var s=stars[i]; s.x -= scroll*0.6; if(s.x&lt;0){s.x+=W;} s.tw+=0.08; }

    // gravity
    hero.vy += 0.42;
    hero.y += hero.vy;
    if (hero.y &gt; GROUND - hero.size) { hero.y = GROUND - hero.size; hero.vy = 0; }
    if (hero.y &lt; 10) { hero.y = 10; hero.vy = 0; }

    // flame trail
    if (Math.random()&lt;0.7)
      particles.push({x:hero.x-14, y:hero.y+8, vx:-scroll*0.4-Math.random(), vy:(Math.random()-0.5), life:12, col:(sf&gt;1.9?&#x27;#ff5a3c&#x27;:&#x27;#ffcf5a&#x27;), r:Math.random()*3+2});

    // spawn
    spawnTimer -= sf;
    if (spawnTimer &lt;= 0) { spawnObstacle(); spawnTimer = 65 + Math.random()*45; }
    pickupTimer -= sf;
    if (pickupTimer &lt;= 0) { spawnPickup(); pickupTimer = 380 + Math.random()*260; }

    // obstacles
    for (var i=obstacles.length-1;i&gt;=0;i--){
      var o = obstacles[i];
      o.x -= scroll; o.rot += o.spin;
      if (o.x + o.w &lt; 0){ obstacles.splice(i,1); continue; }
      if (!o.scored &amp;&amp; o.x + o.w &lt; hero.x){
        o.scored = true;
        combo = Math.min(combo + 1, 4);
        score += 10 * combo;
        beep(660 + combo*80, 0.08, &#x27;triangle&#x27;, 0.05);
      }
      // collision (circle-ish vs rect)
      var hx = hero.x, hy = hero.y + hero.size/2, hr = hero.size*0.45;
      if (hx + hr &gt; o.x &amp;&amp; hx - hr &lt; o.x + o.w &amp;&amp; hy + hr &gt; o.y){
        gameOver = false; // not full game over, just hit
        // penalty: reset combo, shake, flash
        combo = 1; shake = 14; flash = 1;
        burst(hx, hy, &#x27;#ff4040&#x27;, 18);
        beep(120, 0.25, &#x27;sawtooth&#x27;, 0.12);
        obstacles.splice(i,1);
      }
    }

    // pickups
    for (var i=pickups.length-1;i&gt;=0;i--){
      var p = pickups[i];
      p.x -= scroll;
      if (p.x + p.r &lt; 0){ pickups.splice(i,1); continue; }
      var dx = p.x - hero.x, dy = p.y - (hero.y+hero.size/2);
      if (Math.sqrt(dx*dx+dy*dy) &lt; p.r + hero.size*0.4){
        score += 50 * combo;
        burst(p.x, p.y, &#x27;#ffe066&#x27;, 22);
        beep(880,0.1,&#x27;sine&#x27;,0.1); beep(1180,0.12,&#x27;sine&#x27;,0.08);
        pickups.splice(i,1);
      }
    }

    // particles
    for (var i=particles.length-1;i&gt;=0;i--){
      var pt=particles[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.life--;
      if (pt.life&lt;=0) particles.splice(i,1);
    }

    if (shake&gt;0) shake*=0.85;
    if (flash&gt;0) flash-=0.06;
    if (best &lt; score) best = score;
  }

  function draw() {
    var t = elapsed / RUN_LEN;
    // nebula gradient purple -&gt; teal, cycling
    var g = ctx.createLinearGradient(0,0,0,H);
    var hue1 = 275 - t*40, hue2 = 190 + Math.sin(elapsed*0.4)*15;
    g.addColorStop(0, &#x27;hsl(&#x27;+hue1+&#x27;,60%,14%)&#x27;);
    g.addColorStop(0.55, &#x27;hsl(&#x27;+(hue1-30)+&#x27;,55%,20%)&#x27;);
    g.addColorStop(1, &#x27;hsl(&#x27;+hue2+&#x27;,55%,16%)&#x27;);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    ctx.save();
    if (shake&gt;0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    // far stars
    for (var i=0;i&lt;farStars.length;i++){ var s=farStars[i];
      ctx.globalAlpha = 0.3 + 0.3*Math.sin(s.tw);
      ctx.fillStyle = &#x27;#9fd8ff&#x27;; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    }
    // near stars
    for (var i=0;i&lt;stars.length;i++){ var s=stars[i];
      ctx.globalAlpha = 0.5 + 0.5*Math.sin(s.tw);
      ctx.fillStyle = &#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ground glow line
    var gg = ctx.createLinearGradient(0,GROUND,0,H);
    gg.addColorStop(0,&#x27;rgba(180,90,255,0.5)&#x27;); gg.addColorStop(1,&#x27;rgba(60,20,90,0.9)&#x27;);
    ctx.fillStyle = gg; ctx.fillRect(0,GROUND,W,H-GROUND);

    // pickups (golden stars)
    for (var i=0;i&lt;pickups.length;i++){ drawStar(pickups[i].x, pickups[i].y, pickups[i].r, &#x27;#ffe066&#x27;); }

    // obstacles (asteroids)
    for (var i=0;i&lt;obstacles.length;i++){
      var o=obstacles[i];
      ctx.save(); ctx.translate(o.x+o.w/2, o.y+o.h/2); ctx.rotate(o.rot);
      ctx.fillStyle = &#x27;#8a6b5a&#x27;; ctx.strokeStyle=&#x27;#5a4438&#x27;; ctx.lineWidth=2;
      ctx.beginPath();
      var rw=o.w/2, rh=o.h/2, seg=8;
      for (var k=0;k&lt;seg;k++){
        var ang=k/seg*Math.PI*2;
        var rad=0.75+((k*37)%10)/40;
        ctx.lineTo(Math.cos(ang)*rw*rad, Math.sin(ang)*rh*rad);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=&#x27;#6b5245&#x27;;
      ctx.beginPath(); ctx.arc(-rw*0.2,-rh*0.1,rw*0.25,0,7); ctx.fill();
      ctx.restore();
    }

    // particles
    for (var i=0;i&lt;particles.length;i++){ var pt=particles[i];
      ctx.globalAlpha = Math.max(0, pt.life/24);
      ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // rocket
    drawRocket(hero.x, hero.y);

    ctx.restore();

    // red flash overlay
    if (flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,40,40,&#x27;+(flash*0.4)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }

    drawHUD();
  }

  function drawStar(x,y,r,col){
    ctx.save(); ctx.translate(x,y);
    ctx.shadowColor=col; ctx.shadowBlur=14;
    ctx.fillStyle=col; ctx.beginPath();
    for (var i=0;i&lt;10;i++){
      var ang=i/10*Math.PI*2 - Math.PI/2;
      var rad = (i%2===0)? r : r*0.45;
      ctx.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawRocket(x,y){
    var s = hero.size;
    ctx.save(); ctx.translate(x, y + s/2);
    // slight tilt from vy
    ctx.rotate(Math.max(-0.5,Math.min(0.5, hero.vy*0.04)));
    // body
    ctx.fillStyle=&#x27;#e8ecff&#x27;;
    ctx.beginPath();
    ctx.moveTo(s*0.6, 0);
    ctx.quadraticCurveTo(s*0.2, -s*0.4, -s*0.4, -s*0.35);
    ctx.lineTo(-s*0.4, s*0.35);
    ctx.quadraticCurveTo(s*0.2, s*0.4, s*0.6, 0);
    ctx.closePath(); ctx.fill();
    // fin
    ctx.fillStyle=&#x27;#ff7bd5&#x27;;
    ctx.beginPath(); ctx.moveTo(-s*0.2,-s*0.3); ctx.lineTo(-s*0.55,-s*0.5); ctx.lineTo(-s*0.35,-s*0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s*0.2,s*0.3); ctx.lineTo(-s*0.55,s*0.5); ctx.lineTo(-s*0.35,s*0.1); ctx.closePath(); ctx.fill();
    // window
    ctx.fillStyle=&#x27;#6be0ff&#x27;; ctx.beginPath(); ctx.arc(s*0.1,0,s*0.18,0,7); ctx.fill();
    ctx.restore();
  }

  function drawHUD(){
    // speedometer bar
    var sf = speedFactor(), t = (sf-1)/1.4;
    var barW = W-40, bx=20, by=8, bh=10;
    ctx.fillStyle=&#x27;rgba(0,0,0,0.4)&#x27;; roundRect(bx,by,barW,bh,5); ctx.fill();
    var col = t&lt;0.5 ? &#x27;hsl(&#x27;+(50-t*40)+&#x27;,100%,55%)&#x27; : &#x27;hsl(&#x27;+(30-(t-0.5)*60)+&#x27;,100%,52%)&#x27;;
    ctx.fillStyle=col; roundRect(bx,by,barW*t,bh,5); ctx.fill();

    ctx.textAlign=&#x27;left&#x27;; ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.font=&#x27;bold 22px system-ui&#x27;;
    ctx.fillText(&#x27;Score &#x27;+score, 20, 46);

    ctx.textAlign=&#x27;center&#x27;;
    ctx.font=&#x27;bold 30px system-ui&#x27;;
    var mc = combo&gt;=4?&#x27;#ff5a3c&#x27;:combo&gt;=2?&#x27;#ffd36b&#x27;:&#x27;#9fb4ff&#x27;;
    ctx.fillStyle=mc;
    ctx.fillText(combo+&#x27;×&#x27;, W/2, 48);

    ctx.textAlign=&#x27;right&#x27;;
    ctx.font=&#x27;14px system-ui&#x27;; ctx.fillStyle=&#x27;#b9a8d6&#x27;;
    ctx.fillText(&#x27;BEST THIS SESSION&#x27;, W-20, 32);
    ctx.font=&#x27;bold 20px system-ui&#x27;; ctx.fillStyle=&#x27;#ffe066&#x27;;
    ctx.fillText(&#x27;&#x27;+best, W-20, 52);

    // timer / end
    var remain = Math.max(0, RUN_LEN - elapsed);
    ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;14px system-ui&#x27;; ctx.fillStyle=&#x27;#cdbde8&#x27;;
    ctx.fillText(&#x27;Time: &#x27;+remain.toFixed(0)+&#x27;s&#x27;, W/2, GROUND+22);

    if (gameOver){
      ctx.fillStyle=&#x27;rgba(0,0,0,0.55)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.textAlign=&#x27;center&#x27;; ctx.fillStyle=&#x27;#ffd36b&#x27;; ctx.font=&#x27;bold 40px system-ui&#x27;;
      ctx.fillText(&#x27;RUN COMPLETE!&#x27;, W/2, H/2-10);
      ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;bold 26px system-ui&#x27;;
      ctx.fillText(&#x27;Score: &#x27;+score, W/2, H/2+30);
      ctx.fillStyle=&#x27;#b9a8d6&#x27;; ctx.font=&#x27;16px system-ui&#x27;;
      ctx.fillText(&#x27;Press Start below to fly again&#x27;, W/2, H/2+62);
    }
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  var lastT = 0;
  function loop(ts){
    if (!running) return;
    if (!lastT) lastT = ts;
    var dt = (ts - lastT)/1000; lastT = ts;
    elapsed += dt;
    if (elapsed &gt;= RUN_LEN){
      elapsed = RUN_LEN; gameOver = true;
      draw();
      running = false; animId = null;
      beep(700,0.2,&#x27;sine&#x27;,0.1);
      return;
    }
    update(); draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame(){
    reset(); running = true; lastT = 0; gameOver = false;
    if (animId) cancelAnimationFrame(animId);
    // immediate first obstacle so something moves right away
    spawnObstacle();
    animId = requestAnimationFrame(loop);
  }
  function stopGame(){
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ thrust(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;click&#x27;, thrust);

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial idle render
  reset(); draw();

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;

<script>
