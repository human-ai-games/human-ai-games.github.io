&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box;
    height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg,#7CFC00,#00e5ff,#ff9800,#e040fb);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(124,252,0,.3); }
  .instructions { font-size: 16px; color: #b9b9d6; max-width: 620px; margin: 0;
    line-height: 1.35; text-align: center; }
  .score { font-size: 22px; color: #ffe082; margin: 2px 0; font-weight: 700;
    text-shadow: 0 0 10px rgba(255,193,7,.5); transition: transform .12s; }
  .score.pop { transform: scale(1.4); }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0;
    border-radius: 12px; overflow: hidden; border: 2px solid #221a3a;
    box-shadow: 0 0 30px rgba(80,40,160,.4); background: #060314; }
  #stars, #play, #fx { position: absolute; inset: 0; }
  .lane { position: absolute; left: 0; right: 0; }

  .hero.hop { animation: hop .22s ease; }
  @keyframes hop { 0%{transform:scale(1)} 40%{transform:scale(1.35,.75)} 70%{transform:scale(.85,1.25)} 100%{transform:scale(1)} }
  .hero.dead { animation: die .8s forwards; }
  @keyframes die { 0%{transform:rotate(0) scale(1);opacity:1} 100%{transform:rotate(720deg) scale(.2);opacity:0} }
  .trail { position: absolute; font-size: 34px; z-index: 4; opacity:.6; pointer-events:none;

  @keyframes fade { to { opacity:0; transform:scale(.5); } }

    z-index: 9; opacity:0; pointer-events:none; }
  .flash.on { animation: rflash .5s; }
  @keyframes rflash { 0%{opacity:0} 20%{opacity:1} 100%{opacity:0} }

  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-8px,4px)} 40%{transform:translate(7px,-5px)} 60%{transform:translate(-5px,6px)} 80%{transform:translate(6px,-3px)} }
  .over { position:absolute; inset:0; z-index:12; display:none; flex-direction:column;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash: Galactic Crossing&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop your space frog with the arrow keys (or swipe) to dodge the alien spaceships and reach the glowing top zone. Each safe landing scores a point — but the lanes get faster the higher you climb!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;stars&quot; width=&quot;620&quot; height=&quot;432&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;play&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;fx&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;
      &lt;h2&gt;SQUASHED!&lt;/h2&gt;
      &lt;p&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
      &lt;small&gt;Press the Restart button below to play again.&lt;/small&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 62, COLS = 10, LANES = 5, ROWS = LANES + 2;
  var FIELD_W = 620, FIELD_H = 434;
  var play = document.getElementById(&#x27;play&#x27;);
  var fx = document.getElementById(&#x27;fx&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var over = document.getElementById(&#x27;over&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var scoreWrap = document.querySelector(&#x27;.score&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  var laneColors = [&#x27;#e040fb&#x27;,&#x27;#00e5ff&#x27;,&#x27;#ff9800&#x27;,&#x27;#26a69a&#x27;,&#x27;#7C4DFF&#x27;];
  var shipEmojis = [&#x27;🚀&#x27;,&#x27;🛸&#x27;,&#x27;🛰️&#x27;,&#x27;🚀&#x27;,&#x27;🛸&#x27;];
  var running = false, animId = null, score = 0;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [], heroEl = null;

  // ---- Starfield ----
  var starCv = document.getElementById(&#x27;stars&#x27;), sctx = starCv.getContext(&#x27;2d&#x27;);
  var starsArr = [];
  for (var s=0;s&lt;90;s++) starsArr.push({x:Math.random()*FIELD_W,y:Math.random()*FIELD_H,
    r:Math.random()*1.6+0.3, sp:Math.random()*0.4+0.15});
  function drawStars(){
    sctx.clearRect(0,0,FIELD_W,FIELD_H);
    for (var i=0;i&lt;starsArr.length;i++){
      var st=starsArr[i];
      st.y += st.sp; if(st.y&gt;FIELD_H){st.y=0;st.x=Math.random()*FIELD_W;}
      sctx.globalAlpha=0.4+Math.random()*0.5;
      sctx.fillStyle=&#x27;#cfe8ff&#x27;;
      sctx.beginPath(); sctx.arc(st.x,st.y,st.r,0,6.28); sctx.fill();
    }
    sctx.globalAlpha=1;
  }

  function laneY(row){ return row*CELL; }

  function buildLanes(){
    play.innerHTML=&#x27;&#x27;;
    lanes=[];
    // safe zones (top row 0, bottom row ROWS-1)
    [0, ROWS-1].forEach(function(r){
      var sz=document.createElement(&#x27;div&#x27;);
      sz.className=&#x27;lane&#x27;;
      sz.style.top=laneY(r)+&#x27;px&#x27;; sz.style.height=CELL+&#x27;px&#x27;;
      sz.style.background=&#x27;radial-gradient(ellipse at center, rgba(255,215,64,.28), rgba(255,215,64,.06))&#x27;;
      sz.style.boxShadow=&#x27;inset 0 0 20px rgba(255,215,64,.35)&#x27;;
      sz.style.animation=&#x27;pulse 2s ease-in-out infinite&#x27;;
      play.appendChild(sz);
    });
    for (var i=0;i&lt;LANES;i++){
      var row=i+1;
      var laneDiv=document.createElement(&#x27;div&#x27;);
      laneDiv.className=&#x27;lane&#x27;;
      laneDiv.style.top=laneY(row)+&#x27;px&#x27;; laneDiv.style.height=CELL+&#x27;px&#x27;;
      laneDiv.style.background=&#x27;linear-gradient(90deg, &#x27;+laneColors[i]+&#x27;11, &#x27;+laneColors[i]+&#x27;22, &#x27;+laneColors[i]+&#x27;11)&#x27;;
      laneDiv.style.borderTop=&#x27;1px solid &#x27;+laneColors[i]+&#x27;44&#x27;;
      play.appendChild(laneDiv);
      var dir=(i%2===0)?1:-1;
      var baseSpeed=1.1+i*0.35;
      var count=2+(i%2);
      var gap=FIELD_W/count;
      var ships=[];
      for (var j=0;j&lt;count;j++){
        var sizeMul=0.85+((i+j)%3)*0.35;
        var el=document.createElement(&#x27;div&#x27;);
        el.className=&#x27;ship&#x27;;
        el.textContent=shipEmojis[i];
        el.style.fontSize=Math.round(30*sizeMul)+&#x27;px&#x27;;
        el.style.height=CELL+&#x27;px&#x27;; el.style.top=laneY(row)+&#x27;px&#x27;;
        el.style.filter=&#x27;drop-shadow(0 0 8px &#x27;+laneColors[i]+&#x27;)&#x27;;
        el.style.transform=dir&gt;0?&#x27;scaleX(-1)&#x27;:&#x27;scaleX(1)&#x27;;
        var w=34*sizeMul;
        var x=j*gap+(i*40)%gap;
        el.style.left=x+&#x27;px&#x27;; el.style.width=w+&#x27;px&#x27;;
        play.appendChild(el);
        ships.push({x:x, w:w, el:el});
      }
      lanes.push({row:row, dir:dir, base:baseSpeed, ships:ships});
    }
  }

  function makeHero(){
    heroEl=document.createElement(&#x27;div&#x27;);
    heroEl.className=&#x27;hero&#x27;;
    heroEl.textContent=&#x27;🐸&#x27;;
    heroEl.style.width=CELL+&#x27;px&#x27;; heroEl.style.height=CELL+&#x27;px&#x27;;
    play.appendChild(heroEl);
  }
  function paintHero(){
    heroEl.style.left=(hero.col*CELL + (CELL-CELL)/2)+&#x27;px&#x27;;
    heroEl.style.top=(hero.row*CELL)+&#x27;px&#x27;;
    heroEl.style.width=CELL+&#x27;px&#x27;;
  }
  function resetHero(){ hero.col=Math.floor(COLS/2); hero.row=ROWS-1; paintHero(); }

  function speedMul(){ return 1 + Math.min(score*0.06, 1.6); }

  function tick(){
    if(!running) return;
    drawStars();
    var m=speedMul();
    for (var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i];
      for (var j=0;j&lt;lane.ships.length;j++){
        var sh=lane.ships[j];
        sh.x += lane.dir*lane.base*m;
        if(lane.dir&gt;0 &amp;&amp; sh.x&gt;FIELD_W) sh.x=-sh.w;
        else if(lane.dir&lt;0 &amp;&amp; sh.x+sh.w&lt;0) sh.x=FIELD_W;
        sh.el.style.left=sh.x+&#x27;px&#x27;;
      }
    }
    // collision
    var laneIdx=hero.row-1;
    if(laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES){
      var hx=hero.col*CELL, hw=CELL;
      var lane=lanes[laneIdx];
      var pad=10;
      for(var k=0;k&lt;lane.ships.length;k++){
        var sh2=lane.ships[k];
        if(hx+pad &lt; sh2.x+sh2.w &amp;&amp; hx+hw-pad &gt; sh2.x){ die(); return; }
      }
    }
    animId=requestAnimationFrame(tick);
  }

  function spawnTrail(){
    var t=document.createElement(&#x27;div&#x27;);
    t.className=&#x27;trail&#x27;; t.textContent=&#x27;🐸&#x27;;
    t.style.left=heroEl.style.left; t.style.top=heroEl.style.top;
    t.style.width=CELL+&#x27;px&#x27;; t.style.height=CELL+&#x27;px&#x27;;
    t.style.display=&#x27;flex&#x27;; t.style.alignItems=&#x27;center&#x27;; t.style.justifyContent=&#x27;center&#x27;;
    t.style.color=&#x27;#7CFC00&#x27;;
    fx.appendChild(t);
    setTimeout(function(){ if(t.parentNode)t.parentNode.removeChild(t); },400);
  }

  function burst(x,y){
    var chars=[&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;🌟&#x27;,&#x27;💫&#x27;,&#x27;🟢&#x27;,&#x27;🟣&#x27;,&#x27;🔵&#x27;];
    for(var i=0;i&lt;16;i++){
      var p=document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;;
      p.textContent=chars[i%chars.length];
      p.style.left=x+&#x27;px&#x27;; p.style.top=y+&#x27;px&#x27;;
      fx.appendChild(p);
      var ang=Math.random()*6.28, dist=40+Math.random()*70;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      (function(pp,ddx,ddy){
        pp.animate([
          {transform:&#x27;translate(0,0) scale(1)&#x27;,opacity:1},
          {transform:&#x27;translate(&#x27;+ddx+&#x27;px,&#x27;+ddy+&#x27;px) scale(0)&#x27;,opacity:0}
        ],{duration:650,easing:&#x27;ease-out&#x27;});
        setTimeout(function(){ if(pp.parentNode)pp.parentNode.removeChild(pp); },650);
      })(p,dx,dy);
    }
  }

  function beep(freq,dur,type){
    try{
      var ac=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.12,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
      o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }

  function move(dc,dr){
    if(!running) return;
    var nc=Math.max(0,Math.min(COLS-1,hero.col+dc));
    var nr=Math.max(0,Math.min(ROWS-1,hero.row+dr));
    if(nc===hero.col &amp;&amp; nr===hero.row) return;
    spawnTrail();
    hero.col=nc; hero.row=nr;
    paintHero();
    heroEl.classList.remove(&#x27;hop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hop&#x27;);
    beep(520,0.08,&#x27;sine&#x27;);
    if(hero.row===0){
      score+=1; scoreEl.textContent=score;
      scoreWrap.classList.remove(&#x27;pop&#x27;); void scoreWrap.offsetWidth; scoreWrap.classList.add(&#x27;pop&#x27;);
      var bx=hero.col*CELL+CELL/2, by=CELL/2;
      burst(bx,by);
      beep(880,0.15,&#x27;triangle&#x27;); setTimeout(function(){beep(1180,0.15,&#x27;triangle&#x27;);},90);
      resetHero();
    }
  }

  function die(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    flash.classList.remove(&#x27;on&#x27;); void flash.offsetWidth; flash.classList.add(&#x27;on&#x27;);
    field.classList.remove(&#x27;shake&#x27;); void field.offsetWidth; field.classList.add(&#x27;shake&#x27;);
    heroEl.classList.add(&#x27;dead&#x27;);
    beep(140,0.4,&#x27;sawtooth&#x27;);
    finalScoreEl.textContent=score;
    setTimeout(function(){ over.classList.add(&#x27;show&#x27;); },500);
  }

  function startGame(){
    if(running) return;
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    over.classList.remove(&#x27;show&#x27;);
    buildLanes(); makeHero(); resetHero();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){move(0,-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){move(0,1);e.preventDefault();}
  });

  // swipe gestures
  var tsx=0,tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){
    var t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY;
  },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0);
    else move(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  // pulse keyframe injection
  var st=document.createElement(&#x27;style&#x27;);
  st.textContent=&#x27;@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}&#x27;;
  document.head.appendChild(st);

  // initial paint
  drawStars();
  buildLanes(); makeHero(); paintHero();

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
