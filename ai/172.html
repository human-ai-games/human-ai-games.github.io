<style>

  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Space Frog Dash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#6cf,#f6c,#fc6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #b7b0d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #9df; margin: 0; font-weight: 700; }
  .field { position: relative; width: 640px; height: 450px; border-radius: 12px; overflow: hidden;
           background: radial-gradient(ellipse at 50% 0%, #14103a 0%, #08061c 70%, #04030e 100%);
           box-shadow: 0 0 24px rgba(120,90,255,.4), inset 0 0 40px rgba(60,40,120,.5); }
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: .8; }
  .lane-divider { position: absolute; left: 0; right: 0; height: 2px; }
  .safe { position: absolute; left: 0; right: 0; background: rgba(60,220,140,.10); }
  .lily { position: absolute; font-size: 22px; }
  .hero { position: absolute; font-size: 34px; text-align: center; line-height: 1; z-index: 5;
          filter: drop-shadow(0 0 6px #6f6); transition: left .08s, top .08s; }
  .obstacle { position: absolute; text-align: center; line-height: 1; z-index: 3; }
  .fcorner { position: absolute; top: 6px; left: 8px; font-size: 26px; z-index: 8; filter: drop-shadow(0 0 4px #6f6); }
  .redflash { position: absolute; inset: 0; background: rgba(255,40,40,.5); opacity: 0; z-index: 20; pointer-events: none; }
  .burst { position: absolute; z-index: 30; pointer-events: none; font-size: 20px; }
  .scoretext { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(0);
               font-size: 52px; font-weight: 900; z-index: 31; pointer-events: none;
               color: #ffe14d; text-shadow: 0 0 14px #f90, 0 0 6px #fff; }
  @keyframes pop { 0%{transform:translate(-50%,-50%) scale(0);} 50%{transform:translate(-50%,-50%) scale(1.3);} 100%{transform:translate(-50%,-50%) scale(1);opacity:0;} }
  @keyframes idlebounce { 0%,100%{ transform: translateY(0) scale(1,1);} 50%{ transform: translateY(-4px) scale(1.05,.95);} }
  .hero.idle { animation: idlebounce .6s ease-in-out infinite; }
  @keyframes splat { 0%{transform:rotate(0) scale(1);} 100%{transform:rotate(720deg) scale(0);} }
  .hero.splat { animation: splat .6s ease-in forwards; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.2;} }
  .hero.grace { animation: blink .15s linear infinite; }
  @keyframes warp { 0%{transform:scale(0) rotate(0);opacity:0;} 60%{transform:scale(1.4) rotate(360deg);opacity:1;} 100%{transform:scale(1);opacity:1;} }
  .hero.warp { animation: warp .4s ease-out; }
  @keyframes flyaway { to { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity: 0; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Space Frog Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop the frog with arrow keys or swipes across the alien lanes to reach the top lily-pad and score. Dodge hovercars, asteroids, and UFOs — a hit resets you to the bottom.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt; &amp;nbsp;·&amp;nbsp; Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;fcorner&quot;&gt;🐸&lt;/div&gt;
    &lt;div class=&quot;redflash&quot; id=&quot;redflash&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 64, COLS = 10, LANES = 5, ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL; // 640 x 448
  var running = false, animId = null;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [], score = 0, best = 0, grace = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
  var redflash = document.getElementById(&#x27;redflash&#x27;);
  var heroEl = null, dividerEls = [], hue = 0;

  var TYPES = {
    car:  { emoji:&#x27;🚗&#x27;, w: CELL*1.8, size:30, base:1.4 },
    ast:  { emoji:&#x27;☄️&#x27;, w: CELL*1.1, size:32, base:1.0 },
    ufo:  { emoji:&#x27;🛸&#x27;, w: CELL*0.9, size:26, base:2.4 }
  };

  function makeStars(){
    for (var i=0;i&lt;50;i++){
      var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;star&#x27;;
      var sz=Math.random()*2+1;
      s.style.width=sz+&#x27;px&#x27;; s.style.height=sz+&#x27;px&#x27;;
      s.style.left=Math.random()*FIELD_W+&#x27;px&#x27;;
      s.style.top=Math.random()*FIELD_H+&#x27;px&#x27;;
      s.style.opacity=(Math.random()*0.7+0.3);
      field.appendChild(s);
    }
  }

  function makeSafeZones(){
    [0, ROWS-1].forEach(function(r){
      var z=document.createElement(&#x27;div&#x27;); z.className=&#x27;safe&#x27;;
      z.style.top=(r*CELL)+&#x27;px&#x27;; z.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(z);
      for (var c=0;c&lt;COLS;c+=2){
        var l=document.createElement(&#x27;div&#x27;); l.className=&#x27;lily&#x27;; l.textContent=&#x27;🪷&#x27;;
        l.style.left=(c*CELL+8)+&#x27;px&#x27;; l.style.top=(r*CELL+18)+&#x27;px&#x27;;
        field.appendChild(l);
      }
    });
  }

  function makeDividers(){
    dividerEls=[];
    for (var r=1;r&lt;ROWS;r++){
      var d=document.createElement(&#x27;div&#x27;); d.className=&#x27;lane-divider&#x27;;
      d.style.top=(r*CELL)+&#x27;px&#x27;;
      field.appendChild(d); dividerEls.push(d);
    }
  }

  function buildLanes(){
    lanes.forEach(function(ln){ ln.obstacles.forEach(function(o){ if(o.el.parentNode) o.el.parentNode.removeChild(o.el); }); });
    lanes=[];
    var typeKeys=[&#x27;car&#x27;,&#x27;ast&#x27;,&#x27;ufo&#x27;,&#x27;car&#x27;,&#x27;ufo&#x27;];
    for (var i=0;i&lt;LANES;i++){
      var laneRow=i+1;
      var t=TYPES[typeKeys[i]];
      var y=laneRow*CELL;
      var dir=(i%2===0)?1:-1;
      var speed=t.base*(0.7+i*0.12);
      var count = t.w&gt;CELL*1.5 ? 2 : 3;
      var gap=FIELD_W/count;
      var obstacles=[];
      for (var j=0;j&lt;count;j++){
        var x=j*gap+(i*40)%gap;
        var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;obstacle&#x27;;
        el.textContent=t.emoji;
        el.style.fontSize=t.size+&#x27;px&#x27;;
        el.style.width=t.w+&#x27;px&#x27;;
        el.style.top=(y+(CELL-t.size)/2-2)+&#x27;px&#x27;;
        el.style.left=x+&#x27;px&#x27;;
        if (typeKeys[i]===&#x27;car&#x27; &amp;&amp; dir&lt;0) el.style.transform=&#x27;scaleX(-1)&#x27;;
        field.appendChild(el);
        obstacles.push({x:x, el:el});
      }
      lanes.push({y:y, dir:dir, speed:speed, w:t.w, size:t.size, type:typeKeys[i], obstacles:obstacles});
    }
  }

  function makeHero(){
    if (heroEl &amp;&amp; heroEl.parentNode) heroEl.parentNode.removeChild(heroEl);
    heroEl=document.createElement(&#x27;div&#x27;); heroEl.className=&#x27;hero idle&#x27;; heroEl.textContent=&#x27;🐸&#x27;;
    field.appendChild(heroEl);
  }
  function paintHero(){
    heroEl.style.left=(hero.col*CELL+(CELL-38)/2)+&#x27;px&#x27;;
    heroEl.style.top=(hero.row*CELL+(CELL-38)/2)+&#x27;px&#x27;;
  }
  function resetHero(warp){
    hero.col=Math.floor(COLS/2); hero.row=ROWS-1;
    paintHero();
    if (warp){
      heroEl.className=&#x27;hero idle warp&#x27;;
      setTimeout(function(){ if(heroEl) heroEl.classList.remove(&#x27;warp&#x27;); },420);
    }
  }

  function speedMul(){ return 1 + Math.min(score*0.06, 1.6); }

  function tick(){
    if (!running) return;
    hue=(hue+1.5)%360;
    var col=&#x27;hsl(&#x27;+hue+&#x27;,90%,60%)&#x27;;
    for (var d=0;d&lt;dividerEls.length;d++){
      dividerEls[d].style.background=&#x27;linear-gradient(90deg,transparent,&#x27;+col+&#x27;,transparent)&#x27;;
      dividerEls[d].style.boxShadow=&#x27;0 0 8px &#x27;+col;
    }
    var mul=speedMul();
    for (var i=0;i&lt;lanes.length;i++){
      var ln=lanes[i];
      for (var j=0;j&lt;ln.obstacles.length;j++){
        var o=ln.obstacles[j];
        o.x+=ln.dir*ln.speed*mul;
        if (ln.dir&gt;0 &amp;&amp; o.x&gt;FIELD_W) o.x=-ln.w;
        else if (ln.dir&lt;0 &amp;&amp; o.x+ln.w&lt;0) o.x=FIELD_W;
        var spin = ln.type===&#x27;ast&#x27; ? &#x27; rotate(&#x27;+(o.x*2%360)+&#x27;deg)&#x27; : (ln.type===&#x27;car&#x27;&amp;&amp;ln.dir&lt;0?&#x27; scaleX(-1)&#x27;:&#x27;&#x27;);
        o.el.style.left=o.x+&#x27;px&#x27;;
        o.el.style.transform=spin;
      }
    }
    if (grace&lt;=0){
      var laneIdx=hero.row-1;
      if (laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES){
        var hx=hero.col*CELL+(CELL-38)/2, hw=38;
        var ln2=lanes[laneIdx];
        for (var k=0;k&lt;ln2.obstacles.length;k++){
          var o2=ln2.obstacles[k];
          if (hx &lt; o2.x+ln2.w-6 &amp;&amp; hx+hw &gt; o2.x+6){ hit(); return; }
        }
      }
    } else grace--;
    animId=requestAnimationFrame(tick);
  }

  function move(dc,dr){
    if (!running) return;
    hero.col=Math.max(0,Math.min(COLS-1,hero.col+dc));
    hero.row=Math.max(0,Math.min(ROWS-1,hero.row+dr));
    paintHero();
    if (hero.row===0){ celebrate(); score++; scoreEl.textContent=score;
      if(score&gt;best){best=score;bestEl.textContent=best;}
      setTimeout(function(){ resetHero(true); },150);
    }
  }

  function celebrate(){
    var st=document.createElement(&#x27;div&#x27;); st.className=&#x27;scoretext&#x27;; st.textContent=&#x27;SCORE!&#x27;;
    st.style.animation=&#x27;pop .8s ease-out forwards&#x27;;
    field.appendChild(st); setTimeout(function(){ st.remove(); },800);
    var emos=[&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;🎉&#x27;,&#x27;💫&#x27;,&#x27;🌟&#x27;,&#x27;🎊&#x27;];
    for (var i=0;i&lt;18;i++){
      var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;burst&#x27;;
      b.textContent=emos[i%emos.length];
      b.style.left=(FIELD_W/2)+&#x27;px&#x27;; b.style.top=(FIELD_H*0.35)+&#x27;px&#x27;;
      var ang=Math.random()*Math.PI*2, dist=80+Math.random()*140;
      b.style.setProperty(&#x27;--dx&#x27;,(Math.cos(ang)*dist)+&#x27;px&#x27;);
      b.style.setProperty(&#x27;--dy&#x27;,(Math.sin(ang)*dist)+&#x27;px&#x27;);
      b.style.setProperty(&#x27;--rot&#x27;,(Math.random()*720-360)+&#x27;deg&#x27;);
      b.style.animation=&#x27;flyaway .9s ease-out forwards&#x27;;
      field.appendChild(b);
      (function(el){ setTimeout(function(){ el.remove(); },950); })(b);
    }
  }

  function hit(){
    redflash.style.transition=&#x27;none&#x27;; redflash.style.opacity=&#x27;1&#x27;;
    setTimeout(function(){ redflash.style.transition=&#x27;opacity .5s&#x27;; redflash.style.opacity=&#x27;0&#x27;; },30);
    heroEl.className=&#x27;hero splat&#x27;;
    running=false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    setTimeout(function(){
      resetHero(false);
      heroEl.className=&#x27;hero idle grace&#x27;;
      grace=60;
      running=true;
      animId=requestAnimationFrame(tick);
      setTimeout(function(){ if(heroEl) heroEl.classList.remove(&#x27;grace&#x27;); },1000);
    },600);
  }

  function startGame(){
    if (running) return;
    score=0; scoreEl.textContent=&#x27;0&#x27;; grace=0;
    // clear dynamic children but keep corner+redflash
    Array.prototype.slice.call(field.querySelectorAll(&#x27;.star,.safe,.lily,.lane-divider,.obstacle,.hero,.burst,.scoretext&#x27;))
      .forEach(function(n){ n.remove(); });
    lanes=[];
    makeStars(); makeSafeZones(); makeDividers(); buildLanes(); makeHero();
    resetHero(true);
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });

  // swipe support
  var tsx=0,tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20){ move(0,-1); return; }
    if (Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0); else move(0,dy&gt;0?1:-1);
  },{passive:true});
  field.addEventListener(&#x27;mousedown&#x27;, function(){ move(0,-1); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // engagement telemetry
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static paint
  makeStars(); makeSafeZones(); makeDividers(); buildLanes(); makeHero(); paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
