<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐸 Frog Fever</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Fever</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #10221a; color: #eaffea; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: #8dff6a; text-shadow: 0 2px 0 #2c5a1e; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #bfe8c0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 18px; }
  .hud .score { font-weight: 700; }
  .mult { font-size: 24px; font-weight: 900; color: #ffe14d; text-shadow: 0 0 8px #ffb200, 0 0 16px #ff8a00; transition: transform .15s; }
  .timer-wrap { width: 150px; height: 12px; background: #08130d; border-radius: 6px; overflow: hidden; border: 1px solid #234; }
  .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg,#8dff6a,#ffe14d,#ff5a4d); transition: width .1s linear; }
  .field { position: relative; width: 600px; height: 468px; flex-shrink: 0; background: #10221a; border-radius: 8px; overflow: hidden; border: 3px solid #2c5a1e; }
  .rowbg { position: absolute; left: 0; right: 0; }
  .hero { position: absolute; z-index: 20; display: flex; align-items: center; justify-content: center; font-size: 30px; transition: left .09s ease-out, top .09s ease-out; will-change: transform; }
  .hero.hop { animation: hop .18s ease-out; }
  @keyframes hop { 0%{transform:scale(1);} 40%{transform:scale(1.35,.7);} 70%{transform:scale(.85,1.2);} 100%{transform:scale(1);} }
  .hero.squish { animation: squish .35s ease-out; }
  @keyframes squish { 0%{transform:scale(1);} 100%{transform:scale(1.6,.25); opacity:.3;} }
  .obstacle { position: absolute; z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .log { background: #7a4a1e; border-radius: 8px; box-shadow: inset 0 -4px rgba(0,0,0,.25); }
  .log.wobble { animation: wob .5s ease-in-out infinite; }
  @keyframes wob { 0%,100%{transform:rotate(-2deg);} 50%{transform:rotate(2deg);} }
  .pad { background: #3ec46b; border-radius: 50%; box-shadow: inset 0 -3px rgba(0,0,0,.2); }
  .car { border-radius: 6px; }
  .flash { position: absolute; inset: 0; background: red; opacity: 0; z-index: 40; pointer-events: none; }
  .flash.on { animation: fl .35s ease-out; }
  @keyframes fl { 0%{opacity:.55;} 100%{opacity:0;} }
  .goal { position: absolute; z-index: 5; font-size: 30px; display:flex; align-items:center; justify-content:center; }
  .confetti { position: absolute; width: 8px; height: 8px; z-index: 30; pointer-events: none; border-radius: 2px; }
  .banner { position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(8,19,13,.7); font-size: 26px; font-weight: 800; color: #ffe14d; text-align:center; }
  .banner small { font-size: 16px; color: #bfe8c0; font-weight: 500; margin-top: 6px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Fever&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use arrow keys (or swipe) to hop the frog up across the road and river — ride the logs and lily pads, never touch open water or cars. Hop fast to keep your combo multiplier high and score big when you reach the top!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;mult&quot; id=&quot;mult&quot;&gt;×1&lt;/div&gt;
    &lt;div class=&quot;timer-wrap&quot;&gt;&lt;div class=&quot;timer-bar&quot; id=&quot;timerBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 52;
  var COLS = 11;          // ~572px, field is 600 so slight margin
  var ROWS = 9;           // row0 goal, rows1-3 road, row4 mid safe, rows5-7 river, row8 grass start
  var FIELD_W = 600, FIELD_H = 468;
  var CW = FIELD_W / COLS;  // column width in px
  var HERO = 30;
  var running = false, animId = null;
  var field = document.getElementById(&#x27;field&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var multEl = document.getElementById(&#x27;mult&#x27;);
  var timerBar = document.getElementById(&#x27;timerBar&#x27;);

  var score = 0, mult = 1, hopTimer = 5, lastTick = 0;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1, x: 0 };  // x is pixel for river carry
  var heroEl = null;
  var lanes = [];   // { row, type:&#x27;road&#x27;|&#x27;river&#x27;, dir, speed, items:[{x,w,el,wobble}] }

  // Row type map
  function rowType(r){
    if(r===0) return &#x27;goal&#x27;;
    if(r&gt;=1 &amp;&amp; r&lt;=3) return &#x27;road&#x27;;
    if(r===4) return &#x27;safe&#x27;;
    if(r&gt;=5 &amp;&amp; r&lt;=7) return &#x27;river&#x27;;
    return &#x27;grass&#x27;;
  }

  var CAR_COLORS = [&#x27;#ff5a4d&#x27;,&#x27;#ffb200&#x27;,&#x27;#4db6ff&#x27;,&#x27;#c04dff&#x27;,&#x27;#ff4dcb&#x27;];

  function clearField(){
    // remove all except flash &amp; banner
    var kids = Array.prototype.slice.call(field.children);
    kids.forEach(function(k){ if(k!==flash &amp;&amp; k!==banner) field.removeChild(k); });
  }

  function buildBackground(){
    for(var r=0;r&lt;ROWS;r++){
      var t=rowType(r);
      var bg=document.createElement(&#x27;div&#x27;);
      bg.className=&#x27;rowbg&#x27;;
      bg.style.top=(r*CELL)+&#x27;px&#x27;;
      bg.style.height=CELL+&#x27;px&#x27;;
      if(t===&#x27;goal&#x27;) bg.style.background=&#x27;#1e5a2c&#x27;;
      else if(t===&#x27;road&#x27;) bg.style.background = (r%2? &#x27;#3a3a3a&#x27;:&#x27;#333&#x27;);
      else if(t===&#x27;safe&#x27;) bg.style.background=&#x27;#2c5a1e&#x27;;
      else if(t===&#x27;river&#x27;) bg.style.background=&#x27;#1c4e8a&#x27;;
      else bg.style.background=&#x27;#2c5a1e&#x27;;
      field.appendChild(bg);
      if(t===&#x27;road&#x27;){
        // dashed lane line
        var line=document.createElement(&#x27;div&#x27;);
        line.className=&#x27;rowbg&#x27;;
        line.style.top=(r*CELL + CELL/2 -1)+&#x27;px&#x27;;
        line.style.height=&#x27;2px&#x27;;
        line.style.background=&#x27;repeating-linear-gradient(90deg,#ffd54d 0 20px,transparent 20px 40px)&#x27;;
        field.appendChild(line);
      }
    }
    // goal lily pads
    for(var c=0;c&lt;COLS;c+=2){
      var g=document.createElement(&#x27;div&#x27;);
      g.className=&#x27;goal&#x27;;
      g.textContent=&#x27;🌸&#x27;;
      g.style.left=(c*CW)+&#x27;px&#x27;;
      g.style.top=&#x27;0px&#x27;;
      g.style.width=CW+&#x27;px&#x27;;
      g.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(g);
    }
  }

  function buildLanes(){
    lanes=[];
    for(var r=1;r&lt;ROWS;r++){
      var t=rowType(r);
      if(t!==&#x27;road&#x27; &amp;&amp; t!==&#x27;river&#x27;) continue;
      var dir = (r%2===0)?1:-1;
      var speedFactor = t===&#x27;road&#x27; ? (1.0 + (score/500)) : 1.0;
      var lane={ row:r, type:t, dir:dir, items:[] };
      var y = r*CELL;
      if(t===&#x27;road&#x27;){
        var base = 0.9 + Math.random()*1.4;
        lane.speed = base * speedFactor;
        var count = 2 + (r%2);
        var gap = FIELD_W/count;
        for(var j=0;j&lt;count;j++){
          var isTruck = Math.random()&lt;0.35;
          var w = isTruck? CW*1.8 : CW*1.1;
          var el=document.createElement(&#x27;div&#x27;);
          el.className=&#x27;obstacle car&#x27;;
          el.style.width=w+&#x27;px&#x27;; el.style.height=(CELL-16)+&#x27;px&#x27;;
          el.style.top=(y+8)+&#x27;px&#x27;;
          el.style.background=CAR_COLORS[(r+j)%CAR_COLORS.length];
          el.textContent = isTruck? &#x27;🚚&#x27;:&#x27;🚗&#x27;;
          field.appendChild(el);
          var x=j*gap + Math.random()*gap*0.5;
          el.style.left=x+&#x27;px&#x27;;
          lane.items.push({x:x,w:w,el:el});
        }
      } else { // river
        lane.speed = 0.7 + Math.random()*1.1;
        var count2 = 2 + (r%2);
        var gap2 = FIELD_W/count2;
        for(var k=0;k&lt;count2;k++){
          var isPad = Math.random()&lt;0.4;
          var w2 = isPad? CW*0.95 : (Math.random()&lt;0.5? CW*1.3 : CW*2.2);
          var el2=document.createElement(&#x27;div&#x27;);
          el2.className=&#x27;obstacle &#x27; + (isPad? &#x27;pad&#x27;:&#x27;log&#x27;);
          var wobble = !isPad &amp;&amp; w2 &lt; CW*1.6;
          if(wobble) el2.classList.add(&#x27;wobble&#x27;);
          el2.style.width=w2+&#x27;px&#x27;; el2.style.height=(CELL-14)+&#x27;px&#x27;;
          el2.style.top=(y+7)+&#x27;px&#x27;;
          field.appendChild(el2);
          var x2=k*gap2 + Math.random()*gap2*0.4;
          el2.style.left=x2+&#x27;px&#x27;;
          lane.items.push({x:x2,w:w2,el:el2});
        }
      }
      lanes.push(lane);
    }
  }

  function makeHero(){
    heroEl=document.createElement(&#x27;div&#x27;);
    heroEl.className=&#x27;hero&#x27;;
    heroEl.textContent=&#x27;🐸&#x27;;
    heroEl.style.width=CW+&#x27;px&#x27;;
    heroEl.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(heroEl);
  }

  function heroPixelX(){ return hero.col*CW; }
  function paintHero(){
    heroEl.style.left = hero.x + &#x27;px&#x27;;
    heroEl.style.top = (hero.row*CELL) + &#x27;px&#x27;;
  }

  function resetHero(){
    hero.col=Math.floor(COLS/2);
    hero.row=ROWS-1;
    hero.x=heroPixelX();
    paintHero();
  }

  function laneAtRow(r){
    for(var i=0;i&lt;lanes.length;i++) if(lanes[i].row===r) return lanes[i];
    return null;
  }

  function popHop(){
    heroEl.classList.remove(&#x27;hop&#x27;);
    void heroEl.offsetWidth;
    heroEl.classList.add(&#x27;hop&#x27;);
  }

  function move(dc,dr){
    if(!running) return;
    var nc = Math.max(0, Math.min(COLS-1, hero.col+dc));
    var nr = Math.max(0, Math.min(ROWS-1, hero.row+dr));
    hero.col=nc; hero.row=nr;
    hero.x = hero.col*CW;
    paintHero();
    popHop();
    if(dr&lt;0){ hopTimer = Math.min(5, hopTimer); } // moving up keeps momentum
    if(hero.row===0){ succeed(); }
  }

  function succeed(){
    var gain = 100*mult;
    score += gain;
    scoreEl.textContent = score;
    confettiBurst(hero.x + CW/2, 10);
    mult = Math.min(5, mult+1);
    updateMult();
    hopTimer = 5;
    // rebuild road speeds with new score difficulty then respawn
    resetHero();
  }

  function updateMult(){
    multEl.textContent=&#x27;×&#x27;+mult;
    multEl.style.transform=&#x27;scale(1.4)&#x27;;
    setTimeout(function(){ if(multEl) multEl.style.transform=&#x27;scale(1)&#x27;; },150);
  }

  function loseLife(){
    // squish + flash
    heroEl.classList.add(&#x27;squish&#x27;);
    flash.classList.remove(&#x27;on&#x27;); void flash.offsetWidth; flash.classList.add(&#x27;on&#x27;);
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    setTimeout(function(){
      if(!heroEl) return;
      heroEl.classList.remove(&#x27;squish&#x27;);
      mult=1; updateMult();
      hopTimer=5;
      resetHero();
      running=true;
      lastTick=performance.now();
      animId=requestAnimationFrame(tick);
    },380);
  }

  function confettiBurst(cx,cy){
    var colors=[&#x27;#ffe14d&#x27;,&#x27;#ff5a4d&#x27;,&#x27;#4db6ff&#x27;,&#x27;#8dff6a&#x27;,&#x27;#ff4dcb&#x27;];
    for(var i=0;i&lt;18;i++){
      (function(){
        var p=document.createElement(&#x27;div&#x27;);
        p.className=&#x27;confetti&#x27;;
        p.style.background=colors[i%colors.length];
        p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
        field.appendChild(p);
        var ang=Math.random()*Math.PI*2, sp=2+Math.random()*4;
        var vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp-2;
        var px=cx,py=cy,life=0;
        function step(){
          life++; vy+=0.25; px+=vx; py+=vy;
          p.style.left=px+&#x27;px&#x27;; p.style.top=py+&#x27;px&#x27;;
          p.style.opacity=(1-life/40);
          if(life&lt;40) requestAnimationFrame(step);
          else if(p.parentNode) p.parentNode.removeChild(p);
        }
        requestAnimationFrame(step);
      })();
    }
  }

  function tick(now){
    if(!running) return;
    var dt = now-lastTick; lastTick=now;
    // timer countdown
    hopTimer -= dt/1000;
    if(hopTimer&lt;=0){ hopTimer=0; if(mult&gt;1){ mult=1; updateMult(); } hopTimer=5; }
    timerBar.style.width = (hopTimer/5*100)+&#x27;%&#x27;;

    for(var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i];
      var move = lane.dir*lane.speed;
      for(var j=0;j&lt;lane.items.length;j++){
        var it=lane.items[j];
        it.x += move;
        if(lane.dir&gt;0 &amp;&amp; it.x&gt;FIELD_W) it.x = -it.w;
        else if(lane.dir&lt;0 &amp;&amp; it.x + it.w &lt; 0) it.x = FIELD_W;
        it.el.style.left=it.x+&#x27;px&#x27;;
      }
    }

    // If on river, carry hero with the log it&#x27;s riding
    var lane2 = laneAtRow(hero.row);
    if(lane2 &amp;&amp; lane2.type===&#x27;river&#x27;){
      var hc = hero.x + CW*0.5;   // hero center
      var riding=null;
      for(var k=0;k&lt;lane2.items.length;k++){
        var it2=lane2.items[k];
        if(hc &gt; it2.x &amp;&amp; hc &lt; it2.x + it2.w){ riding=it2; break; }
      }
      if(riding){
        hero.x += lane2.dir*lane2.speed;
        if(hero.x &lt; -CW*0.5 || hero.x &gt; FIELD_W - CW*0.4){ loseLife(); return; }
        heroEl.style.left = hero.x+&#x27;px&#x27;;
      } else {
        loseLife(); return; // fell in water
      }
    } else if(lane2 &amp;&amp; lane2.type===&#x27;road&#x27;){
      // car collision
      var hx = hero.x + CW*0.2, hw = CW*0.6;
      for(var m=0;m&lt;lane2.items.length;m++){
        var c=lane2.items[m];
        if(hx &lt; c.x + c.w &amp;&amp; hx + hw &gt; c.x){ loseLife(); return; }
      }
    }
    animId=requestAnimationFrame(tick);
  }

  function startGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    score=0; mult=1; hopTimer=5;
    scoreEl.textContent=&#x27;0&#x27;; multEl.textContent=&#x27;×1&#x27;;
    banner.style.display=&#x27;none&#x27;;
    clearField();
    buildBackground();
    buildLanes();
    makeHero();
    resetHero();
    running=true;
    lastTick=performance.now();
    timerBar.style.width=&#x27;100%&#x27;;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    banner.innerHTML=&#x27;⏸ Paused&lt;small&gt;Press Start below to play&lt;/small&gt;&#x27;;
    banner.style.display=&#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){move(0,-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){move(0,1);e.preventDefault();}
  });

  // swipe support
  var tsx=0,tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){
    if(e.touches.length){ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; }
  },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    if(!e.changedTouches.length) return;
    var dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
    if(Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0);
    else move(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  buildBackground();
  makeHero();
  resetHero();
  banner.innerHTML=&#x27;🐸 Frog Fever&lt;small&gt;Press Start below to hop!&lt;/small&gt;&#x27;;
  banner.style.display=&#x27;flex&#x27;;
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
