<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 COSMIC FROG</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#4dff9e,#4dd2ff,#c77dff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(77,255,158,.3); }
  .instructions { font-size: 16px; color: #9fb; margin: 0; text-align: center; line-height: 1.35; max-width: 620px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; width: 620px; gap: 12px; }
  .score { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  #scoreNum { display: inline-block; transition: transform .15s; color: #ffe37a; text-shadow: 0 0 12px rgba(255,227,122,.6); }
  #starPop { font-size: 22px; opacity: 0; transform: scale(0); transition: none; }
  .timerWrap { flex: 1; height: 16px; background: #1a1636; border-radius: 8px; overflow: hidden; border: 1px solid #2c2755; }
  #timerBar { height: 100%; width: 100%; background: #4dff9e; border-radius: 8px; transition: width .2s linear, background .4s; }
  .field { position: relative; width: 620px; height: 470px; background: #060314; border-radius: 10px; overflow: hidden; border: 1px solid #221c44; box-shadow: 0 0 40px rgba(80,60,200,.15) inset; }
  .lane { position: absolute; left: 0; right: 0; }
  .safe { position: absolute; left: 0; right: 0; background: rgba(90,255,180,.07); }
  .frog { position: absolute; font-size: 30px; line-height: 1; text-align: center; z-index: 20; transition: left .09s ease-out, top .09s ease-out; filter: drop-shadow(0 0 8px #7dff9e); will-change: transform; }
  .haz { position: absolute; z-index: 10; will-change: transform; }
  .ship { border-radius: 4px 12px 12px 4px; }
  .beam { border-radius: 3px; }
  .particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 30; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 50; background: rgba(5,3,15,.72); text-align: center; }
  #overlay .big { font-size: 34px; font-weight: 800; background: linear-gradient(90deg,#4dff9e,#c77dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay .sub { font-size: 16px; color: #9fb; margin-top: 6px; }
  .hidden { display: none !important; }
  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.9} }
  .star-bg { position:absolute; background:#fff; border-radius:50%; z-index:1; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 COSMIC FROG&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys (or swipe) to cross the galaxy highway and reach the top — dodge ships, asteroids and energy beams. Score before the 60-second timer runs out; each point speeds things up!&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;⭐ &lt;span id=&quot;scoreNum&quot;&gt;0&lt;/span&gt; &lt;span id=&quot;starPop&quot;&gt;🌟&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;timerWrap&quot;&gt;&lt;div id=&quot;timerBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div id=&quot;overlay&quot;&gt;&lt;div class=&quot;big&quot;&gt;Ready to hop?&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Press Start below to launch into the cosmos.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 47, COLS = 13;
  var LANES = 7, ROWS = LANES + 2;
  var FIELD_W = 620, FIELD_H = 470;
  var running = false, animId = null, lastT = 0;
  var frog = { col: 6, row: ROWS - 1 };
  var frogEl = null, field = document.getElementById(&#x27;field&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreNum = document.getElementById(&#x27;scoreNum&#x27;);
  var starPop = document.getElementById(&#x27;starPop&#x27;);
  var timerBar = document.getElementById(&#x27;timerBar&#x27;);
  var score = 0, speedMul = 1, timeLeft = 60, invincible = false;
  var lanes = [], particles = [];

  var laneDefs = [
    { type:&#x27;ship&#x27;,  tint:&#x27;#ff5da2&#x27;, dir:1,  base:1.9, count:3, w:38, h:22 },
    { type:&#x27;aster&#x27;, tint:&#x27;#ffb84d&#x27;, dir:-1, base:0.9, count:2, w:66, h:34 },
    { type:&#x27;beam&#x27;,  tint:&#x27;#4dd2ff&#x27;, dir:0,  base:0,   count:0, w:0,  h:8 },
    { type:&#x27;ship&#x27;,  tint:&#x27;#c77dff&#x27;, dir:1,  base:2.3, count:4, w:32, h:20 },
    { type:&#x27;aster&#x27;, tint:&#x27;#7dff9e&#x27;, dir:-1, base:1.1, count:2, w:60, h:36 },
    { type:&#x27;beam&#x27;,  tint:&#x27;#ff4d6d&#x27;, dir:0,  base:0,   count:0, w:0,  h:8 },
    { type:&#x27;ship&#x27;,  tint:&#x27;#4dff9e&#x27;, dir:-1, base:1.6, count:3, w:40, h:24 }
  ];

  function laneY(row){ return row * CELL; }

  function makeStarfield(){
    for (var i=0;i&lt;50;i++){
      var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;star-bg&#x27;;
      var sz=Math.random()*2+1;
      s.style.width=sz+&#x27;px&#x27;; s.style.height=sz+&#x27;px&#x27;;
      s.style.left=Math.random()*FIELD_W+&#x27;px&#x27;;
      s.style.top=Math.random()*FIELD_H+&#x27;px&#x27;;
      s.style.animation=&#x27;twinkle &#x27;+(1.5+Math.random()*2.5)+&#x27;s infinite&#x27;;
      field.appendChild(s);
    }
  }

  function buildField(){
    field.innerHTML=&#x27;&#x27;;
    field.appendChild(overlay);
    makeStarfield();
    // safe zones
    var topSafe=document.createElement(&#x27;div&#x27;); topSafe.className=&#x27;safe&#x27;;
    topSafe.style.top=&#x27;0&#x27;; topSafe.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(topSafe);
    var botSafe=document.createElement(&#x27;div&#x27;); botSafe.className=&#x27;safe&#x27;;
    botSafe.style.top=laneY(ROWS-1)+&#x27;px&#x27;; botSafe.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(botSafe);

    lanes=[];
    for (var i=0;i&lt;LANES;i++){
      var d=laneDefs[i], row=i+1, y=laneY(row);
      var laneBg=document.createElement(&#x27;div&#x27;); laneBg.className=&#x27;lane&#x27;;
      laneBg.style.top=y+&#x27;px&#x27;; laneBg.style.height=CELL+&#x27;px&#x27;;
      laneBg.style.background=hexA(d.tint,0.10);
      field.appendChild(laneBg);

      var lane={ def:d, y:y, hazards:[], beamOn:false, beamTimer:0, beamEl:null, dir:d.dir };
      if (d.type===&#x27;beam&#x27;){
        var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;haz beam&#x27;;
        b.style.top=(y+(CELL-d.h)/2)+&#x27;px&#x27;; b.style.left=&#x27;0&#x27;;
        b.style.width=FIELD_W+&#x27;px&#x27;; b.style.height=d.h+&#x27;px&#x27;;
        b.style.background=d.tint; b.style.boxShadow=&#x27;0 0 16px &#x27;+d.tint;
        b.style.opacity=&#x27;0&#x27;; b.style.borderRadius=&#x27;4px&#x27;;
        field.appendChild(b);
        lane.beamEl=b; lane.beamTimer=Math.random()*1.5;
      } else {
        var gap=FIELD_W/d.count;
        for (var j=0;j&lt;d.count;j++){
          var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;haz &#x27;+(d.type===&#x27;ship&#x27;?&#x27;ship&#x27;:&#x27;&#x27;);
          el.style.width=d.w+&#x27;px&#x27;; el.style.height=d.h+&#x27;px&#x27;;
          el.style.top=(y+(CELL-d.h)/2)+&#x27;px&#x27;;
          el.style.background=d.tint;
          el.style.boxShadow=&#x27;0 0 12px &#x27;+d.tint;
          if (d.type===&#x27;aster&#x27;){ el.style.borderRadius=&#x27;40% 60% 55% 45%&#x27;; el.textContent=&#x27;&#x27;; }
          field.appendChild(el);
          var x=j*gap+Math.random()*gap*0.5;
          el.style.left=x+&#x27;px&#x27;;
          if (d.type===&#x27;aster&#x27;) el.dataset.spin=&#x27;0&#x27;;
          lane.hazards.push({ x:x, el:el, w:d.w });
        }
      }
      lanes.push(lane);
    }

    frogEl=document.createElement(&#x27;div&#x27;); frogEl.className=&#x27;frog&#x27;;
    frogEl.textContent=&#x27;🐸&#x27;;
    field.appendChild(frogEl);
    paintFrog();
  }

  function hexA(hex,a){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return &#x27;rgba(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;,&#x27;+a+&#x27;)&#x27;;
  }

  function paintFrog(extra){
    var x=frog.col*CELL+(CELL-30)/2, y=frog.row*CELL+(CELL-30)/2;
    frogEl.style.left=x+&#x27;px&#x27;; frogEl.style.top=y+&#x27;px&#x27;;
    if(extra) frogEl.style.transform=extra;
  }

  function squash(){
    frogEl.style.transform=&#x27;scale(1.35,0.7)&#x27;;
    setTimeout(function(){ if(!invincible) frogEl.style.transform=&#x27;scale(0.8,1.3)&#x27;; },60);
    setTimeout(function(){ if(!invincible) frogEl.style.transform=&#x27;scale(1,1)&#x27;; },160);
  }

  function burst(x,y,colors,n){
    for(var i=0;i&lt;n;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      var sz=Math.random()*6+3;
      p.style.width=sz+&#x27;px&#x27;; p.style.height=sz+&#x27;px&#x27;;
      p.style.left=x+&#x27;px&#x27;; p.style.top=y+&#x27;px&#x27;;
      p.style.background=colors[i%colors.length];
      p.style.boxShadow=&#x27;0 0 8px &#x27;+colors[i%colors.length];
      field.appendChild(p);
      var ang=Math.random()*Math.PI*2, spd=Math.random()*3+1.5;
      particles.push({ el:p, x:x, y:y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1 });
    }
  }

  function updateParticles(dt){
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=0.08*dt*60; p.life-=dt*1.6;
      p.el.style.left=p.x+&#x27;px&#x27;; p.el.style.top=p.y+&#x27;px&#x27;; p.el.style.opacity=Math.max(0,p.life);
      if(p.life&lt;=0){ if(p.el.parentNode)p.el.parentNode.removeChild(p.el); particles.splice(i,1); }
    }
  }

  function move(dc,dr){
    if(!running||invincible) return;
    var nc=Math.max(0,Math.min(COLS-1,frog.col+dc));
    var nr=Math.max(0,Math.min(ROWS-1,frog.row+dr));
    if(nc===frog.col&amp;&amp;nr===frog.row) return;
    frog.col=nc; frog.row=nr;
    paintFrog(); squash();
    var fx=frog.col*CELL+CELL/2, fy=frog.row*CELL+CELL/2;
    burst(fx,fy,[&#x27;#7dff9e&#x27;,&#x27;#4dd2ff&#x27;],5);
    if(frog.row===0) scorePoint();
  }

  function scorePoint(){
    score++; speedMul+=0.12;
    scoreNum.textContent=score;
    scoreNum.style.transform=&#x27;scale(1.6)&#x27;;
    setTimeout(function(){ scoreNum.style.transform=&#x27;scale(1)&#x27;; },160);
    starPop.style.transition=&#x27;none&#x27;; starPop.style.opacity=&#x27;1&#x27;; starPop.style.transform=&#x27;scale(1.4) rotate(0deg)&#x27;;
    setTimeout(function(){ starPop.style.transition=&#x27;opacity .8s, transform .8s&#x27;; starPop.style.opacity=&#x27;0&#x27;; starPop.style.transform=&#x27;scale(0.6) rotate(180deg)&#x27;; },40);
    // celebration
    var fx=frog.col*CELL+CELL/2, fy=frog.row*CELL+CELL/2;
    burst(fx,fy,[&#x27;#ffe37a&#x27;,&#x27;#ffb84d&#x27;,&#x27;#fff&#x27;,&#x27;#4dff9e&#x27;],18);
    frogEl.style.filter=&#x27;drop-shadow(0 0 18px #ffe37a) brightness(2)&#x27;;
    setTimeout(function(){ frogEl.style.filter=&#x27;drop-shadow(0 0 8px #7dff9e)&#x27;; },250);
    resetFrog();
  }

  function resetFrog(){
    frog.col=6; frog.row=ROWS-1; paintFrog();
  }

  function hit(){
    if(invincible) return;
    invincible=true; running_pause_hazards=true;
    var fx=frog.col*CELL+CELL/2, fy=frog.row*CELL+CELL/2;
    burst(fx,fy,[&#x27;#ff4d6d&#x27;,&#x27;#ff5da2&#x27;],14);
    var flashes=0;
    frogEl.style.filter=&#x27;drop-shadow(0 0 14px #ff4d6d)&#x27;;
    var spinDeg=0;
    var spin=setInterval(function(){
      spinDeg+=90;
      frogEl.style.transform=&#x27;rotate(&#x27;+spinDeg+&#x27;deg) scale(&#x27;+(1-flashes*0.05)+&#x27;)&#x27;;
      frogEl.style.color=(flashes%2===0)?&#x27;#ff4d6d&#x27;:&#x27;#fff&#x27;;
      frogEl.style.filter=(flashes%2===0)?&#x27;drop-shadow(0 0 14px #ff4d6d)&#x27;:&#x27;drop-shadow(0 0 8px #fff)&#x27;;
      flashes++;
      if(flashes&gt;=8){
        clearInterval(spin);
        frogEl.style.transform=&#x27;rotate(0deg) scale(1)&#x27;;
        frogEl.style.filter=&#x27;drop-shadow(0 0 8px #7dff9e)&#x27;;
        frogEl.style.color=&#x27;&#x27;;
        resetFrog(); invincible=false; running_pause_hazards=false;
      }
    },70);
  }
  var running_pause_hazards=false;

  function checkCollision(){
    var laneIdx=frog.row-1;
    if(laneIdx&lt;0||laneIdx&gt;=LANES) return;
    var lane=lanes[laneIdx];
    var hx=frog.col*CELL+(CELL-30)/2, hy=frog.row*CELL+(CELL-30)/2, hs=30;
    if(lane.def.type===&#x27;beam&#x27;){
      if(lane.beamOn) hit();
      return;
    }
    for(var k=0;k&lt;lane.hazards.length;k++){
      var o=lane.hazards[k];
      if(hx&lt;o.x+o.w &amp;&amp; hx+hs&gt;o.x){ hit(); return; }
    }
  }

  function tick(now){
    if(!running){ return; }
    var dt=lastT?Math.min(0.05,(now-lastT)/1000):0.016; lastT=now;
    // timer
    timeLeft-=dt;
    if(timeLeft&lt;=0){ timeLeft=0; endGame(); }
    var pct=timeLeft/60*100;
    timerBar.style.width=pct+&#x27;%&#x27;;
    if(pct&gt;50) timerBar.style.background=&#x27;#4dff9e&#x27;;
    else if(pct&gt;25) timerBar.style.background=&#x27;#ffe37a&#x27;;
    else timerBar.style.background=&#x27;#ff4d6d&#x27;;

    for(var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i], d=lane.def;
      if(d.type===&#x27;beam&#x27;){
        lane.beamTimer-=dt;
        if(lane.beamTimer&lt;=0){
          lane.beamOn=!lane.beamOn;
          lane.beamTimer=lane.beamOn?0.9:1.4;
          lane.beamEl.style.opacity=lane.beamOn?&#x27;0.85&#x27;:&#x27;0&#x27;;
          lane.beamEl.style.height=lane.beamOn?&#x27;12px&#x27;:&#x27;8px&#x27;;
        }
        if(lane.beamOn){
          lane.beamEl.style.opacity=(0.6+Math.random()*0.35).toFixed(2);
        }
        continue;
      }
      if(running_pause_hazards) continue;
      var spd=d.base*speedMul*dt*60;
      for(var j=0;j&lt;lane.hazards.length;j++){
        var o=lane.hazards[j];
        o.x+=lane.dir*spd;
        if(lane.dir&gt;0 &amp;&amp; o.x&gt;FIELD_W) o.x=-o.w;
        else if(lane.dir&lt;0 &amp;&amp; o.x+o.w&lt;0) o.x=FIELD_W;
        if(d.type===&#x27;aster&#x27;){
          var sp=parseFloat(o.el.dataset.spin||&#x27;0&#x27;)+spd*3;
          o.el.dataset.spin=sp;
          o.el.style.transform=&#x27;rotate(&#x27;+sp+&#x27;deg)&#x27;;
          o.el.style.left=o.x+&#x27;px&#x27;;
        } else {
          o.el.style.left=o.x+&#x27;px&#x27;;
        }
      }
    }

    if(!invincible) checkCollision();
    updateParticles(dt);
    animId=requestAnimationFrame(tick);
  }

  function startGame(){
    if(running) return;
    overlay.classList.add(&#x27;hidden&#x27;);
    score=0; speedMul=1; timeLeft=60; invincible=false; running_pause_hazards=false;
    scoreNum.textContent=&#x27;0&#x27;; timerBar.style.width=&#x27;100%&#x27;; timerBar.style.background=&#x27;#4dff9e&#x27;;
    particles.forEach(function(p){ if(p.el.parentNode)p.el.parentNode.removeChild(p.el); }); particles=[];
    buildField(); resetFrog();
    running=true; lastT=0;
    animId=requestAnimationFrame(tick);
  }

  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  function endGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    overlay.querySelector(&#x27;.big&#x27;).textContent=&#x27;Time! 🐸 Score: &#x27;+score;
    overlay.querySelector(&#x27;.sub&#x27;).textContent=&#x27;Press Start below to hop again.&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  // keyboard
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });

  // swipe
  var tsx=0,tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0); else move(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial paint (stopped state)
  buildField();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
