<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>Neon Reef Defense</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #04121f; color: #cdeffd; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#3ff,#4af,#a6f); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(80,200,255,.3); }
  .instructions { font-size: 16px; color: #9fd6ee; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 620px; max-width: 100%; font-size: 18px; }
  .hud .lives { letter-spacing: 2px; }
  .field { position: relative; width: 620px; max-width: 100%; height: 430px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
           background: radial-gradient(circle at 50% 0%, #0a3350 0%, #062338 45%, #03111d 100%);
           box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 0 24px rgba(30,120,180,.25); }
  canvas { display: block; width: 100%; height: 100%; }
  #timebar { position: absolute; top: 0; left: 0; height: 6px; width: 100%; transition: none; z-index: 5; }
  .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         text-align: center; pointer-events: none; z-index: 8; }
  .msg .big { font-size: 40px; font-weight: 800; text-shadow: 0 0 20px rgba(120,220,255,.7); }
  .msg .sub { font-size: 18px; margin-top: 8px; color: #bfe9ff; }
  .combo-flash { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; }
  .hitred { position: absolute; inset: 0; z-index: 7; pointer-events: none; background: rgba(255,40,40,.35); opacity: 0; }
  .score { font-weight: 700; color: #eafbff; }
  .mult { color: #ffe27a; font-weight: 700; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Neon Reef Defense&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and hold &lt;strong&gt;Space&lt;/strong&gt; to fire sonar blasts at the jellyfish — pop them before they reach the bottom. On a phone, tap the left/right sides to move and the center to shoot.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/span&gt; &lt;span class=&quot;mult&quot; id=&quot;mult&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;💙💙💙&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div id=&quot;timebar&quot;&gt;&lt;/div&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;430&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;combo-flash&quot; id=&quot;comboFlash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;hitred&quot; id=&quot;hitred&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 430;
  var field = document.getElementById(&#x27;field&#x27;);
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;), timebar = document.getElementById(&#x27;timebar&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;), comboFlash = document.getElementById(&#x27;comboFlash&#x27;), hitred = document.getElementById(&#x27;hitred&#x27;);

  var running = false, animId = null;
  var keys = {};
  var ship, bullets, jellies, bubbles, trail;
  var score, lives, kills, mult, multUntil;
  var lastTime, gameTime, GAME_LEN = 60;
  var spawnTimer, spawnInterval, diffLevel, lastShot;
  var audioCtx = null;

  var TYPES = {
    small:  { r: 14, hp: 1, pts: 1, speed: 55,  color: &#x27;#ff5ec4&#x27; },
    medium: { r: 22, hp: 2, pts: 2, speed: 48,  color: &#x27;#5ec9ff&#x27; },
    large:  { r: 32, hp: 3, pts: 3, speed: 80,  color: &#x27;#b48cff&#x27; }
  };

  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function resetState() {
    ship = { x: W/2, w: 40, h: 26, speed: 320 };
    bullets = []; jellies = []; trail = [];
    bubbles = [];
    for (var i = 0; i &lt; 32; i++) bubbles.push(newBubble(Math.random()*H));
    score = 0; lives = 3; kills = 0; mult = 1; multUntil = 0;
    gameTime = 0; spawnTimer = 0; spawnInterval = 1.1; diffLevel = 0; lastShot = 0;
    updateHUD();
    msgEl.innerHTML = &#x27;&#x27;;
  }

  function newBubble(y) {
    return { x: Math.random()*W, y: y == null ? H + 10 : y, r: 1.5 + Math.random()*4, sp: 12 + Math.random()*28, drift: (Math.random()-0.5)*10 };
  }

  function spawnJelly() {
    var roll = Math.random();
    var key = roll &lt; 0.5 ? &#x27;small&#x27; : (roll &lt; 0.82 ? &#x27;medium&#x27; : &#x27;large&#x27;);
    var t = TYPES[key];
    var speedBoost = 1 + diffLevel * 0.18;
    jellies.push({
      x: t.r + Math.random()*(W - t.r*2), y: -t.r - 10,
      r: t.r, hp: t.hp, maxhp: t.hp, pts: t.pts, color: t.color,
      vy: t.speed * speedBoost, phase: Math.random()*Math.PI*2,
      amp: 20 + Math.random()*30, freq: 1 + Math.random()*1.2,
      baseX: 0, flash: 0, wob: Math.random()*Math.PI*2
    });
    jellies[jellies.length-1].baseX = jellies[jellies.length-1].x;
  }

  function fire() {
    var now = performance.now();
    if (now - lastShot &lt; 170) return;
    lastShot = now;
    bullets.push({ x: ship.x, y: H - 40, vy: -560 });
    beep(880, 0.09, &#x27;square&#x27;, 0.03);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    multEl.textContent = (mult &gt; 1 ? &#x27;×2 COMBO&#x27; : &#x27;&#x27;);
    var hearts = &#x27;&#x27;;
    for (var i = 0; i &lt; 3; i++) hearts += i &lt; lives ? &#x27;💙&#x27; : &#x27;🖤&#x27;;
    livesEl.textContent = hearts;
  }

  function loseLife() {
    lives--;
    updateHUD();
    hitred.style.transition = &#x27;none&#x27;; hitred.style.opacity = &#x27;1&#x27;;
    requestAnimationFrame(function(){ hitred.style.transition = &#x27;opacity .5s&#x27;; hitred.style.opacity = &#x27;0&#x27;; });
    beep(150, 0.3, &#x27;sawtooth&#x27;, 0.09);
    if (lives &lt;= 0) endGame(true);
  }

  function triggerCombo() {
    mult = 2; multUntil = gameTime + 3;
    updateHUD();
    comboFlash.style.background = &#x27;radial-gradient(circle,rgba(255,220,120,.5),rgba(120,220,255,.2))&#x27;;
    comboFlash.style.transition = &#x27;none&#x27;; comboFlash.style.opacity = &#x27;1&#x27;;
    requestAnimationFrame(function(){ comboFlash.style.transition = &#x27;opacity .6s&#x27;; comboFlash.style.opacity = &#x27;0&#x27;; });
    var m = document.createElement(&#x27;div&#x27;);
    beep(660, 0.12, &#x27;triangle&#x27;, 0.08); beep(990, 0.15, &#x27;triangle&#x27;, 0.06);
  }

  function killJelly(j, idx) {
    jellies.splice(idx, 1);
    score += j.pts * mult;
    kills++;
    beep(300 + j.pts*120, 0.14, &#x27;sine&#x27;, 0.07);
    if (kills % 5 === 0) triggerCombo();
    updateHUD();
  }

  function endGame(broken) {
    running = false;
    if (animId) cancelAnimationFrame(animId), animId = null;
    msgEl.innerHTML = broken
      ? &#x27;&lt;div class=&quot;big&quot; style=&quot;color:#ff6b6b&quot;&gt;REEF BROKEN!&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Score: &#x27; + score + &#x27;&lt;/div&gt;&#x27;
      : &#x27;&lt;div class=&quot;big&quot; style=&quot;color:#8ff&quot;&gt;REEF SECURED&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Score: &#x27; + score + &#x27;&lt;/div&gt;&#x27;;
  }

  function update(dt) {
    gameTime += dt;
    if (gameTime &gt;= GAME_LEN) { endGame(false); return; }

    // difficulty ramp
    var lvl = Math.floor(gameTime / 10);
    if (lvl !== diffLevel) { diffLevel = lvl; spawnInterval = Math.max(0.4, 1.1 - diffLevel * 0.13); }

    // combo expiry
    if (mult &gt; 1 &amp;&amp; gameTime &gt; multUntil) { mult = 1; updateHUD(); }

    // movement
    if (keys.left) ship.x -= ship.speed * dt;
    if (keys.right) ship.x += ship.speed * dt;
    ship.x = Math.max(ship.w/2, Math.min(W - ship.w/2, ship.x));
    if (keys.fire) fire();

    trail.push({ x: ship.x, y: H - 20, life: 0.5 });
    for (var i = trail.length-1; i&gt;=0; i--){ trail[i].life -= dt; if(trail[i].life&lt;=0) trail.splice(i,1); }

    // bullets
    for (var b = bullets.length-1; b&gt;=0; b--){
      bullets[b].y += bullets[b].vy * dt;
      if (bullets[b].y &lt; -20) bullets.splice(b,1);
    }

    // spawn
    spawnTimer += dt;
    if (spawnTimer &gt;= spawnInterval) { spawnTimer = 0; spawnJelly(); }

    // jellies
    for (var j = jellies.length-1; j&gt;=0; j--){
      var jl = jellies[j];
      jl.y += jl.vy * dt;
      jl.wob += dt * 4;
      jl.x = jl.baseX + Math.sin(jl.y/60 * jl.freq + jl.phase) * jl.amp;
      jl.x = Math.max(jl.r, Math.min(W - jl.r, jl.x));
      if (jl.flash &gt; 0) jl.flash -= dt;
      if (jl.y - jl.r &gt; H) { jellies.splice(j,1); loseLife(); continue; }
    }

    // collisions
    for (var bi = bullets.length-1; bi&gt;=0; bi--){
      var bu = bullets[bi];
      for (var ji = jellies.length-1; ji&gt;=0; ji--){
        var jj = jellies[ji];
        var dx = bu.x - jj.x, dy = bu.y - jj.y;
        if (dx*dx + dy*dy &lt; (jj.r+4)*(jj.r+4)) {
          bullets.splice(bi,1);
          jj.hp--; jj.flash = 0.15;
          if (jj.hp &lt;= 0) killJelly(jj, ji);
          else beep(500, 0.05, &#x27;square&#x27;, 0.03);
          break;
        }
      }
    }

    // bubbles
    for (var k=0;k&lt;bubbles.length;k++){
      var bb = bubbles[k];
      bb.y -= bb.sp * dt; bb.x += bb.drift * dt;
      if (bb.y &lt; -10) { bubbles[k] = newBubble(); }
    }

    // timebar
    var frac = 1 - gameTime / GAME_LEN;
    timebar.style.width = (frac*100) + &#x27;%&#x27;;
    var hue = 120 * frac; // green-&gt;red
    timebar.style.background = &#x27;hsl(&#x27; + hue + &#x27;,90%,55%)&#x27;;
    timebar.style.boxShadow = &#x27;0 0 8px hsl(&#x27; + hue + &#x27;,90%,55%)&#x27;;
  }

  function drawJelly(j) {
    var glow = j.flash &gt; 0 ? 1 : 0.55;
    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.shadowColor = j.color; ctx.shadowBlur = j.flash &gt; 0 ? 30 : 16;
    // bell
    ctx.beginPath();
    ctx.arc(0, 0, j.r, Math.PI, 0);
    ctx.lineTo(j.r, j.r*0.3);
    ctx.quadraticCurveTo(0, j.r*0.6, -j.r, j.r*0.3);
    ctx.closePath();
    ctx.fillStyle = j.flash &gt; 0 ? &#x27;#ffffff&#x27; : j.color;
    ctx.globalAlpha = glow;
    ctx.fill();
    // tentacles
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = j.color; ctx.lineWidth = 2;
    for (var t = -2; t &lt;= 2; t++){
      ctx.beginPath();
      var tx = t * (j.r*0.35);
      ctx.moveTo(tx, j.r*0.3);
      ctx.quadraticCurveTo(tx + Math.sin(j.wob+t)*5, j.r*0.9, tx + Math.sin(j.wob+t*2)*6, j.r*1.4);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0,0,W,H);

    // bubbles
    ctx.fillStyle = &#x27;rgba(140,220,255,0.18)&#x27;;
    for (var i=0;i&lt;bubbles.length;i++){
      var b = bubbles[i];
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    }

    // trail
    for (var t=0;t&lt;trail.length;t++){
      var tr = trail[t];
      ctx.globalAlpha = tr.life * 0.5;
      ctx.fillStyle = &#x27;#4fe8ff&#x27;;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, 8*tr.life+3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // jellies
    for (var j=0;j&lt;jellies.length;j++) drawJelly(jellies[j]);

    // bullets
    ctx.shadowColor = &#x27;#3fd8ff&#x27;; ctx.shadowBlur = 10;
    ctx.fillStyle = &#x27;#8ff2ff&#x27;;
    for (var bl=0;bl&lt;bullets.length;bl++){
      var bu = bullets[bl];
      ctx.beginPath(); ctx.roundRect ? (ctx.beginPath(), ctx.roundRect(bu.x-2, bu.y-8, 4, 14, 2), ctx.fill()) : ctx.fillRect(bu.x-2, bu.y-8, 4, 14);
    }
    ctx.shadowBlur = 0;

    // ship
    ctx.save();
    ctx.translate(ship.x, H-24);
    ctx.shadowColor = &#x27;#3ff&#x27;; ctx.shadowBlur = 20;
    ctx.fillStyle = &#x27;#39f6d8&#x27;;
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = &#x27;#aefff2&#x27;;
    ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(30, -6); ctx.lineTo(30, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#04252a&#x27;;
    ctx.beginPath(); ctx.arc(6, -2, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = Math.min(0.05, (ts - lastTime)/1000);
    lastTime = ts;
    update(dt);
    if (!running) { draw(); return; }
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    resetState();
    running = true; lastTime = 0;
    spawnJelly();
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (animId) cancelAnimationFrame(animId), animId = null;
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;) { keys.left = true; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { keys.right = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { keys.fire = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;) keys.left = false;
    else if (e.key === &#x27;ArrowRight&#x27;) keys.right = false;
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) keys.fire = false;
  });

  // touch / mouse controls on field
  function pointerHandler(down) {
    return function(e){
      if (!running) return;
      var rect = cv.getBoundingClientRect();
      var pts = e.touches ? e.touches : [e];
      keys.left = keys.right = keys.fire = false;
      for (var i=0;i&lt;pts.length;i++){
        var px = (pts[i].clientX - rect.left) / rect.width;
        if (px &lt; 0.35) keys.left = true;
        else if (px &gt; 0.65) keys.right = true;
        else keys.fire = true;
      }
      if (!down) { keys.left=keys.right=keys.fire=false; }
      e.preventDefault();
    };
  }
  cv.addEventListener(&#x27;mousedown&#x27;, pointerHandler(true));
  cv.addEventListener(&#x27;mouseup&#x27;, function(){ keys.left=keys.right=keys.fire=false; });
  cv.addEventListener(&#x27;mouseleave&#x27;, function(){ keys.left=keys.right=keys.fire=false; });
  cv.addEventListener(&#x27;touchstart&#x27;, pointerHandler(true), {passive:false});
  cv.addEventListener(&#x27;touchmove&#x27;, pointerHandler(true), {passive:false});
  cv.addEventListener(&#x27;touchend&#x27;, function(e){ keys.left=keys.right=keys.fire=false; e.preventDefault(); }, {passive:false});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static paint
  resetState();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
