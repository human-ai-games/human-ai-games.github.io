<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON SERPENT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0e27; color: #e0f0ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg, #00e5ff, #b14bff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,229,255,0.4); }
  .instructions { font-size: 16px; color: #8fb3d9; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #00e5ff; margin: 0; text-shadow: 0 0 16px rgba(0,229,255,0.8); }
  .legend { font-size: 15px; color: #9fbde0; display: flex; gap: 16px; margin: 0; }
  .legend span { white-space: nowrap; }
  canvas { background: #0a0e27; border-radius: 10px; box-shadow: 0 0 30px rgba(80,120,255,0.25); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys (or swipe on mobile) to eat glowing pickups. Grab stars, gems, and ice crystals for points — avoid the walls and your own tail!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;⭐ Star +1&lt;/span&gt;
    &lt;span&gt;💎 Gem +3 (fast)&lt;/span&gt;
    &lt;span&gt;❄️ Ice +2 (slow)&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;560&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 28, ROWS = 22;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var running = false, tickId = null, gameOver = false;
  var lastTime = 0, acc = 0;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var pickups = [];  // {x,y,type}
  var score = 0;
  var floaters = [];  // {x,y,text,age}
  var particles = []; // {x,y,vx,vy,age,color}
  var speedMod = 1;   // temporary speed multiplier
  var speedTimer = 0;
  var pulse = 0;

  var TYPES = {
    star: { pts: 1, color: &#x27;#ffe14b&#x27;, glow: &#x27;rgba(255,225,75,0.8)&#x27;, label: &#x27;+1&#x27; },
    gem:  { pts: 3, color: &#x27;#ff3cf0&#x27;, glow: &#x27;rgba(255,60,240,0.8)&#x27;, label: &#x27;+3&#x27; },
    ice:  { pts: 2, color: &#x27;#4bc8ff&#x27;, glow: &#x27;rgba(75,200,255,0.8)&#x27;, label: &#x27;+2&#x27; }
  };

  function baseInterval() {
    // Speeds up as score climbs. Base ~140ms, min ~65ms.
    var v = 145 - score * 1.5;
    if (v &lt; 65) v = 65;
    return v / speedMod;
  }

  function cellFree(x, y) {
    for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x &amp;&amp; snake[i].y===y) return false;
    for (var j=0;j&lt;pickups.length;j++) if (pickups[j].x===x &amp;&amp; pickups[j].y===y) return false;
    return true;
  }

  function spawnPickup(type) {
    for (var t=0;t&lt;300;t++){
      var x = Math.floor(Math.random()*COLS), y = Math.floor(Math.random()*ROWS);
      if (cellFree(x,y)) { pickups.push({x:x,y:y,type:type}); return; }
    }
  }

  function initState() {
    snake = [{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
    pickups = []; floaters = []; particles = [];
    score = 0; speedMod = 1; speedTimer = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    spawnPickup(&#x27;star&#x27;); spawnPickup(&#x27;gem&#x27;); spawnPickup(&#x27;ice&#x27;);
  }

  function step() {
    if (!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS) { die(); return; }
    var ate = null, ateIdx = -1;
    for (var p=0;p&lt;pickups.length;p++){ if (pickups[p].x===nx &amp;&amp; pickups[p].y===ny){ ate=pickups[p]; ateIdx=p; break; } }
    var body = ate ? snake : snake.slice(0, snake.length-1);
    for (var i=0;i&lt;body.length;i++){ if (body[i].x===nx &amp;&amp; body[i].y===ny){ die(); return; } }
    snake.unshift({x:nx,y:ny});
    if (ate) {
      var info = TYPES[ate.type];
      score += info.pts;
      scoreEl.textContent = score;
      floaters.push({x:nx*CELL+CELL/2, y:ny*CELL+CELL/2, text:info.label, age:0, color:info.color});
      if (ate.type===&#x27;gem&#x27;) { speedMod = 1.9; speedTimer = 2000; }
      else if (ate.type===&#x27;ice&#x27;) { speedMod = 0.55; speedTimer = 2000; }
      pickups.splice(ateIdx,1);
      spawnPickup(ate.type);
    } else {
      snake.pop();
    }
  }

  function die() {
    running = false; gameOver = true;
    if (tickId) { cancelAnimationFrame(tickId); tickId = null; }
    // explode each segment
    for (var i=0;i&lt;snake.length;i++){
      var cx = snake[i].x*CELL+CELL/2, cy = snake[i].y*CELL+CELL/2;
      for (var k=0;k&lt;6;k++){
        var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
        particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,age:0,color:&#x27;#ff3b3b&#x27;});
      }
    }
    // keep animating the death effect
    lastTime = performance.now();
    tickId = requestAnimationFrame(deathLoop);
  }

  function deathLoop(now) {
    var dt = now - lastTime; lastTime = now;
    updateEffects(dt);
    render(dt, true);
    if (particles.length&gt;0 || floaters.length&gt;0) tickId = requestAnimationFrame(deathLoop);
    else render(dt, true);
  }

  function updateEffects(dt) {
    for (var i=floaters.length-1;i&gt;=0;i--){ floaters[i].age+=dt; floaters[i].y-=dt*0.03; if(floaters[i].age&gt;900) floaters.splice(i,1); }
    for (var j=particles.length-1;j&gt;=0;j--){ var p=particles[j]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.age+=dt; if(p.age&gt;700) particles.splice(j,1); }
  }

  function loop(now) {
    if (!running) return;
    var dt = now - lastTime; lastTime = now;
    acc += dt; pulse += dt;
    if (speedTimer&gt;0){ speedTimer-=dt; if(speedTimer&lt;=0){ speedTimer=0; speedMod=1; } }
    var interval = baseInterval();
    while (acc &gt;= interval) { acc -= interval; if(running) step(); interval = baseInterval(); }
    updateEffects(dt);
    render(dt, false);
    if (running) tickId = requestAnimationFrame(loop);
  }

  function render(dt, dead) {
    ctx.clearRect(0,0,cv.width,cv.height);
    // background
    ctx.fillStyle = &#x27;#0a0e27&#x27;;
    ctx.fillRect(0,0,cv.width,cv.height);
    // dotted grid
    ctx.strokeStyle = &#x27;rgba(90,120,200,0.15)&#x27;;
    ctx.lineWidth = 1; ctx.setLineDash([2,6]);
    for (var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
    for (var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }
    ctx.setLineDash([]);

    // pickups
    for (var i=0;i&lt;pickups.length;i++){
      var pk = pickups[i], info = TYPES[pk.type];
      var cx = pk.x*CELL+CELL/2, cy = pk.y*CELL+CELL/2;
      var flash = 0.5 + 0.5*Math.sin(pulse*0.008 + i);
      ctx.save();
      ctx.shadowBlur = 12 + flash*8; ctx.shadowColor = info.glow;
      ctx.fillStyle = info.color;
      if (pk.type===&#x27;star&#x27;) drawStar(cx,cy,7,3);
      else if (pk.type===&#x27;gem&#x27;) drawGem(cx,cy,7);
      else drawIce(cx,cy,7);
      ctx.restore();
    }

    // snake ribbon (cyan head -&gt; purple tail)
    for (var s=snake.length-1;s&gt;=0;s--){
      var seg = snake[s];
      var t = snake.length&gt;1 ? s/(snake.length-1) : 0;
      var r = Math.round(0 + t*(150-0));
      var g = Math.round(229 + t*(75-229));
      var b = Math.round(255 + t*(255-255));
      var col = dead ? &#x27;#ff3b3b&#x27; : &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      ctx.save();
      ctx.shadowBlur = dead ? 14 : 10;
      ctx.shadowColor = dead ? &#x27;rgba(255,60,60,0.9)&#x27; : &#x27;rgba(0,200,255,0.6)&#x27;;
      ctx.fillStyle = col;
      roundRect(seg.x*CELL+2, seg.y*CELL+2, CELL-4, CELL-4, 6);
      ctx.fill();
      ctx.restore();
    }

    // particles
    for (var q=0;q&lt;particles.length;q++){
      var pp = particles[q];
      var alpha = 1 - pp.age/700;
      ctx.save(); ctx.globalAlpha = Math.max(0,alpha);
      ctx.fillStyle = pp.color; ctx.shadowBlur=8; ctx.shadowColor=pp.color;
      ctx.beginPath(); ctx.arc(pp.x,pp.y,3,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    // floaters
    for (var f=0;f&lt;floaters.length;f++){
      var fl = floaters[f];
      var a = 1 - fl.age/900;
      ctx.save(); ctx.globalAlpha=Math.max(0,a);
      ctx.font = &#x27;bold 18px system-ui, sans-serif&#x27;;
      ctx.fillStyle = fl.color; ctx.shadowBlur=8; ctx.shadowColor=fl.color;
      ctx.textAlign=&#x27;center&#x27;; ctx.fillText(fl.text, fl.x, fl.y); ctx.restore();
    }

    // game over
    if (gameOver &amp;&amp; particles.length===0) {
      ctx.save();
      ctx.fillStyle=&#x27;rgba(10,14,39,0.7)&#x27;; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.textAlign=&#x27;center&#x27;;
      ctx.font=&#x27;bold 40px system-ui, sans-serif&#x27;;
      ctx.fillStyle=&#x27;#ff3b3b&#x27;; ctx.shadowBlur=20; ctx.shadowColor=&#x27;rgba(255,60,60,0.9)&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, cv.width/2, cv.height/2-10);
      ctx.font=&#x27;bold 24px system-ui, sans-serif&#x27;;
      ctx.fillStyle=&#x27;#00e5ff&#x27;; ctx.shadowColor=&#x27;rgba(0,229,255,0.8)&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27;+score, cv.width/2, cv.height/2+30);
      ctx.restore();
    }
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawStar(cx,cy,outer,inner){
    ctx.beginPath();
    for(var i=0;i&lt;10;i++){ var rad=i%2===0?outer:inner; var ang=Math.PI/5*i-Math.PI/2; var px=cx+Math.cos(ang)*rad, py=cy+Math.sin(ang)*rad; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fill();
  }
  function drawGem(cx,cy,s){
    ctx.beginPath(); ctx.moveTo(cx,cy-s); ctx.lineTo(cx+s,cy); ctx.lineTo(cx,cy+s); ctx.lineTo(cx-s,cy); ctx.closePath(); ctx.fill();
  }
  function drawIce(cx,cy,s){
    ctx.save(); ctx.translate(cx,cy);
    ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=2.5; ctx.lineCap=&#x27;round&#x27;;
    for(var i=0;i&lt;3;i++){ ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.moveTo(-s,0); ctx.lineTo(s,0); ctx.stroke(); }
    ctx.restore();
  }

  function startGame() {
    if (running) return;
    if (tickId) { cancelAnimationFrame(tickId); tickId=null; }
    gameOver = false;
    initState();
    running = true;
    acc = 0; lastTime = performance.now();
    render(0,false);
    tickId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (tickId) { cancelAnimationFrame(tickId); tickId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });

  // swipe controls
  var touchStart = null;
  cv.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY}; }, {passive:true});
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){
    if (!touchStart) return;
    var t=e.touches[0]; var dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    if (Math.abs(dx)&lt;20 &amp;&amp; Math.abs(dy)&lt;20) return;
    if (Math.abs(dx)&gt;Math.abs(dy)) pendingDir = dx&gt;0?{x:1,y:0}:{x:-1,y:0};
    else pendingDir = dy&gt;0?{x:0,y:1}:{x:0,y:-1};
    touchStart={x:t.clientX,y:t.clientY};
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;, kind:t, key:e.key||null}, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial paint
  initState();
  render(0,false);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
