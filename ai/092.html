  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060a; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
       color: #39ff88; text-shadow: 0 0 8px #39ff88, 0 0 18px #16a34a; }
  .instructions { font-size: 16px; color: #8fb; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; align-items: center; gap: 22px; font-size: 20px; }
  .score { color: #ffd54a; text-shadow: 0 0 6px #ffb300; }
  .level { color: #ffe; }
  .bolts { letter-spacing: 1px; }
  .bolt { filter: drop-shadow(0 0 3px #ff0); }
  .field-wrap { position: relative; }
  .field { position: relative; width: 560px; height: 420px; flex-shrink: 0;
           background:
             radial-gradient(circle at 50% 50%, #0d1120 0%, #06070d 90%);
           border: 1px solid #1c2f4a; border-radius: 10px; overflow: hidden;
           box-shadow: 0 0 24px rgba(30,120,200,0.25) inset; }
  .grid-bg { position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(80,160,220,0.18) 1px, transparent 1.4px);
    background-size: 20px 20px; background-position: 10px 10px;
    animation: pulseGrid 3.5s ease-in-out infinite; }
  @keyframes pulseGrid { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  .cell { position: absolute; box-sizing: border-box; }
  .seg { border-radius: 4px; }
  .star, .gem, .orb { display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .star { animation: starPulse 0.9s ease-in-out infinite; }
  @keyframes starPulse { 0%,100% { transform: scale(0.75); } 50% { transform: scale(1.15); } }
  .gem { animation: gemSpin 1.6s linear infinite; }
  @keyframes gemSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .orb { animation: orbFlash 0.4s steps(2) infinite; }
  @keyframes orbFlash { 0% { opacity: 1; } 100% { opacity: 0.25; } }
  .ghost { position: absolute; color: rgba(140,200,255,0.22); font-size: 22px; font-weight: 700; user-select: none; pointer-events: none; }
  .ghost.up { top: 2px; left: 50%; transform: translateX(-50%); }
  .ghost.down { bottom: 2px; left: 50%; transform: translateX(-50%); }
  .ghost.left { left: 4px; top: 50%; transform: translateY(-50%); }
  .ghost.right { right: 4px; top: 50%; transform: translateY(-50%); }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; border-radius: 10px; }
  .flash.on { animation: flashFade 0.32s ease-out; }
  @keyframes flashFade { 0% { opacity: 0.6; } 100% { opacity: 0; } }
  .shard { position: absolute; border-radius: 3px; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         font-size: 26px; font-weight: 800; color: #ff5566; text-shadow: 0 0 10px #ff0033;
         pointer-events: none; opacity: 0; }
  .msg.show { opacity: 1; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys (or swipe on the field) to eat pickups: ⭐ gold = 1, 💎 pink = 3, and the rare flashing white orb = 5. Every 5 points the snake speeds up — press Start below to play.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;level&quot;&gt;Speed: &lt;span class=&quot;bolts&quot; id=&quot;bolts&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;grid-bg&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;ghost up&quot;&gt;▲&lt;/div&gt;
      &lt;div class=&quot;ghost down&quot;&gt;▼&lt;/div&gt;
      &lt;div class=&quot;ghost left&quot;&gt;◀&lt;/div&gt;
      &lt;div class=&quot;ghost right&quot;&gt;▶&lt;/div&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;GAME OVER&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 28, ROWS = 21;
  var BASE_TICK = 150;
  var running = false, tickId = null;
  var snake = [], dir = { x: 1, y: 0 }, pendingDir = { x: 1, y: 0 };
  var score = 0, level = 1;
  var pickups = [];      // {x,y,type,el}  type: star|gem|orb
  var orbTimer = null;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var boltsEl = document.getElementById(&#x27;bolts&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);
  var dynamicEls = [];   // snake + pickup elements to clear each paint

  function tickMs() { return Math.max(60, BASE_TICK - (level - 1) * 14); }

  function updateBolts() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; level; i++) s += &#x27;⚡&#x27;;
    boltsEl.textContent = s;
  }

  function clearDynamic() {
    for (var i = 0; i &lt; dynamicEls.length; i++) {
      if (dynamicEls[i].parentNode) dynamicEls[i].parentNode.removeChild(dynamicEls[i]);
    }
    dynamicEls = [];
  }

  function makeCell(cls, x, y, txt) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    if (txt) el.textContent = txt;
    field.appendChild(el);
    dynamicEls.push(el);
    return el;
  }

  function paint() {
    clearDynamic();
    // pickups
    for (var p = 0; p &lt; pickups.length; p++) {
      var pk = pickups[p];
      var cls = pk.type, sym = pk.type === &#x27;star&#x27; ? &#x27;⭐&#x27; : pk.type === &#x27;gem&#x27; ? &#x27;💎&#x27; : &#x27;&#x27;;
      var el = makeCell(cls, pk.x, pk.y, sym);
      if (pk.type === &#x27;orb&#x27;) {
        el.style.background = &#x27;radial-gradient(circle, #fff 30%, #9ff 70%, transparent 72%)&#x27;;
        el.style.boxShadow = &#x27;0 0 12px #fff, 0 0 20px #8ff&#x27;;
        el.style.borderRadius = &#x27;50%&#x27;;
      }
    }
    // snake, head bright green fading to teal
    for (var i = 0; i &lt; snake.length; i++) {
      var t = snake.length &gt; 1 ? i / (snake.length - 1) : 0;
      var el2 = makeCell(&#x27;seg&#x27;, snake[i].x, snake[i].y);
      // interpolate green(57,255,136) -&gt; teal(20,120,140)
      var r = Math.round(57 + (20 - 57) * t);
      var g = Math.round(255 + (120 - 255) * t);
      var b = Math.round(136 + (140 - 136) * t);
      el2.style.background = &#x27;rgb(&#x27; + r + &#x27;,&#x27; + g + &#x27;,&#x27; + b + &#x27;)&#x27;;
      if (i === 0) el2.style.boxShadow = &#x27;0 0 10px #39ff88, 0 0 18px #16ff77&#x27;;
      else el2.style.boxShadow = &#x27;0 0 6px rgba(&#x27; + r + &#x27;,&#x27; + g + &#x27;,&#x27; + b + &#x27;,0.6)&#x27;;
    }
  }

  function occupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    for (var p = 0; p &lt; pickups.length; p++) if (pickups[p].x === x &amp;&amp; pickups[p].y === y) return true;
    return false;
  }

  function freeCell() {
    for (var t = 0; t &lt; 300; t++) {
      var x = Math.floor(Math.random() * COLS);
      var y = Math.floor(Math.random() * ROWS);
      if (!occupied(x, y)) return { x: x, y: y };
    }
    return { x: 0, y: 0 };
  }

  function addPickup(type) {
    var c = freeCell();
    pickups.push({ x: c.x, y: c.y, type: type });
  }

  function ensureBasePickups() {
    var hasStar = false, hasGem = false;
    for (var p = 0; p &lt; pickups.length; p++) {
      if (pickups[p].type === &#x27;star&#x27;) hasStar = true;
      if (pickups[p].type === &#x27;gem&#x27;) hasGem = true;
    }
    if (!hasStar) addPickup(&#x27;star&#x27;);
    if (!hasGem) addPickup(&#x27;gem&#x27;);
  }

  function maybeSpawnOrb() {
    var hasOrb = false;
    for (var p = 0; p &lt; pickups.length; p++) if (pickups[p].type === &#x27;orb&#x27;) hasOrb = true;
    if (hasOrb) return;
    if (Math.random() &lt; 0.28) {
      addPickup(&#x27;orb&#x27;);
      if (orbTimer) clearTimeout(orbTimer);
      orbTimer = setTimeout(function () {
        for (var i = pickups.length - 1; i &gt;= 0; i--) if (pickups[i].type === &#x27;orb&#x27;) pickups.splice(i, 1);
        if (running) paint();
      }, 4000);
    }
  }

  function doFlash(color) {
    flashEl.style.background = color;
    flashEl.classList.remove(&#x27;on&#x27;);
    void flashEl.offsetWidth;
    flashEl.classList.add(&#x27;on&#x27;);
  }

  function initSnake() {
    snake = [ { x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 } ];
    dir = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };
  }

  function scheduleTick() {
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, tickMs());
  }

  function tick() {
    if (!running) return;
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { die(); return; }

    var eaten = -1;
    for (var p = 0; p &lt; pickups.length; p++) {
      if (pickups[p].x === nx &amp;&amp; pickups[p].y === ny) { eaten = p; break; }
    }
    var ate = eaten &gt;= 0;
    var body = ate ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) {
      if (body[i].x === nx &amp;&amp; body[i].y === ny) { die(); return; }
    }

    snake.unshift({ x: nx, y: ny });
    if (ate) {
      var pk = pickups[eaten];
      var oldLevel = level;
      if (pk.type === &#x27;star&#x27;) { score += 1; doFlash(&#x27;#ffd54a&#x27;); }
      else if (pk.type === &#x27;gem&#x27;) { score += 3; doFlash(&#x27;#ff5fae&#x27;); }
      else { score += 5; doFlash(&#x27;#ffffff&#x27;); if (orbTimer) { clearTimeout(orbTimer); orbTimer = null; } }
      pickups.splice(eaten, 1);
      scoreEl.textContent = score;
      level = 1 + Math.floor(score / 5);
      updateBolts();
      ensureBasePickups();
      maybeSpawnOrb();
      if (level !== oldLevel) scheduleTick();
    } else {
      snake.pop();
    }
    paint();
  }

  function die() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (orbTimer) { clearTimeout(orbTimer); orbTimer = null; }
    doFlash(&#x27;#ff2233&#x27;);
    // build shards from current snake
    var shards = [];
    for (var i = 0; i &lt; snake.length; i++) {
      var sd = document.createElement(&#x27;div&#x27;);
      sd.className = &#x27;shard&#x27;;
      var px = snake[i].x * CELL, py = snake[i].y * CELL;
      sd.style.left = px + &#x27;px&#x27;;
      sd.style.top = py + &#x27;px&#x27;;
      sd.style.width = CELL + &#x27;px&#x27;;
      sd.style.height = CELL + &#x27;px&#x27;;
      sd.style.background = &#x27;#ff4455&#x27;;
      sd.style.boxShadow = &#x27;0 0 8px #ff0033&#x27;;
      sd.style.transition = &#x27;transform 0.7s ease-out, opacity 0.7s ease-out&#x27;;
      field.appendChild(sd);
      shards.push(sd);
    }
    clearDynamic();
    msgEl.classList.add(&#x27;show&#x27;);
    // drift outward
    requestAnimationFrame(function () {
      for (var i = 0; i &lt; shards.length; i++) {
        var dx = (Math.random() - 0.5) * 60;
        var dy = (Math.random() - 0.5) * 60;
        var rot = (Math.random() - 0.5) * 180;
        shards[i].style.transform = &#x27;translate(&#x27; + dx + &#x27;px,&#x27; + dy + &#x27;px) rotate(&#x27; + rot + &#x27;deg) scale(0.4)&#x27;;
        shards[i].style.opacity = &#x27;0&#x27;;
      }
    });
    setTimeout(function () {
      for (var i = 0; i &lt; shards.length; i++) if (shards[i].parentNode) shards[i].parentNode.removeChild(shards[i]);
    }, 800);
  }

  function startGame() {
    if (running) return;
    if (orbTimer) { clearTimeout(orbTimer); orbTimer = null; }
    // clean any leftover shards
    var leftover = field.querySelectorAll(&#x27;.shard&#x27;);
    for (var i = 0; i &lt; leftover.length; i++) leftover[i].parentNode.removeChild(leftover[i]);
    msgEl.classList.remove(&#x27;show&#x27;);
    score = 0; level = 1;
    scoreEl.textContent = &#x27;0&#x27;;
    updateBolts();
    pickups = [];
    initSnake();
    ensureBasePickups();
    maybeSpawnOrb();
    paint();
    running = true;
    scheduleTick();
  }

  function stopGame() {
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (orbTimer) { clearTimeout(orbTimer); orbTimer = null; }
  }

  function setDir(x, y) { pendingDir = { x: x, y: y }; }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { setDir(-1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { setDir(1, 0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { setDir(0, -1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { setDir(0, 1); e.preventDefault(); }
  });

  // swipe support
  var touchStart = null;
  field.addEventListener(&#x27;touchstart&#x27;, function (e) {
    var t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  field.addEventListener(&#x27;touchmove&#x27;, function (e) {
    if (!touchStart) return;
    var t = e.touches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.abs(dx) &lt; 24 &amp;&amp; Math.abs(dy) &lt; 24) return;
    if (Math.abs(dx) &gt; Math.abs(dy)) setDir(dx &gt; 0 ? 1 : -1, 0);
    else setDir(0, dy &gt; 0 ? 1 : -1);
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial visible state (stopped)
  updateBolts();
  initSnake();
  ensureBasePickups();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
