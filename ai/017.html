&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var board = document.getElementById(&#x27;board&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var missEl = document.getElementById(&#x27;miss&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);
var comboFlash = document.getElementById(&#x27;comboFlash&#x27;);
var gameEl = document.getElementById(&#x27;game&#x27;);

var score = 0, miss = 0, combo = 0;
var running = false;
var startTime = 0;
var spawnTimer = null;
var cloudTimer = null;
var holes = [];

// Audio for splat/combo
var audioCtx = null;
function beep(freq, dur, type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

function gopherSVG(gold, crossEyed) {
  var body = gold ? &#x27;#f4c430&#x27; : &#x27;#a06a3c&#x27;;
  var belly = gold ? &#x27;#fff2b0&#x27; : &#x27;#d9b98a&#x27;;
  var eye = crossEyed
    ? &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;34&quot; r=&quot;8&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;34&quot; r=&quot;8&quot; fill=&quot;#fff&quot;/&gt;&lt;text x=&quot;26&quot; y=&quot;40&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;x&lt;/text&gt;&lt;text x=&quot;48&quot; y=&quot;40&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;x&lt;/text&gt;&#x27;
    : &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;34&quot; r=&quot;8&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;48&quot; cy=&quot;34&quot; r=&quot;8&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;27&quot; cy=&quot;35&quot; r=&quot;4&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;49&quot; cy=&quot;35&quot; r=&quot;4&quot; fill=&quot;#222&quot;/&gt;&#x27;;
  var hat = gold ? &#x27;&lt;rect x=&quot;24&quot; y=&quot;0&quot; width=&quot;26&quot; height=&quot;12&quot; fill=&quot;#222&quot; rx=&quot;1&quot;/&gt;&lt;rect x=&quot;18&quot; y=&quot;12&quot; width=&quot;38&quot; height=&quot;4&quot; fill=&quot;#222&quot; rx=&quot;2&quot;/&gt;&lt;rect x=&quot;24&quot; y=&quot;6&quot; width=&quot;26&quot; height=&quot;3&quot; fill=&quot;#c00&quot;/&gt;&#x27; : &#x27;&#x27;;
  return &#x27;&lt;svg viewBox=&quot;0 0 74 82&quot;&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;37&quot; cy=&quot;46&quot; rx=&quot;30&quot; ry=&quot;34&quot; fill=&quot;&#x27; + body + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;37&quot; cy=&quot;56&quot; rx=&quot;18&quot; ry=&quot;20&quot; fill=&quot;&#x27; + belly + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;14&quot; cy=&quot;22&quot; rx=&quot;9&quot; ry=&quot;11&quot; fill=&quot;&#x27; + body + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;60&quot; cy=&quot;22&quot; rx=&quot;9&quot; ry=&quot;11&quot; fill=&quot;&#x27; + body + &#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;14&quot; cy=&quot;22&quot; rx=&quot;4&quot; ry=&quot;6&quot; fill=&quot;#e79fc0&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;60&quot; cy=&quot;22&quot; rx=&quot;4&quot; ry=&quot;6&quot; fill=&quot;#e79fc0&quot;/&gt;&#x27; +
    eye +
    &#x27;&lt;ellipse cx=&quot;37&quot; cy=&quot;48&quot; rx=&quot;6&quot; ry=&quot;4&quot; fill=&quot;#5a3a2a&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;31&quot; y=&quot;50&quot; width=&quot;5&quot; height=&quot;9&quot; fill=&quot;#fff&quot; rx=&quot;1&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;38&quot; y=&quot;50&quot; width=&quot;5&quot; height=&quot;9&quot; fill=&quot;#fff&quot; rx=&quot;1&quot;/&gt;&#x27; +
    hat +
    &#x27;&lt;/svg&gt;&#x27;;
}

function buildBoard() {
  board.innerHTML = &#x27;&#x27;;
  holes = [];
  for (var i = 0; i &lt; 9; i++) {
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;
    var grass = document.createElement(&#x27;div&#x27;);
    grass.className = &#x27;grass&#x27;;
    hole.appendChild(grass);
    board.appendChild(hole);
    holes.push({ el: hole, active: false, gopher: null, timeout: null, hit: false });
  }
}

function splat(hole, gold) {
  var rect = hole.el;
  // point popup
  var pts = document.createElement(&#x27;div&#x27;);
  pts.className = &#x27;points&#x27;;
  pts.textContent = &#x27;+&#x27; + (gold ? 5 : 1);
  pts.style.color = gold ? &#x27;#ffd700&#x27; : &#x27;#ff5bd0&#x27;;
  pts.style.left = &#x27;50%&#x27;;
  pts.style.top = &#x27;20%&#x27;;
  pts.style.transform = &#x27;translateX(-50%)&#x27;;
  rect.appendChild(pts);
  setTimeout(function(){ if (pts.parentNode) pts.parentNode.removeChild(pts); }, 900);
  // stars
  var st = document.createElement(&#x27;div&#x27;);
  st.className = &#x27;stars&#x27;;
  st.textContent = &#x27;✨⭐&#x27;;
  st.style.left = &#x27;30%&#x27;;
  st.style.top = &#x27;15%&#x27;;
  rect.appendChild(st);
  setTimeout(function(){ if (st.parentNode) st.parentNode.removeChild(st); }, 600);
}

function hitGopher(h, gold) {
  if (h.hit) return;
  h.hit = true;
  if (h.timeout) { clearTimeout(h.timeout); h.timeout = null; }
  // cross-eyed reaction
  if (h.gopher) {
    h.gopher.innerHTML = gopherSVG(gold, true);
    h.gopher.classList.remove(&#x27;up&#x27;);
  }
  score += gold ? 5 : 1;
  scoreEl.textContent = score;
  scoreEl.classList.remove(&#x27;bounce&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;bounce&#x27;);
  splat(h, gold);
  beep(gold ? 660 : 440, 0.12, &#x27;triangle&#x27;);
  combo++;
  updateCombo();
  if (combo &gt; 0 &amp;&amp; combo % 3 === 0) triggerCombo();
  setTimeout(function(){ retractHole(h); }, 200);
}

function updateCombo() {
  var mult = Math.max(1, Math.floor(combo / 3) + (combo &gt;= 3 ? 0 : 0));
  comboEl.textContent = &#x27;Combo x&#x27; + (combo &gt;= 3 ? Math.floor(combo/3)+1 : 1);
}

function triggerCombo() {
  comboFlash.innerHTML = &#x27;&lt;span&gt;COMBO!&lt;/span&gt;&#x27;;
  gameEl.classList.remove(&#x27;shake&#x27;); void gameEl.offsetWidth; gameEl.classList.add(&#x27;shake&#x27;);
  beep(880, 0.2, &#x27;sawtooth&#x27;);
  setTimeout(function(){ comboFlash.innerHTML = &#x27;&#x27;; }, 700);
}

function retractHole(h) {
  if (h.gopher) {
    h.gopher.classList.remove(&#x27;up&#x27;);
    var g = h.gopher;
    setTimeout(function(){ if (g.parentNode) g.parentNode.removeChild(g); }, 200);
  }
  h.active = false;
  h.gopher = null;
  h.timeout = null;
  h.hit = false;
}

function popGopher() {
  if (!running) return;
  var idle = holes.filter(function(h){ return !h.active; });
  if (idle.length === 0) return;
  var h = idle[Math.floor(Math.random() * idle.length)];
  var gold = Math.random() &lt; 0.12;
  var elapsed = (Date.now() - startTime) / 1000;
  // life shrinks from 1500ms toward ~550ms by 30s
  var life = Math.max(550, 1500 - elapsed * 32);

  h.active = true;
  h.hit = false;
  var gopher = document.createElement(&#x27;div&#x27;);
  gopher.className = &#x27;gopher&#x27;;
  gopher.innerHTML = gopherSVG(gold, false);
  gopher.addEventListener(&#x27;mousedown&#x27;, function(ev){ ev.stopPropagation(); hitGopher(h, gold); });
  h.el.appendChild(gopher);
  h.gopher = gopher;
  requestAnimationFrame(function(){ gopher.classList.add(&#x27;up&#x27;); });

  h.timeout = setTimeout(function(){
    if (!h.hit) {
      // missed
      miss++;
      missEl.textContent = miss;
      combo = 0;
      updateCombo();
      h.el.classList.remove(&#x27;flash-miss&#x27;); void h.el.offsetWidth; h.el.classList.add(&#x27;flash-miss&#x27;);
      beep(180, 0.15, &#x27;sine&#x27;);
    }
    retractHole(h);
  }, life);
}

function scheduleSpawn() {
  if (!running) return;
  var elapsed = (Date.now() - startTime) / 1000;
  var interval = Math.max(350, 900 - elapsed * 15);
  // spawn one, occasionally two after 30s
  popGopher();
  if (elapsed &gt; 30 &amp;&amp; Math.random() &lt; 0.4) popGopher();
  spawnTimer = setTimeout(scheduleSpawn, interval);
}

// Clouds
function makeCloud(el, y, size, dur) {
  el.innerHTML = &#x27;&lt;svg width=&quot;&#x27;+(size)+&#x27;&quot; height=&quot;&#x27;+(size*0.5)+&#x27;&quot; viewBox=&quot;0 0 100 50&quot;&gt;&lt;ellipse cx=&quot;30&quot; cy=&quot;30&quot; rx=&quot;26&quot; ry=&quot;18&quot; fill=&quot;#fff&quot;/&gt;&lt;ellipse cx=&quot;55&quot; cy=&quot;25&quot; rx=&quot;30&quot; ry=&quot;22&quot; fill=&quot;#fff&quot;/&gt;&lt;ellipse cx=&quot;75&quot; cy=&quot;32&quot; rx=&quot;22&quot; ry=&quot;15&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;&#x27;;
  el.style.top = y + &#x27;px&#x27;;
  el.style.left = &#x27;-160px&#x27;;
  el.dataset.dur = dur;
  el.dataset.pos = -160;
}
function initClouds() {
  makeCloud(document.getElementById(&#x27;cloud1&#x27;), 30, 150, 60);
  makeCloud(document.getElementById(&#x27;cloud2&#x27;), 90, 110, 90);
  makeCloud(document.getElementById(&#x27;cloud3&#x27;), 55, 130, 75);
}
function animateClouds() {
  [&#x27;cloud1&#x27;,&#x27;cloud2&#x27;,&#x27;cloud3&#x27;].forEach(function(id){
    var el = document.getElementById(id);
    var pos = parseFloat(el.dataset.pos) + parseFloat(el.dataset.speed || 0.4);
    if (pos &gt; 760) pos = -180;
    el.dataset.pos = pos;
    el.style.left = pos + &#x27;px&#x27;;
  });
}

function startGame() {
  if (running) return;
  running = true;
  score = 0; miss = 0; combo = 0;
  scoreEl.textContent = &#x27;0&#x27;;
  missEl.textContent = &#x27;0&#x27;;
  updateCombo();
  comboFlash.innerHTML = &#x27;&#x27;;
  buildBoard();
  startTime = Date.now();
  // set cloud speeds
  document.getElementById(&#x27;cloud1&#x27;).dataset.speed = 0.35;
  document.getElementById(&#x27;cloud2&#x27;).dataset.speed = 0.22;
  document.getElementById(&#x27;cloud3&#x27;).dataset.speed = 0.5;
  scheduleSpawn();
  cloudTimer = setInterval(animateClouds, 40);
}

function stopGame() {
  running = false;
  if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
  if (cloudTimer) { clearInterval(cloudTimer); cloudTimer = null; }
  holes.forEach(function(h){ if (h.timeout) clearTimeout(h.timeout); });
}

buildBoard();
initClouds();

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);

<script>
