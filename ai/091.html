<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Lily Pad Leap</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a1a2a; color: #eef; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 2px 0; font-size: 24px; font-weight: 700; color: #9be79b; text-shadow: 0 1px 3px #000; }
  .instructions { font-size: 16px; color: #cfe; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; font-size: 20px; align-items: center; }
  .hud b { color: #ffe066; }
  canvas { background: #0d3b5c; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.5); touch-action: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Lily Pad Leap&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys or WASD to cross the river on lily pads, logs, and turtles — dodge the crocodiles and the water! Reach the fireflies at the top to score, before the 60-second timer runs out.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span&gt;Time: &lt;b id=&quot;time&quot;&gt;60&lt;/b&gt;s&lt;/span&gt;
    &lt;span&gt;Speed: &lt;b id=&quot;tier&quot;&gt;🔥&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var ROWS = 7;               // 0 top firefly bank, 1..5 water lanes, 6 grass start
var RH = H / ROWS;          // row height
var COLW = W;
var scoreEl = document.getElementById(&#x27;score&#x27;);
var timeEl = document.getElementById(&#x27;time&#x27;);
var tierEl = document.getElementById(&#x27;tier&#x27;);

var running = false, animId = null, lastT = 0;
var score = 0, timeLeft = 60, tier = 1, tierTimer = 0;
var frog, lanes, splashes, sparkles, riverPhase = 0;

var LANE_COLORS = [&#x27;#1a6fa0&#x27;, &#x27;#1b7ba8&#x27;, &#x27;#166592&#x27;, &#x27;#1e83b0&#x27;, &#x27;#155f8a&#x27;];

function rand(a, b){ return a + Math.random()*(b-a); }

// Build the 5 water lanes with floating objects and crocodiles
function buildLanes() {
  lanes = [];
  for (var i = 0; i &lt; 5; i++) {
    var row = i + 1;
    var y = row * RH;
    var dir = (i % 2 === 0) ? 1 : -1;
    var baseSpeed = 40 + i * 8;
    var objs = [];
    // choose lane type
    var types = [&#x27;lily&#x27;,&#x27;log&#x27;,&#x27;turtle&#x27;];
    var type = types[i % 3];
    var count = (type === &#x27;log&#x27;) ? 2 : 3;
    var w = (type === &#x27;log&#x27;) ? 130 : 74;
    var gap = W / count;
    for (var j = 0; j &lt; count; j++) {
      var isCroc = false;
      objs.push({ x: j*gap + rand(0,gap-w), w: w, type: type, croc: false, phase: rand(0,Math.PI*2), mouth: 0 });
    }
    // add a crocodile on some lanes
    if (i === 1 || i === 3) {
      objs.push({ x: rand(0,W-90), w: 90, type: &#x27;croc&#x27;, croc: true, phase: rand(0,Math.PI*2), mouth: 0 });
    }
    lanes.push({ y: y, row: row, dir: dir, baseSpeed: baseSpeed, objs: objs, color: LANE_COLORS[i] });
  }
}

function resetFrog() {
  frog = { col: W/2, row: 6, x: W/2, y: 6*RH + RH/2, bob: 0, ridingSpeed: 0 };
}

function startGame() {
  score = 0; timeLeft = 60; tier = 1; tierTimer = 0;
  scoreEl.textContent = &#x27;0&#x27;;
  timeEl.textContent = &#x27;60&#x27;;
  tierEl.textContent = &#x27;🔥&#x27;;
  splashes = []; sparkles = [];
  buildLanes();
  resetFrog();
  running = true;
  lastT = performance.now();
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function speedMul(){ return 1 + (tier-1) * 0.35; }

function loop(t) {
  if (!running) return;
  var dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function update(dt) {
  riverPhase += dt * 2;
  // timer
  timeLeft -= dt;
  if (timeLeft &lt;= 0) { timeLeft = 0; timeEl.textContent = &#x27;0&#x27;; endRound(); return; }
  timeEl.textContent = Math.ceil(timeLeft);
  // difficulty ramp every 10s
  tierTimer += dt;
  if (tierTimer &gt;= 10 &amp;&amp; tier &lt; 6) { tierTimer -= 10; tier++; tierEl.textContent = &#x27;🔥&#x27;.repeat(tier); }

  // move lane objects
  var mul = speedMul();
  frog.ridingSpeed = 0;
  var onSomething = false;
  for (var i = 0; i &lt; lanes.length; i++) {
    var L = lanes[i];
    var v = L.dir * L.baseSpeed * mul;
    for (var j = 0; j &lt; L.objs.length; j++) {
      var o = L.objs[j];
      o.x += v * dt;
      if (v &gt; 0 &amp;&amp; o.x &gt; W) o.x = -o.w;
      else if (v &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = W;
      o.phase += dt * 3;
      if (o.croc) o.mouth = (Math.sin(o.phase * 0.8) &gt; 0.3) ? 1 : 0;
    }
    // is the frog in this lane?
    if (Math.abs(frog.y - L.y - RH/2) &lt; RH*0.4) {
      for (var k = 0; k &lt; L.objs.length; k++) {
        var o2 = L.objs[k];
        if (frog.x &gt; o2.x - 4 &amp;&amp; frog.x &lt; o2.x + o2.w + 4) {
          if (o2.croc &amp;&amp; o2.mouth === 1) {
            // snapped -&gt; splash
            doSplash(); return;
          }
          onSomething = true;
          frog.ridingSpeed = v;
          break;
        }
      }
      // riding along with the platform current
      frog.x += frog.ridingSpeed * dt;
      if (!onSomething) { doSplash(); return; }
      if (frog.x &lt; 0 || frog.x &gt; W) { doSplash(); return; }
    }
  }
  // bob easing
  if (frog.bob &gt; 0) frog.bob -= dt * 30;
  // splashes / sparkles
  for (var s = splashes.length-1; s&gt;=0; s--) {
    var sp = splashes[s]; sp.t += dt; sp.x += sp.vx*dt; sp.y += sp.vy*dt; sp.vy += 200*dt;
    if (sp.t &gt; 0.6) splashes.splice(s,1);
  }
  for (var q = sparkles.length-1; q&gt;=0; q--) {
    var sk = sparkles[q]; sk.t += dt; sk.x += sk.vx*dt; sk.y += sk.vy*dt;
    if (sk.t &gt; 0.7) sparkles.splice(q,1);
  }
}

function doSplash() {
  for (var i=0;i&lt;12;i++){
    splashes.push({ x: frog.x, y: frog.y, vx: rand(-90,90), vy: rand(-120,-30), t: 0 });
  }
  resetFrog();
}
function doSparkle() {
  for (var i=0;i&lt;18;i++){
    sparkles.push({ x: frog.x, y: frog.y, vx: rand(-120,120), vy: rand(-120,120), t: 0, c: [&#x27;#ffe066&#x27;,&#x27;#fff&#x27;,&#x27;#ffd23f&#x27;][i%3] });
  }
}

function move(dx, dy) {
  if (!running) return;
  frog.x = Math.max(RH*0.3, Math.min(W-RH*0.3, frog.x + dx * (RH*0.9)));
  if (dy !== 0) {
    frog.row = Math.max(0, Math.min(6, frog.row + dy));
    frog.y = frog.row * RH + RH/2;
  }
  frog.bob = 8;
  // reached top
  if (frog.row === 0) {
    score++;
    scoreEl.textContent = score;
    doSparkle();
    resetFrog();
  }
}

function endRound() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  draw();
  ctx.fillStyle = &#x27;rgba(0,0,0,.6)&#x27;;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = &#x27;#ffe066&#x27;;
  ctx.font = &#x27;bold 34px system-ui&#x27;;
  ctx.textAlign = &#x27;center&#x27;;
  ctx.fillText(&#x27;Time! Score: &#x27; + score, W/2, H/2 - 6);
  ctx.font = &#x27;18px system-ui&#x27;;
  ctx.fillStyle = &#x27;#cfe&#x27;;
  ctx.fillText(&#x27;Press Start below to play again&#x27;, W/2, H/2 + 28);
}

// ---------- Drawing ----------
function draw() {
  // grass start
  ctx.fillStyle = &#x27;#2e7d32&#x27;; ctx.fillRect(0, 6*RH, W, RH);
  // firefly top bank
  ctx.fillStyle = &#x27;#0d2438&#x27;; ctx.fillRect(0, 0, W, RH);
  drawFireflies();
  // water lanes
  for (var i = 0; i &lt; lanes.length; i++) {
    var L = lanes[i];
    ctx.fillStyle = L.color;
    ctx.fillRect(0, L.y, W, RH);
    drawRipples(L);
  }
  // grass texture dots
  ctx.fillStyle = &#x27;rgba(255,255,255,.08)&#x27;;
  for (var g=0; g&lt;W; g+=26){ ctx.fillRect(g+((g/26|0)%2?8:0), 6*RH+8, 3, 3); }

  // objects
  for (var l = 0; l &lt; lanes.length; l++) {
    var Ln = lanes[l];
    for (var j = 0; j &lt; Ln.objs.length; j++) drawObj(Ln, Ln.objs[j]);
  }
  drawSplashes();
  drawFrog();
  drawSparkles();
}

function drawRipples(L) {
  ctx.strokeStyle = &#x27;rgba(255,255,255,.18)&#x27;;
  ctx.lineWidth = 2;
  var off = (riverPhase * 40 * L.dir) % 40;
  for (var x = -40; x &lt; W+40; x += 40) {
    var xx = x + off;
    ctx.beginPath();
    ctx.moveTo(xx, L.y + RH*0.35);
    ctx.quadraticCurveTo(xx+10, L.y + RH*0.25, xx+20, L.y + RH*0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xx+8, L.y + RH*0.7);
    ctx.quadraticCurveTo(xx+18, L.y + RH*0.6, xx+28, L.y + RH*0.7);
    ctx.stroke();
  }
}

function drawObj(L, o) {
  var cy = L.y + RH/2;
  if (o.croc) {
    ctx.font = (RH*0.7|0) + &#x27;px serif&#x27;;
    ctx.textAlign = &#x27;left&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;
    // body
    ctx.fillStyle = o.mouth ? &#x27;#c0392b&#x27; : &#x27;#2e7d32&#x27;;
    ctx.fillText(&#x27;🐊&#x27;, o.x, cy + (o.mouth ? Math.sin(riverPhase*3)*2 : 0));
    return;
  }
  var emoji = o.type === &#x27;lily&#x27; ? &#x27;🌿&#x27; : (o.type === &#x27;log&#x27; ? &#x27;🪵&#x27; : &#x27;🐢&#x27;);
  if (o.type === &#x27;lily&#x27;) {
    // draw a lily pad shape then flower
    ctx.beginPath();
    ctx.fillStyle = &#x27;#2e9e5b&#x27;;
    ctx.ellipse(o.x + o.w/2, cy, o.w/2, RH*0.32, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = &#x27;#1f7a44&#x27;; ctx.lineWidth = 2; ctx.stroke();
    ctx.font = (RH*0.4|0)+&#x27;px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(&#x27;🌸&#x27;, o.x + o.w/2, cy);
  } else if (o.type === &#x27;log&#x27;) {
    ctx.fillStyle = &#x27;#8b5a2b&#x27;;
    roundRect(o.x, cy - RH*0.28, o.w, RH*0.56, 10);
    ctx.fill();
    ctx.strokeStyle = &#x27;#5e3a17&#x27;; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=&#x27;#5e3a17&#x27;;
    ctx.beginPath(); ctx.arc(o.x+10, cy, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(o.x+o.w-10, cy, 6, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.font = (RH*0.62|0)+&#x27;px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(&#x27;🐢&#x27;, o.x + o.w/2, cy + Math.sin(o.phase)*2);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawFrog() {
  ctx.font = (RH*0.66|0) + &#x27;px serif&#x27;;
  ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
  ctx.fillText(&#x27;🐸&#x27;, frog.x, frog.y - frog.bob);
}

function drawFireflies() {
  for (var i=0;i&lt;10;i++){
    var x = (i+0.5) * (W/10);
    var y = RH*0.5 + Math.sin(riverPhase*2 + i)*6;
    var glow = 0.5 + 0.5*Math.sin(riverPhase*3 + i*1.3);
    ctx.beginPath();
    ctx.fillStyle = &#x27;rgba(255,224,102,&#x27;+ (0.4+0.5*glow) +&#x27;)&#x27;;
    ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = &#x27;rgba(255,224,102,&#x27;+ (0.12*glow) +&#x27;)&#x27;;
    ctx.arc(x, y, 12, 0, Math.PI*2); ctx.fill();
  }
}

function drawSplashes() {
  for (var i=0;i&lt;splashes.length;i++){
    var s = splashes[i];
    ctx.fillStyle = &#x27;rgba(160,220,255,&#x27;+ (1 - s.t/0.6) +&#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2); ctx.fill();
  }
}
function drawSparkles() {
  for (var i=0;i&lt;sparkles.length;i++){
    var s = sparkles[i];
    ctx.fillStyle = s.c;
    ctx.globalAlpha = 1 - s.t/0.7;
    ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// initial static paint
buildLanes(); resetFrog(); draw();

// ---------- Input ----------
window.addEventListener(&#x27;keydown&#x27;, function(e){
  var k = e.key.toLowerCase();
  if (k===&#x27;arrowleft&#x27;||k===&#x27;a&#x27;){ move(-1,0); e.preventDefault(); }
  else if (k===&#x27;arrowright&#x27;||k===&#x27;d&#x27;){ move(1,0); e.preventDefault(); }
  else if (k===&#x27;arrowup&#x27;||k===&#x27;w&#x27;){ move(0,-1); e.preventDefault(); }
  else if (k===&#x27;arrowdown&#x27;||k===&#x27;s&#x27;){ move(0,1); e.preventDefault(); }
});

// swipe / tap on lower half of canvas
var touchStart = null;
function canvasPos(e){
  var r = cv.getBoundingClientRect();
  var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  var cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  return { x: cx * (W/r.width), y: cy * (H/r.height) };
}
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ touchStart = canvasPos(e); e.preventDefault(); }, {passive:false});
cv.addEventListener(&#x27;touchend&#x27;, function(e){
  if (!touchStart) return;
  var r = cv.getBoundingClientRect();
  var t = e.changedTouches[0];
  var x = (t.clientX - r.left) * (W/r.width), y = (t.clientY - r.top) * (H/r.height);
  var dx = x - touchStart.x, dy = y - touchStart.y;
  if (Math.abs(dx) &lt; 20 &amp;&amp; Math.abs(dy) &lt; 20) { move(0,-1); } // tap = hop forward
  else if (Math.abs(dx) &gt; Math.abs(dy)) move(dx&gt;0?1:-1, 0);
  else move(0, dy&gt;0?1:-1);
  touchStart = null;
  e.preventDefault();
}, {passive:false});
cv.addEventListener(&#x27;mousedown&#x27;, function(e){
  if (!running) return;
  var p = canvasPos(e);
  // click upper part = hop forward, otherwise steer toward click
  if (p.y &lt; frog.y - RH*0.3) move(0,-1);
  else if (p.y &gt; frog.y + RH*0.3) move(0,1);
  else if (p.x &lt; frog.x) move(-1,0);
  else move(1,0);
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
