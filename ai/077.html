<body>

&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
  .score { font-weight: 700; color: #fff; transition: color .2s, text-shadow .2s; }
  .score.gold { color: #ffcf3f; text-shadow: 0 0 10px #ffcf3f, 0 0 20px #f90; }
  #mult { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px; background: #ffcf3f; color: #402; font-weight: 800; font-size: 15px; box-shadow: 0 0 12px #ffcf3f; opacity: 0; transform: scale(.6); transition: opacity .2s; }
  #mult.on { opacity: 1; animation: pulse .6s infinite alternate; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.18); } }
  .hearts { letter-spacing: 3px; font-size: 20px; }
  .field { position: relative; width: 620px; height: 460px; flex-shrink: 0; background: #05010f; border: 1px solid #144; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 40px #012; }
  .edgeflash { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 #0ff; opacity: 0; }
  .edgeflash.go { animation: eflash .4s ease-out; }
  @keyframes eflash { 0% { box-shadow: inset 0 0 60px 20px #0ff; opacity: 1; } 100% { box-shadow: inset 0 0 0 0 #0ff; opacity: 0; } }
  .ship { position: absolute; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 26px solid #0ff; filter: drop-shadow(0 0 8px #0ff); }
  .bullet { position: absolute; width: 4px; height: 14px; background: #7ff; border-radius: 2px; box-shadow: 0 0 8px #0ff; }
  .ast { position: absolute; border-radius: 40% 60% 55% 45%; background: #b34dff; box-shadow: 0 0 12px #b34dff; }
  .ufo { position: absolute; border-radius: 50% 50% 45% 45%; background: #ff9020; box-shadow: 0 0 14px #ff9020; }
  .boss { position: absolute; border-radius: 45%; background: #22e6e6; box-shadow: 0 0 22px #22e6e6; }
  .boss.hit { background: #fff !important; box-shadow: 0 0 30px #fff !important; }
  .eshot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ff3355; box-shadow: 0 0 12px #ff3355; }
  .ring { position: absolute; border: 2px solid #fff; border-radius: 50%; pointer-events: none; animation: ring .4s ease-out forwards; }
  @keyframes ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
  .part { position: absolute; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; }
  .strip { width: 620px; height: 34px; background: linear-gradient(#0a1420,#050a12); border: 1px solid #144; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #6ad; font-size: 14px; user-select: none; touch-action: none; cursor: pointer; }
  .over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(2,0,10,.85); }
  .over.show { display: flex; }
  .over h2 { margin: 0; font-size: 44px; color: #ff3366; text-shadow: 0 0 14px #ff3366; letter-spacing: 3px; }
  .over p { font-size: 30px; color: #0ff; text-shadow: 0 0 12px #0ff; margin: 12px 0 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;ASTRO BLITZ&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &amp;larr; &amp;rarr; (or drag the strip below) and press Space (or tap the strip) to fire lasers. Blast asteroids, UFOs, and boss comets — chain 5 hits for a double-score bonus, and don&#x27;t lose all three shields!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;span id=&quot;mult&quot;&gt;x2&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;hearts&quot; id=&quot;hearts&quot;&gt;💙💙💙&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;edgeflash&quot; id=&quot;edge&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ship&quot; id=&quot;ship&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;h2&gt;GAME OVER&lt;/h2&gt;&lt;p&gt;Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;strip&quot; id=&quot;strip&quot;&gt;◄ drag to move &amp;nbsp;·&amp;nbsp; tap to shoot ►&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FW=620, FH=460, SHIP_W=30, SHIP_H=26, SHIP_SPEED=6;
  var running=false, animId=null, spawnId=null;
  var keys={}, shipX=(FW-SHIP_W)/2;
  var bullets=[], enemies=[], eshots=[], score=0, lastShot=0;
  var chain=0, multUntil=0, spawnInterval=1200, speedMul=1, lastLevel=0, shields=3;
  var field=document.getElementById(&#x27;field&#x27;), ship=document.getElementById(&#x27;ship&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;), scoreBox=document.querySelector(&#x27;.score&#x27;);
  var multEl=document.getElementById(&#x27;mult&#x27;), heartsEl=document.getElementById(&#x27;hearts&#x27;);
  var edge=document.getElementById(&#x27;edge&#x27;), over=document.getElementById(&#x27;over&#x27;), finalEl=document.getElementById(&#x27;finalScore&#x27;);

  // ---- audio ----
  var actx=null;
  function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
  function beep(f,dur,type,vol){ var c=ac(); if(!c)return; var o=c.createOscillator(),g=c.createGain(); o.type=type||&#x27;square&#x27;; o.frequency.value=f; g.gain.value=vol||0.08; o.connect(g); g.connect(c.destination); var t=c.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.stop(t+dur); }
  function whoosh(){ var c=ac(); if(!c)return; var o=c.createOscillator(),g=c.createGain(); o.type=&#x27;sawtooth&#x27;; g.gain.value=0.12; o.connect(g); g.connect(c.destination); var t=c.currentTime; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(900,t+0.35); o.start(t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4); o.stop(t+0.4); }

  function paintShip(){ ship.style.left=shipX+&#x27;px&#x27;; ship.style.bottom=&#x27;12px&#x27;; }

  function makeEnemy(){
    var r=Math.random(), e;
    if(r&lt;0.55){ // asteroid
      var s=22+Math.random()*10;
      e={type:&#x27;ast&#x27;, w:s, h:s, x:Math.random()*(FW-s), y:-s, vy:1.9*speedMul, vx:(Math.random()&lt;.5?-1:1)*(1.2+Math.random())*speedMul, hp:1, pts:1};
    } else if(r&lt;0.85){ // ufo
      var w=40;
      e={type:&#x27;ufo&#x27;, w:w, h:22, x:Math.random()*(FW-w), y:-22, baseX:0, y0:0, phase:Math.random()*6, vy:1.2*speedMul, hp:1, pts:2, nextFire:Date.now()+800+Math.random()*1200};
      e.baseX=e.x;
    } else { // boss comet
      var s=52;
      e={type:&#x27;boss&#x27;, w:s, h:s, x:Math.random()*(FW-s), y:-s, vy:0.9*speedMul, vx:(Math.random()&lt;.5?-1:1)*0.6*speedMul, hp:3, pts:5};
    }
    var el=document.createElement(&#x27;div&#x27;);
    el.className=e.type===&#x27;ast&#x27;?&#x27;ast&#x27;:(e.type===&#x27;ufo&#x27;?&#x27;ufo&#x27;:&#x27;boss&#x27;);
    el.style.width=e.w+&#x27;px&#x27;; el.style.height=e.h+&#x27;px&#x27;; el.style.left=e.x+&#x27;px&#x27;; el.style.top=e.y+&#x27;px&#x27;;
    field.appendChild(el); e.el=el; enemies.push(e);
  }

  function shoot(){
    var now=Date.now(); if(now-lastShot&lt;200||!running)return; lastShot=now;
    var b={x:shipX+SHIP_W/2-2, y:FH-12-SHIP_H-14};
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;bullet&#x27;; el.style.left=b.x+&#x27;px&#x27;; el.style.top=b.y+&#x27;px&#x27;;
    field.appendChild(el); b.el=el; bullets.push(b);
    beep(880,0.08,&#x27;square&#x27;,0.05);
  }

  function ring(x,y,color){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ring&#x27;;
    el.style.width=&#x27;24px&#x27;; el.style.height=&#x27;24px&#x27;; el.style.left=(x-12)+&#x27;px&#x27;; el.style.top=(y-12)+&#x27;px&#x27;;
    el.style.borderColor=color||&#x27;#fff&#x27;; el.style.boxShadow=&#x27;0 0 10px &#x27;+(color||&#x27;#fff&#x27;);
    field.appendChild(el); setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },400);
  }
  function burst(x,y,color){
    for(var i=0;i&lt;12;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;part&#x27;;
      p.style.left=x+&#x27;px&#x27;; p.style.top=y+&#x27;px&#x27;; p.style.background=color; p.style.boxShadow=&#x27;0 0 8px &#x27;+color;
      field.appendChild(p);
      var ang=Math.random()*6.28, sp=1.5+Math.random()*3, dx=Math.cos(ang)*sp, dy=Math.sin(ang)*sp, px=x, py=y, life=0;
      (function(pp,pdx,pdy,ppx,ppy){
        var f=setInterval(function(){ ppx+=pdx; ppy+=pdy; pdy+=0.15; life++; pp.style.left=ppx+&#x27;px&#x27;; pp.style.top=ppy+&#x27;px&#x27;; pp.style.opacity=1-life/22;
          if(life&gt;22){ clearInterval(f); if(pp.parentNode)pp.parentNode.removeChild(pp); } },16);
      })(p,dx,dy,px,py);
    }
  }

  function updateMult(){
    var active=Date.now()&lt;multUntil;
    if(active){ scoreBox.classList.add(&#x27;gold&#x27;); multEl.classList.add(&#x27;on&#x27;); }
    else { scoreBox.classList.remove(&#x27;gold&#x27;); multEl.classList.remove(&#x27;on&#x27;); }
  }

  function addScore(base){
    var mul=Date.now()&lt;multUntil?2:1;
    score+=base*mul; scoreEl.textContent=score;
    var level=Math.floor(score/10);
    if(level&gt;lastLevel){ lastLevel=level; speedMul+=0.18; spawnInterval=Math.max(450,spawnInterval-120);
      if(spawnId){ clearInterval(spawnId); spawnId=setInterval(makeEnemy,spawnInterval); }
      edge.classList.remove(&#x27;go&#x27;); void edge.offsetWidth; edge.classList.add(&#x27;go&#x27;); whoosh();
    }
  }

  function hitChain(){
    chain++;
    if(chain&gt;=5 &amp;&amp; chain%5===0){ multUntil=Date.now()+4000; }
    updateMult();
  }
  function breakChain(){ chain=0; }

  function loseShield(){
    shields--; heartsEl.textContent=&#x27;💙&#x27;.repeat(Math.max(0,shields))+&#x27;🖤&#x27;.repeat(3-shields);
    beep(120,0.3,&#x27;sawtooth&#x27;,0.15);
    if(shields&lt;=0) gameOver();
  }

  function gameOver(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    finalEl.textContent=score; over.classList.add(&#x27;show&#x27;);
  }

  function tick(){
    if(!running)return;
    if(keys[&#x27;ArrowLeft&#x27;])shipX-=SHIP_SPEED;
    if(keys[&#x27;ArrowRight&#x27;])shipX+=SHIP_SPEED;
    shipX=Math.max(0,Math.min(FW-SHIP_W,shipX)); paintShip();

    for(var i=bullets.length-1;i&gt;=0;i--){ var b=bullets[i]; b.y-=8; if(b.y&lt;-14){field.removeChild(b.el);bullets.splice(i,1);continue;} b.el.style.top=b.y+&#x27;px&#x27;; }

    var shipCX=shipX+SHIP_W/2, shipCY=FH-12-SHIP_H/2;
    for(var j=enemies.length-1;j&gt;=0;j--){
      var e=enemies[j]; e.y+=e.vy;
      if(e.type===&#x27;ast&#x27;){ e.x+=e.vx; if(e.x&lt;0||e.x&gt;FW-e.w)e.vx*=-1; }
      else if(e.type===&#x27;ufo&#x27;){ e.phase+=0.05; e.x=e.baseX+Math.sin(e.phase)*80; if(e.x&lt;0)e.x=0; if(e.x&gt;FW-e.w)e.x=FW-e.w;
        if(Date.now()&gt;e.nextFire &amp;&amp; e.y&gt;0 &amp;&amp; e.y&lt;FH-120){ e.nextFire=Date.now()+2000+Math.random()*1500; fireEshot(e); } }
      else if(e.type===&#x27;boss&#x27;){ e.x+=e.vx; if(e.x&lt;0||e.x&gt;FW-e.w)e.vx*=-1; }
      if(e.y&gt;FH){ if(e.el.parentNode)field.removeChild(e.el); enemies.splice(j,1); breakChain(); continue; }
      e.el.style.left=e.x+&#x27;px&#x27;; e.el.style.top=e.y+&#x27;px&#x27;;
    }

    for(var k=eshots.length-1;k&gt;=0;k--){ var s=eshots[k]; s.y+=s.vy; s.x+=s.vx;
      if(s.y&gt;FH||s.x&lt;0||s.x&gt;FW){field.removeChild(s.el);eshots.splice(k,1);continue;}
      s.el.style.left=s.x+&#x27;px&#x27;; s.el.style.top=s.y+&#x27;px&#x27;;
      if(s.x&lt;shipCX+12 &amp;&amp; s.x+8&gt;shipCX-12 &amp;&amp; s.y&lt;shipCY+13 &amp;&amp; s.y+8&gt;shipCY-13){ field.removeChild(s.el); eshots.splice(k,1); loseShield(); }
    }

    for(var bi=bullets.length-1;bi&gt;=0;bi--){ var bb=bullets[bi]; var hit=false;
      for(var ei=enemies.length-1;ei&gt;=0;ei--){ var en=enemies[ei];
        if(bb.x&lt;en.x+en.w &amp;&amp; bb.x+4&gt;en.x &amp;&amp; bb.y&lt;en.y+en.h &amp;&amp; bb.y+14&gt;en.y){
          field.removeChild(bb.el); bullets.splice(bi,1); hit=true;
          var cx=en.x+en.w/2, cy=en.y+en.h/2;
          en.hp--; ring(cx,cy,&#x27;#fff&#x27;);
          if(en.hp&gt;0){ en.el.classList.add(&#x27;hit&#x27;); (function(el){setTimeout(function(){el.classList.remove(&#x27;hit&#x27;);},90);})(en.el); beep(300,0.06,&#x27;square&#x27;,0.06); }
          else {
            var col=en.type===&#x27;ast&#x27;?&#x27;#b34dff&#x27;:(en.type===&#x27;ufo&#x27;?&#x27;#ff9020&#x27;:&#x27;#22e6e6&#x27;);
            burst(cx,cy,col); field.removeChild(en.el); enemies.splice(ei,1);
            hitChain(); addScore(en.pts);
            beep(en.type===&#x27;boss&#x27;?150:520,0.18,&#x27;triangle&#x27;,0.1);
          }
          break;
        }
      }
      if(hit)continue;
    }
    updateMult();
    animId=requestAnimationFrame(tick);
  }

  function fireEshot(e){
    var s={x:e.x+e.w/2-4, y:e.y+e.h, vy:2.6, vx:((shipX+SHIP_W/2)-(e.x+e.w/2))/120};
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;eshot&#x27;; el.style.left=s.x+&#x27;px&#x27;; el.style.top=s.y+&#x27;px&#x27;;
    field.appendChild(el); s.el=el; eshots.push(s); beep(220,0.12,&#x27;sawtooth&#x27;,0.06);
  }

  function clearAll(){
    bullets.forEach(function(b){if(b.el.parentNode)b.el.parentNode.removeChild(b.el);});
    enemies.forEach(function(e){if(e.el.parentNode)e.el.parentNode.removeChild(e.el);});
    eshots.forEach(function(s){if(s.el.parentNode)s.el.parentNode.removeChild(s.el);});
    bullets=[]; enemies=[]; eshots=[];
  }

  function startGame(){
    if(running)return;
    clearAll(); over.classList.remove(&#x27;show&#x27;);
    score=0; scoreEl.textContent=&#x27;0&#x27;; chain=0; multUntil=0; shields=3;
    heartsEl.textContent=&#x27;💙💙💙&#x27;; spawnInterval=1200; speedMul=1; lastLevel=0;
    shipX=(FW-SHIP_W)/2; for(var k in keys)keys[k]=false; lastShot=0;
    updateMult(); paintShip();
    running=true; animId=requestAnimationFrame(tick);
    makeEnemy();
    spawnId=setInterval(makeEnemy,spawnInterval);
  }
  function stopGame(){
    if(!running)return; running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keys[e.key]=true;e.preventDefault();}
    else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running)shoot(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;,function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;)keys[e.key]=false; });

  // strip drag/tap
  var strip=document.getElementById(&#x27;strip&#x27;), dragging=false;
  function stripMove(clientX){ var r=field.getBoundingClientRect(); var x=(clientX-r.left)/r.width*FW - SHIP_W/2; shipX=Math.max(0,Math.min(FW-SHIP_W,x)); paintShip(); }
  strip.addEventListener(&#x27;mousedown&#x27;,function(e){ dragging=true; if(running)shoot(); stripMove(e.clientX); });
  window.addEventListener(&#x27;mousemove&#x27;,function(e){ if(dragging)stripMove(e.clientX); });
  window.addEventListener(&#x27;mouseup&#x27;,function(){ dragging=false; });
  strip.addEventListener(&#x27;touchstart&#x27;,function(e){ dragging=true; if(running)shoot(); stripMove(e.touches[0].clientX); e.preventDefault(); },{passive:false});
  strip.addEventListener(&#x27;touchmove&#x27;,function(e){ if(dragging)stripMove(e.touches[0].clientX); e.preventDefault(); },{passive:false});
  window.addEventListener(&#x27;touchend&#x27;,function(){ dragging=false; });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){ try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){} },true);
  });

  paintShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
