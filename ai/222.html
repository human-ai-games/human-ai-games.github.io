<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #cfefff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg,#00fff0,#3a7bff,#b34dff); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(0,255,240,.35); }
  .instructions { font-size: 16px; color: #8fb7c8; margin: 0; text-align: center; line-height: 1.35; max-width: 640px; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 20px; }
  .hud .val { color: #fff; font-weight: 700; }
  #speed { color: #ff8a3d; text-shadow: 0 0 10px rgba(255,138,61,.6); }
  .arena-wrap { position: relative; }
  canvas { display: block; background:
      radial-gradient(circle at 50% 40%, #0b1030 0%, #05060f 80%);
    border-radius: 10px; box-shadow: 0 0 30px rgba(0,180,255,.25), inset 0 0 40px rgba(0,120,255,.12); }
  #flash { position: absolute; inset: 0; border-radius: 10px; pointer-events: none; opacity: 0; }
  .over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(3,5,18,.82); border-radius: 10px; text-align: center; }
  .over h2 { font-size: 34px; margin: 0 0 8px; color: #ff5b8a; text-shadow: 0 0 16px rgba(255,91,138,.6); }
  .over p { margin: 4px; font-size: 20px; }
  .arrow { position: absolute; width: 46px; height: 46px; border-radius: 10px; border: 2px solid rgba(0,255,240,.4);
    background: rgba(0,120,180,.18); color: #8ffff5; font-size: 24px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; }
  .arrow:active { background: rgba(0,255,240,.35); }
  #aUp { top: 8px; left: 50%; transform: translateX(-50%); }
  #aDown { bottom: 8px; left: 50%; transform: translateX(-50%); }
  #aLeft { top: 50%; left: 8px; transform: translateY(-50%); }
  #aRight { top: 50%; right: 8px; transform: translateY(-50%); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with arrow keys (or the on-screen arrows) to devour the star, gem, and lightning bolt. Faster you go the more it&#x27;s worth — avoid the walls and your own tail!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div id=&quot;speed&quot;&gt;🔥 x1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;arena-wrap&quot; id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;c&quot; width=&quot;560&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aUp&quot;&gt;▲&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aDown&quot;&gt;▼&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aLeft&quot;&gt;◀&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aRight&quot;&gt;▶&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;p&gt;Final Score: &lt;span id=&quot;fScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;
      &lt;p&gt;Best Combo: &lt;span id=&quot;fCombo&quot;&gt;0&lt;/span&gt; pts / 5s&lt;/p&gt;
      &lt;p style=&quot;color:#8fb7c8;font-size:16px;&quot;&gt;Press Start below to play again&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 28, ROWS = 22;
  var canvas = document.getElementById(&#x27;c&#x27;), ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), speedEl = document.getElementById(&#x27;speed&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;), overEl = document.getElementById(&#x27;over&#x27;);
  var fScore = document.getElementById(&#x27;fScore&#x27;), fCombo = document.getElementById(&#x27;fCombo&#x27;);

  var running = false, rafId = null, gameOver = false;
  var snake, dir, pendingDir, score, tier;
  var star, gem, bolt;              // collectibles
  var particles = [];               // spark bursts
  var fragments = [];               // shatter pieces
  var gemTimer, boltTimer, moveAcc, lastTime;
  var comboEvents = [], bestCombo = 0;
  var flashColor = null, flashAlpha = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function baseInterval() { return 145 - (tier - 1) * 18; } // ms per move

  function occupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }
  function collideItem(x, y, it) { return it &amp;&amp; it.x === x &amp;&amp; it.y === y; }

  function randCell(avoid) {
    for (var t = 0; t &lt; 300; t++) {
      var x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
      if (occupied(x, y)) continue;
      var bad = false;
      for (var i = 0; i &lt; avoid.length; i++) if (avoid[i] &amp;&amp; avoid[i].x === x &amp;&amp; avoid[i].y === y) bad = true;
      if (!bad) return { x: x, y: y };
    }
    return { x: 0, y: 0 };
  }

  function spawnStar() { var p = randCell([gem, bolt]); star = { x: p.x, y: p.y }; }
  function spawnGem() { var p = randCell([star, bolt]); gem = { x: p.x, y: p.y }; }
  function spawnBolt() {
    var p = randCell([star, gem]);
    bolt = { x: p.x, y: p.y, born: performance.now(), life: 4000 }; // visible 4s
  }

  function reset() {
    snake = [ {x:6,y:11}, {x:5,y:11}, {x:4,y:11} ];
    dir = { x: 1, y: 0 }; pendingDir = { x: 1, y: 0 };
    score = 0; tier = 1;
    scoreEl.textContent = &#x27;0&#x27;; speedEl.textContent = &#x27;🔥 x1&#x27;;
    particles = []; fragments = []; comboEvents = []; bestCombo = 0;
    gem = null; bolt = null;
    spawnStar(); spawnGem();
    gemTimer = 4000; boltTimer = 8000;
    moveAcc = 0;
    flashAlpha = 0; flashColor = null;
    gameOver = false;
    overEl.style.display = &#x27;none&#x27;;
  }

  function updateTier() {
    var nt = Math.min(5, 1 + Math.floor(score / 5));
    if (nt !== tier) { tier = nt; }
    speedEl.textContent = &#x27;🔥 x&#x27; + tier;
  }

  function addCombo(pts) {
    var now = performance.now();
    comboEvents.push({ t: now, pts: pts });
    // sum points in last 5s
    var sum = 0;
    for (var i = comboEvents.length - 1; i &gt;= 0; i--) {
      if (now - comboEvents[i].t &lt;= 5000) sum += comboEvents[i].pts; else break;
    }
    if (sum &gt; bestCombo) bestCombo = sum;
  }

  function burst(cx, cy, color) {
    for (var i = 0; i &lt; 16; i++) {
      var a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3.5;
      particles.push({ x: cx, y: cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color: color });
    }
  }
  function triggerFlash(color) { flashColor = color; flashAlpha = 0.55; }

  function doEat(pts, color, cx, cy) {
    score += pts; scoreEl.textContent = score;
    updateTier();
    addCombo(pts);
    burst(cx, cy, color); triggerFlash(color);
    beep(pts === 5 ? 720 : pts === 3 ? 560 : 420, 0.14, &#x27;triangle&#x27;);
  }

  function shatter() {
    for (var i = 0; i &lt; snake.length; i++) {
      var s = snake[i];
      for (var k = 0; k &lt; 2; k++) {
        var a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
        fragments.push({
          x: s.x*CELL + CELL/2, y: s.y*CELL + CELL/2,
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1,
          hue: 190 - (i/snake.length)*70
        });
      }
    }
  }

  function endGame() {
    running = false; gameOver = true;
    shatter();
    beep(140, 0.4, &#x27;sawtooth&#x27;);
    var start = performance.now();
    function fade() {
      var dt = 16;
      for (var i = 0; i &lt; fragments.length; i++) {
        var f = fragments[i];
        f.x += f.vx; f.y += f.vy; f.vy += 0.12; f.life -= 0.033;
      }
      render(true);
      if (performance.now() - start &lt; 550) { rafId = requestAnimationFrame(fade); }
      else {
        fScore.textContent = score; fCombo.textContent = bestCombo;
        overEl.style.display = &#x27;flex&#x27;;
      }
    }
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(fade);
  }

  function step() {
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) { endGame(); return; }
    var ateStar = collideItem(nx, ny, star);
    var ateGem = collideItem(nx, ny, gem);
    var ateBolt = collideItem(nx, ny, bolt);
    var grows = ateStar || ateGem || ateBolt;
    var body = grows ? snake : snake.slice(0, snake.length - 1);
    for (var i = 0; i &lt; body.length; i++) if (body[i].x === nx &amp;&amp; body[i].y === ny) { endGame(); return; }

    snake.unshift({ x: nx, y: ny });
    if (!grows) snake.pop();

    var cx = nx*CELL + CELL/2, cy = ny*CELL + CELL/2;
    if (ateStar) { doEat(1, &#x27;#ffd23f&#x27;, cx, cy); spawnStar(); }
    if (ateGem) { doEat(3, &#x27;#ff4dd2&#x27;, cx, cy); spawnGem(); gemTimer = 4000; }
    if (ateBolt) { doEat(5, &#x27;#a24dff&#x27;, cx, cy); bolt = null; boltTimer = 8000; }
  }

  function loop(now) {
    if (!running) return;
    if (!lastTime) lastTime = now;
    var delta = now - lastTime; lastTime = now;

    moveAcc += delta;
    var interval = baseInterval();
    while (moveAcc &gt;= interval &amp;&amp; running) { moveAcc -= interval; step(); if (!running) break; }

    // gem relocation
    gemTimer -= delta;
    if (gemTimer &lt;= 0 &amp;&amp; gem) { spawnGem(); gemTimer = 4000; }

    // bolt lifecycle
    if (bolt) { if (now - bolt.born &gt;= bolt.life) { bolt = null; boltTimer = 8000; } }
    else { boltTimer -= delta; if (boltTimer &lt;= 0) spawnBolt(); }

    // particles
    for (var i = particles.length - 1; i &gt;= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.03;
      if (p.life &lt;= 0) particles.splice(i, 1);
    }
    // flash decay
    if (flashAlpha &gt; 0) { flashAlpha -= 0.04; if (flashAlpha &lt; 0) flashAlpha = 0; }

    render(false);
    rafId = requestAnimationFrame(loop);
  }

  function drawGrid() {
    ctx.strokeStyle = &#x27;rgba(60,120,255,0.10)&#x27;;
    ctx.lineWidth = 1;
    for (var x = 0; x &lt;= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
    for (var y = 0; y &lt;= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }
  }

  function roundedCell(px, py, size, r, color, glow) {
    ctx.save();
    ctx.shadowColor = glow; ctx.shadowBlur = 12;
    ctx.fillStyle = color;
    var o = (CELL - size) / 2;
    ctx.beginPath();
    var x = px + o, y = py + o, w = size, h = size;
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function render(dead) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();

    var pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);

    if (!dead) {
      // collectibles
      if (star) drawStar(star.x*CELL + CELL/2, star.y*CELL + CELL/2, 8, &#x27;#ffd23f&#x27;);
      if (gem) {
        var gp = 0.4 + 0.6 * Math.abs(Math.sin(performance.now()/150));
        drawGem(gem.x*CELL + CELL/2, gem.y*CELL + CELL/2, 8, &#x27;rgba(255,77,210,&#x27;+gp+&#x27;)&#x27;);
      }
      if (bolt) drawBolt(bolt);

      // snake ribbon
      var n = snake.length;
      for (var i = n - 1; i &gt;= 0; i--) {
        var s = snake[i];
        var t = i / Math.max(1, n - 1); // 0 head -&gt; 1 tail
        // gradient cyan -&gt; teal -&gt; deep blue
        var col, glow;
        if (t &lt; 0.5) { var f = t/0.5; col = lerpColor([0,255,240],[0,180,200], f); }
        else { var f2 = (t-0.5)/0.5; col = lerpColor([0,180,200],[20,60,180], f2); }
        var sz = 17 - t*3 + (i===0?2:0) + pulse*0.8;
        glow = &#x27;rgba(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;,0.9)&#x27;;
        roundedCell(s.x*CELL, s.y*CELL, sz, 6, &#x27;rgb(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;)&#x27;, glow);
      }
      // eyes on head
      var hd = snake[0];
      ctx.fillStyle = &#x27;#02121a&#x27;;
      var ex = hd.x*CELL + CELL/2, ey = hd.y*CELL + CELL/2;
      ctx.beginPath(); ctx.arc(ex + dir.x*4 - dir.y*3, ey + dir.y*4 - dir.x*3, 2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + dir.x*4 + dir.y*3, ey + dir.y*4 + dir.x*3, 2, 0, 7); ctx.fill();
    } else {
      // shatter fragments
      for (var k = 0; k &lt; fragments.length; k++) {
        var fr = fragments[k];
        if (fr.life &lt;= 0) continue;
        ctx.save();
        ctx.globalAlpha = Math.max(0, fr.life);
        ctx.shadowColor = &#x27;hsl(&#x27;+fr.hue+&#x27;,100%,60%)&#x27;; ctx.shadowBlur = 12;
        ctx.fillStyle = &#x27;hsl(&#x27;+fr.hue+&#x27;,100%,60%)&#x27;;
        ctx.fillRect(fr.x-4, fr.y-4, 8, 8);
        ctx.restore();
      }
    }

    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pa = particles[p];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pa.life);
      ctx.shadowColor = pa.color; ctx.shadowBlur = 8;
      ctx.fillStyle = pa.color;
      ctx.fillRect(pa.x-2, pa.y-2, 4, 4);
      ctx.restore();
    }

    // flash overlay
    if (flashColor) {
      flash.style.background = &#x27;radial-gradient(circle, &#x27; + flashColor + &#x27; 0%, transparent 70%)&#x27;;
      flash.style.opacity = flashAlpha;
    } else flash.style.opacity = 0;
  }

  function lerpColor(a, b, t) {
    return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)];
  }

  function drawStar(cx, cy, r, color) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i &lt; 10; i++) {
      var ang = -Math.PI/2 + i * Math.PI/5;
      var rad = (i % 2 === 0) ? r : r*0.45;
      var x = cx + Math.cos(ang)*rad, y = cy + Math.sin(ang)*rad;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawGem(cx, cy, r, color) {
    ctx.save(); ctx.shadowColor = &#x27;#ff4dd2&#x27;; ctx.shadowBlur = 16; ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy-r); ctx.lineTo(cx+r, cy); ctx.lineTo(cx, cy+r); ctx.lineTo(cx-r, cy);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawBolt(b) {
    var cx = b.x*CELL + CELL/2, cy = b.y*CELL + CELL/2;
    var frac = 1 - (performance.now() - b.born) / b.life; // 1 -&gt; 0
    // countdown ring
    ctx.save();
    ctx.strokeStyle = &#x27;#c07bff&#x27;; ctx.lineWidth = 3; ctx.shadowColor = &#x27;#a24dff&#x27;; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(cx, cy, 11, -Math.PI/2, -Math.PI/2 + Math.PI*2*frac);
    ctx.stroke();
    // bolt
    ctx.fillStyle = &#x27;#c07bff&#x27;; ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.moveTo(cx+2, cy-8); ctx.lineTo(cx-4, cy+1); ctx.lineTo(cx, cy+1);
    ctx.lineTo(cx-2, cy+8); ctx.lineTo(cx+5, cy-2); ctx.lineTo(cx+1, cy-2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function setDir(x, y) { pendingDir = { x: x, y: y }; }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { setDir(-1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { setDir(1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { setDir(0,-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { setDir(0,1); e.preventDefault(); }
  });
  function bindArrow(id, x, y) {
    document.getElementById(id).addEventListener(&#x27;mousedown&#x27;, function(e){ e.preventDefault(); setDir(x,y); });
  }
  bindArrow(&#x27;aUp&#x27;,0,-1); bindArrow(&#x27;aDown&#x27;,0,1); bindArrow(&#x27;aLeft&#x27;,-1,0); bindArrow(&#x27;aRight&#x27;,1,0);

  function startGame() {
    reset();
    running = true; lastTime = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial static paint
  reset();
  running = false;
  render(false);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
