<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌊 Reef Rush 🐙</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #012a4a; color: #eaf6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.4); letter-spacing: .5px; }
  .instructions { font-size: 16px; color: #bfe6ff; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .chest { display: flex; align-items: center; gap: 8px; background: linear-gradient(#8a5a2b,#5e3a17); border: 2px solid #c98a3a; border-radius: 10px; padding: 4px 14px; font-size: 22px; font-weight: 700; box-shadow: 0 3px 6px rgba(0,0,0,.4); }
  .chest.flash { animation: goldflash .5s ease; }
  @keyframes goldflash { 0%{background:linear-gradient(#ffe27a,#ffb800);color:#5e3a17;transform:scale(1.15);} 100%{background:linear-gradient(#8a5a2b,#5e3a17);color:#eaf6ff;transform:scale(1);} }
  .combo { font-size: 18px; font-weight: 700; color: #ffe27a; min-width: 90px; }
  .board { position: relative; width: 640px; height: 460px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 60px rgba(0,0,0,.5); background: linear-gradient(#1b6ca8 0%, #2a8ec9 40%, #0e4b73 100%); cursor: crosshair; }
  .floor { position: absolute; bottom: 0; left: 0; width: 100%; height: 90px; background: linear-gradient(#c2a06b, #a07b45); }
  .coral { position: absolute; bottom: 60px; border-radius: 50% 50% 0 0; opacity:.85; }
  .seaweed { position: absolute; bottom: 70px; width: 12px; border-radius: 6px; transform-origin: bottom center; animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway { from{transform:rotate(-8deg);} to{transform:rotate(8deg);} }
  .bubble { position: absolute; bottom: -30px; border-radius: 50%; background: rgba(255,255,255,.25); border:1px solid rgba(255,255,255,.35); animation: rise linear infinite; }
  @keyframes rise { from{transform:translateY(0);} to{transform:translateY(-520px);} }
  .creature { position: absolute; cursor: pointer; user-select: none; will-change: transform; }
  .creature .emoji { font-size: 52px; display:block; line-height:1; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  @keyframes puffrise { 0%{transform:translateY(30px) scale(.4);} 60%{transform:translateY(0) scale(1.25);} 100%{transform:translateY(0) scale(1);} }
  @keyframes crabin { 0%{transform:translateX(-40px) rotate(-10deg);} 25%{transform:translateX(20px);} 50%{transform:translateX(-14px);} 75%{transform:translateX(8px);} 100%{transform:translateX(0) rotate(0);} }
  @keyframes octoflash { 0%,100%{transform:scale(1);} 50%{transform:scale(1.18) rotate(6deg);} }
  .creature.pop { animation: popaway .3s ease forwards; }
  @keyframes popaway { to{transform:scale(0) rotate(360deg);opacity:0;} }
  .particle { position:absolute; border-radius:50%; pointer-events:none; }
  .comboBanner { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:46px; font-weight:800; color:#fff; text-shadow:0 0 12px #ffd000,0 3px 6px rgba(0,0,0,.5); pointer-events:none; }
  .comboBanner.show { animation: bannerpop .8s ease forwards; }
  @keyframes bannerpop { 0%{transform:translate(-50%,-50%) scale(0);} 30%{transform:translate(-50%,-50%) scale(1.3);} 60%{transform:translate(-50%,-50%) scale(1);} 100%{transform:translate(-50%,-70%) scale(1);opacity:0;} }
  .end { position:absolute; inset:0; background:rgba(1,42,74,.92); display:none; flex-direction:column; align-items:center; justify-content:center; gap:8px; z-index:20; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌊 Reef Rush 🐙&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the sea critters as they pop up — crabs 🦀 are 1 point, puffers 🐡 are 2, and quick octopuses 🐙 are 3! Land 3 hits within 2 seconds to fire up a COMBO multiplier.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;chest&quot; id=&quot;chest&quot;&gt;🪙 &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press Start below to dive in!&lt;/div&gt;
    &lt;div class=&quot;comboBanner&quot; id=&quot;comboBanner&quot;&gt;COMBO!&lt;/div&gt;
    &lt;div class=&quot;end&quot; id=&quot;end&quot;&gt;
      &lt;h2&gt;🏆 Treasure Haul!&lt;/h2&gt;
      &lt;div class=&quot;tally&quot; id=&quot;tally&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
  var BOARD_W = 640, BOARD_H = 460;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var chestEl = document.getElementById(&#x27;chest&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var comboBanner = document.getElementById(&#x27;comboBanner&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);
  var endEl = document.getElementById(&#x27;end&#x27;);
  var tallyEl = document.getElementById(&#x27;tally&#x27;);

  var running = false, score = 0, elapsed = 0;
  var spawnTimer = null, tickTimer = null, endTimer = null;
  var moleTimeouts = [];
  var caught = {crab:0, puffer:0, octopus:0};
  var recentHits = [], comboMult = 1, comboTimer = null;

  var TYPES = {
    crab:   {emoji:&#x27;🦀&#x27;, points:1, life:1500, anim:&#x27;crabin 0.6s ease&#x27;, freq:.5,  pitch:440},
    puffer: {emoji:&#x27;🐡&#x27;, points:2, life:1300, anim:&#x27;puffrise 0.7s ease&#x27;, freq:.35, pitch:620},
    octopus:{emoji:&#x27;🐙&#x27;, points:3, life:800,  anim:&#x27;octoflash 0.5s ease infinite&#x27;, freq:.15, pitch:840}
  };

  // ---- audio ----
  var actx = null;
  function beep(freq, type){
    try {
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.18, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .25);
      o.frequency.exponentialRampToValueAtTime(freq*1.8, actx.currentTime + .12);
      o.start(); o.stop(actx.currentTime + .26);
    } catch(_){}
  }

  // ---- decor ----
  function buildDecor(){
    // coral
    var coralColors = [&#x27;#ff7b7b&#x27;,&#x27;#ff9e5e&#x27;,&#x27;#e26bff&#x27;,&#x27;#ffd166&#x27;];
    for(var i=0;i&lt;7;i++){
      var c=document.createElement(&#x27;div&#x27;); c.className=&#x27;coral&#x27;;
      var w=30+Math.random()*40, h=30+Math.random()*50;
      c.style.width=w+&#x27;px&#x27;; c.style.height=h+&#x27;px&#x27;;
      c.style.left=(Math.random()*(BOARD_W-w))+&#x27;px&#x27;;
      c.style.background=coralColors[i%coralColors.length];
      board.insertBefore(c, msgEl);
    }
    // seaweed
    for(var j=0;j&lt;9;j++){
      var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;seaweed&#x27;;
      s.style.height=(40+Math.random()*60)+&#x27;px&#x27;;
      s.style.left=(Math.random()*BOARD_W)+&#x27;px&#x27;;
      s.style.background=&#x27;linear-gradient(#2e8b57,#57c785)&#x27;;
      s.style.animationDelay=(Math.random()*2)+&#x27;s&#x27;;
      board.insertBefore(s, msgEl);
    }
    // floor
    var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;floor&#x27;; board.insertBefore(f,msgEl);
    // bubbles
    for(var k=0;k&lt;16;k++){
      var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;bubble&#x27;;
      var sz=6+Math.random()*16;
      b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
      b.style.left=(Math.random()*BOARD_W)+&#x27;px&#x27;;
      b.style.animationDuration=(5+Math.random()*7)+&#x27;s&#x27;;
      b.style.animationDelay=(Math.random()*7)+&#x27;s&#x27;;
      board.insertBefore(b,msgEl);
    }
  }
  buildDecor();

  function pickType(){
    var r=Math.random();
    if(r&lt;TYPES.octopus.freq) return &#x27;octopus&#x27;;
    if(r&lt;TYPES.octopus.freq+TYPES.puffer.freq) return &#x27;puffer&#x27;;
    return &#x27;crab&#x27;;
  }

  function spawnCreature(){
    if(!running) return;
    var key = pickType();
    var t = TYPES[key];
    var el = document.createElement(&#x27;div&#x27;);
    el.className=&#x27;creature&#x27;;
    el.innerHTML=&#x27;&lt;span class=&quot;emoji&quot;&gt;&#x27;+t.emoji+&#x27;&lt;/span&gt;&#x27;;
    var x = 20+Math.random()*(BOARD_W-100);
    var y = 20+Math.random()*(BOARD_H-160);
    el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
    el.style.animation=t.anim;
    var hit=false;
    el.addEventListener(&#x27;mousedown&#x27;, function(ev){
      ev.stopPropagation();
      if(hit||!running) return; hit=true;
      registerHit(key, t, x, y);
      el.style.animation=&#x27;&#x27;;
      el.classList.add(&#x27;pop&#x27;);
      beep(t.pitch);
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
    });
    board.insertBefore(el, msgEl);
    var to = setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, t.life);
    moleTimeouts.push(to);
  }

  function registerHit(key, t, x, y){
    caught[key]++;
    // combo
    var now = Date.now();
    recentHits.push(now);
    recentHits = recentHits.filter(function(h){ return now-h &lt;= 2000; });
    if(recentHits.length &gt;= 3){
      comboMult = Math.min(5, comboMult+1);
      recentHits = [];
      showCombo();
    }
    var gained = t.points * comboMult;
    score += gained;
    scoreEl.textContent = score;
    if(t.points &gt;= 2){ chestEl.classList.remove(&#x27;flash&#x27;); void chestEl.offsetWidth; chestEl.classList.add(&#x27;flash&#x27;); }
    burst(x+26, y+26, t.points);
    comboEl.textContent = comboMult&gt;1 ? (&#x27;x&#x27;+comboMult) : &#x27;&#x27;;
    if(comboMult&gt;1){
      clearTimeout(comboTimer);
      comboTimer = setTimeout(function(){ comboMult=1; comboEl.textContent=&#x27;&#x27;; }, 2000);
    }
  }

  function showCombo(){
    comboBanner.textContent = &#x27;COMBO x&#x27;+comboMult+&#x27;!&#x27;;
    comboBanner.classList.remove(&#x27;show&#x27;); void comboBanner.offsetWidth;
    comboBanner.classList.add(&#x27;show&#x27;);
    beep(1000,&#x27;triangle&#x27;);
  }

  function burst(cx, cy, power){
    var colors=[&#x27;#fff&#x27;,&#x27;#8ff&#x27;,&#x27;#ffe27a&#x27;,&#x27;#7cf&#x27;];
    var n = 8 + power*4;
    for(var i=0;i&lt;n;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      var sz=4+Math.random()*8;
      p.style.width=sz+&#x27;px&#x27;; p.style.height=sz+&#x27;px&#x27;;
      p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
      p.style.background=colors[i%colors.length];
      board.insertBefore(p,msgEl);
      var ang=Math.random()*Math.PI*2, dist=30+Math.random()*50;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.animate([
        {transform:&#x27;translate(0,0)&#x27;,opacity:1},
        {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;,opacity:0}
      ],{duration:500+Math.random()*300,easing:&#x27;ease-out&#x27;});
      (function(pp){ setTimeout(function(){ if(pp.parentNode) pp.parentNode.removeChild(pp); },800); })(p);
    }
  }

  function currentSpawnMs(){
    // accelerate over time: 900ms down to ~350ms
    return Math.max(350, 900 - elapsed*12);
  }
  function currentSpawnCount(){
    return 1 + Math.floor(elapsed/12); // more simultaneous creatures over time
  }

  function scheduleSpawn(){
    if(!running) return;
    var count = currentSpawnCount();
    for(var i=0;i&lt;count;i++) spawnCreature();
    spawnTimer = setTimeout(scheduleSpawn, currentSpawnMs());
  }

  var GAME_LEN = 45; // seconds
  function tick(){
    if(!running) return;
    elapsed++;
    if(elapsed &gt;= GAME_LEN){ endGame(); return; }
  }

  function clearCreatures(){
    for(var i=0;i&lt;moleTimeouts.length;i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts=[];
    var cs = board.querySelectorAll(&#x27;.creature, .particle&#x27;);
    for(var j=0;j&lt;cs.length;j++) cs[j].parentNode.removeChild(cs[j]);
  }

  function startGame(){
    if(running) return;
    running=true; score=0; elapsed=0; comboMult=1; recentHits=[];
    caught={crab:0,puffer:0,octopus:0};
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;&#x27;;
    msgEl.style.display=&#x27;none&#x27;; endEl.style.display=&#x27;none&#x27;;
    clearCreatures();
    scheduleSpawn();
    tickTimer = setInterval(tick, 1000);
  }

  function stopGame(){
    running=false;
    clearTimeout(spawnTimer); spawnTimer=null;
    clearInterval(tickTimer); tickTimer=null;
    clearTimeout(comboTimer);
    clearCreatures();
    if(endEl.style.display!==&#x27;flex&#x27;){ msgEl.textContent=&#x27;Paused&#x27;; msgEl.style.display=&#x27;flex&#x27;; }
  }

  function endGame(){
    running=false;
    clearTimeout(spawnTimer); spawnTimer=null;
    clearInterval(tickTimer); tickTimer=null;
    clearCreatures();
    tallyEl.innerHTML =
      &#x27;🪙 Total coins: &lt;b&gt;&#x27;+score+&#x27;&lt;/b&gt;&lt;br&gt;&#x27;+
      &#x27;🦀 Crabs: &#x27;+caught.crab+&#x27;&lt;br&gt;&#x27;+
      &#x27;🐡 Puffers: &#x27;+caught.puffer+&#x27;&lt;br&gt;&#x27;+
      &#x27;🐙 Octopuses: &#x27;+caught.octopus;
    endEl.style.display=&#x27;flex&#x27;;
    // celebratory bubble wave
    for(var i=0;i&lt;24;i++){
      (function(){
        var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;bubble&#x27;;
        var sz=8+Math.random()*22;
        b.style.width=sz+&#x27;px&#x27;; b.style.height=sz+&#x27;px&#x27;;
        b.style.left=(Math.random()*BOARD_W)+&#x27;px&#x27;;
        b.style.animationDuration=(3+Math.random()*4)+&#x27;s&#x27;;
        endEl.appendChild(b);
      })();
    }
    beep(700,&#x27;triangle&#x27;); setTimeout(function(){beep(1000,&#x27;triangle&#x27;);},150); setTimeout(function(){beep(1300,&#x27;triangle&#x27;);},300);
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM

 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },

      } catch (_) {}
    }, true);

  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the

  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {

        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,

        stack: (r &amp;&amp; r.stack) || null,

        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });

  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }

<script>
