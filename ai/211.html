<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☄ COMET DASH</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>☄ COMET DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05040f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#7ee8fa,#ffd86b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #bcc4e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #fff; margin: 0; position: relative;
           text-shadow: 0 0 12px #7ee8fa, 0 0 4px #fff; transition: transform .08s; }
  .score.flash { transform: scale(1.25); }
  .score.mult { padding: 4px 22px; border-radius: 30px; }
  .score.mult::after { content:&#x27;&#x27;; position:absolute; inset:-6px; border-radius:40px;
    border:3px solid #ffd86b; box-shadow:0 0 18px #ffd86b; animation: ringpulse .8s infinite; }
  @keyframes ringpulse { 0%,100%{ opacity:.4; transform:scale(1);} 50%{ opacity:1; transform:scale(1.06);} }
  canvas { border-radius: 10px; display:block; box-shadow: 0 0 30px rgba(80,60,160,.5); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;☄ COMET DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to jump your comet over the tumbling asteroids. Fly through the golden rings for a 3× score boost — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
  &lt;canvas id=&quot;c&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
var canvas = document.getElementById(&#x27;c&#x27;), ctx = canvas.getContext(&#x27;2d&#x27;);
var W = 620, H = 440, GROUND_H = 40;
var scoreEl = document.getElementById(&#x27;score&#x27;);

var running=false, animId=null;
var heroX=80, heroSize=14, heroY, heroVY;
var GRAVITY=0.55, JUMP_V=-11;
var floorY = H - GROUND_H - heroSize;
var asteroids, rings, particles, trail;
var score, displayScore, gameOver, tickCount;
var spawnTimer, ringTimer, multEnd, flashTimer, redFlash;
var starsFar=[], starsNear=[];

// audio
var actx=null;
function beep(f,d,type,vol){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  var o=actx.createOscillator(),g=actx.createGain(); o.type=type||&#x27;sine&#x27;; o.frequency.value=f;
  g.gain.value=vol||0.08; o.connect(g); g.connect(actx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+d); o.stop(actx.currentTime+d);
}catch(e){} }

function initStars(){
  starsFar=[]; starsNear=[];
  for(var i=0;i&lt;60;i++) starsFar.push({x:Math.random()*W,y:Math.random()*(H-GROUND_H),r:Math.random()*1+.3});
  for(var j=0;j&lt;35;j++) starsNear.push({x:Math.random()*W,y:Math.random()*(H-GROUND_H),r:Math.random()*1.6+.8});
}

function reset(){
  heroY=floorY; heroVY=0;
  asteroids=[]; rings=[]; particles=[]; trail=[];
  score=0; displayScore=0; gameOver=false; tickCount=0;
  spawnTimer=40; ringTimer=200; multEnd=0; flashTimer=0; redFlash=0;
  updateScore();
}
function updateScore(){
  scoreEl.textContent = displayScore;
  scoreEl.classList.toggle(&#x27;mult&#x27;, tickCount&lt;multEnd);
}
function speed(){ return 3.2 + Math.min(score/40,4); }
function spawnGap(){ return Math.max(26, 46 - score/8); }

function spawnAsteroid(){
  var count = 1 + Math.floor(Math.random()* (score&gt;30?3:2));
  var baseH = 26 + Math.random()*36;
  var group={ x:W+20, chunks:[], w:0, h:baseH, scored:false, rot:Math.random()*6, rspd:(Math.random()-.5)*.15 };
  var cx=0;
  for(var i=0;i&lt;count;i++){
    var r=10+Math.random()*12;
    group.chunks.push({dx:cx, r:r});
    cx += r*1.4;
  }
  group.w = cx+14;
  asteroids.push(group);
}
function spawnRing(){
  rings.push({ x:W+30, y: floorY - 30 - Math.random()*90, r:26, taken:false });
}

function jump(){
  if(!running||gameOver) return;
  if(heroY &gt;= floorY-1){
    heroVY=JUMP_V;
    for(var i=0;i&lt;14;i++){
      var a=Math.PI*(0.3+Math.random()*0.4)+Math.PI/2;
      particles.push({x:heroX,y:heroY+heroSize/2,vx:Math.cos(a)*(1+Math.random()*3),vy:Math.abs(Math.sin(a))*(1+Math.random()*3),life:24,col:[&#x27;#7ee8fa&#x27;,&#x27;#ffd86b&#x27;,&#x27;#ff8ae0&#x27;][i%3]});
    }
    beep(520,0.12,&#x27;square&#x27;,0.06);
  }
}

function explode(x,y){
  for(var i=0;i&lt;40;i++){
    var a=Math.random()*Math.PI*2, s=1+Math.random()*5;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,col:[&#x27;#ff4d4d&#x27;,&#x27;#ffd86b&#x27;,&#x27;#7ee8fa&#x27;,&#x27;#ff8ae0&#x27;,&#x27;#fff&#x27;][i%5]});
  }
  redFlash=18; beep(120,0.4,&#x27;sawtooth&#x27;,0.12);
}

function heatColor(){
  var t=Math.min(score/120,1);
  var top=[10+t*70, 6+t*4, 30-t*10];
  var bot=[4+t*40, 3, 18-t*8];
  return &#x27;rgb(&#x27;+top[0]+&#x27;,&#x27;+top[1]+&#x27;,&#x27;+top[2]+&#x27;)&#x27;;
}

function draw(){
  // background gradient (cool -&gt; fiery)
  var t=Math.min(score/120,1);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;rgb(&#x27;+Math.round(12+t*90)+&#x27;,&#x27;+Math.round(8+t*10)+&#x27;,&#x27;+Math.round(38-t*20)+&#x27;)&#x27;);
  g.addColorStop(1,&#x27;rgb(&#x27;+Math.round(4+t*50)+&#x27;,3,&#x27;+Math.round(20-t*12)+&#x27;)&#x27;);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // nebula blobs
  ctx.save(); ctx.globalAlpha=.25;
  var nb=ctx.createRadialGradient(150,120,10,150,120,140);
  nb.addColorStop(0,&#x27;rgba(&#x27;+Math.round(120+t*100)+&#x27;,60,200,1)&#x27;); nb.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
  ctx.fillStyle=nb; ctx.fillRect(0,0,W,H);
  var nb2=ctx.createRadialGradient(480,90,10,480,90,120);
  nb2.addColorStop(0,&#x27;rgba(40,80,&#x27;+Math.round(200-t*120)+&#x27;,1)&#x27;); nb2.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
  ctx.fillStyle=nb2; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // parallax stars
  ctx.fillStyle=&#x27;rgba(255,255,255,.5)&#x27;;
  starsFar.forEach(function(s){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); });
  ctx.fillStyle=&#x27;rgba(255,255,255,.9)&#x27;;
  starsNear.forEach(function(s){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); });

  // rings
  rings.forEach(function(r){
    if(r.taken) return;
    var pulse=1+Math.sin(tickCount*0.2)*0.08;
    ctx.save(); ctx.translate(r.x,r.y);
    ctx.strokeStyle=&#x27;#ffd86b&#x27;; ctx.lineWidth=5; ctx.shadowColor=&#x27;#ffd86b&#x27;; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(0,0,r.r*pulse,0,7); ctx.stroke();
    ctx.strokeStyle=&#x27;rgba(255,255,255,.7)&#x27;; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,0,r.r*pulse-4,0,7); ctx.stroke();
    ctx.restore();
  });

  // asteroids
  asteroids.forEach(function(gr){
    gr.chunks.forEach(function(ch){
      var cx=gr.x+ch.dx, cy=floorY+heroSize-ch.r;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(gr.rot+ch.dx);
      ctx.fillStyle=&#x27;#6b6070&#x27;; ctx.strokeStyle=&#x27;#3a3340&#x27;; ctx.lineWidth=2;
      ctx.beginPath();
      for(var k=0;k&lt;8;k++){ var ang=k/8*Math.PI*2; var rr=ch.r*(0.75+((k*37)%10)/20);
        var px=Math.cos(ang)*rr, py=Math.sin(ang)*rr; if(k===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=&#x27;#8a8090&#x27;; ctx.beginPath(); ctx.arc(-ch.r*0.3,-ch.r*0.3,ch.r*0.22,0,7); ctx.fill();
      ctx.restore();
    });
  });

  // trail
  for(var i=0;i&lt;trail.length;i++){
    var p=trail[i], a=i/trail.length;
    ctx.fillStyle=&#x27;rgba(&#x27;+Math.round(126+a*130)+&#x27;,&#x27;+Math.round(232*a)+&#x27;,250,&#x27;+(a*0.6)+&#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(p.x,p.y,heroSize*a*0.8,0,7); ctx.fill();
  }

  // particles
  particles.forEach(function(p){
    ctx.globalAlpha=Math.max(0,p.life/40); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;

  // comet
  ctx.save();
  var grd=ctx.createRadialGradient(heroX,heroY+heroSize/2,1,heroX,heroY+heroSize/2,heroSize*1.6);
  grd.addColorStop(0,&#x27;#ffffff&#x27;); grd.addColorStop(0.5,&#x27;#7ee8fa&#x27;); grd.addColorStop(1,&#x27;rgba(126,232,250,0)&#x27;);
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(heroX,heroY+heroSize/2,heroSize*1.5,0,7); ctx.fill();
  ctx.fillStyle=&#x27;#fff&#x27;; ctx.shadowColor=&#x27;#7ee8fa&#x27;; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.arc(heroX,heroY+heroSize/2,heroSize*0.7,0,7); ctx.fill();
  ctx.restore();

  // ground (neon planet strip)
  var pulse=Math.sin(tickCount*0.12)*0.5+0.5;
  var gg=ctx.createLinearGradient(0,H-GROUND_H,0,H);
  gg.addColorStop(0,&#x27;rgba(&#x27;+Math.round(40+pulse*60)+&#x27;,255,&#x27;+Math.round(120+pulse*80)+&#x27;,1)&#x27;);
  gg.addColorStop(1,&#x27;rgba(6,40,20,1)&#x27;);
  ctx.fillStyle=gg; ctx.fillRect(0,H-GROUND_H,W,GROUND_H);
  ctx.fillStyle=&#x27;rgba(180,255,200,&#x27;+(0.6+pulse*0.4)+&#x27;)&#x27;; ctx.fillRect(0,H-GROUND_H,W,3);

  // red flash overlay
  if(redFlash&gt;0){ ctx.fillStyle=&#x27;rgba(255,40,40,&#x27;+(redFlash/18*0.5)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }
}

function tick(){
  if(!running) return;
  tickCount++;

  // parallax
  var sp=speed();
  starsFar.forEach(function(s){ s.x-=sp*0.25; if(s.x&lt;0){s.x=W;s.y=Math.random()*(H-GROUND_H);} });
  starsNear.forEach(function(s){ s.x-=sp*0.6; if(s.x&lt;0){s.x=W;s.y=Math.random()*(H-GROUND_H);} });

  if(!gameOver){
    heroVY+=GRAVITY; heroY+=heroVY;
    if(heroY&gt;floorY){heroY=floorY;heroVY=0;}
    if(heroY&lt;0){heroY=0;heroVY=0;}

    trail.push({x:heroX,y:heroY+heroSize/2}); if(trail.length&gt;12) trail.shift();

    // spawns
    if(--spawnTimer&lt;=0){ spawnAsteroid(); spawnTimer=spawnGap(); }
    if(--ringTimer&lt;=0){ spawnRing(); ringTimer=180+Math.random()*120; }

    // move asteroids
    for(var i=asteroids.length-1;i&gt;=0;i--){
      var gr=asteroids[i]; gr.x-=sp; gr.rot+=gr.rspd;
      if(gr.x+gr.w&lt;0){ asteroids.splice(i,1); continue; }
      if(!gr.scored &amp;&amp; gr.x+gr.w&lt;heroX){
        gr.scored=true;
        var add = tickCount&lt;multEnd?3:1;
        score+=add; displayScore=score;
        scoreEl.classList.add(&#x27;flash&#x27;); clearTimeout(flashTimer);
        flashTimer=setTimeout(function(){scoreEl.classList.remove(&#x27;flash&#x27;);},90);
        updateScore(); beep(660,0.06,&#x27;sine&#x27;,0.05);
      }
      // collision
      var gtop=floorY+heroSize-gr.h;
      if(heroX+heroSize*0.6&gt;gr.x &amp;&amp; heroX-heroSize*0.6&lt;gr.x+gr.w &amp;&amp; heroY+heroSize&gt;gtop){
        gameOver=true; explode(heroX,heroY+heroSize/2);
        setTimeout(function(){ stopGame(); }, 700);
      }
    }

    // rings
    for(var r=rings.length-1;r&gt;=0;r--){
      var rg=rings[r]; rg.x-=sp;
      if(rg.x+rg.r&lt;0){ rings.splice(r,1); continue; }
      if(!rg.taken){
        var dx=heroX-rg.x, dy=(heroY+heroSize/2)-rg.y;
        if(Math.sqrt(dx*dx+dy*dy)&lt;rg.r+heroSize*0.5){
          rg.taken=true; multEnd=tickCount+300;
          for(var q=0;q&lt;20;q++){var a=Math.random()*7;particles.push({x:rg.x,y:rg.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,life:30,col:&#x27;#ffd86b&#x27;});}
          updateScore(); beep(880,0.2,&#x27;triangle&#x27;,0.08);
        }
      }
    }
    if(tickCount===multEnd) updateScore();
  }

  // particles physics
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life--;
    if(pt.life&lt;=0) particles.splice(p,1);
  }
  if(redFlash&gt;0) redFlash--;

  draw();
  animId=requestAnimationFrame(tick);
}

function startGame(){
  if(running) return;
  reset(); running=true; animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
});
canvas.addEventListener(&#x27;click&#x27;,function(){ jump(); });
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

initStars(); reset(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
