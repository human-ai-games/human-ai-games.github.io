<title>NEON REEF DEFENSE</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON REEF DEFENSE</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #03071a; color: #d6faff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       color: #6ff7ff; text-shadow: 0 0 8px #21d4d4, 0 0 18px #0e8a9a; }
  .instructions { font-size: 16px; color: #8fd6e6; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; align-items: center; gap: 14px; font-size: 18px; }
  .score { color: #4ff0d8; text-shadow: 0 0 8px #2bd3b8; font-weight: 700; min-width: 120px; }
  .combo { color: #ffd24a; text-shadow: 0 0 8px #ff9d2b; font-weight: 700; min-width: 60px; }
  .depthwrap { flex: 1; }
  .depthlabel { font-size: 13px; color: #7fb6c9; }
  .depthbar { width: 100%; height: 12px; background: #0a1636; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 6px #000; }
  .depthfill { height: 100%; width: 0%; background: linear-gradient(90deg,#1f7ad6,#5ff0ff); box-shadow: 0 0 8px #5ff0ff; transition: width .2s linear; }
  .field { position: relative; width: 620px; height: 440px; flex-shrink: 0;
           background: radial-gradient(ellipse at 50% 120%, #0a2246 0%, #041033 55%, #020818 100%);
           border-radius: 10px; overflow: hidden; box-shadow: 0 0 22px #0a3a66 inset, 0 0 8px #0a3a66; }
  canvas { display: block; }
  #msg { position: absolute; top: 40%; left: 0; width: 100%; text-align: center; pointer-events: none;
         font-size: 46px; font-weight: 800; letter-spacing: 2px; opacity: 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON REEF DEFENSE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your sub with the &amp;larr; &amp;rarr; arrow keys and press Space to fire sonar pulses at the drifting sea creatures. Tap an arrow quickly to angle your shot; chain hits within one second for combo multipliers!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;depthwrap&quot;&gt;
      &lt;div class=&quot;depthlabel&quot;&gt;Depth&lt;/div&gt;
      &lt;div class=&quot;depthbar&quot;&gt;&lt;div class=&quot;depthfill&quot; id=&quot;depthfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var depthEl = document.getElementById(&#x27;depthfill&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var GAME_MS = 60000;
  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var score = 0, startTime = 0, level = 0, nextSurgeAt = 10;
  var shipX, aim = 0, aimTimer = 0;
  var lastTapTime = 0, lastTapKey = null;
  var bullets, enemies, particles, bubbles;
  var lastShot = 0;
  var comboCount = 0, comboTimer = 0, redFlash = 0, msgTimer = 0;

  var SHIP_W = 46, SHIP_H = 26, SHIP_BOTTOM = 10, SHIP_SPEED = 6;

  var TYPES = [
    { name:&#x27;jelly&#x27;,  color:&#x27;#ff5ee0&#x27;, glow:&#x27;#ff9df0&#x27; },
    { name:&#x27;puffer&#x27;, color:&#x27;#ffd24a&#x27;, glow:&#x27;#fff09a&#x27; },
    { name:&#x27;angler&#x27;, color:&#x27;#5ff0ff&#x27;, glow:&#x27;#c2fbff&#x27; }
  ];
  var SIZES = [
    { r:14, pts:1, sp:1.4 },
    { r:22, pts:2, sp:1.1 },
    { r:32, pts:3, sp:0.85 }
  ];

  function initBubbles() {
    bubbles = [];
    for (var i=0;i&lt;40;i++){
      bubbles.push({ x:Math.random()*W, y:Math.random()*H, r:1+Math.random()*3, sp:0.2+Math.random()*0.7 });
    }
  }

  function spawnEnemy() {
    var t = TYPES[(Math.random()*3)|0];
    var s = SIZES[(Math.random()*3)|0];
    var e = {
      type:t, size:s,
      x: s.r + Math.random()*(W-2*s.r),
      y: -s.r,
      baseX: 0, phase: Math.random()*Math.PI*2,
      amp: 20+Math.random()*40,
      vy: s.sp * (1 + level*0.18),
      pulse: Math.random()*Math.PI*2
    };
    e.baseX = e.x;
    enemies.push(e);
  }

  function fire() {
    var now = Date.now();
    if (now - lastShot &lt; 200) return;
    lastShot = now;
    var ang = aim * (Math.PI/180); // aim in degrees, up is -y
    var tipY = H - SHIP_BOTTOM - SHIP_H;
    var color = [&#x27;#6ff7ff&#x27;,&#x27;#8affd0&#x27;,&#x27;#ffd24a&#x27;][(Math.random()*3)|0];
    bullets.push({
      x: shipX + SHIP_W/2, y: tipY,
      vx: Math.sin(ang)*8, vy: -Math.cos(ang)*8,
      color: color
    });
  }

  function burst(x,y,color,n) {
    for (var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, sp = 1+Math.random()*4;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
    }
  }

  function showMsg(text, color) {
    msgEl.textContent = text;
    msgEl.style.color = color;
    msgEl.style.textShadow = &#x27;0 0 14px &#x27;+color;
    msgTimer = 1;
  }

  function tick() {
    if (!running) return;
    var elapsed = Date.now() - startTime;
    if (elapsed &gt;= GAME_MS) { endGame(); return; }

    // ship move
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(W - SHIP_W, shipX));
    if (aimTimer &gt; 0) { aimTimer--; if (aimTimer===0) aim = 0; }

    // draw background
    ctx.clearRect(0,0,W,H);
    // bubbles
    ctx.save();
    for (var i=0;i&lt;bubbles.length;i++){
      var b = bubbles[i];
      b.y -= b.sp; if (b.y &lt; -4){ b.y = H+4; b.x = Math.random()*W; }
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fillStyle = &#x27;rgba(120,200,255,0.10)&#x27;;
      ctx.fill();
    }
    ctx.restore();

    // bullets
    ctx.save();
    for (var i=bullets.length-1;i&gt;=0;i--){
      var bl = bullets[i];
      bl.x += bl.vx; bl.y += bl.vy;
      if (bl.y &lt; -12 || bl.x &lt; -12 || bl.x &gt; W+12){ bullets.splice(i,1); continue; }
      ctx.shadowBlur = 12; ctx.shadowColor = bl.color;
      ctx.fillStyle = bl.color;
      ctx.beginPath(); ctx.arc(bl.x,bl.y,3.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // enemies
    ctx.save();
    for (var i=enemies.length-1;i&gt;=0;i--){
      var e = enemies[i];
      e.y += e.vy;
      e.phase += 0.04;
      e.x = e.baseX + Math.sin(e.phase)*e.amp;
      e.pulse += 0.12;
      var r = e.size.r;
      if (e.y - r &gt; H){
        // reached bottom
        enemies.splice(i,1);
        redFlash = 1;
        comboCount = 0; comboTimer = 0;
        continue;
      }
      drawEnemy(e);
    }
    ctx.restore();

    // collisions
    for (var i=bullets.length-1;i&gt;=0;i--){
      var bl = bullets[i];
      for (var j=enemies.length-1;j&gt;=0;j--){
        var e = enemies[j];
        var dx = bl.x - e.x, dy = bl.y - e.y;
        if (dx*dx+dy*dy &lt; (e.size.r+3.5)*(e.size.r+3.5)){
          bullets.splice(i,1);
          burst(e.x,e.y,e.type.color, 14 + e.size.r);
          enemies.splice(j,1);
          // combo
          comboCount++; comboTimer = 60; // ~1s
          var mult = comboCount&gt;=3?3:(comboCount&gt;=2?2:1);
          score += e.size.pts * mult;
          scoreEl.textContent = score;
          if (mult&gt;1) showMsg(&#x27;x&#x27;+mult+&#x27; COMBO!&#x27;, &#x27;#ffd24a&#x27;);
          if (score &gt;= nextSurgeAt){
            level++;
            nextSurgeAt += 10;
            redFlash = 0;
            showMsg(&#x27;DEPTH SURGE!&#x27;, &#x27;#6ff7ff&#x27;);
            surgeFlash = 1;
          }
          break;
        }
      }
    }

    // particles
    ctx.save();
    for (var i=particles.length-1;i&gt;=0;i--){
      var p = particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=0.03;
      if (p.life&lt;=0){ particles.splice(i,1); continue; }
      ctx.globalAlpha = p.life;
      ctx.shadowBlur = 10; ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // combo timer
    if (comboTimer&gt;0){ comboTimer--; if (comboTimer===0) comboCount=0; }
    comboEl.textContent = comboCount&gt;=2 ? (&#x27;x&#x27;+(comboCount&gt;=3?3:2)) : &#x27;&#x27;;

    // ship
    drawShip();

    // red flash overlay
    if (redFlash&gt;0){
      ctx.fillStyle = &#x27;rgba(255,40,40,&#x27;+(redFlash*0.4)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
      redFlash -= 0.05; if (redFlash&lt;0) redFlash=0;
    }
    if (surgeFlash&gt;0){
      ctx.fillStyle = &#x27;rgba(120,240,255,&#x27;+(surgeFlash*0.35)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
      surgeFlash -= 0.06; if (surgeFlash&lt;0) surgeFlash=0;
    }

    // message fade
    if (msgTimer&gt;0){ msgTimer-=0.02; msgEl.style.opacity = Math.max(0,Math.min(1,msgTimer*1.5)); }
    else msgEl.style.opacity = 0;

    // depth bar
    depthEl.style.width = Math.min(100, elapsed/GAME_MS*100) + &#x27;%&#x27;;

    animId = requestAnimationFrame(tick);
  }
  var surgeFlash = 0;

  function drawEnemy(e){
    var r = e.size.r, glow = e.type.glow, col = e.type.color;
    ctx.shadowBlur = 16; ctx.shadowColor = glow;
    ctx.fillStyle = col;
    if (e.type.name===&#x27;jelly&#x27;){
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, Math.PI, 0);
      ctx.lineTo(e.x+r, e.y+r*0.4);
      ctx.lineTo(e.x-r, e.y+r*0.4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      for (var t=-2;t&lt;=2;t++){
        ctx.beginPath();
        ctx.moveTo(e.x+t*r*0.35, e.y+r*0.4);
        ctx.lineTo(e.x+t*r*0.35+Math.sin(e.pulse+t)*4, e.y+r*1.2);
        ctx.stroke();
      }
    } else if (e.type.name===&#x27;puffer&#x27;){
      var pr = r*(1+Math.sin(e.pulse)*0.08);
      ctx.beginPath(); ctx.arc(e.x,e.y,pr,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = e.type.glow; ctx.lineWidth = 2;
      for (var k=0;k&lt;10;k++){
        var a = k/10*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(e.x+Math.cos(a)*pr, e.y+Math.sin(a)*pr);
        ctx.lineTo(e.x+Math.cos(a)*(pr+5), e.y+Math.sin(a)*(pr+5));
        ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.ellipse(e.x,e.y,r,r*0.75,0,0,Math.PI*2); ctx.fill();
      // lure
      ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#fff&#x27;;
      ctx.fillStyle = &#x27;#fffbe0&#x27;;
      ctx.beginPath(); ctx.arc(e.x, e.y-r*0.9-Math.sin(e.pulse)*2, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;#04202a&#x27;;
      ctx.beginPath(); ctx.arc(e.x+r*0.4, e.y-r*0.2, r*0.14, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawShip(){
    var x = shipX, y = H - SHIP_BOTTOM - SHIP_H;
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = &#x27;#5ff0ff&#x27;;
    ctx.fillStyle = redFlash&gt;0 ? &#x27;#ff5555&#x27; : &#x27;#2ec7d8&#x27;;
    ctx.beginPath();
    ctx.ellipse(x+SHIP_W/2, y+SHIP_H/2, SHIP_W/2, SHIP_H/2, 0, 0, Math.PI*2);
    ctx.fill();
    // dome
    ctx.fillStyle = &#x27;#bffcff&#x27;;
    ctx.beginPath();
    ctx.ellipse(x+SHIP_W/2, y+SHIP_H*0.35, SHIP_W*0.22, SHIP_H*0.28, 0, 0, Math.PI*2);
    ctx.fill();
    // aim indicator
    var ang = aim*(Math.PI/180);
    ctx.strokeStyle = &#x27;#6ff7ff&#x27;; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x+SHIP_W/2, y);
    ctx.lineTo(x+SHIP_W/2+Math.sin(ang)*22, y-Math.cos(ang)*22);
    ctx.stroke();
    ctx.restore();
  }

  function reset(){
    score = 0; level = 0; nextSurgeAt = 10;
    shipX = (W-SHIP_W)/2; aim = 0; aimTimer = 0;
    bullets = []; enemies = []; particles = [];
    comboCount = 0; comboTimer = 0; redFlash = 0; surgeFlash = 0; msgTimer = 0;
    lastShot = 0; lastTapTime = 0; lastTapKey = null;
    for (var k in keysDown) keysDown[k] = false;
    initBubbles();
    scoreEl.textContent = &#x27;0&#x27;;
    comboEl.textContent = &#x27;&#x27;;
    depthEl.style.width = &#x27;0%&#x27;;
    msgEl.style.opacity = 0;
  }

  function startGame(){
    if (running) return;
    reset();
    running = true;
    startTime = Date.now();
    spawnEnemy();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(function(){
      var extra = 1 + level*0.5;
      spawnEnemy();
      if (Math.random() &lt; Math.min(0.6, 0.15+level*0.1)) spawnEnemy();
    }, 900);
  }
  function stopGame(){
    running = false;
    if (animId){ cancelAnimationFrame(animId); animId=null; }
    if (spawnId){ clearInterval(spawnId); spawnId=null; }
  }
  function endGame(){
    stopGame();
    showMsg(&#x27;FINAL: &#x27;+score, &#x27;#4ff0d8&#x27;);
    msgTimer = 3;
    // keep fading over long time
    var fadeMsg = setInterval(function(){
      msgTimer -= 0.02;
      msgEl.style.opacity = Math.max(0, Math.min(1, msgTimer*0.5));
      if (msgTimer&lt;=0){ clearInterval(fadeMsg); }
    }, 30);
    depthEl.style.width = &#x27;100%&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27; || e.key===&#x27;ArrowRight&#x27;){
      if (!keysDown[e.key]){
        var now = Date.now();
        if (lastTapKey===e.key &amp;&amp; now-lastTapTime &lt; 300){
          aim = e.key===&#x27;ArrowLeft&#x27; ? -15 : 15;
          aimTimer = 90;
        }
        lastTapKey = e.key; lastTapTime = now;
      }
      keysDown[e.key] = true;
      e.preventDefault();
    } else if (e.key===&#x27; &#x27; || e.code===&#x27;Space&#x27;){
      if (running) fire();
      e.preventDefault();
    }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27; || e.key===&#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static paint
  reset();
  drawShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
