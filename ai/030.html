<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #01131f; color: #cdf; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; color: #6ff; text-shadow: 0 0 10px #0cf; }
  .instructions { font-size: 16px; color: #8cf; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 18px; font-weight: 600; }
  .hud .val { color: #7ff; text-shadow: 0 0 8px #0cf; }
  .mult { color: #ff5; text-shadow: 0 0 8px #fa0; }
  .timer { color: #f88; text-shadow: 0 0 8px #f00; }

  .field {
    position: relative; width: 660px; height: 470px; flex-shrink: 0;
    border-radius: 10px; overflow: hidden;
    background: linear-gradient(180deg, #041830 0%, #062a44 40%, #043b4a 100%);
    box-shadow: 0 0 20px #0af inset;
  }
  .waves {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,180,220,0.18), transparent 45%),
      radial-gradient(circle at 75% 60%, rgba(80,60,220,0.18), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(0,220,180,0.15), transparent 50%);
    background-size: 140% 140%, 160% 160%, 130% 130%;
    animation: drift 12s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes drift {
    0% { background-position: 0% 0%, 100% 0%, 50% 100%; }
    100% { background-position: 100% 100%, 0% 100%, 50% 0%; }
  }

  .sub {
    position: absolute; width: 46px; height: 30px; bottom: 10px;
    font-size: 30px; line-height: 30px; text-align: center;
    filter: drop-shadow(0 0 8px #0ff);
  }
  .torpedo {
    position: absolute; width: 6px; height: 16px; border-radius: 3px;
    background: linear-gradient(180deg, #fff, #0ff);
    box-shadow: 0 0 8px #0ff, 0 0 14px #0af;
  }
  .enemy {
    position: absolute; text-align: center; line-height: 1;
    filter: drop-shadow(0 0 6px currentColor);
  }
  .boss {
    position: absolute; text-align: center; line-height: 1; font-size: 54px;
    filter: drop-shadow(0 0 14px #f0f);
  }
  .bosshp {
    position: absolute; font-size: 11px; font-weight: 700; color: #fff;
    text-shadow: 0 0 4px #f0f;
  }
  .bubble {
    position: absolute; border-radius: 50%; background: rgba(180,240,255,0.28);
    border: 1px solid rgba(200,250,255,0.4); pointer-events: none;
  }
  .spark {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    pointer-events: none;
  }
  .streak {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    font-size: 40px; font-weight: 900; color: #ff5; letter-spacing: 2px;
    text-shadow: 0 0 12px #f80, 0 0 24px #f40; opacity: 0;
    pointer-events: none; white-space: nowrap;
  }
  .streak.show { animation: pop 0.9s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.4); }
    30% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; background: rgba(2,15,25,0.78); color: #7ff;
    font-size: 26px; font-weight: 700; text-shadow: 0 0 10px #0cf; text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 40px; color: #ff5; text-shadow: 0 0 14px #f80; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌊 STELLAR REEF DEFENSE 🌊&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and fire torpedoes with &lt;strong&gt;Space&lt;/strong&gt; to blast the sea creatures. Chain hits without missing to build a HOT STREAK multiplier up to 4x before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;mult&quot;&gt;Mult: &lt;span id=&quot;mult&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot;&gt;Time: &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;waves&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub&quot; id=&quot;sub&quot;&gt;🛸&lt;/div&gt;
    &lt;div class=&quot;streak&quot; id=&quot;streak&quot;&gt;HOT STREAK!&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div&gt;Press Start below to dive in!&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var FIELD_W = 660, FIELD_H = 470;
var SUB_W = 46, SUB_H = 30, SUB_BOTTOM = 10, SUB_SPEED = 6;
var TORP_W = 6, TORP_H = 16, TORP_SPEED = 8;

var field = document.getElementById(&#x27;field&#x27;);
var sub = document.getElementById(&#x27;sub&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var multEl = document.getElementById(&#x27;mult&#x27;);
var timeEl = document.getElementById(&#x27;time&#x27;);
var streakEl = document.getElementById(&#x27;streak&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;);

var running = false, animId = null;
var spawnId = null, bossId = null, timerId = null, bubbleId = null, rampId = null;
var keysDown = {};
var subX = (FIELD_W - SUB_W) / 2;
var torps = [], enemies = [], bubbles = [], sparks = [];
var boss = null;
var score = 0, mult = 1, combo = 0, timeLeft = 60, lastShot = 0;
var spawnInterval = 1000, speedMul = 1;

var TYPES = [
  { emoji: &#x27;🪼&#x27;, color: &#x27;#9cf&#x27;, size: 30, pts: 10 },  // jellyfish
  { emoji: &#x27;🐡&#x27;, color: &#x27;#fb5&#x27;, size: 30, pts: 15 },  // anglerfish
  { emoji: &#x27;🐍&#x27;, color: &#x27;#5f8&#x27;, size: 32, pts: 20 },  // sea-serpent
  { emoji: &#x27;🐙&#x27;, color: &#x27;#f6a&#x27;, size: 34, pts: 25 }
];

function paintSub() { sub.style.left = subX + &#x27;px&#x27;; }

function spawnEnemy() {
  var ty = TYPES[Math.floor(Math.random() * TYPES.length)];
  var e = { type: ty, size: ty.size, x: Math.random() * (FIELD_W - ty.size), y: -ty.size,
            vy: (1.1 + Math.random() * 0.8) * speedMul,
            vx: (Math.random() - 0.5) * 1.2, el: null };
  var el = document.createElement(&#x27;div&#x27;);
  el.className = &#x27;enemy&#x27;;
  el.style.fontSize = ty.size + &#x27;px&#x27;;
  el.style.width = ty.size + &#x27;px&#x27;;
  el.style.height = ty.size + &#x27;px&#x27;;
  el.style.color = ty.color;
  el.textContent = ty.emoji;
  el.style.left = e.x + &#x27;px&#x27;;
  el.style.top = e.y + &#x27;px&#x27;;
  field.appendChild(el);
  e.el = el;
  enemies.push(e);
}

function spawnBoss() {
  if (boss || !running) return;
  var size = 54;
  var b = { size: size, x: -size, y: 60 + Math.random() * 120, vx: 1.1 * speedMul, hp: 3, el: null, hpEl: null };
  var el = document.createElement(&#x27;div&#x27;);
  el.className = &#x27;boss&#x27;;
  el.textContent = &#x27;🦑&#x27;;
  el.style.left = b.x + &#x27;px&#x27;;
  el.style.top = b.y + &#x27;px&#x27;;
  field.appendChild(el);
  var hpEl = document.createElement(&#x27;div&#x27;);
  hpEl.className = &#x27;bosshp&#x27;;
  hpEl.textContent = &#x27;HP 3&#x27;;
  field.appendChild(hpEl);
  b.el = el; b.hpEl = hpEl;
  boss = b;
}

function fireTorpedo() {
  var now = Date.now();
  if (now - lastShot &lt; 220) return;
  lastShot = now;
  var t = { x: subX + SUB_W / 2 - TORP_W / 2, y: FIELD_H - SUB_BOTTOM - SUB_H - TORP_H, el: null };
  var el = document.createElement(&#x27;div&#x27;);
  el.className = &#x27;torpedo&#x27;;
  el.style.left = t.x + &#x27;px&#x27;;
  el.style.top = t.y + &#x27;px&#x27;;
  field.appendChild(el);
  t.el = el;
  torps.push(t);
}

function makeBubble() {
  var size = 4 + Math.random() * 10;
  var b = { x: Math.random() * FIELD_W, y: FIELD_H + size, size: size,
            vy: 0.6 + Math.random() * 1.2, el: null };
  var el = document.createElement(&#x27;div&#x27;);
  el.className = &#x27;bubble&#x27;;
  el.style.width = size + &#x27;px&#x27;; el.style.height = size + &#x27;px&#x27;;
  el.style.left = b.x + &#x27;px&#x27;; el.style.top = b.y + &#x27;px&#x27;;
  field.appendChild(el);
  b.el = el;
  bubbles.push(b);
}

function burst(x, y, color) {
  for (var i = 0; i &lt; 10; i++) {
    var ang = Math.random() * Math.PI * 2;
    var sp = 1 + Math.random() * 3;
    var s = { x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
              life: 1, el: null };
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;spark&#x27;;
    var cols = [color, &#x27;#fff&#x27;, &#x27;#ff5&#x27;, &#x27;#0ff&#x27;];
    el.style.background = cols[i % cols.length];
    el.style.boxShadow = &#x27;0 0 6px &#x27; + el.style.background;
    el.style.left = x + &#x27;px&#x27;; el.style.top = y + &#x27;px&#x27;;
    field.appendChild(el);
    s.el = el;
    sparks.push(s);
  }
}

function updateMult() {
  if (combo &gt;= 9) mult = 4;
  else if (combo &gt;= 6) mult = 3;
  else if (combo &gt;= 3) mult = 2;
  else mult = 1;
  multEl.textContent = &#x27;x&#x27; + mult;
}

function flashStreak(txt) {
  streakEl.textContent = txt;
  streakEl.classList.remove(&#x27;show&#x27;);
  void streakEl.offsetWidth;
  streakEl.classList.add(&#x27;show&#x27;);
}

function onHit(pts, x, y, color) {
  var prevMult = mult;
  combo++;
  updateMult();
  score += pts * mult;
  scoreEl.textContent = score;
  burst(x, y, color);
  if (mult &gt; prevMult) flashStreak(mult &gt;= 4 ? &#x27;MAX x4!&#x27; : &#x27;HOT STREAK x&#x27; + mult + &#x27;!&#x27;);
}

function onMiss() {
  if (combo &gt; 0) { combo = 0; updateMult(); }
}

function tick() {
  if (!running) return;
  if (keysDown[&#x27;ArrowLeft&#x27;]) subX -= SUB_SPEED;
  if (keysDown[&#x27;ArrowRight&#x27;]) subX += SUB_SPEED;
  subX = Math.max(0, Math.min(FIELD_W - SUB_W, subX));
  paintSub();

  // torpedoes
  for (var i = torps.length - 1; i &gt;= 0; i--) {
    var t = torps[i];
    t.y -= TORP_SPEED;
    if (t.y + TORP_H &lt; 0) {
      field.removeChild(t.el); torps.splice(i, 1);
      onMiss();
      continue;
    }
    t.el.style.top = t.y + &#x27;px&#x27;;
  }

  // enemies
  for (var j = enemies.length - 1; j &gt;= 0; j--) {
    var e = enemies[j];
    e.y += e.vy;
    e.x += e.vx;
    if (e.x &lt; 0 || e.x &gt; FIELD_W - e.size) e.vx *= -1;
    if (e.y &gt; FIELD_H) { field.removeChild(e.el); enemies.splice(j, 1); continue; }
    e.el.style.top = e.y + &#x27;px&#x27;;
    e.el.style.left = e.x + &#x27;px&#x27;;
  }

  // boss
  if (boss) {
    boss.x += boss.vx;
    boss.el.style.left = boss.x + &#x27;px&#x27;;
    boss.hpEl.style.left = (boss.x + 6) + &#x27;px&#x27;;
    boss.hpEl.style.top = (boss.y - 14) + &#x27;px&#x27;;
    if (boss.x &gt; FIELD_W) {
      field.removeChild(boss.el); field.removeChild(boss.hpEl); boss = null;
    }
  }

  // collisions torp vs enemies
  for (var a = torps.length - 1; a &gt;= 0; a--) {
    var tt = torps[a];
    var hitSomething = false;
    for (var b = enemies.length - 1; b &gt;= 0; b--) {
      var en = enemies[b];
      if (tt.x &lt; en.x + en.size &amp;&amp; tt.x + TORP_W &gt; en.x &amp;&amp;
          tt.y &lt; en.y + en.size &amp;&amp; tt.y + TORP_H &gt; en.y) {
        onHit(en.type.pts, en.x + en.size / 2, en.y + en.size / 2, en.type.color);
        field.removeChild(en.el); enemies.splice(b, 1);
        field.removeChild(tt.el); torps.splice(a, 1);
        hitSomething = true;
        break;
      }
    }
    if (hitSomething) continue;
    // torp vs boss
    if (boss) {
      if (tt.x &lt; boss.x + boss.size &amp;&amp; tt.x + TORP_W &gt; boss.x &amp;&amp;
          tt.y &lt; boss.y + boss.size &amp;&amp; tt.y + TORP_H &gt; boss.y) {
        boss.hp--;
        burst(boss.x + boss.size / 2, boss.y + boss.size / 2, &#x27;#f0f&#x27;);
        field.removeChild(tt.el); torps.splice(a, 1);
        combo++; updateMult();
        if (boss.hp &lt;= 0) {
          score += 200 * mult;
          scoreEl.textContent = score;
          flashStreak(&#x27;BOSS DOWN +&#x27; + (200 * mult) + &#x27;!&#x27;);
          burst(boss.x + boss.size / 2, boss.y + boss.size / 2, &#x27;#ff0&#x27;);
          field.removeChild(boss.el); field.removeChild(boss.hpEl); boss = null;
        } else {
          boss.hpEl.textContent = &#x27;HP &#x27; + boss.hp;
        }
      }
    }
  }

  // bubbles
  for (var c = bubbles.length - 1; c &gt;= 0; c--) {
    var bu = bubbles[c];
    bu.y -= bu.vy;
    bu.x += Math.sin(bu.y * 0.05) * 0.3;
    if (bu.y + bu.size &lt; 0) { field.removeChild(bu.el); bubbles.splice(c, 1); continue; }
    bu.el.style.top = bu.y + &#x27;px&#x27;;
    bu.el.style.left = bu.x + &#x27;px&#x27;;
  }

  // sparks
  for (var d = sparks.length - 1; d &gt;= 0; d--) {
    var sp = sparks[d];
    sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.08; sp.life -= 0.04;
    if (sp.life &lt;= 0) { field.removeChild(sp.el); sparks.splice(d, 1); continue; }
    sp.el.style.left = sp.x + &#x27;px&#x27;;
    sp.el.style.top = sp.y + &#x27;px&#x27;;
    sp.el.style.opacity = sp.life;
  }

  animId = requestAnimationFrame(tick);
}

function clearArr(arr) {
  arr.forEach(function (o) { if (o.el &amp;&amp; o.el.parentNode) o.el.parentNode.removeChild(o.el); });
  arr.length = 0;
}
function clearAll() {
  clearArr(torps); clearArr(enemies); clearArr(bubbles); clearArr(sparks);
  if (boss) {
    if (boss.el.parentNode) boss.el.parentNode.removeChild(boss.el);
    if (boss.hpEl.parentNode) boss.hpEl.parentNode.removeChild(boss.hpEl);
    boss = null;
  }
}

function difficultyTick() {
  speedMul += 0.25;
  spawnInterval = Math.max(450, spawnInterval - 150);
  if (spawnId) { clearInterval(spawnId); spawnId = setInterval(spawnEnemy, spawnInterval); }
}

function tickTimer() {
  timeLeft--;
  if (timeLeft &lt;= 0) {
    timeLeft = 0;
    timeEl.textContent = &#x27;0&#x27;;
    endGame();
    return;
  }
  timeEl.textContent = timeLeft;
}

function endGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  [spawnId, bossId, timerId, bubbleId, rampId].forEach(function (id) { if (id) clearInterval(id); });
  spawnId = bossId = timerId = bubbleId = rampId = null;
  clearAll();
  overlay.innerHTML = &#x27;&lt;div&gt;Time\&#x27;s up!&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;Score: &#x27; + score + &#x27;&lt;/div&gt;&lt;div style=&quot;font-size:16px&quot;&gt;Press Start below to play again&lt;/div&gt;&#x27;;
  overlay.classList.remove(&#x27;hidden&#x27;);
}

function startGame() {
  if (running) return;
  clearAll();
  overlay.classList.add(&#x27;hidden&#x27;);
  score = 0; mult = 1; combo = 0; timeLeft = 60; lastShot = 0;
  spawnInterval = 1000; speedMul = 1;
  subX = (FIELD_W - SUB_W) / 2;
  for (var k in keysDown) keysDown[k] = false;
  scoreEl.textContent = &#x27;0&#x27;; multEl.textContent = &#x27;x1&#x27;; timeEl.textContent = &#x27;60&#x27;;
  paintSub();
  running = true;
  animId = requestAnimationFrame(tick);
  spawnEnemy(); spawnEnemy();
  makeBubble(); makeBubble(); makeBubble();
  spawnId = setInterval(spawnEnemy, spawnInterval);
  bossId = setInterval(spawnBoss, 5000);
  timerId = setInterval(tickTimer, 1000);
  bubbleId = setInterval(makeBubble, 500);
  rampId = setInterval(difficultyTick, 15000);
}

function stopGame() {
  if (!running) return;
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  [spawnId, bossId, timerId, bubbleId, rampId].forEach(function (id) { if (id) clearInterval(id); });
  spawnId = bossId = timerId = bubbleId = rampId = null;
  clearAll();
  overlay.innerHTML = &#x27;&lt;div&gt;Paused&lt;/div&gt;&lt;div style=&quot;font-size:16px&quot;&gt;Press Start below to dive back in&lt;/div&gt;&#x27;;
  overlay.classList.remove(&#x27;hidden&#x27;);
}

window.addEventListener(&#x27;keydown&#x27;, function (e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
    keysDown[e.key] = true; e.preventDefault();
  } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
    if (running) fireTorpedo();
    e.preventDefault();
  }
});
window.addEventListener(&#x27;keyup&#x27;, function (e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
});
window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

paintSub();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
