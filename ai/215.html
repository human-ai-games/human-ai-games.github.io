<body>

  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>ASTRO BLITZ</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #0ff;
       text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; align-items: center; gap: 12px; }
  .score { font-size: 30px; font-weight: 900; color: #ff3; text-shadow: 0 0 8px #fa0, 0 0 16px #f60; min-width: 150px; }
  .heatwrap { flex: 1; }
  .heatlabel { font-size: 12px; color: #9ad; margin-bottom: 2px; letter-spacing: 1px; }
  .heatbar { width: 100%; height: 12px; background: #112; border-radius: 6px; overflow: hidden; border: 1px solid #235; }
  .heatfill { height: 100%; width: 0%; background: linear-gradient(90deg,#0af,#fa0,#f22); transition: width .06s linear; }
  .mult { font-size: 22px; font-weight: 800; color: #f6f; text-shadow: 0 0 8px #f0f; min-width: 60px; text-align: right; }
  .field { position: relative; width: 620px; height: 440px; flex-shrink: 0; background: #060018; border-radius: 10px; overflow: hidden; border: 1px solid #223; }
  canvas { display: block; }
  .banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 44px; font-weight: 900;
            color: #fff; text-shadow: 0 0 12px #0ff, 0 0 24px #08f; pointer-events: none; opacity: 0; letter-spacing: 3px; }
  .combobanner { position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-size: 34px; font-weight: 900;
            color: #ff6; text-shadow: 0 0 12px #f0f, 0 0 24px #f06; pointer-events: none; opacity: 0; letter-spacing: 2px; }
  .touchrow { width: 620px; display: flex; gap: 8px; }

  .tbtn:active { background: #235; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;ASTRO BLITZ&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; keys (or side buttons) and hold &lt;strong&gt;Space&lt;/strong&gt; / FIRE to blast aliens — chain quick kills for combo multipliers. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;heatwrap&quot;&gt;&lt;div class=&quot;heatlabel&quot;&gt;HEAT&lt;/div&gt;&lt;div class=&quot;heatbar&quot;&gt;&lt;div class=&quot;heatfill&quot; id=&quot;heatfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;mult&quot; id=&quot;mult&quot;&gt;x1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;combobanner&quot; id=&quot;combobanner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;touchrow&quot;&gt;
    &lt;div class=&quot;tbtn&quot; id=&quot;btnL&quot;&gt;◀ LEFT&lt;/div&gt;
    &lt;div class=&quot;tbtn&quot; id=&quot;btnFire&quot;&gt;● FIRE&lt;/div&gt;
    &lt;div class=&quot;tbtn&quot; id=&quot;btnR&quot;&gt;RIGHT ▶&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
var FIELD_W=620, FIELD_H=440;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), heatEl=document.getElementById(&#x27;heatfill&#x27;), multEl=document.getElementById(&#x27;mult&#x27;);
var banner=document.getElementById(&#x27;banner&#x27;), combobanner=document.getElementById(&#x27;combobanner&#x27;);

var running=false, animId=null;
var shipX=FIELD_W/2, SHIP_W=38, SHIP_H=26, SHIP_SPEED=6, SHIP_Y=FIELD_H-34;
var keys={}, touchL=false, touchR=false, touchFire=false;
var bullets=[], enemies=[], particles=[], stars=[];
var score=0, heat=0, lastShot=0, mult=1;
var comboKills=0, comboTimer=0, comboActive=false;
var wave=1, waveTimer=0, spawnTimer=0, cometTimer=0;
var shake=0;

// starfield
for(var i=0;i&lt;70;i++) stars.push({x:Math.random()*FIELD_W,y:Math.random()*FIELD_H,s:Math.random()*2+0.5,v:Math.random()*1.2+0.3});

function reset(){
  shipX=FIELD_W/2; bullets=[]; enemies=[]; particles=[];
  score=0; heat=0; lastShot=0; mult=1; comboKills=0; comboTimer=0; comboActive=false;
  wave=1; waveTimer=0; spawnTimer=0; cometTimer=180; shake=0;
  scoreEl.textContent=&#x27;0&#x27;; multEl.textContent=&#x27;x1&#x27;; heatEl.style.width=&#x27;0%&#x27;;
  for(var k in keys) keys[k]=false;
}

function showBanner(el,txt){ el.textContent=txt; el.style.transition=&#x27;none&#x27;; el.style.opacity=&#x27;1&#x27;;
  requestAnimationFrame(function(){ el.style.transition=&#x27;opacity 1.1s&#x27;; el.style.opacity=&#x27;0&#x27;; }); }

function spawnWaveEnemies(){
  var count=Math.min(3+wave,8);
  var beetleChance=Math.min(0.15+wave*0.05,0.5);
  for(var i=0;i&lt;count;i++){
    var isBeetle=Math.random()&lt;beetleChance;
    enemies.push({
      type:isBeetle?&#x27;beetle&#x27;:&#x27;ufo&#x27;,
      x:40+Math.random()*(FIELD_W-80), y:-30-Math.random()*120,
      w:isBeetle?34:26, h:isBeetle?30:20,
      vy:(isBeetle?0.7:1.1)+wave*0.12,
      vx:(Math.random()-0.5)*(0.6+wave*0.1),
      hp:isBeetle?2:1, points:isBeetle?3:1,
      phase:Math.random()*6.28
    });
  }
}

function spawnComet(){
  var fromLeft=Math.random()&lt;0.5;
  enemies.push({
    type:&#x27;comet&#x27;, x:fromLeft?-20:FIELD_W+20, y:20+Math.random()*80,
    w:22,h:22, vx:(fromLeft?1:-1)*(2.4+wave*0.15), vy:1.1,
    hp:1, points:5, phase:0
  });
}

function fire(){
  var now=Date.now();
  var rate=180-heat*0.9; if(rate&lt;70)rate=70;
  if(now-lastShot&lt;rate) return;
  lastShot=now;
  var col=heat&lt;33?&#x27;#3cf&#x27;:(heat&lt;66?&#x27;#f90&#x27;:&#x27;#f22&#x27;);
  bullets.push({x:shipX-2,y:SHIP_Y-14,w:4,h:14,vy:9,color:col});
  heat=Math.min(100,heat+9);
  if(heat&gt;66) shake=Math.min(6,shake+2.5);
}

function explode(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*6.28, sp=Math.random()*4+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function addScore(pts){
  score+=pts*mult;
  scoreEl.textContent=score;
  comboKills++; comboTimer=120;
  if(comboKills&gt;=3 &amp;&amp; !comboActive){
    comboActive=true; mult=2; multEl.textContent=&#x27;x2&#x27;;
    showBanner(combobanner,&#x27;COMBO x2!&#x27;);
  } else if(comboKills&gt;=6 &amp;&amp; mult&lt;3){
    mult=3; multEl.textContent=&#x27;x3&#x27;; showBanner(combobanner,&#x27;COMBO x3!&#x27;);
  }
}

function breakCombo(){ comboActive=false; comboKills=0; mult=1; multEl.textContent=&#x27;x1&#x27;; }

function tick(){
  if(!running) return;
  // waves timer (~60fps)
  waveTimer++;
  if(waveTimer&gt;=900){ waveTimer=0; wave++; showBanner(banner,&#x27;WAVE &#x27;+wave+&#x27;!&#x27;); }
  spawnTimer--;
  if(spawnTimer&lt;=0){ spawnWaveEnemies(); spawnTimer=Math.max(70,150-wave*8); }
  cometTimer--;
  if(cometTimer&lt;=0){ spawnComet(); cometTimer=300+Math.random()*300; }

  // input
  if(keys[&#x27;ArrowLeft&#x27;]||touchL) shipX-=SHIP_SPEED;
  if(keys[&#x27;ArrowRight&#x27;]||touchR) shipX+=SHIP_SPEED;
  shipX=Math.max(SHIP_W/2,Math.min(FIELD_W-SHIP_W/2,shipX));
  if(keys[&#x27; &#x27;]||touchFire) fire();

  // heat cooldown
  heat=Math.max(0,heat-0.6);
  heatEl.style.width=heat+&#x27;%&#x27;;
  if(shake&gt;0) shake*=0.85;

  // combo timer
  if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0) breakCombo(); }

  // stars
  for(var s=0;s&lt;stars.length;s++){ stars[s].y+=stars[s].v; if(stars[s].y&gt;FIELD_H){ stars[s].y=0; stars[s].x=Math.random()*FIELD_W; } }

  // bullets
  for(var i=bullets.length-1;i&gt;=0;i--){ var b=bullets[i]; b.y-=b.vy; if(b.y+b.h&lt;0) bullets.splice(i,1); }

  // enemies
  for(var j=enemies.length-1;j&gt;=0;j--){
    var e=enemies[j];
    e.phase+=0.08;
    e.y+=e.vy;
    e.x+=e.vx + (e.type!==&#x27;comet&#x27;?Math.sin(e.phase)*0.6:0);
    if(e.type!==&#x27;comet&#x27;){ if(e.x&lt;10||e.x&gt;FIELD_W-10) e.vx*=-1; }
    if(e.y&gt;FIELD_H+30 || e.x&lt;-40 || e.x&gt;FIELD_W+40) enemies.splice(j,1);
  }

  // collisions
  for(var i2=bullets.length-1;i2&gt;=0;i2--){
    var b2=bullets[i2]; var hit=false;
    for(var j2=enemies.length-1;j2&gt;=0;j2--){
      var e2=enemies[j2];
      if(b2.x&lt;e2.x+e2.w/2 &amp;&amp; b2.x+b2.w&gt;e2.x-e2.w/2 &amp;&amp; b2.y&lt;e2.y+e2.h/2 &amp;&amp; b2.y+b2.h&gt;e2.y-e2.h/2){
        e2.hp--; hit=true;
        if(e2.hp&lt;=0){
          var col=e2.type===&#x27;comet&#x27;?&#x27;#fd0&#x27;:(e2.type===&#x27;beetle&#x27;?&#x27;#7f6&#x27;:&#x27;#4cf&#x27;);
          explode(e2.x,e2.y,col,e2.type===&#x27;comet&#x27;?22:14);
          addScore(e2.points);
          enemies.splice(j2,1);
        } else { explode(e2.x,e2.y,&#x27;#fff&#x27;,5); }
        break;
      }
    }
    if(hit) bullets.splice(i2,1);
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pa=particles[p]; pa.x+=pa.vx; pa.y+=pa.vy; pa.vy+=0.06; pa.life-=0.03;
    if(pa.life&lt;=0) particles.splice(p,1);
  }

  draw();
  animId=requestAnimationFrame(tick);
}

function draw(){
  ctx.save();
  var sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.clearRect(0,0,FIELD_W,FIELD_H);
  ctx.translate(sx,sy);
  // background gradient
  var g=ctx.createLinearGradient(0,0,0,FIELD_H);
  g.addColorStop(0,&#x27;#0a0028&#x27;); g.addColorStop(1,&#x27;#020010&#x27;);
  ctx.fillStyle=g; ctx.fillRect(-10,-10,FIELD_W+20,FIELD_H+20);
  // stars
  for(var s=0;s&lt;stars.length;s++){ ctx.globalAlpha=0.4+stars[s].s/3; ctx.fillStyle=&#x27;#9cf&#x27;;
    ctx.fillRect(stars[s].x,stars[s].y,stars[s].s,stars[s].s); }
  ctx.globalAlpha=1;
  // particles
  for(var p=0;p&lt;particles.length;p++){ var pa=particles[p]; ctx.globalAlpha=Math.max(0,pa.life);
    ctx.fillStyle=pa.color; ctx.fillRect(pa.x-2,pa.y-2,4,4); }
  ctx.globalAlpha=1;
  // bullets
  for(var i=0;i&lt;bullets.length;i++){ var b=bullets[i]; ctx.fillStyle=b.color;
    ctx.shadowColor=b.color; ctx.shadowBlur=8; ctx.fillRect(b.x,b.y,b.w,b.h); }
  ctx.shadowBlur=0;
  // enemies
  for(var j=0;j&lt;enemies.length;j++) drawEnemy(enemies[j]);
  // ship
  drawShip();
  ctx.restore();
}

function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  if(e.type===&#x27;ufo&#x27;){
    ctx.fillStyle=&#x27;#4cf&#x27;; ctx.shadowColor=&#x27;#4cf&#x27;; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2,0,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#dff&#x27;; ctx.beginPath(); ctx.ellipse(0,-e.h/4,e.w/4,e.h/3,0,0,6.28); ctx.fill();
  } else if(e.type===&#x27;beetle&#x27;){
    ctx.fillStyle=e.hp&gt;1?&#x27;#7f6&#x27;:&#x27;#5a4&#x27;; ctx.shadowColor=&#x27;#7f6&#x27;; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2,0,0,6.28); ctx.fill();
    ctx.strokeStyle=&#x27;#031&#x27;; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-e.h/2); ctx.lineTo(0,e.h/2); ctx.stroke();
    ctx.fillStyle=&#x27;#f33&#x27;; ctx.beginPath(); ctx.arc(-6,-4,3,0,6.28); ctx.arc(6,-4,3,0,6.28); ctx.fill();
  } else {
    ctx.fillStyle=&#x27;#fd0&#x27;; ctx.shadowColor=&#x27;#fd0&#x27;; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(0,0,e.w/2,0,6.28); ctx.fill();
    ctx.globalAlpha=0.5; ctx.beginPath(); ctx.moveTo(0,0);
    ctx.lineTo(-e.vx*8,-e.vy*8); ctx.lineTo(-e.vx*6+8,-e.vy*6); ctx.closePath(); ctx.fill();
  }
  ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
}

function drawShip(){
  ctx.save(); ctx.translate(shipX,SHIP_Y);
  var c=heat&lt;33?&#x27;#0ff&#x27;:(heat&lt;66?&#x27;#fa0&#x27;:&#x27;#f33&#x27;);
  ctx.fillStyle=c; ctx.shadowColor=c; ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.moveTo(0,-SHIP_H/2); ctx.lineTo(SHIP_W/2,SHIP_H/2); ctx.lineTo(0,SHIP_H/4); ctx.lineTo(-SHIP_W/2,SHIP_H/2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(0,0,4,0,6.28); ctx.fill();
  // thruster
  ctx.fillStyle=&#x27;#f80&#x27;; ctx.globalAlpha=0.6+Math.random()*0.3;
  ctx.beginPath(); ctx.moveTo(-5,SHIP_H/2); ctx.lineTo(5,SHIP_H/2); ctx.lineTo(0,SHIP_H/2+8+Math.random()*5); ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
}

function startGame(){ if(running) return; reset(); running=true; showBanner(banner,&#x27;WAVE 1!&#x27;); spawnWaveEnemies(); animId=requestAnimationFrame(tick); }
function stopGame(){ if(!running) return; running=false; if(animId){cancelAnimationFrame(animId); animId=null;} }

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ keys[&#x27; &#x27;]=true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;) keys[&#x27; &#x27;]=false;
});

function bind(el,setter){
  el.addEventListener(&#x27;mousedown&#x27;,function(e){e.preventDefault();setter(true);});
  el.addEventListener(&#x27;mouseup&#x27;,function(){setter(false);});
  el.addEventListener(&#x27;mouseleave&#x27;,function(){setter(false);});
  el.addEventListener(&#x27;touchstart&#x27;,function(e){e.preventDefault();setter(true);},{passive:false});
  el.addEventListener(&#x27;touchend&#x27;,function(e){e.preventDefault();setter(false);},{passive:false});
}
bind(document.getElementById(&#x27;btnL&#x27;),function(v){touchL=v;});
bind(document.getElementById(&#x27;btnR&#x27;),function(v){touchR=v;});
bind(document.getElementById(&#x27;btnFire&#x27;),function(v){touchFire=v;});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
