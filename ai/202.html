<title>🌊 Deep Reef Pop 🐡</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌊 Deep Reef Pop 🐡</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden;
    background: #05122b; color: #eaf6ff; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;
    position: relative; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 0 12px #37c6ff, 0 0 4px #37c6ff; }
  .instructions { font-size: 16px; color: #9fd4ff; max-width: 620px; margin: 0; line-height: 1.35; }
  .hud { display: flex; gap: 22px; align-items: center; font-family: &#x27;Courier New&#x27;, monospace; }
  .score { font-size: 26px; font-weight: 900; color: #ffe27a; text-shadow: 0 0 10px #ffb300;
    background: #0a1e40; padding: 4px 14px; border-radius: 8px; border: 2px solid #37c6ff44; }
  .combo { font-size: 20px; font-weight: 900; color: #ff7ae0; text-shadow: 0 0 10px #ff2bb0;
    min-width: 60px; opacity: 0; transition: opacity .15s, transform .15s; }
  .combo.show { opacity: 1; transform: scale(1.2); }
  .board { position: relative; width: 600px; height: 420px; flex-shrink: 0;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 10px; padding: 10px; box-sizing: border-box; border-radius: 14px;
    background: rgba(4,14,34,.5); box-shadow: inset 0 0 40px #000a; }
  .hole { position: relative; border-radius: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, #1a3a2a 0%, #0d2440 60%, #071a35 100%);
    box-shadow: inset 0 -10px 25px #000a; }
  .coral { position: absolute; bottom: -2px; left: 0; width: 100%; height: 40px; z-index: 3;
    background:
      radial-gradient(circle at 15% 100%, #d94f8a 0 12px, transparent 13px),
      radial-gradient(circle at 40% 100%, #e08a2c 0 15px, transparent 16px),
      radial-gradient(circle at 65% 100%, #7a4fd9 0 13px, transparent 14px),
      radial-gradient(circle at 88% 100%, #d94f8a 0 11px, transparent 12px);
    pointer-events: none; }
  .creature { position: absolute; bottom: 6px; left: 50%; width: 70px; height: 70px;
    margin-left: -35px; z-index: 2; cursor: pointer; font-size: 54px; line-height: 70px;
    transform: translateY(120%); user-select: none; }
  .creature.up { animation: popup .4s cubic-bezier(.34,1.56,.64,1) forwards, wiggle 1s ease-in-out .4s infinite; }
  .creature.down { animation: popdown .3s ease-in forwards; }
  @keyframes popup { from { transform: translateY(120%);} to { transform: translateY(0);} }
  @keyframes popdown { from { transform: translateY(0);} to { transform: translateY(120%);} }
  @keyframes wiggle { 0%,100%{ transform: translateY(0) rotate(-6deg);} 50%{ transform: translateY(-4px) rotate(6deg);} }
  .glow-gold { filter: drop-shadow(0 0 10px #ffd24a) drop-shadow(0 0 18px #ff9d00); }
  .glow-puff { filter: drop-shadow(0 0 8px #ff8a5c); }
  .glow-jelly { filter: drop-shadow(0 0 8px #6ad4ff); }
  .float { position: absolute; z-index: 6; font-weight: 900; font-size: 30px; pointer-events: none;
    color: #fff; text-shadow: 0 0 8px #37c6ff; animation: floatup .8s ease-out forwards; }
  @keyframes floatup { from { transform: translateY(0); opacity:1;} to { transform: translateY(-50px); opacity:0;} }
  .bubble { position: absolute; z-index: 5; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff, #9fe4ff 60%, transparent);
    animation: bub .5s ease-out forwards; }
  @keyframes bub { from { transform: scale(.3); opacity:1;} to { transform: scale(1.6); opacity:0;} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌊 Deep Reef Pop 🐡&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap the glowing sea creatures as they bob up — golden anglerfish = 5, puffers = 2, jellyfish = 1. Hit them fast in a row to build a combo multiplier and climb the score!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;x2&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var board = document.getElementById(&#x27;board&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);

var holes = [];
for (var i = 0; i &lt; 9; i++) {
  var h = document.createElement(&#x27;div&#x27;);
  h.className = &#x27;hole&#x27;;
  var c = document.createElement(&#x27;div&#x27;); c.className = &#x27;coral&#x27;;
  h.appendChild(c);
  board.appendChild(h);
  holes.push({ el: h, busy: false });
}

var TYPES = [
  { emoji: &#x27;🎐&#x27;, pts: 1, glow: &#x27;glow-jelly&#x27;, weight: 60, life: 1400 }, // jellyfish
  { emoji: &#x27;🐡&#x27;, pts: 2, glow: &#x27;glow-puff&#x27;, weight: 30, life: 1200 },  // puffer
  { emoji: &#x27;🐠&#x27;, pts: 5, glow: &#x27;glow-gold&#x27;, weight: 10, life: 800 }    // golden angler
];

var score = 0, running = false;
var spawnTimer = null, bgTimer = null, elapsed = 0, elapsedTimer = null;
var combo = 0, comboTimer = null;

// Audio
var actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
  return actx;
}
function pop(pitch) {
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = &#x27;sine&#x27;;
  o.frequency.setValueAtTime(pitch, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(pitch * 2.5, a.currentTime + 0.08);
  g.gain.setValueAtTime(0.25, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.18);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + 0.2);
}

function pickType() {
  var total = 0; for (var i=0;i&lt;TYPES.length;i++) total += TYPES[i].weight;
  var r = Math.random() * total;
  for (var j=0;j&lt;TYPES.length;j++){ r -= TYPES[j].weight; if (r&lt;=0) return TYPES[j]; }
  return TYPES[0];
}

function bubbleBurst(hole, x, y) {
  for (var i=0;i&lt;6;i++) {
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;bubble&#x27;;
    var sz = 8 + Math.random()*14;
    b.style.width = sz+&#x27;px&#x27;; b.style.height = sz+&#x27;px&#x27;;
    b.style.left = (x + (Math.random()*40-20)) + &#x27;px&#x27;;
    b.style.top = (y + (Math.random()*40-20)) + &#x27;px&#x27;;
    hole.appendChild(b);
    (function(el){ setTimeout(function(){ el.parentNode &amp;&amp; el.parentNode.removeChild(el); },500); })(b);
  }
}

function showFloat(hole, x, y, txt) {
  var f = document.createElement(&#x27;div&#x27;);
  f.className = &#x27;float&#x27;; f.textContent = txt;
  f.style.left = x+&#x27;px&#x27;; f.style.top = y+&#x27;px&#x27;;
  hole.appendChild(f);
  setTimeout(function(){ f.parentNode &amp;&amp; f.parentNode.removeChild(f); }, 800);
}

function bumpCombo() {
  combo++;
  if (comboTimer) clearTimeout(comboTimer);
  comboTimer = setTimeout(function(){ combo = 0; comboEl.classList.remove(&#x27;show&#x27;); }, 1300);
  var mult = combo &gt;= 6 ? 3 : combo &gt;= 3 ? 2 : 1;
  if (mult &gt; 1) { comboEl.textContent = &#x27;x&#x27;+mult; comboEl.classList.add(&#x27;show&#x27;); }
  else comboEl.classList.remove(&#x27;show&#x27;);
  return mult;
}

function spawnAt(slot) {
  var hole = holes[slot];
  if (hole.busy) return;
  hole.busy = true;
  var type = pickType();
  var cr = document.createElement(&#x27;div&#x27;);
  cr.className = &#x27;creature up &#x27; + type.glow;
  cr.textContent = type.emoji;
  var alive = true;

  function retreat() {
    if (!alive) return;
    alive = false;
    cr.className = &#x27;creature down &#x27; + type.glow;
    setTimeout(function(){ if (cr.parentNode) cr.parentNode.removeChild(cr); hole.busy = false; }, 320);
  }

  cr.addEventListener(&#x27;mousedown&#x27;, function(ev) {
    if (!alive) return;
    alive = false;
    var mult = bumpCombo();
    var gained = type.pts * mult;
    score += gained;
    scoreEl.textContent = score;
    pop(type.pts &gt;= 5 ? 900 : type.pts &gt;= 2 ? 620 : 440);
    var x = cr.offsetLeft + 20, y = cr.offsetTop + 10;
    bubbleBurst(hole, x, y);
    showFloat(hole, x, y, &#x27;+&#x27; + gained);
    if (cr.parentNode) cr.parentNode.removeChild(cr);
    hole.busy = false;
    ev.stopPropagation();
  });

  hole.el.appendChild(cr);
  setTimeout(retreat, type.life);
}

function difficulty() {
  // interval shrinks &amp; count grows as time passes
  var t = elapsed;
  var interval = Math.max(400, 1000 - t * 12);
  var maxSimul = t &gt; 25 ? 3 : t &gt; 12 ? 2 : 1;
  return { interval: interval, maxSimul: maxSimul };
}

function scheduleSpawn() {
  if (!running) return;
  var d = difficulty();
  var count = 1 + Math.floor(Math.random() * d.maxSimul);
  var free = [];
  for (var i=0;i&lt;9;i++) if (!holes[i].busy) free.push(i);
  for (var s = free.length - 1; s &gt; 0; s--) { var k = Math.floor(Math.random()*(s+1)); var tmp=free[s]; free[s]=free[k]; free[k]=tmp; }
  for (var c=0;c&lt;count &amp;&amp; c&lt;free.length;c++) spawnAt(free[c]);
  spawnTimer = setTimeout(scheduleSpawn, d.interval);
}

var bgHue = 220;
function shiftBg() {
  bgHue += 0.4; if (bgHue &gt; 285) bgHue = 220;
  var h2 = bgHue + 30;
  document.body.style.background =
    &#x27;linear-gradient(160deg, hsl(&#x27;+bgHue+&#x27;,70%,10%), hsl(&#x27;+h2+&#x27;,65%,16%))&#x27;;
}

function startGame() {
  if (running) return;
  running = true;
  score = 0; scoreEl.textContent = &#x27;0&#x27;;
  combo = 0; comboEl.classList.remove(&#x27;show&#x27;);
  elapsed = 0;
  for (var i=0;i&lt;9;i++){ holes[i].busy = false; }
  board.querySelectorAll(&#x27;.creature,.float,.bubble&#x27;).forEach(function(n){ n.parentNode.removeChild(n); });
  scheduleSpawn();
  elapsedTimer = setInterval(function(){ elapsed++; }, 1000);
  bgTimer = setInterval(shiftBg, 60);
}

function stopGame() {
  running = false;
  if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
  if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
  if (bgTimer) { clearInterval(bgTimer); bgTimer = null; }
  if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
}

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial background
document.body.style.background = &#x27;linear-gradient(160deg, hsl(220,70%,10%), hsl(250,65%,16%))&#x27;;
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
