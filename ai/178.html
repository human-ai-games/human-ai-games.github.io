<head>

<title>🍉 Fruit Drop Frenzy 🍇</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍉 Fruit Drop Frenzy 🍇</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: linear-gradient(160deg, #ffe29f 0%, #ffa99f 35%, #a1c4fd 100%); color: #333; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 6px; height: 640px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: #d84315; text-shadow: 1px 1px 0 #fff; }
  .instructions { font-size: 16px; color: #444; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #2e7d32; margin: 0; transition: transform .12s; }
  .score.pop { transform: scale(1.4); }
  .field { position: relative; width: 220px; height: 396px; flex-shrink: 0;
    background: linear-gradient(180deg, #bbdefb, #e1f5fe); border-radius: 10px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); border: 3px solid #fff; }
  .block { position: absolute; box-sizing: border-box; border-radius: 5px;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    border: 1px solid rgba(255,255,255,.5); box-shadow: inset 0 -2px 4px rgba(0,0,0,.2); }
  .ghost { position: absolute; box-sizing: border-box; border-radius: 5px;
    border: 2px dashed rgba(0,0,0,.25); background: rgba(255,255,255,.15); }
  .flash { position: absolute; left: 0; border-radius: 4px; z-index: 5;
    background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f); animation: sweep .35s ease-out forwards; }
  @keyframes sweep { 0% { clip-path: inset(0 100% 0 0); opacity:1;} 60%{clip-path:inset(0 0 0 0);opacity:1;} 100%{opacity:0;} }
  .controls { display: flex; gap: 8px; margin-top: 4px; }
  .controls button { font-size: 22px; width: 58px; height: 46px; border: none; border-radius: 10px;
    background: #ff7043; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #d84315; }
  .controls button:active { transform: translateY(2px); box-shadow: 0 1px 0 #d84315; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with ← / → , rotate with ↑, and speed the drop with ↓ — or use the buttons below. Clear rows to score; clearing several at once is worth way more!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button id=&quot;bL&quot;&gt;◀&lt;/button&gt;
    &lt;button id=&quot;bRot&quot;&gt;⟳&lt;/button&gt;
    &lt;button id=&quot;bDrop&quot;&gt;▼&lt;/button&gt;
    &lt;button id=&quot;bR&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var CELL = 22, COLS = 10, ROWS = 18;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var FRUITS = {
    I: { color:&#x27;#ff5252&#x27;, emoji:&#x27;🍉&#x27; },
    O: { color:&#x27;#ffb300&#x27;, emoji:&#x27;🍊&#x27; },
    T: { color:&#x27;#fdd835&#x27;, emoji:&#x27;🍋&#x27; },
    S: { color:&#x27;#8e24aa&#x27;, emoji:&#x27;🍇&#x27; },
    Z: { color:&#x27;#e53935&#x27;, emoji:&#x27;🍓&#x27; },
    L: { color:&#x27;#1e88e5&#x27;, emoji:&#x27;🫐&#x27; },
    J: { color:&#x27;#fbc02d&#x27;, emoji:&#x27;🍍&#x27; }
  };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]]
  };
  var KEYS = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;L&#x27;,&#x27;J&#x27;];

  var grid, piece, score, running, dropId, dropMs;

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function makePiece() {
    var t = KEYS[Math.floor(Math.random()*KEYS.length)];
    var cells = SHAPES[t].map(function(p){ return [p[0],p[1]]; });
    return { type:t, cells:cells, x: 3, y: -1 };
  }

  function absCells(p) {
    return p.cells.map(function(c){ return { x: p.x+c[0], y: p.y+c[1] }; });
  }

  function collides(p) {
    var cs = absCells(p);
    for (var i=0;i&lt;cs.length;i++){
      var cx=cs[i].x, cy=cs[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function rotate(p) {
    // rotate cells around bounding box center (works for standard tetrominoes)
    var maxD = 0;
    p.cells.forEach(function(c){ maxD = Math.max(maxD, c[0], c[1]); });
    var n = p.type===&#x27;I&#x27;?3:(p.type===&#x27;O&#x27;?1:2);
    var nc = p.cells.map(function(c){ return [n - c[1], c[0]]; });
    return { type:p.type, cells:nc, x:p.x, y:p.y };
  }

  function ghostPiece() {
    var g = { type:piece.type, cells:piece.cells.map(function(c){return [c[0],c[1]];}), x:piece.x, y:piece.y };
    while (!collides({type:g.type,cells:g.cells,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function spawn() {
    piece = makePiece();
    if (collides(piece)) return false;
    return true;
  }

  function lock() {
    absCells(piece).forEach(function(c){
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS &amp;&amp; c.x&gt;=0 &amp;&amp; c.x&lt;COLS) grid[c.y][c.x] = piece.type;
    });
    piece = null;
  }

  function clearRows() {
    var fullRows = [];
    for (var r=0;r&lt;ROWS;r++){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){ full=false; break; }
      if (full) fullRows.push(r);
    }
    if (fullRows.length===0) return;
    fullRows.forEach(function(r){ flashRow(r); });
    var n = fullRows.length;
    for (var i=fullRows.length-1;i&gt;=0;i--){
      grid.splice(fullRows[i],1);
      var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
      grid.unshift(empty);
    }
    score += n*n;
    scoreEl.textContent = score;
    scoreEl.parentElement.classList.add(&#x27;pop&#x27;);
    setTimeout(function(){ scoreEl.parentElement.classList.remove(&#x27;pop&#x27;); }, 130);
    updateSpeed();
  }

  function flashRow(r) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className=&#x27;flash&#x27;;
    f.style.top=(r*CELL)+&#x27;px&#x27;;
    f.style.height=CELL+&#x27;px&#x27;;
    f.style.width=(COLS*CELL)+&#x27;px&#x27;;
    field.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 380);
  }

  function updateSpeed() {
    var target = Math.max(150, 700 - Math.floor(score/10)*50);
    if (target !== dropMs &amp;&amp; running) {
      dropMs = target;
      clearInterval(dropId);
      dropId = setInterval(stepDown, dropMs);
    } else dropMs = target;
  }

  function paint() {
    var flashes = field.querySelectorAll(&#x27;.flash&#x27;);
    field.innerHTML=&#x27;&#x27;;
    flashes.forEach(function(f){ field.appendChild(f); });
    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawBlock(c,r,grid[r][c]);
    if (piece) {
      var g = ghostPiece();
      absCells(g).forEach(function(c){ if(c.y&gt;=0) drawGhost(c.x,c.y); });
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) drawBlock(c.x,c.y,piece.type); });
    }
  }

  function drawBlock(cx,cy,type) {
    var f = FRUITS[type];
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=f.color;
    el.textContent=f.emoji;
    field.appendChild(el);
  }
  function drawGhost(cx,cy) {
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece) return;
    var next={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
    if (collides(next)) {
      lock();
      clearRows();
      if (!spawn()) { endGame(); paint(); return; }
    } else piece.y++;
    paint();
  }

  function move(dx) {
    if (!running||!piece) return;
    var next={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
    if (!collides(next)){ piece.x+=dx; paint(); }
  }
  function doRotate() {
    if (!running||!piece) return;
    var r=rotate(piece);
    var kicks=[0,-1,1,-2,2];
    for (var i=0;i&lt;kicks.length;i++){
      var t={type:r.type,cells:r.cells,x:r.x+kicks[i],y:r.y};
      if (!collides(t)){ piece=t; paint(); return; }
    }
  }

  function endGame() {
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
  }
  function startGame() {
    score=0; scoreEl.textContent=&#x27;0&#x27;; dropMs=700;
    newGrid();
    if (!spawn()) return;
    paint();
    running=true;
    if (dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, dropMs);
  }
  function stopGame() {
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ doRotate(); e.preventDefault(); }
  });
  document.getElementById(&#x27;bL&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(-1); });
  document.getElementById(&#x27;bR&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(1); });
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;, function(){ doRotate(); });
  document.getElementById(&#x27;bDrop&#x27;).addEventListener(&#x27;click&#x27;, function(){ if(running) stepDown(); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  newGrid();
  piece = makePiece(); piece.y = 0;
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
