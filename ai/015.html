<html lang="en">
<head>
<meta charset="utf-8">

<title>NEON CASCADE</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }

  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON CASCADE</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #000; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 18px #f0f; }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  #wrap { position: relative; }
  canvas { display: block; background: #000; border-radius: 8px; box-shadow: 0 0 20px rgba(0,255,255,0.25); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON CASCADE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and fire with &lt;strong&gt;Space&lt;/strong&gt; (or tap the ship). Blast the alien shapes before the 60-second fuse burns out and chain hits for combo multipliers!&lt;/p&gt;
  &lt;div id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;520&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 620, H = 520;
var running = false, animId = null;

// Audio
var AC = null;
function actx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, vol){
  var a = actx(); if(!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
  g.gain.value = vol||0.08;
  o.connect(g); g.connect(a.destination);
  var t = a.currentTime;
  o.start(t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.frequency.exponentialRampToValueAtTime(freq*0.5, t+dur);
  o.stop(t+dur);
}

var keys = {}, shipX = W/2, SHIP_W = 34, SHIP_SPEED = 6;
var bullets = [], enemies = [], particles = [], stars = [];
var trail = [];
var score = 0, combo = 0, mult = 1, timeLeft = 60, lastTime = 0;
var lastShot = 0, spawnTimer = 0, spawnInterval = 900, speedFactor = 1;
var gameOver = false, comboFlash = 0;

var TYPES = [&#x27;zig&#x27;,&#x27;spiral&#x27;,&#x27;split&#x27;];
var COLORS = { zig:&#x27;#f0f&#x27;, spiral:&#x27;#0ff&#x27;, split:&#x27;#f80&#x27; };
function unlockedTypes(){
  var n = 1;
  if(score &gt;= 10) n = 2;
  if(score &gt;= 20) n = 3;
  return TYPES.slice(0, n);
}

function initStars(){
  stars = [];
  for(var i=0;i&lt;70;i++){
    stars.push({ x:Math.random()*W, y:Math.random()*H, layer:Math.floor(Math.random()*3) });
  }
}

function spawnEnemy(){
  var pool = unlockedTypes();
  var type = pool[Math.floor(Math.random()*pool.length)];
  var x = 30 + Math.random()*(W-60);
  var e = { type:type, x:x, baseX:x, y:-24, r:16, color:COLORS[type], t:Math.random()*Math.PI*2, spinR:0, small:false };
  if(type===&#x27;spiral&#x27;){ e.spinR = 40 + Math.random()*30; }
  enemies.push(e);
}

function spawnSmall(x,y,color,dir){
  enemies.push({ type:&#x27;split&#x27;, x:x, baseX:x, y:y, r:9, color:color, t:0, spinR:0, small:true, vx:dir });
}

function shoot(){
  var now = Date.now();
  if(now - lastShot &lt; 220) return;
  lastShot = now;
  bullets.push({ x:shipX, y:H-46 });
  beep(880, 0.12, &#x27;square&#x27;, 0.05);
}

function explode(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color:color });
  }
}

function updateMult(){
  if(combo &gt;= 9) mult = 4;
  else if(combo &gt;= 6) mult = 3;
  else if(combo &gt;= 3) mult = 2;
  else mult = 1;
}

function hit(e){
  explode(e.x, e.y, e.color, e.small?10:20);
  beep(300, 0.18, &#x27;sawtooth&#x27;, 0.06);
  if(e.type===&#x27;split&#x27; &amp;&amp; !e.small){
    spawnSmall(e.x-6, e.y, e.color, -1.2);
    spawnSmall(e.x+6, e.y, e.color, 1.2);
  }
  combo++;
  var prevMult = mult;
  updateMult();
  if(mult &gt; prevMult) comboFlash = 1;
  score += 1 * mult;
  if(score % 10 === 0) speedFactor += 0.12;
}

function tick(ts){
  if(!running) return;
  if(!lastTime) lastTime = ts;
  var dt = Math.min(0.05, (ts - lastTime)/1000);
  lastTime = ts;

  if(!gameOver){
    timeLeft -= dt;
    if(timeLeft &lt;= 0){ timeLeft = 0; gameOver = true; endGame(); }
  }

  // input
  if(!gameOver){
    if(keys[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if(keys[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(SHIP_W/2, Math.min(W-SHIP_W/2, shipX));
    trail.push({x:shipX, y:H-30, life:1});
    if(trail.length&gt;10) trail.shift();

    spawnTimer += dt*1000;
    var effInterval = spawnInterval / speedFactor;
    if(spawnTimer &gt;= effInterval){ spawnTimer = 0; spawnEnemy(); }
  }

  // stars
  var starLayer = [0.6,1.4,2.6];
  for(var i=0;i&lt;stars.length;i++){
    var st = stars[i];
    st.y += starLayer[st.layer]* (gameOver?0.3:1);
    if(st.y &gt; H){ st.y = 0; st.x = Math.random()*W; }
  }

  // bullets
  for(var i=bullets.length-1;i&gt;=0;i--){
    bullets[i].y -= 9;
    if(bullets[i].y &lt; -10) bullets.splice(i,1);
  }

  // enemies
  var baseSpeed = 1.4 * speedFactor;
  for(var i=enemies.length-1;i&gt;=0;i--){
    var e = enemies[i];
    e.t += dt*3;
    if(e.type===&#x27;zig&#x27;){
      e.y += baseSpeed;
      e.x = e.baseX + Math.sin(e.t*2)*40;
    } else if(e.type===&#x27;spiral&#x27;){
      e.y += baseSpeed*0.85;
      e.x = e.baseX + Math.cos(e.t*3)*e.spinR;
      e.spinR = Math.max(4, e.spinR - dt*8);
    } else {
      e.y += baseSpeed;
      if(e.small){ e.x += (e.vx||0); }
    }
    if(e.y &gt; H+30){
      enemies.splice(i,1);
      combo = 0; mult = 1;   // missing breaks combo
    }
  }

  // collisions
  for(var i=bullets.length-1;i&gt;=0;i--){
    var b = bullets[i];
    for(var j=enemies.length-1;j&gt;=0;j--){
      var e = enemies[j];
      var dx = b.x-e.x, dy = b.y-e.y;
      if(dx*dx+dy*dy &lt; (e.r+5)*(e.r+5)){
        hit(e);
        enemies.splice(j,1);
        bullets.splice(i,1);
        break;
      }
    }
  }

  // particles
  for(var i=particles.length-1;i&gt;=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.02;
    if(p.life &lt;= 0) particles.splice(i,1);
  }

  if(comboFlash &gt; 0) comboFlash -= dt*2;

  draw();
  animId = requestAnimationFrame(tick);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // stars
  var sizes=[1,1.5,2.2], alphas=[0.4,0.7,1];
  for(var i=0;i&lt;stars.length;i++){
    var st=stars[i];
    ctx.globalAlpha = alphas[st.layer];
    ctx.fillStyle = &#x27;#9df&#x27;;
    ctx.fillRect(st.x, st.y, sizes[st.layer], sizes[st.layer]);
  }
  ctx.globalAlpha = 1;

  // trail
  for(var i=0;i&lt;trail.length;i++){
    var tr = trail[i]; var a = i/trail.length;
    ctx.globalAlpha = a*0.5;
    ctx.fillStyle = &#x27;#0ff&#x27;;
    ctx.beginPath();
    ctx.arc(tr.x, tr.y+8, 4*a+1, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // bullets
  ctx.shadowBlur = 10; ctx.shadowColor = &#x27;#ff0&#x27;;
  ctx.fillStyle = &#x27;#ff8&#x27;;
  for(var i=0;i&lt;bullets.length;i++){
    ctx.fillRect(bullets[i].x-2, bullets[i].y-8, 4, 14);
  }
  ctx.shadowBlur = 0;

  // enemies
  for(var i=0;i&lt;enemies.length;i++){
    var e = enemies[i];
    ctx.shadowBlur = 14; ctx.shadowColor = e.color;
    ctx.fillStyle = e.color;
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.t);
    if(e.type===&#x27;zig&#x27;){
      // diamond
      ctx.beginPath(); ctx.moveTo(0,-e.r); ctx.lineTo(e.r,0); ctx.lineTo(0,e.r); ctx.lineTo(-e.r,0); ctx.closePath(); ctx.fill();
    } else if(e.type===&#x27;spiral&#x27;){
      // hexagon
      ctx.beginPath();
      for(var k=0;k&lt;6;k++){ var ang=k/6*Math.PI*2; var fx=Math.cos(ang)*e.r, fy=Math.sin(ang)*e.r; if(k===0)ctx.moveTo(fx,fy); else ctx.lineTo(fx,fy);} ctx.closePath(); ctx.fill();
    } else {
      // square (split)
      ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);
    }
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  // particles
  for(var i=0;i&lt;particles.length;i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // ship
  ctx.shadowBlur = 16; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillStyle = gameOver ? &#x27;#356&#x27; : &#x27;#0ff&#x27;;
  ctx.beginPath();
  ctx.moveTo(shipX, H-42);
  ctx.lineTo(shipX-SHIP_W/2, H-14);
  ctx.lineTo(shipX+SHIP_W/2, H-14);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  // fuse timer (top border burning down)
  var frac = timeLeft/60;
  var fw = W*frac;
  var grad = ctx.createLinearGradient(0,0,W,0);
  grad.addColorStop(0,&#x27;#f00&#x27;); grad.addColorStop(0.5,&#x27;#f80&#x27;); grad.addColorStop(1,&#x27;#ff0&#x27;);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,fw,6);
  // burning tip
  if(frac&gt;0 &amp;&amp; !gameOver){
    ctx.shadowBlur = 12; ctx.shadowColor=&#x27;#ff0&#x27;;
    ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.fillRect(fw-3,0,4,6);
    ctx.shadowBlur=0;
  }

  // score
  ctx.textAlign=&#x27;center&#x27;;
  ctx.shadowBlur = 12; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.font = &#x27;800 34px system-ui, sans-serif&#x27;;
  ctx.fillText(score, W/2, 44);
  ctx.shadowBlur = 0;
  ctx.font = &#x27;600 15px system-ui, sans-serif&#x27;;
  ctx.fillStyle = &#x27;#9ad&#x27;;
  ctx.fillText(&#x27;TIME &#x27;+Math.ceil(timeLeft), W-56, 30);

  // combo
  if(mult &gt; 1){
    ctx.textAlign=&#x27;left&#x27;;
    var scale = 1 + Math.max(0,comboFlash)*0.6;
    ctx.save();
    ctx.translate(14, 34);
    ctx.scale(scale, scale);
    ctx.shadowBlur = 14; ctx.shadowColor = &#x27;#f0f&#x27;;
    ctx.fillStyle = &#x27;#f0f&#x27;;
    ctx.font = &#x27;800 22px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;COMBO x&#x27;+mult, 0, 0);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  if(gameOver) drawGameOver();
}

var goPulse = 0;
function drawGameOver(){
  ctx.fillStyle = &#x27;rgba(0,0,0,0.6)&#x27;;
  ctx.fillRect(0,0,W,H);
  goPulse += 0.08;
  var scale = 1 + Math.sin(goPulse)*0.08;
  ctx.textAlign=&#x27;center&#x27;;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(scale, scale);
  ctx.shadowBlur = 24; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillStyle = &#x27;#0ff&#x27;;
  ctx.font = &#x27;600 20px system-ui, sans-serif&#x27;;
  ctx.fillText(&#x27;FINAL SCORE&#x27;, 0, -44);
  ctx.shadowColor = &#x27;#f0f&#x27;;
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.font = &#x27;800 72px system-ui, sans-serif&#x27;;
  ctx.fillText(score, 0, 20);
  ctx.restore();
  ctx.shadowBlur = 0;
  if(score &gt; 30){
    ctx.fillStyle = &#x27;#ff0&#x27;;
    ctx.font = &#x27;700 18px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;★ VICTORY SHOWER! ★&#x27;, W/2, H/2+70);
  }
}

var celebId = null;
function endGame(){
  beep(180, 0.5, &#x27;sine&#x27;, 0.08);
  if(score &gt; 30){
    // celebration shower
    for(var i=0;i&lt;80;i++){
      particles.push({ x:Math.random()*W, y:-Math.random()*100, vx:(Math.random()-0.5)*2, vy:1+Math.random()*3, life:1.5, color:[&#x27;#0ff&#x27;,&#x27;#f0f&#x27;,&#x27;#ff0&#x27;,&#x27;#f80&#x27;][Math.floor(Math.random()*4)] });
    }
  }
}

function startGame(){
  if(running) return;
  score=0; combo=0; mult=1; timeLeft=60; speedFactor=1; spawnInterval=900; spawnTimer=0;
  shipX=W/2; bullets=[]; enemies=[]; particles=[]; trail=[]; gameOver=false; comboFlash=0; goPulse=0;
  lastTime=0; lastShot=0;
  for(var k in keys) keys[k]=false;
  initStars();
  spawnEnemy();
  running=true;
  animId = requestAnimationFrame(tick);
}
function stopGame(){
  if(!running) return;
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running&amp;&amp;!gameOver) shoot(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ if(running&amp;&amp;!gameOver) shoot(); });
cv.addEventListener(&#x27;mousemove&#x27;, function(e){
  if(!running||gameOver) return;
  var r = cv.getBoundingClientRect();
  shipX = Math.max(SHIP_W/2, Math.min(W-SHIP_W/2, e.clientX - r.left));
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
initStars();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
