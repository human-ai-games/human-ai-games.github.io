<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;/W&lt;/strong&gt;, and press &lt;strong&gt;&amp;darr;&lt;/strong&gt; to drop faster — or tap the zones at the bottom. Fill full rows to clear them; clear several at once for big combo bonuses!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Level: &lt;span class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over&lt;/div&gt;
    &lt;div class=&quot;zones&quot;&gt;
      &lt;div class=&quot;zone&quot; data-act=&quot;left&quot;&gt;◀ LEFT&lt;/div&gt;
      &lt;div class=&quot;zone&quot; data-act=&quot;rotate&quot;&gt;⟳ ROTATE&lt;/div&gt;
      &lt;div class=&quot;zone&quot; data-act=&quot;right&quot;&gt;RIGHT ▶&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);

  var FRUITS = {
    I: { emoji:&#x27;🍉&#x27;, color:&#x27;#ff5c7a&#x27; },
    O: { emoji:&#x27;🍊&#x27;, color:&#x27;#ffa53c&#x27; },
    T: { emoji:&#x27;🍇&#x27;, color:&#x27;#b56cff&#x27; },
    S: { emoji:&#x27;🍋&#x27;, color:&#x27;#ffe23c&#x27; },
    Z: { emoji:&#x27;🍓&#x27;, color:&#x27;#ff4c6a&#x27; },
    L: { emoji:&#x27;🍑&#x27;, color:&#x27;#ff9a6c&#x27; },
    J: { emoji:&#x27;🫐&#x27;, color:&#x27;#4c9cff&#x27; }
  };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = Object.keys(SHAPES);

  var running = false, dropId = null, dropMs = 600;
  var grid = [], piece = null, score = 0, level = 1;

  // starfield (built once)
  var starHtml = &#x27;&#x27;;
  for (var s = 0; s &lt; 40; s++) {
    var sz = (Math.random()*2+1).toFixed(1);
    starHtml += &#x27;&lt;div class=&quot;star&quot; style=&quot;left:&#x27;+(Math.random()*100).toFixed(1)+&#x27;%;top:&#x27;+
      (Math.random()*88).toFixed(1)+&#x27;%;width:&#x27;+sz+&#x27;px;height:&#x27;+sz+&#x27;px;&quot;&gt;&lt;/div&gt;&#x27;;
  }

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function rotateCells(cells){
    // rotate 90deg clockwise within bounding box
    var maxX=0,maxY=0;
    for(var i=0;i&lt;cells.length;i++){ if(cells[i][0]&gt;maxX)maxX=cells[i][0]; if(cells[i][1]&gt;maxY)maxY=cells[i][1]; }
    var out=[];
    for(var j=0;j&lt;cells.length;j++){ out.push([maxY-cells[j][1], cells[j][0]]); }
    return out;
  }

  function pieceCells(p){
    return p.cells.map(function(c){ return { x:p.x+c[0], y:p.y+c[1] }; });
  }

  function collidesAt(cells,x,y){
    for(var i=0;i&lt;cells.length;i++){
      var cx=x+cells[i][0], cy=y+cells[i][1];
      if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if(cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece(){
    var t = TYPES[Math.floor(Math.random()*TYPES.length)];
    piece = { type:t, cells: SHAPES[t].map(function(c){return[c[0],c[1]];}), x:3, y:-1 };
    if(collidesAt(piece.cells, piece.x, piece.y)) return false;
    return true;
  }

  function rotate(){
    if(!running||!piece) return;
    var rc = rotateCells(piece.cells);
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      if(!collidesAt(rc, piece.x+kicks[k], piece.y)){ piece.cells=rc; piece.x+=kicks[k]; paint(); return; }
    }
  }

  function lockPiece(){
    var cells=pieceCells(piece);
    for(var i=0;i&lt;cells.length;i++){ var c=cells[i]; if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS) grid[c.y][c.x]=piece.type; }
    piece=null;
  }

  function ghostY(){
    var y=piece.y;
    while(!collidesAt(piece.cells, piece.x, y+1)) y++;
    return y;
  }

  function clearFullRows(cb){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    if(full.length===0){ if(cb)cb(); return; }
    // flash animation on cleared cells
    var blocks = field.querySelectorAll(&#x27;.block&#x27;);
    // repaint then flash by row using data attributes
    paint();
    blocks = field.querySelectorAll(&#x27;.block[data-row]&#x27;);
    field.querySelectorAll(&#x27;.block&#x27;).forEach(function(b){
      var rr=parseInt(b.getAttribute(&#x27;data-row&#x27;),10);
      if(full.indexOf(rr)&gt;=0) b.classList.add(&#x27;flash&#x27;);
    });
    var n=full.length;
    var mult = n&gt;=4?8:(n&gt;=3?4:(n&gt;=2?2:1));
    var gained = n*10*mult;
    setTimeout(function(){
      full.sort(function(a,b){return a-b;});
      for(var i=0;i&lt;full.length;i++){
        grid.splice(full[i]-i,1);
        var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
        grid.unshift(empty);
      }
      score += gained;
      scoreEl.textContent = score;
      updateLevel();
      if(mult&gt;1) showCombo(mult);
      paint();
      if(cb)cb();
    }, 260);
  }

  function showCombo(m){
    var label = m===8?&#x27;TETRIS! 8×&#x27; : (m+&#x27;× COMBO!&#x27;);
    comboEl.textContent = label;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  function updateLevel(){
    var nl = Math.floor(score/100)+1;
    if(nl!==level){
      level=nl; levelEl.textContent=level;
      dropMs = Math.max(120, 600 - (level-1)*50);
      if(running){ clearInterval(dropId); dropId=setInterval(stepDown, dropMs); }
    }
  }

  function paint(){
    // clear only blocks/ghost, keep stars/combo/over/zones
    field.querySelectorAll(&#x27;.block,.ghost&#x27;).forEach(function(el){ el.remove(); });
    if(field.querySelectorAll(&#x27;.star&#x27;).length===0){
      var tmp=document.createElement(&#x27;div&#x27;); tmp.innerHTML=starHtml;
      while(tmp.firstChild) field.insertBefore(tmp.firstChild, field.firstChild);
    }
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawBlock(c,r,grid[r][c]);
    if(piece){
      var gy=ghostY();
      var gc=pieceCells({x:piece.x,y:gy,cells:piece.cells});
      for(var i=0;i&lt;gc.length;i++) if(gc[i].y&gt;=0) drawGhost(gc[i].x,gc[i].y);
      var cells=pieceCells(piece);
      for(var j=0;j&lt;cells.length;j++) if(cells[j].y&gt;=0) drawBlock(cells[j].x,cells[j].y,piece.type);
    }
  }

  function drawBlock(cx,cy,type){
    var f=FRUITS[type];
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;block&#x27;;
    el.setAttribute(&#x27;data-row&#x27;,cy);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=f.color;
    el.style.boxShadow=&#x27;0 0 8px &#x27;+f.color+&#x27;, 0 2px 4px rgba(0,0,0,0.5)&#x27;;
    el.textContent=f.emoji;
    field.appendChild(el);
  }
  function drawGhost(cx,cy){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown(){
    if(!piece) return;
    if(collidesAt(piece.cells, piece.x, piece.y+1)){
      lockPiece();
      clearFullRows(function(){
        if(!spawnPiece()){ endGame(); }
        else paint();
      });
    } else { piece.y++; paint(); }
  }

  function move(dx){
    if(!running||!piece) return;
    if(!collidesAt(piece.cells, piece.x+dx, piece.y)){ piece.x+=dx; paint(); }
  }

  function endGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
    overEl.style.display=&#x27;block&#x27;;
  }

  function startGame(){
    if(dropId){clearInterval(dropId);dropId=null;}
    score=0; level=1; dropMs=600;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    overEl.style.display=&#x27;none&#x27;;
    newGrid(); spawnPiece(); paint();
    running=true;
    dropId=setInterval(stepDown, dropMs);
  }
  function stopGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;w&#x27;||e.key===&#x27;W&#x27;){ rotate(); e.preventDefault(); }
  });

  document.querySelectorAll(&#x27;.zone&#x27;).forEach(function(z){
    z.addEventListener(&#x27;click&#x27;, function(){
      var a=z.getAttribute(&#x27;data-act&#x27;);
      if(a===&#x27;left&#x27;) move(-1); else if(a===&#x27;right&#x27;) move(1); else rotate();
    });
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial idle paint
  newGrid();
  piece = { type:&#x27;T&#x27;, cells: SHAPES.T.map(function(c){return[c[0],c[1]];}), x:3, y:1 };
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
