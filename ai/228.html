  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with ← →, rotate with ↑, soft-drop with ↓, and slam them down instantly with the Spacebar. Fill full rows to clear them for points — use the Start/Restart button below the game.&lt;/p&gt;

&lt;script&gt;
  var CELL = 24, COLS = 12, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  var overScoreEl = document.getElementById(&#x27;overScore&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);

  var FRUITS = [&#x27;🍓&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍊&#x27;,&#x27;🍉&#x27;,&#x27;🍍&#x27;,&#x27;🍎&#x27;];
  var COLORS = {
    I: &#x27;#48dbfb&#x27;, O: &#x27;#feca57&#x27;, T: &#x27;#c56cf0&#x27;, S: &#x27;#1dd1a1&#x27;,
    Z: &#x27;#ff6b6b&#x27;, J: &#x27;#54a0ff&#x27;, L: &#x27;#ff9f43&#x27;
  };
  var FRUIT = {
    I: &#x27;🍉&#x27;, O: &#x27;🍋&#x27;, T: &#x27;🍇&#x27;, S: &#x27;🍏&#x27; , Z: &#x27;🍓&#x27;, J: &#x27;🫐&#x27;, L: &#x27;🍊&#x27;
  };
  // rotation states as coordinate lists (relative)
  var SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]], [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]]],
    O: [[[0,0],[1,0],[0,1],[1,1]]],
    T: [[[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]]],
    S: [[[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]], [[1,1],[2,1],[0,2],[1,2]], [[0,0],[0,1],[1,1],[1,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]], [[0,1],[1,1],[1,2],[2,2]], [[1,0],[0,1],[1,1],[0,2]]],
    J: [[[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]], [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]], [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]]]
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  var grid, piece, score, level, running, dropId, baseDrop;

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) { var row = []; for (var c = 0; c &lt; COLS; c++) row.push(null); grid.push(row); }
  }

  function randType() { return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function pieceCells(p) {
    var s = SHAPES[p.type][p.rot % SHAPES[p.type].length];
    var out = [];
    for (var i=0;i&lt;s.length;i++) out.push({x: p.x+s[i][0], y: p.y+s[i][1]});
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i=0;i&lt;cells.length;i++) {
      var cx=cells[i].x, cy=cells[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var t = randType();
    piece = { type: t, rot: 0, x: Math.floor((COLS-4)/2), y: -1 };
    if (collides(piece)) { piece.y = 0; }
    return !collides(piece);
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i=0;i&lt;cells.length;i++) {
      var c=cells[i];
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS) grid[c.y][c.x] = piece.type;
    }
    piece = null;
  }

  function ghostPiece() {
    if (!piece) return null;
    var g = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y };
    while (!collides({type:g.type,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function clearFullRows() {
    var cleared = 0, colorType = null;
    for (var r=ROWS-1;r&gt;=0;r--) {
      var full=true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;}
      if (full) {
        colorType = grid[r][6] || grid[r][0];
        grid.splice(r,1);
        var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
        grid.unshift(empty);
        cleared++; r++;
      }
    }
    if (cleared&gt;0) {
      var pts = [0,100,300,600,1000][cleared];
      score += pts;
      scoreEl.textContent = score;
      var newLevel = 1 + Math.floor(score/200);
      if (newLevel !== level) { level = newLevel; levelEl.textContent = level; updateSpeed(); }
      var col = COLORS[colorType] || &#x27;#feca57&#x27;;
      doFlash(col);
      if (cleared&gt;=2) showCombo(pts, col);
    }
  }

  function doFlash(color) {
    flashEl.style.background = color;
    flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;);
    beep(cleared2freq, .12);
  }
  var cleared2freq = 440;

  function showCombo(pts, color) {
    comboEl.textContent = &#x27;+&#x27; + pts + &#x27; COMBO!&#x27;;
    comboEl.style.color = color;
    comboEl.classList.remove(&#x27;pop&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;pop&#x27;);
  }

  function paint() {
    // remove blocks/ghosts
    var kids = field.querySelectorAll(&#x27;.block, .ghost&#x27;);
    for (var i=0;i&lt;kids.length;i++) kids[i].remove();
    // ghost
    var g = piece ? ghostPiece() : null;
    if (g) {
      var gc = pieceCells(g);
      for (var i=0;i&lt;gc.length;i++) if(gc[i].y&gt;=0) drawGhost(gc[i].x, gc[i].y);
    }
    // locked
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++) if(grid[r][c]) drawBlock(c,r,grid[r][c]);
    // piece
    if (piece) { var pc=pieceCells(piece); for (var i=0;i&lt;pc.length;i++) if(pc[i].y&gt;=0) drawBlock(pc[i].x,pc[i].y,piece.type); }
  }

  function drawBlock(cx, cy, type) {
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;block&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=COLORS[type];
    el.style.boxShadow=&#x27;inset 0 0 0 1px rgba(255,255,255,.25), inset 0 -3px 4px rgba(0,0,0,.25)&#x27;;
    el.textContent=FRUIT[type];
    field.appendChild(el);
  }
  function drawGhost(cx,cy){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown() {
    if (!piece || !running) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { gameOver(); return; }
    } else piece=next;
    paint();
  }

  function move(dx){ if(!running||!piece)return; var n={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y}; if(!collides(n)){piece=n;paint();beep(300,.03);} }
  function rotate(){ if(!running||!piece)return; var nr=(piece.rot+1)%SHAPES[piece.type].length; var kicks=[0,-1,1,-2,2]; for(var k=0;k&lt;kicks.length;k++){ var n={type:piece.type,rot:nr,x:piece.x+kicks[k],y:piece.y}; if(!collides(n)){piece=n;paint();beep(500,.03);return;} } }
  function hardDrop(){ if(!running||!piece)return; var g=ghostPiece(); piece.y=g.y; beep(220,.08); stepDown(); }

  function updateSpeed(){
    if (!running) return;
    if (dropId) clearInterval(dropId);
    var ms = Math.max(120, baseDrop - (level-1)*60);
    dropId = setInterval(stepDown, ms);
  }

  function gameOver() {
    running = false;
    if (dropId){ clearInterval(dropId); dropId=null; }
    piece = null;
    cascadeGameOver();
  }

  function cascadeGameOver() {
    // fall off bottom one row at a time
    var step = function() {
      // find lowest occupied row, remove it, shift everything down
      var any=false;
      for (var r=ROWS-1;r&gt;=0;r--){ for(var c=0;c&lt;COLS;c++){ if(grid[r][c]){any=true;break;} } if(any)break; }
      if (!any) { finishOver(); return; }
      // shift all rows down by 1, drop bottom row off
      grid.pop();
      var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
      grid.unshift(empty);
      paint();
      setTimeout(step, 55);
    };
    setTimeout(step, 250);
  }

  function finishOver() {
    overScoreEl.textContent = &#x27;Score: &#x27; + score + &#x27;  •  Level &#x27; + level;
    overEl.classList.add(&#x27;show&#x27;);
    beep(160,.4);
  }

  var audioCtx=null;
  function beep(freq,dur){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=freq; o.type=&#x27;square&#x27;;
      g.gain.value=0.05; o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
      o.stop(audioCtx.currentTime+dur);
    }catch(_){}
  }

  function startGame() {
    running=true;
    overEl.classList.remove(&#x27;show&#x27;);
    score=0; level=1; baseDrop=550;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    newGrid(); spawnPiece(); paint();
    if(dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, baseDrop);
  }
  function stopGame() {
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if(e.key===&#x27; &#x27;){ hardDrop(); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // telemetry
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial view
  newGrid();
  piece={type:&#x27;T&#x27;,rot:0,x:Math.floor((COLS-4)/2),y:1};
  paint();

    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
