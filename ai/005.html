<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>STARBLAST</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #eaf6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#38bdf8,#e879f9); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(232,121,249,0.4); }
  .instructions { font-size: 16px; color: #9fb6d6; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 18px; font-weight: 700; }
  .hud span { color: #38bdf8; }
  #score.flash { color: #fff; text-shadow: 0 0 14px #e879f9; transform: scale(1.25); }
  #score { display: inline-block; transition: transform .12s ease, text-shadow .12s ease; }
  .combo { color: #e879f9; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 30px rgba(56,189,248,0.25); background: #05010f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;STARBLAST&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; or &lt;strong&gt;A / D&lt;/strong&gt; and hold &lt;strong&gt;Space&lt;/strong&gt; to fire lasers at asteroids and alien saucers. Big rocks split before they shatter — chain hits for a combo bonus, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Combo: &lt;span id=&quot;combo&quot; class=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Time: &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);
var timeEl = document.getElementById(&#x27;time&#x27;);

var running = false, animId = null;
var keys = {};
var ship, bullets, asteroids, saucers, particles, stars;
var score, hits, combo, mult, bestCombo, timeLeft, lastTime, elapsed;
var lastShot, saucerTimer, astTimer;

// ---- audio ----
var AC = null;
function actx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } return AC; }
function beep(freq, dur, type, vol){
  var a = actx(); if(!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.06, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}

function initStars(){
  stars = [];
  for(var i=0;i&lt;70;i++){
    var far = Math.random()&lt;0.6;
    stars.push({ x:Math.random()*W, y:Math.random()*H, s:far?1:2,
      sp:far?0.35:0.9, c:far?&#x27;#3b4a66&#x27;:&#x27;#8fb8ff&#x27; });
  }
}

function reset(){
  ship = { x: W/2, y: H-30, w:26, h:22, sp:6 };
  bullets = []; asteroids = []; saucers = []; particles = [];
  score = 0; hits = 0; combo = 0; mult = 1; bestCombo = 1;
  timeLeft = 60; elapsed = 0;
  lastShot = 0; saucerTimer = 0; astTimer = 0;
  initStars();
  scoreEl.textContent = &#x27;0&#x27;;
  comboEl.textContent = &#x27;x1&#x27;;
  timeEl.textContent = &#x27;60&#x27;;
}

function spawnAsteroid(){
  var r = 26 + Math.random()*10;
  asteroids.push({ x: Math.random()*(W-2*r)+r, y: -r, r:r, big:true,
    vx:(Math.random()-0.5)*1.2, vy:0.7+Math.random()*0.8+elapsed*0.01,
    rot:Math.random()*6, vr:(Math.random()-0.5)*0.05 });
}
function splitAsteroid(a){
  for(var i=0;i&lt;2;i++){
    var ang = Math.random()*Math.PI*2;
    asteroids.push({ x:a.x, y:a.y, r:14+Math.random()*4, big:false,
      vx:Math.cos(ang)*1.6, vy:Math.abs(Math.sin(ang))*1.4+0.8,
      rot:Math.random()*6, vr:(Math.random()-0.5)*0.1 });
  }
}
function spawnSaucer(){
  var fromLeft = Math.random()&lt;0.5;
  var speed = 1.4 + elapsed*0.02;
  saucers.push({ x: fromLeft? -20 : W+20, baseY: 40+Math.random()*180,
    dir: fromLeft?1:-1, vx:(fromLeft?1:-1)*speed, amp:30+Math.random()*40,
    phase:Math.random()*6, freq:0.04+Math.random()*0.03, r:16, t:0 });
}

function explode(x,y,color,n){
  for(var i=0;i&lt;(n||14);i++){
    var ang = Math.random()*Math.PI*2, sp = 1+Math.random()*3.5;
    particles.push({ x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      life:1, color:color });
  }
}

function flashScore(){
  scoreEl.classList.remove(&#x27;flash&#x27;);
  void scoreEl.offsetWidth;
  scoreEl.classList.add(&#x27;flash&#x27;);
}

function addScore(pts){
  score += pts*mult;
  scoreEl.textContent = score;
  flashScore();
}
function registerHit(){
  hits++;
  combo++;
  if(hits % 5 === 0){ mult++; }
  bestCombo = Math.max(bestCombo, mult);
  comboEl.textContent = &#x27;x&#x27;+mult;
}
function registerMiss(){
  combo = 0; hits = 0; mult = 1;
  comboEl.textContent = &#x27;x1&#x27;;
}

function fire(){
  var now = performance.now();
  if(now - lastShot &lt; 180) return;
  lastShot = now;
  bullets.push({ x: ship.x, y: ship.y-14, vy:-9 });
  beep(880,0.06,&#x27;square&#x27;,0.04);
}

function drawShip(){
  var s = ship;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.shadowColor = &#x27;#38bdf8&#x27;; ctx.shadowBlur = 16;
  ctx.fillStyle = &#x27;#38bdf8&#x27;;
  ctx.beginPath();
  ctx.moveTo(0,-14); ctx.lineTo(13,12); ctx.lineTo(0,6); ctx.lineTo(-13,12);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle = &#x27;#e879f9&#x27;;
  ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fill();
  // thruster
  ctx.fillStyle = &#x27;rgba(232,121,249,&#x27;+(0.5+Math.random()*0.4)+&#x27;)&#x27;;
  ctx.beginPath(); ctx.moveTo(-5,12); ctx.lineTo(0,18+Math.random()*6); ctx.lineTo(5,12); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawAsteroid(a){
  ctx.save();
  ctx.translate(a.x,a.y); ctx.rotate(a.rot);
  ctx.strokeStyle = a.big?&#x27;#7dd3fc&#x27;:&#x27;#c4b5fd&#x27;;
  ctx.shadowColor = a.big?&#x27;#38bdf8&#x27;:&#x27;#a78bfa&#x27;; ctx.shadowBlur=10;
  ctx.fillStyle = &#x27;rgba(20,20,45,0.85)&#x27;;
  ctx.lineWidth = 2;
  ctx.beginPath();
  var pts=8;
  for(var i=0;i&lt;pts;i++){
    var ang=i/pts*Math.PI*2;
    var rr=a.r*(0.75+((i*37)%10)/20);
    var px=Math.cos(ang)*rr, py=Math.sin(ang)*rr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawSaucer(s){
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.shadowColor=&#x27;#e879f9&#x27;; ctx.shadowBlur=14;
  ctx.fillStyle=&#x27;#e879f9&#x27;;
  ctx.beginPath(); ctx.ellipse(0,2,16,6,0,0,7); ctx.fill();
  ctx.fillStyle=&#x27;#a5f3fc&#x27;;
  ctx.beginPath(); ctx.ellipse(0,-3,8,6,0,Math.PI,2*Math.PI); ctx.fill();
  ctx.restore();
}

function tick(now){
  if(!running) return;
  var dt = lastTime? (now-lastTime)/16.67 : 1;
  lastTime = now;
  elapsed += dt/60*16.67/1000; // seconds-ish

  timeLeft -= (now &amp;&amp; dt)? dt/60 : 0;
  timeEl.textContent = Math.max(0,Math.ceil(timeLeft));
  if(timeLeft&lt;=0){ gameOver(); return; }

  // input
  if(keys[&#x27;left&#x27;]) ship.x -= ship.sp*dt;
  if(keys[&#x27;right&#x27;]) ship.x += ship.sp*dt;
  ship.x = Math.max(16, Math.min(W-16, ship.x));
  if(keys[&#x27;fire&#x27;]) fire();

  // spawn
  astTimer += dt;
  var astRate = 55 - elapsed*3; if(astRate&lt;22) astRate=22;
  if(astTimer&gt;astRate){ astTimer=0; spawnAsteroid(); }
  saucerTimer += dt;
  var sRate = 200 - elapsed*6; if(sRate&lt;90) sRate=90;
  if(saucerTimer&gt;sRate){ saucerTimer=0; spawnSaucer(); }

  // background
  ctx.fillStyle = &#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
  for(var i=0;i&lt;stars.length;i++){
    var st=stars[i]; st.y += st.sp*dt;
    if(st.y&gt;H){ st.y=0; st.x=Math.random()*W; }
    ctx.fillStyle = st.c; ctx.fillRect(st.x,st.y,st.s,st.s);
  }

  // bullets
  for(var b=bullets.length-1;b&gt;=0;b--){
    var bu=bullets[b]; bu.y += bu.vy*dt;
    if(bu.y&lt;-10){ bullets.splice(b,1); continue; }
    ctx.save(); ctx.shadowColor=&#x27;#a5f3fc&#x27;; ctx.shadowBlur=10;
    ctx.fillStyle=&#x27;#eaffff&#x27;; ctx.fillRect(bu.x-2,bu.y-8,4,12); ctx.restore();
  }

  // asteroids
  for(var i2=asteroids.length-1;i2&gt;=0;i2--){
    var a=asteroids[i2];
    a.x+=a.vx*dt; a.y+=a.vy*dt; a.rot+=a.vr*dt;
    if(a.x&lt;a.r||a.x&gt;W-a.r) a.vx*=-1;
    if(a.y&gt;H+a.r){ asteroids.splice(i2,1); registerMiss(); continue; }
    drawAsteroid(a);
  }

  // saucers
  for(var s2=saucers.length-1;s2&gt;=0;s2--){
    var sc=saucers[s2]; sc.t+=dt;
    sc.x += sc.vx*dt;
    sc.y = sc.baseY + Math.sin(sc.phase + sc.t*sc.freq)*sc.amp;
    if(sc.x&lt;-40||sc.x&gt;W+40){ saucers.splice(s2,1); continue; }
    drawSaucer(sc);
  }

  // collisions bullet vs asteroid
  for(var b2=bullets.length-1;b2&gt;=0;b2--){
    var bu2=bullets[b2]; var consumed=false;
    for(var a2=asteroids.length-1;a2&gt;=0;a2--){
      var as=asteroids[a2];
      var dx=bu2.x-as.x, dy=bu2.y-as.y;
      if(dx*dx+dy*dy &lt; as.r*as.r){
        registerHit();
        if(as.big){
          addScore(5);
          explode(as.x,as.y,&#x27;#7dd3fc&#x27;,12);
          splitAsteroid(as);
          asteroids.splice(a2,1);
          beep(300,0.1,&#x27;sawtooth&#x27;,0.05);
        } else {
          addScore(10);
          explode(as.x,as.y,&#x27;#c4b5fd&#x27;,16);
          asteroids.splice(a2,1);
          beep(200,0.14,&#x27;sawtooth&#x27;,0.06);
        }
        consumed=true; break;
      }
    }
    if(consumed){ bullets.splice(b2,1); continue; }
    for(var sc2=saucers.length-1;sc2&gt;=0;sc2--){
      var su=saucers[sc2];
      var ddx=bu2.x-su.x, ddy=bu2.y-su.y;
      if(ddx*ddx+ddy*ddy &lt; (su.r+2)*(su.r+2)){
        registerHit(); addScore(25);
        explode(su.x,su.y,&#x27;#e879f9&#x27;,20);
        saucers.splice(sc2,1); bullets.splice(b2,1);
        beep(520,0.16,&#x27;triangle&#x27;,0.06);
        break;
      }
    }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pa=particles[p];
    pa.x+=pa.vx*dt; pa.y+=pa.vy*dt; pa.vx*=0.96; pa.vy*=0.96;
    pa.life-=0.03*dt;
    if(pa.life&lt;=0){ particles.splice(p,1); continue; }
    ctx.save(); ctx.globalAlpha=Math.max(0,pa.life);
    ctx.shadowColor=pa.color; ctx.shadowBlur=8;
    ctx.fillStyle=pa.color;
    ctx.beginPath(); ctx.arc(pa.x,pa.y,2.5,0,7); ctx.fill();
    ctx.restore();
  }

  drawShip();

  animId = requestAnimationFrame(tick);
}

function drawStaticScene(){
  ctx.fillStyle = &#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
  if(stars) for(var i=0;i&lt;stars.length;i++){ var st=stars[i]; ctx.fillStyle=st.c; ctx.fillRect(st.x,st.y,st.s,st.s); }
  if(ship) drawShip();
}

function gameOver(){
  running = false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  ctx.fillStyle=&#x27;rgba(5,1,15,0.78)&#x27;; ctx.fillRect(0,0,W,H);
  ctx.textAlign=&#x27;center&#x27;;
  ctx.shadowColor=&#x27;#e879f9&#x27;; ctx.shadowBlur=24;
  ctx.fillStyle=&#x27;#e879f9&#x27;; ctx.font=&#x27;800 46px system-ui, sans-serif&#x27;;
  ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-30);
  ctx.shadowBlur=10; ctx.shadowColor=&#x27;#38bdf8&#x27;;
  ctx.fillStyle=&#x27;#eaf6ff&#x27;; ctx.font=&#x27;700 24px system-ui, sans-serif&#x27;;
  ctx.fillText(&#x27;Final Score: &#x27;+score, W/2, H/2+15);
  ctx.fillStyle=&#x27;#7dd3fc&#x27;; ctx.font=&#x27;600 20px system-ui, sans-serif&#x27;;
  ctx.fillText(&#x27;Top Combo: x&#x27;+bestCombo, W/2, H/2+48);
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#9fb6d6&#x27;; ctx.font=&#x27;500 15px system-ui, sans-serif&#x27;;
  ctx.fillText(&#x27;Press Start below to play again&#x27;, W/2, H/2+82);
}

function startGame(){
  reset();
  running = true;
  lastTime = 0;
  if(animId) cancelAnimationFrame(animId);
  // spawn something immediately so motion appears within 1s
  spawnAsteroid();
  spawnSaucer();
  animId = requestAnimationFrame(tick);
}
function stopGame(){
  running = false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  drawStaticScene();
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  var k=e.key;
  if(k===&#x27;ArrowLeft&#x27;||k===&#x27;a&#x27;||k===&#x27;A&#x27;){ keys.left=true; e.preventDefault(); }
  else if(k===&#x27;ArrowRight&#x27;||k===&#x27;d&#x27;||k===&#x27;D&#x27;){ keys.right=true; e.preventDefault(); }
  else if(k===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ keys.fire=true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  var k=e.key;
  if(k===&#x27;ArrowLeft&#x27;||k===&#x27;a&#x27;||k===&#x27;A&#x27;) keys.left=false;
  else if(k===&#x27;ArrowRight&#x27;||k===&#x27;d&#x27;||k===&#x27;D&#x27;) keys.right=false;
  else if(k===&#x27; &#x27;||e.code===&#x27;Space&#x27;) keys.fire=false;
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ if(running) fire(); });
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ if(running) fire(); e.preventDefault(); });

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial stopped state
reset();
drawStaticScene();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
