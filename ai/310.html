<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash: Lily to Lily</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a3d3f; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #ffe45e; text-shadow: 1px 1px 0 #1b5e20; }
  .instructions { font-size: 16px; color: #d6f5e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash: Lily to Lily&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys (or tap/click a direction on the pond) to cross the river and reach a glowing lily pad up top. Ride logs, dodge ducks and turtles, and don&#x27;t linger in open water or you&#x27;ll sink!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;best&quot;&gt;Best: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var CELL = 40;
var COLS = Math.floor(W / CELL);     // 15
var ROWS = Math.floor(H / CELL);     // 12
var scoreEl = document.getElementById(&#x27;score&#x27;);
var bestEl = document.getElementById(&#x27;best&#x27;);
var running = false, animId = null, best = 0;

// Lane types: &#x27;grass&#x27; (safe bank), &#x27;log&#x27; (ride), &#x27;road&#x27; (dodge obstacles), &#x27;water&#x27; (sink)
var lanes = [];
var frog = null;
var score = 0;
var level = 0;
var particles = [];
var splash = null;
var hopAnim = 0;     // 0..1 stretch on hop
var t = 0;

function rand(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }

function buildLanes() {
  lanes = [];
  var speedBase = 0.6 + level * 0.12;
  for (var r = 0; r &lt; ROWS; r++) {
    if (r === ROWS - 1 || r === 0) {
      lanes.push({ type: &#x27;grass&#x27; });
      continue;
    }
    // choose lane type; near top a bit safer
    var roll = Math.random();
    var type;
    if (roll &lt; 0.4) type = &#x27;log&#x27;;
    else if (roll &lt; 0.8) type = &#x27;road&#x27;;
    else type = &#x27;water&#x27;;
    var dir = (r % 2 === 0) ? 1 : -1;
    var speed = dir * (speedBase + rand(0, 0.5));
    var lane = { type: type, dir: dir, speed: speed, items: [] };
    if (type === &#x27;log&#x27;) {
      var lw = pick([2,3,3,4]);
      var count = pick([2,3]);
      var gap = COLS / count;
      for (var i=0;i&lt;count;i++){
        lane.items.push({ x: (i*gap + rand(0,gap*0.4)) * CELL, w: lw*CELL, sprite:&#x27;log&#x27; });
      }
    } else if (type === &#x27;road&#x27;) {
      var kinds = [&#x27;duck&#x27;,&#x27;turtle&#x27;,&#x27;log&#x27;];
      if (level &gt;= 2) kinds.push(&#x27;shell&#x27;);
      if (level &gt;= 4) kinds.push(&#x27;gator&#x27;);
      var cnt = pick([2,3]);
      var g = COLS / cnt;
      for (var j=0;j&lt;cnt;j++){
        var k = pick(kinds);
        var w = (k===&#x27;log&#x27;) ? 2*CELL : CELL;
        lane.items.push({ x: (j*g + rand(0,g*0.4)) * CELL, w: w, sprite: k });
      }
    }
    lanes.push(lane);
  }
  // ensure a lily pad target column on top grass
  lanes[0].lily = (Math.random()*COLS)|0;
}

function resetFrog() {
  frog = { col: (COLS/2)|0, row: ROWS-1, px: 0, sink: 0 };
  frog.px = frog.col * CELL;
}

function startGame() {
  score = 0; level = 0;
  scoreEl.textContent = &#x27;0&#x27;;
  particles = []; splash = null; hopAnim = 0;
  buildLanes();
  resetFrog();
  running = true;
  if (!animId) animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function riderUnder() {
  // returns log item the frog stands on, or null
  var lane = lanes[frog.row];
  if (!lane || lane.type !== &#x27;log&#x27;) return null;
  var fx = frog.px + CELL/2;
  for (var i=0;i&lt;lane.items.length;i++){
    var it = lane.items[i];
    if (fx &gt;= it.x &amp;&amp; fx &lt;= it.x + it.w) return it;
  }
  return null;
}

function checkHit() {
  var lane = lanes[frog.row];
  if (!lane) return;
  if (lane.type === &#x27;road&#x27;) {
    var fx = frog.px, fw = CELL;
    for (var i=0;i&lt;lane.items.length;i++){
      var it = lane.items[i];
      var iw = wrappedX(it.x);
      // check both real and wrapped positions
      if (overlap(fx, fw, it.x, it.w) || overlap(fx, fw, iw, it.w)) { die(&#x27;splat&#x27;); return; }
    }
  } else if (lane.type === &#x27;water&#x27;) {
    // sinking handled by timer
  }
}
function overlap(ax, aw, bx, bw){ return ax &lt; bx+bw &amp;&amp; ax+aw &gt; bx; }
function wrappedX(x){
  var span = COLS*CELL;
  if (x &lt; 0) return x + span;
  if (x &gt; span) return x - span;
  return x;
}

function die(kind) {
  if (splash) return;
  splash = { x: frog.px + CELL/2, y: frog.row*CELL + CELL/2, life: 0, kind: kind };
  for (var i=0;i&lt;14;i++){
    particles.push({ x: splash.x, y: splash.y, vx: rand(-3,3), vy: rand(-4,1), life:0, max: rand(20,40), col: kind===&#x27;splat&#x27;?&#x27;#e53935&#x27;:&#x27;#4fc3f7&#x27; });
  }
  running = false;
  setTimeout(function(){
    splash = null;
    resetFrog();
    running = true;
  }, 550);
}

function scorePoint() {
  score++;
  scoreEl.textContent = score;
  if (score &gt; best) { best = score; bestEl.textContent = best; }
  level++;
  // fireworks at top
  for (var i=0;i&lt;24;i++){
    var ang = rand(0, Math.PI*2), sp = rand(1,4);
    particles.push({ x: frog.px+CELL/2, y: frog.row*CELL+CELL/2, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life:0, max: rand(25,50), col: pick([&#x27;#ffe45e&#x27;,&#x27;#ff6bcb&#x27;,&#x27;#4fc3f7&#x27;,&#x27;#7CFC00&#x27;,&#x27;#ff8c42&#x27;]) });
  }
  buildLanes();
  resetFrog();
}

function move(dc, dr) {
  if (!running || splash) return;
  var nc = frog.col + dc;
  var nr = frog.row + dr;
  nc = Math.max(0, Math.min(COLS-1, nc));
  nr = Math.max(0, Math.min(ROWS-1, nr));
  frog.col = nc; frog.row = nr;
  frog.px = frog.col * CELL;
  frog.sink = 0;
  hopAnim = 1;
  if (nr === 0) { scorePoint(); return; }
  checkHit();
}

function loop() {
  t += 1;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function update() {
  if (running &amp;&amp; !splash) {
    // move lane items
    for (var r=0;r&lt;ROWS;r++){
      var lane = lanes[r];
      if (!lane.items) continue;
      var span = COLS*CELL;
      for (var i=0;i&lt;lane.items.length;i++){
        var it = lane.items[i];
        it.x += lane.speed;
        if (lane.speed &gt; 0 &amp;&amp; it.x &gt; span) it.x -= (span + it.w);
        else if (lane.speed &lt; 0 &amp;&amp; it.x + it.w &lt; 0) it.x += (span + it.w);
      }
    }
    // ride log
    var rider = riderUnder();
    var lane = lanes[frog.row];
    if (lane &amp;&amp; lane.type === &#x27;log&#x27;) {
      if (rider) {
        frog.px += lane.speed;
        frog.sink = 0;
        if (frog.px &lt; -CELL/2 || frog.px &gt; W - CELL/2) { die(&#x27;splash&#x27;); }
        frog.col = Math.round(frog.px / CELL);
      } else {
        die(&#x27;splash&#x27;);
      }
    } else if (lane &amp;&amp; lane.type === &#x27;water&#x27;) {
      frog.sink += 1;
      if (frog.sink &gt; 90) die(&#x27;splash&#x27;);
    } else {
      frog.sink = 0;
    }
    if (running &amp;&amp; !splash) checkHit();
  }
  // particles
  for (var p=particles.length-1;p&gt;=0;p--){
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life++;
    if (pt.life &gt; pt.max) particles.splice(p,1);
  }
  if (splash) splash.life++;
  if (hopAnim &gt; 0) hopAnim = Math.max(0, hopAnim - 0.08);
}

// ---------- Drawing ----------
function draw() {
  for (var r=0;r&lt;ROWS;r++){
    var y = r*CELL;
    var lane = lanes[r];
    drawLaneBg(lane, y, r);
  }
  // lane items
  for (var rr=0;rr&lt;ROWS;rr++){
    var ln = lanes[rr];
    if (!ln.items) continue;
    for (var i=0;i&lt;ln.items.length;i++){
      drawItem(ln.items[i], rr*CELL, ln);
    }
  }
  // lily pad target
  drawLily(lanes[0].lily * CELL, 0);
  // frog
  if (!splash) drawFrog();
  // splash / splat
  if (splash) drawSplash();
  // particles
  for (var p=0;p&lt;particles.length;p++){
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, 1 - pt.life/pt.max);
    ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawLaneBg(lane, y, r) {
  if (lane.type === &#x27;grass&#x27;) {
    ctx.fillStyle = &#x27;#3fa34d&#x27;;
    ctx.fillRect(0, y, W, CELL);
    ctx.fillStyle = &#x27;rgba(255,255,255,0.06)&#x27;;
    for (var x=0;x&lt;W;x+=20) ctx.fillRect(x, y+CELL-6, 8, 6);
  } else if (lane.type === &#x27;road&#x27;) {
    ctx.fillStyle = &#x27;#1e88e5&#x27;;
    ctx.fillRect(0, y, W, CELL);
    ripples(y, &#x27;#42a5f5&#x27;);
  } else if (lane.type === &#x27;water&#x27;) {
    ctx.fillStyle = &#x27;#0d47a1&#x27;;
    ctx.fillRect(0, y, W, CELL);
    ripples(y, &#x27;#1565c0&#x27;);
  } else { // log lane water
    ctx.fillStyle = &#x27;#1976d2&#x27;;
    ctx.fillRect(0, y, W, CELL);
    ripples(y, &#x27;#2196f3&#x27;);
  }
}
function ripples(y, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.5;
  for (var x=0;x&lt;W;x+=44){
    var off = (t*0.5 + x) % 44;
    ctx.beginPath();
    ctx.arc(x+off, y+CELL/2, 6, 0.2*Math.PI, 0.8*Math.PI);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawItem(it, y, lane) {
  var span = COLS*CELL;
  drawSpriteAt(it, it.x, y);
  // wrapped copy for seamless scroll
  if (lane.speed &gt; 0 &amp;&amp; it.x + it.w &gt; span) drawSpriteAt(it, it.x - (span+it.w), y);
  if (lane.speed &lt; 0 &amp;&amp; it.x &lt; 0) drawSpriteAt(it, it.x + (span+it.w), y);
}

function drawSpriteAt(it, x, y) {
  var cy = y + CELL/2;
  if (it.sprite === &#x27;log&#x27;) {
    ctx.fillStyle = &#x27;#8d5524&#x27;;
    roundRect(x+2, y+6, it.w-4, CELL-12, 8); ctx.fill();
    ctx.fillStyle = &#x27;#a9744f&#x27;;
    for (var lx=x+8; lx&lt;x+it.w-8; lx+=14){ ctx.beginPath(); ctx.arc(lx, cy, 3, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = &#x27;#5d3a1a&#x27;;
    ctx.beginPath(); ctx.arc(x+7, cy, 8, 0, Math.PI*2); ctx.fill();
  } else {
    var emoji = { duck:&#x27;🦆&#x27;, turtle:&#x27;🐢&#x27;, shell:&#x27;🐚&#x27;, gator:&#x27;🐊&#x27; }[it.sprite] || &#x27;🦆&#x27;;
    ctx.font = &#x27;30px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillText(emoji, x + it.w/2, cy+1);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawLily(x, y) {
  var cx = x + CELL/2, cy = y + CELL/2;
  var glow = 6 + Math.sin(t*0.1)*3;
  ctx.fillStyle = &#x27;rgba(255,228,94,0.4)&#x27;;
  ctx.beginPath(); ctx.arc(cx, cy, 16+glow, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = &#x27;#66bb6a&#x27;;
  ctx.beginPath(); ctx.arc(cx, cy, 15, 0.3, Math.PI*2 - 0.3); ctx.fill();
  ctx.fillStyle = &#x27;#ff6bcb&#x27;;
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
}

function drawFrog() {
  var cx = frog.px + CELL/2;
  var cy = frog.row*CELL + CELL/2;
  var stretch = 1 + hopAnim*0.3;
  var squish = 1 - hopAnim*0.2;
  var w = 26*squish, h = 26*stretch;
  // body
  ctx.fillStyle = &#x27;#43a047&#x27;;
  ctx.beginPath(); ctx.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle = &#x27;#388e3c&#x27;;
  ctx.beginPath(); ctx.ellipse(cx-11, cy+8, 6, 4, 0.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+11, cy+8, 6, 4, -0.6, 0, Math.PI*2); ctx.fill();
  // eyes
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.beginPath(); ctx.arc(cx-6, cy-h/2+2, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6, cy-h/2+2, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = &#x27;#000&#x27;;
  ctx.beginPath(); ctx.arc(cx-6, cy-h/2+2, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6, cy-h/2+2, 2.4, 0, Math.PI*2); ctx.fill();
  // sinking timer bar
  if (lanes[frog.row] &amp;&amp; lanes[frog.row].type === &#x27;water&#x27; &amp;&amp; frog.sink &gt; 0) {
    var pct = 1 - frog.sink/90;
    ctx.fillStyle = &#x27;rgba(0,0,0,0.4)&#x27;;
    ctx.fillRect(frog.px+4, cy+16, CELL-8, 5);
    ctx.fillStyle = pct &gt; 0.4 ? &#x27;#ffe45e&#x27; : &#x27;#e53935&#x27;;
    ctx.fillRect(frog.px+4, cy+16, (CELL-8)*pct, 5);
  }
}

function drawSplash() {
  var s = Math.min(1, splash.life/12);
  ctx.strokeStyle = splash.kind===&#x27;splat&#x27; ? &#x27;#e53935&#x27; : &#x27;#4fc3f7&#x27;;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(splash.x, splash.y, 6 + s*20, 0, Math.PI*2); ctx.stroke();
  ctx.font = &#x27;30px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
  ctx.fillText(splash.kind===&#x27;splat&#x27; ? &#x27;💥&#x27; : &#x27;💦&#x27;, splash.x, splash.y);
}

// ---------- Input ----------
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key === &#x27;ArrowLeft&#x27;) { move(-1,0); e.preventDefault(); }
  else if (e.key === &#x27;ArrowRight&#x27;) { move(1,0); e.preventDefault(); }
  else if (e.key === &#x27;ArrowUp&#x27;) { move(0,-1); e.preventDefault(); }
  else if (e.key === &#x27;ArrowDown&#x27;) { move(0,1); e.preventDefault(); }
});

function tapDir(e){
  if (!running || splash) return;
  var rect = cv.getBoundingClientRect();
  var cxp = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  var cyp = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  var fx = frog.px + CELL/2, fy = frog.row*CELL + CELL/2;
  var dx = cxp - fx, dy = cyp - fy;
  if (Math.abs(dx) &gt; Math.abs(dy)) move(dx&gt;0?1:-1, 0);
  else move(0, dy&gt;0?1:-1);
}
cv.addEventListener(&#x27;mousedown&#x27;, tapDir);
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ e.preventDefault(); tapDir(e); }, {passive:false});

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
buildLanes();
resetFrog();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the

<script>

  var iframe = document.getElementById('game');

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
