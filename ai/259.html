<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>GRAVITY SWAP</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #6ff; text-shadow: 0 0 12px #0ff, 0 0 24px #08a; }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .field-wrap { position: relative; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 24px rgba(0,200,255,0.25); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GRAVITY SWAP&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to flip gravity between the floor and ceiling rails, threading through the neon asteroids. Every 10 dodged you speed up — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;680&quot; height=&quot;500&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;);
var ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var RAIL_PAD = 44;           // distance from edge to rail center
var HERO_R = 15;
var HERO_X = 110;

var running = false, animId = null;
var gameOver = false;
var score = 0, level = 1;
var baseSpeed = 3.2, speed = baseSpeed;
var spawnTimer = 0, spawnGap = 90;

// hero state
var heroGravityDown = true;   // true = floor rail, false = ceiling
var heroY = H - RAIL_PAD;
var heroVY = 0;
var GRAV = 0.9, FLIP_V = 0;   // instant target-based movement

var asteroids = [];
var particles = [];
var stars = [];

function floorY() { return H - RAIL_PAD; }
function ceilY() { return RAIL_PAD; }

function initStars() {
  stars = [];
  for (var layer = 0; layer &lt; 3; layer++) {
    var count = [40, 30, 20][layer];
    for (var i = 0; i &lt; count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: [0.7, 1.2, 1.9][layer],
        spd: [0.4, 0.9, 1.6][layer],
        layer: layer
      });
    }
  }
}

function reset() {
  score = 0; level = 1;
  speed = baseSpeed;
  spawnTimer = 0; spawnGap = 90;
  heroGravityDown = true;
  heroY = floorY(); heroVY = 0;
  asteroids = [];
  particles = [];
  gameOver = false;
  initStars();
}

// irregular polygon asteroid
function makeAsteroid(cy, radius) {
  var verts = [];
  var n = 7 + Math.floor(Math.random() * 4);
  for (var i = 0; i &lt; n; i++) {
    var ang = (i / n) * Math.PI * 2;
    var rr = radius * (0.72 + Math.random() * 0.5);
    verts.push({ ang: ang, r: rr });
  }
  return {
    x: W + radius + 10,
    y: cy,
    r: radius,
    verts: verts,
    rot: Math.random() * Math.PI * 2,
    rotSpd: (Math.random() - 0.5) * 0.06,
    hue: 180 + Math.random() * 120,
    scored: false
  };
}

function spawnWave() {
  var type = Math.random();
  var fy = floorY(), cy = ceilY();
  if (type &lt; 0.34) {
    // floor asteroid
    asteroids.push(makeAsteroid(fy - 6, 22 + Math.random() * 16));
  } else if (type &lt; 0.68) {
    // ceiling asteroid
    asteroids.push(makeAsteroid(cy + 6, 22 + Math.random() * 16));
  } else {
    // paired — narrow gap in the middle, must thread
    var r = 40 + Math.random() * 30;
    var top = makeAsteroid(cy + r - 30, r);
    var bot = makeAsteroid(fy - r + 30, r);
    bot.x += 4;
    asteroids.push(top);
    asteroids.push(bot);
  }
}

function flip() {
  if (!running || gameOver) return;
  heroGravityDown = !heroGravityDown;
  burst(HERO_X, heroY, heroGravityDown ? &#x27;#fff&#x27; : &#x27;#3ff&#x27;);
}

function burst(x, y, color) {
  for (var i = 0; i &lt; 20; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 1 + Math.random() * 4;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, color: color
    });
  }
}

function polyPoints(ast) {
  var pts = [];
  for (var i = 0; i &lt; ast.verts.length; i++) {
    var v = ast.verts[i];
    var a = v.ang + ast.rot;
    pts.push({ x: ast.x + Math.cos(a) * v.r, y: ast.y + Math.sin(a) * v.r });
  }
  return pts;
}

function collides(ast) {
  // approximate with circle vs circle using asteroid radius
  var dx = ast.x - HERO_X;
  var dy = ast.y - heroY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  return dist &lt; ast.r * 0.82 + HERO_R;
}

function update() {
  // hero moves toward target rail
  var target = heroGravityDown ? floorY() : ceilY();
  var dir = target - heroY;
  heroVY += (heroGravityDown ? GRAV : -GRAV);
  heroY += (target - heroY) * 0.35;
  if (Math.abs(target - heroY) &lt; 0.5) heroY = target;

  // stars parallax
  for (var i = 0; i &lt; stars.length; i++) {
    var s = stars[i];
    s.x -= s.spd * (speed / baseSpeed);
    if (s.x &lt; 0) { s.x = W; s.y = Math.random() * H; }
  }

  // spawn
  if (!gameOver) {
    spawnTimer++;
    if (spawnTimer &gt;= spawnGap) { spawnTimer = 0; spawnWave(); }
  }

  // asteroids
  for (var j = asteroids.length - 1; j &gt;= 0; j--) {
    var a = asteroids[j];
    a.x -= speed;
    a.rot += a.rotSpd;
    if (!a.scored &amp;&amp; a.x + a.r &lt; HERO_X) {
      a.scored = true;
      score++;
      if (score % 10 === 0) {
        level++;
        speed += 0.7;
        spawnGap = Math.max(48, spawnGap - 5);
      }
    }
    if (a.x + a.r &lt; -20) { asteroids.splice(j, 1); continue; }
    if (!gameOver &amp;&amp; collides(a)) {
      gameOver = true;
      burst(HERO_X, heroY, &#x27;#f55&#x27;);
      burst(HERO_X, heroY, &#x27;#fa0&#x27;);
    }
  }

  // particles
  for (var k = particles.length - 1; k &gt;= 0; k--) {
    var p = particles[k];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life -= 0.03;
    if (p.life &lt;= 0) particles.splice(k, 1);
  }
}

function drawRails() {
  var g;
  // floor glow strip
  ctx.save();
  g = ctx.createLinearGradient(0, floorY() + 20, 0, floorY() + 30);
  ctx.fillStyle = &#x27;rgba(120,180,255,0.15)&#x27;;
  ctx.fillRect(0, floorY() + 18, W, 22);
  ctx.strokeStyle = &#x27;rgba(140,200,255,0.9)&#x27;;
  ctx.lineWidth = 3;
  ctx.shadowBlur = 16; ctx.shadowColor = &#x27;#5cf&#x27;;
  ctx.beginPath(); ctx.moveTo(0, floorY() + 20); ctx.lineTo(W, floorY() + 20); ctx.stroke();
  // ceiling glow strip
  ctx.fillStyle = &#x27;rgba(255,120,220,0.13)&#x27;;
  ctx.fillRect(0, ceilY() - 40, W, 22);
  ctx.strokeStyle = &#x27;rgba(255,140,230,0.9)&#x27;;
  ctx.shadowColor = &#x27;#f6c&#x27;;
  ctx.beginPath(); ctx.moveTo(0, ceilY() - 20); ctx.lineTo(W, ceilY() - 20); ctx.stroke();
  ctx.restore();
}

function drawHero() {
  var haloColor = heroGravityDown ? &#x27;rgba(255,255,255,0.9)&#x27; : &#x27;rgba(80,255,255,0.9)&#x27;;
  var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
  ctx.save();
  // halo
  var hg = ctx.createRadialGradient(HERO_X, heroY, HERO_R * 0.4, HERO_X, heroY, HERO_R * (2.4 + pulse));
  hg.addColorStop(0, haloColor);
  hg.addColorStop(1, &#x27;rgba(0,0,0,0)&#x27;);
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(HERO_X, heroY, HERO_R * (2.6 + pulse), 0, Math.PI * 2);
  ctx.fill();
  // body
  ctx.shadowBlur = 18; ctx.shadowColor = heroGravityDown ? &#x27;#fff&#x27; : &#x27;#0ff&#x27;;
  ctx.fillStyle = heroGravityDown ? &#x27;#eef&#x27; : &#x27;#bff&#x27;;
  ctx.beginPath();
  ctx.arc(HERO_X, heroY, HERO_R, 0, Math.PI * 2);
  ctx.fill();
  // visor
  ctx.shadowBlur = 0;
  ctx.fillStyle = &#x27;rgba(20,40,80,0.9)&#x27;;
  ctx.beginPath();
  ctx.arc(HERO_X + 3, heroY - 2, HERO_R * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawAsteroid(a) {
  var pts = polyPoints(a);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i &lt; pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = &#x27;hsla(&#x27; + a.hue + &#x27;,60%,22%,1)&#x27;;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 14;
  ctx.shadowColor = &#x27;hsl(&#x27; + a.hue + &#x27;,90%,60%)&#x27;;
  ctx.strokeStyle = &#x27;hsl(&#x27; + a.hue + &#x27;,90%,65%)&#x27;;
  ctx.stroke();
  ctx.restore();
}

function draw() {
  // background
  ctx.fillStyle = &#x27;#04050d&#x27;;
  ctx.fillRect(0, 0, W, H);

  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    var s = stars[i];
    ctx.globalAlpha = [0.5, 0.75, 1][s.layer];
    ctx.fillStyle = s.layer === 2 ? &#x27;#cff&#x27; : &#x27;#aac&#x27;;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawRails();

  for (var j = 0; j &lt; asteroids.length; j++) drawAsteroid(asteroids[j]);

  // particles
  for (var k = 0; k &lt; particles.length; k++) {
    var p = particles[k];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawHero();

  // score big glowing digits
  ctx.save();
  ctx.textAlign = &#x27;center&#x27;;
  ctx.font = &#x27;700 54px system-ui, sans-serif&#x27;;
  ctx.shadowBlur = 24; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillStyle = &#x27;#dff&#x27;;
  ctx.fillText(score, W / 2, 66);
  ctx.font = &#x27;600 14px system-ui, sans-serif&#x27;;
  ctx.shadowBlur = 8;
  ctx.fillStyle = &#x27;#7cf&#x27;;
  ctx.fillText(&#x27;SPEED &#x27; + level, W / 2, 88);
  ctx.restore();

  if (gameOver) {
    ctx.save();
    ctx.fillStyle = &#x27;rgba(0,0,0,0.55)&#x27;;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillStyle = &#x27;#f88&#x27;;
    ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#f00&#x27;;
    ctx.font = &#x27;700 42px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;CRASHED&#x27;, W / 2, H / 2 - 10);
    ctx.font = &#x27;600 20px system-ui, sans-serif&#x27;;
    ctx.fillStyle = &#x27;#cff&#x27;;
    ctx.shadowBlur = 8;
    ctx.fillText(&#x27;Dodged &#x27; + score + &#x27; asteroids&#x27;, W / 2, H / 2 + 26);
    ctx.fillText(&#x27;Press Start to fly again&#x27;, W / 2, H / 2 + 54);
    ctx.restore();
  }
}

function loop() {
  if (!running) return;
  if (!gameOver) update();
  else {
    // keep particles/stars alive on the game over screen for a moment
    for (var i = 0; i &lt; stars.length; i++) { stars[i].x -= stars[i].spd * 0.3; if (stars[i].x &lt; 0) stars[i].x = W; }
    for (var k = particles.length - 1; k &gt;= 0; k--) { var p = particles[k]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.03; if (p.life &lt;= 0) particles.splice(k, 1); }
  }
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  reset();
  if (!running) { running = true; animId = requestAnimationFrame(loop); }
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function (e) {
  if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { flip(); e.preventDefault(); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function () { flip(); });

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static render (stopped state, page visible)
initStars();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
