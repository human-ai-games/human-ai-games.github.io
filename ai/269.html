<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON INVADERS</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: &#x27;Segoe UI&#x27;, system-ui, sans-serif; margin: 0; padding: 0; background: #000; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 640px; }
  h1 { margin: 2px 0; font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #0ff; text-shadow: 0 0 10px #0ff, 0 0 20px #08f; }
  .instructions { font-size: 16px; color: #9cf; max-width: 640px; margin: 0; line-height: 1.3; text-align: center; }
  .topbar { display: flex; justify-content: space-between; align-items: center; width: 620px; }
  .score { font-size: 20px; color: #ff0; text-shadow: 0 0 8px #f80; }
  .lives { font-size: 20px; }
  .field { position: relative; width: 620px; height: 400px; flex-shrink: 0; background: radial-gradient(ellipse at 50% 120%, #101040 0%, #000 70%); border: 2px solid #0ff; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,.4) inset; }
  #stars { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .controls { display: flex; gap: 14px; margin-top: 2px; }
  .btn { user-select: none; width: 120px; height: 54px; font-size: 22px; font-weight: bold; border: 2px solid #0ff; background: rgba(0,60,80,.6); color: #0ff; border-radius: 10px; cursor: pointer; text-shadow: 0 0 6px #0ff; box-shadow: 0 0 10px rgba(0,255,255,.3); }
  .btn.fire { border-color: #f0f; color: #f0f; text-shadow: 0 0 6px #f0f; box-shadow: 0 0 10px rgba(255,0,255,.3); }
  .btn:active { background: rgba(0,120,160,.8); }
  #overlay { position: absolute; inset: 0; background: rgba(0,0,10,.85); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #overlay.show { display: flex; }
  #overlay .go { font-size: 42px; font-weight: 900; color: #f33; text-shadow: 0 0 15px #f00; letter-spacing: 3px; }
  #overlay .fin { font-size: 22px; color: #ff0; }
  #overlay .rank { font-size: 26px; color: #0ff; text-shadow: 0 0 12px #0ff; }
  #overlay .hint { font-size: 15px; color: #9cf; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON INVADERS&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &amp;larr; &amp;rarr; (or the on-screen buttons) and press Space / FIRE to shoot the alien invaders. Small red aliens are worth 5, orange 3, purple 1 — don&#x27;t let three slip past!&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;stars&quot; width=&quot;620&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;go&quot;&gt;GAME OVER&lt;/div&gt;
      &lt;div class=&quot;fin&quot;&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;rank&quot; id=&quot;rank&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;leftBtn&quot;&gt;&amp;#9664;&lt;/button&gt;
    &lt;button class=&quot;btn fire&quot; id=&quot;fireBtn&quot;&gt;FIRE&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;rightBtn&quot;&gt;&amp;#9654;&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 620, FIELD_H = 400;
  var SHIP_W = 34, SHIP_H = 26, SHIP_BOTTOM = 10, SHIP_SPEED = 6;
  var BULLET_W = 4, BULLET_H = 14, BULLET_SPEED = 9;
  var canvas = document.getElementById(&#x27;stars&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var rankEl = document.getElementById(&#x27;rank&#x27;);

  var running = false, animId = null, spawnId = null;
  var keysDown = {};
  var shipX = (FIELD_W - SHIP_W) / 2;
  var bullets = [], aliens = [], trail = [], stars = [];
  var score = 0, lives = 3, escaped = 0;
  var lastShot = 0, flashT = 0;
  var spawnInterval = 1100;

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  // Alien types
  var TYPES = [
    { color: &#x27;#ff3355&#x27;, glow: &#x27;#f00&#x27;, size: 20, speed: 2.6, points: 5, weight: 0.3 },
    { color: &#x27;#ff9922&#x27;, glow: &#x27;#f80&#x27;, size: 30, speed: 1.9, points: 3, weight: 0.4 },
    { color: &#x27;#aa55ff&#x27;, glow: &#x27;#80f&#x27;, size: 42, speed: 1.2, points: 1, weight: 0.3 }
  ];

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 90; i++) {
      stars.push({ x: Math.random()*FIELD_W, y: Math.random()*FIELD_H,
        r: Math.random()*1.6+0.3, sp: Math.random()*0.8+0.2 });
    }
  }

  function renderLives() {
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; lives; i++) s += &#x27;\uD83D\uDE80&#x27;;
    livesEl.textContent = s;
  }

  function pickType() {
    var r = Math.random(), acc = 0;
    for (var i = 0; i &lt; TYPES.length; i++) { acc += TYPES[i].weight; if (r &lt;= acc) return TYPES[i]; }
    return TYPES[0];
  }

  function spawnAlien() {
    var t = pickType();
    // difficulty scaling
    var boost = 1 + Math.min(score / 200, 1.2);
    var a = {
      t: t, size: t.size,
      x: Math.random() * (FIELD_W - t.size),
      y: -t.size,
      baseX: 0,
      speed: t.speed * boost,
      phase: Math.random() * Math.PI * 2,
      pattern: Math.random() &lt; 0.5 ? &#x27;zig&#x27; : &#x27;spiral&#x27;,
      amp: 30 + Math.random() * 40
    };
    a.baseX = a.x;
    aliens.push(a);
  }

  function fire() {
    var now = Date.now();
    if (now - lastShot &lt; 180) return;
    lastShot = now;
    bullets.push({ x: shipX + SHIP_W/2 - BULLET_W/2, y: FIELD_H - SHIP_BOTTOM - SHIP_H - BULLET_H });
    beep(880, 0.08, &#x27;square&#x27;, 0.04);
  }

  function loseLife() {
    lives--;
    renderLives();
    beep(120, 0.3, &#x27;sawtooth&#x27;, 0.08);
    if (lives &lt;= 0) endGame();
  }

  function draw() {
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);
    // stars
    ctx.fillStyle = &#x27;#fff&#x27;;
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.4 + s.sp*0.6;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // thruster trail
    for (var i = 0; i &lt; trail.length; i++) {
      var tr = trail[i];
      ctx.globalAlpha = tr.life / 12;
      ctx.fillStyle = &#x27;#0af&#x27;;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.life * 0.5 + 1, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bullets
    ctx.fillStyle = &#x27;#f0f&#x27;;
    ctx.shadowColor = &#x27;#f0f&#x27;; ctx.shadowBlur = 8;
    for (var i = 0; i &lt; bullets.length; i++) {
      ctx.fillRect(bullets[i].x, bullets[i].y, BULLET_W, BULLET_H);
    }
    ctx.shadowBlur = 0;

    // aliens
    for (var i = 0; i &lt; aliens.length; i++) {
      var a = aliens[i];
      ctx.fillStyle = a.t.color;
      ctx.shadowColor = a.t.glow; ctx.shadowBlur = 12;
      var cx = a.x + a.size/2, cy = a.y + a.size/2, r = a.size/2;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      // eyes
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;#000&#x27;;
      ctx.beginPath(); ctx.arc(cx - r*0.35, cy - r*0.1, r*0.18, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r*0.35, cy - r*0.1, r*0.18, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ship
    var sx = shipX, sy = FIELD_H - SHIP_BOTTOM - SHIP_H;
    ctx.fillStyle = &#x27;#0ff&#x27;;
    ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(sx + SHIP_W/2, sy);
    ctx.lineTo(sx + SHIP_W, sy + SHIP_H);
    ctx.lineTo(sx, sy + SHIP_H);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(sx + SHIP_W/2, sy + SHIP_H*0.55, 4, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }

  function tick() {
    if (!running) return;
    // move ship
    if (keysDown[&#x27;left&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;right&#x27;]) shipX += SHIP_SPEED;
    shipX = Math.max(0, Math.min(FIELD_W - SHIP_W, shipX));

    // trail
    trail.push({ x: shipX + SHIP_W/2, y: FIELD_H - SHIP_BOTTOM, life: 12 });
    for (var i = trail.length - 1; i &gt;= 0; i--) { trail[i].life--; if (trail[i].life &lt;= 0) trail.splice(i,1); }

    // stars scroll
    for (var i = 0; i &lt; stars.length; i++) {
      stars[i].y += stars[i].sp;
      if (stars[i].y &gt; FIELD_H) { stars[i].y = 0; stars[i].x = Math.random()*FIELD_W; }
    }

    // bullets
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      bullets[i].y -= BULLET_SPEED;
      if (bullets[i].y + BULLET_H &lt; 0) bullets.splice(i, 1);
    }

    // aliens move
    for (var j = aliens.length - 1; j &gt;= 0; j--) {
      var a = aliens[j];
      a.y += a.speed;
      a.phase += 0.06;
      if (a.pattern === &#x27;zig&#x27;) {
        a.x = a.baseX + Math.sin(a.phase) * a.amp;
      } else {
        a.baseX += Math.sin(a.phase*0.5) * 1.2;
        a.x = a.baseX + Math.cos(a.phase) * a.amp * 0.5;
      }
      a.x = Math.max(0, Math.min(FIELD_W - a.size, a.x));
      if (a.y &gt; FIELD_H) {
        aliens.splice(j, 1);
        escaped++;
        if (escaped &gt;= 3) { escaped = 0; loseLife(); }
        continue;
      }
    }

    // collisions
    for (var i = bullets.length - 1; i &gt;= 0; i--) {
      var b = bullets[i];
      for (var j = aliens.length - 1; j &gt;= 0; j--) {
        var a = aliens[j];
        var cx = a.x + a.size/2, cy = a.y + a.size/2, r = a.size/2;
        var bx = b.x + BULLET_W/2, by = b.y + BULLET_H/2;
        var dx = bx - cx, dy = by - cy;
        if (dx*dx + dy*dy &lt; (r + 6)*(r + 6)) {
          bullets.splice(i, 1);
          aliens.splice(j, 1);
          score += a.t.points;
          scoreEl.textContent = score;
          flashT = 6;
          beep(1200 - a.t.size*8, 0.1, &#x27;triangle&#x27;, 0.05);
          break;
        }
      }
    }

    // flash
    if (flashT &gt; 0) { flashEl.style.opacity = (flashT/6)*0.4; flashT--; }
    else flashEl.style.opacity = 0;

    // difficulty: adjust spawn rate
    var target = Math.max(400, 1100 - score * 3);
    if (Math.abs(target - spawnInterval) &gt; 20) {
      spawnInterval = target;
      clearInterval(spawnId);
      spawnId = setInterval(spawnAlien, spawnInterval);
    }

    draw();
    animId = requestAnimationFrame(tick);
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
    finalScoreEl.textContent = score;
    var rank;
    if (score &gt;= 150) rank = &#x27;GALAXY LEGEND&#x27;;
    else if (score &gt;= 80) rank = &#x27;STAR PILOT&#x27;;
    else if (score &gt;= 30) rank = &#x27;SPACE CADET&#x27;;
    else rank = &#x27;ROOKIE RECRUIT&#x27;;
    rankEl.textContent = rank;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame() {
    overlay.classList.remove(&#x27;show&#x27;);
    bullets = []; aliens = []; trail = [];
    score = 0; lives = 3; escaped = 0;
    spawnInterval = 1100;
    scoreEl.textContent = &#x27;0&#x27;;
    renderLives();
    shipX = (FIELD_W - SHIP_W) / 2;
    for (var k in keysDown) keysDown[k] = false;
    lastShot = 0; flashT = 0;
    initStars();
    running = true;
    spawnAlien();
    animId = requestAnimationFrame(tick);
    spawnId = setInterval(spawnAlien, spawnInterval);
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (spawnId) { clearInterval(spawnId); spawnId = null; }
  }

  // keyboard
  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { keysDown[&#x27;left&#x27;] = true; e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { keysDown[&#x27;right&#x27;] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) fire(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) keysDown[&#x27;left&#x27;] = false;
    else if (e.key === &#x27;ArrowRight&#x27;) keysDown[&#x27;right&#x27;] = false;
  });

  // on-screen buttons
  function hold(el, key) {
    el.addEventListener(&#x27;mousedown&#x27;, function(e){ keysDown[key] = true; e.preventDefault(); });
    el.addEventListener(&#x27;mouseup&#x27;, function(){ keysDown[key] = false; });
    el.addEventListener(&#x27;mouseleave&#x27;, function(){ keysDown[key] = false; });
    el.addEventListener(&#x27;touchstart&#x27;, function(e){ keysDown[key] = true; e.preventDefault(); });
    el.addEventListener(&#x27;touchend&#x27;, function(e){ keysDown[key] = false; e.preventDefault(); });
  }
  hold(document.getElementById(&#x27;leftBtn&#x27;), &#x27;left&#x27;);
  hold(document.getElementById(&#x27;rightBtn&#x27;), &#x27;right&#x27;);
  var fireBtn = document.getElementById(&#x27;fireBtn&#x27;);
  fireBtn.addEventListener(&#x27;mousedown&#x27;, function(e){ if (running) fire(); e.preventDefault(); });
  fireBtn.addEventListener(&#x27;touchstart&#x27;, function(e){ if (running) fire(); e.preventDefault(); });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint (stopped state)
  initStars();
  renderLives();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
