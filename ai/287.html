&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #d8f6ff; overflow: hidden; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ GALACTIC DEFLECTOR ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the glowing paddle with your mouse or the ← → arrow keys to bounce the orb into the alien bricks. Chain hits without dropping the orb to build your combo multiplier — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;x2&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 470;
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);

  var PADDLE_W = 110, PADDLE_H = 14, PADDLE_Y = H - 30, PADDLE_SPEED = 8;
  var BALL_R = 8;
  var running = false, animId = null;
  var keys = {};
  var paddleX, targetPaddleX = null;
  var ballX, ballY, ballVX, ballVY, ballSpeed;
  var score, combo;
  var bricks = [], particles = [], stars = [];
  var paddleFlash = 0, paddleRipple = 0, waveFlash = 0, wave = 0;

  // starfield
  for (var i = 0; i &lt; 70; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.6+0.4, tw: Math.random()*Math.PI*2 });

  var BRICK_COLS = 10, BRICK_W = 52, BRICK_GAP = 6, BRICK_H = 20, BRICK_TOP = 45, BRICK_LEFT = (W - (BRICK_COLS*(BRICK_W+BRICK_GAP)-BRICK_GAP))/2;

  var COLORS = [&#x27;#00f0ff&#x27;,&#x27;#a24bff&#x27;,&#x27;#ff4bd8&#x27;,&#x27;#4bff9e&#x27;,&#x27;#ffd24b&#x27;,&#x27;#ff6b4b&#x27;];

  function buildWave() {
    bricks = [];
    wave++;
    var rows = Math.min(3 + wave, 7);
    for (var r = 0; r &lt; rows; r++) {
      for (var c = 0; c &lt; BRICK_COLS; c++) {
        // pattern: skip some for fun shapes on early waves, denser later
        if (wave &lt;= 2 &amp;&amp; ((r + c) % 2 === 1) &amp;&amp; r &gt; 1) continue;
        var rnd = Math.random();
        var type = &#x27;normal&#x27;, hp = 1;
        if (rnd &lt; 0.08) { type = &#x27;gold&#x27;; hp = 1; }
        else if (rnd &lt; 0.32 &amp;&amp; r &lt; rows - 1) { type = &#x27;armor&#x27;; hp = 2; }
        bricks.push({
          x: BRICK_LEFT + c*(BRICK_W+BRICK_GAP),
          y: BRICK_TOP + r*(BRICK_H+BRICK_GAP),
          type: type, hp: hp, maxhp: hp,
          color: type===&#x27;gold&#x27; ? &#x27;#ffd24b&#x27; : (type===&#x27;armor&#x27; ? &#x27;#c9d6e2&#x27; : COLORS[r % COLORS.length])
        });
      }
    }
    waveFlash = 1;
  }

  function reset() {
    score = 0; combo = 1; wave = 0;
    paddleX = (W - PADDLE_W)/2; targetPaddleX = null;
    ballSpeed = 4.2;
    launchBall();
    particles = [];
    buildWave();
    updateScore(); updateCombo();
  }

  function launchBall() {
    ballX = W/2; ballY = PADDLE_Y - 40;
    var ang = (-Math.PI/2) + (Math.random()*0.6-0.3);
    ballVX = Math.cos(ang)*ballSpeed;
    ballVY = Math.sin(ang)*ballSpeed;
  }

  function updateScore() {
    scoreEl.textContent = score;
    scoreEl.parentElement.style.transform = &#x27;scale(1.25)&#x27;;
    setTimeout(function(){ scoreEl.parentElement.style.transform = &#x27;scale(1)&#x27;; }, 90);
  }
  function updateCombo() {
    if (combo &gt;= 2) {
      comboEl.textContent = &#x27;x&#x27; + combo;
      comboEl.classList.add(&#x27;show&#x27;);
      var hue = Math.min(combo*30, 120);
      comboEl.style.background = &#x27;linear-gradient(90deg,#ffd24b,#ff6b4b)&#x27;;
      comboEl.style.boxShadow = &#x27;0 0 18px rgba(255,180,60,0.7)&#x27;;
      comboEl.style.transform = &#x27;scale(1.3)&#x27;;
      setTimeout(function(){ comboEl.style.transform = &#x27;scale(1)&#x27;; }, 90);
    } else {
      comboEl.classList.remove(&#x27;show&#x27;);
    }
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
      particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color, size:Math.random()*3+1 });
    }
  }

  // sound
  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(_) {}
  }

  function hitBrick(b, idx) {
    b.hp--;
    if (b.hp &gt; 0) {
      spawnParticles(b.x+BRICK_W/2, b.y+BRICK_H/2, b.color, 6);
      beep(300, 0.06, &#x27;sawtooth&#x27;);
    } else {
      if (b.type === &#x27;gold&#x27;) { spawnParticles(b.x+BRICK_W/2, b.y+BRICK_H/2, &#x27;#ffd24b&#x27;, 34); score += 50*combo; beep(660,0.18,&#x27;triangle&#x27;); }
      else { spawnParticles(b.x+BRICK_W/2, b.y+BRICK_H/2, b.color, 14); score += 10*combo; beep(440,0.07,&#x27;square&#x27;); }
      bricks.splice(idx,1);
      combo++;
      updateCombo();
      updateScore();
      if (bricks.length === 0) buildWave();
    }
  }

  function tick() {
    if (!running) return;

    // paddle move
    if (keys[&#x27;ArrowLeft&#x27;]) { paddleX -= PADDLE_SPEED; targetPaddleX = null; }
    if (keys[&#x27;ArrowRight&#x27;]) { paddleX += PADDLE_SPEED; targetPaddleX = null; }
    if (targetPaddleX !== null) paddleX += (targetPaddleX - paddleX) * 0.35;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    // ball
    ballX += ballVX; ballY += ballVY;
    if (ballX - BALL_R &lt;= 0) { ballX = BALL_R; ballVX = -ballVX; }
    if (ballX + BALL_R &gt;= W) { ballX = W - BALL_R; ballVX = -ballVX; }
    if (ballY - BALL_R &lt;= 0) { ballY = BALL_R; ballVY = -ballVY; }

    // paddle collision
    if (ballVY &gt; 0 &amp;&amp; ballY + BALL_R &gt;= PADDLE_Y &amp;&amp; ballY + BALL_R &lt;= PADDLE_Y + PADDLE_H + 8 &amp;&amp;
        ballX &gt;= paddleX - BALL_R &amp;&amp; ballX &lt;= paddleX + PADDLE_W + BALL_R) {
      var rel = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2); // -1..1
      ballSpeed += 0.18;
      var ang = -Math.PI/2 + rel * (Math.PI/3);
      ballVX = Math.cos(ang)*ballSpeed;
      ballVY = Math.sin(ang)*ballSpeed;
      ballY = PADDLE_Y - BALL_R - 1;
      paddleFlash = 1; paddleRipple = 1;
      beep(220, 0.05, &#x27;sine&#x27;);
    }

    // brick collision
    for (var i = bricks.length - 1; i &gt;= 0; i--) {
      var b = bricks[i];
      if (ballX + BALL_R &gt; b.x &amp;&amp; ballX - BALL_R &lt; b.x + BRICK_W &amp;&amp;
          ballY + BALL_R &gt; b.y &amp;&amp; ballY - BALL_R &lt; b.y + BRICK_H) {
        // determine bounce direction
        var overlapX = Math.min(ballX + BALL_R - b.x, b.x + BRICK_W - (ballX - BALL_R));
        var overlapY = Math.min(ballY + BALL_R - b.y, b.y + BRICK_H - (ballY - BALL_R));
        if (overlapX &lt; overlapY) ballVX = -ballVX; else ballVY = -ballVY;
        hitBrick(b, i);
        break;
      }
    }

    // ball falls
    if (ballY - BALL_R &gt; H) {
      combo = 1; updateCombo();
      launchBall();
      beep(120, 0.25, &#x27;sawtooth&#x27;);
    }

    // particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life -= 0.028;
      if (pt.life &lt;= 0) particles.splice(p,1);
    }

    if (paddleFlash &gt; 0) paddleFlash -= 0.08;
    if (paddleRipple &gt; 0) paddleRipple -= 0.05;
    if (waveFlash &gt; 0) waveFlash -= 0.04;

    draw();
    animId = requestAnimationFrame(tick);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i]; s.tw += 0.05;
      var a = 0.4 + Math.sin(s.tw)*0.35;
      ctx.fillStyle = &#x27;rgba(200,230,255,&#x27;+a+&#x27;)&#x27;;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // bricks
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      ctx.save();
      ctx.shadowColor = b.color; ctx.shadowBlur = 10;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 4); ctx.fill();
      ctx.shadowBlur = 0;
      if (b.type === &#x27;armor&#x27; &amp;&amp; b.hp &lt; b.maxhp) {
        // crack
        ctx.strokeStyle = &#x27;rgba(0,0,0,0.55)&#x27;; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x+10, b.y+2); ctx.lineTo(b.x+20, b.y+BRICK_H-3);
        ctx.lineTo(b.x+32, b.y+4); ctx.lineTo(b.x+42, b.y+BRICK_H-2);
        ctx.stroke();
      }
      if (b.type === &#x27;gold&#x27;) {
        ctx.fillStyle = &#x27;rgba(255,255,255,0.85)&#x27;; ctx.font = &#x27;13px sans-serif&#x27;; ctx.textAlign = &#x27;center&#x27;;
        ctx.fillText(&#x27;★&#x27;, b.x+BRICK_W/2, b.y+15);
      }
      ctx.restore();
    }

    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // ball with pulse
    var pulse = 1 + Math.sin(Date.now()/120)*0.15;
    ctx.save();
    ctx.shadowColor = &#x27;#00f0ff&#x27;; ctx.shadowBlur = 18;
    var grad = ctx.createRadialGradient(ballX, ballY, 1, ballX, ballY, BALL_R*1.4*pulse);
    grad.addColorStop(0,&#x27;#ffffff&#x27;); grad.addColorStop(0.5,&#x27;#7ff5ff&#x27;); grad.addColorStop(1,&#x27;#0088aa&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(ballX, ballY, BALL_R*pulse, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // paddle ripple
    if (paddleRipple &gt; 0) {
      ctx.strokeStyle = &#x27;rgba(0,240,255,&#x27;+paddleRipple+&#x27;)&#x27;;
      ctx.lineWidth = 2;
      var rr = (1-paddleRipple)*40;
      ctx.beginPath();
      ctx.ellipse(paddleX+PADDLE_W/2, PADDLE_Y+PADDLE_H/2, PADDLE_W/2+rr, PADDLE_H+rr, 0, 0, Math.PI*2);
      ctx.stroke();
    }
    // paddle
    ctx.save();
    ctx.shadowColor = &#x27;#00f0ff&#x27;; ctx.shadowBlur = 15 + paddleFlash*25;
    var pg = ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
    pg.addColorStop(0,&#x27;#00c8ff&#x27;); pg.addColorStop(0.5, paddleFlash&gt;0.4?&#x27;#ffffff&#x27;:&#x27;#7ff5ff&#x27;); pg.addColorStop(1,&#x27;#00c8ff&#x27;);
    ctx.fillStyle = pg;
    roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 7); ctx.fill();
    ctx.restore();

    // wave flash
    if (waveFlash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(160,90,255,&#x27;+(waveFlash*0.4)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
    }
  }

  function roundRect(x,y,w,h,r) {
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  });
  function moveTo(clientX){
    var rect = cv.getBoundingClientRect();
    var x = (clientX - rect.left) * (W/rect.width);
    targetPaddleX = x - PADDLE_W/2;
  }
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){ if(running) moveTo(e.clientX); });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if(running &amp;&amp; e.touches[0]){ moveTo(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});

  function startGame(){ if(running) return; reset(); running = true; animId = requestAnimationFrame(tick); }
  function stopGame(){ if(!running) return; running = false; if(animId){ cancelAnimationFrame(animId); animId=null; } }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static frame
  paddleX = (W-PADDLE_W)/2; ballX = W/2; ballY = PADDLE_Y-40; ballVX=0; ballVY=0;
  score=0; combo=1; buildWave(); waveFlash=0;
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
