<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: linear-gradient(160deg,#ffe6f2,#e6f7ff); color: #3a2a4a; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box;
    height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800;
    background: linear-gradient(90deg,#ff5e8a,#ff9f43,#ffd93d,#6bcb77,#4d96ff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #6a5a7a; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #ff5e8a; margin: 0; transition: transform .12s; }
  .score.pulse { transform: scale(1.35); }
  .field-wrap { position: relative; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0;
    background: rgba(255,255,255,.55); border-radius: 10px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(120,80,160,.25); border: 2px solid #fff; }
  .block { position: absolute; box-sizing: border-box; border-radius: 5px;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    border: 2px solid rgba(255,255,255,.85); }
  .ghost { position: absolute; box-sizing: border-box; border-radius: 5px;
    border: 2px dashed rgba(120,80,160,.5); background: rgba(120,80,160,.08); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    border-radius: 10px; }
  .flash.go { animation: flashAnim .45s ease-out; }
  @keyframes flashAnim { 0% { opacity: .9; } 100% { opacity: 0; } }
  .combo { position: absolute; top: 40%; left: 0; right: 0; text-align: center;
    font-size: 34px; font-weight: 900; color: #ff5e8a; pointer-events: none;
    text-shadow: 0 2px 0 #fff, 0 0 12px #ffd93d; opacity: 0; }
  .combo.go { animation: comboAnim .9s ease-out; }
  @keyframes comboAnim { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); }
    30% { opacity: 1; transform: scale(1.2) rotate(4deg); }
    70% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(1.1); } }
  .overlay { position: absolute; inset: 0; background: rgba(58,42,74,.88); color: #fff;
    border-radius: 10px; display: none; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 8px; padding: 10px; }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 40px; }
  .overlay .msg { font-size: 20px; font-weight: 700; }
  .overlay .fin { font-size: 26px; font-weight: 800; color: #ffd93d; }
  .overlay .hint { font-size: 15px; opacity: .85; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with &lt;strong&gt;← →&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, and &lt;strong&gt;↓&lt;/strong&gt; to drop faster (or swipe on mobile). Clear full rows for points — combos score big and speed ramps up over one minute!&lt;/p&gt;
  &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;big&quot;&gt;🍓🎉🍊&lt;/div&gt;
        &lt;div class=&quot;msg&quot;&gt;Game Over!&lt;/div&gt;
        &lt;div class=&quot;fin&quot; id=&quot;finalScore&quot;&gt;Score: 0&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 16;
  var running = false, dropId = null;
  var grid = [], piece = null, score = 0, dropMs = 550, lastSpeedTier = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  // Tetromino definitions: rotation states as list of [x,y] cell offsets.
  var SHAPES = {
    I: { emoji:&#x27;🍌&#x27;, grad:&#x27;linear-gradient(135deg,#ffe259,#ffd93d)&#x27;, border:&#x27;#e0b800&#x27;,
      rot:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]] },
    O: { emoji:&#x27;🍊&#x27;, grad:&#x27;linear-gradient(135deg,#ffb347,#ff8c1a)&#x27;, border:&#x27;#e06b00&#x27;,
      rot:[[[1,0],[2,0],[1,1],[2,1]]] },
    T: { emoji:&#x27;🍇&#x27;, grad:&#x27;linear-gradient(135deg,#c77dff,#9d4edd)&#x27;, border:&#x27;#7b2cbf&#x27;,
      rot:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] },
    S: { emoji:&#x27;🍏&#x27;, grad:&#x27;linear-gradient(135deg,#8ce99a,#40c057)&#x27;, border:&#x27;#2b8a3e&#x27;,
      rot:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]] },
    Z: { emoji:&#x27;🍎&#x27;, grad:&#x27;linear-gradient(135deg,#ff8787,#f03e3e)&#x27;, border:&#x27;#c92a2a&#x27;,
      rot:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]] },
    J: { emoji:&#x27;🫐&#x27;, grad:&#x27;linear-gradient(135deg,#74c0fc,#1c7ed6)&#x27;, border:&#x27;#1864ab&#x27;,
      rot:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] },
    L: { emoji:&#x27;🍓&#x27;, grad:&#x27;linear-gradient(135deg,#ff85a2,#ff4d6d)&#x27;, border:&#x27;#c9184a&#x27;,
      rot:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }
  };
  var KEYS = Object.keys(SHAPES);

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for (var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function cellsOf(p) {
    var def = SHAPES[p.type];
    var states = def.rot;
    var offs = states[p.rot % states.length];
    var out = [];
    for (var i=0;i&lt;offs.length;i++) out.push({ x: p.x+offs[i][0], y: p.y+offs[i][1] });
    return out;
  }

  function collides(p) {
    var cells = cellsOf(p);
    for (var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var t = KEYS[Math.floor(Math.random()*KEYS.length)];
    piece = { type:t, rot:0, x:3, y:-1 };
    // nudge into view
    while (cellsOf(piece).some(function(c){return c.y&lt;0;}) &amp;&amp; !collides(piece)) piece.y++;
    piece.y = 0;
    piece.x = 3;
    piece.rot = 0;
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = cellsOf(piece);
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS &amp;&amp; c.x&gt;=0 &amp;&amp; c.x&lt;COLS) grid[c.y][c.x] = piece.type;
    }
    piece = null;
  }

  function clearFullRows() {
    var cleared = 0;
    for (var r=ROWS-1;r&gt;=0;r--){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if (!grid[r][c]){ full=false; break; }
      if (full){
        grid.splice(r,1);
        var empty=[]; for (var c2=0;c2&lt;COLS;c2++) empty.push(null);
        grid.unshift(empty);
        cleared++; r++;
      }
    }
    if (cleared&gt;0){
      var pts = [0,100,300,600,1000][cleared];
      score += pts;
      scoreEl.textContent = score;
      pulseScore();
      if (cleared&gt;=2) doCombo(cleared);
      if (cleared&gt;=1) doFlash();
      checkSpeed();
    }
  }

  function pulseScore(){ scoreEl.classList.add(&#x27;pulse&#x27;); setTimeout(function(){scoreEl.classList.remove(&#x27;pulse&#x27;);},130); }
  function doFlash(){ flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;); }
  function doCombo(n){
    var msgs = {2:&#x27;DOUBLE! 🍒&#x27;,3:&#x27;TRIPLE! 🍉&#x27;,4:&#x27;FRUIT FRENZY! 🌈&#x27;};
    comboEl.textContent = msgs[n] || &#x27;COMBO!&#x27;;
    comboEl.classList.remove(&#x27;go&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;go&#x27;);
  }

  function checkSpeed(){
    var tier = Math.floor(score/200);
    if (tier &gt; lastSpeedTier){
      lastSpeedTier = tier;
      dropMs = Math.max(120, 550 - tier*45);
      if (dropId){ clearInterval(dropId); dropId = setInterval(stepDown, dropMs); }
    }
  }

  function ghostPiece(){
    if (!piece) return null;
    var g = { type:piece.type, rot:piece.rot, x:piece.x, y:piece.y };
    while (!collides({type:g.type,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function paint(){
    // remove old blocks/ghosts but keep flash/combo/overlay
    var olds = field.querySelectorAll(&#x27;.block,.ghost&#x27;);
    for (var i=0;i&lt;olds.length;i++) olds[i].remove();
    for (var r=0;r&lt;ROWS;r++) for (var c=0;c&lt;COLS;c++) if (grid[r][c]) drawBlock(c,r,grid[r][c]);
    if (piece){
      var g = ghostPiece();
      if (g){ var gc=cellsOf(g); for (var i2=0;i2&lt;gc.length;i2++) if (gc[i2].y&gt;=0) drawGhost(gc[i2].x,gc[i2].y); }
      var cells = cellsOf(piece);
      for (var j=0;j&lt;cells.length;j++) if (cells[j].y&gt;=0) drawBlock(cells[j].x,cells[j].y,piece.type);
    }
  }

  function drawBlock(cx,cy,type){
    var def = SHAPES[type];
    var el = document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=def.grad; el.style.borderColor=def.border;
    el.style.boxShadow=&#x27;0 0 6px &#x27;+def.border;
    el.textContent=def.emoji;
    field.appendChild(el);
  }
  function drawGhost(cx,cy){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }

  function stepDown(){
    if (!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if (collides(next)){
      lockPiece(); clearFullRows();
      if (!spawnPiece()){ endGame(); paint(); return; }
    } else piece=next;
    paint();
  }

  function move(dx){
    if (!running||!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if (!collides(next)){ piece=next; paint(); }
  }

  function rotate(){
    if (!running||!piece) return;
    var nr=(piece.rot+1)%SHAPES[piece.type].rot.length;
    var kicks=[0,-1,1,-2,2];
    for (var k=0;k&lt;kicks.length;k++){
      var next={type:piece.type,rot:nr,x:piece.x+kicks[k],y:piece.y};
      if (!collides(next)){ piece=next; paint(); return; }
    }
  }

  function hardDrop(){
    if (!running||!piece) return;
    while (!collides({type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1})) piece.y++;
    stepDown();
  }

  function endGame(){
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
    finalScoreEl.textContent = &#x27;Score: &#x27;+score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    if (running) return;
    score=0; dropMs=550; lastSpeedTier=0;
    scoreEl.textContent=&#x27;0&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    newGrid();
    if (!spawnPiece()) return;
    paint();
    running=true;
    if (dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, dropMs);
  }
  function stopGame(){
    if (!running) return;
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ if (running) stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if (e.key===&#x27; &#x27;){ hardDrop(); e.preventDefault(); }
  });

  // Touch / swipe controls
  var touchStart=null;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){
    var t=e.changedTouches[0]; touchStart={x:t.clientX,y:t.clientY,time:Date.now()}; e.preventDefault();
  }, {passive:false});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    if (!touchStart) return;
    var t=e.changedTouches[0];
    var dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    var adx=Math.abs(dx), ady=Math.abs(dy);
    if (adx&lt;20 &amp;&amp; ady&lt;20){ rotate(); }
    else if (adx&gt;ady){ move(dx&gt;0?1:-1); }
    else { if (dy&gt;0) hardDrop(); }
    touchStart=null; e.preventDefault();
  }, {passive:false});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // Initial preview
  newGrid();
  piece={type:&#x27;T&#x27;,rot:0,x:3,y:0};
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
