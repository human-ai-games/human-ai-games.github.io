&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 18;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  var gridbg = document.getElementById(&#x27;gridbg&#x27;);
  var nextbox = document.getElementById(&#x27;nextbox&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var lvlEl = document.getElementById(&#x27;lvl&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  field.style.width = FIELD_W + &#x27;px&#x27;;
  field.style.height = FIELD_H + &#x27;px&#x27;;
  gridbg.style.backgroundSize = CELL + &#x27;px &#x27; + CELL + &#x27;px&#x27;;

  // Fruit definitions per piece type
  var FRUIT = { I:&#x27;🍉&#x27;, O:&#x27;🍋&#x27;, T:&#x27;🍇&#x27;, S:&#x27;🍎&#x27;, Z:&#x27;🍓&#x27;, J:&#x27;🍊&#x27;, L:&#x27;🍊&#x27; };
  var COLOR = { I:&#x27;#5bd9ff&#x27;, O:&#x27;#ffd23f&#x27;, T:&#x27;#c65bff&#x27;, S:&#x27;#ff5b5b&#x27;, Z:&#x27;#ff3f7a&#x27;, J:&#x27;#ff9b3f&#x27;, L:&#x27;#ffb84f&#x27; };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  var grid, piece, next, score, running, dropId, level, dropMs, streak, lastCleared;
  var ac = null;

  function initAudio(){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){} }
  function beep(freq, dur, type){
    if(!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = 0.08; o.connect(g); g.connect(ac.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
      o.stop(ac.currentTime+dur);
    } catch(_){}
  }

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function rand(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function makePiece(type){ return { type:type, cells:SHAPES[type].map(function(c){return [c[0],c[1]];}), x:Math.floor((COLS-4)/2)+ (type===&#x27;O&#x27;?0:0), y:-1 }; }

  function absCells(p){ return p.cells.map(function(c){ return { x:p.x+c[0], y:p.y+c[1] }; }); }

  function collides(p){
    var cs=absCells(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x, y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function rotate(){
    if(!running||!piece||piece.type===&#x27;O&#x27;) return;
    // rotate around approx center within 4x4
    var rotated = piece.cells.map(function(c){ return [3 - c[1], c[0]]; });
    // normalize to keep within reasonable bounds by trimming min
    var minx=99,miny=99;
    rotated.forEach(function(c){ if(c[0]&lt;minx)minx=c[0]; if(c[1]&lt;miny)miny=c[1]; });
    rotated = rotated.map(function(c){ return [c[0]-minx, c[1]-miny]; });
    var test={type:piece.type,cells:rotated,x:piece.x,y:piece.y};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.x=piece.x+kicks[k];
      if(!collides(test)){ piece.cells=rotated; piece.x=test.x; paint(); beep(440,0.05); return; }
    }
  }

  function spawn(){
    piece = makePiece(next);
    next = rand();
    paintNext();
    if(collides(piece)){ endGame(); return false; }
    return true;
  }

  function lock(){
    absCells(piece).forEach(function(c){ if(c.y&gt;=0) grid[c.y][c.x]={fruit:FRUIT[piece.type],color:COLOR[piece.type]}; });
    beep(180,0.08,&#x27;sine&#x27;);
    piece=null;
    clearRows();
    if(!spawn()) return;
    paint();
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    if(full.length===0){ streak=0; updateStreak(); return; }
    // flash animation
    full.forEach(function(r){
      var fl=document.createElement(&#x27;div&#x27;);
      fl.className=&#x27;flash&#x27;; fl.style.top=(r*CELL)+&#x27;px&#x27;; fl.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(fl);
      setTimeout(function(){ fl.remove(); }, 300);
      for(var c=0;c&lt;COLS;c++){
        var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;burst&#x27;; b.textContent=grid[r][c].fruit;
        b.style.left=(c*CELL)+&#x27;px&#x27;; b.style.top=(r*CELL)+&#x27;px&#x27;;
        field.appendChild(b); setTimeout((function(el){return function(){el.remove();};})(b),500);
      }
    });
    // remove rows
    full.sort(function(a,b){return a-b;});
    full.forEach(function(){ });
    for(var i=full.length-1;i&gt;=0;i--){ grid.splice(full[i],1); }
    for(var j=0;j&lt;full.length;j++){ var e=[];for(var c2=0;c2&lt;COLS;c2++)e.push(null); grid.unshift(e); }
    // scoring
    var base=[0,100,300,500,800][full.length];
    streak++;
    var mult = streak&gt;1 ? streak : 1;
    score += base*mult;
    scoreEl.textContent = score;
    updateStreak();
    beep(660+full.length*100,0.15,&#x27;triangle&#x27;);
    if(full.length&gt;=2) beep(880,0.2,&#x27;triangle&#x27;);
    // level up
    var nl = Math.floor(score/1000)+1;
    if(nl!==level){ level=nl; dropMs=Math.max(120, 550 - (level-1)*45); lvlEl.textContent=&#x27;Level &#x27;+level; restartTimer(); }
  }

  function updateStreak(){
    if(streak&gt;1){ streakEl.textContent=&#x27;🔥 x&#x27;+streak+&#x27; STREAK!&#x27;; streakEl.classList.add(&#x27;on&#x27;); }
    else { streakEl.classList.remove(&#x27;on&#x27;); }
  }

  function ghostPos(){
    if(!piece) return null;
    var g={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y};
    while(!collides({type:g.type,cells:g.cells,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function paint(){
    // remove non-persistent elements
    Array.prototype.slice.call(field.querySelectorAll(&#x27;.cell,.ghost&#x27;)).forEach(function(e){e.remove();});
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawCell(c,r,grid[r][c].fruit,grid[r][c].color,false);
    if(piece){
      var g=ghostPos();
      absCells(g).forEach(function(c){ if(c.y&gt;=0) drawGhost(c.x,c.y,COLOR[piece.type]); });
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) drawCell(c.x,c.y,FRUIT[piece.type],COLOR[piece.type],true); });
    }
  }

  function drawCell(cx,cy,fruit,color,live){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
    el.style.left=(cx*CELL+1)+&#x27;px&#x27;; el.style.top=(cy*CELL+1)+&#x27;px&#x27;;
    el.style.width=(CELL-2)+&#x27;px&#x27;; el.style.height=(CELL-2)+&#x27;px&#x27;;
    el.style.background=color;
    el.style.boxShadow=&#x27;0 0 8px &#x27;+color;
    el.style.fontSize=(CELL-8)+&#x27;px&#x27;;
    el.textContent=fruit;
    field.appendChild(el);
  }
  function drawGhost(cx,cy,color){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL+1)+&#x27;px&#x27;; el.style.top=(cy*CELL+1)+&#x27;px&#x27;;
    el.style.width=(CELL-2)+&#x27;px&#x27;; el.style.height=(CELL-2)+&#x27;px&#x27;;
    el.style.borderColor=color;
    field.appendChild(el);
  }

  function paintNext(){
    nextbox.innerHTML=&#x27;&#x27;;
    var cells=SHAPES[next];
    var minx=99,maxx=-9,miny=99,maxy=-9;
    cells.forEach(function(c){ if(c[0]&lt;minx)minx=c[0]; if(c[0]&gt;maxx)maxx=c[0]; if(c[1]&lt;miny)miny=c[1]; if(c[1]&gt;maxy)maxy=c[1]; });
    var w=(maxx-minx+1), h=(maxy-miny+1);
    var nc=22;
    var offx=(108-w*nc)/2, offy=(108-h*nc)/2;
    cells.forEach(function(c){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
      el.style.left=(offx+(c[0]-minx)*nc)+&#x27;px&#x27;; el.style.top=(offy+(c[1]-miny)*nc)+&#x27;px&#x27;;
      el.style.width=(nc-2)+&#x27;px&#x27;; el.style.height=(nc-2)+&#x27;px&#x27;;
      el.style.background=COLOR[next]; el.style.boxShadow=&#x27;0 0 6px &#x27;+COLOR[next];
      el.style.fontSize=(nc-8)+&#x27;px&#x27;; el.textContent=FRUIT[next];
      nextbox.appendChild(el);
    });
  }

  function step(){
    if(!piece) return;
    var t={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
    if(collides(t)) lock();
    else { piece.y++; paint(); }
  }

  function move(dx){
    if(!running||!piece) return;
    var t={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
    if(!collides(t)){ piece.x+=dx; paint(); }
  }

  function slam(){
    if(!running||!piece) return;
    var g=ghostPos(); piece.y=g.y; paint(); lock();
  }

  function restartTimer(){ if(dropId) clearInterval(dropId); dropId=setInterval(step, dropMs); }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} overEl.classList.add(&#x27;on&#x27;); beep(120,0.5,&#x27;sawtooth&#x27;); }

  function startGame(){
    overEl.classList.remove(&#x27;on&#x27;);
    score=0; level=1; dropMs=550; streak=0;
    scoreEl.textContent=&#x27;0&#x27;; lvlEl.textContent=&#x27;Level 1&#x27;; updateStreak();
    newGrid(); next=rand();
    if(!ac) initAudio();
    if(!spawn()) return;
    paint(); running=true; restartTimer();
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(!running) return;
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;a&#x27;||e.key===&#x27;A&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;||e.key===&#x27;d&#x27;||e.key===&#x27;D&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;||e.key===&#x27;s&#x27;||e.key===&#x27;S&#x27;){ step(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;w&#x27;||e.key===&#x27;W&#x27;){ rotate(); e.preventDefault(); }
    else if(e.key===&#x27; &#x27;){ slam(); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // Initial static preview
  newGrid(); next=rand();
  piece = makePiece(&#x27;T&#x27;); piece.y=1;
  paint(); paintNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
