&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys (or the corner buttons) to eat glowing pickups; you wrap around edges, so only your own tail can end you. Grab two items within four seconds for a combo that doubles the second one&#x27;s points.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;x2!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;⭐ Star +1&lt;/span&gt;&lt;span&gt;⚡ Bolt +3 (speed)&lt;/span&gt;&lt;span&gt;🍄 Mushroom +5 (shrink)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot; id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;pad&quot; id=&quot;up&quot;    style=&quot;left:8px;  top:8px;&quot;&gt;▲&lt;/div&gt;
    &lt;div class=&quot;pad&quot; id=&quot;left&quot;  style=&quot;left:8px;  bottom:8px;&quot;&gt;◀&lt;/div&gt;
    &lt;div class=&quot;pad&quot; id=&quot;down&quot;  style=&quot;right:8px; top:8px;&quot;&gt;▼&lt;/div&gt;
    &lt;div class=&quot;pad&quot; id=&quot;right&quot; style=&quot;right:8px; bottom:8px;&quot;&gt;▶&lt;/div&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;h2&gt;GAME OVER&lt;/h2&gt;&lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t, function(e){
    try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
  }, true);
});

var CELL = 20, COLS = 30, ROWS = 22;
var BASE_TICK = 130, FAST_TICK = 70;
var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);
var overEl = document.getElementById(&#x27;over&#x27;);
var finalEl = document.getElementById(&#x27;finalScore&#x27;);

var running = false, tickId = null, rafId = null;
var snake, dir, pendingDir, score, pickups, particles;
var speedUntil = 0, comboUntil = 0, flashUntil = 0, flashColor = &#x27;#5cff9d&#x27;;
var lastTickTime = 0, tickInterval = BASE_TICK;

var TYPES = {
  star:     { emoji:&#x27;⭐&#x27;, points:1, color:&#x27;#ffe86b&#x27;, life:9000 },
  bolt:     { emoji:&#x27;⚡&#x27;, points:3, color:&#x27;#5cf0ff&#x27;, life:6500 },
  mushroom: { emoji:&#x27;🍄&#x27;, points:5, color:&#x27;#ff5ceb&#x27;, life:5500 }
};

function rand(n){ return Math.floor(Math.random()*n); }
function now(){ return performance.now(); }

function occupied(x,y){
  for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x &amp;&amp; snake[i].y===y) return true;
  for (var j=0;j&lt;pickups.length;j++) if (pickups[j].x===x &amp;&amp; pickups[j].y===y) return true;
  return false;
}

function spawnPickup(){
  var r = Math.random(), type;
  if (r &lt; 0.62) type=&#x27;star&#x27;; else if (r &lt; 0.85) type=&#x27;bolt&#x27;; else type=&#x27;mushroom&#x27;;
  for (var t=0;t&lt;200;t++){
    var x=rand(COLS), y=rand(ROWS);
    if (!occupied(x,y)){ pickups.push({ x:x, y:y, type:type, born:now(), life:TYPES[type].life }); return; }
  }
}

function initState(){
  snake = [ {x:6,y:11},{x:5,y:11},{x:4,y:11},{x:3,y:11} ];
  dir = {x:1,y:0}; pendingDir = {x:1,y:0};
  score = 0; scoreEl.textContent = &#x27;0&#x27;;
  pickups = []; particles = [];
  speedUntil = 0; comboUntil = 0; flashUntil = 0;
  comboEl.classList.remove(&#x27;on&#x27;);
  spawnPickup(); spawnPickup();
}

function endGame(){
  running = false;
  if (tickId){ clearInterval(tickId); tickId=null; }
  finalEl.textContent = &#x27;Score: &#x27; + score;
  overEl.classList.add(&#x27;show&#x27;);
}

function addTrail(x,y,color){
  for (var i=0;i&lt;8;i++){
    particles.push({
      x: x*CELL+CELL/2, y: y*CELL+CELL/2,
      vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3,
      life:1, color:color
    });
  }
}

function tick(){
  if (!running) return;
  if (!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)){
    if (pendingDir.x!==dir.x || pendingDir.y!==dir.y){
      // sharp turn -&gt; comet trail
      addTrail(snake[0].x, snake[0].y, &#x27;#5cff9d&#x27;);
    }
    dir = pendingDir;
  }
  var head = snake[0];
  var nx = (head.x + dir.x + COLS) % COLS;
  var ny = (head.y + dir.y + ROWS) % ROWS;

  // find pickup
  var eatIdx = -1;
  for (var p=0;p&lt;pickups.length;p++){ if (pickups[p].x===nx &amp;&amp; pickups[p].y===ny){ eatIdx=p; break; } }
  var ate = eatIdx &gt;= 0;

  var body = ate ? snake : snake.slice(0, snake.length-1);
  for (var i=0;i&lt;body.length;i++){ if (body[i].x===nx &amp;&amp; body[i].y===ny){ endGame(); return; } }

  snake.unshift({x:nx,y:ny});

  if (ate){
    var pk = pickups[eatIdx];
    var def = TYPES[pk.type];
    var pts = def.points;
    var t = now();
    if (t &lt; comboUntil){
      pts *= 2;
      comboEl.textContent = &#x27;+&#x27; + pts + &#x27; x2!&#x27;;
      comboEl.classList.add(&#x27;on&#x27;);
    } else {
      comboEl.classList.remove(&#x27;on&#x27;);
    }
    comboUntil = t + 4000;
    score += pts; scoreEl.textContent = score;
    flashUntil = t + 300; flashColor = def.color;

    if (pk.type===&#x27;bolt&#x27;){ speedUntil = t + 4000; }
    if (pk.type===&#x27;mushroom&#x27;){
      // shrink by 3 (never below 3 segments)
      for (var s=0;s&lt;3 &amp;&amp; snake.length&gt;3;s++) snake.pop();
    }
    pickups.splice(eatIdx,1);
    spawnPickup();
    if (Math.random()&lt;0.25) spawnPickup();
  } else {
    snake.pop();
  }

  // expire pickups
  var tn = now();
  for (var q=pickups.length-1;q&gt;=0;q--){
    if (tn - pickups[q].born &gt; pickups[q].life) pickups.splice(q,1);
  }
  if (pickups.length===0) spawnPickup();

  // combo timeout hides label
  if (tn &gt; comboUntil) comboEl.classList.remove(&#x27;on&#x27;);

  // adjust speed
  tickInterval = (tn &lt; speedUntil) ? FAST_TICK : BASE_TICK;
  clearInterval(tickId);
  tickId = setInterval(tick, tickInterval);
}

function draw(){
  var t = now();
  ctx.clearRect(0,0,cv.width,cv.height);

  // background
  ctx.fillStyle = &#x27;#070912&#x27;; ctx.fillRect(0,0,cv.width,cv.height);

  // score flash overlay
  if (t &lt; flashUntil){
    var a = (flashUntil - t)/300 * 0.18;
    ctx.fillStyle = flashColor; ctx.globalAlpha = a;
    ctx.fillRect(0,0,cv.width,cv.height); ctx.globalAlpha = 1;
  }

  // grid
  ctx.strokeStyle = &#x27;rgba(60,120,110,0.12)&#x27;; ctx.lineWidth = 1;
  for (var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,cv.height); ctx.stroke(); }
  for (var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(cv.width,y*CELL); ctx.stroke(); }

  // speed lines
  if (t &lt; speedUntil){
    ctx.strokeStyle = &#x27;rgba(92,240,255,0.25)&#x27;; ctx.lineWidth = 2;
    for (var k=0;k&lt;14;k++){
      var yy = ((t*0.6 + k*45) % cv.height);
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(60,yy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cv.width-60,yy); ctx.lineTo(cv.width,yy); ctx.stroke();
    }
  }

  // pickups
  for (var p=0;p&lt;pickups.length;p++){
    var pk = pickups[p], def = TYPES[pk.type];
    var age = t - pk.born, remain = pk.life - age;
    var pulse = 0.7 + 0.3*Math.sin(t/150 + p);
    var alpha = remain &lt; 1500 ? (0.35 + 0.65*Math.abs(Math.sin(t/120))) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = def.color; ctx.shadowBlur = 14*pulse;
    ctx.font = (16 + 4*pulse) + &#x27;px serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillText(def.emoji, pk.x*CELL+CELL/2, pk.y*CELL+CELL/2);
    ctx.restore();
  }

  // particles
  for (var i=particles.length-1;i&gt;=0;i--){
    var pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.05;
    if (pt.life&lt;=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color; ctx.shadowColor = pt.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.5*pt.life, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // snake
  for (var s=snake.length-1;s&gt;=0;s--){
    var seg = snake[s];
    var frac = 1 - s/Math.max(1,snake.length);
    var g = Math.floor(120 + 135*frac);
    var color = &#x27;rgb(&#x27; + Math.floor(40*frac) + &#x27;,&#x27; + g + &#x27;,&#x27; + Math.floor(120+40*frac) + &#x27;)&#x27;;
    ctx.save();
    ctx.shadowColor = &#x27;#2bff88&#x27;; ctx.shadowBlur = s===0 ? 18 : 8;
    ctx.fillStyle = s===0 ? &#x27;#b6ffd0&#x27; : color;
    var pad = s===0 ? 1 : 2;
    roundRect(seg.x*CELL+pad, seg.y*CELL+pad, CELL-2*pad, CELL-2*pad, 4);
    ctx.fill();
    ctx.restore();
  }
  // head eyes
  var hd = snake[0];
  ctx.fillStyle = &#x27;#05060a&#x27;;
  ctx.beginPath();
  ctx.arc(hd.x*CELL+CELL/2 - 3 + dir.x*3, hd.y*CELL+CELL/2 - 3 + dir.y*3, 2, 0, Math.PI*2);
  ctx.arc(hd.x*CELL+CELL/2 + 3 + dir.x*3, hd.y*CELL+CELL/2 + 3 + dir.y*3, 2, 0, Math.PI*2);
  ctx.fill();

  rafId = requestAnimationFrame(draw);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function startGame(){
  overEl.classList.remove(&#x27;show&#x27;);
  initState();
  running = true;
  if (tickId) clearInterval(tickId);
  tickInterval = BASE_TICK;
  tickId = setInterval(tick, tickInterval);
  if (!rafId) rafId = requestAnimationFrame(draw);
}
function stopGame(){
  running = false;
  if (tickId){ clearInterval(tickId); tickId=null; }
}

function setDir(x,y){ pendingDir = {x:x,y:y}; }

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
  else if (e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
  else if (e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
  else if (e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
});
function bindPad(id,x,y){
  var el=document.getElementById(id);
  el.addEventListener(&#x27;mousedown&#x27;, function(e){ e.preventDefault(); setDir(x,y); });
  el.addEventListener(&#x27;touchstart&#x27;, function(e){ e.preventDefault(); setDir(x,y); }, {passive:false});
}
bindPad(&#x27;up&#x27;,0,-1); bindPad(&#x27;down&#x27;,0,1); bindPad(&#x27;left&#x27;,-1,0); bindPad(&#x27;right&#x27;,1,0);

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if (e.data.type===&#x27;wd_start&#x27;) startGame();
  else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
initState();
running = false;
rafId = requestAnimationFrame(draw);
setTimeout(function(){ if(!running &amp;&amp; rafId){ cancelAnimationFrame(rafId); rafId=null; draw(); } }, 60);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
