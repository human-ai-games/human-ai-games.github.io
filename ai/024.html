<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON BLITZ</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 8px 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#ff0); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(255,0,255,.4); }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
         background: linear-gradient(90deg,#0a0820,#120a2e); border: 1px solid #2a1a5a; border-radius: 8px;
         padding: 5px 12px; box-sizing: border-box; box-shadow: 0 0 12px rgba(80,0,180,.4); font-size: 15px; }
  .hud b { color: #0ff; text-shadow: 0 0 8px #0ff8; }
  .hud .combo { color: #ff0; text-shadow: 0 0 8px #ff08; }
  .hearts { letter-spacing: 2px; font-size: 17px; }
  .heart { color: #f36; text-shadow: 0 0 8px #f36; }
  .heart.dead { color: #333; text-shadow: none; }
  .timer { color: #f0f; text-shadow: 0 0 8px #f0f8; }
  .field { position: relative; width: 620px; height: 470px; flex-shrink: 0;
           background: radial-gradient(circle at 50% 30%, #0a0530, #05010f 80%);
           border: 1px solid #2a1a5a; border-radius: 8px; overflow: hidden;
           box-shadow: 0 0 22px rgba(120,0,220,.35) inset; }
  canvas { position: absolute; inset: 0; display: block; }
  .combofloat { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 900;
                color: #ff0; text-shadow: 0 0 16px #ff0, 0 0 4px #f80; pointer-events: none; opacity: 0; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(5,1,15,.82); text-align: center; }
  .overlay.show { display: flex; animation: flash .5s; }
  @keyframes flash { 0%{background:rgba(255,0,120,.6);} 100%{background:rgba(5,1,15,.82);} }
  .overlay h2 { font-size: 48px; margin: 0; letter-spacing: 3px; color: #f0f; text-shadow: 0 0 24px #f0f, 0 0 6px #fff; }
  .overlay .fs { font-size: 24px; margin: 10px 0 4px; color: #0ff; }
  .overlay .stars { font-size: 40px; letter-spacing: 6px; }
  .idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          font-size: 22px; color: #6af; text-shadow: 0 0 10px #06f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON BLITZ&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and fire plasma with &lt;strong&gt;Space&lt;/strong&gt; to blast drones, cruisers, and golden bosses. Chain quick hits for combo bonuses — press Start below and survive 60 seconds!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot; id=&quot;comboHud&quot;&gt;x1&lt;/span&gt;
    &lt;span class=&quot;hearts&quot; id=&quot;hearts&quot;&gt;&lt;/span&gt;
    &lt;span class=&quot;timer&quot;&gt;⏱ &lt;b class=&quot;timer&quot; id=&quot;timer&quot;&gt;60&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;combofloat&quot; id=&quot;combofloat&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;idle&quot; id=&quot;idle&quot;&gt;Press Start to blitz&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;div class=&quot;fs&quot;&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stars&quot; id=&quot;starRating&quot;&gt;☆☆☆&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
var W=620,H=470;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboHud=document.getElementById(&#x27;comboHud&#x27;);
var heartsEl=document.getElementById(&#x27;hearts&#x27;), timerEl=document.getElementById(&#x27;timer&#x27;);
var comboFloat=document.getElementById(&#x27;combofloat&#x27;), overlay=document.getElementById(&#x27;overlay&#x27;);
var finalScoreEl=document.getElementById(&#x27;finalScore&#x27;), starEl=document.getElementById(&#x27;starRating&#x27;);
var idleEl=document.getElementById(&#x27;idle&#x27;);

var running=false, animId=null;
var keys={}, shipX=W/2, SHIP_W=40, SHIP_H=28, SHIP_SPEED=6;
var bullets=[], enemies=[], particles=[], stars=[];
var score=0, shields=3, combo=1, comboTimer=0, lastCombo=1;
var timeLeft=60, tickAcc=0, spawnAcc=0, spawnInterval=1.1, diffAcc=0, speedMul=1;
var lastShot=0, lastTs=0;

// audio
var actx=null;
function beep(f,d,type,vol){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=f;
    g.gain.value=vol||0.05; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+(d||0.1));
    o.stop(actx.currentTime+(d||0.1));
  }catch(e){}
}

function initStars(){
  stars=[];
  for(var i=0;i&lt;70;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,layer:Math.floor(Math.random()*3)});
  }
}
function drawHearts(){
  var s=&#x27;&#x27;;
  for(var i=0;i&lt;3;i++) s+=&#x27;&lt;span class=&quot;heart&#x27;+(i&lt;shields?&#x27;&#x27;:&#x27; dead&#x27;)+&#x27;&quot;&gt;♥&lt;/span&gt;&#x27;;
  heartsEl.innerHTML=s;
}

function spawnEnemy(){
  var r=Math.random(), type;
  if(r&lt;0.12) type=&#x27;boss&#x27;; else if(r&lt;0.42) type=&#x27;cruiser&#x27;; else type=&#x27;drone&#x27;;
  var e={type:type,x:30+Math.random()*(W-60),y:-30,t:0,flash:0};
  if(type=&#x27;drone&#x27;&amp;&amp;type===&#x27;drone&#x27;){}
  if(type===&#x27;drone&#x27;){ e.hp=1; e.size=22; e.speed=(1.4+Math.random()*0.6)*speedMul; e.amp=40+Math.random()*30; e.base=e.x; e.color=&#x27;#0ff&#x27;; }
  else if(type===&#x27;cruiser&#x27;){ e.hp=2; e.size=32; e.speed=(1.0+Math.random()*0.4)*speedMul; e.color=&#x27;#f6a&#x27;; }
  else { e.hp=1; e.size=30; e.speed=(1.2+Math.random()*0.3)*speedMul; e.amp=90; e.base=e.x; e.color=&#x27;#fd0&#x27;; e.points=5; }
  enemies.push(e);
}

function shoot(){
  var now=performance.now();
  if(now-lastShot&lt;180) return;
  lastShot=now;
  bullets.push({x:shipX,y:H-40});
  beep(760,0.07,&#x27;square&#x27;,0.04);
}

function explode(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function addCombo(){
  combo=Math.min(3,combo+1&gt;=6?3:(comboTimer&gt;0?combo+ (combo&lt;3?1:0):1));
}

function registerHit(pts,x,y,color){
  // combo logic
  if(comboTimer&gt;0){ combo=Math.min(3,combo+1); } else { combo=1; }
  comboTimer=1.2;
  score+=pts*combo;
  scoreEl.textContent=score;
  comboHud.textContent=&#x27;x&#x27;+combo;
  if(combo&gt;1){
    comboFloat.textContent=combo+&#x27;× COMBO!&#x27;;
    comboFloat.style.animation=&#x27;none&#x27;;
    void comboFloat.offsetWidth;
    comboFloat.style.opacity=&#x27;1&#x27;;
    comboFloat.style.transform=&#x27;translateX(-50%) scale(1.3)&#x27;;
    setTimeout(function(){ comboFloat.style.transition=&#x27;all .6s&#x27;; comboFloat.style.opacity=&#x27;0&#x27;; comboFloat.style.transform=&#x27;translateX(-50%) scale(0.8)&#x27;; },50);
  }
  explode(x,y,color,pts&gt;=5?26:14);
}

function loseShield(){
  shields--;
  drawHearts();
  beep(120,0.25,&#x27;sawtooth&#x27;,0.08);
  combo=1; comboTimer=0; comboHud.textContent=&#x27;x1&#x27;;
  if(shields&lt;=0) endGame();
}

function update(dt){
  // difficulty ramp every 15s
  diffAcc+=dt;
  if(diffAcc&gt;=15){ diffAcc-=15; spawnInterval=Math.max(0.45,spawnInterval*0.82); speedMul+=0.25; }

  // timer
  tickAcc+=dt;
  if(tickAcc&gt;=1){ tickAcc-=1; timeLeft--; timerEl.textContent=timeLeft; if(timeLeft&lt;=0){ timeLeft=0; endGame(); return; } }

  // combo decay
  if(comboTimer&gt;0){ comboTimer-=dt; if(comboTimer&lt;=0){ combo=1; comboHud.textContent=&#x27;x1&#x27;; } }

  // ship
  if(keys[&#x27;ArrowLeft&#x27;]) shipX-=SHIP_SPEED;
  if(keys[&#x27;ArrowRight&#x27;]) shipX+=SHIP_SPEED;
  shipX=Math.max(SHIP_W/2,Math.min(W-SHIP_W/2,shipX));

  // stars parallax
  var spd=[0.6,1.4,2.6];
  for(var i=0;i&lt;stars.length;i++){ var s=stars[i]; s.y+=spd[s.layer]; if(s.y&gt;H){ s.y=0; s.x=Math.random()*W; } }

  // spawn
  spawnAcc+=dt;
  if(spawnAcc&gt;=spawnInterval){ spawnAcc-=spawnInterval; spawnEnemy(); }

  // bullets
  for(var b=bullets.length-1;b&gt;=0;b--){ bullets[b].y-=9; if(bullets[b].y&lt;-10) bullets.splice(b,1); }

  // enemies
  for(var e=enemies.length-1;e&gt;=0;e--){
    var en=enemies[e]; en.t+=dt; en.y+=en.speed;
    if(en.type===&#x27;drone&#x27;) en.x=en.base+Math.sin(en.t*6)*en.amp;
    else if(en.type===&#x27;boss&#x27;) en.x=en.base+Math.sin(en.t*2)*en.amp;
    if(en.flash&gt;0) en.flash-=dt;
    // reached bottom
    if(en.y&gt;H-20){ enemies.splice(e,1); loseShield(); continue; }
    // collide with ship
    if(en.y&gt;H-52 &amp;&amp; Math.abs(en.x-shipX)&lt;(en.size/2+SHIP_W/2-6)){
      explode(en.x,en.y,en.color,16); enemies.splice(e,1); loseShield(); continue;
    }
  }

  // bullet-enemy collision
  for(var bi=bullets.length-1;bi&gt;=0;bi--){
    var bl=bullets[bi];
    for(var ei=enemies.length-1;ei&gt;=0;ei--){
      var en2=enemies[ei];
      if(Math.abs(bl.x-en2.x)&lt;en2.size/2+4 &amp;&amp; Math.abs(bl.y-en2.y)&lt;en2.size/2+6){
        bullets.splice(bi,1);
        en2.hp--;
        if(en2.hp&gt;0){ en2.flash=0.2; beep(300,0.06,&#x27;square&#x27;,0.04); }
        else {
          var pts=en2.type===&#x27;drone&#x27;?1:en2.type===&#x27;cruiser&#x27;?2:5;
          registerHit(pts,en2.x,en2.y,en2.color);
          enemies.splice(ei,1);
          beep(en2.type===&#x27;boss&#x27;?900:520,0.12,&#x27;triangle&#x27;,0.06);
        }
        break;
      }
    }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=dt*1.6;
    if(pt.life&lt;=0) particles.splice(p,1);
  }
}

function drawShip(){
  ctx.save(); ctx.translate(shipX,H-30);
  ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=14;
  ctx.fillStyle=&#x27;#0ff&#x27;;
  ctx.beginPath();
  ctx.moveTo(0,-16); ctx.lineTo(16,12); ctx.lineTo(4,6); ctx.lineTo(0,10); ctx.lineTo(-4,6); ctx.lineTo(-16,12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle=&#x27;#f0f&#x27;; ctx.shadowColor=&#x27;#f0f&#x27;;
  ctx.beginPath(); ctx.arc(0,-2,4,0,7); ctx.fill();
  // engine flame
  ctx.shadowColor=&#x27;#ff0&#x27;; ctx.fillStyle=&#x27;rgba(255,180,0,&#x27;+(0.5+Math.random()*0.5)+&#x27;)&#x27;;
  ctx.beginPath(); ctx.moveTo(-5,12); ctx.lineTo(5,12); ctx.lineTo(0,20+Math.random()*6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemy(en){
  ctx.save(); ctx.translate(en.x,en.y);
  var c=en.flash&gt;0?&#x27;#fff&#x27;:en.color;
  ctx.shadowColor=c; ctx.shadowBlur=12; ctx.fillStyle=c;
  var s=en.size/2;
  if(en.type===&#x27;drone&#x27;){
    ctx.fillRect(-s,-4,s*2,8);
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.6,4); ctx.lineTo(-s*0.6,4); ctx.closePath(); ctx.fill();
  } else if(en.type===&#x27;cruiser&#x27;){
    ctx.fillRect(-s,-s*0.6,s*2,s*1.2);
    ctx.fillStyle=&#x27;#600&#x27;; ctx.fillRect(-s*0.5,-s*0.3,s,s*0.6);
    ctx.fillStyle=c; ctx.fillRect(-s-4,-3,4,6); ctx.fillRect(s,-3,4,6);
  } else {
    // boss - diamond
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle=&#x27;#a60&#x27;; ctx.beginPath(); ctx.arc(0,0,s*0.4,0,7); ctx.fill();
  }
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // stars
  var sizes=[1,1.6,2.4], cols=[&#x27;#446&#x27;,&#x27;#88b&#x27;,&#x27;#cff&#x27;];
  for(var i=0;i&lt;stars.length;i++){ var s=stars[i]; ctx.fillStyle=cols[s.layer]; ctx.fillRect(s.x,s.y,sizes[s.layer],sizes[s.layer]); }
  // bullets
  ctx.shadowBlur=8; ctx.shadowColor=&#x27;#0f0&#x27;; ctx.fillStyle=&#x27;#af6&#x27;;
  for(var b=0;b&lt;bullets.length;b++){ ctx.fillRect(bullets[b].x-2,bullets[b].y-8,4,12); }
  ctx.shadowBlur=0;
  for(var e=0;e&lt;enemies.length;e++) drawEnemy(enemies[e]);
  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p]; ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-1.5,pt.y-1.5,3,3);
  }
  ctx.globalAlpha=1;
  drawShip();
}

function loop(ts){
  if(!running) return;
  var dt=(ts-lastTs)/1000; lastTs=ts;
  if(dt&gt;0.1) dt=0.1;
  update(dt);
  render();
  animId=requestAnimationFrame(loop);
}

function startGame(){
  if(running) return;
  bullets=[]; enemies=[]; particles=[];
  score=0; shields=3; combo=1; comboTimer=0; timeLeft=60;
  spawnInterval=1.1; speedMul=1; spawnAcc=0; diffAcc=0; tickAcc=0;
  shipX=W/2; lastShot=0;
  for(var k in keys) keys[k]=false;
  scoreEl.textContent=&#x27;0&#x27;; comboHud.textContent=&#x27;x1&#x27;; timerEl.textContent=&#x27;60&#x27;;
  drawHearts(); initStars();
  overlay.classList.remove(&#x27;show&#x27;); idleEl.style.display=&#x27;none&#x27;;
  running=true; lastTs=performance.now();
  spawnEnemy();
  animId=requestAnimationFrame(loop);
}

function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

function endGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  finalScoreEl.textContent=score;
  var stars3=score&gt;=120?3:score&gt;=60?2:score&gt;=20?1:0;
  var s=&#x27;&#x27;; for(var i=0;i&lt;3;i++) s+=(i&lt;stars3?&#x27;★&#x27;:&#x27;☆&#x27;);
  starEl.textContent=s;
  overlay.classList.add(&#x27;show&#x27;);
  beep(200,0.5,&#x27;sawtooth&#x27;,0.08);
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) shoot(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){ if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false; });
cv.addEventListener(&#x27;mousedown&#x27;,function(){ if(running) shoot(); });

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

// initial static render
drawHearts(); initStars(); render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
