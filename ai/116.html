&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: &#x27;Courier New&#x27;, monospace; background: #05010f; color: #6ff; overflow: hidden; }

  h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: 4px; color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f, 0 0 30px #05f; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NOVA BURST&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the mouse or &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; keys and fire plasma by clicking or pressing &lt;strong&gt;Space&lt;/strong&gt;. Chain hits without missing to grow your multiplier before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;mult&quot;&gt;x&lt;span id=&quot;mult&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;time&quot;&gt;TIME &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), multEl = document.getElementById(&#x27;mult&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);

var running = false, animId = null, spawnId = null, timerId = null;
var keysDown = {};
var shipX, shipY;
var mouseControl = false, mouseX = W/2;
var bullets, enemies, particles, stars1, stars2;
var score, combo, mult, timeLeft, lastShot, elapsed;

var SHIP_W = 34, SHIP_H = 26, SHIP_SPEED = 7;

// Audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    o.connect(g); g.connect(actx.destination);
    var t = actx.currentTime;
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (_) {}
}

function initStars() {
  stars1 = []; stars2 = [];
  for (var i = 0; i &lt; 40; i++) stars1.push({ x: Math.random()*W, y: Math.random()*H, s: 1 });
  for (var j = 0; j &lt; 25; j++) stars2.push({ x: Math.random()*W, y: Math.random()*H, s: 2 });
}

// Enemy types
var TYPES = {
  dart:     { size: 18, color: &#x27;#c0f&#x27;, pts: 1, hp: 1, move: &#x27;zigzag&#x27; },
  orb:      { size: 28, color: &#x27;#f92&#x27;, pts: 2, hp: 1, move: &#x27;spiral&#x27; },
  behemoth: { size: 44, color: &#x27;#f33&#x27;, pts: 5, hp: 2, move: &#x27;straight&#x27; }
};

function spawnEnemy() {
  var r = Math.random();
  var type = r &lt; 0.6 ? &#x27;dart&#x27; : (r &lt; 0.9 ? &#x27;orb&#x27; : &#x27;behemoth&#x27;);
  var t = TYPES[type];
  var speed = (type === &#x27;dart&#x27; ? 2.6 : type === &#x27;orb&#x27; ? 1.9 : 1.3) + elapsed * 0.03;
  enemies.push({
    type: type, size: t.size, color: t.color, pts: t.pts, hp: t.hp,
    x: Math.random() * (W - t.size*2) + t.size,
    y: -t.size, vy: speed, phase: Math.random()*Math.PI*2, flash: 0,
    baseX: 0
  });
  enemies[enemies.length-1].baseX = enemies[enemies.length-1].x;
}

function spawnBullet() {
  var now = Date.now();
  if (now - lastShot &lt; 180) return;
  lastShot = now;
  bullets.push({ x: shipX, y: shipY - SHIP_H/2, vy: -9, trail: [] });
  beep(880, 0.08, &#x27;square&#x27;, 0.05);
}

function explode(x, y, color, n) {
  for (var i = 0; i &lt; n; i++) {
    var a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color: color });
  }
}

function tick() {
  if (!running) return;
  // background
  ctx.fillStyle = &#x27;#05010f&#x27;;
  ctx.fillRect(0, 0, W, H);

  // stars parallax
  ctx.fillStyle = &#x27;#345&#x27;;
  for (var i = 0; i &lt; stars1.length; i++) {
    var s = stars1[i]; s.y += 0.7; if (s.y &gt; H) { s.y = 0; s.x = Math.random()*W; }
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.fillStyle = &#x27;#89b&#x27;;
  for (var j = 0; j &lt; stars2.length; j++) {
    var s2 = stars2[j]; s2.y += 1.8; if (s2.y &gt; H) { s2.y = 0; s2.x = Math.random()*W; }
    ctx.fillRect(s2.x, s2.y, s2.s, s2.s);
  }

  // ship movement
  if (mouseControl) {
    shipX += (mouseX - shipX) * 0.3;
  } else {
    if (keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
  }
  shipX = Math.max(SHIP_W/2, Math.min(W - SHIP_W/2, shipX));

  // bullets
  for (var b = bullets.length - 1; b &gt;= 0; b--) {
    var bu = bullets[b];
    bu.trail.unshift({ x: bu.x, y: bu.y });
    if (bu.trail.length &gt; 6) bu.trail.pop();
    bu.y += bu.vy;
    if (bu.y &lt; -14) {
      // missed - reset combo
      bullets.splice(b, 1);
      combo = 0; mult = 1; updateMult();
      continue;
    }
    // draw trail
    for (var tr = bu.trail.length - 1; tr &gt;= 0; tr--) {
      var p = bu.trail[tr], al = (tr+1)/bu.trail.length;
      ctx.fillStyle = &#x27;rgba(120,255,255,&#x27; + (0.35*al) + &#x27;)&#x27;;
      ctx.fillRect(p.x-2, p.y, 4, 8);
    }
    ctx.fillStyle = &#x27;#0ff&#x27;;
    ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 10;
    ctx.fillRect(bu.x-3, bu.y, 6, 14);
    ctx.shadowBlur = 0;
  }

  // enemies
  for (var e = enemies.length - 1; e &gt;= 0; e--) {
    var en = enemies[e];
    en.y += en.vy;
    en.phase += 0.08;
    if (en.type === &#x27;dart&#x27;) en.x = en.baseX + Math.sin(en.phase)*40;
    else if (en.type === &#x27;orb&#x27;) { en.x = en.baseX + Math.cos(en.phase)*35; }
    if (en.flash &gt; 0) en.flash--;
    if (en.y &gt; H + en.size) { enemies.splice(e, 1); continue; }
    drawEnemy(en);
  }

  // collisions
  for (var bi = bullets.length - 1; bi &gt;= 0; bi--) {
    var bl = bullets[bi]; var hit = false;
    for (var ei = enemies.length - 1; ei &gt;= 0; ei--) {
      var em = enemies[ei];
      var dx = bl.x - em.x, dy = bl.y - em.y;
      if (dx*dx + dy*dy &lt; (em.size)*(em.size)) {
        em.hp--; hit = true;
        if (em.hp &lt;= 0) {
          explode(em.x, em.y, em.color, em.type === &#x27;behemoth&#x27; ? 30 : 16);
          combo++; if (combo % 3 === 0 &amp;&amp; mult &lt; 8) mult++;
          score += em.pts * mult;
          updateScore(); updateMult();
          beep(em.type===&#x27;behemoth&#x27;?220:440, 0.12, &#x27;sawtooth&#x27;, 0.07);
          enemies.splice(ei, 1);
        } else {
          em.flash = 6;
          beep(660, 0.06, &#x27;square&#x27;, 0.05);
        }
        break;
      }
    }
    if (hit) bullets.splice(bi, 1);
  }

  // particles
  for (var pi = particles.length - 1; pi &gt;= 0; pi--) {
    var pt = particles[pi];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life -= 0.03;
    if (pt.life &lt;= 0) { particles.splice(pi, 1); continue; }
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
    ctx.globalAlpha = 1;
  }

  drawShip();
  animId = requestAnimationFrame(tick);
}

function drawShip() {
  ctx.save();
  ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 14;
  ctx.fillStyle = &#x27;#3ff&#x27;;
  ctx.beginPath();
  ctx.moveTo(shipX, shipY - SHIP_H/2);
  ctx.lineTo(shipX - SHIP_W/2, shipY + SHIP_H/2);
  ctx.lineTo(shipX, shipY + SHIP_H/4);
  ctx.lineTo(shipX + SHIP_W/2, shipY + SHIP_H/2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  // engine glow
  ctx.fillStyle = &#x27;rgba(255,140,0,0.8)&#x27;;
  ctx.fillRect(shipX-3, shipY + SHIP_H/4, 6, 6 + Math.random()*4);
  ctx.restore();
}

function drawEnemy(en) {
  ctx.save();
  var col = en.flash &gt; 0 ? &#x27;#fff&#x27; : en.color;
  ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  if (en.type === &#x27;dart&#x27;) {
    // diamond
    ctx.beginPath();
    ctx.moveTo(en.x, en.y - en.size);
    ctx.lineTo(en.x + en.size*0.6, en.y);
    ctx.lineTo(en.x, en.y + en.size);
    ctx.lineTo(en.x - en.size*0.6, en.y);
    ctx.closePath(); ctx.fill();
  } else if (en.type === &#x27;orb&#x27;) {
    ctx.beginPath(); ctx.arc(en.x, en.y, en.size, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = &#x27;rgba(255,255,255,0.4)&#x27;;
    ctx.beginPath(); ctx.arc(en.x - en.size*0.3, en.y - en.size*0.3, en.size*0.3, 0, Math.PI*2); ctx.fill();
  } else {
    // behemoth hexagon
    ctx.beginPath();
    for (var k = 0; k &lt; 6; k++) {
      var ang = Math.PI/3*k - Math.PI/2;
      var px = en.x + Math.cos(ang)*en.size, py = en.y + Math.sin(ang)*en.size;
      if (k===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = &#x27;rgba(0,0,0,0.5)&#x27;;
    ctx.beginPath(); ctx.arc(en.x, en.y, en.size*0.4, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function updateScore() { scoreEl.textContent = score; }
function updateMult() { multEl.textContent = mult; }

function resetState() {
  shipX = W/2; shipY = H - 30; mouseX = W/2; mouseControl = false;
  bullets = []; enemies = []; particles = [];
  score = 0; combo = 0; mult = 1; timeLeft = 60; lastShot = 0; elapsed = 0;
  for (var k in keysDown) keysDown[k] = false;
  initStars();
  updateScore(); updateMult(); timeEl.textContent = timeLeft;
}

function startGame() {
  if (running) return;
  resetState();
  running = true;
  spawnEnemy();
  animId = requestAnimationFrame(tick);
  spawnId = setInterval(function() {
    if (running) spawnEnemy();
  }, 900);
  timerId = setInterval(function() {
    if (!running) return;
    timeLeft--; elapsed++;
    timeEl.textContent = timeLeft;
    if (timeLeft &lt;= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (spawnId) { clearInterval(spawnId); spawnId = null; }
  if (timerId) { clearInterval(timerId); timerId = null; }
  ctx.fillStyle = &#x27;rgba(5,1,15,0.8)&#x27;;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = &#x27;center&#x27;;
  ctx.fillStyle = &#x27;#0ff&#x27;; ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 16;
  ctx.font = &#x27;bold 42px Courier New&#x27;;
  ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
  ctx.font = &#x27;bold 26px Courier New&#x27;;
  ctx.fillStyle = &#x27;#ff5&#x27;;
  ctx.fillText(&#x27;SCORE &#x27; + score, W/2, H/2 + 30);
  ctx.shadowBlur = 0;
}

function stopGame() {
  if (!running) return;
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (spawnId) { clearInterval(spawnId); spawnId = null; }
  if (timerId) { clearInterval(timerId); timerId = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function (e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
    keysDown[e.key] = true; mouseControl = false; e.preventDefault();
  } else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) {
    if (running) spawnBullet(); e.preventDefault();
  }
});
window.addEventListener(&#x27;keyup&#x27;, function (e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseControl = true;
});
cv.addEventListener(&#x27;mousedown&#x27;, function (e) {
  if (running) spawnBullet();
  e.preventDefault();
});
window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static render
resetState();
ctx.fillStyle = &#x27;#05010f&#x27;; ctx.fillRect(0, 0, W, H);
ctx.fillStyle = &#x27;#89b&#x27;;
for (var q = 0; q &lt; stars2.length; q++) ctx.fillRect(stars2[q].x, stars2[q].y, 2, 2);
drawShip();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
