    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05050f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; color: #6ff; text-shadow: 0 0 10px #0ff, 0 0 20px #06c; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #aac; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; width: 620px; font-size: 18px; align-items: center; }
  .hud .lives { display: flex; gap: 4px; }
  .life { color: #6ff; text-shadow: 0 0 6px #0ff; font-size: 20px; }
  #timer { color: #ff6; text-shadow: 0 0 6px #cc0; font-weight: 700; }
  #score { color: #6f6; text-shadow: 0 0 6px #0c0; font-weight: 700; }
  .wrap { position: relative; width: 620px; }
  canvas { display: block; background: #000; border-radius: 8px; box-shadow: 0 0 18px #039; }
  .fire { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 76px; height: 40px; background: rgba(255,60,120,.25); border: 2px solid #f39; border-radius: 20px; color: #f9c; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the &amp;larr; &amp;rarr; keys and hold Space to fire neon lasers at the aliens — on touch, tap the screen sides to move and the FIRE button to shoot. Destroy enemies for points and chain kills for combo multipliers before they reach the bottom!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/div&gt;
    &lt;div&gt;Time: &lt;span id=&quot;timer&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;fire&quot; id=&quot;fire&quot;&gt;FIRE&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 460;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), timerEl = document.getElementById(&#x27;timer&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);
  var fireBtn = document.getElementById(&#x27;fire&#x27;);

  var running = false, animId = null;
  var keys = {}, touchDir = 0, touchFire = false;
  var ship, bullets, enemies, particles, stars;
  var score, lives, combo, comboTimer, multiplier, timeLeft, lastTime, spawnTimer, lastShot;
  var redFlash = 0, comboBanner = 0, gameOver = false;

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 90; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, v: Math.random() * 1.5 + 0.3 });
    }
  }

  function reset() {
    ship = { x: W / 2, y: H - 34, w: 30, h: 26 };
    bullets = []; enemies = []; particles = [];
    score = 0; lives = 3; combo = 0; comboTimer = 0; multiplier = 1;
    timeLeft = 60; spawnTimer = 0; lastShot = 0; redFlash = 0; comboBanner = 0;
    gameOver = false;
    initStars();
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    timerEl.textContent = Math.ceil(timeLeft);
    var s = &#x27;&#x27;;
    for (var i = 0; i &lt; lives; i++) s += &#x27;\u25B2&#x27;;
    livesEl.innerHTML = &#x27;&#x27;;
    for (var j = 0; j &lt; 3; j++) {
      var sp = document.createElement(&#x27;span&#x27;);
      sp.className = &#x27;life&#x27;;
      sp.textContent = &#x27;\u25B2&#x27;;
      sp.style.opacity = j &lt; lives ? 1 : 0.15;
      livesEl.appendChild(sp);
    }
  }

  var TYPES = {
    purple: { color: &#x27;#c4f&#x27;, r: 12, speed: 1.9, points: 3, hp: 1, zig: true },
    orange: { color: &#x27;#f92&#x27;, r: 17, speed: 1.2, points: 2, hp: 1, spin: true },
    red:    { color: &#x27;#f33&#x27;, r: 24, speed: 0.7, points: 1, hp: 2, tank: true }
  };

  function spawnEnemy() {
    var r = Math.random();
    var typeName = r &lt; 0.4 ? &#x27;purple&#x27; : (r &lt; 0.75 ? &#x27;orange&#x27; : &#x27;red&#x27;);
    var t = TYPES[typeName];
    enemies.push({
      type: typeName, x: t.r + Math.random() * (W - 2 * t.r), y: -t.r,
      r: t.r, hp: t.hp, phase: Math.random() * 6.28, ang: 0
    });
  }

  function shoot() {
    var now = Date.now();
    if (now - lastShot &lt; 160) return;
    lastShot = now;
    bullets.push({ x: ship.x, y: ship.y - ship.h / 2, trail: [] });
    beep(880, 0.08, &#x27;square&#x27;, 0.04);
  }

  function explode(x, y, color, n) {
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random() * 6.28, sp = Math.random() * 3 + 1;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color: color });
    }
  }

  function loseLife() {
    lives--;
    redFlash = 1;
    combo = 0; multiplier = 1;
    beep(120, 0.3, &#x27;sawtooth&#x27;, 0.09);
    updateHUD();
    if (lives &lt;= 0) endGame();
  }

  function endGame() {
    gameOver = true;
    beep(80, 0.6, &#x27;sawtooth&#x27;, 0.1);
  }

  function addScore(pts) {
    combo++;
    comboTimer = 2;
    if (combo &gt;= 5) multiplier = 3;
    else if (combo &gt;= 3) multiplier = 2;
    else multiplier = 1;
    if (combo === 3 || combo === 5) comboBanner = 1.2;
    score += pts * multiplier;
    updateHUD();
  }

  function update(dt) {
    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var st = stars[i];
      st.y += st.v * st.s;
      if (st.y &gt; H) { st.y = 0; st.x = Math.random() * W; }
    }
    // move ship
    var dir = 0;
    if (keys[&#x27;ArrowLeft&#x27;]) dir -= 1;
    if (keys[&#x27;ArrowRight&#x27;]) dir += 1;
    dir += touchDir;
    ship.x += dir * 5;
    ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
    // shoot
    if (keys[&#x27; &#x27;] || touchFire) shoot();
    // bullets
    for (var b = bullets.length - 1; b &gt;= 0; b--) {
      var bl = bullets[b];
      bl.trail.unshift({ x: bl.x, y: bl.y });
      if (bl.trail.length &gt; 6) bl.trail.pop();
      bl.y -= 9;
      if (bl.y &lt; -10) bullets.splice(b, 1);
    }
    // enemies
    for (var e = enemies.length - 1; e &gt;= 0; e--) {
      var en = enemies[e], t = TYPES[en.type];
      en.y += t.speed * 1.4;
      en.ang += 0.15;
      if (t.zig) { en.phase += 0.08; en.x += Math.sin(en.phase) * 2.4; }
      if (en.x &lt; en.r) en.x = en.r;
      if (en.x &gt; W - en.r) en.x = W - en.r;
      if (en.y - en.r &gt; H) { enemies.splice(e, 1); loseLife(); continue; }
      // collision with bullets
      for (var b2 = bullets.length - 1; b2 &gt;= 0; b2--) {
        var bl2 = bullets[b2];
        var dx = bl2.x - en.x, dy = bl2.y - en.y;
        if (dx * dx + dy * dy &lt; en.r * en.r) {
          bullets.splice(b2, 1);
          en.hp--;
          if (en.hp &lt;= 0) {
            explode(en.x, en.y, t.color, en.type === &#x27;red&#x27; ? 22 : 14);
            enemies.splice(e, 1);
            addScore(t.points);
            beep(t.zig ? 660 : (t.tank ? 260 : 440), 0.12, &#x27;triangle&#x27;, 0.06);
          } else {
            beep(300, 0.06, &#x27;square&#x27;, 0.05);
          }
          break;
        }
      }
    }
    // particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt * 1.6;
      if (pt.life &lt;= 0) particles.splice(p, 1);
    }
    // combo timer
    if (comboTimer &gt; 0) { comboTimer -= dt; if (comboTimer &lt;= 0) { combo = 0; multiplier = 1; } }
    if (comboBanner &gt; 0) comboBanner -= dt;
    if (redFlash &gt; 0) redFlash -= dt * 2.2;
    // spawn
    spawnTimer -= dt;
    if (spawnTimer &lt;= 0) {
      spawnEnemy();
      spawnTimer = Math.max(0.5, 1.1 - (60 - timeLeft) * 0.008);
    }
    // timer
    timeLeft -= dt;
    if (timeLeft &lt;= 0) { timeLeft = 0; endGame(); }
    timerEl.textContent = Math.ceil(timeLeft);
  }

  function draw() {
    ctx.fillStyle = &#x27;#000&#x27;; ctx.fillRect(0, 0, W, H);
    // stars
    for (var i = 0; i &lt; stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.4 + st.s / 4;
      ctx.fillStyle = &#x27;#9cf&#x27;;
      ctx.fillRect(st.x, st.y, st.s, st.s * 1.5);
    }
    ctx.globalAlpha = 1;
    // bullets
    for (var b = 0; b &lt; bullets.length; b++) {
      var bl = bullets[b];
      for (var tr = 0; tr &lt; bl.trail.length; tr++) {
        ctx.globalAlpha = (1 - tr / bl.trail.length) * 0.5;
        ctx.fillStyle = &#x27;#0ff&#x27;;
        ctx.fillRect(bl.trail[tr].x - 1.5, bl.trail[tr].y, 3, 8);
      }
      ctx.globalAlpha = 1;
      ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 8;
      ctx.fillStyle = &#x27;#cff&#x27;;
      ctx.fillRect(bl.x - 2, bl.y - 6, 4, 12);
      ctx.shadowBlur = 0;
    }
    // enemies
    for (var e = 0; e &lt; enemies.length; e++) drawEnemy(enemies[e]);
    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    // ship
    drawShip();
    // combo banner
    if (comboBanner &gt; 0) {
      ctx.globalAlpha = Math.min(1, comboBanner);
      ctx.fillStyle = &#x27;#ff0&#x27;;
      ctx.shadowColor = &#x27;#f80&#x27;; ctx.shadowBlur = 20;
      ctx.font = &#x27;bold 40px system-ui&#x27;;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(&#x27;COMBO x&#x27; + multiplier, W / 2, H / 2 - 40);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    // multiplier indicator
    if (multiplier &gt; 1) {
      ctx.fillStyle = &#x27;#ff6&#x27;; ctx.font = &#x27;bold 18px system-ui&#x27;; ctx.textAlign = &#x27;left&#x27;;
      ctx.fillText(&#x27;x&#x27; + multiplier + &#x27; combo!&#x27;, 8, 24);
    }
    // red flash
    if (redFlash &gt; 0) {
      ctx.fillStyle = &#x27;rgba(255,0,0,&#x27; + (redFlash * 0.4) + &#x27;)&#x27;;
      ctx.fillRect(0, 0, W, H);
    }
    // game over
    if (gameOver) {
      ctx.fillStyle = &#x27;rgba(0,0,0,0.7)&#x27;; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = &#x27;#f44&#x27;; ctx.shadowColor = &#x27;#f00&#x27;; ctx.shadowBlur = 24;
      ctx.font = &#x27;bold 56px system-ui&#x27;; ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, W / 2, H / 2 - 10);
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;#fff&#x27;; ctx.font = &#x27;bold 26px system-ui&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27; + score, W / 2, H / 2 + 36);
      ctx.fillStyle = &#x27;#9cf&#x27;; ctx.font = &#x27;16px system-ui&#x27;;
      ctx.fillText(&#x27;Press Start below to play again&#x27;, W / 2, H / 2 + 70);
    }
  }

  function drawShip() {
    var s = ship;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 14;
    ctx.fillStyle = &#x27;#0cf&#x27;;
    ctx.beginPath();
    ctx.moveTo(0, -s.h / 2);
    ctx.lineTo(s.w / 2, s.h / 2);
    ctx.lineTo(0, s.h / 4);
    ctx.lineTo(-s.w / 2, s.h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = &#x27;#eff&#x27;;
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.28); ctx.fill();
    // thruster
    ctx.shadowColor = &#x27;#f80&#x27;; ctx.shadowBlur = 10;
    ctx.fillStyle = &#x27;rgba(255,180,60,&#x27; + (0.5 + Math.random() * 0.5) + &#x27;)&#x27;;
    ctx.beginPath();
    ctx.moveTo(-5, s.h / 2); ctx.lineTo(0, s.h / 2 + 8 + Math.random() * 5); ctx.lineTo(5, s.h / 2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawEnemy(en) {
    var t = TYPES[en.type];
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.shadowColor = t.color; ctx.shadowBlur = 14;
    if (en.type === &#x27;purple&#x27;) {
      ctx.rotate(Math.sin(en.phase) * 0.5);
      ctx.fillStyle = t.color;
      ctx.beginPath();
      for (var i = 0; i &lt; 5; i++) {
        var a = i / 5 * 6.28 - 1.57;
        var rr = i % 2 === 0 ? en.r : en.r * 0.5;
        ctx[i === 0 ? &#x27;moveTo&#x27; : &#x27;lineTo&#x27;](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = &#x27;#fff&#x27;;
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, 6.28); ctx.fill();
    } else if (en.type === &#x27;orange&#x27;) {
      ctx.rotate(en.ang);
      ctx.fillStyle = t.color;
      for (var s2 = 0; s2 &lt; 6; s2++) {
        ctx.rotate(6.28 / 6);
        ctx.fillRect(-3, -en.r, 6, en.r);
      }
      ctx.fillStyle = &#x27;#fc6&#x27;;
      ctx.beginPath(); ctx.arc(0, 0, en.r * 0.55, 0, 6.28); ctx.fill();
      ctx.fillStyle = &#x27;#600&#x27;;
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.28); ctx.fill();
    } else {
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(0, 0, en.r, 0, 6.28); ctx.fill();
      ctx.fillStyle = &#x27;#a00&#x27;;
      ctx.beginPath(); ctx.arc(-6, -5, 5, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(7, 3, 6, 0, 6.28); ctx.fill();
      // eyes
      ctx.fillStyle = &#x27;#ff0&#x27;;
      ctx.beginPath(); ctx.arc(-7, -3, 3, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -3, 3, 0, 6.28); ctx.fill();
      // cracked state
      if (en.hp &lt; TYPES.red.hp) {
        ctx.strokeStyle = &#x27;#300&#x27;; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-en.r, 0); ctx.lineTo(-4, -3); ctx.lineTo(2, 6); ctx.lineTo(en.r, -2);
        ctx.moveTo(0, -en.r); ctx.lineTo(-3, 0); ctx.lineTo(4, 5); ctx.lineTo(0, en.r);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function loop(now) {
    if (!running) return;
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    if (!gameOver) update(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    reset();
    running = true;
    lastTime = performance.now();
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  // Keyboard
  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27; &#x27;) { keys[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27; || e.key === &#x27; &#x27;) keys[e.key] = false;
  });

  // Touch steering on canvas halves
  function setTouchFromEvent(ev) {
    var rect = cv.getBoundingClientRect();
    var x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    touchDir = x &lt; rect.width / 2 ? -1 : 1;
  }
  cv.addEventListener(&#x27;touchstart&#x27;, function (e) { setTouchFromEvent(e); e.preventDefault(); }, { passive: false });
  cv.addEventListener(&#x27;touchmove&#x27;, function (e) { setTouchFromEvent(e); e.preventDefault(); }, { passive: false });
  cv.addEventListener(&#x27;touchend&#x27;, function () { touchDir = 0; });
  cv.addEventListener(&#x27;mousedown&#x27;, function (e) { setTouchFromEvent(e); });
  cv.addEventListener(&#x27;mouseup&#x27;, function () { touchDir = 0; });
  cv.addEventListener(&#x27;mouseleave&#x27;, function () { touchDir = 0; });

  fireBtn.addEventListener(&#x27;touchstart&#x27;, function (e) { touchFire = true; e.preventDefault(); }, { passive: false });
  fireBtn.addEventListener(&#x27;touchend&#x27;, function (e) { touchFire = false; e.preventDefault(); }, { passive: false });
  fireBtn.addEventListener(&#x27;mousedown&#x27;, function () { touchFire = true; });
  fireBtn.addEventListener(&#x27;mouseup&#x27;, function () { touchFire = false; });
  fireBtn.addEventListener(&#x27;mouseleave&#x27;, function () { touchFire = false; });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static frame
  reset();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
