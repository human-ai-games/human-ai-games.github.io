<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GALACTIC DEFENDER</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>GALACTIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#0ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 12px rgba(255,0,255,.4); }
  .instructions { font-size: 16px; color: #9fb; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #0ff; text-shadow: 0 0 14px #0ff; margin: 0; transition: transform .08s; }
  #field { display: block; border-radius: 10px; box-shadow: 0 0 24px rgba(0,255,255,.25), inset 0 0 40px rgba(120,0,255,.15); background: #05010f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GALACTIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the arrow keys or your mouse to bounce the energy orb into the alien invaders above. Clear every wave to speed up and score more — hit the orb near the ship&#x27;s edge to angle your shots!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;SCORE: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;field&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;field&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 620, H = 460;
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var PADDLE_W = 110, PADDLE_H = 14, PADDLE_BOTTOM = 22, PADDLE_SPEED = 7;
  var ORB_R = 8;
  var running = false, animId = null, keys = {};
  var paddleX, orbX, orbY, orbVX, orbVY, baseSpeed, score, wave, combo, comboTimer;
  var aliens = [], trail = [], floaters = [], flash = 0, hue = 0, mouseX = null;

  var COLORS = [&#x27;#ff4d6d&#x27;,&#x27;#ffb84d&#x27;,&#x27;#ffe14d&#x27;,&#x27;#4dff88&#x27;,&#x27;#4dd2ff&#x27;];
  var POINTS = [50,40,30,20,10];

  // audio
  var AC = null;
  function beep(freq, dur, type){
    try{
      if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.12,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
      o.start(); o.stop(AC.currentTime+dur);
    }catch(_){}
  }

  function spawnWave(){
    aliens = [];
    var rows = Math.min(3 + wave, 5);
    var cols = 9;
    var aw = 50, ah = 22, gapX = 8, gapY = 10;
    var totalW = cols*aw + (cols-1)*gapX;
    var startX = (W - totalW)/2, startY = 40;
    for(var r=0;r&lt;rows;r++){
      for(var c=0;c&lt;cols;c++){
        aliens.push({
          x: startX + c*(aw+gapX), y: startY + r*(ah+gapY),
          w: aw, h: ah, row: r, alive: true
        });
      }
    }
  }

  function resetOrb(){
    orbX = W/2; orbY = H - 120;
    var ang = (-Math.PI/2) + (Math.random()-0.5)*0.6;
    orbVX = Math.cos(ang)*baseSpeed;
    orbVY = Math.sin(ang)*baseSpeed;
    combo = 0; comboTimer = 0;
  }

  function startGame(){
    if(running) return;
    score = 0; wave = 0; baseSpeed = 4.2; hue = 0;
    paddleX = (W-PADDLE_W)/2; mouseX = null;
    trail = []; floaters = []; flash = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    for(var k in keys) keys[k]=false;
    spawnWave(); resetOrb();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame(){
    running = false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  function addScore(n){
    score += n;
    scoreEl.textContent = score;
    scoreEl.style.transform = &#x27;scale(1.25)&#x27;;
    setTimeout(function(){ scoreEl.style.transform=&#x27;scale(1)&#x27;; }, 90);
  }

  function tick(){
    if(!running) return;
    hue = (hue + 1 + baseSpeed*0.2) % 360;

    // paddle
    if(keys[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if(keys[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    if(mouseX !== null) paddleX = mouseX - PADDLE_W/2;
    paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

    // orb
    orbX += orbVX; orbY += orbVY;
    trail.push({x:orbX,y:orbY}); if(trail.length&gt;12) trail.shift();

    if(orbX &lt; ORB_R){ orbX=ORB_R; orbVX=-orbVX; }
    if(orbX &gt; W-ORB_R){ orbX=W-ORB_R; orbVX=-orbVX; }
    if(orbY &lt; ORB_R){ orbY=ORB_R; orbVY=-orbVY; }

    // paddle collision
    var pTop = H - PADDLE_BOTTOM - PADDLE_H;
    if(orbVY&gt;0 &amp;&amp; orbY+ORB_R&gt;=pTop &amp;&amp; orbY+ORB_R&lt;=pTop+PADDLE_H+8 &amp;&amp;
       orbX&gt;=paddleX &amp;&amp; orbX&lt;=paddleX+PADDLE_W){
      var hitPos = (orbX - (paddleX+PADDLE_W/2))/(PADDLE_W/2); // -1..1
      var ang = -Math.PI/2 + hitPos*(Math.PI/3);
      orbVX = Math.cos(ang)*baseSpeed;
      orbVY = Math.sin(ang)*baseSpeed;
      orbY = pTop - ORB_R;
      combo = 0;
      beep(300,0.08,&#x27;sine&#x27;);
    }

    // alien collision
    for(var i=0;i&lt;aliens.length;i++){
      var a = aliens[i];
      if(!a.alive) continue;
      if(orbX+ORB_R&gt;=a.x &amp;&amp; orbX-ORB_R&lt;=a.x+a.w &amp;&amp;
         orbY+ORB_R&gt;=a.y &amp;&amp; orbY-ORB_R&lt;=a.y+a.h){
        a.alive = false;
        orbVY = -orbVY;
        combo++; comboTimer = 60;
        var mult = combo&gt;1 ? combo : 1;
        var gained = POINTS[a.row]*mult;
        addScore(gained);
        floaters.push({x:a.x+a.w/2, y:a.y, life:45,
          text: mult&gt;1 ? (&#x27;+&#x27;+gained+&#x27; x&#x27;+mult) : (&#x27;+&#x27;+gained), color:COLORS[a.row]});
        beep(500+combo*40,0.07,&#x27;square&#x27;);
        break;
      }
    }
    if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0) combo=0; }

    // orb missed
    if(orbY &gt; H+ORB_R){
      flash = 12;
      beep(120,0.25,&#x27;sawtooth&#x27;);
      resetOrb();
    }

    // wave clear
    var anyAlive = false;
    for(var j=0;j&lt;aliens.length;j++){ if(aliens[j].alive){anyAlive=true;break;} }
    if(!anyAlive){
      wave++;
      baseSpeed += 0.5;
      var sp = Math.hypot(orbVX,orbVY)||baseSpeed;
      orbVX = orbVX/sp*baseSpeed; orbVY = orbVY/sp*baseSpeed;
      spawnWave();
      beep(700,0.15,&#x27;triangle&#x27;);
    }

    // floaters
    for(var f=floaters.length-1;f&gt;=0;f--){
      floaters[f].y -= 0.8; floaters[f].life--;
      if(floaters[f].life&lt;=0) floaters.splice(f,1);
    }
    if(flash&gt;0) flash--;

    draw();
    animId = requestAnimationFrame(tick);
  }

  var stars = [];
  for(var s=0;s&lt;70;s++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,sp:Math.random()*0.4+0.1});

  function draw(){
    ctx.fillStyle = &#x27;#05010f&#x27;;
    ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle = &#x27;#fff&#x27;;
    for(var s=0;s&lt;stars.length;s++){
      var st=stars[s];
      st.y += st.sp; if(st.y&gt;H) st.y=0;
      ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;

    // aliens
    for(var i=0;i&lt;aliens.length;i++){
      var a=aliens[i]; if(!a.alive) continue;
      ctx.fillStyle = COLORS[a.row];
      ctx.shadowColor = COLORS[a.row]; ctx.shadowBlur = 10;
      roundRect(a.x,a.y,a.w,a.h,5); ctx.fill();
      // little eyes
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;#05010f&#x27;;
      ctx.beginPath(); ctx.arc(a.x+a.w*0.35,a.y+a.h*0.5,2.5,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(a.x+a.w*0.65,a.y+a.h*0.5,2.5,0,7); ctx.fill();
    }
    ctx.shadowBlur=0;

    // trail
    for(var t=0;t&lt;trail.length;t++){
      var tp=trail[t]; var alpha=(t+1)/trail.length;
      ctx.globalAlpha = alpha*0.5;
      ctx.fillStyle = &#x27;hsl(&#x27;+((hue+t*10)%360)+&#x27;,100%,65%)&#x27;;
      ctx.beginPath(); ctx.arc(tp.x,tp.y,ORB_R*alpha,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;

    // orb
    var oc = &#x27;hsl(&#x27;+hue+&#x27;,100%,65%)&#x27;;
    ctx.fillStyle = oc; ctx.shadowColor=oc; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(orbX,orbY,ORB_R,0,7); ctx.fill();
    ctx.shadowBlur=0;

    // paddle (ship)
    var pTop = H - PADDLE_BOTTOM - PADDLE_H;
    var pc = &#x27;hsl(&#x27;+((hue+180)%360)+&#x27;,100%,60%)&#x27;;
    ctx.fillStyle = pc; ctx.shadowColor=pc; ctx.shadowBlur=16;
    ctx.beginPath();
    ctx.moveTo(paddleX, pTop+PADDLE_H);
    ctx.lineTo(paddleX+PADDLE_W*0.15, pTop);
    ctx.lineTo(paddleX+PADDLE_W*0.85, pTop);
    ctx.lineTo(paddleX+PADDLE_W, pTop+PADDLE_H);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // cockpit
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.arc(paddleX+PADDLE_W/2, pTop+4, 3,0,7); ctx.fill();
    ctx.globalAlpha=1;

    // floaters
    ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;bold 15px system-ui&#x27;;
    for(var f=0;f&lt;floaters.length;f++){
      var fl=floaters[f];
      ctx.globalAlpha = Math.min(1, fl.life/25);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha=1;

    // flash
    if(flash&gt;0){
      ctx.fillStyle = &#x27;rgba(255,80,80,&#x27;+(flash/12*0.4)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; mouseX=null; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    mouseX = (e.clientX-rect.left) * (W/rect.width);
  });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){
    var rect = cv.getBoundingClientRect();
    mouseX = (e.touches[0].clientX-rect.left) * (W/rect.width);
    e.preventDefault();
  }, {passive:false});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });

  // initial static frame
  paddleX = (W-PADDLE_W)/2; orbX=W/2; orbY=H-120; orbVX=0; orbVY=0;
  baseSpeed=4.2; wave=0; score=0; combo=0; comboTimer=0; hue=0;
  spawnWave();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
