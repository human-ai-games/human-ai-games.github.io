&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8ecff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys (or the on-screen buttons) to eat orbs, timed golden stars, and moving rainbow gems. Chain quick catches for a combo and get faster as you score — use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score &lt;span id=&quot;score&quot; class=&quot;val&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Combo &lt;span id=&quot;combo&quot; class=&quot;val&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
    &lt;span id=&quot;speed&quot; class=&quot;val&quot;&gt;🔥1&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;560&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;pad&quot;&gt;
      &lt;button class=&quot;b-up&quot; data-dir=&quot;up&quot;&gt;▲&lt;/button&gt;
      &lt;button class=&quot;b-left&quot; data-dir=&quot;left&quot;&gt;◀&lt;/button&gt;
      &lt;button class=&quot;b-down&quot; data-dir=&quot;down&quot;&gt;▼&lt;/button&gt;
      &lt;button class=&quot;b-right&quot; data-dir=&quot;right&quot;&gt;▶&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var CELL = 20, COLS = cv.width / CELL, ROWS = cv.height / CELL;
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;),
      speedEl = document.getElementById(&#x27;speed&#x27;), msgEl = document.getElementById(&#x27;msg&#x27;);

  var running = false, gameOver = false;
  var snake, dir, pendingDir, score, speedTier, combo, lastEatTime;
  var items = [];      // {type,x,y,born,life,rainbow?}
  var particles = [];  // burst + death fragments
  var stars = [];      // starfield
  var flash = null;    // {color, until}
  var lastTick = 0, accum = 0, rafId = null, lastFrame = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(vol || 0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (_) {}
  }
  function deathSound() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;sawtooth&#x27;; o.frequency.setValueAtTime(320, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.7);
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.3, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.7);
      o.start(); o.stop(actx.currentTime + 0.7);
    } catch (_) {}
  }

  function tickMs() { return Math.max(70, 150 - (speedTier - 1) * 12); }

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 70; i++) {
      var edge = Math.floor(Math.random() * 4), x, y;
      if (edge === 0) { x = 0; y = Math.random() * cv.height; }
      else if (edge === 1) { x = cv.width; y = Math.random() * cv.height; }
      else if (edge === 2) { y = 0; x = Math.random() * cv.width; }
      else { y = cv.height; x = Math.random() * cv.width; }
      stars.push({ x: x, y: y, r: Math.random() * 1.6 + 0.4 });
    }
  }
  function updateStars() {
    var cx = cv.width / 2, cy = cv.height / 2;
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i], dx = cx - s.x, dy = cy - s.y, d = Math.hypot(dx, dy) || 1;
      s.x += dx / d * 0.5; s.y += dy / d * 0.5;
      if (d &lt; 30) {
        var edge = Math.floor(Math.random() * 4);
        if (edge === 0) { s.x = 0; s.y = Math.random() * cv.height; }
        else if (edge === 1) { s.x = cv.width; s.y = Math.random() * cv.height; }
        else if (edge === 2) { s.y = 0; s.x = Math.random() * cv.width; }
        else { s.y = cv.height; s.x = Math.random() * cv.width; }
      }
    }
  }

  function occupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    for (var j = 0; j &lt; items.length; j++) if (items[j].x === x &amp;&amp; items[j].y === y) return true;
    return false;
  }
  function freeCell() {
    for (var t = 0; t &lt; 200; t++) {
      var x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
      if (!occupied(x, y)) return { x: x, y: y };
    }
    return { x: 0, y: 0 };
  }
  function spawnItem(type) {
    var c = freeCell();
    var life = type === &#x27;star&#x27; ? 5000 : type === &#x27;gem&#x27; ? 3000 : 999999;
    items.push({ type: type, x: c.x, y: c.y, born: performance.now(), life: life });
  }

  function initGame() {
    snake = [{ x: 5, y: 11 }, { x: 4, y: 11 }, { x: 3, y: 11 }];
    dir = { x: 1, y: 0 }; pendingDir = { x: 1, y: 0 };
    score = 0; speedTier = 1; combo = 1; lastEatTime = -9999;
    items = []; particles = []; flash = null;
    spawnItem(&#x27;orb&#x27;);
    initStars();
    updateHud();
  }
  function updateHud() {
    scoreEl.textContent = score;
    comboEl.textContent = &#x27;x&#x27; + combo;
    speedEl.textContent = &#x27;🔥&#x27; + speedTier;
  }

  function burst(px, py, color) {
    for (var i = 0; i &lt; 18; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * 3 + 1;
      particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.03 + Math.random() * 0.02, color: color, r: Math.random() * 3 + 1 });
    }
  }
  function deathExplosion() {
    var cols = [&#x27;#28ffe0&#x27;, &#x27;#5cffb0&#x27;, &#x27;#8a5cff&#x27;, &#x27;#ff4fd8&#x27;, &#x27;#ffd34f&#x27;, &#x27;#ff6a3d&#x27;];
    for (var s = 0; s &lt; snake.length; s++) {
      for (var k = 0; k &lt; 4; k++) {
        var a = Math.random() * Math.PI * 2, sp = Math.random() * 4 + 1;
        particles.push({ x: snake[s].x * CELL + CELL / 2, y: snake[s].y * CELL + CELL / 2,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.012 + Math.random() * 0.01,
          color: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 4 + 2 });
      }
    }
  }

  function doEat(item) {
    var now = performance.now();
    var pts = item.type === &#x27;orb&#x27; ? 1 : item.type === &#x27;star&#x27; ? 3 : 5;
    if (now - lastEatTime &lt; 3000) combo = Math.min(combo + 1, 9); else combo = 1;
    lastEatTime = now;
    score += pts * combo;
    var newTier = 1 + Math.floor(score / 5);
    if (newTier &gt; speedTier) speedTier = newTier;
    var color = item.type === &#x27;orb&#x27; ? &#x27;#28ffe0&#x27; : item.type === &#x27;star&#x27; ? &#x27;#ffd34f&#x27; : &#x27;#ff4fd8&#x27;;
    flash = { color: color, until: now + 160 };
    burst(item.x * CELL + CELL / 2, item.y * CELL + CELL / 2, color);
    beep(item.type === &#x27;orb&#x27; ? 520 : item.type === &#x27;star&#x27; ? 700 : 900, 0.15, &#x27;triangle&#x27;, 0.25);
    updateHud();
  }

  function step() {
    if (!(pendingDir.x === -dir.x &amp;&amp; pendingDir.y === -dir.y)) dir = pendingDir;
    var head = snake[0], nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx &lt; 0 || nx &gt;= COLS || ny &lt; 0 || ny &gt;= ROWS) return die();
    for (var i = 0; i &lt; snake.length - 1; i++) if (snake[i].x === nx &amp;&amp; snake[i].y === ny) return die();

    // move gems randomly
    for (var g = 0; g &lt; items.length; g++) {
      if (items[g].type === &#x27;gem&#x27;) {
        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        var d = dirs[Math.floor(Math.random() * 4)];
        var gx = items[g].x + d[0], gy = items[g].y + d[1];
        if (gx &gt;= 0 &amp;&amp; gx &lt; COLS &amp;&amp; gy &gt;= 0 &amp;&amp; gy &lt; ROWS) { items[g].x = gx; items[g].y = gy; }
      }
    }

    var ate = -1;
    for (var j = 0; j &lt; items.length; j++) if (items[j].x === nx &amp;&amp; items[j].y === ny) { ate = j; break; }
    snake.unshift({ x: nx, y: ny });
    if (ate &gt;= 0) {
      var it = items[ate];
      doEat(it);
      items.splice(ate, 1);
      if (it.type === &#x27;orb&#x27;) spawnItem(&#x27;orb&#x27;);
    } else {
      snake.pop();
    }

    // despawn / spawn timers
    var now = performance.now();
    for (var m = items.length - 1; m &gt;= 0; m--) {
      if (now - items[m].born &gt; items[m].life) items.splice(m, 1);
    }
    if (!items.some(function (o) { return o.type === &#x27;star&#x27;; }) &amp;&amp; Math.random() &lt; 0.08) spawnItem(&#x27;star&#x27;);
    if (!items.some(function (o) { return o.type === &#x27;gem&#x27;; }) &amp;&amp; Math.random() &lt; 0.05) spawnItem(&#x27;gem&#x27;);
    if (!items.some(function (o) { return o.type === &#x27;orb&#x27;; })) spawnItem(&#x27;orb&#x27;);

    // combo expiry
    if (now - lastEatTime &gt; 3000 &amp;&amp; combo !== 1) { combo = 1; updateHud(); }
  }

  function die() {
    deathExplosion();
    deathSound();
    running = false; gameOver = true;
    msgEl.textContent = &#x27;GAME OVER · &#x27; + score;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexRGB(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  var HEAD = hexRGB(&#x27;#28ffe0&#x27;), TAIL = hexRGB(&#x27;#8a5cff&#x27;);

  function draw(now) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // starfield
    ctx.save();
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.7; ctx.fillStyle = &#x27;#aab4ff&#x27;;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // items
    for (var k = 0; k &lt; items.length; k++) {
      var it = items[k], cx = it.x * CELL + CELL / 2, cy = it.y * CELL + CELL / 2;
      var t = (now - it.born) / it.life;
      if (it.type === &#x27;orb&#x27;) {
        glowCircle(cx, cy, 7, &#x27;#28ffe0&#x27;);
      } else if (it.type === &#x27;star&#x27;) {
        var blink = 0.5 + 0.5 * Math.sin(now / 90);
        ctx.globalAlpha = blink;
        drawStar(cx, cy, 9, 4.5, &#x27;#ffd34f&#x27;);
        ctx.globalAlpha = 1;
      } else {
        var hue = (now / 4) % 360;
        drawStar(cx, cy, 9, 4, &#x27;hsl(&#x27; + hue + &#x27;,100%,60%)&#x27;, now / 300);
      }
    }

    // snake
    for (var n = snake.length - 1; n &gt;= 0; n--) {
      var seg = snake[n], f = snake.length &gt; 1 ? n / (snake.length - 1) : 0;
      var r = Math.round(lerp(HEAD[0], TAIL[0], f)), gg = Math.round(lerp(HEAD[1], TAIL[1], f)), b = Math.round(lerp(HEAD[2], TAIL[2], f));
      var col = &#x27;rgb(&#x27; + r + &#x27;,&#x27; + gg + &#x27;,&#x27; + b + &#x27;)&#x27;;
      var pulse = 6 + 3 * Math.sin(now / 150 + n * 0.5);
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = pulse;
      ctx.fillStyle = col;
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();
      ctx.restore();
    }

    // particles
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pa = particles[p];
      ctx.globalAlpha = Math.max(0, pa.life);
      ctx.fillStyle = pa.color;
      ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // flash
    if (flash &amp;&amp; now &lt; flash.until) {
      ctx.save();
      ctx.globalAlpha = 0.22 * ((flash.until - now) / 160);
      ctx.fillStyle = flash.color;
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.restore();
    }
  }

  function glowCircle(x, y, r, color) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function drawStar(cx, cy, outer, inner, color, rot) {
    ctx.save(); ctx.translate(cx, cy); if (rot) ctx.rotate(rot);
    ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i &lt; 10; i++) {
      var rad = (i % 2 === 0) ? outer : inner, a = Math.PI / 5 * i - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function updateParticles() {
    for (var p = particles.length - 1; p &gt;= 0; p--) {
      var pa = particles[p];
      pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.05; pa.vx *= 0.98;
      pa.life -= pa.decay;
      if (pa.life &lt;= 0) particles.splice(p, 1);
    }
  }

  function loop(now) {
    if (!lastFrame) lastFrame = now;
    var dt = now - lastFrame; lastFrame = now;
    updateStars();
    updateParticles();
    if (running) {
      accum += dt;
      while (accum &gt;= tickMs()) { step(); accum -= tickMs(); if (!running) break; }
    }
    draw(now);
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    initGame();
    msgEl.textContent = &#x27;&#x27;;
    running = true; gameOver = false;
    accum = 0; lastFrame = 0;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function setDir(d) {
    if (d === &#x27;left&#x27;) pendingDir = { x: -1, y: 0 };
    else if (d === &#x27;right&#x27;) pendingDir = { x: 1, y: 0 };
    else if (d === &#x27;up&#x27;) pendingDir = { x: 0, y: -1 };
    else if (d === &#x27;down&#x27;) pendingDir = { x: 0, y: 1 };
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { setDir(&#x27;left&#x27;); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { setDir(&#x27;right&#x27;); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { setDir(&#x27;up&#x27;); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { setDir(&#x27;down&#x27;); e.preventDefault(); }
  });
  document.querySelectorAll(&#x27;.pad button&#x27;).forEach(function (b) {
    b.addEventListener(&#x27;mousedown&#x27;, function () { setDir(b.getAttribute(&#x27;data-dir&#x27;)); });
    b.addEventListener(&#x27;touchstart&#x27;, function (e) { setDir(b.getAttribute(&#x27;data-dir&#x27;)); e.preventDefault(); });
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  // initial static paint
  initGame();
  draw(performance.now());
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
