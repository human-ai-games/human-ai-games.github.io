&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8e8ff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys or the pad in the corner; grab the star (3), crystal (2), and chili (1) for points. Chain pickups without reversing to build a combo before the 60-second timer runs out.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;Score 0&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;x1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;timeWrap&quot;&gt;&lt;div class=&quot;timeBar&quot; id=&quot;timeBar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;pad&quot;&gt;
      &lt;div class=&quot;pbtn&quot; id=&quot;up&quot;&gt;▲&lt;/div&gt;
      &lt;div class=&quot;pbtn&quot; id=&quot;down&quot;&gt;▼&lt;/div&gt;
      &lt;div class=&quot;pbtn&quot; id=&quot;left&quot;&gt;◀&lt;/div&gt;
      &lt;div class=&quot;pbtn&quot; id=&quot;right&quot;&gt;▶&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var CELL=20, COLS=30, ROWS=22, W=COLS*CELL, H=ROWS*CELL;
var BASE_MS=140;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;);
var timeBar=document.getElementById(&#x27;timeBar&#x27;), msgEl=document.getElementById(&#x27;msg&#x27;);

var running=false, rafId=null;
var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
var pickups=[], particles=[], ghosts=[];
var score=0, combo=1, comboTimer=0;
var timeLeft=60, lastTime=0, acc=0, stepMs=BASE_MS;
var speedEffect=0, slowEffect=0; // ms remaining
var shattering=false, shatterT=0;

function rand(n){return Math.floor(Math.random()*n);}
function occupied(x,y){
  for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  for(var j=0;j&lt;pickups.length;j++) if(pickups[j].x===x&amp;&amp;pickups[j].y===y) return true;
  return false;
}
function freeCell(){ var x,y,t=0; do{x=rand(COLS);y=rand(ROWS);t++;}while(occupied(x,y)&amp;&amp;t&lt;300); return {x:x,y:y}; }

function spawnPickups(){
  pickups=[];
  var types=[&#x27;star&#x27;,&#x27;crystal&#x27;,&#x27;chili&#x27;];
  for(var i=0;i&lt;types.length;i++){ var c=freeCell(); pickups.push({x:c.x,y:c.y,type:types[i]}); }
}
function respawnOne(type){ var c=freeCell(); pickups.push({x:c.x,y:c.y,type:type}); }

function initSnake(){ snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}]; dir={x:1,y:0}; pendingDir={x:1,y:0}; }

function burst(px,py,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function reset(){
  score=0; combo=1; comboTimer=0; timeLeft=60; stepMs=BASE_MS;
  speedEffect=0; slowEffect=0; shattering=false; shatterT=0;
  particles=[]; ghosts=[];
  initSnake(); spawnPickups();
  scoreEl.textContent=&#x27;Score 0&#x27;; comboEl.textContent=&#x27;x1&#x27;; msgEl.textContent=&#x27;&#x27;;
  timeBar.style.width=&#x27;100%&#x27;;
}

function bump(el){ el.classList.remove(&#x27;pop&#x27;); void el.offsetWidth; el.classList.add(&#x27;pop&#x27;); setTimeout(function(){el.classList.remove(&#x27;pop&#x27;);},130); }

function eat(p){
  var pts = p.type===&#x27;star&#x27;?3 : p.type===&#x27;crystal&#x27;?2 : 1;
  score += pts*combo;
  combo = Math.min(combo+1,9); comboTimer=2500;
  scoreEl.textContent=&#x27;Score &#x27;+score; bump(scoreEl);
  comboEl.textContent=&#x27;x&#x27;+combo; bump(comboEl);
  var cx=p.x*CELL+CELL/2, cy=p.y*CELL+CELL/2;
  if(p.type===&#x27;star&#x27;){ burst(cx,cy,&#x27;#ffd23f&#x27;,22); respawnOne(&#x27;star&#x27;); }
  else if(p.type===&#x27;chili&#x27;){ burst(cx,cy,&#x27;#ff4b4b&#x27;,14); speedEffect=3000; respawnOne(&#x27;chili&#x27;); }
  else { burst(cx,cy,&#x27;#4fd0ff&#x27;,16); slowEffect=3000; respawnOne(&#x27;crystal&#x27;); }
}

function startShatter(){
  shattering=true; shatterT=500;
  for(var i=0;i&lt;snake.length;i++){
    var cx=snake[i].x*CELL+CELL/2, cy=snake[i].y*CELL+CELL/2;
    burst(cx,cy,&#x27;#ffffff&#x27;,6);
  }
}

function endGame(win){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  msgEl.textContent = win ? &#x27;TIME! Score &#x27;+score : &#x27;CRASH! Score &#x27;+score;
}

function step(){
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ startShatter(); return; }
  var ateIdx=-1;
  for(var k=0;k&lt;pickups.length;k++) if(pickups[k].x===nx&amp;&amp;pickups[k].y===ny){ ateIdx=k; break; }
  var body = ateIdx&gt;=0 ? snake : snake.slice(0,snake.length-1);
  for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ startShatter(); return; }
  // slow leaves ghost trail
  if(slowEffect&gt;0){ ghosts.push({x:head.x,y:head.y,life:1}); }
  snake.unshift({x:nx,y:ny});
  if(ateIdx&gt;=0){ var p=pickups.splice(ateIdx,1)[0]; eat(p); }
  else snake.pop();
}

function updateStep(){
  stepMs = BASE_MS;
  if(speedEffect&gt;0) stepMs=BASE_MS*0.55;
  if(slowEffect&gt;0) stepMs=BASE_MS*1.7;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // grid dots
  ctx.fillStyle=&#x27;rgba(120,150,255,0.10)&#x27;;
  for(var gx=0;gx&lt;=COLS;gx++) for(var gy=0;gy&lt;=ROWS;gy++){
    ctx.fillRect(gx*CELL-1,gy*CELL-1,2,2);
  }
  // ghosts
  for(var i=0;i&lt;ghosts.length;i++){
    var g=ghosts[i];
    ctx.globalAlpha=g.life*0.4;
    ctx.fillStyle=&#x27;#4fd0ff&#x27;;
    ctx.fillRect(g.x*CELL+3,g.y*CELL+3,CELL-6,CELL-6);
  }
  ctx.globalAlpha=1;

  // pickups
  var t=Date.now()/1000;
  for(var p=0;p&lt;pickups.length;p++){
    var pk=pickups[p], cx=pk.x*CELL+CELL/2, cy=pk.y*CELL+CELL/2;
    ctx.save(); ctx.translate(cx,cy);
    if(pk.type===&#x27;star&#x27;){
      ctx.rotate(t*1.5);
      ctx.fillStyle=&#x27;#ffd23f&#x27;; ctx.shadowColor=&#x27;#ffd23f&#x27;; ctx.shadowBlur=14;
      drawStar(0,0,5,8,4);
    } else if(pk.type===&#x27;chili&#x27;){
      var fl=(Math.floor(t*6)%2===0)?&#x27;#ff4b4b&#x27;:&#x27;#ff8080&#x27;;
      ctx.fillStyle=fl; ctx.shadowColor=&#x27;#ff4b4b&#x27;; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.ellipse(0,0,4,8,0.4,0,Math.PI*2); ctx.fill();
    } else {
      ctx.rotate(Math.PI/4);
      ctx.fillStyle=&#x27;#4fd0ff&#x27;; ctx.shadowColor=&#x27;#4fd0ff&#x27;; ctx.shadowBlur=14;
      ctx.fillRect(-6,-6,12,12);
    }
    ctx.restore();
  }
  ctx.shadowBlur=0;

  // snake
  var flashing = shattering &amp;&amp; (Math.floor(shatterT/60)%2===0);
  if(!shattering || shatterT&gt;250){
    for(var s=snake.length-1;s&gt;=0;s--){
      var seg=snake[s], f=snake.length&gt;1?s/(snake.length-1):0;
      var r=Math.round(47+(162-47)*f), gg=Math.round(252+(75-252)*f), b=Math.round(255+(255-255)*f);
      var col = flashing ? &#x27;#ffffff&#x27; : &#x27;rgb(&#x27;+r+&#x27;,&#x27;+gg+&#x27;,&#x27;+b+&#x27;)&#x27;;
      ctx.fillStyle=col;
      ctx.shadowColor=speedEffect&gt;0?&#x27;#ff4b4b&#x27;:col; ctx.shadowBlur=speedEffect&gt;0?16:10;
      roundRect(seg.x*CELL+1.5,seg.y*CELL+1.5,CELL-3,CELL-3,6);
      if(speedEffect&gt;0 &amp;&amp; s&gt;0){ // speed-blur trail
        ctx.globalAlpha=0.25;
        roundRect((seg.x-dir.x*0.4)*CELL+1.5,(seg.y-dir.y*0.4)*CELL+1.5,CELL-3,CELL-3,6);
        ctx.globalAlpha=1;
      }
    }
  }
  ctx.shadowBlur=0;

  // particles
  for(var q=0;q&lt;particles.length;q++){
    var pt=particles[q];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fill();
}
function drawStar(cx,cy,spikes,outer,inner){
  var rot=-Math.PI/2, step=Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx,cy-outer);
  for(var i=0;i&lt;spikes;i++){
    ctx.lineTo(cx+Math.cos(rot)*outer,cy+Math.sin(rot)*outer); rot+=step;
    ctx.lineTo(cx+Math.cos(rot)*inner,cy+Math.sin(rot)*inner); rot+=step;
  }
  ctx.closePath(); ctx.fill();
}

function loop(ts){
  if(!running) return;
  if(!lastTime) lastTime=ts;
  var dt=ts-lastTime; lastTime=ts;

  // effects
  if(speedEffect&gt;0) speedEffect-=dt;
  if(slowEffect&gt;0) slowEffect-=dt;
  if(comboTimer&gt;0){ comboTimer-=dt; if(comboTimer&lt;=0){ combo=1; comboEl.textContent=&#x27;x1&#x27;; } }

  // timer
  timeLeft-=dt/1000;
  if(timeLeft&lt;=0){ timeLeft=0; timeBar.style.width=&#x27;0%&#x27;; draw(); endGame(true); return; }
  timeBar.style.width=(timeLeft/60*100)+&#x27;%&#x27;;

  // particles/ghosts fade
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=dt/700;
    if(p.life&lt;=0) particles.splice(i,1);
  }
  for(var g=ghosts.length-1;g&gt;=0;g--){ ghosts[g].life-=dt/500; if(ghosts[g].life&lt;=0) ghosts.splice(g,1); }

  if(shattering){
    shatterT-=dt; draw();
    if(shatterT&lt;=0){ endGame(false); return; }
    rafId=requestAnimationFrame(loop); return;
  }

  updateStep();
  acc+=dt;
  while(acc&gt;=stepMs){ acc-=stepMs; step(); if(shattering) break; }

  draw();
  rafId=requestAnimationFrame(loop);
}

function startGame(){
  if(running) return;
  reset();
  running=true; lastTime=0; acc=0;
  draw();
  rafId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

function setDir(x,y){ pendingDir={x:x,y:y}; }
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){setDir(-1,0);e.preventDefault();}
  else if(e.key===&#x27;ArrowRight&#x27;){setDir(1,0);e.preventDefault();}
  else if(e.key===&#x27;ArrowUp&#x27;){setDir(0,-1);e.preventDefault();}
  else if(e.key===&#x27;ArrowDown&#x27;){setDir(0,1);e.preventDefault();}
});
function padHandler(id,x,y){
  var el=document.getElementById(id);
  el.addEventListener(&#x27;mousedown&#x27;,function(e){e.preventDefault();setDir(x,y);});
  el.addEventListener(&#x27;touchstart&#x27;,function(e){e.preventDefault();setDir(x,y);});
}
padHandler(&#x27;up&#x27;,0,-1); padHandler(&#x27;down&#x27;,0,1); padHandler(&#x27;left&#x27;,-1,0); padHandler(&#x27;right&#x27;,1,0);

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s

  <div class="controls">

    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
