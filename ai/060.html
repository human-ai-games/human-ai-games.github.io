<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC BREAKOUT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#4df3ff,#c86bff,#ff6bd0);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,90,255,.4); }
  .instructions { font-size: 16px; color: #9aa0d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; align-items: center; width: 620px; }
  .score { font-size: 22px; font-weight: 700; color: #4df3ff; text-shadow: 0 0 10px rgba(77,243,255,.6); }
  .lives { font-size: 22px; letter-spacing: 3px; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #060216;
           box-shadow: 0 0 30px rgba(90,60,200,.35), inset 0 0 40px rgba(30,10,60,.6); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the mouse or &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt; keys to bounce the energy orb and smash every brick. Golden bricks are worth big points — press the Start/Restart button below to launch.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;🚀🚀🚀&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var scoreEl = document.getElementById(&#x27;score&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

  var running = false, animId = null;
  var keysDown = {};
  var score = 0, lives = 3;
  var readyTimer = 0; // frames of &quot;READY?&quot; shown before launch

  var PADDLE_W = 110, PADDLE_H = 14, PADDLE_BOTTOM = 24, PADDLE_SPEED = 7;
  var paddleX = (W - PADDLE_W) / 2, paddleFlash = 0;

  var BALL_R = 8;
  var ballX, ballY, ballVX, ballVY, baseSpeed = 4.2, trail = [];

  var bricks = [], particles = [], stars = [];

  var COLORS = [
    { c: &#x27;#ff5b7f&#x27;, g: &#x27;#ff9db2&#x27;, pts: 3 },
    { c: &#x27;#ff9d3b&#x27;, g: &#x27;#ffce8f&#x27;, pts: 2 },
    { c: &#x27;#ffe14d&#x27;, g: &#x27;#fff29b&#x27;, pts: 2 },
    { c: &#x27;#5bffb0&#x27;, g: &#x27;#a8ffd6&#x27;, pts: 1 },
    { c: &#x27;#4dd0ff&#x27;, g: &#x27;#a5e9ff&#x27;, pts: 1 }
  ];
  var GOLD = { c: &#x27;#ffd23f&#x27;, g: &#x27;#fff2b0&#x27;, pts: 5 };

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 90; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H,
        s: Math.random()*1.8+0.4, v: Math.random()*0.8+0.2 });
    }
  }

  function buildBricks() {
    bricks = [];
    var rows = 5, cols = 9;
    var pad = 6, marginX = 20, top = 40;
    var bw = (W - marginX*2 - pad*(cols-1)) / cols;
    var bh = 20;
    for (var r = 0; r &lt; rows; r++) {
      for (var col = 0; col &lt; cols; col++) {
        var gold = Math.random() &lt; 0.08;
        var def = gold ? GOLD : COLORS[r];
        bricks.push({
          x: marginX + col*(bw+pad), y: top + r*(bh+pad),
          w: bw, h: bh, color: def.c, glow: def.g, pts: def.pts,
          gold: gold, alive: true, hit: 0
        });
      }
    }
  }

  function currentSpeed() {
    return baseSpeed + Math.min(score * 0.02, 4.5);
  }

  function resetBall() {
    ballX = W/2; ballY = H - PADDLE_BOTTOM - PADDLE_H - 40;
    var sp = currentSpeed();
    var ang = (Math.random()*0.6 - 0.3);
    ballVX = Math.sin(ang) * sp;
    ballVY = -Math.abs(Math.cos(ang) * sp);
    trail = [];
    readyTimer = 70;
  }

  function updateLives() {
    livesEl.textContent = lives &gt; 0 ? &#x27;🚀&#x27;.repeat(lives) : &#x27;💥&#x27;;
  }

  function spawnParticles(x, y, color, big) {
    var n = big ? 34 : 14;
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random()*Math.PI*2;
      var sp = (big ? 4.5 : 2.8) * (0.4 + Math.random());
      particles.push({
        x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 1, color: color, size: big ? (2+Math.random()*3) : (1.5+Math.random()*2),
        star: big
      });
    }
  }

  function loseLife() {
    lives--;
    updateLives();
    spawnParticles(ballX, ballY, &#x27;#4df3ff&#x27;, false);
    if (lives &lt;= 0) {
      readyTimer = -1; // game over state
    } else {
      paddleX = (W - PADDLE_W) / 2;
      resetBall();
    }
  }

  function startGame() {
    if (running) return;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    lives = 3; updateLives();
    paddleX = (W - PADDLE_W) / 2; paddleFlash = 0;
    particles = [];
    for (var k in keysDown) keysDown[k] = false;
    initStars();
    buildBricks();
    resetBall();
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function drawStars() {
    ctx.fillStyle = &#x27;#060216&#x27;;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i &lt; stars.length; i++) {
      var s = stars[i];
      if (running) { s.y += s.v; if (s.y &gt; H) { s.y = 0; s.x = Math.random()*W; } }
      ctx.globalAlpha = 0.4 + s.s/2.5;
      ctx.fillStyle = &#x27;#cfd6ff&#x27;;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawBricks() {
    for (var i = 0; i &lt; bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      ctx.save();
      ctx.shadowColor = b.glow; ctx.shadowBlur = b.gold ? 16 : 8;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
      if (b.gold) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = &#x27;rgba(255,255,255,0.5)&#x27;;
        ctx.font = &#x27;bold 12px system-ui&#x27;;
        ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
        ctx.fillText(&#x27;★&#x27;, b.x + b.w/2, b.y + b.h/2);
      }
      ctx.restore();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawPaddle() {
    var py = H - PADDLE_BOTTOM - PADDLE_H;
    ctx.save();
    ctx.shadowColor = paddleFlash &gt; 0 ? &#x27;#ffffff&#x27; : &#x27;#4df3ff&#x27;;
    ctx.shadowBlur = paddleFlash &gt; 0 ? 28 : 14;
    var grad = ctx.createLinearGradient(paddleX, 0, paddleX+PADDLE_W, 0);
    grad.addColorStop(0, &#x27;#4df3ff&#x27;); grad.addColorStop(0.5, &#x27;#c86bff&#x27;); grad.addColorStop(1, &#x27;#4df3ff&#x27;);
    ctx.fillStyle = paddleFlash &gt; 0 ? &#x27;#ffffff&#x27; : grad;
    roundRect(paddleX, py, PADDLE_W, PADDLE_H, 7); ctx.fill();
    ctx.restore();
    if (paddleFlash &gt; 0) paddleFlash--;
  }

  function drawBall() {
    for (var i = 0; i &lt; trail.length; i++) {
      var t = trail[i], a = (i+1)/trail.length;
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = &#x27;#a5e9ff&#x27;;
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    var pulse = BALL_R + Math.sin(Date.now()/120)*1.5;
    ctx.save();
    ctx.shadowColor = &#x27;#4df3ff&#x27;; ctx.shadowBlur = 22;
    var g = ctx.createRadialGradient(ballX, ballY, 1, ballX, ballY, pulse);
    g.addColorStop(0, &#x27;#ffffff&#x27;); g.addColorStop(0.5, &#x27;#4df3ff&#x27;); g.addColorStop(1, &#x27;#1560ff&#x27;);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ballX, ballY, pulse, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (var i = particles.length-1; i &gt;= 0; i--) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.035;
      if (p.life &lt;= 0) { particles.splice(i,1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.star) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life*6);
        ctx.font = (p.size*4)+&#x27;px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
        ctx.fillText(&#x27;✦&#x27;, 0, 0); ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawMessage() {
    if (lives &lt;= 0) {
      ctx.save();
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.shadowColor = &#x27;#ff6bd0&#x27;; ctx.shadowBlur = 20;
      ctx.fillStyle = &#x27;#ff9db2&#x27;;
      ctx.font = &#x27;bold 40px system-ui&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 14);
      ctx.font = &#x27;18px system-ui&#x27;; ctx.fillStyle = &#x27;#e8e8ff&#x27;;
      ctx.fillText(&#x27;Score: &#x27; + score + &#x27; — press Restart&#x27;, W/2, H/2 + 24);
      ctx.restore();
      return;
    }
    var won = bricks.every(function(b){ return !b.alive; });
    if (won &amp;&amp; bricks.length) {
      ctx.save();
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.shadowColor = &#x27;#5bffb0&#x27;; ctx.shadowBlur = 20;
      ctx.fillStyle = &#x27;#5bffb0&#x27;; ctx.font = &#x27;bold 40px system-ui&#x27;;
      ctx.fillText(&#x27;YOU WIN!&#x27;, W/2, H/2 - 14);
      ctx.font = &#x27;18px system-ui&#x27;; ctx.fillStyle = &#x27;#e8e8ff&#x27;;
      ctx.fillText(&#x27;Score: &#x27; + score, W/2, H/2 + 24);
      ctx.restore();
      return;
    }
    if (readyTimer &gt; 0) {
      var a = readyTimer &gt; 50 ? (70 - readyTimer)/20 : Math.min(1, readyTimer/25);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
      ctx.shadowColor = &#x27;#c86bff&#x27;; ctx.shadowBlur = 24;
      ctx.fillStyle = &#x27;#ffffff&#x27;; ctx.font = &#x27;bold 52px system-ui&#x27;;
      ctx.fillText(&#x27;READY?&#x27;, W/2, H/2);
      ctx.restore();
    }
  }

  function tick() {
    if (!running) return;

    // paddle movement
    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    var over = (lives &lt;= 0) || bricks.every(function(b){ return !b.alive; });

    if (!over) {
      if (readyTimer &gt; 0) {
        readyTimer--;
      } else {
        // move ball
        ballX += ballVX; ballY += ballVY;
        trail.push({ x: ballX, y: ballY });
        if (trail.length &gt; 8) trail.shift();

        // walls
        if (ballX - BALL_R &lt;= 0) { ballX = BALL_R; ballVX = -ballVX; }
        if (ballX + BALL_R &gt;= W) { ballX = W - BALL_R; ballVX = -ballVX; }
        if (ballY - BALL_R &lt;= 0) { ballY = BALL_R; ballVY = -ballVY; }

        // paddle
        var py = H - PADDLE_BOTTOM - PADDLE_H;
        if (ballVY &gt; 0 &amp;&amp; ballY + BALL_R &gt;= py &amp;&amp; ballY + BALL_R &lt;= py + PADDLE_H + 10 &amp;&amp;
            ballX &gt;= paddleX - BALL_R &amp;&amp; ballX &lt;= paddleX + PADDLE_W + BALL_R) {
          var hitPos = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2); // -1..1
          var sp = currentSpeed();
          var ang = hitPos * 1.05;
          ballVX = Math.sin(ang) * sp;
          ballVY = -Math.abs(Math.cos(ang) * sp);
          ballY = py - BALL_R;
          paddleFlash = 6;
        }

        // bricks
        for (var i = 0; i &lt; bricks.length; i++) {
          var b = bricks[i];
          if (!b.alive) continue;
          if (ballX + BALL_R &gt; b.x &amp;&amp; ballX - BALL_R &lt; b.x + b.w &amp;&amp;
              ballY + BALL_R &gt; b.y &amp;&amp; ballY - BALL_R &lt; b.y + b.h) {
            // determine bounce axis
            var overlapL = ballX + BALL_R - b.x;
            var overlapR = b.x + b.w - (ballX - BALL_R);
            var overlapT = ballY + BALL_R - b.y;
            var overlapB = b.y + b.h - (ballY - BALL_R);
            var minO = Math.min(overlapL, overlapR, overlapT, overlapB);
            if (minO === overlapL || minO === overlapR) ballVX = -ballVX;
            else ballVY = -ballVY;
            b.alive = false;
            score += b.pts;
            scoreEl.textContent = score;
            spawnParticles(b.x + b.w/2, b.y + b.h/2, b.glow, b.gold);
            break;
          }
        }

        // lost ball
        if (ballY - BALL_R &gt; H) loseLife();
      }
    }

    // render
    drawStars();
    drawBricks();
    drawParticles();
    drawPaddle();
    if (lives &gt; 0 &amp;&amp; !bricks.every(function(b){ return !b.alive; })) drawBall();
    drawMessage();

    animId = requestAnimationFrame(tick);
  }

  // input
  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  function moveToClientX(clientX) {
    var rect = cv.getBoundingClientRect();
    var x = (clientX - rect.left) * (W / rect.width);
    paddleX = Math.max(0, Math.min(W - PADDLE_W, x - PADDLE_W/2));
  }
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){ if (running) moveToClientX(e.clientX); });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if (running &amp;&amp; e.touches[0]) { moveToClientX(e.touches[0].clientX); e.preventDefault(); } }, { passive:false });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  // initial static paint
  initStars(); buildBricks();
  ballX = W/2; ballY = H - PADDLE_BOTTOM - PADDLE_H - 40;
  drawStars(); drawBricks(); drawPaddle();
  ctx.save();
  ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
  ctx.fillStyle=&#x27;#9aa0d0&#x27;; ctx.font=&#x27;20px system-ui&#x27;;
  ctx.fillText(&#x27;Press Start below to play&#x27;, W/2, H/2);
  ctx.restore();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
