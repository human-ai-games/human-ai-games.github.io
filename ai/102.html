  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC SURFER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #06001a; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(90deg,#4df,#f4c,#4f8); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 18px rgba(100,150,255,.4); }
  .instructions { font-size: 16px; color: #9aa; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; font-size: 20px; align-items: baseline; }
  .hud .mult { color: #ffdb4d; font-weight: 800; text-shadow: 0 0 10px rgba(255,219,77,.6); }
  .hud .val { font-weight: 800; }
  canvas { border-radius: 10px; box-shadow: 0 0 30px rgba(80,80,220,.35); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC SURFER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap &lt;strong&gt;Space&lt;/strong&gt; or click to hop — tap again in mid-air for a big boost to clear the spinning asteroids. Chain clears without landing to grow your multiplier; use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Multiplier: &lt;span class=&quot;mult&quot; id=&quot;mult&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Time: &lt;span class=&quot;val&quot; id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var GROUND_H = 44, HERO_X = 90, HERO_SIZE = 30;
  var GRAVITY = 0.62, HOP_V = -9, BOOST_V = -12.5;
  var running = false, animId = null;

  // audio
  var actx = null;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  function beep(freq, dur, type, vol){
    var a = ac(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.15;
    o.connect(g); g.connect(a.destination);
    var t = a.currentTime; o.start(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.stop(t+dur);
  }

  // parallax layers
  var far=[], mid=[], neb=[];
  function initStars(){
    far=[]; mid=[]; neb=[];
    for(var i=0;i&lt;70;i++) far.push({x:Math.random()*W,y:Math.random()*(H-GROUND_H),r:Math.random()*1+0.4});
    for(var i=0;i&lt;40;i++) mid.push({x:Math.random()*W,y:Math.random()*(H-GROUND_H),r:Math.random()*1.6+1});
    for(var i=0;i&lt;8;i++) neb.push({x:Math.random()*W,y:Math.random()*(H-GROUND_H-60)+20,r:Math.random()*40+30,c:[&#x27;#4a2b8a&#x27;,&#x27;#8a2b6b&#x27;,&#x27;#2b5a8a&#x27;][i%3]});
  }
  initStars();

  var heroY, heroVY, jumps, onGround, dead, deadT;
  var asteroids=[], particles=[], stars=[];
  var score, rawScore, mult, comboSinceLand, time, speed, spawnTimer, flash, flashColor, eqPhase, frame;

  var COLORS = [&#x27;#4df6ff&#x27;,&#x27;#ff4dc4&#x27;,&#x27;#4dff8a&#x27;,&#x27;#ffdb4d&#x27;,&#x27;#b84dff&#x27;,&#x27;#ff8a4d&#x27;];

  function reset(){
    heroY = H - GROUND_H - HERO_SIZE;
    heroVY = 0; jumps = 0; onGround = true; dead=false; deadT=0;
    asteroids=[]; particles=[]; stars=[];
    score=0; rawScore=0; mult=1; comboSinceLand=0;
    time=60; speed=3.2; spawnTimer=0; flash=0; flashColor=&#x27;#fff&#x27;; eqPhase=0; frame=0;
    updateHUD();
  }
  function updateHUD(){
    document.getElementById(&#x27;score&#x27;).textContent = Math.floor(score);
    document.getElementById(&#x27;mult&#x27;).textContent = &#x27;x&#x27;+mult;
    document.getElementById(&#x27;time&#x27;).textContent = Math.max(0,Math.ceil(time));
  }

  function spawnAsteroid(){
    var h = 24 + Math.random()*46;
    var w = 24 + Math.random()*36;
    asteroids.push({
      x: W+40, y: H-GROUND_H-h/2,
      w:w, h:h, r:Math.max(w,h)/2,
      ang:Math.random()*6.28, spin:(Math.random()-0.5)*0.14,
      color: COLORS[(Math.random()*COLORS.length)|0],
      scored:false, near:false, verts: makeVerts()
    });
  }
  function makeVerts(){
    var n=7+((Math.random()*3)|0), arr=[];
    for(var i=0;i&lt;n;i++){ arr.push(0.7+Math.random()*0.4); }
    return arr;
  }

  function jump(){
    if(!running || dead) return;
    if(jumps===0){ heroVY = HOP_V; jumps=1; onGround=false; flare(6); beep(440,0.12,&#x27;square&#x27;,0.1); }
    else if(jumps===1){ heroVY = BOOST_V; jumps=2; flare(14); beep(660,0.16,&#x27;square&#x27;,0.12); }
  }
  function flare(n){
    for(var i=0;i&lt;n;i++){
      particles.push({x:HERO_X+HERO_SIZE/2+(Math.random()-0.5)*10, y:heroY+HERO_SIZE, vx:(Math.random()-0.5)*2, vy:Math.random()*3+1, life:1, r:Math.random()*4+2, c:[&#x27;#ffdb4d&#x27;,&#x27;#ff8a4d&#x27;,&#x27;#ff4d4d&#x27;][(Math.random()*3)|0]});
    }
  }
  function explode(){
    for(var i=0;i&lt;40;i++){
      particles.push({x:HERO_X+HERO_SIZE/2, y:heroY+HERO_SIZE/2, vx:(Math.random()-0.5)*9, vy:(Math.random()-0.5)*9, life:1, r:Math.random()*5+2, c:COLORS[(Math.random()*COLORS.length)|0]});
    }
    beep(120,0.5,&#x27;sawtooth&#x27;,0.2);
  }
  function starBurst(){
    for(var i=0;i&lt;26;i++){
      stars.push({x:Math.random()*W, y:Math.random()*(H-GROUND_H), life:1, r:Math.random()*3+1});
    }
    flash=1; flashColor=&#x27;#8af&#x27;; beep(880,0.25,&#x27;triangle&#x27;,0.15);
  }

  function tick(){
    if(!running) return;
    frame++;
    ctx.clearRect(0,0,W,H);

    // background gradient
    var bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,&#x27;#0a0030&#x27;); bg.addColorStop(1,&#x27;#12003a&#x27;);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    var sp = dead?0:speed;

    // nebula (slow)
    for(var i=0;i&lt;neb.length;i++){ var n=neb[i]; n.x -= sp*0.25; if(n.x+n.r&lt;0){n.x=W+n.r; n.y=Math.random()*(H-GROUND_H-60)+20;}
      var grd=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      grd.addColorStop(0,n.c+&#x27;55&#x27;); grd.addColorStop(1,n.c+&#x27;00&#x27;);
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.28); ctx.fill();
    }
    // far stars
    ctx.fillStyle=&#x27;#8890c0&#x27;;
    for(var i=0;i&lt;far.length;i++){ var s=far[i]; s.x-=sp*0.35; if(s.x&lt;0){s.x=W; s.y=Math.random()*(H-GROUND_H);} ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
    // mid stars
    ctx.fillStyle=&#x27;#cfd6ff&#x27;;
    for(var i=0;i&lt;mid.length;i++){ var s=mid[i]; s.x-=sp*0.8; if(s.x&lt;0){s.x=W; s.y=Math.random()*(H-GROUND_H);} ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }

    if(!dead){
      // timer &amp; speed
      time -= 1/60; speed += 0.0015;
      if(time&lt;=0){ running=false; endGame(); }
      spawnTimer -= 1;
      if(spawnTimer&lt;=0){ spawnAsteroid(); spawnTimer = Math.max(45, 110 - speed*7); }

      // physics
      heroVY += GRAVITY; heroY += heroVY;
      var floor = H-GROUND_H-HERO_SIZE;
      if(heroY&gt;=floor){ heroY=floor; heroVY=0; if(!onGround){ onGround=true; jumps=0; comboSinceLand=0; mult=1; } }
      if(heroY&lt;0){heroY=0; heroVY=0;}
      if(!onGround &amp;&amp; Math.random()&lt;0.5) flare(1);
    }

    // asteroids
    for(var i=asteroids.length-1;i&gt;=0;i--){
      var a=asteroids[i];
      if(!dead){ a.x -= speed; a.ang += a.spin; }
      drawAsteroid(a);
      if(a.x + a.w/2 &lt; 0){ asteroids.splice(i,1); continue; }
      if(dead) continue;
      // collision
      var hx=HERO_X, hy=heroY, hs=HERO_SIZE;
      var cx=a.x, cy=a.y;
      var nearestX = Math.max(hx, Math.min(cx, hx+hs));
      var nearestY = Math.max(hy, Math.min(cy, hy+hs));
      var dx=cx-nearestX, dy=cy-nearestY;
      var distSq = dx*dx+dy*dy;
      if(distSq &lt; (a.r*0.8)*(a.r*0.8)){
        dead=true; explode(); flash=1; flashColor=&#x27;#f44&#x27;;
      } else {
        // near miss
        if(!a.near &amp;&amp; a.x &lt; hx &amp;&amp; distSq &lt; (a.r*0.8+14)*(a.r*0.8+14)){
          a.near=true;
          var bonus = 15*mult; score+=bonus; flash=0.7; flashColor=&#x27;#ffdb4d&#x27;; beep(1200,0.08,&#x27;sine&#x27;,0.12);
        }
        // scored (cleared)
        if(!a.scored &amp;&amp; a.x + a.w/2 &lt; hx){
          a.scored=true;
          if(!onGround){
            comboSinceLand++;
            if(comboSinceLand%3===0){ mult*=2; starBurst(); }
          }
          score += (10*mult);
        }
      }
    }

    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.03;
      if(p.life&lt;=0){ particles.splice(i,1); continue; }
      ctx.globalAlpha=p.life; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,6.28); ctx.fill();
    }
    ctx.globalAlpha=1;

    // burst stars
    for(var i=stars.length-1;i&gt;=0;i--){
      var s=stars[i]; s.life-=0.025; if(s.life&lt;=0){stars.splice(i,1); continue;}
      ctx.globalAlpha=s.life; ctx.fillStyle=&#x27;#fff&#x27;;
      drawStar(s.x,s.y,s.r*3,s.r); 
    }
    ctx.globalAlpha=1;

    // hero
    if(dead){ deadT+=0.05; }
    drawHero();

    // ground
    drawGround();
    // equalizer
    drawEqualizer();

    // flash
    if(flash&gt;0){ ctx.globalAlpha=flash*0.4; ctx.fillStyle=flashColor; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; flash-=0.05; }

    updateHUD();

    if(dead &amp;&amp; deadT&gt;1.2){ running=false; endGame(); return; }
    animId = requestAnimationFrame(tick);
  }

  function drawAsteroid(a){
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.ang);
    ctx.shadowColor=a.color; ctx.shadowBlur=14;
    ctx.beginPath();
    var n=a.verts.length;
    for(var i=0;i&lt;n;i++){
      var ang=(i/n)*6.28; var rr=(a.w/2)*a.verts[i];
      var px=Math.cos(ang)*rr, py=Math.sin(ang)*rr*(a.h/a.w);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=a.color; ctx.fill();
    ctx.shadowBlur=0; ctx.strokeStyle=&#x27;rgba(255,255,255,0.5)&#x27;; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }

  function drawHero(){
    ctx.save();
    var cx=HERO_X+HERO_SIZE/2, cy=heroY+HERO_SIZE/2;
    ctx.translate(cx,cy);
    if(dead){ ctx.rotate(deadT*8); ctx.globalAlpha=Math.max(0,1-deadT); }
    // platform
    ctx.fillStyle=&#x27;rgba(120,200,255,0.7)&#x27;;
    ctx.beginPath(); ctx.ellipse(0,HERO_SIZE/2+2,HERO_SIZE/2+4,5,0,0,6.28); ctx.fill();
    // body glow
    ctx.shadowColor=&#x27;#4df6ff&#x27;; ctx.shadowBlur=18;
    ctx.fillStyle=&#x27;#eaf6ff&#x27;;
    ctx.beginPath(); ctx.arc(0,-2,HERO_SIZE/2-4,0,6.28); ctx.fill(); // helmet
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#4df6ff&#x27;;
    ctx.beginPath(); ctx.arc(3,-3,5,0,6.28); ctx.fill(); // visor
    ctx.fillStyle=&#x27;#cfe&#x27;;
    ctx.fillRect(-HERO_SIZE/2+4,2,HERO_SIZE-8,HERO_SIZE/2-4); // torso
    ctx.restore();
  }

  function drawGround(){
    var g=ctx.createLinearGradient(0,H-GROUND_H,0,H);
    g.addColorStop(0,&#x27;#2a0850&#x27;); g.addColorStop(1,&#x27;#100025&#x27;);
    ctx.fillStyle=g; ctx.fillRect(0,H-GROUND_H,W,GROUND_H);
    ctx.strokeStyle=&#x27;#7a4dff&#x27;; ctx.lineWidth=2; ctx.shadowColor=&#x27;#7a4dff&#x27;; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.moveTo(0,H-GROUND_H); ctx.lineTo(W,H-GROUND_H); ctx.stroke(); ctx.shadowBlur=0;
  }

  function drawEqualizer(){
    eqPhase+=0.15;
    var bars=32, bw=W/bars;
    for(var i=0;i&lt;bars;i++){
      var amp=(Math.sin(eqPhase+i*0.6)*0.5+0.5)*(Math.sin(eqPhase*0.7+i)*0.5+0.5);
      var bh=6+amp*(GROUND_H-14);
      ctx.fillStyle=&#x27;rgba(&#x27;+(70+i*4%180)+&#x27;,200,255,0.55)&#x27;;
      ctx.fillRect(i*bw+2, H-bh, bw-4, bh);
    }
  }

  function drawStar(x,y,R,r){
    ctx.beginPath();
    for(var i=0;i&lt;10;i++){
      var ang=(i/10)*6.28 - Math.PI/2; var rad=(i%2===0)?R:r;
      var px=x+Math.cos(ang)*rad, py=y+Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawStatic(){
    ctx.clearRect(0,0,W,H);
    var bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,&#x27;#0a0030&#x27;); bg.addColorStop(1,&#x27;#12003a&#x27;);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    for(var i=0;i&lt;neb.length;i++){ var n=neb[i]; var grd=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r); grd.addColorStop(0,n.c+&#x27;55&#x27;); grd.addColorStop(1,n.c+&#x27;00&#x27;); ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.28); ctx.fill(); }
    ctx.fillStyle=&#x27;#8890c0&#x27;; for(var i=0;i&lt;far.length;i++){var s=far[i]; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();}
    ctx.fillStyle=&#x27;#cfd6ff&#x27;; for(var i=0;i&lt;mid.length;i++){var s=mid[i]; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();}
    heroY = H-GROUND_H-HERO_SIZE; dead=false; deadT=0;
    drawHero(); drawGround(); drawEqualizer();
    ctx.fillStyle=&#x27;#cfd6ff&#x27;; ctx.font=&#x27;bold 22px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;Press Start to launch&#x27;, W/2, H/2-20);
    ctx.textAlign=&#x27;left&#x27;;
  }

  function endGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId); animId=null;}
    ctx.fillStyle=&#x27;rgba(6,0,26,0.75)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#4df6ff&#x27;; ctx.font=&#x27;bold 30px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-14);
    ctx.fillStyle=&#x27;#ffdb4d&#x27;; ctx.font=&#x27;bold 22px system-ui&#x27;;
    ctx.fillText(&#x27;Score: &#x27;+Math.floor(score), W/2, H/2+22);
    ctx.textAlign=&#x27;left&#x27;;
  }

  function startGame(){
    if(running) return;
    ac();
    reset();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(animId){cancelAnimationFrame(animId); animId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;mousedown&#x27;, function(){ jump(); });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  drawStatic();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
