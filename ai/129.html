<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Froggy Fever</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d1a12; color: #eafff0; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg,#7CFC00,#00e676,#ffd700); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .instructions { font-size: 16px; color: #bfe9cc; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 26px; font-weight: 800; color: #ffd700; margin: 0; transition: transform .1s; }
  .score.pop { transform: scale(1.6); text-shadow: 0 0 16px #ffd700; }
  .field { position: relative; width: 660px; height: 468px; flex-shrink: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.5); border: 3px solid #123; }
  .lane { position: absolute; left: 0; width: 100%; overflow: hidden; }
  .lane-label { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: 800; letter-spacing: 2px; opacity: .28; pointer-events: none; color: #fff; }
  .safe { background: repeating-linear-gradient(45deg,#ffd700 0 14px,#ffcf33 14px 28px); }
  .safe .lane-label { color:#5a3d00; opacity:.55; }
  .grass { background: linear-gradient(#3aa856,#2e8c47); }
  .grass .lane-label { color:#123d1c; }
  .water { background: linear-gradient(#1b8ca8,#0f6f9c); }
  .road { background: linear-gradient(#2b2b33,#1c1c22); }
  .obj { position: absolute; will-change: transform; }
  .log { border-radius: 12px; background: linear-gradient(#8a5a2b,#6b4420); box-shadow: inset 0 3px 0 rgba(255,255,255,.15), inset 0 -4px 0 rgba(0,0,0,.25); }
  .log::before,.log::after{content:&quot;&quot;;position:absolute;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#5a3616;box-shadow:inset 0 0 0 3px #7a4a22;}
  .log::before{left:6px;} .log::after{right:6px;}
  .car { border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size: 22px; box-shadow: inset 0 3px 0 rgba(255,255,255,.3), 0 3px 6px rgba(0,0,0,.4); }
  .car .light{position:absolute;top:50%;transform:translateY(-50%);width:6px;height:8px;border-radius:2px;background:#fff8c0;box-shadow:0 0 8px #fff8a0;}
  .frog { position: absolute; z-index: 20; transition: transform .07s; }
  .frog svg { display:block; filter: drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
  .frog.hit svg { animation: splat .5s ease-out; }
  @keyframes splat { 0%{transform:scale(1,1)} 30%{transform:scale(1.5,.4)} 60%{transform:scale(1.2,.6)} 100%{transform:scale(1,1)} }
  .frog.hit svg .body { fill:#ff3b3b !important; }
  .banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:50; background:rgba(4,20,10,.7); color:#eafff0; font-weight:800; text-align:center; }
  .banner .big{font-size:30px; color:#ffd700;}
  .banner .sub{font-size:16px; margin-top:6px; color:#bfe9cc;}
  .hidden{display:none;}
  .ripple{position:absolute;border:2px solid rgba(255,255,255,.25);border-radius:50%;pointer-events:none;}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Froggy Fever&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop up with the arrow keys (or swipe) to cross the log river — ride the drifting logs, don&#x27;t fall in — then dodge the highway traffic to reach the golden zone. Each safe crossing scores a point and speeds things up!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;div class=&quot;big&quot;&gt;Press Start below&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Get Froggy across the river and road!&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 52, COLS = 660 / CELL | 0;   // 12 cols
  var COL_W = 660 / 12;                    // 55
  COLS = 12;
  var ROWS = 9;                            // 0 safe(top),1-3 water,4 median,5-7 road,8 start grass
  var FIELD_W = 660, FIELD_H = 468;
  var ROW_H = FIELD_H / ROWS;              // 52
  var FROG = 40;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var scoreBox = document.querySelector(&#x27;.score&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);

  var running=false, animId=null, lastT=0;
  var score=0, frog={col:5,row:ROWS-1,onLog:null,x:0}, frogEl=null;
  var lanes=[];  // per row config

  // Row types
  var LAYOUT = [&#x27;safe&#x27;,&#x27;water&#x27;,&#x27;water&#x27;,&#x27;water&#x27;,&#x27;grass&#x27;,&#x27;road&#x27;,&#x27;road&#x27;,&#x27;road&#x27;,&#x27;grass&#x27;];
  var LABELS = {1:&#x27;&#x27;,2:&#x27;LOG RIVER&#x27;,3:&#x27;&#x27;,5:&#x27;&#x27;,6:&#x27;DANGER ROAD&#x27;,7:&#x27;&#x27;};

  function laneY(row){ return row*ROW_H; }

  function buildField(){
    field.querySelectorAll(&#x27;.lane&#x27;).forEach(function(l){l.remove();});
    lanes=[];
    var carColors=[&#x27;#ff4d6d&#x27;,&#x27;#ffd166&#x27;,&#x27;#06d6a0&#x27;,&#x27;#4cc9f0&#x27;,&#x27;#f72585&#x27;,&#x27;#ffb703&#x27;];
    var diff = Math.floor(score/3); // ramps difficulty
    for(var r=0;r&lt;ROWS;r++){
      var type=LAYOUT[r];
      var lane=document.createElement(&#x27;div&#x27;);
      lane.className=&#x27;lane &#x27;+type;
      lane.style.top=laneY(r)+&#x27;px&#x27;;
      lane.style.height=ROW_H+&#x27;px&#x27;;
      if(LABELS[r]){ var lb=document.createElement(&#x27;div&#x27;); lb.className=&#x27;lane-label&#x27;; lb.textContent=LABELS[r]; lane.appendChild(lb); }
      field.appendChild(lane);
      var conf={row:r,type:type,el:lane,objs:[]};
      if(type===&#x27;water&#x27;){
        conf.dir=(r%2===0)?1:-1;
        conf.speed=(28+diff*6)*conf.dir;
        var logLen=Math.max(2, 3 - Math.floor(diff/2)); // logs shrink
        var count=2;
        var w=logLen*COL_W - 10;
        var gap=FIELD_W/count;
        for(var j=0;j&lt;count;j++){
          var el=document.createElement(&#x27;div&#x27;);
          el.className=&#x27;obj log&#x27;;
          el.style.width=w+&#x27;px&#x27;; el.style.height=(ROW_H-14)+&#x27;px&#x27;;
          el.style.top=&#x27;7px&#x27;;
          lane.appendChild(el);
          conf.objs.push({x:j*gap+(r*40)%gap, w:w, el:el});
        }
      } else if(type===&#x27;road&#x27;){
        conf.dir=(r%2===0)?-1:1;
        conf.speed=(70+diff*14)*conf.dir;
        var vcount=2+Math.min(2,Math.floor(diff/1));
        vcount=Math.min(vcount,3);
        var vw=COL_W*1.4;
        var vgap=FIELD_W/vcount;
        for(var k=0;k&lt;vcount;k++){
          var c=document.createElement(&#x27;div&#x27;);
          c.className=&#x27;obj car&#x27;;
          c.style.width=vw+&#x27;px&#x27;; c.style.height=(ROW_H-14)+&#x27;px&#x27;;
          c.style.top=&#x27;7px&#x27;;
          c.style.background=carColors[(r*3+k)%carColors.length];
          c.textContent = (k%3===0)?&#x27;🚗&#x27;:(k%3===1)?&#x27;🚚&#x27;:&#x27;🏍️&#x27;;
          var lite=document.createElement(&#x27;div&#x27;); lite.className=&#x27;light&#x27;;
          lite.style[conf.dir&gt;0?&#x27;right&#x27;:&#x27;left&#x27;]=&#x27;2px&#x27;;
          c.appendChild(lite);
          lane.appendChild(c);
          conf.objs.push({x:k*vgap+(r*25)%vgap, w:vw, el:c});
        }
      }
      lanes.push(conf);
    }
    positionObjs();
  }

  function positionObjs(){
    lanes.forEach(function(l){ l.objs.forEach(function(o){ o.el.style.transform=&#x27;translateX(&#x27;+o.x+&#x27;px)&#x27;; }); });
  }

  function makeFrog(){
    if(frogEl) frogEl.remove();
    frogEl=document.createElement(&#x27;div&#x27;);
    frogEl.className=&#x27;frog&#x27;;
    frogEl.style.width=FROG+&#x27;px&#x27;; frogEl.style.height=FROG+&#x27;px&#x27;;
    frogEl.innerHTML=&#x27;&lt;svg width=&quot;&#x27;+FROG+&#x27;&quot; height=&quot;&#x27;+FROG+&#x27;&quot; viewBox=&quot;0 0 40 40&quot;&gt;&#x27;
      +&#x27;&lt;ellipse class=&quot;body&quot; cx=&quot;20&quot; cy=&quot;24&quot; rx=&quot;15&quot; ry=&quot;12&quot; fill=&quot;#5ed845&quot;/&gt;&#x27;
      +&#x27;&lt;circle class=&quot;body&quot; cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;7&quot; fill=&quot;#5ed845&quot;/&gt;&#x27;
      +&#x27;&lt;circle class=&quot;body&quot; cx=&quot;29&quot; cy=&quot;11&quot; r=&quot;7&quot; fill=&quot;#5ed845&quot;/&gt;&#x27;
      +&#x27;&lt;circle cx=&quot;11&quot; cy=&quot;10&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;29&quot; cy=&quot;10&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&#x27;
      +&#x27;&lt;circle cx=&quot;12&quot; cy=&quot;11&quot; r=&quot;2&quot; fill=&quot;#111&quot;/&gt;&lt;circle cx=&quot;30&quot; cy=&quot;11&quot; r=&quot;2&quot; fill=&quot;#111&quot;/&gt;&#x27;
      +&#x27;&lt;path d=&quot;M12 26 Q20 33 28 26&quot; stroke=&quot;#1e6b1e&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27;
      +&#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;20&quot; rx=&quot;4&quot; ry=&quot;2.5&quot; fill=&quot;#8fff70&quot;/&gt;&#x27;
      +&#x27;&lt;/svg&gt;&#x27;;
    field.appendChild(frogEl);
  }

  function frogX(){
    if(frog.onLog) return frog.x;
    return frog.col*COL_W + (COL_W-FROG)/2;
  }
  function paintFrog(){
    var x=frogX();
    var y=laneY(frog.row)+(ROW_H-FROG)/2;
    frogEl.style.transform=&#x27;translate(&#x27;+x+&#x27;px,&#x27;+y+&#x27;px)&#x27;;
  }

  function resetFrog(){
    frog.col=5; frog.row=ROWS-1; frog.onLog=null; frog.x=0;
    paintFrog();
  }

  function ripple(x,y){
    var r=document.createElement(&#x27;div&#x27;); r.className=&#x27;ripple&#x27;;
    r.style.left=(x-6)+&#x27;px&#x27;; r.style.top=(y-6)+&#x27;px&#x27;; r.style.width=&#x27;12px&#x27;; r.style.height=&#x27;12px&#x27;;
    field.appendChild(r);
    var t=0; var id=setInterval(function(){ t++; var s=12+t*8; r.style.width=s+&#x27;px&#x27;; r.style.height=s+&#x27;px&#x27;; r.style.left=(x-s/2)+&#x27;px&#x27;; r.style.top=(y-s/2)+&#x27;px&#x27;; r.style.opacity=(1-t/10); if(t&gt;=10){clearInterval(id); r.remove();} },30);
  }

  function tick(ts){
    if(!running) return;
    if(!lastT) lastT=ts;
    var dt=Math.min(50,ts-lastT)/1000; lastT=ts;
    for(var i=0;i&lt;lanes.length;i++){
      var l=lanes[i];
      if(!l.speed) continue;
      for(var j=0;j&lt;l.objs.length;j++){
        var o=l.objs[j];
        o.x+=l.speed*dt;
        if(l.speed&gt;0 &amp;&amp; o.x&gt;FIELD_W) o.x=-o.w-Math.random()*80;
        else if(l.speed&lt;0 &amp;&amp; o.x+o.w&lt;0) o.x=FIELD_W+Math.random()*80;
        o.el.style.transform=&#x27;translateX(&#x27;+o.x+&#x27;px)&#x27;;
      }
    }
    // frog riding a log
    if(frog.onLog){
      frog.x+=frog.onLog.lane.speed*dt;
      if(frog.x &lt; -FROG || frog.x &gt; FIELD_W){ die(&#x27;road&#x27;); return; }
      paintFrog();
    }
    checkCollisions();
    animId=requestAnimationFrame(tick);
  }

  function checkCollisions(){
    var lane=lanes[frog.row];
    var fx=frogX(), fw=FROG;
    if(lane.type===&#x27;water&#x27;){
      // must be on a log
      var on=null;
      for(var i=0;i&lt;lane.objs.length;i++){
        var o=lane.objs[i];
        var cx=fx+fw/2;
        if(cx&gt;o.x+6 &amp;&amp; cx&lt;o.x+o.w-6){ on=o; break; }
      }
      if(on){
        if(!frog.onLog){ frog.onLog={obj:on,lane:lane}; frog.x=fx; }
      } else {
        if(frog.onLog===null){ splash(); return; }
      }
    } else {
      frog.onLog=null;
      if(lane.type===&#x27;road&#x27;){
        for(var k=0;k&lt;lane.objs.length;k++){
          var c=lane.objs[k];
          if(fx&lt; c.x+c.w-4 &amp;&amp; fx+fw&gt; c.x+4){ die(&#x27;road&#x27;); return; }
        }
      }
    }
  }

  function splash(){
    var x=frogX()+FROG/2, y=laneY(frog.row)+ROW_H/2;
    ripple(x,y);
    die(&#x27;water&#x27;);
  }

  function die(kind){
    beep(kind===&#x27;water&#x27;?200:120);
    frogEl.classList.add(&#x27;hit&#x27;);
    var wasRunning=running;
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    setTimeout(function(){
      frogEl.classList.remove(&#x27;hit&#x27;);
      resetFrog();
      if(wasRunning){ running=true; lastT=0; animId=requestAnimationFrame(tick); }
    },500);
  }

  function move(dc,dr){
    if(!running || frogEl.classList.contains(&#x27;hit&#x27;)) return;
    // if on a log and moving, detach for row change
    if(dr!==0 || dc!==0){
      var newCol, newX;
      if(frog.onLog){
        newX = frog.x + dc*COL_W;
        frog.col = Math.round(newX/COL_W);
      } else {
        frog.col += dc;
      }
      frog.col=Math.max(0,Math.min(COLS-1,frog.col));
      frog.row=Math.max(0,Math.min(ROWS-1,frog.row+dr));
      frog.onLog=null; // re-evaluate on landing
      beep(440+Math.random()*80,0.05);
      paintFrog();
      // immediately check if landed in water without log
      checkCollisions();
      if(frog.row===0){
        score++;
        scoreEl.textContent=score;
        scoreBox.classList.add(&#x27;pop&#x27;);
        beep(880,0.12);
        setTimeout(function(){scoreBox.classList.remove(&#x27;pop&#x27;);},150);
        resetFrog();
        buildField();
      }
    }
  }

  // audio
  var actx=null;
  function beep(freq,dur){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=freq; o.type=&#x27;square&#x27;;
      g.gain.value=0.06; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+(dur||0.08));
    }catch(e){}
  }

  function startGame(){
    if(running) return;
    banner.classList.add(&#x27;hidden&#x27;);
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    buildField();
    makeFrog();
    resetFrog();
    running=true; lastT=0;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    banner.querySelector(&#x27;.big&#x27;).textContent=&#x27;Paused&#x27;;
    banner.querySelector(&#x27;.sub&#x27;).textContent=&#x27;Score: &#x27;+score;
    banner.classList.remove(&#x27;hidden&#x27;);
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){move(0,-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){move(0,1);e.preventDefault();}
  });

  // swipe support
  var tsx=0,tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) move(dx&gt;0?1:-1,0);
    else move(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint (stopped)
  buildField();
  makeFrog();
  paintFrog();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
