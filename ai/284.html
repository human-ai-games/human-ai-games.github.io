<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍄 Gnome Grove</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a2a1a; color: #eaf5ea; overflow: hidden; }
  .game { width: 720px; height: 640px; margin: 0 auto; box-sizing: border-box; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; color: #ffe27a; text-shadow: 0 2px 4px #000; }
  .instructions { font-size: 16px; color: #cfe6cf; max-width: 660px; margin: 0; line-height: 1.3; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 20px; font-weight: 700; }
  .hud .lbl { color: #ffe27a; }
  .stage { display: flex; gap: 8px; align-items: flex-end; }
  .treewrap { width: 90px; height: 430px; display: flex; align-items: flex-end; justify-content: center; }
  .board { position: relative; width: 560px; height: 430px; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,.4); transition: background 1.2s linear; }
  .gnome { position: absolute; width: 76px; height: 90px; cursor: pointer; transform-origin: bottom center; }
  .toadstool { position: absolute; width: 76px; height: 34px; pointer-events: none; }
  @keyframes springUp { 0%{transform:translateY(70px) scaleY(.4);} 60%{transform:translateY(-8px) scaleY(1.08);} 80%{transform:translateY(3px) scaleY(.96);} 100%{transform:translateY(0) scaleY(1);} }
  @keyframes duck { 0%{transform:translateY(0) scaleY(1);} 100%{transform:translateY(70px) scaleY(.4);} }
  @keyframes squish { 0%{transform:translateY(0) scaleY(1);} 30%{transform:translateY(10px) scaleY(.6) scaleX(1.2);} 100%{transform:translateY(70px) scaleY(.3);} }
  @keyframes wave { 0%,100%{transform:rotate(0);} 50%{transform:rotate(-25deg);} }
  .rising { animation: springUp .35s cubic-bezier(.34,1.56,.64,1) forwards; }
  .ducking { animation: duck .3s ease-in forwards; }
  .squishing { animation: squish .35s ease-in forwards; }
  .arm { transform-origin: top center; animation: wave .6s ease-in-out infinite; }
  .particle { position: absolute; pointer-events: none; font-size: 20px; z-index: 20; }
  .combobadge { position: absolute; font-weight: 900; color: #fff; text-shadow: 0 0 8px #ffd54a, 0 2px 3px #000; pointer-events: none; z-index: 25; }
  @keyframes floatUp { 0%{transform:translateY(0) scale(.6); opacity:0;} 20%{opacity:1;transform:translateY(-6px) scale(1.2);} 100%{transform:translateY(-50px) scale(1); opacity:0;} }
  @keyframes partFly { 0%{opacity:1;} 100%{opacity:0;} }
  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-6px,3px);} 40%{transform:translate(5px,-4px);} 60%{transform:translate(-4px,2px);} 80%{transform:translate(3px,-2px);} }
  .shaking { animation: shake .3s; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:rgba(10,20,10,.72); z-index:40; color:#ffe27a; text-align:center; }
  .overlay h2 { font-size:34px; margin:0 0 8px; }
  .overlay p { font-size:20px; margin:4px; color:#eaf5ea; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍄 Gnome Grove&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack the gnomes as they pop up from the toadstools to score — chain quick hits for combo multipliers. Avoid the red-hat bomb gnomes, and use the Start button below before the 60-second forest chase runs out.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Score&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Combo&lt;/span&gt; &lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Time&lt;/span&gt; &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;div class=&quot;treewrap&quot;&gt;&lt;svg id=&quot;tree&quot; width=&quot;90&quot; height=&quot;430&quot; viewBox=&quot;0 0 90 430&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
    &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;h2&gt;🍄 Gnome Grove&lt;/h2&gt;&lt;p&gt;Press Start below to begin!&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var BOARD_W=560, BOARD_H=430, GW=76, GH=90;
var board=document.getElementById(&#x27;board&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;);
var comboEl=document.getElementById(&#x27;combo&#x27;);
var timeEl=document.getElementById(&#x27;time&#x27;);
var overlay=document.getElementById(&#x27;overlay&#x27;);
var treeSvg=document.getElementById(&#x27;tree&#x27;);

var running=false, score=0, timeLeft=60;
var spawnTimer=null, gameTimer=null, activeGnomes=[];
var combo=0, lastHitTime=0;

// ---- Gnome type definitions ----
var TYPES={
  sleepy:  {points:1, life:1500, color:&#x27;#7fa8d9&#x27;, hat:&#x27;#3f6fb0&#x27;, label:&#x27;😴&#x27;},
  giggle:  {points:2, life:1300, color:&#x27;#8fd97f&#x27;, hat:&#x27;#4faa4f&#x27;, label:&#x27;😆&#x27;},
  speedy:  {points:3, life:650,  color:&#x27;#f2c14e&#x27;, hat:&#x27;#d99a1f&#x27;, label:&#x27;💨&#x27;},
  golden:  {points:5, life:900,  color:&#x27;#ffe27a&#x27;, hat:&#x27;#e0b020&#x27;, label:&#x27;✨&#x27;, golden:true},
  bomb:    {points:-3,life:1400, color:&#x27;#e05555&#x27;, hat:&#x27;#b02020&#x27;, label:&#x27;💣&#x27;, bomb:true}
};

// ---- Audio (procedural woodland soundscape) ----
var audioCtx=null, ambientNodes=[], chirpTimer=null, chirpRate=1400;
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
}
function playChirp(){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=&#x27;sine&#x27;;
  var base=1400+Math.random()*900;
  o.frequency.setValueAtTime(base,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(base*1.4,audioCtx.currentTime+0.08);
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.06,audioCtx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.18);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.2);
}
function playRustle(){
  if(!audioCtx) return;
  var bufSize=audioCtx.sampleRate*0.25;
  var buf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  var d=buf.getChannelData(0);
  for(var i=0;i&lt;bufSize;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2); }
  var src=audioCtx.createBufferSource(); src.buffer=buf;
  var f=audioCtx.createBiquadFilter(); f.type=&#x27;bandpass&#x27;; f.frequency.value=2500;
  var g=audioCtx.createGain(); g.gain.value=0.04;
  src.connect(f); f.connect(g); g.connect(audioCtx.destination);
  src.start();
}
function scheduleChirps(){
  if(!running) return;
  if(Math.random()&lt;0.7) playChirp(); else playRustle();
  chirpTimer=setTimeout(scheduleChirps, chirpRate*(0.6+Math.random()*0.8));
}
function playHitSound(pts){
  if(!audioCtx) return;
  var o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=&#x27;triangle&#x27;;
  var f= pts&lt;0?200: 500+pts*80;
  o.frequency.setValueAtTime(f,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(pts&lt;0?90:f*2,audioCtx.currentTime+0.15);
  g.gain.setValueAtTime(0.18,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.25);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+0.26);
}

// ---- Gnome SVG builder ----
function gnomeSVG(t){
  var c=TYPES[t];
  var glow = c.golden ? &#x27;&lt;circle cx=&quot;38&quot; cy=&quot;52&quot; r=&quot;42&quot; fill=&quot;#fff6c0&quot; opacity=&quot;0.5&quot;/&gt;&#x27; : &#x27;&#x27;;
  return &#x27;&lt;svg width=&quot;76&quot; height=&quot;90&quot; viewBox=&quot;0 0 76 90&quot;&gt;&#x27;
    + glow
    + &#x27;&lt;ellipse cx=&quot;38&quot; cy=&quot;80&quot; rx=&quot;24&quot; ry=&quot;8&quot; fill=&quot;rgba(0,0,0,0.25)&quot;/&gt;&#x27;
    + &#x27;&lt;rect x=&quot;22&quot; y=&quot;46&quot; width=&quot;32&quot; height=&quot;34&quot; rx=&quot;14&quot; fill=&quot;&#x27;+c.color+&#x27;&quot;/&gt;&#x27;  // body
    + &#x27;&lt;circle cx=&quot;38&quot; cy=&quot;40&quot; r=&quot;16&quot; fill=&quot;#f4d5b0&quot;/&gt;&#x27;                            // head
    + &#x27;&lt;circle cx=&quot;32&quot; cy=&quot;38&quot; r=&quot;2.4&quot; fill=&quot;#333&quot;/&gt;&lt;circle cx=&quot;44&quot; cy=&quot;38&quot; r=&quot;2.4&quot; fill=&quot;#333&quot;/&gt;&#x27;
    + &#x27;&lt;path d=&quot;M31 46 Q38 51 45 46&quot; stroke=&quot;#a05&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot;/&gt;&#x27;  // smile
    + &#x27;&lt;ellipse cx=&quot;38&quot; cy=&quot;50&quot; rx=&quot;9&quot; ry=&quot;6&quot; fill=&quot;#eee&quot;/&gt;&#x27;                        // beard
    + &#x27;&lt;path d=&quot;M20 30 L38 4 L56 30 Z&quot; fill=&quot;&#x27;+c.hat+&#x27;&quot;/&gt;&#x27;                          // hat
    + &#x27;&lt;circle cx=&quot;38&quot; cy=&quot;6&quot; r=&quot;3.5&quot; fill=&quot;#fff&quot;/&gt;&#x27;
    + &#x27;&lt;g class=&quot;arm&quot;&gt;&lt;rect x=&quot;15&quot; y=&quot;52&quot; width=&quot;8&quot; height=&quot;18&quot; rx=&quot;4&quot; fill=&quot;&#x27;+c.color+&#x27;&quot;/&gt;&lt;/g&gt;&#x27;  // waving arm
    + &#x27;&lt;rect x=&quot;53&quot; y=&quot;52&quot; width=&quot;8&quot; height=&quot;18&quot; rx=&quot;4&quot; fill=&quot;&#x27;+c.color+&#x27;&quot;/&gt;&#x27;
    + &#x27;&lt;text x=&quot;60&quot; y=&quot;26&quot; font-size=&quot;16&quot;&gt;&#x27;+c.label+&#x27;&lt;/text&gt;&#x27;
    + &#x27;&lt;/svg&gt;&#x27;;
}
function toadstoolSVG(){
  return &#x27;&lt;svg width=&quot;76&quot; height=&quot;34&quot; viewBox=&quot;0 0 76 34&quot;&gt;&lt;rect x=&quot;30&quot; y=&quot;14&quot; width=&quot;16&quot; height=&quot;20&quot; rx=&quot;5&quot; fill=&quot;#f0e6cf&quot;/&gt;&#x27;
    + &#x27;&lt;ellipse cx=&quot;38&quot; cy=&quot;14&quot; rx=&quot;34&quot; ry=&quot;14&quot; fill=&quot;#d94b4b&quot;/&gt;&#x27;
    + &#x27;&lt;circle cx=&quot;24&quot; cy=&quot;12&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;46&quot; cy=&quot;9&quot; r=&quot;5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;54&quot; cy=&quot;16&quot; r=&quot;3.5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;34&quot; cy=&quot;17&quot; r=&quot;3&quot; fill=&quot;#fff&quot;/&gt;&lt;/svg&gt;&#x27;;
}

// ---- Spawning ----
function typeForTime(){
  var elapsed=60-timeLeft; // 0..60
  var prog=elapsed/60;
  var roll=Math.random();
  // more valuable / risky gnomes later
  var bombChance=0.10+prog*0.15;
  var goldChance=0.05+prog*0.10;
  var speedChance=0.10+prog*0.15;
  if(roll&lt;bombChance) return &#x27;bomb&#x27;;
  if(roll&lt;bombChance+goldChance) return &#x27;golden&#x27;;
  if(roll&lt;bombChance+goldChance+speedChance) return &#x27;speedy&#x27;;
  if(roll&lt;bombChance+goldChance+speedChance+0.30) return &#x27;giggle&#x27;;
  return &#x27;sleepy&#x27;;
}

function spawnGnome(){
  if(!running) return;
  var t=typeForTime(), c=TYPES[t];
  var x=Math.random()*(BOARD_W-GW-10)+5;
  var y=Math.random()*(BOARD_H-GH-40)+20;

  var stool=document.createElement(&#x27;div&#x27;);
  stool.className=&#x27;toadstool&#x27;;
  stool.style.left=x+&#x27;px&#x27;;
  stool.style.top=(y+GH-24)+&#x27;px&#x27;;
  stool.innerHTML=toadstoolSVG();
  board.appendChild(stool);

  var g=document.createElement(&#x27;div&#x27;);
  g.className=&#x27;gnome rising&#x27;;
  g.style.left=x+&#x27;px&#x27;;
  g.style.top=y+&#x27;px&#x27;;
  g.innerHTML=gnomeSVG(t);
  var alive=true;
  var deathTimer;

  function removeAll(){
    if(g.parentNode) g.parentNode.removeChild(g);
    if(stool.parentNode) stool.parentNode.removeChild(stool);
  }

  g.addEventListener(&#x27;mousedown&#x27;, function(ev){
    ev.stopPropagation();
    if(!alive||!running) return;
    alive=false;
    clearTimeout(deathTimer);
    hitGnome(t, x+GW/2, y+GH/2);
    g.className=&#x27;gnome squishing&#x27;;
    setTimeout(removeAll, 320);
  });

  board.appendChild(g);

  deathTimer=setTimeout(function(){
    if(!alive) return;
    alive=false;
    g.className=&#x27;gnome ducking&#x27;;
    setTimeout(removeAll, 320);
    // missing a gnome breaks combo
    combo=0; updateCombo();
  }, c.life);

  activeGnomes.push({el:g,stool:stool,remove:removeAll,timer:deathTimer});
}

// ---- Scoring / combo ----
function hitGnome(t, cx, cy){
  var c=TYPES[t];
  var now=Date.now();
  if(c.bomb){
    score+=c.points;
    combo=0;
    burst(cx,cy,true);
    doShake();
    playHitSound(-1);
    updateScore(); updateCombo(); updateTree();
    return;
  }
  if(now-lastHitTime&lt;=1500) combo++; else combo=1;
  lastHitTime=now;
  var mult=Math.max(1,combo);
  var pts=c.points*mult;
  score+=pts;
  burst(cx,cy,false);
  doShake();
  playHitSound(c.points);
  if(combo&gt;=2) showCombo(cx,cy,combo);
  updateScore(); updateCombo(); updateTree();
}

function updateScore(){ scoreEl.textContent=score; }
function updateCombo(){ comboEl.textContent=&#x27;x&#x27;+Math.max(1,combo); }

function showCombo(x,y,m){
  var b=document.createElement(&#x27;div&#x27;);
  b.className=&#x27;combobadge&#x27;;
  b.textContent=&#x27;x&#x27;+m;
  b.style.left=x+&#x27;px&#x27;; b.style.top=y+&#x27;px&#x27;;
  b.style.fontSize=(18+m*4)+&#x27;px&#x27;;
  b.style.animation=&#x27;floatUp 1s ease-out forwards&#x27;;
  board.appendChild(b);
  setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },1000);
}

function burst(x,y,bad){
  var icons = bad ? [&#x27;💥&#x27;,&#x27;🔥&#x27;,&#x27;💢&#x27;] : [&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;🪙&#x27;,&#x27;💫&#x27;,&#x27;🌟&#x27;];
  var n=bad?8:12;
  for(var i=0;i&lt;n;i++){
    var p=document.createElement(&#x27;div&#x27;);
    p.className=&#x27;particle&#x27;;
    p.textContent=icons[Math.floor(Math.random()*icons.length)];
    p.style.left=x+&#x27;px&#x27;; p.style.top=y+&#x27;px&#x27;;
    board.appendChild(p);
    (function(pp){
      var ang=Math.random()*Math.PI*2, dist=30+Math.random()*70;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      var start=null, dur=600+Math.random()*300;
      function anim(ts){
        if(!start) start=ts;
        var t=(ts-start)/dur;
        if(t&gt;=1){ if(pp.parentNode) pp.parentNode.removeChild(pp); return; }
        pp.style.transform=&#x27;translate(&#x27;+(dx*t)+&#x27;px,&#x27;+(dy*t+t*t*40)+&#x27;px) scale(&#x27;+(1-t*0.5)+&#x27;)&#x27;;
        pp.style.opacity=1-t;
        requestAnimationFrame(anim);
      }
      requestAnimationFrame(anim);
    })(p);
  }
}

function doShake(){
  board.classList.remove(&#x27;shaking&#x27;);
  void board.offsetWidth;
  board.classList.add(&#x27;shaking&#x27;);
}

// ---- Score tree ----
function updateTree(){
  var s=Math.max(0,score);
  var growth=Math.min(1, s/60); // fully grown at 60 pts
  var trunkH=60+growth*180;
  var canopyR=15+growth*40;
  var canopyY=430-trunkH-canopyR+10;
  var leaves=&#x27;&#x27;;
  var clusters=Math.floor(1+growth*5);
  for(var i=0;i&lt;clusters;i++){
    var cx=45+Math.sin(i*1.7)*(canopyR*0.5);
    var cy=canopyY+Math.cos(i*1.3)*(canopyR*0.4);
    var r=canopyR*(0.6+0.4*Math.random()*0+ (i===0?0.4:0.25));
    leaves+=&#x27;&lt;circle cx=&quot;&#x27;+cx+&#x27;&quot; cy=&quot;&#x27;+cy+&#x27;&quot; r=&quot;&#x27;+(canopyR*0.7)+&#x27;&quot; fill=&quot;#3a8a3a&quot;/&gt;&#x27;;
  }
  treeSvg.innerHTML=
     &#x27;&lt;rect x=&quot;38&quot; y=&quot;&#x27;+(430-trunkH)+&#x27;&quot; width=&quot;14&quot; height=&quot;&#x27;+trunkH+&#x27;&quot; rx=&quot;6&quot; fill=&quot;#6b4423&quot;/&gt;&#x27;
    +&#x27;&lt;circle cx=&quot;45&quot; cy=&quot;&#x27;+canopyY+&#x27;&quot; r=&quot;&#x27;+canopyR+&#x27;&quot; fill=&quot;#2f7a2f&quot;/&gt;&#x27;
    + leaves
    +&#x27;&lt;circle cx=&quot;45&quot; cy=&quot;&#x27;+canopyY+&#x27;&quot; r=&quot;&#x27;+(canopyR*0.7)+&#x27;&quot; fill=&quot;#4aa84a&quot;/&gt;&#x27;;
}

// ---- Background time shift ----
function updateBackground(){
  var prog=(60-timeLeft)/60;
  var bg;
  if(prog&lt;0.4){ // day
    bg=&#x27;linear-gradient(#a8e6a3, #6bbf6b 60%, #4a8f3f)&#x27;;
  }else if(prog&lt;0.75){ // dusk
    bg=&#x27;linear-gradient(#e8a86b, #b06a8a 50%, #4a5a5f)&#x27;;
  }else{ // night
    bg=&#x27;linear-gradient(#1a2a4a, #2a2a4f 50%, #1a2f1a)&#x27;;
  }
  board.style.background=bg;
}

// ---- Game loop ----
function tick(){
  timeLeft--;
  if(timeLeft&lt;0) timeLeft=0;
  timeEl.textContent=timeLeft;
  updateBackground();
  // speed up soundscape + spawn as time runs low
  chirpRate=Math.max(400, 1400 - (60-timeLeft)*17);
  if(timeLeft&lt;=0){ endGame(); return; }
}

function scheduleSpawn(){
  if(!running) return;
  spawnGnome();
  var prog=(60-timeLeft)/60;
  var delay=Math.max(350, 900 - prog*500) * (0.7+Math.random()*0.6);
  spawnTimer=setTimeout(scheduleSpawn, delay);
}

function clearGnomes(){
  activeGnomes.forEach(function(a){ clearTimeout(a.timer); a.remove(); });
  activeGnomes=[];
  // clear stray particles/badges
  Array.prototype.slice.call(board.querySelectorAll(&#x27;.particle,.combobadge,.gnome,.toadstool&#x27;)).forEach(function(e){ e.remove(); });
}

function startGame(){
  if(running) return;
  running=true;
  score=0; timeLeft=60; combo=0; lastHitTime=0; chirpRate=1400;
  updateScore(); updateCombo(); updateTree();
  timeEl.textContent=timeLeft;
  overlay.style.display=&#x27;none&#x27;;
  clearGnomes();
  updateBackground();
  initAudio();
  if(audioCtx &amp;&amp; audioCtx.state===&#x27;suspended&#x27;) audioCtx.resume();
  scheduleChirps();
  scheduleSpawn();
  gameTimer=setInterval(tick,1000);
}

function stopGame(){
  running=false;
  clearTimeout(spawnTimer);
  clearInterval(gameTimer);
  clearTimeout(chirpTimer);
  clearGnomes();
}

function endGame(){
  running=false;
  clearTimeout(spawnTimer);
  clearInterval(gameTimer);
  clearTimeout(chirpTimer);
  clearGnomes();
  overlay.innerHTML=&#x27;&lt;h2&gt;🌙 Night falls!&lt;/h2&gt;&lt;p&gt;Final score: &#x27;+score+&#x27;&lt;/p&gt;&lt;p&gt;Press Start below to play again.&lt;/p&gt;&#x27;;
  overlay.style.display=&#x27;flex&#x27;;
}

updateTree();
updateBackground();

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
