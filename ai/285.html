<title>👽 Cow Abduction Defense</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>👽 Cow Abduction Defense</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a1a; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; text-align: center; }
  h1 { margin: 4px 0; font-size: 24px; font-weight: 700; color: #9df; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #bbb; max-width: 620px; margin: 4px auto; line-height: 1.35; }
  .wrap { position: relative; width: 640px; height: 460px; margin: 8px auto 0; }
  canvas { display: block; border-radius: 10px; background: #05051a; box-shadow: 0 0 24px #113 inset; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;👽 Cow Abduction Defense&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the swooping UFOs to zap them before they reach the cows on the ground. Zap 3+ in a row without a miss to build a glowing combo multiplier!&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 460, GROUND = 400;
var running = false, rafId = null;
var score, lives, wave, combo, streak, waveTimer, spawnTimer, spawnInterval, uffLife;
var ufos, particles, cows, stars, shake, gameEnded, endMsg, endWin, splashAnim;
var SESSION_MS = 60000, sessionTimer;

function initStars() {
  stars = [];
  for (var i = 0; i &lt; 3; i++) {
    var layer = [];
    var count = 40 - i * 8;
    for (var j = 0; j &lt; count; j++) {
      layer.push({ x: Math.random() * W, y: Math.random() * GROUND, s: (3 - i) * 0.6 + 0.4, sp: (i + 1) * 0.15 });
    }
    stars.push(layer);
  }
}

function initCows() {
  cows = [];
  var n = 5;
  for (var i = 0; i &lt; n; i++) {
    cows.push({ x: (i + 0.5) * (W / n), flash: 0 });
  }
}

function reset() {
  score = 0; lives = 3; wave = 1; combo = 1; streak = 0;
  waveTimer = 0; spawnTimer = 0; spawnInterval = 1400; uffLife = 4200;
  ufos = []; particles = []; shake = 0;
  gameEnded = false; endMsg = &#x27;&#x27;; endWin = false; splashAnim = 0;
  sessionTimer = 0;
  initStars(); initCows();
}

var COLORS = [&#x27;#ff5ea8&#x27;, &#x27;#5ecbff&#x27;, &#x27;#b45eff&#x27;, &#x27;#5eff9c&#x27;, &#x27;#ffd65e&#x27;, &#x27;#ff8f5e&#x27;];

function spawnUfo() {
  var col = COLORS[(Math.floor(Math.random() * COLORS.length))];
  ufos.push({
    x: 40 + Math.random() * (W - 80),
    y: -30,
    baseX: 0,
    t: Math.random() * Math.PI * 2,
    drift: 30 + Math.random() * 40,
    speed: (GROUND - -30) / (uffLife / 16.6),
    col: col,
    dead: false,
    pulse: Math.random() * Math.PI * 2
  });
  ufos[ufos.length - 1].baseX = ufos[ufos.length - 1].x;
}

function explode(x, y, col) {
  for (var i = 0; i &lt; 22; i++) {
    var a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
    particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, col: Math.random() &lt; 0.5 ? col : COLORS[Math.floor(Math.random() * COLORS.length)],
      r: 2 + Math.random() * 3
    });
  }
}

function update(dt) {
  sessionTimer += dt;
  // stars scroll
  for (var l = 0; l &lt; stars.length; l++) {
    for (var s = 0; s &lt; stars[l].length; s++) {
      var st = stars[l][s];
      st.y += st.sp * dt * 0.06;
      if (st.y &gt; GROUND) { st.y = 0; st.x = Math.random() * W; }
    }
  }
  // waves
  waveTimer += dt;
  if (waveTimer &gt; 9000) {
    waveTimer = 0; wave++;
    spawnInterval = Math.max(500, spawnInterval * 0.85);
    uffLife = Math.max(2200, uffLife * 0.9);
  }
  // spawn
  spawnTimer += dt;
  if (spawnTimer &gt; spawnInterval &amp;&amp; sessionTimer &lt; SESSION_MS) {
    spawnTimer = 0;
    spawnUfo();
  }
  // ufos
  for (var i = ufos.length - 1; i &gt;= 0; i--) {
    var u = ufos[i];
    u.t += dt * 0.004;
    u.pulse += dt * 0.008;
    u.y += u.speed;
    u.x = u.baseX + Math.sin(u.t) * u.drift;
    if (u.y &gt;= GROUND - 20) {
      // reached ground: find nearest cow
      var nearest = cows[0], nd = 1e9;
      for (var c = 0; c &lt; cows.length; c++) {
        var d = Math.abs(cows[c].x - u.x);
        if (d &lt; nd) { nd = d; nearest = cows[c]; }
      }
      nearest.flash = 1;
      lives--;
      streak = 0; combo = 1;
      shake = Math.min(shake + 8, 16);
      ufos.splice(i, 1);
      if (lives &lt;= 0) { endGame(false); return; }
    }
  }
  // particles
  for (var p = particles.length - 1; p &gt;= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= dt * 0.0022;
    if (pt.life &lt;= 0) particles.splice(p, 1);
  }
  // cow flash decay
  for (var cc = 0; cc &lt; cows.length; cc++) {
    if (cows[cc].flash &gt; 0) cows[cc].flash = Math.max(0, cows[cc].flash - dt * 0.003);
  }
  if (shake &gt; 0) shake = Math.max(0, shake - dt * 0.03);
  // end session
  if (sessionTimer &gt;= SESSION_MS &amp;&amp; ufos.length === 0 &amp;&amp; !gameEnded) {
    endGame(true);
  }
}

function endGame(win) {
  gameEnded = true; endWin = win; splashAnim = 0;
  endMsg = win ? &#x27;You Saved The Cows!&#x27; : &#x27;Game Over&#x27;;
}

function drawUfo(u) {
  ctx.save();
  ctx.translate(u.x, u.y);
  var glow = 0.5 + 0.5 * Math.sin(u.pulse);
  // beam glow underneath
  var g = ctx.createRadialGradient(0, 22, 2, 0, 22, 34);
  g.addColorStop(0, u.col);
  g.addColorStop(1, &#x27;rgba(0,0,0,0)&#x27;);
  ctx.globalAlpha = 0.35 + glow * 0.35;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 22, 30, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // dome
  ctx.fillStyle = &#x27;#bfe9ff&#x27;;
  ctx.beginPath(); ctx.arc(0, -4, 12, Math.PI, 0); ctx.fill();
  ctx.fillStyle = &#x27;rgba(255,255,255,0.5)&#x27;;
  ctx.beginPath(); ctx.ellipse(-3, -8, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = &#x27;#9aa4b8&#x27;;
  ctx.beginPath(); ctx.ellipse(0, 6, 26, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = &#x27;#6b7591&#x27;;
  ctx.beginPath(); ctx.ellipse(0, 10, 26, 6, 0, 0, Math.PI); ctx.fill();
  // lights
  for (var k = -2; k &lt;= 2; k++) {
    ctx.fillStyle = u.col;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(u.pulse + k);
    ctx.beginPath(); ctx.arc(k * 9, 10, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCow(c) {
  ctx.save();
  ctx.translate(c.x, GROUND + 16);
  var flash = c.flash;
  ctx.fillStyle = flash &gt; 0 ? &#x27;rgba(255,60,60,&#x27; + (0.4 + flash * 0.6) + &#x27;)&#x27; : &#x27;#fafafa&#x27;;
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
  // spots
  if (flash &lt;= 0) {
    ctx.fillStyle = &#x27;#333&#x27;;
    ctx.beginPath(); ctx.ellipse(-4, -1, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, 2, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  }
  // head
  ctx.fillStyle = flash &gt; 0 ? &#x27;rgba(255,60,60,&#x27; + (0.4 + flash * 0.6) + &#x27;)&#x27; : &#x27;#fafafa&#x27;;
  ctx.beginPath(); ctx.ellipse(-12, -5, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.strokeStyle = &#x27;#666&#x27;; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-7, 6); ctx.lineTo(-7, 12);
  ctx.moveTo(7, 6); ctx.lineTo(7, 12);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.save();
  var sx = 0, sy = 0;
  if (shake &gt; 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  ctx.translate(sx, sy);
  // sky
  var sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, &#x27;#0a0a2e&#x27;); sky.addColorStop(1, &#x27;#1a1140&#x27;);
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, GROUND + 20);
  // stars
  for (var l = 0; l &lt; stars.length; l++) {
    ctx.fillStyle = [&#x27;#556&#x27;, &#x27;#99a&#x27;, &#x27;#fff&#x27;][l];
    for (var s = 0; s &lt; stars[l].length; s++) {
      var st = stars[l][s];
      ctx.beginPath(); ctx.arc(st.x, st.y, st.s, 0, Math.PI * 2); ctx.fill();
    }
  }
  // ground
  var gg = ctx.createLinearGradient(0, GROUND, 0, H);
  gg.addColorStop(0, &#x27;#2a7d3a&#x27;); gg.addColorStop(1, &#x27;#15501f&#x27;);
  ctx.fillStyle = gg; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = &#x27;#3a9d4a&#x27;; ctx.fillRect(-20, GROUND, W + 40, 4);
  // cows
  for (var c = 0; c &lt; cows.length; c++) drawCow(cows[c]);
  // ufos
  for (var i = 0; i &lt; ufos.length; i++) drawUfo(ufos[i]);
  // particles
  for (var p = 0; p &lt; particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD bar (not shaken)
  ctx.fillStyle = &#x27;rgba(10,12,30,0.6)&#x27;;
  ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.font = &#x27;bold 18px system-ui, sans-serif&#x27;;
  ctx.textAlign = &#x27;left&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
  ctx.fillText(&#x27;Score: &#x27; + score, 12, 17);
  // hearts
  ctx.textAlign = &#x27;right&#x27;;
  var hearts = &#x27;&#x27;;
  for (var h = 0; h &lt; 3; h++) hearts += (h &lt; lives ? &#x27;❤️&#x27; : &#x27;🖤&#x27;);
  ctx.fillText(hearts, W - 12, 17);
  // combo streak
  ctx.textAlign = &#x27;center&#x27;;
  ctx.font = &#x27;bold 16px system-ui, sans-serif&#x27;;
  if (combo &gt; 1) {
    var pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.008);
    ctx.fillStyle = &#x27;rgba(255,215,90,&#x27; + pulse + &#x27;)&#x27;;
    ctx.fillText(&#x27;🔥 x&#x27; + combo + &#x27; streak &#x27; + streak, W / 2, 17);
  } else {
    ctx.fillStyle = &#x27;#aab&#x27;;
    ctx.fillText(&#x27;Wave &#x27; + wave, W / 2, 17);
  }
  // time left bar
  var tl = Math.max(0, 1 - sessionTimer / SESSION_MS);
  ctx.fillStyle = &#x27;rgba(94,203,255,0.5)&#x27;;
  ctx.fillRect(0, 32, W * tl, 2);

  // splash
  if (gameEnded) {
    ctx.fillStyle = &#x27;rgba(5,5,20,0.78)&#x27;;
    ctx.fillRect(0, 0, W, H);
    var sc = Math.min(1, splashAnim / 400);
    var ease = 1 - Math.pow(1 - sc, 3);
    ctx.save();
    ctx.translate(W / 2, H / 2 - 20);
    ctx.scale(ease, ease);
    ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillStyle = endWin ? &#x27;#5eff9c&#x27; : &#x27;#ff5ea8&#x27;;
    ctx.font = &#x27;bold 42px system-ui, sans-serif&#x27;;
    ctx.fillText(endMsg, 0, 0);
    ctx.restore();
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.font = &#x27;bold 24px system-ui, sans-serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;Final Score: &#x27; + score, W / 2, H / 2 + 40);
    ctx.fillStyle = &#x27;#9ab&#x27;;
    ctx.font = &#x27;16px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Press Start below to play again&#x27;, W / 2, H / 2 + 74);
  }
}

var lastT = 0;
function loop(ts) {
  if (!running) return;
  if (!lastT) lastT = ts;
  var dt = Math.min(50, ts - lastT); lastT = ts;
  if (!gameEnded) update(dt);
  else splashAnim += dt;
  draw();
  rafId = requestAnimationFrame(loop);
}

cv.addEventListener(&#x27;click&#x27;, function (e) {
  if (!running || gameEnded) return;
  var r = cv.getBoundingClientRect();
  var mx = (e.clientX - r.left) * (W / r.width);
  var my = (e.clientY - r.top) * (H / r.height);
  var hitOne = false;
  for (var i = ufos.length - 1; i &gt;= 0; i--) {
    var u = ufos[i];
    var dx = mx - u.x, dy = my - (u.y + 4);
    if (dx * dx + dy * dy &lt; 30 * 30) {
      explode(u.x, u.y, u.col);
      ufos.splice(i, 1);
      streak++;
      if (streak &gt;= 3) combo = Math.min(5, Math.floor(streak / 3) + 1);
      score += combo;
      shake = Math.min(shake + 5, 14);
      hitOne = true;
      break;
    }
  }
  if (!hitOne) { streak = 0; combo = 1; }
});

function drawIdle() {
  reset();
  draw();
  ctx.fillStyle = &#x27;rgba(5,5,20,0.7)&#x27;;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = &#x27;#9df&#x27;;
  ctx.font = &#x27;bold 22px system-ui, sans-serif&#x27;;
  ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
  ctx.fillText(&#x27;Press Start below to defend the cows!&#x27;, W / 2, H / 2);
}

drawIdle();

function startGame() {
  reset();
  running = true; lastT = 0;
  spawnUfo();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  cancelAnimationFrame(rafId); rafId = null;
}

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
