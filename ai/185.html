<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Frog Dash: Lily to Lily</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a2e4d; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .hud .timer { color: #9be0ff; }
  .field { position: relative; width: 620px; height: 432px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .lane { position: absolute; left: 0; width: 100%; overflow: hidden; }
  .river-shimmer { position: absolute; inset: 0; pointer-events: none;

    animation: shimmer 4s linear infinite; }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: 200px 0; } }
  .obstacle { position: absolute; font-size: 34px; line-height: 1; user-select: none; will-change: left; text-align:center; }
  .hero { position: absolute; font-size: 34px; line-height: 1; z-index: 5; transition: left .08s, top .08s; user-select: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .pop { position: absolute; z-index: 10; font-weight: 800; color: #FFE86b; font-size: 22px; text-shadow: 0 2px 3px #063;
    pointer-events: none; animation: popup 1s ease-out forwards; }
  @keyframes popup { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-6px) scale(1.1); } 100% { transform: translateY(-40px) scale(1); opacity: 0; } }
  .splash { position: absolute; z-index: 9; font-size: 40px; pointer-events: none; animation: splash .6s ease-out forwards; }
  @keyframes splash { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
  .banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(6,30,50,.72); z-index: 20; font-size: 28px; font-weight: 800; color: #7CFC9E; text-align:center; }
  .banner span { font-size: 18px; color: #cfe8ff; font-weight: 600; margin-top: 8px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Frog Dash: Lily to Lily&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop the arrow keys (or swipe) to cross the river — ride the logs 🪵, dodge crocs 🐊 and whirlpools 🌀, and reach a top lily pad to score. Rack up points before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;&lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;timer&quot;&gt;⏱ &lt;span id=&quot;timer&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48, COLS = 12, LANES = 5;
  var ROWS = LANES + 2; // top lily row, 5 river lanes, bottom bank
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO = 34;
  var running = false, animId = null, lastT = 0;
  var hero = { col: Math.floor(COLS/2), row: ROWS-1 };
  var lanes = [], score = 0, timeLeft = 60, timerId = null, ridingVX = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var heroEl = null;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);

  var LANE_COLORS = [&#x27;#1c6fb0&#x27;,&#x27;#1a63a0&#x27;,&#x27;#175a92&#x27;,&#x27;#155084&#x27;,&#x27;#123f6d&#x27;];
  var TOP_COLOR = &#x27;#2e7d32&#x27;, BANK_COLOR = &#x27;#6d4c2b&#x27;;

  // lane types by index (0=top river lane): mix of logs/crocs/whirlpools
  var LANE_TYPES = [&#x27;log&#x27;,&#x27;croc&#x27;,&#x27;log&#x27;,&#x27;whirl&#x27;,&#x27;croc&#x27;];

  function speedMult() { return 1 + Math.min(score * 0.08, 1.6); }

  function buildField() {
    field.innerHTML = &#x27;&#x27;;
    lanes = [];
    // background rows
    for (var r = 0; r &lt; ROWS; r++) {
      var lane = document.createElement(&#x27;div&#x27;);
      lane.className = &#x27;lane&#x27;;
      lane.style.top = (r*CELL)+&#x27;px&#x27;;
      lane.style.height = CELL+&#x27;px&#x27;;
      if (r === 0) lane.style.background = TOP_COLOR;
      else if (r === ROWS-1) lane.style.background = BANK_COLOR;
      else lane.style.background = LANE_COLORS[r-1];
      field.appendChild(lane);
    }
    // lily pads on top
    for (var c = 1; c &lt; COLS; c += 2) {
      var pad = document.createElement(&#x27;div&#x27;);
      pad.className = &#x27;obstacle&#x27;;
      pad.textContent = &#x27;🍃&#x27;;
      pad.style.top = &#x27;7px&#x27;;
      pad.style.left = (c*CELL + (CELL-HERO)/2 - 4) + &#x27;px&#x27;;
      pad.style.fontSize = &#x27;30px&#x27;;
      field.appendChild(pad);
    }
    // shimmer overlay
    var sh = document.createElement(&#x27;div&#x27;);
    sh.className = &#x27;river-shimmer&#x27;;
    field.appendChild(sh);

    // build obstacle lanes
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var y = laneRow * CELL + (CELL - HERO)/2;
      var type = LANE_TYPES[i];
      var dir = (i % 2 === 0) ? 1 : -1;
      var baseSpeed = 40 + (i % 3) * 18; // px/sec
      var obstacles = [];
      var count = type === &#x27;whirl&#x27; ? 3 : (2 + (i % 2));
      var gap = FIELD_W / count;
      var emoji = type === &#x27;log&#x27; ? &#x27;🪵&#x27; : (type === &#x27;croc&#x27; ? &#x27;🐊&#x27; : &#x27;🌀&#x27;);
      var w = type === &#x27;log&#x27; ? CELL*2 : CELL; // logs are wide (rideable)
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + (i*37) % gap;
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.textContent = emoji;
        el.style.top = y + &#x27;px&#x27;;
        if (type === &#x27;log&#x27;) el.style.fontSize = &#x27;30px&#x27;;
        el.style.left = x + &#x27;px&#x27;;
        field.appendChild(el);
        obstacles.push({ x:x, w:w, el:el });
      }
      lanes.push({ y:y, dir:dir, speed:baseSpeed, type:type, w:0, obstacles:obstacles, whirlTimer:0 });
    }
    // hero
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    field.appendChild(heroEl);
  }

  function heroX() { return hero.col * CELL + (CELL - HERO)/2; }
  function heroY() { return hero.row * CELL + (CELL - HERO)/2; }
  var heroPixelX = 0;
  function paintHero() {
    heroPixelX = heroX();
    heroEl.style.left = heroPixelX + &#x27;px&#x27;;
    heroEl.style.top = heroY() + &#x27;px&#x27;;
  }
  function resetHero() {
    hero.col = Math.floor(COLS/2);
    hero.row = ROWS-1;
    ridingVX = 0;
    paintHero();
  }

  function popup(text, x, y) {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;pop&#x27;; p.textContent = text;
    p.style.left = x + &#x27;px&#x27;; p.style.top = y + &#x27;px&#x27;;
    field.appendChild(p);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 1000);
  }
  function splash(emoji, x, y) {
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;splash&#x27;; s.textContent = emoji;
    s.style.left = x + &#x27;px&#x27;; s.style.top = y + &#x27;px&#x27;;
    field.appendChild(s);
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 600);
  }

  function tick(t) {
    if (!running) return;
    if (!lastT) lastT = t;
    var dt = Math.min((t - lastT)/1000, 0.05);
    lastT = t;
    var mult = speedMult();

    // move obstacles
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      var v = lane.dir * lane.speed * mult;
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += v * dt;
        if (v &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -o.w;
        else if (v &lt; 0 &amp;&amp; o.x + o.w &lt; 0) o.x = FIELD_W;
        o.el.style.left = o.x + &#x27;px&#x27;;
      }
    }

    // hero interaction with current lane
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var lane = lanes[laneIdx];
      var hx = heroPixelX, hy = heroY();
      var onLog = false;
      for (var k = 0; k &lt; lane.obstacles.length; k++) {
        var o = lane.obstacles[k];
        var overlap = hx &lt; o.x + o.w &amp;&amp; hx + HERO &gt; o.x;
        if (!overlap) continue;
        if (lane.type === &#x27;croc&#x27;) { die(&#x27;🐊&#x27;); return; }
        if (lane.type === &#x27;log&#x27;) { onLog = true; ridingVX = lane.dir * lane.speed * mult; }
        if (lane.type === &#x27;whirl&#x27;) { die(&#x27;🌀&#x27;); return; }
      }
      // on a river lane you must be on a log; otherwise you&#x27;re in open water -&gt; drown
      if (lane.type === &#x27;log&#x27;) {
        if (onLog) {
          heroPixelX += ridingVX * dt;
          if (heroPixelX &lt; -HERO || heroPixelX &gt; FIELD_W) { die(&#x27;💦&#x27;); return; }
          heroEl.style.left = heroPixelX + &#x27;px&#x27;;
        } else {
          die(&#x27;💦&#x27;); return;
        }
      }
    }

    animId = requestAnimationFrame(tick);
  }

  function move(dc, dr) {
    if (!running) return;
    // when riding logs, use pixel position to derive column
    if (hero.row - 1 &gt;= 0 &amp;&amp; hero.row - 1 &lt; LANES &amp;&amp; lanes[hero.row-1].type === &#x27;log&#x27;) {
      hero.col = Math.max(0, Math.min(COLS-1, Math.round((heroPixelX - (CELL-HERO)/2)/CELL)));
    }
    hero.col = Math.max(0, Math.min(COLS-1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS-1, hero.row + dr));
    ridingVX = 0;
    paintHero();
    if (hero.row === 0) {
      score += 1;
      scoreEl.textContent = score;
      splash(&#x27;💥&#x27;, heroX(), heroY());
      popup(&#x27;RIBBIT! +1&#x27;, heroX()-20, heroY());
      setTimeout(resetHero, 120);
    }
  }

  function die(emoji) {
    splash(emoji, heroPixelX, heroY());
    resetHero();
  }

  function startGame() {
    if (running) return;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    timeLeft = 60; timerEl.textContent = &#x27;60&#x27;;
    buildField();
    resetHero();
    running = true; lastT = 0;
    animId = requestAnimationFrame(tick);
    timerId = setInterval(function(){
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft &lt;= 0) endGame();
    }, 1000);
  }
  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;banner&#x27;;
    b.innerHTML = &quot;Time&#x27;s up! 🐸&lt;span&gt;You scored &quot; + score + &quot; — press Start to play again&lt;/span&gt;&quot;;
    field.appendChild(b);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1,0); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { move(0,-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { move(0,1); e.preventDefault(); }
  });

  // swipe controls
  var tsx=0, tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if (Math.abs(dx) &lt; 20 &amp;&amp; Math.abs(dy) &lt; 20) return;
    if (Math.abs(dx) &gt; Math.abs(dy)) move(dx&gt;0?1:-1, 0);
    else move(0, dy&gt;0?1:-1);
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial paint
  buildField();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
