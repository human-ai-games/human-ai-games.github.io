<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 18px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#5fffb0,#5fd0ff,#c99bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9fb0d8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 620px; }
  .lives { font-size: 22px; letter-spacing: 2px; }

  .score { font-size: 22px; color: #eafff2; font-weight: 600; display: inline-block; }
  .score.pop { animation: pop 0.35s ease; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.6);color:#5fffb0;} 100%{transform:scale(1);} }
  .field { position: relative; width: 620px; height: 470px; flex-shrink: 0; background: radial-gradient(ellipse at 50% 30%, #12163a 0%, #05060f 80%); border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(90,120,255,0.15) inset; }
  #stars { position:absolute; inset:0; }

  .safe { box-shadow: 0 0 22px rgba(95,255,176,0.5) inset; }
  .safe-label { position:absolute; left:8px; font-size:11px; letter-spacing:2px; color:#5fffb0; opacity:0.7; }
  .obstacle { position: absolute; display:flex; align-items:center; justify-content:center; font-size: 30px; will-change: transform; }

  @keyframes hop { 0%{transform:scale(1,1);} 40%{transform:scale(0.7,1.35);} 70%{transform:scale(1.3,0.72);} 100%{transform:scale(1,1);} }
  .hero.hit { animation: wobble 0.5s ease; }
  @keyframes wobble { 0%,100%{transform:rotate(0);} 20%{transform:rotate(-22deg) scale(1.1);filter:drop-shadow(0 0 10px red);} 40%{transform:rotate(20deg);filter:drop-shadow(0 0 10px red);} 60%{transform:rotate(-14deg);} 80%{transform:rotate(10deg);} }
  .ripple { position:absolute; border:2px solid #5fffb0; border-radius:50%; pointer-events:none; z-index:4; animation: ripple 0.5s ease-out forwards; }
  @keyframes ripple { from{opacity:0.8;transform:scale(0.2);} to{opacity:0;transform:scale(2.2);} }
  .particle { position:absolute; width:6px; height:6px; border-radius:50%; pointer-events:none; z-index:8; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(3,4,15,0.82); z-index:20; opacity:0; pointer-events:none; transition:opacity 0.3s; }
  .overlay.show { opacity:1; }
  .overlay h2 { font-size:46px; margin:0; color:#ff5f7a; text-shadow:0 0 20px rgba(255,95,122,0.6); letter-spacing:3px; }
  .overlay p { font-size:20px; margin:8px 0 0; color:#e8ecff; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Space Frog&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys to hop your frog astronaut up through the alien traffic to the glowing planet. Dodge every ship — three hits and it&#x27;s game over. Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;🐸🐸🐸&lt;/div&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;stars&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;h2&gt;GAME OVER&lt;/h2&gt;&lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 47, COLS = 13, ROWS = 10; // row0 planet, row1..5 lanes*? ; we use 7 lanes region
  var FIELD_W = 620, FIELD_H = 470;
  // Layout: 10 rows tall. row 0 = top safe (planet). rows 1..8 = play. row 9 = bottom safe.
  var ROW_H = FIELD_H / ROWS; // 47
  var COL_W = FIELD_W / COLS;  // ~47.7
  var HERO = 34;

  // 5 themed lanes occupy rows 2..6 (leave row1 &amp; row7,8 as buffer? we want it snug)
  // We&#x27;ll place lanes on rows: 2,3,4,5,6. rows 1,7,8 are open (no obstacles) small breathers.
  var LANE_ROWS = [2,3,4,5,6];
  var themes = [
    { name:&#x27;METEOR BELT&#x27;,  emoji:[&#x27;☄️&#x27;,&#x27;🔥&#x27;],  color:&#x27;rgba(255,90,40,0.10)&#x27;, dir:1,  baseSpeed:1.6, count:2 },
    { name:&#x27;LASER HIGHWAY&#x27;,emoji:[&#x27;🛸&#x27;,&#x27;⚡&#x27;],  color:&#x27;rgba(80,255,180,0.10)&#x27;, dir:-1, baseSpeed:2.4, count:3 },
    { name:&#x27;NEBULA RIVER&#x27;, emoji:[&#x27;🌌&#x27;,&#x27;💫&#x27;],  color:&#x27;rgba(170,90,255,0.14)&#x27;, dir:1,  baseSpeed:1.1, count:2 },
    { name:&#x27;CARGO CONVOY&#x27;, emoji:[&#x27;🚀&#x27;,&#x27;📦&#x27;],  color:&#x27;rgba(255,200,60,0.10)&#x27;, dir:-1, baseSpeed:1.4, count:2 },
    { name:&#x27;UFO SQUADRON&#x27;, emoji:[&#x27;🛸&#x27;,&#x27;🌀&#x27;],  color:&#x27;rgba(90,200,255,0.12)&#x27;, dir:1,  baseSpeed:2.0, count:3 }
  ];

  var running=false, animId=null;
  var hero={col:Math.floor(COLS/2), row:ROWS-1};
  var heroEl=null;
  var lanes=[];
  var score=0, lives=3, crossings=0, difficulty=0;
  var field=document.getElementById(&#x27;field&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var scoreWrap=document.querySelector(&#x27;.score&#x27;);
  var livesEl=document.getElementById(&#x27;lives&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl=document.getElementById(&#x27;finalScore&#x27;);
  var canvas=document.getElementById(&#x27;stars&#x27;), ctx=canvas.getContext(&#x27;2d&#x27;);

  // ---- Sound ----
  var actx=null;
  function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } return actx; }
  function boing(){ var a=ac(); if(!a) return; var o=a.createOscillator(), g=a.createGain(); o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(300,a.currentTime); o.frequency.exponentialRampToValueAtTime(760,a.currentTime+0.12); o.frequency.exponentialRampToValueAtTime(420,a.currentTime+0.24); g.gain.setValueAtTime(0.25,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.3); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.3); }
  function buzz(){ var a=ac(); if(!a) return; var o=a.createOscillator(), g=a.createGain(); o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(200,a.currentTime); o.frequency.exponentialRampToValueAtTime(60,a.currentTime+0.3); g.gain.setValueAtTime(0.2,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.35); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.35); }

  // ---- Parallax stars ----
  var starLayers=[];
  function initStars(){
    starLayers=[];
    var specs=[{n:40,s:0.15,r:1,c:&#x27;#556&#x27;},{n:30,s:0.4,r:1.4,c:&#x27;#88a&#x27;},{n:20,s:0.8,r:2,c:&#x27;#cde&#x27;}];
    specs.forEach(function(sp){ var arr=[]; for(var i=0;i&lt;sp.n;i++){ arr.push({x:Math.random()*FIELD_W,y:Math.random()*FIELD_H}); } starLayers.push({stars:arr,speed:sp.s,r:sp.r,c:sp.c}); });
  }
  function drawStars(){
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    starLayers.forEach(function(L){
      ctx.fillStyle=L.c;
      L.stars.forEach(function(s){
        s.y+=L.speed; if(s.y&gt;FIELD_H){ s.y=0; s.x=Math.random()*FIELD_W; }
        ctx.beginPath(); ctx.arc(s.x,s.y,L.r,0,6.28); ctx.fill();
      });
    });
  }

  function buildStatic(){
    // remove old lanes / decor
    Array.prototype.slice.call(field.querySelectorAll(&#x27;.lane,.obstacle,.hero,.safe-label,.planet&#x27;)).forEach(function(e){ e.remove(); });
    // safe zones
    var top=document.createElement(&#x27;div&#x27;); top.className=&#x27;lane safe&#x27;;
    top.style.top=&#x27;0px&#x27;; top.style.height=ROW_H+&#x27;px&#x27;;
    top.style.background=&#x27;radial-gradient(circle at 50% 50%, rgba(95,255,176,0.25), rgba(95,255,176,0.05))&#x27;;
    field.appendChild(top);
    var planet=document.createElement(&#x27;div&#x27;); planet.className=&#x27;obstacle planet&#x27;; planet.textContent=&#x27;🪐&#x27;;
    planet.style.top=&#x27;2px&#x27;; planet.style.left=(FIELD_W/2-18)+&#x27;px&#x27;; planet.style.fontSize=&#x27;34px&#x27;; planet.style.filter=&#x27;drop-shadow(0 0 12px rgba(95,255,176,0.8))&#x27;;
    field.appendChild(planet);
    var bot=document.createElement(&#x27;div&#x27;); bot.className=&#x27;lane safe&#x27;;
    bot.style.top=((ROWS-1)*ROW_H)+&#x27;px&#x27;; bot.style.height=ROW_H+&#x27;px&#x27;;
    bot.style.background=&#x27;radial-gradient(circle at 50% 50%, rgba(95,255,176,0.22), rgba(95,255,176,0.04))&#x27;;
    field.appendChild(bot);
    // themed lane backgrounds
    for(var i=0;i&lt;LANE_ROWS.length;i++){
      var r=LANE_ROWS[i], th=themes[i];
      var l=document.createElement(&#x27;div&#x27;); l.className=&#x27;lane&#x27;;
      l.style.top=(r*ROW_H)+&#x27;px&#x27;; l.style.height=ROW_H+&#x27;px&#x27;; l.style.background=th.color;
      field.appendChild(l);
      var lbl=document.createElement(&#x27;div&#x27;); lbl.className=&#x27;safe-label&#x27;; lbl.textContent=th.name;
      lbl.style.top=(r*ROW_H+3)+&#x27;px&#x27;; lbl.style.color=&#x27;rgba(255,255,255,0.35)&#x27;;
      field.appendChild(lbl);
    }
  }

  function buildLanes(){
    lanes=[];
    for(var i=0;i&lt;LANE_ROWS.length;i++){
      var th=themes[i], r=LANE_ROWS[i];
      var y=r*ROW_H+(ROW_H-38)/2;
      var count=th.count+difficulty;
      var speed=th.baseSpeed+difficulty*0.35;
      var obs=[]; var gap=FIELD_W/count;
      for(var j=0;j&lt;count;j++){
        var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;obstacle&#x27;;
        el.textContent=th.emoji[j%th.emoji.length];
        el.style.top=y+&#x27;px&#x27;; el.style.width=&#x27;38px&#x27;; el.style.height=&#x27;38px&#x27;;
        field.appendChild(el);
        var x=j*gap+(i*17)%gap;
        obs.push({x:x,el:el});
      }
      lanes.push({y:y,dir:th.dir,speed:speed,obstacles:obs,spin:(i===4||i===1)});
    }
  }

  function makeHero(){
    if(heroEl&amp;&amp;heroEl.parentNode) heroEl.remove();
    heroEl=document.createElement(&#x27;div&#x27;); heroEl.className=&#x27;hero&#x27;; heroEl.textContent=&#x27;🐸&#x27;;
    heroEl.style.width=HERO+&#x27;px&#x27;; heroEl.style.height=HERO+&#x27;px&#x27;;
    field.appendChild(heroEl);
  }
  function paintHero(){
    var x=hero.col*COL_W+(COL_W-HERO)/2;
    var y=hero.row*ROW_H+(ROW_H-HERO)/2;
    heroEl.style.left=x+&#x27;px&#x27;; heroEl.style.top=y+&#x27;px&#x27;;
  }
  function resetHero(){ hero.col=Math.floor(COLS/2); hero.row=ROWS-1; paintHero(); }

  function ripple(){
    var x=hero.col*COL_W+COL_W/2, y=hero.row*ROW_H+ROW_H/2;
    var rp=document.createElement(&#x27;div&#x27;); rp.className=&#x27;ripple&#x27;;
    rp.style.width=&#x27;40px&#x27;; rp.style.height=&#x27;40px&#x27;; rp.style.left=(x-20)+&#x27;px&#x27;; rp.style.top=(y-20)+&#x27;px&#x27;;
    field.appendChild(rp); setTimeout(function(){ rp.remove(); },500);
  }

  function burst(){
    var cx=FIELD_W/2, cy=ROW_H/2;
    var colors=[&#x27;#5fffb0&#x27;,&#x27;#5fd0ff&#x27;,&#x27;#c99bff&#x27;,&#x27;#ffe15f&#x27;,&#x27;#ff8fd0&#x27;];
    for(var i=0;i&lt;26;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      p.style.background=colors[i%colors.length]; p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
      field.appendChild(p);
      (function(p){
        var ang=Math.random()*6.28, dist=40+Math.random()*90;
        var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
        p.animate([{transform:&#x27;translate(0,0) scale(1)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(0)&#x27;,opacity:0}],{duration:700,easing:&#x27;ease-out&#x27;});
        setTimeout(function(){ p.remove(); },700);
      })(p);
    }
  }

  var spinAngle=0;
  function tick(){
    if(!running) return;
    drawStars();
    spinAngle=(spinAngle+6)%360;
    for(var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i];
      for(var j=0;j&lt;lane.obstacles.length;j++){
        var o=lane.obstacles[j];
        o.x+=lane.dir*lane.speed;
        if(lane.dir&gt;0&amp;&amp;o.x&gt;FIELD_W) o.x=-40;
        else if(lane.dir&lt;0&amp;&amp;o.x+40&lt;0) o.x=FIELD_W;
        o.el.style.left=o.x+&#x27;px&#x27;;
        o.el.style.transform = lane.spin? (&#x27;rotate(&#x27;+spinAngle+&#x27;deg)&#x27;) : &#x27;&#x27;;
      }
    }
    // collision
    var laneIdx=LANE_ROWS.indexOf(hero.row);
    if(laneIdx&gt;=0){
      var hx=hero.col*COL_W+(COL_W-HERO)/2, hy=hero.row*ROW_H+(ROW_H-HERO)/2;
      var lane2=lanes[laneIdx];
      for(var k=0;k&lt;lane2.obstacles.length;k++){
        var o2=lane2.obstacles[k];
        if(hx&lt;o2.x+34 &amp;&amp; hx+HERO&gt;o2.x+4 &amp;&amp; hy&lt;lane2.y+38 &amp;&amp; hy+HERO&gt;lane2.y){
          hitFrog(); break;
        }
      }
    }
    animId=requestAnimationFrame(tick);
  }

  function hitFrog(){
    lives--; buzz();
    heroEl.classList.remove(&#x27;hit&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hit&#x27;);
    renderLives();
    if(lives&lt;=0){ endGame(); return; }
    resetHero();
  }

  function renderLives(){
    var s=&#x27;&#x27;; for(var i=0;i&lt;3;i++){ s+= i&lt;lives? &#x27;🐸&#x27; : &#x27;&lt;span class=&quot;lost&quot;&gt;🐸&lt;/span&gt;&#x27;; }
    livesEl.innerHTML=s;
  }

  function move(dc,dr){
    if(!running) return;
    var nc=Math.max(0,Math.min(COLS-1,hero.col+dc));
    var nr=Math.max(0,Math.min(ROWS-1,hero.row+dr));
    hero.col=nc; hero.row=nr; paintHero();
    heroEl.classList.remove(&#x27;hop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hop&#x27;);
    ripple();
    if(hero.row===0){
      score++; scoreEl.textContent=score;
      scoreWrap.classList.remove(&#x27;pop&#x27;); void scoreWrap.offsetWidth; scoreWrap.classList.add(&#x27;pop&#x27;);
      burst(); boing();
      crossings++;
      if(crossings%2===0){ difficulty++; buildLanes(); }
      resetHero();
    }
  }

  function endGame(){
    running=false; if(animId){ cancelAnimationFrame(animId); animId=null; }
    finalScoreEl.textContent=&#x27;Score: &#x27;+score;
    overlay.classList.add(&#x27;show&#x27;);
  }
  function startGame(){
    if(running) return;
    ac();
    score=0; lives=3; crossings=0; difficulty=0;
    scoreEl.textContent=&#x27;0&#x27;; renderLives(); overlay.classList.remove(&#x27;show&#x27;);
    initStars(); buildStatic(); buildLanes(); makeHero(); resetHero();
    running=true; animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    if(!running) return; running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial paint (stopped state)
  initStars(); drawStars(); buildStatic(); buildLanes(); makeHero(); paintHero(); renderLives();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
