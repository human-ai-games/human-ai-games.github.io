&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #e8e0ff; overflow: hidden; }

  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff4ecd,#7b5cff,#3ff2ff);

       text-shadow: 0 0 18px rgba(123,92,255,.5); }

  #combo { color: #ffd24e; font-weight: 700; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the arrow keys or by dragging the mouse to bounce the energy orb into the alien bricks. Clear every brick to advance to a faster wave — grab golden power-ups and don&#x27;t lose all three lives!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;label&quot;&gt;Score&lt;/span&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;span id=&quot;combo&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;label&quot;&gt;Wave&lt;/span&gt;&lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;span class=&quot;label&quot;&gt;Lives&lt;/span&gt;&lt;span id=&quot;lives&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 460;
var scoreEl = document.getElementById(&#x27;score&#x27;),
    comboEl = document.getElementById(&#x27;combo&#x27;),
    waveEl = document.getElementById(&#x27;wave&#x27;),
    livesEl = document.getElementById(&#x27;lives&#x27;);

var running = false, animId = null;
var keys = {};
var stars = [];
var bricks = [], balls = [], particles = [], powerups = [];
var paddle, score, wave, lives, combo, comboTimer, gameOver;

// ---- audio ----
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur||0.08));
    o.stop(actx.currentTime + (dur||0.08));
  } catch(_) {}
}

// ---- setup ----
function initStars() {
  stars = [];
  for (var i=0;i&lt;90;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*2+0.5,
      sp:Math.random()*0.4+0.1});
  }
}
initStars();

var BRICK_COLORS = {
  1: {c:&#x27;#3ff2ff&#x27;, g:&#x27;#0a5a66&#x27;},   // cyan  1 hit
  2: {c:&#x27;#ff4ecd&#x27;, g:&#x27;#66104f&#x27;},   // pink  2 hits
  3: {c:&#x27;#7b5cff&#x27;, g:&#x27;#2a1a66&#x27;},   // purple 3 hits
  4: {c:&#x27;#ffd24e&#x27;, g:&#x27;#665012&#x27;}    // gold power brick
};

function buildWave() {
  bricks = [];
  var cols = 10, rows = 4 + Math.min(wave, 3);
  var bw = 56, bh = 20, gap = 4;
  var totalW = cols*bw + (cols-1)*gap;
  var offX = (W - totalW)/2, offY = 40;
  for (var r=0;r&lt;rows;r++){
    for (var c=0;c&lt;cols;c++){
      var hits;
      if (Math.random() &lt; 0.10) hits = 4; // power brick
      else {
        var roll = Math.random();
        hits = roll &lt; 0.5 ? 1 : (roll &lt; 0.82 ? 2 : 3);
      }
      bricks.push({
        x: offX + c*(bw+gap), y: offY + r*(bh+gap),
        w: bw, h: bh, hits: hits, maxhits: hits, power: hits===4
      });
    }
  }
}

function resetBall() {
  var speed = 3.4 + wave*0.4;
  balls = [{x:W/2, y:H-60, vx:(Math.random()&lt;.5?-1:1)*speed*0.6, vy:-speed, r:8, fire:false}];
}

function newGame() {
  score = 0; wave = 1; lives = 3; combo = 0; comboTimer = 0; gameOver = false;
  paddle = {x:W/2-50, y:H-24, w:100, h:12, baseW:100, speed:7};
  powerups = []; particles = [];
  buildWave();
  resetBall();
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  comboEl.textContent = combo&gt;1 ? (&#x27;x&#x27;+combo) : &#x27;&#x27;;
  var s=&#x27;&#x27;; for (var i=0;i&lt;lives;i++) s+=&#x27;🚀&#x27;;
  livesEl.textContent = s;
}

function bumpScore() {
  scoreEl.style.transform=&#x27;scale(1.35)&#x27;;
  setTimeout(function(){scoreEl.style.transform=&#x27;scale(1)&#x27;;},100);
}

// ---- particles ----
function burst(x,y,color,n) {
  for (var i=0;i&lt;(n||14);i++){
    var a=Math.random()*Math.PI*2, sp=Math.random()*3.5+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,color:color,size:Math.random()*3+1});
  }
}

// ---- powerups ----
function spawnPower(x,y) {
  var types=[&#x27;wide&#x27;,&#x27;fire&#x27;,&#x27;split&#x27;];
  var t=types[Math.floor(Math.random()*types.length)];
  powerups.push({x:x,y:y,vy:2,type:t,r:12});
}
function applyPower(t) {
  beep(880,0.15,&#x27;sine&#x27;,0.08);
  if (t===&#x27;wide&#x27;){ paddle.w=Math.min(180,paddle.w+45); }
  else if (t===&#x27;fire&#x27;){ for (var i=0;i&lt;balls.length;i++) balls[i].fire=true; }
  else if (t===&#x27;split&#x27;){
    var add=[];
    for (var i=0;i&lt;balls.length;i++){
      var b=balls[i];
      add.push({x:b.x,y:b.y,vx:-b.vx*0.9+ (Math.random()-.5), vy:b.vy, r:b.r, fire:b.fire});
    }
    balls=balls.concat(add).slice(0,6);
  }
}

// ---- collision helper ----
function hitBrick(b, brick) {
  var closeX=Math.max(brick.x, Math.min(b.x, brick.x+brick.w));
  var closeY=Math.max(brick.y, Math.min(b.y, brick.y+brick.h));
  var dx=b.x-closeX, dy=b.y-closeY;
  return (dx*dx+dy*dy) &lt;= b.r*b.r;
}

function damageBrick(brick, b) {
  var col = BRICK_COLORS[brick.power?4:brick.hits] || BRICK_COLORS[1];
  if (b &amp;&amp; b.fire) brick.hits = 0; else brick.hits--;
  burst(brick.x+brick.w/2, brick.y+brick.h/2, col.c, brick.hits&lt;=0?18:8);
  if (brick.hits&lt;=0) {
    combo++; comboTimer=90;
    var pts = 10 * combo;
    score += pts;
    if (brick.power) spawnPower(brick.x+brick.w/2, brick.y+brick.h/2);
    beep(440+combo*40,0.08,&#x27;square&#x27;,0.05);
    var idx=bricks.indexOf(brick);
    if (idx&gt;=0) bricks.splice(idx,1);
  } else {
    beep(300,0.05,&#x27;square&#x27;,0.04);
  }
  bumpScore();
  updateHUD();
}

// ---- main loop ----
function tick() {
  if (!running) return;
  // stars
  ctx.fillStyle=&#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
  for (var i=0;i&lt;stars.length;i++){
    var st=stars[i];
    st.y+=st.sp; if (st.y&gt;H){st.y=0;st.x=Math.random()*W;}
    ctx.globalAlpha=0.4+st.s*0.25;
    ctx.fillStyle=&#x27;#cfd8ff&#x27;;
    ctx.fillRect(st.x,st.y,st.s,st.s);
  }
  ctx.globalAlpha=1;

  if (!gameOver) {
    // paddle move
    if (keys[&#x27;ArrowLeft&#x27;]) paddle.x-=paddle.speed;
    if (keys[&#x27;ArrowRight&#x27;]) paddle.x+=paddle.speed;
    paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

    // combo timer
    if (comboTimer&gt;0){ comboTimer--; if(comboTimer===0){combo=0;updateHUD();} }

    // balls
    for (var bi=balls.length-1; bi&gt;=0; bi--){
      var b=balls[bi];
      b.x+=b.vx; b.y+=b.vy;
      if (b.x-b.r&lt;=0){b.x=b.r;b.vx=-b.vx;}
      if (b.x+b.r&gt;=W){b.x=W-b.r;b.vx=-b.vx;}
      if (b.y-b.r&lt;=0){b.y=b.r;b.vy=-b.vy;}
      // paddle
      if (b.vy&gt;0 &amp;&amp; b.y+b.r&gt;=paddle.y &amp;&amp; b.y-b.r&lt;=paddle.y+paddle.h &amp;&amp;
          b.x&gt;=paddle.x-b.r &amp;&amp; b.x&lt;=paddle.x+paddle.w+b.r){
        b.y=paddle.y-b.r;
        var rel=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        var sp=Math.min(11, Math.hypot(b.vx,b.vy)*1.04); // speed up
        var ang=rel*1.05;
        b.vx=Math.sin(ang)*sp;
        b.vy=-Math.abs(Math.cos(ang)*sp);
        beep(600,0.05,&#x27;sine&#x27;,0.05);
      }
      // bricks
      for (var k=bricks.length-1;k&gt;=0;k--){
        if (hitBrick(b,bricks[k])){
          var brk=bricks[k];
          // reflect (unless fire)
          if (!b.fire){
            var cx=brk.x+brk.w/2, cy=brk.y+brk.h/2;
            if (Math.abs(b.x-cx)/brk.w &gt; Math.abs(b.y-cy)/brk.h) b.vx=-b.vx;
            else b.vy=-b.vy;
          }
          damageBrick(brk,b);
          break;
        }
      }
      // lost ball
      if (b.y-b.r&gt;H){
        balls.splice(bi,1);
      }
    }
    if (balls.length===0){
      lives--;
      updateHUD();
      if (lives&lt;=0){ gameOver=true; beep(120,0.4,&#x27;sawtooth&#x27;,0.08); }
      else { resetBall(); }
    }

    // powerups
    for (var pi=powerups.length-1;pi&gt;=0;pi--){
      var pu=powerups[pi]; pu.y+=pu.vy;
      if (pu.y&gt;H){ powerups.splice(pi,1); continue; }
      if (pu.y+pu.r&gt;=paddle.y &amp;&amp; pu.x&gt;=paddle.x &amp;&amp; pu.x&lt;=paddle.x+paddle.w){
        applyPower(pu.type); powerups.splice(pi,1);
      }
    }

    // wave clear
    if (bricks.length===0){
      wave++;
      paddle.w=paddle.baseW;
      buildWave(); resetBall();
      beep(500,0.2,&#x27;sine&#x27;,0.07);
      updateHUD();
    }
  }

  // particles
  for (var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=0.03;
    if (pt.life&lt;=0){ particles.splice(p,1); continue; }
    ctx.globalAlpha=pt.life;
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x,pt.y,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  // draw bricks
  for (var i=0;i&lt;bricks.length;i++){
    var br=bricks[i];
    var col=BRICK_COLORS[br.power?4:br.hits]||BRICK_COLORS[1];
    ctx.fillStyle=col.g;
    roundRect(br.x,br.y,br.w,br.h,4); ctx.fill();
    ctx.fillStyle=col.c;
    ctx.shadowColor=col.c; ctx.shadowBlur=8;
    roundRect(br.x+2,br.y+2,br.w-4,br.h-4,3); ctx.fill();
    ctx.shadowBlur=0;
    if (br.power){
      ctx.fillStyle=&#x27;#fff8d6&#x27;; ctx.font=&#x27;bold 12px system-ui&#x27;;
      ctx.textAlign=&#x27;center&#x27;; ctx.fillText(&#x27;★&#x27;,br.x+br.w/2,br.y+br.h-6);
    }
  }

  // draw powerups
  for (var i=0;i&lt;powerups.length;i++){
    var pu=powerups[i];
    var lbl=pu.type===&#x27;wide&#x27;?&#x27;W&#x27;:pu.type===&#x27;fire&#x27;?&#x27;F&#x27;:&#x27;S&#x27;;
    var pc=pu.type===&#x27;wide&#x27;?&#x27;#3ff2ff&#x27;:pu.type===&#x27;fire&#x27;?&#x27;#ff6a3f&#x27;:&#x27;#ff4ecd&#x27;;
    ctx.fillStyle=pc; ctx.shadowColor=pc; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(pu.x,pu.y,pu.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#05010f&#x27;; ctx.font=&#x27;bold 13px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(lbl,pu.x,pu.y+4);
  }

  // draw paddle (ship)
  var grd=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  grd.addColorStop(0,&#x27;#7b5cff&#x27;); grd.addColorStop(0.5,&#x27;#3ff2ff&#x27;); grd.addColorStop(1,&#x27;#ff4ecd&#x27;);
  ctx.fillStyle=grd; ctx.shadowColor=&#x27;#3ff2ff&#x27;; ctx.shadowBlur=14;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6); ctx.fill();
  ctx.shadowBlur=0;

  // draw balls
  for (var i=0;i&lt;balls.length;i++){
    var b=balls[i];
    var bc=b.fire?&#x27;#ff6a3f&#x27;:&#x27;#fff&#x27;;
    ctx.fillStyle=bc; ctx.shadowColor=b.fire?&#x27;#ff6a3f&#x27;:&#x27;#3ff2ff&#x27;; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  if (gameOver){
    ctx.fillStyle=&#x27;rgba(5,1,15,0.7)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#ff4ecd&#x27;; ctx.font=&#x27;bold 38px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.shadowColor=&#x27;#ff4ecd&#x27;; ctx.shadowBlur=18;
    ctx.fillText(&#x27;GAME OVER&#x27;,W/2,H/2-10);
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#3ff2ff&#x27;; ctx.font=&#x27;20px system-ui&#x27;;
    ctx.fillText(&#x27;Score: &#x27;+score+&#x27;  •  Wave &#x27;+wave,W/2,H/2+28);
    ctx.fillStyle=&#x27;#a99fd6&#x27;; ctx.font=&#x27;15px system-ui&#x27;;
    ctx.fillText(&#x27;Press Restart below to play again&#x27;,W/2,H/2+58);
  }

  animId=requestAnimationFrame(tick);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// draw a static frame at load
function staticFrame(){
  ctx.fillStyle=&#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
  for (var i=0;i&lt;stars.length;i++){var s=stars[i];ctx.globalAlpha=0.5;ctx.fillStyle=&#x27;#cfd8ff&#x27;;ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  ctx.fillStyle=&#x27;#3ff2ff&#x27;; ctx.font=&#x27;20px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
  ctx.fillText(&#x27;Press Start below to launch&#x27;,W/2,H/2);
}

function startGame(){
  if (running) return;
  newGame();
  running=true;
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false;
  if (animId){cancelAnimationFrame(animId);animId=null;}
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keys[e.key]=true;e.preventDefault();}
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
function movePaddleTo(clientX){
  if (!paddle||!running||gameOver) return;
  var rect=cv.getBoundingClientRect();
  var x=(clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
}
var dragging=false;
cv.addEventListener(&#x27;mousedown&#x27;,function(e){dragging=true;movePaddleTo(e.clientX);});
window.addEventListener(&#x27;mousemove&#x27;,function(e){if(dragging)movePaddleTo(e.clientX);});
window.addEventListener(&#x27;mouseup&#x27;,function(){dragging=false;});
cv.addEventListener(&#x27;touchstart&#x27;,function(e){dragging=true;if(e.touches[0])movePaddleTo(e.touches[0].clientX);},{passive:true});
cv.addEventListener(&#x27;touchmove&#x27;,function(e){if(dragging&amp;&amp;e.touches[0])movePaddleTo(e.touches[0].clientX);},{passive:true});
window.addEventListener(&#x27;touchend&#x27;,function(){dragging=false;});

window.addEventListener(&#x27;message&#x27;,function(e){
  if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if (e.data.type===&#x27;wd_start&#x27;) startGame();
  else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

updateHUDInit();
function updateHUDInit(){ livesEl.textContent=&#x27;🚀🚀🚀&#x27;; }
staticFrame();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
