&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #7ec850; color: #222; overflow: hidden; }

  @keyframes pulse { 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }

  .board.shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-6px,3px);} 40%{transform:translate(6px,-3px);} 60%{transform:translate(-4px,-2px);} 80%{transform:translate(4px,2px);} }

  @keyframes squish { to { transform: scaleY(.35) scaleX(1.25); opacity:0; } }
  .mole svg { display:block; pointer-events:none; }
  .rim { position:absolute; bottom:0; left:0; width:96px; height:26px; border-radius:50%;

  .fx { position:absolute; pointer-events:none; font-weight:900; z-index:20; }

  @keyframes bonk { 0%{transform:scale(.2) rotate(-15deg);opacity:1;} 40%{transform:scale(1.3) rotate(6deg);} 100%{transform:scale(1) rotate(0);opacity:0; margin-top:-20px;} }

  .combo { position:absolute; top:40%; left:50%; transform:translateX(-50%); font-size:44px; font-weight:900; color:#ff3d7f; text-shadow:2px 2px 0 #fff, -2px -2px 0 #fff; z-index:30; animation: comboAnim .7s forwards; pointer-events:none; }
  @keyframes comboAnim { 0%{transform:translateX(-50%) scale(.3);opacity:0;} 30%{transform:translateX(-50%) scale(1.2);opacity:1;} 100%{transform:translateX(-50%) scale(1);opacity:0;} }
  .coin { position:absolute; width:14px; height:14px; border-radius:50%; background:radial-gradient(#fff3a0,#ffce2e); border:1px solid #c98a00; z-index:15; pointer-events:none; }

  .hidden { display:none; }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌱 Mole Mayhem 🔨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack moles for points — the golden mole is worth 3 and shades-mole 2, but avoid the sparking bomb mole (−2)! Chain quick hits for combo bonuses; press Start below and survive 60 seconds.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;sign&quot; id=&quot;scoreSign&quot;&gt;SCORE&lt;small&gt;points&lt;/small&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;timebar-wrap&quot;&gt;&lt;div id=&quot;timebar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sign&quot; id=&quot;timeSign&quot;&gt;TIME&lt;small&gt;seconds&lt;/small&gt;&lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board-wrap&quot;&gt;
    &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
      &lt;div class=&quot;sun&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;cloud&quot; style=&quot;top:20px;left:60px;width:70px;height:24px;&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;cloud&quot; style=&quot;top:44px;left:240px;width:54px;height:18px;&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;cloud&quot; style=&quot;top:16px;left:400px;width:60px;height:20px;&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;h2&gt;Mole Mayhem&lt;/h2&gt;
        &lt;p&gt;Press Start below to play!&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var timebar = document.getElementById(&#x27;timebar&#x27;);
  var scoreSign = document.getElementById(&#x27;scoreSign&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  var COLS = 4, ROWS = 3;
  var running = false;
  var score = 0, timeLeft = 60;
  var spawnTimer = null, gameTimer = null, rampTimer = null;
  var spawnDelay = 950, maxSimul = 1, difficulty = 0;
  var holes = [];
  var lastHitTime = 0, combo = 0;
  var audioCtx = null;

  // Build holes grid
  function buildHoles() {
    for (var r = 0; r &lt; ROWS; r++) {
      for (var c = 0; c &lt; COLS; c++) {
        var h = document.createElement(&#x27;div&#x27;);
        h.className = &#x27;hole&#x27;;
        var x = 44 + c * 148;
        var y = 128 + r * 108;
        h.style.left = x + &#x27;px&#x27;;
        h.style.top = y + &#x27;px&#x27;;
        h.innerHTML = &#x27;&lt;div class=&quot;dirt&quot;&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;div class=&quot;molewrap&quot;&gt;&lt;div class=&quot;mole&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27; +
          &#x27;&lt;div class=&quot;rim&quot;&gt;&lt;/div&gt;&#x27;;
        board.appendChild(h);
        holes.push({ el: h, mole: h.querySelector(&#x27;.mole&#x27;), busy: false, timeout: null });
      }
    }
  }

  // Mole SVGs by type
  function moleSVG(type) {
    var body, extra = &#x27;&#x27;;
    // eyes glance handled with animation via animate elements
    var eyes = &#x27;&lt;circle cx=&quot;26&quot; cy=&quot;34&quot; r=&quot;7&quot; fill=&quot;#fff&quot; stroke=&quot;#3a2410&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
               &#x27;&lt;circle cx=&quot;42&quot; cy=&quot;34&quot; r=&quot;7&quot; fill=&quot;#fff&quot; stroke=&quot;#3a2410&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
               &#x27;&lt;circle cx=&quot;27&quot; cy=&quot;35&quot; r=&quot;3&quot; fill=&quot;#222&quot;&gt;&lt;animate attributeName=&quot;cx&quot; values=&quot;27;24;30;27&quot; dur=&quot;1.4s&quot; repeatCount=&quot;indefinite&quot;/&gt;&lt;/circle&gt;&#x27; +
               &#x27;&lt;circle cx=&quot;41&quot; cy=&quot;35&quot; r=&quot;3&quot; fill=&quot;#222&quot;&gt;&lt;animate attributeName=&quot;cx&quot; values=&quot;41;38;44;41&quot; dur=&quot;1.4s&quot; repeatCount=&quot;indefinite&quot;/&gt;&lt;/circle&gt;&#x27;;
    var fur = &#x27;#8a6a45&#x27;;
    if (type === &#x27;gold&#x27;) fur = &#x27;#e8b430&#x27;;
    if (type === &#x27;bomb&#x27;) fur = &#x27;#7d5f3f&#x27;;
    var svg = &#x27;&lt;svg width=&quot;68&quot; height=&quot;70&quot; viewBox=&quot;0 0 68 70&quot;&gt;&#x27;;
    // body
    svg += &#x27;&lt;ellipse cx=&quot;34&quot; cy=&quot;46&quot; rx=&quot;26&quot; ry=&quot;24&quot; fill=&quot;&#x27;+fur+&#x27;&quot; stroke=&quot;#5a4025&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
    svg += &#x27;&lt;ellipse cx=&quot;34&quot; cy=&quot;52&quot; rx=&quot;15&quot; ry=&quot;13&quot; fill=&quot;#d9c3a0&quot;/&gt;&#x27;;
    // nose
    svg += &#x27;&lt;ellipse cx=&quot;34&quot; cy=&quot;42&quot; rx=&quot;5&quot; ry=&quot;4&quot; fill=&quot;#c65b7a&quot;/&gt;&#x27;;
    if (type === &#x27;shades&#x27;) {
      // sunglasses
      svg += &#x27;&lt;rect x=&quot;16&quot; y=&quot;30&quot; width=&quot;16&quot; height=&quot;10&quot; rx=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27;;
      svg += &#x27;&lt;rect x=&quot;36&quot; y=&quot;30&quot; width=&quot;16&quot; height=&quot;10&quot; rx=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27;;
      svg += &#x27;&lt;rect x=&quot;32&quot; y=&quot;33&quot; width=&quot;4&quot; height=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27;;
    } else {
      svg += eyes;
    }
    // hard hat
    if (type === &#x27;gold&#x27;) {
      svg += &#x27;&lt;path d=&quot;M12 26 Q34 4 56 26 L56 30 L12 30 Z&quot; fill=&quot;#ffd23f&quot; stroke=&quot;#b8860b&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
      svg += &#x27;&lt;rect x=&quot;10&quot; y=&quot;28&quot; width=&quot;48&quot; height=&quot;5&quot; rx=&quot;2&quot; fill=&quot;#ffdf6b&quot; stroke=&quot;#b8860b&quot; stroke-width=&quot;1&quot;/&gt;&#x27;;
      // wink + sparkle
      svg += &#x27;&lt;text x=&quot;52&quot; y=&quot;18&quot; font-size=&quot;14&quot;&gt;✨&lt;/text&gt;&#x27;;
    } else {
      svg += &#x27;&lt;path d=&quot;M12 26 Q34 4 56 26 L56 30 L12 30 Z&quot; fill=&quot;#ffb52e&quot; stroke=&quot;#c47f00&quot; stroke-width=&quot;2&quot;/&gt;&#x27;;
      svg += &#x27;&lt;rect x=&quot;10&quot; y=&quot;28&quot; width=&quot;48&quot; height=&quot;5&quot; rx=&quot;2&quot; fill=&quot;#ffc94d&quot; stroke=&quot;#c47f00&quot; stroke-width=&quot;1&quot;/&gt;&#x27;;
    }
    // shovel wave
    svg += &#x27;&lt;g&gt;&lt;rect x=&quot;56&quot; y=&quot;34&quot; width=&quot;4&quot; height=&quot;20&quot; rx=&quot;2&quot; fill=&quot;#8b5a2b&quot;/&gt;&#x27; +
           &#x27;&lt;rect x=&quot;52&quot; y=&quot;30&quot; width=&quot;12&quot; height=&quot;8&quot; rx=&quot;2&quot; fill=&quot;#bbb&quot; stroke=&quot;#888&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
           &#x27;&lt;animateTransform attributeName=&quot;transform&quot; type=&quot;rotate&quot; values=&quot;0 58 46; -18 58 46; 0 58 46&quot; dur=&quot;0.6s&quot; repeatCount=&quot;indefinite&quot;/&gt;&lt;/g&gt;&#x27;;
    if (type === &#x27;bomb&#x27;) {
      // subtle fuse spark on hat
      svg += &#x27;&lt;circle cx=&quot;34&quot; cy=&quot;6&quot; r=&quot;2.2&quot; fill=&quot;#ff5a2e&quot;&gt;&lt;animate attributeName=&quot;r&quot; values=&quot;1.5;3;1.5&quot; dur=&quot;0.3s&quot; repeatCount=&quot;indefinite&quot;/&gt;&lt;animate attributeName=&quot;fill&quot; values=&quot;#ff5a2e;#ffd23f;#ff5a2e&quot; dur=&quot;0.3s&quot; repeatCount=&quot;indefinite&quot;/&gt;&lt;/circle&gt;&#x27;;
      svg += &#x27;&lt;line x1=&quot;34&quot; y1=&quot;10&quot; x2=&quot;34&quot; y2=&quot;6&quot; stroke=&quot;#333&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27;;
    }
    svg += &#x27;&lt;/svg&gt;&#x27;;
    return svg;
  }

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function pickType() {
    var r = Math.random();
    // more special types as difficulty increases
    if (r &lt; 0.08 + difficulty * 0.01) return &#x27;gold&#x27;;
    if (r &lt; 0.22 + difficulty * 0.02) return &#x27;shades&#x27;;
    if (r &lt; 0.36 + difficulty * 0.03) return &#x27;bomb&#x27;;
    return &#x27;normal&#x27;;
  }

  function activeCount() {
    var n = 0;
    for (var i = 0; i &lt; holes.length; i++) if (holes[i].busy) n++;
    return n;
  }

  function spawn() {
    if (!running) return;
    var want = maxSimul - activeCount();
    for (var s = 0; s &lt; want &amp;&amp; s &lt; 1; s++) {
      var free = holes.filter(function (h) { return !h.busy; });
      if (!free.length) break;
      var h = free[Math.floor(Math.random() * free.length)];
      var type = pickType();
      showMole(h, type);
    }
  }

  function showMole(h, type) {
    h.busy = true;
    h.type = type;
    h.hit = false;
    h.mole.className = &#x27;mole&#x27;;
    h.mole.innerHTML = moleSVG(type);
    h.mole.dataset.type = type;
    // up
    requestAnimationFrame(function () { h.mole.classList.add(&#x27;up&#x27;); });
    var life = type === &#x27;gold&#x27; ? 850 : (1100 - difficulty * 60);
    if (life &lt; 550) life = 550;

    h.mole.onclick = function () {
      if (!running || h.hit || !h.busy) return;
      whack(h);
    };

    h.timeout = setTimeout(function () {
      if (!h.busy || h.hit) return;
      if (h.type === &#x27;gold&#x27;) laughBubble(h);
      duck(h);
    }, life);
  }

  function duck(h) {
    h.mole.classList.remove(&#x27;up&#x27;);
    setTimeout(function () {
      h.busy = false; h.hit = false;
      h.mole.innerHTML = &#x27;&#x27;;
    }, 200);
  }

  function whack(h) {
    h.hit = true;
    if (h.timeout) clearTimeout(h.timeout);
    var pts;
    var type = h.type;
    var rect = h.el;
    var cx = parseFloat(h.el.style.left) + 48;
    var cy = parseFloat(h.el.style.top) + 20;

    if (type === &#x27;bomb&#x27;) {
      pts = -2; combo = 0;
      fx(cx, cy, &#x27;bonk&#x27;, &#x27;💥&#x27;);
      shake();
      beep(90, 0.35, &#x27;sawtooth&#x27;);
    } else {
      if (type === &#x27;gold&#x27;) { pts = 3; beep(880, 0.15); beep(1180, 0.15); }
      else if (type === &#x27;shades&#x27;) { pts = 2; beep(660, 0.12); }
      else { pts = 1; beep(520, 0.1); }
      // combo
      var now = Date.now();
      if (now - lastHitTime &lt; 900) combo++; else combo = 1;
      lastHitTime = now;
      var mult = combo &gt;= 5 ? 3 : combo &gt;= 3 ? 2 : 1;
      pts *= mult;
      fx(cx, cy, &#x27;bonk&#x27;, &#x27;BONK!&#x27;);
      coins(cx, cy, mult * 3 + 2);
      if (mult &gt; 1) comboBanner(&#x27;x&#x27; + mult);
      shake();
    }
    score += pts;
    if (score &lt; 0) score = 0;
    scoreEl.textContent = score;
    scoreSign.classList.remove(&#x27;pulse&#x27;); void scoreSign.offsetWidth; scoreSign.classList.add(&#x27;pulse&#x27;);
    fx(cx, cy - 24, &#x27;scorepop&#x27;, (pts &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;) + pts, pts &gt;= 0 ? &#x27;#2e8b2e&#x27; : &#x27;#d21&#x27;);
    h.mole.classList.add(&#x27;hit&#x27;);
    setTimeout(function () { h.busy = false; h.hit = false; h.mole.className = &#x27;mole&#x27;; h.mole.innerHTML = &#x27;&#x27;; }, 200);
  }

  function fx(x, y, cls, txt, color) {
    var e = document.createElement(&#x27;div&#x27;);
    e.className = &#x27;fx &#x27; + cls;
    e.textContent = txt;
    e.style.left = x + &#x27;px&#x27;; e.style.top = y + &#x27;px&#x27;;
    e.style.transform = &#x27;translate(-50%,-50%)&#x27;;
    if (color) e.style.color = color;
    board.appendChild(e);
    setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 1000);
  }

  function laughBubble(h) {
    var cx = parseFloat(h.el.style.left) + 48;
    var cy = parseFloat(h.el.style.top);
    fx(cx, cy, &#x27;laugh&#x27;, &#x27;😆 haha!&#x27;, &#x27;#fff&#x27;);
  }

  function comboBanner(txt) {
    var e = document.createElement(&#x27;div&#x27;);
    e.className = &#x27;combo&#x27;;
    e.textContent = txt + &#x27; COMBO!&#x27;;
    board.appendChild(e);
    setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 700);
  }

  function coins(x, y, n) {
    for (var i = 0; i &lt; n; i++) {
      var c = document.createElement(&#x27;div&#x27;);
      c.className = &#x27;coin&#x27;;
      c.style.left = x + &#x27;px&#x27;; c.style.top = y + &#x27;px&#x27;;
      board.appendChild(c);
      (function (c) {
        var ang = Math.random() * Math.PI - Math.PI;
        var vx = Math.cos(ang) * (2 + Math.random() * 4);
        var vy = -(4 + Math.random() * 5);
        var px = x, py = y, t = 0;
        var id = setInterval(function () {
          t++; vy += 0.6; px += vx; py += vy;
          c.style.left = px + &#x27;px&#x27;; c.style.top = py + &#x27;px&#x27;;
          c.style.opacity = Math.max(0, 1 - t / 30);
          if (t &gt; 30) { clearInterval(id); if (c.parentNode) c.parentNode.removeChild(c); }
        }, 16);
      })(c);
    }
  }

  function shake() {
    board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;);
  }

  function scheduleSpawn() {
    if (!running) return;
    spawn();
    spawnTimer = setTimeout(scheduleSpawn, spawnDelay + Math.random() * 300);
  }

  function ramp() {
    difficulty++;
    spawnDelay = Math.max(380, 950 - difficulty * 90);

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

  stopBtn.addEventListener('click', function () {
    if (!running) return;

  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
