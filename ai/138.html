&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys or WASD (or the buttons below) to eat the glowing collectibles and grow. Grab the star (1), flashing gem (3), and rare rainbow orb (5) — the snake speeds up as your score climbs!&lt;/p&gt;
  &lt;div class=&quot;scorebar&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span style=&quot;color:#ffe14d&quot;&gt;★ &lt;b&gt;1&lt;/b&gt;&lt;/span&gt;
    &lt;span style=&quot;color:#ff9a2e&quot;&gt;◆ &lt;b&gt;3&lt;/b&gt;&lt;/span&gt;
    &lt;span style=&quot;color:#ff6ec7&quot;&gt;✦ &lt;b&gt;5&lt;/b&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot; id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;field&quot; width=&quot;560&quot; height=&quot;400&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;go&quot;&gt;GAME OVER&lt;/div&gt;
      &lt;div class=&quot;fs&quot;&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pad&quot;&gt;
    &lt;button class=&quot;up&quot; data-dir=&quot;up&quot;&gt;▲&lt;/button&gt;
    &lt;button class=&quot;left&quot; data-dir=&quot;left&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;down&quot; data-dir=&quot;down&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;right&quot; data-dir=&quot;right&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var CELL = 20;
var COLS = 28, ROWS = 20;
var canvas = document.getElementById(&#x27;field&#x27;);
var ctx = canvas.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var wrap = document.getElementById(&#x27;wrap&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;);
var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

var running = false, gameOver = false;
var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
var score = 0;
var stepMs = 150;      // current movement interval
var lastStep = 0;
var deathAnim = null;  // {start} while ripple plays
var particles = [];
var glowPhase = 0;

// Collectibles
var star = null;               // {x,y}
var gem = null;                // {x,y, expires}
var gemNextSpawn = 0;
var orb = null;                // {x,y, expires}
var orbNextSpawn = 0;
var GEM_LIFE = 5000, ORB_LIFE = 3000, ORB_CYCLE = 15000;

function occupied(x,y){
  for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  if (star &amp;&amp; star.x===x &amp;&amp; star.y===y) return true;
  if (gem &amp;&amp; gem.x===x &amp;&amp; gem.y===y) return true;
  if (orb &amp;&amp; orb.x===x &amp;&amp; orb.y===y) return true;
  return false;
}
function freeCell(){
  for (var t=0;t&lt;300;t++){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if (!occupied(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}

function initSnake(){
  snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  dir = {x:1,y:0}; pendingDir = {x:1,y:0};
}

function computeStep(){
  // start 150ms, faster every 5 points, floor 60ms
  var s = 150 - Math.floor(score/5)*12;
  return Math.max(60, s);
}

function spawnParticles(cx, cy, color){
  for (var i=0;i&lt;14;i++){
    var a = Math.random()*Math.PI*2;
    var sp = 1 + Math.random()*2.5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, color: color, r: 2+Math.random()*2
    });
  }
}

function popup(cellx, celly, text, color){
  var el = document.createElement(&#x27;div&#x27;);
  el.className = &#x27;pop&#x27;;
  el.textContent = text;
  el.style.color = color;
  el.style.left = (cellx*CELL) + &#x27;px&#x27;;
  el.style.top = (celly*CELL - 4) + &#x27;px&#x27;;
  wrap.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 900);
}

function eat(cellx, celly, pts, color){
  score += pts;
  scoreEl.textContent = score;
  stepMs = computeStep();
  spawnParticles(cellx*CELL+CELL/2, celly*CELL+CELL/2, color);
  popup(cellx, celly, &#x27;+&#x27;+pts, color);
}

function step(now){
  if (!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir = pendingDir;
  var head = snake[0];
  var nx = head.x+dir.x, ny = head.y+dir.y;
  if (nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ startDeath(); return; }
  var ateStar = star &amp;&amp; nx===star.x &amp;&amp; ny===star.y;
  var ateGem  = gem &amp;&amp; nx===gem.x &amp;&amp; ny===gem.y;
  var ateOrb  = orb &amp;&amp; nx===orb.x &amp;&amp; ny===orb.y;
  var grows = ateStar || ateGem || ateOrb;
  var body = grows ? snake : snake.slice(0, snake.length-1);
  for (var i=0;i&lt;body.length;i++) if (body[i].x===nx &amp;&amp; body[i].y===ny){ startDeath(); return; }
  snake.unshift({x:nx,y:ny});
  if (ateStar){ eat(nx,ny,1,&#x27;#ffe14d&#x27;); star = freeCell(); }
  if (ateGem){ eat(nx,ny,3,&#x27;#ff9a2e&#x27;); gem=null; gemNextSpawn=now+400; }
  if (ateOrb){ eat(nx,ny,5,&#x27;#ff6ec7&#x27;); orb=null; orbNextSpawn=now+ORB_CYCLE; }
  if (!grows) snake.pop();
}

function startDeath(){
  deathAnim = { start: performance.now() };
}

function finishDeath(){
  running = false;
  gameOver = true;
  deathAnim = null;
  finalScoreEl.textContent = score;
  overlay.classList.add(&#x27;show&#x27;);
}

// ---- Rendering ----
function lerp(a,b,t){ return a+(b-a)*t; }
function snakeColor(t){
  // head cyan (0) -&gt; tail purple (1)
  var r = Math.round(lerp(0,161,t));
  var g = Math.round(lerp(229,91,t));
  var b = Math.round(lerp(255,255,t));
  return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawGrid(){
  ctx.fillStyle = &#x27;#0b0b18&#x27;;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  var pulse = 0.06 + 0.05*Math.sin(glowPhase);
  ctx.strokeStyle = &#x27;rgba(120,90,220,&#x27;+pulse+&#x27;)&#x27;;
  ctx.lineWidth = 1;
  for (var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,ROWS*CELL); ctx.stroke(); }
  for (var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(COLS*CELL,y*CELL); ctx.stroke(); }
}

function drawStar(cx,cy){
  var pulse = 0.5+0.5*Math.sin(glowPhase*2);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.shadowColor=&#x27;#ffe14d&#x27;; ctx.shadowBlur=10+6*pulse;
  ctx.fillStyle=&#x27;#ffe14d&#x27;;
  ctx.beginPath();
  for (var i=0;i&lt;5;i++){
    var a=-Math.PI/2 + i*2*Math.PI/5;
    ctx.lineTo(Math.cos(a)*7, Math.sin(a)*7);
    var a2=a+Math.PI/5;
    ctx.lineTo(Math.cos(a2)*3, Math.sin(a2)*3);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawGem(cx,cy,now){
  var flash = 0.4+0.6*Math.abs(Math.sin(now/150));
  ctx.save();
  ctx.translate(cx,cy);
  ctx.globalAlpha = flash;
  ctx.shadowColor=&#x27;#ff9a2e&#x27;; ctx.shadowBlur=14;
  ctx.fillStyle=&#x27;#ff9a2e&#x27;;
  ctx.beginPath();
  ctx.moveTo(0,-8); ctx.lineTo(7,0); ctx.lineTo(0,8); ctx.lineTo(-7,0);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawOrb(cx,cy,now){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(now/300);
  ctx.shadowBlur=16;
  var grad = ctx.createConicGradient ? ctx.createConicGradient(now/300,0,0) : null;
  if (grad){
    grad.addColorStop(0,&#x27;#ff0000&#x27;); grad.addColorStop(0.16,&#x27;#ff9a00&#x27;);
    grad.addColorStop(0.33,&#x27;#ffff00&#x27;); grad.addColorStop(0.5,&#x27;#00ff66&#x27;);
    grad.addColorStop(0.66,&#x27;#00c3ff&#x27;); grad.addColorStop(0.83,&#x27;#a15bff&#x27;);
    grad.addColorStop(1,&#x27;#ff0000&#x27;);
    ctx.fillStyle = grad;
    ctx.shadowColor = &#x27;#ff6ec7&#x27;;
  } else {
    ctx.fillStyle = &#x27;#ff6ec7&#x27;; ctx.shadowColor=&#x27;#ff6ec7&#x27;;
  }
  ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawSnake(now){
  var dead = deathAnim!=null;
  var dt = dead ? (now-deathAnim.start)/500 : 0;
  for (var i=snake.length-1;i&gt;=0;i--){
    var t = snake.length&gt;1 ? i/(snake.length-1) : 0;
    var seg = snake[i];
    var col = snakeColor(t);
    if (dead){
      // ripple flash red head-&gt;tail over 0.5s
      var frac = i/Math.max(1,snake.length-1);
      var flashAt = dt - frac; // segment i turns red as ripple passes
      if (flashAt&gt;0 &amp;&amp; flashAt&lt;1) col = &#x27;#ff2b4a&#x27;;
      else if (flashAt&gt;=1) col = &#x27;#661020&#x27;;
    }
    ctx.save();
    ctx.shadowColor = i===0 ? &#x27;#7ff7ff&#x27; : col;
    ctx.shadowBlur = i===0 ? 14 : 6;
    ctx.fillStyle = col;
    roundRect(seg.x*CELL+1.5, seg.y*CELL+1.5, CELL-3, CELL-3, 5);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles(dtms){
  for (var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94;
    p.life -= dtms/600;
    if (p.life&lt;=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

var lastFrame = 0;
function frame(now){
  if (!running &amp;&amp; !deathAnim &amp;&amp; !gameOver){ return; }
  var dtms = lastFrame ? now-lastFrame : 16;
  lastFrame = now;
  glowPhase += dtms/500;

  if (running &amp;&amp; !deathAnim){
    // manage timed collectibles
    if (gem &amp;&amp; now&gt;gem.expires){ gem=null; gemNextSpawn=now+300; }
    if (!gem &amp;&amp; now&gt;=gemNextSpawn){ var g=freeCell(); gem={x:g.x,y:g.y,expires:now+GEM_LIFE}; }
    if (orb &amp;&amp; now&gt;orb.expires){ orb=null; orbNextSpawn=now+ORB_CYCLE; }
    if (!orb &amp;&amp; now&gt;=orbNextSpawn){ var o=freeCell(); orb={x:o.x,y:o.y,expires:now+ORB_LIFE}; }

    if (now-lastStep &gt;= stepMs){ lastStep=now; step(now); }
  }

  // render
  drawGrid();
  if (star) drawStar(star.x*CELL+CELL/2, star.y*CELL+CELL/2);
  if (gem) drawGem(gem.x*CELL+CELL/2, gem.y*CELL+CELL/2, now);
  if (orb) drawOrb(orb.x*CELL+CELL/2, orb.y*CELL+CELL/2, now);
  drawSnake(now);
  drawParticles(dtms);

  if (deathAnim &amp;&amp; now-deathAnim.start &gt;= 500){ finishDeath(); }

  if (running || deathAnim || particles.length){
    requestAnimationFrame(frame);
  }
}

function drawStatic(){
  drawGrid();
  if (star) drawStar(star.x*CELL+CELL/2, star.y*CELL+CELL/2);
  drawSnake(performance.now());
}

function setDir(nx,ny){
  if (!running) return;
  if (nx===-dir.x &amp;&amp; ny===-dir.y) return;
  pendingDir = {x:nx,y:ny};
}

function startGame(){
  overlay.classList.remove(&#x27;show&#x27;);
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  gameOver=false; deathAnim=null; particles=[];
  stepMs=computeStep();
  initSnake();
  star = freeCell();
  gem=null; orb=null;
  var now=performance.now();
  lastStep=now; lastFrame=0;
  gemNextSpawn=now;           // gem appears right away
  orbNextSpawn=now+ORB_CYCLE; // orb cycle begins
  running=true;
  requestAnimationFrame(frame);
}
function stopGame(){
  running=false;
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  var k=e.key.toLowerCase();
  if (k===&#x27;arrowleft&#x27;||k===&#x27;a&#x27;){ setDir(-1,0); e.preventDefault(); }
  else if (k===&#x27;arrowright&#x27;||k===&#x27;d&#x27;){ setDir(1,0); e.preventDefault(); }
  else if (k===&#x27;arrowup&#x27;||k===&#x27;w&#x27;){ setDir(0,-1); e.preventDefault(); }
  else if (k===&#x27;arrowdown&#x27;||k===&#x27;s&#x27;){ setDir(0,1); e.preventDefault(); }
});

document.querySelectorAll(&#x27;.pad button&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;, function(){
    var d=b.getAttribute(&#x27;data-dir&#x27;);
    if (d===&#x27;up&#x27;) setDir(0,-1);
    else if (d===&#x27;down&#x27;) setDir(0,1);
    else if (d===&#x27;left&#x27;) setDir(-1,0);
    else if (d===&#x27;right&#x27;) setDir(1,0);
  });
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if (e.data.type===&#x27;wd_start&#x27;) startGame();
  else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// Initial static view
initSnake();
star = {x:14,y:10};
drawStatic();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,

<script>
