<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>GRAVITY FLIP</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #d8e6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #46f0ff; text-shadow: 0 0 12px rgba(70,240,255,.7); }
  .instructions { font-size: 16px; color: #9fb4d8; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .stats { display: flex; gap: 28px; font-size: 20px; font-weight: 700; }
  .stats .cur { color: #46f0ff; text-shadow: 0 0 8px rgba(70,240,255,.5); }
  .stats .best { color: #ffb14a; text-shadow: 0 0 8px rgba(255,177,74,.5); }
  .field { position: relative; width: 660px; height: 440px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #04030c; box-shadow: 0 0 24px rgba(70,240,255,.15), inset 0 0 40px rgba(0,0,0,.6); border: 1px solid rgba(70,240,255,.2); }
  .nebula { position: absolute; inset: -20%; opacity: .55; filter: blur(30px); pointer-events: none; }
  .starLayer { position: absolute; inset: 0; pointer-events: none; }
  .star { position: absolute; background: #fff; border-radius: 50%; }
  #canvas { position: absolute; inset: 0; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; color: #bfe8ff; text-align: center; pointer-events: none; text-shadow: 0 0 10px rgba(70,240,255,.6); }
  .msg .big { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
  .msg .small { font-size: 16px; color: #9fb4d8; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;GRAVITY FLIP&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to flip gravity — the capsule soars up or drops down. Dodge the glowing asteroids and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;stats&quot;&gt;
    &lt;div class=&quot;cur&quot;&gt;DIST &lt;span id=&quot;cur&quot;&gt;0&lt;/span&gt; km&lt;/div&gt;
    &lt;div class=&quot;best&quot;&gt;BEST &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt; km&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;nebula&quot; id=&quot;nebula&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;starLayer&quot; id=&quot;sl1&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;starLayer&quot; id=&quot;sl2&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;starLayer&quot; id=&quot;sl3&quot;&gt;&lt;/div&gt;
    &lt;canvas id=&quot;canvas&quot; width=&quot;660&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;div class=&quot;big&quot;&gt;READY&lt;/div&gt;&lt;div class=&quot;small&quot;&gt;Press Start below&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 660, FIELD_H = 440;
  var canvas = document.getElementById(&#x27;canvas&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var field = document.getElementById(&#x27;field&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var msg = document.getElementById(&#x27;msg&#x27;);
  var nebula = document.getElementById(&#x27;nebula&#x27;);
  var curEl = document.getElementById(&#x27;cur&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);

  var CAP_SIZE = 30;
  var CAP_X = 90;
  var GRAV_MAG = 0.9;
  var MAX_V = 11;

  var running = false, animId = null;
  var gravDir = 1; // 1 = down, -1 = up
  var capY, capVY;
  var asteroids = [];
  var particles = [];
  var distance = 0;      // km
  var best = 0;
  var speed = 4.0;
  var spawnTimer = 0;
  var spawnGap = 90;
  var intensity = 0;     // 0..1
  var dying = false, deathTimer = 0;
  var t = 0;

  // ---- parallax stars ----
  var starLayers = [
    { el: document.getElementById(&#x27;sl1&#x27;), stars: [], speed: 0.4, size: [1,1.6] },
    { el: document.getElementById(&#x27;sl2&#x27;), stars: [], speed: 0.9, size: [1.4,2.4] },
    { el: document.getElementById(&#x27;sl3&#x27;), stars: [], speed: 1.6, size: [2,3.4] }
  ];
  function buildStars() {
    starLayers.forEach(function(layer, li) {
      layer.el.innerHTML = &#x27;&#x27;;
      layer.stars = [];
      var count = 40 - li * 8;
      for (var i = 0; i &lt; count; i++) {
        var s = document.createElement(&#x27;div&#x27;);
        s.className = &#x27;star&#x27;;
        var sz = layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]);
        var x = Math.random() * FIELD_W, y = Math.random() * FIELD_H;
        s.style.width = sz + &#x27;px&#x27;; s.style.height = sz + &#x27;px&#x27;;
        s.style.left = x + &#x27;px&#x27;; s.style.top = y + &#x27;px&#x27;;
        s.style.opacity = (0.4 + Math.random() * 0.6).toFixed(2);
        s.style.boxShadow = &#x27;0 0 &#x27; + (sz*1.5) + &#x27;px rgba(180,220,255,.7)&#x27;;
        layer.el.appendChild(s);
        layer.stars.push({ el: s, x: x, y: y });
      }
    });
  }
  function moveStars() {
    starLayers.forEach(function(layer) {
      var sp = layer.speed * (speed / 4.0);
      layer.stars.forEach(function(st) {
        st.x -= sp;
        if (st.x &lt; -4) { st.x = FIELD_W + Math.random() * 40; st.y = Math.random() * FIELD_H; st.el.style.top = st.y + &#x27;px&#x27;; }
        st.el.style.left = st.x + &#x27;px&#x27;;
      });
    });
  }

  // ---- nebula pulse &amp; intensity color ----
  function paintNebula() {
    var hueShift = intensity; // 0 cool -&gt; 1 red
    var pulse = (Math.sin(t * 0.02) + 1) / 2;
    // base cool hue ~250, drift toward ~0 (red) with intensity
    var h1 = 250 - hueShift * 250;
    var h2 = 200 - hueShift * 200;
    var l = 22 + pulse * 10;
    nebula.style.background =
      &#x27;radial-gradient(60% 60% at &#x27; + (30 + pulse*20) + &#x27;% 40%, hsla(&#x27; + h1 + &#x27;,80%,&#x27; + l + &#x27;%,.9), transparent 70%),&#x27; +
      &#x27;radial-gradient(50% 50% at 75% 70%, hsla(&#x27; + h2 + &#x27;,85%,&#x27; + (l+6) + &#x27;%,.8), transparent 70%)&#x27;;
    var glow = &#x27;rgba(&#x27; + Math.round(70 + hueShift*185) + &#x27;,&#x27; + Math.round(240 - hueShift*200) + &#x27;,&#x27; + Math.round(255 - hueShift*200) + &#x27;,&#x27;;
    field.style.boxShadow = &#x27;0 0 26px &#x27; + glow + &#x27;.25), inset 0 0 40px rgba(0,0,0,.6)&#x27;;
  }

  // ---- asteroids ----
  var SIZES = [
    { r: 20, name: &#x27;s&#x27; },
    { r: 34, name: &#x27;m&#x27; },
    { r: 50, name: &#x27;l&#x27; }
  ];
  function spawnAsteroid() {
    var size = SIZES[Math.floor(Math.random() * SIZES.length)];
    var r = size.r;
    // place either near floor, near ceiling, or mid — mixing keeps flip meaningful
    var mode = Math.floor(Math.random() * 3);
    var cy;
    if (mode === 0) cy = FIELD_H - r - 6 - Math.random() * 30;       // low
    else if (mode === 1) cy = r + 6 + Math.random() * 30;            // high
    else cy = FIELD_H / 2 + (Math.random() - 0.5) * 120;             // mid
    // craters
    var craters = [];
    var nc = 3 + Math.floor(Math.random() * 4);
    for (var i = 0; i &lt; nc; i++) {
      var ang = Math.random() * Math.PI * 2;
      var dist = Math.random() * r * 0.55;
      craters.push({ x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, cr: r * (0.12 + Math.random() * 0.18) });
    }
    asteroids.push({ x: FIELD_W + r, y: cy, r: r, craters: craters, rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.02 });
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    // body gradient rocky
    var g = ctx.createRadialGradient(-a.r*0.3, -a.r*0.3, a.r*0.2, 0, 0, a.r);
    g.addColorStop(0, &#x27;#6a5540&#x27;);
    g.addColorStop(0.6, &#x27;#4a382a&#x27;);
    g.addColorStop(1, &#x27;#2a1e15&#x27;);
    ctx.beginPath();
    ctx.arc(0, 0, a.r, 0, Math.PI*2);
    ctx.fillStyle = g;
    ctx.shadowColor = &#x27;rgba(255,150,40,.9)&#x27;;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
    // glowing orange outline
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = &#x27;rgba(255,160,50,.95)&#x27;;
    ctx.stroke();
    // craters
    a.craters.forEach(function(c) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.cr, 0, Math.PI*2);
      ctx.fillStyle = &#x27;rgba(20,14,10,.55)&#x27;;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(c.x - c.cr*0.25, c.y - c.cr*0.25, c.cr*0.6, 0, Math.PI*2);
      ctx.fillStyle = &#x27;rgba(120,95,70,.4)&#x27;;
      ctx.fill();
    });
    ctx.restore();
  }

  function drawCapsule() {
    var cx = CAP_X + CAP_SIZE/2, cy = capY + CAP_SIZE/2;
    ctx.save();
    ctx.translate(cx, cy);
    // trail glow
    ctx.beginPath();
    ctx.ellipse(0, 0, CAP_SIZE*0.55, CAP_SIZE*0.45, 0, 0, Math.PI*2);
    var g = ctx.createRadialGradient(0,0,2,0,0,CAP_SIZE*0.6);
    g.addColorStop(0, &#x27;#c8ffff&#x27;);
    g.addColorStop(0.5, &#x27;#46f0ff&#x27;);
    g.addColorStop(1, &#x27;rgba(70,240,255,0)&#x27;);
    ctx.fillStyle = g;
    ctx.shadowColor = &#x27;#46f0ff&#x27;;
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
    // inner core
    ctx.beginPath();
    ctx.ellipse(0, 0, CAP_SIZE*0.32, CAP_SIZE*0.26, 0, 0, Math.PI*2);
    ctx.fillStyle = &#x27;#eaffff&#x27;;
    ctx.fill();
    // little thruster indicating gravity dir
    ctx.beginPath();
    var ty = gravDir === 1 ? -CAP_SIZE*0.5 : CAP_SIZE*0.5;
    ctx.moveTo(-4, ty*0.7); ctx.lineTo(4, ty*0.7); ctx.lineTo(0, ty);
    ctx.closePath();
    ctx.fillStyle = &#x27;rgba(255,220,120,.9)&#x27;;
    ctx.fill();
    ctx.restore();
  }

  // ---- death particles: four spinning quarter circles ----
  function spawnDeath() {
    var cx = CAP_X + CAP_SIZE/2, cy = capY + CAP_SIZE/2;
    for (var i = 0; i &lt; 4; i++) {
      var ang = (i / 4) * Math.PI * 2 + Math.PI/4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * (3 + Math.random()*2),
        vy: Math.sin(ang) * (3 + Math.random()*2),
        rot: ang, vr: (Math.random()-0.5) * 0.4,
        quad: i, life: 1
      });
    }
  }
  function drawParticles() {
    particles.forEach(function(p) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0, 0, CAP_SIZE*0.5, 0, Math.PI/2);
      ctx.closePath();
      ctx.fillStyle = &#x27;#7ff6ff&#x27;;
      ctx.shadowColor = &#x27;#46f0ff&#x27;;
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.restore();
    });
  }

  // ---- audio ----
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.12;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch(_) {}
  }

  function flip() {
    if (!running || dying) return;
    gravDir *= -1;
    beep(gravDir === 1 ? 320 : 520, 0.12, &#x27;triangle&#x27;, 0.1);
  }

  function doFlash() {
    flash.style.transition = &#x27;none&#x27;;
    flash.style.opacity = &#x27;0.9&#x27;;
    requestAnimationFrame(function() {
      flash.style.transition = &#x27;opacity 0.5s&#x27;;
      flash.style.opacity = &#x27;0&#x27;;
    });
  }

  function collides(a) {
    var cx = CAP_X + CAP_SIZE/2, cy = capY + CAP_SIZE/2;
    var dx = cx - a.x, dy = cy - a.y;
    var rr = a.r + CAP_SIZE*0.4;
    return dx*dx + dy*dy &lt; rr*rr;
  }

  function tick() {
    if (!running) return;
    t++;
    ctx.clearRect(0, 0, FIELD_W, FIELD_H);
    moveStars();
    paintNebula();

    if (!dying) {
      // physics
      capVY += GRAV_MAG * gravDir;
      if (capVY &gt; MAX_V) capVY = MAX_V;
      if (capVY &lt; -MAX_V) capVY = -MAX_V;
      capY += capVY;
      var floorY = FIELD_H - CAP_SIZE - 4;
      if (capY &gt; floorY) { capY = floorY; capVY = 0; }
      if (capY &lt; 4) { capY = 4; capVY = 0; }

      // distance + difficulty
      distance += speed * 0.09;
      intensity = Math.min(1, distance / 4000);
      speed = 4.0 + intensity * 5.5;
      spawnGap = 90 - intensity * 45;

      spawnTimer++;
      if (spawnTimer &gt;= spawnGap) { spawnTimer = 0; spawnAsteroid(); }

      for (var i = asteroids.length - 1; i &gt;= 0; i--) {
        var a = asteroids[i];
        a.x -= speed;
        a.rot += a.vr;
        if (a.x + a.r &lt; -10) { asteroids.splice(i, 1); continue; }
        if (collides(a)) {
          dying = true; deathTimer = 60;
          spawnDeath();
          doFlash();
          beep(90, 0.5, &#x27;sawtooth&#x27;, 0.2);
          break;
        }
      }
      curEl.textContent = Math.floor(distance);
      if (distance &gt; best) { best = distance; bestEl.textContent = Math.floor(best); }
    } else {
      deathTimer--;
      particles.forEach(function(p) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.rot += p.vr; p.life -= 0.02;
      });
      if (deathTimer &lt;= 0) {
        running = false;
        showMsg(&#x27;CRASHED&#x27;, &#x27;Distance &#x27; + Math.floor(distance) + &#x27; km — press Start to retry&#x27;);
        return;
      }
    }

    // draw asteroids
    asteroids.forEach(drawAsteroid);
    if (!dying) drawCapsule();
    drawParticles();

    animId = requestAnimationFrame(tick);
  }

  function showMsg(big, small) {
    msg.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;&#x27; + big + &#x27;&lt;/div&gt;&lt;div class=&quot;small&quot;&gt;&#x27; + small + &#x27;&lt;/div&gt;&#x27;;
    msg.style.display = &#x27;flex&#x27;;
  }
  function hideMsg() { msg.style.display = &#x27;none&#x27;; }

  function startGame() {
    if (running) return;
    hideMsg();
    gravDir = 1;
    capY = FIELD_H - CAP_SIZE - 4;
    capVY = 0;
    asteroids = [];
    particles = [];
    distance = 0;
    speed = 4.0;
    spawnTimer = 0;
    intensity = 0;
    dying = false;
    curEl.textContent = &#x27;0&#x27;;
    running = true;
    spawnAsteroid(); // immediate motion on start
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e) {
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { flip(); e.preventDefault(); }
  });
  field.addEventListener(&#x27;click&#x27;, function() { flip(); });
  window.addEventListener(&#x27;message&#x27;, function(e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial static render
  buildStars();
  capY = FIELD_H - CAP_SIZE - 4;
  paintNebula();
  ctx.clearRect(0,0,FIELD_W,FIELD_H);
  drawCapsule();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
