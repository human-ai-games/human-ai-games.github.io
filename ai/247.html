  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0018; color: #e8e0ff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; arrow keys or your mouse to bounce the energy orb into the alien UFOs. Chain hits without missing to build your combo — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score &lt;span class=&quot;cyan&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Combo &lt;span class=&quot;pink&quot; id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Best &lt;span class=&quot;gold&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var W=620,H=460;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;), bestEl=document.getElementById(&#x27;best&#x27;), flashEl=document.getElementById(&#x27;flash&#x27;);

var running=false, animId=null;
var keys={};
var score=0, best=0, combo=1, chain=0;
var shake=0, flashV=0;

// paddle ship
var PW=96, PH=16, paddleX=(W-PW)/2, targetX=paddleX, PB=16;
// orb
var BS=16, ballX, ballY, ballVX, ballVY, SPEED=4.2;
var trail=[];
// invaders
var invaders=[];
var particles=[];
var stars1=[], stars2=[];

function initStars(){
  stars1=[]; stars2=[];
  for(var i=0;i&lt;45;i++) stars1.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.2+.4});
  for(var i=0;i&lt;25;i++) stars2.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1.2});
}

var UFO_COLORS=[&#x27;#ff2fb9&#x27;,&#x27;#22e6ff&#x27;,&#x27;#a45cff&#x27;,&#x27;#ff7e3d&#x27;];
function makeInvaders(){
  invaders=[];
  var cols=8, rows=4, mw=56, offx=(W-cols*mw)/2+ (mw-40)/2, offy=40;
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;cols;c++){
      var gold=Math.random()&lt;0.12;
      invaders.push({
        x:offx+c*mw, y:offy+r*40, w:40, h:26, alive:true,
        gold:gold, color:gold?&#x27;#ffd54a&#x27;:UFO_COLORS[r%UFO_COLORS.length],
        row:r, phase:Math.random()*6.28
      });
    }
  }
}

function resetBall(){
  ballX=W/2; ballY=H-70;
  var ang=(-Math.PI/2)+(Math.random()*0.7-0.35);
  ballVX=Math.cos(ang)*SPEED; ballVY=Math.sin(ang)*SPEED;
  trail=[];
}

function spawnParticles(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*6.28, sp=Math.random()*3.5+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function advanceRow(){
  // move a random alive row down
  var rows={};
  invaders.forEach(function(iv){ if(iv.alive){ rows[iv.row]=true; } });
  var keys2=Object.keys(rows);
  if(keys2.length===0) return;
  var rr=keys2[Math.floor(Math.random()*keys2.length)];
  invaders.forEach(function(iv){ if(iv.alive &amp;&amp; iv.row==rr) iv.y+=34; });
}

function anyAlive(){ return invaders.some(function(iv){return iv.alive;}); }

var t=0;
function tick(){
  if(!running) return;
  t++;
  // parallax stars
  stars1.forEach(function(s){ s.y+=0.35; if(s.y&gt;H){s.y=0;s.x=Math.random()*W;} });
  stars2.forEach(function(s){ s.y+=0.9; if(s.y&gt;H){s.y=0;s.x=Math.random()*W;} });

  // paddle
  if(keys[&#x27;ArrowLeft&#x27;]) targetX-=8;
  if(keys[&#x27;ArrowRight&#x27;]) targetX+=8;
  targetX=Math.max(0,Math.min(W-PW,targetX));
  paddleX += (targetX-paddleX)*0.35;

  // ball
  ballX+=ballVX; ballY+=ballVY;
  trail.push({x:ballX,y:ballY}); if(trail.length&gt;12) trail.shift();

  if(ballX&lt;=0){ballX=0;ballVX=-ballVX;}
  if(ballX+BS&gt;=W){ballX=W-BS;ballVX=-ballVX;}
  if(ballY&lt;=0){ballY=0;ballVY=-ballVY;}

  // invader collision
  var cx=ballX+BS/2, cy=ballY+BS/2;
  for(var i=0;i&lt;invaders.length;i++){
    var iv=invaders[i];
    if(!iv.alive) continue;
    if(cx&gt;iv.x-4 &amp;&amp; cx&lt;iv.x+iv.w+4 &amp;&amp; cy&gt;iv.y-4 &amp;&amp; cy&lt;iv.y+iv.h+4){
      iv.alive=false;
      var pts=(iv.gold?30:10)*combo;
      score+=pts;
      chain++;
      combo=Math.min(9,1+Math.floor(chain/3));
      spawnParticles(iv.x+iv.w/2,iv.y+iv.h/2,iv.color, iv.gold?26:14);
      shake=Math.max(shake, iv.gold?10:5);
      // reflect
      ballVY=-ballVY;
      if(!anyAlive()){ makeInvaders(); }
      break;
    }
  }

  // paddle collision
  var pTop=H-PB-PH;
  if(ballVY&gt;0 &amp;&amp; ballY+BS&gt;=pTop &amp;&amp; ballY+BS&lt;=pTop+PH+8 &amp;&amp;
     ballX+BS&gt;=paddleX &amp;&amp; ballX&lt;=paddleX+PW){
    ballVY=-Math.abs(ballVY);
    ballY=pTop-BS;
    // angle based on hit position
    var rel=((ballX+BS/2)-(paddleX+PW/2))/(PW/2);
    ballVX=rel*SPEED*1.1;
    var mag=Math.sqrt(ballVX*ballVX+ballVY*ballVY);
    ballVX=ballVX/mag*SPEED; ballVY=ballVY/mag*SPEED;
    spawnParticles(ballX+BS/2,pTop,&#x27;#22e6ff&#x27;,6);
  }

  // miss
  if(ballY&gt;H){
    chain=0; combo=1;
    shake=16; flashV=0.55;
    advanceRow();
    resetBall();
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.06; pt.life-=0.03;
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  if(score&gt;best){best=score;}
  scoreEl.textContent=score;
  comboEl.textContent=&#x27;x&#x27;+combo;
  bestEl.textContent=best;

  shake*=0.86; if(shake&lt;0.3)shake=0;
  flashV*=0.9;
  flashEl.style.background=&#x27;rgba(255,40,90,&#x27;+flashV.toFixed(2)+&#x27;)&#x27;;

  draw();
  animId=requestAnimationFrame(tick);
}

function draw(){
  ctx.save();
  var sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);
  // bg
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#12002e&#x27;); g.addColorStop(1,&#x27;#05000f&#x27;);
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

  // stars
  ctx.fillStyle=&#x27;rgba(180,140,255,0.6)&#x27;;
  stars1.forEach(function(s){ ctx.fillRect(s.x,s.y,s.s,s.s); });
  ctx.fillStyle=&#x27;rgba(120,240,255,0.9)&#x27;;
  stars2.forEach(function(s){ ctx.fillRect(s.x,s.y,s.s,s.s); });

  // invaders
  invaders.forEach(function(iv){
    if(!iv.alive) return;
    var wob=Math.sin(t*0.05+iv.phase)*3;
    drawUFO(iv.x,iv.y+wob,iv.w,iv.h,iv.color,iv.gold);
  });

  // orb trail
  for(var i=0;i&lt;trail.length;i++){
    var a=i/trail.length;
    ctx.globalAlpha=a*0.5;
    ctx.fillStyle=&#x27;#ff2fb9&#x27;;
    var rr=BS/2*a;
    ctx.beginPath(); ctx.arc(trail[i].x+BS/2,trail[i].y+BS/2,rr,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  // orb glow
  var pulse=1+Math.sin(t*0.2)*0.15;
  var og=ctx.createRadialGradient(ballX+BS/2,ballY+BS/2,1,ballX+BS/2,ballY+BS/2,BS*pulse);
  og.addColorStop(0,&#x27;#ffffff&#x27;); og.addColorStop(0.4,&#x27;#22e6ff&#x27;); og.addColorStop(1,&#x27;rgba(255,47,185,0)&#x27;);
  ctx.fillStyle=og;
  ctx.beginPath(); ctx.arc(ballX+BS/2,ballY+BS/2,BS*pulse,0,6.28); ctx.fill();

  // particles
  particles.forEach(function(pt){
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3*pt.life+0.5,0,6.28); ctx.fill();
  });
  ctx.globalAlpha=1;

  // ship paddle
  var pTop=H-PB-PH;
  drawShip(paddleX,pTop,PW,PH);

  ctx.restore();
}

function drawUFO(x,y,w,h,color,gold){
  ctx.save();
  ctx.shadowBlur=gold?18:10; ctx.shadowColor=color;
  // dome
  ctx.fillStyle=&#x27;rgba(200,240,255,0.85)&#x27;;
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.35,w*0.28,h*0.35,0,Math.PI,0); ctx.fill();
  // body
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.55,w*0.5,h*0.32,0,0,6.28); ctx.fill();
  // lights
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#fff&#x27;;
  for(var i=-1;i&lt;=1;i++){ ctx.beginPath(); ctx.arc(x+w/2+i*w*0.28,y+h*0.62,2,0,6.28); ctx.fill(); }
  ctx.restore();
}

function drawShip(x,y,w,h){
  ctx.save();
  ctx.shadowBlur=16; ctx.shadowColor=&#x27;#22e6ff&#x27;;
  var g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,&#x27;#5cf0ff&#x27;); g.addColorStop(1,&#x27;#1076ff&#x27;);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x, y+h);
  ctx.lineTo(x+w*0.15, y);
  ctx.lineTo(x+w*0.85, y);
  ctx.lineTo(x+w, y+h);
  ctx.closePath(); ctx.fill();
  // cockpit
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#ff2fb9&#x27;;
  ctx.beginPath(); ctx.ellipse(x+w/2,y+h*0.4,w*0.12,h*0.35,0,0,6.28); ctx.fill();
  ctx.restore();
}

function startGame(){
  if(running) return;
  score=0; combo=1; chain=0; shake=0; flashV=0;
  for(var k in keys) keys[k]=false;
  paddleX=(W-PW)/2; targetX=paddleX;
  initStars(); makeInvaders(); resetBall(); particles=[];
  scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;x1&#x27;;
  running=true; animId=requestAnimationFrame(tick);
}
function stopGame(){
  if(!running) return; running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keys[e.key]=true;e.preventDefault();}
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var r=cv.getBoundingClientRect();
  var mx=(e.clientX-r.left)*(W/r.width);
  targetX=Math.max(0,Math.min(W-PW,mx-PW/2));
});
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;)startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
});

// initial static paint
initStars(); makeInvaders(); ballX=W/2; ballY=H-70; ballVX=0; ballVY=0;
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
