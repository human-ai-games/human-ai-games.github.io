  &lt;p class=&quot;instructions&quot;&gt;Click the glowing sea creatures before they dart back into the coral to score points. Chain 3+ quick hits for a COMBO with double points, and grab the rare golden treasure chest for a big bonus!&lt;/p&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var BOARD_W = 660, BOARD_H = 430, SIZE = 52;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;scoreVal&#x27;);
  var streakEl = document.getElementById(&#x27;streakVal&#x27;);
  var comboBanner = document.getElementById(&#x27;comboBanner&#x27;);
  var msg = document.getElementById(&#x27;msg&#x27;);

  var score = 0, streak = 0, running = false;
  var spawnTimer = null, bubbleTimer = null;
  var activeTimeouts = [];
  var recentHits = [];

  var CREATURES = [
    { emoji: &#x27;🐡&#x27;, cls: &#x27;puff&#x27; },
    { emoji: &#x27;🎣&#x27;, cls: &#x27;wiggle&#x27; },
    { emoji: &#x27;🦀&#x27;, cls: &#x27;bob&#x27; },
    { emoji: &#x27;🐠&#x27;, cls: &#x27;wiggle&#x27; },
    { emoji: &#x27;🐙&#x27;, cls: &#x27;bob&#x27; }
  ];

  // audio
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  }
  function splash() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = &#x27;sine&#x27;; o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.18);
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.26);
    // noise burst for splash
    var buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i=0;i&lt;d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var ng = audioCtx.createGain(); ng.gain.setValueAtTime(0.15, t); ng.gain.exponentialRampToValueAtTime(0.001, t+0.15);
    src.connect(ng); ng.connect(audioCtx.destination); src.start(t);
  }
  function chestSound() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    [880, 1100, 1320].forEach(function(f, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = &#x27;triangle&#x27;; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i*0.06);
      g.gain.exponentialRampToValueAtTime(0.2, t + i*0.06 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*0.06 + 0.3);
      o.connect(g); g.connect(audioCtx.destination); o.start(t + i*0.06); o.stop(t + i*0.06 + 0.32);
    });
  }
  function comboSound() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(400,t);
    o.frequency.exponentialRampToValueAtTime(1200,t+0.3);
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.36);
  }

  function addCoral() {
    var items = [&#x27;🪸&#x27;,&#x27;🌿&#x27;,&#x27;🐚&#x27;,&#x27;🪨&#x27;,&#x27;🌿&#x27;,&#x27;🪸&#x27;];
    for (var i=0;i&lt;items.length;i++){
      var c = document.createElement(&#x27;div&#x27;);
      c.className = &#x27;coral&#x27;;
      c.textContent = items[i];
      c.style.left = (5 + i * 16) + &#x27;%&#x27;;
      c.style.fontSize = (34 + Math.random()*18) + &#x27;px&#x27;;
      c.style.zIndex = 1;
      board.appendChild(c);
    }
  }

  function spawnBubble() {
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;bubble&#x27;;
    var sz = 4 + Math.random()*12;
    b.style.width = sz+&#x27;px&#x27;; b.style.height = sz+&#x27;px&#x27;;
    b.style.left = Math.random()*BOARD_W + &#x27;px&#x27;;
    var dur = 3 + Math.random()*3;
    b.style.animation = &#x27;rise &#x27; + dur + &#x27;s linear forwards&#x27;;
    board.appendChild(b);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, dur*1000);
  }

  function currentLife() {
    // shortens as score climbs: from 1400ms down to 650ms
    return Math.max(650, 1400 - score * 12);
  }

  function makeSparkles(x, y, color) {
    for (var i=0;i&lt;12;i++){
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;spark&#x27;;
      s.style.left = x+&#x27;px&#x27;; s.style.top = y+&#x27;px&#x27;;
      s.style.background = color;
      s.style.boxShadow = &#x27;0 0 6px &#x27; + color;
      board.appendChild(s);
      var ang = Math.random()*Math.PI*2, dist = 30 + Math.random()*40;
      var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
      s.animate([
        { transform:&#x27;translate(0,0)&#x27;, opacity:1 },
        { transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;, opacity:0 }
      ], { duration: 500 + Math.random()*300, easing:&#x27;ease-out&#x27; });
      (function(sp){ setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 850); })(s);
    }
  }

  function popup(x, y, text, color) {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;popup&#x27;;
    p.textContent = text;
    p.style.color = color;
    p.style.left = x+&#x27;px&#x27;; p.style.top = y+&#x27;px&#x27;;
    board.appendChild(p);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 1000);
  }

  function registerHit() {
    var now = Date.now();
    recentHits.push(now);
    recentHits = recentHits.filter(function(t){ return now - t &lt;= 2000; });
    return recentHits.length &gt;= 3;
  }

  function spawnCreature() {
    if (!running) return;
    var isChest = Math.random() &lt; 0.09;
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;creature&#x27;;
    el.style.zIndex = 10;
    var x = Math.random() * (BOARD_W - SIZE);
    var y = Math.random() * (BOARD_H - SIZE - 30);
    el.style.left = x+&#x27;px&#x27;; el.style.top = y+&#x27;px&#x27;;

    var life, points;
    if (isChest) {
      el.textContent = &#x27;🎁&#x27;;
      el.classList.add(&#x27;chest&#x27;);
      life = 550; points = 5;
    } else {
      var c = CREATURES[Math.floor(Math.random()*CREATURES.length)];
      el.textContent = c.emoji;
      el.classList.add(c.cls);
      life = currentLife(); points = 1;
    }

    var handled = false;
    el.addEventListener(&#x27;mousedown&#x27;, function(ev) {
      if (handled) return;
      handled = true;
      ev.stopPropagation();
      var cx = x + SIZE/2, cy = y + SIZE/2;

      if (isChest) {
        chestSound();
        score += points;
        streak += 1;
        makeSparkles(cx, cy, &#x27;gold&#x27;);
        popup(cx-14, cy, &#x27;+5&#x27;, &#x27;gold&#x27;);
      } else {
        splash();
        var isCombo = registerHit();
        if (isCombo) {
          score += points * 2;
          makeSparkles(cx, cy, &#x27;#ffdb4d&#x27;);
          popup(cx-14, cy, &#x27;+2&#x27;, &#x27;gold&#x27;);
          comboBanner.classList.remove(&#x27;show&#x27;); void comboBanner.offsetWidth;
          comboBanner.classList.add(&#x27;show&#x27;);
          comboSound();
        } else {
          score += points;
          makeSparkles(cx, cy, &#x27;#6ff0c8&#x27;);
          popup(cx-10, cy, &#x27;+1&#x27;, &#x27;#6ff0c8&#x27;);
        }
        streak += 1;
      }
      updateHUD();
      if (el.parentNode) el.parentNode.removeChild(el);
    });

    board.appendChild(el);

    var to = setTimeout(function() {
      if (handled || !el.parentNode) return;
      // escaped
      el.classList.add(&#x27;escaping&#x27;);
      var cx = x + SIZE/2, cy = y + SIZE/2;
      var xm = document.createElement(&#x27;div&#x27;);
      xm.className = &#x27;popup xmark&#x27;;
      xm.textContent = &#x27;✕&#x27;;
      xm.style.left = (cx-8)+&#x27;px&#x27;; xm.style.top = cy+&#x27;px&#x27;;
      board.appendChild(xm);
      setTimeout(function(){ if(xm.parentNode) xm.parentNode.removeChild(xm); }, 1000);
      streak = 0;
      updateHUD();
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 400);
    }, life);
    activeTimeouts.push(to);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    var col = &#x27;#6ff0c8&#x27;;
    if (streak &gt;= 10) col = &#x27;#ff4dff&#x27;;
    else if (streak &gt;= 6) col = &#x27;#ffd24d&#x27;;
    else if (streak &gt;= 3) col = &#x27;#ffa64d&#x27;;
    streakEl.style.color = col;
    streakEl.style.textShadow = &#x27;0 0 8px &#x27; + col;
  }

  function scheduleSpawn() {
    if (!running) return;
    // spawn interval also shrinks as score rises -&gt; chaos near end
    var interval = Math.max(350, 850 - score * 8);
    spawnTimer = setTimeout(function() {
      spawnCreature();
      // occasional double spawn at higher scores
      if (score &gt; 25 &amp;&amp; Math.random() &lt; 0.4) spawnCreature();
      scheduleSpawn();
    }, interval);
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    if (audioCtx &amp;&amp; audioCtx.state === &#x27;suspended&#x27;) audioCtx.resume();
    running = true;
    score = 0; streak = 0; recentHits = [];
    updateHUD();
    msg.style.display = &#x27;none&#x27;;
    spawnCreature();
    scheduleSpawn();
    bubbleTimer = setInterval(spawnBubble, 400);
  }

  function stopGame() {
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (bubbleTimer) { clearInterval(bubbleTimer); bubbleTimer = null; }
    activeTimeouts.forEach(clearTimeout); activeTimeouts = [];
    var creatures = board.querySelectorAll(&#x27;.creature, .spark, .popup, .bubble&#x27;);
    creatures.forEach(function(c){ c.parentNode &amp;&amp; c.parentNode.removeChild(c); });
    msg.textContent = &#x27;Dive over! Score: &#x27; + score;
    msg.style.display = &#x27;block&#x27;;
  }

  addCoral();

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

<script>
