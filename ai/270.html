<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC BREAKOUT ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg,#4fd8ff,#c86bff,#ff5edb); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(140,100,255,.4); }
  .instructions { font-size: 16px; color: #a9a9d6; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; font-size: 18px; align-items: center; }
  .hud b { color: #fff; }
  .combo { color: #ffd24f; }
  .field { position: relative; width: 640px; height: 460px; flex-shrink: 0;
    background: radial-gradient(circle at 50% 30%, #12103a 0%, #060418 70%, #030210 100%);
    border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(90,60,200,.35), inset 0 0 40px rgba(0,0,0,.6); cursor: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your neon paddle with the arrow keys or mouse to bounce the comet and smash the alien bricks. Chain hits without missing to build your combo — you have 60 seconds!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot;&gt;Combo: &lt;b id=&quot;combo&quot;&gt;x1&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Time: &lt;b id=&quot;time&quot;&gt;60&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; class=&quot;field&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 460;
var scoreEl = document.getElementById(&#x27;score&#x27;),
    comboEl = document.getElementById(&#x27;combo&#x27;),
    timeEl = document.getElementById(&#x27;time&#x27;);

var running = false, animId = null;
var keysDown = {};
var score = 0, combo = 1, timeLeft = 60, lastTs = 0, timeAcc = 0;
var level = 1;

var PADDLE_MAX = 110, PADDLE_MIN = 52, PADDLE_H = 14, PADDLE_BOTTOM = 22, PADDLE_SPEED = 8;
var paddleW = PADDLE_MAX, paddleX = (W - paddleW) / 2;
var mouseX = null;

var BALL_R = 8;
var baseSpeed = 5;
var ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
var trail = [];
var particles = [];

// Stars
var stars = [];
for (var i = 0; i &lt; 70; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, tw: Math.random()*Math.PI*2 });
}

var ROW_COLORS = [&#x27;#ff5edb&#x27;,&#x27;#c86bff&#x27;,&#x27;#4f8bff&#x27;,&#x27;#4fd8ff&#x27;,&#x27;#5fffa8&#x27;,&#x27;#ffd24f&#x27;];
var bricks = [];

function buildBricks(dense) {
  bricks = [];
  var cols = dense ? 10 : 8;
  var rows = dense ? 6 : 5;
  var gap = 6, marginX = 24, marginTop = 40;
  var bw = (W - marginX*2 - gap*(cols-1)) / cols;
  var bh = 20;
  for (var r = 0; r &lt; rows; r++) {
    // point value: top rows 3, middle 2, bottom 1
    var val = r &lt; 2 ? 3 : (r &lt; 4 ? 2 : 1);
    var color = ROW_COLORS[r % ROW_COLORS.length];
    for (var c = 0; c &lt; cols; c++) {
      bricks.push({
        x: marginX + c*(bw+gap), y: marginTop + r*(bh+gap),
        w: bw, h: bh, color: color, val: val, alive: true, flash: 0
      });
    }
  }
}

function resetBall() {
  ball.x = W/2; ball.y = H/2 + 20;
  var ang = (Math.random()*0.6 - 0.3);
  ball.vx = Math.sin(ang) * baseSpeed;
  ball.vy = Math.abs(Math.cos(ang)) * baseSpeed * -1; // go up
  // actually launch downward toward paddle first for responsiveness
  ball.vy = Math.abs(ball.vy);
  trail = [];
}

function spawnParticles(x, y, color, n) {
  for (var i = 0; i &lt; n; i++) {
    var a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color, r:Math.random()*3+1 });
  }
}

function startGame() {
  if (running) return;
  score = 0; combo = 1; timeLeft = 60; level = 1;
  baseSpeed = 5;
  paddleW = PADDLE_MAX; paddleX = (W - paddleW)/2;
  particles = []; trail = [];
  buildBricks(false);
  resetBall();
  updateHud();
  running = true;
  lastTs = 0; timeAcc = 0;
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  if (!running) return;
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

function updateHud() {
  scoreEl.textContent = score;
  comboEl.textContent = &#x27;x&#x27; + combo;
  timeEl.textContent = Math.max(0, Math.ceil(timeLeft));
}

function endGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  draw();
  ctx.fillStyle = &#x27;rgba(3,2,16,0.72)&#x27;;
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = &#x27;center&#x27;;
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.font = &#x27;bold 40px system-ui, sans-serif&#x27;;
  ctx.shadowColor = &#x27;#c86bff&#x27;; ctx.shadowBlur = 20;
  ctx.fillText(&#x27;TIME UP!&#x27;, W/2, H/2 - 10);
  ctx.shadowBlur = 0;
  ctx.font = &#x27;24px system-ui, sans-serif&#x27;;
  ctx.fillStyle = &#x27;#ffd24f&#x27;;
  ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 32);
}

function shrinkPaddle() {
  paddleW = Math.max(PADDLE_MIN, paddleW - 3);
}

function loop(ts) {
  if (!running) return;
  if (!lastTs) lastTs = ts;
  var dt = (ts - lastTs) / 1000; lastTs = ts;
  timeLeft -= dt;
  if (timeLeft &lt;= 0) { timeLeft = 0; updateHud(); endGame(); return; }

  update(dt);
  draw();
  updateHud();
  animId = requestAnimationFrame(loop);
}

function update(dt) {
  // paddle movement
  if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
  if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
  if (mouseX !== null) {
    var target = mouseX - paddleW/2;
    paddleX += (target - paddleX) * 0.35;
  }
  paddleX = Math.max(0, Math.min(W - paddleW, paddleX));

  // ball
  ball.x += ball.vx; ball.y += ball.vy;

  // trail
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length &gt; 14) trail.shift();

  if (ball.x - BALL_R &lt;= 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x + BALL_R &gt;= W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - BALL_R &lt;= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

  // paddle collision
  var pTop = H - PADDLE_BOTTOM - PADDLE_H;
  if (ball.vy &gt; 0 &amp;&amp;
      ball.y + BALL_R &gt;= pTop &amp;&amp;
      ball.y + BALL_R &lt;= pTop + PADDLE_H + 12 &amp;&amp;
      ball.x &gt;= paddleX - BALL_R &amp;&amp;
      ball.x &lt;= paddleX + paddleW + BALL_R) {
    // reflect based on hit position
    var rel = (ball.x - (paddleX + paddleW/2)) / (paddleW/2); // -1..1
    rel = Math.max(-1, Math.min(1, rel));
    var speed = Math.hypot(ball.vx, ball.vy);
    var maxAng = Math.PI * 0.42;
    var ang = rel * maxAng;
    ball.vx = Math.sin(ang) * speed;
    ball.vy = -Math.abs(Math.cos(ang) * speed);
    ball.y = pTop - BALL_R;
    combo += 1;
    comboEl.classList.remove(&#x27;bump&#x27;);
    shrinkPaddle();
    spawnParticles(ball.x, pTop, &#x27;#4fd8ff&#x27;, 8);
  }

  // brick collisions
  for (var i = 0; i &lt; bricks.length; i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    if (ball.x + BALL_R &gt; b.x &amp;&amp; ball.x - BALL_R &lt; b.x + b.w &amp;&amp;
        ball.y + BALL_R &gt; b.y &amp;&amp; ball.y - BALL_R &lt; b.y + b.h) {
      // determine bounce direction by smallest overlap
      var overlapL = (ball.x + BALL_R) - b.x;
      var overlapR = (b.x + b.w) - (ball.x - BALL_R);
      var overlapT = (ball.y + BALL_R) - b.y;
      var overlapB = (b.y + b.h) - (ball.y - BALL_R);
      var minO = Math.min(overlapL, overlapR, overlapT, overlapB);
      if (minO === overlapT || minO === overlapB) ball.vy = -ball.vy;
      else ball.vx = -ball.vx;
      b.alive = false;
      score += b.val * combo;
      spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color, 16);
      break;
    }
  }

  // ball lost
  if (ball.y - BALL_R &gt; H) {
    combo = 1;
    resetBall();
  }

  // level clear
  var anyAlive = false;
  for (var j = 0; j &lt; bricks.length; j++) if (bricks[j].alive) { anyAlive = true; break; }
  if (!anyAlive) {
    level += 1;
    baseSpeed += 0.8;
    buildBricks(true);
    // rescale ball speed
    var s = Math.hypot(ball.vx, ball.vy) || baseSpeed;
    ball.vx = ball.vx / s * baseSpeed;
    ball.vy = ball.vy / s * baseSpeed;
  }

  // particles
  for (var p = particles.length - 1; p &gt;= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life -= 0.03;
    if (pt.life &lt;= 0) particles.splice(p, 1);
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = &#x27;rgba(6,4,24,0.35)&#x27;;
  ctx.fillRect(0,0,W,H);

  // stars
  var t = performance.now()/600;
  for (var i = 0; i &lt; stars.length; i++) {
    var s = stars[i];
    var a = 0.4 + 0.5*Math.abs(Math.sin(t + s.tw));
    ctx.fillStyle = &#x27;rgba(200,210,255,&#x27; + a + &#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }

  // bricks
  for (var b = 0; b &lt; bricks.length; b++) {
    var br = bricks[b];
    if (!br.alive) continue;
    ctx.fillStyle = br.color;
    ctx.shadowColor = br.color; ctx.shadowBlur = 10;
    roundRect(br.x, br.y, br.w, br.h, 4); ctx.fill();
    ctx.shadowBlur = 0;
    // inner highlight
    ctx.fillStyle = &#x27;rgba(255,255,255,0.25)&#x27;;
    roundRect(br.x+3, br.y+3, br.w-6, (br.h-6)/2, 2); ctx.fill();
  }

  // trail
  for (var tr = 0; tr &lt; trail.length; tr++) {
    var frac = tr / trail.length;
    ctx.fillStyle = &#x27;rgba(120,200,255,&#x27; + (frac*0.5) + &#x27;)&#x27;;
    ctx.beginPath();
    ctx.arc(trail[tr].x, trail[tr].y, BALL_R * frac * 0.9, 0, Math.PI*2);
    ctx.fill();
  }

  // ball (pulsing comet)
  var pulse = 1 + 0.15*Math.sin(performance.now()/120);
  ctx.shadowColor = &#x27;#8fd8ff&#x27;; ctx.shadowBlur = 20;
  var grad = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, BALL_R*1.6*pulse);
  grad.addColorStop(0, &#x27;#ffffff&#x27;);
  grad.addColorStop(0.5, &#x27;#7fd0ff&#x27;);
  grad.addColorStop(1, &#x27;rgba(80,120,255,0)&#x27;);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*1.6*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // paddle (neon)
  var pTop = H - PADDLE_BOTTOM - PADDLE_H;
  ctx.shadowColor = &#x27;#4fd8ff&#x27;; ctx.shadowBlur = 18;
  var pg = ctx.createLinearGradient(paddleX, 0, paddleX+paddleW, 0);
  pg.addColorStop(0, &#x27;#4fd8ff&#x27;); pg.addColorStop(0.5, &#x27;#c86bff&#x27;); pg.addColorStop(1, &#x27;#4fd8ff&#x27;);
  ctx.fillStyle = pg;
  roundRect(paddleX, pTop, paddleW, PADDLE_H, 7); ctx.fill();
  ctx.shadowBlur = 0;

  // particles
  for (var p = 0; p &lt; particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// input
window.addEventListener(&#x27;keydown&#x27;, function (e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
    keysDown[e.key] = true; mouseX = null; e.preventDefault();
  }
});
window.addEventListener(&#x27;keyup&#x27;, function (e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function (e) {
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
cv.addEventListener(&#x27;touchmove&#x27;, function (e) {
  var rect = cv.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  e.preventDefault();
}, { passive: false });

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static render
buildBricks(false);
resetBall();
draw();
updateHud();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
