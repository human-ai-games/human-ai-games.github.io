<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON SERPENT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #05060a; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg,#00eaff,#39ff88,#ffe14d); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(0,234,255,.3); }
  .instructions { font-size: 16px; color: #9aa; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .scorebar { display: flex; gap: 30px; font-family: &#x27;Courier New&#x27;, monospace; font-weight: 700; font-size: 20px; }
  .scorebar .val { color: #00eaff; }
  .scorebar .hi { color: #ffe14d; }
  .wrap { position: relative; }
  canvas { display: block; background: #080a12; border-radius: 10px; box-shadow: 0 0 30px rgba(0,234,255,.15), inset 0 0 40px rgba(0,234,255,.05); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys or swipe to eat glowing collectibles — white stars (1), magenta gems (3), gold bolts (5). Don&#x27;t hit the walls or yourself, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;scorebar&quot;&gt;
    &lt;div&gt;SCORE &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;HIGH &lt;span class=&quot;hi&quot; id=&quot;high&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var COLS = 26, ROWS = 20, CELL = 24;
  var W = COLS*CELL, H = ROWS*CELL;
  var cv = document.getElementById(&#x27;cv&#x27;);
  cv.width = W; cv.height = H;
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), highEl = document.getElementById(&#x27;high&#x27;);

  var running=false, gameOver=false, high=0;
  var snake, dir, pendingDir, score, speed, tickAcc, lastT;
  var star, gem, bolt, gemTimer, boltTimer, gemVisible, boltVisible;
  var particles, trail, flash, deathParts, gameOverAnim, gridPulse;
  var rafId=null;

  var GEM_INTERVAL=8000, GEM_LIFE=3000, BOLT_LIFE=3000, BOLT_INTERVAL=6000;

  function rand(n){return Math.floor(Math.random()*n);}
  function occupied(x,y){for(var i=0;i&lt;snake.length;i++)if(snake[i].x===x&amp;&amp;snake[i].y===y)return true;return false;}
  function freeCell(){for(var t=0;t&lt;300;t++){var x=rand(COLS),y=rand(ROWS);if(!occupied(x,y))return{x:x,y:y};}return{x:0,y:0};}

  function reset(){
    snake=[{x:6,y:10},{x:5,y:10},{x:4,y:10}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
    score=0; speed=8; tickAcc=0;
    star=freeCell(); gem=null; bolt=null;
    gemTimer=GEM_INTERVAL; boltTimer=BOLT_INTERVAL; gemVisible=false; boltVisible=false;
    particles=[]; trail=[]; flash=0; deathParts=null; gameOverAnim=0; gridPulse=0;
    gameOver=false;
    scoreEl.textContent=&#x27;0&#x27;;
  }

  function burst(cx,cy,color){
    for(var i=0;i&lt;8;i++){
      var a=(Math.PI*2*i/8)+Math.random()*0.4;
      var sp=1.5+Math.random()*2.5;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
    }
  }

  function eat(pts,color,cx,cy,doFlash){
    score+=pts;
    if(score&gt;high){high=score;highEl.textContent=high;}
    scoreEl.textContent=score;
    burst(cx,cy,color);
    if(doFlash) flash=1;
    speed=8+Math.floor(score/5); // gradual speedup every 5 pts
  }

  function step(){
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
    // ghost trail
    trail.unshift({x:head.x,y:head.y}); if(trail.length&gt;4)trail.pop();
    var eatStar=(nx===star.x&amp;&amp;ny===star.y);
    var eatGem=(gemVisible&amp;&amp;gem&amp;&amp;nx===gem.x&amp;&amp;ny===gem.y);
    var eatBolt=(boltVisible&amp;&amp;bolt&amp;&amp;nx===bolt.x&amp;&amp;ny===bolt.y);
    var grow=eatStar||eatGem||eatBolt;
    var body=grow?snake:snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++)if(body[i].x===nx&amp;&amp;body[i].y===ny){die();return;}
    snake.unshift({x:nx,y:ny});
    if(!grow) snake.pop();
    var px=nx*CELL+CELL/2, py=ny*CELL+CELL/2;
    if(eatStar){ eat(1,&#x27;#ffffff&#x27;,px,py,false); star=freeCell(); }
    if(eatGem){ eat(3,&#x27;#ff36c8&#x27;,px,py,false); gemVisible=false; gem=null; gemTimer=GEM_INTERVAL; }
    if(eatBolt){ eat(5,&#x27;#ffd93b&#x27;,px,py,true); boltVisible=false; bolt=null; boltTimer=BOLT_INTERVAL; }
  }

  function die(){
    gameOver=true;
    flash=1.2;
    // explosion
    deathParts=[];
    for(var i=0;i&lt;snake.length;i++){
      var s=snake[i];
      var a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
      deathParts.push({x:s.x*CELL+CELL/2,y:s.y*CELL+CELL/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,hue:180-i*4});
    }
    gameOverAnim=0.0001;
  }

  function update(dt){
    gridPulse+=dt*0.002;
    if(flash&gt;0) flash-=dt*0.003;
    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life-=dt*0.002;
      if(p.life&lt;=0)particles.splice(i,1);
    }
    if(gameOver){
      if(deathParts)for(var j=0;j&lt;deathParts.length;j++){var d=deathParts[j];d.x+=d.vx;d.y+=d.vy;d.vy+=0.08;d.life-=dt*0.0007;}
      if(gameOverAnim&gt;0&amp;&amp;gameOverAnim&lt;1)gameOverAnim=Math.min(1,gameOverAnim+dt*0.003);
      return;
    }
    // collectible timers
    gemTimer-=dt;
    if(gemVisible){ gem.life-=dt; if(gem.life&lt;=0){gemVisible=false;gem=null;gemTimer=GEM_INTERVAL;} }
    else if(gemTimer&lt;=0){ gem=freeCell(); gem.life=GEM_LIFE; gemVisible=true; }
    boltTimer-=dt;
    if(boltVisible){ bolt.life-=dt; if(bolt.life&lt;=0){boltVisible=false;bolt=null;boltTimer=BOLT_INTERVAL;} }
    else if(boltTimer&lt;=0){ bolt=freeCell(); bolt.life=BOLT_LIFE; boltVisible=true; }
    // movement
    tickAcc+=dt;
    var interval=1000/speed;
    while(tickAcc&gt;=interval&amp;&amp;!gameOver){ tickAcc-=interval; step(); }
  }

  function drawGrid(){
    var glow=0.06+0.03*Math.sin(gridPulse);
    ctx.strokeStyle=&#x27;rgba(0,234,255,&#x27;+glow+&#x27;)&#x27;;
    ctx.lineWidth=1;
    for(var x=0;x&lt;=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,H);ctx.stroke();}
    for(var y=0;y&lt;=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(W,y*CELL);ctx.stroke();}
  }

  function drawStar(cx,cy,r,color,rot){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.beginPath();
    for(var i=0;i&lt;10;i++){var ang=Math.PI*i/5-Math.PI/2;var rr=(i%2===0)?r:r*0.45;ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);}
    ctx.closePath();ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=14;ctx.fill();ctx.restore();
  }
  function drawGem(cx,cy,r,color){
    ctx.save();ctx.translate(cx,cy);ctx.beginPath();
    ctx.moveTo(0,-r);ctx.lineTo(r,0);ctx.lineTo(0,r);ctx.lineTo(-r,0);ctx.closePath();
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fill();ctx.restore();
  }
  function drawBolt(cx,cy,r,color){
    ctx.save();ctx.translate(cx,cy);ctx.beginPath();
    ctx.moveTo(-r*0.3,-r);ctx.lineTo(r*0.4,-r*0.1);ctx.lineTo(0,-r*0.1);ctx.lineTo(r*0.3,r);ctx.lineTo(-r*0.4,r*0.1);ctx.lineTo(0,r*0.1);ctx.closePath();
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=20;ctx.fill();ctx.restore();
  }

  function segColor(i,n){
    var t=n&lt;=1?0:i/(n-1);
    // cyan -&gt; green -&gt; yellow
    var r,g,b;
    if(t&lt;0.5){var k=t/0.5;r=Math.round(0+57*k);g=Math.round(234+21*k);b=Math.round(255-119*k);}
    else{var k2=(t-0.5)/0.5;r=Math.round(57+198*k2);g=Math.round(255-30*k2);b=Math.round(136-59*k2);}
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=&#x27;#080a12&#x27;;ctx.fillRect(0,0,W,H);
    drawGrid();

    // ghost trail
    for(var t=0;t&lt;trail.length;t++){
      var tr=trail[t];var al=0.18*(1-t/trail.length);
      ctx.fillStyle=&#x27;rgba(0,234,255,&#x27;+al+&#x27;)&#x27;;
      ctx.fillRect(tr.x*CELL+3,tr.y*CELL+3,CELL-6,CELL-6);
    }

    // collectibles
    var pr=gridPulse;
    if(!gameOver){
      drawStar(star.x*CELL+CELL/2,star.y*CELL+CELL/2,CELL*0.38,&#x27;#ffffff&#x27;,pr);
      if(gemVisible&amp;&amp;gem){var fl=0.5+0.5*Math.sin(pr*8);ctx.globalAlpha=fl;drawGem(gem.x*CELL+CELL/2,gem.y*CELL+CELL/2,CELL*0.42,&#x27;#ff36c8&#x27;);ctx.globalAlpha=1;}
      if(boltVisible&amp;&amp;bolt){drawBolt(bolt.x*CELL+CELL/2,bolt.y*CELL+CELL/2,CELL*0.44,&#x27;#ffd93b&#x27;);}
    }

    // snake
    if(!gameOver){
      var n=snake.length;
      for(var i=n-1;i&gt;=0;i--){
        var s=snake[i];var c=segColor(i,n);
        ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=(i===0)?16:8;
        var g=2;
        var rr=6;
        roundRect(s.x*CELL+g,s.y*CELL+g,CELL-g*2,CELL-g*2,rr);ctx.fill();
      }
      ctx.shadowBlur=0;
    } else if(deathParts){
      for(var d=0;d&lt;deathParts.length;d++){var dp=deathParts[d];if(dp.life&lt;=0)continue;
        ctx.globalAlpha=Math.max(0,dp.life);ctx.fillStyle=&#x27;hsl(&#x27;+dp.hue+&#x27;,100%,60%)&#x27;;
        ctx.beginPath();ctx.arc(dp.x,dp.y,CELL*0.35*dp.life,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
    }

    // particles
    for(var p=0;p&lt;particles.length;p++){var pt=particles[p];ctx.globalAlpha=Math.max(0,pt.life);
      ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,3*pt.life,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;

    // flash overlay
    if(flash&gt;0){ctx.fillStyle=(gameOver?&#x27;rgba(255,40,40,&#x27;:&#x27;rgba(255,255,200,&#x27;)+Math.min(0.6,flash*0.5)+&#x27;)&#x27;;ctx.fillRect(0,0,W,H);}

    // game over text
    if(gameOver&amp;&amp;gameOverAnim&gt;0){
      var e=gameOverAnim;var sc=0.6+0.4*e;
      ctx.save();ctx.globalAlpha=e;ctx.translate(W/2,H/2);ctx.scale(sc,sc);
      ctx.textAlign=&#x27;center&#x27;;ctx.fillStyle=&#x27;#ff3b6b&#x27;;ctx.shadowColor=&#x27;#ff3b6b&#x27;;ctx.shadowBlur=25;
      ctx.font=&#x27;800 52px Courier New, monospace&#x27;;ctx.fillText(&#x27;GAME OVER&#x27;,0,-10);
      ctx.shadowBlur=10;ctx.fillStyle=&#x27;#ffe14d&#x27;;ctx.font=&#x27;700 26px Courier New, monospace&#x27;;
      ctx.fillText(&#x27;SCORE &#x27;+score,0,36);
      ctx.restore();
    }

    ctx.shadowBlur=0;
  }

  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function loop(t){
    if(!lastT)lastT=t;var dt=Math.min(50,t-lastT);lastT=t;
    if(running)update(dt);
    render();
    rafId=requestAnimationFrame(loop);
  }

  function startGame(){reset();running=true;lastT=0;if(!rafId)rafId=requestAnimationFrame(loop);}
  function stopGame(){running=false;}

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){pendingDir={x:-1,y:0};e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){pendingDir={x:1,y:0};e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){pendingDir={x:0,y:-1};e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){pendingDir={x:0,y:1};e.preventDefault();}
  });

  // swipe support
  var tsx=0,tsy=0;
  cv.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
  cv.addEventListener(&#x27;touchend&#x27;,function(e){var t=e.changedTouches[0];var dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20)return;
    if(Math.abs(dx)&gt;Math.abs(dy))pendingDir={x:dx&gt;0?1:-1,y:0};else pendingDir={x:0,y:dy&gt;0?1:-1};},{passive:true});

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
    },true);
  });

  reset();render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
