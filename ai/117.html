<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a6b6b; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; color: #ffe08a; text-shadow: 2px 2px 0 #045; letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #d8fbfb; max-width: 600px; margin: 0; line-height: 1.35; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .score { font-size: 30px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #045; }
  .score span { color: #ffe08a; }
  .combo { font-size: 20px; font-weight: 900; padding: 4px 14px; border-radius: 20px; background: linear-gradient(#ffd24a,#ffab00); color: #6a3d00; box-shadow: 0 3px 8px rgba(0,0,0,.35); opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s; }
  .combo.show { opacity: 1; transform: scale(1); animation: comboPulse .5s infinite alternate; }
  @keyframes comboPulse { to { transform: scale(1.08); } }
  .board { position: relative; width: 660px; height: 460px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
    background: linear-gradient(#0fa3a3 0%, #0c8f95 55%, #d9c088 100%); box-shadow: inset 0 0 60px rgba(0,40,40,.4); cursor: pointer; }
  .sand { position: absolute; left: 0; bottom: 0; width: 100%; height: 90px; background: linear-gradient(#e6cf94, #cdb072); border-radius: 50% 50% 0 0 / 40px 40px 0 0; }
  .weed { position: absolute; bottom: 40px; width: 14px; height: 90px; background: #0b7a4a; border-radius: 8px; transform-origin: bottom center; animation: sway 3s ease-in-out infinite alternate; }
  .weed.b { background: #14a05f; height: 120px; }
  @keyframes sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  .coral { position: absolute; bottom: 55px; font-size: 46px; filter: drop-shadow(0 3px 3px rgba(0,0,0,.25)); user-select: none; }
  .crab { position: absolute; width: 62px; height: 62px; font-size: 52px; line-height: 62px; text-align: center; cursor: pointer; user-select: none;
    transform: scale(0); filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }
  .crab.up { animation: pop .28s cubic-bezier(.2,1.6,.4,1) forwards, wiggle .5s ease-in-out .28s infinite alternate; }
  .crab.down { animation: dropdown .25s ease-in forwards; }
  @keyframes pop { from { transform: scale(0) translateY(20px); } to { transform: scale(1) translateY(0); } }
  @keyframes dropdown { to { transform: scale(0) translateY(24px); } }
  @keyframes wiggle { from { transform: scale(1) rotate(-8deg); } to { transform: scale(1) rotate(8deg); } }
  .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.4)); pointer-events: none; animation: rise .8s ease-out forwards; }
  @keyframes rise { to { transform: translateY(-70px) scale(.3); opacity: 0; } }
  .plus { position: absolute; font-size: 26px; font-weight: 900; color: #ffe08a; text-shadow: 1px 1px 2px #045; pointer-events: none; animation: floatup .8s ease-out forwards; }
  @keyframes floatup { to { transform: translateY(-46px); opacity: 0; } }
  .xmiss { position: absolute; font-size: 30px; font-weight: 900; color: #ff5555; pointer-events: none; animation: xpulse .6s ease-out forwards; }
  @keyframes xpulse { 0% { transform: scale(.4); opacity: 0; } 30% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦀 Crab Splash! 🦀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the crabs the instant they scuttle out from the coral to score points. Hit several in a row quickly to build a golden COMBO for bonus points!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;COMBO x2&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;sand&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 660, BOARD_H = 460, CRAB = 62;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);

  var score = 0, running = false;
  var spawnId = null;
  var moleTimeouts = [];
  var comboCount = 0, comboTimer = null, comboMult = 1;

  var audioCtx = null;
  function beep(freq, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
      o.frequency.exponentialRampToValueAtTime(freq * 1.8, audioCtx.currentTime + 0.15);
      o.start(); o.stop(audioCtx.currentTime + 0.24);
    } catch (_) {}
  }

  // decorative scenery
  function buildScene() {
    var corals = [&#x27;🪸&#x27;,&#x27;🪸&#x27;,&#x27;🐚&#x27;,&#x27;🪸&#x27;,&#x27;🐚&#x27;];
    for (var i = 0; i &lt; 5; i++) {
      var c = document.createElement(&#x27;div&#x27;);
      c.className = &#x27;coral&#x27;;
      c.textContent = corals[i];
      c.style.left = (30 + i * 130) + &#x27;px&#x27;;
      c.style.fontSize = (38 + Math.random()*16) + &#x27;px&#x27;;
      board.appendChild(c);
    }
    for (var w = 0; w &lt; 7; w++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;weed&#x27; + (w % 2 ? &#x27; b&#x27; : &#x27;&#x27;);
      s.style.left = (20 + w * 92) + &#x27;px&#x27;;
      s.style.animationDelay = (Math.random()*2) + &#x27;s&#x27;;
      board.appendChild(s);
    }
  }
  buildScene();

  function difficulty() {
    // returns {spawn, life}
    var spawn = Math.max(420, 950 - score * 12);
    var life = Math.max(650, 1300 - score * 14);
    return { spawn: spawn, life: life };
  }

  function showCombo() {
    if (comboMult &gt; 1) {
      comboEl.textContent = &#x27;COMBO x&#x27; + comboMult;
      comboEl.classList.add(&#x27;show&#x27;);
    } else {
      comboEl.classList.remove(&#x27;show&#x27;);
    }
  }

  function registerHit() {
    comboCount++;
    if (comboCount &gt;= 5) comboMult = 3;
    else if (comboCount &gt;= 3) comboMult = 2;
    else comboMult = 1;
    showCombo();
    if (comboTimer) clearTimeout(comboTimer);
    comboTimer = setTimeout(function () {
      comboCount = 0; comboMult = 1; showCombo();
    }, 1100);
  }

  function fx(x, y, points) {
    // bubbles
    for (var i = 0; i &lt; 7; i++) {
      var b = document.createElement(&#x27;div&#x27;);
      b.className = &#x27;bubble&#x27;;
      var sz = 6 + Math.random() * 12;
      b.style.width = sz + &#x27;px&#x27;; b.style.height = sz + &#x27;px&#x27;;
      b.style.left = (x + (Math.random() * 40 - 20)) + &#x27;px&#x27;;
      b.style.top = (y + (Math.random() * 20 - 10)) + &#x27;px&#x27;;
      b.style.animationDelay = (Math.random() * 0.15) + &#x27;s&#x27;;
      board.appendChild(b);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 950); })(b);
    }
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;plus&#x27;;
    p.textContent = &#x27;+&#x27; + points;
    p.style.left = x + &#x27;px&#x27;; p.style.top = (y - 10) + &#x27;px&#x27;;
    board.appendChild(p);
    setTimeout(function () { if (p.parentNode) p.parentNode.removeChild(p); }, 800);
  }

  function missMark(x, y) {
    var m = document.createElement(&#x27;div&#x27;);
    m.className = &#x27;xmiss&#x27;;
    m.textContent = &#x27;✖&#x27;;
    m.style.left = x + &#x27;px&#x27;; m.style.top = y + &#x27;px&#x27;;
    board.appendChild(m);
    setTimeout(function () { if (m.parentNode) m.parentNode.removeChild(m); }, 600);
    beep(180, &#x27;sawtooth&#x27;);
  }

  function spawnCrab() {
    if (!running) return;
    var d = difficulty();
    var crab = document.createElement(&#x27;div&#x27;);
    crab.className = &#x27;crab up&#x27;;
    crab.textContent = &#x27;🦀&#x27;;
    var left = Math.random() * (BOARD_W - CRAB - 20) + 10;
    var top = Math.random() * (BOARD_H - CRAB - 140) + 40;
    crab.style.left = left + &#x27;px&#x27;;
    crab.style.top = top + &#x27;px&#x27;;
    var done = false;

    crab.addEventListener(&#x27;mousedown&#x27;, function (ev) {
      if (done) return;
      done = true;
      ev.stopPropagation();
      registerHit();
      var pts = 1 * comboMult;
      score += pts;
      scoreEl.textContent = score;
      var cx = left + CRAB / 2, cy = top + CRAB / 2;
      fx(cx, cy, pts);
      beep(comboMult &gt; 1 ? 660 : 520, &#x27;triangle&#x27;);
      crab.classList.remove(&#x27;up&#x27;); crab.classList.add(&#x27;down&#x27;);
      setTimeout(function () { if (crab.parentNode) crab.parentNode.removeChild(crab); }, 200);
    });

    board.appendChild(crab);

    var t = setTimeout(function () {
      if (done) return;
      done = true;
      crab.classList.remove(&#x27;up&#x27;); crab.classList.add(&#x27;down&#x27;);
      setTimeout(function () { if (crab.parentNode) crab.parentNode.removeChild(crab); }, 240);
    }, d.life);
    moleTimeouts.push(t);
  }

  function scheduleSpawn() {
    if (!running) return;
    spawnCrab();
    var d = difficulty();
    spawnId = setTimeout(scheduleSpawn, d.spawn);
  }

  function clearAll() {
    for (var i = 0; i &lt; moleTimeouts.length; i++) clearTimeout(moleTimeouts[i]);
    moleTimeouts = [];
    var crabs = board.querySelectorAll(&#x27;.crab, .bubble, .plus, .xmiss&#x27;);
    for (var j = 0; j &lt; crabs.length; j++) crabs[j].parentNode.removeChild(crabs[j]);
  }

  // missing a crab: clicking empty board area
  board.addEventListener(&#x27;mousedown&#x27;, function (ev) {
    if (!running) return;
    var r = board.getBoundingClientRect();
    var x = ev.clientX - r.left, y = ev.clientY - r.top;
    // if click was not on a crab, count as miss and reset combo
    if (ev.target === board || ev.target.classList.contains(&#x27;sand&#x27;) ||
        ev.target.classList.contains(&#x27;coral&#x27;) || ev.target.classList.contains(&#x27;weed&#x27;)) {
      missMark(x, y);
      comboCount = 0; comboMult = 1; showCombo();
    }
  });

  function startGame() {
    if (running) return;
    running = true;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    comboCount = 0; comboMult = 1; showCombo();
    clearAll();
    scheduleSpawn();
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnId) { clearTimeout(spawnId); spawnId = null; }
    if (comboTimer) { clearTimeout(comboTimer); comboTimer = null; }
    clearAll();
    comboEl.classList.remove(&#x27;show&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
