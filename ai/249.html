&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ GALACTIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the plasma paddle with the mouse or ← → arrows to bounce the energy orb and smash the alien bricks. Hit bricks in a row without dropping the ball to build combo multipliers — press Start below!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;label&quot;&gt;SCORE&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;label&quot;&gt;COMBO&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;mult&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;label&quot;&gt;TIME&lt;/span&gt; &lt;span class=&quot;val&quot; id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;

&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var W=cv.width, H=cv.height;
var scoreEl=document.getElementById(&#x27;score&#x27;), multEl=document.getElementById(&#x27;mult&#x27;),
    timeEl=document.getElementById(&#x27;time&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;);

var running=false, animId=null;
var score=0, mult=1, timeLeft=60, lastTs=0, timeAcc=0;
var keys={};

// paddle
var PADDLE_W=110, PADDLE_H=14, paddleX=(W-PADDLE_W)/2, PADDLE_Y=H-28, PADDLE_SPEED=8;
var mouseX=null;

// ball
var BASE_SPEED=4.4, BALL_R=8;
var ball={x:W/2,y:H-60,vx:0,vy:0};
var trail=[];

// bricks
var COLS=10, ROWS=5, BRICK_H=22, BRICK_GAP=4, TOP_OFFSET=40;
var BRICK_W=(W-BRICK_GAP*(COLS+1))/COLS;
var rowColors=[&#x27;#ff4b6e&#x27;,&#x27;#ff9d2e&#x27;,&#x27;#ffe14b&#x27;,&#x27;#4bff9d&#x27;,&#x27;#4bd8ff&#x27;];
var rowPoints=[10,20,30,40,50]; // bottom row (index ROWS-1) easy... top worth more
var bricks=[];
var particles=[];
var stars=[];

function initStars(){
  stars=[];
  for(var i=0;i&lt;70;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,tw:Math.random()*Math.PI*2});
  }
}
initStars();

function buildBricks(){
  bricks=[];
  for(var r=0;r&lt;ROWS;r++){
    for(var c=0;c&lt;COLS;c++){
      bricks.push({
        x:BRICK_GAP+c*(BRICK_W+BRICK_GAP),
        y:TOP_OFFSET+r*(BRICK_H+BRICK_GAP),
        w:BRICK_W,h:BRICK_H,
        color:rowColors[r],
        points:rowPoints[ROWS-1-r], // top rows worth more
        alive:true
      });
    }
  }
}

function launchBall(dramatic){
  ball.x=W/2; ball.y=H-60;
  var ang=(-Math.PI/2)+(Math.random()*0.8-0.4);
  var sp=currentSpeed();
  ball.vx=Math.cos(ang)*sp;
  ball.vy=Math.sin(ang)*sp;
  trail=[];
  if(dramatic) flash=18;
}

function currentSpeed(){
  return BASE_SPEED + Math.min(4.5, score/220);
}

var flash=0;

function resetGame(){
  score=0; mult=1; timeLeft=60; timeAcc=0;
  paddleX=(W-PADDLE_W)/2; mouseX=null;
  particles=[]; flash=0;
  for(var k in keys) keys[k]=false;
  buildBricks();
  launchBall(false);
  updateHud();
}

function updateHud(){
  scoreEl.textContent=score;
  multEl.textContent=&#x27;x&#x27;+mult;
  timeEl.textContent=Math.max(0,Math.ceil(timeLeft));
}

function showCombo(m){
  comboEl.textContent=&#x27;x&#x27;+m+&#x27; COMBO!&#x27;;
  comboEl.classList.remove(&#x27;show&#x27;);
  void comboEl.offsetWidth;
  comboEl.classList.add(&#x27;show&#x27;);
  setTimeout(function(){comboEl.classList.remove(&#x27;show&#x27;);},700);
}

function explode(x,y,color){
  for(var i=0;i&lt;14;i++){
    var a=Math.random()*Math.PI*2, s=Math.random()*3.5+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

function hitCount(){
  // used for combo scaling
}

var consecHits=0;

function tick(ts){
  if(!running) return;
  if(!lastTs) lastTs=ts;
  var dt=(ts-lastTs)/1000; lastTs=ts;
  timeLeft-=dt;
  if(timeLeft&lt;=0){ timeLeft=0; updateHud(); render(); running=false; drawGameOver(); return; }

  // paddle control
  if(keys[&#x27;ArrowLeft&#x27;]) paddleX-=PADDLE_SPEED;
  if(keys[&#x27;ArrowRight&#x27;]) paddleX+=PADDLE_SPEED;
  if(mouseX!==null){
    var target=mouseX-PADDLE_W/2;
    paddleX+=(target-paddleX)*0.35;
  }
  paddleX=Math.max(0,Math.min(W-PADDLE_W,paddleX));

  // ball move
  ball.x+=ball.vx; ball.y+=ball.vy;
  trail.unshift({x:ball.x,y:ball.y});
  if(trail.length&gt;10) trail.pop();

  // walls
  if(ball.x-BALL_R&lt;=0){ball.x=BALL_R; ball.vx=Math.abs(ball.vx);}
  if(ball.x+BALL_R&gt;=W){ball.x=W-BALL_R; ball.vx=-Math.abs(ball.vx);}
  if(ball.y-BALL_R&lt;=0){ball.y=BALL_R; ball.vy=Math.abs(ball.vy);}

  // paddle collision
  if(ball.vy&gt;0 &amp;&amp; ball.y+BALL_R&gt;=PADDLE_Y &amp;&amp; ball.y+BALL_R&lt;=PADDLE_Y+PADDLE_H+10 &amp;&amp;
     ball.x&gt;=paddleX-BALL_R &amp;&amp; ball.x&lt;=paddleX+PADDLE_W+BALL_R){
    var hit=(ball.x-(paddleX+PADDLE_W/2))/(PADDLE_W/2); // -1..1
    var sp=currentSpeed();
    var ang=(-Math.PI/2)+hit*(Math.PI/3);
    ball.vx=Math.cos(ang)*sp;
    ball.vy=Math.sin(ang)*sp;
    ball.y=PADDLE_Y-BALL_R;
  }

  // fell past
  if(ball.y-BALL_R&gt;H){
    consecHits=0; mult=1; updateHud();
    launchBall(true);
  }

  // brick collision
  for(var i=0;i&lt;bricks.length;i++){
    var b=bricks[i];
    if(!b.alive) continue;
    if(ball.x+BALL_R&gt;b.x &amp;&amp; ball.x-BALL_R&lt;b.x+b.w &amp;&amp;
       ball.y+BALL_R&gt;b.y &amp;&amp; ball.y-BALL_R&lt;b.y+b.h){
      b.alive=false;
      explode(b.x+b.w/2,b.y+b.h/2,b.color);
      consecHits++;
      var newMult = consecHits&gt;=9?4 : consecHits&gt;=6?3 : consecHits&gt;=3?2 : 1;
      if(newMult&gt;mult){ mult=newMult; showCombo(mult); }
      score+=b.points*mult;
      // bounce: determine side
      var overlapL=ball.x+BALL_R-b.x, overlapR=b.x+b.w-(ball.x-BALL_R);
      var overlapT=ball.y+BALL_R-b.y, overlapB=b.y+b.h-(ball.y-BALL_R);
      var minH=Math.min(overlapL,overlapR), minV=Math.min(overlapT,overlapB);
      if(minH&lt;minV){ ball.vx=-ball.vx; } else { ball.vy=-ball.vy; }
      updateHud();
      break;
    }
  }

  // refill if all cleared
  var anyAlive=false;
  for(var j=0;j&lt;bricks.length;j++){ if(bricks[j].alive){anyAlive=true;break;} }
  if(!anyAlive){ buildBricks(); }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=0.03;
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  if(flash&gt;0) flash--;

  render();
  animId=requestAnimationFrame(tick);
}

function render(){
  ctx.clearRect(0,0,W,H);
  // background
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#0a021f&#x27;); g.addColorStop(1,&#x27;#04000e&#x27;);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // stars
  var t=Date.now()/600;
  for(var s=0;s&lt;stars.length;s++){
    var st=stars[s];
    var a=0.4+0.4*Math.sin(t+st.tw);
    ctx.globalAlpha=a; ctx.fillStyle=&#x27;#cfe0ff&#x27;;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // bricks
  for(var i=0;i&lt;bricks.length;i++){
    var b=bricks[i]; if(!b.alive) continue;
    ctx.shadowColor=b.color; ctx.shadowBlur=10;
    ctx.fillStyle=b.color;
    roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;rgba(255,255,255,0.25)&#x27;;
    roundRect(b.x,b.y,b.w,b.h/2.4,4); ctx.fill();
  }

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.shadowColor=pt.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // ball trail
  for(var tr=trail.length-1;tr&gt;=0;tr--){
    var frac=1-tr/trail.length;
    ctx.globalAlpha=frac*0.5;
    ctx.fillStyle=&#x27;#66e0ff&#x27;;
    ctx.beginPath(); ctx.arc(trail[tr].x,trail[tr].y,BALL_R*frac,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  var pulse=1+0.15*Math.sin(Date.now()/120);
  ctx.shadowColor=&#x27;#00f0ff&#x27;; ctx.shadowBlur=18;
  var bg=ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,BALL_R*pulse);
  bg.addColorStop(0,&#x27;#ffffff&#x27;); bg.addColorStop(0.5,&#x27;#66f0ff&#x27;); bg.addColorStop(1,&#x27;#0088ff&#x27;);
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R*pulse,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // paddle
  ctx.shadowColor=&#x27;#c04bff&#x27;; ctx.shadowBlur=16;
  var pg=ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
  pg.addColorStop(0,&#x27;#00f0ff&#x27;); pg.addColorStop(0.5,&#x27;#c04bff&#x27;); pg.addColorStop(1,&#x27;#ff4bd8&#x27;);
  ctx.fillStyle=pg;
  roundRect(paddleX,PADDLE_Y,PADDLE_W,PADDLE_H,7); ctx.fill();
  ctx.shadowBlur=0;

  // flash
  if(flash&gt;0){
    ctx.globalAlpha=flash/18*0.6;
    ctx.fillStyle=&#x27;#ffffff&#x27;; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawGameOver(){
  ctx.fillStyle=&#x27;rgba(5,0,20,0.75)&#x27;; ctx.fillRect(0,0,W,H);
  ctx.textAlign=&#x27;center&#x27;;
  ctx.fillStyle=&#x27;#00f0ff&#x27;; ctx.shadowColor=&#x27;#00f0ff&#x27;; ctx.shadowBlur=20;
  ctx.font=&#x27;800 40px system-ui,sans-serif&#x27;;
  ctx.fillText(&#x27;TIME UP!&#x27;,W/2,H/2-20);
  ctx.shadowColor=&#x27;#ff4bd8&#x27;;
  ctx.fillStyle=&#x27;#ff9dea&#x27;;
  ctx.font=&#x27;800 28px system-ui,sans-serif&#x27;;
  ctx.fillText(&#x27;Score: &#x27;+score,W/2,H/2+25);
  ctx.shadowBlur=0; ctx.textAlign=&#x27;start&#x27;;
}

function startGame(){
  if(running) return;
  resetGame();
  running=true; lastTs=0;
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; mouseX=null; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var r=cv.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
});
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static render
buildBricks();
launchBall(false);
render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');

  function applyFit() {
    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';

    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
