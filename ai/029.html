<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>☄ Comet Dash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#7fd4ff,#c9a4ff,#ffd479); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9fb0d8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #060814; box-shadow: 0 0 30px rgba(80,120,255,0.25); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;☄ Comet Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hold &lt;strong&gt;Space&lt;/strong&gt; or the mouse to boost upward, release to drift down. Grab stars and dodge asteroids — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;500&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage(
        { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
        &#x27;*&#x27;
      );
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var running = false, animId = null;
var score, mult, starsCollected, best = 0;
var comet, cometVY, boosting;
var stars, asteroids, trail, particles, layers;
var baseSpeed, speedMul, warpFlash, spawnTimer, starTimer;
var gameOver;

var GRAVITY = 0.32, BOOST = -0.62, MAXV = 8;

function reset() {
  score = 0; mult = 1; starsCollected = 0;
  comet = { x: 130, y: H/2, r: 12 };
  cometVY = 0; boosting = false;
  stars = []; asteroids = []; trail = []; particles = [];
  baseSpeed = 2.6; speedMul = 1; warpFlash = 0;
  spawnTimer = 0; starTimer = 0; gameOver = false;
  layers = [[],[],[]];
  var counts = [40, 26, 16];
  var speeds = [0.3, 0.7, 1.3];
  var sizes = [0.7, 1.2, 1.8];
  for (var l=0; l&lt;3; l++) {
    for (var i=0; i&lt;counts[l]; i++) {
      layers[l].push({ x: Math.random()*W, y: Math.random()*H, s: speeds[l], sz: sizes[l] });
    }
  }
}

function spawnStar() {
  stars.push({ x: W+20, y: 40 + Math.random()*(H-80), r: 9, ph: Math.random()*6.28 });
}

function spawnAsteroid() {
  var t = Math.random();
  var type;
  if (t &lt; 0.5) type = &#x27;small&#x27;;
  else if (t &lt; 0.85) type = &#x27;medium&#x27;;
  else type = &#x27;large&#x27;;
  var a = { x: W+40, type: type, rot: 0, rotv: (Math.random()-0.5)*0.15 };
  if (type === &#x27;small&#x27;) {
    a.y = 30 + Math.random()*(H-60); a.r = 12; a.vx = -(baseSpeed*speedMul+2.2); a.vy = 0;
  } else if (type === &#x27;medium&#x27;) {
    a.y = 60 + Math.random()*(H-120); a.baseY = a.y; a.r = 20;
    a.vx = -(baseSpeed*speedMul+0.6); a.amp = 40+Math.random()*40; a.freq = 0.03+Math.random()*0.02; a.t = 0;
  } else {
    a.y = 80 + Math.random()*(H-160); a.r = 34; a.vx = -(baseSpeed*speedMul); a.vy = 0; a.grazed = false;
  }
  asteroids.push(a);
}

function splitLarge(a) {
  for (var i=0;i&lt;2;i++) {
    asteroids.push({ x: a.x, y: a.y + (i?24:-24), type:&#x27;small&#x27;, r: 13,
      vx: a.vx-0.5, vy: (i?1.4:-1.4), rot:0, rotv:(Math.random()-0.5)*0.2 });
  }
}

function burst(x,y,color,n) {
  for (var i=0;i&lt;n;i++) {
    var ang = Math.random()*6.28, sp = 1+Math.random()*3;
    particles.push({ x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:1, color:color });
  }
}

// audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.15;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  } catch(_){}
}

function trailColor() {
  // white -&gt; gold as mult climbs
  var t = Math.min(1, (mult-1)/8);
  var r = 255, g = Math.round(255 - 40*t), b = Math.round(255 - 175*t);
  return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
}

function tick() {
  if (!running) return;
  // physics
  cometVY += boosting ? BOOST : GRAVITY;
  if (cometVY &gt; MAXV) cometVY = MAXV;
  if (cometVY &lt; -MAXV) cometVY = -MAXV;
  comet.y += cometVY;
  if (comet.y &lt; comet.r) { comet.y = comet.r; cometVY = 0; }
  if (comet.y &gt; H-comet.r) { comet.y = H-comet.r; cometVY = 0; }

  // trail
  trail.push({ x: comet.x-8, y: comet.y, life: 1, color: trailColor() });
  if (trail.length &gt; 30) trail.shift();
  for (var i=trail.length-1;i&gt;=0;i--){ trail[i].life -= 0.04; if (trail[i].life&lt;=0) trail.splice(i,1); }

  // layers parallax
  for (var l=0;l&lt;3;l++) {
    for (var i=0;i&lt;layers[l].length;i++) {
      var s = layers[l][i];
      s.x -= s.s * speedMul;
      if (s.x &lt; 0) { s.x = W; s.y = Math.random()*H; }
    }
  }

  // spawns
  spawnTimer--; starTimer--;
  if (spawnTimer &lt;= 0) { spawnAsteroid(); spawnTimer = Math.max(35, 90 - speedMul*10); }
  if (starTimer &lt;= 0) { spawnStar(); starTimer = 70 + Math.random()*50; }

  // stars
  for (var i=stars.length-1;i&gt;=0;i--) {
    var st = stars[i];
    st.x -= baseSpeed*speedMul; st.ph += 0.15;
    var dx = st.x-comet.x, dy = st.y-comet.y;
    if (dx*dx+dy*dy &lt; (st.r+comet.r)*(st.r+comet.r)) {
      stars.splice(i,1);
      starsCollected++; mult = 1 + Math.floor(starsCollected/1)*0.4;
      score += Math.round(10*mult);
      burst(st.x, st.y, &#x27;#ffd479&#x27;, 12);
      beep(600+starsCollected*20, 0.15, &#x27;triangle&#x27;, 0.12);
      if (starsCollected % 5 === 0) {
        warpFlash = 1; speedMul += 0.35;
        beep(200, 0.4, &#x27;sawtooth&#x27;, 0.18);
        burst(comet.x, comet.y, &#x27;#7fd4ff&#x27;, 24);
      }
      continue;
    }
    if (st.x &lt; -20) stars.splice(i,1);
  }

  // asteroids
  for (var i=asteroids.length-1;i&gt;=0;i--) {
    var a = asteroids[i];
    a.rot += a.rotv||0;
    if (a.type === &#x27;medium&#x27;) { a.t++; a.x += a.vx; a.y = a.baseY + Math.sin(a.t*a.freq)*a.amp; }
    else { a.x += a.vx; a.y += a.vy||0; }
    var dx = a.x-comet.x, dy = a.y-comet.y;
    var dist = Math.sqrt(dx*dx+dy*dy);
    if (a.type === &#x27;large&#x27; &amp;&amp; !a.grazed &amp;&amp; dist &lt; a.r+comet.r+10 &amp;&amp; dist &gt;= a.r+comet.r) {
      a.grazed = true; splitLarge(a); asteroids.splice(i,1);
      score += 25; burst(a.x, a.y, &#x27;#ffb0b0&#x27;, 16);
      beep(160, 0.25, &#x27;square&#x27;, 0.14);
      continue;
    }
    if (dist &lt; a.r+comet.r-2) {
      gameOver = true; endGame(); return;
    }
    if (a.x &lt; -60) asteroids.splice(i,1);
  }

  // particles
  for (var i=particles.length-1;i&gt;=0;i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vx*=0.96; p.vy*=0.96; p.life -= 0.03;
    if (p.life&lt;=0) particles.splice(i,1);
  }

  if (warpFlash &gt; 0) warpFlash -= 0.05;

  draw();
  animId = requestAnimationFrame(tick);
}

function draw() {
  // nebula bg
  var grd = ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,&#x27;#0a0c22&#x27;); grd.addColorStop(0.5,&#x27;#0b0818&#x27;); grd.addColorStop(1,&#x27;#12081f&#x27;);
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  // star layers
  var alphas = [0.4,0.7,1];
  for (var l=0;l&lt;3;l++) {
    ctx.fillStyle = &#x27;rgba(200,215,255,&#x27;+alphas[l]+&#x27;)&#x27;;
    for (var i=0;i&lt;layers[l].length;i++) {
      var s = layers[l][i];
      ctx.beginPath(); ctx.arc(s.x,s.y,s.sz,0,6.28); ctx.fill();
    }
  }

  // trail
  for (var i=0;i&lt;trail.length;i++) {
    var t = trail[i];
    ctx.globalAlpha = t.life*0.7;
    ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.arc(t.x, t.y, comet.r*t.life, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // stars pickups
  for (var i=0;i&lt;stars.length;i++) {
    var st = stars[i];
    var pulse = 1 + 0.2*Math.sin(st.ph);
    ctx.save();
    ctx.translate(st.x, st.y);
    ctx.shadowColor = &#x27;#ffd479&#x27;; ctx.shadowBlur = 14;
    ctx.fillStyle = &#x27;#ffe9a8&#x27;;
    drawStarShape(0,0,st.r*pulse, st.r*0.45);
    ctx.restore();
  }

  // asteroids
  for (var i=0;i&lt;asteroids.length;i++) {
    var a = asteroids[i];
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.fillStyle = a.type===&#x27;large&#x27; ? &#x27;#8a6b55&#x27; : a.type===&#x27;medium&#x27; ? &#x27;#7a7f8f&#x27; : &#x27;#9a9080&#x27;;
    ctx.strokeStyle = &#x27;rgba(0,0,0,0.4)&#x27;; ctx.lineWidth = 2;
    ctx.beginPath();
    var pts = 7;
    for (var k=0;k&lt;pts;k++){
      var ang = k/pts*6.28;
      var rr = a.r*(0.8+0.25*Math.sin(k*2.3));
      var px = Math.cos(ang)*rr, py = Math.sin(ang)*rr;
      if (k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // particles
  for (var i=0;i&lt;particles.length;i++) {
    var p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3*p.life,0,6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // comet
  ctx.save();
  ctx.shadowColor = trailColor(); ctx.shadowBlur = 20;
  var cg = ctx.createRadialGradient(comet.x,comet.y,2,comet.x,comet.y,comet.r);
  cg.addColorStop(0,&#x27;#ffffff&#x27;); cg.addColorStop(1, trailColor());
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(comet.x,comet.y,comet.r,0,6.28); ctx.fill();
  ctx.restore();

  // score + multiplier ring (top center)
  var cx = W/2, cy = 46;
  var ringN = Math.min(20, starsCollected % 5 === 0 &amp;&amp; starsCollected&gt;0 ? 5 : starsCollected % 5);
  ctx.save();
  var dots = 12;
  for (var d=0; d&lt;dots; d++) {
    var ang = d/dots*6.28 - 1.57;
    var lit = d &lt; (starsCollected % 5) * (12/5);
    ctx.fillStyle = lit ? &#x27;#ffd479&#x27; : &#x27;rgba(255,255,255,0.15)&#x27;;
    var rx = cx + Math.cos(ang)*40, ry = cy + Math.sin(ang)*32;
    ctx.beginPath(); ctx.arc(rx,ry, lit?3.5:2, 0,6.28); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.shadowColor = &#x27;#7fd4ff&#x27;; ctx.shadowBlur = 12;
  ctx.fillStyle = &#x27;#eaf2ff&#x27;;
  ctx.font = &#x27;bold 34px system-ui, sans-serif&#x27;;
  ctx.textAlign = &#x27;center&#x27;; ctx.textBaseline = &#x27;middle&#x27;;
  ctx.fillText(score, cx, cy);
  ctx.restore();

  ctx.fillStyle = &#x27;#9fb0d8&#x27;;
  ctx.font = &#x27;13px system-ui, sans-serif&#x27;;
  ctx.textAlign = &#x27;left&#x27;; ctx.textBaseline = &#x27;top&#x27;;
  ctx.fillText(&#x27;x&#x27;+mult.toFixed(1)+&#x27; multiplier&#x27;, 10, 10);
  ctx.textAlign = &#x27;right&#x27;;
  ctx.fillText(&#x27;Best: &#x27;+best, W-10, 10);

  // warp flash
  if (warpFlash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(160,200,255,&#x27;+ (warpFlash*0.4) +&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  if (gameOver) {
    ctx.fillStyle = &#x27;rgba(0,0,0,0.55)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#ff9d9d&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.font = &#x27;bold 30px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Comet Destroyed&#x27;, W/2, H/2-20);
    ctx.fillStyle = &#x27;#eaf2ff&#x27;; ctx.font = &#x27;18px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Score &#x27;+score+&#x27;  •  Best &#x27;+best, W/2, H/2+16);
    ctx.fillStyle=&#x27;#9fb0d8&#x27;; ctx.font=&#x27;14px system-ui,sans-serif&#x27;;
    ctx.fillText(&#x27;Press Start below to fly again&#x27;, W/2, H/2+46);
  }
}

function drawStarShape(cx,cy,outer,inner) {
  ctx.beginPath();
  for (var i=0;i&lt;10;i++){
    var ang = i/10*6.28 - 1.57;
    var r = (i%2===0)?outer:inner;
    var px = cx+Math.cos(ang)*r, py = cy+Math.sin(ang)*r;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
}

function endGame() {
  running = false;
  if (animId){ cancelAnimationFrame(animId); animId=null; }
  if (score &gt; best) best = score;
  beep(120, 0.5, &#x27;sawtooth&#x27;, 0.16);
  draw();
}

function startGame() {
  reset();
  running = true;
  if (animId) cancelAnimationFrame(animId);
  spawnAsteroid();
  animId = requestAnimationFrame(tick);
}
function stopGame() {
  running = false;
  if (animId){ cancelAnimationFrame(animId); animId=null; }
}

// input
function setBoost(v){ if (running &amp;&amp; !gameOver) boosting = v; }
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ setBoost(true); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ setBoost(false); e.preventDefault(); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ setBoost(true); });
window.addEventListener(&#x27;mouseup&#x27;, function(){ setBoost(false); });
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ setBoost(true); e.preventDefault(); });
window.addEventListener(&#x27;touchend&#x27;, function(e){ setBoost(false); });

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
