&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to slide the paddle and keep the ball in play — smash every brick to clear the wave. Catch falling capsules for wider paddles, fireballs, and score multipliers.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;COMBO&lt;/span&gt; &lt;span id=&quot;combo&quot;&gt;x0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;WAVE&lt;/span&gt; &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;LIVES&lt;/span&gt; &lt;span id=&quot;lives&quot;&gt;♥♥♥&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stagewrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
var waveEl = document.getElementById(&#x27;wave&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

var running = false, animId = null;

// ---------- audio ----------
var actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq, dur, type, vol){
  var a = ac(); if(!a) return;
  var o = a.createOscillator(), g = a.createGain();
  o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
  g.gain.value = vol||0.12;
  o.connect(g); g.connect(a.destination);
  var now = a.currentTime;
  g.gain.setValueAtTime(vol||0.12, now);
  g.gain.exponentialRampToValueAtTime(0.001, now+dur);
  o.frequency.exponentialRampToValueAtTime(Math.max(60,freq*0.6), now+dur);
  o.start(now); o.stop(now+dur);
}
function crack(){ beep(320+Math.random()*260, 0.09, &#x27;square&#x27;, 0.10); }
function powSound(){ beep(660,0.14,&#x27;triangle&#x27;,0.14); setTimeout(function(){beep(990,0.12,&#x27;triangle&#x27;,0.12);},70); }
function loseSound(){ beep(200,0.4,&#x27;sawtooth&#x27;,0.16); }

// ---------- state ----------
var ROWS = 5, COLS = 10;
var BRICK_COLORS = [&#x27;#b14bff&#x27;,&#x27;#3ff0ff&#x27;,&#x27;#ff9a3c&#x27;,&#x27;#ff6bd6&#x27;,&#x27;#5bff8f&#x27;];
var brickW = 56, brickH = 20, brickGap = 4, brickTop = 40, brickLeft;
brickLeft = (W - (COLS*brickW + (COLS-1)*brickGap))/2;

var paddle, ball, bricks, particles, stars, capsules;
var score, combo, comboTimer, wave, lives;
var baseSpeed, mult=1, multTimer=0, fireTimer=0, widenTimer=0;
var pulse=0;

function makeStars(){
  stars = [];
  for(var i=0;i&lt;70;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+0.3, p:Math.random()*6.28});
  }
}

function makeBricks(){
  bricks = [];
  for(var r=0;r&lt;ROWS;r++){
    for(var c=0;c&lt;COLS;c++){
      var isPow = Math.random()&lt;0.12;
      bricks.push({
        x: brickLeft + c*(brickW+brickGap),
        y: brickTop + r*(brickH+brickGap),
        w: brickW, h: brickH,
        color: BRICK_COLORS[r%BRICK_COLORS.length],
        alive: true, pow: isPow, flash: 0
      });
    }
  }
}

function resetPaddle(){
  paddle = { w:100, baseW:100, h:14, x:(W-100)/2, y:H-26 };
}
function resetBall(){
  ball = { x:W/2, y:H-60, r:8, vx:(Math.random()&lt;0.5?-1:1)*baseSpeed*0.7, vy:-baseSpeed, trail:[] };
}

function startWave(){
  makeBricks();
  baseSpeed = 4 + (wave-1)*0.6;
  resetBall();
}

function resetGame(){
  score=0; combo=0; comboTimer=0; wave=1; lives=3;
  mult=1; multTimer=0; fireTimer=0; widenTimer=0;
  particles=[]; capsules=[];
  makeStars();
  resetPaddle();
  baseSpeed = 4;
  startWave();
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent = score;
  comboEl.textContent = &#x27;x&#x27;+combo + (mult&gt;1?&#x27; ⚡2&#x27;:&#x27;&#x27;);
  waveEl.textContent = wave;
  livesEl.textContent = lives&gt;0 ? &#x27;♥&#x27;.repeat(lives) : &#x27;—&#x27;;
}

// ---------- particles ----------
function burst(x,y,color,n){
  for(var i=0;i&lt;(n||14);i++){
    var a=Math.random()*6.28, s=Math.random()*4+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

// ---------- capsules ----------
var CAP_TYPES = [
  {kind:&#x27;wide&#x27;, color:&#x27;#3ff0ff&#x27;, label:&#x27;W&#x27;},
  {kind:&#x27;fire&#x27;, color:&#x27;#ff4a4a&#x27;, label:&#x27;F&#x27;},
  {kind:&#x27;mult&#x27;, color:&#x27;#ffd24a&#x27;, label:&#x27;★&#x27;}
];
function dropCapsule(x,y){
  var t = CAP_TYPES[Math.floor(Math.random()*CAP_TYPES.length)];
  capsules.push({x:x, y:y, w:22, h:14, vy:2.4, kind:t.kind, color:t.color, label:t.label});
}
function applyPowerup(kind){
  powSound();
  if(kind===&#x27;wide&#x27;){ widenTimer=600; paddle.w=paddle.baseW*1.7; }
  else if(kind===&#x27;fire&#x27;){ fireTimer=500; }
  else if(kind===&#x27;mult&#x27;){ multTimer=400; mult=2; }
  updateHUD();
}

// ---------- collision helpers ----------
function hitBrick(b, fire){
  b.alive=false;
  b.flash=1;
  burst(b.x+b.w/2, b.y+b.h/2, b.color, 16);
  crack();
  combo++;
  comboTimer=90;
  var pts = (10 + combo) * mult;
  score += pts;
  if(b.pow) dropCapsule(b.x+b.w/2, b.y+b.h/2);
  updateHUD();
}

function loseLife(){
  lives--;
  loseSound();
  combo=0;
  updateHUD();
  if(lives&lt;=0){
    running=false;
    drawGameOver();
    return;
  }
  resetBall();
}

// ---------- main loop ----------
function tick(){
  if(!running) return;
  pulse += 0.05;

  // background
  ctx.fillStyle = &#x27;#070018&#x27;;
  ctx.fillRect(0,0,W,H);

  // stars pulse
  for(var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    var a = 0.35 + 0.35*Math.sin(pulse + s.p);
    ctx.globalAlpha = a;
    ctx.fillStyle = &#x27;#cfe8ff&#x27;;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  // timers
  if(multTimer&gt;0){ multTimer--; if(multTimer===0){ mult=1; updateHUD(); } }
  if(fireTimer&gt;0){ fireTimer--; }
  if(widenTimer&gt;0){ widenTimer--; if(widenTimer===0){ paddle.w=paddle.baseW; } }
  if(comboTimer&gt;0){ comboTimer--; if(comboTimer===0){ combo=0; updateHUD(); } }

  // ball move (gradual speedup)
  var sp = Math.hypot(ball.vx, ball.vy);
  var target = baseSpeed + Math.min(3, (Date.now()%1)); // keep base
  // gently accelerate
  var accel = 1.0005;
  ball.vx *= accel; ball.vy *= accel;

  ball.x += ball.vx; ball.y += ball.vy;
  ball.trail.push({x:ball.x, y:ball.y});
  if(ball.trail.length&gt;10) ball.trail.shift();

  // walls
  if(ball.x-ball.r&lt;0){ ball.x=ball.r; ball.vx=Math.abs(ball.vx); }
  if(ball.x+ball.r&gt;W){ ball.x=W-ball.r; ball.vx=-Math.abs(ball.vx); }
  if(ball.y-ball.r&lt;0){ ball.y=ball.r; ball.vy=Math.abs(ball.vy); }

  // paddle collision
  if(ball.vy&gt;0 &amp;&amp; ball.y+ball.r&gt;=paddle.y &amp;&amp; ball.y-ball.r&lt;=paddle.y+paddle.h &amp;&amp;
     ball.x&gt;=paddle.x-ball.r &amp;&amp; ball.x&lt;=paddle.x+paddle.w+ball.r){
    ball.y = paddle.y - ball.r;
    var hitPos = (ball.x - (paddle.x+paddle.w/2))/(paddle.w/2); // -1..1
    var speed = Math.hypot(ball.vx,ball.vy);
    var ang = hitPos * 1.05; // max ~60deg
    ball.vx = speed*Math.sin(ang);
    ball.vy = -Math.abs(speed*Math.cos(ang));
    beep(180,0.05,&#x27;sine&#x27;,0.08);
    combo=0; comboTimer=0; updateHUD();
  }

  // brick collision
  for(var i=0;i&lt;bricks.length;i++){
    var b=bricks[i];
    if(!b.alive) continue;
    if(ball.x+ball.r&gt;b.x &amp;&amp; ball.x-ball.r&lt;b.x+b.w &amp;&amp;
       ball.y+ball.r&gt;b.y &amp;&amp; ball.y-ball.r&lt;b.y+b.h){
      if(fireTimer&gt;0){
        // fireball plows through — don&#x27;t bounce, destroy row-ish nearby
        hitBrick(b,true);
        // also destroy neighbors in same row
        for(var j=0;j&lt;bricks.length;j++){
          var nb=bricks[j];
          if(nb.alive &amp;&amp; Math.abs(nb.y-b.y)&lt;2 &amp;&amp; Math.abs(nb.x-b.x)&lt;=(b.w+brickGap)*1.1){
            hitBrick(nb,true);
          }
        }
      } else {
        // bounce
        var overlapX = Math.min(ball.x+ball.r-b.x, b.x+b.w-(ball.x-ball.r));
        var overlapY = Math.min(ball.y+ball.r-b.y, b.y+b.h-(ball.y-ball.r));
        if(overlapX&lt;overlapY){ ball.vx=-ball.vx; } else { ball.vy=-ball.vy; }
        hitBrick(b,false);
      }
      break;
    }
  }

  // capsules
  for(var i=capsules.length-1;i&gt;=0;i--){
    var cp=capsules[i];
    cp.y+=cp.vy;
    if(cp.y+cp.h&gt;=paddle.y &amp;&amp; cp.x&gt;=paddle.x-cp.w/2 &amp;&amp; cp.x&lt;=paddle.x+paddle.w+cp.w/2 &amp;&amp; cp.y&lt;=paddle.y+paddle.h){
      applyPowerup(cp.kind);
      capsules.splice(i,1);
      continue;
    }
    if(cp.y&gt;H){ capsules.splice(i,1); }
  }

  // ball lost
  if(ball.y-ball.r&gt;H){ loseLife(); if(!running){ return; } }

  // wave clear
  var any=false;
  for(var i=0;i&lt;bricks.length;i++){ if(bricks[i].alive){ any=true; break; } }
  if(!any){
    wave++;
    startWave();
    updateHUD();
    beep(520,0.1,&#x27;triangle&#x27;,0.14);
    setTimeout(function(){beep(780,0.12,&#x27;triangle&#x27;,0.12);},90);
  }

  // ---------- draw ----------
  // bricks
  for(var i=0;i&lt;bricks.length;i++){
    var b=bricks[i];
    if(!b.alive) continue;
    ctx.shadowColor=b.color; ctx.shadowBlur=8;
    ctx.fillStyle=b.color;
    roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
    ctx.shadowBlur=0;
    if(b.pow){
      ctx.fillStyle=&#x27;rgba(255,255,255,0.9)&#x27;;
      ctx.font=&#x27;13px sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(&#x27;★&#x27;, b.x+b.w/2, b.y+b.h/2);
    }
  }

  // particles
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03;
    if(p.life&lt;=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
  }
  ctx.globalAlpha=1;

  // capsules
  for(var i=0;i&lt;capsules.length;i++){
    var cp=capsules[i];
    ctx.shadowColor=cp.color; ctx.shadowBlur=12;
    ctx.fillStyle=cp.color;
    roundRect(cp.x-cp.w/2, cp.y, cp.w, cp.h, 6); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#05010f&#x27;; ctx.font=&#x27;bold 11px sans-serif&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(cp.label, cp.x, cp.y+cp.h/2);
  }

  // ball trail
  for(var i=0;i&lt;ball.trail.length;i++){
    var t=ball.trail[i];
    var a=i/ball.trail.length;
    ctx.globalAlpha=a*0.5;
    ctx.fillStyle = fireTimer&gt;0 ? &#x27;#ff6a2a&#x27; : &#x27;#8fd0ff&#x27;;
    ctx.beginPath(); ctx.arc(t.x,t.y,ball.r*a,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  ctx.shadowColor = fireTimer&gt;0 ? &#x27;#ff4a2a&#x27; : &#x27;#8fd0ff&#x27;; ctx.shadowBlur=16;
  ctx.fillStyle = fireTimer&gt;0 ? &#x27;#ffb347&#x27; : &#x27;#ffffff&#x27;;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,6.28); ctx.fill();
  ctx.shadowBlur=0;

  // paddle
  var pgrad = ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  pgrad.addColorStop(0,&#x27;#3ff0ff&#x27;); pgrad.addColorStop(0.5,&#x27;#b14bff&#x27;); pgrad.addColorStop(1,&#x27;#ff6bd6&#x27;);
  ctx.shadowColor=&#x27;#9a5bff&#x27;; ctx.shadowBlur=16;
  ctx.fillStyle=pgrad;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7); ctx.fill();
  ctx.shadowBlur=0;

  animId = requestAnimationFrame(tick);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawStatic(){
  ctx.fillStyle=&#x27;#070018&#x27;; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=&#x27;#7f7fb5&#x27;; ctx.font=&#x27;16px sans-serif&#x27;;
  ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
  ctx.fillText(&#x27;Press Start below to launch the ball ✦&#x27;, W/2, H/2);
}

function drawGameOver(){
  ctx.fillStyle=&#x27;rgba(5,1,15,0.8)&#x27;; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=&#x27;#ff6bd6&#x27;; ctx.font=&#x27;bold 34px sans-serif&#x27;;
  ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
  ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-20);
  ctx.fillStyle=&#x27;#e8e8ff&#x27;; ctx.font=&#x27;18px sans-serif&#x27;;
  ctx.fillText(&#x27;Score: &#x27;+score+&#x27; — press Start to play again&#x27;, W/2, H/2+18);
}

// ---------- input ----------
function movePaddleTo(clientX){
  var rect = cv.getBoundingClientRect();
  var x = (clientX - rect.left) * (W/rect.width);
  paddle.x = Math.max(0, Math.min(W-paddle.w, x - paddle.w/2));
}
cv.addEventListener(&#x27;mousemove&#x27;, function(e){ if(paddle) movePaddleTo(e.clientX); });
cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if(paddle &amp;&amp; e.touches[0]){ movePaddleTo(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;){ startGame(); }
  else if(e.data.type===&#x27;wd_stop&#x27;){ stopGame(); }
});

function startGame(){
  if(actx &amp;&amp; actx.state===&#x27;suspended&#x27;){ actx.resume(); }
  running=true;
  resetGame();
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

// initial stopped state
drawStatic();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the

<script>

  var iframe = document.getElementById('game');

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
