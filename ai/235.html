&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;ZAP THE ALIENS!&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the flying aliens to blast them before they escape — brighter colors are worth more points. Hit them in a row to build your combo multiplier, and don&#x27;t let them slip off-screen!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;

&lt;script&gt;
  var BW = 700, BH = 470;
  var board = document.getElementById(&#x27;board&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var edge = document.getElementById(&#x27;edge&#x27;);
  var msg = document.getElementById(&#x27;msg&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);

  var TYPES = {
    green:  { color:&#x27;#2f5&#x27;, glow:&#x27;#2f5&#x27;, pts:1 },
    blue:   { color:&#x27;#3af&#x27;, glow:&#x27;#3af&#x27;, pts:2 },
    purple: { color:&#x27;#b3f&#x27;, glow:&#x27;#b3f&#x27;, pts:3 },
    gold:   { color:&#x27;#fd3&#x27;, glow:&#x27;#fd3&#x27;, pts:5 }
  };

  var running=false, score=0, timeLeft=60, comboHits=0, mult=1;
  var aliens=[], stars=[], lastTs=0;
  var rafId=null, timerId=null, spawnTimer=0, spawnGap=1100, elapsed=0;

  var audioCtx=null;
  function beep(freq,dur,type){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.15,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
      o.start(); o.stop(audioCtx.currentTime+dur);
    }catch(_){}
  }

  function makeStars(){
    for(var i=0;i&lt;70;i++){
      var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;star&#x27;;
      var sz=Math.random()*2+1;
      s.style.width=sz+&#x27;px&#x27;; s.style.height=sz+&#x27;px&#x27;;
      s.style.left=Math.random()*BW+&#x27;px&#x27;; s.style.top=Math.random()*BH+&#x27;px&#x27;;
      s.style.opacity=Math.random()*0.7+0.3;
      s._sp=Math.random()*0.3+0.05;
      board.appendChild(s); stars.push(s);
    }
  }
  makeStars();

  function driftStars(dt){
    for(var i=0;i&lt;stars.length;i++){
      var s=stars[i];
      var y=parseFloat(s.style.top)+s._sp*dt*0.06;
      if(y&gt;BH){ y=0; s.style.left=Math.random()*BW+&#x27;px&#x27;; }
      s.style.top=y+&#x27;px&#x27;;
    }
  }

  function updateCombo(){
    if(comboHits&gt;=8) mult=5;
    else if(comboHits&gt;=5) mult=3;
    else if(comboHits&gt;=3) mult=2;
    else mult=1;
    comboEl.textContent=&#x27;x&#x27;+mult;
  }

  function spawnAlien(){
    var keys=[&#x27;green&#x27;,&#x27;green&#x27;,&#x27;blue&#x27;,&#x27;blue&#x27;,&#x27;purple&#x27;];
    if(elapsed&gt;15) keys.push(&#x27;purple&#x27;);
    if(Math.random()&lt;Math.min(0.06+elapsed*0.003,0.18)) keys.push(&#x27;gold&#x27;);
    var t=keys[Math.floor(Math.random()*keys.length)];
    var isGold=(t===&#x27;gold&#x27;);
    var conf=TYPES[t];

    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;alien&#x27;;
    el.innerHTML=&#x27;&lt;div class=&quot;ant l&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ant r&quot;&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;body&quot;&gt;&lt;/div&gt;&lt;div class=&quot;eye l&quot;&gt;&lt;/div&gt;&lt;div class=&quot;eye r&quot;&gt;&lt;/div&gt;&#x27;;
    var body=el.querySelector(&#x27;.body&#x27;);
    body.style.background=conf.color;
    body.style.boxShadow=&#x27;0 0 14px &#x27;+conf.glow+&#x27;, 0 0 26px &#x27;+conf.glow;
    el.querySelector(&#x27;.ant.l&#x27;).style.background=conf.color;
    el.querySelector(&#x27;.ant.r&#x27;).style.background=conf.color;

    // entry edge &amp; path
    var side=Math.floor(Math.random()*4);
    var sx,sy,ex,ey;
    if(side===0){sx=-40;sy=Math.random()*BH;ex=BW+40;ey=Math.random()*BH;}
    else if(side===1){sx=BW+40;sy=Math.random()*BH;ex=-40;ey=Math.random()*BH;}
    else if(side===2){sx=Math.random()*BW;sy=-40;ex=Math.random()*BW;ey=BH+40;}
    else {sx=Math.random()*BW;sy=BH+40;ex=Math.random()*BW;ey=-40;}

    var baseSpeed=(0.10+Math.min(elapsed*0.006,0.20))*(isGold?1.35:1);
    var a={el:el,x:sx,y:sy,sx:sx,sy:sy,ex:ex,ey:ey,t:0,
      speed:baseSpeed, gold:isGold, pts:conf.pts, glow:conf.glow,
      // curve control point
      cx:BW/2+(Math.random()-0.5)*300, cy:BH/2+(Math.random()-0.5)*200,
      blinkT:Math.random()*2000, dead:false};

    el.addEventListener(&#x27;mousedown&#x27;, function(ev){ ev.stopPropagation(); hit(a); });
    board.appendChild(el);
    aliens.push(a);
  }

  function hit(a){
    if(a.dead) return; a.dead=true;
    comboHits++; updateCombo();
    var gained=a.pts*mult;
    score+=gained; scoreEl.textContent=score;
    scoreEl.parentNode.classList.remove(&#x27;pulse&#x27;); void scoreEl.offsetWidth;
    scoreEl.parentNode.classList.add(&#x27;pulse&#x27;);
    burst(a.x,a.y,a.glow, a.gold?26:16);
    doFlash(a.glow);
    beep(a.gold?900:520+a.pts*80,0.15,&#x27;triangle&#x27;);
    removeAlien(a);
  }

  function burst(x,y,color,n){
    for(var i=0;i&lt;n;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;p&#x27;;
      p.style.background=color; p.style.boxShadow=&#x27;0 0 8px &#x27;+color;
      p.style.left=x+&#x27;px&#x27;; p.style.top=y+&#x27;px&#x27;;
      board.appendChild(p);
      var ang=Math.random()*Math.PI*2, spd=Math.random()*3+1.5;
      (function(pe,vx,vy){
        var life=0, px=x, py=y;
        function step(){
          life+=16; px+=vx; py+=vy; vy+=0.05;
          pe.style.left=px+&#x27;px&#x27;; pe.style.top=py+&#x27;px&#x27;;
          pe.style.opacity=Math.max(0,1-life/600);
          if(life&lt;600 &amp;&amp; running){ requestAnimationFrame(step); }
          else if(pe.parentNode) pe.parentNode.removeChild(pe);
        }
        step();
      })(p, Math.cos(ang)*spd, Math.sin(ang)*spd);
    }
  }

  function doFlash(color){
    flash.style.background=&#x27;radial-gradient(circle,&#x27;+color+&#x27; 0%, transparent 70%)&#x27;;
    flash.style.transition=&#x27;none&#x27;; flash.style.opacity=&#x27;0.55&#x27;;
    void flash.offsetWidth;
    flash.style.transition=&#x27;opacity 0.35s ease&#x27;; flash.style.opacity=&#x27;0&#x27;;
  }
  function edgePulse(){
    edge.classList.remove(&#x27;pulse&#x27;); void edge.offsetWidth; edge.classList.add(&#x27;pulse&#x27;);
  }

  function removeAlien(a){
    var i=aliens.indexOf(a); if(i&gt;=0) aliens.splice(i,1);
    if(a.el.parentNode) a.el.parentNode.removeChild(a.el);
  }

  function bezier(p0,p1,p2,t){ var u=1-t; return u*u*p0+2*u*t*p1+t*t*p2; }

  function loop(ts){
    if(!running) return;
    var dt=lastTs? ts-lastTs:16; lastTs=ts;
    elapsed+=dt/1000;
    driftStars(dt);

    // spawn control
    spawnGap=Math.max(450,1100-elapsed*35);
    spawnTimer-=dt;
    if(spawnTimer&lt;=0){ spawnAlien(); spawnTimer=spawnGap;
      if(elapsed&gt;25 &amp;&amp; Math.random()&lt;0.4) spawnAlien(); }

    for(var i=aliens.length-1;i&gt;=0;i--){
      var a=aliens[i];
      a.t+=a.speed*dt/1000;
      if(a.gold){ // zigzag added on top of curve
        a.x=bezier(a.sx,a.cx,a.ex,a.t)+Math.sin(a.t*14)*40;
        a.y=bezier(a.sy,a.cy,a.ey,a.t)+Math.cos(a.t*11)*30;
      } else {
        a.x=bezier(a.sx,a.cx,a.ex,a.t);
        a.y=bezier(a.sy,a.cy,a.ey,a.t);
      }
      // depth scaling: bigger near center
      var dcx=Math.abs(a.x-BW/2)/(BW/2), dcy=Math.abs(a.y-BH/2)/(BH/2);
      var near=1-Math.min(1,Math.sqrt(dcx*dcx+dcy*dcy)/1.42);
      var scale=0.75+near*0.55;
      a.el.style.left=a.x+&#x27;px&#x27;; a.el.style.top=a.y+&#x27;px&#x27;;
      a.el.style.transform=&#x27;translate(-50%,-50%) scale(&#x27;+scale.toFixed(2)+&#x27;)&#x27;;
      // blink
      a.blinkT-=dt;
      if(a.blinkT&lt;0){ a.el.classList.add(&#x27;blink&#x27;); if(a.blinkT&lt;-120){ a.el.classList.remove(&#x27;blink&#x27;); a.blinkT=1500+Math.random()*2000; } }

      if(a.t&gt;=1){ // escaped
        removeAlien(a);
        comboHits=0; updateCombo(); edgePulse(); beep(140,0.18,&#x27;sawtooth&#x27;);
      }
    }
    rafId=requestAnimationFrame(loop);
  }

  function tick(){
    timeLeft--; timeEl.textContent=timeLeft;
    if(timeLeft&lt;=0) endGame();
  }

  function clearAll(){
    for(var i=aliens.length-1;i&gt;=0;i--) removeAlien(aliens[i]);
    var ps=board.querySelectorAll(&#x27;.p&#x27;); for(var j=0;j&lt;ps.length;j++) ps[j].remove();
  }

  function startGame(){
    running=true; score=0; timeLeft=60; comboHits=0; mult=1; elapsed=0;
    spawnTimer=0; lastTs=0;
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;x1&#x27;; timeEl.textContent=&#x27;60&#x27;;
    msg.textContent=&#x27;&#x27;; msg.style.opacity=&#x27;0&#x27;;
    clearAll();
    spawnAlien();
    if(timerId) clearInterval(timerId);
    timerId=setInterval(tick,1000);
    rafId=requestAnimationFrame(loop);
  }

  function stopGame(){
    running=false;
    if(rafId) cancelAnimationFrame(rafId); rafId=null;
    if(timerId){ clearInterval(timerId); timerId=null; }
  }

  function endGame(){
    stopGame();
    msg.innerHTML=&#x27;GAME OVER&lt;br&gt;&lt;span style=&quot;font-size:22px;color:#fd3&quot;&gt;Final Score: &#x27;+score+&#x27;&lt;/span&gt;&#x27;;
    msg.style.opacity=&#x27;1&#x27;;
  }

  board.addEventListener(&#x27;mousedown&#x27;, function(){
    if(running){ comboHits=0; updateCombo(); } // clicking empty space breaks combo
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

    window.addEventListener(t, function (e) {

        window.parent.postMessage(

      // fires repeatedly during layout/font load; we only need the latest.

      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

      // noise during load/visibility transitions.

  <div class="controls">

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
