&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

  .card .lbl { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop 🍊&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;← →&lt;/strong&gt;, press &lt;strong&gt;↑ / W&lt;/strong&gt; to rotate and &lt;strong&gt;↓&lt;/strong&gt; to drop faster. Fill a whole row to burst it for points — use the Start/Restart button below!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Combo&lt;/div&gt;&lt;div class=&quot;val combo1&quot; id=&quot;combo&quot;&gt;x1&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over&lt;br&gt;&lt;span style=&quot;font-size:16px;color:#666&quot;&gt;Press Restart below&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;nextbox&quot;&gt;
        &lt;div class=&quot;lbl&quot;&gt;Next&lt;/div&gt;
        &lt;div class=&quot;nextgrid&quot; id=&quot;next&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var flash = document.getElementById(&#x27;flash&#x27;);
  var nextEl = document.getElementById(&#x27;next&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);

  var FRUITS = [&#x27;🍉&#x27;,&#x27;🍊&#x27;,&#x27;🍇&#x27;,&#x27;🍋&#x27;,&#x27;🍓&#x27;,&#x27;🍒&#x27;,&#x27;🥝&#x27;];
  var COLORS = [&#x27;#ff6b9d&#x27;,&#x27;#ffa751&#x27;,&#x27;#c77dff&#x27;,&#x27;#ffd93d&#x27;,&#x27;#ff4757&#x27;,&#x27;#e84393&#x27;,&#x27;#6bcB77&#x27;];

  // Tetromino definitions (rotation states as coordinate lists)
  var SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]],
    O: [[[1,0],[2,0],[1,1],[2,1]]],
    T: [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    S: [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]],
    J: [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
  };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, nextPiece, score, level, dropMs, dropId, running, combo;

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row);}
  }

  function makePiece(k) {
    var idx = Math.floor(Math.random()*FRUITS.length);
    return { key:k, rot:0, x:3, y:0, fruit:FRUITS[idx], color:COLORS[idx] };
  }
  function randPiece(){ return makePiece(KEYS[Math.floor(Math.random()*KEYS.length)]); }

  function cellsOf(p, rot, ox, oy) {
    var states = SHAPES[p.key];
    var r = ((rot===undefined?p.rot:rot)%states.length+states.length)%states.length;
    var base = states[r];
    var px = ox===undefined?p.x:ox, py = oy===undefined?p.y:oy;
    return base.map(function(c){ return {x:c[0]+px, y:c[1]+py}; });
  }

  function collides(p, rot, ox, oy) {
    var cells = cellsOf(p, rot, ox, oy);
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.x&lt;0||c.x&gt;=COLS||c.y&gt;=ROWS) return true;
      if (c.y&gt;=0 &amp;&amp; grid[c.y][c.x]) return true;
    }
    return false;
  }

  function spawn() {
    piece = nextPiece || randPiece();
    piece.x=3; piece.y=0; piece.rot=0;
    nextPiece = randPiece();
    drawNext();
    if (collides(piece)) { endGame(); return false; }
    return true;
  }

  function ghostY() {
    var y = piece.y;
    while (!collides(piece, piece.rot, piece.x, y+1)) y++;
    return y;
  }

  function drawBlock(cx, cy, fruit, color) {
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=color;
    el.style.borderRadius=&#x27;6px&#x27;;
    el.style.boxShadow=&#x27;inset 0 -2px 3px rgba(0,0,0,0.15)&#x27;;
    el.textContent=fruit;
    field.appendChild(el);
    return el;
  }

  function paint() {
    // remove old cells &amp; ghosts
    var olds = field.querySelectorAll(&#x27;.cell,.ghost&#x27;);
    for (var i=0;i&lt;olds.length;i++) olds[i].remove();
    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++){
      if (grid[r][c]) drawBlock(c,r,grid[r][c].fruit,grid[r][c].color);
    }
    if (piece) {
      var gy = ghostY();
      var gcells = cellsOf(piece, piece.rot, piece.x, gy);
      for (var g=0; g&lt;gcells.length; g++){
        var gc=gcells[g];
        if (gc.y&gt;=0){
          var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
          el.style.left=(gc.x*CELL)+&#x27;px&#x27;; el.style.top=(gc.y*CELL)+&#x27;px&#x27;;
          el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
          el.style.boxShadow=&#x27;0 0 6px &#x27;+piece.color;
          field.appendChild(el);
        }
      }
      var cells = cellsOf(piece);
      for (var j=0;j&lt;cells.length;j++){
        if (cells[j].y&gt;=0) drawBlock(cells[j].x, cells[j].y, piece.fruit, piece.color);
      }
    }
  }

  function drawNext() {
    nextEl.innerHTML=&#x27;&#x27;;
    if (!nextPiece) return;
    var cells = cellsOf(nextPiece, 0, 0, 0);
    var minx=9,miny=9,maxx=0,maxy=0;
    cells.forEach(function(c){minx=Math.min(minx,c.x);miny=Math.min(miny,c.y);maxx=Math.max(maxx,c.x);maxy=Math.max(maxy,c.y);});
    var w=(maxx-minx+1), h=(maxy-miny+1);
    var sz=22;
    var offx=(96-w*sz)/2, offy=(96-h*sz)/2;
    cells.forEach(function(c){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
      el.style.left=(offx+(c.x-minx)*sz)+&#x27;px&#x27;; el.style.top=(offy+(c.y-miny)*sz)+&#x27;px&#x27;;
      el.style.width=sz+&#x27;px&#x27;; el.style.height=sz+&#x27;px&#x27;;
      el.style.background=nextPiece.color; el.style.borderRadius=&#x27;5px&#x27;; el.style.fontSize=&#x27;15px&#x27;;
      el.style.boxShadow=&#x27;inset 0 -2px 3px rgba(0,0,0,0.15)&#x27;;
      el.textContent=nextPiece.fruit;
      nextEl.appendChild(el);
    });
  }

  function lockPiece() {
    var cells=cellsOf(piece);
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]={fruit:piece.fruit,color:piece.color};
    }
    piece=null;
  }

  function burstRow(r) {
    // row flash
    var rf=document.createElement(&#x27;div&#x27;); rf.className=&#x27;rowflash on&#x27;;
    rf.style.top=(r*CELL)+&#x27;px&#x27;; rf.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(rf);
    setTimeout(function(){rf.remove();},400);
    // particles
    for (var c=0;c&lt;COLS;c++){
      for (var k=0;k&lt;3;k++){
        var d=document.createElement(&#x27;div&#x27;); d.className=&#x27;dot&#x27;;
        var col=(grid[r][c]?grid[r][c].color:&#x27;#fff&#x27;);
        d.style.background=col;
        var sz=4+Math.random()*6; d.style.width=sz+&#x27;px&#x27;; d.style.height=sz+&#x27;px&#x27;;
        var sx=c*CELL+CELL/2, sy=r*CELL+CELL/2;
        d.style.left=sx+&#x27;px&#x27;; d.style.top=sy+&#x27;px&#x27;;
        field.appendChild(d);
        (function(dot){
          var ang=Math.random()*Math.PI*2, dist=20+Math.random()*40;
          var tx=Math.cos(ang)*dist, ty=Math.sin(ang)*dist;
          dot.animate([{transform:&#x27;translate(0,0)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+tx+&#x27;px,&#x27;+ty+&#x27;px)&#x27;,opacity:0}],{duration:500,easing:&#x27;ease-out&#x27;});
          setTimeout(function(){dot.remove();},500);
        })(d);
      }
    }
  }

  function clearRows() {
    var full=[];
    for (var r=0;r&lt;ROWS;r++){
      var isFull=true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){isFull=false;break;}
      if (isFull) full.push(r);
    }
    if (full.length===0){ combo=0; updateCombo(); return; }
    full.forEach(burstRow);
    if (full.length&gt;=2){ flash.classList.remove(&#x27;on&#x27;); void flash.offsetWidth; flash.classList.add(&#x27;on&#x27;); }
    // remove rows
    full.sort(function(a,b){return a-b;});
    for (var i=full.length-1;i&gt;=0;i--){
      grid.splice(full[i],1);
      var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
      grid.unshift(empty);
    }
    var pts=[0,10,30,60,100][full.length]||100;
    combo=(combo||0)+1;
    var mult=Math.min(combo,4);
    pts=Math.round(pts*(1+(mult-1)*0.25));
    score+=pts;
    updateScore();
    updateCombo();
    // level
    var nl=Math.floor(score/50)+1;
    if (nl!==level){ level=nl; levelEl.textContent=level; dropMs=Math.max(120, 500-(level-1)*40); restartTimer(); }
  }

  function updateScore(){
    scoreEl.textContent=score;
    scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
  }
  function updateCombo(){
    var m=Math.min(combo||0,4);
    comboEl.textContent=&#x27;x&#x27;+(m&lt;1?1:m);
    comboEl.className=&#x27;val combo&#x27;+(m&lt;1?1:m);
  }

  function restartTimer(){
    if (dropId) clearInterval(dropId);
    if (running) dropId=setInterval(stepDown, dropMs);
  }

  function stepDown() {
    if (!piece||!running) return;
    if (collides(piece,piece.rot,piece.x,piece.y+1)){
      lockPiece();
      clearRows();
      if (running){ if(!spawn()){paint();return;} }
    } else {
      piece.y++;
    }
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    if(!collides(piece,piece.rot,piece.x+dx,piece.y)){ piece.x+=dx; paint(); }
  }
  function rotate(){
    if(!running||!piece) return;
    var nr=piece.rot+1;
    var kicks=[0,-1,1,-2,2];
    for (var i=0;i&lt;kicks.length;i++){
      if(!collides(piece,nr,piece.x+kicks[i],piece.y)){ piece.rot=nr; piece.x+=kicks[i]; paint(); return; }
    }
  }

  function endGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    overEl.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overEl.classList.remove(&#x27;show&#x27;);
    score=0; level=1; combo=0; dropMs=500; running=true;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;; updateCombo();
    newGrid();
    nextPiece=randPiece();
    if(!spawn()){paint();return;}
    paint();
    restartTimer();
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)stepDown();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;w&#x27;||e.key===&#x27;W&#x27;){rotate();e.preventDefault();}
  });

  // Touch: swipe &amp; tap-right to rotate
  var tsx=0,tsy=0,tmoved=false;
  field.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;tmoved=false;},{passive:true});
  field.addEventListener(&#x27;touchmove&#x27;,function(e){
    var t=e.touches[0];var dx=t.clientX-tsx,dy=t.clientY-tsy;
    if(Math.abs(dx)&gt;28){ if(dx&gt;0)move(1);else move(-1); tsx=t.clientX; tsy=t.clientY; tmoved=true; }
    else if(dy&gt;28){ if(running)stepDown(); tsy=t.clientY; tmoved=true; }
  },{passive:true});
  field.addEventListener(&#x27;touchend&#x27;,function(e){
    if(!tmoved){ rotate(); }
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial preview
  newGrid();
  nextPiece=randPiece();
  piece=randPiece(); piece.x=3; piece.y=0;
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
