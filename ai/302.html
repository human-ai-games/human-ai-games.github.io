&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }

    background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍓 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap the side arrows (or use ← → ↓) to move fruit pieces, and the ↻ button (or ↑) to rotate. Fill a full row to clear it — clear many at once for combo bonus points!&lt;/p&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;div class=&quot;sidebtns&quot;&gt;
      &lt;button class=&quot;tapbtn&quot; id=&quot;bLeft&quot;&gt;◀&lt;/button&gt;
      &lt;button class=&quot;tapbtn&quot; id=&quot;bDown&quot;&gt;▼&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;center&quot;&gt;
      &lt;div class=&quot;fieldwrap&quot;&gt;
        &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
          &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
          &lt;canvas id=&quot;confetti&quot; width=&quot;240&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
          &lt;div class=&quot;gameover&quot; id=&quot;gameover&quot;&gt;Game Over&lt;div style=&quot;font-size:16px;color:#c8b6ff;margin-top:8px&quot;&gt;Press Start to play again&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;side&quot;&gt;
        &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;SCORE&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;LEVEL&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;NEXT&lt;/div&gt;&lt;div id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sidebtns&quot;&gt;
      &lt;button class=&quot;tapbtn&quot; id=&quot;bRight&quot;&gt;▶&lt;/button&gt;
      &lt;button class=&quot;tapbtn rotbtn&quot; id=&quot;bRot&quot;&gt;↻&lt;/button&gt;
    &lt;/div&gt;

&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var running = false, dropId = null, dropMs = 700;
  var grid = [], piece = null, nextType = null, score = 0, level = 1, clears = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var nextBox = document.getElementById(&#x27;next&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var goEl = document.getElementById(&#x27;gameover&#x27;);
  var cvs = document.getElementById(&#x27;confetti&#x27;), ctx = cvs.getContext(&#x27;2d&#x27;);

  var FRUIT = { I:&#x27;🍉&#x27;, O:&#x27;🍊&#x27;, T:&#x27;🍇&#x27;, S:&#x27;🍋&#x27;, Z:&#x27;🍓&#x27;, J:&#x27;🫐&#x27;, L:&#x27;🍑&#x27; };
  var COLOR = { I:&#x27;#5fc9ff&#x27;, O:&#x27;#ffb02e&#x27;, T:&#x27;#b06bff&#x27;, S:&#x27;#d7ff3f&#x27;, Z:&#x27;#ff5f7e&#x27;, J:&#x27;#6b8bff&#x27;, L:&#x27;#ffb86b&#x27; };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = Object.keys(SHAPES);

  function newGrid() { grid = []; for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row);} }
  function randType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function makePiece(type){
    var cells = SHAPES[type].map(function(p){return [p[0],p[1]];});
    return { type:type, cells:cells, x:3, y:-1 };
  }
  function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }

  function collides(p){
    var a = absCells(p);
    for (var i=0;i&lt;a.length;i++){
      var cx=a[i].x, cy=a[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function rotate(){
    if (!running || !piece || piece.type===&#x27;O&#x27;) { if(piece&amp;&amp;piece.type===&#x27;O&#x27;){} }
    if (!running || !piece) return;
    if (piece.type===&#x27;O&#x27;){ return; }
    var rotated = piece.cells.map(function(c){ return [ -c[1]+2, c[0] ]; });
    var test = { type:piece.type, cells:rotated, x:piece.x, y:piece.y };
    var kicks = [0,-1,1,-2,2];
    for (var k=0;k&lt;kicks.length;k++){
      test.x = piece.x + kicks[k];
      if (!collides(test)){ piece.cells = rotated; piece.x = test.x; paint(); return; }
    }
  }

  function spawn(){
    var type = nextType || randType();
    nextType = randType();
    piece = makePiece(type);
    drawNext();
    if (collides(piece)) return false;
    return true;
  }

  function lock(){
    var a = absCells(piece);
    for (var i=0;i&lt;a.length;i++){ if(a[i].y&gt;=0) grid[a[i].y][a[i].x] = piece.type; }
    piece = null;
  }

  function clearRows(){
    var fullRows = [];
    for (var r=0;r&lt;ROWS;r++){ var full=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;} if(full) fullRows.push(r); }
    if (fullRows.length===0) return;
    // flash effect then remove
    fullRows.forEach(function(r){ for(var c=0;c&lt;COLS;c++) grid[r][c]=&#x27;FLASH&#x27;; });
    paint();
    burstConfetti();
    var n = fullRows.length;
    setTimeout(function(){
      for (var i=fullRows.length-1;i&gt;=0;i--){
        grid.splice(fullRows[i],1);
        var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
        grid.unshift(empty);
      }
      var pts = [0,100,300,600,1000][n] || 1200;
      pts *= level;
      score += pts;
      scoreEl.textContent = score;
      clears += n;
      var newLevel = 1 + Math.floor(clears/5);
      if (newLevel !== level){ level = newLevel; levelEl.textContent = level; dropMs = Math.max(120, 700 - (level-1)*70); restartTimer(); }
      if (n&gt;=2) showCombo(n, pts);
      paint();
    }, 180);
  }

  function showCombo(n, pts){
    var names = {2:&#x27;DOUBLE&#x27;,3:&#x27;TRIPLE&#x27;,4:&#x27;FRENZY!&#x27;};
    comboEl.textContent = (names[n]||&#x27;COMBO&#x27;)+&#x27; +&#x27;+pts;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  function ghostY(){
    var g = { type:piece.type, cells:piece.cells, x:piece.x, y:piece.y };
    while (!collides({type:g.type,cells:g.cells,x:g.x,y:g.y+1})) g.y++;
    return g.y;
  }

  function paint(){
    // remove block elements only (keep combo/canvas/gameover)
    var olds = field.querySelectorAll(&#x27;.block,.ghost&#x27;);
    for (var i=0;i&lt;olds.length;i++) olds[i].remove();
    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++){ if(grid[r][c]) drawBlock(c,r,grid[r][c]); }
    if (piece){
      var gy = ghostY();
      var ga = piece.cells;
      for (var j=0;j&lt;ga.length;j++){
        var cy = gy+ga[j][1], cx=piece.x+ga[j][0];
        if (cy&gt;=0) drawGhost(cx,cy);
      }
      var a = absCells(piece);
      for (var k=0;k&lt;a.length;k++){ if(a[k].y&gt;=0) drawBlock(a[k].x,a[k].y,piece.type); }
    }
  }

  function drawBlock(cx,cy,type){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;block&#x27;;
    if (type===&#x27;FLASH&#x27;){ el.classList.add(&#x27;flash&#x27;); }
    else {
      el.style.background = COLOR[type];
      el.style.boxShadow = &#x27;0 0 8px &#x27;+COLOR[type]+&#x27;, inset 0 -3px 0 rgba(0,0,0,0.25)&#x27;;
      el.style.border = &#x27;1px solid rgba(255,255,255,0.5)&#x27;;
      el.textContent = FRUIT[type];
    }
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }
  function drawGhost(cx,cy){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }

  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;;
    if (!nextType) return;
    var cells = SHAPES[nextType];
    var minx=9,miny=9,maxx=0,maxy=0;
    cells.forEach(function(c){ minx=Math.min(minx,c[0]);maxx=Math.max(maxx,c[0]);miny=Math.min(miny,c[1]);maxy=Math.max(maxy,c[1]); });
    var w=(maxx-minx+1), h=(maxy-miny+1);
    var s=18;
    var offx=(80-w*s)/2, offy=(60-h*s)/2;
    cells.forEach(function(c){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;block&#x27;;
      el.style.background=COLOR[nextType];
      el.style.boxShadow=&#x27;0 0 6px &#x27;+COLOR[nextType];
      el.style.border=&#x27;1px solid rgba(255,255,255,0.5)&#x27;;
      el.textContent=FRUIT[nextType];
      el.style.fontSize=&#x27;12px&#x27;;
      el.style.left=(offx+(c[0]-minx)*s)+&#x27;px&#x27;; el.style.top=(offy+(c[1]-miny)*s)+&#x27;px&#x27;;
      el.style.width=s+&#x27;px&#x27;; el.style.height=s+&#x27;px&#x27;;
      nextBox.appendChild(el);
    });
  }

  // confetti
  var parts=[], confId=null;
  function burstConfetti(){
    var emojis=[&#x27;🍓&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍊&#x27;,&#x27;🍉&#x27;,&#x27;✨&#x27;];
    for (var i=0;i&lt;40;i++){
      parts.push({ x:120, y:200, vx:(Math.random()-0.5)*10, vy:(Math.random()-1)*9,
        e:emojis[Math.floor(Math.random()*emojis.length)], life:60, rot:Math.random()*6 });
    }
    if (!confId) confId=requestAnimationFrame(stepConfetti);
  }
  function stepConfetti(){
    ctx.clearRect(0,0,240,480);
    for (var i=parts.length-1;i&gt;=0;i--){
      var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.life--; p.rot+=0.2;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life/60); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.font=&#x27;18px serif&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillText(p.e,0,0); ctx.restore();
      if (p.life&lt;=0||p.y&gt;500) parts.splice(i,1);
    }
    if (parts.length&gt;0){ confId=requestAnimationFrame(stepConfetti); }
    else { ctx.clearRect(0,0,240,480); confId=null; }
  }

  function stepDown(){
    if (!piece) return;
    var next={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
    if (collides(next)){
      lock(); clearRows();
      if (!spawn()){ endGame(); return; }
    } else piece.y++;
    paint();
  }
  function move(dx){
    if (!running||!piece) return;
    var next={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
    if (!collides(next)){ piece.x+=dx; paint(); }
  }

  function restartTimer(){ if(dropId) clearInterval(dropId); dropId=setInterval(stepDown, dropMs); }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} goEl.style.display=&#x27;flex&#x27;; }

  function startGame(){
    score=0; level=1; clears=0; dropMs=700;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    goEl.style.display=&#x27;none&#x27;;
    parts=[]; if(confId){cancelAnimationFrame(confId);confId=null;} ctx.clearRect(0,0,240,480);
    newGrid(); nextType=randType();
    if (!spawn()) return;
    paint();
    running=true;
    restartTimer();
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(-1); });
  document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;, function(){ move(1); });
  document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;, function(){ if(running) stepDown(); });
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;, function(){ rotate(); });

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial preview
  newGrid(); nextType=randType(); piece=makePiece(randType()); paint(); drawNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
