    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>☄ COMET DASH ☄</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#7af,#f7f,#ff9); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,180,255,.4); }
  .instructions { font-size: 16px; color: #aab; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 20px; color: #9df; margin: 0; text-shadow: 0 0 10px rgba(100,180,255,.6); font-weight: 700; }
  .wrap { position: relative; width: 680px; height: 440px; }
  canvas { display: block; width: 680px; height: 440px; border-radius: 12px; box-shadow: 0 0 30px rgba(80,120,255,.25); }
  .prompt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
  .prompt span { font-size: 26px; font-weight: 800; color: #fff; padding: 14px 26px; border-radius: 14px;
     background: rgba(20,10,50,.5); box-shadow: 0 0 30px rgba(150,120,255,.6); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1); opacity:.85 } 50%{ transform: scale(1.08); opacity:1 } }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;☄ COMET DASH ☄&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt;/tap to jump over rocks and &lt;strong&gt;↓&lt;/strong&gt; to duck under tall satellites. Use the Start/Restart button below the game.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Light-Years Traveled: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;680&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;prompt&quot; id=&quot;prompt&quot;&gt;&lt;span&gt;TAP / SPACE to jump&lt;br&gt;↓ to duck&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 680, H = 440, GROUND = H - 60;
var scoreEl = document.getElementById(&#x27;score&#x27;), promptEl = document.getElementById(&#x27;prompt&#x27;);

var running = false, animId = null;
var hue = 250, score = 0, speed = 4, gameOver = false, frame = 0;
var comet, obstacles, particles, stars, trail, spawnTimer;

// ---- audio ----
var actx = null;
function beep(freq, dur, type, vol){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.1; o.connect(g); g.connect(actx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(e){}
}

function makeStars(){
  stars = [];
  for(var layer=0; layer&lt;3; layer++){
    var n = [40,25,15][layer];
    for(var i=0;i&lt;n;i++){
      stars.push({x:Math.random()*W, y:Math.random()*GROUND, r:[0.7,1.3,2][layer], sp:[0.4,1,2][layer], layer:layer});
    }
  }
}

function reset(){
  hue = 250; score = 0; speed = 4; gameOver = false; frame = 0;
  comet = {x:90, y:GROUND-26, vy:0, size:26, ducking:false};
  obstacles = []; particles = []; trail = [];
  spawnTimer = 40;
  makeStars();
  scoreEl.textContent = &#x27;0&#x27;;
}

function spawn(){
  var types = [&#x27;rock&#x27;,&#x27;satellite&#x27;,&#x27;double&#x27;];
  var t = types[Math.floor(Math.random()*3)];
  if(t===&#x27;rock&#x27;){
    obstacles.push({type:t, x:W+30, w:34, h:26, gap:0, passed:false, flash:0});
  }else if(t===&#x27;satellite&#x27;){
    // tall, hangs from top area — must duck. its low edge leaves a gap near ground
    obstacles.push({type:t, x:W+30, w:38, h:70, top:true, passed:false, flash:0});
  }else{
    obstacles.push({type:t, x:W+30, w:32, h:24, passed:false, flash:0});
  }
}

function jump(){
  if(!running || gameOver) return;
  if(comet.y &gt;= GROUND-comet.size-1){ comet.vy = -12.5; beep(520,0.12,&#x27;sawtooth&#x27;,0.08);
    // light streak
    for(var i=0;i&lt;8;i++) particles.push({x:comet.x, y:comet.y+comet.size/2, vx:-2-Math.random()*2, vy:(Math.random()-0.5)*2, life:20, col:&#x27;200,220,255&#x27;});
  }
}
function setDuck(d){ if(!running||gameOver) return; comet.ducking = d; }

function burst(x,y,col){
  for(var i=0;i&lt;14;i++){
    var a = Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24,col:col});
  }
  beep(320,0.08,&#x27;triangle&#x27;,0.05);
}

function tick(){
  if(!running) return;
  frame++;
  // spawn
  spawnTimer--;
  if(spawnTimer&lt;=0){ spawn(); spawnTimer = Math.max(50, 95 - Math.floor(score/4)); }

  // physics
  comet.vy += 0.6; comet.y += comet.vy;
  var floor = GROUND - comet.size;
  if(comet.y &gt; floor){ comet.y = floor; comet.vy = 0; }
  if(comet.y &lt; 0){ comet.y = 0; comet.vy = 0; }

  var eSize = comet.ducking ? comet.size*0.55 : comet.size;
  var cy = comet.y + (comet.size - eSize);

  // trail
  trail.push({x:comet.x-4, y:comet.y+comet.size/2, life:16});
  if(trail.length&gt;26) trail.shift();

  // stars parallax
  for(var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    s.x -= s.sp * (speed/4);
    if(s.x&lt;0){ s.x = W; s.y = Math.random()*GROUND; }
  }

  // obstacles
  for(var i=obstacles.length-1;i&gt;=0;i--){
    var o = obstacles[i];
    o.x -= speed;
    if(o.flash&gt;0) o.flash--;
    // scoring
    if(!o.passed &amp;&amp; o.x + o.w &lt; comet.x){
      o.passed = true; o.flash = 8;
      score += 3; scoreEl.textContent = score;
      // hue shift &amp; speed ramp every 10 pts
      hue = 250 - Math.floor(score/10)*14; if(hue&lt;170) hue=250;
      speed = 4 + score*0.05;
      burst(o.x+o.w/2, GROUND-o.h/2, &#x27;255,180,120&#x27;);
    }
    // collision
    var hit=false;
    var cx1=comet.x, cx2=comet.x+eSize;
    if(o.type===&#x27;rock&#x27;){
      var oy = GROUND - o.h;
      if(cx2&gt;o.x &amp;&amp; cx1&lt;o.x+o.w &amp;&amp; cy+eSize&gt;oy) hit=true;
    }else if(o.type===&#x27;satellite&#x27;){
      // hangs from top: solid from y=0 to o.h. must duck under.
      if(cx2&gt;o.x &amp;&amp; cx1&lt;o.x+o.w &amp;&amp; cy &lt; o.h) hit=true;
    }else{ // double: rock on ground + block up high, gap in middle
      var lowTop = GROUND - o.h; // ground rock
      var highBot = GROUND - o.h - 70; // upper block bottom
      var upH = highBot; // upper block from 0 to highBot... but keep gap
      if(cx2&gt;o.x &amp;&amp; cx1&lt;o.x+o.w){
        if(cy+eSize&gt;lowTop) hit=true;          // hit ground rock
        if(cy &lt; highBot) hit=true;             // hit upper block
      }
    }
    if(hit){ gameOver=true; beep(120,0.4,&#x27;square&#x27;,0.12); stopGame(); return; }
    if(o.x + o.w &lt; -10) obstacles.splice(i,1);
  }

  // particles
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life--;
    if(p.life&lt;=0) particles.splice(i,1);
  }

  score += 0; // score climbs via passes; also small idle climb:
  if(frame%6===0){ score+=1; scoreEl.textContent=score;
    hue = 250 - Math.floor(score/10)*14; if(hue&lt;170) hue=250;
    speed = 4 + score*0.05;
  }

  draw();
  animId = requestAnimationFrame(tick);
}

function draw(){
  // background gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, &#x27;hsl(&#x27;+hue+&#x27;,70%,10%)&#x27;);
  g.addColorStop(0.6, &#x27;hsl(&#x27;+(hue-20)+&#x27;,60%,16%)&#x27;);
  g.addColorStop(1, &#x27;hsl(&#x27;+(hue+30)+&#x27;,60%,8%)&#x27;);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars
  for(var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha = 0.4 + s.layer*0.25;
    ctx.fillStyle = s.layer===2 ? &#x27;#cff&#x27; : &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // neon planet surface
  var pg = ctx.createLinearGradient(0,GROUND,0,H);
  pg.addColorStop(0,&#x27;hsl(&#x27;+(hue+60)+&#x27;,90%,55%)&#x27;);
  pg.addColorStop(1,&#x27;hsl(&#x27;+(hue+60)+&#x27;,90%,25%)&#x27;);
  ctx.fillStyle = pg; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle = &#x27;hsl(&#x27;+(hue+60)+&#x27;,100%,75%)&#x27;; ctx.lineWidth=3;
  ctx.shadowColor=&#x27;hsl(&#x27;+(hue+60)+&#x27;,100%,70%)&#x27;; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
  ctx.shadowBlur=0;

  // trail
  for(var i=0;i&lt;trail.length;i++){
    var t=trail[i]; var a=i/trail.length;
    ctx.globalAlpha = a*0.6;
    ctx.fillStyle = &#x27;hsl(&#x27;+(30+a*20)+&#x27;,100%,&#x27;+(50+a*20)+&#x27;%)&#x27;;
    ctx.beginPath(); ctx.arc(t.x, t.y, (1-a)*10+2, 0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // particles
  for(var i=0;i&lt;particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha = Math.max(0,p.life/24);
    ctx.fillStyle=&#x27;rgba(&#x27;+p.col+&#x27;,1)&#x27;;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // obstacles
  for(var i=0;i&lt;obstacles.length;i++){ drawObstacle(obstacles[i]); }

  // comet
  drawComet();
}

function drawComet(){
  var eSize = comet.ducking ? comet.size*0.55 : comet.size;
  var cy = comet.y + (comet.size - eSize);
  var cx = comet.x, cyc = cy + eSize/2, cxc = cx + eSize/2;
  var grad = ctx.createRadialGradient(cxc,cyc,2,cxc,cyc,eSize);
  grad.addColorStop(0,&#x27;#fff&#x27;); grad.addColorStop(0.4,&#x27;#ffd27a&#x27;); grad.addColorStop(1,&#x27;#ff7a3a&#x27;);
  ctx.shadowColor=&#x27;#ff9a4a&#x27;; ctx.shadowBlur=25;
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(cxc,cyc,eSize/2,0,7); ctx.fill();
  ctx.shadowBlur=0;
  // little core sparkle
  ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(cxc-2,cyc-2,eSize/6,0,7); ctx.fill();
}

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

function drawObstacle(o){
  if(o.flash&gt;0){ ctx.globalAlpha = 0.5+0.5*Math.sin(o.flash); }
  if(o.type===&#x27;rock&#x27;){
    var oy = GROUND - o.h;
    px(o.x, oy, o.w, o.h, &#x27;#8a5a3a&#x27;);
    px(o.x+4, oy+4, o.w-8, o.h-10, &#x27;#a86a44&#x27;);
    px(o.x+6, oy-4, 8,6, &#x27;#8a5a3a&#x27;);
    ctx.strokeStyle=&#x27;#ffb27a&#x27;; ctx.lineWidth=1; ctx.strokeRect(o.x,oy,o.w,o.h);
  }else if(o.type===&#x27;satellite&#x27;){
    // hangs from top
    px(o.x+o.w/2-3, 0, 6, o.h-14, &#x27;#5aa&#x27;); // antenna pole
    px(o.x, o.h-16, o.w, 16, &#x27;#3aa6cc&#x27;);   // body
    px(o.x+4, o.h-12, o.w-8, 8, &#x27;#7fe&#x27;);   // panel
    // blinking light
    ctx.fillStyle = (frame%20&lt;10)?&#x27;#ff5&#x27;:&#x27;#a80&#x27;;
    ctx.beginPath(); ctx.arc(o.x+o.w/2, o.h-2, 3, 0,7); ctx.fill();
    ctx.strokeStyle=&#x27;#aef&#x27;; ctx.lineWidth=1; ctx.strokeRect(o.x,o.h-16,o.w,16);
  }else{ // double
    var lowTop = GROUND - o.h;
    var highBot = GROUND - o.h - 70;
    px(o.x, lowTop, o.w, o.h, &#x27;#7a5aaa&#x27;);       // ground block
    px(o.x, 0, o.w, highBot, &#x27;#5a3a8a&#x27;);        // upper block
    ctx.strokeStyle=&#x27;#c9a0ff&#x27;; ctx.lineWidth=1;
    ctx.strokeRect(o.x,lowTop,o.w,o.h);
    ctx.strokeRect(o.x,0,o.w,highBot);
  }
  ctx.globalAlpha=1;
}

function startGame(){
  if(running) return;
  reset();
  promptEl.style.display=&#x27;none&#x27;;
  running = true;
  animId = requestAnimationFrame(tick);
}
function stopGame(){
  if(!running &amp;&amp; !gameOver){ /* pause when not started */ }
  running = false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  if(gameOver){
    ctx.fillStyle=&#x27;rgba(0,0,0,0.55)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.font=&#x27;bold 34px system-ui&#x27;;
    ctx.fillText(&#x27;CRASH!&#x27;, W/2, H/2-10);
    ctx.font=&#x27;bold 20px system-ui&#x27;;
    ctx.fillStyle=&#x27;#9df&#x27;;
    ctx.fillText(score+&#x27; Light-Years Traveled&#x27;, W/2, H/2+24);
  }
}

// input
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ setDuck(true); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if(e.key===&#x27;ArrowDown&#x27;){ setDuck(false); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function(e){
  var r = cv.getBoundingClientRect();
  if(e.clientY - r.top &gt; H*0.6){ setDuck(true); setTimeout(function(){setDuck(false);},400); }
  else jump();
});

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t, function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;, kind:t, key:e.key||null}, &#x27;*&#x27;); }catch(_){}
  }, true);
});

// initial static render
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });

<script>
