<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC SURFER ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#ff5edb,#59d6ff,#8dff59); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #b9b3d6; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; gap: 24px; align-items: center; font-size: 20px; }
  .dist { color: #6ff0ff; text-shadow: 0 0 8px #2ad4ff, 0 0 16px #2ad4ff; font-weight: 700; }
  .combo { color: #ffd24a; text-shadow: 0 0 8px #ff9d2a; font-weight: 700; min-width: 90px; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; box-shadow: 0 0 30px rgba(90,120,255,0.35); background: #05010f; }
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
          font-size: 26px; color: #fff; text-shadow: 0 0 12px #ff5edb; }
  .over small { font-size: 16px; color: #cfc9e8; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC SURFER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to fire your jetpack — tap again mid-air for a second boost to clear asteroids. Fly low without landing to build a combo, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;dist&quot;&gt;Distance: &lt;span id=&quot;dist&quot;&gt;0&lt;/span&gt; km&lt;/span&gt;
    &lt;span class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;div&gt;💥 CRASHED&lt;/div&gt;&lt;small id=&quot;finalTxt&quot;&gt;&lt;/small&gt;&lt;small&gt;Press Start below to fly again&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height;
  var PLAT_H = 34, floorY = H - PLAT_H;
  var HERO_R = 15, HERO_X = 90;
  var GRAVITY = 0.62, JUMP_V = -11, DOUBLE_V = -8.5;

  var running = false, animId = null;
  var distEl = document.getElementById(&#x27;dist&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  var finalTxt = document.getElementById(&#x27;finalTxt&#x27;);

  var TIERS = [
    { spd: 3.2, plat: &#x27;#2ad4ff&#x27; },
    { spd: 4.0, plat: &#x27;#8dff59&#x27; },
    { spd: 4.8, plat: &#x27;#ffd24a&#x27; },
    { spd: 5.6, plat: &#x27;#ff8a3d&#x27; },
    { spd: 6.5, plat: &#x27;#ff5edb&#x27; },
    { spd: 7.5, plat: &#x27;#c05eff&#x27; }
  ];

  var state, starsFar, starsNear;

  function rnd(a,b){ return a + Math.random()*(b-a); }

  function makeStars(n, spread){
    var arr = [];
    for(var i=0;i&lt;n;i++){
      arr.push({ x: Math.random()*W, y: Math.random()*(floorY-10), r: rnd(spread[0],spread[1]), tw: Math.random()*6.28 });
    }
    return arr;
  }

  function resetState(){
    state = {
      heroY: floorY - HERO_R,
      vy: 0,
      onGround: true,
      jumps: 0,
      asteroids: [],
      particles: [],
      trail: [],
      dist: 0,
      tier: 0,
      flash: 0,
      combo: 0, comboActive: false, sinceLand: 0,
      spawnTimer: 0,
      platPhase: 0,
      gameOver: false,
      shake: 0
    };
    starsFar = makeStars(60, [0.6,1.3]);
    starsNear = makeStars(35, [1.2,2.4]);
    comboEl.textContent = &#x27;&#x27;;
    distEl.textContent = &#x27;0&#x27;;
  }

  function tierIndex(){
    var t = Math.floor(state.dist / 250);
    return Math.min(t, TIERS.length-1);
  }
  function curSpeed(){ return TIERS[state.tier].spd; }

  function spawnAsteroid(){
    var h = rnd(26, 74);
    var w = rnd(24, 46);
    // spikes
    var pts = [], n = Math.floor(rnd(7,11));
    for(var i=0;i&lt;n;i++){
      var ang = (i/n)*Math.PI*2;
      var rad = rnd(0.55,1.0);
      pts.push({a:ang, r:rad});
    }
    var hue = Math.floor(rnd(0,360));
    state.asteroids.push({
      x: W + 40, w: w, h: h, base: floorY,
      pts: pts, hue: hue, rot: 0, rotSpd: rnd(-0.05,0.05),
      scored: false
    });
  }

  function fireJet(){
    if(!running || state.gameOver) return;
    if(state.onGround){
      state.vy = JUMP_V; state.onGround = false; state.jumps = 1;
    } else if(state.jumps === 1){
      state.vy = DOUBLE_V; state.jumps = 2;
    }
    for(var i=0;i&lt;8;i++){
      state.particles.push({
        x: HERO_X, y: state.heroY+HERO_R, vx: rnd(-1,1), vy: rnd(1,3),
        life: 1, r: rnd(2,4), hue: rnd(180,300), grav:0.05
      });
    }
  }

  function landBurst(){
    for(var i=0;i&lt;14;i++){
      state.particles.push({
        x: HERO_X+rnd(-8,8), y: floorY, vx: rnd(-3,3), vy: rnd(-3,-0.5),
        life:1, r: rnd(2,4), hue: rnd(160,220), grav:0.15
      });
    }
  }

  function explode(){
    for(var i=0;i&lt;50;i++){
      var a = Math.random()*6.28, sp = rnd(1,7);
      state.particles.push({
        x: HERO_X, y: state.heroY, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life:1, r: rnd(2,6), hue: rnd(0,360), grav:0.08
      });
    }
    state.shake = 16;
  }

  function endGame(){
    state.gameOver = true;
    explode();
    finalTxt.textContent = &#x27;You surfed &#x27; + Math.floor(state.dist) + &#x27; km&#x27;;
    overEl.style.display = &#x27;flex&#x27;;
    // keep animating briefly for explosion, then stop via running check
  }

  function update(){
    var spd = curSpeed();

    if(!state.gameOver){
      state.dist += spd * 0.12;
      distEl.textContent = Math.floor(state.dist);

      var nt = tierIndex();
      if(nt !== state.tier){ state.tier = nt; state.flash = 1; }

      // physics
      state.vy += GRAVITY;
      state.heroY += state.vy;
      if(state.heroY &gt;= floorY - HERO_R){
        if(!state.onGround){ landBurst(); resetCombo(); }
        state.heroY = floorY - HERO_R; state.vy = 0; state.onGround = true; state.jumps = 0;
      }
      if(state.heroY &lt; HERO_R){ state.heroY = HERO_R; state.vy = 0; }

      // trail
      if(!state.onGround){
        state.trail.push({x:HERO_X, y:state.heroY+HERO_R, life:1, hue: (state.dist*3)%360});
      }

      // spawn
      state.spawnTimer -= 1;
      if(state.spawnTimer &lt;= 0){
        spawnAsteroid();
        state.spawnTimer = rnd(70, 120) / (spd/3.2);
      }

      // asteroids
      for(var i=state.asteroids.length-1;i&gt;=0;i--){
        var a = state.asteroids[i];
        a.x -= spd; a.rot += a.rotSpd;
        if(a.x + a.w &lt; 0){ state.asteroids.splice(i,1); continue; }
        if(!a.scored &amp;&amp; a.x + a.w &lt; HERO_X - HERO_R){
          a.scored = true;
          // combo: cleared while airborne + low
          if(!state.onGround &amp;&amp; state.heroY &gt; floorY - HERO_R - 90){
            state.combo++;
            if(state.combo &gt;= 3){ state.comboActive = true; }
          }
          if(state.comboActive){
            comboEl.textContent = &#x27;COMBO x&#x27; + (state.combo-1);
          }
        }
        // collision (circle vs box approx)
        var ax = a.x, ay = a.base - a.h, aw = a.w, ah = a.h;
        var cx = Math.max(ax, Math.min(HERO_X, ax+aw));
        var cy = Math.max(ay, Math.min(state.heroY, ay+ah));
        var dx = HERO_X - cx, dy = state.heroY - cy;
        if(dx*dx+dy*dy &lt; (HERO_R*0.85)*(HERO_R*0.85)){
          endGame();
        }
      }
    }

    // particles
    for(var p=state.particles.length-1;p&gt;=0;p--){
      var pt = state.particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.grav; pt.life -= 0.02;
      if(pt.life &lt;= 0) state.particles.splice(p,1);
    }
    // trail decay
    for(var t=state.trail.length-1;t&gt;=0;t--){
      state.trail[t].life -= 0.06;
      if(state.trail[t].life&lt;=0) state.trail.splice(t,1);
    }

    // stars parallax
    for(var s=0;s&lt;starsFar.length;s++){
      starsFar[s].x -= spd*0.25; starsFar[s].tw += 0.1;
      if(starsFar[s].x &lt; 0){ starsFar[s].x = W; starsFar[s].y = Math.random()*(floorY-10); }
    }
    for(var s2=0;s2&lt;starsNear.length;s2++){
      starsNear[s2].x -= spd*0.7; starsNear[s2].tw += 0.15;
      if(starsNear[s2].x &lt; 0){ starsNear[s2].x = W; starsNear[s2].y = Math.random()*(floorY-10); }
    }

    if(state.flash&gt;0) state.flash -= 0.05;
    if(state.shake&gt;0) state.shake -= 1;
    state.platPhase += 0.05;
  }

  function resetCombo(){
    state.combo = 0; state.comboActive = false; comboEl.textContent = &#x27;&#x27;;
  }

  function draw(){
    ctx.save();
    var sh = state.shake&gt;0 ? state.shake : 0;
    if(sh) ctx.translate(rnd(-sh,sh)*0.4, rnd(-sh,sh)*0.4);

    // bg gradient
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,&#x27;#0a0320&#x27;); g.addColorStop(1,&#x27;#14043a&#x27;);
    ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);

    // stars far
    for(var s=0;s&lt;starsFar.length;s++){
      var st = starsFar[s];
      ctx.globalAlpha = 0.4 + 0.3*Math.sin(st.tw);
      ctx.fillStyle = &#x27;#aab6ff&#x27;;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.28); ctx.fill();
    }
    // stars near
    for(var s2=0;s2&lt;starsNear.length;s2++){
      var st2 = starsNear[s2];
      ctx.globalAlpha = 0.6 + 0.4*Math.sin(st2.tw);
      ctx.fillStyle = &#x27;#ffffff&#x27;;
      ctx.beginPath(); ctx.arc(st2.x, st2.y, st2.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // asteroids
    for(var i=0;i&lt;state.asteroids.length;i++){
      var a = state.asteroids[i];
      var cx = a.x + a.w/2, cy = a.base - a.h/2;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(a.rot);
      ctx.beginPath();
      for(var j=0;j&lt;a.pts.length;j++){
        var pp = a.pts[j];
        var px = Math.cos(pp.a)*pp.r*a.w/2;
        var py = Math.sin(pp.a)*pp.r*a.h/2;
        if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      var ag = ctx.createLinearGradient(-a.w/2,-a.h/2,a.w/2,a.h/2);
      ag.addColorStop(0,&#x27;hsl(&#x27;+a.hue+&#x27;,90%,60%)&#x27;);
      ag.addColorStop(1,&#x27;hsl(&#x27;+((a.hue+60)%360)+&#x27;,90%,45%)&#x27;);
      ctx.fillStyle = ag;
      ctx.shadowColor = &#x27;hsl(&#x27;+a.hue+&#x27;,90%,60%)&#x27;; ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = &#x27;rgba(255,255,255,0.5)&#x27;; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }

    // energy platform
    var platColor = TIERS[state.tier].plat;
    var pulse = 0.5 + 0.5*Math.sin(state.platPhase);
    var pg = ctx.createLinearGradient(0,floorY,0,H);
    pg.addColorStop(0, platColor);
    pg.addColorStop(1, &#x27;rgba(0,0,0,0.2)&#x27;);
    ctx.fillStyle = pg;
    ctx.fillRect(0, floorY, W, PLAT_H);
    ctx.fillStyle = platColor;
    ctx.shadowColor = platColor; ctx.shadowBlur = 18*pulse+6;
    ctx.fillRect(0, floorY-3, W, 4);
    ctx.shadowBlur = 0;

    // trail
    for(var t=0;t&lt;state.trail.length;t++){
      var tr = state.trail[t];
      ctx.globalAlpha = tr.life*0.7;
      ctx.fillStyle = &#x27;hsl(&#x27;+tr.hue+&#x27;,90%,60%)&#x27;;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, HERO_R*0.6*tr.life+2, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // hero (hide if exploded)
    if(!state.gameOver){
      // glow
      ctx.shadowColor = &#x27;#59d6ff&#x27;; ctx.shadowBlur = 20;
      ctx.fillStyle = &#x27;#eafcff&#x27;;
      ctx.beginPath(); ctx.arc(HERO_X, state.heroY, HERO_R, 0, 6.28); ctx.fill();
      ctx.shadowBlur = 0;
      // helmet visor
      ctx.fillStyle = &#x27;#1b2b5e&#x27;;
      ctx.beginPath(); ctx.arc(HERO_X, state.heroY, HERO_R*0.62, 0, 6.28); ctx.fill();
      // visor gleam
      ctx.fillStyle = &#x27;rgba(255,255,255,0.85)&#x27;;
      ctx.beginPath(); ctx.arc(HERO_X-4, state.heroY-4, 3.2, 0, 6.28); ctx.fill();
    }

    // particles
    for(var p=0;p&lt;state.particles.length;p++){
      var pt = state.particles[p];
      ctx.globalAlpha = Math.max(pt.life,0);
      ctx.fillStyle = &#x27;hsl(&#x27;+pt.hue+&#x27;,90%,60%)&#x27;;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // tier flash
    if(state.flash&gt;0){
      ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+ (state.flash*0.5) +&#x27;)&#x27;;
      ctx.fillRect(-20,-20,W+40,H+40);
    }
    ctx.restore();
  }

  function loop(){
    if(!running) return;
    update();
    draw();
    // stop animating once explosion settles after gameover
    if(state.gameOver &amp;&amp; state.particles.length === 0){
      running = false; animId = null; return;
    }
    animId = requestAnimationFrame(loop);
  }

  function startGame(){
    if(running) return;
    resetState();
    overEl.style.display = &#x27;none&#x27;;
    spawnAsteroid();
    state.spawnTimer = 60;
    running = true;
    animId = requestAnimationFrame(loop);
  }
  function stopGame(){
    running = false;
    if(animId){ cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;){ fireJet(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;click&#x27;, function(){ fireJet(); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if(e.data.type === &#x27;wd_start&#x27;) startGame();
    else if(e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static render
  resetState();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
