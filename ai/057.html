<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       color: #0ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9df; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 640px; display: flex; justify-content: space-between; align-items: center; }
  .score { font-size: 22px; font-weight: 700; color: #ff0; text-shadow: 0 0 8px #fa0; }
  .shieldwrap { display: flex; align-items: center; gap: 8px; }
  .shieldwrap span { font-size: 15px; color: #0fa; }
  .shieldbar { width: 160px; height: 16px; border: 2px solid #0fa; border-radius: 8px; overflow: hidden; box-shadow: 0 0 8px #0fa; background: #012; }
  .shieldfill { height: 100%; width: 100%; background: linear-gradient(90deg,#0fa,#0ff); transition: width .2s; }
  .field { position: relative; width: 640px; height: 460px; flex-shrink: 0; background: #04010e;
           border: 2px solid #204; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px #218 inset; }
  #starcanvas { position: absolute; top:0; left:0; }
  .ship { position: absolute; width: 40px; height: 34px; bottom: 12px; z-index: 5;
          filter: drop-shadow(0 0 6px #0ff); }
  .bullet { position: absolute; width: 4px; height: 16px; border-radius: 2px;
            background: #0ff; box-shadow: 0 0 8px #0ff, 0 0 14px #0af; z-index: 4; }
  .alien { position: absolute; z-index: 3; display:flex; align-items:center; justify-content:center; }
  .drone { width: 26px; height: 26px; }
  .drone .body { width:100%; height:100%; background: radial-gradient(circle at 40% 35%, #d6f, #90f);
                 border-radius: 50% 50% 50% 50%/60% 60% 40% 40%; box-shadow: 0 0 10px #a0f;
                 animation: wobble .5s ease-in-out infinite alternate; }
  .spinner { width: 36px; height: 36px; }
  .spinner .body { width:100%; height:100%; background: conic-gradient(#fa0,#f60,#fc0,#fa0);
                   clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
                   box-shadow: 0 0 12px #f80; animation: spin 1.1s linear infinite; }
  .juggernaut { width: 56px; height: 56px; }
  .juggernaut .body { width:100%; height:100%; background: radial-gradient(circle at 40% 35%, #f66, #b00);
                      border-radius: 46%; box-shadow: 0 0 18px #f22; animation: pulse .9s ease-in-out infinite; }
  .bonus { width: 30px; height: 30px; }
  .bonus .body { width:100%; height:100%; background: radial-gradient(circle at 40% 35%, #ffd, #fa0);
                 clip-path: polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
                 box-shadow: 0 0 16px #fd0; animation: spin 1.5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
  @keyframes wobble { from{transform:rotate(-12deg);} to{transform:rotate(12deg);} }
  .particle { position:absolute; border-radius:50%; z-index:6; pointer-events:none; }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; z-index:7; pointer-events:none; }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
         font-size:30px; font-weight:800; color:#f4f; text-shadow:0 0 12px #f0f; z-index:8;
         background:rgba(5,1,15,.6); text-align:center; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and hold &lt;strong&gt;Space&lt;/strong&gt; to fire lasers at the aliens; hit gold stars for +10. Your shield drops if aliens reach the bottom — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;shieldwrap&quot;&gt;&lt;span&gt;SHIELD&lt;/span&gt;&lt;div class=&quot;shieldbar&quot;&gt;&lt;div class=&quot;shieldfill&quot; id=&quot;shieldfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;starcanvas&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;svg class=&quot;ship&quot; id=&quot;ship&quot; viewBox=&quot;0 0 40 34&quot;&gt;
      &lt;polygon points=&quot;20,0 38,32 20,24 2,32&quot; fill=&quot;#0ff&quot; stroke=&quot;#8ff&quot; stroke-width=&quot;1.5&quot;/&gt;
      &lt;polygon points=&quot;20,6 27,26 20,22 13,26&quot; fill=&quot;#08f&quot;/&gt;
    &lt;/svg&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot; style=&quot;display:none;&quot;&gt;PRESS START&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  var FIELD_W=640, FIELD_H=460;
  var SHIP_W=40, SHIP_H=34, SHIP_BOTTOM=12, SHIP_SPEED=6;
  var BULLET_SPEED=9;
  var running=false, animId=null, spawnId=null;
  var keysDown={}, shipX=(FIELD_W-SHIP_W)/2;
  var bullets=[], aliens=[], particles=[];
  var score=0, shield=100, lastShot=0, spawnEvery=1300, elapsed=0;
  var field=document.getElementById(&#x27;field&#x27;);
  var ship=document.getElementById(&#x27;ship&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var shieldEl=document.getElementById(&#x27;shieldfill&#x27;);
  var flash=document.getElementById(&#x27;flash&#x27;);
  var msg=document.getElementById(&#x27;msg&#x27;);

  // starfield
  var canvas=document.getElementById(&#x27;starcanvas&#x27;), ctx=canvas.getContext(&#x27;2d&#x27;);
  var stars=[];
  for(var i=0;i&lt;90;i++){ stars.push({x:Math.random()*FIELD_W,y:Math.random()*FIELD_H,
    z:Math.random()*2+0.4}); }
  function drawStars(){
    ctx.clearRect(0,0,FIELD_W,FIELD_H);
    for(var i=0;i&lt;stars.length;i++){var s=stars[i];
      if(running) s.y+=s.z;
      if(s.y&gt;FIELD_H){s.y=0;s.x=Math.random()*FIELD_W;}
      ctx.fillStyle=&#x27;rgba(150,200,255,&#x27;+(0.25+s.z*0.3)+&#x27;)&#x27;;
      ctx.fillRect(s.x,s.y,s.z,s.z*3);
    }
  }

  function paintShip(){ ship.style.left=shipX+&#x27;px&#x27;; }

  var TYPES={
    drone:{cls:&#x27;drone&#x27;,size:26,pts:1,speed:2.4,hp:1,zig:2.2},
    spinner:{cls:&#x27;spinner&#x27;,size:36,pts:2,speed:1.7,hp:2,zig:1.4},
    juggernaut:{cls:&#x27;juggernaut&#x27;,size:56,pts:5,speed:1.0,hp:4,zig:0.6},
    bonus:{cls:&#x27;bonus&#x27;,size:30,pts:10,speed:2.2,hp:1,zig:0}
  };

  function spawnAlien(forceBonus){
    var t;
    if(forceBonus){ t=&#x27;bonus&#x27;; }
    else{
      var r=Math.random();
      if(r&lt;0.55) t=&#x27;drone&#x27;; else if(r&lt;0.85) t=&#x27;spinner&#x27;; else t=&#x27;juggernaut&#x27;;
    }
    var def=TYPES[t];
    var a={type:t,def:def,hp:def.hp,size:def.size};
    a.x=Math.random()*(FIELD_W-def.size);
    a.y=-def.size;
    a.phase=Math.random()*Math.PI*2;
    a.dir=(t===&#x27;bonus&#x27;)?(Math.random()&lt;0.5?-1:1):0;
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;alien &#x27;+def.cls;
    el.innerHTML=&#x27;&lt;div class=&quot;body&quot;&gt;&lt;/div&gt;&#x27;;
    el.style.left=a.x+&#x27;px&#x27;; el.style.top=a.y+&#x27;px&#x27;;
    field.appendChild(el); a.el=el;
    aliens.push(a);
  }

  function shoot(){
    var now=Date.now();
    if(now-lastShot&lt;160) return;
    lastShot=now;
    var b={x:shipX+SHIP_W/2-2, y:FIELD_H-SHIP_BOTTOM-SHIP_H-16};
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;bullet&#x27;;
    el.style.left=b.x+&#x27;px&#x27;; el.style.top=b.y+&#x27;px&#x27;;
    field.appendChild(el); b.el=el; bullets.push(b);
    beep(880,0.05);
  }

  function makeParticles(cx,cy,color,count,spread){
    for(var i=0;i&lt;count;i++){
      var ang=Math.random()*Math.PI*2, sp=Math.random()*spread+1;
      var p={x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1};
      var sz=Math.random()*4+2;
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;particle&#x27;;
      el.style.width=sz+&#x27;px&#x27;; el.style.height=sz+&#x27;px&#x27;; el.style.background=color;
      el.style.boxShadow=&#x27;0 0 8px &#x27;+color;
      el.style.left=cx+&#x27;px&#x27;; el.style.top=cy+&#x27;px&#x27;;
      field.appendChild(el); p.el=el; particles.push(p);
    }
  }

  // sound
  var actx=null;
  function beep(freq,dur,type){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.08,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(_){}
  }

  function screenFlash(){ flash.style.opacity=&#x27;0.7&#x27;; setTimeout(function(){flash.style.opacity=&#x27;0&#x27;;},90); }

  function setShield(v){
    shield=Math.max(0,Math.min(100,v));
    shieldEl.style.width=shield+&#x27;%&#x27;;
    shieldEl.style.background = shield&lt;30 ? &#x27;linear-gradient(90deg,#f40,#f80)&#x27; : &#x27;linear-gradient(90deg,#0fa,#0ff)&#x27;;
  }

  function killAlien(idx,byBullet){
    var a=aliens[idx];
    var cx=a.x+a.size/2, cy=a.y+a.size/2;
    if(a.type===&#x27;juggernaut&#x27;){ screenFlash(); makeParticles(cx,cy,&#x27;#f44&#x27;,26,6); beep(120,0.3,&#x27;sawtooth&#x27;);
      // scatter debris drones
      for(var d=0;d&lt;2;d++){ makeParticles(cx,cy,&#x27;#f80&#x27;,8,4); }
    }
    else if(a.type===&#x27;bonus&#x27;){ makeParticles(cx,cy,&#x27;#fd0&#x27;,30,7); beep(1200,0.25,&#x27;triangle&#x27;); }
    else if(a.type===&#x27;spinner&#x27;){ makeParticles(cx,cy,&#x27;#fa0&#x27;,16,5); beep(300,0.15); }
    else { makeParticles(cx,cy,&#x27;#c4f&#x27;,12,5); beep(500,0.12); }
    score+=a.def.pts; scoreEl.textContent=score;
    if(a.el.parentNode) a.el.parentNode.removeChild(a.el);
    aliens.splice(idx,1);
  }

  function tick(){
    if(!running) return;
    drawStars();
    if(keysDown[&#x27;ArrowLeft&#x27;]) shipX-=SHIP_SPEED;
    if(keysDown[&#x27;ArrowRight&#x27;]) shipX+=SHIP_SPEED;
    if(keysDown[&#x27; &#x27;]) shoot();
    shipX=Math.max(0,Math.min(FIELD_W-SHIP_W,shipX));
    paintShip();

    for(var i=bullets.length-1;i&gt;=0;i--){var b=bullets[i]; b.y-=BULLET_SPEED;
      if(b.y+16&lt;0){ if(b.el.parentNode)b.el.parentNode.removeChild(b.el); bullets.splice(i,1); continue;}
      b.el.style.top=b.y+&#x27;px&#x27;;
    }

    for(var j=aliens.length-1;j&gt;=0;j--){var a=aliens[j];
      a.y+=a.def.speed;
      if(a.type===&#x27;bonus&#x27;){ a.x+=a.dir*2.5; if(a.x&lt;0||a.x&gt;FIELD_W-a.size)a.dir*=-1; }
      else { a.phase+=0.06; a.x+=Math.sin(a.phase)*a.def.zig; a.x=Math.max(0,Math.min(FIELD_W-a.size,a.x)); }
      a.el.style.left=a.x+&#x27;px&#x27;; a.el.style.top=a.y+&#x27;px&#x27;;
      // reach bottom
      if(a.y&gt;FIELD_H){
        if(a.type!==&#x27;bonus&#x27;){ setShield(shield-15); screenFlash(); beep(90,0.3,&#x27;sawtooth&#x27;); }
        if(a.el.parentNode)a.el.parentNode.removeChild(a.el); aliens.splice(j,1);
        if(shield&lt;=0){ gameOver(); return; }
        continue;
      }
      // collide with ship
      var sx=shipX, sy=FIELD_H-SHIP_BOTTOM-SHIP_H;
      if(a.type!==&#x27;bonus&#x27; &amp;&amp; a.x&lt;sx+SHIP_W &amp;&amp; a.x+a.size&gt;sx &amp;&amp; a.y&lt;sy+SHIP_H &amp;&amp; a.y+a.size&gt;sy){
        setShield(shield-20); screenFlash(); makeParticles(a.x+a.size/2,a.y+a.size/2,&#x27;#0ff&#x27;,14,5); beep(80,0.3,&#x27;sawtooth&#x27;);
        if(a.el.parentNode)a.el.parentNode.removeChild(a.el); aliens.splice(j,1);
        if(shield&lt;=0){ gameOver(); return; }
        continue;
      }
    }

    // bullet-alien collisions
    for(var bi=bullets.length-1;bi&gt;=0;bi--){var b2=bullets[bi];
      for(var ai=aliens.length-1;ai&gt;=0;ai--){var a2=aliens[ai];
        if(b2.x&lt;a2.x+a2.size &amp;&amp; b2.x+4&gt;a2.x &amp;&amp; b2.y&lt;a2.y+a2.size &amp;&amp; b2.y+16&gt;a2.y){
          if(b2.el.parentNode)b2.el.parentNode.removeChild(b2.el); bullets.splice(bi,1);
          a2.hp--;
          if(a2.hp&lt;=0){ killAlien(ai,true); }
          else { makeParticles(b2.x,b2.y,&#x27;#fff&#x27;,4,3); }
          break;
        }
      }
    }

    // particles
    for(var pi=particles.length-1;pi&gt;=0;pi--){var p=particles[pi];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.03;
      if(p.life&lt;=0){ if(p.el.parentNode)p.el.parentNode.removeChild(p.el); particles.splice(pi,1); continue;}
      p.el.style.left=p.x+&#x27;px&#x27;; p.el.style.top=p.y+&#x27;px&#x27;; p.el.style.opacity=p.life;
    }

    animId=requestAnimationFrame(tick);
  }

  function bonusTimer(){
    if(!running) return;
    spawnAlien(true);
    setTimeout(bonusTimer, 9000+Math.random()*6000);
  }

  function difficulty(){
    if(!running) return;
    elapsed++;
    if(spawnEvery&gt;500){ spawnEvery-=60; restartSpawn(); }
  }
  function restartSpawn(){
    if(spawnId) clearInterval(spawnId);
    spawnId=setInterval(function(){ if(running) spawnAlien(false); }, spawnEvery);
  }

  function clearAll(){
    bullets.forEach(function(b){if(b.el.parentNode)b.el.parentNode.removeChild(b.el);});
    aliens.forEach(function(a){if(a.el.parentNode)a.el.parentNode.removeChild(a.el);});
    particles.forEach(function(p){if(p.el.parentNode)p.el.parentNode.removeChild(p.el);});
    bullets=[];aliens=[];particles=[];
  }

  var diffId=null;
  function startGame(){
    if(running) return;
    clearAll();
    score=0; scoreEl.textContent=&#x27;0&#x27;; setShield(100);
    shipX=(FIELD_W-SHIP_W)/2; paintShip();
    for(var k in keysDown) keysDown[k]=false;
    lastShot=0; spawnEvery=1300;
    msg.style.display=&#x27;none&#x27;;
    running=true;
    spawnAlien(false);
    restartSpawn();
    if(diffId) clearInterval(diffId);
    diffId=setInterval(difficulty, 8000);
    bonusTimer();
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    if(diffId){clearInterval(diffId);diffId=null;}
    clearAll();
    drawStars();
  }
  function gameOver(){
    running=false;
    if(animId){cancelAnimationFrame(animId);animId=null;}
    if(spawnId){clearInterval(spawnId);spawnId=null;}
    if(diffId){clearInterval(diffId);diffId=null;}
    msg.innerHTML=&#x27;GAME OVER&lt;br&gt;SCORE &#x27;+score+&#x27;&lt;br&gt;&lt;span style=&quot;font-size:18px;color:#9df;&quot;&gt;Press Start to play again&lt;/span&gt;&#x27;;
    msg.style.display=&#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keysDown[e.key]=true;e.preventDefault();}
    else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){keysDown[&#x27; &#x27;]=true;e.preventDefault();}
  });
  window.addEventListener(&#x27;keyup&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;)keysDown[e.key]=false;
    else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;)keysDown[&#x27; &#x27;]=false;
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  paintShip(); drawStars(); msg.style.display=&#x27;flex&#x27;;
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
