<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMET DASH</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COMET DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px 18px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(90deg,#a05cff,#4de3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9fa0d0; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .score { font-size: 24px; font-weight: 700; color: #fff; margin: 0; text-shadow: 0 0 12px #7cf; transition: transform .12s ease; }
  .score.pulse { transform: scale(1.5); }
  .field-wrap { position: relative; width: 640px; height: 440px; flex-shrink: 0; border-radius: 10px; overflow: hidden; box-shadow: 0 0 40px rgba(120,80,255,.25); }
  canvas { display: block; background: #05030f; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COMET DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; (or click) to make your comet leap over the crystal asteroids. Read each obstacle&#x27;s height, time your jump, and survive as long as you can — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage(
        { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
        &#x27;*&#x27;
      );
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 440, GROUND_H = 46;
var scoreEl = document.getElementById(&#x27;score&#x27;);

var PALETTES = [
  { a:&#x27;#a05cff&#x27;, b:&#x27;#4de3ff&#x27;, glow:&#x27;#8a5cff&#x27;, ground:&#x27;#2a1a55&#x27;, star:&#x27;#c9b8ff&#x27; },
  { a:&#x27;#ff8a3c&#x27;, b:&#x27;#ff3b52&#x27;, glow:&#x27;#ff6b3c&#x27;, ground:&#x27;#4a1a20&#x27;, star:&#x27;#ffd0b0&#x27; },
  { a:&#x27;#4dff9c&#x27;, b:&#x27;#3ce0d0&#x27;, glow:&#x27;#4dffb0&#x27;, ground:&#x27;#123d33&#x27;, star:&#x27;#b0ffe0&#x27; }
];

var running = false, animId = null;
var gameOver = false;
var score = 0, speed = 3.2, baseSpeed = 3.2;
var palIndex = 0;

// comet
var cometX = 90, cometY, cometVY, cometSize = 16;
var GRAVITY = 0.62, JUMP_V = -13.2;
var trail = [], sparks = [];

// obstacles
var obstacles = [];
var spawnTimer = 0, spawnGap = 95;

// stars: 3 parallax layers
var starLayers = [];

var flash = 0;

function initStars() {
  starLayers = [];
  var configs = [
    { count: 40, size: 1, sp: 0.25, tw: 0.02 },
    { count: 26, size: 1.6, sp: 0.55, tw: 0.035 },
    { count: 16, size: 2.4, sp: 1.0, tw: 0.05 }
  ];
  configs.forEach(function(c){
    var arr = [];
    for (var i=0;i&lt;c.count;i++){
      arr.push({ x: Math.random()*W, y: Math.random()*(H-GROUND_H), s: c.size, sp: c.sp, ph: Math.random()*Math.PI*2, tw: c.tw });
    }
    starLayers.push(arr);
  });
}

function reset() {
  score = 0; scoreEl.textContent = &#x27;0&#x27;;
  speed = baseSpeed;
  palIndex = 0;
  cometY = H - GROUND_H - cometSize - 2;
  cometVY = 0;
  trail = []; sparks = [];
  obstacles = [];
  spawnTimer = 0;
  gameOver = false;
  flash = 0;
  initStars();
  spawnObstacle();
}

function spawnObstacle() {
  var tall = Math.random() &lt; 0.5;
  var o = tall
    ? { x: W + 20, w: 22, h: 62 }
    : { x: W + 20, w: 52, h: 30 };
  obstacles.push(o);
}

function jump() {
  if (!running || gameOver) return;
  var floor = H - GROUND_H - cometSize - 2;
  if (cometY &gt;= floor - 1) {
    cometVY = JUMP_V;
    // spark burst downward
    for (var i=0;i&lt;14;i++){
      sparks.push({
        x: cometX, y: cometY + cometSize*0.6,
        vx: (Math.random()-0.5)*3,
        vy: Math.random()*3 + 1,
        life: 1, size: Math.random()*2.5+1
      });
    }
  }
}

function pulseScore() {
  scoreEl.parentNode.classList.remove(&#x27;pulse&#x27;);
  void scoreEl.parentNode.offsetWidth;
  scoreEl.parentNode.classList.add(&#x27;pulse&#x27;);
}

function update() {
  var pal = PALETTES[palIndex];
  // stars
  starLayers.forEach(function(arr){
    arr.forEach(function(st){
      st.x -= st.sp * (speed/baseSpeed) * 1.4;
      if (st.x &lt; -3) { st.x = W + 3; st.y = Math.random()*(H-GROUND_H); }
      st.ph += st.tw;
    });
  });

  // comet physics
  cometVY += GRAVITY;
  cometY += cometVY;
  var floor = H - GROUND_H - cometSize - 2;
  if (cometY &gt; floor) { cometY = floor; cometVY = 0; }
  if (cometY &lt; 0) { cometY = 0; cometVY = 0; }

  // trail
  trail.push({ x: cometX, y: cometY, life: 1 });
  if (trail.length &gt; 24) trail.shift();
  trail.forEach(function(t){ t.life -= 0.045; });

  // sparks
  for (var i=sparks.length-1;i&gt;=0;i--){
    var s = sparks[i];
    s.x -= speed*0.5;
    s.y += s.vy; s.x += s.vx; s.vy += 0.25;
    s.life -= 0.05;
    if (s.life &lt;= 0) sparks.splice(i,1);
  }

  // obstacles
  spawnTimer++;
  if (spawnTimer &gt;= spawnGap) {
    spawnObstacle();
    spawnTimer = 0;
    spawnGap = 70 + Math.random()*50;
  }
  for (var j=obstacles.length-1;j&gt;=0;j--){
    var o = obstacles[j];
    o.x -= speed;
    if (!o.scored &amp;&amp; o.x + o.w &lt; cometX) {
      o.scored = true;
      score++;
      scoreEl.textContent = score;
      pulseScore();
      if (score % 5 === 0) {
        speed += 0.55;
        palIndex = (palIndex + 1) % PALETTES.length;
      }
    }
    // collision
    var oy = H - GROUND_H - o.h;
    if (cometX + cometSize*0.7 &gt; o.x &amp;&amp; cometX - cometSize*0.7 &lt; o.x + o.w &amp;&amp;
        cometY + cometSize*0.7 &gt; oy) {
      crash();
      return;
    }
    if (o.x + o.w &lt; -30) obstacles.splice(j,1);
  }
}

function crash() {
  gameOver = true;
  flash = 1;
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  drawFrame();
  // fade the flash out with a short loop
  var fadeLoop = function(){
    flash -= 0.06;
    drawFrame();
    if (flash &gt; 0) requestAnimationFrame(fadeLoop);
  };
  requestAnimationFrame(fadeLoop);
}

function drawFrame() {
  var pal = PALETTES[palIndex];
  // bg gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#05030f&#x27;);
  g.addColorStop(1,&#x27;#0c0824&#x27;);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // stars
  starLayers.forEach(function(arr){
    arr.forEach(function(st){
      var tw = 0.5 + 0.5*Math.sin(st.ph);
      ctx.globalAlpha = 0.3 + tw*0.7;
      ctx.fillStyle = pal.star;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.s, 0, Math.PI*2);
      ctx.fill();
    });
  });
  ctx.globalAlpha = 1;

  // ground / planet surface
  var gg = ctx.createLinearGradient(0,H-GROUND_H,0,H);
  gg.addColorStop(0, pal.ground);
  gg.addColorStop(1,&#x27;#05030f&#x27;);
  ctx.fillStyle = gg;
  ctx.fillRect(0, H-GROUND_H, W, GROUND_H);
  // glowing surface line
  ctx.strokeStyle = pal.b;
  ctx.lineWidth = 2;
  ctx.shadowColor = pal.b; ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(0, H-GROUND_H); ctx.lineTo(W, H-GROUND_H);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // obstacles - crystalline
  obstacles.forEach(function(o){
    var oy = H - GROUND_H - o.h;
    ctx.save();
    ctx.shadowColor = pal.a; ctx.shadowBlur = 16;
    var og = ctx.createLinearGradient(o.x, oy, o.x, oy+o.h);
    og.addColorStop(0, pal.b);
    og.addColorStop(1, pal.a);
    ctx.fillStyle = og;
    // faceted crystal shape
    ctx.beginPath();
    ctx.moveTo(o.x + o.w/2, oy);
    ctx.lineTo(o.x + o.w, oy + o.h*0.35);
    ctx.lineTo(o.x + o.w*0.8, oy + o.h);
    ctx.lineTo(o.x + o.w*0.2, oy + o.h);
    ctx.lineTo(o.x, oy + o.h*0.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = &#x27;rgba(255,255,255,.5)&#x27;;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  });

  // comet trail
  for (var i=0;i&lt;trail.length;i++){
    var t = trail[i];
    if (t.life &lt;= 0) continue;
    ctx.globalAlpha = t.life * 0.6;
    ctx.fillStyle = pal.b;
    var r = cometSize * (0.3 + t.life*0.6);
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // sparks
  sparks.forEach(function(s){
    ctx.globalAlpha = Math.max(0,s.life);
    ctx.fillStyle = pal.a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ghost echo when crashed
  if (gameOver) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = &#x27;#ffffff&#x27;;
    ctx.beginPath();
    ctx.arc(cometX, cometY, cometSize, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // comet body
  var pal2 = PALETTES[palIndex];
  ctx.save();
  ctx.shadowColor = pal2.glow; ctx.shadowBlur = 28;
  var cg = ctx.createRadialGradient(cometX-4, cometY-4, 2, cometX, cometY, cometSize);
  cg.addColorStop(0,&#x27;#ffffff&#x27;);
  cg.addColorStop(0.5, pal2.b);
  cg.addColorStop(1, pal2.a);
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(cometX, cometY, cometSize, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // flash
  if (flash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+Math.min(1,flash)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }

  // game over text
  if (gameOver &amp;&amp; flash &lt; 0.5) {
    ctx.save();
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = pal2.b; ctx.shadowBlur = 30;
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.font = &#x27;bold 30px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;COMET LOST&#x27;, W/2, H/2 - 26);
    ctx.font = &#x27;bold 56px system-ui, sans-serif&#x27;;
    ctx.fillStyle = pal2.b;
    ctx.fillText(score, W/2, H/2 + 34);
    ctx.shadowBlur = 0;
    ctx.font = &#x27;16px system-ui, sans-serif&#x27;;
    ctx.fillStyle = &#x27;#cfd0ff&#x27;;
    ctx.fillText(&#x27;points&#x27;, W/2, H/2 + 60);
    ctx.restore();
  }
}

function loop() {
  if (!running) return;
  update();
  if (!running) return; // crash may have stopped it
  drawFrame();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  if (running) return;
  reset();
  running = true;
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { jump(); e.preventDefault(); }
});
cv.addEventListener(&#x27;click&#x27;, function(){ jump(); });

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static scene
initStars();
cometY = H - GROUND_H - cometSize - 2;
drawFrame();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
