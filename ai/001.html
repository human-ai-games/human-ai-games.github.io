<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>ASTRO DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0417; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg,#4df,#f4f,#4df); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(120,180,255,.4); }
  .instructions { font-size: 16px; color: #b9c; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #6ef; text-shadow: 0 0 12px #2ad, 0 0 24px #08a; }
  .wrap { position: relative; width: 660px; height: 420px; flex-shrink: 0; }
  #game { display: block; border-radius: 10px; box-shadow: 0 0 30px rgba(80,40,160,.5); }
  .flash { position:absolute; inset:0; border-radius:10px; background:#fff; opacity:0; pointer-events:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;ASTRO&amp;nbsp;DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press Space or click to blast your jetpack — tap again in mid-air for a double-jump. Dodge the glowing alien crystals and travel as far as you can.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;Distance: &lt;span id=&quot;dist&quot;&gt;0&lt;/span&gt; km&lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;game&quot; width=&quot;660&quot; height=&quot;420&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;game&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 660, H = 420, GROUND_H = 60, groundY = H - GROUND_H;
var distEl = document.getElementById(&#x27;dist&#x27;), flashEl = document.getElementById(&#x27;flash&#x27;);

var running = false, animId = null, gameOver = false;
var running_t = 0;

// Astronaut
var hero, speed, baseSpeed, score, lastSpeedScore, spawnTimer, spawnGap;
var obstacles, particles, stars, mountains, shockwave, shakeT, flamePulse, speedMsg;

function rnd(a,b){ return a + Math.random()*(b-a); }

function initStars(){
  stars = [];
  for (var i=0;i&lt;70;i++){
    stars.push({ x: Math.random()*W, y: Math.random()*groundY, r: rnd(0.5,1.8), tw: rnd(0,6.28), sp: rnd(0.1,0.4) });
  }
}
function initMountains(){
  mountains = [];
  var x = 0;
  while (x &lt; W + 200){
    var w = rnd(80,160), h = rnd(50,150);
    mountains.push({ x:x, w:w, h:h });
    x += w*0.75;
  }
}

function reset(){
  hero = { x: 90, y: groundY-34, w:26, h:34, vy:0, jumps:0, tumble:0, rot:0, flash:0 };
  baseSpeed = 4.2; speed = baseSpeed;
  score = 0; lastSpeedScore = 0;
  spawnTimer = 0; spawnGap = 90;
  obstacles = []; particles = [];
  shockwave = null; shakeT = 0; flamePulse = 0;
  speedMsg = { t:0, txt:&#x27;&#x27; };
  gameOver = false;
  running_t = 0;
  initStars(); initMountains();
  distEl.textContent = &#x27;0&#x27;;
  // preview obstacle so field isn&#x27;t empty
  spawnObstacle(W - 60);
}

var GRAV = 0.62, JUMP_V = -11.5;

function jump(){
  if (!running || gameOver) return;
  if (hero.jumps &lt; 2){
    hero.vy = JUMP_V;
    hero.jumps++;
    flamePulse = 1;
    // burst of particles
    for (var i=0;i&lt;8;i++){
      particles.push({ x: hero.x+13, y: hero.y+hero.h, vx: rnd(-1.5,1.5), vy: rnd(0.5,2.5), life:1, r: rnd(2,4), c: hero.jumps===2?&#x27;#f6f&#x27;:&#x27;#6cf&#x27; });
    }
  }
}

var CRYSTAL_COLORS = [&#x27;#5ff&#x27;,&#x27;#f5c&#x27;,&#x27;#af7&#x27;,&#x27;#fc6&#x27;,&#x27;#7af&#x27;];
function spawnObstacle(atX){
  var tier = Math.floor(Math.random()*3); // 0 short 1 med 2 tall
  var h = [26,46,68][tier];
  var w = [22,26,30][tier];
  obstacles.push({ x: atX!==undefined?atX:W+20, w:w, h:h, c: CRYSTAL_COLORS[Math.floor(Math.random()*CRYSTAL_COLORS.length)], scored:false });
}

function collide(){
  gameOver = true;
  hero.tumble = 1; hero.flash = 1;
  shakeT = 20;
  shockwave = { x: hero.x+hero.w/2, r: 0 };
  // debris
  for (var i=0;i&lt;20;i++){
    particles.push({ x: hero.x+13, y: hero.y+15, vx: rnd(-4,4), vy: rnd(-5,0), life:1, r:rnd(2,5), c:&#x27;#f66&#x27; });
  }
}

function update(){
  running_t++;
  // hero physics
  hero.vy += GRAV; hero.y += hero.vy;
  if (hero.y &gt; groundY - hero.h){ hero.y = groundY - hero.h; hero.vy = 0; hero.jumps = 0; }
  if (flamePulse &gt; 0) flamePulse -= 0.05;

  // trail particles
  if (running_t % 3 === 0){
    particles.push({ x: hero.x, y: hero.y+hero.h*0.6, vx: -speed*0.3, vy: rnd(-0.3,0.3), life:1, r:rnd(1.5,3), c:&#x27;#8cf&#x27; });
  }

  // stars parallax
  for (var i=0;i&lt;stars.length;i++){
    stars[i].x -= stars[i].sp * (speed*0.15);
    if (stars[i].x &lt; 0){ stars[i].x = W; stars[i].y = Math.random()*groundY; }
    stars[i].tw += 0.05;
  }
  // mountains parallax
  for (var i=0;i&lt;mountains.length;i++){
    mountains[i].x -= speed*0.35;
    if (mountains[i].x + mountains[i].w &lt; 0){
      var maxX = 0;
      for (var j=0;j&lt;mountains.length;j++) maxX = Math.max(maxX, mountains[j].x + mountains[j].w);
      mountains[i].x = maxX - 10;
      mountains[i].w = rnd(80,160); mountains[i].h = rnd(50,150);
    }
  }

  // obstacles
  spawnTimer++;
  if (spawnTimer &gt;= spawnGap){
    spawnTimer = 0;
    spawnGap = Math.max(48, 90 - (speed-baseSpeed)*8) + Math.random()*30;
    spawnObstacle();
  }
  for (var i=obstacles.length-1;i&gt;=0;i--){
    var o = obstacles[i];
    o.x -= speed;
    if (o.x + o.w &lt; -10){ obstacles.splice(i,1); continue; }
    if (!o.scored &amp;&amp; o.x + o.w &lt; hero.x){
      o.scored = true;
      score++;
      distEl.textContent = score;
      if (score - lastSpeedScore &gt;= 10){
        lastSpeedScore = score;
        speed += 0.7;
        speedMsg = { t: 60, txt: &#x27;SPEED UP!&#x27; };
        flashEl.style.transition = &#x27;none&#x27;; flashEl.style.opacity = &#x27;0.5&#x27;;
        setTimeout(function(){ flashEl.style.transition=&#x27;opacity .4s&#x27;; flashEl.style.opacity=&#x27;0&#x27;; }, 20);
      }
    }
    // collision (crystal is spiky; use slightly inset box)
    var oTop = groundY - o.h;
    if (hero.x+hero.w-4 &gt; o.x+3 &amp;&amp; hero.x+4 &lt; o.x+o.w-3 &amp;&amp; hero.y+hero.h-2 &gt; oTop){
      collide();
    }
  }

  // particles
  for (var i=particles.length-1;i&gt;=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.03;
    if (p.life &lt;= 0) particles.splice(i,1);
  }
}

function updateDeath(){
  // tumble hero, expand shockwave, fade particles, then freeze
  hero.rot += 0.3; hero.y += hero.vy; hero.vy += GRAV*0.5;
  if (hero.flash &gt; 0) hero.flash -= 0.05;
  if (shakeT &gt; 0) shakeT--;
  if (shockwave) shockwave.r += 6;
  for (var i=particles.length-1;i&gt;=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
    if (p.life &lt;= 0) particles.splice(i,1);
  }
}

function draw(){
  var sx = 0, sy = 0;
  if (shakeT &gt; 0){ sx = rnd(-shakeT/3,shakeT/3); sy = rnd(-shakeT/3,shakeT/3); }
  ctx.save();
  ctx.translate(sx, sy);

  // sky gradient
  var g = ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,&#x27;#1a0838&#x27;); g.addColorStop(1,&#x27;#2d1055&#x27;);
  ctx.fillStyle = g; ctx.fillRect(-10,-10,W+20,groundY+10);

  // stars
  for (var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    var a = 0.4 + 0.6*Math.abs(Math.sin(s.tw));
    ctx.globalAlpha = a; ctx.fillStyle = &#x27;#cfe6ff&#x27;;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // mountains
  for (var i=0;i&lt;mountains.length;i++){
    var m = mountains[i];
    ctx.fillStyle = &#x27;#22103f&#x27;;
    ctx.beginPath();
    ctx.moveTo(m.x, groundY);
    ctx.lineTo(m.x + m.w/2, groundY - m.h);
    ctx.lineTo(m.x + m.w, groundY);
    ctx.closePath(); ctx.fill();
  }

  // ground with pulsing bioluminescent color teal&lt;-&gt;magenta
  var pulse = (Math.sin(running_t*0.02)+1)/2;
  var r = Math.round(40 + pulse*160), gg = Math.round(220 - pulse*140), b = Math.round(200 - pulse*60);
  var glowCol = &#x27;rgb(&#x27;+r+&#x27;,&#x27;+gg+&#x27;,&#x27;+b+&#x27;)&#x27;;
  ctx.fillStyle = &#x27;#0d0620&#x27;;
  ctx.fillRect(-10, groundY, W+20, GROUND_H+10);
  ctx.strokeStyle = glowCol; ctx.lineWidth = 3;
  ctx.shadowBlur = 18; ctx.shadowColor = glowCol;
  ctx.beginPath(); ctx.moveTo(-10, groundY+1.5); ctx.lineTo(W+10, groundY+1.5); ctx.stroke();
  ctx.shadowBlur = 0;
  // ground grid lines
  ctx.strokeStyle = &#x27;rgba(&#x27;+r+&#x27;,&#x27;+gg+&#x27;,&#x27;+b+&#x27;,0.15)&#x27;; ctx.lineWidth = 1;
  var off = (running_t*speed)%40;
  for (var gx=-off; gx&lt;W; gx+=40){
    ctx.beginPath(); ctx.moveTo(gx, groundY); ctx.lineTo(gx-30, H); ctx.stroke();
  }

  // crystals
  for (var i=0;i&lt;obstacles.length;i++){
    var o = obstacles[i], oTop = groundY - o.h;
    // ground glow beneath
    var gr = ctx.createRadialGradient(o.x+o.w/2, groundY, 2, o.x+o.w/2, groundY, o.w*1.6);
    gr.addColorStop(0, o.c); gr.addColorStop(1, &#x27;transparent&#x27;);
    ctx.globalAlpha = 0.35; ctx.fillStyle = gr;
    ctx.fillRect(o.x - o.w, groundY-4, o.w*3, 12);
    ctx.globalAlpha = 1;
    // spiky crystal
    ctx.shadowBlur = 14; ctx.shadowColor = o.c;
    ctx.fillStyle = o.c;
    ctx.beginPath();
    ctx.moveTo(o.x, groundY);
    ctx.lineTo(o.x + o.w*0.2, oTop + o.h*0.3);
    ctx.lineTo(o.x + o.w*0.5, oTop);
    ctx.lineTo(o.x + o.w*0.8, oTop + o.h*0.3);
    ctx.lineTo(o.x + o.w, groundY);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;rgba(255,255,255,0.4)&#x27;;
    ctx.beginPath();
    ctx.moveTo(o.x + o.w*0.5, oTop);
    ctx.lineTo(o.x + o.w*0.5, groundY);
    ctx.lineTo(o.x + o.w*0.35, groundY);
    ctx.closePath(); ctx.fill();
  }

  // particles
  for (var i=0;i&lt;particles.length;i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // astronaut
  ctx.save();
  ctx.translate(hero.x + hero.w/2, hero.y + hero.h/2);
  ctx.rotate(hero.rot);
  // jetpack flame
  var flen = 8 + flamePulse*22;
  var fg = ctx.createLinearGradient(0, hero.h/2, 0, hero.h/2 + flen);
  fg.addColorStop(0, &#x27;#fff&#x27;); fg.addColorStop(0.4,&#x27;#6cf&#x27;); fg.addColorStop(1,&#x27;transparent&#x27;);
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-6, hero.h/2);
  ctx.lineTo(0, hero.h/2 + flen);
  ctx.lineTo(6, hero.h/2);
  ctx.closePath(); ctx.fill();
  // body
  var bodyCol = hero.flash &gt; 0 &amp;&amp; Math.floor(hero.flash*20)%2===0 ? &#x27;#f44&#x27; : &#x27;#e8eefc&#x27;;
  ctx.fillStyle = bodyCol;
  ctx.shadowBlur = 12; ctx.shadowColor = &#x27;#8cf&#x27;;
  // suit
  roundRect(-hero.w/2, -hero.h/2, hero.w, hero.h, 8);
  ctx.fill();
  ctx.shadowBlur = 0;
  // helmet visor
  ctx.fillStyle = &#x27;#2a6cff&#x27;;
  ctx.beginPath(); ctx.arc(0, -hero.h*0.22, 8, 0, 6.28); ctx.fill();
  ctx.fillStyle = &#x27;#8fd0ff&#x27;;
  ctx.beginPath(); ctx.arc(-2, -hero.h*0.26, 3, 0, 6.28); ctx.fill();
  ctx.restore();

  // shockwave crack
  if (shockwave){
    ctx.globalAlpha = Math.max(0, 1 - shockwave.r/220);
    ctx.strokeStyle = &#x27;#f66&#x27;; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(shockwave.x, groundY, shockwave.r, Math.PI, 2*Math.PI); ctx.stroke();
    ctx.strokeStyle = &#x27;#fc6&#x27;; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(shockwave.x, groundY, shockwave.r*0.6, Math.PI, 2*Math.PI); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // speed msg
  if (speedMsg.t &gt; 0){
    ctx.globalAlpha = Math.min(1, speedMsg.t/30);
    ctx.fillStyle = &#x27;#6ef&#x27;; ctx.font = &#x27;bold 34px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#2ad&#x27;;
    ctx.fillText(speedMsg.txt, W/2, H/2 - 30);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = &#x27;left&#x27;;
    speedMsg.t--;
  }

  // game over
  if (gameOver &amp;&amp; shakeT &lt;= 0){
    ctx.globalAlpha = 0.55; ctx.fillStyle = &#x27;#000&#x27;; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
    ctx.fillStyle = &#x27;#f66&#x27;; ctx.font = &#x27;bold 40px system-ui&#x27;; ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#f44&#x27;;
    ctx.fillText(&#x27;CRASHED&#x27;, W/2, H/2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;#eee&#x27;; ctx.font = &#x27;22px system-ui&#x27;;
    ctx.fillText(&#x27;Distance: &#x27; + score + &#x27; km&#x27;, W/2, H/2 + 26);
    ctx.fillStyle = &#x27;#b9c&#x27;; ctx.font = &#x27;16px system-ui&#x27;;
    ctx.fillText(&#x27;Press Start below to fly again&#x27;, W/2, H/2 + 56);
    ctx.textAlign = &#x27;left&#x27;;
  }

  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function loop(){
  if (!running) return;
  if (!gameOver) update();
  else updateDeath();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame(){
  if (running) return;
  reset();
  running = true;
  animId = requestAnimationFrame(loop);
}
function stopGame(){
  running = false;
  if (animId){ cancelAnimationFrame(animId); animId = null; }
}

function doJump(){ jump(); }
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;){ doJump(); e.preventDefault(); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ doJump(); });
window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static preview
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;
