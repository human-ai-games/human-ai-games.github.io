&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;Fruit Drop Frenzy 🍎🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;←/→&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, slam down with &lt;strong&gt;↓&lt;/strong&gt;. Clear full rows to score — clear several at once for big combo bonuses!&lt;/p&gt;

  &lt;div class=&quot;board-wrap&quot;&gt;

&lt;script&gt;
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  var CELL=24, COLS=10, ROWS=20;
  var field=document.getElementById(&#x27;field&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;);
  var levelEl=document.getElementById(&#x27;level&#x27;);
  var comboEl=document.getElementById(&#x27;combo&#x27;);
  var goEl=document.getElementById(&#x27;gameover&#x27;);
  var finEl=document.getElementById(&#x27;finscore&#x27;);

  var FRUITS=[&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍒&#x27;,&#x27;🫐&#x27;];
  var COLORS=[&#x27;#ff5e5e&#x27;,&#x27;#ff9f43&#x27;,&#x27;#ffd45e&#x27;,&#x27;#a55eff&#x27;,&#x27;#ff5e9e&#x27;,&#x27;#ff3b6b&#x27;,&#x27;#5e8bff&#x27;];
  // 7 tetromino shapes as rotation-state offset lists
  var SHAPES={
    I:[[0,1],[1,1],[2,1],[3,1]],
    O:[[1,0],[2,0],[1,1],[2,1]],
    T:[[1,0],[0,1],[1,1],[2,1]],
    S:[[1,0],[2,0],[0,1],[1,1]],
    Z:[[0,0],[1,0],[1,1],[2,1]],
    J:[[0,0],[0,1],[1,1],[2,1]],
    L:[[2,0],[0,1],[1,1],[2,1]]
  };
  var KEYS=Object.keys(SHAPES);

  var grid=[], piece=null, score=0, level=1, running=false, dropId=null, speedId=null;
  var dropMs=550;

  function newGrid(){
    grid=[];
    for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(-1);grid.push(row);}
  }

  function makePiece(){
    var i=Math.floor(Math.random()*KEYS.length);
    var key=KEYS[i];
    return { cells: SHAPES[key].map(function(p){return [p[0],p[1]];}), color: COLORS[i], fruit: FRUITS[i], x:3, y:0, key:key };
  }

  function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0],y:p.y+c[1]};}); }

  function collides(p){
    var cs=absCells(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x,y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]&gt;=0) return true;
    }
    return false;
  }

  function rotate(){
    if(!running||!piece||piece.key===&#x27;O&#x27;) return;
    // rotate 90deg around centroid box
    var rotated=piece.cells.map(function(c){return [c[1], -c[0]];});
    // normalize to non-negative
    var minx=Math.min.apply(null,rotated.map(function(c){return c[0];}));
    var miny=Math.min.apply(null,rotated.map(function(c){return c[1];}));
    rotated=rotated.map(function(c){return [c[0]-minx,c[1]-miny];});
    var test={cells:rotated,x:piece.x,y:piece.y,color:piece.color,fruit:piece.fruit,key:piece.key};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.x=piece.x+kicks[k];
      if(!collides(test)){ piece.cells=rotated; piece.x=test.x; paint(); return; }
    }
  }

  function ghostY(){
    var gy=piece.y;
    var test={cells:piece.cells,x:piece.x,y:gy,color:piece.color,fruit:piece.fruit,key:piece.key};
    while(!collides({cells:piece.cells,x:piece.x,y:test.y+1,color:&#x27;&#x27;,fruit:&#x27;&#x27;,key:&#x27;&#x27;})) test.y++;
    return test.y;
  }

  function lock(){
    var cs=absCells(piece);
    for(var i=0;i&lt;cs.length;i++){ if(cs[i].y&gt;=0&amp;&amp;cs[i].y&lt;ROWS) grid[cs[i].y][cs[i].x]=piece.colorIdx; }
  }

  function clearRows(){
    var cleared=0;
    for(var r=ROWS-1;r&gt;=0;r--){
      var full=true;
      for(var c=0;c&lt;COLS;c++) if(grid[r][c]&lt;0){full=false;break;}
      if(full){ grid.splice(r,1); var e=[];for(var c2=0;c2&lt;COLS;c2++)e.push(-1); grid.unshift(e); cleared++; r++; }
    }
    if(cleared&gt;0){
      var mult=cleared&gt;=4?8:cleared===3?4:cleared===2?2:1;
      score+=10*cleared*mult;
      scoreEl.textContent=score;
      if(cleared&gt;=2){ showCombo(cleared,mult); }
    }
  }

  function showCombo(rows,mult){
    comboEl.textContent=&#x27;+&#x27;+mult+&#x27;× COMBO!&#x27;;
    comboEl.classList.remove(&#x27;pop&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;pop&#x27;);
    field.classList.remove(&#x27;shake&#x27;); void field.offsetWidth; field.classList.add(&#x27;shake&#x27;);
    beep(rows);
  }

  var audioCtx=null;
  function beep(n){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      for(var i=0;i&lt;n;i++){
        var o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.frequency.value=440+i*160; o.type=&#x27;triangle&#x27;;
        g.gain.value=0.08; o.connect(g); g.connect(audioCtx.destination);
        var t=audioCtx.currentTime+i*0.07;
        o.start(t); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.stop(t+0.16);
      }
    }catch(_){}
  }

  function spawn(){
    piece=makePiece();
    piece.colorIdx=KEYS.indexOf(piece.key);
    if(collides(piece)){ endGame(); return false; }
    return true;
  }

  function step(){
    if(!piece) return;
    var next={cells:piece.cells,x:piece.x,y:piece.y+1,color:piece.color,fruit:piece.fruit,key:piece.key};
    if(collides(next)){ lock(); clearRows(); if(!spawn()){paint();return;} }
    else { piece.y++; }
    paint();
  }

  function slam(){
    if(!running||!piece) return;
    piece.y=ghostY();
    step();
  }

  function move(dx){
    if(!running||!piece) return;
    if(!collides({cells:piece.cells,x:piece.x+dx,y:piece.y,color:&#x27;&#x27;,fruit:&#x27;&#x27;,key:&#x27;&#x27;})){ piece.x+=dx; paint(); }
  }

  function drawCell(x,y,color,fruit,ghost){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(ghost?&#x27; ghost&#x27;:&#x27;&#x27;);
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    if(!ghost){ el.style.background=color; el.textContent=fruit; }
    field.appendChild(el);
  }

  function paint(){
    field.innerHTML=&#x27;&#x27;;
    // grid lines
    for(var c=1;c&lt;COLS;c++){ var v=document.createElement(&#x27;div&#x27;); v.className=&#x27;gline&#x27;; v.style.left=(c*CELL)+&#x27;px&#x27;; v.style.top=&#x27;0&#x27;; v.style.width=&#x27;1px&#x27;; v.style.height=(ROWS*CELL)+&#x27;px&#x27;; field.appendChild(v); }
    for(var r=1;r&lt;ROWS;r++){ var h=document.createElement(&#x27;div&#x27;); h.className=&#x27;gline&#x27;; h.style.top=(r*CELL)+&#x27;px&#x27;; h.style.left=&#x27;0&#x27;; h.style.height=&#x27;1px&#x27;; h.style.width=(COLS*CELL)+&#x27;px&#x27;; field.appendChild(h); }
    // locked
    for(var y=0;y&lt;ROWS;y++) for(var x=0;x&lt;COLS;x++) if(grid[y][x]&gt;=0) drawCell(x,y,COLORS[grid[y][x]],FRUITS[grid[y][x]],false);
    // ghost
    if(piece){
      var gy=ghostY();
      var gc=absCells({cells:piece.cells,x:piece.x,y:gy});
      for(var i=0;i&lt;gc.length;i++) if(gc[i].y&gt;=0) drawCell(gc[i].x,gc[i].y,&#x27;&#x27;,&#x27;&#x27;,true);
      var cs=absCells(piece);
      for(var j=0;j&lt;cs.length;j++) if(cs[j].y&gt;=0) drawCell(cs[j].x,cs[j].y,piece.color,piece.fruit,false);
    }
  }

  function updateLevel(){
    level++;
    levelEl.textContent=level;
    dropMs=Math.max(120,dropMs-60);
    if(dropId){ clearInterval(dropId); dropId=setInterval(step,dropMs); }
  }

  function endGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(speedId){clearInterval(speedId);speedId=null;}
    finEl.textContent=&#x27;Final Score: &#x27;+score;
    goEl.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    goEl.classList.remove(&#x27;show&#x27;);
    score=0; level=1; dropMs=550;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    newGrid();
    if(!spawn()) return;
    paint();
    running=true;
    if(dropId)clearInterval(dropId);
    dropId=setInterval(step,dropMs);
    if(speedId)clearInterval(speedId);
    speedId=setInterval(updateLevel,30000);
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(speedId){clearInterval(speedId);speedId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){slam();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){rotate();e.preventDefault();}
  });
  document.getElementById(&#x27;bl&#x27;).onclick=function(){move(-1);};
  document.getElementById(&#x27;brr&#x27;).onclick=function(){move(1);};
  document.getElementById(&#x27;br&#x27;).onclick=function(){rotate();};
  document.getElementById(&#x27;bd&#x27;).onclick=function(){slam();};

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  // initial static paint
  newGrid();
  piece=makePiece(); piece.colorIdx=KEYS.indexOf(piece.key);
  paint();

        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

    } catch (_) {}

    try {

      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor

  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {

  }

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
