  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #04263f; color: #eaf6ff; overflow: hidden; }

  .timer { background: #062f4d; border: 2px solid #2b9bd4; border-radius: 10px; padding: 5px 14px; font-size: 20px; font-weight: 700; }

  .board { position: relative; width: 660px; height: 470px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg,#0a5a8a 0%, #073f66 45%, #052c48 100%);

  /* moving current bands */

    repeating-linear-gradient(115deg, transparent 0 60px, rgba(255,255,255,0.035) 60px 120px);
    animation: drift 12s linear infinite; pointer-events: none; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(240px); } }

  /* sea floor */

    background: linear-gradient(#b98a4e,#8a6534); pointer-events: none; }
  /* decorative reefs &amp; seaweed via unicode */

  @keyframes popin { 0%{transform:scale(0);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐙 Captain Ink&#x27;s Puffer Frenzy&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Pop the puffer fish before they dive back down — yellow = 1, red = 3, purple = 5. Press Start below; you have 60 seconds and it gets faster as your score climbs!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;

    &lt;div class=&quot;decor&quot; style=&quot;right:160px; font-size:52px;&quot;&gt;🌿&lt;/div&gt;
    &lt;div class=&quot;decor&quot; style=&quot;right:30px;&quot;&gt;🪸&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;🌊 Ready to dive!&lt;small&gt;Press Start below to begin.&lt;/small&gt;&lt;/div&gt;

&lt;script&gt;
  var BOARD_W = 660, BOARD_H = 470, FISH = 76;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var current = document.getElementById(&#x27;current&#x27;);

  var running = false, score = 0, timeLeft = 60;
  var spawnTimer = null, countdownTimer = null;
  var fishTimeouts = [];

  var TYPES = [
    { name:&#x27;yellow&#x27;, pts:1, color:&#x27;#ffd83b&#x27;, dark:&#x27;#d9a400&#x27;, life:1300, weight:60 },
    { name:&#x27;red&#x27;,    pts:3, color:&#x27;#ff5b52&#x27;, dark:&#x27;#c02c25&#x27;, life:950,  weight:28 },
    { name:&#x27;purple&#x27;, pts:5, color:&#x27;#b76bff&#x27;, dark:&#x27;#7a34c0&#x27;, life:650,  weight:12, small:true }
  ];

  // Web Audio sonar ping
  var actx = null;
  function ping(freq) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = &#x27;sine&#x27;; o.frequency.setValueAtTime(freq, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq*0.5, actx.currentTime+0.25);
      g.gain.setValueAtTime(0.25, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.3);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+0.3);
    } catch(_) {}
  }

  function pickType() {
    var total = 0, i;
    for (i=0;i&lt;TYPES.length;i++) total += TYPES[i].weight;
    var r = Math.random()*total;
    for (i=0;i&lt;TYPES.length;i++){ r -= TYPES[i].weight; if (r&lt;=0) return TYPES[i]; }
    return TYPES[0];
  }

  function makeFish(t) {
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;fish&#x27;;
    var sz = t.small ? 56 : 76;
    f.style.width = sz+&#x27;px&#x27;; f.style.height = sz+&#x27;px&#x27;;
    f.style.left = (10 + Math.random()*(BOARD_W - sz - 20)) + &#x27;px&#x27;;
    f.style.top  = (10 + Math.random()*(BOARD_H - sz - 100)) + &#x27;px&#x27;;

    // spikes around body
    var spikes = &#x27;&#x27;;
    var n = 12, cx = sz/2, cy = sz/2, rad = sz/2 - 4;
    for (var a=0; a&lt;n; a++){
      var ang = (a/n)*Math.PI*2;
      var x = cx + Math.cos(ang)*rad, y = cy + Math.sin(ang)*rad;
      spikes += &#x27;&lt;div class=&quot;spike&quot; style=&quot;left:&#x27;+(x)+&#x27;px;top:&#x27;+(y)+&#x27;px;&#x27;+
        &#x27;border-left:5px solid transparent;border-right:5px solid transparent;&#x27;+
        &#x27;border-bottom:11px solid &#x27;+t.dark+&#x27;;transform:translate(-5px,-11px) rotate(&#x27;+(ang+Math.PI/2)+&#x27;rad);&quot;&gt;&lt;/div&gt;&#x27;;
    }
    var eyeScale = sz/76;
    f.innerHTML = spikes +
      &#x27;&lt;div class=&quot;body&quot; style=&quot;background:radial-gradient(circle at 35% 30%, #fff8, &#x27;+t.color+&#x27; 55%, &#x27;+t.dark+&#x27;);&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;eye l&quot; style=&quot;transform:scale(&#x27;+eyeScale+&#x27;);transform-origin:center;&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;eye r&quot; style=&quot;transform:scale(&#x27;+eyeScale+&#x27;);transform-origin:center;&quot;&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;mouth&quot;&gt;&lt;/div&gt;&#x27;;

    var caught = false;
    f.addEventListener(&#x27;click&#x27;, function(ev){
      if (caught || !running) return;
      caught = true;
      score += t.pts;
      scoreEl.textContent = score;
      ping(t.pts===1?520:t.pts===3?680:900);
      var r = board.getBoundingClientRect();
      var px = ev.clientX - r.left, py = ev.clientY - r.top;
      bubbles(px, py, t.color);
      scorePop(px, py, t.pts, t.color);
      f.className = &#x27;fish burst&#x27;;
      setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 220);
    });

    board.appendChild(f);
    // trigger pop-in
    requestAnimationFrame(function(){ f.className = &#x27;fish pop&#x27;; });
    var to = setTimeout(function(){ if (!caught &amp;&amp; f.parentNode) f.parentNode.removeChild(f); }, t.life);
    fishTimeouts.push(to);
  }

  function bubbles(x, y, color) {
    for (var i=0;i&lt;10;i++){
      var b = document.createElement(&#x27;div&#x27;);
      b.className = &#x27;particle&#x27;;
      var s = 5 + Math.random()*9;
      b.style.width = s+&#x27;px&#x27;; b.style.height = s+&#x27;px&#x27;;
      b.style.left = x+&#x27;px&#x27;; b.style.top = y+&#x27;px&#x27;;
      b.style.background = i%2 ? &#x27;rgba(220,245,255,.9)&#x27; : color;
      var ang = Math.random()*Math.PI*2, dist = 25+Math.random()*40;
      b.style.setProperty(&#x27;--dx&#x27;, Math.cos(ang)*dist+&#x27;px&#x27;);
      b.style.setProperty(&#x27;--dy&#x27;, (Math.sin(ang)*dist - 20)+&#x27;px&#x27;);
      b.style.animation = &#x27;bub .6s ease-out forwards&#x27;;
      board.appendChild(b);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 620); })(b);
    }
  }

  function scorePop(x, y, pts, color) {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;pop-score&#x27;;
    p.textContent = &#x27;+&#x27;+pts;
    p.style.color = color;
    p.style.left = (x-14)+&#x27;px&#x27;; p.style.top = (y-30)+&#x27;px&#x27;;
    board.appendChild(p);
    setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 800);
  }

  function currentSpawnDelay() {
    // faster as score rises: from ~850ms down to ~380ms
    var d = 850 - score*8;
    return Math.max(380, d);
  }

  function scheduleSpawn() {
    if (!running) return;
    makeFish(pickType());
    // background current speeds up subtly with score
    var dur = Math.max(5, 12 - score*0.06);
    current.style.animationDuration = dur.toFixed(1)+&#x27;s&#x27;;
    spawnTimer = setTimeout(scheduleSpawn, currentSpawnDelay());
  }

  function clearFish() {
    for (var i=0;i&lt;fishTimeouts.length;i++) clearTimeout(fishTimeouts[i]);
    fishTimeouts = [];
    var fs = board.querySelectorAll(&#x27;.fish, .particle, .pop-score&#x27;);
    for (var j=0;j&lt;fs.length;j++) fs[j].parentNode.removeChild(fs[j]);
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; timeLeft = 60;
    scoreEl.textContent = &#x27;0&#x27;; timeEl.textContent = &#x27;60&#x27;;
    overlay.style.display = &#x27;none&#x27;;
    current.style.animationDuration = &#x27;12s&#x27;;
    clearFish();
    scheduleSpawn();
    countdownTimer = setInterval(function(){
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft &lt;= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    clearFish();
    overlay.innerHTML = &quot;⚓ Time&#x27;s up!&lt;small&gt;You scored &quot; + score + &quot; — press Start to dive again.&lt;/small&gt;&quot;;
    overlay.style.display = &#x27;flex&#x27;;
  }

  function stopGame() {
    if (!running) { return; }
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    clearFish();
    overlay.innerHTML = &quot;🌊 Paused&lt;small&gt;Press Start below to dive.&lt;/small&gt;&quot;;
    overlay.style.display = &#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
