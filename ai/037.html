<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍎 Fruit Drop 🍇</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg,#ffe4f0,#e4f7ff); color: #333; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; background: linear-gradient(90deg,#ff6b9d,#ffa552,#ffd93d,#6bcB77); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #555; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .main { display: flex; gap: 14px; align-items: flex-start; }
  .field { position: relative; width: 240px; height: 384px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.12); transition: background 1.2s linear; }
  .cell { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
  .ghost { opacity: 0.28; }
  .side { display: flex; flex-direction: column; gap: 10px; width: 130px; }
  .panel { background: rgba(255,255,255,0.75); border-radius: 12px; padding: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
  .panel .label { font-size: 13px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .score-num { font-size: 26px; font-weight: 800; color: #ff5a8a; }
  .rank { font-size: 17px; font-weight: 800; color: #6bcB77; }
  #next { position: relative; width: 96px; height: 72px; margin: 0 auto; }
  .flash { position: absolute; left: 0; width: 100%; height: 24px; background: white; opacity: 0; pointer-events: none; }
  .particle { position: absolute; pointer-events: none; font-size: 16px; }
  .banner { position: absolute; top: 40%; left: 0; width: 100%; text-align: center; font-size: 20px; font-weight: 800; color: #ff5a8a; text-shadow: 0 2px 6px rgba(0,0,0,.2); pointer-events: none; opacity: 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;←/→&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, and drop faster with &lt;strong&gt;↓&lt;/strong&gt;. Fill a whole row to burst it for points — clear several at once for a big combo bonus!&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;
        &lt;div class=&quot;score-num&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
        &lt;div class=&quot;rank&quot; id=&quot;rank&quot;&gt;Seedling&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;
        &lt;div id=&quot;next&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;label&quot;&gt;Rows&lt;/div&gt;
        &lt;div class=&quot;score-num&quot; id=&quot;rows&quot; style=&quot;color:#ffa552&quot;&gt;0&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var rankEl = document.getElementById(&#x27;rank&#x27;);
  var rowsEl = document.getElementById(&#x27;rows&#x27;);
  var nextEl = document.getElementById(&#x27;next&#x27;);

  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;];

  // Tetromino definitions: each has a set of rotation states (list of [x,y] cells)
  var SHAPES = {
    I: [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]],
    O: [[[1,0],[2,0],[1,1],[2,1]]],
    T: [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    S: [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]],
    Z: [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]],
    L: [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]],
    J: [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]]
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;L&#x27;,&#x27;J&#x27;];

  var grid, piece, nextPiece, score, rowsCleared, running, dropId, hue;
  var DROP_MS;

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function makePiece(type) {
    return { type: type, rot: 0, x: 3, y: -1, fruit: FRUITS[Math.floor(Math.random()*FRUITS.length)] };
  }
  function randType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function pieceCells(p) {
    var states = SHAPES[p.type];
    var st = states[p.rot % states.length];
    var out = [];
    for (var i=0;i&lt;st.length;i++) out.push({x:p.x+st[i][0], y:p.y+st[i][1]});
    return out;
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    piece = nextPiece || makePiece(randType());
    piece.x = 3; piece.y = -1; piece.rot = 0;
    nextPiece = makePiece(randType());
    drawNext();
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS &amp;&amp; c.x&gt;=0 &amp;&amp; c.x&lt;COLS) grid[c.y][c.x] = piece.fruit;
    }
    piece = null;
  }

  function ghostPiece() {
    if (!piece) return null;
    var g = { type:piece.type, rot:piece.rot, x:piece.x, y:piece.y, fruit:piece.fruit };
    while (!collides({type:g.type,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function clearFullRows() {
    var fullRows = [];
    for (var r=ROWS-1;r&gt;=0;r--){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;}
      if (full) fullRows.push(r);
    }
    if (fullRows.length===0) return;

    // particle burst on cleared rows
    for (var k=0;k&lt;fullRows.length;k++) burstRow(fullRows[k]);

    // remove rows
    fullRows.sort(function(a,b){return a-b;});
    for (var i=fullRows.length-1;i&gt;=0;i--){
      grid.splice(fullRows[i],1);
      var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
      grid.unshift(empty);
    }

    var n = fullRows.length;
    var mult = [0,1,2,3,4][n];
    score += n * 100 * mult;
    rowsCleared += n;
    scoreEl.textContent = score;
    rowsEl.textContent = rowsCleared;
    updateRank();

    if (n&gt;=2) showBanner(n===2?&#x27;2× COMBO!&#x27;:n===3?&#x27;3× COMBO!&#x27;:&#x27;4× MEGA COMBO!&#x27;);

    // speed up every 5 rows
    var newSpeed = Math.max(120, 500 - Math.floor(rowsCleared/5)*45);
    if (newSpeed !== DROP_MS &amp;&amp; running) {
      DROP_MS = newSpeed;
      clearInterval(dropId);
      dropId = setInterval(stepDown, DROP_MS);
    }
  }

  var RANKS = [[0,&#x27;Seedling&#x27;],[300,&#x27;Sprout&#x27;],[800,&#x27;Fruity&#x27;],[1600,&#x27;Juicy&#x27;],[3000,&#x27;LEGENDARY&#x27;]];
  function updateRank() {
    var label=&#x27;Seedling&#x27;;
    for (var i=0;i&lt;RANKS.length;i++) if (score&gt;=RANKS[i][0]) label=RANKS[i][1];
    rankEl.textContent = label;
  }

  function showBanner(txt) {
    banner.textContent = txt;
    banner.style.transition=&#x27;none&#x27;;
    banner.style.opacity=&#x27;1&#x27;;
    banner.style.transform=&#x27;scale(1.3)&#x27;;
    setTimeout(function(){
      banner.style.transition=&#x27;opacity .8s, transform .8s&#x27;;
      banner.style.opacity=&#x27;0&#x27;;
      banner.style.transform=&#x27;scale(1)&#x27;;
    },30);
  }

  function burstRow(r) {
    var flash = document.createElement(&#x27;div&#x27;);
    flash.className=&#x27;flash&#x27;;
    flash.style.top = (r*CELL)+&#x27;px&#x27;;
    flash.style.opacity=&#x27;0.9&#x27;;
    field.appendChild(flash);
    setTimeout(function(){ flash.style.transition=&#x27;opacity .35s&#x27;; flash.style.opacity=&#x27;0&#x27;; },20);
    setTimeout(function(){ if(flash.parentNode) flash.parentNode.removeChild(flash); },400);

    for (var i=0;i&lt;8;i++){
      var p=document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;;
      p.textContent = [&#x27;⭐&#x27;,&#x27;✨&#x27;,&#x27;💫&#x27;][Math.floor(Math.random()*3)];
      var sx = (Math.random()*COLS*CELL);
      var sy = r*CELL + CELL/2;
      p.style.left=sx+&#x27;px&#x27;; p.style.top=sy+&#x27;px&#x27;;
      field.appendChild(p);
      (function(el,vx,vy){
        var t=0;
        var iv=setInterval(function(){
          t++;
          el.style.left=(parseFloat(el.style.left)+vx)+&#x27;px&#x27;;
          el.style.top=(parseFloat(el.style.top)+vy+t*0.6)+&#x27;px&#x27;;
          el.style.opacity=String(1-t/18);
          if(t&gt;18){ clearInterval(iv); if(el.parentNode) el.parentNode.removeChild(el); }
        },25);
      })(p,(Math.random()-0.5)*8,-2-Math.random()*3);
    }
  }

  function drawCell(cx,cy,fruit,cls) {
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(cls?(&#x27; &#x27;+cls):&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;;
    el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;;
    el.style.height=CELL+&#x27;px&#x27;;
    el.textContent=fruit;
    field.appendChild(el);
  }

  function paint() {
    // remove only cells (keep banner/particles/flash)
    var cells = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i=0;i&lt;cells.length;i++) cells[i].remove();

    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawCell(c,r,grid[r][c]);

    if (piece) {
      var g = ghostPiece();
      if (g) { var gc=pieceCells(g); for(var i2=0;i2&lt;gc.length;i2++) if(gc[i2].y&gt;=0) drawCell(gc[i2].x,gc[i2].y,piece.fruit,&#x27;ghost&#x27;); }
      var pc=pieceCells(piece);
      for(var j=0;j&lt;pc.length;j++) if(pc[j].y&gt;=0) drawCell(pc[j].x,pc[j].y,piece.fruit);
    }
  }

  function drawNext() {
    nextEl.innerHTML=&#x27;&#x27;;
    if (!nextPiece) return;
    var st = SHAPES[nextPiece.type][0];
    var minX=9,minY=9;
    for (var i=0;i&lt;st.length;i++){ minX=Math.min(minX,st[i][0]); minY=Math.min(minY,st[i][1]); }
    for (var j=0;j&lt;st.length;j++){
      var el=document.createElement(&#x27;div&#x27;);
      el.className=&#x27;cell&#x27;;
      el.style.position=&#x27;absolute&#x27;;
      el.style.left=((st[j][0]-minX)*22+2)+&#x27;px&#x27;;
      el.style.top=((st[j][1]-minY)*22+2)+&#x27;px&#x27;;
      el.style.width=&#x27;22px&#x27;; el.style.height=&#x27;22px&#x27;;
      el.textContent=nextPiece.fruit;
      nextEl.appendChild(el);
    }
  }

  function stepDown() {
    if (!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1,fruit:piece.fruit};
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); paint(); showBanner(&#x27;GAME OVER&#x27;); return; }
    } else piece=next;
    paint();
  }

  function move(dx) {
    if (!running||!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y,fruit:piece.fruit};
    if (!collides(next)){ piece=next; paint(); }
  }

  function rotate() {
    if (!running||!piece) return;
    var states=SHAPES[piece.type];
    var nr=(piece.rot+1)%states.length;
    var kicks=[0,-1,1,-2,2];
    for (var k=0;k&lt;kicks.length;k++){
      var cand={type:piece.type,rot:nr,x:piece.x+kicks[k],y:piece.y,fruit:piece.fruit};
      if (!collides(cand)){ piece=cand; paint(); return; }
    }
  }

  function shiftHue() {
    if (!field) return;
    hue=(hue+8)%360;
    var h1=hue, h2=(hue+40)%360;
    field.style.background=&#x27;linear-gradient(135deg, hsl(&#x27;+h1+&#x27;,80%,90%), hsl(&#x27;+h2+&#x27;,80%,86%))&#x27;;
  }

  var hueId=null;

  function startGame() {
    if (running) return;
    score=0; rowsCleared=0; DROP_MS=500; hue=200;
    scoreEl.textContent=&#x27;0&#x27;; rowsEl.textContent=&#x27;0&#x27;; rankEl.textContent=&#x27;Seedling&#x27;;
    banner.style.opacity=&#x27;0&#x27;;
    newGrid();
    nextPiece=makePiece(randType());
    if (!spawnPiece()) return;
    paint();
    running=true;
    shiftHue();
    if (dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, DROP_MS);
    if (hueId) clearInterval(hueId);
    hueId=setInterval(shiftHue, 900);
  }
  function stopGame() {
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
    if (hueId){ clearInterval(hueId); hueId=null; }
  }
  function endGame() {
    running=false;
    if (dropId){ clearInterval(dropId); dropId=null; }
    if (hueId){ clearInterval(hueId); hueId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial idle view
  newGrid();
  field.style.background=&#x27;linear-gradient(135deg, hsl(200,80%,90%), hsl(240,80%,86%))&#x27;;
  nextPiece=makePiece(&#x27;T&#x27;);
  piece=makePiece(&#x27;T&#x27;); piece.y=0;
  drawNext();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

<script>
