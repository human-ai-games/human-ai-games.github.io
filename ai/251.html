&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys (or swipe) to eat pickups: yellow star +1, magenta gem +3 &amp;amp; speed boost, orange orb is a trap (−2, brief freeze). Chain 3 good pickups to raise your multiplier; use Start/Restart below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;mult&quot; id=&quot;mult&quot;&gt;x1&lt;/div&gt;
    &lt;div class=&quot;boost&quot; id=&quot;boost&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span style=&quot;color:#ffd94a&quot;&gt;★ Star +1&lt;/span&gt;
    &lt;span style=&quot;color:#f6f&quot;&gt;◆ Gem +3&lt;/span&gt;
    &lt;span style=&quot;color:#fa5&quot;&gt;● Trap −2&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;);
var ctx = cv.getContext(&#x27;2d&#x27;);
var CELL = 20;
var COLS = 30, ROWS = 23;
var W = COLS*CELL, H = ROWS*CELL;

var scoreEl = document.getElementById(&#x27;score&#x27;);
var multEl = document.getElementById(&#x27;mult&#x27;);
var boostEl = document.getElementById(&#x27;boost&#x27;);

var running=false, gameOver=false, rafId=null;
var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
var score=0, mult=1, chain=0;
var pickups=[]; // {type,x,y}
var particles=[];
var boostUntil=0, freezeUntil=0;
var lastMove=0, moveInterval=140;
var t=0; // frame time (ms accumulated by rAF)
var prevTs=0;

// game over animation
var overFlash=0, overStart=0;

function initSnake(){
  snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
  dir={x:1,y:0}; pendingDir={x:1,y:0};
}

function occupied(x,y){
  for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  for(var j=0;j&lt;pickups.length;j++) if(pickups[j].x===x&amp;&amp;pickups[j].y===y) return true;
  return false;
}

function randCell(){
  for(var k=0;k&lt;300;k++){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if(!occupied(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}

function spawnPickup(type){
  var c=randCell();
  pickups.push({type:type,x:c.x,y:c.y});
}

function ensurePickups(){
  var have={star:false,gem:false,trap:false};
  for(var i=0;i&lt;pickups.length;i++) have[pickups[i].type]=true;
  if(!have.star) spawnPickup(&#x27;star&#x27;);
  if(!have.gem) spawnPickup(&#x27;gem&#x27;);
  if(!have.trap) spawnPickup(&#x27;trap&#x27;);
}

function burst(cx,cy,color){
  for(var i=0;i&lt;16;i++){
    var a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

function pickupColor(type){
  if(type===&#x27;star&#x27;) return &#x27;#ffd94a&#x27;;
  if(type===&#x27;gem&#x27;) return &#x27;#ff4df0&#x27;;
  return &#x27;#ff8a2a&#x27;;
}

function eatAt(x,y){
  for(var i=0;i&lt;pickups.length;i++){
    if(pickups[i].x===x&amp;&amp;pickups[i].y===y){
      var p=pickups[i]; var col=pickupColor(p.type);
      burst(x*CELL+CELL/2, y*CELL+CELL/2, col);
      pickups.splice(i,1);
      if(p.type===&#x27;star&#x27;){
        score+=1*mult; chain++;
        if(chain&gt;=3){ chain=0; mult++; }
      } else if(p.type===&#x27;gem&#x27;){
        score+=3*mult; chain++;
        if(chain&gt;=3){ chain=0; mult++; }
        boostUntil = t + 4000;
      } else { // trap
        score-=2; if(score&lt;0) score=0;
        chain=0; mult=1;
        freezeUntil = t + 500;
      }
      scoreEl.textContent=score;
      multEl.textContent=&#x27;x&#x27;+mult;
      return p.type;
    }
  }
  return null;
}

function endGame(){
  gameOver=true;
  chain=0; mult=1; multEl.textContent=&#x27;x1&#x27;;
  overStart=t; overFlash=0;
}

function move(){
  if(t &lt; freezeUntil) return; // frozen
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0];
  var nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }
  var willEat = eatWouldHappen(nx,ny);
  var body = willEat ? snake : snake.slice(0,snake.length-1);
  for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }
  snake.unshift({x:nx,y:ny});
  var ate = eatAt(nx,ny);
  if(ate===&#x27;trap&#x27; || ate===&#x27;star&#x27; || ate===null){
    // star grows (keep), null pops, trap shrinks a bit
    if(ate===null) snake.pop();
    else if(ate===&#x27;trap&#x27;){ snake.pop(); if(snake.length&gt;2) snake.pop(); }
    // star: keep length (grow)
  } else if(ate===&#x27;gem&#x27;){
    // gem grows too
  }
  ensurePickups();
}

// predict eat for tail logic (star/gem grow)
function eatWouldHappen(x,y){
  for(var i=0;i&lt;pickups.length;i++){
    if(pickups[i].x===x&amp;&amp;pickups[i].y===y){
      return pickups[i].type===&#x27;star&#x27;||pickups[i].type===&#x27;gem&#x27;;
    }
  }
  return false;
}

function drawGrid(){
  ctx.clearRect(0,0,W,H);
  // subtle glow bg
  ctx.fillStyle=&#x27;#070a12&#x27;; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=&#x27;rgba(0,255,220,0.06)&#x27;; ctx.lineWidth=1;
  for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL+0.5,0); ctx.lineTo(x*CELL+0.5,H); ctx.stroke(); }
  for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL+0.5); ctx.lineTo(W,y*CELL+0.5); ctx.stroke(); }
}

function drawScanlines(){
  ctx.fillStyle=&#x27;rgba(0,0,0,0.12)&#x27;;
  for(var y=0;y&lt;H;y+=3) ctx.fillRect(0,y,W,1);
}

function drawPickups(){
  for(var i=0;i&lt;pickups.length;i++){
    var p=pickups[i]; var cx=p.x*CELL+CELL/2, cy=p.y*CELL+CELL/2;
    var pulse = 0.5+0.5*Math.sin(t/150 + p.x + p.y);
    ctx.save();
    if(p.type===&#x27;star&#x27;){
      ctx.fillStyle=&#x27;#ffd94a&#x27;; ctx.shadowColor=&#x27;#ffb000&#x27;; ctx.shadowBlur=12+8*pulse;
      drawStar(cx,cy,5,CELL*0.42,CELL*0.2);
    } else if(p.type===&#x27;gem&#x27;){
      ctx.fillStyle=&#x27;#ff4df0&#x27;; ctx.shadowColor=&#x27;#ff00e6&#x27;; ctx.shadowBlur=14+10*pulse;
      ctx.beginPath();
      var r=CELL*0.42;
      ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle=&#x27;#ff8a2a&#x27;; ctx.shadowColor=&#x27;#ff6a00&#x27;; ctx.shadowBlur=12+10*pulse;
      ctx.beginPath(); ctx.arc(cx,cy,CELL*0.36+2*pulse,0,Math.PI*2); ctx.fill();
      // skull mark
      ctx.shadowBlur=0; ctx.fillStyle=&#x27;#301000&#x27;;
      ctx.beginPath(); ctx.arc(cx-3,cy-1,1.6,0,Math.PI*2); ctx.arc(cx+3,cy-1,1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawStar(cx,cy,spikes,outer,inner){
  var rot=Math.PI/2*3, step=Math.PI/spikes;
  ctx.beginPath(); ctx.moveTo(cx,cy-outer);
  for(var i=0;i&lt;spikes;i++){
    ctx.lineTo(cx+Math.cos(rot)*outer, cy+Math.sin(rot)*outer); rot+=step;
    ctx.lineTo(cx+Math.cos(rot)*inner, cy+Math.sin(rot)*inner); rot+=step;
  }
  ctx.lineTo(cx,cy-outer); ctx.closePath(); ctx.fill();
}

function lerp(a,b,f){return a+(b-a)*f;}

function drawSnake(flashRed){
  var boosted = t&lt;boostUntil;
  var n=snake.length;
  for(var i=n-1;i&gt;=0;i--){
    var f = n&gt;1 ? i/(n-1) : 0;
    var r,g,b;
    if(flashRed){ r=255; g=40; b=40; }
    else {
      // head cyan(60,255,255) -&gt; green(30,255,80) -&gt; teal(10,120,110)
      if(f&lt;0.5){ var t2=f/0.5; r=lerp(60,30,t2); g=lerp(255,255,t2); b=lerp(255,80,t2); }
      else { var t3=(f-0.5)/0.5; r=lerp(30,10,t3); g=lerp(255,120,t3); b=lerp(80,110,t3); }
      if(boosted){ r=lerp(r,255,0.4); b=lerp(b,255,0.4); }
    }
    var seg=snake[i];
    ctx.save();
    ctx.fillStyle=&#x27;rgb(&#x27;+(r|0)+&#x27;,&#x27;+(g|0)+&#x27;,&#x27;+(b|0)+&#x27;)&#x27;;
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur = i===0?18:10;
    roundRect(seg.x*CELL+1.5, seg.y*CELL+1.5, CELL-3, CELL-3, 6);
    ctx.fill();
    ctx.restore();
  }
  // eyes on head
  if(!flashRed &amp;&amp; n&gt;0){
    var h=snake[0];
    ctx.fillStyle=&#x27;#012&#x27;;
    var ex=h.x*CELL+CELL/2, ey=h.y*CELL+CELL/2;
    ctx.beginPath();
    ctx.arc(ex+dir.x*3-dir.y*3, ey+dir.y*3-dir.x*3,1.7,0,7);
    ctx.arc(ex+dir.x*3+dir.y*3, ey+dir.y*3+dir.x*3,1.7,0,7);
    ctx.fill();
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawParticles(dt){
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92;
    p.life-=dt/600;
    if(p.life&lt;=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function updateHUD(){
  var rem = boostUntil - t;
  if(rem&gt;0) boostEl.textContent=&#x27;⚡ &#x27;+(rem/1000).toFixed(1)+&#x27;s&#x27;;
  else boostEl.textContent=&#x27;&#x27;;
}

function loop(ts){
  if(!running){ return; }
  if(!prevTs) prevTs=ts;
  var dt = ts-prevTs; prevTs=ts;
  t += dt;

  if(!gameOver){
    var interval = (t&lt;boostUntil)? moveInterval*0.55 : moveInterval;
    if(t - lastMove &gt;= interval){ lastMove=t; move(); }
  }

  drawGrid();
  drawPickups();
  var flashRed=false;
  if(gameOver){
    // flash red 3 times over ~1.5s
    var el = t-overStart;
    flashRed = (Math.floor(el/250)%2===0) &amp;&amp; el&lt;1500;
  }
  drawSnake(flashRed);
  drawParticles(dt);
  drawScanlines();

  if(gameOver &amp;&amp; (t-overStart)&gt;=1500){
    ctx.save();
    ctx.fillStyle=&#x27;rgba(0,0,0,0.55)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle=&#x27;#6ff&#x27;; ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=20;
    ctx.font=&#x27;bold 34px system-ui&#x27;; ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-14);
    ctx.fillStyle=&#x27;#ffd94a&#x27;; ctx.shadowColor=&#x27;#fa0&#x27;;
    ctx.font=&#x27;bold 40px system-ui&#x27;; ctx.fillText(&#x27;Score: &#x27;+score, W/2, H/2+30);
    ctx.restore();
  }

  updateHUD();
  rafId=requestAnimationFrame(loop);
}

function startGame(){
  score=0; mult=1; chain=0;
  scoreEl.textContent=&#x27;0&#x27;; multEl.textContent=&#x27;x1&#x27;; boostEl.textContent=&#x27;&#x27;;
  gameOver=false; boostUntil=0; freezeUntil=0;
  pickups=[]; particles=[];
  t=0; prevTs=0; lastMove=0;
  initSnake();
  ensurePickups();
  running=true;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}

function stopGame(){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  prevTs=0;
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
});

// swipe controls
var tsx=0,tsy=0;
cv.addEventListener(&#x27;touchstart&#x27;,function(e){ var t0=e.touches[0]; tsx=t0.clientX; tsy=t0.clientY; },{passive:true});
cv.addEventListener(&#x27;touchend&#x27;,function(e){
  var t1=e.changedTouches[0]; var dx=t1.clientX-tsx, dy=t1.clientY-tsy;
  if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
  if(Math.abs(dx)&gt;Math.abs(dy)) pendingDir={x:dx&gt;0?1:-1,y:0};
  else pendingDir={x:0,y:dy&gt;0?1:-1};
},{passive:true});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
initSnake(); ensurePickups();
drawGrid(); drawPickups(); drawSnake(false); drawScanlines();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;

<script>
