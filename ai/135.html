<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff2d95,#ffd400,#00e5ff,#ff2d95);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,229,255,.4); }
  .instructions { font-size: 16px; color: #9fb0c8; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display:flex; gap:26px; align-items:center; }
  .score { font-size: 30px; font-weight: 800; color:#fff; text-shadow:0 0 12px #00e5ff; }
  .score span { color:#ffd400; text-shadow:0 0 14px #ffd400; }
  .combo { font-size: 20px; font-weight:800; color:#ff2d95; text-shadow:0 0 12px #ff2d95; min-width:60px; text-align:center; }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0;
    background: radial-gradient(circle at 50% 45%, #0d1230 0%, #05060f 80%);
    border-radius: 10px; overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(0,229,255,.55), inset 0 0 24px rgba(0,229,255,.35), 0 0 30px rgba(0,229,255,.2); }
  .field::before { content:&quot;&quot;; position:absolute; inset:0;
    background-image: linear-gradient(rgba(0,229,255,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,229,255,.06) 1px, transparent 1px);
    background-size: 20px 20px; }
  .cell { position: absolute; box-sizing: border-box; will-change: transform; }
  .seg { border-radius: 5px; }
  .ghost { border-radius:5px; }
  .food { display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; }
  .star { animation: blink 0.7s infinite; text-shadow:0 0 8px #ffd400; }
  .bolt { text-shadow:0 0 10px #00e5ff; }
  .gem  { animation: spin 2.4s linear infinite; text-shadow:0 0 10px #ff2d95; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  @keyframes spin { from{transform:rotateY(0);} to{transform:rotateY(360deg);} }
  .flash { position:absolute; inset:0; pointer-events:none; opacity:0; }
  .flash.go { animation: flashAnim .35s ease-out; }
  @keyframes flashAnim { 0%{opacity:.55;} 100%{opacity:0;} }
  .burst { position:absolute; width:20px; height:20px; border-radius:50%;
    pointer-events:none; opacity:0; }
  .burst.go { animation: burstAnim .45s ease-out; }
  @keyframes burstAnim { 0%{opacity:.9; transform:scale(.3);} 100%{opacity:0; transform:scale(2.6);} }
  .float { position:absolute; font-weight:800; font-size:24px; pointer-events:none;
    text-shadow:0 0 12px currentColor; animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-40px);} }
  .particle { position:absolute; border-radius:2px; pointer-events:none; }
  .dim { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .8s; }
  .dim.on { opacity:.55; }
  .msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:26px; font-weight:800; color:#fff; text-shadow:0 0 16px #ff2d95; text-align:center; opacity:0; transition:opacity .4s; }
  .msg.on { opacity:1; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with Arrow keys or WASD to eat stars (1), bolts (3), and gems (5). Eat quickly for combo multipliers — but each bite speeds you up, so stay sharp!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;burst&quot; id=&quot;burst&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;dim&quot; id=&quot;dim&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 30, ROWS = 22;
  var BASE_TICK = 150, MIN_TICK = 65;
  var running = false, tickId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var ghosts = [];
  var score = 0, tickMs = BASE_TICK;
  var items = [];   // {x,y,type,points,color,glyph,life,el}
  var combo = 0, lastEatTime = 0;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var burstEl = document.getElementById(&#x27;burst&#x27;);
  var dimEl = document.getElementById(&#x27;dim&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var COLORS = {
    star:&#x27;#ffd400&#x27;, bolt:&#x27;#00e5ff&#x27;, gem:&#x27;#ff2d95&#x27;
  };

  // dynamic cell layers (segments/ghosts/food) live in this container
  var layer = document.createElement(&#x27;div&#x27;);
  layer.style.position=&#x27;absolute&#x27;; layer.style.inset=&#x27;0&#x27;; layer.style.pointerEvents=&#x27;none&#x27;;
  field.insertBefore(layer, flashEl);

  function rainbow(t){ // t 0..1 -&gt; hsl
    var h = 300 - t*300; // pink-&gt;yellow-&gt;cyan-ish spectrum
    return &#x27;hsl(&#x27;+h+&#x27;,100%,60%)&#x27;;
  }

  function drawSnakeAndGhosts() {
    layer.innerHTML = &#x27;&#x27;;
    // ghosts (faded trail)
    for (var g=0; g&lt;ghosts.length; g++){
      var gc = ghosts[g];
      var op = 0.28 * (1 - g/ghosts.length);
      var el = document.createElement(&#x27;div&#x27;);
      el.className=&#x27;cell ghost&#x27;;
      el.style.left=(gc.x*CELL)+&#x27;px&#x27;; el.style.top=(gc.y*CELL)+&#x27;px&#x27;;
      el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
      el.style.background=&#x27;rgba(0,229,255,&#x27;+op+&#x27;)&#x27;;
      layer.appendChild(el);
    }
    // snake segments with rainbow gradient
    for (var i=0;i&lt;snake.length;i++){
      var s=snake[i];
      var t = snake.length&gt;1 ? i/(snake.length-1) : 0;
      var col = rainbow(t);
      var el2 = document.createElement(&#x27;div&#x27;);
      el2.className=&#x27;cell seg&#x27;;
      el2.style.left=(s.x*CELL)+&#x27;px&#x27;; el2.style.top=(s.y*CELL)+&#x27;px&#x27;;
      el2.style.width=CELL+&#x27;px&#x27;; el2.style.height=CELL+&#x27;px&#x27;;
      el2.style.background=col;
      el2.style.boxShadow=&#x27;0 0 &#x27;+(i===0?14:8)+&#x27;px &#x27;+col;
      layer.appendChild(el2);
    }
    // food glyphs
    for (var f=0; f&lt;items.length; f++){
      var it=items[f];
      var fe=document.createElement(&#x27;div&#x27;);
      fe.className=&#x27;cell food &#x27;+it.type;
      fe.style.left=(it.x*CELL)+&#x27;px&#x27;; fe.style.top=(it.y*CELL)+&#x27;px&#x27;;
      fe.style.width=CELL+&#x27;px&#x27;; fe.style.height=CELL+&#x27;px&#x27;;
      fe.textContent=it.glyph;
      layer.appendChild(fe);
      it.el=fe;
    }
  }

  function occupied(x,y){
    for (var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    for (var j=0;j&lt;items.length;j++) if(items[j].x===x&amp;&amp;items[j].y===y) return true;
    return false;
  }

  function freeCell(){
    for (var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function spawnItem(type){
    var c=freeCell();
    var it={x:c.x,y:c.y,type:type,color:COLORS[type]};
    if(type===&#x27;star&#x27;){ it.points=1; it.glyph=&#x27;⭐&#x27;; it.life=Infinity; }
    else if(type===&#x27;bolt&#x27;){ it.points=3; it.glyph=&#x27;⚡&#x27;; it.life=BASE_TICK*20; }
    else { it.points=5; it.glyph=&#x27;💎&#x27;; it.life=BASE_TICK*40; }
    items.push(it);
  }

  function ensureItems(){
    var hasStar=false;
    for (var i=0;i&lt;items.length;i++) if(items[i].type===&#x27;star&#x27;) hasStar=true;
    if(!hasStar) spawnItem(&#x27;star&#x27;);
    // chance to spawn bolt / gem
    if(Math.random()&lt;0.02 &amp;&amp; items.filter(function(o){return o.type===&#x27;bolt&#x27;;}).length&lt;1) spawnItem(&#x27;bolt&#x27;);
    if(Math.random()&lt;0.006 &amp;&amp; items.filter(function(o){return o.type===&#x27;gem&#x27;;}).length&lt;1) spawnItem(&#x27;gem&#x27;);
  }

  function screenFlash(color){
    flashEl.style.background = color;
    flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;);
  }
  function headBurst(color,hx,hy){
    burstEl.style.background=&#x27;radial-gradient(circle,&#x27;+color+&#x27;,transparent 70%)&#x27;;
    burstEl.style.left=(hx*CELL-10)+&#x27;px&#x27;; burstEl.style.top=(hy*CELL-10)+&#x27;px&#x27;;
    burstEl.style.width=&#x27;40px&#x27;; burstEl.style.height=&#x27;40px&#x27;;
    burstEl.classList.remove(&#x27;go&#x27;); void burstEl.offsetWidth; burstEl.classList.add(&#x27;go&#x27;);
  }
  function floatText(txt,color,hx,hy){
    var f=document.createElement(&#x27;div&#x27;);
    f.className=&#x27;float&#x27;; f.textContent=txt; f.style.color=color;
    f.style.left=(hx*CELL)+&#x27;px&#x27;; f.style.top=(hy*CELL-10)+&#x27;px&#x27;;
    field.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1000);
  }

  var AC=null;
  function beep(freq,dur,type){
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.12,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
      o.start(); o.stop(AC.currentTime+dur);
    }catch(e){}
  }

  function eat(it,idx){
    // combo logic
    var now=Date.now();
    if(now-lastEatTime&lt;=2000) combo++; else combo=1;
    lastEatTime=now;
    var mult = combo&gt;=3?3 : combo&gt;=2?2 : 1;
    var gained = it.points*mult;
    score += gained;
    scoreEl.textContent=score;
    if(mult&gt;1){ comboEl.textContent=&#x27;x&#x27;+mult; floatText(&#x27;x&#x27;+mult,&#x27;#ff2d95&#x27;,snake[0].x,snake[0].y); }
    else comboEl.textContent=&#x27;&#x27;;
    screenFlash(it.color);
    headBurst(it.color,snake[0].x,snake[0].y);
    floatText(&#x27;+&#x27;+gained,it.color,snake[0].x,snake[0].y-1&lt;0?0:snake[0].x, snake[0].y);
    beep(it.type===&#x27;gem&#x27;?880:it.type===&#x27;bolt&#x27;?660:440,0.12);
    items.splice(idx,1);
    // speed up
    tickMs = Math.max(MIN_TICK, tickMs-4);
    restartTimer();
  }

  function restartTimer(){
    if(tickId) clearInterval(tickId);
    tickId=setInterval(tick,tickMs);
  }

  function tick(){
    if(!running) return;
    if(!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }
    // check food
    var ateIdx=-1;
    for (var f=0; f&lt;items.length; f++){ if(items[f].x===nx&amp;&amp;items[f].y===ny){ ateIdx=f; break; } }
    var body = ateIdx&gt;=0 ? snake : snake.slice(0,snake.length-1);
    for (var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }

    // ghost trail: record tail-going-out position
    ghosts.unshift({x:snake[snake.length-1].x, y:snake[snake.length-1].y});
    if(ghosts.length&gt;5) ghosts.pop();

    snake.unshift({x:nx,y:ny});
    if(ateIdx&gt;=0){ eat(items[ateIdx],ateIdx); }
    else { snake.pop(); }

    // combo expiry
    if(combo&gt;0 &amp;&amp; Date.now()-lastEatTime&gt;2000){ combo=0; comboEl.textContent=&#x27;&#x27;; }

    // decay bolt/gem lifetimes
    for (var k=items.length-1;k&gt;=0;k--){
      if(items[k].life!==Infinity){ items[k].life-=tickMs; if(items[k].life&lt;=0) items.splice(k,1); }
    }
    ensureItems();
    drawSnakeAndGhosts();
  }

  function explode(){
    for (var i=0;i&lt;snake.length;i++){
      var s=snake[i];
      var col=rainbow(snake.length&gt;1?i/(snake.length-1):0);
      for (var p=0;p&lt;2;p++){
        var el=document.createElement(&#x27;div&#x27;);
        el.className=&#x27;particle&#x27;;
        var sz=8+Math.random()*10;
        el.style.width=sz+&#x27;px&#x27;; el.style.height=sz+&#x27;px&#x27;;
        el.style.background=col; el.style.boxShadow=&#x27;0 0 8px &#x27;+col;
        var sx=s.x*CELL+CELL/2, sy=s.y*CELL+CELL/2;
        el.style.left=sx+&#x27;px&#x27;; el.style.top=sy+&#x27;px&#x27;;
        field.appendChild(el);
        var ang=Math.random()*Math.PI*2, dist=40+Math.random()*90;
        (function(el,ang,dist){
          el.animate([
            {transform:&#x27;translate(-50%,-50%) scale(1)&#x27;, opacity:1},
            {transform:&#x27;translate(calc(-50% + &#x27;+Math.cos(ang)*dist+&#x27;px), calc(-50% + &#x27;+Math.sin(ang)*dist+&#x27;px)) scale(.2)&#x27;, opacity:0}
          ],{duration:600+Math.random()*300, easing:&#x27;ease-out&#x27;, fill:&#x27;forwards&#x27;});
        })(el,ang,dist);
        setTimeout(function(e){return function(){ if(e.parentNode) e.parentNode.removeChild(e); };}(el),1000);
      }
    }
  }

  function endGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
    beep(120,0.4,&#x27;sawtooth&#x27;);
    layer.innerHTML=&#x27;&#x27;;
    explode();
    setTimeout(function(){
      dimEl.classList.add(&#x27;on&#x27;);
      msgEl.innerHTML=&#x27;GAME OVER&lt;br&gt;&lt;span style=&quot;font-size:18px;color:#00e5ff&quot;&gt;Score &#x27;+score+&#x27;&lt;/span&gt;&#x27;;
      msgEl.classList.add(&#x27;on&#x27;);
    },500);
  }

  function initSnake(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
    ghosts=[];
  }

  function startGame(){
    if(running) return;
    score=0; scoreEl.textContent=&#x27;0&#x27;; combo=0; comboEl.textContent=&#x27;&#x27;;
    tickMs=BASE_TICK; lastEatTime=0;
    dimEl.classList.remove(&#x27;on&#x27;); msgEl.classList.remove(&#x27;on&#x27;);
    items=[]; initSnake();
    spawnItem(&#x27;star&#x27;); spawnItem(&#x27;bolt&#x27;);
    drawSnakeAndGhosts();
    running=true;
    restartTimer();
    if(AC &amp;&amp; AC.state===&#x27;suspended&#x27;) AC.resume();
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  function setDir(dx,dy){ pendingDir={x:dx,y:dy}; }
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    var k=e.key.toLowerCase();
    if(k===&#x27;arrowleft&#x27;||k===&#x27;a&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if(k===&#x27;arrowright&#x27;||k===&#x27;d&#x27;){ setDir(1,0); e.preventDefault(); }
    else if(k===&#x27;arrowup&#x27;||k===&#x27;w&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if(k===&#x27;arrowdown&#x27;||k===&#x27;s&#x27;){ setDir(0,1); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint (stopped state)
  initSnake();
  spawnItem(&#x27;star&#x27;);
  drawSnakeAndGhosts();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
