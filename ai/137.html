  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🪼 Neon Reef Defense</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #050a1a; color: #dff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       color: #7ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08c; }
  .instructions { font-size: 16px; color: #9cf; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .wrap { position: relative; width: 640px; height: 470px; }
  canvas { display: block; width: 640px; height: 470px; border-radius: 10px;
           box-shadow: 0 0 24px rgba(0,200,255,0.25); background: #030716; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🪼 Neon Reef Defense&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer your sub with the &lt;strong&gt;←/→&lt;/strong&gt; (or &lt;strong&gt;A/D&lt;/strong&gt;) keys and press &lt;strong&gt;Space&lt;/strong&gt; to fire torpedoes at the jellyfish. Chain fast hits for a bigger combo, and don&#x27;t let jellyfish slip past the bottom!&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;);
var ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 470;

var running = false, animId = null;
var keys = {};
var shipX = W/2, SHIP_W = 46, SHIP_H = 30, SHIP_Y = H - 40, SHIP_SPEED = 6;
var bullets, jellies, particles, bubbles;
var score, combo, comboTimer, lastShot, gameTime, spawnAcc, spawnInterval;
var flash, shake, waveText, waveTimer, wave, gameOver;
var COLORS = [
  {name:&#x27;pink&#x27;, c:&#x27;#ff4fd8&#x27;, g:&#x27;#ff9cf0&#x27;},
  {name:&#x27;cyan&#x27;, c:&#x27;#3ff0ff&#x27;, g:&#x27;#aff8ff&#x27;},
  {name:&#x27;orange&#x27;, c:&#x27;#ffa53f&#x27;, g:&#x27;#ffd39c&#x27;}
];

function resetState() {
  bullets = []; jellies = []; particles = [];
  bubbles = [];
  for (var i=0;i&lt;26;i++) bubbles.push(newBubble(true));
  score = 0; combo = 0; comboTimer = 0; lastShot = 0;
  gameTime = 60; spawnAcc = 0; spawnInterval = 1.25;
  flash = 0; shake = 0; waveText = &#x27;&#x27;; waveTimer = 0; wave = 1;
  shipX = W/2; gameOver = false;
  for (var k in keys) keys[k]=false;
}

function newBubble(spread) {
  return { x: Math.random()*W, y: spread? Math.random()*H : H+10,
           r: 1.5+Math.random()*3.5, sp: 0.3+Math.random()*0.9 };
}

function spawnJelly() {
  var col = COLORS[(Math.random()*COLORS.length)|0];
  var sizeBonus = Math.min(score*0.6, 16);
  var r = 16 + Math.random()*8 + sizeBonus;
  var speed = 0.7 + Math.random()*0.5 + score*0.03 + (wave-1)*0.15;
  jellies.push({
    x: r + Math.random()*(W-2*r),
    y: -r, r: r, col: col,
    speed: speed,
    baseX: 0, t: Math.random()*Math.PI*2,
    amp: 20 + Math.random()*40, freq: 0.02+Math.random()*0.02,
    pulse: Math.random()*Math.PI*2
  });
  jellies[jellies.length-1].baseX = jellies[jellies.length-1].x;
}

function fire() {
  var now = performance.now();
  if (now - lastShot &lt; 200) return;
  lastShot = now;
  bullets.push({ x: shipX, y: SHIP_Y - SHIP_H, });
}

function explode(x, y, col) {
  for (var i=0;i&lt;18;i++) {
    var a = Math.random()*Math.PI*2, s = 1+Math.random()*5;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, col: Math.random()&lt;0.5? col.c : col.g, r:2+Math.random()*3 });
  }
  flash = 0.5;
}

function update(dt) {
  if (gameOver) return;
  gameTime -= dt;
  if (gameTime &lt;= 0) { gameTime = 0; gameOver = true; }

  if (keys[&#x27;ArrowLeft&#x27;] || keys[&#x27;a&#x27;] || keys[&#x27;A&#x27;]) shipX -= SHIP_SPEED;
  if (keys[&#x27;ArrowRight&#x27;] || keys[&#x27;d&#x27;] || keys[&#x27;D&#x27;]) shipX += SHIP_SPEED;
  shipX = Math.max(SHIP_W/2, Math.min(W-SHIP_W/2, shipX));

  // spawn
  spawnAcc += dt;
  var interval = Math.max(0.45, spawnInterval - (wave-1)*0.12);
  if (spawnAcc &gt;= interval) { spawnAcc = 0; spawnJelly(); }

  // bullets
  for (var i=bullets.length-1;i&gt;=0;i--) {
    bullets[i].y -= 9;
    if (bullets[i].y &lt; -10) bullets.splice(i,1);
  }

  // jellies
  for (var j=jellies.length-1;j&gt;=0;j--) {
    var jl = jellies[j];
    jl.t += 1;
    jl.pulse += 0.15;
    jl.y += jl.speed * (dt*60);
    jl.x = jl.baseX + Math.sin(jl.t*jl.freq)*jl.amp;
    if (jl.y - jl.r &gt; H) {
      jellies.splice(j,1);
      combo = 0; comboTimer = 0;
      shake = 12;
      continue;
    }
  }

  // collisions
  for (var b=bullets.length-1;b&gt;=0;b--) {
    for (var jj=jellies.length-1;jj&gt;=0;jj--) {
      var jl2 = jellies[jj];
      var dx = bullets[b].x - jl2.x, dy = bullets[b].y - jl2.y;
      if (dx*dx+dy*dy &lt; (jl2.r+4)*(jl2.r+4)) {
        explode(jl2.x, jl2.y, jl2.col);
        jellies.splice(jj,1);
        bullets.splice(b,1);
        combo++;
        comboTimer = 1.5;
        var pts = 1;
        var oldScore = score;
        score += pts;
        if (Math.floor(score/10) &gt; Math.floor(oldScore/10)) {
          wave++;
          waveText = &#x27;Wave &#x27; + wave + &#x27;!&#x27;;
          waveTimer = 1.6;
        }
        break;
      }
    }
  }

  // combo decay
  if (comboTimer &gt; 0) { comboTimer -= dt; if (comboTimer&lt;=0) combo=0; }

  // particles
  for (var p=particles.length-1;p&gt;=0;p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += 0.1; pt.vx *= 0.96; pt.vy *= 0.96;
    pt.life -= dt*1.6;
    if (pt.life &lt;= 0) particles.splice(p,1);
  }

  // bubbles
  for (var bb=0;bb&lt;bubbles.length;bb++) {
    bubbles[bb].y -= bubbles[bb].sp;
    bubbles[bb].x += Math.sin(bubbles[bb].y*0.03)*0.3;
    if (bubbles[bb].y &lt; -10) bubbles[bb] = newBubble(false);
  }

  if (flash &gt; 0) flash -= dt*2.5;
  if (shake &gt; 0) shake -= dt*40;
  if (waveTimer &gt; 0) waveTimer -= dt;
}

var causticT = 0;
function draw() {
  var ox=0, oy=0;
  if (shake &gt; 0) { ox=(Math.random()-0.5)*shake; oy=(Math.random()-0.5)*shake; }
  ctx.save();
  ctx.translate(ox, oy);

  // background
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#061024&#x27;); g.addColorStop(1,&#x27;#02060f&#x27;);
  ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);

  // caustic light
  causticT += 0.01;
  ctx.globalAlpha = 0.06;
  for (var c=0;c&lt;5;c++) {
    var cx = (W/5)*c + Math.sin(causticT+c)*60;
    var grd = ctx.createRadialGradient(cx, 0, 0, cx, 0, 260);
    grd.addColorStop(0,&#x27;#1a6cff&#x27;); grd.addColorStop(1,&#x27;transparent&#x27;);
    ctx.fillStyle = grd; ctx.fillRect(-20,-20,W+40,H+40);
  }
  ctx.globalAlpha = 1;

  // bubbles
  ctx.fillStyle = &#x27;rgba(120,220,255,0.25)&#x27;;
  for (var i=0;i&lt;bubbles.length;i++) {
    var bu = bubbles[i];
    ctx.beginPath(); ctx.arc(bu.x, bu.y, bu.r, 0, 7); ctx.fill();
  }

  // jellies
  for (var j=0;j&lt;jellies.length;j++) drawJelly(jellies[j]);

  // bullets
  ctx.save();
  ctx.shadowBlur = 14; ctx.shadowColor = &#x27;#ff5&#x27;;
  for (var b=0;b&lt;bullets.length;b++) {
    ctx.fillStyle = &#x27;#fffb8f&#x27;;
    ctx.beginPath();
    ctx.ellipse(bullets[b].x, bullets[b].y, 3.5, 9, 0, 0, 7);
    ctx.fill();
  }
  ctx.restore();

  // particles
  for (var p=0;p&lt;particles.length;p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawShip();

  // flash
  if (flash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+(flash*0.35)+&#x27;)&#x27;;
    ctx.fillRect(-20,-20,W+40,H+40);
  }

  ctx.restore();

  drawHUD();
  if (gameOver) drawGameOver();
}

function drawJelly(jl) {
  ctx.save();
  ctx.shadowBlur = 20; ctx.shadowColor = jl.col.c;
  var pr = jl.r * (1 + Math.sin(jl.pulse)*0.06);
  // bell
  var grad = ctx.createRadialGradient(jl.x, jl.y-pr*0.2, pr*0.2, jl.x, jl.y, pr);
  grad.addColorStop(0, jl.col.g);
  grad.addColorStop(1, jl.col.c);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(jl.x, jl.y, pr, Math.PI, 0);
  ctx.lineTo(jl.x+pr, jl.y+pr*0.3);
  ctx.quadraticCurveTo(jl.x, jl.y+pr*0.6, jl.x-pr, jl.y+pr*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = jl.col.g; ctx.lineWidth = 1.5; ctx.stroke();
  // tentacles
  ctx.strokeStyle = jl.col.c; ctx.lineWidth = 2;
  for (var t=-2;t&lt;=2;t++) {
    ctx.beginPath();
    var tx = jl.x + t*(pr*0.35);
    ctx.moveTo(tx, jl.y+pr*0.3);
    ctx.quadraticCurveTo(tx + Math.sin(jl.pulse+t)*6, jl.y+pr*0.9,
      tx + Math.sin(jl.pulse+t+1)*6, jl.y+pr*1.4);
    ctx.stroke();
  }
  ctx.restore();
}

function drawShip() {
  ctx.save();
  ctx.shadowBlur = 18; ctx.shadowColor = &#x27;#2ff&#x27;;
  ctx.translate(shipX, SHIP_Y);
  var grad = ctx.createLinearGradient(0,-SHIP_H/2,0,SHIP_H/2);
  grad.addColorStop(0,&#x27;#8ffcff&#x27;); grad.addColorStop(1,&#x27;#0a7&#x27;);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, SHIP_W/2, SHIP_H/2, 0, 0, 7);
  ctx.fill();
  ctx.strokeStyle = &#x27;#dffcff&#x27;; ctx.lineWidth = 2; ctx.stroke();
  // cockpit
  ctx.fillStyle = &#x27;#ffef8f&#x27;;
  ctx.beginPath(); ctx.arc(0,-2,5,0,7); ctx.fill();
  // gun
  ctx.fillStyle = &#x27;#cff&#x27;;
  ctx.fillRect(-3,-SHIP_H/2-6,6,8);
  ctx.restore();
}

function drawHUD() {
  // score
  ctx.save();
  ctx.font = &#x27;800 24px system-ui&#x27;;
  ctx.fillStyle = &#x27;#7ff&#x27;;
  ctx.shadowBlur = 10; ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.textAlign = &#x27;left&#x27;;
  ctx.fillText(&#x27;Score &#x27; + score, 14, 30);

  // combo bar
  var barX=14, barY=42, barW=150, barH=10;
  ctx.shadowBlur=0;
  ctx.fillStyle = &#x27;rgba(255,255,255,0.12)&#x27;;
  ctx.fillRect(barX,barY,barW,barH);
  if (comboTimer&gt;0 &amp;&amp; combo&gt;0) {
    ctx.fillStyle = &#x27;#ff4fd8&#x27;;
    ctx.fillRect(barX,barY,barW*(comboTimer/1.5),barH);
  }

  // combo text (bouncy)
  if (combo &gt;= 2) {
    var bounce = Math.sin(performance.now()*0.012)*4;
    ctx.font = &#x27;900 &#x27; + (26+combo) + &#x27;px system-ui&#x27;;
    ctx.fillStyle = &#x27;#ffef4f&#x27;;
    ctx.shadowBlur = 14; ctx.shadowColor = &#x27;#f80&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;x&#x27; + combo, W/2, 60 + bounce);
  }

  // timer
  ctx.textAlign = &#x27;right&#x27;;
  ctx.font = &#x27;800 24px system-ui&#x27;;
  var low = gameTime &lt;= 10;
  if (low) {
    var pulse = 0.5 + Math.abs(Math.sin(performance.now()*0.008))*0.5;
    ctx.fillStyle = &#x27;rgba(255,60,60,&#x27;+pulse+&#x27;)&#x27;;
    ctx.shadowBlur = 18; ctx.shadowColor = &#x27;#f00&#x27;;
  } else {
    ctx.fillStyle = &#x27;#7ff&#x27;;
    ctx.shadowBlur = 10; ctx.shadowColor = &#x27;#0ff&#x27;;
  }
  ctx.fillText(&#x27;⏱ &#x27; + Math.ceil(gameTime) + &#x27;s&#x27;, W-14, 30);

  // wave announcement
  if (waveTimer &gt; 0) {
    var a = Math.min(1, waveTimer*1.5);
    var scale = 1 + (1.6-waveTimer)*0.3;
    ctx.globalAlpha = a;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.font = &#x27;900 &#x27; + (44*Math.min(scale,1.4)) + &#x27;px system-ui&#x27;;
    ctx.fillStyle = &#x27;#3ff0ff&#x27;;
    ctx.shadowBlur = 24; ctx.shadowColor = &#x27;#0ff&#x27;;
    ctx.fillText(waveText, W/2, H/2);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = &#x27;rgba(3,6,18,0.72)&#x27;;
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = &#x27;center&#x27;;
  ctx.font = &#x27;900 40px system-ui&#x27;;
  ctx.fillStyle = &#x27;#ff4fd8&#x27;;
  ctx.shadowBlur = 20; ctx.shadowColor = &#x27;#f0f&#x27;;
  ctx.fillText(&#x27;Time Up!&#x27;, W/2, H/2-20);
  ctx.font = &#x27;800 28px system-ui&#x27;;
  ctx.fillStyle = &#x27;#7ff&#x27;;
  ctx.shadowColor = &#x27;#0ff&#x27;;
  ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2+24);
  ctx.font = &#x27;400 16px system-ui&#x27;;
  ctx.fillStyle = &#x27;#9cf&#x27;; ctx.shadowBlur=0;
  ctx.fillText(&#x27;Press Start below to dive again&#x27;, W/2, H/2+58);
  ctx.restore();
}

var lastTime = 0;
function loop(ts) {
  if (!running) return;
  var dt = Math.min(0.05, (ts - lastTime)/1000 || 0);
  lastTime = ts;
  update(dt);
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  if (running) return;
  resetState();
  running = true;
  lastTime = performance.now();
  spawnJelly();
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId=null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if ([&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;,&#x27;a&#x27;,&#x27;A&#x27;,&#x27;d&#x27;,&#x27;D&#x27;].indexOf(e.key)&gt;=0) { keys[e.key]=true; e.preventDefault(); }
  else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;) { if(running) fire(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if ([&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;,&#x27;a&#x27;,&#x27;A&#x27;,&#x27;d&#x27;,&#x27;D&#x27;].indexOf(e.key)&gt;=0) keys[e.key]=false;
});

// mouse / touch steering + tap fire
function pointerMove(clientX) {
  var rect = cv.getBoundingClientRect();
  shipX = Math.max(SHIP_W/2, Math.min(W-SHIP_W/2, (clientX-rect.left)*(W/rect.width)));
}
cv.addEventListener(&#x27;mousemove&#x27;, function(e){ if(running) pointerMove(e.clientX); });
cv.addEventListener(&#x27;mousedown&#x27;, function(e){ if(running){ pointerMove(e.clientX); fire(); } });
cv.addEventListener(&#x27;touchstart&#x27;, function(e){ if(running &amp;&amp; e.touches[0]){ pointerMove(e.touches[0].clientX); fire(); } }, {passive:true});
cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if(running &amp;&amp; e.touches[0]){ pointerMove(e.touches[0].clientX); } }, {passive:true});

window.addEventListener(&#x27;message&#x27;, function(e){
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type===&#x27;wd_start&#x27;) startGame();
  else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
resetState();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);

<script>
