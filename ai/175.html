<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060a; color: #d8faff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 2px;
       color: #a6ff5e; text-shadow: 0 0 8px #6fff2e, 0 0 18px #16d3b0; }
  .instructions { font-size: 16px; color: #7fd4e0; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { display: flex; align-items: center; gap: 20px; font-size: 20px; }
  .score { color: #eafcff; }
  .score b { color: #ffdf5e; font-size: 24px; }
  .best { color: #ff8fe0; }
  #combo { display: inline-block; font-weight: 700; color: #ff5e8a;
           text-shadow: 0 0 8px #ff2e6e; opacity: 0; transition: opacity .2s; font-size: 22px; }
  #combo.on { opacity: 1; }
  .pop { animation: pop .25s ease; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.5);} 100%{transform:scale(1);} }
  .field { position: relative; width: 600px; height: 440px; flex-shrink: 0;
           background:
             linear-gradient(#0a1420 1px, transparent 1px) 0 0 / 20px 20px,
             linear-gradient(90deg, #0a1420 1px, transparent 1px) 0 0 / 20px 20px,
             radial-gradient(circle at 50% 40%, #0a1424, #04050a);
           border: 3px solid #ff2ec4; border-radius: 8px; overflow: hidden;
           box-shadow: 0 0 14px #ff2ec4, inset 0 0 20px rgba(255,46,196,.25); }
  .field.hit { animation: hit .4s ease; }
  @keyframes hit { 0%,100%{border-color:#ff2ec4; box-shadow:0 0 14px #ff2ec4, inset 0 0 20px rgba(255,46,196,.25);}
                   50%{border-color:#ff2020; box-shadow:0 0 26px #ff2020, inset 0 0 34px rgba(255,32,32,.6);} }
  .cell { position: absolute; box-sizing: border-box; }
  .seg { border-radius: 5px; }
  .food { border-radius: 50%; animation: fpulse 1s ease-in-out infinite; }
  @keyframes fpulse { 0%,100%{transform:scale(.85);} 50%{transform:scale(1.05);} }
  .star { color: #ffdf3e; font-size: 18px; text-align: center; line-height: 20px; animation: fpulse 1s ease-in-out infinite; }
  .gem { color: #ff3e5e; font-size: 18px; text-align: center; line-height: 20px; animation: spin 1.4s linear infinite; }
  @keyframes spin { 0%{transform:rotate(0);} 100%{transform:rotate(360deg);} }
  .orb { background: #eafcff; box-shadow: 0 0 8px #eafcff; }
  .flash { position: absolute; top: 46%; left: 0; width: 100%; text-align: center;
           font-size: 30px; font-weight: 800; color: #6fff2e; text-shadow: 0 0 12px #6fff2e;
           pointer-events: none; opacity: 0; }
  .flash.show { animation: flashUp 1s ease; }
  @keyframes flashUp { 0%{opacity:0; transform:translateY(10px) scale(.8);} 25%{opacity:1; transform:translateY(0) scale(1.1);} 100%{opacity:0; transform:translateY(-14px) scale(1);} }
  .overlay { position: absolute; inset: 0; background: rgba(3,5,12,.82);
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 6px; opacity: 0; pointer-events: none; transition: opacity .5s; }
  .overlay.show { opacity: 1; }
  .overlay .go { font-size: 44px; font-weight: 800; color: #ff2e6e; text-shadow: 0 0 16px #ff2e6e; }
  .overlay .fin { font-size: 22px; color: #eafcff; }
  .overlay .nb { font-size: 20px; color: #ffdf5e; text-shadow: 0 0 8px #ffdf5e; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys (or swipe on the field) to eat glowing collectibles — golden star = 3, red gem = 2, white orb = 1. Grab them fast for combo bonuses; avoid the walls and your own tail.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span id=&quot;combo&quot;&gt;2×&lt;/span&gt;
    &lt;span class=&quot;best&quot;&gt;Best &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;SPEED UP!&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;go&quot;&gt;GAME OVER&lt;/div&gt;
      &lt;div class=&quot;fin&quot; id=&quot;finalScore&quot;&gt;Score: 0&lt;/div&gt;
      &lt;div class=&quot;nb&quot; id=&quot;newBest&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 30, ROWS = 22;
  var BASE_TICK = 150, MIN_TICK = 70;
  var running = false, tickId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0, best = 0, tickMs = BASE_TICK;
  var combo = 1, lastEatTime = 0, COMBO_WINDOW = 2000;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var newBestEl = document.getElementById(&#x27;newBest&#x27;);

  // collectibles: type = star(3) / gem(2) / orb(1)
  var TYPES = [
    { key:&#x27;star&#x27;, pts:3, cls:&#x27;star&#x27;, glyph:&#x27;\u2605&#x27; },
    { key:&#x27;gem&#x27;,  pts:2, cls:&#x27;gem&#x27;,  glyph:&#x27;\u25C6&#x27; },
    { key:&#x27;orb&#x27;,  pts:1, cls:&#x27;orb&#x27;,  glyph:&#x27;&#x27; }
  ];
  var items = [];

  function cellOccupied(x,y){
    for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    for (var j=0;j&lt;items.length;j++) if (items[j].x===x&amp;&amp;items[j].y===y) return true;
    return false;
  }
  function randFree(){
    for (var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if (!cellOccupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }
  function spawnItem(typeIdx){
    var p=randFree();
    items.push({x:p.x,y:p.y,t:typeIdx});
  }

  function drawCell(cls, x, y, extra){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell &#x27;+cls;
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    if (extra) el.innerHTML=extra;
    field.appendChild(el);
    return el;
  }

  function paint(){
    // remove only dynamic cells, keep flash+overlay
    var cells=field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i=0;i&lt;cells.length;i++) cells[i].remove();

    for (var k=0;k&lt;items.length;k++){
      var it=items[k], ty=TYPES[it.t];
      var e=drawCell(&#x27;food &#x27;+ty.cls, it.x, it.y, ty.glyph);
      if (ty.key===&#x27;orb&#x27;){ e.style.margin=&#x27;3px&#x27;; e.style.width=(CELL-6)+&#x27;px&#x27;; e.style.height=(CELL-6)+&#x27;px&#x27;; }
    }

    var n=snake.length;
    for (var s=n-1;s&gt;=0;s--){
      var seg=snake[s];
      var f = n&gt;1 ? (s/(n-1)) : 0; // 0 head, 1 tail
      var r=Math.round(166 - f*146);   // 166 -&gt; 20
      var g=Math.round(255 - f*100);   // 255 -&gt; 155
      var b=Math.round(94 + f*80);     // 94 -&gt; 174 (teal)
      var el=drawCell(&#x27;seg&#x27;, seg.x, seg.y);
      el.style.background=&#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      el.style.boxShadow=&#x27;0 0 6px rgba(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;,.7)&#x27;;
      if (s===0){
        // eyes
        var ex1, ex2, ey1, ey2;
        el.innerHTML=&#x27;&#x27;;
        var eye1=document.createElement(&#x27;div&#x27;), eye2=document.createElement(&#x27;div&#x27;);
        eye1.style.cssText=eye2.style.cssText=&#x27;position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;&#x27;;
        var cx=6, cy=6;
        // position eyes toward direction
        eye1.style.left=(4+dir.x*4)+&#x27;px&#x27;; eye1.style.top=(4+dir.y*4)+&#x27;px&#x27;;
        eye2.style.right=(4-dir.x*4)+&#x27;px&#x27;; eye2.style.top=(4+dir.y*4)+&#x27;px&#x27;;
        if (dir.y!==0){ eye2.style.top=(4+dir.y*4)+&#x27;px&#x27;; eye2.style.left=(12-dir.x*4)+&#x27;px&#x27;; eye2.style.right=&#x27;&#x27;; }
        el.appendChild(eye1); el.appendChild(eye2);
      }
    }
  }

  function initSnake(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11},{x:3,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function showFlash(txt){
    flashEl.textContent=txt;
    flashEl.classList.remove(&#x27;show&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;show&#x27;);
  }
  function popScore(){
    scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
  }
  function updateCombo(){
    if (combo&gt;=2){ comboEl.textContent=combo+&#x27;\u00D7&#x27;; comboEl.classList.add(&#x27;on&#x27;); }
    else comboEl.classList.remove(&#x27;on&#x27;);
  }

  // audio
  var actx=null;
  function beep(freq,dur){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=&#x27;square&#x27;; o.frequency.value=freq;
      g.gain.value=0.06; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    }catch(_){}
  }

  function tick(){
    if(!running) return;
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }
    var eatIdx=-1;
    for(var e=0;e&lt;items.length;e++) if(items[e].x===nx&amp;&amp;items[e].y===ny) eatIdx=e;
    var body = eatIdx&gt;=0 ? snake : snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }

    snake.unshift({x:nx,y:ny});
    if(eatIdx&gt;=0){
      var it=items[eatIdx], ty=TYPES[it.t];
      var now=Date.now();
      if(now-lastEatTime&lt;=COMBO_WINDOW) combo=Math.min(3,combo+1); else combo=1;
      lastEatTime=now;
      var gained=ty.pts*combo;
      var prevMile=Math.floor(score/10);
      score+=gained;
      scoreEl.textContent=score;
      popScore(); updateCombo();
      beep(ty.key===&#x27;star&#x27;?880:ty.key===&#x27;gem&#x27;?660:440, 0.12);
      items.splice(eatIdx,1);
      spawnItem(it.t);
      if(Math.floor(score/10)&gt;prevMile){
        tickMs=Math.max(MIN_TICK, tickMs-12);
        restartTimer();
        showFlash(&#x27;SPEED UP!&#x27;);
        beep(1100,0.15);
      }
    } else {
      snake.pop();
    }
    // combo decay if window passed (visual)
    if(combo&gt;=2 &amp;&amp; Date.now()-lastEatTime&gt;COMBO_WINDOW){ combo=1; updateCombo(); }
    paint();
  }

  function restartTimer(){
    if(tickId) clearInterval(tickId);
    tickId=setInterval(tick,tickMs);
  }

  function endGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
    field.classList.remove(&#x27;hit&#x27;); void field.offsetWidth; field.classList.add(&#x27;hit&#x27;);
    beep(160,0.4);
    var nb=&#x27;&#x27;;
    if(score&gt;best){ best=score; bestEl.textContent=best; nb=&#x27;NEW BEST!&#x27;; }
    finalScoreEl.textContent=&#x27;Score: &#x27;+score;
    newBestEl.textContent=nb;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    if(running) return;
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    combo=1; lastEatTime=0; updateCombo();
    tickMs=BASE_TICK;
    initSnake();
    items=[]; spawnItem(0); spawnItem(1); spawnItem(2);
    paint();
    running=true;
    restartTimer();
    tick();
  }
  function stopGame(){
    running=false;
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });

  // swipe controls
  var touchStart=null;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){
    var t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY};
  }, {passive:true});
  field.addEventListener(&#x27;touchmove&#x27;, function(e){
    if(!touchStart) return;
    var t=e.touches[0], dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    if(Math.abs(dx)&lt;18&amp;&amp;Math.abs(dy)&lt;18) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) pendingDir={x:dx&gt;0?1:-1,y:0};
    else pendingDir={x:0,y:dy&gt;0?1:-1};
    touchStart={x:t.clientX,y:t.clientY};
    e.preventDefault();
  }, {passive:false});
  // mouse drag steer
  var mDown=null;
  field.addEventListener(&#x27;mousedown&#x27;, function(e){ mDown={x:e.clientX,y:e.clientY}; });
  window.addEventListener(&#x27;mousemove&#x27;, function(e){
    if(!mDown) return;
    var dx=e.clientX-mDown.x, dy=e.clientY-mDown.y;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) pendingDir={x:dx&gt;0?1:-1,y:0};
    else pendingDir={x:0,y:dy&gt;0?1:-1};
    mDown={x:e.clientX,y:e.clientY};
  });
  window.addEventListener(&#x27;mouseup&#x27;, function(){ mDown=null; });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint
  initSnake();
  items=[]; spawnItem(0); spawnItem(1); spawnItem(2);
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
