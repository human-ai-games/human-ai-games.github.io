    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#ff0); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,255,255,.4); }
  .instructions { font-size: 16px; color: #9fb; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 620px; font-size: 18px; }
  .score { font-weight: 800; font-size: 26px; color: #ff2fd0; text-shadow: 0 0 12px #ff2fd0; }
  .lives { font-size: 22px; letter-spacing: 3px; text-shadow: 0 0 10px #f55; }
  #field { display: block; border-radius: 8px; box-shadow: 0 0 24px rgba(120,0,255,.4); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the cyan paddle with the ← and → arrow keys (or drag with the mouse) to bounce the plasma ball into the alien bricks. Smash them all, build combos, grab the golden brick, and don&#x27;t let the ball fall — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;❤️❤️❤️&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;field&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var W=620, H=470;
var canvas=document.getElementById(&#x27;field&#x27;), ctx=canvas.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), livesEl=document.getElementById(&#x27;lives&#x27;);

var running=false, animId=null;
var keys={};
var score=0, displayScore=0, lives=3;
var combo=0, comboFlash=0;
var paddle, ball, bricks, particles, stars;
var baseSpeed=4.2, ballSpeed=baseSpeed;
var shrinkTimer=0, slowmo=0, flash=0, comboText=&#x27;&#x27;;

var PADDLE_FULL=110, PADDLE_MIN=60, PADDLE_H=13;

// audio
var actx=null;
function beep(freq,dur,type,vol){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
    g.gain.value=vol||0.08;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  }catch(_){}
}

function makeStars(){
  stars=[];
  for(var i=0;i&lt;70;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,
      tw:Math.random()*Math.PI*2,sp:Math.random()*0.05+0.01});
  }
}

var COLORS=[&#x27;#ff3b6b&#x27;,&#x27;#ff8a2b&#x27;,&#x27;#ffe12b&#x27;,&#x27;#3bff7a&#x27;,&#x27;#2bd7ff&#x27;,&#x27;#7a5bff&#x27;,&#x27;#ff5bf0&#x27;];
function buildBricks(){
  bricks=[];
  var cols=9, rows=5, pad=6, ox=20, oy=40;
  var bw=(W-ox*2-(cols-1)*pad)/cols, bh=22;
  var goldR=Math.floor(Math.random()*rows), goldC=Math.floor(Math.random()*cols);
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;cols;c++){
      // fun pattern: skip some for a diamond-ish look
      var val = (r&lt;2)?3 : (r&lt;4)?2 : 1;
      var gold=(r===goldR&amp;&amp;c===goldC);
      bricks.push({
        x:ox+c*(bw+pad), y:oy+r*(bh+pad), w:bw, h:bh,
        color:COLORS[(r+c)%COLORS.length],
        val: gold?0:val,
        hits: gold?1:(val===3?2:1),
        maxHits: gold?1:(val===3?2:1),
        gold:gold, alive:true
      });
    }
  }
}

function resetBall(){
  ball={x:W/2, y:H-60, r:8, vx:0, vy:0, launched:false, trail:[]};
  ballSpeed=baseSpeed;
  combo=0;
}

function launch(){
  if(ball.launched) return;
  ball.launched=true;
  var ang=(-Math.PI/2)+(Math.random()*0.6-0.3);
  ball.vx=Math.cos(ang)*ballSpeed;
  ball.vy=Math.sin(ang)*ballSpeed;
}

function startGame(){
  score=0; displayScore=0; lives=3; combo=0; comboFlash=0;
  shrinkTimer=0; slowmo=0; flash=0; comboText=&#x27;&#x27;;
  paddle={w:PADDLE_FULL, x:(W-PADDLE_FULL)/2, y:H-24};
  particles=[];
  makeStars(); buildBricks(); resetBall();
  scoreEl.textContent=&#x27;0&#x27;; livesEl.textContent=&#x27;❤️❤️❤️&#x27;;
  for(var k in keys) keys[k]=false;
  running=true;
  if(animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

function spawnBurst(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

var over=false;
function endGame(){ over=true; running=false; }

function update(){
  var dt = slowmo&gt;0 ? 0.45 : 1;
  if(slowmo&gt;0) slowmo--;

  // stars twinkle
  for(var i=0;i&lt;stars.length;i++){ stars[i].tw+=stars[i].sp; }

  // paddle
  var pspd=8;
  if(keys[&#x27;ArrowLeft&#x27;]) paddle.x-=pspd;
  if(keys[&#x27;ArrowRight&#x27;]) paddle.x+=pspd;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  // shrink over time
  shrinkTimer++;
  if(shrinkTimer&gt;=900){ // ~15s at 60fps
    shrinkTimer=0;
    paddle.w=Math.max(PADDLE_MIN, paddle.w-14);
  }

  if(!ball.launched){
    ball.x=paddle.x+paddle.w/2;
    ball.y=paddle.y-14;
  } else {
    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;
  }

  // trail
  ball.trail.push({x:ball.x,y:ball.y});
  if(ball.trail.length&gt;10) ball.trail.shift();

  // walls
  if(ball.x-ball.r&lt;0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);}
  if(ball.x+ball.r&gt;W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);}
  if(ball.y-ball.r&lt;0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);}

  // paddle collision
  if(ball.vy&gt;0 &amp;&amp; ball.y+ball.r&gt;=paddle.y &amp;&amp; ball.y+ball.r&lt;=paddle.y+PADDLE_H+8 &amp;&amp;
     ball.x&gt;=paddle.x-ball.r &amp;&amp; ball.x&lt;=paddle.x+paddle.w+ball.r){
    var rel=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    rel=Math.max(-1,Math.min(1,rel));
    var ang=(-Math.PI/2)+rel*(Math.PI/3);
    ball.vx=Math.cos(ang)*ballSpeed;
    ball.vy=Math.sin(ang)*ballSpeed;
    ball.y=paddle.y-ball.r-1;
    beep(220,0.06,&#x27;square&#x27;,0.06);
  }

  // brick collision
  for(var b=0;b&lt;bricks.length;b++){
    var k=bricks[b];
    if(!k.alive) continue;
    if(ball.x+ball.r&gt;k.x &amp;&amp; ball.x-ball.r&lt;k.x+k.w &amp;&amp;
       ball.y+ball.r&gt;k.y &amp;&amp; ball.y-ball.r&lt;k.y+k.h){
      // resolve bounce direction
      var ox=Math.min(ball.x+ball.r-k.x, k.x+k.w-(ball.x-ball.r));
      var oy=Math.min(ball.y+ball.r-k.y, k.y+k.h-(ball.y-ball.r));
      if(ox&lt;oy){ ball.vx=-ball.vx; } else { ball.vy=-ball.vy; }
      k.hits--;
      if(k.hits&lt;=0){
        k.alive=false;
        spawnBurst(k.x+k.w/2,k.y+k.h/2,k.color,16);
        flash=0.5;
        combo++;
        if(combo&gt;=2){ comboText=&#x27;x&#x27;+combo+&#x27; COMBO!&#x27;; comboFlash=1; }
        var pts=(k.gold?5:k.val)*Math.max(1,combo);
        score+=pts;
        // speed up with combo
        ballSpeed=Math.min(9, baseSpeed + combo*0.35);
        var sp=Math.hypot(ball.vx,ball.vy);
        if(sp&gt;0){ ball.vx=ball.vx/sp*ballSpeed; ball.vy=ball.vy/sp*ballSpeed; }
        if(k.gold){
          paddle.w=PADDLE_FULL;
          paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
          slowmo=300; // 5s
          flash=1;
          beep(880,0.25,&#x27;sine&#x27;,0.1);
        } else {
          beep(440+combo*40,0.07,&#x27;square&#x27;,0.07);
        }
      } else {
        spawnBurst(ball.x,ball.y,k.color,6);
        beep(330,0.05,&#x27;square&#x27;,0.05);
      }
      break;
    }
  }

  // check win -&gt; rebuild
  var anyAlive=false;
  for(var b2=0;b2&lt;bricks.length;b2++){ if(bricks[b2].alive){anyAlive=true;break;} }
  if(!anyAlive){ buildBricks(); resetBall(); ballSpeed=baseSpeed; }

  // ball fell
  if(ball.y-ball.r&gt;H){
    lives--;
    combo=0;
    livesEl.textContent=&#x27;❤️&#x27;.repeat(Math.max(0,lives))+&#x27;🖤&#x27;.repeat(3-Math.max(0,lives));
    beep(120,0.3,&#x27;sawtooth&#x27;,0.09);
    if(lives&lt;=0){ endGame(); }
    else { resetBall(); ballSpeed=baseSpeed; }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.12; pt.life-=0.03;
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  if(flash&gt;0) flash-=0.06;
  if(comboFlash&gt;0) comboFlash-=0.02;

  // animate score number
  if(displayScore&lt;score) displayScore=Math.min(score,displayScore+Math.ceil((score-displayScore)/6));
  scoreEl.textContent=displayScore;
}

function draw(){
  // background
  ctx.fillStyle=&#x27;#05010f&#x27;; ctx.fillRect(0,0,W,H);
  // stars
  for(var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    var a=0.4+0.6*Math.abs(Math.sin(s.tw));
    ctx.globalAlpha=a; ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  if(slowmo&gt;0){ ctx.fillStyle=&#x27;rgba(60,120,255,0.12)&#x27;; ctx.fillRect(0,0,W,H); }

  // bricks
  for(var b=0;b&lt;bricks.length;b++){
    var k=bricks[b]; if(!k.alive) continue;
    if(k.gold){
      ctx.shadowColor=&#x27;#ffdb1f&#x27;; ctx.shadowBlur=20;
      ctx.fillStyle=&#x27;#ffdb1f&#x27;;
    } else {
      ctx.shadowColor=k.color; ctx.shadowBlur=k.val*4;
      ctx.fillStyle=k.color;
      if(k.hits&lt;k.maxHits) ctx.globalAlpha=0.55;
    }
    roundRect(k.x,k.y,k.w,k.h,4); ctx.fill();
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    ctx.fillStyle=k.gold?&#x27;#5a3d00&#x27;:&#x27;#00000099&#x27;;
    ctx.font=&#x27;bold 12px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(k.gold?&#x27;★&#x27;:k.val, k.x+k.w/2, k.y+k.h/2);
  }

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-2,pt.y-2,4,4);
  }
  ctx.globalAlpha=1;

  // ball trail
  for(var t=0;t&lt;ball.trail.length;t++){
    var tr=ball.trail[t];
    ctx.globalAlpha=(t/ball.trail.length)*0.5;
    ctx.fillStyle=&#x27;#ff2fd0&#x27;;
    ctx.beginPath(); ctx.arc(tr.x,tr.y,ball.r*(t/ball.trail.length),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  ctx.shadowColor=&#x27;#ff2fd0&#x27;; ctx.shadowBlur=18;
  var pulse=ball.r+Math.sin(Date.now()/120)*1.2;
  ctx.fillStyle=&#x27;#ff5fe0&#x27;;
  ctx.beginPath(); ctx.arc(ball.x,ball.y,pulse,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // paddle
  ctx.shadowColor=&#x27;#00e6ff&#x27;; ctx.shadowBlur=16;
  ctx.fillStyle=&#x27;#00e6ff&#x27;;
  roundRect(paddle.x,paddle.y,paddle.w,PADDLE_H,6); ctx.fill();
  ctx.shadowBlur=0;

  // flash
  if(flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(flash*0.5)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }

  // combo text
  if(comboFlash&gt;0 &amp;&amp; comboText){
    ctx.globalAlpha=Math.min(1,comboFlash*2);
    var sz=28+(1-comboFlash)*30;
    ctx.font=&#x27;bold &#x27;+sz+&#x27;px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle=&#x27;#ffe12b&#x27;; ctx.shadowColor=&#x27;#ff8a2b&#x27;; ctx.shadowBlur=20;
    ctx.fillText(comboText, W/2, H/2);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  if(!ball.launched &amp;&amp; !over){
    ctx.font=&#x27;bold 16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillStyle=&#x27;#9ff&#x27;;
    ctx.fillText(&#x27;Press SPACE or click to launch&#x27;, W/2, H-70);
  }

  if(over){
    ctx.fillStyle=&#x27;rgba(5,1,15,0.8)&#x27;; ctx.fillRect(0,0,W,H);
    ctx.font=&#x27;bold 40px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.fillStyle=&#x27;#ff2fd0&#x27;;
    ctx.shadowColor=&#x27;#ff2fd0&#x27;; ctx.shadowBlur=20;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-10);
    ctx.shadowBlur=0;
    ctx.font=&#x27;bold 22px system-ui&#x27;; ctx.fillStyle=&#x27;#0ff&#x27;;
    ctx.fillText(&#x27;Score: &#x27;+score, W/2, H/2+30);
    ctx.font=&#x27;16px system-ui&#x27;; ctx.fillStyle=&#x27;#9fb&#x27;;
    ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2+62);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function loop(){
  if(!running){ draw(); return; }
  update();
  draw();
  animId=requestAnimationFrame(loop);
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){keys[e.key]=true;e.preventDefault();}
  if(e.key===&#x27; &#x27;){ if(running) launch(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
canvas.addEventListener(&#x27;mousemove&#x27;,function(e){
  if(!running||!paddle) return;
  var rect=canvas.getBoundingClientRect();
  var mx=(e.clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(0,Math.min(W-paddle.w,mx-paddle.w/2));
});
canvas.addEventListener(&#x27;mousedown&#x27;,function(){ if(running) launch(); });

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;){ over=false; startGame(); }
  else if(e.data.type===&#x27;wd_stop&#x27;){ stopGame(); }
});

// initial static render
paddle={w:PADDLE_FULL, x:(W-PADDLE_FULL)/2, y:H-24};
particles=[]; makeStars(); buildBricks(); resetBall();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
