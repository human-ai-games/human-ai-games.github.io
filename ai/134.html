&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #bfe6ff; color: #133; overflow: hidden; }

  .combo.show { animation: pop 0.9s ease-out; }
  @keyframes pop {

  @keyframes shk {

    20% { transform: translate(-6px,3px); }

    80% { transform: translate(4px,-2px); }
  }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;&amp;larr;&lt;/strong&gt;/&lt;strong&gt;&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and speed the drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Fill a full row to clear it and build combos — use the Start/Restart button below!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;scorebox&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;badge&quot;&gt;Best Combo: &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stage&quot; id=&quot;stage&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;canvas id=&quot;stars&quot; width=&quot;240&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
      &lt;canvas id=&quot;board&quot; width=&quot;240&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
      &lt;canvas id=&quot;fx&quot; width=&quot;240&quot; height=&quot;480&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;splash&quot; id=&quot;splash&quot;&gt;
      &lt;h2&gt;Game Over — Nice Try! 🍓&lt;/h2&gt;
      &lt;p&gt;Press Restart below to play again&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var boardC = document.getElementById(&#x27;board&#x27;), bx = boardC.getContext(&#x27;2d&#x27;);
  var starsC = document.getElementById(&#x27;stars&#x27;), sx = starsC.getContext(&#x27;2d&#x27;);
  var fxC = document.getElementById(&#x27;fx&#x27;), fx = fxC.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;), splashEl = document.getElementById(&#x27;splash&#x27;);
  var fieldEl = document.getElementById(&#x27;field&#x27;);

  // Fruit types: emoji + gradient colors
  var FRUITS = [
    { e:&#x27;🍎&#x27;, c1:&#x27;#ff6b6b&#x27;, c2:&#x27;#c92a2a&#x27; },
    { e:&#x27;🍊&#x27;, c1:&#x27;#ffa94d&#x27;, c2:&#x27;#e8590c&#x27; },
    { e:&#x27;🍋&#x27;, c1:&#x27;#ffe066&#x27;, c2:&#x27;#f0b800&#x27; },
    { e:&#x27;🍇&#x27;, c1:&#x27;#b197fc&#x27;, c2:&#x27;#6741d9&#x27; },
    { e:&#x27;🍓&#x27;, c1:&#x27;#ff8fab&#x27;, c2:&#x27;#d6317a&#x27; },
    { e:&#x27;🍉&#x27;, c1:&#x27;#69db7c&#x27;, c2:&#x27;#2f9e44&#x27; },
    { e:&#x27;🫐&#x27;, c1:&#x27;#74c0fc&#x27;, c2:&#x27;#1971c2&#x27; }
  ];
  // 7 tetromino shapes (rotation states as coordinate sets)
  var SHAPES = [
    [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]], // I
    [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]], // J
    [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]], // L
    [[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]], // O
    [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]], // S
    [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]], // T
    [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]]  // Z
  ];

  var grid, piece, score, best, running, dropId, dropMs, rafId;
  var stars = [], sparks = [];

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function newPiece() {
    var t = Math.floor(Math.random()*7);
    return { t:t, rot:0, x:3, y:-1, fruit: Math.floor(Math.random()*FRUITS.length) };
  }

  function cellsOf(p) {
    var s = SHAPES[p.t][p.rot%4];
    return s.map(function(c){ return { x:p.x+c[0], y:p.y+c[1] }; });
  }

  function collides(p) {
    var cs = cellsOf(p);
    for (var i=0;i&lt;cs.length;i++){
      var x=cs[i].x, y=cs[i].y;
      if (x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if (y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function ghostY(p) {
    var g = { t:p.t, rot:p.rot, x:p.x, y:p.y };
    while(!collides({t:g.t,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g.y;
  }

  function lockPiece() {
    var cs = cellsOf(piece);
    for (var i=0;i&lt;cs.length;i++){
      var c=cs[i];
      if (c.y&gt;=0 &amp;&amp; c.y&lt;ROWS) grid[c.y][c.x] = piece.fruit;
    }
  }

  function clearRows() {
    var cleared = [];
    for (var r=ROWS-1;r&gt;=0;r--){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if(grid[r][c]===null){ full=false; break; }
      if (full) cleared.push(r);
    }
    if (cleared.length&gt;0){
      // spark bursts from cleared rows
      for (var k=0;k&lt;cleared.length;k++) burst(cleared[k]);
      // remove rows
      cleared.sort(function(a,b){return a-b;});
      for (var j=cleared.length-1;j&gt;=0;j--){
        grid.splice(cleared[j],1);
        var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
        grid.unshift(empty);
      }
      var n = cleared.length;
      score += n*n; // more per multi-line
      scoreEl.textContent = score;
      if (n&gt;best){ best=n; bestEl.textContent=best; }
      showCombo(n);
      shake();
      updateSpeed();
    }
  }

  function updateSpeed() {
    var lvl = Math.floor(score/10);
    dropMs = Math.max(120, 550 - lvl*40);
    if (running){ clearInterval(dropId); dropId=setInterval(stepDown, dropMs); }
  }

  function showCombo(n) {
    comboEl.textContent = &#x27;+&#x27; + n + (n&gt;1 ? &#x27; COMBO!&#x27; : &#x27;!&#x27;);
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  function shake() {
    fieldEl.classList.remove(&#x27;shake&#x27;); void fieldEl.offsetWidth; fieldEl.classList.add(&#x27;shake&#x27;);
  }

  function burst(row) {
    var cy = row*CELL + CELL/2;
    var cols = [&#x27;#ff6b6b&#x27;,&#x27;#ffd43b&#x27;,&#x27;#69db7c&#x27;,&#x27;#4dabf7&#x27;,&#x27;#da77f2&#x27;,&#x27;#ff922b&#x27;,&#x27;#ff8fab&#x27;];
    for (var i=0;i&lt;28;i++){
      var a = Math.random()*Math.PI*2;
      var sp = 2+Math.random()*5;
      sparks.push({ x: Math.random()*240, y: cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1, life:1, col:cols[Math.floor(Math.random()*cols.length)], sz:3+Math.random()*4 });
    }
  }

  function drawCell(cx, cy, fruitIdx, ghost) {
    var f = FRUITS[fruitIdx];
    var px = cx*CELL, py = cy*CELL;
    if (ghost) {
      bx.globalAlpha = 0.28;
      bx.fillStyle = f.c1;
      bx.fillRect(px+2, py+2, CELL-4, CELL-4);
      bx.globalAlpha = 1;
      bx.strokeStyle = f.c2;
      bx.lineWidth = 1;
      bx.strokeRect(px+2, py+2, CELL-4, CELL-4);
      return;
    }
    var g = bx.createLinearGradient(px, py, px, py+CELL);
    g.addColorStop(0, f.c1); g.addColorStop(1, f.c2);
    bx.fillStyle = g;
    roundRect(px+1, py+1, CELL-2, CELL-2, 5);
    bx.fill();
    bx.font = (CELL-6)+&#x27;px serif&#x27;;
    bx.textAlign=&#x27;center&#x27;; bx.textBaseline=&#x27;middle&#x27;;
    bx.fillText(f.e, px+CELL/2, py+CELL/2+1);
  }

  function roundRect(x,y,w,h,r){
    bx.beginPath();
    bx.moveTo(x+r,y);
    bx.arcTo(x+w,y,x+w,y+h,r);
    bx.arcTo(x+w,y+h,x,y+h,r);
    bx.arcTo(x,y+h,x,y,r);
    bx.arcTo(x,y,x+w,y,r);
    bx.closePath();
  }

  function paintBoard() {
    bx.clearRect(0,0,240,480);
    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]!==null) drawCell(c,r,grid[r][c],false);
    if (piece){
      var gy = ghostY(piece);
      var gcells = cellsOf({t:piece.t,rot:piece.rot,x:piece.x,y:gy});
      for (var i=0;i&lt;gcells.length;i++) if(gcells[i].y&gt;=0) drawCell(gcells[i].x,gcells[i].y,piece.fruit,true);
      var cs = cellsOf(piece);
      for (var j=0;j&lt;cs.length;j++) if(cs[j].y&gt;=0) drawCell(cs[j].x,cs[j].y,piece.fruit,false);
    }
  }

  function stepDown() {
    if (!piece) return;
    var np = {t:piece.t,rot:piece.rot,x:piece.x,y:piece.y+1};
    if (collides(np)){
      lockPiece();
      clearRows();
      piece = newPiece();
      if (collides(piece)){ endGame(); return; }
    } else {
      piece = np;
    }
    paintBoard();
  }

  function move(dx){
    if(!running||!piece) return;
    var np={t:piece.t,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if(!collides(np)){ piece=np; paintBoard(); }
  }
  function rotate(){
    if(!running||!piece) return;
    var nr=(piece.rot+1)%4;
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){
      var np={t:piece.t,rot:nr,x:piece.x+kicks[i],y:piece.y};
      if(!collides(np)){ piece=np; paintBoard(); return; }
    }
  }

  // ---- background stars ----
  function initStars(){
    stars=[];
    for(var i=0;i&lt;40;i++) stars.push({ x:Math.random()*240, y:Math.random()*480, sp:0.3+Math.random()*1.2, sz:1+Math.random()*2 });
  }
  function loop(){
    // stars
    sx.clearRect(0,0,240,480);
    sx.fillStyle=&#x27;rgba(255,255,255,0.8)&#x27;;
    for(var i=0;i&lt;stars.length;i++){
      var s=stars[i];
      s.y+=s.sp; if(s.y&gt;480){ s.y=-4; s.x=Math.random()*240; }
      sx.beginPath(); sx.arc(s.x,s.y,s.sz,0,Math.PI*2); sx.fill();
    }
    // sparks
    fx.clearRect(0,0,240,480);
    for(var k=sparks.length-1;k&gt;=0;k--){
      var p=sparks[k];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.025;
      if(p.life&lt;=0){ sparks.splice(k,1); continue; }
      fx.globalAlpha=Math.max(0,p.life);
      fx.fillStyle=p.col;
      fx.fillRect(p.x,p.y,p.sz,p.sz);
    }
    fx.globalAlpha=1;
    rafId=requestAnimationFrame(loop);
  }

  function endGame(){
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
    paintBoard();
    splashEl.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    score=0; best=0; scoreEl.textContent=&#x27;0&#x27;; bestEl.textContent=&#x27;0&#x27;;
    dropMs=550;
    newGrid();
    piece=newPiece();
    sparks=[];
    splashEl.classList.remove(&#x27;show&#x27;);
    running=true;
    paintBoard();
    if(dropId) clearInterval(dropId);
    dropId=setInterval(stepDown, dropMs);
    if(!rafId) loop();
  }
  function stopGame(){
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial view (stopped): show stars gently and empty board
  initStars();
  newGrid();
  score=0; best=0;
  paintBoard();
  // draw one static star frame so the field looks alive but not running
  sx.fillStyle=&#x27;rgba(255,255,255,0.8)&#x27;;
  for(var i=0;i&lt;stars.length;i++){ sx.beginPath(); sx.arc(stars[i].x,stars[i].y,stars[i].sz,0,Math.PI*2); sx.fill(); }
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
