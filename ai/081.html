&lt;div class=&quot;game&quot;&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var CELL = 52, COLS = 12;
var FIELD_W = 620, FIELD_H = 468;
var ROWS = Math.floor(FIELD_H / CELL); // 9 rows
var running = false, animId = null;
var score = 0, best = 0;
var field = document.getElementById(&#x27;field&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var bestEl = document.getElementById(&#x27;best&#x27;);
var coinEl = document.getElementById(&#x27;coin&#x27;);
var hero = { col: Math.floor(COLS/2), row: ROWS-1, x:0, y:0 };
var heroEl = null;
var lanes = [];
var lastFrame = 0;

// Web Audio
var actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function boing(){ var a=audio(); if(!a)return; var o=a.createOscillator(),g=a.createGain();
  o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(280,a.currentTime); o.frequency.exponentialRampToValueAtTime(560,a.currentTime+.12);
  g.gain.setValueAtTime(.18,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.19); }
function chime(){ var a=audio(); if(!a)return; [523,659,784].forEach(function(f,i){ var o=a.createOscillator(),g=a.createGain();
  o.type=&#x27;triangle&#x27;; o.frequency.value=f; g.gain.setValueAtTime(.0001,a.currentTime+i*.06);
  g.gain.linearRampToValueAtTime(.15,a.currentTime+i*.06+.02); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.06+.25);
  o.connect(g); g.connect(a.destination); o.start(a.currentTime+i*.06); o.stop(a.currentTime+i*.06+.26); }); }
function splat(){ var a=audio(); if(!a)return; var o=a.createOscillator(),g=a.createGain();
  o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(420,a.currentTime); o.frequency.exponentialRampToValueAtTime(60,a.currentTime+.35);
  g.gain.setValueAtTime(.2,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.41); }

var CAR_COLORS = [&#x27;#ff4d6d&#x27;,&#x27;#4dd2ff&#x27;,&#x27;#ffd34d&#x27;,&#x27;#b06dff&#x27;,&#x27;#4dff9e&#x27;,&#x27;#ff924d&#x27;];
var CAR_EMOJI = [&#x27;🚗&#x27;,&#x27;🚕&#x27;,&#x27;🚙&#x27;,&#x27;🚌&#x27;,&#x27;🚚&#x27;];

function makeStars(){
  var s = document.createElement(&#x27;div&#x27;); s.className=&#x27;stars&#x27;;
  for(var i=0;i&lt;40;i++){ var st=document.createElement(&#x27;div&#x27;); st.className=&#x27;star&#x27;;
    st.style.left=(Math.random()*100)+&#x27;%&#x27;; st.style.top=(Math.random()*100)+&#x27;%&#x27;;
    st.style.animationDelay=(Math.random()*3)+&#x27;s&#x27;; s.appendChild(st); }
  field.appendChild(s);
}

// lane types by row: row 0 = top safe (goal), last row = start safe
function laneType(row){
  if(row===0 || row===ROWS-1) return &#x27;safe&#x27;;
  // alternate road / water bands
  var band = row % 2; // 1=road,0=water style-ish
  return (row%2===1)?&#x27;road&#x27;:&#x27;water&#x27;;
}

function buildLanes(){
  field.innerHTML=&#x27;&#x27;;
  makeStars();
  lanes=[];
  var diff = 1 + score*0.06; // speed multiplier
  for(var row=0; row&lt;ROWS; row++){
    var type = laneType(row);
    var laneDiv = document.createElement(&#x27;div&#x27;);
    laneDiv.className = &#x27;lane &#x27;+type;
    laneDiv.style.top = (row*CELL)+&#x27;px&#x27;;
    laneDiv.style.height = CELL+&#x27;px&#x27;;
    if(type===&#x27;water&#x27;){ var w=document.createElement(&#x27;div&#x27;); w.className=&#x27;wave&#x27;; laneDiv.appendChild(w); }
    var eT=document.createElement(&#x27;div&#x27;); eT.className=&#x27;edge top&#x27;; laneDiv.appendChild(eT);
    var eB=document.createElement(&#x27;div&#x27;); eB.className=&#x27;edge bot&#x27;; laneDiv.appendChild(eB);
    field.appendChild(laneDiv);

    var lane = { row:row, type:type, div:laneDiv, objs:[] };
    if(type!==&#x27;safe&#x27;){
      var dir = (row%2===0)?1:-1;
      var baseSpeed = (0.6 + (row%3)*0.25) * diff;
      lane.dir = dir;
      lane.speed = baseSpeed;
      if(type===&#x27;road&#x27;){
        var count = 2 + (row%2);
        var gap = FIELD_W / count;
        var objW = CELL*1.5;
        for(var j=0;j&lt;count;j++){
          var x = j*gap + (row*40)%gap;
          var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;car&#x27;;
          var col = CAR_COLORS[(row+j)%CAR_COLORS.length];
          el.style.color = col; el.style.background = col;
          el.style.width = objW+&#x27;px&#x27;; el.style.height=(CELL-16)+&#x27;px&#x27;;
          el.style.top = (row*CELL+8)+&#x27;px&#x27;;
          el.textContent = CAR_EMOJI[(row+j)%CAR_EMOJI.length];
          el.style.transform = dir&lt;0 ? &#x27;scaleX(-1)&#x27;:&#x27;none&#x27;;
          field.appendChild(el);
          lane.objs.push({x:x,w:objW,el:el,ride:false});
        }
      } else {
        // water: logs and pads that shrink apart as score rises
        var count2 = 2;
        var gap2 = (FIELD_W / count2) + Math.max(0, 40 - score*3); // gaps shrink a bit
        var objW2 = Math.max(CELL*1.4, CELL*2.2 - score*4);
        for(var k=0;k&lt;count2;k++){
          var x2 = k*gap2 + (row*55)%gap2;
          var isPad = (row%3===0 &amp;&amp; k===1);
          var el2=document.createElement(&#x27;div&#x27;);
          if(isPad){ el2.className=&#x27;pad&#x27;; el2.style.width=(CELL-14)+&#x27;px&#x27;; el2.style.height=(CELL-14)+&#x27;px&#x27;; el2.style.top=(row*CELL+7)+&#x27;px&#x27;; }
          else { el2.className=&#x27;log&#x27;; el2.style.width=objW2+&#x27;px&#x27;; el2.style.height=(CELL-20)+&#x27;px&#x27;; el2.style.top=(row*CELL+10)+&#x27;px&#x27;; el2.textContent=&#x27;🪵&#x27;; }
          field.appendChild(el2);
          lane.objs.push({x:x2, w: isPad?(CELL-14):objW2, el:el2, ride:true});
        }
      }
    }
    lanes.push(lane);
  }
}

function makeHero(){
  heroEl = document.createElement(&#x27;div&#x27;);
  heroEl.className=&#x27;frog&#x27;;
  heroEl.textContent=&#x27;🐸&#x27;;
  field.appendChild(heroEl);
}
function heroPixel(){
  hero.x = hero.col*CELL + (CELL-30)/2;
  hero.y = hero.row*CELL + (CELL-30)/2;
}
function paintHero(){
  heroEl.style.left = hero.x+&#x27;px&#x27;;
  heroEl.style.top = hero.y+&#x27;px&#x27;;
}
function resetHero(){
  hero.col = Math.floor(COLS/2);
  hero.row = ROWS-1;
  hero.rideDX = 0;
  heroPixel(); paintHero();
}

function ripple(x,y){
  var r=document.createElement(&#x27;div&#x27;); r.className=&#x27;ripple&#x27;;
  r.style.left=(x-14)+&#x27;px&#x27;; r.style.top=(y-14)+&#x27;px&#x27;; r.style.width=&#x27;30px&#x27;; r.style.height=&#x27;30px&#x27;;
  field.appendChild(r); setTimeout(function(){ if(r.parentNode)r.parentNode.removeChild(r); },520);
}
function fx(emoji,x,y){
  var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;fx&#x27;; f.textContent=emoji;
  f.style.left=(x-8)+&#x27;px&#x27;; f.style.top=(y-8)+&#x27;px&#x27;;
  field.appendChild(f); setTimeout(function(){ if(f.parentNode)f.parentNode.removeChild(f); },560);
}

function heroBox(){
  return { x: hero.col*CELL + (CELL-30)/2, y: hero.row*CELL, w:30, h:CELL, cx: hero.col*CELL + CELL/2 };
}

function tick(ts){
  if(!running) return;
  var dt = lastFrame ? Math.min(40, ts-lastFrame) : 16; lastFrame = ts;
  var step = dt/16;
  for(var i=0;i&lt;lanes.length;i++){
    var lane=lanes[i];
    if(lane.type===&#x27;safe&#x27;) continue;
    for(var j=0;j&lt;lane.objs.length;j++){
      var o=lane.objs[j];
      o.x += lane.dir*lane.speed*step;
      if(lane.dir&gt;0 &amp;&amp; o.x&gt;FIELD_W) o.x=-o.w;
      else if(lane.dir&lt;0 &amp;&amp; o.x+o.w&lt;0) o.x=FIELD_W;
      o.el.style.left=o.x+&#x27;px&#x27;;
    }
  }

  // interaction with hero&#x27;s current lane
  var lane = lanes[hero.row];
  if(lane &amp;&amp; lane.type===&#x27;road&#x27;){
    var hb = heroBox();
    for(var k=0;k&lt;lane.objs.length;k++){
      var c=lane.objs[k];
      if(hb.x &lt; c.x+c.w &amp;&amp; hb.x+hb.w &gt; c.x){ crash(); return; }
    }
  } else if(lane &amp;&amp; lane.type===&#x27;water&#x27;){
    // must be on a platform
    var hbx = hero.col*CELL + CELL/2;
    var onPlat=null;
    for(var m=0;m&lt;lane.objs.length;m++){
      var p=lane.objs[m];
      if(hbx &gt; p.x &amp;&amp; hbx &lt; p.x+p.w){ onPlat=p; break; }
    }
    if(!onPlat){ drown(); return; }
    // ride: move hero pixel with platform, then snap col when settled
    hero.x += lane.dir*lane.speed*step;
    hero.col = Math.round((hero.x - (CELL-30)/2)/CELL);
    if(hero.x &lt; -10 || hero.x &gt; FIELD_W-10){ drown(); return; }
    heroEl.style.left = hero.x+&#x27;px&#x27;;
    hero.col = Math.max(0, Math.min(COLS-1, Math.round((hero.x-(CELL-30)/2)/CELL)));
  }

  animId = requestAnimationFrame(tick);
}

function crash(){
  running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
  splat();
  fx(&#x27;💥&#x27;, hero.col*CELL+CELL/2, hero.row*CELL+CELL/2);
  setTimeout(function(){ afterHit(); },450);
}
function drown(){
  running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
  splat();
  fx(&#x27;💦&#x27;, hero.col*CELL+CELL/2, hero.row*CELL+CELL/2);
  ripple(hero.col*CELL+CELL/2, hero.row*CELL+CELL/2);
  setTimeout(function(){ afterHit(); },450);
}
function afterHit(){
  resetHero();
  running=true; lastFrame=0; animId=requestAnimationFrame(tick);
}

function hop(){
  boing();
  heroEl.classList.remove(&#x27;hop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hop&#x27;);
}

function move(dc,dr){
  if(!running) return;
  var nc = Math.max(0, Math.min(COLS-1, hero.col+dc));
  var nr = Math.max(0, Math.min(ROWS-1, hero.row+dr));
  if(nc===hero.col &amp;&amp; nr===hero.row) return;
  hero.col=nc; hero.row=nr;
  heroPixel(); paintHero(); hop();
  if(hero.row===0){
    score++; scoreEl.textContent=score;
    if(score&gt;best){ best=score; bestEl.textContent=best; }
    coinEl.classList.remove(&#x27;spin&#x27;); void coinEl.offsetWidth; coinEl.classList.add(&#x27;spin&#x27;);
    chime();
    ripple(hero.col*CELL+CELL/2, CELL/2);
    fx(&#x27;⭐&#x27;, hero.col*CELL+CELL/2, CELL/2);
    // rebuild with new difficulty then reset
    running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
    setTimeout(function(){
      buildLanes(); makeHero(); resetHero();
      running=true; lastFrame=0; animId=requestAnimationFrame(tick);
    }, 260);
  }
}

function startGame(){
  if(running) return;
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  buildLanes(); makeHero(); resetHero();
  running=true; lastFrame=0; animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false; if(animId){cancelAnimationFrame(animId);animId=null;}
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  var k=e.key.toLowerCase();
  if(k===&#x27;arrowleft&#x27;||k===&#x27;a&#x27;){ move(-1,0); e.preventDefault(); }
  else if(k===&#x27;arrowright&#x27;||k===&#x27;d&#x27;){ move(1,0); e.preventDefault(); }
  else if(k===&#x27;arrowup&#x27;||k===&#x27;w&#x27;){ move(0,-1); e.preventDefault(); }
  else if(k===&#x27;arrowdown&#x27;||k===&#x27;s&#x27;){ move(0,1); e.preventDefault(); }
});
window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial paint (stopped)
buildLanes(); makeHero(); resetHero();
&lt;/script&gt;

 * Reports engagement events to the parent so customer-phase telemetry

    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;

  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.

        stack: err.stack || null,
