<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }

  canvas { display: block; width: 640px; height: 100%; border-radius: 8px;
           background: #02030a; box-shadow: 0 0 24px #04a6 inset, 0 0 12px #0ff3; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NOVA RAIDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt;, hold &lt;strong&gt;Space&lt;/strong&gt; to fire plasma (don&#x27;t overheat!), and tap &lt;strong&gt;Shift&lt;/strong&gt; for a Nova Burst that clears the screen. Survive the escalating alien waves and rack up points!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;meters&quot;&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span&gt;NOVA&lt;/span&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i id=&quot;novaFill&quot; style=&quot;background:linear-gradient(90deg,#a4f,#4af)&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span&gt;HEAT&lt;/span&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i id=&quot;heatFill&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;meter&quot;&gt;&lt;span&gt;WAVE&lt;/span&gt;&lt;div class=&quot;score&quot; style=&quot;font-size:20px;color:#6ef;text-shadow:0 0 8px #0ff&quot;&gt;&lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;);
var ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 440;

var scoreEl = document.getElementById(&#x27;score&#x27;);
var waveEl = document.getElementById(&#x27;wave&#x27;);
var novaFill = document.getElementById(&#x27;novaFill&#x27;);
var heatFill = document.getElementById(&#x27;heatFill&#x27;);

var running = false, animId = null;
var keys = {};
var stars = [];
var bullets = [], enemies = [], particles = [];
var score = 0, wave = 1;
var shipX, shipY;
var SHIP_W = 34, SHIP_H = 28, SHIP_SPEED = 6;
var lastShot = 0;
var heat = 0, overheated = false;      // 0..100
var nova = 0;                          // 0..100 (100 = ready)
var NOVA_MAX = 100, NOVA_RECHARGE = 100/8; // per second (~8s)
var spawnTimer = 0, spawnInterval = 1.1; // seconds
var diffTimer = 0;
var lastT = 0;
var gameOver = false;

function initStars(){
  stars = [];
  for(var i=0;i&lt;90;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H,
      s:Math.random()*1.8+0.4, v:Math.random()*40+20,
      tw:Math.random()*Math.PI*2});
  }
}

function reset(){
  bullets=[]; enemies=[]; particles=[];
  score=0; wave=1;
  shipX=(W-SHIP_W)/2; shipY=H-SHIP_H-14;
  lastShot=0; heat=0; overheated=false;
  nova=NOVA_MAX;
  spawnTimer=0; spawnInterval=1.1; diffTimer=0;
  gameOver=false;
  for(var k in keys) keys[k]=false;
  initStars();
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  novaFill.style.width = (nova/NOVA_MAX*100)+&#x27;%&#x27;;
  heatFill.style.width = heat+&#x27;%&#x27;;
  heatFill.style.opacity = overheated ? 0.6 : 1;
}

/* ---------- spawning ---------- */
function spawnEnemy(){
  var r = Math.random();
  var type;
  if(r &lt; 0.12) type=&#x27;saucer&#x27;;
  else if(r &lt; 0.42) type=&#x27;brute&#x27;;
  else type=&#x27;darter&#x27;;

  var speedScale = 1 + (wave-1)*0.12;
  if(type===&#x27;darter&#x27;){
    enemies.push({type:&#x27;darter&#x27;, x:Math.random()*(W-24)+12, y:-20,
      r:11, vy:(85+Math.random()*40)*speedScale, hp:1,
      phase:Math.random()*Math.PI*2, amp:Math.random()*60+30, flash:0});
  } else if(type===&#x27;brute&#x27;){
    enemies.push({type:&#x27;brute&#x27;, x:Math.random()*(W-40)+20, y:-30,
      r:19, vy:(45+Math.random()*20)*speedScale, hp:2,
      vx:(Math.random()&lt;0.5?-1:1)*(20+Math.random()*20), flash:0});
  } else {
    var dir = Math.random()&lt;0.5?1:-1;
    enemies.push({type:&#x27;saucer&#x27;, x:dir&gt;0?-24:W+24, y:40+Math.random()*120,
      r:16, vx:dir*(150+Math.random()*60)*speedScale, vy:0, hp:1, flash:0});
  }
}

/* ---------- shooting ---------- */
function fire(t){
  if(overheated) return;
  if(t - lastShot &lt; 130) return;
  lastShot = t;
  bullets.push({x:shipX+SHIP_W/2, y:shipY-4, vy:-560});
  heat += 9;
  if(heat &gt;= 100){ heat=100; overheated=true; }
}

function novaBurst(){
  if(nova &lt; NOVA_MAX) return;
  nova = 0;
  // destroy all enemies with sparks
  for(var i=0;i&lt;enemies.length;i++){
    var e=enemies[i];
    score += e.type===&#x27;saucer&#x27;?5:e.type===&#x27;brute&#x27;?3:1;
    explode(e.x,e.y, e.type===&#x27;saucer&#x27;?&#x27;#fd4&#x27;:e.type===&#x27;brute&#x27;?&#x27;#f83&#x27;:&#x27;#c6f&#x27;, 22);
  }
  enemies=[];
  // ring shock particles
  for(var a=0;a&lt;40;a++){
    var ang=a/40*Math.PI*2;
    particles.push({x:W/2,y:shipY,vx:Math.cos(ang)*260,vy:Math.sin(ang)*260,
      life:0.6,max:0.6,col:&#x27;#6cf&#x27;,sz:3});
  }
}

function explode(x,y,col,n){
  for(var i=0;i&lt;n;i++){
    var ang=Math.random()*Math.PI*2, sp=Math.random()*160+40;
    particles.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      life:Math.random()*0.5+0.3, max:0.8, col:col, sz:Math.random()*2.5+1});
  }
}

/* ---------- update ---------- */
function update(dt){
  // difficulty
  diffTimer += dt;
  if(diffTimer &gt;= 15){
    diffTimer -= 15;
    wave++;
    spawnInterval = Math.max(0.35, spawnInterval*0.82);
  }

  // stars
  for(var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    s.y += s.v*dt;
    s.tw += dt*4;
    if(s.y&gt;H){ s.y=-2; s.x=Math.random()*W; }
  }

  // ship move
  if(keys[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
  if(keys[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
  shipX = Math.max(0, Math.min(W-SHIP_W, shipX));

  // firing
  if(keys[&#x27; &#x27;]) fire(performance.now());

  // heat cooldown
  if(!keys[&#x27; &#x27;] || overheated){
    heat -= (overheated?18:28)*dt;
    if(heat&lt;=0){ heat=0; overheated=false; }
  }

  // nova recharge
  if(nova&lt;NOVA_MAX){ nova += NOVA_RECHARGE*dt; if(nova&gt;NOVA_MAX) nova=NOVA_MAX; }

  // spawn
  spawnTimer += dt;
  if(spawnTimer &gt;= spawnInterval){ spawnTimer=0; spawnEnemy(); }

  // bullets
  for(var b=bullets.length-1;b&gt;=0;b--){
    bullets[b].y += bullets[b].vy*dt;
    if(bullets[b].y &lt; -10) bullets.splice(b,1);
  }

  // enemies
  for(var e=enemies.length-1;e&gt;=0;e--){
    var en=enemies[e];
    if(en.flash&gt;0) en.flash-=dt;
    if(en.type===&#x27;darter&#x27;){
      en.y += en.vy*dt;
      en.phase += dt*3;
      en.x += Math.sin(en.phase)*en.amp*dt;
    } else if(en.type===&#x27;brute&#x27;){
      en.y += en.vy*dt;
      en.x += en.vx*dt;
      if(en.x&lt;20||en.x&gt;W-20) en.vx*=-1;
    } else { // saucer
      en.x += en.vx*dt;
    }
    // remove off-screen
    if(en.y&gt;H+30 || en.x&lt;-40 || en.x&gt;W+40){ enemies.splice(e,1); continue; }
    // collision with ship
    if(en.y+en.r&gt;shipY &amp;&amp; en.x&gt;shipX-8 &amp;&amp; en.x&lt;shipX+SHIP_W+8){
      explode(shipX+SHIP_W/2, shipY,&#x27;#f44&#x27;,30);
      endGame();
      return;
    }
  }

  // bullet-enemy collisions
  for(var bi=bullets.length-1;bi&gt;=0;bi--){
    var bl=bullets[bi];
    for(var ei=enemies.length-1;ei&gt;=0;ei--){
      var em=enemies[ei];
      var dx=bl.x-em.x, dy=bl.y-em.y;
      if(dx*dx+dy*dy &lt; (em.r+3)*(em.r+3)){
        bullets.splice(bi,1);
        em.hp--;
        if(em.hp&lt;=0){
          score += em.type===&#x27;saucer&#x27;?5:em.type===&#x27;brute&#x27;?3:1;
          explode(em.x,em.y, em.type===&#x27;saucer&#x27;?&#x27;#fd4&#x27;:em.type===&#x27;brute&#x27;?&#x27;#f83&#x27;:&#x27;#c6f&#x27;,
            em.type===&#x27;brute&#x27;?24:14);
          enemies.splice(ei,1);
        } else {
          em.flash=0.15;
          explode(em.x,em.y,&#x27;#fff&#x27;,5);
        }
        break;
      }
    }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    pt.vx*=0.94; pt.vy*=0.94;
    pt.life-=dt;
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  updateHUD();
}

function endGame(){
  gameOver=true;
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  drawGameOver();
}

/* ---------- draw ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  // stars
  for(var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    var a=0.4+0.6*Math.abs(Math.sin(s.tw));
    ctx.globalAlpha=a;
    ctx.fillStyle=&#x27;#dff&#x27;;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha=1;

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx.fillStyle=pt.col;
    ctx.beginPath();
    ctx.arc(pt.x,pt.y,pt.sz,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // bullets
  for(var b=0;b&lt;bullets.length;b++){
    var bl=bullets[b];
    var g=ctx.createLinearGradient(0,bl.y-8,0,bl.y+4);
    g.addColorStop(0,&#x27;#0ff&#x27;); g.addColorStop(1,&#x27;#08f&#x27;);
    ctx.fillStyle=g;
    ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=8;
    ctx.fillRect(bl.x-2, bl.y-8, 4, 12);
    ctx.shadowBlur=0;
  }

  // enemies
  for(var e=0;e&lt;enemies.length;e++) drawEnemy(enemies[e]);

  // ship
  if(!gameOver) drawShip();
}

function drawShip(){
  var cx=shipX+SHIP_W/2, cy=shipY+SHIP_H/2;
  // engine glow
  ctx.fillStyle=&#x27;rgba(0,200,255,0.4)&#x27;;
  ctx.beginPath();
  ctx.ellipse(cx, cy+18, 8, 12+Math.random()*4, 0,0,Math.PI*2);
  ctx.fill();
  var g=ctx.createLinearGradient(0,shipY,0,shipY+SHIP_H);
  g.addColorStop(0,&#x27;#8ff&#x27;); g.addColorStop(1,&#x27;#06c&#x27;);
  ctx.fillStyle=g;
  ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.moveTo(cx, shipY);
  ctx.lineTo(shipX+SHIP_W, shipY+SHIP_H);
  ctx.lineTo(cx, shipY+SHIP_H-8);
  ctx.lineTo(shipX, shipY+SHIP_H);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#fff&#x27;;
  ctx.beginPath(); ctx.arc(cx, shipY+12, 3,0,Math.PI*2); ctx.fill();
}

function drawEnemy(en){
  ctx.save();
  ctx.translate(en.x,en.y);
  var flash = en.flash&gt;0;
  if(en.type===&#x27;darter&#x27;){
    var g=ctx.createRadialGradient(0,0,2,0,0,en.r);
    g.addColorStop(0,&#x27;#f9f&#x27;); g.addColorStop(1,&#x27;#93f&#x27;);
    ctx.fillStyle=flash?&#x27;#fff&#x27;:g;
    ctx.shadowColor=&#x27;#c6f&#x27;; ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(0,-en.r);
    ctx.lineTo(en.r,en.r*0.7);
    ctx.lineTo(0,en.r*0.3);
    ctx.lineTo(-en.r,en.r*0.7);
    ctx.closePath(); ctx.fill();
  } else if(en.type===&#x27;brute&#x27;){
    var g2=ctx.createRadialGradient(-4,-4,3,0,0,en.r);
    g2.addColorStop(0,&#x27;#fd8&#x27;); g2.addColorStop(1,&#x27;#e60&#x27;);
    ctx.fillStyle=flash?&#x27;#fff&#x27;:g2;
    ctx.shadowColor=&#x27;#f83&#x27;; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,0,en.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=flash?&#x27;#fd8&#x27;:&#x27;#601&#x27;;
    ctx.beginPath(); ctx.arc(-5,-2,3,0,Math.PI*2); ctx.arc(5,-2,3,0,Math.PI*2); ctx.fill();
  } else { // saucer
    var g3=ctx.createLinearGradient(0,-en.r,0,en.r);
    g3.addColorStop(0,&#x27;#ffd&#x27;); g3.addColorStop(1,&#x27;#e90&#x27;);
    ctx.fillStyle=flash?&#x27;#fff&#x27;:g3;
    ctx.shadowColor=&#x27;#fd4&#x27;; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.ellipse(0,0,en.r,en.r*0.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=&#x27;#fff&#x27;;
    ctx.beginPath(); ctx.ellipse(0,-4,en.r*0.5,en.r*0.35,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.shadowBlur=0;
}

function drawGameOver(){
  draw();
  ctx.fillStyle=&#x27;rgba(0,0,10,0.6)&#x27;;
  ctx.fillRect(0,0,W,H);
  ctx.textAlign=&#x27;center&#x27;;
  ctx.fillStyle=&#x27;#f55&#x27;;
  ctx.shadowColor=&#x27;#f00&#x27;; ctx.shadowBlur=18;
  ctx.font=&#x27;800 40px system-ui,sans-serif&#x27;;
  ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-10);
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#ff5&#x27;;
  ctx.font=&#x27;700 22px system-ui,sans-serif&#x27;;
  ctx.fillText(&#x27;Score &#x27;+score+&#x27;  •  Wave &#x27;+wave, W/2, H/2+28);
  ctx.fillStyle=&#x27;#9ab&#x27;;
  ctx.font=&#x27;16px system-ui,sans-serif&#x27;;
  ctx.fillText(&#x27;Press Start below to play again&#x27;, W/2, H/2+58);
  ctx.textAlign=&#x27;start&#x27;;
}

/* ---------- loop ---------- */
function loop(t){
  if(!running) return;
  var dt=(t-lastT)/1000;
  lastT=t;
  if(dt&gt;0.05) dt=0.05;
  update(dt);
  if(!running) return; // may have ended
  draw();
  animId=requestAnimationFrame(loop);
}

function startGame(){
  if(running) return;
  reset();
  running=true;
  lastT=performance.now();
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

/* ---------- input ---------- */
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;||e.key===&#x27; &#x27;){ keys[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27;Shift&#x27;){ if(running) novaBurst(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;||e.key===&#x27; &#x27;) keys[e.key]=false;
});
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
initStars();
shipX=(W-SHIP_W)/2; shipY=H-SHIP_H-14;
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
