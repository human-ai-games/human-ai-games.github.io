<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05020f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 2px;
       color: #4df; text-shadow: 0 0 8px #08f, 0 0 16px #06f; }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 640px; font-size: 18px; }
  .hud .item { color: #6fe; text-shadow: 0 0 6px #0af; }
  #lives { letter-spacing: 3px; }
  canvas { border-radius: 8px; box-shadow: 0 0 24px #14f6, inset 0 0 40px #0006; display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the mouse or &amp;larr; &amp;rarr; keys to bounce the comet up and smash the aliens. Don&#x27;t let the comet slip past the bottom — you have three lives!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;item&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;item&quot;&gt;WAVE &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;item&quot;&gt;LIVES &lt;span id=&quot;lives&quot;&gt;▲ ▲ ▲&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;),
    waveEl = document.getElementById(&#x27;wave&#x27;),
    livesEl = document.getElementById(&#x27;lives&#x27;);

var PADDLE_W = 96, PADDLE_H = 12, PADDLE_Y = H - 26;
var running = false, animId = null, serveTimer = null;
var keys = {};
var paddleX = (W - PADDLE_W) / 2, paddleTargetX = paddleX, useMouse = false;
var paddleFlash = 0;
var score = 0, wave = 1, lives = 3, gameOver = false;

var BASE_SPEED = 4.4;
var comet = { x: W/2, y: H/2, vx: 0, vy: 0, r: 8, speed: BASE_SPEED, trail: [], alive: true };
var aliens = [], particles = [], stars = [];

var ROW_COLORS = [&#x27;#ff4d6d&#x27;, &#x27;#ffd23f&#x27;, &#x27;#3dfca8&#x27;];
var ROW_POINTS = [3, 2, 1];

function initStars() {
  stars = [];
  for (var i = 0; i &lt; 70; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H,
      s: Math.random()*1.6 + 0.4, sp: Math.random()*0.4 + 0.1 });
  }
}

function spawnWave() {
  aliens = [];
  var cols = 9, aw = 54, ah = 22, gapX = 10, gapY = 14;
  var totalW = cols*aw + (cols-1)*gapX;
  var startX = (W - totalW)/2, startY = 44;
  for (var r = 0; r &lt; 3; r++) {
    for (var c = 0; c &lt; cols; c++) {
      aliens.push({
        x: startX + c*(aw+gapX), y: startY + r*(ah+gapY),
        w: aw, h: ah, color: ROW_COLORS[r], pts: ROW_POINTS[r], alive: true
      });
    }
  }
}

function serveComet() {
  comet.x = W/2;
  comet.y = PADDLE_Y - 60;
  var ang = (Math.random()*0.6 - 0.3) - Math.PI/2; // upward-ish... actually serve downward toward paddle
  // serve heading down toward paddle so player must react
  comet.vx = (Math.random() &lt; 0.5 ? -1 : 1) * comet.speed * 0.5;
  comet.vy = comet.speed;
  comet.trail = [];
  comet.alive = true;
}

function resetGame() {
  score = 0; wave = 1; lives = 3; gameOver = false;
  comet.speed = BASE_SPEED;
  paddleX = paddleTargetX = (W - PADDLE_W)/2;
  paddleFlash = 0;
  particles = [];
  initStars();
  spawnWave();
  serveComet();
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  livesEl.textContent = lives &gt; 0 ? Array(lives).fill(&#x27;▲&#x27;).join(&#x27; &#x27;) : &#x27;—&#x27;;
}

function explode(x, y, color, n) {
  for (var i = 0; i &lt; n; i++) {
    var a = Math.random()*Math.PI*2, sp = Math.random()*3 + 1;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, color: color });
  }
}

// simple beep
var audioCtx = null;
function beep(freq, dur, type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

function loseLife() {
  lives--;
  updateHUD();
  comet.alive = false;
  beep(120, 0.3, &#x27;sawtooth&#x27;);
  if (lives &lt;= 0) {
    gameOver = true;
    running = false;
    return;
  }
  serveTimer = setTimeout(function() {
    if (gameOver) return;
    serveComet();
  }, 500);
}

function update() {
  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    stars[i].y += stars[i].sp;
    if (stars[i].y &gt; H) { stars[i].y = 0; stars[i].x = Math.random()*W; }
  }

  // paddle
  if (!useMouse) {
    if (keys[&#x27;ArrowLeft&#x27;]) paddleTargetX -= 8;
    if (keys[&#x27;ArrowRight&#x27;]) paddleTargetX += 8;
  }
  paddleTargetX = Math.max(0, Math.min(W - PADDLE_W, paddleTargetX));
  paddleX += (paddleTargetX - paddleX) * 0.35;
  if (paddleFlash &gt; 0) paddleFlash--;

  // comet
  if (comet.alive) {
    comet.trail.push({ x: comet.x, y: comet.y });
    if (comet.trail.length &gt; 12) comet.trail.shift();
    comet.x += comet.vx;
    comet.y += comet.vy;

    if (comet.x - comet.r &lt;= 0) { comet.x = comet.r; comet.vx = Math.abs(comet.vx); }
    if (comet.x + comet.r &gt;= W) { comet.x = W - comet.r; comet.vx = -Math.abs(comet.vx); }
    if (comet.y - comet.r &lt;= 0) { comet.y = comet.r; comet.vy = Math.abs(comet.vy); }

    // paddle collision
    if (comet.vy &gt; 0 &amp;&amp;
        comet.y + comet.r &gt;= PADDLE_Y &amp;&amp;
        comet.y + comet.r &lt;= PADDLE_Y + PADDLE_H + 10 &amp;&amp;
        comet.x &gt;= paddleX - comet.r &amp;&amp; comet.x &lt;= paddleX + PADDLE_W + comet.r) {
      var hit = (comet.x - (paddleX + PADDLE_W/2)) / (PADDLE_W/2); // -1..1
      comet.speed += 0.12;
      var ang = hit * 1.0 - Math.PI/2; // aim upward with angle
      comet.vx = Math.cos(ang) * comet.speed * 1.3;
      comet.vy = -Math.abs(Math.sin(ang) * comet.speed) - comet.speed*0.4;
      // normalize to speed
      var mag = Math.hypot(comet.vx, comet.vy);
      comet.vx = comet.vx / mag * comet.speed;
      comet.vy = comet.vy / mag * comet.speed;
      if (comet.vy &gt; -1) comet.vy = -comet.speed*0.7;
      comet.y = PADDLE_Y - comet.r;
      paddleFlash = 10;
      beep(440, 0.06, &#x27;square&#x27;);
    }

    // alien collisions
    for (var a = 0; a &lt; aliens.length; a++) {
      var al = aliens[a];
      if (!al.alive) continue;
      if (comet.x + comet.r &gt;= al.x &amp;&amp; comet.x - comet.r &lt;= al.x + al.w &amp;&amp;
          comet.y + comet.r &gt;= al.y &amp;&amp; comet.y - comet.r &lt;= al.y + al.h) {
        al.alive = false;
        score += al.pts;
        explode(al.x + al.w/2, al.y + al.h/2, al.color, 18);
        beep(600 + al.pts*120, 0.08, &#x27;square&#x27;);
        // bounce: determine side
        var overlapX = Math.min(comet.x + comet.r - al.x, al.x + al.w - (comet.x - comet.r));
        var overlapY = Math.min(comet.y + comet.r - al.y, al.y + al.h - (comet.y - comet.r));
        if (overlapX &lt; overlapY) comet.vx = -comet.vx; else comet.vy = -comet.vy;
        updateHUD();
        break;
      }
    }

    // check wave clear
    var remaining = 0;
    for (var b = 0; b &lt; aliens.length; b++) if (aliens[b].alive) remaining++;
    if (remaining === 0) {
      wave++;
      comet.speed += 0.5;
      spawnWave();
      updateHUD();
    }

    // bottom
    if (comet.y - comet.r &gt; H) {
      loseLife();
    }
  }

  // particles
  for (var p = particles.length - 1; p &gt;= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += 0.05;
    pt.life -= 0.025;
    if (pt.life &lt;= 0) particles.splice(p, 1);
  }
}

function draw() {
  ctx.fillStyle = &#x27;#05020f&#x27;;
  ctx.fillRect(0, 0, W, H);

  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    var s = stars[i];
    ctx.globalAlpha = 0.5 + s.s/2.5;
    ctx.fillStyle = &#x27;#cfe&#x27;;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // aliens
  for (var a = 0; a &lt; aliens.length; a++) {
    var al = aliens[a];
    if (!al.alive) continue;
    ctx.save();
    ctx.shadowColor = al.color; ctx.shadowBlur = 12;
    ctx.fillStyle = al.color;
    roundRect(al.x, al.y, al.w, al.h, 6);
    ctx.fill();
    ctx.restore();
    // eyes
    ctx.fillStyle = &#x27;#05020f&#x27;;
    ctx.beginPath();
    ctx.arc(al.x + al.w*0.35, al.y + al.h*0.5, 3, 0, 7);
    ctx.arc(al.x + al.w*0.65, al.y + al.h*0.5, 3, 0, 7);
    ctx.fill();
  }

  // particles
  for (var p = 0; p &lt; particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // comet trail
  if (comet.alive) {
    for (var t = 0; t &lt; comet.trail.length; t++) {
      var tr = comet.trail[t];
      var alpha = t / comet.trail.length;
      ctx.globalAlpha = alpha * 0.6;
      ctx.fillStyle = &#x27;#ff9&#x27;;
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, comet.r * alpha, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // comet body
    ctx.save();
    ctx.shadowColor = &#x27;#ffdd55&#x27;; ctx.shadowBlur = 20;
    var grad = ctx.createRadialGradient(comet.x, comet.y, 1, comet.x, comet.y, comet.r);
    grad.addColorStop(0, &#x27;#fff&#x27;); grad.addColorStop(0.5, &#x27;#ffd23f&#x27;); grad.addColorStop(1, &#x27;#ff6a00&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(comet.x, comet.y, comet.r, 0, 7); ctx.fill();
    ctx.restore();
  }

  // paddle
  ctx.save();
  var pc = paddleFlash &gt; 0 ? &#x27;#4df&#x27; : &#x27;#a4f&#x27;;
  ctx.shadowColor = pc; ctx.shadowBlur = paddleFlash &gt; 0 ? 24 : 14;
  ctx.fillStyle = pc;
  roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
  ctx.fill();
  // ship fins
  ctx.beginPath();
  ctx.moveTo(paddleX + PADDLE_W/2 - 14, PADDLE_Y);
  ctx.lineTo(paddleX + PADDLE_W/2, PADDLE_Y - 12);
  ctx.lineTo(paddleX + PADDLE_W/2 + 14, PADDLE_Y);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // game over
  if (gameOver) {
    ctx.fillStyle = &#x27;rgba(5,2,15,0.75)&#x27;;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillStyle = &#x27;#ff4d6d&#x27;;
    ctx.shadowColor = &#x27;#f06&#x27;; ctx.shadowBlur = 16;
    ctx.font = &#x27;bold 40px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;#6fe&#x27;;
    ctx.font = &#x27;bold 22px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 28);
    ctx.fillStyle = &#x27;#9ab&#x27;;
    ctx.font = &#x27;16px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2 + 58);
    ctx.textAlign = &#x27;left&#x27;;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function loop() {
  if (!running) { draw(); return; }
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  if (running) return;
  if (serveTimer) { clearTimeout(serveTimer); serveTimer = null; }
  for (var k in keys) keys[k] = false;
  useMouse = false;
  resetGame();
  running = true;
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (serveTimer) { clearTimeout(serveTimer); serveTimer = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) {
    keys[e.key] = true; useMouse = false; e.preventDefault();
  }
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function(e) {
  var rect = cv.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (W / rect.width);
  paddleTargetX = mx - PADDLE_W/2;
  useMouse = true;
});
cv.addEventListener(&#x27;touchmove&#x27;, function(e) {
  var rect = cv.getBoundingClientRect();
  var mx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  paddleTargetX = mx - PADDLE_W/2;
  useMouse = true;
  e.preventDefault();
}, { passive: false });

window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static render
initStars();
spawnWave();
comet.alive = false;
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
