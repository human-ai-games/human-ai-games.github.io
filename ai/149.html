<style>

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060d; color: #d8f5ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       color: #39ff14; text-shadow: 0 0 8px #39ff14, 0 0 18px #0f8; }
  .instructions { font-size: 16px; color: #8fb8c8; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 20px; }
  .hud .score { color: #ffe14d; text-shadow: 0 0 6px #ffe14d; }
  .hud .combo { color: #ff5cc8; text-shadow: 0 0 6px #ff5cc8; }
  .barwrap { width: 480px; max-width: 90vw; height: 8px; background: #10131f; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 4px #000; }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg,#39ff14,#00e0ff); box-shadow: 0 0 8px #00e0ff; transition: width .1s linear; }
  .field { position: relative; width: 480px; height: 480px; max-width: 90vw; max-height: 90vw; flex-shrink: 0;
           background:
             linear-gradient(#0a0e1a 1px, transparent 1px) 0 0 / 5% 5%,
             linear-gradient(90deg,#0a0e1a 1px, transparent 1px) 0 0 / 5% 5%,
             radial-gradient(circle at 50% 50%, #0c1226, #05060d 75%);
           border: 1px solid #17324a; border-radius: 8px; overflow: hidden;
           box-shadow: 0 0 24px rgba(0,224,255,.15), inset 0 0 30px rgba(0,224,255,.06); }
  .seg { position: absolute; box-sizing: border-box; border-radius: 3px;
         background: #39ff14; box-shadow: 0 0 6px #39ff14; transition: left .12s linear, top .12s linear; }
  .head { z-index: 5; border-radius: 4px; }
  .eye { position: absolute; width: 22%; height: 22%; background: #041; border-radius: 50%; }
  .orb { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
         font-size: 18px; animation: pulse 1.1s ease-in-out infinite; pointer-events: none; }
  @keyframes pulse { 0%,100% { transform: scale(.82); opacity:.8; } 50% { transform: scale(1.08); opacity:1; } }
  .part { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; }
  .arrow { position: absolute; width: 54px; height: 54px; border-radius: 12px; background: rgba(0,224,255,.12);
           border: 1px solid rgba(0,224,255,.35); color: #8fe6ff; font-size: 24px; display:flex; align-items:center; justify-content:center;
           cursor: pointer; user-select: none; }
  .arrow:active { background: rgba(0,224,255,.3); }
  #aUp { left: 50%; transform: translateX(-50%); top: 6px; }
  #aDown { left: 50%; transform: translateX(-50%); bottom: 6px; }
  #aLeft { left: 6px; top: 50%; transform: translateY(-50%); }
  #aRight { right: 6px; top: 50%; transform: translateY(-50%); }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align:center;
         font-size: 24px; color: #ff5cc8; text-shadow: 0 0 10px #ff5cc8; background: rgba(5,6,13,.55); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys (or the corner buttons) to eat glowing orbs. Grab yellow stars (+1), blue gems (+3, speed boost) and pink bolts (+5, phase through yourself) — chain eats without dying to build your combo.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;Combo x&lt;span id=&quot;combo&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;barwrap&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aUp&quot;&gt;▲&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aDown&quot;&gt;▼&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aLeft&quot;&gt;◀&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aRight&quot;&gt;▶&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press Start below&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var COLS = 20, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var barEl = document.getElementById(&#x27;bar&#x27;);
  var msgEl = document.getElementById(&#x27;msg&#x27;);

  var cellW, cellH;
  function sizeCells() { cellW = field.clientWidth / COLS; cellH = field.clientHeight / ROWS; }

  var running = false, tickId = null, powerId = null;
  var snake = [], dir, pendingDir, score = 0, combo = 1;
  var baseTick = 130, tickMs = baseTick;
  var power = null, powerEnds = 0, powerDur = 0; // &#x27;speed&#x27; or &#x27;phase&#x27;
  var orbs = []; // {type, x, y, expires, born}
  var boltTimer = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.15, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function clearOrbEls() { Array.prototype.slice.call(field.querySelectorAll(&#x27;.orb,.seg,.part&#x27;)).forEach(function(e){e.remove();}); }

  function cellOccupied(x, y) {
    for (var i = 0; i &lt; snake.length; i++) if (snake[i].x === x &amp;&amp; snake[i].y === y) return true;
    return false;
  }
  function orbAt(x, y) { for (var i=0;i&lt;orbs.length;i++) if (orbs[i].x===x&amp;&amp;orbs[i].y===y) return true; return false; }

  function freeCell() {
    for (var t=0;t&lt;300;t++){ var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if (!cellOccupied(x,y) &amp;&amp; !orbAt(x,y)) return {x:x,y:y}; }
    return {x:0,y:0};
  }

  function spawnOrb(type, ttl) {
    var c = freeCell();
    orbs.push({ type:type, x:c.x, y:c.y, born:Date.now(), expires: ttl?Date.now()+ttl:0 });
  }

  function ensureStar() {
    for (var i=0;i&lt;orbs.length;i++) if (orbs[i].type===&#x27;star&#x27;) return;
    spawnOrb(&#x27;star&#x27;, 0);
  }

  function initSnake() {
    snake = [{x:6,y:10},{x:5,y:10},{x:4,y:10}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
  }

  var GLYPH = { star:&#x27;⭐&#x27;, gem:&#x27;💎&#x27;, bolt:&#x27;⚡&#x27; };

  function draw() {
    clearOrbEls();
    // orbs
    for (var i=0;i&lt;orbs.length;i++) {
      var o = orbs[i];
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;orb&#x27;;
      el.style.left=(o.x*cellW)+&#x27;px&#x27;; el.style.top=(o.y*cellH)+&#x27;px&#x27;;
      el.style.width=cellW+&#x27;px&#x27;; el.style.height=cellH+&#x27;px&#x27;;
      el.textContent = GLYPH[o.type];
      field.appendChild(el);
    }
    // snake color by power
    var col = &#x27;#39ff14&#x27;, glow = &#x27;#39ff14&#x27;;
    if (power===&#x27;speed&#x27;) { col=&#x27;#00e0ff&#x27;; glow=&#x27;#00e0ff&#x27;; }
    else if (power===&#x27;phase&#x27;) { col=&#x27;#ff44dd&#x27;; glow=&#x27;#ff44dd&#x27;; }
    for (var j=snake.length-1;j&gt;=0;j--) {
      var s = snake[j];
      var seg = document.createElement(&#x27;div&#x27;);
      seg.className = &#x27;seg&#x27; + (j===0?&#x27; head&#x27;:&#x27;&#x27;);
      seg.style.left=(s.x*cellW)+&#x27;px&#x27;; seg.style.top=(s.y*cellH)+&#x27;px&#x27;;
      seg.style.width=cellW+&#x27;px&#x27;; seg.style.height=cellH+&#x27;px&#x27;;
      seg.style.background=col; seg.style.boxShadow=&#x27;0 0 8px &#x27;+glow;
      if (j===0) {
        seg.style.filter=&#x27;brightness(1.4)&#x27;;
        var e1=document.createElement(&#x27;div&#x27;); e1.className=&#x27;eye&#x27;;
        var e2=document.createElement(&#x27;div&#x27;); e2.className=&#x27;eye&#x27;;
        e1.style.left=&#x27;18%&#x27;; e1.style.top=&#x27;20%&#x27;; e2.style.right=&#x27;18%&#x27;; e2.style.top=&#x27;20%&#x27;;
        seg.appendChild(e1); seg.appendChild(e2);
      }
      field.appendChild(seg);
    }
  }

  function setPower(type, dur) {
    power = type; powerDur = dur; powerEnds = Date.now()+dur;
    tickMs = (type===&#x27;speed&#x27;) ? Math.round(baseTick*0.7) : baseTick;
    restartTick();
  }
  function updatePowerBar() {
    if (!power) { barEl.style.width=&#x27;0%&#x27;; return; }
    var left = powerEnds - Date.now();
    if (left &lt;= 0) { power=null; tickMs=baseTick; restartTick(); barEl.style.width=&#x27;0%&#x27;; return; }
    barEl.style.width = (100*left/powerDur)+&#x27;%&#x27;;
  }

  function restartTick() {
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, tickMs);
  }

  function explode() {
    for (var i=0;i&lt;snake.length;i++) {
      var s=snake[i];
      for (var k=0;k&lt;2;k++){
        var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;part&#x27;;
        var cx=s.x*cellW+cellW/2, cy=s.y*cellH+cellH/2;
        p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
        p.style.background = power===&#x27;phase&#x27;?&#x27;#ff44dd&#x27;:(power===&#x27;speed&#x27;?&#x27;#00e0ff&#x27;:&#x27;#39ff14&#x27;);
        p.style.boxShadow=&#x27;0 0 6px currentColor&#x27;;
        field.appendChild(p);
        var ang=Math.random()*Math.PI*2, dist=20+Math.random()*40;
        (function(el,dx,dy){
          var start=Date.now();
          function anim(){ var t=(Date.now()-start)/550; if(t&gt;=1){el.remove();return;}
            el.style.transform=&#x27;translate(&#x27;+(dx*t)+&#x27;px,&#x27;+(dy*t)+&#x27;px)&#x27;;
            el.style.opacity=(1-t); requestAnimationFrame(anim); }
          requestAnimationFrame(anim);
        })(p, Math.cos(ang)*dist, Math.sin(ang)*dist);
      }
    }
  }

  function endGame() {
    running=false;
    if (tickId){clearInterval(tickId);tickId=null;}
    beep(90,.4,&#x27;sawtooth&#x27;);
    Array.prototype.slice.call(field.querySelectorAll(&#x27;.seg&#x27;)).forEach(function(e){e.remove();});
    explode();
    msgEl.textContent=&#x27;GAME OVER — Score &#x27;+score;
    msgEl.style.display=&#x27;flex&#x27;;
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    // orb expiry
    orbs = orbs.filter(function(o){ return !(o.expires &amp;&amp; now&gt;o.expires); });
    ensureStar();
    // bolt spawner
    boltTimer += tickMs;
    if (boltTimer &gt;= 10000) { boltTimer = 0; spawnOrb(&#x27;bolt&#x27;, 3000); beep(700,.08,&#x27;square&#x27;); }
    updatePowerBar();

    if (!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if (nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }

    // eat check
    var ate=null, ateIdx=-1;
    for (var i=0;i&lt;orbs.length;i++){ if(orbs[i].x===nx&amp;&amp;orbs[i].y===ny){ate=orbs[i];ateIdx=i;break;} }

    var body = ate ? snake : snake.slice(0, snake.length-1);
    if (power!==&#x27;phase&#x27;) {
      for (var b=0;b&lt;body.length;b++){ if(body[b].x===nx&amp;&amp;body[b].y===ny){ endGame(); return; } }
    }

    snake.unshift({x:nx,y:ny});
    if (ate) {
      orbs.splice(ateIdx,1);
      combo += 1;
      var val = ate.type===&#x27;star&#x27;?1:(ate.type===&#x27;gem&#x27;?3:5);
      score += val * combo;
      scoreEl.textContent=score; comboEl.textContent=combo;
      if (ate.type===&#x27;gem&#x27;) { setPower(&#x27;speed&#x27;,4000); beep(520,.12,&#x27;triangle&#x27;); }
      else if (ate.type===&#x27;bolt&#x27;) { setPower(&#x27;phase&#x27;,5000); beep(880,.15,&#x27;square&#x27;); }
      else beep(440,.08,&#x27;sine&#x27;);
      // occasional gem spawn
      if (ate.type===&#x27;star&#x27; &amp;&amp; Math.random()&lt;0.22) {
        var hasGem=false; for(var g=0;g&lt;orbs.length;g++) if(orbs[g].type===&#x27;gem&#x27;) hasGem=true;
        if(!hasGem) spawnOrb(&#x27;gem&#x27;,7000);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function startGame() {
    sizeCells();
    if (tickId) clearInterval(tickId);
    running=true;
    score=0; combo=1; scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;1&#x27;;
    power=null; tickMs=baseTick; boltTimer=0; barEl.style.width=&#x27;0%&#x27;;
    orbs=[];
    initSnake();
    ensureStar();
    spawnOrb(&#x27;gem&#x27;,7000);
    msgEl.style.display=&#x27;none&#x27;;
    draw();
    tickId=setInterval(tick, tickMs);
  }
  function stopGame() {
    running=false;
    if (tickId){clearInterval(tickId);tickId=null;}
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){setDir(-1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){setDir(1,0);e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){setDir(0,-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){setDir(0,1);e.preventDefault();}
  });
  function bindArrow(id,x,y){
    var el=document.getElementById(id);
    el.addEventListener(&#x27;mousedown&#x27;,function(ev){ev.stopPropagation();setDir(x,y);});
    el.addEventListener(&#x27;touchstart&#x27;,function(ev){ev.preventDefault();setDir(x,y);});
  }
  bindArrow(&#x27;aUp&#x27;,0,-1); bindArrow(&#x27;aDown&#x27;,0,1); bindArrow(&#x27;aLeft&#x27;,-1,0); bindArrow(&#x27;aRight&#x27;,1,0);

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  window.addEventListener(&#x27;resize&#x27;, function(){ sizeCells(); if(running) draw(); });

  // initial static paint
  sizeCells();
  initSnake();
  orbs=[{type:&#x27;star&#x27;,x:14,y:6,born:Date.now(),expires:0},{type:&#x27;gem&#x27;,x:8,y:14,born:Date.now(),expires:0}];
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
