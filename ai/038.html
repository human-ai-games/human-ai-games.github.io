<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #04060f; color: #cfefff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }

       color: #35e6ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #8fd0e6; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 640px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  .score { color: #35e6ff; font-weight: 700; text-shadow: 0 0 6px #0ff; font-size: 20px; }
  .combo { color: #ff8adf; font-weight: 700; min-height: 20px; }
  .timer { color: #ffe36b; font-weight: 700; }
  .lives { font-size: 18px; letter-spacing: 2px; }
  canvas { background: #061024; border-radius: 8px; box-shadow: 0 0 20px rgba(0,150,255,0.25) inset; display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON REEF&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your submarine with the &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to fire torpedoes at descending sea creatures. Don&#x27;t let any reach the bottom — you have three lives. Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/span&gt;
    &lt;span class=&quot;timer&quot;&gt;Survived: &lt;span id=&quot;timer&quot;&gt;0&lt;/span&gt;s&lt;/span&gt;
    &lt;span class=&quot;lives&quot; id=&quot;lives&quot;&gt;🚤🚤🚤&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);
var timerEl = document.getElementById(&#x27;timer&#x27;);
var livesEl = document.getElementById(&#x27;lives&#x27;);

var running = false, animId = null;
var keys = {};
var shipX, shipW = 44, shipH = 22, shipSpeed = 5;
var bullets, enemies, particles, bubbles;
var score, lives, lastShot, cooldown = 500;
var startTime, elapsed;
var spawnTimer, spawnInterval;
var diffLevel, enemySpeedMul;
var comboHits, comboActive, comboEndTime, lastHitTime;
var flashTime;

// audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch (_) {}
}

function initBubbles() {
  bubbles = [];
  for (var i = 0; i &lt; 40; i++) {
    bubbles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1 + Math.random() * 3,
      sp: 0.3 + Math.random() * 1.2,
      layer: Math.random()
    });
  }
}

function reset() {
  shipX = (W - shipW) / 2;
  bullets = []; enemies = []; particles = [];
  score = 0; lives = 3; lastShot = 0;
  elapsed = 0; startTime = Date.now();
  spawnTimer = 0; spawnInterval = 1300;
  diffLevel = 0; enemySpeedMul = 1;
  comboHits = 0; comboActive = false; comboEndTime = 0; lastHitTime = 0;
  flashTime = 0;
  for (var k in keys) keys[k] = false;
  initBubbles();
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  timerEl.textContent = elapsed;
  var icons = &#x27;&#x27;;
  for (var i = 0; i &lt; lives; i++) icons += &#x27;🚤&#x27;;
  livesEl.textContent = icons || &#x27;💀&#x27;;
  if (comboActive) {
    comboEl.textContent = &#x27;COMBO x2!&#x27;;
  } else if (comboHits &gt; 0) {
    comboEl.textContent = &#x27;Streak: &#x27; + comboHits;
  } else {
    comboEl.textContent = &#x27;&#x27;;
  }
}

// ---- enemy factory ----
function spawnEnemy(type, x, y, size) {
  var e;
  if (type === &#x27;jelly&#x27;) {
    e = { type:&#x27;jelly&#x27;, x:x, y:y, r:16, baseX:x, phase:Math.random()*6.28,
          vy:0.9, color:&#x27;#7affd6&#x27;, hp:1, points:1 };
  } else if (type === &#x27;eel&#x27;) {
    e = { type:&#x27;eel&#x27;, x:x, y:y, r:14, vy:1.6, zig:Math.random()*6.28,
          color:&#x27;#ffd24a&#x27;, hp:1, points:3 };
  } else if (type === &#x27;puffer&#x27;) {
    e = { type:&#x27;puffer&#x27;, x:x, y:y, r:size||20, vy:0.8,
          color:&#x27;#ff5ea8&#x27;, hp:1, points:2, isMini:!!(size&amp;&amp;size&lt;20) };
  }
  enemies.push(e);
}

function spawnWave() {
  var r = Math.random();
  var x = 30 + Math.random() * (W - 60);
  if (r &lt; 0.5) spawnEnemy(&#x27;jelly&#x27;, x, -20);
  else if (r &lt; 0.8) spawnEnemy(&#x27;puffer&#x27;, x, -24, 20);
  else spawnEnemy(&#x27;eel&#x27;, x, -18);
}

function fire() {
  var now = Date.now();
  if (now - lastShot &lt; cooldown) return;
  lastShot = now;
  bullets.push({ x: shipX + shipW/2, y: H - 40, vy: -8 });
  beep(880, 0.08, &#x27;square&#x27;, 0.05);
}

function burst(x, y, color, n) {
  for (var i = 0; i &lt; n; i++) {
    var a = Math.random() * 6.28, s = 1 + Math.random() * 3;
    particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, color:color, r:2+Math.random()*2 });
  }
}

function registerHit() {
  var now = Date.now();
  if (now - lastHitTime &lt; 2000) comboHits++;
  else comboHits = 1;
  lastHitTime = now;
  if (comboHits &gt;= 3 &amp;&amp; !comboActive) {
    comboActive = true;
    comboEndTime = now + 5000;
    beep(1320, 0.2, &#x27;triangle&#x27;, 0.08);
  }
}

function addScore(pts) {
  if (comboActive) pts *= 2;
  score += pts;
}

function killEnemy(idx) {
  var e = enemies[idx];
  registerHit();
  if (e.type === &#x27;jelly&#x27;) {
    burst(e.x, e.y, &#x27;#7affd6&#x27;, 14);
    addScore(1);
    beep(660, 0.1, &#x27;sine&#x27;, 0.06);
    enemies.splice(idx, 1);
  } else if (e.type === &#x27;eel&#x27;) {
    burst(e.x, e.y, &#x27;#ffffff&#x27;, 18);
    addScore(3);
    beep(300, 0.15, &#x27;sawtooth&#x27;, 0.07);
    enemies.splice(idx, 1);
  } else if (e.type === &#x27;puffer&#x27;) {
    if (!e.isMini) {
      addScore(1); // 1 for main, minis give 4 total more (approx 5 total)
      burst(e.x, e.y, &#x27;#ff5ea8&#x27;, 12);
      beep(440, 0.1, &#x27;square&#x27;, 0.06);
      enemies.splice(idx, 1);
      // spawn 3 spinning minis
      for (var k = 0; k &lt; 3; k++) {
        var ang = -0.6 + k * 0.6;
        var m = { type:&#x27;puffer&#x27;, x:e.x, y:e.y, r:11, vy:1.4,
          color:&#x27;#ffa8d4&#x27;, hp:1, points:0, isMini:true,
          vx:Math.sin(ang)*1.6, spin:Math.random()*6.28 };
        enemies.push(m);
      }
    } else {
      burst(e.x, e.y, &#x27;#ffa8d4&#x27;, 8);
      addScore(1); // ~ mini worth so full clear near 5
      beep(520, 0.08, &#x27;square&#x27;, 0.05);
      enemies.splice(idx, 1);
    }
  }
  updateHUD();
}

function loseLife(idx) {
  enemies.splice(idx, 1);
  lives--;
  flashTime = Date.now();
  comboHits = 0; comboActive = false;
  beep(120, 0.3, &#x27;sawtooth&#x27;, 0.09);
  updateHUD();
  if (lives &lt;= 0) gameOver();
}

function gameOver() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  animId = null;
}

function step() {
  if (!running) return;
  var now = Date.now();
  elapsed = Math.floor((now - startTime) / 1000);

  // difficulty ramp
  var newLevel = Math.floor(elapsed / 15);
  if (newLevel !== diffLevel) {
    diffLevel = newLevel;
    spawnInterval = Math.max(400, 1300 - diffLevel * 180);
    enemySpeedMul = 1 + diffLevel * 0.22;
  }

  if (comboActive &amp;&amp; now &gt; comboEndTime) { comboActive = false; comboHits = 0; }

  // movement
  if (keys[&#x27;ArrowLeft&#x27;]) shipX -= shipSpeed;
  if (keys[&#x27;ArrowRight&#x27;]) shipX += shipSpeed;
  shipX = Math.max(0, Math.min(W - shipW, shipX));

  // spawn
  spawnTimer += 16;
  if (spawnTimer &gt;= spawnInterval) { spawnTimer = 0; spawnWave(); }

  // bubbles
  for (var i = 0; i &lt; bubbles.length; i++) {
    var b = bubbles[i];
    b.y -= b.sp;
    if (b.y &lt; -5) { b.y = H + 5; b.x = Math.random() * W; }
  }

  // bullets
  for (var i = bullets.length - 1; i &gt;= 0; i--) {
    bullets[i].y += bullets[i].vy;
    if (bullets[i].y &lt; -10) bullets.splice(i, 1);
  }

  // enemies
  for (var j = enemies.length - 1; j &gt;= 0; j--) {
    var e = enemies[j];
    e.y += e.vy * enemySpeedMul;
    if (e.type === &#x27;jelly&#x27;) {
      e.phase += 0.05;
      e.x = e.baseX + Math.sin(e.phase) * 40;
    } else if (e.type === &#x27;eel&#x27;) {
      e.zig += 0.25;
      e.x += Math.sin(e.zig) * 3.2;
    } else if (e.type === &#x27;puffer&#x27; &amp;&amp; e.isMini) {
      e.x += (e.vx || 0);
      e.spin += 0.3;
    }
    if (e.x &lt; e.r) e.x = e.r;
    if (e.x &gt; W - e.r) e.x = W - e.r;
    if (e.y - e.r &gt; H - 20) { loseLife(j); continue; }
  }

  // collisions
  for (var b2 = bullets.length - 1; b2 &gt;= 0; b2--) {
    var bl = bullets[b2];
    for (var e2 = enemies.length - 1; e2 &gt;= 0; e2--) {
      var en = enemies[e2];
      var dx = bl.x - en.x, dy = bl.y - en.y;
      if (dx*dx + dy*dy &lt; (en.r + 4) * (en.r + 4)) {
        bullets.splice(b2, 1);
        killEnemy(e2);
        break;
      }
    }
  }

  // particles
  for (var p = particles.length - 1; p &gt;= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life -= 0.03;
    if (pt.life &lt;= 0) particles.splice(p, 1);
  }

  draw();
  animId = requestAnimationFrame(step);
}

function draw() {
  // background gradient
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, &#x27;#0a1a3a&#x27;); g.addColorStop(1, &#x27;#02060f&#x27;);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // parallax bubbles
  for (var i = 0; i &lt; bubbles.length; i++) {
    var b = bubbles[i];
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, 6.28);
    ctx.fillStyle = &#x27;rgba(120,200,255,&#x27; + (0.05 + b.layer * 0.12) + &#x27;)&#x27;;
    ctx.fill();
  }

  // coral silhouettes bottom
  ctx.fillStyle = &#x27;#050b1a&#x27;;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var c = 0; c &lt;= W; c += 40) {
    ctx.lineTo(c, H - 14 - 10 * Math.abs(Math.sin(c * 0.13)));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // particles
  for (var p = 0; p &lt; particles.length; p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // enemies
  for (var e = 0; e &lt; enemies.length; e++) drawEnemy(enemies[e]);

  // bullets (torpedoes)
  for (var b2 = 0; b2 &lt; bullets.length; b2++) {
    var bl = bullets[b2];
    ctx.save();
    ctx.shadowColor = &#x27;#5fffce&#x27;; ctx.shadowBlur = 10;
    ctx.fillStyle = &#x27;#aaffe6&#x27;;
    ctx.fillRect(bl.x - 2.5, bl.y - 8, 5, 14);
    ctx.restore();
  }

  // ship
  drawShip();

  // cooldown bar
  var now = Date.now();
  var ratio = Math.min(1, (now - lastShot) / cooldown);
  var barW = shipW, bx = shipX, by = H - 12;
  ctx.fillStyle = &#x27;rgba(255,255,255,0.15)&#x27;;
  ctx.fillRect(bx, by, barW, 4);
  ctx.fillStyle = ratio &gt;= 1 ? &#x27;#5fffce&#x27; : &#x27;#3aa0d8&#x27;;
  ctx.fillRect(bx, by, barW * ratio, 4);

  // combo banner
  if (comboActive) {
    ctx.save();
    var pulse = 0.6 + 0.4 * Math.sin(now * 0.01);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = &#x27;#ff8adf&#x27;;
    ctx.font = &#x27;bold 30px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = &#x27;#ff5ea8&#x27;; ctx.shadowBlur = 15;
    ctx.fillText(&#x27;COMBO x2&#x27;, W/2, 60);
    ctx.restore();
  }

  // red flash on life loss
  if (flashTime &amp;&amp; now - flashTime &lt; 300) {
    ctx.fillStyle = &#x27;rgba(255,40,40,&#x27; + (0.4 * (1 - (now - flashTime)/300)) + &#x27;)&#x27;;
    ctx.fillRect(0, 0, W, H);
  }

  // game over
  if (!running &amp;&amp; lives &lt;= 0) {
    ctx.fillStyle = &#x27;rgba(0,0,0,0.6)&#x27;;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = &#x27;#35e6ff&#x27;;
    ctx.font = &#x27;bold 40px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 14;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
    ctx.font = &#x27;20px system-ui&#x27;;
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;#cfefff&#x27;;
    ctx.fillText(&#x27;Score: &#x27; + score + &#x27; — press Restart below&#x27;, W/2, H/2 + 28);
  }
}

function drawEnemy(e) {
  ctx.save();
  ctx.shadowColor = e.color; ctx.shadowBlur = 14;
  ctx.fillStyle = e.color;
  if (e.type === &#x27;jelly&#x27;) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, Math.PI, 0);
    ctx.lineTo(e.x + e.r, e.y);
    ctx.lineTo(e.x - e.r, e.y);
    ctx.closePath();
    ctx.fill();
    // tentacles
    ctx.strokeStyle = e.color; ctx.lineWidth = 2;
    for (var t = -2; t &lt;= 2; t++) {
      ctx.beginPath();
      ctx.moveTo(e.x + t * 5, e.y);
      ctx.quadraticCurveTo(e.x + t*5 + Math.sin(e.phase+t)*4, e.y + 10,
                           e.x + t*5, e.y + 16);
      ctx.stroke();
    }
  } else if (e.type === &#x27;eel&#x27;) {
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.r, e.r * 0.55, 0, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath();
    ctx.arc(e.x - 5, e.y - 2, 2, 0, 6.28);
    ctx.fill();
  } else if (e.type === &#x27;puffer&#x27;) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.isMini) ctx.rotate(e.spin || 0);
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, 6.28);
    ctx.fill();
    // spikes
    ctx.strokeStyle = e.color; ctx.lineWidth = 2;
    for (var s = 0; s &lt; 8; s++) {
      var a = s / 8 * 6.28;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*e.r, Math.sin(a)*e.r);
      ctx.lineTo(Math.cos(a)*(e.r+5), Math.sin(a)*(e.r+5));
      ctx.stroke();
    }
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.beginPath(); ctx.arc(-e.r*0.3, -e.r*0.2, 2, 0, 6.28); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawShip() {
  ctx.save();
  ctx.shadowColor = &#x27;#35e6ff&#x27;; ctx.shadowBlur = 16;
  ctx.fillStyle = &#x27;#1f9fd8&#x27;;
  var cx = shipX + shipW/2, cy = H - 30;
  ctx.beginPath();
  ctx.ellipse(cx, cy, shipW/2, shipH/2, 0, 0, 6.28);
  ctx.fill();
  // conning tower
  ctx.fillRect(cx - 5, cy - shipH/2 - 6, 10, 8);
  // window glow
  ctx.fillStyle = &#x27;#c8fbff&#x27;;
  ctx.beginPath();
  ctx.arc(cx + 8, cy, 4, 0, 6.28);
  ctx.fill();
  ctx.restore();
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keys[e.key] = true; e.preventDefault(); }
  else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) fire(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
});

window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) {
    if (running) return;
    reset();
    running = true;
    spawnWave();
    animId = requestAnimationFrame(step);
  } else if (e.data.type === &#x27;wd_stop&#x27;) {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }
});

// initial static render
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
