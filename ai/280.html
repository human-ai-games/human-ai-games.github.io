    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#0ff,#f0f,#ff0); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,255,255,0.4); }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; width: 640px; max-width: 100%; align-items: center; }
  .score { font-size: 24px; font-weight: 800; color: #0ff; text-shadow: 0 0 12px #0ff; transition: transform .1s; }
  .timer { font-size: 22px; font-weight: 700; color: #ff0; text-shadow: 0 0 12px #ff0; }
  canvas { border-radius: 8px; box-shadow: 0 0 30px rgba(0,255,255,0.25); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your energy paddle with the mouse or arrow keys to bounce the plasma ball and smash every brick. Higher rows score more, the ball speeds up on each hit, and your paddle shrinks over time — don&#x27;t let the ball fall!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot;&gt;TIME &lt;span id=&quot;timer&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), timerEl = document.getElementById(&#x27;timer&#x27;);

var running = false, animId = null, keysDown = {};
var score = 0, elapsed = 0, startTime = 0, lastShrink = 0;
var mouseX = null;

var PADDLE_BASE_W = 110, PADDLE_H = 14, PADDLE_MIN_W = 50;
var paddle = { w: PADDLE_BASE_W, x: (W - PADDLE_BASE_W) / 2, flash: 0 };
var ball = { x: W/2, y: H-60, vx: 3, vy: -4, r: 8, speed: 5 };

var rowColors = [&#x27;#ff3b6b&#x27;,&#x27;#ff9f1c&#x27;,&#x27;#ffe600&#x27;,&#x27;#3bff6b&#x27;,&#x27;#3bd0ff&#x27;,&#x27;#b23bff&#x27;];
var rowPoints = [6,5,4,3,2,1];
var bricks = [];
var sparks = [];
var frags = [];
var redFlash = 0;

// parallax star layers
var stars = [[],[],[]];
var starCfg = [{n:40, sp:0.15, sz:1, c:&#x27;#334&#x27;},{n:30, sp:0.4, sz:1.5, c:&#x27;#88a&#x27;},{n:18, sp:0.9, sz:2.2, c:&#x27;#cfe&#x27;}];

function initStars() {
  for (var l=0; l&lt;3; l++) {
    stars[l] = [];
    for (var i=0; i&lt;starCfg[l].n; i++) stars[l].push({x:Math.random()*W, y:Math.random()*H});
  }
}
initStars();

function buildBricks() {
  bricks = [];
  var cols = 10, rows = 6;
  var pad = 6, top = 30, left = 12;
  var bw = (W - left*2 - pad*(cols-1)) / cols;
  var bh = 20;
  for (var r=0; r&lt;rows; r++) {
    for (var c=0; c&lt;cols; c++) {
      bricks.push({
        x: left + c*(bw+pad), y: top + r*(bh+pad),
        w: bw, h: bh, color: rowColors[r], points: rowPoints[r], alive: true
      });
    }
  }
}

function resetBall() {
  ball.x = paddle.x + paddle.w/2;
  ball.y = H - 60;
  ball.speed = 5;
  var ang = -Math.PI/2 + (Math.random()-0.5)*0.6;
  ball.vx = Math.cos(ang)*ball.speed;
  ball.vy = Math.sin(ang)*ball.speed;
}

// audio
var actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.08;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.stop(actx.currentTime+dur);
  } catch(_) {}
}

function makeSparks(x, y, color) {
  for (var i=0;i&lt;14;i++) {
    var a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
    sparks.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}
function makeFrags(x, y, color) {
  for (var i=0;i&lt;10;i++) {
    var a = Math.random()*Math.PI*2, s = 1+Math.random()*3;
    frags.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,color:color,sz:2+Math.random()*3});
  }
}

function bumpScore(pts) {
  score += pts;
  if (score &lt; 0) score = 0;
  scoreEl.textContent = score;
  scoreEl.parentElement.style.transform = &#x27;scale(1.25)&#x27;;
  setTimeout(function(){ scoreEl.parentElement.style.transform=&#x27;scale(1)&#x27;; }, 100);
}

function update(dt) {
  // paddle movement
  var sp = 8;
  if (keysDown[&#x27;ArrowLeft&#x27;]) paddle.x -= sp;
  if (keysDown[&#x27;ArrowRight&#x27;]) paddle.x += sp;
  if (mouseX !== null) paddle.x = mouseX - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // shrink every 10s
  elapsed = (performance.now() - startTime) / 1000;
  timerEl.textContent = Math.floor(elapsed);
  if (elapsed - lastShrink &gt;= 10) {
    lastShrink += 10;
    if (paddle.w &gt; PADDLE_MIN_W) {
      var cx = paddle.x + paddle.w/2;
      paddle.w = Math.max(PADDLE_MIN_W, paddle.w - 10);
      paddle.x = cx - paddle.w/2;
      paddle.flash = 1;
      beep(220,0.2,&#x27;sawtooth&#x27;,0.1);
    }
  }
  if (paddle.flash &gt; 0) paddle.flash -= 0.05;

  // ball move
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x - ball.r &lt;= 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r &gt;= W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r &lt;= 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  // paddle collision
  var py = H - 24 - PADDLE_H;
  if (ball.vy &gt; 0 &amp;&amp; ball.y + ball.r &gt;= py &amp;&amp; ball.y + ball.r &lt;= py + PADDLE_H + 8 &amp;&amp;
      ball.x &gt;= paddle.x &amp;&amp; ball.x &lt;= paddle.x + paddle.w) {
    ball.y = py - ball.r;
    ball.speed += 0.3;
    var rel = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    var ang = -Math.PI/2 + rel * 1.0;
    ball.vx = Math.cos(ang) * ball.speed;
    ball.vy = Math.sin(ang) * ball.speed;
    makeSparks(ball.x, py, &#x27;#0ff&#x27;);
    beep(660,0.06,&#x27;square&#x27;,0.09);
  }

  // brick collision
  for (var i=0;i&lt;bricks.length;i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    if (ball.x + ball.r &gt; b.x &amp;&amp; ball.x - ball.r &lt; b.x + b.w &amp;&amp;
        ball.y + ball.r &gt; b.y &amp;&amp; ball.y - ball.r &lt; b.y + b.h) {
      b.alive = false;
      bumpScore(b.points);
      makeFrags(b.x + b.w/2, b.y + b.h/2, b.color);
      beep(440 + b.points*40, 0.05, &#x27;triangle&#x27;, 0.08);
      // reflect based on overlap
      var overL = (ball.x + ball.r) - b.x;
      var overR = (b.x + b.w) - (ball.x - ball.r);
      var overT = (ball.y + ball.r) - b.y;
      var overB = (b.y + b.h) - (ball.y - ball.r);
      var minH = Math.min(overL, overR), minV = Math.min(overT, overB);
      if (minH &lt; minV) ball.vx = -ball.vx; else ball.vy = -ball.vy;
      break;
    }
  }

  // rebuild if all cleared
  if (bricks.every(function(b){return !b.alive;})) buildBricks();

  // ball fell
  if (ball.y - ball.r &gt; H) {
    redFlash = 1;
    bumpScore(-2);
    beep(120,0.3,&#x27;sawtooth&#x27;,0.12);
    resetBall();
  }
  if (redFlash &gt; 0) redFlash -= 0.04;

  // particles
  for (var s=sparks.length-1;s&gt;=0;s--) {
    var p = sparks[s];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.04;
    if (p.life &lt;= 0) sparks.splice(s,1);
  }
  for (var f=frags.length-1;f&gt;=0;f--) {
    var q = frags[f];
    q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life -= 0.03;
    if (q.life &lt;= 0) frags.splice(f,1);
  }

  // stars scroll
  for (var l=0;l&lt;3;l++) {
    var cfg = starCfg[l];
    for (var k=0;k&lt;stars[l].length;k++) {
      var st = stars[l][k];
      st.y += cfg.sp;
      if (st.y &gt; H) { st.y = 0; st.x = Math.random()*W; }
    }
  }
}

function draw() {
  ctx.fillStyle = &#x27;#05030f&#x27;;
  ctx.fillRect(0,0,W,H);

  // stars
  for (var l=0;l&lt;3;l++) {
    var cfg = starCfg[l];
    ctx.fillStyle = cfg.c;
    for (var k=0;k&lt;stars[l].length;k++) {
      var st = stars[l][k];
      ctx.fillRect(st.x, st.y, cfg.sz, cfg.sz);
    }
  }

  // bricks
  for (var i=0;i&lt;bricks.length;i++) {
    var b = bricks[i];
    if (!b.alive) continue;
    ctx.shadowColor = b.color; ctx.shadowBlur = 10;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;rgba(255,255,255,0.25)&#x27;;
    ctx.fillRect(b.x, b.y, b.w, 4);
  }

  // frags
  for (var f=0;f&lt;frags.length;f++) {
    var q = frags[f];
    ctx.globalAlpha = Math.max(0,q.life);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x, q.y, q.sz, q.sz);
  }
  ctx.globalAlpha = 1;

  // sparks
  for (var s=0;s&lt;sparks.length;s++) {
    var p = sparks[s];
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // paddle
  var py = H - 24 - PADDLE_H;
  var pcol = paddle.flash &gt; 0 ? &#x27;#fff&#x27; : &#x27;#0ff&#x27;;
  ctx.shadowColor = pcol; ctx.shadowBlur = 18;
  ctx.fillStyle = pcol;
  ctx.fillRect(paddle.x, py, paddle.w, PADDLE_H);
  ctx.shadowBlur = 0;

  // ball (pulsing)
  var pulse = 1 + Math.sin(performance.now()/120)*0.25;
  ctx.shadowColor = &#x27;#f0f&#x27;; ctx.shadowBlur = 20;
  var grad = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, ball.r*pulse);
  grad.addColorStop(0,&#x27;#fff&#x27;); grad.addColorStop(0.5,&#x27;#f6f&#x27;); grad.addColorStop(1,&#x27;#a0f&#x27;);
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // red flash
  if (redFlash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(255,0,0,&#x27; + (redFlash*0.5) + &#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  if (running) return;
  score = 0; scoreEl.textContent = &#x27;0&#x27;;
  paddle.w = PADDLE_BASE_W; paddle.x = (W - PADDLE_BASE_W)/2; paddle.flash = 0;
  for (var k in keysDown) keysDown[k] = false;
  buildBricks();
  sparks = []; frags = []; redFlash = 0;
  resetBall();
  startTime = performance.now();
  lastShrink = 0; elapsed = 0;
  timerEl.textContent = &#x27;0&#x27;;
  running = true;
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  if (!running) return;
  running = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keysDown[e.key] = true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function(e) {
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
cv.addEventListener(&#x27;mouseleave&#x27;, function(){ /* keep last pos */ });
window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
buildBricks();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
