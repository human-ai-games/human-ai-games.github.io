&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;ASTEROID BLITZ&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with the &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to fire; big asteroids split into smaller ones worth more points. You have three shields — press the Start button below to begin.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;🛡️🛡️🛡️&lt;/div&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;h2&gt;SHIELDS DOWN&lt;/h2&gt;&lt;p&gt;Final Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var W = 620, H = 460;
var cv = document.getElementById(&#x27;cv&#x27;);
var ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var livesEl = document.getElementById(&#x27;lives&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;);
var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
var flashEl = document.getElementById(&#x27;flash&#x27;);

var running = false, animId = null;
var keys = {};
var shipX, shipW = 40, shipH = 30, shipSpeed = 6;
var bullets, asteroids, particles, pops, stars;
var score, lives, lastShot, spawnTimer, spawnInterval, difficulty, shake, flashAlpha;

var SIZES = {
  large:  { r: 32, pts: 10, color: &#x27;#ff5ea8&#x27;, next: &#x27;medium&#x27; },
  medium: { r: 22, pts: 20, color: &#x27;#5ec8ff&#x27;, next: &#x27;small&#x27;  },
  small:  { r: 13, pts: 30, color: &#x27;#c8ff5e&#x27;, next: null     }
};

function initStars() {
  stars = [];
  for (var i = 0; i &lt; 70; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, v: Math.random()*0.4+0.1 });
  }
}

function reset() {
  shipX = (W - shipW) / 2;
  bullets = []; asteroids = []; particles = []; pops = [];
  score = 0; lives = 3; lastShot = 0;
  spawnTimer = 0; spawnInterval = 90; difficulty = 0;
  shake = 0; flashAlpha = 0;
  for (var k in keys) keys[k] = false;
  initStars();
  updateHUD();
  overlay.classList.remove(&#x27;show&#x27;);
}

function updateHUD() {
  scoreEl.textContent = score;
  var s = &#x27;&#x27;;
  for (var i = 0; i &lt; lives; i++) s += &#x27;🛡️&#x27;;
  livesEl.textContent = s || &#x27;💀&#x27;;
}

function makeAsteroid(x, y, size, vx) {
  var def = SIZES[size];
  var verts = [];
  var n = 9;
  for (var i = 0; i &lt; n; i++) {
    var a = (i / n) * Math.PI * 2;
    var rr = def.r * (0.75 + Math.random()*0.4);
    verts.push({ a: a, r: rr });
  }
  asteroids.push({
    x: x, y: y, size: size, r: def.r,
    vx: vx || (Math.random()*2-1),
    vy: (1.2 + difficulty*0.9) * (0.9 + Math.random()*0.3),
    rot: Math.random()*Math.PI*2, vrot: (Math.random()-0.5)*0.05,
    verts: verts, color: def.color
  });
}

function spawnAsteroid() {
  var x = 40 + Math.random()*(W-80);
  makeAsteroid(x, -34, &#x27;large&#x27;);
}

function fire() {
  var now = Date.now();
  if (now - lastShot &lt; 180) return;
  lastShot = now;
  bullets.push({ x: shipX + shipW/2, y: H - shipH - 14, vy: -9 });
  beep(680, 0.05, 0.08, &#x27;square&#x27;);
}

function spawnParticles(x, y, color, count) {
  for (var i = 0; i &lt; count; i++) {
    var a = Math.random()*Math.PI*2;
    var sp = 1 + Math.random()*4;
    particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1, color: color, rot: Math.random()*6, vrot: (Math.random()-0.5)*0.4,
      sz: 2 + Math.random()*4 });
  }
}

function addPop(x, y, pts, color) {
  pops.push({ x: x, y: y, pts: pts, life: 1, color: color });
}

function splitAsteroid(ast) {
  var def = SIZES[ast.size];
  addPop(ast.x, ast.y, def.pts, def.color);
  score += def.pts;
  spawnParticles(ast.x, ast.y, def.color, ast.size === &#x27;small&#x27; ? 14 : 8);
  beep(ast.size===&#x27;small&#x27;?900:ast.size===&#x27;medium&#x27;?500:300, 0.08, 0.1, &#x27;triangle&#x27;);
  if (def.next) {
    makeAsteroid(ast.x, ast.y, def.next, -1.5);
    makeAsteroid(ast.x, ast.y, def.next, 1.5);
  }
  updateHUD();
}

// Web Audio
var actx = null;
function beep(freq, dur, vol, type) {
  try {
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || &#x27;sine&#x27;; o.frequency.value = freq;
    g.gain.value = vol || 0.1;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch(_) {}
}

function loseShield(ast) {
  lives--;
  updateHUD();
  shake = 16;
  flashAlpha = 0.7;
  beep(120, 0.3, 0.2, &#x27;sawtooth&#x27;);
  if (lives &lt;= 0) gameOver();
}

function gameOver() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  animId = null;
  finalScoreEl.textContent = score;
  overlay.classList.add(&#x27;show&#x27;);
}

function update() {
  difficulty += 0.00018;
  // ship
  if (keys[&#x27;ArrowLeft&#x27;]) shipX -= shipSpeed;
  if (keys[&#x27;ArrowRight&#x27;]) shipX += shipSpeed;
  shipX = Math.max(0, Math.min(W - shipW, shipX));

  // spawn
  spawnTimer++;
  var curInterval = Math.max(28, spawnInterval - difficulty*160);
  if (spawnTimer &gt;= curInterval) { spawnTimer = 0; spawnAsteroid(); }

  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    stars[i].y += stars[i].v;
    if (stars[i].y &gt; H) { stars[i].y = 0; stars[i].x = Math.random()*W; }
  }

  // bullets
  for (var b = bullets.length-1; b &gt;= 0; b--) {
    bullets[b].y += bullets[b].vy;
    if (bullets[b].y &lt; -12) bullets.splice(b,1);
  }

  // asteroids
  for (var a = asteroids.length-1; a &gt;= 0; a--) {
    var ast = asteroids[a];
    ast.x += ast.vx; ast.y += ast.vy; ast.rot += ast.vrot;
    if (ast.x &lt; ast.r) { ast.x = ast.r; ast.vx *= -1; }
    if (ast.x &gt; W-ast.r) { ast.x = W-ast.r; ast.vx *= -1; }
    if (ast.y - ast.r &gt; H) {
      asteroids.splice(a,1);
      loseShield(ast);
      continue;
    }
  }

  // collisions
  for (var a2 = asteroids.length-1; a2 &gt;= 0; a2--) {
    var as = asteroids[a2];
    for (var b2 = bullets.length-1; b2 &gt;= 0; b2--) {
      var bl = bullets[b2];
      var dx = bl.x - as.x, dy = bl.y - as.y;
      if (dx*dx + dy*dy &lt; as.r*as.r) {
        bullets.splice(b2,1);
        asteroids.splice(a2,1);
        splitAsteroid(as);
        break;
      }
    }
  }

  // particles
  for (var p = particles.length-1; p &gt;= 0; p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.rot += pt.vrot;
    pt.life -= 0.03;
    if (pt.life &lt;= 0) particles.splice(p,1);
  }

  // pops
  for (var q = pops.length-1; q &gt;= 0; q--) {
    pops[q].y -= 0.8; pops[q].life -= 0.02;
    if (pops[q].life &lt;= 0) pops.splice(q,1);
  }

  if (shake &gt; 0) shake *= 0.85;
  if (shake &lt; 0.3) shake = 0;
  if (flashAlpha &gt; 0) flashAlpha -= 0.05;
  flashEl.style.opacity = Math.max(0, flashAlpha);
}

function draw() {
  var dangerT = Math.min(1, difficulty * 3.2);
  var r = Math.round(5 + dangerT*90);
  var g = Math.round(1 + dangerT*8);
  var bcol = Math.round(15 + dangerT*20);
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+bcol+&#x27;)&#x27;);
  grad.addColorStop(1, &#x27;rgb(&#x27;+Math.round(r*0.4)+&#x27;,0,&#x27;+Math.round(bcol*1.5)+&#x27;)&#x27;);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  if (shake &gt; 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // stars
  for (var i = 0; i &lt; stars.length; i++) {
    ctx.globalAlpha = 0.4 + Math.random()*0.3;
    ctx.fillStyle = &#x27;#cfe&#x27;;
    ctx.fillRect(stars[i].x, stars[i].y, stars[i].s, stars[i].s);
  }
  ctx.globalAlpha = 1;

  // bullets
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 10;
  for (var b = 0; b &lt; bullets.length; b++) {
    ctx.fillRect(bullets[b].x-2, bullets[b].y, 4, 12);
  }
  ctx.shadowBlur = 0;

  // asteroids
  for (var a = 0; a &lt; asteroids.length; a++) {
    var ast = asteroids[a];
    ctx.save();
    ctx.translate(ast.x, ast.y); ctx.rotate(ast.rot);
    ctx.beginPath();
    for (var v = 0; v &lt; ast.verts.length; v++) {
      var vx = Math.cos(ast.verts[v].a)*ast.verts[v].r;
      var vy = Math.sin(ast.verts[v].a)*ast.verts[v].r;
      if (v===0) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy);
    }
    ctx.closePath();
    ctx.fillStyle = ast.color;
    ctx.shadowColor = ast.color; ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 2; ctx.strokeStyle = &#x27;rgba(255,255,255,0.6)&#x27;;
    ctx.stroke();
    ctx.restore();
  }

  // particles
  for (var p = 0; p &lt; particles.length; p++) {
    var pt = particles[p];
    ctx.save();
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    ctx.fillStyle = pt.color;
    ctx.shadowColor = pt.color; ctx.shadowBlur = 8;
    ctx.fillRect(-pt.sz/2, -pt.sz/2, pt.sz, pt.sz);
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // score pops
  ctx.textAlign = &#x27;center&#x27;; ctx.font = &#x27;bold 20px system-ui&#x27;;
  for (var q = 0; q &lt; pops.length; q++) {
    ctx.globalAlpha = Math.max(0, pops[q].life);
    ctx.fillStyle = pops[q].color;
    ctx.shadowColor = pops[q].color; ctx.shadowBlur = 10;
    ctx.fillText(&#x27;+&#x27;+pops[q].pts, pops[q].x, pops[q].y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // ship
  var sx = shipX + shipW/2, sy = H - 12;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(sx, sy - shipH);
  ctx.lineTo(sx - shipW/2, sy);
  ctx.lineTo(sx + shipW/2, sy);
  ctx.closePath();
  var sg = ctx.createLinearGradient(sx, sy-shipH, sx, sy);
  sg.addColorStop(0, &#x27;#0ff&#x27;); sg.addColorStop(1, &#x27;#08f&#x27;);
  ctx.fillStyle = sg;
  ctx.shadowColor = &#x27;#0ff&#x27;; ctx.shadowBlur = 20;
  ctx.fill();
  ctx.strokeStyle = &#x27;#cff&#x27;; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
  // thruster
  ctx.beginPath();
  ctx.moveTo(sx-6, sy); ctx.lineTo(sx+6, sy);
  ctx.lineTo(sx, sy + 8 + Math.random()*6);
  ctx.closePath();
  ctx.fillStyle = &#x27;rgba(255,180,0,0.8)&#x27;;
  ctx.fill();

  ctx.restore();
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame() {
  if (running) return;
  reset();
  running = true;
  try { if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if (actx.state===&#x27;suspended&#x27;) actx.resume(); } catch(_){}
  // immediate action
  spawnAsteroid();
  animId = requestAnimationFrame(loop);
}
function stopGame() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  animId = null;
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keys[e.key] = true; e.preventDefault(); }
  else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) fire(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
});
window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s

  <div class="controls">

    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
