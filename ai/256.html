&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🔱 NEON REEF DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;←&lt;/strong&gt; &lt;strong&gt;→&lt;/strong&gt; and fire torpedoes with &lt;strong&gt;Space&lt;/strong&gt; (or use the buttons below); hit jellyfish, crabs and anglerfish before the pressure gauge empties. Build a combo without missing — a 5x combo unleashes FRENZY triple-fire!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot; id=&quot;combo&quot;&gt;Combo &lt;span id=&quot;comboVal&quot;&gt;1&lt;/span&gt;x&lt;/div&gt;
    &lt;div class=&quot;gauge&quot;&gt;&lt;div class=&quot;gauge-fill&quot; id=&quot;gauge&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;frenzy-banner&quot; id=&quot;frenzy&quot;&gt;FRENZY!&lt;/div&gt;
    &lt;div class=&quot;edge-flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press &lt;strong&gt;Start&lt;/strong&gt; below to dive in!&lt;small&gt;Defend the reef for 60 seconds.&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;touch&quot;&gt;
    &lt;button id=&quot;btnL&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;fire&quot; id=&quot;btnF&quot;&gt;● FIRE&lt;/button&gt;

&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var W=640, H=440;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;comboVal&#x27;);
var comboBox=document.getElementById(&#x27;combo&#x27;), timeEl=document.getElementById(&#x27;time&#x27;);
var gauge=document.getElementById(&#x27;gauge&#x27;), frenzyB=document.getElementById(&#x27;frenzy&#x27;);
var flash=document.getElementById(&#x27;flash&#x27;), msg=document.getElementById(&#x27;msg&#x27;);

var running=false, animId=null, lastTs=0;
var keys={}, shipX=W/2-18, SHIP_W=44, SHIP_H=24;
var SHIP_SPEED=300; // px/s
var bullets=[], enemies=[], particles=[], bubbles=[];
var score=0, combo=1, missStreak=0;
var timeLeft=60, spawnTimer=0, lastShot=0;
var frenzy=0; // seconds remaining
var flashTimer=0;

// ---- audio ----
var actx=null;
function beep(freq,dur,type,vol){
  if(!actx) return;
  try{
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
    g.gain.value=vol||0.08;
    o.connect(g); g.connect(actx.destination);
    var t=actx.currentTime;
    g.gain.setValueAtTime(g.gain.value,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t); o.stop(t+dur);
  }catch(_){}
}
var musicTimer=0;
function musicTick(dt){
  if(!actx) return;
  var urgency=1-timeLeft/60; // 0..1
  var interval=0.5-urgency*0.32; // faster near end
  musicTimer-=dt;
  if(musicTimer&lt;=0){
    musicTimer=interval;
    var base=80+urgency*40;
    beep(base,0.12,&#x27;triangle&#x27;,0.05);
  }
}

// ---- setup ----
function initBubbles(){
  bubbles=[];
  for(var i=0;i&lt;40;i++){
    bubbles.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,
      s:20+Math.random()*70,a:0.1+Math.random()*0.25});
  }
}
initBubbles();

function reset(){
  bullets=[]; enemies=[]; particles=[];
  score=0; combo=1; missStreak=0; timeLeft=60;
  spawnTimer=0; lastShot=0; frenzy=0; flashTimer=0; musicTimer=0;
  shipX=W/2-SHIP_W/2;
  for(var k in keys) keys[k]=false;
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent=score;
  comboEl.textContent=combo;
  timeEl.textContent=Math.ceil(timeLeft);
  gauge.style.width=(Math.max(0,timeLeft)/60*100)+&#x27;%&#x27;;
  if(combo&gt;=3) comboBox.classList.add(&#x27;hot&#x27;); else comboBox.classList.remove(&#x27;hot&#x27;);
}

// ---- spawning ----
function spawnEnemy(){
  var urgency=1-timeLeft/60;
  var r=Math.random();
  var type, hp, pts, color, size, speed;
  if(r&lt;0.62){ type=&#x27;jelly&#x27;; hp=1; pts=1; color=&#x27;#ff8adf&#x27;; size=22; speed=55+urgency*70; }
  else if(r&lt;0.92){ type=&#x27;crab&#x27;; hp=2; pts=3; color=&#x27;#ff9a3d&#x27;; size=34; speed=40+urgency*55; }
  else { type=&#x27;angler&#x27;; hp=1; pts=10; color=&#x27;#66ffcc&#x27;; size=40; speed=45+urgency*60; }
  enemies.push({type:type,hp:hp,maxhp:hp,pts:pts,color:color,size:size,speed:speed,
    x:Math.random()*(W-size), y:-size, phase:Math.random()*6.28, flash:0});
}

function fire(){
  if(!running) return;
  var now=performance.now();
  var cd=frenzy&gt;0?170:230;
  if(now-lastShot&lt;cd) return;
  lastShot=now;
  var cx=shipX+SHIP_W/2;
  var top=H-40-SHIP_H;
  if(frenzy&gt;0){
    bullets.push({x:cx-2,y:top,vx:0});
    bullets.push({x:cx-2,y:top,vx:-90});
    bullets.push({x:cx-2,y:top,vx:90});
  } else {
    bullets.push({x:cx-2,y:top,vx:0});
  }
  beep(660,0.09,&#x27;square&#x27;,0.05);
}

function burst(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*6.28, sp=40+Math.random()*160;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:0.4+Math.random()*0.5,age:0,color:color,r:2+Math.random()*3});
  }
}

function hitEnemy(e,idx,bx,by){
  e.hp--;
  e.flash=0.12;
  if(e.hp&lt;=0){
    burst(e.x+e.size/2,e.y+e.size/2,e.color,e.type===&#x27;angler&#x27;?34:14);
    var gain=e.pts*combo;
    score+=gain;
    combo=Math.min(combo+1,20);
    missStreak=0;
    if(combo===5 &amp;&amp; frenzy&lt;=0){ frenzy=3; frenzyB.classList.add(&#x27;on&#x27;);
      setTimeout(function(){frenzyB.classList.remove(&#x27;on&#x27;);},900); }
    if(combo&gt;=5 &amp;&amp; frenzy&lt;=0){ frenzy=3; }
    enemies.splice(idx,1);
    beep(e.type===&#x27;angler&#x27;?300:520,0.18,&#x27;sawtooth&#x27;,0.07);
    updateHUD();
  } else {
    burst(bx,by,e.color,6);
    beep(220,0.06,&#x27;square&#x27;,0.05);
  }
}

function enemyEscaped(e){
  score=Math.max(0,score-1);
  combo=1;
  flashTimer=0.28;
  flash.classList.add(&#x27;on&#x27;);
  beep(120,0.25,&#x27;sawtooth&#x27;,0.08);
  updateHUD();
}

// ---- update ----
function update(dt){
  // movement
  if(keys.left) shipX-=SHIP_SPEED*dt;
  if(keys.right) shipX+=SHIP_SPEED*dt;
  shipX=Math.max(0,Math.min(W-SHIP_W,shipX));

  // timer
  timeLeft-=dt;
  if(timeLeft&lt;=0){ timeLeft=0; endGame(); return; }
  updateHUD();

  if(frenzy&gt;0){ frenzy-=dt; if(frenzy&lt;0) frenzy=0; }
  if(keys.fire) fire();

  // spawn
  var urgency=1-timeLeft/60;
  var spawnInt=1.0-urgency*0.6;
  spawnTimer-=dt;
  if(spawnTimer&lt;=0){ spawnTimer=spawnInt; spawnEnemy(); }

  // bubbles
  for(var b=0;b&lt;bubbles.length;b++){
    var bu=bubbles[b];
    bu.y-=bu.s*dt;
    if(bu.y&lt;-6){ bu.y=H+6; bu.x=Math.random()*W; }
  }

  // bullets
  for(var i=bullets.length-1;i&gt;=0;i--){
    var bl=bullets[i];
    bl.y-=500*dt; bl.x+=bl.vx*dt;
    if(bl.y&lt;-14||bl.x&lt;-10||bl.x&gt;W+10) bullets.splice(i,1);
  }

  // enemies
  for(var j=enemies.length-1;j&gt;=0;j--){
    var e=enemies[j];
    e.y+=e.speed*dt;
    e.phase+=dt*3;
    if(e.type===&#x27;jelly&#x27;) e.x+=Math.sin(e.phase)*30*dt;
    else if(e.type===&#x27;angler&#x27;) e.x+=Math.sin(e.phase*1.6)*110*dt;
    e.x=Math.max(0,Math.min(W-e.size,e.x));
    if(e.flash&gt;0) e.flash-=dt;
    if(e.y&gt;H){ enemyEscaped(e); enemies.splice(j,1); continue; }
  }

  // collisions
  for(var bi=bullets.length-1;bi&gt;=0;bi--){
    var bt=bullets[bi]; var hit=false;
    for(var ei=enemies.length-1;ei&gt;=0;ei--){
      var en=enemies[ei];
      if(bt.x&lt;en.x+en.size &amp;&amp; bt.x+4&gt;en.x &amp;&amp; bt.y&lt;en.y+en.size &amp;&amp; bt.y+12&gt;en.y){
        hitEnemy(en,ei,bt.x,bt.y);
        bullets.splice(bi,1); hit=true; break;
      }
    }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.age+=dt;
    pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=40*dt;
    if(pt.age&gt;=pt.life) particles.splice(p,1);
  }

  if(flashTimer&gt;0){ flashTimer-=dt; if(flashTimer&lt;=0) flash.classList.remove(&#x27;on&#x27;); }

  musicTick(dt);
}

// ---- render ----
function drawShip(){
  var x=shipX, y=H-40-SHIP_H, w=SHIP_W, h=SHIP_H;
  ctx.save();
  var glow=frenzy&gt;0?&#x27;#ff5ce6&#x27;:&#x27;#3df2ff&#x27;;
  ctx.shadowColor=glow; ctx.shadowBlur=18;
  ctx.fillStyle=&#x27;#0e5a7a&#x27;;
  ctx.beginPath();
  ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,6.28); ctx.fill();
  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.ellipse(x+w/2,y+h/2,w/2-4,h/2-4,0,0,6.28); ctx.fill();
  // dome
  ctx.fillStyle=&#x27;#bff&#x27;;
  ctx.beginPath(); ctx.arc(x+w/2,y+h/2-2,6,0,6.28); ctx.fill();
  // fin
  ctx.shadowBlur=0;
  ctx.fillStyle=&#x27;#083&#x27;;
  ctx.beginPath(); ctx.moveTo(x+w/2,y-2); ctx.lineTo(x+w/2-6,y+6); ctx.lineTo(x+w/2+6,y+6); ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  ctx.save();
  var c=e.flash&gt;0?&#x27;#ffffff&#x27;:e.color;
  ctx.shadowColor=e.color; ctx.shadowBlur=14;
  var cx=e.x+e.size/2, cy=e.y+e.size/2;
  if(e.type===&#x27;jelly&#x27;){
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(cx,cy-2,e.size/2,Math.PI,0); ctx.fill();
    ctx.strokeStyle=c; ctx.lineWidth=2;
    for(var t=0;t&lt;4;t++){
      var tx=e.x+4+t*(e.size-8)/3;
      ctx.beginPath(); ctx.moveTo(tx,cy);
      ctx.lineTo(tx+Math.sin(e.phase+t)*4,cy+e.size/2); ctx.stroke();
    }
  } else if(e.type===&#x27;crab&#x27;){
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.ellipse(cx,cy,e.size/2,e.size/2.6,0,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#111&#x27;;
    ctx.beginPath(); ctx.arc(cx-6,cy-4,3,0,6.28); ctx.arc(cx+6,cy-4,3,0,6.28); ctx.fill();
    // claws
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(e.x,cy,5,0,6.28); ctx.arc(e.x+e.size,cy,5,0,6.28); ctx.fill();
    if(e.maxhp&gt;1 &amp;&amp; e.hp&lt;e.maxhp){ ctx.strokeStyle=&#x27;#fff&#x27;; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx-6,cy+4); ctx.lineTo(cx+6,cy+4); ctx.stroke(); }
  } else { // angler
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.ellipse(cx,cy,e.size/2,e.size/2.8,0,0,6.28); ctx.fill();
    // teeth
    ctx.fillStyle=&#x27;#fff&#x27;;
    for(var d=0;d&lt;5;d++){ var tx2=e.x+4+d*(e.size-8)/4;
      ctx.beginPath(); ctx.moveTo(tx2,cy+6); ctx.lineTo(tx2+2,cy+12); ctx.lineTo(tx2+4,cy+6); ctx.fill(); }
    // lure
    ctx.fillStyle=&#x27;#ffff66&#x27;; ctx.shadowColor=&#x27;#ffff66&#x27;; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(cx,e.y-4,4,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#111&#x27;;
    ctx.beginPath(); ctx.arc(cx-4,cy-3,3,0,6.28); ctx.fill();
  }
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  // bubbles
  for(var b=0;b&lt;bubbles.length;b++){
    var bu=bubbles[b];
    ctx.fillStyle=&#x27;rgba(120,200,255,&#x27;+bu.a+&#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r,0,6.28); ctx.fill();
  }
  // seabed glow
  ctx.fillStyle=&#x27;rgba(20,60,90,0.4)&#x27;;
  ctx.fillRect(0,H-8,W,8);
  // enemies
  for(var e=0;e&lt;enemies.length;e++) drawEnemy(enemies[e]);
  // bullets
  for(var i=0;i&lt;bullets.length;i++){
    var bl=bullets[i];
    ctx.save(); ctx.shadowColor=&#x27;#3df2ff&#x27;; ctx.shadowBlur=12;
    ctx.fillStyle=frenzy&gt;0?&#x27;#ff9ff0&#x27;:&#x27;#9ff&#x27;;
    ctx.beginPath(); ctx.roundRect(bl.x,bl.y,4,12,2); ctx.fill(); ctx.restore();
  }
  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p]; var al=1-pt.age/pt.life;
    ctx.globalAlpha=al; ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
  drawShip();
}

function loop(ts){
  if(!running) return;
  var dt=(ts-lastTs)/1000; lastTs=ts;
  if(dt&gt;0.05) dt=0.05;
  update(dt);
  if(!running) return;
  render();
  animId=requestAnimationFrame(loop);
}

function startGame(){
  if(running) return;
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state===&#x27;suspended&#x27;) actx.resume(); }catch(_){}
  reset();
  msg.style.display=&#x27;none&#x27;;
  running=true;
  lastTs=performance.now();
  render();
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}
function endGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  render();
  msg.innerHTML=&#x27;Time! Final Score: &lt;strong&gt;&#x27;+score+&#x27;&lt;/strong&gt;&lt;small&gt;Press Start to dive again.&lt;/small&gt;&#x27;;
  msg.style.display=&#x27;flex&#x27;;
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ keys.left=true; e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ keys.right=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ keys.fire=true; if(running) fire(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;) keys.left=false;
  else if(e.key===&#x27;ArrowRight&#x27;) keys.right=false;
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;) keys.fire=false;
});

function bindHold(el,on,off){
  el.addEventListener(&#x27;mousedown&#x27;,function(e){e.preventDefault();on();});
  el.addEventListener(&#x27;mouseup&#x27;,off); el.addEventListener(&#x27;mouseleave&#x27;,off);
  el.addEventListener(&#x27;touchstart&#x27;,function(e){e.preventDefault();on();},{passive:false});
  el.addEventListener(&#x27;touchend&#x27;,function(e){e.preventDefault();off();},{passive:false});
}
bindHold(document.getElementById(&#x27;btnL&#x27;),function(){keys.left=true;},function(){keys.left=false;});
bindHold(document.getElementById(&#x27;btnR&#x27;),function(){keys.right=true;},function(){keys.right=false;});
bindHold(document.getElementById(&#x27;btnF&#x27;),function(){keys.fire=true;fire();},function(){keys.fire=false;});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
render();
updateHUD();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
