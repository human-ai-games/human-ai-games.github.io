&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with ← → , press ↑ to rotate and ↓ to drop faster; fill full rows to clear them for points. Use the Start/Restart button below the game or the on-screen arrows.&lt;/p&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;SCORE&lt;div class=&quot;score-big&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;SPEED&lt;b id=&quot;speed&quot;&gt;1&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;LINES&lt;b id=&quot;lines&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field-wrap&quot; id=&quot;fieldWrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;h2&gt;GAME OVER&lt;/h2&gt;&lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;preview-label&quot;&gt;NEXT&lt;/div&gt;
      &lt;div class=&quot;preview&quot; id=&quot;preview&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

    &lt;button class=&quot;btn&quot; id=&quot;bLeft&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bRot&quot;&gt;⟳&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bDown&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bRight&quot;&gt;▶&lt;/button&gt;

&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var preview = document.getElementById(&#x27;preview&#x27;);
  field.style.width = COLS*CELL+&#x27;px&#x27;; field.style.height = ROWS*CELL+&#x27;px&#x27;;
  var scoreEl=document.getElementById(&#x27;score&#x27;), speedEl=document.getElementById(&#x27;speed&#x27;), linesEl=document.getElementById(&#x27;lines&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;), finalScore=document.getElementById(&#x27;finalScore&#x27;);
  var fieldWrap=document.getElementById(&#x27;fieldWrap&#x27;), banner=document.getElementById(&#x27;banner&#x27;);

  var FRUITS=[&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;,&#x27;🫐&#x27;];
  var COLORS=[&#x27;#ff4b5c&#x27;,&#x27;#ff9b3f&#x27;,&#x27;#ffe14b&#x27;,&#x27;#b26bff&#x27;,&#x27;#ff5b9e&#x27;,&#x27;#4bd06b&#x27;,&#x27;#4b9bff&#x27;];
  // 7 tetrominoes; each has rotation states as list of [x,y] cells.
  var SHAPES=[
    // I
    [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]],
    // O
    [[[1,0],[2,0],[1,1],[2,1]]],
    // T
    [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    // S
    [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]],
    // Z
    [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]],
    // J
    [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
    // L
    [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
  ];

  var running=false, dropId=null, DROP_MS=600;
  var grid, piece, nextType, score, lines, level;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(-1);grid.push(row);} }
  function randType(){ return Math.floor(Math.random()*SHAPES.length); }

  function makePiece(t){ return {type:t, rot:0, x:3, y:0}; }
  function cellsOf(p){ var s=SHAPES[p.type][p.rot]; var out=[]; for(var i=0;i&lt;s.length;i++)out.push({x:p.x+s[i][0],y:p.y+s[i][1]}); return out; }
  function collides(p){ var c=cellsOf(p); for(var i=0;i&lt;c.length;i++){var x=c[i].x,y=c[i].y; if(x&lt;0||x&gt;=COLS||y&gt;=ROWS)return true; if(y&gt;=0&amp;&amp;grid[y][x]&gt;=0)return true;} return false; }

  function spawn(){ piece=makePiece(nextType); nextType=randType(); drawPreview(); return !collides(piece); }

  function lock(){ var c=cellsOf(piece); for(var i=0;i&lt;c.length;i++){var cc=c[i]; if(cc.y&gt;=0)grid[cc.y][cc.x]=piece.type;} piece=null; }

  function drawBlock(container,cx,cy,type,cell){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
    el.style.left=(cx*cell)+&#x27;px&#x27;; el.style.top=(cy*cell)+&#x27;px&#x27;;
    el.style.width=cell+&#x27;px&#x27;; el.style.height=cell+&#x27;px&#x27;;
    el.style.background=COLORS[type]; el.style.fontSize=(cell-6)+&#x27;px&#x27;;
    el.textContent=FRUITS[type]; container.appendChild(el); return el;
  }

  function paint(){
    field.innerHTML=&#x27;&#x27;;
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++) if(grid[r][c]&gt;=0) drawBlock(field,c,r,grid[r][c],CELL);
    if(piece){var cs=cellsOf(piece); for(var i=0;i&lt;cs.length;i++) if(cs[i].y&gt;=0) drawBlock(field,cs[i].x,cs[i].y,piece.type,CELL);}
  }

  function drawPreview(){
    preview.innerHTML=&#x27;&#x27;;
    var s=SHAPES[nextType][0]; var pc=12;
    // center
    var minx=99,maxx=-9,miny=99,maxy=-9;
    for(var i=0;i&lt;s.length;i++){minx=Math.min(minx,s[i][0]);maxx=Math.max(maxx,s[i][0]);miny=Math.min(miny,s[i][1]);maxy=Math.max(maxy,s[i][1]);}
    var w=(maxx-minx+1), h=(maxy-miny+1);
    var ox=(96-w*22)/2, oy=(96-h*22)/2;
    for(var i=0;i&lt;s.length;i++){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
      el.style.left=(ox+(s[i][0]-minx)*22)+&#x27;px&#x27;; el.style.top=(oy+(s[i][1]-miny)*22)+&#x27;px&#x27;;
      el.style.width=&#x27;20px&#x27;; el.style.height=&#x27;20px&#x27;; el.style.fontSize=&#x27;15px&#x27;;
      el.style.background=COLORS[nextType]; el.textContent=FRUITS[nextType]; preview.appendChild(el);
    }
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){var f=true;for(var c=0;c&lt;COLS;c++)if(grid[r][c]&lt;0){f=false;break;} if(f)full.push(r);}
    if(full.length===0)return;
    // burst animation on cells then remove
    fieldWrap.classList.add(&#x27;pulse&#x27;);
    setTimeout(function(){fieldWrap.classList.remove(&#x27;pulse&#x27;);},250);
    var pts=[0,100,300,500,800][full.length];
    score+=pts; lines+=full.length;
    var newLevel=Math.floor(lines/10)+1;
    if(newLevel!==level){ level=newLevel; DROP_MS=Math.max(120,600-(level-1)*55); if(dropId){clearInterval(dropId);dropId=setInterval(stepDown,DROP_MS);} }
    scoreEl.textContent=score; linesEl.textContent=lines; speedEl.textContent=level;
    if(full.length===4){ banner.classList.remove(&#x27;fly&#x27;); void banner.offsetWidth; banner.classList.add(&#x27;fly&#x27;); }
    // animate burst on existing painted cells in those rows
    var cells=field.querySelectorAll(&#x27;.cell&#x27;);
    cells.forEach(function(el){
      var top=parseInt(el.style.top); var row=Math.round(top/CELL);
      if(full.indexOf(row)&gt;=0) el.classList.add(&#x27;burst&#x27;);
    });
    // remove rows from grid after animation
    setTimeout(function(){
      for(var i=0;i&lt;full.length;i++){
        grid.splice(full[i],1);
        var empty=[];for(var c=0;c&lt;COLS;c++)empty.push(-1);
        grid.unshift(empty);
      }
      paint();
    },300);
  }

  function stepDown(){
    if(!piece)return;
    var nx={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(nx)){
      lock(); clearRows();
      if(!spawn()){ endGame(); paint(); return; }
    } else piece=nx;
    paint();
  }

  function move(dx){ if(!running||!piece)return; var nx={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y}; if(!collides(nx)){piece=nx;paint();} }
  function rotate(){ if(!running||!piece)return; var nr=(piece.rot+1)%SHAPES[piece.type].length; var nx={type:piece.type,rot:nr,x:piece.x,y:piece.y};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){var t={type:piece.type,rot:nr,x:piece.x+kicks[k],y:piece.y}; if(!collides(t)){piece=t;paint();return;}} }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} finalScore.textContent=&#x27;Score: &#x27;+score; overlay.classList.add(&#x27;show&#x27;); }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    score=0;lines=0;level=1;DROP_MS=600;
    scoreEl.textContent=&#x27;0&#x27;;linesEl.textContent=&#x27;0&#x27;;speedEl.textContent=&#x27;1&#x27;;
    newGrid(); nextType=randType();
    if(!spawn()){return;}
    paint(); running=true;
    if(dropId)clearInterval(dropId); dropId=setInterval(stepDown,DROP_MS);
    setTimeout(stepDown,150);
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)stepDown();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){rotate();e.preventDefault();}
  });
  document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;,function(){move(-1);});
  document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;,function(){move(1);});
  document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;,function(){if(running)stepDown();});
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;,rotate);

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
    },true);
  });

  // initial preview render
  newGrid(); nextType=randType(); piece=makePiece(randType()); paint(); drawPreview();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });

  <div class="controls">

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
