<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>★ STAR SURFER ★</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0018; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#ff6ec7,#7b6cff,#4fd8ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #b7a9d8; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; }
  .hud { font-size: 20px; color: #ffe07a; text-shadow: 0 0 8px #ffb020; }
  canvas { border-radius: 10px; box-shadow: 0 0 24px rgba(120,80,255,0.4); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;★ STAR SURFER ★&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to fly your rocket up — press again in mid-air for a double-jump — and dodge the spinning asteroids. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;★ &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var W = cv.width, H = cv.height, GROUND = H - 30;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var running = false, animId = null, gameOver = false;

  var GRAVITY = 0.55, JUMP_V = -11;
  var baseSpeed = 3.2, speed = baseSpeed;
  var score = 0, jumps = 0;
  var comboTimer = 0;

  var ship = { x: 90, y: 0, vy: 0, w: 40, h: 22, flame: 0 };
  var obstacles = [];
  var particles = [];
  var spawnCd = 0;

  // three parallax star layers
  var stars = [[],[],[]];
  var layerSpeed = [0.4, 0.9, 1.6], layerSize = [1, 1.6, 2.4];
  function initStars() {
    for (var l=0; l&lt;3; l++){ stars[l]=[]; for(var i=0;i&lt;40;i++){ stars[l].push({x:Math.random()*W, y:Math.random()*(GROUND-10)}); } }
  }
  // cityscape buildings
  var city = [];
  function initCity() {
    city = []; var x=0;
    while(x &lt; W+120){ var w=25+Math.random()*45, h=30+Math.random()*90; city.push({x:x,w:w,h:h}); x+=w+4; }
  }

  function bgColor() {
    // shift purple -&gt; midnight blue -&gt; red as score climbs
    var t = Math.min(score/40, 1);
    var top, bot;
    if (t &lt; 0.5) {
      var k = t/0.5;
      top = lerp3([30,0,50],[10,15,50],k); bot = lerp3([70,20,110],[20,30,80],k);
    } else {
      var k = (t-0.5)/0.5;
      top = lerp3([10,15,50],[60,10,20],k); bot = lerp3([20,30,80],[120,25,30],k);
    }
    return {top:rgb(top), bot:rgb(bot)};
  }
  function lerp3(a,b,k){ return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]; }
  function rgb(c){ return &#x27;rgb(&#x27;+(c[0]|0)+&#x27;,&#x27;+(c[1]|0)+&#x27;,&#x27;+(c[2]|0)+&#x27;)&#x27;; }

  function reset() {
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    speed = baseSpeed; jumps = 0; comboTimer = 0;
    ship.y = GROUND - ship.h; ship.vy = 0; ship.flame = 0;
    obstacles = []; particles = []; spawnCd = 30;
    gameOver = false;
    initStars(); initCity();
  }

  function jump() {
    if (!running || gameOver) return;
    if (jumps &lt; 2) {
      ship.vy = JUMP_V; ship.flame = 12; jumps++;
      if (jumps === 2) burst(ship.x+ship.w/2, ship.y+ship.h/2, 14, [&#x27;#ffe07a&#x27;,&#x27;#ff6ec7&#x27;,&#x27;#4fd8ff&#x27;]);
    }
  }

  function spawnObstacle() {
    var h = 24 + Math.random()*48, w = 24 + Math.random()*30;
    obstacles.push({ x: W+20, y: GROUND-h, w:w, h:h, r:0,
      color: &#x27;hsl(&#x27;+(Math.random()*360)+&#x27;,70%,60%)&#x27;, scored:false });
  }

  function burst(x,y,n,colors) {
    for (var i=0;i&lt;n;i++){
      var a = Math.random()*Math.PI*2, sp = 1+Math.random()*4;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
        color: colors[(Math.random()*colors.length)|0]});
    }
  }

  function explode() {
    burst(ship.x+ship.w/2, ship.y+ship.h/2, 60, [&#x27;#ff6a00&#x27;,&#x27;#ffd000&#x27;,&#x27;#ff3060&#x27;,&#x27;#ffffff&#x27;]);
    gameOver = true;
  }

  function drawShip() {
    var x=ship.x, y=ship.y;
    // flame exhaust
    var fl = 8 + ship.flame*1.4 + Math.random()*4;
    var grad = ctx.createLinearGradient(x-fl,y+ship.h/2,x,y+ship.h/2);
    grad.addColorStop(0,&#x27;rgba(255,60,0,0)&#x27;); grad.addColorStop(0.5,&#x27;#ff8a00&#x27;); grad.addColorStop(1,&#x27;#ffe07a&#x27;);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x, y+ship.h*0.3); ctx.lineTo(x-fl, y+ship.h/2); ctx.lineTo(x, y+ship.h*0.7);
    ctx.closePath(); ctx.fill();
    // body
    ctx.save();
    ctx.shadowColor=&#x27;#4fd8ff&#x27;; ctx.shadowBlur=14;
    ctx.fillStyle=&#x27;#e8f4ff&#x27;;
    ctx.beginPath();
    ctx.moveTo(x, y+ship.h*0.2);
    ctx.lineTo(x+ship.w*0.7, y+ship.h*0.2);
    ctx.quadraticCurveTo(x+ship.w, y+ship.h/2, x+ship.w*0.7, y+ship.h*0.8);
    ctx.lineTo(x, y+ship.h*0.8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // window
    ctx.fillStyle=&#x27;#7b6cff&#x27;;
    ctx.beginPath(); ctx.arc(x+ship.w*0.55, y+ship.h/2, 4, 0, Math.PI*2); ctx.fill();
    // fin
    ctx.fillStyle=&#x27;#ff6ec7&#x27;;
    ctx.beginPath(); ctx.moveTo(x+ship.w*0.2,y+ship.h*0.2); ctx.lineTo(x+ship.w*0.05,y-2); ctx.lineTo(x+ship.w*0.4,y+ship.h*0.2); ctx.closePath(); ctx.fill();
  }

  function drawAsteroid(o) {
    var cx=o.x+o.w/2, cy=o.y+o.h/2;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(o.r);
    ctx.fillStyle=o.color; ctx.shadowColor=o.color; ctx.shadowBlur=12;
    ctx.beginPath();
    var pts=7;
    for(var i=0;i&lt;pts;i++){
      var a=(i/pts)*Math.PI*2;
      var rr=(i%2===0?0.5:0.38);
      ctx.lineTo(Math.cos(a)*o.w*rr, Math.sin(a)*o.h*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function tick() {
    if (!running) return;
    // background
    var bc = bgColor();
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,bc.top); g.addColorStop(1,bc.bot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // stars
    for(var l=0;l&lt;3;l++){
      ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+(0.4+l*0.2)+&#x27;)&#x27;;
      for(var i=0;i&lt;stars[l].length;i++){
        var s=stars[l][i];
        if(running &amp;&amp; !gameOver) s.x -= layerSpeed[l]*(speed/baseSpeed);
        if(s.x&lt;0){ s.x=W; s.y=Math.random()*(GROUND-10); }
        ctx.beginPath(); ctx.arc(s.x,s.y,layerSize[l],0,Math.PI*2); ctx.fill();
      }
    }

    // cityscape
    ctx.fillStyle=&#x27;rgba(15,5,35,0.85)&#x27;;
    for(var i=0;i&lt;city.length;i++){
      var b=city[i];
      if(running &amp;&amp; !gameOver) b.x -= 0.6*(speed/baseSpeed);
      if(b.x+b.w&lt;0){ // recycle to right
        var maxx=0; for(var j=0;j&lt;city.length;j++) maxx=Math.max(maxx,city[j].x+city[j].w);
        b.x=maxx+4; b.w=25+Math.random()*45; b.h=30+Math.random()*90;
      }
      ctx.fillRect(b.x, GROUND-b.h, b.w, b.h);
      // lit windows
      ctx.fillStyle=&#x27;rgba(255,220,120,0.5)&#x27;;
      for(var wy=GROUND-b.h+6; wy&lt;GROUND-6; wy+=12){
        for(var wx=b.x+4; wx&lt;b.x+b.w-4; wx+=10){
          if((wx*wy)%7&lt;3) ctx.fillRect(wx,wy,3,4);
        }
      }
      ctx.fillStyle=&#x27;rgba(15,5,35,0.85)&#x27;;
    }

    // ground
    ctx.fillStyle=&#x27;rgba(40,15,70,0.9)&#x27;;
    ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle=&#x27;rgba(180,120,255,0.6)&#x27;;
    ctx.fillRect(0,GROUND,W,2);

    if(!gameOver){
      // physics
      ship.vy += GRAVITY; ship.y += ship.vy;
      if(ship.y &gt; GROUND-ship.h){ ship.y=GROUND-ship.h; ship.vy=0; jumps=0; }
      if(ship.y&lt;0){ ship.y=0; ship.vy=0; }
      if(ship.flame&gt;0) ship.flame-=0.6;

      // spawn
      spawnCd--; if(spawnCd&lt;=0){ spawnObstacle(); spawnCd = Math.max(45, 110 - score*1.5); }

      // obstacles
      for(var i=obstacles.length-1;i&gt;=0;i--){
        var o=obstacles[i];
        o.x -= speed; o.r += 0.04;
        if(o.x+o.w&lt;0){ obstacles.splice(i,1); continue; }
        if(!o.scored &amp;&amp; o.x+o.w &lt; ship.x){
          o.scored=true; score++; scoreEl.textContent=score;
          speed = baseSpeed + score*0.08;
          if(score%5===0){ comboTimer=45; speed+=0.6; }
        }
        // collision
        if(ship.x+ship.w*0.9 &gt; o.x+o.w*0.15 &amp;&amp; ship.x+ship.w*0.1 &lt; o.x+o.w*0.85 &amp;&amp;
           ship.y+ship.h*0.9 &gt; o.y+o.h*0.15){
          explode();
        }
      }
    }

    for(var i=obstacles.length-1;i&gt;=0;i--) drawAsteroid(obstacles[i]);

    if(!gameOver) drawShip();

    // particles
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life-=0.02;
      if(p.life&lt;=0){ particles.splice(i,1); continue; }
      ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }

    // combo flash
    if(comboTimer&gt;0){
      comboTimer--;
      ctx.globalAlpha=Math.min(1,comboTimer/45);
      ctx.fillStyle=&#x27;#ffe07a&#x27;; ctx.font=&#x27;bold 40px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.shadowColor=&#x27;#ff6ec7&#x27;; ctx.shadowBlur=20;
      ctx.fillText(&#x27;COMBO!&#x27;, W/2, H/2);
      ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign=&#x27;left&#x27;;
    }

    // game over text
    if(gameOver &amp;&amp; particles.length===0){
      ctx.fillStyle=&#x27;rgba(0,0,0,0.5)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;bold 34px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;CRASHED&#x27;, W/2, H/2-10);
      ctx.font=&#x27;18px system-ui&#x27;; ctx.fillStyle=&#x27;#ffe07a&#x27;;
      ctx.fillText(&#x27;★ &#x27;+score+&#x27; — press Restart below&#x27;, W/2, H/2+24);
      ctx.textAlign=&#x27;left&#x27;;
      running=false; if(animId){cancelAnimationFrame(animId); animId=null;}
      return;
    }

    animId = requestAnimationFrame(tick);
  }

  function drawIdle() {
    var bc = bgColor();
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,bc.top); g.addColorStop(1,bc.bot);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=&#x27;#ccc&#x27;; ctx.font=&#x27;18px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;Press Start below to launch ★&#x27;, W/2, H/2);
    ctx.textAlign=&#x27;left&#x27;;
  }

  function startGame(){ if(running) return; reset(); running=true; animId=requestAnimationFrame(tick); }
  function stopGame(){ running=false; if(animId){cancelAnimationFrame(animId); animId=null;} }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;mousedown&#x27;, function(){ jump(); });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); } catch(_){}
    }, true);
  });

  initStars(); initCity(); drawIdle();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
