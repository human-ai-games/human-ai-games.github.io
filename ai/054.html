<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0d0d1a; color: #fff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← →, rotate with ↑, and press ↓ to drop faster (swipe on touch, tap to rotate). Clear full rows to score — four at once is a Frenzy!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat level&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Game Over&lt;/h2&gt;
      &lt;div class=&quot;fs&quot;&gt;Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 18;
  var W = COLS * CELL, H = ROWS * CELL;
  var cv = document.getElementById(&#x27;cv&#x27;);
  cv.width = W; cv.height = H;
  var ctx = cv.getContext(&#x27;2d&#x27;);
  document.getElementById(&#x27;field&#x27;).style.width = W + &#x27;px&#x27;;
  document.getElementById(&#x27;field&#x27;).style.height = H + &#x27;px&#x27;;

  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);

  var FRUITS = [
    { emoji:&#x27;🍉&#x27;, g:[&#x27;#ff6b6b&#x27;,&#x27;#c0392b&#x27;] },
    { emoji:&#x27;🍊&#x27;, g:[&#x27;#ffa94d&#x27;,&#x27;#e67e22&#x27;] },
    { emoji:&#x27;🍇&#x27;, g:[&#x27;#b39ddb&#x27;,&#x27;#7e57c2&#x27;] },
    { emoji:&#x27;🍓&#x27;, g:[&#x27;#ff8fa3&#x27;,&#x27;#e84393&#x27;] },
    { emoji:&#x27;🍋&#x27;, g:[&#x27;#fff176&#x27;,&#x27;#f9ca24&#x27;] },
    { emoji:&#x27;🍍&#x27;, g:[&#x27;#f6e58d&#x27;,&#x27;#d4b106&#x27;] },
    { emoji:&#x27;🥝&#x27;, g:[&#x27;#a8e063&#x27;,&#x27;#56ab2f&#x27;] }
  ];

  // Tetromino definitions (rotation states as coordinate lists)
  var SHAPES = {
    I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
    O:[[[1,0],[2,0],[1,1],[2,1]]],
    T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
    Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
    J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
    L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
  };
  var KEYS = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  var grid, piece, score, level, dropMs, running, dropId, nextSpeedUp;

  function emptyGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }

  function randPiece() {
    var k = KEYS[Math.floor(Math.random()*KEYS.length)];
    var f = Math.floor(Math.random()*FRUITS.length);
    return { key:k, rot:0, x:3, y:-1, fruit:f };
  }

  function cellsOf(p){
    var st = SHAPES[p.key][p.rot % SHAPES[p.key].length];
    var out=[];
    for(var i=0;i&lt;st.length;i++) out.push({x:p.x+st[i][0], y:p.y+st[i][1]});
    return out;
  }

  function collides(p){
    var cs = cellsOf(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x, y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function spawn(){
    piece = randPiece();
    if(collides(piece)){ endGame(); return false; }
    return true;
  }

  function lock(){
    var cs = cellsOf(piece);
    for(var i=0;i&lt;cs.length;i++){
      if(cs[i].y&gt;=0 &amp;&amp; cs[i].y&lt;ROWS) grid[cs[i].y][cs[i].x] = piece.fruit;
    }
  }

  function clearRows(){
    var cleared=0;
    for(var r=ROWS-1;r&gt;=0;r--){
      var full=true;
      for(var c=0;c&lt;COLS;c++) if(grid[r][c]===null){full=false;break;}
      if(full){ grid.splice(r,1); var e=[]; for(var c2=0;c2&lt;COLS;c2++) e.push(null); grid.unshift(e); cleared++; r++; }
    }
    if(cleared&gt;0){
      var pts = cleared===1?100:cleared===2?300:cleared===3?500:1000;
      score += pts;
      scoreEl.textContent = score;
      if(cleared===4){ flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;); }
      while(score &gt;= nextSpeedUp){
        nextSpeedUp += 200;
        level++;
        dropMs = Math.max(120, dropMs - 55);
        levelEl.textContent = level;
        if(running){ clearInterval(dropId); dropId = setInterval(stepDown, dropMs); }
      }
    }
  }

  function ghostY(){
    var g = { key:piece.key, rot:piece.rot, x:piece.x, y:piece.y };
    while(!collides({key:g.key,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g.y;
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawTile(cx,cy,fruitIdx,alpha){
    var x=cx*CELL, y=cy*CELL, pad=2;
    var f = FRUITS[fruitIdx];
    ctx.globalAlpha = alpha;
    var grad = ctx.createLinearGradient(x,y,x,y+CELL);
    grad.addColorStop(0,f.g[0]); grad.addColorStop(1,f.g[1]);
    ctx.fillStyle = grad;
    roundRect(x+pad,y+pad,CELL-pad*2,CELL-pad*2,6);
    ctx.fill();
    ctx.font = (CELL-8)+&#x27;px system-ui&#x27;;
    ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(f.emoji, x+CELL/2, y+CELL/2+1);
    ctx.globalAlpha = 1;
  }

  function draw(){
    ctx.fillStyle = &#x27;#12122a&#x27;;
    ctx.fillRect(0,0,W,H);
    // neon grid lines
    ctx.strokeStyle = &#x27;rgba(72,219,251,0.12)&#x27;;
    ctx.lineWidth = 1;
    for(var c=0;c&lt;=COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,H); ctx.stroke(); }
    for(var r=0;r&lt;=ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(W,r*CELL); ctx.stroke(); }
    // locked
    for(var rr=0;rr&lt;ROWS;rr++) for(var cc=0;cc&lt;COLS;cc++) if(grid[rr][cc]!==null) drawTile(cc,rr,grid[rr][cc],1);
    // ghost + piece
    if(piece){
      var gy = ghostY();
      var st = SHAPES[piece.key][piece.rot % SHAPES[piece.key].length];
      for(var i=0;i&lt;st.length;i++){
        var gx = piece.x+st[i][0], gyy = gy+st[i][1];
        if(gyy&gt;=0){ ctx.globalAlpha=0.22; ctx.strokeStyle=&#x27;#fff&#x27;; ctx.lineWidth=2; roundRect(gx*CELL+3,gyy*CELL+3,CELL-6,CELL-6,5); ctx.stroke(); ctx.globalAlpha=1; }
      }
      var cs = cellsOf(piece);
      for(var j=0;j&lt;cs.length;j++) if(cs[j].y&gt;=0) drawTile(cs[j].x,cs[j].y,piece.fruit,1);
    }
  }

  function stepDown(){
    if(!piece) return;
    var np = {key:piece.key,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(np)){ lock(); clearRows(); if(!spawn()){ draw(); return; } }
    else piece = np;
    draw();
  }

  function move(dx){
    if(!running||!piece) return;
    var np={key:piece.key,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if(!collides(np)){ piece=np; draw(); }
  }

  function rotate(){
    if(!running||!piece) return;
    var nr=(piece.rot+1)%SHAPES[piece.key].length;
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){
      var np={key:piece.key,rot:nr,x:piece.x+kicks[i],y:piece.y};
      if(!collides(np)){ piece=np; draw(); return; }
    }
  }

  function hardDrop(){
    if(!running||!piece) return;
    piece.y = ghostY();
    stepDown();
  }

  function endGame(){
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
    finalScoreEl.textContent = score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; level=1; dropMs=650; nextSpeedUp=200;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    emptyGrid();
    running=true;
    spawn();
    draw();
    if(dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropMs);
  }

  function stopGame(){
    running=false;
    if(dropId){ clearInterval(dropId); dropId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ if(running) stepDown(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
    else if(e.key===&#x27; &#x27;){ hardDrop(); e.preventDefault(); }
  });

  // Touch controls
  var tsX=0,tsY=0,tsT=0,moved=false;
  cv.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsX=t.clientX; tsY=t.clientY; tsT=Date.now(); moved=false; }, {passive:true});
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){
    var t=e.touches[0]; var dx=t.clientX-tsX, dy=t.clientY-tsY;
    if(Math.abs(dx)&gt;=CELL &amp;&amp; Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); tsX=t.clientX; moved=true; }
    else if(dy&gt;=CELL*1.4){ hardDrop(); tsY=t.clientY; moved=true; }
  }, {passive:true});
  cv.addEventListener(&#x27;touchend&#x27;, function(e){
    if(!moved &amp;&amp; Date.now()-tsT&lt;300) rotate();
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });

  // initial static paint
  emptyGrid(); score=0; level=1; piece=randPiece(); piece.y=1;
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
