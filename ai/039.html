&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: &#x27;Trebuchet MS&#x27;, system-ui, sans-serif; margin: 0; padding: 0; background: #05010f; color: #fff; overflow: hidden; }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .game { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; height: 640px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       color: #6cf; text-shadow: 0 0 8px #0af, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9ad; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 14px; align-items: center; justify-content: center; }
  .lcd { font-family: &#x27;Courier New&#x27;, monospace; font-weight: bold; font-size: 22px;
         background: #021107; border: 2px solid #0a3; border-radius: 6px; padding: 4px 12px;
         color: #3f6; text-shadow: 0 0 6px #2f5, 0 0 12px #0f5; box-shadow: inset 0 0 10px #041; }
  .board-wrap { position: relative; }
  .board { position: relative; width: 480px; height: 400px; display: grid;
           grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
           gap: 12px; }
  .cell { position: relative; overflow: hidden; border-radius: 50%/40%;
          background: radial-gradient(ellipse at center, #1a0d33 0%, #0a0520 70%, #060312 100%);
          box-shadow: inset 0 -6px 14px #000, 0 0 12px #40f6 , inset 0 4px 10px #a3f4;
          border: 2px solid #513a8a; }
  .hole-lip { position: absolute; left: 8%; right: 8%; bottom: 14%; height: 22px;
              border-radius: 50%; background: radial-gradient(ellipse, #000 40%, transparent 70%); }
  .alien { position: absolute; left: 50%; bottom: -100%; transform: translateX(-50%);
           width: 78px; height: 78px; cursor: pointer; transition: bottom 0.18s ease-out;
           display: flex; align-items: center; justify-content: center; font-size: 60px;
           filter: drop-shadow(0 0 6px currentColor); }
  .alien.up { bottom: 18%; animation: wobble 0.5s ease-in-out infinite alternate; }
  .alien.golden { animation: wobble 0.28s ease-in-out infinite alternate, flashgold 0.3s infinite alternate; }
  @keyframes wobble { from { transform: translateX(-50%) rotate(-7deg) scale(1); } to { transform: translateX(-50%) rotate(7deg) scale(1.06); } }
  @keyframes flashgold { from { filter: drop-shadow(0 0 4px #fd0) brightness(1); } to { filter: drop-shadow(0 0 16px #ff0) brightness(1.6); } }
  .angry { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); font-size: 44px; }
  .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; z-index: 5; }
  .floatscore { position: absolute; font-weight: 900; font-size: 30px; pointer-events: none; z-index: 6;
                text-shadow: 0 0 8px currentColor; }
  @keyframes floatup { from { transform: translate(-50%,0) scale(0.6); opacity: 1; }
                       to { transform: translate(-50%,-70px) scale(1.4); opacity: 0; } }
  .combo { height: 30px; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
  .shake { animation: shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-6px,4px);}
                     40%{transform:translate(6px,-4px);} 60%{transform:translate(-5px,-3px);}
                     80%{transform:translate(5px,3px);} }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;

             text-align: center; }
  .overlay h2 { font-size: 32px; margin: 0 0 8px; color: #6cf; text-shadow: 0 0 12px #08f; }
  .overlay p { font-size: 18px; margin: 4px 0; color: #cde; }

&lt;canvas id=&quot;stars&quot;&gt;&lt;/canvas&gt;
&lt;div class=&quot;game&quot; id=&quot;game&quot;&gt;
  &lt;h1&gt;ZAP THE ALIENS!&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the aliens as they pop from the glowing craters — green = 1, purple = 2, rare golden UFO = 5. Hit them fast in a row to build a combo before the 60 seconds run out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lcd&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;lcd&quot;&gt;TIME &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;board-wrap&quot;&gt;
    &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;READY?&lt;/h2&gt;
      &lt;p&gt;Press Start below to defend the galaxy.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
  // ---- starfield ----
  var canvas = document.getElementById(&#x27;stars&#x27;), sctx = canvas.getContext(&#x27;2d&#x27;);
  var starList = [];
  function sizeStars() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    starList = [];
    for (var i = 0; i &lt; 90; i++) starList.push({
      x: Math.random()*canvas.width, y: Math.random()*canvas.height,
      r: Math.random()*1.6+0.4, ph: Math.random()*Math.PI*2, sp: Math.random()*0.05+0.01
    });
  }
  sizeStars();
  window.addEventListener(&#x27;resize&#x27;, sizeStars);
  var starRAF = null;
  function drawStars() {
    sctx.clearRect(0,0,canvas.width,canvas.height);
    for (var i=0;i&lt;starList.length;i++){
      var s=starList[i]; s.ph+=s.sp;
      var a=0.4+0.6*Math.abs(Math.sin(s.ph));
      sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,7); 
      sctx.fillStyle=&#x27;rgba(180,220,255,&#x27;+a+&#x27;)&#x27;; sctx.fill();
    }
    starRAF = requestAnimationFrame(drawStars);
  }
  drawStars(); // stars always twinkle, even before start

  // ---- game ----
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var gameEl = document.getElementById(&#x27;game&#x27;);

  var TYPES = {
    green:  { emoji:&#x27;👽&#x27;, pts:1, color:&#x27;#4f8&#x27;, life:[1100,1600], weight:60 },
    purple: { emoji:&#x27;👾&#x27;, pts:2, color:&#x27;#c6f&#x27;, life:[850,1200],  weight:32 },
    golden: { emoji:&#x27;🛸&#x27;, pts:5, color:&#x27;#fd3&#x27;, life:[550,750],   weight:8  }
  };

  var cells = [];
  for (var i=0;i&lt;9;i++){
    var c=document.createElement(&#x27;div&#x27;); c.className=&#x27;cell&#x27;;
    var lip=document.createElement(&#x27;div&#x27;); lip.className=&#x27;hole-lip&#x27;; c.appendChild(lip);
    board.appendChild(c);
    cells.push({el:c, occupied:false});
  }

  var running=false, score=0, timeLeft=60;
  var spawnTimer=null, countdownTimer=null, elapsed=0;
  var combo=0, lastHitTime=0;

  function pickType(){
    var r=Math.random()*100, acc=0;
    for (var k in TYPES){ acc+=TYPES[k].weight; if (r&lt;acc) return k; }
    return &#x27;green&#x27;;
  }

  function spawnAlien(){
    if (!running) return;
    var free=[]; for (var i=0;i&lt;cells.length;i++) if (!cells[i].occupied) free.push(i);
    if (!free.length) return;
    var idx=free[Math.floor(Math.random()*free.length)];
    var cell=cells[idx]; cell.occupied=true;
    var typeKey=pickType(); var t=TYPES[typeKey];

    var a=document.createElement(&#x27;div&#x27;);
    a.className=&#x27;alien&#x27;+(typeKey===&#x27;golden&#x27;?&#x27; golden&#x27;:&#x27;&#x27;);
    a.textContent=t.emoji; a.style.color=t.color;
    cell.el.appendChild(a);
    requestAnimationFrame(function(){ a.classList.add(&#x27;up&#x27;); });

    // shrink life as difficulty ramps
    var ramp = Math.min(elapsed/50, 1); // 0..1 over the round
    var lifeMin=t.life[0]*(1-0.4*ramp), lifeMax=t.life[1]*(1-0.4*ramp);
    var life = lifeMin + Math.random()*(lifeMax-lifeMin);

    var done=false;
    function despawn(missed){
      if (done) return; done=true;
      if (missed &amp;&amp; running){ showAngry(cell); combo=0; comboEl.textContent=&#x27;&#x27;; }
      a.style.bottom=&#x27;-100%&#x27;;
      setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); cell.occupied=false; }, 200);
    }
    var lifeTO=setTimeout(function(){ despawn(true); }, life);

    a.addEventListener(&#x27;mousedown&#x27;, function(ev){
      if (done||!running) return;
      clearTimeout(lifeTO);
      score+=t.pts; scoreEl.textContent=score;
      registerCombo();
      splat(cell, t.color);
      floatScore(cell, t.pts, t.color);
      screenShake();
      beep(typeKey);
      done=true;
      if(a.parentNode) a.parentNode.removeChild(a);
      cell.occupied=false;
      ev.stopPropagation();
    });
  }

  function registerCombo(){
    var now=Date.now();
    if (now-lastHitTime &lt; 1200) combo++; else combo=1;
    lastHitTime=now;
    if (combo&gt;=2){
      var msg = combo&gt;=5 ? &#x27;UNSTOPPABLE! x&#x27;+combo :
                combo&gt;=3 ? &#x27;ON FIRE! x&#x27;+combo : &#x27;COMBO x&#x27;+combo+&#x27;!&#x27;;
      var hue = combo&gt;=5?&#x27;#f4f&#x27;:combo&gt;=3?&#x27;#f83&#x27;:&#x27;#fd3&#x27;;
      comboEl.style.color=hue; comboEl.style.textShadow=&#x27;0 0 10px &#x27;+hue;
      comboEl.textContent=msg;
      comboEl.style.transform=&#x27;scale(1.25)&#x27;;
      setTimeout(function(){ comboEl.style.transform=&#x27;scale(1)&#x27;; },120);
    }
  }

  function showAngry(cell){
    var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;angry&#x27;; f.textContent=&#x27;😠&#x27;;
    cell.el.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 350);
  }

  function splat(cell, color){
    var rect=cell.el.getBoundingClientRect(), bw=board.getBoundingClientRect();
    var cx=rect.left-bw.left+rect.width/2, cy=rect.top-bw.top+rect.height/2;
    var palette=[color,&#x27;#fff&#x27;,&#x27;#ff6&#x27;,&#x27;#6ff&#x27;,&#x27;#f6f&#x27;];
    for (var i=0;i&lt;14;i++){
      var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
      p.style.background=palette[i%palette.length];
      p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;;
      p.style.boxShadow=&#x27;0 0 8px &#x27;+p.style.background;
      board.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=40+Math.random()*50;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.animate([
        {transform:&#x27;translate(0,0) scale(1)&#x27;,opacity:1},
        {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(0.2)&#x27;,opacity:0}
      ],{duration:500,easing:&#x27;ease-out&#x27;});
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },520); })(p);
    }
  }

  function floatScore(cell, pts, color){
    var rect=cell.el.getBoundingClientRect(), bw=board.getBoundingClientRect();
    var cx=rect.left-bw.left+rect.width/2, cy=rect.top-bw.top+rect.height/2;
    var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;floatscore&#x27;;
    f.textContent=&#x27;+&#x27;+pts; f.style.color=color;
    f.style.left=cx+&#x27;px&#x27;; f.style.top=(cy-20)+&#x27;px&#x27;;
    f.style.transform=&#x27;translate(-50%,0)&#x27;;
    f.style.animation=&#x27;floatup 0.8s ease-out forwards&#x27;;
    board.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },820);
  }

  function screenShake(){
    gameEl.classList.remove(&#x27;shake&#x27;); void gameEl.offsetWidth; gameEl.classList.add(&#x27;shake&#x27;);
  }

  // ---- sound ----
  var actx=null;
  function beep(type){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      var f = type===&#x27;golden&#x27;?880 : type===&#x27;purple&#x27;?520 : 340;
      o.frequency.setValueAtTime(f, actx.currentTime);
      o.frequency.exponentialRampToValueAtTime(f*2, actx.currentTime+0.12);
      o.type=&#x27;square&#x27;;
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.18);
      o.start(); o.stop(actx.currentTime+0.2);
    }catch(_){}
  }

  function scheduleSpawns(){
    if(!running) return;
    // difficulty: more simultaneous spawns + faster interval over time
    var ramp=Math.min(elapsed/55,1);
    var burst = 1 + Math.floor(Math.random()* (1 + Math.round(ramp*2))); // 1..~3
    for(var i=0;i&lt;burst;i++) spawnAlien();
    var interval = 950 - ramp*550; // 950ms -&gt; 400ms
    spawnTimer=setTimeout(scheduleSpawns, interval);
  }

  function tick(){
    if(!running) return;
    timeLeft--; elapsed++;
    timeEl.textContent=Math.max(timeLeft,0);
    if(timeLeft&lt;=0){ endGame(); return; }
    countdownTimer=setTimeout(tick,1000);
  }

  function clearBoard(){
    if(spawnTimer){clearTimeout(spawnTimer);spawnTimer=null;}
    if(countdownTimer){clearTimeout(countdownTimer);countdownTimer=null;}
    for(var i=0;i&lt;cells.length;i++){
      cells[i].occupied=false;
      var lip=cells[i].el.querySelector(&#x27;.hole-lip&#x27;);
      cells[i].el.innerHTML=&#x27;&#x27;; cells[i].el.appendChild(lip);
    }
    var extras=board.querySelectorAll(&#x27;.particle,.floatscore&#x27;);
    for(var j=0;j&lt;extras.length;j++) extras[j].remove();
  }

  function startGame(){
    running=true; score=0; timeLeft=60; elapsed=0; combo=0; lastHitTime=0;
    scoreEl.textContent=&#x27;0&#x27;; timeEl.textContent=&#x27;60&#x27;; comboEl.textContent=&#x27;&#x27;;
    overlay.style.display=&#x27;none&#x27;;
    clearBoard();
    scheduleSpawns(); // spawns immediately
    countdownTimer=setTimeout(tick,1000);
  }

  function stopGame(){
    running=false;
    if(spawnTimer){clearTimeout(spawnTimer);spawnTimer=null;}
    if(countdownTimer){clearTimeout(countdownTimer);countdownTimer=null;}
  }

  function endGame(){
    running=false; clearBoard();
    overlay.innerHTML=&#x27;&lt;h2&gt;INVASION REPELLED!&lt;/h2&gt;&lt;p&gt;Final Score: &#x27;+score+&#x27;&lt;/p&gt;&lt;p&gt;Press Start below to play again.&lt;/p&gt;&#x27;;
    overlay.style.display=&#x27;flex&#x27;;
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });

  <div class="controls">

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;

    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
