<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a0b2e; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; background: linear-gradient(90deg,#ffd93d,#ff6b9d,#6bffb8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #d8c8ff; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .main { display: flex; gap: 14px; align-items: flex-start; }
  .field { position: relative; background: linear-gradient(160deg,#0fb8c4,#3a1a6e 60%,#2a0d52); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.4); overflow: hidden; }
  .side { display: flex; flex-direction: column; gap: 12px; width: 120px; }
  .panel { background: rgba(255,255,255,.1); border-radius: 10px; padding: 10px; text-align: center; }
  .panel .label { font-size: 14px; color: #ffd93d; font-weight: 700; letter-spacing: .5px; }
  .score-val { font-size: 34px; font-weight: 800; color: #fff; transition: transform .12s; }
  .score-val.pop { transform: scale(1.5); }
  .next { position: relative; width: 96px; height: 96px; margin: 6px auto 0; }
  .cell { position: absolute; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .ghost { opacity: .28; }
  .combo { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%) scale(.5); font-size: 30px; font-weight: 900; color: #ffd93d; text-shadow: 0 2px 8px #000; opacity: 0; pointer-events: none; }
  .combo.show { animation: comboPop .9s ease-out; }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); }
    25% { opacity: 1; transform: translate(-50%,-90%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%,-150%) scale(1); }
  }

  .flash.on { animation: flashFx .3s ease-out; }
  @keyframes flashFx { 0%{opacity:.7;} 100%{opacity:0;} }

  .over p { margin: 0; font-size: 18px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;←/→&lt;/strong&gt; (or A/D), rotate with &lt;strong&gt;↑/W&lt;/strong&gt;, soft-drop with &lt;strong&gt;↓&lt;/strong&gt;, and slam down with &lt;strong&gt;Space&lt;/strong&gt;. Fill a full row to clear it and score — use the Start/Restart button below!&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;+COMBO!&lt;/div&gt;
      &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;h2&gt;Game Over&lt;/h2&gt;&lt;p id=&quot;finalScore&quot;&gt;&lt;/p&gt;&lt;p style=&quot;font-size:15px;color:#d8c8ff&quot;&gt;Press Restart below&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;SCORE&lt;/div&gt;&lt;div class=&quot;score-val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;NEXT&lt;/div&gt;&lt;div class=&quot;next&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;LEVEL&lt;/div&gt;&lt;div class=&quot;score-val&quot; id=&quot;level&quot; style=&quot;font-size:26px&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 30, COLS = 12, ROWS = 18;
  var FIELD_W = COLS*CELL, FIELD_H = ROWS*CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  field.style.width = FIELD_W+&#x27;px&#x27;;
  field.style.height = FIELD_H+&#x27;px&#x27;;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var nextEl = document.getElementById(&#x27;next&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);

  // Tetromino definitions: rotation states as list of [x,y] offsets.
  var PIECES = {
    I: { fruit:&#x27;🍌&#x27;, color:&#x27;#ffd93d&#x27;, rot:[
      [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]], [[1,0],[1,1],[1,2],[1,3]] ] },
    O: { fruit:&#x27;🍊&#x27;, color:&#x27;#ff9f1c&#x27;, rot:[
      [[1,0],[2,0],[1,1],[2,1]] ] },
    T: { fruit:&#x27;🍇&#x27;, color:&#x27;#b15dff&#x27;, rot:[
      [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },
    S: { fruit:&#x27;🍏&#x27;, color:&#x27;#6bffb8&#x27;, rot:[
      [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]] ] },
    Z: { fruit:&#x27;🍎&#x27;, color:&#x27;#ff4d6d&#x27;, rot:[
      [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]] ] },
    J: { fruit:&#x27;🫐&#x27;, color:&#x27;#4d8bff&#x27;, rot:[
      [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] },
    L: { fruit:&#x27;🍋&#x27;, color:&#x27;#ffe14d&#x27;, rot:[
      [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] }
  };
  var KEYS = Object.keys(PIECES);

  var grid, piece, nextPiece, score, level, running, dropId, dropMs;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function randPiece(){
    var k = KEYS[Math.floor(Math.random()*KEYS.length)];
    return { key:k, rot:0, x:Math.floor((COLS-4)/2), y:-1 };
  }

  function cellsOf(p){
    var def = PIECES[p.key];
    var offs = def.rot[p.rot % def.rot.length];
    var out=[];
    for(var i=0;i&lt;offs.length;i++) out.push({x:p.x+offs[i][0], y:p.y+offs[i][1]});
    return out;
  }

  function collides(p){
    var cells = cellsOf(p);
    for(var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if(cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawn(){
    piece = nextPiece || randPiece();
    piece.x = Math.floor((COLS-4)/2); piece.y=-1; piece.rot=0;
    nextPiece = randPiece();
    drawNext();
    if(collides(piece)) return false;
    return true;
  }

  function lock(){
    var cells=cellsOf(piece), def=PIECES[piece.key];
    for(var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]={fruit:def.fruit,color:def.color};
    }
  }

  function clearRows(){
    var cleared=0;
    for(var r=ROWS-1;r&gt;=0;r--){
      var full=true;
      for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;}
      if(full){
        grid.splice(r,1);
        var empty=[]; for(var c2=0;c2&lt;COLS;c2++)empty.push(null);
        grid.unshift(empty);
        cleared++; r++;
      }
    }
    if(cleared&gt;0){
      var pts=[0,1,3,6,10][cleared];
      score+=pts;
      scoreEl.textContent=score;
      popScore();
      beep(cleared);
      var newLevel=Math.floor(score/10)+1;
      if(newLevel!==level){ level=newLevel; levelEl.textContent=level; updateSpeed(); }
      if(cleared&gt;=2){ showCombo(cleared); doFlash(); }
    }
  }

  function popScore(){ scoreEl.classList.add(&#x27;pop&#x27;); setTimeout(function(){scoreEl.classList.remove(&#x27;pop&#x27;);},130); }
  function showCombo(n){ comboEl.textContent=&#x27;+&#x27;+n+&#x27; COMBO!&#x27;; comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;); }
  function doFlash(){ flashEl.classList.remove(&#x27;on&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;on&#x27;); }

  function updateSpeed(){
    dropMs = Math.max(120, 600 - (level-1)*45);
    if(running){ clearInterval(dropId); dropId=setInterval(stepDown, dropMs); }
  }

  function ghostPos(){
    var g={key:piece.key,rot:piece.rot,x:piece.x,y:piece.y};
    while(!collides({key:g.key,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function makeCell(cx,cy,def,ghost){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(ghost?&#x27; ghost&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;;
    el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.fontSize=(CELL*0.62)+&#x27;px&#x27;;
    el.style.background=ghost?&#x27;transparent&#x27;:&#x27;radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), &#x27;+def.color+&#x27; 70%)&#x27;;
    if(ghost) el.style.border=&#x27;2px dashed rgba(255,255,255,.6)&#x27;;
    el.textContent=ghost?&#x27;&#x27;:def.fruit;
    return el;
  }

  function paint(){
    // clear cells but keep overlays
    var old=field.querySelectorAll(&#x27;.cell&#x27;);
    for(var i=0;i&lt;old.length;i++) old[i].remove();
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++){
      if(grid[r][c]) field.appendChild(makeCell(c,r,grid[r][c],false));
    }
    if(piece){
      var g=ghostPos(), gcells=cellsOf(g);
      for(var i=0;i&lt;gcells.length;i++) if(gcells[i].y&gt;=0) field.appendChild(makeCell(gcells[i].x,gcells[i].y,PIECES[piece.key],true));
      var cells=cellsOf(piece), def=PIECES[piece.key];
      for(var j=0;j&lt;cells.length;j++) if(cells[j].y&gt;=0) field.appendChild(makeCell(cells[j].x,cells[j].y,def,false));
    }
  }

  function drawNext(){
    nextEl.innerHTML=&#x27;&#x27;;
    if(!nextPiece) return;
    var def=PIECES[nextPiece.key];
    var offs=def.rot[0];
    var minx=99,miny=99,maxx=-9,maxy=-9;
    for(var i=0;i&lt;offs.length;i++){minx=Math.min(minx,offs[i][0]);miny=Math.min(miny,offs[i][1]);maxx=Math.max(maxx,offs[i][0]);maxy=Math.max(maxy,offs[i][1]);}
    var w=maxx-minx+1,h=maxy-miny+1, nc=22;
    var offX=(96-w*nc)/2, offY=(96-h*nc)/2;
    for(var j=0;j&lt;offs.length;j++){
      var el=document.createElement(&#x27;div&#x27;);
      el.className=&#x27;cell&#x27;;
      el.style.left=(offX+(offs[j][0]-minx)*nc)+&#x27;px&#x27;;
      el.style.top=(offY+(offs[j][1]-miny)*nc)+&#x27;px&#x27;;
      el.style.width=nc+&#x27;px&#x27;; el.style.height=nc+&#x27;px&#x27;; el.style.fontSize=(nc*0.62)+&#x27;px&#x27;;
      el.style.background=&#x27;radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), &#x27;+def.color+&#x27; 70%)&#x27;;
      el.textContent=def.fruit;
      nextEl.appendChild(el);
    }
  }

  function stepDown(){
    if(!piece) return;
    var n={key:piece.key,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(n)){
      lock(); clearRows();
      if(!spawn()){ endGame(); paint(); return; }
    } else { piece=n; }
    paint();
  }

  function move(dx){
    if(!running||!piece)return;
    var n={key:piece.key,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if(!collides(n)){piece=n;paint();}
  }
  function rotate(){
    if(!running||!piece)return;
    var nr=(piece.rot+1)%PIECES[piece.key].rot.length;
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){
      var n={key:piece.key,rot:nr,x:piece.x+kicks[i],y:piece.y};
      if(!collides(n)){piece=n;paint();return;}
    }
  }
  function hardDrop(){
    if(!running||!piece)return;
    var g=ghostPos(); piece.y=g.y;
    lock(); clearRows();
    if(!spawn()){endGame();paint();return;}
    paint();
  }

  // Web Audio
  var audioCtx=null;
  function beep(n){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      var t=audioCtx.currentTime;
      for(var i=0;i&lt;n;i++){
        var o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type=&#x27;triangle&#x27;; o.frequency.value=440+i*120;
        g.gain.setValueAtTime(0.0001,t+i*0.06);
        g.gain.exponentialRampToValueAtTime(0.2,t+i*0.06+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.06+0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t+i*0.06); o.stop(t+i*0.06+0.2);
      }
    }catch(_){}
  }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} finalScoreEl.textContent=&#x27;Score: &#x27;+score; overEl.classList.add(&#x27;show&#x27;); }

  function startGame(){
    score=0; level=1; scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    overEl.classList.remove(&#x27;show&#x27;);
    newGrid(); nextPiece=randPiece();
    if(!spawn())return;
    dropMs=600; running=true;
    if(dropId)clearInterval(dropId);
    dropId=setInterval(stepDown,dropMs);
    paint();
  }
  function stopGame(){ if(dropId){clearInterval(dropId);dropId=null;} running=false; }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(!running)return;
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;a&#x27;||e.key===&#x27;A&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;||e.key===&#x27;d&#x27;||e.key===&#x27;D&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;||e.key===&#x27;s&#x27;||e.key===&#x27;S&#x27;){stepDown();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;w&#x27;||e.key===&#x27;W&#x27;){rotate();e.preventDefault();}
    else if(e.key===&#x27; &#x27;){hardDrop();e.preventDefault();}
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial preview
  newGrid(); nextPiece=randPiece(); piece=randPiece(); piece.y=0; drawNext(); paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {

  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;

    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
