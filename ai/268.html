  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }

       background: linear-gradient(90deg,#4df,#a6f,#f6a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9aa; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 26px; align-items: center; font-size: 20px; }
  .hud .lbl { color: #78a; font-size: 13px; letter-spacing: 1px; }
  #score { color: #4df; font-weight: 700; display: inline-block; }
  #wave { color: #f6a; font-weight: 700; }
  #lives { color: #ff6; font-weight: 700; }
  canvas { border-radius: 10px; box-shadow: 0 0 24px rgba(80,120,255,0.25); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC DEFENDER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your neon paddle with the mouse or arrow keys to bounce the comet into the alien bricks. Hit the edges of the paddle for sharp angles, and chain breaks quickly for combo multipliers!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;WAVE&lt;/span&gt; &lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;SHIPS&lt;/span&gt; &lt;span id=&quot;lives&quot;&gt;3&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), waveEl = document.getElementById(&#x27;wave&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

var running = false, animId = null;
var keys = {}, mouseX = null;

// paddle
var PADDLE_W = 96, PADDLE_H = 12, PADDLE_Y = H - 26, PADDLE_SPEED = 8;
var paddleX = (W - PADDLE_W)/2;

// ball
var BALL_R = 7;
var ball = { x:0, y:0, vx:0, vy:0, speed:4.2, trail:[], stuck:true, invincUntil:0 };

// bricks
var COLS = 10, ROWS = 5, BRICK_TOP = 40, BRICK_GAP = 4;
var BRICK_W = (W - BRICK_GAP*(COLS+1))/COLS;
var BRICK_H = 20;
var bricks = [];
var rowColors = [&#x27;#f6a&#x27;,&#x27;#c8f&#x27;,&#x27;#7cf&#x27;,&#x27;#6fd&#x27;,&#x27;#ad6&#x27;]; // top-&gt;bottom
var rowGlow   = [&#x27;#f2c&#x27;,&#x27;#a4f&#x27;,&#x27;#4cf&#x27;,&#x27;#3fd&#x27;,&#x27;#9d3&#x27;];

// effects
var particles = [], flash = 0, shockwaves = [], combos = [];
var comboCount = 0, comboTimer = 0, comboMult = 1;

var score = 0, wave = 1, lives = 3;

// stars (parallax)
var starLayers = [];
function initStars(){
  starLayers = [];
  var defs = [{n:40,s:0.15,r:0.8,a:0.4},{n:30,s:0.35,r:1.3,a:0.7},{n:18,s:0.7,r:2.0,a:1.0}];
  defs.forEach(function(d){
    var arr = [];
    for(var i=0;i&lt;d.n;i++) arr.push({x:Math.random()*W,y:Math.random()*H,r:d.r*(0.6+Math.random()*0.6)});
    starLayers.push({stars:arr,speed:d.s,alpha:d.a});
  });
}
initStars();

function buildBricks(){
  bricks = [];
  for(var r=0;r&lt;ROWS;r++){
    for(var c=0;c&lt;COLS;c++){
      bricks.push({
        x: BRICK_GAP + c*(BRICK_W+BRICK_GAP),
        y: BRICK_TOP + r*(BRICK_H+BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        row: r, alive: true,
        pts: (r&lt;2?3:(r&lt;3?2:1))
      });
    }
  }
}

function resetBall(){
  ball.stuck = true;
  ball.trail = [];
  ball.x = paddleX + PADDLE_W/2;
  ball.y = PADDLE_Y - BALL_R - 2;
  ball.vx = 0; ball.vy = 0;
  ball.invincUntil = performance.now() + 1200;
}

function launchBall(){
  if(!ball.stuck) return;
  ball.stuck = false;
  var ang = (-Math.PI/2) + (Math.random()*0.6-0.3);
  ball.vx = Math.cos(ang)*ball.speed;
  ball.vy = Math.sin(ang)*ball.speed;
}

function startGame(){
  running = true;
  score = 0; wave = 1; lives = 3; ball.speed = 4.2;
  comboCount = 0; comboMult = 1; comboTimer = 0;
  particles = []; shockwaves = []; combos = []; flash = 0;
  paddleX = (W - PADDLE_W)/2;
  mouseX = null;
  for(var k in keys) keys[k] = false;
  buildBricks();
  resetBall();
  updateHUD();
  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}
function stopGame(){
  running = false;
  if(animId){ cancelAnimationFrame(animId); animId = null; }
}

function updateHUD(){
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  livesEl.textContent = lives;
}

function spawnParticles(x,y,color){
  for(var i=0;i&lt;14;i++){
    var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3.5;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color,r:1+Math.random()*2.5});
  }
}

function addCombo(){
  comboCount++;
  comboTimer = 90; // frames
  comboMult = Math.min(8, 1 + Math.floor(comboCount/2));
  if(comboMult &gt;= 2){
    combos.push({text:&#x27;x&#x27;+comboMult, life:1, y:H/2-40});
  }
}
function breakCombo(){ comboCount = 0; comboMult = 1; comboTimer = 0; }

function ballHitPaddle(){
  var hit = (ball.x - (paddleX+PADDLE_W/2)) / (PADDLE_W/2); // -1..1
  hit = Math.max(-1,Math.min(1,hit));
  var maxAng = Math.PI*0.42; // sharp at edges
  var ang = -Math.PI/2 + hit*maxAng;
  ball.vx = Math.cos(ang)*ball.speed;
  ball.vy = Math.sin(ang)*ball.speed;
  ball.y = PADDLE_Y - BALL_R - 1;
}

function loseBall(){
  shockwaves.push({x:ball.x,y:ball.y,r:6,life:1});
  flash = Math.max(flash,0.4);
  breakCombo();
  lives--;
  updateHUD();
  if(lives&lt;=0){
    // game over -&gt; restart wave setup but keep running until Restart
    resetBall();
    lives = 3;
    score = 0;
    wave = 1;
    ball.speed = 4.2;
    buildBricks();
    updateHUD();
  } else {
    resetBall();
  }
}

function update(){
  // stars drift
  starLayers.forEach(function(L){
    L.stars.forEach(function(s){
      s.y += L.speed;
      if(s.y &gt; H) { s.y = 0; s.x = Math.random()*W; }
    });
  });

  // paddle control
  if(keys[&#x27;ArrowLeft&#x27;]) { paddleX -= PADDLE_SPEED; mouseX = null; }
  if(keys[&#x27;ArrowRight&#x27;]) { paddleX += PADDLE_SPEED; mouseX = null; }
  if(mouseX !== null) paddleX = mouseX - PADDLE_W/2;
  paddleX = Math.max(0, Math.min(W-PADDLE_W, paddleX));

  // ball
  if(ball.stuck){
    ball.x = paddleX + PADDLE_W/2;
    ball.y = PADDLE_Y - BALL_R - 2;
  } else {
    ball.x += ball.vx;
    ball.y += ball.vy;
    // trail
    ball.trail.push({x:ball.x,y:ball.y});
    if(ball.trail.length &gt; 12) ball.trail.shift();

    // walls
    if(ball.x - BALL_R &lt;= 0){ ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
    if(ball.x + BALL_R &gt;= W){ ball.x = W-BALL_R; ball.vx = -Math.abs(ball.vx); }
    if(ball.y - BALL_R &lt;= 0){ ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

    // paddle
    if(ball.vy &gt; 0 &amp;&amp; ball.y + BALL_R &gt;= PADDLE_Y &amp;&amp; ball.y - BALL_R &lt;= PADDLE_Y + PADDLE_H &amp;&amp;
       ball.x &gt;= paddleX - BALL_R &amp;&amp; ball.x &lt;= paddleX + PADDLE_W + BALL_R){
      ballHitPaddle();
      breakCombo();
    }

    // bricks
    for(var i=0;i&lt;bricks.length;i++){
      var b = bricks[i];
      if(!b.alive) continue;
      if(ball.x + BALL_R &gt; b.x &amp;&amp; ball.x - BALL_R &lt; b.x+b.w &amp;&amp;
         ball.y + BALL_R &gt; b.y &amp;&amp; ball.y - BALL_R &lt; b.y+b.h){
        b.alive = false;
        // decide bounce axis
        var overlapL = (ball.x+BALL_R) - b.x;
        var overlapR = (b.x+b.w) - (ball.x-BALL_R);
        var overlapT = (ball.y+BALL_R) - b.y;
        var overlapB = (b.y+b.h) - (ball.y-BALL_R);
        var minO = Math.min(overlapL,overlapR,overlapT,overlapB);
        if(minO===overlapL || minO===overlapR) ball.vx = -ball.vx;
        else ball.vy = -ball.vy;

        addCombo();
        var gain = b.pts * comboMult;
        score += gain;
        spawnParticles(b.x+b.w/2, b.y+b.h/2, rowColors[b.row]);
        flash = Math.max(flash, 0.25);
        updateHUD();
        break;
      }
    }

    // lost
    if(ball.y - BALL_R &gt; H){ loseBall(); }
  }

  // combo timer
  if(comboTimer &gt; 0){ comboTimer--; if(comboTimer===0) breakCombo(); }

  // check wave clear
  var anyAlive = false;
  for(var j=0;j&lt;bricks.length;j++){ if(bricks[j].alive){ anyAlive=true; break; } }
  if(!anyAlive){
    wave++;
    ball.speed = Math.min(9, ball.speed + 0.6);
    buildBricks();
    flash = 0.6;
    updateHUD();
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt = particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=0.03;
    if(pt.life&lt;=0) particles.splice(p,1);
  }
  // shockwaves
  for(var s=shockwaves.length-1;s&gt;=0;s--){
    var sw = shockwaves[s]; sw.r += 4; sw.life -= 0.04;
    if(sw.life&lt;=0) shockwaves.splice(s,1);
  }
  // combos text
  for(var c=combos.length-1;c&gt;=0;c--){
    combos[c].y -= 0.6; combos[c].life -= 0.02;
    if(combos[c].life&lt;=0) combos.splice(c,1);
  }
  if(flash&gt;0) flash -= 0.04;
}

function draw(){
  // background gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#0a0c25&#x27;); g.addColorStop(0.5,&#x27;#0d0820&#x27;); g.addColorStop(1,&#x27;#05060f&#x27;);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars
  starLayers.forEach(function(L){
    ctx.globalAlpha = L.alpha;
    ctx.fillStyle = &#x27;#cfe0ff&#x27;;
    L.stars.forEach(function(s){
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    });
  });
  ctx.globalAlpha = 1;

  // bricks
  for(var i=0;i&lt;bricks.length;i++){
    var b = bricks[i];
    if(!b.alive) continue;
    ctx.shadowColor = rowGlow[b.row]; ctx.shadowBlur = 8;
    ctx.fillStyle = rowColors[b.row];
    roundRect(b.x,b.y,b.w,b.h,4); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;rgba(255,255,255,0.18)&#x27;;
    ctx.fillRect(b.x+2,b.y+2,b.w-4,3);
  }

  // trail
  for(var t=0;t&lt;ball.trail.length;t++){
    var tp = ball.trail[t];
    var a = (t+1)/ball.trail.length;
    ctx.globalAlpha = a*0.6;
    ctx.fillStyle = &#x27;#ffb04d&#x27;;
    ctx.beginPath(); ctx.arc(tp.x,tp.y,BALL_R*a,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ball (comet)
  var inv = performance.now() &lt; ball.invincUntil;
  if(!inv || Math.floor(performance.now()/120)%2===0){
    ctx.shadowColor = &#x27;#ffd27a&#x27;; ctx.shadowBlur = 16;
    var bg = ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,BALL_R);
    bg.addColorStop(0,&#x27;#fff&#x27;); bg.addColorStop(0.5,&#x27;#ffd27a&#x27;); bg.addColorStop(1,&#x27;#ff7a1a&#x27;);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // paddle (neon)
  ctx.shadowColor = &#x27;#4df&#x27;; ctx.shadowBlur = 14;
  var pg = ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
  pg.addColorStop(0,&#x27;#4df&#x27;); pg.addColorStop(0.5,&#x27;#a6f&#x27;); pg.addColorStop(1,&#x27;#4df&#x27;);
  ctx.fillStyle = pg;
  roundRect(paddleX,PADDLE_Y,PADDLE_W,PADDLE_H,6); ctx.fill();
  ctx.shadowBlur = 0;

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0,pt.life);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // shockwaves
  for(var s=0;s&lt;shockwaves.length;s++){
    var sw = shockwaves[s];
    ctx.globalAlpha = Math.max(0,sw.life);
    ctx.strokeStyle = &#x27;#ff5a7a&#x27;; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sw.x,sw.y,sw.r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // combo popups
  for(var c=0;c&lt;combos.length;c++){
    var cb = combos[c];
    ctx.globalAlpha = Math.max(0,cb.life);
    ctx.font = &#x27;bold &#x27;+(28 + (1-cb.life)*24)+&#x27;px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillStyle = &#x27;#ffe14d&#x27;;
    ctx.shadowColor=&#x27;#f6a&#x27;; ctx.shadowBlur=12;
    ctx.fillText(cb.text+&#x27; COMBO!&#x27;, W/2, cb.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = &#x27;left&#x27;;

  // launch hint
  if(ball.stuck &amp;&amp; running){
    ctx.globalAlpha = 0.6 + Math.sin(performance.now()/300)*0.3;
    ctx.font = &#x27;bold 15px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle = &#x27;#9df&#x27;;
    ctx.fillText(&#x27;Click or press SPACE to launch&#x27;, W/2, PADDLE_Y - 30);
    ctx.globalAlpha = 1; ctx.textAlign=&#x27;left&#x27;;
  }

  // flash overlay
  if(flash&gt;0){
    ctx.fillStyle = &#x27;rgba(200,220,255,&#x27;+ (flash*0.4) +&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function loop(){
  if(!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ launchBall(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W/rect.width);
});
cv.addEventListener(&#x27;mousedown&#x27;,function(){ launchBall(); });

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
buildBricks();
resetBall();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
