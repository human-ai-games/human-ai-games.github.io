<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>👾 Alien Zap Invasion 🛸</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05050f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #7ef0ff; text-shadow: 0 0 12px #2ac8ff; }
  .instructions { font-size: 16px; color: #b9c4e0; max-width: 620px; margin: 0; line-height: 1.35; }
  .topbar { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 2px 0; }
  .score { font-size: 24px; color: #ffe27a; font-weight: 700; }
  #scoreVal { display: inline-block; }
  .score.bounce #scoreVal { animation: bounce 0.3s ease; }
  @keyframes bounce { 0%{transform:scale(1);} 40%{transform:scale(1.6);} 100%{transform:scale(1);} }
  .timer { font-size: 20px; color: #ff9ecb; font-weight: 700; }
  .combo { font-size: 20px; font-weight: 800; color: #fff; padding: 2px 10px; border-radius: 8px;
    background: linear-gradient(90deg,#ff3ca6,#ffb63c); box-shadow: 0 0 16px #ff5ec0; opacity: 0; transition: opacity .2s; }
  .combo.show { opacity: 1; animation: comboPulse 0.6s ease infinite alternate; }
  @keyframes comboPulse { from{transform:scale(1);} to{transform:scale(1.12);} }
  .board { position: relative; width: 660px; height: 460px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #17163a 0%, #0a0920 60%, #05040f 100%); box-shadow: 0 0 30px #1a1a44 inset; }
  .board.shake { animation: shake 0.32s; }
  @keyframes shake { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-7px,3px);} 40%{transform:translate(6px,-4px);} 60%{transform:translate(-5px,-3px);} 80%{transform:translate(4px,4px);} }
  canvas { position: absolute; inset: 0; }
  .ufo { position: absolute; cursor: pointer; user-select: none; will-change: transform; text-align: center; }
  .ufo .halo { position: absolute; inset: 0; border-radius: 50%; z-index: 0; animation: haloPulse 1s ease-in-out infinite alternate; }
  @keyframes haloPulse { from{opacity:.35; transform:scale(0.85);} to{opacity:.85; transform:scale(1.15);} }
  .ufo .saucer { position: relative; z-index: 1; line-height: 1; }
  .missed { position: absolute; color: #ff4d5e; font-weight: 900; font-size: 22px; text-shadow: 0 0 10px #ff0033;
    transform: translate(-50%,-50%); pointer-events: none; animation: missFade 0.7s ease forwards; z-index: 5; }
  @keyframes missFade { 0%{opacity:1; transform:translate(-50%,-50%) scale(0.6);} 30%{transform:translate(-50%,-50%) scale(1.3);} 100%{opacity:0; transform:translate(-50%,-80%) scale(1);} }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,4,15,0.72); z-index: 10; color: #fff; }
  .overlay h2 { font-size: 30px; margin: 0 0 8px; color: #7ef0ff; text-shadow: 0 0 12px #2ac8ff; }
  .overlay p { font-size: 18px; margin: 4px 0; color: #d5deff; }
  .hidden { display: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;👾 Alien Zap Invasion 🛸&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click the flying saucers to zap them before they escape — small fast ones score more. Chain hits without missing to build a combo, but every escape costs you a point!&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot; id=&quot;scoreBox&quot;&gt;Score: &lt;span id=&quot;scoreVal&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot;&gt;⏱ &lt;span id=&quot;timeVal&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;x2 COMBO!&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;canvas id=&quot;stars&quot; width=&quot;660&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;fx&quot; width=&quot;660&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;Alien Zap Invasion&lt;/h2&gt;
      &lt;p&gt;Press &lt;strong&gt;Start&lt;/strong&gt; below to defend the galaxy!&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 660, BOARD_H = 460;
  var board = document.getElementById(&#x27;board&#x27;);
  var starsCv = document.getElementById(&#x27;stars&#x27;), starsCtx = starsCv.getContext(&#x27;2d&#x27;);
  var fxCv = document.getElementById(&#x27;fx&#x27;), fxCtx = fxCv.getContext(&#x27;2d&#x27;);
  var scoreBox = document.getElementById(&#x27;scoreBox&#x27;), scoreVal = document.getElementById(&#x27;scoreVal&#x27;);
  var timeVal = document.getElementById(&#x27;timeVal&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  var running = false;
  var score = 0, timeLeft = 60, comboCount = 0, comboMult = 1;
  var ufos = [];
  var particles = [];
  var spawnTimer = 0, spawnInterval = 900, elapsed = 0;
  var lastTs = 0, rafId = null, tickId = null;

  // ---- Star field ----
  var stars = [];
  for (var i = 0; i &lt; 90; i++) {
    stars.push({ x: Math.random()*BOARD_W, y: Math.random()*BOARD_H,
      r: Math.random()*1.4+0.3, tw: Math.random()*Math.PI*2, sp: Math.random()*2+0.5 });
  }
  function drawStars(t) {
    starsCtx.clearRect(0,0,BOARD_W,BOARD_H);
    for (var i=0;i&lt;stars.length;i++){
      var s=stars[i];
      var a = 0.4 + 0.6*Math.abs(Math.sin(t*0.001*s.sp + s.tw));
      starsCtx.beginPath();
      starsCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
      starsCtx.fillStyle=&#x27;rgba(255,255,255,&#x27;+a+&#x27;)&#x27;;
      starsCtx.fill();
    }
  }

  // ---- Audio ----
  var actx = null;
  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function zapSound(){
    if(!actx) return;
    var t=actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=&#x27;square&#x27;; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(180,t+0.18);
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.22);
  }
  function thudSound(){
    if(!actx) return;
    var t=actx.currentTime;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(50,t+0.25);
    g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+0.3);
  }

  // ---- UFO types ----
  var TYPES = [
    { size: 78, points: 1, color: &#x27;#4dd2ff&#x27;, life: 2600, name:&#x27;big&#x27; },
    { size: 56, points: 2, color: &#x27;#ff8adf&#x27;, life: 1900, name:&#x27;med&#x27; },
    { size: 40, points: 3, color: &#x27;#ffe066&#x27;, life: 1300, name:&#x27;small&#x27; }
  ];

  function spawnUfo(){
    var ti = Math.random();
    var type = ti &lt; 0.5 ? TYPES[0] : (ti &lt; 0.82 ? TYPES[1] : TYPES[2]);
    var x = Math.random()*(BOARD_W - type.size);
    var hoverY = 40 + Math.random()*(BOARD_H - type.size - 120);
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;ufo&#x27;;
    el.style.width = type.size+&#x27;px&#x27;; el.style.height = type.size+&#x27;px&#x27;;
    el.style.left = x+&#x27;px&#x27;; el.style.top = &#x27;-90px&#x27;;
    var halo = document.createElement(&#x27;div&#x27;);
    halo.className=&#x27;halo&#x27;;
    halo.style.background=&#x27;radial-gradient(circle, &#x27;+type.color+&#x27; 0%, rgba(0,0,0,0) 70%)&#x27;;
    var sauc = document.createElement(&#x27;div&#x27;);
    sauc.className=&#x27;saucer&#x27;; sauc.textContent=&#x27;🛸&#x27;;
    sauc.style.fontSize=(type.size*0.78)+&#x27;px&#x27;;
    el.appendChild(halo); el.appendChild(sauc);
    board.appendChild(el);

    var u = { el:el, x:x, y:-90, hoverY:hoverY, size:type.size, type:type,
      state:&#x27;enter&#x27;, age:0, life:type.life, alive:true, cx:x+type.size/2 };

    el.addEventListener(&#x27;mousedown&#x27;, function(ev){
      if(!u.alive || !running) return;
      ev.stopPropagation();
      hitUfo(u);
    });
    ufos.push(u);
  }

  function hitUfo(u){
    u.alive=false;
    var cx = u.x + u.size/2, cy = u.y + u.size/2;
    // combo
    comboCount++;
    if(comboCount &gt;= 3){ comboMult = Math.min(2 + Math.floor((comboCount-3)/3), 5); }
    else comboMult = 1;
    updateCombo();
    var gained = u.type.points * comboMult;
    score += gained;
    updateScore();
    zapSound();
    burst(cx, cy, u.type.color);
    if(u.el.parentNode) u.el.parentNode.removeChild(u.el);
  }

  function escapeUfo(u){
    // small chance if never hit -&gt; penalty
    u.alive=false;
    var cx = u.x + u.size/2, cy = u.hoverY + u.size/2;
    showMissed(cx, cy);
    score -= 1;
    comboCount = 0; comboMult = 1;
    updateCombo();
    updateScore();
    thudSound();
    board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;);
    if(u.el.parentNode) u.el.parentNode.removeChild(u.el);
  }

  function showMissed(x,y){
    var m=document.createElement(&#x27;div&#x27;);
    m.className=&#x27;missed&#x27;; m.textContent=&#x27;MISSED!&#x27;;
    m.style.left=x+&#x27;px&#x27;; m.style.top=y+&#x27;px&#x27;;
    board.appendChild(m);
    setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); },700);
  }

  function updateScore(){
    scoreVal.textContent = score;
    scoreBox.classList.remove(&#x27;bounce&#x27;); void scoreBox.offsetWidth; scoreBox.classList.add(&#x27;bounce&#x27;);
  }
  function updateCombo(){
    if(comboMult &gt; 1){
      comboEl.textContent = &#x27;x&#x27;+comboMult+&#x27; COMBO!&#x27;;
      comboEl.classList.add(&#x27;show&#x27;);
    } else {
      comboEl.classList.remove(&#x27;show&#x27;);
    }
  }

  // ---- Particles ----
  function burst(x,y,color){
    var n = 18;
    for(var i=0;i&lt;n;i++){
      var ang = (Math.PI*2*i/n) + Math.random()*0.4;
      var sp = 2 + Math.random()*4;
      particles.push({ x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
        life:1, size:2+Math.random()*3, color:color });
    }
    // white sparkles
    for(var j=0;j&lt;8;j++){
      var a=Math.random()*Math.PI*2, s=1+Math.random()*3;
      particles.push({ x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, size:1.5+Math.random()*2, color:&#x27;#ffffff&#x27; });
    }
  }
  function drawParticles(dt){
    fxCtx.clearRect(0,0,BOARD_W,BOARD_H);
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=dt*0.0022;
      if(p.life&lt;=0){ particles.splice(i,1); continue; }
      fxCtx.globalAlpha=Math.max(0,p.life);
      fxCtx.fillStyle=p.color;
      fxCtx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
    fxCtx.globalAlpha=1;
  }

  // ---- UFO motion ----
  function updateUfos(dt){
    for(var i=ufos.length-1;i&gt;=0;i--){
      var u=ufos[i];
      if(!u.alive){ ufos.splice(i,1); continue; }
      u.age+=dt;
      if(u.state===&#x27;enter&#x27;){
        u.y += (u.hoverY - u.y)*0.12;
        if(Math.abs(u.y-u.hoverY)&lt;2){ u.y=u.hoverY; u.state=&#x27;hover&#x27;; u.age=0; }
      } else if(u.state===&#x27;hover&#x27;){
        // slight bob
        u.el.style.top = (u.hoverY + Math.sin(u.age*0.006)*6) + &#x27;px&#x27;;
        if(u.age &gt; u.life){ u.state=&#x27;exit&#x27;; }
      } else if(u.state===&#x27;exit&#x27;){
        u.y -= 4 + (78-u.size)*0.08;
        if(u.y &lt; -100){ escapeUfo(u); ufos.splice(i,1); continue; }
      }
      if(u.state!==&#x27;hover&#x27;) u.el.style.top = u.y+&#x27;px&#x27;;
    }
  }

  // ---- Loop ----
  function loop(ts){
    if(!running) return;
    var dt = ts - lastTs; lastTs = ts;
    if(dt&gt;60) dt=60;
    drawStars(ts);
    updateUfos(dt);
    drawParticles(dt);

    // spawning ramps up
    elapsed += dt;
    spawnTimer += dt;
    // interval shrinks from 900ms toward 350ms over the minute
    var frac = Math.min(elapsed/60000, 1);
    spawnInterval = 900 - frac*550;
    if(spawnTimer &gt;= spawnInterval){
      spawnTimer = 0;
      var maxSim = 2 + Math.floor(frac*4); // up to 6
      var count = 1 + (frac&gt;0.4 &amp;&amp; Math.random()&lt;frac ? 1 : 0);
      for(var k=0;k&lt;count;k++){
        if(ufos.length &lt; maxSim) spawnUfo();
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  function tick(){
    if(!running) return;
    timeLeft--;
    if(timeLeft&lt;0) timeLeft=0;
    timeVal.textContent = timeLeft;
    if(timeLeft&lt;=0){ endGame(); }
  }

  function clearAll(){
    for(var i=0;i&lt;ufos.length;i++){ if(ufos[i].el.parentNode) ufos[i].el.parentNode.removeChild(ufos[i].el); }
    ufos = []; particles = [];
    fxCtx.clearRect(0,0,BOARD_W,BOARD_H);
    var ms = board.querySelectorAll(&#x27;.missed&#x27;);
    for(var j=0;j&lt;ms.length;j++) ms[j].parentNode.removeChild(ms[j]);
  }

  function startGame(){
    ensureAudio();
    if(actx &amp;&amp; actx.state===&#x27;suspended&#x27;) actx.resume();
    running = true;
    score=0; timeLeft=60; comboCount=0; comboMult=1;
    elapsed=0; spawnTimer=0; spawnInterval=900;
    scoreVal.textContent=&#x27;0&#x27;; timeVal.textContent=&#x27;60&#x27;;
    comboEl.classList.remove(&#x27;show&#x27;);
    overlay.classList.add(&#x27;hidden&#x27;);
    clearAll();
    spawnUfo();
    lastTs = performance.now();
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    if(tickId) clearInterval(tickId);
    tickId = setInterval(tick, 1000);
  }

  function stopGame(){
    running = false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(tickId){ clearInterval(tickId); tickId=null; }
  }

  function endGame(){
    stopGame();
    overlay.innerHTML = &#x27;&lt;h2&gt;Invasion Over!&lt;/h2&gt;&lt;p&gt;Final Score: &lt;strong&gt;&#x27;+score+&#x27;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Press Start below to play again.&lt;/p&gt;&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // draw a static star frame at load
  drawStars(0);

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.

<script>
(function () {

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
