&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 FRUIT DROP 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer falling fruit with &lt;strong&gt;←&lt;/strong&gt; / &lt;strong&gt;→&lt;/strong&gt; and line up 3+ of the same kind to burst them. Chain bursts for combo multipliers before the timer runs out!&lt;/p&gt;
  &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
  &lt;div class=&quot;timerwrap&quot;&gt;&lt;div id=&quot;timerbar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press Start below!&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 30, COLS = 10, ROWS = 14;
  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;];
  var GLOW = {&#x27;🍎&#x27;:&#x27;#ff4d4d&#x27;,&#x27;🍊&#x27;:&#x27;#ff9f2e&#x27;,&#x27;🍋&#x27;:&#x27;#ffe14f&#x27;,&#x27;🍇&#x27;:&#x27;#b34fff&#x27;,&#x27;🍓&#x27;:&#x27;#ff4f8b&#x27;,&#x27;🍉&#x27;:&#x27;#4fff7a&#x27;};
  var FIELD_W = COLS*CELL, FIELD_H = ROWS*CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var timerBar = document.getElementById(&#x27;timerbar&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);

  var running=false, dropId=null, tickId=null, bgId=null;
  var grid=[], piece=null, score=0;
  var activeCols=COLS, colOffset=0;
  var dropMs=560, timeLeft=60, bgPhase=0;

  field.style.width=FIELD_W+&#x27;px&#x27;;
  field.style.height=FIELD_H+&#x27;px&#x27;;

  var leftWall=document.createElement(&#x27;div&#x27;);
  var rightWall=document.createElement(&#x27;div&#x27;);
  leftWall.className=&#x27;wall&#x27;; rightWall.className=&#x27;wall&#x27;;
  field.appendChild(leftWall); field.appendChild(rightWall);

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function updateWalls(){
    var left=colOffset, right=colOffset+activeCols;
    leftWall.style.left=&#x27;0px&#x27;; leftWall.style.width=(left*CELL)+&#x27;px&#x27;;
    rightWall.style.left=(right*CELL)+&#x27;px&#x27;; rightWall.style.width=((COLS-right)*CELL)+&#x27;px&#x27;;
  }

  function collides(x,y){
    if(x&lt;colOffset||x&gt;=colOffset+activeCols||y&gt;=ROWS) return true;
    if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
    return false;
  }

  function spawnPiece(){
    var mid=colOffset+Math.floor(activeCols/2);
    piece={x:mid,y:0,f:FRUITS[Math.floor(Math.random()*FRUITS.length)]};
    if(collides(piece.x,piece.y)) return false;
    return true;
  }

  function lockPiece(){
    if(piece.y&gt;=0 &amp;&amp; piece.y&lt;ROWS) grid[piece.y][piece.x]=piece.f;
    piece=null;
  }

  function findMatches(){
    var toClear={};
    // horizontal
    for(var r=0;r&lt;ROWS;r++){
      var run=1;
      for(var c=1;c&lt;=COLS;c++){
        if(c&lt;COLS &amp;&amp; grid[r][c] &amp;&amp; grid[r][c]===grid[r][c-1]) run++;
        else { if(run&gt;=3){for(var k=c-run;k&lt;c;k++) toClear[r+&#x27;_&#x27;+k]=true;} run=1; }
      }
    }
    // vertical
    for(var c2=0;c2&lt;COLS;c2++){
      var run2=1;
      for(var r2=1;r2&lt;=ROWS;r2++){
        if(r2&lt;ROWS &amp;&amp; grid[r2][c2] &amp;&amp; grid[r2][c2]===grid[r2-1][c2]) run2++;
        else { if(run2&gt;=3){for(var k2=r2-run2;k2&lt;r2;k2++) toClear[k2+&#x27;_&#x27;+c2]=true;} run2=1; }
      }
    }
    var list=[];
    for(var key in toClear){var p=key.split(&#x27;_&#x27;);list.push({r:+p[0],c:+p[1]});}
    return list;
  }

  function applyGravity(){
    for(var c=0;c&lt;COLS;c++){
      var stack=[];
      for(var r=ROWS-1;r&gt;=0;r--){ if(grid[r][c]) stack.push(grid[r][c]); }
      for(var r2=ROWS-1;r2&gt;=0;r2--){ grid[r2][c]= (ROWS-1-r2)&lt;stack.length ? stack[ROWS-1-r2] : null; }
    }
  }

  function resolveMatches(chain){
    var matches=findMatches();
    if(matches.length===0){ paint(); return; }
    var mult=chain;
    var gained=matches.length*10*mult;
    score+=gained;
    bumpScore();
    // burst visuals
    for(var i=0;i&lt;matches.length;i++){
      var m=matches[i];
      spawnParticles(m.c,m.r,grid[m.r][m.c]);
      grid[m.r][m.c]=null;
    }
    if(mult&gt;=2){
      var mid=matches[Math.floor(matches.length/2)];
      showCombo(mid.c,mid.r,mult);
    }
    paint();
    setTimeout(function(){ applyGravity(); resolveMatches(chain+1); }, 260);
  }

  function bumpScore(){
    scoreEl.textContent=score;
    scoreEl.classList.remove(&#x27;bump&#x27;);
    void scoreEl.offsetWidth;
    scoreEl.classList.add(&#x27;bump&#x27;);
  }

  function spawnParticles(cx,cy,fruit){
    var color=GLOW[fruit]||&#x27;#fff&#x27;;
    var px=cx*CELL+CELL/2, py=cy*CELL+CELL/2;
    for(var i=0;i&lt;10;i++){
      var p=document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;; p.style.background=color;
      p.style.boxShadow=&#x27;0 0 8px &#x27;+color;
      p.style.left=px+&#x27;px&#x27;; p.style.top=py+&#x27;px&#x27;;
      field.appendChild(p);
      (function(el){
        var ang=Math.random()*Math.PI*2, dist=20+Math.random()*40;
        var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
        el.animate([{transform:&#x27;translate(0,0)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;,opacity:0}],{duration:500,easing:&#x27;ease-out&#x27;});
        setTimeout(function(){el.remove();},500);
      })(p);
    }
  }

  function showCombo(cx,cy,mult){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;combo&#x27;; el.textContent=&#x27;x&#x27;+mult+&#x27;!&#x27;;
    el.style.left=(cx*CELL-10)+&#x27;px&#x27;; el.style.top=(cy*CELL-20)+&#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function(){el.remove();},800);
  }

  function paint(){
    // remove fruit els
    var olds=field.querySelectorAll(&#x27;.fruit&#x27;);
    for(var i=0;i&lt;olds.length;i++) olds[i].remove();
    for(var r=0;r&lt;ROWS;r++){
      for(var c=0;c&lt;COLS;c++){
        if(grid[r][c]) drawFruit(c,r,grid[r][c]);
      }
    }
    if(piece &amp;&amp; piece.y&gt;=0) drawFruit(piece.x,piece.y,piece.f);
  }

  function drawFruit(cx,cy,f){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;fruit&#x27;; el.textContent=f;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.textShadow=&#x27;0 0 10px &#x27;+(GLOW[f]||&#x27;#fff&#x27;)+&#x27;, 0 0 18px &#x27;+(GLOW[f]||&#x27;#fff&#x27;);
    field.appendChild(el);
  }

  function stepDown(){
    if(!piece) return;
    if(collides(piece.x,piece.y+1)){
      lockPiece();
      resolveMatches(1);
      if(!spawnPiece()){ endGame(true); return; }
    } else { piece.y++; }
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    if(!collides(piece.x+dx,piece.y)){ piece.x+=dx; paint(); }
  }

  function tick(){
    timeLeft-=0.1;
    if(timeLeft&lt;=0){ timeLeft=0; updateTimer(); endGame(true); return; }
    updateTimer();
  }
  function updateTimer(){
    var pct=timeLeft/60;
    timerBar.style.width=(pct*100)+&#x27;%&#x27;;
    var g=Math.floor(pct*200), r=Math.floor((1-pct)*220);
    timerBar.style.background=&#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,60)&#x27;;
  }

  var rampTimer=0;
  function ramp(){
    rampTimer+=1;
    if(rampTimer%15===0){
      if(activeCols&gt;4){ activeCols--; colOffset=Math.floor((COLS-activeCols)/2); updateWalls(); }
      dropMs=Math.max(220,dropMs-70);
      restartDrop();
    }
  }
  var secId=null;
  function restartDrop(){ if(dropId)clearInterval(dropId); dropId=setInterval(stepDown,dropMs); }

  function pulseBg(){
    bgPhase+=0.03;
    var t=(Math.sin(bgPhase)+1)/2;
    var r=Math.floor(30+t*20), g=Math.floor(7+t*10), b=Math.floor(48+t*40);
    field.style.background=&#x27;radial-gradient(circle at 50% 30%, rgb(&#x27;+(r+20)+&#x27;,&#x27;+(g+15)+&#x27;,&#x27;+(b+30)+&#x27;), rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;))&#x27;;
  }

  function startGame(){
    if(running) return;
    running=true;
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    activeCols=COLS; colOffset=0; dropMs=560; timeLeft=60; rampTimer=0; bgPhase=0;
    overlay.style.display=&#x27;none&#x27;;
    newGrid(); updateWalls(); updateTimer();
    spawnPiece(); paint();
    restartDrop();
    tickId=setInterval(tick,100);
    secId=setInterval(ramp,1000);
    bgId=setInterval(pulseBg,50);
  }
  function endGame(showOver){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(tickId){clearInterval(tickId);tickId=null;}
    if(secId){clearInterval(secId);secId=null;}
    if(bgId){clearInterval(bgId);bgId=null;}
    if(showOver){ overlay.innerHTML=&#x27;Time up!&lt;br&gt;Score: &#x27;+score; overlay.style.display=&#x27;flex&#x27;; }
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(tickId){clearInterval(tickId);tickId=null;}
    if(secId){clearInterval(secId);secId=null;}
    if(bgId){clearInterval(bgId);bgId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)stepDown();e.preventDefault();}
  });
  field.addEventListener(&#x27;mousedown&#x27;,function(e){
    if(!running)return;
    var rect=field.getBoundingClientRect();
    if(e.clientX-rect.left &lt; rect.width/2) move(-1); else move(1);
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  newGrid(); updateWalls(); updateTimer(); paint();
&lt;/script&gt;

/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
