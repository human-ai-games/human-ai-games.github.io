<body>

&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05010f; color: #e8e8ff; overflow: hidden; }

       background: linear-gradient(90deg,#ff4ff0,#4fd0ff,#a0ff4f); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,80,255,.4); }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC CASCADE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &amp;larr;/&amp;rarr;, rotate with &amp;uarr; or W, soft-drop with &amp;darr;/S, and slam a piece down with Space. Clear multiple rows fast to build combos and use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;fieldwrap&quot;&gt;
      &lt;canvas id=&quot;field&quot; width=&quot;240&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
      &lt;div id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Lines&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;lines&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Next&lt;/div&gt;&lt;canvas id=&quot;next&quot; width=&quot;88&quot; height=&quot;70&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
      &lt;div id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bLeft&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bRot&quot;&gt;⟳&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bDown&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;btn&quot; id=&quot;bRight&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var CELL=22, COLS=10, ROWS=20;
var fc=document.getElementById(&#x27;field&#x27;), fx=fc.getContext(&#x27;2d&#x27;);
var nc=document.getElementById(&#x27;next&#x27;), nx=nc.getContext(&#x27;2d&#x27;);
var flash=document.getElementById(&#x27;flash&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), levelEl=document.getElementById(&#x27;level&#x27;),
    linesEl=document.getElementById(&#x27;lines&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;);

var COLORS={
  I:&#x27;#4fd0ff&#x27;, O:&#x27;#ffe14f&#x27;, T:&#x27;#c04fff&#x27;, S:&#x27;#4fff8a&#x27;, Z:&#x27;#ff5a6e&#x27;, J:&#x27;#4f7dff&#x27;, L:&#x27;#ff9d3a&#x27;
};
var SHAPES={
  I:[[0,1],[1,1],[2,1],[3,1]],
  O:[[1,0],[2,0],[1,1],[2,1]],
  T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]],
  Z:[[0,0],[1,0],[1,1],[2,1]],
  J:[[0,0],[0,1],[1,1],[2,1]],
  L:[[2,0],[0,1],[1,1],[2,1]]
};
var TYPES=[&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

var grid, piece, nextType, score, level, lines, running=false, dropId=null;
var comboCount=0, comboTimer=0;
var particles=[];
var gameOver=false, deadBlocks=[], deadId=null;
var animId=null, flashAlpha=0;

function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

function makePiece(type){
  var cells=SHAPES[type].map(function(p){return [p[0],p[1]];});
  return {type:type, cells:cells, x:3, y:0};
}
function randType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }

function collides(p){
  var cs=absCells(p);
  for(var i=0;i&lt;cs.length;i++){
    var x=cs[i].x,y=cs[i].y;
    if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
    if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
  }
  return false;
}

function rotate(p){
  // rotate cells 90deg clockwise around bounding box
  if(p.type===&#x27;O&#x27;) return;
  var xs=p.cells.map(function(c){return c[0];}), ys=p.cells.map(function(c){return c[1];});
  var maxX=Math.max.apply(null,xs), maxY=Math.max.apply(null,ys);
  var n=Math.max(maxX,maxY);
  var rc=p.cells.map(function(c){ return [n - c[1], c[0]]; });
  var test={type:p.type, cells:rc, x:p.x, y:p.y};
  // wall kicks
  var kicks=[0,-1,1,-2,2];
  for(var k=0;k&lt;kicks.length;k++){
    test.x=p.x+kicks[k];
    if(!collides(test)){ p.cells=rc; p.x=test.x; return; }
  }
}

function spawn(){
  piece=makePiece(nextType);
  nextType=randType();
  drawNext();
  if(collides(piece)){ triggerGameOver(); return false; }
  return true;
}

function lockPiece(){
  var cs=absCells(piece);
  for(var i=0;i&lt;cs.length;i++){
    if(cs[i].y&gt;=0) grid[cs[i].y][cs[i].x]=COLORS[piece.type];
  }
  piece=null;
}

function clearRows(){
  var full=[];
  for(var r=0;r&lt;ROWS;r++){
    var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;}
    if(f) full.push(r);
  }
  if(full.length===0){ comboCount=0; comboEl.textContent=&#x27;&#x27;; return; }
  // particles from cleared rows
  for(var i=0;i&lt;full.length;i++){
    var ry=full[i];
    for(var c=0;c&lt;COLS;c++){
      spawnBurst(c*CELL+CELL/2, ry*CELL+CELL/2, grid[ry][c]);
    }
  }
  // remove
  for(var i=0;i&lt;full.length;i++){
    grid.splice(full[i],1);
    var er=[]; for(var c=0;c&lt;COLS;c++)er.push(null);
    grid.unshift(er);
  }
  comboCount++;
  comboTimer=1;
  lines+=full.length;
  var base=[0,100,300,500,800][full.length]||800;
  var mult=comboCount;
  var gained=base*level*mult;
  score+=gained;
  linesEl.textContent=lines;
  scoreEl.textContent=score;
  if(comboCount&gt;1) comboEl.textContent=&#x27;COMBO x&#x27;+comboCount+&#x27;!&#x27;;
  else comboEl.textContent=&#x27;&#x27;;
  // flash
  flashAlpha=Math.min(0.85, 0.3+full.length*0.15);
  // level up every 5 lines
  var nl=Math.floor(lines/5)+1;
  if(nl!==level){ level=nl; levelEl.textContent=level; restartDrop(); }
}

function spawnBurst(px,py,color){
  for(var i=0;i&lt;4;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color:color||&#x27;#fff&#x27;});
  }
}

function dropInterval(){ return Math.max(80, 620 - (level-1)*55); }

function stepDown(soft){
  if(!piece) return;
  var np={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
  if(collides(np)){
    lockPiece(); clearRows();
    if(gameOver) return;
    spawn();
  } else { piece.y++; if(soft) score+=1, scoreEl.textContent=score; }
}

function hardDrop(){
  if(!piece||!running) return;
  var d=0;
  while(true){
    var np={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
    if(collides(np)) break;
    piece.y++; d++;
  }
  score+=d*2; scoreEl.textContent=score;
  lockPiece(); clearRows();
  if(!gameOver) spawn();
}

function move(dx){
  if(!piece||!running) return;
  var np={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
  if(!collides(np)) piece.x+=dx;
}

function ghostY(){
  if(!piece) return 0;
  var gy=piece.y;
  while(true){
    var np={type:piece.type,cells:piece.cells,x:piece.x,y:gy+1};
    if(collides(np)) break;
    gy++;
  }
  return gy;
}

function drawCell(ctx,x,y,color,size,glow,alpha){
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=color;
  if(glow){ ctx.shadowColor=color; ctx.shadowBlur=10; }
  ctx.fillRect(x+1,y+1,size-2,size-2);
  ctx.shadowBlur=0;
  ctx.globalAlpha=(alpha==null?1:alpha)*0.35;
  ctx.fillStyle=&#x27;#ffffff&#x27;;
  ctx.fillRect(x+3,y+3,size-6,4);
  ctx.restore();
}

var stars=[];
for(var i=0;i&lt;40;i++) stars.push({x:Math.random()*240,y:Math.random()*440,r:Math.random()*1.4+0.3,p:Math.random()});

function draw(){
  fx.clearRect(0,0,240,440);
  // starfield
  var t=Date.now()/1000;
  for(var i=0;i&lt;stars.length;i++){
    var s=stars[i];
    var tw=0.4+0.6*Math.abs(Math.sin(t*1.5+s.p*6));
    fx.globalAlpha=tw; fx.fillStyle=&#x27;#b0b0ff&#x27;;
    fx.beginPath(); fx.arc(s.x,s.y,s.r,0,Math.PI*2); fx.fill();
  }
  fx.globalAlpha=1;
  // grid lines
  fx.strokeStyle=&#x27;rgba(90,80,160,0.12)&#x27;;
  for(var c=0;c&lt;=COLS;c++){ fx.beginPath(); fx.moveTo(c*CELL,0); fx.lineTo(c*CELL,ROWS*CELL); fx.stroke(); }
  for(var r=0;r&lt;=ROWS;r++){ fx.beginPath(); fx.moveTo(0,r*CELL); fx.lineTo(COLS*CELL,r*CELL); fx.stroke(); }
  // locked blocks
  for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawCell(fx,c*CELL,r*CELL,grid[r][c],CELL,true);
  // dead blocks (game over rain)
  for(var i=0;i&lt;deadBlocks.length;i++){ var b=deadBlocks[i]; drawCell(fx,b.x,b.y,b.color,CELL,true); }
  // ghost
  if(piece){
    var gy=ghostY();
    var cs=piece.cells;
    for(var i=0;i&lt;cs.length;i++){
      var x=(piece.x+cs[i][0])*CELL, y=(gy+cs[i][1])*CELL;
      fx.strokeStyle=COLORS[piece.type]; fx.globalAlpha=0.5;
      fx.strokeRect(x+2,y+2,CELL-4,CELL-4);
    }
    fx.globalAlpha=1;
    // active piece
    for(var i=0;i&lt;cs.length;i++){
      var x=(piece.x+cs[i][0])*CELL, y=(piece.y+cs[i][1])*CELL;
      if(piece.y+cs[i][1]&gt;=0) drawCell(fx,x,y,COLORS[piece.type],CELL,true);
    }
  }
  // particles
  for(var i=0;i&lt;particles.length;i++){
    var p=particles[i];
    fx.globalAlpha=Math.max(0,p.life);
    fx.fillStyle=p.color; fx.shadowColor=p.color; fx.shadowBlur=6;
    fx.fillRect(p.x-2,p.y-2,4,4);
  }
  fx.shadowBlur=0; fx.globalAlpha=1;
  // flash overlay
  if(flashAlpha&gt;0){ flash.style.opacity=flashAlpha; } else { flash.style.opacity=0; }
}

function drawNext(){
  nx.clearRect(0,0,88,70);
  var cs=SHAPES[nextType]; var col=COLORS[nextType];
  var xs=cs.map(function(c){return c[0];}), ys=cs.map(function(c){return c[1];});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var w=(maxX-minX+1), h=(maxY-minY+1);
  var sz=16;
  var ox=(88-w*sz)/2 - minX*sz, oy=(70-h*sz)/2 - minY*sz;
  for(var i=0;i&lt;cs.length;i++) drawCell(nx,ox+cs[i][0]*sz,oy+cs[i][1]*sz,col,sz,true);
}

function tick(){
  // update particles
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.life-=0.03;
    if(p.life&lt;=0) particles.splice(i,1);
  }
  if(flashAlpha&gt;0) flashAlpha=Math.max(0,flashAlpha-0.06);
  if(comboTimer&gt;0){ comboTimer-=0.02; if(comboTimer&lt;=0){ comboEl.textContent=&#x27;&#x27;; comboCount=0; } }
  // dead block gravity
  if(gameOver &amp;&amp; deadBlocks.length){
    var settled=true;
    for(var i=0;i&lt;deadBlocks.length;i++){
      var b=deadBlocks[i];
      if(b.y&lt;b.target){ b.vy+=1.2; b.y+=b.vy; if(b.y&gt;b.target)b.y=b.target; settled=false; }
    }
  }
  draw();
  animId=requestAnimationFrame(tick);
}

function restartDrop(){
  if(dropId) clearInterval(dropId);
  if(running &amp;&amp; !gameOver) dropId=setInterval(function(){stepDown(false);}, dropInterval());
}

function triggerGameOver(){
  gameOver=true; running=false;
  if(dropId){clearInterval(dropId);dropId=null;}
  // build dead blocks that fall
  deadBlocks=[];
  for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++){
    if(grid[r][c]) deadBlocks.push({x:c*CELL,y:r*CELL,vy:0,target:440+r*20,color:grid[r][c]});
  }
  newGrid();
  // pulse score
  scoreEl.style.transition=&#x27;transform .2s&#x27;; scoreEl.style.transform=&#x27;scale(1.5)&#x27;;
  setTimeout(function(){scoreEl.style.transform=&#x27;scale(1)&#x27;;},220);
  setTimeout(function(){scoreEl.style.transform=&#x27;scale(1.4)&#x27;;},440);
  setTimeout(function(){scoreEl.style.transform=&#x27;scale(1)&#x27;;},660);
}

function startGame(){
  newGrid(); particles=[]; deadBlocks=[]; flashAlpha=0;
  score=0; level=1; lines=0; comboCount=0;
  scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;; linesEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;&#x27;;
  gameOver=false; running=true;
  nextType=randType();
  spawn();
  restartDrop();
  if(!animId) tick();
}
function stopGame(){
  running=false;
  if(dropId){clearInterval(dropId);dropId=null;}
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(!running){ return; }
  if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
  else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
  else if(e.key===&#x27;ArrowDown&#x27;||e.key===&#x27;s&#x27;||e.key===&#x27;S&#x27;){stepDown(true);e.preventDefault();}
  else if(e.key===&#x27;ArrowUp&#x27;||e.key===&#x27;w&#x27;||e.key===&#x27;W&#x27;){if(piece)rotate(piece);e.preventDefault();}
  else if(e.key===&#x27; &#x27;){hardDrop();e.preventDefault();}
});

document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;,function(){move(-1);});
document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;,function(){move(1);});
document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;,function(){if(piece&amp;&amp;running)rotate(piece);});
document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;,function(){if(running)stepDown(true);});

// swipe support
var tsx=0,tsy=0,tst=0;
fc.addEventListener(&#x27;touchstart&#x27;,function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;tst=Date.now();},{passive:true});
fc.addEventListener(&#x27;touchend&#x27;,function(e){
  if(!running)return;
  var t=e.changedTouches[0];var dx=t.clientX-tsx,dy=t.clientY-tsy,dt=Date.now()-tst;
  if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20&amp;&amp;dt&lt;250){ if(piece)rotate(piece); return; }
  if(Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); }
  else { if(dy&gt;40) hardDrop(); }
},{passive:true});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;)startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
});

// initial static paint
newGrid(); nextType=&#x27;T&#x27;; drawNext(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
