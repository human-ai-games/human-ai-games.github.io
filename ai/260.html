<title>VOID BREAKER</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>VOID BREAKER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8ecff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #7df9ff; text-shadow: 0 0 12px #22d3ee, 0 0 24px #0891b2; }
  .instructions { font-size: 16px; color: #9fb0d8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  .score { font-size: 22px; font-weight: 700; color: #ffe27a; text-shadow: 0 0 10px #f59e0b; }
  .timer { font-weight: 700; color: #7df9ff; }
  .shieldwrap { width: 200px; height: 14px; background: #10152e; border: 1px solid #2a3566; border-radius: 8px; overflow: hidden; }
  .shieldbar { height: 100%; width: 100%; background: linear-gradient(90deg,#22d3ee,#3b82f6); box-shadow: 0 0 10px #22d3ee; transition: width .2s; }
  .field { position: relative; width: 620px; height: 440px; flex-shrink: 0; background: radial-gradient(ellipse at 50% 20%, #0b1030 0%, #05060f 80%); border: 1px solid #1e2a55; border-radius: 8px; overflow: hidden; }
  canvas { display: block; }
  .combo { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 48px; font-weight: 900; color: #ff5ea8; text-shadow: 0 0 18px #ff2d78; opacity: 0; pointer-events: none; }
  .combo.show { animation: pulse .5s ease-out; }
  @keyframes pulse { 0%{opacity:1; transform:translate(-50%,-50%) scale(.5);} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.6);} }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(5,6,15,.72); color: #ff5ea8; font-weight: 900; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.show { opacity: 1; }
  .overlay .big { font-size: 46px; text-shadow: 0 0 20px #ff2d78; letter-spacing: 3px; }
  .overlay .sub { font-size: 22px; color: #ffe27a; margin-top: 10px; text-shadow: 0 0 10px #f59e0b; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;VOID BREAKER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; arrows and press &lt;strong&gt;Space&lt;/strong&gt; to fire lasers at incoming enemies. Chain quick hits for combo multipliers, and don&#x27;t let enemies reach the bottom or your shield drains — use Start/Restart below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;timer&quot;&gt;Time: &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
    &lt;div class=&quot;shieldwrap&quot;&gt;&lt;div class=&quot;shieldbar&quot; id=&quot;shield&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div class=&quot;big&quot; id=&quot;ovbig&quot;&gt;GAME OVER&lt;/div&gt;&lt;div class=&quot;sub&quot; id=&quot;ovsub&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);
  var shieldEl = document.getElementById(&#x27;shield&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;), ovsub = document.getElementById(&#x27;ovsub&#x27;), ovbig = document.getElementById(&#x27;ovbig&#x27;);

  var running = false, animId = null;
  var keys = {};
  var shipX, shipW = 34, shipH = 28, shipSpeed = 6, shipBottom = 14;
  var bullets, enemies, particles, stars;
  var score, shield, combo, lastHitTime, comboMult;
  var elapsed, lastTime, spawnTimer, spawnInterval, gameLen = 60;
  var lastShot;

  // Audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function initStars() {
    stars = [];
    for (var i = 0; i &lt; 70; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.8+0.4, spd: Math.random()*0.8+0.2 });
    }
  }

  var TYPES = {
    dart:  { r: 10, hp: 1, pts: 1, color: &#x27;#c084fc&#x27;, speed: 2.2 },
    hex:   { r: 16, hp: 1, pts: 2, color: &#x27;#fb923c&#x27;, speed: 1.5 },
    skull: { r: 22, hp: 2, pts: 3, color: &#x27;#f87171&#x27;, speed: 1.0 }
  };

  function spawnEnemy() {
    var roll = Math.random();
    var type = roll &lt; 0.5 ? &#x27;dart&#x27; : (roll &lt; 0.82 ? &#x27;hex&#x27; : &#x27;skull&#x27;);
    var t = TYPES[type];
    var diff = elapsed / gameLen; // 0..1
    var e = {
      type: type, r: t.r, hp: t.hp, maxhp: t.hp, pts: t.pts, color: t.color,
      x: t.r + Math.random()*(W - 2*t.r), y: -t.r,
      speed: t.speed * (1 + diff*1.1),
      rot: 0, flash: 0
    };
    enemies.push(e);
  }

  function fire() {
    var now = Date.now();
    if (now - lastShot &lt; 200) return;
    lastShot = now;
    bullets.push({ x: shipX, y: H - shipBottom - shipH });
    beep(880, 0.08, &#x27;square&#x27;, 0.04);
  }

  function explode(x, y, color, n) {
    for (var i = 0; i &lt; n; i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*3.5+1;
      particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color: color });
    }
  }

  function showCombo(mult) {
    comboEl.textContent = mult + &#x27;x COMBO!&#x27;;
    comboEl.classList.remove(&#x27;show&#x27;);
    void comboEl.offsetWidth;
    comboEl.classList.add(&#x27;show&#x27;);
  }

  function drawShip() {
    var cx = shipX, y = H - shipBottom;
    ctx.save();
    ctx.shadowBlur = 16; ctx.shadowColor = &#x27;#22d3ee&#x27;;
    ctx.fillStyle = &#x27;#67e8f9&#x27;;
    ctx.beginPath();
    ctx.moveTo(cx, y - shipH);
    ctx.lineTo(cx - shipW/2, y);
    ctx.lineTo(cx + shipW/2, y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // engine glow
    ctx.fillStyle = &#x27;rgba(255,180,90,0.8)&#x27;;
    ctx.beginPath();
    ctx.arc(cx, y + 3, 4 + Math.random()*2, 0, Math.PI*2);
    ctx.fill();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    var col = (e.flash &gt; 0) ? &#x27;#ffffff&#x27; : e.color;
    ctx.shadowBlur = 14; ctx.shadowColor = e.color;
    ctx.fillStyle = col;
    if (e.type === &#x27;dart&#x27;) {
      ctx.beginPath();
      ctx.moveTo(0, e.r); ctx.lineTo(-e.r*0.7, -e.r); ctx.lineTo(e.r*0.7, -e.r);
      ctx.closePath(); ctx.fill();
    } else if (e.type === &#x27;hex&#x27;) {
      ctx.rotate(e.rot);
      ctx.beginPath();
      for (var i = 0; i &lt; 6; i++) {
        var a = Math.PI/3*i;
        var px = Math.cos(a)*e.r, py = Math.sin(a)*e.r;
        if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else {
      // skull-ish
      ctx.beginPath(); ctx.arc(0, -2, e.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = &#x27;#05060f&#x27;;
      ctx.beginPath(); ctx.arc(-e.r*0.4, -4, e.r*0.28, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r*0.4, -4, e.r*0.28, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = col;
      ctx.fillRect(-e.r*0.5, e.r*0.5, e.r, e.r*0.5);
    }
    ctx.restore();
  }

  function update(dt) {
    elapsed += dt;
    var timeLeft = Math.max(0, Math.ceil(gameLen - elapsed));
    timeEl.textContent = timeLeft;
    if (elapsed &gt;= gameLen) { endGame(false); return; }

    if (keys[&#x27;ArrowLeft&#x27;]) shipX -= shipSpeed;
    if (keys[&#x27;ArrowRight&#x27;]) shipX += shipSpeed;
    shipX = Math.max(shipW/2, Math.min(W - shipW/2, shipX));

    // combo decay
    if (Date.now() - lastHitTime &gt; 1500) { combo = 0; comboMult = 1; }

    // spawn
    spawnTimer += dt;
    var diff = elapsed / gameLen;
    spawnInterval = 1.1 - diff*0.65; // seconds
    if (spawnTimer &gt;= spawnInterval) { spawnTimer = 0; spawnEnemy(); }

    // stars
    for (var s = 0; s &lt; stars.length; s++) {
      stars[s].y += stars[s].spd * (1 + diff*0.5);
      if (stars[s].y &gt; H) { stars[s].y = 0; stars[s].x = Math.random()*W; }
    }

    // bullets
    for (var i = bullets.length-1; i &gt;= 0; i--) {
      bullets[i].y -= 9;
      if (bullets[i].y &lt; -12) bullets.splice(i,1);
    }

    // enemies
    for (var j = enemies.length-1; j &gt;= 0; j--) {
      var e = enemies[j];
      e.y += e.speed;
      e.rot += 0.06;
      if (e.flash &gt; 0) e.flash -= dt;
      if (e.y - e.r &gt; H) {
        // reached bottom, drain shield
        enemies.splice(j,1);
        shield -= (e.pts * 8 + 6);
        shield = Math.max(0, shield);
        shieldEl.style.width = shield + &#x27;%&#x27;;
        beep(120, 0.2, &#x27;sawtooth&#x27;, 0.08);
        combo = 0; comboMult = 1;
        if (shield &lt;= 0) { endGame(true); return; }
      }
    }

    // collisions
    for (var b = bullets.length-1; b &gt;= 0; b--) {
      var bl = bullets[b];
      for (var k = enemies.length-1; k &gt;= 0; k--) {
        var en = enemies[k];
        var dx = bl.x - en.x, dy = bl.y - en.y;
        if (dx*dx + dy*dy &lt; (en.r+5)*(en.r+5)) {
          bullets.splice(b,1);
          en.hp--;
          if (en.hp &gt; 0) {
            en.flash = 0.15;
            explode(bl.x, bl.y, &#x27;#ffffff&#x27;, 6);
            beep(300, 0.06, &#x27;square&#x27;, 0.04);
          } else {
            explode(en.x, en.y, en.color, 18);
            enemies.splice(k,1);
            combo++;
            lastHitTime = Date.now();
            var prev = comboMult;
            if (combo &gt;= 10) comboMult = 10;
            else if (combo &gt;= 6) comboMult = 5;
            else if (combo &gt;= 3) comboMult = 3;
            else comboMult = 1;
            if (comboMult &gt; prev &amp;&amp; comboMult &gt; 1) showCombo(comboMult);
            score += en.pts * comboMult;
            scoreEl.textContent = score;
            beep(520 + en.pts*100, 0.1, &#x27;triangle&#x27;, 0.06);
          }
          break;
        }
      }
    }

    // particles
    for (var p = particles.length-1; p &gt;= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.05; pt.life -= dt*2;
      if (pt.life &lt;= 0) particles.splice(p,1);
    }
  }

  function render() {
    ctx.clearRect(0,0,W,H);
    // stars
    for (var s = 0; s &lt; stars.length; s++) {
      var st = stars[s];
      ctx.globalAlpha = 0.3 + st.s/2.2*0.7;
      ctx.fillStyle = &#x27;#a5c8ff&#x27;;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;
    // bullets
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = &#x27;#22d3ee&#x27;;
    ctx.fillStyle = &#x27;#67e8f9&#x27;;
    for (var i = 0; i &lt; bullets.length; i++) {
      ctx.fillRect(bullets[i].x-2, bullets[i].y, 4, 14);
    }
    ctx.restore();
    // enemies
    for (var j = 0; j &lt; enemies.length; j++) drawEnemy(enemies[j]);
    // particles
    for (var p = 0; p &lt; particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
    }
    ctx.globalAlpha = 1;
    drawShip();
  }

  function loop(ts) {
    if (!running) return;
    if (!lastTime) lastTime = ts;
    var dt = Math.min(0.05, (ts - lastTime)/1000);
    lastTime = ts;
    update(dt);
    if (!running) return;
    render();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    shipX = W/2; bullets = []; enemies = []; particles = [];
    initStars();
    score = 0; shield = 100; combo = 0; comboMult = 1; lastHitTime = 0;
    elapsed = 0; lastTime = 0; spawnTimer = 0; lastShot = 0;
    for (var k in keys) keys[k] = false;
    scoreEl.textContent = &#x27;0&#x27;; timeEl.textContent = &#x27;60&#x27;;
    shieldEl.style.width = &#x27;100%&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    running = true;
    spawnEnemy();
    animId = requestAnimationFrame(loop);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function endGame(died) {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    ovbig.textContent = died ? &#x27;GAME OVER&#x27; : &#x27;TIME UP!&#x27;;
    ovsub.textContent = &#x27;Final Score: &#x27; + score;
    overlay.classList.add(&#x27;show&#x27;);
    beep(200, 0.5, &#x27;sawtooth&#x27;, 0.1);
    render();
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keys[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { if (running) fire(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
  });
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial static render
  initStars(); shipX = W/2; bullets=[]; enemies=[]; particles=[];
  render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
