<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060a; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px; color: #39ff88;
       text-shadow: 0 0 8px #39ff88, 0 0 18px #0f5; }
  .instructions { font-size: 16px; color: #8ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 26px; width: 600px; }
  .score { font-size: 30px; font-weight: 800; color: #ffef5b; text-shadow: 0 0 10px #ffef5b, 0 0 22px #fa0;
           transition: transform .12s ease; }
  .score.flash { transform: scale(1.5); }
  .level { font-size: 16px; color: #5ff; text-shadow: 0 0 8px #0ff; }
  .wrap { position: relative; }
  #field { display: block; background: #06070d; border-radius: 10px; border: 2px solid #123; }
  #field.borderflash { border-color: #f2f; box-shadow: 0 0 30px #f2f, inset 0 0 30px #f2f; }
  .arrow { position: absolute; width: 52px; height: 52px; border-radius: 10px; background: rgba(60,255,150,.10);
           border: 1px solid rgba(60,255,150,.35); color: #39ff88; font-size: 26px; display: flex; align-items: center;
           justify-content: center; cursor: pointer; user-select: none; text-shadow: 0 0 8px #39ff88; }
  .arrow:active { background: rgba(60,255,150,.30); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys or the corner buttons to eat glowing collectibles for points. Grab rare cyan gems and magenta bolts fast, and chain eats within 4 seconds for a combo bonus!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
    &lt;div class=&quot;level&quot; id=&quot;level&quot;&gt;SPEED 1&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;field&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aUp&quot;    style=&quot;left:8px;  top:8px;&quot;&gt;▲&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aLeft&quot;  style=&quot;left:8px;  bottom:8px;&quot;&gt;◀&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aRight&quot; style=&quot;right:8px; top:8px;&quot;&gt;▶&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aDown&quot;  style=&quot;right:8px; bottom:8px;&quot;&gt;▼&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  var CELL=20, COLS=30, ROWS=22, W=COLS*CELL, H=ROWS*CELL;
  var canvas=document.getElementById(&#x27;field&#x27;), ctx=canvas.getContext(&#x27;2d&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;), levelEl=document.getElementById(&#x27;level&#x27;);

  var running=false, rafId=null, lastStep=0;
  var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
  var score=0, level=1;
  var items=[];        // active collectibles
  var particles=[];    // burst particles
  var trail=[];        // fading trail segments
  var floaters=[];     // combo labels
  var combo=1, lastEatTime=0;
  var shake=0;
  var dying=false, deathIndex=0, deathTimer=0;
  var borderFlashUntil=0;

  var STEP_BASE=140; // ms per step at level 1
  function stepInterval(){ return Math.max(55, STEP_BASE - (level-1)*12); }

  // ---- collectibles ----
  // types: star(1), gem(3, shrinks 5s), bolt(5, 3s + border flash)
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      var ok=true;
      for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y){ok=false;break;}
      for(var j=0;j&lt;items.length;j++) if(items[j].x===x&amp;&amp;items[j].y===y){ok=false;break;}
      if(ok) return {x:x,y:y};
    }
    return {x:0,y:0};
  }
  function spawnStar(){ var c=freeCell(); items.push({type:&#x27;star&#x27;,x:c.x,y:c.y,born:performance.now()}); }
  function spawnGem(){ var c=freeCell(); items.push({type:&#x27;gem&#x27;,x:c.x,y:c.y,born:performance.now(),life:5000}); }
  function spawnBolt(){
    var c=freeCell(); items.push({type:&#x27;bolt&#x27;,x:c.x,y:c.y,born:performance.now(),life:3000});
    borderFlashUntil=performance.now()+700;
  }
  function ensureStar(){
    var has=false; for(var i=0;i&lt;items.length;i++) if(items[i].type===&#x27;star&#x27;) has=true;
    if(!has) spawnStar();
  }

  function initSnake(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function burst(cx,cy,color){
    for(var i=0;i&lt;16;i++){
      var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
    }
  }

  function addFloater(cx,cy,text,color){
    floaters.push({x:cx,y:cy,text:text,color:color,life:1});
  }

  function step(now){
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    // trail from current head
    trail.push({x:head.x,y:head.y,life:1});
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ startDeath(); return; }
    for(var i=0;i&lt;snake.length-1;i++){ if(snake[i].x===nx&amp;&amp;snake[i].y===ny){ startDeath(); return; } }

    // eat?
    var eatIdx=-1;
    for(var k=0;k&lt;items.length;k++){ if(items[k].x===nx&amp;&amp;items[k].y===ny){ eatIdx=k; break; } }
    snake.unshift({x:nx,y:ny});
    if(eatIdx&gt;=0){
      var it=items[eatIdx];
      var pts = it.type===&#x27;star&#x27;?1: it.type===&#x27;gem&#x27;?3:5;
      // combo
      if(now-lastEatTime&lt;=4000){ combo=Math.min(3,combo+1); } else { combo=1; }
      lastEatTime=now;
      var gained=pts*combo;
      score+=gained;
      var cx=nx*CELL+CELL/2, cy=ny*CELL+CELL/2;
      var col= it.type===&#x27;star&#x27;?&#x27;#ffef5b&#x27;: it.type===&#x27;gem&#x27;?&#x27;#5ff&#x27;:&#x27;#f4f&#x27;;
      burst(cx,cy,col);
      if(combo&gt;1) addFloater(cx,cy,&#x27;x&#x27;+combo,&#x27;#fff&#x27;);
      flashScore();
      items.splice(eatIdx,1);
      var newLevel=Math.floor(score/5)+1;
      if(newLevel&gt;level){ level=newLevel; }
      scoreEl.textContent=score;
      levelEl.textContent=&#x27;SPEED &#x27;+level;
      ensureStar();
    } else {
      snake.pop();
    }
  }

  function flashScore(){
    scoreEl.classList.add(&#x27;flash&#x27;);
    setTimeout(function(){ scoreEl.classList.remove(&#x27;flash&#x27;); },130);
  }

  function startDeath(){
    dying=true; deathIndex=snake.length-1; deathTimer=0; shake=14;
  }

  function draw(now){
    ctx.save();
    if(shake&gt;0){
      ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    }
    // background grid glow
    ctx.clearRect(-20,-20,W+40,H+40);
    var pulse=0.5+0.5*Math.sin(now/700);
    ctx.strokeStyle=&#x27;rgba(30,80,90,&#x27;+(0.12+0.06*pulse)+&#x27;)&#x27;;
    ctx.lineWidth=1;
    for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
    for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }

    // trail
    for(var t=0;t&lt;trail.length;t++){
      var tr=trail[t];
      ctx.globalAlpha=tr.life*0.35;
      ctx.fillStyle=&#x27;#39ff88&#x27;;
      ctx.fillRect(tr.x*CELL+3,tr.y*CELL+3,CELL-6,CELL-6);
    }
    ctx.globalAlpha=1;

    // items
    for(var i=0;i&lt;items.length;i++){
      var it=items[i]; var cx=it.x*CELL+CELL/2, cy=it.y*CELL+CELL/2;
      if(it.type===&#x27;star&#x27;){
        var blink=0.6+0.4*Math.sin(now/150);
        drawGlow(cx,cy,&#x27;#ffef5b&#x27;,blink);
        drawStar(cx,cy,CELL*0.42,&#x27;#ffef5b&#x27;);
      } else if(it.type===&#x27;gem&#x27;){
        var age=(now-it.born)/it.life; var sc=Math.max(0.2,1-age);
        var p=0.6+0.4*Math.sin(now/120);
        drawGlow(cx,cy,&#x27;#5ff&#x27;,p);
        ctx.fillStyle=&#x27;#5ff&#x27;;
        ctx.beginPath();
        var r=CELL*0.42*sc;
        ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy); ctx.closePath();
        ctx.shadowColor=&#x27;#5ff&#x27;; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;
      } else {
        var fl=Math.sin(now/80)&gt;0?1:0.35;
        drawGlow(cx,cy,&#x27;#f4f&#x27;,fl);
        drawBolt(cx,cy,CELL*0.5,&#x27;#f4f&#x27;);
      }
    }
    ctx.globalAlpha=1;

    // snake
    for(var s=0;s&lt;snake.length;s++){
      var seg=snake[s];
      var col=&#x27;#39ff88&#x27;;
      if(dying &amp;&amp; s&gt;=deathIndex) col=&#x27;#ff3b3b&#x27;;
      ctx.fillStyle=col;
      ctx.shadowColor=col; ctx.shadowBlur= s===0?18:10;
      var pad = s===0?2:3;
      roundRect(seg.x*CELL+pad,seg.y*CELL+pad,CELL-pad*2,CELL-pad*2,4);
      ctx.fill();
    }
    ctx.shadowBlur=0;

    // particles
    for(var p2=0;p2&lt;particles.length;p2++){
      var pa=particles[p2];
      ctx.globalAlpha=Math.max(0,pa.life);
      ctx.fillStyle=pa.color;
      ctx.fillRect(pa.x-2,pa.y-2,4,4);
    }
    ctx.globalAlpha=1;

    // floaters
    for(var f=0;f&lt;floaters.length;f++){
      var fo=floaters[f];
      ctx.globalAlpha=Math.max(0,fo.life);
      ctx.fillStyle=fo.color;
      ctx.font=&#x27;bold 22px system-ui&#x27;;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.shadowColor=fo.color; ctx.shadowBlur=10;
      ctx.fillText(fo.text,fo.x,fo.y);
      ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function drawGlow(cx,cy,color,a){
    ctx.globalAlpha=0.4*a;
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(cx,cy,CELL*0.7,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  function drawStar(cx,cy,r,color){
    ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=14;
    ctx.beginPath();
    for(var i=0;i&lt;10;i++){
      var ang=Math.PI/2 + i*Math.PI/5;
      var rad=(i%2===0)?r:r*0.45;
      var px=cx+Math.cos(ang)*rad, py=cy-Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
  }
  function drawBolt(cx,cy,r,color){
    ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=16;
    ctx.beginPath();
    ctx.moveTo(cx-r*0.2,cy-r); ctx.lineTo(cx+r*0.35,cy-r*0.1);
    ctx.lineTo(cx,cy-r*0.1); ctx.lineTo(cx+r*0.2,cy+r);
    ctx.lineTo(cx-r*0.35,cy+r*0.1); ctx.lineTo(cx,cy+r*0.1);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  var gemTimer=0, boltTimer=0;
  function update(now,dt){
    // border flash
    if(now&lt;borderFlashUntil){ canvas.classList.add(&#x27;borderflash&#x27;); }
    else canvas.classList.remove(&#x27;borderflash&#x27;);

    // decay trail / particles / floaters
    for(var t=trail.length-1;t&gt;=0;t--){ trail[t].life-=dt/380; if(trail[t].life&lt;=0) trail.splice(t,1); }
    for(var p=particles.length-1;p&gt;=0;p--){ var pa=particles[p]; pa.x+=pa.vx; pa.y+=pa.vy; pa.vx*=0.92; pa.vy*=0.92; pa.life-=dt/600; if(pa.life&lt;=0) particles.splice(p,1); }
    for(var f=floaters.length-1;f&gt;=0;f--){ floaters[f].y-=dt*0.03; floaters[f].life-=dt/1200; if(floaters[f].life&lt;=0) floaters.splice(f,1); }
    if(shake&gt;0){ shake-=dt*0.06; if(shake&lt;0) shake=0; }

    // expire timed items
    for(var i=items.length-1;i&gt;=0;i--){
      var it=items[i];
      if(it.life &amp;&amp; now-it.born&gt;it.life) items.splice(i,1);
    }
    ensureStar();

    // periodic spawns
    gemTimer+=dt; boltTimer+=dt;
    if(gemTimer&gt;7000){ gemTimer=0; if(Math.random()&lt;0.85) spawnGem(); }
    if(boltTimer&gt;13000){ boltTimer=0; if(Math.random()&lt;0.7) spawnBolt(); }

    if(dying){
      deathTimer+=dt;
      if(deathTimer&gt;70){ deathTimer=0; deathIndex--; }
      if(deathIndex&lt;-3){ dying=false; running=false; if(rafId){cancelAnimationFrame(rafId);rafId=null;} }
      return;
    }

    if(now-lastStep&gt;=stepInterval()){ lastStep=now; step(now); }
  }

  var prevTime=0;
  function loop(now){
    if(!running &amp;&amp; !dying){ return; }
    var dt=Math.min(60, now-prevTime); prevTime=now;
    update(now,dt);
    draw(now);
    rafId=requestAnimationFrame(loop);
  }

  function startGame(){
    running=true; dying=false;
    score=0; level=1; combo=1; lastEatTime=0;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;SPEED 1&#x27;;
    items=[]; particles=[]; trail=[]; floaters=[];
    gemTimer=0; boltTimer=0; shake=0; borderFlashUntil=0;
    initSnake();
    spawnStar();
    lastStep=performance.now(); prevTime=performance.now();
    if(rafId) cancelAnimationFrame(rafId);
    rafId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false; dying=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }
  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
  });
  function bindArrow(id,x,y){
    var el=document.getElementById(id);
    el.addEventListener(&#x27;mousedown&#x27;,function(ev){ ev.preventDefault(); setDir(x,y); });
    el.addEventListener(&#x27;touchstart&#x27;,function(ev){ ev.preventDefault(); setDir(x,y); },{passive:false});
  }
  bindArrow(&#x27;aUp&#x27;,0,-1); bindArrow(&#x27;aDown&#x27;,0,1); bindArrow(&#x27;aLeft&#x27;,-1,0); bindArrow(&#x27;aRight&#x27;,1,0);

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static paint
  initSnake();
  spawnStar();
  draw(performance.now());
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
