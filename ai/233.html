<style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🦀 Crab Whacker 🦀</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #012a4a; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
  .instructions { font-size: 16px; color: #d6f0ff; max-width: 620px; margin: 0; line-height: 1.3; }
  .banner { width: 620px; box-sizing: border-box; background: linear-gradient(#f4e2b8,#e6cf94); color: #5a3e1b; border-radius: 10px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; box-shadow: 0 3px 6px rgba(0,0,0,.3); }
  .banner .stat { font-size: 18px; }
  .combo { color: #b5470a; min-width: 90px; }
  .wavebar-wrap { flex: 1; height: 16px; background: #cbb98a; border-radius: 8px; overflow: hidden; border: 1px solid #a8935e; }
  .wavebar { height: 100%; width: 0%; background: #2a9df4; transition: background .5s linear; }
  .board { position: relative; width: 620px; height: 420px; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,.4); transition: background 1s linear; }
  .hole { position: absolute; width: 90px; height: 60px; cursor: pointer; }
  .burrow { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 78px; height: 26px; background: radial-gradient(ellipse at center, #2c1b0e 40%, #3d2a17 70%, rgba(61,42,23,0) 72%); border-radius: 50%; }
  .crab { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%) translateY(120%); font-size: 46px; line-height: 1; user-select: none; pointer-events: none; }
  .crab.up { animation: popup .5s cubic-bezier(.2,1.5,.5,1) forwards; }
  @keyframes popup {
    0% { transform: translateX(-50%) translateY(120%) rotate(0deg); }
    60% { transform: translateX(-50%) translateY(-10%) rotate(-8deg); }
    75% { transform: translateX(-50%) translateY(0%) rotate(8deg); }
    90% { transform: translateX(-50%) translateY(0%) rotate(-5deg); }
    100% { transform: translateX(-50%) translateY(0%) rotate(0deg); }
  }
  .crab.down { animation: godown .3s ease-in forwards; }
  @keyframes godown { to { transform: translateX(-50%) translateY(120%); } }
  .bubble { position: absolute; bottom: -20px; border-radius: 50%; background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.4); pointer-events: none; }
  .particle { position: absolute; font-size: 18px; pointer-events: none; }
  .misstag { position: absolute; color: #ff4a4a; font-weight: 800; font-size: 22px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(1,20,40,.82); border-radius: 12px; gap: 6px; }
  .overlay.show { display: flex; }
  .chest { font-size: 70px; animation: chestpop .6s cubic-bezier(.2,1.6,.5,1); }
  @keyframes chestpop { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
  .rating { font-size: 26px; font-weight: 800; }
  .finalscore { font-size: 20px; }
  .hint { font-size: 15px; color: #cfe8ff; }
  .waveflash { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); font-size: 30px; font-weight: 800; color: #ffe08a; text-shadow: 0 2px 6px rgba(0,0,0,.6); pointer-events: none; opacity: 0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🦀 Crab Whacker 🦀&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Click crabs as they pop up — big=1pt, medium=2pts, tiny speedy=5pts, and hit three in a row for a combo bonus. Clicking an empty hole is a miss and breaks your combo!&lt;/p&gt;
  &lt;div class=&quot;banner&quot;&gt;
    &lt;span class=&quot;stat&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot; id=&quot;combo&quot;&gt;Combo x1&lt;/span&gt;
    &lt;div class=&quot;wavebar-wrap&quot;&gt;&lt;div class=&quot;wavebar&quot; id=&quot;wavebar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;span class=&quot;stat&quot; id=&quot;timer&quot;&gt;60&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;
    &lt;div class=&quot;waveflash&quot; id=&quot;waveflash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;chest&quot;&gt;🧰&lt;/div&gt;
      &lt;div class=&quot;rating&quot; id=&quot;rating&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;finalscore&quot; id=&quot;finalscore&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to dive again!&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var BOARD_W = 620, BOARD_H = 420;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var timerEl = document.getElementById(&#x27;timer&#x27;);
  var wavebar = document.getElementById(&#x27;wavebar&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var ratingEl = document.getElementById(&#x27;rating&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalscore&#x27;);
  var waveflash = document.getElementById(&#x27;waveflash&#x27;);

  var running = false;
  var score = 0, combo = 0, comboMult = 1;
  var timeLeft = 60, totalTime = 60;
  var spawnTimer = null, tickTimer = null, bubbleTimer = null;
  var holes = [];
  var currentWave = 0;

  // crab tiers
  var TIERS = {
    big:   { emoji:&#x27;🦀&#x27;, size:46, points:1, life:1500 },
    med:   { emoji:&#x27;🦀&#x27;, size:34, points:2, life:1100 },
    tiny:  { emoji:&#x27;🦀&#x27;, size:24, points:5, life:650 }
  };

  // 8 hole positions (2 rows x 4 cols)
  function buildHoles() {
    board.querySelectorAll(&#x27;.hole&#x27;).forEach(function(h){ h.remove(); });
    holes = [];
    var cols = 4, rows = 2;
    var hw = 90, hh = 90;
    var padX = (BOARD_W - cols*hw) / (cols+1);
    var padY = 30;
    var gapY = (BOARD_H - padY*2 - rows*hh) / (rows-1);
    for (var r=0; r&lt;rows; r++){
      for (var c=0; c&lt;cols; c++){
        var hole = document.createElement(&#x27;div&#x27;);
        hole.className = &#x27;hole&#x27;;
        var x = padX + c*(hw+padX);
        var y = padY + r*(hh+gapY);
        hole.style.left = x + &#x27;px&#x27;;
        hole.style.top = y + &#x27;px&#x27;;
        var burrow = document.createElement(&#x27;div&#x27;);
        burrow.className = &#x27;burrow&#x27;;
        hole.appendChild(burrow);
        var holeObj = { el: hole, busy: false, crab: null, tier: null, cx: x+hw/2, cy: y+hh/2 };
        hole.addEventListener(&#x27;click&#x27;, (function(ho){ return function(){ onHoleClick(ho); }; })(holeObj));
        board.appendChild(hole);
        holes.push(holeObj);
      }
    }
  }

  function onHoleClick(ho) {
    if (!running) return;
    if (ho.busy &amp;&amp; ho.crab) {
      // hit!
      var pts = ho.tier.points;
      combo++;
      if (combo &gt;= 3) comboMult = Math.min(5, combo - 1);
      else comboMult = 1;
      var gained = pts * comboMult;
      score += gained;
      scoreEl.textContent = score;
      updateCombo();
      splash(ho.cx, ho.cy, gained);
      duckCrab(ho);
      beep(520 + pts*80, 0.08);
    } else {
      // miss
      combo = 0; comboMult = 1;
      updateCombo();
      showMiss(ho.cx, ho.cy);
      board.classList.remove(&#x27;shake&#x27;); void board.offsetWidth; board.classList.add(&#x27;shake&#x27;);
      beep(150, 0.12, &#x27;sawtooth&#x27;);
    }
  }

  function updateCombo() {
    comboEl.textContent = &#x27;Combo x&#x27; + comboMult;
    comboEl.style.color = comboMult &gt; 1 ? &#x27;#e8590c&#x27; : &#x27;#8a6d3b&#x27;;
  }

  function duckCrab(ho) {
    if (!ho.crab) return;
    var crab = ho.crab;
    crab.classList.remove(&#x27;up&#x27;);
    crab.classList.add(&#x27;down&#x27;);
    var c = crab;
    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 300);
    ho.busy = false; ho.crab = null; ho.tier = null;
  }

  function spawnCrab() {
    if (!running) return;
    var free = holes.filter(function(h){ return !h.busy; });
    if (!free.length) return;
    var ho = free[Math.floor(Math.random()*free.length)];
    // tier chance depends on wave
    var roll = Math.random();
    var tierKey;
    var tinyChance = 0.08 + currentWave*0.04;
    var medChance = 0.30 + currentWave*0.05;
    if (roll &lt; tinyChance) tierKey = &#x27;tiny&#x27;;
    else if (roll &lt; tinyChance + medChance) tierKey = &#x27;med&#x27;;
    else tierKey = &#x27;big&#x27;;
    var tier = TIERS[tierKey];
    var crab = document.createElement(&#x27;div&#x27;);
    crab.className = &#x27;crab&#x27;;
    crab.textContent = tier.emoji;
    crab.style.fontSize = tier.size + &#x27;px&#x27;;
    ho.el.appendChild(crab);
    void crab.offsetWidth;
    crab.classList.add(&#x27;up&#x27;);
    ho.busy = true; ho.crab = crab; ho.tier = tier;
    // life scaled by wave (faster later)
    var life = tier.life * (1 - currentWave*0.12);
    setTimeout((function(h,c){ return function(){
      if (h.crab === c &amp;&amp; h.busy) { autoDuck(h); }
    }; })(ho, crab), life);
  }

  function autoDuck(ho) {
    if (!ho.crab) return;
    var crab = ho.crab;
    crab.classList.remove(&#x27;up&#x27;);
    crab.classList.add(&#x27;down&#x27;);
    var c = crab;
    setTimeout(function(){ if (c.parentNode) c.parentNode.removeChild(c); }, 300);
    ho.busy = false; ho.crab = null; ho.tier = null;
  }

  function splash(x, y, gained) {
    var emojis = [&#x27;💦&#x27;,&#x27;✨&#x27;,&#x27;💧&#x27;,&#x27;⭐&#x27;];
    for (var i=0;i&lt;7;i++){
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = x + &#x27;px&#x27;;
      p.style.top = y + &#x27;px&#x27;;
      board.appendChild(p);
      var ang = Math.random()*Math.PI*2;
      var dist = 30 + Math.random()*40;
      var dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 20;
      p.animate([
        { transform:&#x27;translate(-50%,-50%) scale(1)&#x27;, opacity:1 },
        { transform:&#x27;translate(calc(-50% + &#x27;+dx+&#x27;px), calc(-50% + &#x27;+dy+&#x27;px)) scale(.4)&#x27;, opacity:0 }
      ], { duration:600, easing:&#x27;ease-out&#x27; });
      (function(pp){ setTimeout(function(){ if(pp.parentNode) pp.parentNode.removeChild(pp); }, 620); })(p);
    }
    var plus = document.createElement(&#x27;div&#x27;);
    plus.className = &#x27;particle&#x27;;
    plus.textContent = &#x27;+&#x27; + gained;
    plus.style.color = &#x27;#ffe08a&#x27;;
    plus.style.fontWeight = &#x27;800&#x27;;
    plus.style.fontSize = &#x27;22px&#x27;;
    plus.style.left = x + &#x27;px&#x27;;
    plus.style.top = y + &#x27;px&#x27;;
    board.appendChild(plus);
    plus.animate([
      { transform:&#x27;translate(-50%,-50%)&#x27;, opacity:1 },
      { transform:&#x27;translate(-50%,-140%)&#x27;, opacity:0 }
    ], { duration:700, easing:&#x27;ease-out&#x27; });
    setTimeout(function(){ if(plus.parentNode) plus.parentNode.removeChild(plus); }, 720);
  }

  function showMiss(x, y) {
    var m = document.createElement(&#x27;div&#x27;);
    m.className = &#x27;misstag&#x27;;
    m.textContent = &#x27;miss!&#x27;;
    m.style.left = x + &#x27;px&#x27;;
    m.style.top = y + &#x27;px&#x27;;
    m.style.transform = &#x27;translate(-50%,-50%)&#x27;;
    board.appendChild(m);
    m.animate([
      { transform:&#x27;translate(-50%,-50%) scale(.6)&#x27;, opacity:1 },
      { transform:&#x27;translate(-50%,-120%) scale(1.1)&#x27;, opacity:0 }
    ], { duration:600, easing:&#x27;ease-out&#x27; });
    setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); }, 620);
  }

  function makeBubble() {
    if (!running) return;
    var b = document.createElement(&#x27;div&#x27;);
    b.className = &#x27;bubble&#x27;;
    var size = 6 + Math.random()*18;
    b.style.width = size+&#x27;px&#x27;;
    b.style.height = size+&#x27;px&#x27;;
    b.style.left = Math.random()*BOARD_W + &#x27;px&#x27;;
    board.appendChild(b);
    var dur = 3000 + Math.random()*2500;
    b.animate([
      { transform:&#x27;translateY(0)&#x27;, opacity:.6 },
      { transform:&#x27;translateY(-&#x27;+(BOARD_H+40)+&#x27;px)&#x27;, opacity:0 }
    ], { duration:dur, easing:&#x27;linear&#x27; });
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, dur+50);
  }

  // ocean color shift by progress
  function boardColor(progress) {
    // shallow turquoise -&gt; deep ocean blue
    var top1=[26,188,156], top2=[1,42,74];
    var bot1=[8,110,140], bot2=[0,15,40];
    function mix(a,b,t){ return Math.round(a+(b-a)*t); }
    var t=[mix(top1[0],top2[0],progress),mix(top1[1],top2[1],progress),mix(top1[2],top2[2],progress)];
    var bt=[mix(bot1[0],bot2[0],progress),mix(bot1[1],bot2[1],progress),mix(bot1[2],bot2[2],progress)];
    board.style.background = &#x27;linear-gradient(rgb(&#x27;+t[0]+&#x27;,&#x27;+t[1]+&#x27;,&#x27;+t[2]+&#x27;), rgb(&#x27;+bt[0]+&#x27;,&#x27;+bt[1]+&#x27;,&#x27;+bt[2]+&#x27;))&#x27;;
  }

  function waveColor(progress) {
    // calm blue -&gt; stormy red
    var r=Math.round(42+(200-42)*progress);
    var g=Math.round(157+(40-157)*progress);
    var b=Math.round(244+(40-244)*progress);
    wavebar.style.background = &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function showWaveFlash(txt) {
    waveflash.textContent = txt;
    waveflash.animate([
      { opacity:0, transform:&#x27;translateX(-50%) scale(.6)&#x27; },
      { opacity:1, transform:&#x27;translateX(-50%) scale(1.1)&#x27;, offset:.3 },
      { opacity:1, transform:&#x27;translateX(-50%) scale(1)&#x27;, offset:.7 },
      { opacity:0, transform:&#x27;translateX(-50%) scale(1.2)&#x27; }
    ], { duration:1400, easing:&#x27;ease-out&#x27; });
  }

  var spawnInterval;
  function scheduleSpawn() {
    if (!running) return;
    spawnCrab();
    var base = 900 - currentWave*140;
    var next = base + Math.random()*300;
    spawnTimer = setTimeout(scheduleSpawn, next);
  }

  function updateWave() {
    var elapsed = totalTime - timeLeft;
    var wave = Math.min(3, Math.floor(elapsed / 15)); // 0..3 over 60s
    if (wave !== currentWave) {
      currentWave = wave;
      showWaveFlash(&#x27;WAVE &#x27; + (currentWave+1));
      beep(660, 0.15, &#x27;triangle&#x27;);
    }
  }

  function tick() {
    if (!running) return;
    timeLeft--;
    if (timeLeft &lt; 0) { endGame(); return; }
    timerEl.textContent = timeLeft;
    var progress = (totalTime - timeLeft) / totalTime;
    wavebar.style.width = (progress*100) + &#x27;%&#x27;;
    boardColor(progress);
    waveColor(progress);
    updateWave();
  }

  function endGame() {
    running = false;
    if (spawnTimer) clearTimeout(spawnTimer);
    if (tickTimer) clearInterval(tickTimer);
    if (bubbleTimer) clearInterval(bubbleTimer);
    holes.forEach(function(h){ if(h.crab &amp;&amp; h.crab.parentNode) h.crab.parentNode.removeChild(h.crab); h.busy=false; h.crab=null; h.tier=null; });
    var rating;
    if (score &gt;= 120) rating = &#x27;Legendary Crabmaster 🏆&#x27;;
    else if (score &gt;= 80) rating = &#x27;Crab Captain ⚓&#x27;;
    else if (score &gt;= 45) rating = &#x27;Reef Ranger 🐟&#x27;;
    else if (score &gt;= 20) rating = &#x27;Tide Pooler 🌊&#x27;;
    else rating = &#x27;Sea Snail 🐌&#x27;;
    ratingEl.textContent = rating;
    finalScoreEl.textContent = &#x27;Final Score: &#x27; + score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame() {
    running = true;
    score = 0; combo = 0; comboMult = 1; currentWave = -1;
    timeLeft = 60; totalTime = 60;
    scoreEl.textContent = &#x27;0&#x27;;
    updateCombo();
    timerEl.textContent = timeLeft;
    wavebar.style.width = &#x27;0%&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    buildHoles();
    boardColor(0);
    waveColor(0);
    updateWave();
    // immediate action
    spawnCrab();
    makeBubble(); makeBubble();
    scheduleSpawn();
    tickTimer = setInterval(tick, 1000);
    bubbleTimer = setInterval(makeBubble, 600);
  }

  function stopGame() {
    running = false;
    if (spawnTimer) clearTimeout(spawnTimer);
    if (tickTimer) clearInterval(tickTimer);
    if (bubbleTimer) clearInterval(bubbleTimer);
  }

  // audio
  var audioCtx = null;
  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || &#x27;sine&#x27;;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(_) {}
  }

  buildHoles();
  boardColor(0);

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
