<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌊 Cosmic Reef Defender</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #030818; color: #cfe8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #6ff2ff; text-shadow: 0 0 12px #1ba8c9; }
  .instructions { font-size: 16px; color: #9fc4e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 18px; align-items: center; font-size: 18px; }

  .heatbar.hot { background: linear-gradient(90deg,#f60,#f33); }
  .field { position: relative; width: 660px; height: 460px; flex-shrink: 0; background: radial-gradient(ellipse at 50% 0%, #0a1e40, #030818 80%); border-radius: 10px; overflow: hidden; border: 1px solid #123; }
  .field.shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-8px,4px)} 40%{transform:translate(8px,-4px)} 60%{transform:translate(-6px,2px)} 80%{transform:translate(6px,-2px)} }
  .flash { position:absolute; inset:0; background:#f44; opacity:0; pointer-events:none; }
  canvas { display:block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌊 Cosmic Reef Defender&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your sub with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; and fire plasma with &lt;strong&gt;Space&lt;/strong&gt; — but watch the heat bar and fire in short bursts. Blast jellyfish (1pt), anglerfish (splits, 3pts) and serpents (2 hits, 10pts); chain kills fast for a gold combo!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;streak&quot;&gt;Best Streak: &lt;b id=&quot;streak&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div&gt;Heat: &lt;div class=&quot;heatwrap&quot;&gt;&lt;div class=&quot;heatbar&quot; id=&quot;heat&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;660&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try {
      window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
});

var FIELD_W = 660, FIELD_H = 460;
var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;), streakEl = document.getElementById(&#x27;streak&#x27;);
var heatEl = document.getElementById(&#x27;heat&#x27;), fieldEl = document.getElementById(&#x27;field&#x27;), flashEl = document.getElementById(&#x27;flash&#x27;);

var SHIP_W = 46, SHIP_H = 26, SHIP_BOTTOM = 14, SHIP_SPEED = 6;
var running = false, animId = null;
var keysDown = {}, shipX, bullets, enemies, particles, bubbles;
var score, curStreak, bestStreak, heat, overheated;
var lastShot, spawnTimer, spawnInterval, difficulty, diffTimer;
var comboHits, comboEnd, comboActive, lastTime;
var goldFlashEnd = 0;

function rand(a,b){ return a + Math.random()*(b-a); }

function resetState(){
  shipX = (FIELD_W - SHIP_W)/2;
  bullets = []; enemies = []; particles = [];
  bubbles = [];
  for(var i=0;i&lt;40;i++) bubbles.push({x:rand(0,FIELD_W),y:rand(0,FIELD_H),r:rand(1,3.5),s:rand(.3,1.1)});
  score=0; curStreak=0; bestStreak=0; heat=0; overheated=false;
  lastShot=0; spawnTimer=0; spawnInterval=1100; difficulty=0; diffTimer=0;
  comboHits=[]; comboEnd=0; comboActive=false; goldFlashEnd=0;
  for(var k in keysDown) keysDown[k]=false;
  scoreEl.textContent=&#x27;0&#x27;; streakEl.textContent=&#x27;0&#x27;;
  scoreEl.style.color=&#x27;&#x27;; updateHeat();
}

function updateHeat(){
  heatEl.style.width = (heat*100)+&#x27;%&#x27;;
  if(overheated || heat&gt;0.85) heatEl.classList.add(&#x27;hot&#x27;); else heatEl.classList.remove(&#x27;hot&#x27;);
}

function spawnEnemy(){
  var r = Math.random();
  var speedBoost = 1 + difficulty*0.18;
  var e;
  if(r &lt; 0.55){ // jellyfish
    e = {type:&#x27;jelly&#x27;, x:rand(20,FIELD_W-40), y:-30, r:14, vy:rand(1.3,1.8)*speedBoost, phase:rand(0,6.28), color:&#x27;#ff5ce0&#x27;, hp:1, pts:1};
  } else if(r &lt; 0.88){ // anglerfish
    e = {type:&#x27;angler&#x27;, x:rand(30,FIELD_W-50), y:-40, r:20, vy:rand(0.9,1.2)*speedBoost, vx:rand(-.6,.6), color:&#x27;#ffd23f&#x27;, hp:1, pts:1, split:true};
  } else { // serpent
    e = {type:&#x27;serpent&#x27;, x:rand(40,FIELD_W-60), y:-50, r:28, vy:rand(0.55,0.75)*speedBoost, vx:rand(-.4,.4), color:&#x27;#5cff8f&#x27;, hp:2, pts:10, wig:rand(0,6.28)};
  }
  enemies.push(e);
}

function spawnSplit(x,y){
  for(var i=0;i&lt;2;i++){
    enemies.push({type:&#x27;jelly&#x27;, x:x, y:y, r:9, vy:rand(1.5,2.2), phase:rand(0,6.28), color:&#x27;#ffa0f0&#x27;, hp:1, pts:1, small:true});
  }
}

function fire(){
  if(overheated) return;
  var now = performance.now();
  if(now - lastShot &lt; 130) return;
  lastShot = now;
  bullets.push({x:shipX+SHIP_W/2, y:FIELD_H-SHIP_BOTTOM-SHIP_H-6, vy:9});
  heat = Math.min(1, heat + 0.11);
  if(heat &gt;= 1){ overheated = true; }
  updateHeat();
}

function burst(x,y,color,n,rainbow){
  for(var i=0;i&lt;n;i++){
    var ang = rand(0,6.28), sp = rand(1,5);
    particles.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,color: rainbow?(&#x27;hsl(&#x27;+Math.floor(rand(0,360))+&#x27;,100%,60%)&#x27;):color});
  }
}

function registerKill(pts){
  var now = performance.now();
  var base = pts * (comboActive?2:1);
  score += base;
  scoreEl.textContent = score;
  curStreak++;
  if(curStreak&gt;bestStreak){ bestStreak=curStreak; streakEl.textContent=bestStreak; }
  // combo tracking
  comboHits.push(now);
  comboHits = comboHits.filter(function(t){ return now - t &lt;= 2000; });
  if(comboHits.length &gt;= 3 &amp;&amp; !comboActive){
    comboActive = true; comboEnd = now + 5000; goldFlashEnd = now + 600;
  }
}

function enemyReachedBottom(){
  score = Math.max(0, score-1);
  scoreEl.textContent = score;
  curStreak = 0;
  fieldEl.classList.remove(&#x27;shake&#x27;); void fieldEl.offsetWidth; fieldEl.classList.add(&#x27;shake&#x27;);
  flashEl.style.transition=&#x27;none&#x27;; flashEl.style.opacity=&#x27;0.5&#x27;;
  setTimeout(function(){ flashEl.style.transition=&#x27;opacity .35s&#x27;; flashEl.style.opacity=&#x27;0&#x27;; },20);
}

function tick(ts){
  if(!running) return;
  var dt = lastTime ? (ts-lastTime) : 16; lastTime = ts;
  var now = ts;

  // difficulty ramp every 15s
  diffTimer += dt;
  if(diffTimer &gt;= 15000){ diffTimer=0; difficulty++; spawnInterval = Math.max(450, spawnInterval-140); }

  // spawn
  spawnTimer += dt;
  if(spawnTimer &gt;= spawnInterval){ spawnTimer=0; spawnEnemy(); }

  // heat cooldown
  if(heat&gt;0){ heat = Math.max(0, heat - (overheated?0.006:0.009)*dt/16); }
  if(overheated &amp;&amp; heat&lt;=0){ overheated=false; }
  updateHeat();

  // combo expiry
  if(comboActive &amp;&amp; now &gt; comboEnd){ comboActive=false; comboHits=[]; }

  // movement
  if(keysDown[&#x27;ArrowLeft&#x27;]) shipX -= SHIP_SPEED;
  if(keysDown[&#x27;ArrowRight&#x27;]) shipX += SHIP_SPEED;
  shipX = Math.max(0, Math.min(FIELD_W-SHIP_W, shipX));

  // bullets
  for(var i=bullets.length-1;i&gt;=0;i--){
    var b=bullets[i]; b.y -= b.vy;
    if(b.y &lt; -10){ bullets.splice(i,1); }
  }
  // enemies
  for(var j=enemies.length-1;j&gt;=0;j--){
    var e=enemies[j];
    e.y += e.vy * dt/16;
    if(e.type===&#x27;jelly&#x27;){ e.phase += 0.08; e.x += Math.sin(e.phase)*2.4; }
    else if(e.type===&#x27;angler&#x27;){ e.x += e.vx; if(e.x&lt;10||e.x&gt;FIELD_W-10) e.vx*=-1; }
    else if(e.type===&#x27;serpent&#x27;){ e.wig += 0.05; e.x += Math.sin(e.wig)*1.3 + e.vx; if(e.x&lt;20||e.x&gt;FIELD_W-20) e.vx*=-1; }
    if(e.y - e.r &gt; FIELD_H){ enemies.splice(j,1); enemyReachedBottom(); continue; }
    // bullet collision
    for(var k=bullets.length-1;k&gt;=0;k--){
      var b2=bullets[k];
      var dx=b2.x-e.x, dy=b2.y-e.y;
      if(dx*dx+dy*dy &lt; (e.r+5)*(e.r+5)){
        bullets.splice(k,1);
        e.hp--;
        if(e.hp&lt;=0){
          if(e.type===&#x27;serpent&#x27;){ burst(e.x,e.y,e.color,26,true); }
          else burst(e.x,e.y,e.color,12,false);
          if(e.type===&#x27;angler&#x27; &amp;&amp; e.split){ spawnSplit(e.x,e.y); }
          registerKill(e.pts);
          enemies.splice(j,1);
        } else {
          burst(e.x,e.y,e.color,6,false);
        }
        break;
      }
    }
  }
  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=0.025;
    if(pt.life&lt;=0) particles.splice(p,1);
  }
  // bubbles
  for(var q=0;q&lt;bubbles.length;q++){
    var bb=bubbles[q]; bb.y-=bb.s; if(bb.y&lt;-5){ bb.y=FIELD_H+5; bb.x=rand(0,FIELD_W); }
  }

  // gold flash on score
  scoreEl.style.color = (now &lt; goldFlashEnd) ? &#x27;#ffd23f&#x27; : (comboActive ? &#x27;#ffd23f&#x27; : &#x27;&#x27;);

  draw(now);
  animId = requestAnimationFrame(tick);
}

function draw(now){
  ctx.clearRect(0,0,FIELD_W,FIELD_H);
  // bubbles
  ctx.fillStyle=&#x27;rgba(120,180,255,0.15)&#x27;;
  for(var q=0;q&lt;bubbles.length;q++){ var bb=bubbles[q]; ctx.beginPath(); ctx.arc(bb.x,bb.y,bb.r,0,6.28); ctx.fill(); }

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p]; ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;

  // bullets
  ctx.fillStyle=&#x27;#7ef&#x27;; ctx.shadowColor=&#x27;#3ff&#x27;; ctx.shadowBlur=8;
  for(var i=0;i&lt;bullets.length;i++){ var b=bullets[i]; ctx.beginPath(); ctx.ellipse(b.x,b.y,3,7,0,0,6.28); ctx.fill(); }
  ctx.shadowBlur=0;

  // enemies
  for(var j=0;j&lt;enemies.length;j++){ drawEnemy(enemies[j],now); }

  // ship
  var sx=shipX+SHIP_W/2, sy=FIELD_H-SHIP_BOTTOM-SHIP_H/2;
  // combo ring
  if(comboActive){
    var pr = 30 + Math.sin(now/120)*5;
    ctx.strokeStyle=&#x27;rgba(255,210,63,&#x27;+(0.5+0.3*Math.sin(now/120))+&#x27;)&#x27;; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(sx,sy,pr,0,6.28); ctx.stroke();
  }
  ctx.save();
  ctx.shadowColor=&#x27;#3ef&#x27;; ctx.shadowBlur=14;
  ctx.fillStyle=&#x27;#39d6ff&#x27;;
  ctx.beginPath(); ctx.ellipse(sx,sy,SHIP_W/2,SHIP_H/2,0,0,6.28); ctx.fill();
  ctx.fillStyle=&#x27;#cffcff&#x27;;
  ctx.beginPath(); ctx.arc(sx,sy-3,6,0,6.28); ctx.fill();
  // fin/cannon
  ctx.fillStyle=&#x27;#0af&#x27;;
  ctx.fillRect(sx-3, sy-SHIP_H/2-6, 6, 8);
  ctx.restore();
}

function drawEnemy(e,now){
  ctx.save();
  ctx.shadowColor=e.color; ctx.shadowBlur=14; ctx.fillStyle=e.color;
  if(e.type===&#x27;jelly&#x27;){
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r,Math.PI,0); ctx.fill();
    ctx.strokeStyle=e.color; ctx.lineWidth=2;
    for(var t=-1;t&lt;=1;t++){ ctx.beginPath(); ctx.moveTo(e.x+t*e.r*0.5,e.y); ctx.lineTo(e.x+t*e.r*0.5+Math.sin(now/150+t)*4, e.y+e.r); ctx.stroke(); }
  } else if(e.type===&#x27;angler&#x27;){
    ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r,e.r*0.75,0,0,6.28); ctx.fill();
    // lure
    ctx.strokeStyle=e.color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(e.x,e.y-e.r*0.7); ctx.lineTo(e.x,e.y-e.r*1.4); ctx.stroke();
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(e.x,e.y-e.r*1.5,3,0,6.28); ctx.fill();
    // eye
    ctx.fillStyle=&#x27;#300&#x27;; ctx.beginPath(); ctx.arc(e.x-e.r*0.4,e.y-2,3,0,6.28); ctx.fill();
    // teeth
    ctx.fillStyle=&#x27;#fff&#x27;;
    for(var m=-2;m&lt;=2;m++){ ctx.beginPath(); ctx.moveTo(e.x+m*4, e.y+e.r*0.4); ctx.lineTo(e.x+m*4-2, e.y+e.r*0.75); ctx.lineTo(e.x+m*4+2, e.y+e.r*0.75); ctx.fill(); }
  } else if(e.type===&#x27;serpent&#x27;){
    // body segments
    for(var s=0;s&lt;5;s++){
      var seg = e.r - s*3;
      ctx.beginPath(); ctx.arc(e.x+Math.sin(e.wig-s*0.5)*8, e.y - s*e.r*0.5, seg, 0, 6.28); ctx.fill();
    }
    // eyes
    ctx.fillStyle=&#x27;#f0f&#x27;; ctx.beginPath(); ctx.arc(e.x-8,e.y-4,4,0,6.28); ctx.arc(e.x+8,e.y-4,4,0,6.28); ctx.fill();
    if(e.hp&lt;2){ ctx.strokeStyle=&#x27;#fff&#x27;; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+4,0,6.28); ctx.stroke(); }
  }
  ctx.restore();
}

function startGame(){
  if(running) return;
  resetState();
  running=true; lastTime=0;
  spawnEnemy(); // immediate visual
  animId = requestAnimationFrame(tick);
}
function stopGame(){
  if(!running) return;
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) fire(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;, function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
});
window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static paint
resetState();
draw(0);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);

<script>
