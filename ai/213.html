<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>✦ COSMIC BREAKOUT ✦</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html,body{height:100%;margin:0;padding:0;background:#05010f;color:#eafaff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;}
  .game{max-width:720px;margin:0 auto;padding:8px 8px 0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}
  h1{margin:2px 0;font-size:24px;font-weight:800;letter-spacing:1px;
     background:linear-gradient(90deg,#00e5ff,#c400ff,#ff00a8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(120,0,255,.4);}
  .instructions{font-size:16px;color:#9fd6ff;max-width:640px;margin:0;line-height:1.35;text-align:center;}
  .hud{display:flex;justify-content:space-between;width:640px;font-size:16px;font-weight:700;align-items:center;}
  .hud .combo{color:#ffd23f;min-height:20px;}
  .hud .time{color:#5cffb1;}
  .wrap{position:relative;width:640px;height:460px;}
  canvas{display:block;border-radius:10px;box-shadow:0 0 30px rgba(90,0,200,.5),inset 0 0 30px rgba(0,120,255,.15);background:#05010f;}
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC BREAKOUT ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse to slide the glowing paddle and bounce the orb up to smash the alien bricks. Grab falling power-ups and rack up combos before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;time&quot;&gt;⏱ &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv=document.getElementById(&#x27;cv&#x27;),ctx=cv.getContext(&#x27;2d&#x27;);
var W=640,H=460;
var scoreEl=document.getElementById(&#x27;score&#x27;),comboEl=document.getElementById(&#x27;combo&#x27;),timeEl=document.getElementById(&#x27;time&#x27;);

var running=false,animId=null,lastT=0;
var score=0,timeLeft=60;
var shake=0;
var combo=1,comboTimer=0;

// audio
var actx=null;
function beep(freq,dur,type,vol){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||&#x27;square&#x27;;o.frequency.value=freq;
    g.gain.value=vol||0.06;o.connect(g);g.connect(actx.destination);
    o.start();g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+(dur||0.08));
    o.stop(actx.currentTime+(dur||0.08));
  }catch(_){}
}

// stars parallax
var stars=[];
function initStars(){stars=[];for(var i=0;i&lt;70;i++){stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.4,r:Math.random()*1.5+0.4});}}
var nebulas=[];
function initNebulas(){nebulas=[];for(var i=0;i&lt;3;i++){nebulas.push({x:Math.random()*W,y:Math.random()*H,r:120+Math.random()*80,hue:Math.random()*360,sp:0.1+Math.random()*0.2});}}

// paddle
var paddle={x:W/2-55,w:110,h:14,y:H-26,base:110,wideTimer:0};
// balls
var balls=[];
function newBall(x,y,vx,vy,fire){return{x:x,y:y,vx:vx,vy:vy,r:8,fire:fire||false,fireTimer:0};}
function resetBalls(){balls=[newBall(W/2,H-60,3,-4.2,false)];}

// bricks
var bricks=[];
var COLS=10,BRICK_W=58,BRICK_H=22,GAP=4,TOP=48,LEFT=(W-(COLS*(BRICK_W+GAP)-GAP))/2;
var palette=[[&#x27;#00e5ff&#x27;,&#x27;#0077ff&#x27;],[&#x27;#c400ff&#x27;,&#x27;#7a00ff&#x27;],[&#x27;#ff00a8&#x27;,&#x27;#ff0055&#x27;],[&#x27;#5cffb1&#x27;,&#x27;#00c07a&#x27;],[&#x27;#ffd23f&#x27;,&#x27;#ff8a00&#x27;]];

function buildBricks(){
  bricks=[];
  var rows=5;
  for(var r=0;r&lt;rows;r++){
    for(var c=0;c&lt;COLS;c++){
      // fun pattern: skip some to form arch/diamond-ish gaps
      if(r===0 &amp;&amp; (c===0||c===COLS-1))continue;
      if(r===4 &amp;&amp; (c%3===1))continue;
      var hp=r&lt;2?1:(r&lt;4?2:3);
      var col=palette[r%palette.length];
      bricks.push({x:LEFT+c*(BRICK_W+GAP),y:TOP+r*(BRICK_H+GAP),w:BRICK_W,h:BRICK_H,hp:hp,maxhp:hp,c:col,flash:0});
    }
  }
}

// powerups
var powerups=[];
function dropPower(x,y){
  var r=Math.random();
  var type = r&lt;0.4?&#x27;wide&#x27;:(r&lt;0.7?&#x27;multi&#x27;:&#x27;fire&#x27;);
  powerups.push({x:x,y:y,vy:1.8,type:type,r:12});
}

// particles
var parts=[];
function explode(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2,s=Math.random()*3+1;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

var ballSpeedBonus=0;
function setup(){
  score=0;timeLeft=60;combo=1;comboTimer=0;shake=0;ballSpeedBonus=0;
  paddle.x=W/2-paddle.base/2;paddle.w=paddle.base;paddle.wideTimer=0;
  parts=[];powerups=[];
  initStars();initNebulas();buildBricks();resetBalls();
  scoreEl.textContent=&#x27;0&#x27;;timeEl.textContent=&#x27;60&#x27;;comboEl.textContent=&#x27;&#x27;;
  gameOver=false;
}

var mouseX=W/2;
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  mouseX=(e.clientX-rect.left)*(W/rect.width);
});
cv.addEventListener(&#x27;touchmove&#x27;,function(e){
  var rect=cv.getBoundingClientRect();
  if(e.touches[0])mouseX=(e.touches[0].clientX-rect.left)*(W/rect.width);
  e.preventDefault();
},{passive:false});

function speedScale(){return 1+ballSpeedBonus*0.06;}

var gameOver=false;

function addScore(pts){
  score+=Math.round(pts*combo);
  scoreEl.textContent=score;
  var newBonus=Math.floor(score/10);
  if(newBonus&gt;ballSpeedBonus){ballSpeedBonus=newBonus;}
}

function update(dt){
  timeLeft-=dt;
  if(timeLeft&lt;=0){timeLeft=0;endGame();}
  timeEl.textContent=Math.ceil(timeLeft);

  // paddle follow mouse
  var target=mouseX-paddle.w/2;
  paddle.x+=(target-paddle.x)*0.4;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(paddle.wideTimer&gt;0){paddle.wideTimer-=dt;if(paddle.wideTimer&lt;=0){paddle.w=paddle.base;}}

  // combo decay
  if(comboTimer&gt;0){comboTimer-=dt;if(comboTimer&lt;=0){combo=1;comboEl.textContent=&#x27;&#x27;;}}

  if(shake&gt;0)shake-=dt*40;

  // balls
  for(var i=balls.length-1;i&gt;=0;i--){
    var b=balls[i];
    var sc=speedScale();
    b.x+=b.vx*sc;b.y+=b.vy*sc;
    if(b.fireTimer&gt;0){b.fireTimer-=dt;if(b.fireTimer&lt;=0)b.fire=false;}
    if(b.x-b.r&lt;0){b.x=b.r;b.vx=Math.abs(b.vx);}
    if(b.x+b.r&gt;W){b.x=W-b.r;b.vx=-Math.abs(b.vx);}
    if(b.y-b.r&lt;0){b.y=b.r;b.vy=Math.abs(b.vy);}
    // paddle
    if(b.vy&gt;0 &amp;&amp; b.y+b.r&gt;=paddle.y &amp;&amp; b.y+b.r&lt;=paddle.y+paddle.h+8 &amp;&amp; b.x&gt;=paddle.x &amp;&amp; b.x&lt;=paddle.x+paddle.w){
      b.y=paddle.y-b.r;
      var hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      b.vx=hit*sp*0.9;b.vy=-Math.abs(Math.sqrt(Math.max(4,sp*sp-b.vx*b.vx)));
      beep(320,0.06,&#x27;square&#x27;);
    }
    // fell off
    if(b.y-b.r&gt;H){
      balls.splice(i,1);
      if(balls.length===0){combo=1;comboEl.textContent=&#x27;&#x27;;resetBalls();beep(120,0.2,&#x27;sawtooth&#x27;);shake=6;}
      continue;
    }
    // brick collisions
    for(var j=bricks.length-1;j&gt;=0;j--){
      var br=bricks[j];
      if(b.x+b.r&gt;br.x &amp;&amp; b.x-b.r&lt;br.x+br.w &amp;&amp; b.y+b.r&gt;br.y &amp;&amp; b.y-b.r&lt;br.y+br.h){
        // hit
        var dmg=b.fire?br.hp:1;
        br.hp-=dmg;br.flash=1;
        if(!b.fire){
          // bounce
          var ox=Math.min(b.x+b.r-br.x,br.x+br.w-(b.x-b.r));
          var oy=Math.min(b.y+b.r-br.y,br.y+br.h-(b.y-b.r));
          if(ox&lt;oy)b.vx=-b.vx;else b.vy=-b.vy;
        }
        beep(500+br.hp*80,0.05,&#x27;square&#x27;);
        if(br.hp&lt;=0){
          explode(br.x+br.w/2,br.y+br.h/2,br.c[0],12);
          var pts=br.maxhp;
          addScore(pts);
          // combo build
          combo++;if(combo&gt;1)comboEl.textContent=&#x27;x&#x27;+combo+&#x27; COMBO!&#x27;;
          comboTimer=1.4;
          if(Math.random()&lt;0.16)dropPower(br.x+br.w/2,br.y+br.h/2);
          bricks.splice(j,1);
          if(b.fire){shake=8;}
        }
        if(!b.fire)break; // normal ball bounces off one brick
      }
    }
  }

  // powerups
  for(var p=powerups.length-1;p&gt;=0;p--){
    var pu=powerups[p];pu.y+=pu.vy;
    if(pu.y-pu.r&gt;H){powerups.splice(p,1);continue;}
    if(pu.y+pu.r&gt;=paddle.y &amp;&amp; pu.x&gt;=paddle.x &amp;&amp; pu.x&lt;=paddle.x+paddle.w){
      applyPower(pu.type);powerups.splice(p,1);beep(700,0.15,&#x27;triangle&#x27;,0.08);
    }
  }

  // particles
  for(var k=parts.length-1;k&gt;=0;k--){
    var pt=parts[k];pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.08;pt.life-=dt*1.8;
    if(pt.life&lt;=0)parts.splice(k,1);
  }

  // stars scroll
  for(var s=0;s&lt;stars.length;s++){var st=stars[s];st.y+=st.z*0.4;if(st.y&gt;H){st.y=0;st.x=Math.random()*W;}}
  for(var n=0;n&lt;nebulas.length;n++){nebulas[n].y+=nebulas[n].sp;if(nebulas[n].y-nebulas[n].r&gt;H){nebulas[n].y=-nebulas[n].r;nebulas[n].x=Math.random()*W;}}

  // rebuild bricks if all gone
  if(bricks.length===0){buildBricks();}
}

function applyPower(type){
  if(type===&#x27;wide&#x27;){paddle.w=Math.min(paddle.base*1.6,180);paddle.x-=25;paddle.wideTimer=8;}
  else if(type===&#x27;multi&#x27;){
    var cur=balls.slice();
    cur.forEach(function(b){
      if(balls.length&lt;8){
        balls.push(newBall(b.x,b.y,-b.vx||-3,b.vy,b.fire));
        balls.push(newBall(b.x,b.y,(b.vx||3)*0.6+1,b.vy,b.fire));
      }
    });
  }
  else if(type===&#x27;fire&#x27;){balls.forEach(function(b){b.fire=true;b.fireTimer=6;});}
}

function draw(){
  var sx=0,sy=0;
  if(shake&gt;0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake;}
  ctx.save();ctx.translate(sx,sy);
  // bg
  ctx.fillStyle=&#x27;#05010f&#x27;;ctx.fillRect(-10,-10,W+20,H+20);
  // nebulas
  for(var n=0;n&lt;nebulas.length;n++){
    var ne=nebulas[n];
    var g=ctx.createRadialGradient(ne.x,ne.y,0,ne.x,ne.y,ne.r);
    g.addColorStop(0,&#x27;hsla(&#x27;+ne.hue+&#x27;,80%,50%,0.18)&#x27;);
    g.addColorStop(1,&#x27;hsla(&#x27;+ne.hue+&#x27;,80%,50%,0)&#x27;);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ne.x,ne.y,ne.r,0,7);ctx.fill();
  }
  // stars
  for(var s=0;s&lt;stars.length;s++){var st=stars[s];ctx.globalAlpha=0.4+st.z*0.3;ctx.fillStyle=&#x27;#cfe9ff&#x27;;ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;

  // bricks
  for(var j=0;j&lt;bricks.length;j++){
    var br=bricks[j];
    var grad=ctx.createLinearGradient(br.x,br.y,br.x,br.y+br.h);
    grad.addColorStop(0,br.c[0]);grad.addColorStop(1,br.c[1]);
    ctx.fillStyle=grad;
    ctx.shadowColor=br.c[0];ctx.shadowBlur=br.flash&gt;0?18:8;
    roundRect(br.x,br.y,br.w,br.h,5);ctx.fill();
    ctx.shadowBlur=0;
    // cracks for damaged
    if(br.hp&lt;br.maxhp){
      ctx.strokeStyle=&#x27;rgba(0,0,0,0.5)&#x27;;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(br.x+br.w*0.3,br.y);ctx.lineTo(br.x+br.w*0.5,br.y+br.h);ctx.stroke();
      if(br.maxhp-br.hp&gt;1){ctx.beginPath();ctx.moveTo(br.x+br.w*0.7,br.y);ctx.lineTo(br.x+br.w*0.55,br.y+br.h);ctx.stroke();}
    }
    // point value
    ctx.fillStyle=&#x27;rgba(255,255,255,0.9)&#x27;;ctx.font=&#x27;bold 12px system-ui&#x27;;ctx.textAlign=&#x27;center&#x27;;ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(br.maxhp,br.x+br.w/2,br.y+br.h/2);
    if(br.flash&gt;0)br.flash-=0.08;
  }

  // powerups
  for(var p=0;p&lt;powerups.length;p++){
    var pu=powerups[p];
    ctx.save();ctx.translate(pu.x,pu.y);
    var col=pu.type===&#x27;wide&#x27;?&#x27;#ffd23f&#x27;:(pu.type===&#x27;multi&#x27;?&#x27;#00e5ff&#x27;:&#x27;#ff5a1f&#x27;);
    ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(0,0,pu.r,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#05010f&#x27;;ctx.font=&#x27;bold 13px system-ui&#x27;;ctx.textAlign=&#x27;center&#x27;;ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(pu.type===&#x27;wide&#x27;?&#x27;↔&#x27;:(pu.type===&#x27;multi&#x27;?&#x27;⊙&#x27;:&#x27;🔥&#x27;),0,1);
    ctx.restore();
  }

  // particles
  for(var k=0;k&lt;parts.length;k++){
    var pt=parts[k];ctx.globalAlpha=Math.max(0,pt.life);ctx.fillStyle=pt.color;
    ctx.beginPath();ctx.arc(pt.x,pt.y,3*pt.life+0.5,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // paddle
  var pg=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  pg.addColorStop(0,&#x27;#00e5ff&#x27;);pg.addColorStop(0.5,&#x27;#8affff&#x27;);pg.addColorStop(1,&#x27;#c400ff&#x27;);
  ctx.fillStyle=pg;ctx.shadowColor=&#x27;#00e5ff&#x27;;ctx.shadowBlur=16;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.shadowBlur=0;

  // balls
  for(var i=0;i&lt;balls.length;i++){
    var b=balls[i];
    var col=b.fire?&#x27;#ff6a1f&#x27;:&#x27;#8affff&#x27;;
    ctx.shadowColor=col;ctx.shadowBlur=18;
    var bg=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r);
    bg.addColorStop(0,&#x27;#ffffff&#x27;);bg.addColorStop(1,col);
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0;
  }

  ctx.restore();

  if(gameOver)drawGameOver();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

var goAnim=0;
function drawGameOver(){
  goAnim+=0.05;
  ctx.fillStyle=&#x27;rgba(5,1,15,0.82)&#x27;;ctx.fillRect(0,0,W,H);
  var scale=1+Math.sin(goAnim*2)*0.03;
  ctx.save();ctx.translate(W/2,H/2-40);ctx.scale(scale,scale);
  ctx.textAlign=&#x27;center&#x27;;
  var g=ctx.createLinearGradient(-150,0,150,0);
  g.addColorStop(0,&#x27;#00e5ff&#x27;);g.addColorStop(0.5,&#x27;#c400ff&#x27;);g.addColorStop(1,&#x27;#ff00a8&#x27;);
  ctx.fillStyle=g;ctx.font=&#x27;bold 46px system-ui&#x27;;ctx.fillText(&#x27;GAME OVER&#x27;,0,0);
  ctx.restore();
  ctx.fillStyle=&#x27;#eafaff&#x27;;ctx.font=&#x27;bold 26px system-ui&#x27;;ctx.textAlign=&#x27;center&#x27;;
  ctx.fillText(&#x27;Final Score: &#x27;+score,W/2,H/2+10);
  // stars
  var s= score&gt;=90?3:(score&gt;=45?2:1);
  var starStr=&#x27;&#x27;;
  for(var i=0;i&lt;3;i++)starStr+= i&lt;s?&#x27;★&#x27;:&#x27;☆&#x27;;
  ctx.font=&#x27;40px system-ui&#x27;;ctx.fillStyle=&#x27;#ffd23f&#x27;;
  ctx.fillText(starStr,W/2,H/2+62);
  ctx.font=&#x27;16px system-ui&#x27;;ctx.fillStyle=&#x27;#9fd6ff&#x27;;
  ctx.fillText(&#x27;Press Restart below to play again&#x27;,W/2,H/2+100);
}

function endGame(){
  if(gameOver)return;
  gameOver=true;running=false;goAnim=0;
  if(animId){cancelAnimationFrame(animId);animId=null;}
  beep(200,0.4,&#x27;sawtooth&#x27;,0.1);
  draw();
}

function loop(ts){
  if(!running)return;
  if(!lastT)lastT=ts;
  var dt=Math.min(0.05,(ts-lastT)/1000);lastT=ts;
  update(dt);draw();
  animId=requestAnimationFrame(loop);
}

function startGame(){
  if(running)return;
  setup();running=true;lastT=0;
  animId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
}

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;

        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

    } catch (_) {}

  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

    } catch (_) {}
  }

  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });

    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
