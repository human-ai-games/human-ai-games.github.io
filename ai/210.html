  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: linear-gradient(160deg, #1a1145 0%, #2b1a63 45%, #3a1f5c 100%); color: #fff; overflow: hidden; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;←/→&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, soft-drop with &lt;strong&gt;↓&lt;/strong&gt;, and slam down with &lt;strong&gt;Space&lt;/strong&gt;. Clear full rows for juicy points before the minute runs out — use the Start button below!&lt;/p&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;div class=&quot;field-wrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;ttl&quot;&gt;Game Over!&lt;/div&gt;
        &lt;div class=&quot;sc&quot; id=&quot;finalScore&quot;&gt;Score: 0&lt;/div&gt;
        &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;score-big&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Best&lt;/div&gt;&lt;div class=&quot;best&quot; id=&quot;best&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Time&lt;/div&gt;&lt;div class=&quot;best&quot; id=&quot;time&quot;&gt;60&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div id=&quot;nextBox&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 30, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var nextBox = document.getElementById(&#x27;nextBox&#x27;);
  field.style.width = (COLS*CELL)+&#x27;px&#x27;;
  field.style.height = (ROWS*CELL)+&#x27;px&#x27;;

  var SHAPES = {
    I: {cells:[[0,1],[1,1],[2,1],[3,1]], color:&#x27;#ff5d73&#x27;, fruit:&#x27;🍓&#x27;},
    O: {cells:[[1,0],[2,0],[1,1],[2,1]], color:&#x27;#ffcf3f&#x27;, fruit:&#x27;🍋&#x27;},
    T: {cells:[[1,0],[0,1],[1,1],[2,1]], color:&#x27;#b06bff&#x27;, fruit:&#x27;🍇&#x27;},
    S: {cells:[[1,0],[2,0],[0,1],[1,1]], color:&#x27;#4fd77a&#x27;, fruit:&#x27;🍉&#x27;},
    Z: {cells:[[0,0],[1,0],[1,1],[2,1]], color:&#x27;#ff8a3d&#x27;, fruit:&#x27;🍊&#x27;},
    J: {cells:[[0,0],[0,1],[1,1],[2,1]], color:&#x27;#5aa9ff&#x27;, fruit:&#x27;🫐&#x27;},
    L: {cells:[[2,0],[0,1],[1,1],[2,1]], color:&#x27;#ff6fb5&#x27;, fruit:&#x27;🍑&#x27;}
  };
  var TYPES = Object.keys(SHAPES);

  var grid, piece, nextType, score, best = 0, running = false;
  var dropId = null, timeId = null, dropMs = 550, timeLeft = 60;
  var scoreEl = document.getElementById(&#x27;score&#x27;),
      bestEl = document.getElementById(&#x27;best&#x27;),
      timeEl = document.getElementById(&#x27;time&#x27;),
      finalEl = document.getElementById(&#x27;finalScore&#x27;);

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function makePiece(type){
    var s = SHAPES[type];
    return { type:type, x:3, y:0, cells:s.cells.map(function(c){return [c[0],c[1]];}), color:s.color, fruit:s.fruit };
  }
  function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }
  function collides(p){
    var cs=absCells(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x, y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }
  function rotate(){
    if(!running||!piece||piece.type===&#x27;O&#x27;) return;
    // rotate around center of bounding box (4x4 for I, 3x3 others)
    var n = (piece.type===&#x27;I&#x27;) ? 4 : 3;
    var rc = piece.cells.map(function(c){ return [n-1-c[1], c[0]]; });
    var test = {x:piece.x,y:piece.y,cells:rc,type:piece.type,color:piece.color,fruit:piece.fruit};
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.x = piece.x + kicks[k];
      if(!collides(test)){ piece.cells=rc; piece.x=test.x; paint(); return; }
    }
  }
  function spawn(){
    var t = nextType || TYPES[Math.floor(Math.random()*TYPES.length)];
    piece = makePiece(t);
    nextType = TYPES[Math.floor(Math.random()*TYPES.length)];
    drawNext();
    if(collides(piece)){ endGame(); return false; }
    return true;
  }
  function lock(){
    absCells(piece).forEach(function(c){ if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS) grid[c.y][c.x]={color:piece.color,fruit:piece.fruit}; });
  }
  function clearRows(){
    var cleared=0;
    for(var r=ROWS-1;r&gt;=0;r--){
      var full=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;}
      if(full){ grid.splice(r,1); var e=[];for(var c2=0;c2&lt;COLS;c2++)e.push(null); grid.unshift(e); cleared++; r++; }
    }
    if(cleared&gt;0){
      var pts=[0,10,30,60,100][cleared];
      score+=pts; scoreEl.textContent=score;
      if(cleared&gt;=2){ flashEl.classList.remove(&#x27;go&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;go&#x27;); }
      updateSpeed();
    }
  }
  function updateSpeed(){
    var level = Math.floor(score/20);
    var ms = Math.max(120, 550 - level*40);
    if(ms!==dropMs){ dropMs=ms; if(dropId){clearInterval(dropId); dropId=setInterval(step,dropMs);} }
  }
  function ghostPos(){
    var g={x:piece.x,y:piece.y,cells:piece.cells,type:piece.type};
    while(!collides({x:g.x,y:g.y+1,cells:g.cells,type:g.type})) g.y++;
    return g;
  }
  function step(){
    if(!piece) return;
    var nx={x:piece.x,y:piece.y+1,cells:piece.cells,type:piece.type,color:piece.color,fruit:piece.fruit};
    if(collides(nx)){ lock(); clearRows(); if(!spawn()) return; }
    else piece.y++;
    paint();
  }
  function hardDrop(){
    if(!running||!piece) return;
    var g=ghostPos(); var dist=g.y-piece.y; piece.y=g.y;
    score+=dist*1; scoreEl.textContent=score;
    lock(); clearRows(); if(spawn()) paint();
  }
  function move(dx){
    if(!running||!piece) return;
    var nx={x:piece.x+dx,y:piece.y,cells:piece.cells,type:piece.type,color:piece.color,fruit:piece.fruit};
    if(!collides(nx)){ piece.x+=dx; paint(); }
  }
  function makeCell(x,y,color,fruit,size){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;;
    el.style.left=(x*size)+&#x27;px&#x27;; el.style.top=(y*size)+&#x27;px&#x27;;
    el.style.width=size+&#x27;px&#x27;; el.style.height=size+&#x27;px&#x27;;
    el.style.background=color; el.style.border=&#x27;2px solid rgba(0,0,0,.28)&#x27;;
    el.style.boxShadow=&#x27;inset 0 3px 4px rgba(255,255,255,.35)&#x27;;
    el.style.fontSize=(size*0.55)+&#x27;px&#x27;; el.textContent=fruit;
    return el;
  }
  function paint(){
    field.innerHTML=&#x27;&#x27;;
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++){
      if(grid[r][c]) field.appendChild(makeCell(c,r,grid[r][c].color,grid[r][c].fruit,CELL));
    }
    if(piece){
      var g=ghostPos();
      g.cells.forEach(function(cl){
        var y=g.y+cl[1]; if(y&gt;=0){ var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
          el.style.left=((g.x+cl[0])*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
          el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;; field.appendChild(el); }
      });
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) field.appendChild(makeCell(c.x,c.y,piece.color,piece.fruit,CELL)); });
    }
  }
  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;; if(!nextType) return;
    var s=SHAPES[nextType]; var sz=20;
    var xs=s.cells.map(function(c){return c[0];}), ys=s.cells.map(function(c){return c[1];});
    var minx=Math.min.apply(null,xs), maxx=Math.max.apply(null,xs);
    var miny=Math.min.apply(null,ys), maxy=Math.max.apply(null,ys);
    var w=(maxx-minx+1)*sz, h=(maxy-miny+1)*sz;
    var offx=(110-w)/2, offy=(96-h)/2;
    s.cells.forEach(function(c){
      var el=makeCell(0,0,s.color,s.fruit,sz);
      el.style.left=(offx+(c[0]-minx)*sz)+&#x27;px&#x27;; el.style.top=(offy+(c[1]-miny)*sz)+&#x27;px&#x27;;
      nextBox.appendChild(el);
    });
  }

  function tickTime(){
    timeLeft--; timeEl.textContent=timeLeft;
    if(timeLeft&lt;=0) endGame();
  }
  function endGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(timeId){clearInterval(timeId);timeId=null;}
    if(score&gt;best){best=score; bestEl.textContent=best;}
    finalEl.textContent=&#x27;Score: &#x27;+score+(score&gt;=best?&#x27;  🏆 Best!&#x27;:&#x27;&#x27;);
    overlay.classList.add(&#x27;show&#x27;);
    field.style.filter=&#x27;brightness(.5)&#x27;;
  }
  function startGame(){
    if(running) return;
    overlay.classList.remove(&#x27;show&#x27;); field.style.filter=&#x27;&#x27;;
    score=0; scoreEl.textContent=&#x27;0&#x27;; dropMs=550; timeLeft=60; timeEl.textContent=&#x27;60&#x27;;
    newGrid(); nextType=null; spawn(); paint();
    running=true;
    dropId=setInterval(step,dropMs);
    timeId=setInterval(tickTime,1000);
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(timeId){clearInterval(timeId);timeId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)step();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){rotate();e.preventDefault();}
    else if(e.key===&#x27; &#x27;){hardDrop();e.preventDefault();}
  });
  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
    if(e.data.type===&#x27;wd_start&#x27;)startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial preview
  newGrid(); nextType=TYPES[Math.floor(Math.random()*TYPES.length)];
  piece=makePiece(&#x27;T&#x27;); paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
