<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05060a; color: #e8f6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;
       color: #6ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f, 0 0 30px #05f; }
  .instructions { font-size: 16px; color: #9fb6c8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .score { font-size: 34px; font-weight: 800; color: #ffe36e;
           text-shadow: 0 0 10px #fb0, 0 0 22px #f80; }
  .legend { font-size: 14px; color: #9fb6c8; display:flex; gap:14px; }
  .legend span { white-space: nowrap; }
  #wrap { position: relative; }
  canvas { background: #060810; border-radius: 10px; box-shadow: 0 0 22px rgba(0,180,255,0.18), inset 0 0 40px rgba(0,60,120,0.25); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys (or swipe) to eat glowing items and grow — ⭐1pt, 💎3pts (vanishes fast), 🌈5pts (rare). Chain items quickly for a combo multiplier; walls glow red as a warning. Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;⭐ 1&lt;/span&gt;&lt;span&gt;💎 3&lt;/span&gt;&lt;span&gt;🌈 5&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div id=&quot;wrap&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 30, ROWS = 22;
  var W = COLS*CELL, H = ROWS*CELL;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);

  var running = false, gameOver = false, rafId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0;
  var items = [];       // {type,x,y,expires?}
  var particles = [];   // {x,y,vx,vy,life,max,color,size}
  var combo = 0, comboTimer = 0, comboShow = 0, comboMult = 1;
  var lastMove = 0, moveAcc = 0;
  var deathFlash = -1, deathTimer = 0;
  var t0 = 0, prev = 0;
  var glow = 0;

  // audio
  var AC = null;
  function beep(freq, dur, type, vol){
    try{
      if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq;
      g.gain.value=vol||0.08;
      o.connect(g); g.connect(AC.destination);
      var now=AC.currentTime; o.start(now);
      g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
      o.stop(now+dur);
    }catch(_){}
  }

  function moveInterval(){
    // starts leisurely (~150ms), challenging by score 15 (~70ms)
    var ms = 150 - Math.min(score,20)*4;
    return Math.max(60, ms);
  }

  function occupied(x,y){
    for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    return false;
  }
  function itemAt(x,y){
    for(var i=0;i&lt;items.length;i++) if(items[i].x===x&amp;&amp;items[i].y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)&amp;&amp;!itemAt(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }
  function spawnStar(){ var c=freeCell(); items.push({type:&#x27;star&#x27;,x:c.x,y:c.y}); }
  function spawnGem(){ var c=freeCell(); items.push({type:&#x27;gem&#x27;,x:c.x,y:c.y,expires:t0+5000}); }
  function spawnOrb(){ var c=freeCell(); items.push({type:&#x27;orb&#x27;,x:c.x,y:c.y}); }

  function hasType(tp){ for(var i=0;i&lt;items.length;i++) if(items[i].type===tp) return true; return false; }

  function ensureItems(){
    if(!hasType(&#x27;star&#x27;)) spawnStar();
    if(!hasType(&#x27;gem&#x27;) &amp;&amp; Math.random()&lt;0.02) spawnGem();
    if(!hasType(&#x27;orb&#x27;) &amp;&amp; Math.random()&lt;0.006) spawnOrb();
  }

  function burst(px,py,colors,n){
    for(var i=0;i&lt;n;i++){
      var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
      particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        life:0,max:24+Math.random()*20,color:colors[i%colors.length],size:2+Math.random()*3});
    }
  }

  function initSnake(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function startGame(){
    if(running) return;
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    gameOver=false; deathFlash=-1; deathTimer=0;
    items=[]; particles=[]; combo=0; comboTimer=0; comboShow=0; comboMult=1;
    initSnake();
    t0=0; prev=0; moveAcc=0;
    spawnStar(); spawnGem();
    running=true;
    prev=performance.now();
    rafId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }

  function endGame(){
    running=false;
    gameOver=true;
    deathFlash=snake.length-1; // flash from tail to head
    deathTimer=0;
    beep(120,0.4,&#x27;sawtooth&#x27;,0.12);
    // keep animating the death sequence
    prev=performance.now();
    rafId=requestAnimationFrame(loop);
  }

  function step(){
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ endGame(); return; }
    var ate=itemHitIndex(nx,ny);
    var body = ate&gt;=0 ? snake : snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ endGame(); return; }
    snake.unshift({x:nx,y:ny});
    if(ate&gt;=0){
      eatItem(ate,nx,ny);
    }else{
      snake.pop();
    }
  }

  function itemHitIndex(x,y){
    for(var i=0;i&lt;items.length;i++) if(items[i].x===x&amp;&amp;items[i].y===y) return i;
    return -1;
  }

  function eatItem(idx,cx,cy){
    var it=items[idx];
    var base = it.type===&#x27;star&#x27;?1: it.type===&#x27;gem&#x27;?3:5;
    // combo
    if(t0-comboTimer &lt; 1600) combo++; else combo=1;
    comboTimer=t0;
    comboMult=Math.min(1+Math.floor(combo/2),5);
    comboShow=t0;
    var gain=base*comboMult;
    score+=gain;
    scoreEl.textContent=score;
    var px=cx*CELL+CELL/2, py=cy*CELL+CELL/2;
    if(it.type===&#x27;star&#x27;){ burst(px,py,[&#x27;#ffe36e&#x27;,&#x27;#ffb300&#x27;,&#x27;#fff&#x27;],14); beep(660,0.12,&#x27;square&#x27;,0.08); }
    else if(it.type===&#x27;gem&#x27;){ burst(px,py,[&#x27;#ff4fd8&#x27;,&#x27;#ff9ff0&#x27;,&#x27;#fff&#x27;],20); beep(880,0.15,&#x27;triangle&#x27;,0.1); }
    else { burst(px,py,[&#x27;#ff5050&#x27;,&#x27;#50ff88&#x27;,&#x27;#5090ff&#x27;,&#x27;#ffe36e&#x27;,&#x27;#c060ff&#x27;],28); beep(990,0.2,&#x27;sine&#x27;,0.11); }
    items.splice(idx,1);
    // replace star / immediately allow more
    if(it.type===&#x27;star&#x27;) spawnStar();
  }

  function updateItems(){
    for(var i=items.length-1;i&gt;=0;i--){
      if(items[i].expires &amp;&amp; t0&gt;items[i].expires){
        items.splice(i,1);
      }
    }
    ensureItems();
  }

  function updateParticles(){
    for(var i=particles.length-1;i&gt;=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life++;
      if(p.life&gt;=p.max) particles.splice(i,1);
    }
  }

  function segColor(i,n){
    // head cyan -&gt; blue -&gt; violet toward tail
    var f=n&lt;=1?0:i/(n-1);
    var r,g,b;
    if(f&lt;0.5){ var t=f/0.5; r=Math.round(0+t*60); g=Math.round(255-t*130); b=255; }
    else{ var t2=(f-0.5)/0.5; r=Math.round(60+t2*130); g=Math.round(125-t2*90); b=Math.round(255-t2*70); }
    return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // dot grid
    ctx.fillStyle=&#x27;rgba(60,110,160,0.13)&#x27;;
    for(var gx=0;gx&lt;COLS;gx++) for(var gy=0;gy&lt;ROWS;gy++){
      ctx.beginPath(); ctx.arc(gx*CELL+CELL/2, gy*CELL+CELL/2, 1.1, 0, Math.PI*2); ctx.fill();
    }

    // wall warning
    var head=snake[0];
    if(head){
      var near = head.x&lt;=0||head.x&gt;=COLS-1||head.y&lt;=0||head.y&gt;=ROWS-1;
      if(near){
        var a=0.25+0.2*Math.sin(glow*0.3);
        ctx.strokeStyle=&#x27;rgba(255,40,40,&#x27;+a+&#x27;)&#x27;;
        ctx.lineWidth=6; ctx.shadowColor=&#x27;#f00&#x27;; ctx.shadowBlur=18;
        ctx.strokeRect(3,3,W-6,H-6);
        ctx.shadowBlur=0;
      }
    }

    // items
    for(var i=0;i&lt;items.length;i++) drawItem(items[i]);

    // snake
    var n=snake.length;
    for(var s=n-1;s&gt;=0;s--){
      var seg=snake[s];
      var cx=seg.x*CELL+CELL/2, cy=seg.y*CELL+CELL/2;
      var col=segColor(s,n);
      // death flash: segment flashes white when the wave reaches it
      var white=false;
      if(gameOver &amp;&amp; deathFlash&gt;=0){
        if(s&gt;deathFlash) continue; // scattered already (turned to particles)
        if(s&gt;=deathFlash-1) white=true;
      }
      ctx.beginPath();
      ctx.fillStyle= white? &#x27;#fff&#x27;: col;
      ctx.shadowColor= white? &#x27;#fff&#x27;: col; ctx.shadowBlur=12;
      var rad = s===0?9:7;
      ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      if(s===0){
        // white highlight on head
        ctx.beginPath(); ctx.fillStyle=&#x27;rgba(255,255,255,0.9)&#x27;;
        ctx.arc(cx-3,cy-3,2.6,0,Math.PI*2); ctx.fill();
      }
    }

    // particles
    for(var p=0;p&lt;particles.length;p++){
      var pt=particles[p];
      var al=1-pt.life/pt.max;
      ctx.globalAlpha=al;
      ctx.fillStyle=pt.color; ctx.shadowColor=pt.color; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;

    // combo popup
    if(comboMult&gt;1 &amp;&amp; t0-comboShow&lt;1000){
      var al2=1-(t0-comboShow)/1000;
      ctx.globalAlpha=al2;
      ctx.fillStyle=&#x27;#ffe36e&#x27;; ctx.shadowColor=&#x27;#f80&#x27;; ctx.shadowBlur=14;
      ctx.font=&#x27;bold 30px system-ui, sans-serif&#x27;;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;x&#x27;+comboMult+&#x27; COMBO!&#x27;, W/2, 46);
      ctx.globalAlpha=1; ctx.shadowBlur=0;
    }

    if(gameOver &amp;&amp; deathFlash&lt;0){
      ctx.fillStyle=&#x27;rgba(0,0,0,0.55)&#x27;; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=&#x27;#6ff&#x27;; ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=18;
      ctx.font=&#x27;bold 40px system-ui, sans-serif&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-6);
      ctx.font=&#x27;bold 22px system-ui, sans-serif&#x27;; ctx.fillStyle=&#x27;#ffe36e&#x27;;
      ctx.fillText(&#x27;Score &#x27;+score, W/2, H/2+30);
      ctx.shadowBlur=0;
    }
  }

  function drawItem(it){
    var cx=it.x*CELL+CELL/2, cy=it.y*CELL+CELL/2;
    if(it.type===&#x27;star&#x27;){
      ctx.save(); ctx.translate(cx,cy);
      ctx.fillStyle=&#x27;#ffe36e&#x27;; ctx.shadowColor=&#x27;#fb0&#x27;; ctx.shadowBlur=14;
      star5(0,0,8,3.6); ctx.fill(); ctx.restore();
    }else if(it.type===&#x27;gem&#x27;){
      var fl=0.55+0.45*Math.sin(glow*0.4);
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.PI/4);
      ctx.globalAlpha=fl;
      ctx.fillStyle=&#x27;#ff4fd8&#x27;; ctx.shadowColor=&#x27;#ff4fd8&#x27;; ctx.shadowBlur=16;
      ctx.fillRect(-7,-7,14,14);
      ctx.globalAlpha=1; ctx.restore();
    }else{
      // rotating rainbow orb
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(glow*0.08);
      var cols=[&#x27;#ff5050&#x27;,&#x27;#ffb000&#x27;,&#x27;#ffe36e&#x27;,&#x27;#50ff88&#x27;,&#x27;#50c8ff&#x27;,&#x27;#c060ff&#x27;];
      ctx.shadowColor=&#x27;#fff&#x27;; ctx.shadowBlur=16;
      for(var k=0;k&lt;cols.length;k++){
        ctx.fillStyle=cols[k];
        var a=k/cols.length*Math.PI*2;
        ctx.beginPath(); ctx.arc(Math.cos(a)*3.5,Math.sin(a)*3.5,4.5,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }

  function star5(x,y,outer,inner){
    ctx.beginPath();
    for(var i=0;i&lt;10;i++){
      var r=i%2===0?outer:inner;
      var a=Math.PI/5*i - Math.PI/2;
      var px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function loop(now){
    var dt=now-prev; prev=now;
    t0+=dt; glow+=dt*0.02;

    if(running &amp;&amp; !gameOver){
      moveAcc+=dt;
      var mi=moveInterval();
      while(moveAcc&gt;=mi){ step(); moveAcc-=mi; if(gameOver) break; }
      updateItems();
    }

    // death scatter animation
    if(gameOver &amp;&amp; deathFlash&gt;=0){
      deathTimer+=dt;
      if(deathTimer&gt;=55){
        deathTimer=0;
        var s=snake[deathFlash];
        if(s){
          var px=s.x*CELL+CELL/2, py=s.y*CELL+CELL/2;
          burst(px,py,[&#x27;#fff&#x27;,&#x27;#6ff&#x27;,&#x27;#5090ff&#x27;,&#x27;#c060ff&#x27;],10);
          beep(200+deathFlash*10,0.08,&#x27;square&#x27;,0.05);
        }
        deathFlash--;
      }
    }

    updateParticles();
    draw();

    if(running || (gameOver &amp;&amp; (deathFlash&gt;=0 || particles.length&gt;0))){
      rafId=requestAnimationFrame(loop);
    }else{
      rafId=null;
    }
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
  });

  // swipe
  var tsx=0,tsy=0;
  cv.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
  cv.addEventListener(&#x27;touchend&#x27;,function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) setDir(dx&gt;0?1:-1,0); else setDir(0,dy&gt;0?1:-1);
  },{passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    }, true);
  });

  // initial paint (stopped)
  initSnake();
  spawnStar();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,

<script>
