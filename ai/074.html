&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC DEFENDER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your neon ship with the ← → arrow keys or by dragging the mouse, and bounce the plasma orb to blast asteroids for points. Don&#x27;t let asteroids slip past the bottom — you lose a life for each one that escapes!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Lives: &lt;span class=&quot;lives&quot; id=&quot;lives&quot;&gt;♥♥♥&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Time: &lt;span id=&quot;timer&quot;&gt;60&lt;/span&gt;&lt;/span&gt;
    &lt;span id=&quot;mult&quot; style=&quot;color:#ff5;&quot;&gt;x1&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var scoreEl = document.getElementById(&#x27;score&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;),
    timerEl = document.getElementById(&#x27;timer&#x27;), multEl = document.getElementById(&#x27;mult&#x27;);

var PADDLE_W = 100, PADDLE_H = 14, PADDLE_BOTTOM = 22, PADDLE_SPEED = 8;
var BALL_R = 8;

var running = false, animId = null, lastT = 0, over = false;
var keysDown = {};
var paddleX, ballX, ballY, ballVX, ballVY, ballSpeed;
var score, lives, timeLeft, streak, mult, level;
var asteroids = [], particles = [], trail = [], stars = [];
var shake = 0, flash = 0, spawnTimer = 0;
var bannerT = 0;

// background palette by level
var palettes = [
  [&#x27;#05060f&#x27;,&#x27;#0a1030&#x27;], [&#x27;#0a0518&#x27;,&#x27;#301040&#x27;], [&#x27;#04101a&#x27;,&#x27;#0a3050&#x27;],
  [&#x27;#12040f&#x27;,&#x27;#401030&#x27;], [&#x27;#04120a&#x27;,&#x27;#104030&#x27;], [&#x27;#1a1204&#x27;,&#x27;#403010&#x27;]
];

function initStars(){
  stars = [];
  for(var i=0;i&lt;70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,s:Math.random()*.4+.1});
}

function reset(){
  paddleX = (W-PADDLE_W)/2;
  score=0; lives=3; timeLeft=60; streak=0; mult=1; level=0;
  ballSpeed=5;
  ballX=W/2; ballY=H-PADDLE_BOTTOM-PADDLE_H-30; ballVX=(Math.random()&lt;.5?-1:1)*3; ballVY=-ballSpeed;
  asteroids=[]; particles=[]; trail=[]; spawnTimer=0; shake=0; flash=0; over=false; bannerT=0;
  for(var k in keysDown) keysDown[k]=false;
  initStars();
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent=score;
  var h=&#x27;&#x27;; for(var i=0;i&lt;lives;i++) h+=&#x27;♥&#x27;; for(var j=lives;j&lt;3;j++) h+=&#x27;♡&#x27;;
  livesEl.textContent=h||&#x27;♡♡♡&#x27;;
  timerEl.textContent=Math.max(0,Math.ceil(timeLeft));
  timerEl.className = timeLeft&lt;=10 ? &#x27;low&#x27; : &#x27;&#x27;;
  multEl.textContent=&#x27;x&#x27;+mult;
  multEl.style.color = mult&gt;=3?&#x27;#f6f&#x27;:mult&gt;=2?&#x27;#fa4&#x27;:&#x27;#ff5&#x27;;
}

function spawnAsteroid(){
  var sz = Math.random(); // 0..1
  var type, r, pts;
  if(sz&lt;0.33){ type=&#x27;small&#x27;; r=13; pts=3; }
  else if(sz&lt;0.66){ type=&#x27;med&#x27;; r=20; pts=2; }
  else { type=&#x27;large&#x27;; r=30; pts=1; }
  var x = r + Math.random()*(W-2*r);
  var speed = 0.9 + level*0.18 + Math.random()*0.6;
  var ang = (Math.random()-0.5)*0.7;
  asteroids.push({x:x,y:-r,r:r,vx:Math.sin(ang)*speed,vy:Math.cos(ang)*speed+0.6,
                  pts:pts,rot:Math.random()*6,vr:(Math.random()-.5)*0.05,
                  color:type===&#x27;small&#x27;?&#x27;#8ff&#x27;:type===&#x27;med&#x27;?&#x27;#caf&#x27;:&#x27;#f9c&#x27;});
}

function burst(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
  }
}

function loseLife(){
  lives--; streak=0; mult=1; shake=10; flash=0.5;
  if(lives&lt;=0){ lives=0; endGame(); }
  updateHUD();
}

function endGame(){
  over=true; bannerT=0;
}

function levelCheck(){
  var nl=Math.floor(score/10);
  if(nl&gt;level){ level=nl; ballSpeed+=0.4; flash=0.35; }
}

function tick(ts){
  if(!running) return;
  var dt = lastT? Math.min(50, ts-lastT):16; lastT=ts;
  var f = dt/16.67;

  if(!over){
    // paddle
    if(keysDown[&#x27;ArrowLeft&#x27;]) paddleX-=PADDLE_SPEED*f;
    if(keysDown[&#x27;ArrowRight&#x27;]) paddleX+=PADDLE_SPEED*f;
    paddleX=Math.max(0,Math.min(W-PADDLE_W,paddleX));

    // timer
    timeLeft-=dt/1000;
    if(timeLeft&lt;=0){ timeLeft=0; endGame(); }

    // spawn
    spawnTimer-=dt;
    if(spawnTimer&lt;=0){ spawnAsteroid(); spawnTimer = Math.max(500, 1300 - level*60); }

    // ball
    ballX+=ballVX*f; ballY+=ballVY*f;
    trail.push({x:ballX,y:ballY,life:1});
    if(trail.length&gt;16) trail.shift();

    if(ballX&lt;=BALL_R){ ballX=BALL_R; ballVX=Math.abs(ballVX); }
    if(ballX&gt;=W-BALL_R){ ballX=W-BALL_R; ballVX=-Math.abs(ballVX); }
    if(ballY&lt;=BALL_R){ ballY=BALL_R; ballVY=Math.abs(ballVY); }

    // paddle collision
    var pTop=H-PADDLE_BOTTOM-PADDLE_H;
    if(ballVY&gt;0 &amp;&amp; ballY+BALL_R&gt;=pTop &amp;&amp; ballY+BALL_R&lt;=pTop+PADDLE_H+8 &amp;&amp;
       ballX+BALL_R&gt;=paddleX &amp;&amp; ballX-BALL_R&lt;=paddleX+PADDLE_W){
      var hit=(ballX-(paddleX+PADDLE_W/2))/(PADDLE_W/2); // -1..1
      var sp=ballSpeed;
      ballVX = hit*sp*0.9;
      ballVY = -Math.sqrt(Math.max(1,sp*sp - ballVX*ballVX));
      ballY=pTop-BALL_R;
      burst(ballX,ballY,&#x27;#4ff&#x27;,6);
    }
    // ball fell off bottom -&gt; just respawn from paddle (no penalty)
    if(ballY&gt;H+30){
      ballX=paddleX+PADDLE_W/2; ballY=pTop-BALL_R-2; ballVX=(Math.random()&lt;.5?-1:1)*3; ballVY=-ballSpeed;
      trail=[];
    }

    // asteroids
    for(var i=asteroids.length-1;i&gt;=0;i--){
      var a=asteroids[i];
      a.x+=a.vx*f; a.y+=a.vy*f; a.rot+=a.vr*f;
      if(a.x&lt;a.r){a.x=a.r;a.vx=Math.abs(a.vx);}
      if(a.x&gt;W-a.r){a.x=W-a.r;a.vx=-Math.abs(a.vx);}
      // ball hit?
      var dx=a.x-ballX, dy=a.y-ballY, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist&lt;a.r+BALL_R){
        streak++;
        mult = streak&gt;=8?3:streak&gt;=4?2:1;
        var gained=a.pts*mult;
        score+=gained;
        burst(a.x,a.y,a.color,14+a.r);
        // bounce ball off asteroid
        var nx=dx/dist, ny=dy/dist;
        ballVX=-nx*ballSpeed; ballVY=-ny*ballSpeed;
        if(a.pts*mult&gt;=6){ shake=8; flash=0.3; }
        asteroids.splice(i,1);
        levelCheck();
        updateHUD();
        continue;
      }
      // escaped bottom
      if(a.y-a.r&gt;H){ asteroids.splice(i,1); loseLife(); }
    }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx*f; pt.y+=pt.vy*f; pt.vy+=0.06*f; pt.life-=0.02*f;
    if(pt.life&lt;=0) particles.splice(p,1);
  }
  for(var t=0;t&lt;trail.length;t++) trail[t].life-=0.06*f;

  if(shake&gt;0) shake-=0.6*f; if(shake&lt;0) shake=0;
  if(flash&gt;0) flash-=0.03*f; if(flash&lt;0) flash=0;

  if(over) bannerT+=dt;

  draw();
  animId=requestAnimationFrame(tick);
}

function draw(){
  ctx.save();
  var sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
  ctx.translate(sx,sy);

  // background gradient
  var pal=palettes[level%palettes.length];
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,pal[0]); g.addColorStop(1,pal[1]);
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

  // stars
  ctx.fillStyle=&#x27;rgba(255,255,255,.7)&#x27;;
  for(var i=0;i&lt;stars.length;i++){
    var st=stars[i]; st.y+=st.s; if(st.y&gt;H) st.y=0;
    ctx.globalAlpha=0.4+st.r/2;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // trail
  for(var t=0;t&lt;trail.length;t++){
    var tr=trail[t]; if(tr.life&lt;=0) continue;
    ctx.globalAlpha=tr.life*0.5;
    ctx.fillStyle=&#x27;#6ef&#x27;;
    ctx.beginPath(); ctx.arc(tr.x,tr.y,BALL_R*tr.life,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // asteroids
  for(var a=0;a&lt;asteroids.length;a++){
    var ast=asteroids[a];
    ctx.save();
    ctx.translate(ast.x,ast.y); ctx.rotate(ast.rot);
    ctx.shadowBlur=12; ctx.shadowColor=ast.color;
    ctx.fillStyle=&#x27;#223&#x27;;
    ctx.strokeStyle=ast.color; ctx.lineWidth=2.5;
    ctx.beginPath();
    var pts=8;
    for(var k=0;k&lt;pts;k++){
      var ang=k/pts*Math.PI*2;
      var rr=ast.r*(0.8+0.2*Math.sin(k*2.3));
      var px=Math.cos(ang)*rr, py=Math.sin(ang)*rr;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur=0;

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,2.5*pt.life+0.5,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ball
  ctx.shadowBlur=18; ctx.shadowColor=&#x27;#4ff&#x27;;
  var bg=ctx.createRadialGradient(ballX,ballY,1,ballX,ballY,BALL_R);
  bg.addColorStop(0,&#x27;#fff&#x27;); bg.addColorStop(0.5,&#x27;#6ef&#x27;); bg.addColorStop(1,&#x27;#08a&#x27;);
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(ballX,ballY,BALL_R,0,7); ctx.fill();
  ctx.shadowBlur=0;

  // paddle (ship)
  var pTop=H-PADDLE_BOTTOM-PADDLE_H;
  ctx.shadowBlur=16; ctx.shadowColor=&#x27;#4af&#x27;;
  var pg=ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
  pg.addColorStop(0,&#x27;#08f&#x27;); pg.addColorStop(.5,&#x27;#6ff&#x27;); pg.addColorStop(1,&#x27;#08f&#x27;);
  ctx.fillStyle=pg;
  ctx.beginPath();
  ctx.moveTo(paddleX, pTop+PADDLE_H);
  ctx.lineTo(paddleX+16, pTop);
  ctx.lineTo(paddleX+PADDLE_W-16, pTop);
  ctx.lineTo(paddleX+PADDLE_W, pTop+PADDLE_H);
  ctx.closePath(); ctx.fill();
  // cockpit
  ctx.fillStyle=&#x27;#fff&#x27;;
  ctx.beginPath(); ctx.arc(paddleX+PADDLE_W/2, pTop+PADDLE_H-4, 5, Math.PI,0); ctx.fill();
  ctx.shadowBlur=0;

  ctx.restore();

  // flash overlay
  if(flash&gt;0){ ctx.fillStyle=&#x27;rgba(255,255,255,&#x27;+Math.min(0.6,flash)+&#x27;)&#x27;; ctx.fillRect(0,0,W,H); }

  // multiplier ribbon
  if(mult&gt;1 &amp;&amp; !over){
    ctx.save();
    ctx.globalAlpha=0.9;
    ctx.fillStyle=mult&gt;=3?&#x27;rgba(255,80,255,.85)&#x27;:&#x27;rgba(255,160,40,.85)&#x27;;
    ctx.fillRect(0,60,W,26);
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.font=&#x27;bold 16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;🔥 HOT STREAK x&#x27;+mult+&#x27; — &#x27;+streak+&#x27; hits!&#x27;, W/2, 78);
    ctx.restore();
  }

  // game over banner
  if(over){
    ctx.fillStyle=&#x27;rgba(0,0,10,.7)&#x27;; ctx.fillRect(0,0,W,H);
    var scale=Math.min(1, bannerT/400);
    var es=1+ (1-scale)*1.5; // zoom in
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.scale(es,es);
    ctx.globalAlpha=scale;
    ctx.textAlign=&#x27;center&#x27;;
    ctx.fillStyle=&#x27;#4ff&#x27;; ctx.shadowBlur=20; ctx.shadowColor=&#x27;#4ff&#x27;;
    ctx.font=&#x27;bold 36px system-ui&#x27;;
    ctx.fillText(lives&lt;=0?&#x27;SHIP DESTROYED&#x27;:&#x27;TIME UP!&#x27;, 0,-30);
    ctx.fillStyle=&#x27;#ff5&#x27;; ctx.shadowColor=&#x27;#ff5&#x27;;
    ctx.font=&#x27;bold 48px system-ui&#x27;;
    ctx.fillText(&#x27;SCORE &#x27;+score, 0,30);
    ctx.shadowBlur=0; ctx.globalAlpha=scale;
    ctx.fillStyle=&#x27;#9fc&#x27;; ctx.font=&#x27;16px system-ui&#x27;;
    ctx.fillText(&#x27;Press Start below for one more try!&#x27;, 0,70);
    ctx.restore();
  }
}

function startGame(){
  if(running) return;
  reset(); running=true; lastT=0;
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

// input
window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keysDown[e.key]=true; e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keysDown[e.key]=false;
});
function pointerMove(clientX){
  var rect=cv.getBoundingClientRect();
  var x=(clientX-rect.left)*(W/rect.width);
  paddleX=Math.max(0,Math.min(W-PADDLE_W, x-PADDLE_W/2));
}
var dragging=false;
cv.addEventListener(&#x27;mousedown&#x27;,function(e){ dragging=true; pointerMove(e.clientX); });
window.addEventListener(&#x27;mousemove&#x27;,function(e){ if(dragging) pointerMove(e.clientX); });
window.addEventListener(&#x27;mouseup&#x27;,function(){ dragging=false; });
cv.addEventListener(&#x27;touchstart&#x27;,function(e){ if(e.touches[0]) pointerMove(e.touches[0].clientX); },{passive:true});
cv.addEventListener(&#x27;touchmove&#x27;,function(e){ if(e.touches[0]){ pointerMove(e.touches[0].clientX); e.preventDefault(); } },{passive:false});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static view
reset(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);

<script>
