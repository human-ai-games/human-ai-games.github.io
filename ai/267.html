<body>
<div class="wrap">

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: linear-gradient(160deg,#ffe9c7,#ffd6e8); color: #4a2f1a; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; color:#d84315; text-shadow:1px 1px 0 #fff3; letter-spacing:.5px; }
  .instructions { font-size: 16px; color: #6d4c2f; max-width: 640px; margin: 0; line-height: 1.35; text-align: center; }
  .main { display:flex; gap:16px; align-items:flex-start; }
  .field-wrap { position:relative; }
  .field { position: relative; width: 240px; height: 480px; background: repeating-linear-gradient(90deg,#c68642 0 20px,#b5763a 20px 24px); border:6px solid #8a5a2b; border-radius:8px; overflow:hidden; box-shadow: inset 0 0 20px #0004, 0 6px 14px #0003; }
  .cell { position:absolute; box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:18px; border-radius:5px; }
  .ghost { opacity:.28; }
  .panel { display:flex; flex-direction:column; gap:8px; width:120px; }
  .box { background:#fff8ee; border:3px solid #8a5a2b; border-radius:8px; padding:6px 8px; box-shadow:0 3px 8px #0002; }
  .box .label { font-size:12px; font-weight:700; text-transform:uppercase; color:#a15a1e; letter-spacing:.5px; }
  .box .val { font-size:22px; font-weight:800; color:#3a220f; }
  .next-grid { position:relative; width:96px; height:72px; margin-top:2px; }
  .combo { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(0); font-size:44px; font-weight:900; color:#ff3d7f; text-shadow:2px 2px 0 #fff,0 0 18px #ffo; pointer-events:none; z-index:5; }
  .combo.show { animation: pop .9s ease; }
  @keyframes pop { 0%{transform:translate(-50%,-50%) scale(0);opacity:0;} 30%{transform:translate(-50%,-50%) scale(1.4);opacity:1;} 60%{transform:translate(-50%,-50%) scale(1);} 100%{transform:translate(-50%,-55%) scale(1);opacity:0;} }
  .field-wrap.shimmer .field { animation: shimmer .8s ease; }
  @keyframes shimmer { 0%{filter:hue-rotate(0deg) brightness(1);} 50%{filter:hue-rotate(280deg) brightness(1.5);} 100%{filter:hue-rotate(0deg) brightness(1);} }
  .particle { position:absolute; width:8px; height:8px; border-radius:2px; pointer-events:none; z-index:6; }
  .banner { position:absolute; top:50%; left:50%; transform:translate(-150%,-50%); background:#fff; border:5px solid #d84315; border-radius:14px; padding:18px 22px; text-align:center; box-shadow:0 8px 24px #0005; z-index:10; transition:transform .5s cubic-bezier(.2,1.4,.4,1); }
  .banner.show { transform:translate(-50%,-50%); }
  .banner h2 { margin:0 0 6px; font-size:26px; color:#d84315; }
  .banner p { margin:0; font-size:18px; font-weight:700; }
  .banner.hidden { display:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop Frenzy 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with ← →, rotate with ↑, soft-drop with ↓, and slam it down with the Spacebar. Fill full rows to burst them for points — use the Start/Restart button below!&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field-wrap&quot; id=&quot;fieldWrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;banner hidden&quot; id=&quot;banner&quot;&gt;
        &lt;h2&gt;🏪 Market Closed!&lt;/h2&gt;
        &lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;label&quot;&gt;High&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;high&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;box&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div class=&quot;next-grid&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var nextEl = document.getElementById(&#x27;next&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), highEl = document.getElementById(&#x27;high&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
  var bannerEl = document.getElementById(&#x27;banner&#x27;), finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var fieldWrap = document.getElementById(&#x27;fieldWrap&#x27;);

  // Fruit types matching the 7 tetrominoes
  var FRUITS = {
    I: { emoji:&#x27;🍌&#x27;, color:&#x27;#ffe066&#x27; },
    O: { emoji:&#x27;🍊&#x27;, color:&#x27;#ff9f1c&#x27; },
    T: { emoji:&#x27;🍇&#x27;, color:&#x27;#9b5de5&#x27; },
    S: { emoji:&#x27;🍏&#x27;, color:&#x27;#8ac926&#x27; },
    Z: { emoji:&#x27;🍎&#x27;, color:&#x27;#ff4d4d&#x27; },
    J: { emoji:&#x27;🫐&#x27;, color:&#x27;#4d96ff&#x27; },
    L: { emoji:&#x27;🍓&#x27;, color:&#x27;#ff5d8f&#x27; }
  };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;J&#x27;,&#x27;L&#x27;];

  var grid, piece, nextType, score, high = 0, level, dropMs, running = false, dropId = null;
  var lastLevelPoints = 0;

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }
  function randType(){ return TYPES[Math.floor(Math.random()*TYPES.length)]; }

  function makePiece(type){
    var cells = SHAPES[type].map(function(p){return {x:p[0],y:p[1]};});
    return { type:type, x:3, y:0, cells:cells };
  }

  function rotated(p){
    // rotate around a 3x3-ish center; use bounding box
    var nc = p.cells.map(function(c){ return { x: c.y, y: -c.x }; });
    // normalize to keep min at 0
    var minx=Infinity,miny=Infinity;
    nc.forEach(function(c){ if(c.x&lt;minx)minx=c.x; if(c.y&lt;miny)miny=c.y; });
    nc.forEach(function(c){ c.x-=minx; c.y-=miny; });
    return { type:p.type, x:p.x, y:p.y, cells:nc };
  }

  function absCells(p){ return p.cells.map(function(c){ return {x:p.x+c.x, y:p.y+c.y}; }); }

  function collides(p){
    var cs = absCells(p);
    for (var i=0;i&lt;cs.length;i++){
      var cx=cs[i].x, cy=cs[i].y;
      if (cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if (cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece(){
    piece = makePiece(nextType || randType());
    nextType = randType();
    drawNext();
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece(){
    absCells(piece).forEach(function(c){
      if (c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]=piece.type;
    });
  }

  function ghostPiece(){
    var g = { type:piece.type, x:piece.x, y:piece.y, cells:piece.cells };
    while(!collides({type:g.type,x:g.x,y:g.y+1,cells:g.cells})) g.y++;
    return g;
  }

  function clearFullRows(){
    var fullRows = [];
    for (var r=0;r&lt;ROWS;r++){
      var full=true;
      for (var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;}
      if (full) fullRows.push(r);
    }
    if (fullRows.length===0) return;
    // particle burst
    fullRows.forEach(function(r){ burstRow(r); });
    fullRows.forEach(function(r){
      grid.splice(r,1);
      var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
      grid.unshift(empty);
    });
    var n = fullRows.length;
    var pts = [0,1,3,5,8][n];
    score += pts;
    scoreEl.textContent = score;
    if (score&gt;high){ high=score; highEl.textContent=high; }
    if (n&gt;=2) comboSplash(n);
    // level up every 10 points
    if (score - lastLevelPoints &gt;= 10){
      lastLevelPoints = Math.floor(score/10)*10;
      level = 1 + Math.floor(score/10);
      levelEl.textContent = level;
      dropMs = Math.max(120, 500 - (level-1)*40);
      if (running){ clearInterval(dropId); dropId=setInterval(stepDown,dropMs); }
    }
  }

  function comboSplash(n){
    comboEl.textContent = &#x27;×&#x27;+n+&#x27;!&#x27;;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
    fieldWrap.classList.remove(&#x27;shimmer&#x27;); void fieldWrap.offsetWidth; fieldWrap.classList.add(&#x27;shimmer&#x27;);
    beep(660+n*80);
  }

  function burstRow(r){
    var colors=[&#x27;#ff4d4d&#x27;,&#x27;#ffe066&#x27;,&#x27;#8ac926&#x27;,&#x27;#9b5de5&#x27;,&#x27;#4d96ff&#x27;,&#x27;#ff5d8f&#x27;,&#x27;#ff9f1c&#x27;];
    for (var c=0;c&lt;COLS;c++){
      for (var k=0;k&lt;3;k++){
        var p=document.createElement(&#x27;div&#x27;);
        p.className=&#x27;particle&#x27;;
        p.style.background=colors[(c+k)%colors.length];
        var px=c*CELL+CELL/2, py=r*CELL+CELL/2;
        p.style.left=px+&#x27;px&#x27;; p.style.top=py+&#x27;px&#x27;;
        field.appendChild(p);
        var ang=Math.random()*Math.PI*2, sp=1.5+Math.random()*3;
        (function(el,vx,vy){
          var x=px,y=py,life=0;
          var id=setInterval(function(){
            life++; vy+=0.35; x+=vx; y+=vy;
            el.style.left=x+&#x27;px&#x27;; el.style.top=y+&#x27;px&#x27;;
            el.style.opacity=Math.max(0,1-life/22);
            if(life&gt;22){clearInterval(id); if(el.parentNode)el.parentNode.removeChild(el);}
          },16);
        })(p,Math.cos(ang)*sp,Math.sin(ang)*sp-2);
      }
    }
    beep(520);
  }

  function drawCell(container, cx, cy, type, ghost){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;cell&#x27;+(ghost?&#x27; ghost&#x27;:&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=FRUITS[type].color;
    el.textContent=FRUITS[type].emoji;
    el.style.boxShadow=&#x27;inset 0 0 4px #0003&#x27;;
    container.appendChild(el);
  }

  function paint(){
    field.querySelectorAll(&#x27;.cell&#x27;).forEach(function(e){e.remove();});
    for (var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]) drawCell(field,c,r,grid[r][c],false);
    if (piece){
      var g=ghostPiece();
      absCells(g).forEach(function(c){ if(c.y&gt;=0) drawCell(field,c.x,c.y,piece.type,true); });
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) drawCell(field,c.x,c.y,piece.type,false); });
    }
  }

  function drawNext(){
    nextEl.querySelectorAll(&#x27;.cell&#x27;).forEach(function(e){e.remove();});
    if (!nextType) return;
    var cells=SHAPES[nextType];
    var minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
    cells.forEach(function(p){ if(p[0]&lt;minx)minx=p[0]; if(p[0]&gt;maxx)maxx=p[0]; if(p[1]&lt;miny)miny=p[1]; if(p[1]&gt;maxy)maxy=p[1]; });
    var w=(maxx-minx+1), h=(maxy-miny+1);
    var cs=18;
    var ox=(96-w*cs)/2, oy=(72-h*cs)/2;
    cells.forEach(function(p){
      var el=document.createElement(&#x27;div&#x27;);
      el.className=&#x27;cell&#x27;;
      el.style.left=(ox+(p[0]-minx)*cs)+&#x27;px&#x27;; el.style.top=(oy+(p[1]-miny)*cs)+&#x27;px&#x27;;
      el.style.width=cs+&#x27;px&#x27;; el.style.height=cs+&#x27;px&#x27;;
      el.style.fontSize=&#x27;13px&#x27;;
      el.style.background=FRUITS[nextType].color;
      el.textContent=FRUITS[nextType].emoji;
      nextEl.appendChild(el);
    });
  }

  function stepDown(){
    if (!piece) return;
    var next={type:piece.type,x:piece.x,y:piece.y+1,cells:piece.cells};
    if (collides(next)){
      lockPiece(); clearFullRows();
      if (!spawnPiece()){ endGame(); return; }
    } else piece=next;
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    var next={type:piece.type,x:piece.x+dx,y:piece.y,cells:piece.cells};
    if(!collides(next)){piece=next;paint();}
  }
  function rotate(){
    if(!running||!piece) return;
    var r=rotated(piece);
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var i=0;i&lt;kicks.length;i++){
      var t={type:r.type,x:r.x+kicks[i],y:r.y,cells:r.cells};
      if(!collides(t)){piece=t;paint();beep(440);return;}
    }
  }
  function hardDrop(){
    if(!running||!piece) return;
    while(!collides({type:piece.type,x:piece.x,y:piece.y+1,cells:piece.cells})) piece.y++;
    beep(300);
    stepDown();
  }

  // audio
  var actx=null;
  function beep(freq){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=freq; o.type=&#x27;triangle&#x27;;
      g.gain.value=0.06; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.12);
      o.stop(actx.currentTime+0.13);
    }catch(_){}
  }

  function endGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    paint();
    finalScoreEl.textContent=&#x27;Score: &#x27;+score+&#x27;   ·   High: &#x27;+high;
    bannerEl.classList.remove(&#x27;hidden&#x27;);
    void bannerEl.offsetWidth;
    bannerEl.classList.add(&#x27;show&#x27;);
    beep(200);
  }

  function startGame(){
    if(running) return;
    score=0; level=1; lastLevelPoints=0; dropMs=500;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    bannerEl.classList.remove(&#x27;show&#x27;); bannerEl.classList.add(&#x27;hidden&#x27;);
    newGrid();
    nextType=randType();
    if(!spawnPiece()) return;
    paint();
    running=true;
    if(dropId) clearInterval(dropId);
    dropId=setInterval(stepDown,dropMs);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){move(-1);e.preventDefault();}
    else if(e.key===&#x27;ArrowRight&#x27;){move(1);e.preventDefault();}
    else if(e.key===&#x27;ArrowDown&#x27;){if(running)stepDown();e.preventDefault();}
    else if(e.key===&#x27;ArrowUp&#x27;){rotate();e.preventDefault();}
    else if(e.key===&#x27; &#x27;){hardDrop();e.preventDefault();}
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // telemetry
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial preview
  newGrid();
  nextType=&#x27;S&#x27;;
  piece=makePiece(&#x27;T&#x27;); piece.x=3; piece.y=2;
  drawNext();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
