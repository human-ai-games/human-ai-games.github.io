&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }

  @keyframes combo { 0%{opacity:0; transform:translate(-50%,-50%) scale(.2);} 20%{opacity:1; transform:translate(-50%,-50%) scale(1.2);} 60%{opacity:1; transform:translate(-50%,-50%) scale(1);} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.4);} }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 FRUIT DROP 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;←/→&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, soft-drop with &lt;strong&gt;↓&lt;/strong&gt;, hard-drop with &lt;strong&gt;space&lt;/strong&gt;. On touch: swipe to move, swipe down to drop, tap to rotate — clear rows for points!&lt;/p&gt;
  &lt;div class=&quot;bar&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;Score &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;stat hi&quot;&gt;Best &lt;b id=&quot;hi&quot;&gt;0&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;Level &lt;span id=&quot;levelBadge&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var CELL = 26, COLS = 10, ROWS = 20;
var field = document.getElementById(&#x27;field&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var hiEl = document.getElementById(&#x27;hi&#x27;);
var levelBadge = document.getElementById(&#x27;levelBadge&#x27;);

// stars
for (var i=0;i&lt;40;i++){ var s=document.createElement(&#x27;div&#x27;); s.className=&#x27;star&#x27;; s.style.left=Math.random()*100+&#x27;%&#x27;; s.style.top=Math.random()*100+&#x27;%&#x27;; s.style.opacity=(0.2+Math.random()*0.5); field.appendChild(s); }

var FRUITS = {
  I: {emoji:&#x27;🍉&#x27;, color:&#x27;#4ff0ff&#x27;},
  O: {emoji:&#x27;🍋&#x27;, color:&#x27;#f9ff4f&#x27;},
  T: {emoji:&#x27;🍇&#x27;, color:&#x27;#c04fff&#x27;},
  S: {emoji:&#x27;🍏&#x27;, color:&#x27;#7bff4f&#x27;},
  Z: {emoji:&#x27;🍓&#x27;, color:&#x27;#ff4f6f&#x27;},
  J: {emoji:&#x27;🫐&#x27;, color:&#x27;#4f8fff&#x27;},
  L: {emoji:&#x27;🍊&#x27;, color:&#x27;#ff9f2f&#x27;}
};
var SHAPES = {
  I: [[0,1],[1,1],[2,1],[3,1]],
  O: [[1,0],[2,0],[1,1],[2,1]],
  T: [[1,0],[0,1],[1,1],[2,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]]
};
var KICKS = [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1]];

var grid, piece, score=0, hi=0, level=1, linesCleared=0, running=false, dropId=null, dropMs=550;
var audioCtx=null;

function makeGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

function rotate(cells){
  // rotate 90deg CW within bounding box
  var maxX=0,maxY=0;
  cells.forEach(function(p){ if(p[0]&gt;maxX)maxX=p[0]; if(p[1]&gt;maxY)maxY=p[1]; });
  var n=Math.max(maxX,maxY);
  return cells.map(function(p){ return [n-p[1], p[0]]; });
}

function randType(){ var k=Object.keys(SHAPES); return k[Math.floor(Math.random()*k.length)]; }

function spawn(){
  var t=randType();
  piece={ type:t, cells:SHAPES[t].map(function(p){return p.slice();}), x:3, y:0 };
  if(collides(piece.cells, piece.x, piece.y)) return false;
  return true;
}

function collides(cells,ox,oy){
  for(var i=0;i&lt;cells.length;i++){
    var cx=cells[i][0]+ox, cy=cells[i][1]+oy;
    if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
    if(cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
  }
  return false;
}

function tryRotate(){
  if(!running||!piece) return;
  var rc=rotate(piece.cells);
  for(var i=0;i&lt;KICKS.length;i++){
    var nx=piece.x+KICKS[i][0], ny=piece.y+KICKS[i][1];
    if(!collides(rc,nx,ny)){ piece.cells=rc; piece.x=nx; piece.y=ny; beep(660,.04,&#x27;square&#x27;,.05); paint(); return; }
  }
}

function ghostY(){
  var gy=piece.y;
  while(!collides(piece.cells, piece.x, gy+1)) gy++;
  return gy;
}

function lock(){
  var f=FRUITS[piece.type];
  piece.cells.forEach(function(p){
    var cx=p[0]+piece.x, cy=p[1]+piece.y;
    if(cy&gt;=0&amp;&amp;cy&lt;ROWS&amp;&amp;cx&gt;=0&amp;&amp;cx&lt;COLS) grid[cy][cx]={emoji:f.emoji,color:f.color,fresh:true};
  });
  piece=null;
}

function clearRows(){
  var full=[];
  for(var r=0;r&lt;ROWS;r++){ var all=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){all=false;break;} if(all) full.push(r); }
  if(full.length===0) return;
  var pts=[0,100,300,600,1000][full.length];
  score+=pts; scoreEl.textContent=score;
  if(score&gt;hi){ hi=score; hiEl.textContent=hi; }
  // sparkle burst on full rows
  full.forEach(function(r){ burstRow(r); });
  if(full.length&gt;=2) showCombo(full.length);
  ding(full.length);
  // remove rows
  full.sort(function(a,b){return a-b;});
  for(var i=full.length-1;i&gt;=0;i--){ grid.splice(full[i],1); }
  for(var i=0;i&lt;full.length;i++){ var er=[]; for(var c=0;c&lt;COLS;c++)er.push(null); grid.unshift(er); }
  linesCleared+=full.length;
  var newLevel=Math.floor(linesCleared/5)+1;
  if(newLevel!==level){ level=newLevel; levelBadge.textContent=level; levelBadge.classList.remove(&#x27;pulse&#x27;); void levelBadge.offsetWidth; levelBadge.classList.add(&#x27;pulse&#x27;);
    dropMs=Math.max(90, 550-(level-1)*55); if(dropId){clearInterval(dropId); dropId=setInterval(step,dropMs);} }
}

function burstRow(r){
  field.classList.add(&#x27;row-shake&#x27;); setTimeout(function(){field.classList.remove(&#x27;row-shake&#x27;);},280);
  var colors=[&#x27;#ff4fd8&#x27;,&#x27;#4ff0ff&#x27;,&#x27;#f9ff4f&#x27;,&#x27;#7bff4f&#x27;,&#x27;#ff9f2f&#x27;];
  for(var c=0;c&lt;COLS;c++){
    for(var k=0;k&lt;3;k++){
      var sp=document.createElement(&#x27;div&#x27;); sp.className=&#x27;sparkle&#x27;;
      var x=c*CELL+CELL/2, y=r*CELL+CELL/2;
      sp.style.left=x+&#x27;px&#x27;; sp.style.top=y+&#x27;px&#x27;;
      sp.style.background=colors[Math.floor(Math.random()*colors.length)];
      sp.style.boxShadow=&#x27;0 0 8px &#x27;+sp.style.background;
      field.appendChild(sp);
      var ang=Math.random()*Math.PI*2, dist=30+Math.random()*50;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      sp.animate([{transform:&#x27;translate(0,0)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;,opacity:0}],{duration:600,easing:&#x27;ease-out&#x27;});
      (function(el){ setTimeout(function(){ el.remove(); },620); })(sp);
    }
  }
}

function showCombo(n){
  var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;combo&#x27;; el.textContent=&#x27;COMBO x&#x27;+n+&#x27;!&#x27;;
  field.appendChild(el); setTimeout(function(){el.remove();},1000);
}

function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function beep(freq,dur,type,vol){
  var c=ac(); if(!c)return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.1,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
}
function ding(n){
  var notes=[523,659,784,1046];
  for(var i=0;i&lt;Math.min(n+1,4);i++){ (function(idx){ setTimeout(function(){ beep(notes[idx],.18,&#x27;triangle&#x27;,.15); },idx*70); })(i); }
}

function drawCell(cx,cy,data,fresh){
  var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;cell&#x27;+(fresh?&#x27; flash&#x27;:&#x27;&#x27;);
  el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
  el.style.background=data.color+&#x27;33&#x27;;
  el.style.boxShadow=&#x27;0 0 8px &#x27;+data.color+&#x27;, inset 0 0 6px &#x27;+data.color+&#x27;55&#x27;;
  el.style.border=&#x27;1px solid &#x27;+data.color;
  el.textContent=data.emoji;
  field.appendChild(el);
}

function paint(){
  // remove cells &amp; ghosts only
  Array.prototype.slice.call(field.querySelectorAll(&#x27;.cell,.ghost&#x27;)).forEach(function(e){e.remove();});
  for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++){ if(grid[r][c]){ drawCell(c,r,grid[r][c],grid[r][c].fresh); grid[r][c].fresh=false; } }
  if(piece){
    var gy=ghostY();
    piece.cells.forEach(function(p){
      var cx=p[0]+piece.x, cy=p[1]+gy;
      if(cy&gt;=0){ var g=document.createElement(&#x27;div&#x27;); g.className=&#x27;ghost&#x27;; g.style.left=(cx*CELL)+&#x27;px&#x27;; g.style.top=(cy*CELL)+&#x27;px&#x27;; g.style.borderColor=FRUITS[piece.type].color+&#x27;66&#x27;; field.appendChild(g); }
    });
    var f=FRUITS[piece.type];
    piece.cells.forEach(function(p){ var cx=p[0]+piece.x, cy=p[1]+piece.y; if(cy&gt;=0) drawCell(cx,cy,{emoji:f.emoji,color:f.color}); });
  }
}

function step(){
  if(!piece) return;
  if(collides(piece.cells,piece.x,piece.y+1)){
    lock(); clearRows();
    if(!spawn()){ endGame(); return; }
  } else piece.y++;
  paint();
}

function move(dx){ if(!running||!piece)return; if(!collides(piece.cells,piece.x+dx,piece.y)){piece.x+=dx; paint();} }
function softDrop(){ if(!running)return; step(); }
function hardDrop(){ if(!running||!piece)return; piece.y=ghostY(); beep(200,.06,&#x27;sawtooth&#x27;,.08); step(); }

function endGame(){
  running=false; if(dropId){clearInterval(dropId);dropId=null;}
  var o=document.createElement(&#x27;div&#x27;); o.className=&#x27;over&#x27;; o.id=&#x27;overMsg&#x27;;
  o.innerHTML=&#x27;GAME OVER&lt;span&gt;Score &#x27;+score+&#x27; — press Start to retry&lt;/span&gt;&#x27;;
  field.appendChild(o);
  beep(160,.5,&#x27;sawtooth&#x27;,.12);
}

function startGame(){
  var old=document.getElementById(&#x27;overMsg&#x27;); if(old)old.remove();
  score=0; level=1; linesCleared=0; dropMs=550;
  scoreEl.textContent=&#x27;0&#x27;; levelBadge.textContent=&#x27;1&#x27;;
  makeGrid(); if(!spawn())return; paint();
  running=true; if(dropId)clearInterval(dropId); dropId=setInterval(step,dropMs);
  ac();
}
function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if([&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;,&#x27;ArrowDown&#x27;,&#x27;ArrowUp&#x27;,&#x27; &#x27;].indexOf(e.key)&gt;=0) e.preventDefault();
  if(!running)return;
  if(e.key===&#x27;ArrowLeft&#x27;)move(-1);
  else if(e.key===&#x27;ArrowRight&#x27;)move(1);
  else if(e.key===&#x27;ArrowDown&#x27;)softDrop();
  else if(e.key===&#x27;ArrowUp&#x27;)tryRotate();
  else if(e.key===&#x27; &#x27;)hardDrop();
});

// touch
var tsx=0,tsy=0,tmoved=false;
field.addEventListener(&#x27;touchstart&#x27;,function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; tmoved=false; e.preventDefault(); },{passive:false});
field.addEventListener(&#x27;touchmove&#x27;,function(e){
  if(!running)return; var t=e.touches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)&gt;26 &amp;&amp; Math.abs(dx)&gt;Math.abs(dy)){ move(dx&gt;0?1:-1); tsx=t.clientX; tmoved=true; }
  else if(dy&gt;40){ hardDrop(); tsy=t.clientY; tmoved=true; }
  e.preventDefault();
},{passive:false});
field.addEventListener(&#x27;touchend&#x27;,function(e){ if(!tmoved&amp;&amp;running)tryRotate(); e.preventDefault(); },{passive:false});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;)return;
  if(e.data.type===&#x27;wd_start&#x27;)startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;)stopGame();
});

makeGrid(); piece={type:&#x27;T&#x27;,cells:SHAPES.T.map(function(p){return p.slice();}),x:3,y:0}; paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
