<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON SERPENT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 2px;
       color: #6ff; text-shadow: 0 0 8px #0ff, 0 0 18px #08f; }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; font-size: 20px; align-items: center; }
  .hud .val { color: #fff; text-shadow: 0 0 6px #0ff; }
  .tier { color: #f7f; text-shadow: 0 0 8px #f0f; }
  .wrap { position: relative; }
  canvas { display: block; border-radius: 10px; background: #060815;
           box-shadow: 0 0 24px rgba(0,200,255,0.25); }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column;
             align-items: center; justify-content: center; text-align: center;
             background: rgba(4,6,20,0.82); border-radius: 10px; }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0 0 8px; font-size: 40px; color: #f66; text-shadow: 0 0 14px #f00; }
  .overlay .fs { font-size: 26px; color: #fff; margin: 4px 0; }
  .overlay .msg { font-size: 18px; color: #9cf; margin-top: 6px; }
  .overlay .hint { font-size: 15px; color: #789; margin-top: 14px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys (or swipe on touch) to eat apples, stars, and rare pink diamonds for points. Avoid the walls and your own glowing tail — you speed up every 5 points.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;Speed: &lt;span class=&quot;tier&quot; id=&quot;tier&quot;&gt;Chill&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2 id=&quot;ovTitle&quot;&gt;Game Over&lt;/h2&gt;
      &lt;div class=&quot;fs&quot;&gt;Final Score: &lt;span id=&quot;ovScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;msg&quot; id=&quot;ovMsg&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press the Start/Restart button below to play again.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20, COLS = 30, ROWS = 22;
  var W = COLS*CELL, H = ROWS*CELL;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), tierEl = document.getElementById(&#x27;tier&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var ovTitle = document.getElementById(&#x27;ovTitle&#x27;), ovScore = document.getElementById(&#x27;ovScore&#x27;), ovMsg = document.getElementById(&#x27;ovMsg&#x27;);

  var running=false, gameOver=false, animId=null, lastStep=0, score=0;
  var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
  var apple=null, star=null, diamond=null;
  var starTimer=0, diamondTimer=0, diamondCooldown=0;
  var bursts=[];
  var shakeTime=0, flashTime=0;
  var t0=0;

  var TIERS=[
    {name:&#x27;Chill&#x27;, ms:150},
    {name:&#x27;Quick&#x27;, ms:120},
    {name:&#x27;Speedy&#x27;, ms:95},
    {name:&#x27;Sonic&#x27;, ms:72}
  ];
  function tierIndex(){ var i=Math.floor(score/5); return i&gt;3?3:i; }
  function stepMs(){ return TIERS[tierIndex()].ms; }

  function occupied(x,y){
    for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    if(apple&amp;&amp;apple.x===x&amp;&amp;apple.y===y) return true;
    if(star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
    if(diamond&amp;&amp;diamond.x===x&amp;&amp;diamond.y===y) return true;
    return false;
  }
  function freeCell(){
    for(var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupied(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }
  function spawnApple(){ apple=freeCell(); }
  function spawnStar(){ star=freeCell(); starTimer=5000; }
  function maybeSpawnDiamond(){ diamond=freeCell(); diamondTimer=4000; }

  function initSnake(){
    snake=[{x:5,y:11},{x:4,y:11},{x:3,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function addBurst(cx,cy,color){ bursts.push({x:cx*CELL+CELL/2,y:cy*CELL+CELL/2,color:color,age:0,life:420}); }

  function step(){
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
    var ateApple=(apple&amp;&amp;nx===apple.x&amp;&amp;ny===apple.y);
    var body = ateApple ? snake : snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ die(); return; }
    snake.unshift({x:nx,y:ny});
    var grow=false;
    if(ateApple){ score+=1; addBurst(nx,ny,&#x27;#6f6&#x27;); spawnApple(); grow=true; }
    if(star&amp;&amp;nx===star.x&amp;&amp;ny===star.y){ score+=3; addBurst(nx,ny,&#x27;#fd3&#x27;); spawnStar(); }
    if(diamond&amp;&amp;nx===diamond.x&amp;&amp;ny===diamond.y){ score+=5; addBurst(nx,ny,&#x27;#f6c&#x27;); diamond=null; diamondCooldown=6000+Math.random()*6000; }
    if(!grow) snake.pop();
    scoreEl.textContent=score;
    tierEl.textContent=TIERS[tierIndex()].name;
  }

  function die(){
    running=false; gameOver=true;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    shakeTime=500; flashTime=350;
    var t=Date.now();
    // brief shake/flash render loop then show overlay
    (function shakeLoop(){
      var now=Date.now(), el=now-t;
      shakeTime=Math.max(0,500-el);
      flashTime=Math.max(0,350-el);
      render(now);
      if(el&lt;520){ requestAnimationFrame(shakeLoop); }
      else { showOverlay(); }
    })();
  }

  function showOverlay(){
    ovScore.textContent=score;
    var msg;
    if(score&gt;=40){ ovTitle.textContent=&#x27;LEGENDARY!&#x27;; msg=&#x27;The serpent bows to no wall. Incredible!&#x27;; }
    else if(score&gt;=20){ ovTitle.textContent=&#x27;Great Run!&#x27;; msg=&#x27;Slick moves — you were flying out there.&#x27;; }
    else if(score&gt;=8){ ovTitle.textContent=&#x27;Nice Try!&#x27;; msg=&#x27;Solid effort. Push for that pink diamond next time.&#x27;; }
    else { ovTitle.textContent=&#x27;Game Over&#x27;; msg=&#x27;Every legend starts somewhere. Try again!&#x27;; }
    ovMsg.textContent=msg;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function drawGrid(){
    ctx.strokeStyle=&#x27;rgba(40,90,140,0.35)&#x27;;
    ctx.lineWidth=1;
    var pulse=0.15+0.1*Math.sin(t0/500);
    ctx.save();
    ctx.globalAlpha=0.6;
    for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
    for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }
    ctx.restore();
    // subtle glow overlay
    ctx.fillStyle=&#x27;rgba(0,80,160,&#x27;+pulse.toFixed(3)+&#x27;)&#x27;;
    ctx.globalCompositeOperation=&#x27;lighter&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation=&#x27;source-over&#x27;;
  }

  function drawRoundCell(x,y,color,inset){
    var px=x*CELL+inset, py=y*CELL+inset, s=CELL-inset*2, r=4;
    ctx.beginPath();
    ctx.moveTo(px+r,py);
    ctx.arcTo(px+s,py,px+s,py+s,r);
    ctx.arcTo(px+s,py+s,px,py+s,r);
    ctx.arcTo(px,py+s,px,py,r);
    ctx.arcTo(px,py,px+s,py,r);
    ctx.closePath();
    ctx.fillStyle=color; ctx.fill();
  }

  function drawSnake(){
    ctx.save();
    ctx.shadowBlur=14;
    for(var i=snake.length-1;i&gt;=0;i--){
      var t=snake.length&gt;1? i/(snake.length-1):0;
      // cyan (head) -&gt; purple (tail)
      var r=Math.round(60+ (150-60)*t);
      var g=Math.round(230+ (40-230)*t);
      var b=255;
      var col=&#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
      ctx.shadowColor=col;
      drawRoundCell(snake[i].x,snake[i].y,col,2);
    }
    // head eyes
    var hd=snake[0];
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#022&#x27;;
    var ex=hd.x*CELL, ey=hd.y*CELL;
    ctx.beginPath(); ctx.arc(ex+7,ey+7,2,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+13,ey+7,2,0,6.3); ctx.fill();
    ctx.restore();
  }

  function drawPickups(){
    ctx.save();
    ctx.shadowBlur=16;
    // apple
    if(apple){
      var ax=apple.x*CELL+CELL/2, ay=apple.y*CELL+CELL/2;
      ctx.shadowColor=&#x27;#5f5&#x27;;
      ctx.fillStyle=&#x27;#4f4&#x27;;
      ctx.beginPath(); ctx.arc(ax,ay,7,0,6.3); ctx.fill();
      ctx.shadowBlur=0; ctx.strokeStyle=&#x27;#0a0&#x27;; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(ax,ay-7); ctx.lineTo(ax+3,ay-11); ctx.stroke();
      ctx.shadowBlur=16;
    }
    // star (blinking)
    if(star){
      var blink=0.55+0.45*Math.sin(t0/180);
      var sx=star.x*CELL+CELL/2, sy=star.y*CELL+CELL/2;
      ctx.globalAlpha=blink;
      ctx.shadowColor=&#x27;#fd3&#x27;; ctx.fillStyle=&#x27;#fe4&#x27;;
      drawStarShape(sx,sy,5,8,4);
      ctx.globalAlpha=1;
    }
    // diamond (flashing)
    if(diamond){
      var fl=diamondTimer&lt;1200 ? (Math.floor(t0/120)%2?0.25:1) : 0.6+0.4*Math.sin(t0/150);
      var dx=diamond.x*CELL+CELL/2, dy=diamond.y*CELL+CELL/2;
      ctx.globalAlpha=fl;
      ctx.shadowColor=&#x27;#f6c&#x27;; ctx.fillStyle=&#x27;#f7d&#x27;;
      ctx.beginPath();
      ctx.moveTo(dx,dy-9); ctx.lineTo(dx+7,dy); ctx.lineTo(dx,dy+9); ctx.lineTo(dx-7,dy);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawStarShape(cx,cy,spikes,outer,inner){
    var rot=Math.PI/2*3, step=Math.PI/spikes;
    ctx.beginPath(); ctx.moveTo(cx,cy-outer);
    for(var i=0;i&lt;spikes;i++){
      var x=cx+Math.cos(rot)*outer, y=cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot+=step;
      x=cx+Math.cos(rot)*inner; y=cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot+=step;
    }
    ctx.closePath(); ctx.fill();
  }

  function drawBursts(dt){
    ctx.save();
    ctx.globalCompositeOperation=&#x27;lighter&#x27;;
    for(var i=bursts.length-1;i&gt;=0;i--){
      var b=bursts[i]; b.age+=dt;
      var p=b.age/b.life;
      if(p&gt;=1){ bursts.splice(i,1); continue; }
      var rad=4+p*22, a=1-p;
      ctx.globalAlpha=a;
      ctx.strokeStyle=b.color; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(b.x,b.y,rad,0,6.3); ctx.stroke();
      // rays
      for(var k=0;k&lt;8;k++){
        var ang=k/8*6.283;
        ctx.beginPath();
        ctx.moveTo(b.x+Math.cos(ang)*rad*0.5,b.y+Math.sin(ang)*rad*0.5);
        ctx.lineTo(b.x+Math.cos(ang)*rad,b.y+Math.sin(ang)*rad);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function render(now){
    t0=now;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shakeTime&gt;0){ var s=shakeTime/500*6; ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
    drawGrid();
    drawPickups();
    drawSnake();
    drawBursts(16);
    ctx.restore();
    if(flashTime&gt;0){
      ctx.fillStyle=&#x27;rgba(255,30,30,&#x27;+(flashTime/350*0.55).toFixed(3)+&#x27;)&#x27;;
      ctx.fillRect(0,0,W,H);
    }
  }

  function loop(now){
    if(!running) return;
    if(!lastStep) lastStep=now;
    var dt=now-lastStep;
    // timers
    starTimer-=16;
    if(starTimer&lt;=0) spawnStar();
    if(diamond){ diamondTimer-=16; if(diamondTimer&lt;=0){ diamond=null; diamondCooldown=6000+Math.random()*6000; } }
    else { diamondCooldown-=16; if(diamondCooldown&lt;=0) maybeSpawnDiamond(); }

    if(dt&gt;=stepMs()){ step(); lastStep=now; }
    render(now);
    if(running) animId=requestAnimationFrame(loop);
  }

  function startGame(){
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; scoreEl.textContent=&#x27;0&#x27;; tierEl.textContent=&#x27;Chill&#x27;;
    gameOver=false; running=true;
    bursts=[]; shakeTime=0; flashTime=0; lastStep=0;
    initSnake();
    spawnApple(); spawnStar();
    diamond=null; diamondCooldown=5000;
    animId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });

  // swipe controls
  var tsx=0, tsy=0;
  cv.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  cv.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;15&amp;&amp;Math.abs(dy)&lt;15) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) pendingDir={x:dx&gt;0?1:-1,y:0};
    else pendingDir={x:0,y:dy&gt;0?1:-1};
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  initSnake(); spawnApple(); spawnStar();
  render(0);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
