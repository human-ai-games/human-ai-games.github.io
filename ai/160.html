<title>COSMIC SERPENT</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }

  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #cfe3ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#39c6ff,#a065ff,#ff5fce); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,120,255,0.35); }
  .instructions { font-size: 16px; color: #8fa6cf; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 22px; align-items: center; font-size: 20px; }
  .score b { color: #ffe07a; }
  .tier { font-weight: 700; letter-spacing: 1px; padding: 2px 10px; border-radius: 20px; font-size: 15px; }
  .t-cruise { color: #6ff0ff; border: 1px solid #2b6f7a; }
  .t-boost  { color: #b58cff; border: 1px solid #6742a6; }
  .t-ludi   { color: #ff7ad6; border: 1px solid #a63f86; }
  .wrap { position: relative; }
  canvas { background: #070a1a; border-radius: 10px; box-shadow: 0 0 30px rgba(60,80,200,0.25) inset, 0 0 12px rgba(80,120,255,0.2); touch-action: none; }
  .over { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
          background: rgba(5,6,15,0.72); border-radius: 10px; text-align: center; }
  .over h2 { margin: 0 0 6px; font-size: 30px; color: #ff5fce; text-shadow: 0 0 16px rgba(255,95,206,0.5); }
  .over p { margin: 0; font-size: 17px; color: #cfe3ff; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer your glowing space worm with the arrow keys (or swipe) to grab stars, comets, and rare supernovas. Avoid the walls, asteroids, and your own tail — use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span class=&quot;score&quot;&gt;Score: &lt;b id=&quot;score&quot;&gt;0&lt;/b&gt;&lt;/span&gt;
    &lt;span class=&quot;tier t-cruise&quot; id=&quot;tier&quot;&gt;CRUISING&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;&lt;h2&gt;GAME OVER&lt;/h2&gt;&lt;p id=&quot;overtxt&quot;&gt;Press Start to fly again&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
    }, true);
  });

  var CELL = 20, COLS = 30, ROWS = 23;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), tierEl = document.getElementById(&#x27;tier&#x27;);
  var overEl = document.getElementById(&#x27;over&#x27;), overTxt = document.getElementById(&#x27;overtxt&#x27;);

  var running = false, tickId = null, animId = null;
  var snake, dir, pendingDir, score, tickMs, tickAccum, lastFrame;
  var star, comet, supernova, asteroids, stars, trail, sparks;
  var supTimer, cometTimer, cometMoveEvery = 6, cometCounter = 0;

  function rnd(n){ return Math.floor(Math.random()*n); }

  function makeStarfield(){
    stars = [];
    for (var i=0;i&lt;90;i++) stars.push({x:Math.random()*cv.width, y:Math.random()*cv.height, r:Math.random()*1.3+0.3, a:Math.random()*0.6+0.2});
  }

  function occupied(x,y){
    if (snake) for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    if (asteroids) for (var j=0;j&lt;asteroids.length;j++) if (asteroids[j].x===x&amp;&amp;asteroids[j].y===y) return true;
    if (star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
    if (comet&amp;&amp;comet.x===x&amp;&amp;comet.y===y) return true;
    if (supernova&amp;&amp;supernova.x===x&amp;&amp;supernova.y===y) return true;
    return false;
  }
  function freeCell(){
    for (var t=0;t&lt;300;t++){ var x=rnd(COLS),y=rnd(ROWS); if(!occupied(x,y)) return {x:x,y:y}; }
    return {x:0,y:0};
  }

  function reset(){
    snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
    score=0; scoreEl.textContent=&#x27;0&#x27;;
    tickMs=140; tickAccum=0;
    trail=[]; sparks=[];
    asteroids=[];
    for(var i=0;i&lt;4;i++){ asteroids.push(freeCell()); }
    star=freeCell();
    comet=freeCell();
    supernova=null; supTimer=0; cometCounter=0;
    cometTimer=0;
    updateTier();
    makeStarfield();
    overEl.style.display=&#x27;none&#x27;;
  }

  function updateTier(){
    var t;
    if (tickMs&gt;110){ t=&#x27;CRUISING&#x27;; tierEl.className=&#x27;tier t-cruise&#x27;; }
    else if (tickMs&gt;80){ t=&#x27;BOOSTING&#x27;; tierEl.className=&#x27;tier t-boost&#x27;; }
    else { t=&#x27;LUDICROUS&#x27;; tierEl.className=&#x27;tier t-ludi&#x27;; }
    tierEl.textContent=t;
  }

  function spawnSparks(cx,cy,color){
    for(var i=0;i&lt;8;i++){
      var ang=(Math.PI*2/8)*i + Math.random()*0.4;
      var sp=2+Math.random()*2;
      sparks.push({x:cx*CELL+CELL/2, y:cy*CELL+CELL/2, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:1, color:color});
    }
  }

  function maybeSpawnSupernova(){
    if (!supernova &amp;&amp; Math.random()&lt;0.12){
      supernova=freeCell(); supTimer=5000; // 5 seconds
    }
  }

  function tick(){
    if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0], nx=head.x+dir.x, ny=head.y+dir.y;
    if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ return endGame(); }
    for(var a=0;a&lt;asteroids.length;a++) if(asteroids[a].x===nx&amp;&amp;asteroids[a].y===ny) return endGame();

    var ateStar=(star&amp;&amp;nx===star.x&amp;&amp;ny===star.y);
    var ateComet=(comet&amp;&amp;nx===comet.x&amp;&amp;ny===comet.y);
    var ateSup=(supernova&amp;&amp;nx===supernova.x&amp;&amp;ny===supernova.y);
    var grow=ateStar||ateComet||ateSup;
    var body=grow?snake:snake.slice(0,snake.length-1);
    for(var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny) return endGame();

    snake.unshift({x:nx,y:ny});
    if(!grow){ var tail=snake.pop(); trail.push({x:tail.x,y:tail.y,life:1}); }

    if(ateStar){ score+=1; spawnSparks(star.x,star.y,&#x27;255,224,122&#x27;); star=freeCell(); }
    if(ateComet){ score+=3; spawnSparks(comet.x,comet.y,&#x27;110,240,255&#x27;); comet=freeCell(); }
    if(ateSup){ score+=5; spawnSparks(supernova.x,supernova.y,&#x27;255,255,255&#x27;); supernova=null; supTimer=0; }

    if(grow){
      scoreEl.textContent=score;
      var newTick=Math.max(60, 140 - Math.floor(score/5)*10);
      if(newTick!==tickMs){ tickMs=newTick; updateTier(); }
    }

    // comet drift
    cometCounter++;
    if(comet &amp;&amp; cometCounter&gt;=cometMoveEvery){
      cometCounter=0;
      var dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      var d=dirs[rnd(4)]; var cx=comet.x+d.x, cy=comet.y+d.y;
      if(cx&gt;=0&amp;&amp;cx&lt;COLS&amp;&amp;cy&gt;=0&amp;&amp;cy&lt;ROWS&amp;&amp;!occupied(cx,cy)){ comet.x=cx; comet.y=cy; }
    }
    maybeSpawnSupernova();
  }

  function drawHex(cx,cy){
    var r=CELL*0.5, x=cx*CELL+CELL/2, y=cy*CELL+CELL/2;
    ctx.beginPath();
    for(var i=0;i&lt;6;i++){ var a=Math.PI/6+i*Math.PI/3; var px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath();
    ctx.fillStyle=&#x27;#3a4055&#x27;; ctx.fill();
    ctx.strokeStyle=&#x27;#5a6480&#x27;; ctx.lineWidth=1.5; ctx.stroke();
  }

  function lerpColor(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]; }
  var C_HEAD=[57,198,255], C_MID=[160,101,255], C_TAIL=[255,95,206];

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.fillStyle=&#x27;#070a1a&#x27;; ctx.fillRect(0,0,cv.width,cv.height);
    // starfield
    for(var i=0;i&lt;stars.length;i++){ var s=stars[i]; ctx.globalAlpha=s.a; ctx.fillStyle=&#x27;#ffffff&#x27;; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;

    // comet-trail afterglow
    for(var t=0;t&lt;trail.length;t++){ var tr=trail[t]; ctx.globalAlpha=tr.life*0.4; ctx.fillStyle=&#x27;#7f6bff&#x27;; ctx.fillRect(tr.x*CELL+3,tr.y*CELL+3,CELL-6,CELL-6); }
    ctx.globalAlpha=1;

    // asteroids
    for(var a=0;a&lt;asteroids.length;a++) drawHex(asteroids[a].x,asteroids[a].y);

    // pickups
    if(star) drawPickup(star.x,star.y,&#x27;#ffe07a&#x27;,&#x27;#7a5a00&#x27;,6);
    if(comet){ var f=(Math.floor(Date.now()/200)%2===0); drawPickup(comet.x,comet.y,f?&#x27;#6ff0ff&#x27;:&#x27;#2aa9c9&#x27;,&#x27;#004a5a&#x27;,9); }
    if(supernova){ var p=0.6+0.4*Math.sin(Date.now()/120); drawPickup(supernova.x,supernova.y,&#x27;#ffffff&#x27;,&#x27;#88aaff&#x27;,16*p); }

    // snake with gradient
    for(var i=snake.length-1;i&gt;=0;i--){
      var seg=snake[i], t2=snake.length&gt;1?i/(snake.length-1):0;
      var col = t2&lt;0.5? lerpColor(C_HEAD,C_MID,t2*2) : lerpColor(C_MID,C_TAIL,(t2-0.5)*2);
      var rgb=&#x27;rgb(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;)&#x27;;
      ctx.shadowColor=rgb; ctx.shadowBlur=12;
      ctx.fillStyle=rgb;
      roundRect(seg.x*CELL+1.5,seg.y*CELL+1.5,CELL-3,CELL-3,5); ctx.fill();
      ctx.shadowBlur=0;
    }
    // eyes on head
    if(snake.length){ var h=snake[0]; ctx.fillStyle=&#x27;#08122a&#x27;;
      ctx.beginPath(); ctx.arc(h.x*CELL+CELL/2-3,h.y*CELL+CELL/2-2,2,0,7); ctx.arc(h.x*CELL+CELL/2+3,h.y*CELL+CELL/2-2,2,0,7); ctx.fill(); }

    // sparks
    for(var s2=0;s2&lt;sparks.length;s2++){ var sp=sparks[s2]; ctx.globalAlpha=Math.max(0,sp.life); ctx.fillStyle=&#x27;rgb(&#x27;+sp.color+&#x27;)&#x27;; ctx.beginPath(); ctx.arc(sp.x,sp.y,2.5,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  }

  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function drawPickup(cx,cy,fill,glow,blur){
    var x=cx*CELL+CELL/2, y=cy*CELL+CELL/2;
    ctx.shadowColor=glow; ctx.shadowBlur=blur; ctx.fillStyle=fill;
    ctx.beginPath(); ctx.arc(x,y,CELL*0.32,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  function frame(now){
    if(!running) return;
    var dt=now-lastFrame; lastFrame=now;
    tickAccum+=dt;
    while(tickAccum&gt;=tickMs){ tickAccum-=tickMs; tick(); if(!running) break; }
    // supernova timer
    if(supernova){ supTimer-=dt; if(supTimer&lt;=0){ supernova=null; } }
    else { supTimer-=dt; }
    // fade trail &amp; sparks
    for(var t=trail.length-1;t&gt;=0;t--){ trail[t].life-=dt/400; if(trail[t].life&lt;=0) trail.splice(t,1); }
    for(var s=sparks.length-1;s&gt;=0;s--){ var sp=sparks[s]; sp.x+=sp.vx; sp.y+=sp.vy; sp.vx*=0.92; sp.vy*=0.92; sp.life-=dt/500; if(sp.life&lt;=0) sparks.splice(s,1); }
    draw();
    animId=requestAnimationFrame(frame);
  }

  function endGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    overTxt.textContent=&#x27;Score: &#x27;+score+&#x27; — Press Start to fly again&#x27;;
    overEl.style.display=&#x27;flex&#x27;;
    draw();
  }

  function startGame(){
    reset();
    running=true;
    lastFrame=performance.now();
    draw();
    animId=requestAnimationFrame(frame);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
  });

  // swipe controls
  var tsx=0, tsy=0;
  cv.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  cv.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&lt;20&amp;&amp;Math.abs(dy)&lt;20) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) pendingDir={x:dx&gt;0?1:-1,y:0};
    else pendingDir={x:0,y:dy&gt;0?1:-1};
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static paint
  reset();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
