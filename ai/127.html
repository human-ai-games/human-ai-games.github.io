&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
    background: #fdf6e3; color: #333; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box;

  h1 { margin: 2px 0; font-size: 26px; font-weight: 800;

    background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #555; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .main { display: flex; gap: 14px; align-items: flex-start; margin-top: 4px; }
  .field-wrap { position: relative; }
  .field { position: relative; width: 250px; height: 500px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(180deg,#87ceeb 0%,#b3e0f2 55%,#a8e063 78%,#78c850 100%);
    box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .grid-lines { position: absolute; inset: 0; background-image:
    linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px);
    background-size: 25px 25px; pointer-events: none; }
  .block { position: absolute; box-sizing: border-box; border-radius: 5px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    border: 1px solid rgba(0,0,0,0.12); box-shadow: inset 0 2px 3px rgba(255,255,255,0.4);}
  .ghost { position: absolute; box-sizing: border-box; border-radius: 5px;

  .side { display: flex; flex-direction: column; gap: 10px; align-items: center; }

  .score-val { font-size: 30px; font-weight: 800; color: #ff5e62; transition: transform 0.12s; }
  .score-val.pulse { transform: scale(1.4); }
  .next-box { position: relative; width: 100px; height: 100px; margin: 4px auto 0;
    background: #f4f4f4; border-radius: 8px; }
  .flash { position: absolute; left:0; right:0; background: white; z-index: 5; pointer-events:none;
    animation: flashfade 0.4s ease-out forwards; }
  @keyframes flashfade { 0%{opacity:0.95;} 100%{opacity:0;} }
  .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; z-index: 6; pointer-events:none; }
  .combo-text { position: absolute; left: 50%; top: 45%; transform: translateX(-50%);
    font-size: 34px; font-weight: 900; color: #fff; z-index: 7; pointer-events:none;
    text-shadow: 0 2px 0 #ff5e62, 0 0 10px rgba(255,255,255,0.8);
    animation: combofloat 1.1s ease-out forwards; }
  @keyframes combofloat { 0%{opacity:0; transform:translateX(-50%) translateY(20px) scale(0.5);}
    25%{opacity:1; transform:translateX(-50%) translateY(0) scale(1.2);}
    60%{transform:translateX(-50%) translateY(-40px) scale(1);}
    100%{opacity:0; transform:translateX(-50%) translateY(-90px) scale(0.9);} }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍓 Fruit Drop 🍉&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;&amp;larr;/&amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, soft-drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Clear rows for points — clear two or more at once for a COMBO burst! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;main&quot;&gt;
    &lt;div class=&quot;field-wrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;div class=&quot;grid-lines&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;go-emoji&quot;&gt;🍓🍌🍇🍊🍉&lt;/div&gt;
        &lt;div class=&quot;go-title&quot;&gt;Game Over&lt;/div&gt;
        &lt;div class=&quot;go-score&quot; id=&quot;goScore&quot;&gt;Score: 0&lt;/div&gt;
        &lt;div class=&quot;go-hint&quot;&gt;Press Restart below to play again&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;score-val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;score-val&quot; id=&quot;level&quot; style=&quot;font-size:24px;color:#6bcB77;&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div class=&quot;next-box&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 25, COLS = 10, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var nextBox = document.getElementById(&#x27;next&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var goScore = document.getElementById(&#x27;goScore&#x27;);

  var FRUITS = {
    I: { color:&#x27;#ff5e62&#x27;, emoji:&#x27;🍉&#x27;, cells:[[0,1],[1,1],[2,1],[3,1]] },
    O: { color:&#x27;#ffd93b&#x27;, emoji:&#x27;🍋&#x27;, cells:[[1,0],[2,0],[1,1],[2,1]] },
    T: { color:&#x27;#c56cf0&#x27;, emoji:&#x27;🍇&#x27;, cells:[[1,0],[0,1],[1,1],[2,1]] },
    S: { color:&#x27;#6bcB77&#x27;, emoji:&#x27;🍏&#x27;, cells:[[1,0],[2,0],[0,1],[1,1]] },
    Z: { color:&#x27;#ff9966&#x27;, emoji:&#x27;🍊&#x27;, cells:[[0,0],[1,0],[1,1],[2,1]] },
    L: { color:&#x27;#ffb142&#x27;, emoji:&#x27;🍌&#x27;, cells:[[2,0],[0,1],[1,1],[2,1]] },
    J: { color:&#x27;#4b9cff&#x27;, emoji:&#x27;🫐&#x27;, cells:[[0,0],[0,1],[1,1],[2,1]] }
  };
  var TYPES = Object.keys(FRUITS);

  var grid, piece, nextType, score, level, dropMs, running, dropId;
  var audioCtx;

  function initAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  function beep(freq, dur, type){
    if(!audioCtx) return;
    try{ var o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.12,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
      o.start(); o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function makePiece(type){
    var f = FRUITS[type];
    return { type:type, cells: f.cells.map(function(c){return [c[0],c[1]];}), x:3, y:0 };
  }

  function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }

  function collides(p){
    var cs=absCells(p);
    for(var i=0;i&lt;cs.length;i++){ var cx=cs[i].x, cy=cs[i].y;
      if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if(cy&gt;=0 &amp;&amp; grid[cy][cx]) return true; }
    return false;
  }

  function rotate(p){
    // rotate cells 90deg CW around a 3-wide bounding origin
    if(p.type===&#x27;O&#x27;) return;
    var maxX=0,maxY=0;
    p.cells.forEach(function(c){ if(c[0]&gt;maxX)maxX=c[0]; if(c[1]&gt;maxY)maxY=c[1]; });
    var size = Math.max(maxX,maxY);
    var rotated = p.cells.map(function(c){ return [size - c[1], c[0]]; });
    var test = { type:p.type, cells:rotated, x:p.x, y:p.y };
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.x = p.x + kicks[k];
      if(!collides(test)){ p.cells=rotated; p.x=test.x; beep(660,0.06,&#x27;sine&#x27;); return; }
    }
  }

  function spawn(){
    piece = makePiece(nextType);
    nextType = TYPES[Math.floor(Math.random()*TYPES.length)];
    drawNext();
    if(collides(piece)) return false;
    return true;
  }

  function ghostPos(){
    var g = { type:piece.type, cells:piece.cells, x:piece.x, y:piece.y };
    while(!collides({type:g.type,cells:g.cells,x:g.x,y:g.y+1})) g.y++;
    return g;
  }

  function lock(){
    absCells(piece).forEach(function(c){ if(c.y&gt;=0) grid[c.y][c.x]={color:FRUITS[piece.type].color,emoji:FRUITS[piece.type].emoji}; });
    piece=null;
  }

  function clearRows(){
    var fullRows=[];
    for(var r=0;r&lt;ROWS;r++){ var full=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){full=false;break;} if(full) fullRows.push(r); }
    if(fullRows.length===0) return;
    if(fullRows.length&gt;=2){ comboBurst(fullRows); beep(880,0.15,&#x27;triangle&#x27;); setTimeout(function(){beep(1100,0.15,&#x27;triangle&#x27;);},80); }
    else { flashRows(fullRows); beep(520,0.1,&#x27;sine&#x27;); }
    // remove
    fullRows.sort(function(a,b){return a-b;});
    for(var i=fullRows.length-1;i&gt;=0;i--){ grid.splice(fullRows[i],1); var e=[];for(var c2=0;c2&lt;COLS;c2++)e.push(null); grid.unshift(e); }
    var pts = [0,1,3,6,10][fullRows.length] || fullRows.length*4;
    addScore(pts);
  }

  function addScore(pts){
    score += pts;
    scoreEl.textContent = score;
    scoreEl.classList.add(&#x27;pulse&#x27;);
    setTimeout(function(){scoreEl.classList.remove(&#x27;pulse&#x27;);},120);
    var newLevel = Math.floor(score/10)+1;
    if(newLevel!==level){ level=newLevel; levelEl.textContent=level; dropMs=Math.max(90, 500 - (level-1)*40); restartTimer(); }
  }

  function flashRows(rows){
    rows.forEach(function(r){
      var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;flash&#x27;;
      f.style.top=(r*CELL)+&#x27;px&#x27;; f.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(f); setTimeout(function(){f.remove();},400);
    });
  }

  function comboBurst(rows){
    flashRows(rows);
    var colors=[&#x27;#ff5e62&#x27;,&#x27;#ffd93b&#x27;,&#x27;#6bcB77&#x27;,&#x27;#4b9cff&#x27;,&#x27;#c56cf0&#x27;,&#x27;#ff9966&#x27;];
    rows.forEach(function(r){
      for(var i=0;i&lt;14;i++){
        (function(){
          var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;;
          p.style.background=colors[Math.floor(Math.random()*colors.length)];
          var px=Math.random()*COLS*CELL, py=r*CELL+CELL/2;
          p.style.left=px+&#x27;px&#x27;; p.style.top=py+&#x27;px&#x27;;
          field.appendChild(p);
          var ang=Math.random()*Math.PI*2, dist=40+Math.random()*80;
          var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
          p.animate([{transform:&#x27;translate(0,0)&#x27;,opacity:1},
            {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;,opacity:0}],
            {duration:700,easing:&#x27;ease-out&#x27;});
          setTimeout(function(){p.remove();},700);
        })();
      }
    });
    var ct=document.createElement(&#x27;div&#x27;); ct.className=&#x27;combo-text&#x27;;
    ct.textContent = rows.length&gt;=4 ? &#x27;FRUIT-TASTIC! x4&#x27; : (rows.length===3?&#x27;TRIPLE COMBO!&#x27;:&#x27;COMBO! x2&#x27;);
    field.appendChild(ct);
    setTimeout(function(){ct.remove();},1100);
  }

  function paint(){
    // clear blocks/ghosts but keep grid-lines and effect elements
    var kids=field.querySelectorAll(&#x27;.block,.ghost&#x27;);
    kids.forEach(function(k){k.remove();});
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++){ if(grid[r][c]) drawBlock(c,r,grid[r][c]); }
    if(piece){
      var g=ghostPos();
      absCells(g).forEach(function(c){ if(c.y&gt;=0) drawGhost(c.x,c.y); });
      var f=FRUITS[piece.type];
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) drawBlock(c.x,c.y,{color:f.color,emoji:f.emoji}); });
    }
  }

  function drawBlock(cx,cy,info){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;block&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=info.color; el.textContent=info.emoji;
    field.appendChild(el);
  }
  function drawGhost(cx,cy){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;ghost&#x27;;
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    field.appendChild(el);
  }

  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;;
    var f=FRUITS[nextType];
    var minX=4,minY=4,maxX=0,maxY=0;
    f.cells.forEach(function(c){minX=Math.min(minX,c[0]);minY=Math.min(minY,c[1]);maxX=Math.max(maxX,c[0]);maxY=Math.max(maxY,c[1]);});
    var w=(maxX-minX+1),h=(maxY-minY+1);
    var cs=22;
    var offX=(100-w*cs)/2, offY=(100-h*cs)/2;
    f.cells.forEach(function(c){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;block&#x27;;
      el.style.left=(offX+(c[0]-minX)*cs)+&#x27;px&#x27;; el.style.top=(offY+(c[1]-minY)*cs)+&#x27;px&#x27;;
      el.style.width=cs+&#x27;px&#x27;; el.style.height=cs+&#x27;px&#x27;; el.style.fontSize=&#x27;15px&#x27;;
      el.style.background=f.color; el.textContent=f.emoji;
      nextBox.appendChild(el);
    });
  }

  function step(){
    if(!piece) return;
    var moved={type:piece.type,cells:piece.cells,x:piece.x,y:piece.y+1};
    if(collides(moved)){
      lock(); clearRows();
      if(!spawn()){ endGame(); paint(); return; }
    } else { piece.y++; }
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    var moved={type:piece.type,cells:piece.cells,x:piece.x+dx,y:piece.y};
    if(!collides(moved)){ piece.x+=dx; paint(); }
  }

  function restartTimer(){ if(dropId) clearInterval(dropId); if(running) dropId=setInterval(step,dropMs); }

  function endGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} goScore.textContent=&#x27;Score: &#x27;+score; overlay.classList.add(&#x27;show&#x27;); beep(200,0.4,&#x27;sawtooth&#x27;); }

  function startGame(){
    initAudio();
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; level=1; dropMs=500;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    newGrid();
    nextType=TYPES[Math.floor(Math.random()*TYPES.length)];
    if(!spawn()){ return; }
    paint();
    running=true;
    if(dropId) clearInterval(dropId);
    dropId=setInterval(step,dropMs);
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(!running) return;
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ step(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ if(piece){rotate(piece);paint();} e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static view
  newGrid();
  nextType=TYPES[Math.floor(Math.random()*TYPES.length)];
  piece=makePiece(nextType);
  nextType=TYPES[Math.floor(Math.random()*TYPES.length)];
  drawNext();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the

  <div class="controls">

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });

  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

    if (!e || !e.data || e.data.type !== 'game_size') return;

  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
