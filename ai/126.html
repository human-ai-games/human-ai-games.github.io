<div class="wrap">

&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #7ec8e3; color: #123; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .hud .lvl { color: #b8860b; }
  .stage { display: flex; gap: 14px; align-items: flex-start; }
  .field-wrap { position: relative; padding: 10px; border-radius: 14px;
    background: repeating-linear-gradient(45deg, #1e7d34, #1e7d34 10px, #176b2b 10px, #176b2b 20px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
  .field { position: relative; background: linear-gradient(#bfe9ff, #9bd8f5); border-radius: 8px; overflow: hidden; }
  .block { position: absolute; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid rgba(255,255,255,0.55); }
  .active { animation: pulseGlow 0.7s ease-in-out infinite alternate; z-index: 3; }
  @keyframes pulseGlow {
    from { box-shadow: 0 0 2px rgba(255,255,255,0.6); }

  .side { display: flex; flex-direction: column; gap: 10px; }
  .panel { background: rgba(255,255,255,0.75); border: 2px solid #1e7d34; border-radius: 10px; padding: 8px 10px; font-size: 15px; color: #14532d; font-weight: 600; text-align: center; }
  .next { width: 96px; height: 96px; position: relative; margin: 4px auto 0; }
  .flash { animation: rowFlash 0.35s ease-out; }
  @keyframes rowFlash { 0%{background:#fff;filter:brightness(2);} 100%{opacity:0;} }
  .star { position: absolute; font-size: 14px; pointer-events: none; z-index: 6; animation: starFly 0.6s ease-out forwards; }
  @keyframes starFly { from { opacity:1; transform: translate(0,0) scale(1);} to { opacity:0; transform: translate(var(--dx), var(--dy)) scale(0.3);} }
  .popup { position: absolute; font-size: 24px; font-weight: 900; color: gold; text-shadow: 1px 1px 3px #000; pointer-events: none; z-index: 7; animation: popFloat 1s ease-out forwards; }
  @keyframes popFloat { from{opacity:1;transform:translateY(0) scale(1);} to{opacity:0;transform:translateY(-60px) scale(1.4);} }
  .combo { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 900; pointer-events: none; z-index: 8;
    background: linear-gradient(90deg,#f00,#f80,#ff0,#0f0,#08f,#a0f); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 8px rgba(255,255,255,0.7);
    animation: comboPop 1.1s ease-out forwards; white-space: nowrap; }
  @keyframes comboPop { 0%{opacity:0;transform:translateX(-50%) scale(0.4);} 25%{opacity:1;transform:translateX(-50%) scale(1.2);} 80%{opacity:1;transform:translateX(-50%) scale(1);} 100%{opacity:0;} }
  .overlay { position: absolute; inset: 0; background: rgba(30,30,30,0.55); border-radius: 8px; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 30px; font-weight: 900; }
  .overlay .em { font-size: 40px; margin: 6px 0; }
  .greyed { filter: grayscale(0.85) brightness(0.7); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍓 Fruit Drop Frenzy 🍉&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with &lt;strong&gt;←/→&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, and slam down with &lt;strong&gt;Space&lt;/strong&gt; or &lt;strong&gt;↓&lt;/strong&gt;. Clear full rows for points and stack up combos before the minute runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;lvl&quot;&gt;Level: &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;⏱ &lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;div class=&quot;field-wrap&quot;&gt;
      &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;div class=&quot;em&quot; id=&quot;ovem&quot;&gt;🍓🍊🍌🍇🍉&lt;/div&gt;
        &lt;div class=&quot;big&quot;&gt;Game Over!&lt;/div&gt;
        &lt;div class=&quot;big&quot; id=&quot;ovscore&quot;&gt;Score: 0&lt;/div&gt;
        &lt;div style=&quot;font-size:15px;margin-top:8px;&quot;&gt;Press Restart below to play again&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;NEXT&lt;div class=&quot;next&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot; id=&quot;best&quot;&gt;Best: 0&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 18;
  var FIELD_W = COLS*CELL, FIELD_H = ROWS*CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  var nextBox = document.getElementById(&#x27;next&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var ovscore = document.getElementById(&#x27;ovscore&#x27;);
  field.style.width = FIELD_W+&#x27;px&#x27;;
  field.style.height = FIELD_H+&#x27;px&#x27;;

  var FRUITS = {
    I: { color:&#x27;#ff6b6b&#x27;, emoji:&#x27;🍓&#x27; },   // strawberry
    O: { color:&#x27;#ffb347&#x27;, emoji:&#x27;🍊&#x27; },   // orange
    T: { color:&#x27;#ffe14d&#x27;, emoji:&#x27;🍌&#x27; },   // banana
    S: { color:&#x27;#9b59d0&#x27;, emoji:&#x27;🍇&#x27; },   // grape
    Z: { color:&#x27;#e74c3c&#x27;, emoji:&#x27;🍒&#x27; },   // cherry
    L: { color:&#x27;#2ecc71&#x27;, emoji:&#x27;🍏&#x27; },   // green apple
    J: { color:&#x27;#43c6ac&#x27;, emoji:&#x27;🍉&#x27; }    // watermelon
  };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]]
  };
  var KEYS = [&#x27;I&#x27;,&#x27;O&#x27;,&#x27;T&#x27;,&#x27;S&#x27;,&#x27;Z&#x27;,&#x27;L&#x27;,&#x27;J&#x27;];

  var grid, piece, nextType, score, level, running, dropId, timerId, timeLeft, best=0;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function makePiece(type){
    var cells = SHAPES[type].map(function(p){return {x:p[0],y:p[1]};});
    return { type:type, cells:cells, ox:3, oy:-1 };
  }
  function absCells(p){ return p.cells.map(function(c){return {x:p.ox+c.x,y:p.oy+c.y};}); }

  function collides(p){
    var a=absCells(p);
    for(var i=0;i&lt;a.length;i++){
      var x=a[i].x,y=a[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function rotate(p){
    if(p.type===&#x27;O&#x27;) return;
    var rc = p.cells.map(function(c){return {x:-(c.y-1)+1, y:(c.x-1)+1};}); // 90deg
    // simpler: rotate around approx center
    var nc = p.cells.map(function(c){return {x: c.y, y: (maxDim(p)-c.x)};});
    var test={type:p.type,cells:nc,ox:p.ox,oy:p.oy};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.ox=p.ox+kicks[k];
      if(!collides(test)){ p.cells=nc; p.ox=test.ox; return; }
    }
  }
  function maxDim(p){ var m=0; for(var i=0;i&lt;p.cells.length;i++){ m=Math.max(m,p.cells[i].x,p.cells[i].y);} return m; }

  function spawn(){
    piece = makePiece(nextType||randType());
    nextType = randType();
    drawNext();
    if(collides(piece)){ return false; }
    return true;
  }
  function randType(){ return KEYS[Math.floor(Math.random()*KEYS.length)]; }

  function ghostPos(){
    var g={type:piece.type,cells:piece.cells,ox:piece.ox,oy:piece.oy};
    while(!collides({type:g.type,cells:g.cells,ox:g.ox,oy:g.oy+1})) g.oy++;
    return g;
  }

  function lock(){
    var a=absCells(piece);
    for(var i=0;i&lt;a.length;i++){ if(a[i].y&gt;=0) grid[a[i].y][a[i].x]=piece.type; }
    piece=null;
    var cleared=clearRows();
    if(!spawn()){ endGame(); return; }
    render();
    if(cleared&gt;0) scoreClear(cleared);
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    if(full.length===0) return 0;
    full.forEach(function(r){ flashRow(r); });
    // remove
    full.sort(function(a,b){return a-b;});
    for(var i=full.length-1;i&gt;=0;i--){
      grid.splice(full[i],1);
      var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
      grid.unshift(empty);
    }
    return full.length;
  }

  var POINTS={1:10,2:30,3:60,4:100};
  function scoreClear(n){
    var pts=POINTS[n]||100;
    var old=level;
    score+=pts; scoreEl.textContent=score;
    level=Math.floor(score/20)+1; levelEl.textContent=level;
    if(level!==old) restartDropInterval();
    popup(pts);
    if(n&gt;=2) comboBanner(n);
  }

  function popup(pts){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;popup&#x27;;
    el.textContent=&#x27;+&#x27;+pts;
    el.style.left=(FIELD_W/2-20)+&#x27;px&#x27;; el.style.top=(FIELD_H/2)+&#x27;px&#x27;;
    field.appendChild(el);
    setTimeout(function(){ el.remove(); },1000);
  }
  function comboBanner(n){
    var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;combo&#x27;;
    el.textContent=(n===4?&#x27;FRENZY!&#x27;:&#x27;COMBO x&#x27;+n);
    field.appendChild(el);
    setTimeout(function(){ el.remove(); },1100);
  }
  function flashRow(r){
    for(var c=0;c&lt;COLS;c++){
      var f=document.createElement(&#x27;div&#x27;); f.className=&#x27;block flash&#x27;;
      f.style.left=(c*CELL)+&#x27;px&#x27;; f.style.top=(r*CELL)+&#x27;px&#x27;;
      f.style.width=CELL+&#x27;px&#x27;; f.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(f);
      (function(fe){ setTimeout(function(){fe.remove();},350); })(f);
      // stars
      for(var s=0;s&lt;2;s++){
        var st=document.createElement(&#x27;div&#x27;); st.className=&#x27;star&#x27;; st.textContent=&#x27;⭐&#x27;;
        st.style.left=(c*CELL+CELL/2-7)+&#x27;px&#x27;; st.style.top=(r*CELL+CELL/2-7)+&#x27;px&#x27;;
        st.style.setProperty(&#x27;--dx&#x27;,(Math.random()*40-20)+&#x27;px&#x27;);
        st.style.setProperty(&#x27;--dy&#x27;,(-20-Math.random()*30)+&#x27;px&#x27;);
        field.appendChild(st);
        (function(se){ setTimeout(function(){se.remove();},600); })(st);
      }
    }
  }

  function mkBlock(x,y,type,cls){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block&#x27;+(cls?&#x27; &#x27;+cls:&#x27;&#x27;);
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=FRUITS[type].color;
    el.textContent=FRUITS[type].emoji;
    return el;
  }

  function render(){
    // remove only permanent block layers, keep effects
    var olds=field.querySelectorAll(&#x27;.gblock&#x27;);
    for(var i=0;i&lt;olds.length;i++) olds[i].remove();
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++){
      if(grid[r][c]){ var b=mkBlock(c,r,grid[r][c]); b.classList.add(&#x27;gblock&#x27;); field.appendChild(b); }
    }
    if(piece){
      var g=ghostPos();
      absCells(g).forEach(function(cl){ if(cl.y&gt;=0){ var b=mkBlock(cl.x,cl.y,piece.type,&#x27;ghost&#x27;); b.classList.add(&#x27;gblock&#x27;); field.appendChild(b);} });
      absCells(piece).forEach(function(cl){ if(cl.y&gt;=0){ var b=mkBlock(cl.x,cl.y,piece.type,&#x27;active&#x27;); b.classList.add(&#x27;gblock&#x27;); field.appendChild(b);} });
    }
  }

  function drawNext(){
    nextBox.innerHTML=&#x27;&#x27;;
    if(!nextType) return;
    var cells=SHAPES[nextType];
    var minx=99,miny=99;
    cells.forEach(function(p){minx=Math.min(minx,p[0]);miny=Math.min(miny,p[1]);});
    cells.forEach(function(p){
      var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;block&#x27;;
      b.style.position=&#x27;absolute&#x27;;
      b.style.left=((p[0]-minx)*22+8)+&#x27;px&#x27;; b.style.top=((p[1]-miny)*22+8)+&#x27;px&#x27;;
      b.style.width=&#x27;22px&#x27;; b.style.height=&#x27;22px&#x27;;
      b.style.background=FRUITS[nextType].color; b.textContent=FRUITS[nextType].emoji;
      nextBox.appendChild(b);
    });
  }

  function step(){
    if(!piece) return;
    var down={type:piece.type,cells:piece.cells,ox:piece.ox,oy:piece.oy+1};
    if(collides(down)){ lock(); }
    else { piece.oy++; render(); }
  }

  function hardDrop(){
    if(!piece) return;
    while(!collides({type:piece.type,cells:piece.cells,ox:piece.ox,oy:piece.oy+1})) piece.oy++;
    lock();
  }

  function dropInterval(){ return Math.max(120, 550 - (level-1)*45); }
  function restartDropInterval(){ if(dropId) clearInterval(dropId); dropId=setInterval(step, dropInterval()); }

  function endGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(timerId){clearInterval(timerId);timerId=null;}
    if(score&gt;best){best=score; bestEl.textContent=&#x27;Best: &#x27;+best;}
    ovscore.textContent=&#x27;Score: &#x27;+score;
    overlay.classList.add(&#x27;show&#x27;);
    field.classList.add(&#x27;greyed&#x27;);
  }

  function startGame(){
    if(dropId){clearInterval(dropId);dropId=null;}
    if(timerId){clearInterval(timerId);timerId=null;}
    overlay.classList.remove(&#x27;show&#x27;);
    field.classList.remove(&#x27;greyed&#x27;);
    newGrid();
    score=0; level=1; timeLeft=60;
    scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;; timeEl.textContent=&#x27;60&#x27;;
    nextType=randType();
    running=true;
    spawn(); render();
    dropId=setInterval(step, dropInterval());
    timerId=setInterval(function(){
      timeLeft--; timeEl.textContent=timeLeft;
      if(timeLeft&lt;=0) endGame();
    },1000);
  }
  function stopGame(){
    running=false;
    if(dropId){clearInterval(dropId);dropId=null;}
    if(timerId){clearInterval(timerId);timerId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(!running) { if([&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;,&#x27;ArrowUp&#x27;,&#x27;ArrowDown&#x27;,&#x27; &#x27;].indexOf(e.key)&gt;=0) e.preventDefault(); return; }
    if(!piece) return;
    if(e.key===&#x27;ArrowLeft&#x27;){ var m={type:piece.type,cells:piece.cells,ox:piece.ox-1,oy:piece.oy}; if(!collides(m)){piece.ox--;render();} e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ var m2={type:piece.type,cells:piece.cells,ox:piece.ox+1,oy:piece.oy}; if(!collides(m2)){piece.ox++;render();} e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(piece); render(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ step(); e.preventDefault(); }
    else if(e.key===&#x27; &#x27;){ hardDrop(); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial static preview
  newGrid();
  nextType=randType();
  piece=makePiece(&#x27;T&#x27;); piece.oy=1;
  render(); drawNext();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;

  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);

</script>
