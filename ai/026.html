&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with arrow keys (or the buttons below) to eat pickups and grow. Grab stars, chase the timed pink gems, and intercept the bouncing lightning bolt for big points.&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;arena-wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;GAME OVER&lt;small id=&quot;finalScore&quot;&gt;&lt;/small&gt;&lt;small&gt;Press Restart below&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;⭐ Star +1 (speeds up)&lt;/span&gt;
    &lt;span&gt;💎 Gem +3 (5s timer)&lt;/span&gt;
    &lt;span&gt;⚡ Bolt +5 (bouncing)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pad&quot;&gt;
    &lt;button class=&quot;up&quot; data-dir=&quot;up&quot;&gt;▲&lt;/button&gt;
    &lt;button class=&quot;left&quot; data-dir=&quot;left&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;down&quot; data-dir=&quot;down&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;right&quot; data-dir=&quot;right&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var CELL=20, COLS=30, ROWS=22, W=COLS*CELL, H=ROWS*CELL;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;);
var overEl=document.getElementById(&#x27;over&#x27;), finalEl=document.getElementById(&#x27;finalScore&#x27;);

var running=false, gameOver=false, rafId=null, lastTime=0, acc=0;
var stepMs=140; // current speed
var snake, dir, pendingDir, score, particles, pulse, shake, deadFlash;
var star, gem, bolt;
var comboCount=0, comboTimer=0;

function reset(){
  snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11},{x:3,y:11}];
  dir={x:1,y:0}; pendingDir={x:1,y:0};
  score=0; scoreEl.textContent=&#x27;0&#x27;;
  stepMs=140; acc=0;
  particles=[]; pulse=0; shake=0; deadFlash=0;
  comboCount=0; comboTimer=0; comboEl.classList.remove(&#x27;show&#x27;);
  gameOver=false; overEl.classList.remove(&#x27;show&#x27;); cv.classList.remove(&#x27;dead&#x27;);
  star=spawnStar(); gem=null; bolt=spawnBolt();
  gemSpawnTimer=3000;
}
var gemSpawnTimer=3000;

function occupied(x,y){
  for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  return false;
}
function freeCell(){
  for(var t=0;t&lt;300;t++){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if(!occupied(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}
function spawnStar(){ var c=freeCell(); return {x:c.x,y:c.y}; }
function spawnGem(){ var c=freeCell(); return {x:c.x,y:c.y,life:5000}; }
function spawnBolt(){
  var c=freeCell();
  var dirs=[[1,1],[1,-1],[-1,1],[-1,-1]];
  var d=dirs[Math.floor(Math.random()*4)];
  return {x:c.x+0.5,y:c.y+0.5,vx:d[0],vy:d[1],move:0};
}

function burst(cx,cy,color){
  for(var i=0;i&lt;16;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*3;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function popScore(){ scoreEl.parentElement.classList.add(&#x27;pop&#x27;); setTimeout(function(){scoreEl.parentElement.classList.remove(&#x27;pop&#x27;);},90); }
function showCombo(){
  if(comboCount&gt;=2){ comboEl.textContent=&#x27;COMBO x&#x27;+comboCount; comboEl.classList.add(&#x27;show&#x27;); }
}
function addCombo(){
  comboCount++; comboTimer=2000; showCombo();
}

function eat(points,cx,cy,color,speedUp){
  score+=points; scoreEl.textContent=score; popScore();
  burst(cx,cy,color); pulse=1;
  if(speedUp &amp;&amp; stepMs&gt;65) stepMs-=6;
}

function tickStep(){
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0];
  var nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
  for(var i=0;i&lt;snake.length-1;i++) if(snake[i].x===nx&amp;&amp;snake[i].y===ny){ die(); return; }
  snake.unshift({x:nx,y:ny});
  var grew=false;

  // star
  if(star &amp;&amp; nx===star.x &amp;&amp; ny===star.y){
    eat(1,nx,ny,&#x27;#ffe14d&#x27;,true); star=spawnStar(); grew=true;
  }
  // gem
  if(gem &amp;&amp; nx===gem.x &amp;&amp; ny===gem.y){
    eat(3,nx,ny,&#x27;#ff4bd8&#x27;,false); addCombo();
    if(comboCount&gt;=2) score+=1*comboCount, scoreEl.textContent=score;
    gem=null; gemSpawnTimer=2500+Math.random()*3000; grew=true;
  }
  // bolt (compare to cell it occupies)
  if(bolt &amp;&amp; Math.floor(bolt.x)===nx &amp;&amp; Math.floor(bolt.y)===ny){
    eat(5,nx,ny,&#x27;#ff9b2a&#x27;,false); addCombo();
    if(comboCount&gt;=2) score+=2*comboCount, scoreEl.textContent=score;
    bolt=spawnBolt(); grew=true;
  }
  if(!grew) snake.pop();
}

function die(){
  gameOver=true; running=false; deadFlash=1; shake=14;
  cv.classList.add(&#x27;dead&#x27;);
  finalEl.textContent=&#x27;Final score: &#x27;+score;
  overEl.classList.add(&#x27;show&#x27;);
}

function update(dt){
  // particles
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.9; p.vy*=0.9; p.life-=dt/500;
    if(p.life&lt;=0) particles.splice(i,1);
  }
  if(pulse&gt;0) pulse=Math.max(0,pulse-dt/600);
  if(shake&gt;0) shake=Math.max(0,shake-dt/16);
  if(deadFlash&gt;0) deadFlash=Math.max(0,deadFlash-dt/1000);

  if(gameOver){ return; }

  // combo decay
  if(comboTimer&gt;0){ comboTimer-=dt; if(comboTimer&lt;=0){ comboCount=0; comboEl.classList.remove(&#x27;show&#x27;); } }

  // gem timer
  if(gem){ gem.life-=dt; if(gem.life&lt;=0){ gem=null; gemSpawnTimer=2000+Math.random()*3000; } }
  else { gemSpawnTimer-=dt; if(gemSpawnTimer&lt;=0){ gem=spawnGem(); } }

  // bolt movement (continuous)
  if(bolt){
    var boltSpeed=0.9; // cells per second-ish scaled
    bolt.x+=bolt.vx*boltSpeed*dt/300;
    bolt.y+=bolt.vy*boltSpeed*dt/300;
    if(bolt.x&lt;0.5){ bolt.x=0.5; bolt.vx*=-1; }
    if(bolt.x&gt;COLS-0.5){ bolt.x=COLS-0.5; bolt.vx*=-1; }
    if(bolt.y&lt;0.5){ bolt.y=0.5; bolt.vy*=-1; }
    if(bolt.y&gt;ROWS-0.5){ bolt.y=ROWS-0.5; bolt.vy*=-1; }
  }

  // snake step
  acc+=dt;
  while(acc&gt;=stepMs){ acc-=stepMs; tickStep(); if(gameOver) break; }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  var sx=0, sy=0;
  if(shake&gt;0){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; }
  ctx.save(); ctx.translate(sx,sy);

  // background
  ctx.fillStyle=&#x27;#070a18&#x27;; ctx.fillRect(-20,-20,W+40,H+40);
  // grid pulse
  var gp=0.06+pulse*0.22;
  ctx.strokeStyle=&#x27;rgba(90,150,255,&#x27;+gp+&#x27;)&#x27;; ctx.lineWidth=1;
  for(var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
  for(var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }

  var bob=Math.sin(t/300)*2;
  var rot=t/400;

  // star
  if(star) drawStar(star.x*CELL+CELL/2, star.y*CELL+CELL/2+bob, 8, rot);
  // gem
  if(gem){
    var scale=Math.min(1, gem.life/1500);
    var flash=0.5+0.5*Math.sin(t/120);
    drawGem(gem.x*CELL+CELL/2, gem.y*CELL+CELL/2+bob, 8*scale, flash);
  }
  // bolt
  if(bolt) drawBolt(bolt.x*CELL, bolt.y*CELL+bob, t);

  // snake ribbon
  for(var i=snake.length-1;i&gt;=0;i--){
    var seg=snake[i];
    var f=i/Math.max(1,snake.length-1);
    // gradient head cyan -&gt; body blue -&gt; tail purple
    var col=lerpColor([0,234,255],[122,60,255],f);
    var cx=seg.x*CELL+CELL/2, cy=seg.y*CELL+CELL/2;
    ctx.shadowColor=&#x27;rgba(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;,0.9)&#x27;;
    ctx.shadowBlur=i===0?18:10;
    ctx.fillStyle=&#x27;rgb(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;)&#x27;;
    var pad=i===0?2:3;
    roundRect(seg.x*CELL+pad,seg.y*CELL+pad,CELL-pad*2,CELL-pad*2,5); ctx.fill();
    ctx.shadowBlur=0;
    if(i===0){
      // eyes
      ctx.fillStyle=&#x27;#02121a&#x27;;
      ctx.beginPath(); ctx.arc(cx-3+dir.x*2,cy-3+dir.y*2,1.8,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+3+dir.x*2,cy+3+dir.y*2,1.8,0,7); ctx.fill();
    }
  }

  // particles
  for(var i=0;i&lt;particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x*CELL+CELL/2,p.y*CELL+CELL/2,2.5,0,7); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;

  // border
  var borderCol = deadFlash&gt;0 ? &#x27;rgba(255,42,77,&#x27;+(0.6+0.4*Math.sin(t/60))+&#x27;)&#x27; : &#x27;rgba(60,120,255,&#x27;+(0.4+pulse*0.5)+&#x27;)&#x27;;
  ctx.strokeStyle=borderCol; ctx.lineWidth=3;
  roundRect(1.5,1.5,W-3,H-3,8); ctx.stroke();

  if(deadFlash&gt;0){
    // cracked lines
    ctx.strokeStyle=&#x27;rgba(255,60,90,&#x27;+deadFlash+&#x27;)&#x27;; ctx.lineWidth=2;
    for(var k=0;k&lt;6;k++){
      ctx.beginPath(); ctx.moveTo(W/2,H/2);
      ctx.lineTo(W/2+Math.cos(k*1.05)*W*0.6*(0.4+0.6*Math.random()), H/2+Math.sin(k*1.05)*H*0.6);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function lerpColor(a,b,t){ return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)]; }

function drawStar(cx,cy,r,rot){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.fillStyle=&#x27;#ffe14d&#x27;; ctx.shadowColor=&#x27;#ffe14d&#x27;; ctx.shadowBlur=14;
  ctx.beginPath();
  for(var i=0;i&lt;10;i++){ var rad=i%2?r*0.45:r; var a=i*Math.PI/5-Math.PI/2;
    ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
  ctx.closePath(); ctx.fill(); ctx.restore(); ctx.shadowBlur=0;
}
function drawGem(cx,cy,r,flash){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle=&#x27;rgba(255,75,216,&#x27;+(0.7+0.3*flash)+&#x27;)&#x27;; ctx.shadowColor=&#x27;#ff4bd8&#x27;; ctx.shadowBlur=16;
  ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r,-r*0.2); ctx.lineTo(r*0.6,r); ctx.lineTo(-r*0.6,r); ctx.lineTo(-r,-r*0.2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=&#x27;rgba(255,255,255,&#x27;+flash+&#x27;)&#x27;; ctx.lineWidth=1; ctx.stroke();
  ctx.restore(); ctx.shadowBlur=0;
}
function drawBolt(cx,cy,t){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle=&#x27;#ff9b2a&#x27;; ctx.shadowColor=&#x27;#ffb84d&#x27;; ctx.shadowBlur=18+6*Math.sin(t/100);
  ctx.beginPath();
  ctx.moveTo(2,-9); ctx.lineTo(-4,1); ctx.lineTo(0,1); ctx.lineTo(-2,9);
  ctx.lineTo(5,-2); ctx.lineTo(0,-2); ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}

function loop(t){
  if(!lastTime) lastTime=t;
  var dt=Math.min(60,t-lastTime); lastTime=t;
  if(running || particles.length || deadFlash&gt;0 || shake&gt;0) update(dt);
  draw(t);
  rafId=requestAnimationFrame(loop);
}

function setDir(d){
  var map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  var nd=map[d]; if(!nd) return;
  if(nd.x===-dir.x&amp;&amp;nd.y===-dir.y) return;
  pendingDir=nd;
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ setDir(&#x27;left&#x27;); e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ setDir(&#x27;right&#x27;); e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ setDir(&#x27;up&#x27;); e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ setDir(&#x27;down&#x27;); e.preventDefault(); }
});
document.querySelectorAll(&#x27;.pad button&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){ setDir(b.getAttribute(&#x27;data-dir&#x27;)); });
});

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;){ reset(); running=true; lastTime=0; }
  else if(e.data.type===&#x27;wd_stop&#x27;){ running=false; }
});

// initial static paint
reset(); running=false;
draw(0);
rafId=requestAnimationFrame(loop);
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the

<script>

  var iframe = document.getElementById('game');

    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
