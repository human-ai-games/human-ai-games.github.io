&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and drop faster with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Fill a whole row to pop it for points — use the Start/Restart button below!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;SCORE&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;label&quot;&gt;LEVEL&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;level&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 30, COLS = 10, ROWS = 16;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  field.style.width = FIELD_W + &#x27;px&#x27;;
  field.style.height = FIELD_H + &#x27;px&#x27;;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);

  // Tetromino definitions with fruit + color
  var FRUITS = {
    I: { e: &#x27;🍌&#x27;, c: &#x27;#ffd94a&#x27;, cells: [[0,1],[1,1],[2,1],[3,1]] },
    O: { e: &#x27;🍊&#x27;, c: &#x27;#ff9d3a&#x27;, cells: [[1,0],[2,0],[1,1],[2,1]] },
    T: { e: &#x27;🍇&#x27;, c: &#x27;#b06fe0&#x27;, cells: [[1,0],[0,1],[1,1],[2,1]] },
    S: { e: &#x27;🍏&#x27;, c: &#x27;#8fd94a&#x27;, cells: [[1,0],[2,0],[0,1],[1,1]] },
    Z: { e: &#x27;🍎&#x27;, c: &#x27;#ff5a6a&#x27;, cells: [[0,0],[1,0],[1,1],[2,1]] },
    J: { e: &#x27;🫐&#x27;, c: &#x27;#5a8fff&#x27;, cells: [[0,0],[0,1],[1,1],[2,1]] },
    L: { e: &#x27;🍓&#x27;, c: &#x27;#ff4a8a&#x27;, cells: [[2,0],[0,1],[1,1],[2,1]] }
  };
  var TYPES = Object.keys(FRUITS);

  var grid = [], piece = null, score = 0, level = 1, running = false;
  var dropId = null, speedId = null, dropMs = 600, elapsed = 0;

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) { var row = []; for (var c = 0; c &lt; COLS; c++) row.push(null); grid.push(row); }
  }

  function makePiece(type) {
    return { type: type, x: 3, y: -1, rot: 0 };
  }

  // rotate cells 90deg within their bounding box (max 4x4)
  function rotatedCells(type, rot) {
    var base = FRUITS[type].cells;
    var cells = base.map(function(c){ return [c[0], c[1]]; });
    for (var i = 0; i &lt; (rot % 4 + 4) % 4; i++) {
      cells = cells.map(function(c){ return [3 - c[1], c[0]]; });
    }
    return cells;
  }

  function pieceCells(p) {
    return rotatedCells(p.type, p.rot).map(function(c){ return { x: p.x + c[0], y: p.y + c[1] }; });
  }

  function collides(p) {
    var cells = pieceCells(p);
    for (var i = 0; i &lt; cells.length; i++) {
      var cx = cells[i].x, cy = cells[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }

  function spawnPiece() {
    var t = TYPES[Math.floor(Math.random() * TYPES.length)];
    piece = makePiece(t);
    // center-ish adjust
    if (collides(piece)) return false;
    return true;
  }

  function lockPiece() {
    var cells = pieceCells(piece);
    for (var i = 0; i &lt; cells.length; i++) {
      var c = cells[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.type;
    }
    piece = null;
  }

  function ghostPiece() {
    if (!piece) return null;
    var g = { type: piece.type, x: piece.x, y: piece.y, rot: piece.rot };
    while (!collides({ type: g.type, x: g.x, y: g.y + 1, rot: g.rot })) g.y++;
    return g;
  }

  function clearFullRows() {
    var full = [];
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var isFull = true;
      for (var c = 0; c &lt; COLS; c++) if (!grid[r][c]) { isFull = false; break; }
      if (isFull) full.push(r);
    }
    var n = full.length;
    if (n === 0) return;
    // flash effect on cleared rows
    flashRows(full);
    // remove
    full.sort(function(a,b){ return a-b; });
    for (var i = full.length - 1; i &gt;= 0; i--) {
      grid.splice(full[i], 1);
      var empty = []; for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(null);
      grid.unshift(empty);
    }
    var mult = n &gt;= 4 ? 8 : n === 3 ? 4 : n === 2 ? 2 : 1;
    var pts = 100 * n * mult;
    score += pts;
    scoreEl.textContent = score;
    showPop(&#x27;+&#x27; + pts + &#x27; pts!&#x27; + (mult &gt; 1 ? &#x27; x&#x27; + mult : &#x27;&#x27;));
  }

  function flashRows(rows) {
    rows.forEach(function(r){
      var f = document.createElement(&#x27;div&#x27;);
      f.className = &#x27;cell flash&#x27;;
      f.style.left = &#x27;0px&#x27;; f.style.top = (r * CELL) + &#x27;px&#x27;;
      f.style.width = FIELD_W + &#x27;px&#x27;; f.style.height = CELL + &#x27;px&#x27;;
      field.appendChild(f);
      setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 400);
    });
  }

  function showPop(text) {
    var p = document.createElement(&#x27;div&#x27;);
    p.className = &#x27;pop&#x27;;
    p.textContent = text;
    p.style.left = &#x27;50%&#x27;; p.style.top = (FIELD_H * 0.4) + &#x27;px&#x27;;
    p.style.transform = &#x27;translateX(-50%)&#x27;;
    field.appendChild(p);
    setTimeout(function(){ if (p.parentNode) p.parentNode.removeChild(p); }, 1000);
  }

  function drawBlock(cx, cy, type, cls) {
    if (cy &lt; 0) return;
    var f = FRUITS[type];
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + (cls || &#x27;filled&#x27;);
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = f.c;
    el.style.fontSize = (CELL - 8) + &#x27;px&#x27;;
    el.textContent = f.e;
    field.appendChild(el);
  }

  function paint() {
    field.innerHTML = &#x27;&#x27;;
    // background grid cells
    for (var r = 0; r &lt; ROWS; r++) for (var c = 0; c &lt; COLS; c++) {
      var bg = document.createElement(&#x27;div&#x27;);
      bg.className = &#x27;grid-bg&#x27;;
      bg.style.left = (c*CELL+2)+&#x27;px&#x27;; bg.style.top = (r*CELL+2)+&#x27;px&#x27;;
      bg.style.width = (CELL-4)+&#x27;px&#x27;; bg.style.height = (CELL-4)+&#x27;px&#x27;;
      field.appendChild(bg);
    }
    for (var r2 = 0; r2 &lt; ROWS; r2++) for (var c2 = 0; c2 &lt; COLS; c2++) {
      if (grid[r2][c2]) drawBlock(c2, r2, grid[r2][c2]);
    }
    var g = ghostPiece();
    if (g) pieceCells(g).forEach(function(cc){ drawBlock(cc.x, cc.y, g.type, &#x27;cell ghost filled&#x27;); });
    if (piece) pieceCells(piece).forEach(function(cc){ drawBlock(cc.x, cc.y, piece.type); });
  }

  function stepDown() {
    if (!piece) return;
    var next = { type: piece.type, x: piece.x, y: piece.y + 1, rot: piece.rot };
    if (collides(next)) {
      lockPiece();
      clearFullRows();
      if (!spawnPiece()) { endGame(); return; }
    } else piece = next;
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var next = { type: piece.type, x: piece.x + dx, y: piece.y, rot: piece.rot };
    if (!collides(next)) { piece = next; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k &lt; kicks.length; k++) {
      var next = { type: piece.type, x: piece.x + kicks[k], y: piece.y, rot: piece.rot + 1 };
      if (!collides(next)) { piece = next; paint(); return; }
    }
  }

  function speedUp() {
    elapsed += 30;
    level++;
    levelEl.textContent = level;
    dropMs = Math.max(120, dropMs - 70);
    if (dropId) { clearInterval(dropId); dropId = setInterval(stepDown, dropMs); }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (speedId) { clearInterval(speedId); speedId = null; }
    paint();
    var msg = score &gt;= 3000 ? &#x27;Fruit Frenzy!&#x27; : score &gt;= 1500 ? &#x27;Sweet Harvest!&#x27; :
              score &gt;= 500 ? &#x27;Juicy Effort!&#x27; : &#x27;Fruit Salad!&#x27;;
    var ov = document.createElement(&#x27;div&#x27;);
    ov.className = &#x27;overlay show&#x27;;
    ov.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;&#x27; + msg + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;fin&quot;&gt;Final Score: &#x27; + score + &#x27;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;hint&quot;&gt;Press Restart below to play again&lt;/div&gt;&#x27;;
    ov.id = &#x27;overlay&#x27;;
    field.appendChild(ov);
  }

  function startGame() {
    running = true;
    score = 0; level = 1; dropMs = 600; elapsed = 0;
    scoreEl.textContent = &#x27;0&#x27;; levelEl.textContent = &#x27;1&#x27;;
    newGrid();
    if (!spawnPiece()) return;
    paint();
    if (dropId) clearInterval(dropId);
    if (speedId) clearInterval(speedId);
    dropId = setInterval(stepDown, dropMs);
    speedId = setInterval(speedUp, 30000);
  }

  function stopGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    if (speedId) { clearInterval(speedId); speedId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial preview
  newGrid();
  piece = makePiece(&#x27;T&#x27;);
  piece.y = 1;
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
