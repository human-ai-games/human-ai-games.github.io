<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 FROGGY INFERNO 🔥</b></div>

&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0012; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#39ff14,#00e5ff,#ff2d95); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 12px rgba(57,255,20,.4); }
  .instructions { font-size: 16px; color: #b9a9d0; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; justify-content: space-between; width: 560px; max-width: 100%; }
  .lives { font-size: 22px; letter-spacing: 2px; filter: drop-shadow(0 0 4px #39ff14); }
  .score { font-size: 26px; font-weight: 800; color: #ffe14d; text-shadow: 0 0 10px rgba(255,225,77,.6); transition: transform .12s; }
  .combo { font-size: 15px; color: #ffcf33; min-width: 90px; text-align: right; }
  .field { position: relative; width: 560px; height: 480px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
           background: linear-gradient(#2a0d47,#1a0730); box-shadow: 0 0 30px rgba(120,0,180,.4); transition: background .6s; }
  .lane { position: absolute; left: 0; right: 0; }
  .road { background: rgba(20,20,28,.85); border-top: 1px dashed rgba(255,255,255,.12); border-bottom: 1px dashed rgba(255,255,255,.12); }
  .water { background: rgba(0,60,120,.4); }
  .goal { background: rgba(0,40,25,.6); }
  .safe { background: rgba(10,30,15,.5); }
  .sprite { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 30px; will-change: left; }
  .frog { position: absolute; font-size: 30px; z-index: 20; transition: left .08s, top .08s; filter: drop-shadow(0 0 6px #39ff14); }
  .frog.combo { filter: drop-shadow(0 0 10px gold); }
  .log { border-radius: 8px; }
  .pad { position: absolute; font-size: 30px; }
  .pad.lit { animation: burst .5s ease-out; }
  @keyframes burst { 0%{ transform: scale(1); filter: drop-shadow(0 0 0 gold);} 50%{ transform: scale(1.5); filter: drop-shadow(0 0 18px gold);} 100%{ transform: scale(1);} }
  .honk { animation: honk .3s ease-in-out 2; }
  @keyframes honk { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px) scale(1.15); filter: drop-shadow(0 0 8px yellow);} }
  .splash { position: absolute; font-size: 34px; z-index: 25; animation: splash .5s forwards; }
  @keyframes splash { 0%{ transform: scale(.6); opacity:1;} 100%{ transform: scale(2); opacity:0;} }
  .flash { position: absolute; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 40; }
  .flash.on { animation: rflash .4s; }
  @keyframes rflash { 0%{opacity:0;} 30%{opacity:.6;} 100%{opacity:0;} }
  .ribbon { position: absolute; top: 45%; left: 0; right: 0; transform: translateY(-50%); text-align: center; z-index: 50; display: none; }
  .ribbon.show { display: block; animation: pop .4s; }
  @keyframes pop { 0%{ transform: translateY(-50%) scale(.5); opacity:0;} 100%{ transform: translateY(-50%) scale(1); opacity:1;} }
  .ribbon .big { font-size: 40px; font-weight: 900; color: #ff2d95; text-shadow: 0 0 16px rgba(255,45,149,.7); }
  .ribbon .fin { font-size: 22px; color: #ffe14d; margin-top: 6px; }
  .frog.dying { animation: death 1s forwards; }
  @keyframes death { 0%{ transform: rotate(0) scale(1); opacity:1;} 100%{ transform: rotate(720deg) scale(0); opacity:0;} }
  .dpad { display: none; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 44px); gap: 4px; margin-top: 4px; }
  .dpad button { font-size: 22px; border: none; border-radius: 8px; background: #39ff14; color: #04220a; font-weight: 800; }
  .dpad .up { grid-column: 2; } .dpad .lft { grid-column: 1; grid-row: 2; }
  .dpad .dn { grid-column: 2; grid-row: 2; } .dpad .rt { grid-column: 3; grid-row: 2; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 FROGGY INFERNO 🔥&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Use the arrow keys (or on-screen buttons) to hop your frog up across the road and river. Land on the glowing lily pads at the top to score — dodge cars and don&#x27;t fall in the water!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;🐸🐸🐸&lt;/div&gt;
    &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
    &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ribbon&quot; id=&quot;ribbon&quot;&gt;&lt;div class=&quot;big&quot;&gt;GAME OVER&lt;/div&gt;&lt;div class=&quot;fin&quot; id=&quot;fin&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;dpad&quot; id=&quot;dpad&quot;&gt;
    &lt;button class=&quot;up&quot; data-d=&quot;up&quot;&gt;▲&lt;/button&gt;
    &lt;button class=&quot;lft&quot; data-d=&quot;left&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;dn&quot; data-d=&quot;down&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;rt&quot; data-d=&quot;right&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FIELD_W = 560, FIELD_H = 480;
  var ROWS = 10;               // row 0 = goal(pads), 1-3 water, 4 safe median, 5-9 road (row9 start)
  var CELL = FIELD_H / ROWS;   // 48
  var COLW = 56;               // horizontal step for frog
  var COLS = Math.floor(FIELD_W / COLW); // 10
  var FROG = 30;

  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var livesEl = document.getElementById(&#x27;lives&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var ribbon = document.getElementById(&#x27;ribbon&#x27;);
  var finEl = document.getElementById(&#x27;fin&#x27;);

  var running = false, animId = null;
  var score = 0, lives = 3, combo = 0, streak = 0, level = 0;
  var frog = { x: 0, y: 0, col: 0, row: 0, onLog: null };
  var frogEl = null;
  var lanes = [];   // {row, type:&#x27;car&#x27;|&#x27;log&#x27;, y, dir, speed, sprites:[{x,w,el,emoji}]}
  var pads = [];    // goal row cells: {col, filled, el}

  // audio
  var actx = null;
  function beep(freq, dur, type){
    try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type=type||&#x27;square&#x27;; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.15,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
      o.start(); o.stop(actx.currentTime+dur);
    }catch(_){}
  }

  var CARS = [&#x27;🚗&#x27;,&#x27;🚙&#x27;,&#x27;🚕&#x27;,&#x27;🚚&#x27;,&#x27;🏍️&#x27;,&#x27;🚌&#x27;,&#x27;🚓&#x27;];

  function clearField(){
    var kids = Array.prototype.slice.call(field.querySelectorAll(&#x27;.sprite,.lane,.frog,.pad,.splash&#x27;));
    kids.forEach(function(k){ k.parentNode.removeChild(k); });
    lanes = []; pads = [];
  }

  function laneType(row){
    if(row===0) return &#x27;goal&#x27;;
    if(row&gt;=1 &amp;&amp; row&lt;=3) return &#x27;water&#x27;;
    if(row===4) return &#x27;safe&#x27;;
    return &#x27;road&#x27;;
  }

  function buildLevel(){
    clearField();
    // background lanes
    for(var r=0;r&lt;ROWS;r++){
      var t=laneType(r);
      var d=document.createElement(&#x27;div&#x27;);
      d.className=&#x27;lane &#x27;+(t===&#x27;goal&#x27;?&#x27;goal&#x27;:t===&#x27;water&#x27;?&#x27;water&#x27;:t===&#x27;safe&#x27;?&#x27;safe&#x27;:&#x27;road&#x27;);
      d.style.top=(r*CELL)+&#x27;px&#x27;; d.style.height=CELL+&#x27;px&#x27;;
      field.appendChild(d);
    }
    // goal pads
    var padCols=[1,3,5,7];
    padCols.forEach(function(c){
      var el=document.createElement(&#x27;div&#x27;); el.className=&#x27;pad&#x27;; el.textContent=&#x27;🌸&#x27;;
      el.style.top=(0*CELL+(CELL-FROG)/2)+&#x27;px&#x27;;
      el.style.left=(c*COLW+(COLW-FROG)/2)+&#x27;px&#x27;;
      field.appendChild(el);
      pads.push({col:c,filled:false,el:el});
    });

    var baseSpeed = 0.9 + level*0.22;
    // water lanes (logs)
    for(var wr=1; wr&lt;=3; wr++){
      makeLane(wr,&#x27;log&#x27;, baseSpeed*(0.7+((wr)%3)*0.15), (wr%2?1:-1));
    }
    // road lanes
    for(var rr=5; rr&lt;=9; rr++){
      makeLane(rr,&#x27;car&#x27;, baseSpeed*(0.8+((rr)%3)*0.25), (rr%2?1:-1));
    }
  }

  function makeLane(row,type,speed,dir){
    var y=row*CELL;
    var count = type===&#x27;log&#x27; ? 3 : 3;
    var lane={row:row,type:type,y:y,dir:dir,speed:speed,sprites:[]};
    var gap=FIELD_W/count;
    for(var i=0;i&lt;count;i++){
      var w = type===&#x27;log&#x27; ? COLW*1.6 : COLW*0.9;
      var el=document.createElement(&#x27;div&#x27;);
      el.className=&#x27;sprite &#x27;+(type===&#x27;log&#x27;?&#x27;log&#x27;:&#x27;car&#x27;);
      el.style.width=w+&#x27;px&#x27;; el.style.height=(CELL-8)+&#x27;px&#x27;;
      el.style.top=(y+4)+&#x27;px&#x27;;
      var emoji;
      if(type===&#x27;log&#x27;){ el.style.background=&#x27;linear-gradient(#7a4a1e,#5a3512)&#x27;; emoji=&#x27;🪵&#x27;; }
      else { emoji = dir&gt;0 ? CARS[(row+i)%CARS.length] : CARS[(row+i+2)%CARS.length]; }
      el.textContent=emoji;
      if(type===&#x27;car&#x27; &amp;&amp; dir&lt;0) el.style.transform=&#x27;scaleX(-1)&#x27;;
      var x=i*gap + (row*17)%gap;
      el.style.left=x+&#x27;px&#x27;;
      field.appendChild(el);
      lane.sprites.push({x:x,w:w,el:el,honking:false});
    }
    lanes.push(lane);
  }

  function makeFrog(){
    frogEl=document.createElement(&#x27;div&#x27;); frogEl.className=&#x27;frog&#x27;; frogEl.textContent=&#x27;🐸&#x27;;
    field.appendChild(frogEl);
  }
  function resetFrog(){
    frog.col=Math.floor(COLS/2); frog.row=ROWS-1; frog.onLog=null;
    frog.x=frog.col*COLW+(COLW-FROG)/2; frog.y=frog.row*CELL+(CELL-FROG)/2;
    paintFrog();
  }
  function paintFrog(){
    frogEl.style.left=frog.x+&#x27;px&#x27;; frogEl.style.top=frog.y+&#x27;px&#x27;;
  }

  function setBg(){
    var t=Math.min(level/8,1);
    var top=&#x27;hsl(&#x27;+(270-t*230)+&#x27;,80%,&#x27;+(22+t*8)+&#x27;%)&#x27;;
    var bot=&#x27;hsl(&#x27;+(280-t*260)+&#x27;,85%,&#x27;+(14+t*6)+&#x27;%)&#x27;;
    field.style.background=&#x27;linear-gradient(&#x27;+top+&#x27;,&#x27;+bot+&#x27;)&#x27;;
  }

  function updateHUD(){
    livesEl.textContent = lives&gt;0 ? &#x27;🐸&#x27;.repeat(lives) : &#x27;💀&#x27;;
    scoreEl.textContent = score;
    scoreEl.style.transform=&#x27;scale(1.3)&#x27;;
    setTimeout(function(){ scoreEl.style.transform=&#x27;scale(1)&#x27;; },120);
    comboEl.textContent = combo&gt;1 ? (&#x27;COMBO x&#x27;+combo) : &#x27;&#x27;;
  }

  function tick(){
    if(!running) return;
    var fcx=frog.x+FROG/2, fcy=frog.y+FROG/2;
    var frogRow=Math.round((frog.y-(CELL-FROG)/2)/CELL);

    for(var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i];
      for(var j=0;j&lt;lane.sprites.length;j++){
        var s=lane.sprites[j];
        s.x += lane.dir*lane.speed;
        if(lane.dir&gt;0 &amp;&amp; s.x&gt;FIELD_W) s.x=-s.w;
        else if(lane.dir&lt;0 &amp;&amp; s.x+s.w&lt;0) s.x=FIELD_W;
        s.el.style.left=s.x+&#x27;px&#x27;;
      }
    }

    // frog on a log? move with it
    if(frog.onLog){
      frog.x += frog.onLog.lane.dir*frog.onLog.lane.speed;
      if(frog.x &lt; -FROG || frog.x &gt; FIELD_W){ drown(); return; }
      frog.col = Math.round((frog.x-(COLW-FROG)/2)/COLW);
      paintFrog();
    }

    // collision logic based on row type
    if(frogRow&gt;=5 &amp;&amp; frogRow&lt;=9){
      // road: any car hit = death
      var lane2=laneForRow(frogRow);
      if(lane2){
        for(var k=0;k&lt;lane2.sprites.length;k++){
          var c=lane2.sprites[k];
          if(fcx&gt;c.x &amp;&amp; fcx&lt;c.x+c.w){ loseLife(); return; }
          // near miss honk
          if(!c.honking &amp;&amp; Math.abs((c.x+c.w/2)-fcx)&lt;c.w*0.9){
            c.honking=true; c.el.classList.add(&#x27;honk&#x27;);
            beep(520,.08,&#x27;sawtooth&#x27;);
            (function(cc){ setTimeout(function(){cc.el.classList.remove(&#x27;honk&#x27;); cc.honking=false;},600); })(c);
          }
        }
      }
    } else if(frogRow&gt;=1 &amp;&amp; frogRow&lt;=3){
      // water: must be on a log
      var lane3=laneForRow(frogRow);
      var riding=null;
      if(lane3){
        for(var m=0;m&lt;lane3.sprites.length;m++){
          var lg=lane3.sprites[m];
          if(fcx&gt;lg.x &amp;&amp; fcx&lt;lg.x+lg.w){ riding=lg; break; }
        }
      }
      if(riding){ frog.onLog={lane:lane3,sprite:riding}; }
      else { frog.onLog=null; drown(); return; }
    } else {
      frog.onLog=null;
    }

    animId=requestAnimationFrame(tick);
  }

  function laneForRow(row){
    for(var i=0;i&lt;lanes.length;i++) if(lanes[i].row===row) return lanes[i];
    return null;
  }

  function loseLife(){
    beep(140,.3,&#x27;sawtooth&#x27;);
    streak=0; combo=0;
    lives--; updateHUD();
    if(lives&lt;=0){ death(); return; }
    resetFrog();
  }

  function drown(){
    beep(200,.25,&#x27;sine&#x27;);
    var sp=document.createElement(&#x27;div&#x27;); sp.className=&#x27;splash&#x27;; sp.textContent=&#x27;💦&#x27;;
    sp.style.left=frog.x+&#x27;px&#x27;; sp.style.top=frog.y+&#x27;px&#x27;; field.appendChild(sp);
    setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },500);
    streak=0; combo=0;
    lives--; updateHUD();
    if(lives&lt;=0){ death(); return; }
    resetFrog();
  }

  function reachGoal(pad){
    beep(700,.12,&#x27;square&#x27;); beep(900,.12,&#x27;square&#x27;);
    pad.el.classList.add(&#x27;lit&#x27;);
    setTimeout(function(){ pad.el.classList.remove(&#x27;lit&#x27;); },500);
    streak++;
    if(streak&gt;=5){ combo=Math.min(combo&lt;2?2:combo+1,8); streak=0; frogEl.classList.add(&#x27;combo&#x27;); beep(1100,.2,&#x27;triangle&#x27;); }
    var mult = combo&gt;1?combo:1;
    score += 10*mult;
    // level up scaling
    var newLevel=Math.floor(score/60);
    if(newLevel&gt;level){ level=newLevel; }
    updateHUD();
    // rebuild for new speed and pads, keep frog reset
    setTimeout(function(){
      setBg();
      buildLevel();
      makeFrog();
      if(combo&gt;1) frogEl.classList.add(&#x27;combo&#x27;);
      resetFrog();
    },260);
  }

  function death(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    frogEl.classList.add(&#x27;dying&#x27;);
    flashEl.classList.add(&#x27;on&#x27;);
    beep(90,.6,&#x27;sawtooth&#x27;);
    finEl.textContent=&#x27;Final Score: &#x27;+score;
    ribbon.classList.add(&#x27;show&#x27;);
    setTimeout(function(){ flashEl.classList.remove(&#x27;on&#x27;); },400);
  }

  function move(dc,dr){
    if(!running) return;
    var nc=Math.max(0,Math.min(COLS-1,frog.col+dc));
    var nr=Math.max(0,Math.min(ROWS-1,frog.row+dr));
    frog.col=nc; frog.row=nr; frog.onLog=null;
    frog.x=frog.col*COLW+(COLW-FROG)/2;
    frog.y=frog.row*CELL+(CELL-FROG)/2;
    paintFrog();
    beep(440,.05,&#x27;square&#x27;);
    if(frog.row===0){
      // check pad landing
      var landed=null;
      for(var i=0;i&lt;pads.length;i++){
        if(Math.abs(pads[i].col-frog.col)&lt;=0 || (Math.abs(pads[i].col*COLW-frog.col*COLW)&lt;COLW*0.6)){ landed=pads[i]; break; }
      }
      // simpler: nearest pad within range
      if(!landed){
        for(var j=0;j&lt;pads.length;j++){
          if(Math.abs((pads[j].col+0.5)*COLW-(frog.col+0.5)*COLW)&lt;COLW){ landed=pads[j]; break; }
        }
      }
      if(landed){ reachGoal(landed); }
      else { drown(); } // missed pad = fall in
    }
  }

  function startGame(){
    if(running) return;
    ribbon.classList.remove(&#x27;show&#x27;);
    score=0; lives=3; combo=0; streak=0; level=0;
    setBg();
    buildLevel();
    makeFrog();
    resetFrog();
    updateHUD();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });

  // dpad
  var dpad=document.getElementById(&#x27;dpad&#x27;);
  if(&#x27;ontouchstart&#x27; in window || navigator.maxTouchPoints&gt;0){ dpad.style.display=&#x27;grid&#x27;; }
  Array.prototype.forEach.call(dpad.querySelectorAll(&#x27;button&#x27;), function(b){
    b.addEventListener(&#x27;click&#x27;, function(){
      var d=b.getAttribute(&#x27;data-d&#x27;);
      if(d===&#x27;up&#x27;) move(0,-1); else if(d===&#x27;down&#x27;) move(0,1);
      else if(d===&#x27;left&#x27;) move(-1,0); else move(1,0);
    });
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial static paint
  setBg();
  buildLevel();
  makeFrog();
  resetFrog();
  updateHUD();

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
