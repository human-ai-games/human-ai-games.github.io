<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC BREAKOUT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#5 af,#f5c,#5ff); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,180,255,.4); }
  .instructions { font-size: 16px; color: #9fb; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; width: 640px; font-size: 18px; align-items: center; }
  .lives { display: flex; gap: 6px; align-items: center; }
  .orb { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff,#4 df); box-shadow: 0 0 8px #4df, 0 0 14px #2af; }
  .orb.dead { background: #223; box-shadow: none; }
  canvas { border-radius: 8px; box-shadow: 0 0 30px rgba(90,140,255,.25); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BREAKOUT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move the paddle with the &amp;larr; &amp;rarr; arrow keys or your mouse to bounce the ball into the bricks. Clear bricks for points, chain hits for combos, and don&#x27;t let the ball fall past the paddle!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div id=&quot;combo&quot; style=&quot;color:#f5c;font-weight:700;min-height:1em;&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;lives&quot; id=&quot;lives&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 640, H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;), livesEl = document.getElementById(&#x27;lives&#x27;);

  var PADDLE_W = 100, PADDLE_H = 12, PADDLE_Y = H - 24, PADDLE_SPEED = 8;
  var BALL_R = 7;
  var running = false, animId = null;
  var keysDown = {};
  var paddleX, ballX, ballY, ballVX, ballVY, baseSpeed, bounceCount;
  var score, lives, combo, comboTimer, shake, gameOver;
  var bricks = [], particles = [], stars = [];

  var ROWS = 6, COLS = 10, BRICK_GAP = 4, BRICK_TOP = 40;
  var BRICK_W = (W - BRICK_GAP) / COLS - BRICK_GAP;
  var BRICK_H = 20;
  var rowColors = [&#x27;#ff6b9d&#x27;,&#x27;#ffb86b&#x27;,&#x27;#ffe66b&#x27;,&#x27;#7bff9d&#x27;,&#x27;#6bd5ff&#x27;,&#x27;#b56bff&#x27;];
  var rowPoints = [60,50,40,30,20,10];

  function initStars() {
    stars = [];
    for (var i=0;i&lt;90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.4});
  }

  function buildBricks() {
    bricks = [];
    for (var r=0;r&lt;ROWS;r++){
      for (var c=0;c&lt;COLS;c++){
        bricks.push({
          x: BRICK_GAP + c*(BRICK_W+BRICK_GAP),
          y: BRICK_TOP + r*(BRICK_H+BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          color: rowColors[r], pts: rowPoints[r], alive: true
        });
      }
    }
  }

  function resetBall() {
    ballX = W/2; ballY = H/2 + 40;
    var ang = (Math.random()*0.6 - 0.3);
    ballVX = Math.sin(ang) * baseSpeed;
    ballVY = -Math.abs(Math.cos(ang) * baseSpeed);
    combo = 0; comboTimer = 0;
  }

  function renderLives() {
    livesEl.innerHTML = &#x27;&#x27;;
    for (var i=0;i&lt;3;i++){
      var o = document.createElement(&#x27;div&#x27;);
      o.className = &#x27;orb&#x27; + (i &lt; lives ? &#x27;&#x27; : &#x27; dead&#x27;);
      livesEl.appendChild(o);
    }
  }

  function spawnParticles(x,y,color) {
    for (var i=0;i&lt;12;i++){
      var a = Math.random()*Math.PI*2, s = Math.random()*3+1;
      particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color});
    }
  }

  function startGame() {
    if (running) return;
    score = 0; lives = 3; bounceCount = 0; baseSpeed = 4.2;
    combo = 0; comboTimer = 0; shake = 0; gameOver = false;
    particles = [];
    paddleX = (W - PADDLE_W)/2;
    buildBricks(); initStars(); resetBall(); renderLives();
    scoreEl.textContent = &#x27;0&#x27;; comboEl.textContent = &#x27;&#x27;;
    for (var k in keysDown) keysDown[k] = false;
    running = true;
    animId = requestAnimationFrame(tick);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function tick() {
    if (!running) return;
    update();
    draw();
    animId = requestAnimationFrame(tick);
  }

  function update() {
    // stars
    for (var i=0;i&lt;stars.length;i++){
      stars[i].y += stars[i].z * 0.4;
      if (stars[i].y &gt; H){ stars[i].y = 0; stars[i].x = Math.random()*W; }
    }
    if (gameOver) { updateParticles(); return; }

    if (keysDown[&#x27;ArrowLeft&#x27;]) paddleX -= PADDLE_SPEED;
    if (keysDown[&#x27;ArrowRight&#x27;]) paddleX += PADDLE_SPEED;
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    ballX += ballVX; ballY += ballVY;

    if (ballX - BALL_R &lt;= 0){ ballX = BALL_R; ballVX = -ballVX; }
    if (ballX + BALL_R &gt;= W){ ballX = W - BALL_R; ballVX = -ballVX; }
    if (ballY - BALL_R &lt;= 0){ ballY = BALL_R; ballVY = -ballVY; }

    // paddle collision
    if (ballVY &gt; 0 &amp;&amp; ballY + BALL_R &gt;= PADDLE_Y &amp;&amp; ballY + BALL_R &lt;= PADDLE_Y + PADDLE_H + 10 &amp;&amp;
        ballX &gt;= paddleX - BALL_R &amp;&amp; ballX &lt;= paddleX + PADDLE_W + BALL_R) {
      ballY = PADDLE_Y - BALL_R;
      var hit = (ballX - (paddleX + PADDLE_W/2)) / (PADDLE_W/2);
      var speed = Math.hypot(ballVX, ballVY);
      var ang = hit * 1.05;
      ballVX = Math.sin(ang) * speed;
      ballVY = -Math.abs(Math.cos(ang) * speed);
      combo = 0; comboTimer = 0; comboEl.textContent = &#x27;&#x27;;
      bounceCount++;
      if (bounceCount % 3 === 0) {
        baseSpeed += 0.35;
        var f = (baseSpeed) / speed;
        ballVX *= f; ballVY *= f;
      }
    }

    // brick collision
    for (var b=0;b&lt;bricks.length;b++){
      var br = bricks[b];
      if (!br.alive) continue;
      if (ballX + BALL_R &gt; br.x &amp;&amp; ballX - BALL_R &lt; br.x + br.w &amp;&amp;
          ballY + BALL_R &gt; br.y &amp;&amp; ballY - BALL_R &lt; br.y + br.h) {
        br.alive = false;
        spawnParticles(br.x + br.w/2, br.y + br.h/2, br.color);
        // determine bounce direction
        var ox = Math.min(ballX + BALL_R - br.x, br.x + br.w - (ballX - BALL_R));
        var oy = Math.min(ballY + BALL_R - br.y, br.y + br.h - (ballY - BALL_R));
        if (ox &lt; oy) ballVX = -ballVX; else ballVY = -ballVY;
        combo++; comboTimer = 90;
        var mult = combo &gt;= 2 ? combo : 1;
        score += br.pts * mult;
        scoreEl.textContent = score;
        if (combo &gt;= 2) comboEl.textContent = &#x27;COMBO x&#x27; + combo;
        break;
      }
    }

    if (comboTimer &gt; 0){ comboTimer--; if (comboTimer===0){ combo=0; comboEl.textContent=&#x27;&#x27;; } }

    // check win -&gt; rebuild
    var any = false;
    for (var w=0;w&lt;bricks.length;w++){ if (bricks[w].alive){ any = true; break; } }
    if (!any){ buildBricks(); baseSpeed += 0.4; }

    // ball lost
    if (ballY - BALL_R &gt; H) {
      lives--; renderLives();
      shake = 14;
      if (lives &lt;= 0) { gameOver = true; }
      else resetBall();
    }

    if (shake &gt; 0) shake--;
    updateParticles();
  }

  function updateParticles() {
    for (var i=particles.length-1;i&gt;=0;i--){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.03;
      if (p.life &lt;= 0) particles.splice(i,1);
    }
  }

  function draw() {
    ctx.save();
    var sx = shake&gt;0 ? (Math.random()-0.5)*shake : 0;
    var sy = shake&gt;0 ? (Math.random()-0.5)*shake : 0;
    ctx.translate(sx, sy);

    // background
    ctx.fillStyle = &#x27;#05010f&#x27;;
    ctx.fillRect(-20,-20,W+40,H+40);
    if (shake &gt; 8){ ctx.fillStyle = &#x27;rgba(255,80,120,0.15)&#x27;; ctx.fillRect(-20,-20,W+40,H+40); }

    // stars
    for (var i=0;i&lt;stars.length;i++){
      var s = stars[i];
      ctx.globalAlpha = 0.3 + s.z*0.3;
      ctx.fillStyle = &#x27;#cfe&#x27;;
      ctx.fillRect(s.x, s.y, s.z, s.z);
    }
    ctx.globalAlpha = 1;

    // bricks
    for (var b=0;b&lt;bricks.length;b++){
      var br = bricks[b];
      if (!br.alive) continue;
      ctx.fillStyle = br.color;
      ctx.shadowColor = br.color; ctx.shadowBlur = 8;
      ctx.fillRect(br.x, br.y, br.w, br.h);
    }
    ctx.shadowBlur = 0;

    // particles
    for (var i=0;i&lt;particles.length;i++){
      var p = particles[i];
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;

    if (!gameOver) {
      // paddle
      ctx.fillStyle = &#x27;#6bd5ff&#x27;;
      ctx.shadowColor = &#x27;#6bd5ff&#x27;; ctx.shadowBlur = 14;
      roundRect(paddleX, PADDLE_Y, PADDLE_W, PADDLE_H, 6); ctx.fill();
      // ball
      ctx.fillStyle = &#x27;#fff&#x27;;
      ctx.shadowColor = &#x27;#fff&#x27;; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.arc(ballX, ballY, BALL_R, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = &#x27;rgba(0,0,0,0.55)&#x27;;
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillStyle = &#x27;#f5c&#x27;;
      ctx.font = &#x27;700 40px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 10);
      ctx.fillStyle = &#x27;#fff&#x27;;
      ctx.font = &#x27;600 22px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;Final Score: &#x27; + score, W/2, H/2 + 30);
      ctx.fillStyle = &#x27;#9fb&#x27;;
      ctx.font = &#x27;16px system-ui, sans-serif&#x27;;
      ctx.fillText(&#x27;Press Restart below to play again&#x27;, W/2, H/2 + 62);
    }
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;){ keysDown[e.key] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keysDown[e.key] = false;
  });
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){
    if (!running || gameOver) return;
    var rect = cv.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (W / rect.width);
    paddleX = Math.max(0, Math.min(W - PADDLE_W, mx - PADDLE_W/2));
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  // initial static frame
  initStars(); buildBricks(); paddleX=(W-PADDLE_W)/2; ballX=W/2; ballY=H/2+40; lives=3; score=0; gameOver=false; renderLives();
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
