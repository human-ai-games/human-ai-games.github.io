<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }

  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;

  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍉 Fruit Drop 🍓</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(160deg,#ffd86b 0%,#ff9de2 40%,#7ad7ff 100%); color: #2a2a4a; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; color: #fff; text-shadow: 2px 2px 0 #ff6f91, 4px 4px 0 rgba(0,0,0,.12); letter-spacing: 1px; }
  .instructions { font-size: 16px; color: #3a3a5a; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; background: rgba(255,255,255,.55); border-radius: 10px; padding: 6px 10px; }
  .scorebar { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.15); }
  #score { display: inline-block; font-size: 30px; font-weight: 900; color: #fff700; text-shadow: 2px 2px 0 #e67e22; transition: transform .12s; }
  .arena { display: flex; gap: 12px; align-items: flex-start; }
  .field { position: relative; width: 240px; height: 384px; background: rgba(255,255,255,.28); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255,255,255,.5); }
  .block { position: absolute; box-sizing: border-box; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.35); }
  .ghost { position: absolute; box-sizing: border-box; border-radius: 6px; border: 2px dashed rgba(255,255,255,.75); background: rgba(255,255,255,.12); }
  .flash { animation: flash .3s; }
  @keyframes flash { 0%{filter:brightness(3);} 100%{filter:brightness(1);} }
  .side { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .panel { background: rgba(255,255,255,.45); border-radius: 10px; padding: 8px 10px; text-align: center; }
  .panel h2 { margin: 0 0 4px; font-size: 14px; color: #444; }
  #preview { position: relative; width: 96px; height: 96px; }
  .combo { position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #ff2d75, -1px -1px 0 #2d9bff; pointer-events: none; opacity: 0; }
  .combo.show { animation: bounce 1s ease; }
  @keyframes bounce { 0%{opacity:0;transform:scale(.3) translateY(20px);} 30%{opacity:1;transform:scale(1.3) translateY(-10px);} 60%{transform:scale(1) translateY(0);} 100%{opacity:0;transform:scale(1) translateY(-30px);} }
  .particle { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(40,20,70,.82); color: #fff; border-radius: 12px; transform: translateY(-120%); transition: transform .5s cubic-bezier(.34,1.56,.64,1); text-align: center; }
  .overlay.show { transform: translateY(0); }
  .overlay h2 { margin: 0; font-size: 34px; }
  .overlay .fin { font-size: 26px; margin-top: 8px; color: #fff700; }
  .overlay .em { font-size: 46px; margin-top: 6px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍉 Fruit Drop 🍓&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit with &lt;strong&gt;←/→&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, soft-drop with &lt;strong&gt;↓&lt;/strong&gt;. Fill full rows to score — clear several at once for a rainbow combo! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;scorebar&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;arena&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
        &lt;h2&gt;Game Over!&lt;/h2&gt;
        &lt;div class=&quot;fin&quot; id=&quot;finalScore&quot;&gt;Score: 0&lt;/div&gt;
        &lt;div class=&quot;em&quot;&gt;🍍🍊🍇&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;side&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;NEXT&lt;/h2&gt;&lt;div id=&quot;preview&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;SPEED&lt;/h2&gt;&lt;div id=&quot;speed&quot; style=&quot;font-size:20px;font-weight:800;color:#e67e22;&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 24, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var previewEl = document.getElementById(&#x27;preview&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var speedEl = document.getElementById(&#x27;speed&#x27;);

  // Fruit tetrominoes: shape matrix (relative cells), color, emoji.
  var FRUITS = [
    { emoji:&#x27;🍓&#x27;, color:&#x27;#ff4d6d&#x27;, cells:[[0,0],[1,0],[0,1],[1,1]] },              // O strawberry
    { emoji:&#x27;🍋&#x27;, color:&#x27;#ffd400&#x27;, cells:[[0,0],[1,0],[2,0],[3,0]] },              // I lemon
    { emoji:&#x27;🍇&#x27;, color:&#x27;#9b5de5&#x27;, cells:[[0,0],[1,0],[2,0],[1,1]] },              // T grapes
    { emoji:&#x27;🍉&#x27;, color:&#x27;#2ec4a0&#x27;, cells:[[0,0],[1,0],[1,1],[2,1]] },              // S watermelon
    { emoji:&#x27;🍊&#x27;, color:&#x27;#ff922b&#x27;, cells:[[1,0],[2,0],[0,1],[1,1]] },              // Z orange
    { emoji:&#x27;🍍&#x27;, color:&#x27;#f9c74f&#x27;, cells:[[0,0],[1,0],[2,0],[0,1]] }               // J pineapple
  ];

  var grid, piece, next, score, running, dropId, dropMs, speedLevel;

  function newGrid(){ grid=[]; for(var r=0;r&lt;ROWS;r++){var row=[];for(var c=0;c&lt;COLS;c++)row.push(null);grid.push(row);} }

  function makePiece(idx){
    var f = FRUITS[idx];
    return { idx:idx, cells:f.cells.map(function(c){return [c[0],c[1]];}), x:3, y:0 };
  }
  function randIdx(){ return Math.floor(Math.random()*FRUITS.length); }

  function absCells(p){ return p.cells.map(function(c){return {x:p.x+c[0], y:p.y+c[1]};}); }

  function collides(p){
    var cs=absCells(p);
    for(var i=0;i&lt;cs.length;i++){
      var x=cs[i].x,y=cs[i].y;
      if(x&lt;0||x&gt;=COLS||y&gt;=ROWS) return true;
      if(y&gt;=0 &amp;&amp; grid[y][x]!==null) return true;
    }
    return false;
  }

  function rotate(p){
    // rotate 90deg clockwise around bounding box
    var maxY=0; p.cells.forEach(function(c){ if(c[1]&gt;maxY)maxY=c[1]; });
    var rc = p.cells.map(function(c){ return [maxY-c[1], c[0]]; });
    var test = {idx:p.idx, cells:rc, x:p.x, y:p.y};
    // wall kicks
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      test.x = p.x + kicks[k];
      if(!collides(test)){ p.cells=rc; p.x=test.x; return; }
    }
  }

  function spawn(){
    piece = next || makePiece(randIdx());
    piece.x=3; piece.y=0;
    next = makePiece(randIdx());
    drawPreview();
    if(collides(piece)) return false;
    return true;
  }

  function ghostY(){
    var g = {idx:piece.idx, cells:piece.cells, x:piece.x, y:piece.y};
    while(!collides({idx:g.idx,cells:g.cells,x:g.x,y:g.y+1})) g.y++;
    return g.y;
  }

  function drawBlock(x,y,idx,cls){
    var f=FRUITS[idx];
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block&#x27;+(cls?(&#x27; &#x27;+cls):&#x27;&#x27;);
    el.style.left=(x*CELL)+&#x27;px&#x27;; el.style.top=(y*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    el.style.background=f.color;
    el.textContent=f.emoji;
    field.appendChild(el);
    return el;
  }

  function paint(){
    // remove blocks &amp; ghosts (keep combo &amp; overlay)
    var kids=field.querySelectorAll(&#x27;.block,.ghost&#x27;);
    for(var i=0;i&lt;kids.length;i++) kids[i].remove();
    for(var r=0;r&lt;ROWS;r++)for(var c=0;c&lt;COLS;c++) if(grid[r][c]!==null) drawBlock(c,r,grid[r][c]);
    if(piece){
      // ghost
      var gy=ghostY();
      var gc=absCells({idx:piece.idx,cells:piece.cells,x:piece.x,y:gy});
      gc.forEach(function(c){ if(c.y&gt;=0){ var g=document.createElement(&#x27;div&#x27;); g.className=&#x27;ghost&#x27;; g.style.left=(c.x*CELL)+&#x27;px&#x27;; g.style.top=(c.y*CELL)+&#x27;px&#x27;; g.style.width=CELL+&#x27;px&#x27;; g.style.height=CELL+&#x27;px&#x27;; field.appendChild(g); }});
      absCells(piece).forEach(function(c){ if(c.y&gt;=0) drawBlock(c.x,c.y,piece.idx); });
    }
  }

  function drawPreview(){
    previewEl.innerHTML=&#x27;&#x27;;
    if(!next) return;
    var minX=9,minY=9,maxX=0,maxY=0;
    next.cells.forEach(function(c){ minX=Math.min(minX,c[0]);minY=Math.min(minY,c[1]);maxX=Math.max(maxX,c[0]);maxY=Math.max(maxY,c[1]); });
    var w=(maxX-minX+1), h=(maxY-minY+1), pc=20;
    var offX=(96-w*pc)/2, offY=(96-h*pc)/2;
    var f=FRUITS[next.idx];
    next.cells.forEach(function(c){
      var el=document.createElement(&#x27;div&#x27;);
      el.className=&#x27;block&#x27;;
      el.style.left=(offX+(c[0]-minX)*pc)+&#x27;px&#x27;; el.style.top=(offY+(c[1]-minY)*pc)+&#x27;px&#x27;;
      el.style.width=pc+&#x27;px&#x27;; el.style.height=pc+&#x27;px&#x27;; el.style.fontSize=&#x27;13px&#x27;;
      el.style.background=f.color; el.textContent=f.emoji;
      previewEl.appendChild(el);
    });
  }

  function lock(){
    absCells(piece).forEach(function(c){ if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]=piece.idx; });
    piece=null;
  }

  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(grid[r][c]===null){f=false;break;} if(f) full.push(r); }
    if(full.length===0) return 0;
    full.forEach(function(r){ for(var c=0;c&lt;COLS;c++){ var b=field.querySelector(&#x27;.block&#x27;); } });
    // flash existing blocks in those rows already painted; simpler: just flash field
    // remove rows
    full.sort(function(a,b){return a-b;});
    full.forEach(function(r){
      grid.splice(r,1);
      var empty=[]; for(var c=0;c&lt;COLS;c++) empty.push(null);
      grid.unshift(empty);
    });
    // scoring
    var n=full.length;
    var pts = [0,1,3,6,10][n] || n*4;
    score += pts;
    scoreEl.textContent=score;
    bump(scoreEl);
    if(n&gt;=2){ showCombo(n); burst(); }
    else { flashField(); }
    updateSpeed();
    return n;
  }

  function flashField(){ field.classList.add(&#x27;flash&#x27;); setTimeout(function(){field.classList.remove(&#x27;flash&#x27;);},300); }

  function bump(el){ el.style.transform=&#x27;scale(1.4)&#x27;; setTimeout(function(){el.style.transform=&#x27;scale(1)&#x27;;},130); }

  function showCombo(n){
    comboEl.textContent = n+&#x27;x COMBO! +&#x27;+([0,1,3,6,10][n]||n*4);
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  var rainbow=[&#x27;#ff4d6d&#x27;,&#x27;#ffd400&#x27;,&#x27;#2ec4a0&#x27;,&#x27;#9b5de5&#x27;,&#x27;#ff922b&#x27;,&#x27;#3ba7ff&#x27;];
  function burst(){
    for(var i=0;i&lt;28;i++){
      (function(){
        var p=document.createElement(&#x27;div&#x27;);
        p.className=&#x27;particle&#x27;;
        p.style.background=rainbow[i%rainbow.length];
        p.style.left=&#x27;120px&#x27;; p.style.top=&#x27;190px&#x27;;
        field.appendChild(p);
        var ang=Math.random()*Math.PI*2, dist=60+Math.random()*100;
        var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
        p.animate([{transform:&#x27;translate(0,0) scale(1)&#x27;,opacity:1},{transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(0)&#x27;,opacity:0}],{duration:800,easing:&#x27;ease-out&#x27;});
        setTimeout(function(){p.remove();},800);
      })();
    }
  }

  function updateSpeed(){
    var lvl = 1 + Math.floor(score/10);
    if(lvl!==speedLevel){
      speedLevel=lvl;
      speedEl.textContent=lvl;
      dropMs = Math.max(120, 550 - (lvl-1)*45);
      if(running){ clearInterval(dropId); dropId=setInterval(step,dropMs); }
    }
  }

  function step(){
    if(!piece||!running) return;
    var nxt={idx:piece.idx,cells:piece.cells,x:piece.x,y:piece.y+1};
    if(collides(nxt)){
      lock();
      clearRows();
      if(!spawn()){ endGame(); paint(); return; }
    } else piece.y++;
    paint();
  }

  function move(dx){
    if(!running||!piece) return;
    var nxt={idx:piece.idx,cells:piece.cells,x:piece.x+dx,y:piece.y};
    if(!collides(nxt)){ piece.x+=dx; paint(); }
  }

  function endGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
    finalScoreEl.textContent=&#x27;Score: &#x27;+score;
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    score=0; scoreEl.textContent=&#x27;0&#x27;; speedLevel=0; dropMs=550;
    newGrid(); next=makePiece(randIdx());
    if(!spawn()) return;
    updateSpeed();
    paint();
    running=true;
    if(dropId) clearInterval(dropId);
    dropId=setInterval(step,dropMs);
  }
  function stopGame(){ running=false; if(dropId){clearInterval(dropId);dropId=null;} }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(!running) return;
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ step(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ if(piece){rotate(piece);paint();} e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  // initial view
  newGrid(); next=makePiece(randIdx()); piece=makePiece(2); piece.x=3; piece.y=0;
  drawPreview(); paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
