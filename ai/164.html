&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }

  .score-box { font-size: 15px; color: #eaffd8; }

  .hole { position: relative; display: flex; align-items: flex-end; justify-content: center; }

  .mole { position: absolute; bottom: 4px; width: 74px; height: 74px; cursor: pointer; transform: translateY(90px) scale(.6); transition: transform .16s cubic-bezier(.2,1.6,.4,1); z-index: 2; }
  .mole.up { transform: translateY(0) scale(1); }

  @keyframes thwack { 0%{transform:scale(.4) rotate(-15deg);opacity:1;} 100%{transform:scale(1.6) rotate(10deg);opacity:0;} }
  @keyframes fly { to { transform: translate(var(--dx),var(--dy)) scale(.2) rotate(360deg); opacity:0; } }

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐹 Mole Mayhem 🌱&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack the moles as they pop from the holes — gold gophers = 1, red speedsters = 2, rainbow bosses = 5! Hit three in a row without missing to go gold and double your points.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;

    &lt;div class=&quot;score-box&quot;&gt;SCORE&lt;br&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

  &lt;/div&gt;

    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;&lt;div&gt;Mole Mayhem&lt;/div&gt;&lt;div style=&quot;font-size:18px;color:#eaffd8;margin-top:8px;&quot;&gt;Press Start below to play!&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var board = document.getElementById(&#x27;board&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var timerEl = document.getElementById(&#x27;timer&#x27;);
var comboEl = document.getElementById(&#x27;combo&#x27;);
var overlay = document.getElementById(&#x27;overlay&#x27;);

var holes = [];
var running = false;
var score = 0, timeLeft = 60, combo = 0, elapsed = 0;
var spawnTimer = null, gameTimer = null;
var difficulty = 0;
var audioCtx = null;

// Build 3x3 grid of holes
function buildBoard() {
  for (var i = 0; i &lt; 9; i++) {
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;
    var dirt = document.createElement(&#x27;div&#x27;);
    dirt.className = &#x27;dirt&#x27;;
    hole.appendChild(dirt);
    board.appendChild(hole);
    holes.push({ el: hole, occupied: false, mole: null, timeout: null });
  }
}
buildBoard();

var MOLE_TYPES = {
  gold:  { body:&#x27;#e8b84b&#x27;, belly:&#x27;#f5d98a&#x27;, pts:1, life:1400, weight:60 },
  red:   { body:&#x27;#d93b3b&#x27;, belly:&#x27;#f58a8a&#x27;, pts:2, life:750,  weight:32 },
  boss:  { body:&#x27;#8a4bd9&#x27;, belly:&#x27;#c8a8f5&#x27;, pts:5, life:900,  weight:8  }
};

function moleSVG(t) {
  var c = MOLE_TYPES[t];
  return &#x27;&lt;svg viewBox=&quot;0 0 100 100&quot;&gt;&#x27; +
    // shovel
    &#x27;&lt;g transform=&quot;rotate(20 78 40)&quot;&gt;&lt;rect x=&quot;76&quot; y=&quot;18&quot; width=&quot;5&quot; height=&quot;34&quot; fill=&quot;#a0704a&quot;/&gt;&lt;rect x=&quot;70&quot; y=&quot;8&quot; width=&quot;17&quot; height=&quot;16&quot; rx=&quot;3&quot; fill=&quot;#bbb&quot; stroke=&quot;#888&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;/g&gt;&#x27; +
    // body
    &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;62&quot; rx=&quot;34&quot; ry=&quot;32&quot; fill=&quot;&#x27;+c.body+&#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;70&quot; rx=&quot;22&quot; ry=&quot;20&quot; fill=&quot;&#x27;+c.belly+&#x27;&quot;/&gt;&#x27; +
    // arms
    &#x27;&lt;circle cx=&quot;20&quot; cy=&quot;60&quot; r=&quot;9&quot; fill=&quot;&#x27;+c.body+&#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;80&quot; cy=&quot;60&quot; r=&quot;9&quot; fill=&quot;&#x27;+c.body+&#x27;&quot;/&gt;&#x27; +
    // hard hat
    &#x27;&lt;path d=&quot;M22 40 Q50 8 78 40 Z&quot; fill=&quot;#f5c518&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;18&quot; y=&quot;38&quot; width=&quot;64&quot; height=&quot;7&quot; rx=&quot;3&quot; fill=&quot;#e0a800&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;46&quot; y=&quot;16&quot; width=&quot;8&quot; height=&quot;14&quot; fill=&quot;#e0a800&quot;/&gt;&#x27; +
    // eyes
    &#x27;&lt;circle cx=&quot;40&quot; cy=&quot;52&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;60&quot; cy=&quot;52&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;41&quot; cy=&quot;53&quot; r=&quot;2.6&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;61&quot; cy=&quot;53&quot; r=&quot;2.6&quot; fill=&quot;#222&quot;/&gt;&#x27; +
    // nose
    &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;62&quot; rx=&quot;6&quot; ry=&quot;4.5&quot; fill=&quot;#e5709a&quot;/&gt;&#x27; +
    // smile
    &#x27;&lt;path d=&quot;M42 70 Q50 76 58 70&quot; stroke=&quot;#7a4a2a&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;
}

function winkSVG(t) {
  var c = MOLE_TYPES[t];
  return &#x27;&lt;svg viewBox=&quot;0 0 100 100&quot;&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;62&quot; rx=&quot;34&quot; ry=&quot;32&quot; fill=&quot;&#x27;+c.body+&#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;70&quot; rx=&quot;22&quot; ry=&quot;20&quot; fill=&quot;&#x27;+c.belly+&#x27;&quot;/&gt;&#x27; +
    &#x27;&lt;path d=&quot;M22 40 Q50 8 78 40 Z&quot; fill=&quot;#f5c518&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;18&quot; y=&quot;38&quot; width=&quot;64&quot; height=&quot;7&quot; rx=&quot;3&quot; fill=&quot;#e0a800&quot;/&gt;&#x27; +
    // winking eye + open eye
    &#x27;&lt;path d=&quot;M35 52 Q40 56 45 52&quot; stroke=&quot;#222&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;60&quot; cy=&quot;52&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;61&quot; cy=&quot;53&quot; r=&quot;2.6&quot; fill=&quot;#222&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;50&quot; cy=&quot;62&quot; rx=&quot;6&quot; ry=&quot;4.5&quot; fill=&quot;#e5709a&quot;/&gt;&#x27; +
    // cheeky grin (tongue out)
    &#x27;&lt;path d=&quot;M42 70 Q50 78 58 70&quot; stroke=&quot;#7a4a2a&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;52&quot; cy=&quot;74&quot; rx=&quot;4&quot; ry=&quot;3&quot; fill=&quot;#e5709a&quot;/&gt;&#x27; +
    &#x27;&lt;/svg&gt;&#x27;;
}

function beep(freq, dur, type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (_) {}
}

function pickType() {
  var total = 0, k;
  for (k in MOLE_TYPES) total += MOLE_TYPES[k].weight;
  var r = Math.random() * total;
  for (k in MOLE_TYPES) { r -= MOLE_TYPES[k].weight; if (r &lt;= 0) return k; }
  return &#x27;gold&#x27;;
}

function spawnMole() {
  if (!running) return;
  var free = holes.filter(function(h){ return !h.occupied; });
  if (!free.length) return;
  var hole = free[Math.floor(Math.random() * free.length)];
  var type = pickType();
  var cfg = MOLE_TYPES[type];
  var life = Math.max(400, cfg.life - difficulty * 120);

  hole.occupied = true;
  hole.type = type;
  var mole = document.createElement(&#x27;div&#x27;);
  mole.className = &#x27;mole&#x27; + (type === &#x27;boss&#x27; ? &#x27; boss&#x27; : &#x27;&#x27;);
  mole.innerHTML = moleSVG(type);
  hole.el.appendChild(mole);
  hole.mole = mole;

  requestAnimationFrame(function(){ requestAnimationFrame(function(){ mole.classList.add(&#x27;up&#x27;); }); });

  if (type === &#x27;boss&#x27;) {
    // sparkles around boss
    var sp = document.createElement(&#x27;div&#x27;);
    sp.className = &#x27;star&#x27;; sp.textContent = &#x27;✨&#x27;;
    sp.style.left = &#x27;30%&#x27;; sp.style.top = &#x27;10%&#x27;;
    mole.appendChild(sp);
  }

  mole.addEventListener(&#x27;mousedown&#x27;, function(ev){
    ev.stopPropagation();
    hit(hole);
  });

  hole.timeout = setTimeout(function(){ escape(hole); }, life);
}

function hit(hole) {
  if (!hole.occupied || hole.hit) return;
  hole.hit = true;
  clearTimeout(hole.timeout);
  var cfg = MOLE_TYPES[hole.type];
  combo++;
  var mult = combo &gt;= 3 ? 2 : 1;
  var gained = cfg.pts * mult;
  score += gained;
  updateScore(mult === 2);
  updateCombo();
  beep(hole.type === &#x27;boss&#x27; ? 660 : (hole.type === &#x27;red&#x27; ? 520 : 400), 0.12);
  thwack(hole.el);
  burst(hole.el);
  removeMole(hole);
}

function escape(hole) {
  if (!hole.occupied || hole.hit) return;
  combo = 0;
  updateCombo();
  // wink animation
  if (hole.mole) hole.mole.innerHTML = winkSVG(hole.type);
  var m = hole.mole;
  if (m) { m.classList.remove(&#x27;up&#x27;); m.classList.add(&#x27;down&#x27;); }
  hole.occupied = false; hole.hit = false;
  var mm = hole.mole; hole.mole = null;
  setTimeout(function(){ if (mm &amp;&amp; mm.parentNode) mm.parentNode.removeChild(mm); }, 320);
}

function removeMole(hole) {
  var m = hole.mole;
  hole.occupied = false; hole.hit = false; hole.mole = null;
  if (m &amp;&amp; m.parentNode) m.parentNode.removeChild(m);
}

function thwack(holeEl) {
  var t = document.createElement(&#x27;div&#x27;);
  t.className = &#x27;thwack&#x27;; t.textContent = &#x27;THWACK!&#x27;;
  t.style.left = &#x27;0px&#x27;; t.style.top = &#x27;10px&#x27;; t.style.width = &#x27;100%&#x27;; t.style.textAlign=&#x27;center&#x27;;
  holeEl.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 420);
}

function burst(holeEl) {
  var stars = [&#x27;⭐&#x27;,&#x27;🌟&#x27;,&#x27;✨&#x27;,&#x27;💫&#x27;,&#x27;🌈&#x27;];
  for (var i = 0; i &lt; 8; i++) {
    var s = document.createElement(&#x27;div&#x27;);
    s.className = &#x27;star&#x27;;
    s.textContent = stars[Math.floor(Math.random()*stars.length)];
    s.style.left = &#x27;50%&#x27;; s.style.top = &#x27;40%&#x27;;
    var ang = (Math.PI*2) * i / 8;
    var dist = 40 + Math.random()*30;
    s.style.setProperty(&#x27;--dx&#x27;, Math.cos(ang)*dist + &#x27;px&#x27;);
    s.style.setProperty(&#x27;--dy&#x27;, Math.sin(ang)*dist + &#x27;px&#x27;);
    s.style.animation = &#x27;fly .55s ease-out forwards&#x27;;
    holeEl.appendChild(s);
    (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 560); })(s);
  }
}

function updateScore(gold) {
  scoreEl.textContent = score;
  scoreEl.classList.add(&#x27;bump&#x27;);
  setTimeout(function(){ scoreEl.classList.remove(&#x27;bump&#x27;); }, 110);
  if (gold) scoreEl.classList.add(&#x27;gold&#x27;); else if (combo &lt; 3) scoreEl.classList.remove(&#x27;gold&#x27;);
}

function updateCombo() {
  if (combo &gt;= 3) {
    comboEl.textContent = &#x27;🔥 COMBO x2&#x27;;
    scoreEl.classList.add(&#x27;gold&#x27;);
  } else {
    comboEl.textContent = combo &gt; 0 ? (&#x27;Streak: &#x27; + combo) : &#x27;&#x27;;
    scoreEl.classList.remove(&#x27;gold&#x27;);
  }
}

function tickGame() {
  timeLeft--;
  elapsed++;
  if (timeLeft &lt;= 0) { endGame(); return; }
  timerEl.textContent = timeLeft;
  if (elapsed % 10 === 0) { difficulty++; restartSpawn(); }
}

function restartSpawn() {
  if (spawnTimer) clearInterval(spawnTimer);
  var interval = Math.max(420, 950 - difficulty * 110);
  spawnTimer = setInterval(function(){
    spawnMole();
    if (difficulty &gt;= 2 &amp;&amp; Math.random() &lt; 0.4) spawnMole(); // extra moles later
  }, interval);
}

function clearAll() {
  holes.forEach(function(h){
    if (h.timeout) clearTimeout(h.timeout);
    h.timeout = null; h.occupied = false; h.hit = false; h.mole = null;
    // remove any mole/particle children (keep dirt)
    var kids = h.el.querySelectorAll(&#x27;.mole, .star, .thwack&#x27;);
    kids.forEach(function(k){ if (k.parentNode) k.parentNode.removeChild(k); });
  });
}

function startGame() {
  if (running) return;
  running = true;
  score = 0; timeLeft = 60; combo = 0; elapsed = 0; difficulty = 0;
  scoreEl.textContent = &#x27;0&#x27;; timerEl.textContent = &#x27;60&#x27;;
  scoreEl.classList.remove(&#x27;gold&#x27;); comboEl.textContent = &#x27;&#x27;;
  overlay.classList.add(&#x27;hide&#x27;);
  clearAll();
  spawnMole();
  restartSpawn();
  gameTimer = setInterval(tickGame, 1000);
}

function stopGame() {
  running = false;
  if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  clearAll();
}

function endGame() {
  running = false;
  if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  clearAll();
  overlay.innerHTML = &#x27;&lt;div&gt;⏰ Time\&#x27;s Up!&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;Score: &#x27; + score + &#x27;&lt;/div&gt;&lt;div style=&quot;font-size:16px;color:#eaffd8;margin-top:8px;&quot;&gt;Press Start below to play again!&lt;/div&gt;&#x27;;
  overlay.classList.remove(&#x27;hide&#x27;);
  beep(300, 0.3, &#x27;sawtooth&#x27;);
}

window.addEventListener(&#x27;message&#x27;, function (e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) startGame();
  else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
});
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';

  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
