&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC SURFER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Tap &lt;strong&gt;Space&lt;/strong&gt; or click to fire your thruster and arc over the asteroids — tap again in mid-air for a double-boost. Use the Start/Restart button below to launch.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt;&lt;br&gt;&lt;span id=&quot;scoreVal&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;BEST STREAK&lt;/span&gt;&lt;br&gt;&lt;span id=&quot;streakVal&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SPEED&lt;/span&gt;&lt;br&gt;&lt;span id=&quot;speedVal&quot;&gt;1.0x&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;680&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;READY&lt;small&gt;Press Start below to launch&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var W=680,H=460;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var overlay=document.getElementById(&#x27;overlay&#x27;), flash=document.getElementById(&#x27;flash&#x27;);
var scoreEl=document.getElementById(&#x27;scoreVal&#x27;), streakEl=document.getElementById(&#x27;streakVal&#x27;), speedEl=document.getElementById(&#x27;speedVal&#x27;);

var GROUND=H-40, SHIP_X=110, SHIP_R=16, GRAVITY=0.55;
var running=false, animId=null, gameOver=false;
var ship, obstacles, stars, nebulae, particles, trail;
var baseSpeed, speedMul, score, streak, bestStreak, dodged, flashUntil, spawnTimer, jumpsUsed, warnUntil, t;

function rand(a,b){return a+Math.random()*(b-a);}

function initStars(){
  stars=[];
  var layers=[{n:40,sp:0.3,sz:1,c:&#x27;#5a4a8a&#x27;},{n:30,sp:0.7,sz:1.5,c:&#x27;#8a7ac0&#x27;},{n:18,sp:1.3,sz:2,c:&#x27;#e0d5ff&#x27;}];
  layers.forEach(function(L){
    for(var i=0;i&lt;L.n;i++) stars.push({x:rand(0,W),y:rand(0,GROUND),sp:L.sp,sz:L.sz,c:L.c});
  });
}
function initNebulae(){
  nebulae=[];
  var cols=[&#x27;rgba(123,47,247,0.18)&#x27;,&#x27;rgba(255,60,172,0.14)&#x27;,&#x27;rgba(0,229,255,0.12)&#x27;];
  for(var i=0;i&lt;4;i++) nebulae.push({x:rand(0,W),y:rand(40,GROUND-40),r:rand(80,150),sp:rand(0.15,0.4),c:cols[i%cols.length]});
}

function reset(){
  ship={y:GROUND-SHIP_R, vy:0};
  obstacles=[]; particles=[]; trail=[];
  baseSpeed=3.2; speedMul=1; score=0; streak=0; bestStreak=0; dodged=0;
  flashUntil=0; warnUntil=0; spawnTimer=0; jumpsUsed=0; t=0;
  gameOver=false;
  initStars(); initNebulae();
  spawnObstacle(W+60);
  updateHUD();
}
function updateHUD(){
  scoreEl.textContent=score;
  streakEl.textContent=bestStreak;
  speedEl.textContent=speedMul.toFixed(1)+&#x27;x&#x27;;
}

function spawnObstacle(x){
  var h=rand(28,95), w=rand(26,52);
  obstacles.push({x:x, w:w, h:h, scored:false, rot:0, rs:rand(-0.06,0.06), verts:makeVerts(w,h)});
}
function makeVerts(w,h){
  var n=8, v=[];
  for(var i=0;i&lt;n;i++){
    var a=i/n*Math.PI*2;
    var rr=0.7+Math.random()*0.35;
    v.push([Math.cos(a)*w/2*rr, Math.sin(a)*h/2*rr]);
  }
  return v;
}

function jump(){
  if(!running||gameOver) return;
  var onGround = ship.y&gt;=GROUND-SHIP_R-1;
  if(onGround){ ship.vy=-11; jumpsUsed=1; }
  else if(jumpsUsed&lt;2){ ship.vy=-9.5; jumpsUsed=2; }
}

function burst(x,y,colors,n,spread){
  for(var i=0;i&lt;n;i++){
    particles.push({x:x,y:y,vx:rand(-spread,spread),vy:rand(-spread,spread),
      life:1,c:colors[(Math.random()*colors.length)|0],sz:rand(1.5,3.5)});
  }
}

function tick(){
  if(!running) return;
  t++;
  // physics
  ship.vy+=GRAVITY;
  ship.y+=ship.vy;
  if(ship.y&gt;GROUND-SHIP_R){ ship.y=GROUND-SHIP_R; ship.vy=0; jumpsUsed=0; }
  if(ship.y&lt;SHIP_R){ ship.y=SHIP_R; ship.vy=0; }

  // trail
  trail.push({x:SHIP_X-14, y:ship.y, life:1});
  if(trail.length&gt;18) trail.shift();

  var spd=baseSpeed*speedMul;

  // spawn
  spawnTimer--;
  if(spawnTimer&lt;=0){
    spawnObstacle(W+40);
    spawnTimer = Math.max(48, 90 - dodged*1.5);
  }

  // obstacles
  for(var i=obstacles.length-1;i&gt;=0;i--){
    var o=obstacles[i];
    o.x-=spd;
    o.rot+=o.rs;
    if(!o.scored &amp;&amp; o.x+o.w/2 &lt; SHIP_X-SHIP_R){
      o.scored=true;
      score++; dodged++;
      streak++; if(streak&gt;bestStreak) bestStreak=streak;
      burst(SHIP_X, ship.y, [&#x27;#00e5ff&#x27;,&#x27;#ff3cac&#x27;,&#x27;#ffd23c&#x27;], 12, 4);
      if(dodged%10===0){ speedMul+=0.2; warnUntil=t+30; }
      updateHUD();
    }
    // collision (approx: bounding box vs circle)
    var ox=o.x, oyTop=GROUND-o.h, oyBot=GROUND;
    var oleft=ox-o.w/2, oright=ox+o.w/2;
    var cx=Math.max(oleft, Math.min(SHIP_X, oright));
    var cy=Math.max(oyTop, Math.min(ship.y, oyBot));
    var dx=SHIP_X-cx, dy=ship.y-cy;
    if(dx*dx+dy*dy &lt; (SHIP_R-3)*(SHIP_R-3)){
      explode();
      return;
    }
    if(o.x+o.w &lt; -20) obstacles.splice(i,1);
  }

  // move background
  stars.forEach(function(s){ s.x-=s.sp*speedMul; if(s.x&lt;0){s.x=W; s.y=rand(0,GROUND);} });
  nebulae.forEach(function(nb){ nb.x-=nb.sp*speedMul; if(nb.x&lt;-nb.r){nb.x=W+nb.r; nb.y=rand(40,GROUND-40);} });

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=0.03;
    if(pt.life&lt;=0) particles.splice(p,1);
  }

  draw();
  animId=requestAnimationFrame(tick);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // nebulae
  nebulae.forEach(function(nb){
    var g=ctx.createRadialGradient(nb.x,nb.y,0,nb.x,nb.y,nb.r);
    g.addColorStop(0,nb.c); g.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(nb.x,nb.y,nb.r,0,7); ctx.fill();
  });

  // stars
  stars.forEach(function(s){
    ctx.fillStyle=s.c;
    ctx.fillRect(s.x,s.y,s.sz,s.sz);
  });

  // ground line (gravity lane)
  var lg=ctx.createLinearGradient(0,GROUND,0,H);
  lg.addColorStop(0,&#x27;rgba(0,229,255,0.35)&#x27;); lg.addColorStop(1,&#x27;rgba(123,47,247,0.05)&#x27;);
  ctx.fillStyle=lg; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle=&#x27;rgba(0,229,255,0.7)&#x27;; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();

  // exhaust trail
  for(var i=0;i&lt;trail.length;i++){
    var tr=trail[i]; var a=(i/trail.length)*0.6;
    ctx.fillStyle=&#x27;rgba(255,60,172,&#x27;+a+&#x27;)&#x27;;
    ctx.beginPath(); ctx.arc(tr.x, tr.y, (i/trail.length)*8+1, 0, 7); ctx.fill();
  }

  // obstacles
  var warn = t&lt;warnUntil &amp;&amp; (Math.floor(t/4)%2===0);
  obstacles.forEach(function(o){
    ctx.save();
    ctx.translate(o.x, GROUND-o.h/2);
    ctx.rotate(o.rot);
    ctx.beginPath();
    ctx.moveTo(o.verts[0][0], o.verts[0][1]);
    for(var k=1;k&lt;o.verts.length;k++) ctx.lineTo(o.verts[k][0], o.verts[k][1]);
    ctx.closePath();
    if(warn){ ctx.fillStyle=&#x27;#ff6b8a&#x27;; ctx.shadowColor=&#x27;#ff3cac&#x27;; }
    else { ctx.fillStyle=&#x27;#3a2c66&#x27;; ctx.shadowColor=&#x27;#7b2ff7&#x27;; }
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle= warn?&#x27;#fff&#x27;:&#x27;#9a7fff&#x27;; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  });

  // ship (if alive)
  if(!gameOver){
    var glow=8+Math.sin(t*0.2)*4;
    ctx.save();
    ctx.translate(SHIP_X, ship.y);
    ctx.rotate(Math.max(-0.4,Math.min(0.4, ship.vy*0.03)));
    ctx.shadowColor=&#x27;#00e5ff&#x27;; ctx.shadowBlur=glow+8;
    ctx.fillStyle=&#x27;#00e5ff&#x27;;
    ctx.beginPath();
    ctx.moveTo(SHIP_R,0);
    ctx.lineTo(-SHIP_R*0.8,-SHIP_R*0.7);
    ctx.lineTo(-SHIP_R*0.4,0);
    ctx.lineTo(-SHIP_R*0.8,SHIP_R*0.7);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=&#x27;#ff3cac&#x27;;
    ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.fill();
    ctx.restore();
  }

  // particles
  particles.forEach(function(pt){
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.c;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.sz,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function explode(){
  gameOver=true; running=false;
  burst(SHIP_X, ship.y, [&#x27;#00e5ff&#x27;,&#x27;#ff3cac&#x27;,&#x27;#ffd23c&#x27;,&#x27;#fff&#x27;], 40, 8);
  flash.style.transition=&#x27;none&#x27;; flash.style.opacity=&#x27;0.7&#x27;;
  setTimeout(function(){ flash.style.transition=&#x27;opacity 0.6s&#x27;; flash.style.opacity=&#x27;0&#x27;; },30);
  // animate particles a bit even though loop stopped
  var frames=0;
  function fade(){
    for(var p=particles.length-1;p&gt;=0;p--){
      var pt=particles[p];
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.08; pt.life-=0.025;
      if(pt.life&lt;=0) particles.splice(p,1);
    }
    draw();
    frames++;
    if(frames&lt;50) requestAnimationFrame(fade);
    else {
      overlay.innerHTML=&#x27;CRASHED!&lt;small&gt;Score &#x27;+score+&#x27; &amp;middot; Best streak &#x27;+bestStreak+&#x27;&lt;br&gt;Press Start below to fly again&lt;/small&gt;&#x27;;
      overlay.style.display=&#x27;flex&#x27;;
    }
  }
  fade();
}

function startGame(){
  if(running) return;
  overlay.style.display=&#x27;none&#x27;;
  flash.style.opacity=&#x27;0&#x27;;
  reset();
  running=true;
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  running=false;
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  if(!gameOver){ overlay.innerHTML=&#x27;PAUSED&lt;small&gt;Press Start below to resume&lt;/small&gt;&#x27;; overlay.style.display=&#x27;flex&#x27;; }
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ jump(); e.preventDefault(); }
});
cv.addEventListener(&#x27;click&#x27;, jump);
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static frame
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
