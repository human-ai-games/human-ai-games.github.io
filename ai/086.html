<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>☄ Comet Dash</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
       background: linear-gradient(90deg,#7df9ff,#ff7de9,#ffe97d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9aa; max-width: 600px; margin: 0; line-height: 1.4; text-align: center; }

  canvas { display: block; border-radius: 10px; box-shadow: 0 0 30px rgba(80,120,255,.25); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;☄ Comet Dash&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to jump — press again in mid-air to double-jump over asteroid clusters. Clip the floating coins for bonus points; use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;660&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;

&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}
  },true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = cv.width, H = cv.height;
var GROUND_Y = H - 46;
var running = false, animId = null, gameOver = false;
var lastT = 0;

// Parallax layers
var stars = [], nebulae = [];
function initBG(){
  stars = [];
  for(var l=0;l&lt;3;l++){
    var count = [40,30,20][l];
    for(var i=0;i&lt;count;i++){
      stars.push({x:Math.random()*W, y:Math.random()*(GROUND_Y-10), r:(l+1)*0.6+Math.random()*0.6,
                  sp:(l+1)*18, tw:Math.random()*Math.PI*2, layer:l});
    }
  }
  nebulae = [];
  var cols = [&#x27;rgba(120,60,180,0.18)&#x27;,&#x27;rgba(40,90,180,0.16)&#x27;,&#x27;rgba(180,60,120,0.14)&#x27;];
  for(var i=0;i&lt;3;i++){
    nebulae.push({x:Math.random()*W, y:40+Math.random()*(GROUND_Y-120), r:80+Math.random()*70,
                  sp:8+i*4, col:cols[i%cols.length]});
  }
}

// Comet
var hero, coins, asteroids, particles, sparks;
var score, speed, baseSpeed, spawnTimer, spawnGap, hue, shake, flashT;

function reset(){
  hero = {x:90, y:GROUND_Y-24, vy:0, size:22, jumps:0};
  coins = []; asteroids = []; particles = []; sparks = [];
  score = 0; baseSpeed = 200; speed = baseSpeed;
  spawnTimer = 0; spawnGap = 1.5; hue = 0; shake = 0; flashT = 0;
  gameOver = false;
  initBG();
}

var GRAVITY = 1500, JUMP_V = -520;

function jump(){
  if(!running || gameOver) return;
  if(hero.jumps &lt; 2){
    hero.vy = JUMP_V;
    hero.jumps++;
    // burst
    for(var i=0;i&lt;10;i++){
      particles.push({x:hero.x, y:hero.y+hero.size/2, vx:(Math.random()-.5)*120-40,
        vy:(Math.random()-.2)*120+40, life:0.5, max:0.5, hue:hue, r:2+Math.random()*2});
    }
  }
}

function spawnCluster(){
  var count = 1 + (Math.random()&lt;0.4?1:0);
  var baseX = W + 20;
  var maxH = 0;
  for(var c=0;c&lt;count;c++){
    var w = 34 + Math.random()*36;
    var h = 26 + Math.random()*46;
    // jagged polygon points
    var pts = [];
    var n = 7 + Math.floor(Math.random()*3);
    for(var i=0;i&lt;n;i++){
      var ang = (i/n)*Math.PI*2;
      var rad = 0.5 + Math.random()*0.5;
      pts.push({ax:Math.cos(ang)*rad, ay:Math.sin(ang)*rad});
    }
    var ax = baseX + c*(w+10);
    asteroids.push({x:ax, y:GROUND_Y-h, w:w, h:h, pts:pts, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*1.5});
    if(h&gt;maxH){ maxH=h; }
  }
  // coin above roughly 55% of the time
  if(Math.random()&lt;0.6){
    coins.push({x:baseX + Math.random()*30, y:GROUND_Y-maxH-40-Math.random()*30, got:false, ph:Math.random()*Math.PI*2});
  }
}

function speedFlash(){ flashT = 0.35; }

function update(dt){
  hue = (hue + dt*60)%360;
  // background scroll
  for(var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    s.x -= s.sp*(speed/baseSpeed)*dt;
    if(s.x &lt; -4){ s.x = W+4; s.y = Math.random()*(GROUND_Y-10); }
    s.tw += dt*3;
  }
  for(var i=0;i&lt;nebulae.length;i++){
    var nb = nebulae[i];
    nb.x -= nb.sp*(speed/baseSpeed)*dt;
    if(nb.x &lt; -nb.r){ nb.x = W+nb.r; nb.y = 40+Math.random()*(GROUND_Y-120); }
  }

  // hero physics
  hero.vy += GRAVITY*dt;
  hero.y += hero.vy*dt;
  var floor = GROUND_Y - hero.size;
  if(hero.y &gt; floor){ hero.y = floor; hero.vy = 0; hero.jumps = 0; }
  if(hero.y &lt; 0){ hero.y = 0; hero.vy = 0; }

  // trail particles
  particles.push({x:hero.x-6, y:hero.y+hero.size/2, vx:-speed*0.3-30, vy:(Math.random()-.5)*40,
    life:0.55, max:0.55, hue:hue, r:3+Math.random()*3});
  for(var i=particles.length-1;i&gt;=0;i--){
    var p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 200*dt; p.life -= dt;
    if(p.life&lt;=0) particles.splice(i,1);
  }

  // spawn
  spawnTimer += dt;
  if(spawnTimer &gt;= spawnGap){
    spawnTimer = 0;
    spawnGap = Math.max(0.8, 1.6 - (speed-baseSpeed)/600) * (0.8+Math.random()*0.5);
    spawnCluster();
  }

  // asteroids
  for(var i=asteroids.length-1;i&gt;=0;i--){
    var a = asteroids[i];
    a.x -= speed*dt;
    a.rot += a.vr*dt*0.3;
    if(a.x + a.w &lt; -10){ asteroids.splice(i,1); continue; }
    // collision (AABB-ish, slightly forgiving)
    var pad = 5;
    if(hero.x+hero.size-pad &gt; a.x &amp;&amp; hero.x+pad &lt; a.x+a.w &amp;&amp;
       hero.y+hero.size-pad &gt; a.y){
      explode();
      return;
    }
    // scored when passed
    if(!a.scored &amp;&amp; a.x+a.w &lt; hero.x){ a.scored = true; addScore(1); }
  }

  // coins
  for(var i=coins.length-1;i&gt;=0;i--){
    var cn = coins[i];
    cn.x -= speed*dt;
    cn.ph += dt*4;
    if(cn.x &lt; -30){ coins.splice(i,1); continue; }
    if(!cn.got){
      var cr = 12;
      var cx = cn.x, cy = cn.y;
      var hx = hero.x+hero.size/2, hy = hero.y+hero.size/2;
      if(Math.abs(hx-cx) &lt; cr+hero.size/2 &amp;&amp; Math.abs(hy-cy) &lt; cr+hero.size/2){
        cn.got = true;
        addScore(1);
        for(var k=0;k&lt;14;k++){
          sparks.push({x:cx,y:cy,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,
            life:0.6,max:0.6,hue:50,r:2+Math.random()*2});
        }
        coins.splice(i,1);
      }
    }
  }

  // sparks
  for(var i=sparks.length-1;i&gt;=0;i--){
    var sp = sparks[i];
    sp.x += sp.vx*dt; sp.y += sp.vy*dt; sp.vy += 300*dt; sp.life -= dt;
    if(sp.life&lt;=0) sparks.splice(i,1);
  }

  if(shake &gt; 0) shake -= dt*40;
  if(flashT &gt; 0) flashT -= dt;
}

var lastMilestone = 0;
function addScore(n){
  score += n;
  scoreMilestoneCheck();
}
function scoreMilestoneCheck(){
  var m = Math.floor(score/5);
  if(m &gt; lastMilestone){
    lastMilestone = m;
    speed += 45;
    speedFlash();
  }
}

function explode(){
  gameOver = true;
  shake = 14;
  for(var i=0;i&lt;40;i++){
    var ang = Math.random()*Math.PI*2, sp = 80+Math.random()*280;
    sparks.push({x:hero.x+hero.size/2, y:hero.y+hero.size/2,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:0.9, max:0.9,
      hue:(hue+Math.random()*60)%360, r:2+Math.random()*3});
  }
  stopGame(true);
}

function draw(){
  ctx.save();
  var ox=0, oy=0;
  if(shake&gt;0){ ox=(Math.random()-.5)*shake; oy=(Math.random()-.5)*shake; }
  ctx.translate(ox,oy);

  // sky gradient
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,&#x27;#0a0620&#x27;); g.addColorStop(0.6,&#x27;#0e0a2e&#x27;); g.addColorStop(1,&#x27;#160b30&#x27;);
  ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);

  // nebulae
  for(var i=0;i&lt;nebulae.length;i++){
    var nb = nebulae[i];
    var rg = ctx.createRadialGradient(nb.x,nb.y,0,nb.x,nb.y,nb.r);
    rg.addColorStop(0,nb.col); rg.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(nb.x,nb.y,nb.r,0,Math.PI*2); ctx.fill();
  }

  // stars
  for(var i=0;i&lt;stars.length;i++){
    var s = stars[i];
    var a = 0.5 + 0.5*Math.sin(s.tw);
    ctx.globalAlpha = a * (0.4 + s.layer*0.2);
    ctx.fillStyle = &#x27;#dff&#x27;;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ground neon ridge
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y);
  var step = 30;
  for(var x=0;x&lt;=W;x+=step){
    var yy = GROUND_Y + Math.sin((x+ (performance.now()/1000)*0)*0.05)*4;
    ctx.lineTo(x, GROUND_Y - (Math.sin(x*0.08)*3));
  }
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
  var gg = ctx.createLinearGradient(0,GROUND_Y,0,H);
  gg.addColorStop(0,&#x27;rgba(90,40,140,0.9)&#x27;); gg.addColorStop(1,&#x27;rgba(20,5,40,1)&#x27;);
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = &#x27;#c46bff&#x27;; ctx.lineWidth = 2;
  ctx.shadowColor = &#x27;#c46bff&#x27;; ctx.shadowBlur = 12;
  ctx.beginPath();
  for(var x=0;x&lt;=W;x+=step){
    var y = GROUND_Y - (Math.sin(x*0.08)*3);
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // asteroids
  for(var i=0;i&lt;asteroids.length;i++){
    var a = asteroids[i];
    var cx = a.x + a.w/2, cy = a.y + a.h/2;
    // shadow
    ctx.save();
    ctx.translate(cx+4, cy+4);
    ctx.fillStyle = &#x27;rgba(0,0,0,0.35)&#x27;;
    drawPoly(a);
    ctx.restore();
    // body
    ctx.save();
    ctx.translate(cx, cy);
    var rg = ctx.createRadialGradient(-a.w*0.2,-a.h*0.2,2,0,0,a.w*0.7);
    rg.addColorStop(0,&#x27;#8a7f74&#x27;); rg.addColorStop(1,&#x27;#463f38&#x27;);
    ctx.fillStyle = rg;
    drawPoly(a);
    ctx.strokeStyle = &#x27;#2b2620&#x27;; ctx.lineWidth = 2; ctx.stroke();
    // rocky texture spots
    ctx.fillStyle = &#x27;rgba(60,52,44,0.6)&#x27;;
    for(var t=0;t&lt;3;t++){
      ctx.beginPath();
      ctx.arc((Math.sin(a.rot*3+t)*a.w*0.25), (Math.cos(a.rot*2+t)*a.h*0.25), 3+t, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // coins
  for(var i=0;i&lt;coins.length;i++){
    var cn = coins[i];
    var wob = Math.abs(Math.cos(cn.ph));
    ctx.save();
    ctx.shadowColor = &#x27;#ffd94d&#x27;; ctx.shadowBlur = 14;
    ctx.fillStyle = &#x27;#ffd94d&#x27;;
    ctx.beginPath();
    ctx.ellipse(cn.x, cn.y + Math.sin(cn.ph)*3, 11*wob+2, 11, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = &#x27;#a67c00&#x27;; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  // trail particles
  for(var i=0;i&lt;particles.length;i++){
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = &#x27;hsl(&#x27;+p.hue+&#x27;,100%,65%)&#x27;;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.max),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // comet
  if(!gameOver){
    var hc = &#x27;hsl(&#x27;+hue+&#x27;,100%,60%)&#x27;;
    ctx.save();
    ctx.shadowColor = hc; ctx.shadowBlur = 22;
    var grd = ctx.createRadialGradient(hero.x+hero.size*0.35,hero.y+hero.size*0.35,2,
       hero.x+hero.size/2,hero.y+hero.size/2,hero.size*0.8);
    grd.addColorStop(0,&#x27;#ffffff&#x27;); grd.addColorStop(0.5,hc); grd.addColorStop(1,&#x27;hsl(&#x27;+((hue+40)%360)+&#x27;,100%,45%)&#x27;);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(hero.x+hero.size/2, hero.y+hero.size/2, hero.size/2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // sparks (explosion / coin)
  for(var i=0;i&lt;sparks.length;i++){
    var sp = sparks[i];
    ctx.globalAlpha = Math.max(0, sp.life/sp.max);
    ctx.fillStyle = &#x27;hsl(&#x27;+sp.hue+&#x27;,100%,60%)&#x27;;
    ctx.beginPath(); ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // speed flash
  if(flashT &gt; 0){
    ctx.fillStyle = &#x27;rgba(180,220,255,&#x27;+ (flashT*0.9) +&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#fff&#x27;;
    ctx.font = &#x27;bold 34px system-ui&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.globalAlpha = Math.min(1, flashT*3);
    ctx.fillText(&#x27;SPEED UP!&#x27;, W/2, H/2);
    ctx.globalAlpha = 1;
    ctx.textAlign = &#x27;left&#x27;;
  }

  // HUD score
  ctx.save();
  ctx.shadowColor = &#x27;#7df9ff&#x27;; ctx.shadowBlur = 16;
  ctx.fillStyle = &#x27;#eaffff&#x27;;
  ctx.font = &#x27;bold 40px system-ui&#x27;;
  ctx.textAlign = &#x27;left&#x27;;
  ctx.fillText(score, 22, 52);
  ctx.restore();
  ctx.font = &#x27;13px system-ui&#x27;; ctx.fillStyle = &#x27;#8ad&#x27;; 
  ctx.fillText(&#x27;SCORE&#x27;, 24, 66);

  if(gameOver){
    ctx.fillStyle = &#x27;rgba(0,0,0,0.45)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = &#x27;#ff6b9d&#x27;;
    ctx.font = &#x27;bold 40px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(&#x27;BOOM!&#x27;, W/2, H/2-10);
    ctx.fillStyle = &#x27;#eee&#x27;; ctx.font = &#x27;18px system-ui&#x27;;
    ctx.fillText(&#x27;Score: &#x27;+score+&#x27; — press Start to fly again&#x27;, W/2, H/2+26);
    ctx.textAlign=&#x27;left&#x27;;
  }
}

function drawPoly(a){
  ctx.beginPath();
  for(var i=0;i&lt;a.pts.length;i++){
    var p = a.pts[i];
    var px = p.ax*a.w/2, py = p.ay*a.h/2;
    // rotate slightly
    var cr = Math.cos(a.rot), sr = Math.sin(a.rot);
    var rx = px*cr - py*sr, ry = px*sr + py*cr;
    if(i===0) ctx.moveTo(rx,ry); else ctx.lineTo(rx,ry);
  }
  ctx.closePath(); ctx.fill();
}

function frame(t){
  if(!running &amp;&amp; !gameOver) return;
  var dt = Math.min(0.05, (t - lastT)/1000 || 0);
  lastT = t;
  if(running) update(dt);
  else {
    // freeze but keep decaying sparks/shake for clean explosion frame
    for(var i=sparks.length-1;i&gt;=0;i--){
      var sp=sparks[i]; sp.x+=sp.vx*dt; sp.y+=sp.vy*dt; sp.vy+=300*dt; sp.life-=dt;
      if(sp.life&lt;=0) sparks.splice(i,1);
    }
    if(shake&gt;0) shake-=dt*40;
  }
  draw();
  if(running || sparks.length&gt;0 || shake&gt;0){
    animId = requestAnimationFrame(frame);
  } else {
    animId = requestAnimationFrame(frame); // keep drawing frozen game-over frame
  }
}

function startGame(){
  reset();
  lastMilestone = 0;
  running = true;
  lastT = performance.now();
  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(frame);
}
function stopGame(fromExplode){
  running = false;
  if(!fromExplode){
    if(animId){ cancelAnimationFrame(animId); animId = null; }
  }
}

function doJump(){ jump(); }
window.addEventListener(&#x27;keydown&#x27;, function(e){
  if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ doJump(); e.preventDefault(); }
});
cv.addEventListener(&#x27;mousedown&#x27;, function(){ doJump(); });

window.addEventListener(&#x27;message&#x27;, function(e){
  if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;){ running=false; if(animId){cancelAnimationFrame(animId);animId=null;} }
});

// initial static frame
reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
