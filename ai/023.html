<body>

  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #d8e8ff; overflow: hidden; }

    text-shadow: 0 0 18px rgba(0,234,255,.4); }

  #score { color: #00eaff; text-shadow: 0 0 10px rgba(0,234,255,.6); }

  @keyframes pulseready { 0%,100%{opacity:1} 50%{opacity:.55} }

                radial-gradient(circle at 75% 70%, rgba(0,80,140,.45), transparent 55%),

  #banner.show { animation: pop .9s ease-out; }
  @keyframes pop { 0%{opacity:0; transform:scale(.4)} 25%{opacity:1; transform:scale(1.15)} 60%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(1.05)} }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC BARRAGE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt;, fire plasma with &lt;strong&gt;Space&lt;/strong&gt;, and unleash a screen-clearing bomb with &lt;strong&gt;B&lt;/strong&gt;. Blast aliens for points, chain quick kills for a combo, and use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;lab&quot;&gt;SCORE&lt;/span&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;lab&quot;&gt;COMBO&lt;/span&gt;&lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;bombwrap&quot;&gt;&lt;span class=&quot;lab&quot;&gt;BOMB [B]&lt;/span&gt;&lt;div class=&quot;bombbar&quot;&gt;&lt;div class=&quot;bombfill ready&quot; id=&quot;bombfill&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;banner&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FW = 640, FH = 460;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), comboEl = document.getElementById(&#x27;combo&#x27;);
  var bombfill = document.getElementById(&#x27;bombfill&#x27;), banner = document.getElementById(&#x27;banner&#x27;);

  var running = false, animId = null;
  var keys = {};
  var score = 0;

  // ship
  var SHIP_W = 34, SHIP_H = 28, ship = { x: FW/2, y: FH - 30, hitFlash: 0 };

  var bullets = [], enemies = [], particles = [], waves = [];
  var lastShot = 0;
  var spawnTimer = 0, spawnInterval = 1100, elapsed = 0;

  // combo
  var combo = 1, killTimes = [];
  var lastKill = 0;

  // bomb
  var BOMB_CD = 15000, bombReady = 0; // timestamp when ready

  // starfield
  var stars = [];
  for (var i=0;i&lt;70;i++) stars.push({ x: Math.random()*FW, y: Math.random()*FH, s: Math.random()*2+0.5, sp: Math.random()*0.5+0.15 });

  function reset() {
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    combo = 1; comboEl.textContent = &#x27;x1&#x27;; killTimes = [];
    bullets = []; enemies = []; particles = []; waves = [];
    ship.x = FW/2; ship.hitFlash = 0;
    lastShot = 0; spawnTimer = 0; spawnInterval = 1100; elapsed = 0;
    bombReady = 0;
    for (var k in keys) keys[k] = false;
  }

  function spawnEnemy() {
    var r = Math.random();
    // more variety over time
    var t;
    if (elapsed &lt; 8000) t = r &lt; 0.7 ? &#x27;zig&#x27; : (r &lt; 0.9 ? &#x27;rock&#x27; : &#x27;ufo&#x27;);
    else t = r &lt; 0.45 ? &#x27;zig&#x27; : (r &lt; 0.78 ? &#x27;rock&#x27; : &#x27;ufo&#x27;);
    var e;
    if (t === &#x27;zig&#x27;) e = { type:&#x27;zig&#x27;, r:13, x: Math.random()*(FW-40)+20, y:-20, vy: 2.4+Math.random()*0.8, hp:1, pts:1, phase:Math.random()*6, ang:0, color:&#x27;#39ff88&#x27; };
    else if (t === &#x27;rock&#x27;) e = { type:&#x27;rock&#x27;, r:20, x: Math.random()*(FW-50)+25, y:-24, vy: 1.5+Math.random()*0.5, hp:1, pts:2, ang:0, spin:(Math.random()&lt;.5?-1:1)*0.05, color:&#x27;#ffb347&#x27; };
    else e = { type:&#x27;ufo&#x27;, r:26, x: Math.random()*(FW-60)+30, y:-30, vy: 0.9+Math.random()*0.3, hp:2, pts:3, ang:0, flash:0, color:&#x27;#c15bff&#x27; };
    enemies.push(e);
  }

  function shoot() {
    var now = performance.now();
    if (now - lastShot &lt; 220) return;
    lastShot = now;
    bullets.push({ x: ship.x, y: ship.y - SHIP_H/2, vy: -9, trail: [] });
    beep(880, 0.05, &#x27;square&#x27;, 0.06);
  }

  function fireBomb() {
    var now = performance.now();
    if (now &lt; bombReady) return;
    bombReady = now + BOMB_CD;
    waves.push({ r: 0, max: Math.hypot(FW,FH), x: ship.x, y: ship.y });
    // destroy all enemies with explosions
    for (var i=0;i&lt;enemies.length;i++) { explode(enemies[i]); addScore(enemies[i].pts); }
    enemies = [];
    beep(120, 0.5, &#x27;sawtooth&#x27;, 0.18);
    beep(60, 0.6, &#x27;sine&#x27;, 0.15);
  }

  function explode(e) {
    for (var i=0;i&lt;16;i++) {
      var a = Math.random()*Math.PI*2, sp = Math.random()*3.5+1;
      particles.push({ x:e.x, y:e.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:e.color });
    }
  }

  function addScore(base) {
    score += base * combo;
    scoreEl.textContent = score;
  }

  function registerKill(e) {
    explode(e);
    addScore(e.pts);
    var now = performance.now();
    killTimes.push(now);
    killTimes = killTimes.filter(function(t){ return now - t &lt; 2000; });
    if (killTimes.length &gt;= 3 &amp;&amp; combo === 1) {
      combo = 2; comboEl.textContent = &#x27;x2&#x27;;
      showBanner(&#x27;COMBO x2!&#x27;);
    }
    lastKill = now;
    beep(440, 0.08, &#x27;triangle&#x27;, 0.05);
  }

  function showBanner(txt) {
    banner.textContent = txt;
    banner.classList.remove(&#x27;show&#x27;); void banner.offsetWidth; banner.classList.add(&#x27;show&#x27;);
  }

  function update(dt) {
    elapsed += dt;
    // stars
    for (var s=0;s&lt;stars.length;s++){ stars[s].y += stars[s].sp * dt/16; if (stars[s].y &gt; FH){ stars[s].y = 0; stars[s].x = Math.random()*FW; } }

    // ship movement
    if (keys[&#x27;ArrowLeft&#x27;]) ship.x -= 6;
    if (keys[&#x27;ArrowRight&#x27;]) ship.x += 6;
    ship.x = Math.max(SHIP_W/2, Math.min(FW - SHIP_W/2, ship.x));
    if (ship.hitFlash &gt; 0) ship.hitFlash -= dt;

    // combo decay
    if (combo &gt; 1 &amp;&amp; performance.now() - lastKill &gt; 2000) { combo = 1; comboEl.textContent = &#x27;x1&#x27;; }

    // spawn
    spawnTimer += dt;
    spawnInterval = Math.max(420, 1100 - elapsed/40);
    if (spawnTimer &gt;= spawnInterval) { spawnTimer = 0; spawnEnemy(); }

    // bullets
    for (var i=bullets.length-1;i&gt;=0;i--) {
      var b = bullets[i];
      b.trail.unshift({x:b.x,y:b.y}); if (b.trail.length&gt;6) b.trail.pop();
      b.y += b.vy;
      if (b.y &lt; -20) { bullets.splice(i,1); continue; }
    }

    // enemies
    for (var j=enemies.length-1;j&gt;=0;j--) {
      var e = enemies[j];
      e.y += e.vy;
      if (e.type === &#x27;zig&#x27;) { e.phase += 0.08; e.x += Math.sin(e.phase)*2.2; }
      else if (e.type === &#x27;rock&#x27;) e.ang += e.spin;
      else if (e.type === &#x27;ufo&#x27;) { if (e.flash&gt;0) e.flash -= dt; }
      if (e.y - e.r &gt; FH) {
        enemies.splice(j,1);
        ship.hitFlash = 300;
        combo = 1; comboEl.textContent = &#x27;x1&#x27;; killTimes = [];
        beep(90, 0.2, &#x27;sawtooth&#x27;, 0.1);
        continue;
      }
    }

    // collisions
    for (var bi=bullets.length-1;bi&gt;=0;bi--) {
      var bl = bullets[bi];
      for (var ei=enemies.length-1;ei&gt;=0;ei--) {
        var en = enemies[ei];
        var d = Math.hypot(bl.x-en.x, bl.y-en.y);
        if (d &lt; en.r + 4) {
          bullets.splice(bi,1);
          en.hp -= 1;
          if (en.hp &lt;= 0) { enemies.splice(ei,1); registerKill(en); }
          else { en.flash = 180; beep(300,0.05,&#x27;square&#x27;,0.04); }
          break;
        }
      }
    }

    // particles
    for (var p=particles.length-1;p&gt;=0;p--) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy; pt.vx*=0.94; pt.vy*=0.94;
      pt.life -= dt/500;
      if (pt.life &lt;= 0) particles.splice(p,1);
    }

    // bomb waves
    for (var w=waves.length-1;w&gt;=0;w--) {
      waves[w].r += 22;
      if (waves[w].r &gt; waves[w].max) waves.splice(w,1);
    }

    // bomb cooldown bar
    var now = performance.now();
    if (now &gt;= bombReady) { bombfill.style.width = &#x27;100%&#x27;; bombfill.classList.add(&#x27;ready&#x27;); }
    else {
      bombfill.classList.remove(&#x27;ready&#x27;);
      var pct = 100 * (1 - (bombReady - now)/BOMB_CD);
      bombfill.style.width = Math.max(0,pct) + &#x27;%&#x27;;
    }
  }

  function draw() {
    ctx.clearRect(0,0,FW,FH);
    // stars
    for (var s=0;s&lt;stars.length;s++){ var st=stars[s]; ctx.fillStyle=&#x27;rgba(200,220,255,&#x27;+(0.3+st.s*0.3)+&#x27;)&#x27;; ctx.fillRect(st.x, st.y, st.s, st.s); }

    // particles
    for (var p=0;p&lt;particles.length;p++){ var pt=particles[p];
      ctx.globalAlpha = Math.max(0,pt.life);
      ctx.fillStyle = pt.color;
      ctx.shadowColor = pt.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    // bomb waves
    for (var w=0;w&lt;waves.length;w++){ var wv=waves[w];
      ctx.strokeStyle = &#x27;rgba(0,234,255,&#x27;+(1-wv.r/wv.max)+&#x27;)&#x27;;
      ctx.lineWidth = 6; ctx.shadowColor=&#x27;#00eaff&#x27;; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, 6.29); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // enemies
    for (var j=0;j&lt;enemies.length;j++){ var e=enemies[j];
      ctx.save(); ctx.translate(e.x, e.y);
      var col = e.color;
      if (e.type===&#x27;ufo&#x27; &amp;&amp; e.flash&gt;0 &amp;&amp; Math.floor(e.flash/60)%2===0) col = &#x27;#ffffff&#x27;;
      if ((e.type===&#x27;zig&#x27;||e.type===&#x27;rock&#x27;) &amp;&amp; e.flash&gt;0) col=&#x27;#ffffff&#x27;;
      ctx.shadowColor = e.color; ctx.shadowBlur = 14; ctx.fillStyle = col; ctx.strokeStyle = col;
      if (e.type===&#x27;zig&#x27;) {
        // little zigzagger creature
        ctx.beginPath(); ctx.arc(0,0,e.r,0,6.29); ctx.fill();
        ctx.fillStyle=&#x27;#05010f&#x27;;
        ctx.beginPath(); ctx.arc(-4,-2,3,0,6.29); ctx.arc(4,-2,3,0,6.29); ctx.fill();
      } else if (e.type===&#x27;rock&#x27;) {
        ctx.rotate(e.ang);
        ctx.beginPath();
        for (var k=0;k&lt;8;k++){ var ang=k/8*6.29; var rr=e.r*(0.75+0.25*((k%2)?1:0.6)); ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr); }
        ctx.closePath(); ctx.fill();
      } else {
        // ufo
        ctx.beginPath(); ctx.ellipse(0,4,e.r,e.r*0.5,0,0,6.29); ctx.fill();
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0,-4,e.r*0.5,Math.PI,0); ctx.fill();
        ctx.fillStyle=&#x27;#05010f&#x27;; ctx.beginPath(); ctx.arc(-8,4,3,0,6.29); ctx.arc(0,4,3,0,6.29); ctx.arc(8,4,3,0,6.29); ctx.fill();
      }
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // bullets with trailing glow
    for (var b=0;b&lt;bullets.length;b++){ var bl=bullets[b];
      for (var t=0;t&lt;bl.trail.length;t++){ var tr=bl.trail[t];
        ctx.globalAlpha = (1 - t/bl.trail.length)*0.5;
        ctx.fillStyle=&#x27;#00eaff&#x27;; ctx.beginPath(); ctx.arc(tr.x, tr.y, 3.5-t*0.4, 0, 6.29); ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle=&#x27;#eaffff&#x27;; ctx.shadowColor=&#x27;#00eaff&#x27;; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(bl.x, bl.y, 4, 0, 6.29); ctx.fill(); ctx.shadowBlur=0;
    }

    // ship
    ctx.save(); ctx.translate(ship.x, ship.y);
    var shipCol = (ship.hitFlash&gt;0 &amp;&amp; Math.floor(ship.hitFlash/80)%2===0) ? &#x27;#ff3b3b&#x27; : &#x27;#00eaff&#x27;;
    ctx.shadowColor = shipCol; ctx.shadowBlur = 16; ctx.fillStyle = shipCol;
    ctx.beginPath();
    ctx.moveTo(0, -SHIP_H/2);
    ctx.lineTo(SHIP_W/2, SHIP_H/2);
    ctx.lineTo(0, SHIP_H/4);
    ctx.lineTo(-SHIP_W/2, SHIP_H/2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=&#x27;#ff2bd6&#x27;; ctx.beginPath(); ctx.arc(0,0,4,0,6.29); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
  }

  var lastTs = 0;
  function loop(ts) {
    if (!running) return;
    var dt = lastTs ? ts - lastTs : 16; lastTs = ts;
    if (dt &gt; 60) dt = 60;
    update(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.06;
      o.connect(g); g.connect(actx.destination);
      var now = actx.currentTime;
      g.gain.setValueAtTime(vol||0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now+dur);
      o.start(now); o.stop(now+dur);
    } catch(_) {}
  }

  function startGame() {
    if (running) return;
    reset();
    running = true; lastTs = 0;
    draw();
    animId = requestAnimationFrame(loop);
    spawnEnemy(); // immediate action
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) { keys[e.key]=true; e.preventDefault(); }
    else if (e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;) { if (running) shoot(); e.preventDefault(); }
    else if (e.key===&#x27;b&#x27;||e.key===&#x27;B&#x27;) { if (running) fireBomb(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  });
  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t, function(e){
      try { window.parent.postMessage({ type:&#x27;game_input&#x27;, kind:t, key:e.key||null }, &#x27;*&#x27;); } catch(_){}
    }, true);
  });

  draw(); // show initial scene while stopped
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
