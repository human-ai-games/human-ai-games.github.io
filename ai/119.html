&lt;html&gt;&lt;head&gt;&lt;style&gt;

  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt;, rotate with &lt;strong&gt;&amp;uarr;&lt;/strong&gt;, and soft-drop with &lt;strong&gt;&amp;darr;&lt;/strong&gt;. Clear full rows for combo points and press the Start button below.&lt;/p&gt;
  &lt;div class=&quot;layout&quot;&gt;
    &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
      &lt;div class=&quot;banner&quot; id=&quot;banner&quot;&gt;&lt;h2&gt;🎉 GAME OVER 🎉&lt;/h2&gt;&lt;p id=&quot;finalMsg&quot;&gt;Score: 0&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sidebar&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Score&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;scoreVal&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Rows&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;rowsVal&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Level&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;levelVal&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;div class=&quot;label&quot;&gt;Next&lt;/div&gt;&lt;div class=&quot;preview&quot; id=&quot;preview&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 28, COLS = 10, ROWS = 16;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var field = document.getElementById(&#x27;field&#x27;);
  field.style.width = FIELD_W + &#x27;px&#x27;;
  field.style.height = FIELD_H + &#x27;px&#x27;;
  field.style.backgroundSize = CELL + &#x27;px &#x27; + CELL + &#x27;px&#x27;;

  var scoreEl = document.getElementById(&#x27;scoreVal&#x27;);
  var rowsEl = document.getElementById(&#x27;rowsVal&#x27;);
  var levelEl = document.getElementById(&#x27;levelVal&#x27;);
  var preview = document.getElementById(&#x27;preview&#x27;);
  var banner = document.getElementById(&#x27;banner&#x27;);
  var finalMsg = document.getElementById(&#x27;finalMsg&#x27;);

  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;,&#x27;🍈&#x27;];
  var COLORS = [&#x27;#ff8fa3&#x27;,&#x27;#ffbe6b&#x27;,&#x27;#fff07a&#x27;,&#x27;#c99cff&#x27;,&#x27;#ff9cc9&#x27;,&#x27;#8fd98f&#x27;,&#x27;#a5e6b0&#x27;];
  // Tetromino definitions: array of rotation states, each a list of [x,y] offsets.
  var SHAPES = {
    I: { color: 0, rot: [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]] },
    O: { color: 1, rot: [[[1,0],[2,0],[1,1],[2,1]]] },
    T: { color: 2, rot: [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] },
    S: { color: 3, rot: [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]] },
    Z: { color: 4, rot: [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]] },
    J: { color: 5, rot: [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] },
    L: { color: 6, rot: [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }
  };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, next, score, rows, level, running, dropId, dropMs;

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var row = [];
      for (var c = 0; c &lt; COLS; c++) row.push(-1);
      grid.push(row);
    }
  }

  function randPiece() {
    var k = KEYS[Math.floor(Math.random() * KEYS.length)];
    return { type: k, r: 0, x: 3, y: 0, color: SHAPES[k].color };
  }

  function cells(p) {
    var offs = SHAPES[p.type].rot[p.r % SHAPES[p.type].rot.length];
    var out = [];
    for (var i = 0; i &lt; offs.length; i++) out.push({ x: p.x + offs[i][0], y: p.y + offs[i][1] });
    return out;
  }

  function collides(p) {
    var cs = cells(p);
    for (var i = 0; i &lt; cs.length; i++) {
      var cx = cs[i].x, cy = cs[i].y;
      if (cx &lt; 0 || cx &gt;= COLS || cy &gt;= ROWS) return true;
      if (cy &gt;= 0 &amp;&amp; grid[cy][cx] &gt;= 0) return true;
    }
    return false;
  }

  function spawn() {
    piece = next || randPiece();
    piece.x = 3; piece.y = 0; piece.r = 0;
    next = randPiece();
    drawPreview();
    return !collides(piece);
  }

  function lock() {
    var cs = cells(piece);
    for (var i = 0; i &lt; cs.length; i++) {
      var c = cs[i];
      if (c.y &gt;= 0 &amp;&amp; c.y &lt; ROWS &amp;&amp; c.x &gt;= 0 &amp;&amp; c.x &lt; COLS) grid[c.y][c.x] = piece.color;
    }
    piece = null;
  }

  function clearRows() {
    var cleared = [];
    for (var r = ROWS - 1; r &gt;= 0; r--) {
      var full = true;
      for (var c = 0; c &lt; COLS; c++) if (grid[r][c] &lt; 0) { full = false; break; }
      if (full) cleared.push(r);
    }
    if (cleared.length === 0) return;
    // burst particles on each cleared row (before removal, using original index)
    for (var i = 0; i &lt; cleared.length; i++) burstRow(cleared[i]);
    // remove rows
    cleared.sort(function(a,b){return a-b;});
    for (var j = cleared.length - 1; j &gt;= 0; j--) {
      grid.splice(cleared[j], 1);
      var empty = [];
      for (var c2 = 0; c2 &lt; COLS; c2++) empty.push(-1);
      grid.unshift(empty);
    }
    var n = cleared.length;
    rows += n;
    var gained = 100 * n * n; // multi-row multiplier
    score += gained;
    scoreEl.textContent = score;
    rowsEl.textContent = rows;
    // pulse border
    field.classList.add(&#x27;pulse&#x27;);
    setTimeout(function(){ field.classList.remove(&#x27;pulse&#x27;); }, 200);
    // floating popup
    var midRow = cleared[Math.floor(cleared.length/2)];
    var label = n &gt; 1 ? (&#x27;+&#x27; + gained + &#x27;  x&#x27; + n + &#x27; COMBO!&#x27;) : &#x27;+100 combo&#x27;;
    floatPop(label, midRow, n);
    if (n &gt; 1) { scoreEl.classList.remove(&#x27;rainbow&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;rainbow&#x27;); }
    // level up every 10 rows
    var newLevel = 1 + Math.floor(rows / 10);
    if (newLevel !== level) {
      level = newLevel;
      levelEl.textContent = level;
      dropMs = Math.max(90, 500 - (level - 1) * 45);
      if (dropId) { clearInterval(dropId); dropId = setInterval(stepDown, dropMs); }
    }
  }

  function burstRow(r) {
    var colors = [&#x27;#ffd93b&#x27;,&#x27;#ff5ef1&#x27;,&#x27;#3bd17a&#x27;,&#x27;#3ba8ff&#x27;,&#x27;#ff6b6b&#x27;];
    for (var c = 0; c &lt; COLS; c++) {
      for (var k = 0; k &lt; 2; k++) {
        var s = document.createElement(&#x27;div&#x27;);
        s.className = &#x27;star&#x27;;
        s.textContent = &#x27;⭐&#x27;;
        s.style.fontSize = (8 + Math.random()*10) + &#x27;px&#x27;;
        s.style.left = (c * CELL + CELL/2) + &#x27;px&#x27;;
        s.style.top = (r * CELL + CELL/2) + &#x27;px&#x27;;
        s.style.color = colors[Math.floor(Math.random()*colors.length)];
        field.appendChild(s);
        var dx = (Math.random()-0.5) * 80, dy = (Math.random()-0.5) * 80;
        animateEl(s, dx, dy, 600);
      }
    }
  }

  function animateEl(el, dx, dy, dur) {
    var start = performance.now();
    function frame(t) {
      var p = Math.min(1, (t - start) / dur);
      el.style.transform = &#x27;translate(&#x27; + (dx*p) + &#x27;px,&#x27; + (dy*p) + &#x27;px) scale(&#x27; + (1-p) + &#x27;)&#x27;;
      el.style.opacity = 1 - p;
      if (p &lt; 1) requestAnimationFrame(frame);
      else if (el.parentNode) el.parentNode.removeChild(el);
    }
    requestAnimationFrame(frame);
  }

  function floatPop(text, row, n) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;pop&#x27;;
    el.textContent = text;
    el.style.fontSize = (16 + n*2) + &#x27;px&#x27;;
    el.style.color = n &gt; 1 ? &#x27;#ff5ef1&#x27; : &#x27;#6a4bff&#x27;;
    el.style.left = &#x27;10px&#x27;;
    el.style.top = (row * CELL) + &#x27;px&#x27;;
    field.appendChild(el);
    var start = performance.now();
    function frame(t) {
      var p = Math.min(1, (t - start) / 1000);
      el.style.transform = &#x27;translateY(&#x27; + (-40*p) + &#x27;px)&#x27;;
      el.style.opacity = 1 - p;
      if (p &lt; 1) requestAnimationFrame(frame);
      else if (el.parentNode) el.parentNode.removeChild(el);
    }
    requestAnimationFrame(frame);
  }

  function paint() {
    // remove only cell nodes, keep banner and effects
    var old = field.querySelectorAll(&#x27;.cell&#x27;);
    for (var i = 0; i &lt; old.length; i++) old[i].parentNode.removeChild(old[i]);
    for (var r = 0; r &lt; ROWS; r++)
      for (var c = 0; c &lt; COLS; c++)
        if (grid[r][c] &gt;= 0) drawCell(c, r, grid[r][c]);
    if (piece) {
      var cs = cells(piece);
      for (var j = 0; j &lt; cs.length; j++)
        if (cs[j].y &gt;= 0) drawCell(cs[j].x, cs[j].y, piece.color);
    }
  }

  function drawCell(cx, cy, color) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell&#x27;;
    el.style.left = (cx * CELL) + &#x27;px&#x27;;
    el.style.top = (cy * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    el.style.background = COLORS[color];
    el.textContent = FRUITS[color];
    field.appendChild(el);
  }

  function drawPreview() {
    preview.innerHTML = &#x27;&#x27;;
    if (!next) return;
    var offs = SHAPES[next.type].rot[0];
    var minx = 9, miny = 9;
    for (var i = 0; i &lt; offs.length; i++) { if (offs[i][0]&lt;minx) minx=offs[i][0]; if (offs[i][1]&lt;miny) miny=offs[i][1]; }
    var pc = 20;
    for (var j = 0; j &lt; offs.length; j++) {
      var el = document.createElement(&#x27;div&#x27;);
      el.className = &#x27;cell&#x27;;
      el.style.left = ((offs[j][0]-minx) * pc + 30) + &#x27;px&#x27;;
      el.style.top = ((offs[j][1]-miny) * pc + 20) + &#x27;px&#x27;;
      el.style.width = pc + &#x27;px&#x27;;
      el.style.height = pc + &#x27;px&#x27;;
      el.style.fontSize = &#x27;15px&#x27;;
      el.style.background = COLORS[next.color];
      el.textContent = FRUITS[next.color];
      preview.appendChild(el);
    }
  }

  function stepDown() {
    if (!piece) return;
    var nx = { type: piece.type, r: piece.r, x: piece.x, y: piece.y + 1, color: piece.color };
    if (collides(nx)) {
      lock();
      clearRows();
      if (!spawn()) { endGame(); paint(); return; }
    } else piece = nx;
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var nx = { type: piece.type, r: piece.r, x: piece.x + dx, y: piece.y, color: piece.color };
    if (!collides(nx)) { piece = nx; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var nr = (piece.r + 1) % SHAPES[piece.type].rot.length;
    var tries = [0, -1, 1, -2, 2];
    for (var i = 0; i &lt; tries.length; i++) {
      var nx = { type: piece.type, r: nr, x: piece.x + tries[i], y: piece.y, color: piece.color };
      if (!collides(nx)) { piece = nx; paint(); return; }
    }
  }

  function confettiShower() {
    for (var i = 0; i &lt; 40; i++) {
      (function(){
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;confetti&#x27;;
        el.textContent = FRUITS[Math.floor(Math.random()*FRUITS.length)];
        el.style.fontSize = (14 + Math.random()*14) + &#x27;px&#x27;;
        el.style.left = (Math.random() * FIELD_W) + &#x27;px&#x27;;
        el.style.top = &#x27;-20px&#x27;;
        field.appendChild(el);
        var delay = Math.random() * 800;
        var dur = 1500 + Math.random()*1200;
        var startX = parseFloat(el.style.left);
        var startT = performance.now() + delay;
        var rot = (Math.random()-0.5)*720;
        function frame(t) {
          if (t &lt; startT) { requestAnimationFrame(frame); return; }
          var p = Math.min(1, (t - startT) / dur);
          el.style.transform = &#x27;translate(&#x27; + (Math.sin(p*6)*20) + &#x27;px,&#x27; + (p*(FIELD_H+40)) + &#x27;px) rotate(&#x27; + (rot*p) + &#x27;deg)&#x27;;
          if (p &lt; 1) requestAnimationFrame(frame);
          else if (el.parentNode) el.parentNode.removeChild(el);
        }
        requestAnimationFrame(frame);
      })();
    }
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    finalMsg.textContent = &#x27;Score: &#x27; + score + &#x27; • Rows: &#x27; + rows;
    banner.classList.add(&#x27;show&#x27;);
    confettiShower();
  }

  function startGame() {
    banner.classList.remove(&#x27;show&#x27;);
    var conf = field.querySelectorAll(&#x27;.confetti, .star, .pop&#x27;);
    for (var i = 0; i &lt; conf.length; i++) conf[i].parentNode.removeChild(conf[i]);
    score = 0; rows = 0; level = 1; dropMs = 500;
    scoreEl.textContent = &#x27;0&#x27;; rowsEl.textContent = &#x27;0&#x27;; levelEl.textContent = &#x27;1&#x27;;
    newGrid();
    next = randPiece();
    if (!spawn()) return;
    paint();
    running = true;
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropMs);
  }

  function stopGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) stepDown(); e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
  });

  // tap zones: left third = left, right third = right, center = rotate
  field.addEventListener(&#x27;mousedown&#x27;, function (e) {
    if (!running) return;
    var rect = field.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (x &lt; FIELD_W / 3) move(-1);
    else if (x &gt; FIELD_W * 2/3) move(1);
    else rotate();
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint: empty field with a preview piece so the shape is visible
  newGrid();
  score = 0; rows = 0; level = 1; dropMs = 500;
  next = randPiece();
  piece = randPiece();
  drawPreview();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
