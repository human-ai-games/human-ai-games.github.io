&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍎 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with ←/→, rotate with ↑, soft-drop with ↓, and slam it down with the spacebar. Clear full rows for points — stack multiple rows for big combos! Use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;box&quot;&gt;Score &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Best &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;box&quot;&gt;Lvl &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;over&quot; id=&quot;over&quot;&gt;Game Over&lt;br&gt;&lt;span style=&quot;font-size:15px;font-weight:600&quot;&gt;Press Start to play again&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;button data-a=&quot;left&quot;&gt;←&lt;/button&gt;
    &lt;button data-a=&quot;rot&quot;&gt;⟳&lt;/button&gt;
    &lt;button data-a=&quot;down&quot;&gt;↓&lt;/button&gt;
    &lt;button data-a=&quot;right&quot;&gt;→&lt;/button&gt;
    &lt;button data-a=&quot;drop&quot;&gt;⬇&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 22, COLS = 10, ROWS = 20;
  var field = document.getElementById(&#x27;field&#x27;);
  var over = document.getElementById(&#x27;over&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);

  var FRUITS = [&#x27;🍎&#x27;,&#x27;🍊&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍓&#x27;,&#x27;🍉&#x27;,&#x27;🫐&#x27;];
  var COLORS = [
    &#x27;linear-gradient(145deg,#ff5252,#c62828)&#x27;,
    &#x27;linear-gradient(145deg,#ffb74d,#ef6c00)&#x27;,
    &#x27;linear-gradient(145deg,#fff176,#f9a825)&#x27;,
    &#x27;linear-gradient(145deg,#b388ff,#6a1b9a)&#x27;,
    &#x27;linear-gradient(145deg,#ff80ab,#c2185b)&#x27;,
    &#x27;linear-gradient(145deg,#69f0ae,#00897b)&#x27;,
    &#x27;linear-gradient(145deg,#82b1ff,#1565c0)&#x27;
  ];
  // Tetromino shapes as rotation states (list of [x,y] cells)
  var SHAPES = [
    // I
    [[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]],
    // O
    [[[1,0],[2,0],[1,1],[2,1]]],
    // T
    [[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
    // S
    [[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]],
    // Z
    [[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]],
    // J
    [[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
    // L
    [[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]
  ];

  var grid, piece, running = false, dropId = null, score = 0, best = 0, level = 1;

  function newGrid() {
    grid = [];
    for (var r = 0; r &lt; ROWS; r++) { var row = []; for (var c = 0; c &lt; COLS; c++) row.push(null); grid.push(row); }
  }

  function randPiece() {
    var t = Math.floor(Math.random() * SHAPES.length);
    return { type: t, rot: 0, x: 3, y: -1 };
  }

  function cellsOf(p) {
    var states = SHAPES[p.type];
    var base = states[p.rot % states.length];
    var out = [];
    for (var i = 0; i &lt; base.length; i++) out.push({ x: p.x + base[i][0], y: p.y + base[i][1] });
    return out;
  }

  function collides(p) {
    var cs = cellsOf(p);
    for (var i = 0; i &lt; cs.length; i++) {
      var x = cs[i].x, y = cs[i].y;
      if (x &lt; 0 || x &gt;= COLS || y &gt;= ROWS) return true;
      if (y &gt;= 0 &amp;&amp; grid[y][x]) return true;
    }
    return false;
  }

  function ghostPiece() {
    var g = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y };
    while (!collides({ type: g.type, rot: g.rot, x: g.x, y: g.y + 1 })) g.y++;
    return g;
  }

  function lockPiece() {
    var cs = cellsOf(piece);
    for (var i = 0; i &lt; cs.length; i++) {
      if (cs[i].y &lt; 0) { endGame(); return; }
      grid[cs[i].y][cs[i].x] = piece.type;
    }
    clearRows();
    piece = randPiece();
    if (collides(piece)) endGame();
  }

  function clearRows() {
    var full = [];
    for (var r = 0; r &lt; ROWS; r++) {
      var f = true;
      for (var c = 0; c &lt; COLS; c++) if (grid[r][c] === null) { f = false; break; }
      if (f) full.push(r);
    }
    if (full.length === 0) return;
    // burst animation
    var kids = field.querySelectorAll(&#x27;.block&#x27;);
    kids.forEach(function(el){
      var er = parseInt(el.dataset.r, 10);
      if (full.indexOf(er) !== -1) el.classList.add(&#x27;burst&#x27;);
    });
    if (full.length === 4) field.classList.add(&#x27;rainbow&#x27;);
    // scoring
    var pts = full.length === 1 ? 1 : full.length === 2 ? 3 : full.length === 3 ? 6 : 10;
    score += pts;
    if (score &gt; best) best = score;
    scoreEl.textContent = score;
    bestEl.textContent = best;
    updateLevel();
    // remove after animation
    setTimeout(function(){
      full.sort(function(a,b){return a-b;});
      for (var i = 0; i &lt; full.length; i++) {
        grid.splice(full[i], 1);
        var e = []; for (var c = 0; c &lt; COLS; c++) e.push(null);
        grid.unshift(e);
      }
      field.classList.remove(&#x27;rainbow&#x27;);
      if (running) paint();
    }, 280);
  }

  function updateLevel() {
    var nl = 1 + Math.floor(score / 5);
    if (nl !== level) {
      level = nl;
      levelEl.textContent = level;
      restartTimer();
      // background shift cool -&gt; hot
      var t = Math.min(1, (level - 1) / 8);
      var h1 = Math.round(255 * t), h2 = Math.round(80 + 100 * t);
      document.body.style.background =
        &#x27;linear-gradient(160deg, rgb(&#x27; + (58 + h1*0.6) + &#x27;,&#x27; + (43) + &#x27;,&#x27; + (143 - h1*0.5) +
        &#x27;), rgb(&#x27; + (150 + h1*0.4) + &#x27;,&#x27; + (47) + &#x27;,&#x27; + (176 - h1*0.5) + &#x27;))&#x27;;
    }
  }

  function dropSpeed() { return Math.max(120, 550 - (level - 1) * 55); }

  function restartTimer() {
    if (dropId) clearInterval(dropId);
    if (running) dropId = setInterval(stepDown, dropSpeed());
  }

  function drawBlock(x, y, type, ghost) {
    var el = document.createElement(&#x27;div&#x27;);
    if (ghost) { el.className = &#x27;ghost&#x27;; }
    else { el.className = &#x27;block&#x27;; el.dataset.r = y; el.style.background = COLORS[type]; el.textContent = FRUITS[type]; }
    el.style.left = (x * CELL) + &#x27;px&#x27;;
    el.style.top = (y * CELL) + &#x27;px&#x27;;
    el.style.width = CELL + &#x27;px&#x27;;
    el.style.height = CELL + &#x27;px&#x27;;
    field.appendChild(el);
  }

  function paint() {
    // remove non-burst blocks and ghosts
    var kids = field.querySelectorAll(&#x27;.block:not(.burst), .ghost&#x27;);
    kids.forEach(function(k){ k.remove(); });
    for (var r = 0; r &lt; ROWS; r++)
      for (var c = 0; c &lt; COLS; c++)
        if (grid[r][c] !== null) drawBlock(c, r, grid[r][c], false);
    if (piece) {
      var g = ghostPiece();
      cellsOf(g).forEach(function(cc){ if (cc.y &gt;= 0) drawBlock(cc.x, cc.y, piece.type, true); });
      cellsOf(piece).forEach(function(cc){ if (cc.y &gt;= 0) drawBlock(cc.x, cc.y, piece.type, false); });
    }
  }

  function stepDown() {
    if (!piece) return;
    var n = { type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 };
    if (collides(n)) lockPiece(); else piece = n;
    paint();
  }

  function move(dx) {
    if (!running || !piece) return;
    var n = { type: piece.type, rot: piece.rot, x: piece.x + dx, y: piece.y };
    if (!collides(n)) { piece = n; paint(); }
  }

  function rotate() {
    if (!running || !piece) return;
    var n = { type: piece.type, rot: (piece.rot + 1) % SHAPES[piece.type].length, x: piece.x, y: piece.y };
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i &lt; kicks.length; i++) {
      var t = { type: n.type, rot: n.rot, x: n.x + kicks[i], y: n.y };
      if (!collides(t)) { piece = t; paint(); return; }
    }
  }

  function hardDrop() {
    if (!running || !piece) return;
    while (!collides({ type: piece.type, rot: piece.rot, x: piece.x, y: piece.y + 1 })) piece.y++;
    lockPiece();
    paint();
  }

  function endGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
    over.style.display = &#x27;flex&#x27;;
  }

  function startGame() {
    score = 0; level = 1;
    scoreEl.textContent = &#x27;0&#x27;; levelEl.textContent = &#x27;1&#x27;; bestEl.textContent = best;
    document.body.style.background = &#x27;linear-gradient(160deg, #3a2b8f, #6a2fb0)&#x27;;
    over.style.display = &#x27;none&#x27;;
    newGrid();
    piece = randPiece();
    running = true;
    paint();
    if (dropId) clearInterval(dropId);
    dropId = setInterval(stepDown, dropSpeed());
  }

  function stopGame() {
    running = false;
    if (dropId) { clearInterval(dropId); dropId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    if (e.key === &#x27;ArrowLeft&#x27;) { move(-1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowRight&#x27;) { move(1); e.preventDefault(); }
    else if (e.key === &#x27;ArrowDown&#x27;) { if (running) { stepDown(); } e.preventDefault(); }
    else if (e.key === &#x27;ArrowUp&#x27;) { rotate(); e.preventDefault(); }
    else if (e.key === &#x27; &#x27;) { hardDrop(); e.preventDefault(); }
  });

  document.querySelector(&#x27;.controls&#x27;).addEventListener(&#x27;click&#x27;, function(e){
    var a = e.target.dataset.a;
    if (a === &#x27;left&#x27;) move(-1);
    else if (a === &#x27;right&#x27;) move(1);
    else if (a === &#x27;down&#x27;) { if (running) stepDown(); }
    else if (a === &#x27;rot&#x27;) rotate();
    else if (a === &#x27;drop&#x27;) hardDrop();
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial idle paint
  newGrid();
  piece = randPiece();
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
