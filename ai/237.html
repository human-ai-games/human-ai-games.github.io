<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #05030f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 2px 0; font-size: 26px; font-weight: 700; letter-spacing: 2px;
       background: linear-gradient(90deg,#ff4fd8,#4fd8ff,#ffd84f); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(120,180,255,.3); }
  .instructions { font-size: 16px; color: #aab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 30px; font-weight: 800; color: #ffe873; text-shadow: 0 0 12px #ffb020; transition: transform .12s ease; margin: 2px 0; }
  .score.pop { transform: scale(1.6); }
  .field { position: relative; width: 480px; height: 380px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
           box-shadow: 0 0 30px rgba(90,120,255,.25), inset 0 0 40px rgba(0,0,0,.6); }
  canvas { display: block; width: 100%; height: 100%; }
  .legend { font-size: 14px; color: #9aa; display: flex; gap: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .pad { display: grid; grid-template-columns: 56px 56px 56px; grid-template-rows: 44px 44px; gap: 6px; margin-top: 2px; }
  .pad button { border: none; border-radius: 8px; background: #1a1636; color: #cfe; font-size: 22px; cursor: pointer;
                box-shadow: 0 0 8px rgba(90,120,255,.3); }
  .pad button:active { background: #2c2660; }
  .up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; } .right { grid-column: 3; grid-row: 2; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer the glowing snake with the arrow keys (or the buttons below) to eat stars, gems and rare orbs for points. Blue gems and pink orbs vanish quickly — grab them fast, and don&#x27;t hit the walls or yourself!&lt;/p&gt;
  &lt;div class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;
  &lt;div class=&quot;field&quot;&gt;&lt;canvas id=&quot;cv&quot; width=&quot;480&quot; height=&quot;380&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
  &lt;div class=&quot;legend&quot;&gt;
    &lt;span&gt;⭐ 1&lt;/span&gt;&lt;span&gt;💎 3&lt;/span&gt;&lt;span&gt;🌀 5&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pad&quot;&gt;
    &lt;button class=&quot;up&quot; data-dir=&quot;up&quot;&gt;▲&lt;/button&gt;
    &lt;button class=&quot;left&quot; data-dir=&quot;left&quot;&gt;◀&lt;/button&gt;
    &lt;button class=&quot;down&quot; data-dir=&quot;down&quot;&gt;▼&lt;/button&gt;
    &lt;button class=&quot;right&quot; data-dir=&quot;right&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var CELL = 20, COLS = 24, ROWS = 19;
  var W = COLS * CELL, H = ROWS * CELL;
  var running = false, gameOver = false;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0, baseTick = 150, tickMs = 150, lastTick = 0;
  var flash = null;      // {color, until}
  var particles = [];
  var star = null, gem = null, orb = null;
  var gemExpire = 0, orbExpire = 0, orbNextTry = 0;
  var t0 = performance.now();
  var rafId = null;

  function rand(n){ return Math.floor(Math.random()*n); }
  function occupied(x,y){
    for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    if (star&amp;&amp;star.x===x&amp;&amp;star.y===y) return true;
    if (gem&amp;&amp;gem.x===x&amp;&amp;gem.y===y) return true;
    if (orb&amp;&amp;orb.x===x&amp;&amp;orb.y===y) return true;
    return false;
  }
  function freeCell(){
    for (var t=0;t&lt;300;t++){ var x=rand(COLS),y=rand(ROWS); if(!occupied(x,y)) return {x:x,y:y}; }
    return {x:0,y:0};
  }

  function initSnake(){
    snake = [{x:6,y:9},{x:5,y:9},{x:4,y:9}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
  }

  function spawnStar(){ star = freeCell(); }
  function spawnGem(now){ gem = freeCell(); gemExpire = now + 5000; }
  function spawnOrb(now){ orb = freeCell(); orbExpire = now + 3000; }

  function bgColor(now){
    // shift deep purple -&gt; dark teal
    var p = (Math.sin((now)/6000)+1)/2;
    var r = Math.round(18 + p*(4-18));
    var g = Math.round(6  + p*(30-6));
    var b = Math.round(34 + p*(38-34));
    return [r,g,b];
  }

  function draw(now){
    var bg = bgColor(now);
    var pulse = (Math.sin(now/900)+1)/2;
    ctx.fillStyle = &#x27;rgb(&#x27;+bg[0]+&#x27;,&#x27;+bg[1]+&#x27;,&#x27;+bg[2]+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle = &#x27;rgba(&#x27;+(bg[0]+40)+&#x27;,&#x27;+(bg[1]+50)+&#x27;,&#x27;+(bg[2]+60)+&#x27;,&#x27;+(0.25+pulse*0.25)+&#x27;)&#x27;;
    ctx.lineWidth = 1;
    for (var x=0;x&lt;=COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
    for (var y=0;y&lt;=ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }

    // collectibles
    if (star) drawGlyph(star, &#x27;⭐&#x27;, &#x27;#ffe040&#x27;, 1);
    if (gem){
      var blink = (Math.floor(now/250)%2===0)?1:0.35;
      drawGlyph(gem, &#x27;💎&#x27;, &#x27;#40c0ff&#x27;, blink);
    }
    if (orb){
      var ang = now/300;
      drawSpin(orb, ang);
    }

    // snake
    var flashing = flash &amp;&amp; now &lt; flash.until;
    for (var i=0;i&lt;snake.length;i++){
      var s = snake[i], head = (i===0);
      var hue = (now/20 + i*14) % 360;
      var col = flashing ? flash.color : &#x27;hsl(&#x27;+hue+&#x27;,90%,&#x27;+(head?68:58)+&#x27;%)&#x27;;
      var pad = head ? 1 : 3;
      ctx.shadowColor = col; ctx.shadowBlur = head?18:10;
      ctx.fillStyle = col;
      var cx = s.x*CELL, cy = s.y*CELL, sz = CELL - pad*2;
      roundRect(cx+pad, cy+pad, sz, sz, head?5:4);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    // eyes on head
    if (snake.length){
      var hd = snake[0];
      var ex = hd.x*CELL + CELL/2, ey = hd.y*CELL + CELL/2;
      var ox = dir.x*4, oy = dir.y*4;
      var perpX = dir.y*4, perpY = dir.x*4;
      ctx.fillStyle = &#x27;#05030f&#x27;;
      dot(ex+ox+perpX, ey+oy+perpY, 2.3);
      dot(ex+ox-perpX, ey+oy-perpY, 2.3);
    }

    // particles
    for (var p=0;p&lt;particles.length;p++){
      var pa = particles[p];
      ctx.globalAlpha = Math.max(0, pa.life);
      ctx.fillStyle = pa.color;
      ctx.shadowColor = pa.color; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    if (gameOver){
      ctx.fillStyle = &#x27;rgba(0,0,0,.55)&#x27;;
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = &#x27;#ff6fd8&#x27;;
      ctx.font = &#x27;bold 34px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;;
      ctx.shadowColor=&#x27;#ff6fd8&#x27;; ctx.shadowBlur=16;
      ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2-6);
      ctx.shadowBlur=0;
      ctx.fillStyle = &#x27;#cfe&#x27;; ctx.font=&#x27;18px system-ui&#x27;;
      ctx.fillText(&#x27;Score &#x27;+score+&#x27; — press Restart below&#x27;, W/2, H/2+26);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function dot(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  function drawGlyph(c, ch, glow, alpha){
    ctx.globalAlpha = alpha;
    ctx.shadowColor = glow; ctx.shadowBlur = 14;
    ctx.font = &#x27;16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(ch, c.x*CELL+CELL/2, c.y*CELL+CELL/2+1);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.textBaseline=&#x27;alphabetic&#x27;;
  }
  function drawSpin(c, ang){
    var cx = c.x*CELL+CELL/2, cy=c.y*CELL+CELL/2;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
    ctx.shadowColor=&#x27;#ff5fd0&#x27;; ctx.shadowBlur=16;
    ctx.font=&#x27;16px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(&#x27;🌀&#x27;,0,1);
    ctx.restore(); ctx.shadowBlur=0; ctx.textBaseline=&#x27;alphabetic&#x27;;
  }

  function popScore(){
    scoreEl.textContent = score;
    scoreEl.classList.add(&#x27;pop&#x27;);
    setTimeout(function(){ scoreEl.classList.remove(&#x27;pop&#x27;); }, 130);
  }

  function burst(x,y,color){
    for (var i=0;i&lt;10;i++){
      var a = Math.random()*7, sp = 0.5+Math.random()*2;
      particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*2,life:1,color:color});
    }
  }

  function eat(color){
    flash = {color:color, until: performance.now()+180};
    tickMs = Math.max(70, tickMs - 4);
    var hd = snake[0];
    burst(hd.x*CELL+CELL/2, hd.y*CELL+CELL/2, color);
  }

  function step(now){
    if (!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x+dir.x, ny = head.y+dir.y;
    if (nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
    // will we eat?
    var ate = null;
    if (star &amp;&amp; nx===star.x &amp;&amp; ny===star.y) ate=&#x27;star&#x27;;
    else if (gem &amp;&amp; nx===gem.x &amp;&amp; ny===gem.y) ate=&#x27;gem&#x27;;
    else if (orb &amp;&amp; nx===orb.x &amp;&amp; ny===orb.y) ate=&#x27;orb&#x27;;
    var body = ate ? snake : snake.slice(0, snake.length-1);
    for (var i=0;i&lt;body.length;i++) if (body[i].x===nx&amp;&amp;body[i].y===ny){ die(); return; }
    snake.unshift({x:nx,y:ny});
    if (ate===&#x27;star&#x27;){ score+=1; popScore(); eat(&#x27;#ffe040&#x27;); spawnStar(); }
    else if (ate===&#x27;gem&#x27;){ score+=3; popScore(); eat(&#x27;#40c0ff&#x27;); gem=null; }
    else if (ate===&#x27;orb&#x27;){ score+=5; popScore(); eat(&#x27;#ff5fd0&#x27;); orb=null; }
    else snake.pop();
  }

  function die(){
    gameOver = true; running = false;
    for (var i=0;i&lt;snake.length;i++){
      var s=snake[i];
      burst(s.x*CELL+CELL/2, s.y*CELL+CELL/2, &#x27;hsl(&#x27;+((i*24)%360)+&#x27;,90%,60%)&#x27;);
    }
    snake = [];
  }

  function loop(now){
    if (running || particles.length){
      // update particles
      for (var i=particles.length-1;i&gt;=0;i--){
        var p=particles[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.life-=0.03; p.r*=0.97;
        if (p.life&lt;=0) particles.splice(i,1);
      }
      if (running){
        // expire timed items
        if (gem &amp;&amp; now&gt;gemExpire) gem=null;
        if (orb &amp;&amp; now&gt;orbExpire) orb=null;
        if (!gem &amp;&amp; Math.random()&lt;0.006) spawnGem(now);
        if (!orb &amp;&amp; now&gt;orbNextTry){ orbNextTry = now+2000; if (Math.random()&lt;0.25) spawnOrb(now); }
        if (now-lastTick &gt;= tickMs){ lastTick = now; step(now); }
      }
      draw(now);
      rafId = requestAnimationFrame(loop);
    } else {
      draw(now); // final frame
      rafId = null;
    }
  }

  function startGame(){
    running = true; gameOver = false;
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    tickMs = baseTick; lastTick = performance.now();
    particles = []; flash = null;
    initSnake();
    star=null; gem=null; orb=null;
    spawnStar();
    spawnGem(performance.now());
    orbNextTry = performance.now()+4000;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  function stopGame(){
    running = false;
    if (rafId){ cancelAnimationFrame(rafId); rafId=null; }
  }

  function setDir(d){
    if (d===&#x27;left&#x27;) pendingDir={x:-1,y:0};
    else if (d===&#x27;right&#x27;) pendingDir={x:1,y:0};
    else if (d===&#x27;up&#x27;) pendingDir={x:0,y:-1};
    else if (d===&#x27;down&#x27;) pendingDir={x:0,y:1};
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ setDir(&#x27;left&#x27;); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ setDir(&#x27;right&#x27;); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ setDir(&#x27;up&#x27;); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ setDir(&#x27;down&#x27;); e.preventDefault(); }
  });
  var padBtns = document.querySelectorAll(&#x27;.pad button&#x27;);
  padBtns.forEach(function(b){
    b.addEventListener(&#x27;click&#x27;, function(){ setDir(b.getAttribute(&#x27;data-dir&#x27;)); });
  });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint (stopped state)
  initSnake();
  spawnStar();
  draw(performance.now());
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
