<html lang="en">

<title>COSMIC DEFENDER</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMIC DEFENDER</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #cfe6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #6ff; text-shadow: 0 0 8px #0af, 0 0 18px #06f; }
  .instructions { font-size: 16px; color: #9fc; max-width: 620px; margin: 0; line-height: 1.4; text-align: center; text-shadow: 0 0 6px #044; }
  .scores { display: flex; gap: 36px; font-size: 20px; font-weight: 600; }
  .scores .lbl { color: #7af; }
  #cur { color: #6ff; text-shadow: 0 0 10px #0cf; }
  #best { color: #fc6; text-shadow: 0 0 10px #f80; }
  canvas { border-radius: 10px; box-shadow: 0 0 24px rgba(0,120,255,0.4); display: block; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMIC DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your mouse left and right to slide the glowing paddle and bat back the alien orbs. Every 5 hits a new orb appears — keep them all alive and use the Start button below.&lt;/p&gt;
  &lt;div class=&quot;scores&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt; &lt;span id=&quot;cur&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;BEST&lt;/span&gt; &lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
  var W = 620, H = 440;
  var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
  var curEl = document.getElementById(&#x27;cur&#x27;), bestEl = document.getElementById(&#x27;best&#x27;);
  var running = false, animId = null, tPrev = 0, pulse = 0;
  var score = 0, best = 0;

  var PADDLE_W = 110, PADDLE_H = 14, PADDLE_BOTTOM = 16;
  var paddleX = (W - PADDLE_W) / 2, targetX = paddleX;

  var BALL_R = 9, BASE_SPEED = 4.2;
  var balls = [];
  var stars = [];
  var ripples = [];
  var flashes = [];

  // Audio
  var actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_) {} }
    if (actx &amp;&amp; actx.state === &#x27;suspended&#x27;) actx.resume();
  }
  function ping(freq) {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = &#x27;triangle&#x27;; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.22);
    o.frequency.exponentialRampToValueAtTime(freq * 1.6, actx.currentTime + 0.12);
    o.start(); o.stop(actx.currentTime + 0.24);
  }
  function thud() {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = &#x27;sine&#x27;; o.frequency.value = 120;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.4);
    o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.35);
    o.start(); o.stop(actx.currentTime + 0.42);
  }

  function makeStars() {
    stars = [];
    for (var i = 0; i &lt; 90; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.8+0.4, v: Math.random()*0.6+0.2 });
    }
  }

  function newBall(dir) {
    return {
      x: W/2 + (Math.random()-0.5)*120,
      y: 60,
      vx: (dir || (Math.random()&lt;0.5?-1:1)) * BASE_SPEED,
      vy: BASE_SPEED,
      trail: []
    };
  }

  function reset() {
    score = 0; curEl.textContent = &#x27;0&#x27;;
    paddleX = (W - PADDLE_W) / 2; targetX = paddleX;
    balls = [newBall()];
    ripples = []; flashes = [];
    makeStars();
  }

  // danger factor 0..1 based on number of balls in play
  function danger() { return Math.min(1, (balls.length - 1) / 4); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function mix(c1, c2, t) {
    return &#x27;rgb(&#x27; + Math.round(lerp(c1[0],c2[0],t)) + &#x27;,&#x27; + Math.round(lerp(c1[1],c2[1],t)) + &#x27;,&#x27; + Math.round(lerp(c1[2],c2[2],t)) + &#x27;)&#x27;;
  }

  function step(dt) {
    pulse += dt * 0.0015;
    var d = danger();

    // stars
    for (var i=0;i&lt;stars.length;i++){
      var st = stars[i];
      st.y += st.v * (1 + d*1.5);
      if (st.y &gt; H) { st.y = 0; st.x = Math.random()*W; }
    }

    // paddle easing toward mouse
    paddleX += (targetX - paddleX) * Math.min(1, dt*0.02);
    paddleX = Math.max(0, Math.min(W - PADDLE_W, paddleX));

    var paddleTop = H - PADDLE_BOTTOM - PADDLE_H;

    for (var b = balls.length - 1; b &gt;= 0; b--) {
      var ball = balls[b];
      ball.x += ball.vx; ball.y += ball.vy;
      ball.trail.push({x:ball.x, y:ball.y});
      if (ball.trail.length &gt; 14) ball.trail.shift();

      if (ball.x - BALL_R &lt;= 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
      if (ball.x + BALL_R &gt;= W) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - BALL_R &lt;= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); }

      // paddle collision
      if (ball.vy &gt; 0 &amp;&amp;
          ball.y + BALL_R &gt;= paddleTop &amp;&amp;
          ball.y + BALL_R &lt;= paddleTop + PADDLE_H + 10 &amp;&amp;
          ball.x &gt;= paddleX - BALL_R &amp;&amp;
          ball.x &lt;= paddleX + PADDLE_W + BALL_R) {
        ball.vy = -Math.abs(ball.vy);
        ball.y = paddleTop - BALL_R;
        // angle based on where it hit
        var rel = (ball.x - (paddleX + PADDLE_W/2)) / (PADDLE_W/2);
        var spd = Math.hypot(ball.vx, ball.vy) * 1.03; // speed up
        var ang = rel * 1.0;
        ball.vx = Math.sin(ang) * spd;
        ball.vy = -Math.abs(Math.cos(ang) * spd);

        score++;
        curEl.textContent = score;
        if (score &gt; best) { best = score; bestEl.textContent = best; }
        ripples.push({x:ball.x, y:ball.y, r:6, life:1});
        ping(520 + score*8);

        // spawn extra ball every 5 hits
        if (score % 5 === 0) {
          balls.push(newBall());
        }
      }

      // lost off bottom
      if (ball.y - BALL_R &gt; H) {
        flashes.push({x:ball.x, y:H-8, r:8, life:1});
        thud();
        balls.splice(b,1);
        if (balls.length === 0) balls.push(newBall());
      }
    }

    for (var r=ripples.length-1;r&gt;=0;r--){ ripples[r].r += dt*0.5; ripples[r].life -= dt*0.0025; if(ripples[r].life&lt;=0) ripples.splice(r,1); }
    for (var f=flashes.length-1;f&gt;=0;f--){ flashes[f].r += dt*0.4; flashes[f].life -= dt*0.004; if(flashes[f].life&lt;=0) flashes.splice(f,1); }
  }

  function draw() {
    var d = danger();
    // background pulse: cool blue -&gt; hot red
    var pv = 0.5 + 0.5*Math.sin(pulse);
    var bg = mix([5,8,22],[26,6,10], d);
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);
    // radial-ish glow
    var glow = ctx.createRadialGradient(W/2,H*0.4,20, W/2,H*0.4, W*0.7);
    var gc = mix([10,40,90],[90,20,10], d);
    glow.addColorStop(0, &#x27;rgba(&#x27; + gc.slice(4) );
    ctx.fillStyle = &#x27;rgba(0,0,0,0)&#x27;;
    var grad = ctx.createRadialGradient(W/2,H*0.35,10, W/2,H*0.35, W*0.75);
    grad.addColorStop(0, mixA([20,70,140],[150,40,20], d, 0.12 + pv*0.06));
    grad.addColorStop(1, &#x27;rgba(0,0,0,0)&#x27;);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // stars
    for (var i=0;i&lt;stars.length;i++){
      var st = stars[i];
      ctx.globalAlpha = 0.5 + st.s*0.25;
      ctx.fillStyle = mix([200,220,255],[255,200,180], d);
      ctx.fillRect(st.x, st.y, st.s, st.s*2);
    }
    ctx.globalAlpha = 1;

    // ripples
    for (var r=0;r&lt;ripples.length;r++){
      var rp = ripples[r];
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI*2);
      ctx.strokeStyle = mixA([80,200,255],[255,120,60], d, rp.life*0.7);
      ctx.lineWidth = 2; ctx.stroke();
    }

    // flashes
    for (var f=0;f&lt;flashes.length;f++){
      var fl = flashes[f];
      var fg = ctx.createRadialGradient(fl.x,fl.y,0, fl.x,fl.y,fl.r*4);
      fg.addColorStop(0, &#x27;rgba(255,180,80,&#x27;+(fl.life*0.9)+&#x27;)&#x27;);
      fg.addColorStop(1, &#x27;rgba(255,80,0,0)&#x27;);
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(fl.x, fl.y, fl.r*4, 0, Math.PI*2); ctx.fill();
    }

    // balls + trails
    for (var b=0;b&lt;balls.length;b++){
      var ball = balls[b];
      for (var t=0;t&lt;ball.trail.length;t++){
        var tp = ball.trail[t];
        var a = t/ball.trail.length;
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, BALL_R*a*0.9, 0, Math.PI*2);
        ctx.fillStyle = mixA([100,220,255],[255,140,60], d, a*0.4);
        ctx.fill();
      }
      var bgrad = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, BALL_R*2.2);
      var core = mix([160,240,255],[255,180,120], d);
      var edge = mix([0,150,255],[255,60,20], d);
      bgrad.addColorStop(0, core);
      bgrad.addColorStop(0.5, edge);
      bgrad.addColorStop(1, &#x27;rgba(0,0,0,0)&#x27;);
      ctx.fillStyle = bgrad;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*2.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*0.6, 0, Math.PI*2); ctx.fill();
    }

    // paddle
    var paddleTop = H - PADDLE_BOTTOM - PADDLE_H;
    var pgrad = ctx.createLinearGradient(paddleX,0,paddleX+PADDLE_W,0);
    var pc1 = mix([60,180,255],[255,90,40], d);
    var pc2 = mix([120,240,255],[255,180,90], d);
    pgrad.addColorStop(0, pc1); pgrad.addColorStop(0.5, pc2); pgrad.addColorStop(1, pc1);
    ctx.shadowColor = mix([0,150,255],[255,60,20], d);
    ctx.shadowBlur = 20;
    ctx.fillStyle = pgrad;
    roundRect(paddleX, paddleTop, PADDLE_W, PADDLE_H, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }

  function mixA(c1,c2,t,alpha){
    return &#x27;rgba(&#x27; + Math.round(lerp(c1[0],c2[0],t)) + &#x27;,&#x27; + Math.round(lerp(c1[1],c2[1],t)) + &#x27;,&#x27; + Math.round(lerp(c1[2],c2[2],t)) + &#x27;,&#x27; + alpha + &#x27;)&#x27;;
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(ts) {
    if (!running) return;
    if (!tPrev) tPrev = ts;
    var dt = Math.min(48, ts - tPrev); tPrev = ts;
    step(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    if (running) return;
    ensureAudio();
    reset();
    bestEl.textContent = best;
    running = true; tPrev = 0;
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    if (!running) return;
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  // mouse / touch control
  function moveTo(clientX) {
    var rect = cv.getBoundingClientRect();
    var x = (clientX - rect.left) * (W / rect.width);
    targetX = x - PADDLE_W/2;
  }
  cv.addEventListener(&#x27;mousemove&#x27;, function(e){ moveTo(e.clientX); });
  cv.addEventListener(&#x27;touchmove&#x27;, function(e){ if(e.touches[0]) { moveTo(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});
  cv.addEventListener(&#x27;touchstart&#x27;, function(e){ if(e.touches[0]) moveTo(e.touches[0].clientX); });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static frame
  makeStars();
  balls = [newBall()];
  draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
