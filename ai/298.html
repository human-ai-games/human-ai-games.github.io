    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060a; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #4dff9e; text-shadow: 0 0 8px #1fdd7a, 0 0 18px #0a8; }
  .instructions { font-size: 16px; color: #8aa; max-width: 600px; margin: 0; line-height: 1.35; text-align: center; }
  .scores { display: flex; gap: 28px; font-size: 20px; font-weight: 600; }
  .scores .lbl { color: #567; font-size: 13px; letter-spacing: 1px; display: block; text-align: center; }
  #score { color: #4aa8ff; text-shadow: 0 0 8px currentColor; }
  #best { color: #ffd24a; text-shadow: 0 0 8px currentColor; }
  .field { position: relative; width: 560px; height: 448px; flex-shrink: 0; background:
      repeating-linear-gradient(0deg, #0a0e18 0 27px, #0c1220 27px 28px),
      repeating-linear-gradient(90deg, #0a0e18 0 27px, #0c1220 27px 28px);
    border-radius: 10px; overflow: hidden; box-shadow: 0 0 24px #0a3, inset 0 0 40px #031;
    animation: pulseGlow 3s ease-in-out infinite; }
  @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 18px #072, inset 0 0 30px #021; } 50% { box-shadow: 0 0 30px #0b5, inset 0 0 48px #042; } }
  .cell { position: absolute; box-sizing: border-box; pointer-events: none; }
  .seg { border-radius: 3px; }
  .head { border-radius: 5px; box-shadow: 0 0 10px #4dff9e, 0 0 4px #fff; z-index: 3; }
  .orb { border-radius: 50%; background: #f5f8ff; box-shadow: 0 0 8px #fff, 0 0 3px #bcd; }
  .star { color: #ffd24a; font-size: 22px; text-align: center; line-height: 22px; text-shadow: 0 0 10px #ffb020; animation: starPulse .7s ease-in-out infinite; }
  @keyframes starPulse { 0%,100% { transform: scale(0.85); } 50% { transform: scale(1.15); } }
  .diamond { color: #ff3df0; font-size: 22px; text-align: center; line-height: 22px; text-shadow: 0 0 12px #ff3df0; animation: diaFlash .35s steps(2) infinite; }
  @keyframes diaFlash { 0% { opacity: 1; } 50% { opacity: .3; } 100% { opacity: 1; } }
  .particle { position: absolute; width: 6px; height: 6px; border-radius: 50%; z-index: 5; pointer-events: none; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(3,5,10,0.82); z-index: 10; text-align: center; }
  .overlay.show { display: flex; }
  .overlay .big { font-size: 44px; font-weight: 800; color: #4dff9e; text-shadow: 0 0 14px #0b6; }
  .overlay .msg { font-size: 20px; color: #cde; margin-top: 8px; }
  .overlay .hint { font-size: 15px; color: #789; margin-top: 14px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys (or swipe) to eat orbs, stars, and rare diamonds — walls wrap around, so only your own tail can kill you. Grab the gold stars and magenta diamonds before they vanish for bonus points!&lt;/p&gt;
  &lt;div class=&quot;scores&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;BEST&lt;/span&gt;&lt;span id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;big&quot; id=&quot;finalScore&quot;&gt;0&lt;/div&gt;
      &lt;div class=&quot;msg&quot; id=&quot;finalMsg&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 28;
  var COLS = 20, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var bestEl = document.getElementById(&#x27;best&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var finalMsgEl = document.getElementById(&#x27;finalMsg&#x27;);

  var running = false, tickId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0, best = 0;
  var baseTick = 150, tickMs = 150;
  var lastTime = 0, acc = 0;

  var orb = null, star = null, diamond = null;
  var starTimer = 0, diamondTimer = 0, diamondCooldown = 0;
  var STAR_LIFE = 7000, DIA_LIFE = 4000;

  // pooled elements for snake/particles rebuilt each frame
  function clearDynamic() {
    var kids = field.querySelectorAll(&#x27;.cell, .particle&#x27;);
    for (var i=0;i&lt;kids.length;i++) kids[i].remove();
  }

  function makeCell(cls, x, y, big) {
    var el = document.createElement(&#x27;div&#x27;);
    el.className = &#x27;cell &#x27; + cls;
    var w = CELL - 3, off = 1.5;
    el.style.left = (x*CELL + off) + &#x27;px&#x27;;
    el.style.top = (y*CELL + off) + &#x27;px&#x27;;
    el.style.width = w + &#x27;px&#x27;;
    el.style.height = w + &#x27;px&#x27;;
    field.appendChild(el);
    return el;
  }

  function occupied(x,y){
    for (var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
    return false;
  }
  function occupiedByAny(x,y){
    if (orb &amp;&amp; orb.x===x &amp;&amp; orb.y===y) return true;
    if (star &amp;&amp; star.x===x &amp;&amp; star.y===y) return true;
    if (diamond &amp;&amp; diamond.x===x &amp;&amp; diamond.y===y) return true;
    return occupied(x,y);
  }
  function freeCell(){
    for (var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if(!occupiedByAny(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }

  function paint() {
    clearDynamic();
    if (orb) makeCell(&#x27;orb&#x27;, orb.x, orb.y);
    if (star) { var s=makeCell(&#x27;star&#x27;, star.x, star.y); s.textContent=&#x27;★&#x27;; }
    if (diamond) { var d=makeCell(&#x27;diamond&#x27;, diamond.x, diamond.y); d.textContent=&#x27;◆&#x27;; }
    for (var i=snake.length-1;i&gt;=0;i--){
      var seg = snake[i];
      var el = makeCell(i===0?&#x27;seg head&#x27;:&#x27;seg&#x27;, seg.x, seg.y);
      if (i===0){
        el.style.background = &#x27;#7dffb8&#x27;;
      } else {
        var f = i/snake.length;
        var g = Math.round(255 - f*120);
        var b = Math.round(158 - f*80);
        el.style.background = &#x27;rgb(&#x27;+Math.round(60- f*30)+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
        el.style.boxShadow = &#x27;0 0 &#x27;+Math.max(1,6-f*5)+&#x27;px #2f8&#x27;;
      }
    }
    // reattach overlay on top (it lives in field)
    field.appendChild(overlay);
  }

  function burst(x, y, color) {
    var cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
    for (var i=0;i&lt;10;i++){
      var p = document.createElement(&#x27;div&#x27;);
      p.className=&#x27;particle&#x27;;
      p.style.background=color;
      p.style.boxShadow=&#x27;0 0 6px &#x27;+color;
      p.style.left=(cx-3)+&#x27;px&#x27;; p.style.top=(cy-3)+&#x27;px&#x27;;
      field.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=14+Math.random()*22;
      var dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
      p.animate([
        {transform:&#x27;translate(0,0)&#x27;, opacity:1},
        {transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px)&#x27;, opacity:0}
      ], {duration:450+Math.random()*200, easing:&#x27;ease-out&#x27;});
      (function(pp){ setTimeout(function(){ pp.remove(); }, 700); })(p);
    }
  }

  function updateScoreColor(){
    // cool blue -&gt; hot red as speed increases
    var lvl = Math.floor(score/5);
    var frac = Math.min(1, lvl/8);
    var r = Math.round(74 + frac*(255-74));
    var g = Math.round(168 - frac*168);
    var b = Math.round(255 - frac*175);
    scoreEl.style.color = &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
  }

  function setScore(v){
    score = v;
    scoreEl.textContent = score;
    updateScoreColor();
    tickMs = Math.max(60, baseTick - Math.floor(score/5)*12);
  }

  function initSnake(){
    snake = [{x:6,y:8},{x:5,y:8},{x:4,y:8}];
    dir={x:1,y:0}; pendingDir={x:1,y:0};
  }

  function tick(){
    if(!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir=pendingDir;
    var head=snake[0];
    var nx=(head.x+dir.x+COLS)%COLS;
    var ny=(head.y+dir.y+ROWS)%ROWS;
    var ateOrb = orb &amp;&amp; nx===orb.x &amp;&amp; ny===orb.y;
    var ateStar = star &amp;&amp; nx===star.x &amp;&amp; ny===star.y;
    var ateDia = diamond &amp;&amp; nx===diamond.x &amp;&amp; ny===diamond.y;
    var grow = ateOrb || ateStar || ateDia;
    var body = grow ? snake : snake.slice(0, snake.length-1);
    for (var i=0;i&lt;body.length;i++) if(body[i].x===nx&amp;&amp;body[i].y===ny){ die(); return; }

    snake.unshift({x:nx,y:ny});
    if(!grow) snake.pop();

    if(ateOrb){ setScore(score+1); burst(nx,ny,&#x27;#f5f8ff&#x27;); orb=freeCell(); }
    if(ateStar){ setScore(score+3); burst(nx,ny,&#x27;#ffd24a&#x27;); star=null; }
    if(ateDia){ setScore(score+5); burst(nx,ny,&#x27;#ff3df0&#x27;); diamond=null; }
    paint();
  }

  function loop(ts){
    if(!running) return;
    if(!lastTime) lastTime=ts;
    var dt = ts-lastTime; lastTime=ts;
    acc += dt;
    while(acc &gt;= tickMs){ tick(); acc -= tickMs; if(!running) return; }

    // collectible lifetimes
    if(star){ starTimer -= dt; if(starTimer&lt;=0){ star=null; paint(); } }
    if(diamond){ diamondTimer -= dt; if(diamondTimer&lt;=0){ diamond=null; paint(); } }
    else {
      diamondCooldown -= dt;
      if(diamondCooldown&lt;=0 &amp;&amp; Math.random()&lt;0.004){ diamond=freeCell(); diamondTimer=DIA_LIFE; diamondCooldown=8000; }
    }
    if(!star){
      // occasionally spawn a star
      if(Math.random()&lt;0.01){ star=freeCell(); starTimer=STAR_LIFE; }
    }
    tickId = requestAnimationFrame(loop);
  }

  function die(){
    running=false;
    if(tickId){ cancelAnimationFrame(tickId); tickId=null; }
    if(score&gt;best){ best=score; bestEl.textContent=best; }
    // flash red three times then fade
    var segs = field.querySelectorAll(&#x27;.seg&#x27;);
    var flashes=0;
    var flashId = setInterval(function(){
      var on = flashes%2===0;
      segs.forEach(function(s){ s.style.background = on ? &#x27;#ff3b3b&#x27; : &#x27;#7dffb8&#x27;; s.style.boxShadow = on ? &#x27;0 0 10px #f33&#x27; : &#x27;none&#x27;; });
      flashes++;
      if(flashes&gt;=6){
        clearInterval(flashId);
        segs.forEach(function(s){ s.style.transition=&#x27;opacity .5s&#x27;; s.style.opacity=&#x27;0&#x27;; });
        setTimeout(showOverlay, 550);
      }
    }, 130);
  }

  function superlative(s){
    if(s&gt;=60) return &quot;LEGENDARY SERPENT!&quot;;
    if(s&gt;=40) return &quot;Blazing fast — incredible!&quot;;
    if(s&gt;=25) return &quot;Slick moves, serpent master.&quot;;
    if(s&gt;=12) return &quot;Nice slithering!&quot;;
    if(s&gt;=5) return &quot;Getting the hang of it.&quot;;
    if(s&gt;=1) return &quot;A humble beginning.&quot;;
    return &quot;Try tapping an arrow key!&quot;;
  }

  function showOverlay(){
    finalScoreEl.textContent = score;
    finalMsgEl.textContent = superlative(score);
    overlay.classList.add(&#x27;show&#x27;);
  }

  function startGame(){
    overlay.classList.remove(&#x27;show&#x27;);
    running=true;
    setScore(0);
    baseTick=150; tickMs=150;
    initSnake();
    orb=freeCell();
    star=freeCell(); starTimer=STAR_LIFE;
    diamond=null; diamondTimer=0; diamondCooldown=5000;
    acc=0; lastTime=0;
    paint();
    if(tickId) cancelAnimationFrame(tickId);
    tickId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(tickId){ cancelAnimationFrame(tickId); tickId=null; }
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
  });

  // swipe controls
  var touchStart=null;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY}; }, {passive:true});
  field.addEventListener(&#x27;touchmove&#x27;, function(e){
    if(!touchStart) return;
    var t=e.touches[0], dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
    if(Math.abs(dx)+Math.abs(dy)&lt;24) return;
    if(Math.abs(dx)&gt;Math.abs(dy)) setDir(dx&gt;0?1:-1,0); else setDir(0,dy&gt;0?1:-1);
    touchStart={x:t.clientX,y:t.clientY};
  }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(){ touchStart=null; });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });

  // initial static paint
  initSnake();
  orb={x:12,y:8}; star={x:14,y:4}; diamond=null;
  paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
</body>
</html>
