<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMONAUT DASH</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>COSMONAUT DASH</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0416; color: #e8e0ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#ff7a3c,#ffd24a,#4af0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #b8a8e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .wrap { position: relative; width: 640px; height: 440px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 30px rgba(120,80,255,0.35); }
  canvas { display: block; background: #0a0416; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;COSMONAUT DASH&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Press &lt;strong&gt;Space&lt;/strong&gt; or click to fire your jetpack and jump — you get a double-jump. Dodge the spiky red meteors and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var cv = document.getElementById(&#x27;cv&#x27;);
  var ctx = cv.getContext(&#x27;2d&#x27;);
  var W = 640, H = 440;
  var HUD_H = 34, GROUND_H = 46;
  var FLOOR = H - GROUND_H;

  var running = false, animId = null, t = 0;
  var score = 0, best = 0, level = 1;
  var gameOver = false;
  var levelFlash = 0, scoreFlash = 0;

  // Hero
  var HERO_W = 26, HERO_H = 34;
  var heroX = 80, heroY, heroVY;
  var jumps = 0;
  var flame = 0; // flame intensity 0..1

  var GRAVITY = 0.62;
  var JUMP_V = -12.5;

  // Obstacles
  var meteors = [];
  var spawnTimer = 0;
  var baseSpeed = 3.6;
  var baseSpawn = 105; // frames

  // Parallax
  var mtnOff = 0, pillarOff = 0;
  var pillars = [];
  var mountains = [];
  var stars = []; // background twinkle
  var particles = []; // star explosions

  function initBG() {
    pillars = [];
    for (var i = 0; i &lt; 8; i++) {
      pillars.push({ x: i * 100 + Math.random()*40, w: 34 + Math.random()*26, h: 60 + Math.random()*90 });
    }
    mountains = [];
    for (var j = 0; j &lt; 6; j++) {
      mountains.push({ x: j * 130, w: 150 + Math.random()*60, h: 90 + Math.random()*70 });
    }
    stars = [];
    for (var k = 0; k &lt; 50; k++) {
      stars.push({ x: Math.random()*W, y: HUD_H + Math.random()*(FLOOR-HUD_H-100), r: Math.random()*1.5+0.3, p: Math.random()*6.28 });
    }
  }
  initBG();

  function reset() {
    score = 0; level = 1; gameOver = false;
    heroY = FLOOR - HERO_H; heroVY = 0; jumps = 0; flame = 0;
    meteors = []; particles = [];
    spawnTimer = 0; t = 0;
    levelFlash = 0; scoreFlash = 0;
    baseSpeed = 3.6; baseSpawn = 105;
  }

  function curSpeed() { return baseSpeed + (level-1) * 0.55; }
  function curSpawn() { return Math.max(45, baseSpawn - (level-1) * 8); }

  function spawnMeteor() {
    var w = 26 + Math.random()*30;
    var h = 24 + Math.random()*40;
    meteors.push({ x: W + 20, w: w, h: h, scored: false, spin: 0 });
  }

  function jump() {
    if (!running || gameOver) return;
    if (jumps &lt; 2) {
      heroVY = JUMP_V;
      jumps++;
      flame = 1;
    }
  }

  function burst(x, y) {
    for (var i = 0; i &lt; 14; i++) {
      var a = Math.random()*6.28;
      var sp = 1.5 + Math.random()*3.5;
      particles.push({ x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1, life: 1 });
    }
  }

  // ---- drawing ----
  function drawBG() {
    // sky gradient
    var g = ctx.createLinearGradient(0,HUD_H,0,FLOOR);
    g.addColorStop(0, &#x27;#1a0a3a&#x27;);
    g.addColorStop(1, &#x27;#3a0f4a&#x27;);
    ctx.fillStyle = g;
    ctx.fillRect(0, HUD_H, W, FLOOR-HUD_H);

    // twinkle stars
    for (var s of stars) {
      var tw = 0.4 + 0.6*Math.abs(Math.sin(t*0.05 + s.p));
      ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+tw+&#x27;)&#x27;;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }

    // distant mountains (slow parallax)
    ctx.save();
    for (var m of mountains) {
      var mx = ((m.x - mtnOff) % (W+200));
      if (mx &lt; -200) mx += (W+200);
      var by = FLOOR;
      var grd = ctx.createLinearGradient(0, by-m.h, 0, by);
      grd.addColorStop(0, &#x27;rgba(150,70,220,0.55)&#x27;);
      grd.addColorStop(1, &#x27;rgba(90,30,150,0.25)&#x27;);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(mx, by);
      ctx.lineTo(mx + m.w/2, by - m.h);
      ctx.lineTo(mx + m.w, by);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // closer cyan pillars (fast parallax)
    for (var p of pillars) {
      var px = ((p.x - pillarOff) % (W+120));
      if (px &lt; -120) px += (W+120);
      var top = FLOOR - p.h;
      ctx.fillStyle = &#x27;rgba(40,220,240,0.35)&#x27;;
      ctx.fillRect(px, top, p.w, p.h);
      ctx.fillStyle = &#x27;rgba(120,255,255,0.55)&#x27;;
      ctx.fillRect(px, top, p.w, 5);
      ctx.shadowColor = &#x27;#3ff&#x27;;
      ctx.shadowBlur = 8;
      ctx.fillRect(px, top, 2, p.h);
      ctx.shadowBlur = 0;
    }
  }

  function drawGround() {
    var g = ctx.createLinearGradient(0, FLOOR, 0, H);
    g.addColorStop(0, &#x27;#12d6c4&#x27;);
    g.addColorStop(1, &#x27;#065c58&#x27;);
    ctx.fillStyle = g;
    ctx.fillRect(0, FLOOR, W, GROUND_H);
    // shimmer
    for (var i = 0; i &lt; W; i += 18) {
      var sh = 0.15 + 0.35*Math.abs(Math.sin(t*0.08 + i*0.2));
      ctx.fillStyle = &#x27;rgba(180,255,250,&#x27;+sh+&#x27;)&#x27;;
      ctx.fillRect(i, FLOOR, 9, 3);
    }
    ctx.fillStyle = &#x27;rgba(255,255,255,0.5)&#x27;;
    ctx.fillRect(0, FLOOR, W, 2);
  }

  function drawHero() {
    var cx = heroX + HERO_W/2;
    // jetpack flame
    if (flame &gt; 0.02) {
      var fl = flame;
      var fy = heroY + HERO_H;
      var grd = ctx.createLinearGradient(0, fy, 0, fy + 30*fl);
      grd.addColorStop(0, &#x27;rgba(255,220,80,&#x27;+ (0.9*fl) +&#x27;)&#x27;);
      grd.addColorStop(0.5, &#x27;rgba(255,140,30,&#x27;+ (0.7*fl) +&#x27;)&#x27;);
      grd.addColorStop(1, &#x27;rgba(255,60,0,0)&#x27;);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(heroX+5, fy);
      ctx.lineTo(cx, fy + (26+Math.random()*8)*fl);
      ctx.lineTo(heroX+HERO_W-5, fy);
      ctx.closePath();
      ctx.fill();
    }
    // jetpack body
    ctx.fillStyle = &#x27;#8a90a0&#x27;;
    ctx.fillRect(heroX-4, heroY+8, 6, 18);
    // body suit
    ctx.fillStyle = &#x27;#e8ecf5&#x27;;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(heroX, heroY+10, HERO_W, HERO_H-10, 6) : ctx.rect(heroX, heroY+10, HERO_W, HERO_H-10);
    ctx.fill();
    // helmet
    ctx.fillStyle = &#x27;#f2f4fa&#x27;;
    ctx.beginPath(); ctx.arc(cx, heroY+9, 11, 0, 6.28); ctx.fill();
    // visor
    ctx.fillStyle = &#x27;#2ad6ff&#x27;;
    ctx.beginPath(); ctx.arc(cx+2, heroY+9, 6, 0, 6.28); ctx.fill();
    ctx.fillStyle = &#x27;rgba(255,255,255,0.7)&#x27;;
    ctx.beginPath(); ctx.arc(cx+4, heroY+7, 2, 0, 6.28); ctx.fill();
    // little legs
    ctx.fillStyle = &#x27;#c8ccd8&#x27;;
    ctx.fillRect(heroX+3, heroY+HERO_H-3, 6, 4);
    ctx.fillRect(heroX+HERO_W-9, heroY+HERO_H-3, 6, 4);
  }

  function drawMeteor(m) {
    ctx.save();
    ctx.translate(m.x + m.w/2, FLOOR - m.h/2);
    ctx.rotate(m.spin);
    var r = Math.min(m.w, m.h)/2;
    // spiky shape
    ctx.beginPath();
    var spikes = 8;
    for (var i = 0; i &lt; spikes*2; i++) {
      var ang = (i/(spikes*2))*6.28;
      var rad = (i%2===0) ? r : r*0.62;
      var px = Math.cos(ang)*rad*(m.w/(2*r));
      var py = Math.sin(ang)*rad*(m.h/(2*r));
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    var g = ctx.createRadialGradient(0,0,2,0,0,r);
    g.addColorStop(0,&#x27;#ff8a5a&#x27;);
    g.addColorStop(0.6,&#x27;#e83a2a&#x27;);
    g.addColorStop(1,&#x27;#8a1010&#x27;);
    ctx.fillStyle = g;
    ctx.shadowColor = &#x27;#ff4020&#x27;;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawParticles() {
    for (var p of particles) {
      ctx.fillStyle = &#x27;rgba(255,220,80,&#x27;+p.life+&#x27;)&#x27;;
      ctx.beginPath();
      // star shape (small)
      var s = 3*p.life + 1;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.beginPath();
      for (var i = 0; i &lt; 8; i++) {
        var a = (i/8)*6.28;
        var rr = (i%2===0)? s : s*0.4;
        var xx = Math.cos(a)*rr, yy = Math.sin(a)*rr;
        if (i===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHUD() {
    ctx.fillStyle = &#x27;rgba(10,4,22,0.9)&#x27;;
    ctx.fillRect(0,0,W,HUD_H);
    ctx.fillStyle = &#x27;rgba(120,80,255,0.5)&#x27;;
    ctx.fillRect(0,HUD_H-2,W,2);
    // score
    var sc = scoreFlash &gt; 0 ? &#x27;#ffe14a&#x27; : &#x27;#e8e0ff&#x27;;
    ctx.fillStyle = sc;
    ctx.font = &#x27;bold 20px system-ui, sans-serif&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;
    ctx.textAlign = &#x27;left&#x27;;
    ctx.fillText(&#x27;SCORE &#x27; + score, 12, HUD_H/2);
    // level badge
    var glow = 6 + level*3 + levelFlash*10;
    ctx.textAlign = &#x27;right&#x27;;
    ctx.shadowColor = &#x27;#4af0ff&#x27;;
    ctx.shadowBlur = glow;
    ctx.fillStyle = &#x27;#4af0ff&#x27;;
    ctx.font = &#x27;bold 18px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;LEVEL &#x27; + level, W-12, HUD_H/2);
    ctx.shadowBlur = 0;
  }

  function drawGameOver() {
    ctx.fillStyle = &#x27;rgba(8,2,20,0.72)&#x27;;
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;
    ctx.fillStyle = &#x27;#ff5a3c&#x27;;
    ctx.shadowColor = &#x27;#ff5a3c&#x27;; ctx.shadowBlur = 20;
    ctx.font = &#x27;bold 46px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;GAME OVER&#x27;, W/2, H/2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = &#x27;#ffe14a&#x27;;
    ctx.font = &#x27;bold 26px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Score: &#x27; + score, W/2, H/2 + 12);
    ctx.fillStyle = &#x27;#4af0ff&#x27;;
    ctx.font = &#x27;bold 22px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Best: &#x27; + best, W/2, H/2 + 46);
    ctx.fillStyle = &#x27;#b8a8e0&#x27;;
    ctx.font = &#x27;16px system-ui, sans-serif&#x27;;
    ctx.fillText(&#x27;Press Start below to play again&#x27;, W/2, H/2 + 82);
  }

  function render() {
    ctx.clearRect(0,0,W,H);
    drawBG();
    drawGround();
    for (var m of meteors) drawMeteor(m);
    drawParticles();
    drawHero();
    drawHUD();
    if (gameOver) drawGameOver();
  }

  function update() {
    t++;
    mtnOff += 0.35;
    pillarOff += curSpeed()*0.75;

    // hero physics
    heroVY += GRAVITY;
    heroY += heroVY;
    if (heroY &gt; FLOOR - HERO_H) { heroY = FLOOR - HERO_H; heroVY = 0; jumps = 0; }
    if (heroY &lt; HUD_H) { heroY = HUD_H; heroVY = 0; }
    if (flame &gt; 0) flame -= 0.045;
    if (flame &lt; 0) flame = 0;

    if (levelFlash &gt; 0) levelFlash -= 0.04;
    if (scoreFlash &gt; 0) scoreFlash -= 0.08;

    // spawn
    spawnTimer++;
    if (spawnTimer &gt;= curSpawn()) { spawnTimer = 0; spawnMeteor(); }

    var sp = curSpeed();
    for (var i = meteors.length-1; i &gt;= 0; i--) {
      var m = meteors[i];
      m.x -= sp;
      m.spin += 0.05;
      if (m.x + m.w &lt; 0) { meteors.splice(i,1); continue; }
      if (!m.scored &amp;&amp; m.x + m.w &lt; heroX) {
        m.scored = true;
        score++;
        scoreFlash = 1;
        burst(m.x + m.w/2, FLOOR - m.h/2);
        var newLevel = Math.floor(score/10) + 1;
        if (newLevel &gt; level) { level = newLevel; levelFlash = 1; }
      }
      // collision (AABB with slight forgiveness)
      var mTop = FLOOR - m.h;
      if (heroX + HERO_W - 4 &gt; m.x + 3 &amp;&amp; heroX + 4 &lt; m.x + m.w - 3 &amp;&amp;
          heroY + HERO_H - 2 &gt; mTop + 3) {
        gameOver = true;
        if (score &gt; best) best = score;
        running = false;
        break;
      }
    }

    // particles
    for (var j = particles.length-1; j &gt;= 0; j--) {
      var p = particles[j];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.03;
      if (p.life &lt;= 0) particles.splice(j,1);
    }
  }

  function loop() {
    if (running) update();
    render();
    if (running) animId = requestAnimationFrame(loop);
    else if (gameOver) { render(); } // final frame with overlay
  }

  function startGame() {
    reset();
    running = true;
    spawnMeteor();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }
  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    render();
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { jump(); e.preventDefault(); }
  });
  cv.addEventListener(&#x27;mousedown&#x27;, function(){ jump(); });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static frame (stopped state, visible)
  reset();
  render();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s

  <div class="controls">

    <button id="stop" disabled>Stop</button>

</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;

    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();

  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
