<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌱 Gopher Garden 🔨</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🌱 Gopher Garden 🔨</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #7ec6f0; color: #222; overflow: hidden; user-select: none; }
  .game { width: 720px; height: 640px; margin: 0 auto; position: relative; box-sizing: border-box; overflow: hidden;
    background: linear-gradient(#87cefa 0%, #aee6ff 45%, #b6ec8a 45%, #8fd45a 100%); }

  /* Sun */
  .sun { position: absolute; top: 18px; right: 30px; width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff6a0, #ffd23f); box-shadow: 0 0 30px #ffe066; }
  .sun::before { content:&#x27;&#x27;; position:absolute; inset:-14px; border-radius:50%; box-shadow:0 0 0 6px rgba(255,220,80,.25); }

  /* Hills */
  .hill { position: absolute; bottom: 0; border-radius: 50% 50% 0 0; background: #74bd44; }
  .hill.h1 { left: -60px; width: 340px; height: 190px; background:#6cb63e; }
  .hill.h2 { right: -80px; width: 400px; height: 220px; background:#7cc84c; }

  /* Header */
  h1 { position:absolute; top:6px; left:50%; transform:translateX(-50%); margin:0; z-index:5;
    font-size:26px; color:#3a2410; text-shadow:1px 1px 0 #fff; }
  .instructions { position:absolute; top:40px; left:50%; transform:translateX(-50%); z-index:5;
    font-size:16px; color:#274d13; text-align:center; width:640px; line-height:1.35; margin:0;
    background:rgba(255,255,255,.55); border-radius:8px; padding:4px 8px; box-sizing:border-box; }

  /* Wooden scoreboard */
  .board-top { position:absolute; top:78px; left:50%; transform:translateX(-50%); z-index:5;
    display:flex; gap:14px; align-items:center; }
  .sign { background:linear-gradient(#a9702f,#8a5620); border:3px solid #5e3a13; border-radius:8px;
    color:#fff3d8; padding:6px 14px; font-weight:700; font-size:18px; box-shadow:0 3px 0 #4d300f;
    text-shadow:1px 1px 0 #3d2408; }
  .sign small { display:block; font-size:11px; font-weight:600; opacity:.85; }

  /* Combo banner */
  .combo { position:absolute; top:130px; left:50%; transform:translateX(-50%) scale(0); z-index:8;
    font-size:34px; font-weight:900; color:#ffe100; -webkit-text-stroke:2px #b26a00; text-shadow:0 3px 6px rgba(0,0,0,.4);
    transition:transform .12s; pointer-events:none; }
  .combo.show { transform:translateX(-50%) scale(1); }

  /* Playing grid */
  .grid { position:absolute; top:170px; left:50%; transform:translateX(-50%); z-index:4;
    display:grid; grid-template-columns:repeat(3,150px); grid-template-rows:repeat(3,140px); gap:8px;
    transition:transform .15s ease; }
  .grid.parallax { transform:translateX(-50%) translateY(-4px); }

  .hole { position:relative; width:150px; height:140px; }
  /* Burrow (dirt) */
  .burrow { position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:110px; height:44px; border-radius:50%; background:radial-gradient(ellipse at center,#4a2e15 0%,#3a2410 70%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,.5); overflow:hidden; }
  /* clip mask for gopher so it appears to rise out of the hole */
  .mound { position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:110px; height:70px; overflow:hidden; }

  /* Grass tufts */
  .grass { position:absolute; bottom:44px; left:50%; transform:translateX(-50%); width:120px; height:26px; z-index:3; pointer-events:none; }
  .blade { position:absolute; bottom:0; width:6px; height:22px; background:linear-gradient(#8fd45a,#5aa62e);
    border-radius:3px 3px 0 0; transform-origin:bottom center; animation:sway 2.4s ease-in-out infinite; }

  @keyframes sway { 0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);} }

  /* Gopher */
  .gopher { position:absolute; bottom:-70px; left:50%; margin-left:-42px; width:84px; height:78px; cursor:pointer;
    transition:bottom .18s cubic-bezier(.34,1.4,.6,1); z-index:2; }
  .gopher.up { bottom:2px; }
  .gopher .body { position:absolute; bottom:0; left:7px; width:70px; height:72px; border-radius:50% 50% 45% 45%;
    background:radial-gradient(circle at 40% 30%,#c79a63,#9c6d3a); box-shadow:inset -6px -6px 10px rgba(0,0,0,.25); }
  .gopher .ear { position:absolute; width:20px; height:20px; border-radius:50%; background:#9c6d3a; top:6px; }
  .gopher .ear.l{ left:6px;} .gopher .ear.r{ right:6px;}
  /* hard hat */
  .gopher .hat { position:absolute; top:-4px; left:50%; margin-left:-30px; width:60px; height:26px;
    background:linear-gradient(#ffd24d,#f0a800); border-radius:30px 30px 6px 6px; z-index:3;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.2); }
  .gopher .hat::after{ content:&#x27;&#x27;; position:absolute; bottom:-3px; left:-6px; width:72px; height:8px;
    background:#f0a800; border-radius:6px; }
  /* eyes */
  .gopher .eye { position:absolute; top:22px; width:20px; height:20px; border-radius:50%; background:#fff; z-index:4;
    border:1px solid #7a5427; overflow:hidden; }
  .gopher .eye.l{ left:16px;} .gopher .eye.r{ right:16px;}
  .gopher .pupil { position:absolute; width:9px; height:9px; border-radius:50%; background:#222; top:6px; left:5px;
    transition:all .1s; }
  /* winking */
  .gopher.wink .eye.r { height:3px; top:31px; }
  /* cross-eyed splat */
  .gopher.splat .eye.l .pupil{ left:9px; top:2px; }
  .gopher.splat .eye.r .pupil{ left:1px; top:2px; }
  /* nose + teeth */
  .gopher .nose { position:absolute; top:42px; left:50%; margin-left:-6px; width:12px; height:8px; border-radius:50%; background:#5a3a1c; z-index:4; }
  .gopher .teeth { position:absolute; top:52px; left:50%; margin-left:-9px; width:18px; height:12px; background:#fff;
    border-radius:2px 2px 4px 4px; border:1px solid #d0b070; z-index:4; }
  .gopher .teeth::after{ content:&#x27;&#x27;; position:absolute; top:0; left:50%; width:1px; height:100%; background:#d0b070; }

  /* laugh on escape */
  .gopher.laugh { animation:laugh .3s ease-in-out 2; }
  @keyframes laugh { 0%,100%{ transform:translateY(0) rotate(0);} 25%{ transform:translateY(-3px) rotate(-4deg);} 75%{ transform:translateY(-3px) rotate(4deg);} }

  /* floating +1 */
  .float { position:absolute; z-index:9; font-weight:900; font-size:22px; color:#fff; -webkit-text-stroke:1px #2a7a12;
    pointer-events:none; animation:floatUp .8s ease-out forwards; }
  @keyframes floatUp { 0%{ transform:translateY(0) scale(.6); opacity:0;} 20%{ opacity:1; transform:translateY(-8px) scale(1.1);} 100%{ transform:translateY(-46px) scale(1); opacity:0;} }

  /* particles */
  .particle { position:absolute; z-index:8; border-radius:50%; pointer-events:none; }

  /* overlay */
  .overlay { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.25); font-size:24px; color:#fff; font-weight:800; text-shadow:0 2px 4px rgba(0,0,0,.5); }
  .overlay.hide { display:none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot; id=&quot;game&quot;&gt;
  &lt;div class=&quot;sun&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;hill h1&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;hill h2&quot;&gt;&lt;/div&gt;

  &lt;h1&gt;🌱 Gopher Garden 🔨&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack the hard-hat gophers by clicking them before they duck back underground. Chain quick hits for a combo bonus — and don&#x27;t let too many escape!&lt;/p&gt;

  &lt;div class=&quot;board-top&quot;&gt;
    &lt;div class=&quot;sign&quot;&gt;🔨 &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;small&gt;WHACKS&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sign&quot;&gt;😢 &lt;span id=&quot;escaped&quot;&gt;0&lt;/span&gt;&lt;small&gt;ESCAPED&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;sign&quot;&gt;⏱ &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;small&gt;LEVEL&lt;/small&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;COMBO x2!&lt;/div&gt;

  &lt;div class=&quot;grid&quot; id=&quot;grid&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press &lt;span style=&quot;text-decoration:underline;&quot;&gt;&amp;nbsp;Start&amp;nbsp;&lt;/span&gt; below to defend the garden!&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
  var grid = document.getElementById(&#x27;grid&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var escapedEl = document.getElementById(&#x27;escaped&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var gameEl = document.getElementById(&#x27;game&#x27;);

  var holes = [];
  var running = false;
  var score = 0, escaped = 0, level = 1;
  var spawnTimer = null, levelTimer = null;
  var activeTimeouts = [];
  var lastHitTime = 0, comboCount = 0;
  var audioCtx = null;

  // build 9 holes
  for (var i = 0; i &lt; 9; i++) {
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;

    var grass = document.createElement(&#x27;div&#x27;);
    grass.className = &#x27;grass&#x27;;
    for (var b = 0; b &lt; 7; b++) {
      var blade = document.createElement(&#x27;div&#x27;);
      blade.className = &#x27;blade&#x27;;
      blade.style.left = (b * 16 + 4) + &#x27;px&#x27;;
      blade.style.animationDelay = (Math.random() * 2).toFixed(2) + &#x27;s&#x27;;
      blade.style.height = (16 + Math.random() * 10) + &#x27;px&#x27;;
      grass.appendChild(blade);
    }

    var burrow = document.createElement(&#x27;div&#x27;); burrow.className = &#x27;burrow&#x27;;
    var mound = document.createElement(&#x27;div&#x27;); mound.className = &#x27;mound&#x27;;

    var g = document.createElement(&#x27;div&#x27;);
    g.className = &#x27;gopher&#x27;;
    g.innerHTML =
      &#x27;&lt;div class=&quot;hat&quot;&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;body&quot;&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;ear l&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ear r&quot;&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;eye l&quot;&gt;&lt;div class=&quot;pupil&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;eye r&quot;&gt;&lt;div class=&quot;pupil&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;nose&quot;&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;div class=&quot;teeth&quot;&gt;&lt;/div&gt;&#x27;;
    mound.appendChild(g);

    hole.appendChild(burrow);
    hole.appendChild(mound);
    hole.appendChild(grass);
    grid.appendChild(hole);

    holes.push({ el: hole, gopher: g, up: false, hit: false, timeout: null, idx: i });
    bindGopher(holes[i]);
  }

  function bindGopher(h) {
    h.gopher.addEventListener(&#x27;mousedown&#x27;, function (ev) {
      ev.stopPropagation();
      if (!running || !h.up || h.hit) return;
      whack(h);
    });
  }

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      o.connect(gn); gn.connect(audioCtx.destination);
      gn.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gn.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function whack(h) {
    h.hit = true;
    if (h.timeout) { clearTimeout(h.timeout); }
    h.gopher.classList.add(&#x27;splat&#x27;);
    beep(180, 0.15, &#x27;sawtooth&#x27;);

    // combo logic
    var now = Date.now();
    if (now - lastHitTime &lt; 900) comboCount++; else comboCount = 1;
    lastHitTime = now;
    var mult = comboCount &gt;= 5 ? 3 : (comboCount &gt;= 3 ? 2 : 1);
    var points = mult;
    score += points;
    scoreEl.textContent = score;

    if (mult &gt; 1) showCombo(mult);

    // parallax nudge
    grid.classList.add(&#x27;parallax&#x27;);
    setTimeout(function(){ grid.classList.remove(&#x27;parallax&#x27;); }, 130);

    spawnFloat(h, &#x27;+&#x27; + points);
    spawnParticles(h);

    var t = setTimeout(function () {
      h.gopher.classList.remove(&#x27;up&#x27;, &#x27;splat&#x27;, &#x27;wink&#x27;);
      h.up = false;
    }, 160);
    activeTimeouts.push(t);
  }

  function showCombo(mult) {
    comboEl.textContent = &#x27;COMBO x&#x27; + mult + &#x27;!&#x27;;
    comboEl.classList.add(&#x27;show&#x27;);
    var t = setTimeout(function(){ comboEl.classList.remove(&#x27;show&#x27;); }, 600);
    activeTimeouts.push(t);
  }

  function spawnFloat(h, txt) {
    var rect = h.el.getBoundingClientRect();
    var grect = gameEl.getBoundingClientRect();
    var f = document.createElement(&#x27;div&#x27;);
    f.className = &#x27;float&#x27;;
    f.textContent = txt;
    f.style.left = (rect.left - grect.left + 50) + &#x27;px&#x27;;
    f.style.top = (rect.top - grect.top + 30) + &#x27;px&#x27;;
    gameEl.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 850);
  }

  function spawnParticles(h) {
    var rect = h.el.getBoundingClientRect();
    var grect = gameEl.getBoundingClientRect();
    var cx = rect.left - grect.left + 75;
    var cy = rect.top - grect.top + 55;
    var colors = [&#x27;#ffe100&#x27;,&#x27;#fff&#x27;,&#x27;#7a4a1e&#x27;,&#x27;#a9702f&#x27;,&#x27;#ffd24d&#x27;];
    for (var i = 0; i &lt; 12; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      var sz = 5 + Math.random() * 7;
      p.style.width = sz + &#x27;px&#x27;; p.style.height = sz + &#x27;px&#x27;;
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.left = cx + &#x27;px&#x27;; p.style.top = cy + &#x27;px&#x27;;
      gameEl.appendChild(p);
      var ang = Math.random() * Math.PI * 2;
      var dist = 30 + Math.random() * 50;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 20;
      p.animate([
        { transform:&#x27;translate(0,0) scale(1)&#x27;, opacity:1 },
        { transform:&#x27;translate(&#x27;+dx+&#x27;px,&#x27;+dy+&#x27;px) scale(.3)&#x27;, opacity:0 }
      ], { duration: 600, easing:&#x27;ease-out&#x27; });
      (function(pp){ setTimeout(function(){ if(pp.parentNode) pp.parentNode.removeChild(pp); }, 620); })(p);
    }
  }

  function popGopher() {
    // pick free holes
    var free = holes.filter(function(h){ return !h.up; });
    if (!free.length) return;
    // number simultaneous based on level
    var count = level &gt;= 6 ? 3 : (level &gt;= 3 ? 2 : 1);
    count = Math.min(count, free.length);
    // life shrinks with level
    var life = Math.max(600, 1400 - level * 90);

    for (var c = 0; c &lt; count; c++) {
      var idx = Math.floor(Math.random() * free.length);
      var h = free.splice(idx, 1)[0];
      raise(h, life);
    }
  }

  function raise(h, life) {
    h.up = true; h.hit = false;
    h.gopher.classList.remove(&#x27;splat&#x27;,&#x27;laugh&#x27;,&#x27;wink&#x27;);
    h.gopher.classList.add(&#x27;up&#x27;);
    beep(520, 0.06, &#x27;sine&#x27;);

    // occasional wink
    if (Math.random() &lt; 0.35) {
      var wt = setTimeout(function(){ if (h.up &amp;&amp; !h.hit) h.gopher.classList.add(&#x27;wink&#x27;); }, life * 0.3);
      activeTimeouts.push(wt);
    }

    h.timeout = setTimeout(function () {
      if (h.hit) return;
      // escaped
      h.gopher.classList.add(&#x27;laugh&#x27;);
      escaped++;
      escapedEl.textContent = escaped;
      beep(300, 0.12, &#x27;triangle&#x27;);
      var t2 = setTimeout(function () {
        h.gopher.classList.remove(&#x27;up&#x27;,&#x27;laugh&#x27;,&#x27;wink&#x27;);
        h.up = false;
      }, 260);
      activeTimeouts.push(t2);
    }, life);
  }

  function startGame() {
    if (running) return;
    running = true;
    score = 0; escaped = 0; level = 1;
    comboCount = 0; lastHitTime = 0;
    scoreEl.textContent = &#x27;0&#x27;; escapedEl.textContent = &#x27;0&#x27;; levelEl.textContent = &#x27;1&#x27;;
    overlay.classList.add(&#x27;hide&#x27;);
    clearAll();

    // immediate first pop for responsiveness
    popGopher();
    scheduleSpawn();

    levelTimer = setInterval(function () {
      level++;
      levelEl.textContent = level;
      // reschedule spawn faster
      scheduleSpawn();
      beep(660, 0.1, &#x27;square&#x27;);
    }, 10000);
  }

  function scheduleSpawn() {
    if (spawnTimer) clearInterval(spawnTimer);
    var interval = Math.max(500, 1100 - level * 90);
    spawnTimer = setInterval(popGopher, interval);
  }

  function clearAll() {
    for (var i = 0; i &lt; activeTimeouts.length; i++) clearTimeout(activeTimeouts[i]);
    activeTimeouts = [];
    holes.forEach(function (h) {
      if (h.timeout) clearTimeout(h.timeout);
      h.up = false; h.hit = false;
      h.gopher.classList.remove(&#x27;up&#x27;,&#x27;splat&#x27;,&#x27;laugh&#x27;,&#x27;wink&#x27;);
    });
  }

  function stopGame() {
    if (!running) return;
    running = false;
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    if (levelTimer) { clearInterval(levelTimer); levelTimer = null; }
    clearAll();
    overlay.textContent = &#x27;Game paused — Final whacks: &#x27; + score;
    overlay.classList.remove(&#x27;hide&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }

    if (running) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
