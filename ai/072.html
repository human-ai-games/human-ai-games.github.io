&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🌻 Gopher Garden Bash 🌻&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Whack the brown gophers (+1) and golden sunglass gophers (+3), but never hit the red-helmet bombs (−2). Hit three in a row to trigger a point-doubling COMBO!&lt;/p&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div class=&quot;sign&quot;&gt;&lt;div class=&quot;label&quot;&gt;SCORE&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sign&quot;&gt;&lt;div class=&quot;label&quot;&gt;STREAK&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;streak&quot;&gt;0&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sign&quot;&gt;&lt;div class=&quot;label&quot;&gt;TIME&lt;/div&gt;&lt;div class=&quot;val&quot; id=&quot;time&quot;&gt;60&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

      &lt;div class=&quot;board&quot; id=&quot;board&quot;&gt;

        &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;Press &lt;strong&gt;&amp;nbsp;Start&amp;nbsp;&lt;/strong&gt; below to dig in!&lt;/div&gt;

    &lt;/div&gt;

&lt;script&gt;
  var board = document.getElementById(&#x27;board&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var streakEl = document.getElementById(&#x27;streak&#x27;);
  var timeEl = document.getElementById(&#x27;time&#x27;);
  var timefill = document.getElementById(&#x27;timefill&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var stage = document.querySelector(&#x27;.stage&#x27;);

  var GAME_LEN = 60;
  var holes = [];
  var running = false;
  var score = 0, streak = 0, timeLeft = GAME_LEN;
  var comboActive = false, comboUntil = 0;
  var spawnTimer = null, gameTimer = null;
  var occupied = {};
  var audioCtx = null;

  // build holes
  for (var i = 0; i &lt; 9; i++) {
    var hole = document.createElement(&#x27;div&#x27;);
    hole.className = &#x27;hole&#x27;;
    var dirt = document.createElement(&#x27;div&#x27;); dirt.className = &#x27;dirt&#x27;;
    hole.appendChild(dirt);
    board.insertBefore(hole, comboEl);
    holes.push(hole);
  }

  function beep(freq, dur, type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.18, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }

  function gopherSVG(type) {
    // type: &#x27;brown&#x27;,&#x27;gold&#x27;,&#x27;bomb&#x27;
    var body = type===&#x27;gold&#x27; ? &#x27;#e8b93a&#x27; : &#x27;#a6743e&#x27;;
    var bodyDark = type===&#x27;gold&#x27; ? &#x27;#c99722&#x27; : &#x27;#7d5528&#x27;;
    var helmet = type===&#x27;bomb&#x27; ? &#x27;#d23&#x27; : (type===&#x27;gold&#x27; ? &#x27;#f5d94a&#x27; : &#x27;#f2c14e&#x27;);
    var helmetDark = type===&#x27;bomb&#x27; ? &#x27;#a11&#x27; : &#x27;#c99722&#x27;;
    var shades = type===&#x27;gold&#x27; ? &#x27;&lt;rect x=&quot;24&quot; y=&quot;42&quot; width=&quot;14&quot; height=&quot;9&quot; rx=&quot;2&quot; fill=&quot;#111&quot;/&gt;&lt;rect x=&quot;44&quot; y=&quot;42&quot; width=&quot;14&quot; height=&quot;9&quot; rx=&quot;2&quot; fill=&quot;#111&quot;/&gt;&lt;rect x=&quot;38&quot; y=&quot;45&quot; width=&quot;6&quot; height=&quot;3&quot; fill=&quot;#111&quot;/&gt;&#x27; : &#x27;&#x27;;
    var eyes = type===&#x27;gold&#x27; ? &#x27;&#x27; : &#x27;&lt;circle cx=&quot;31&quot; cy=&quot;46&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;51&quot; cy=&quot;46&quot; r=&quot;4&quot; fill=&quot;#fff&quot;/&gt;&lt;circle cx=&quot;31&quot; cy=&quot;47&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&lt;circle cx=&quot;51&quot; cy=&quot;47&quot; r=&quot;2&quot; fill=&quot;#222&quot;/&gt;&#x27;;
    var mouth = type===&#x27;bomb&#x27; ? &#x27;&lt;path d=&quot;M32 60 Q41 54 50 60&quot; stroke=&quot;#5a2b12&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot;/&gt;&#x27; : &#x27;&lt;path d=&quot;M32 58 Q41 66 50 58&quot; stroke=&quot;#5a2b12&quot; stroke-width=&quot;2.5&quot; fill=&quot;none&quot;/&gt;&#x27;;
    var spark = type===&#x27;bomb&#x27; ? &#x27;&lt;circle cx=&quot;41&quot; cy=&quot;20&quot; r=&quot;3&quot; fill=&quot;#ff0&quot;/&gt;&lt;path d=&quot;M41 12 L41 6 M35 15 L31 11 M47 15 L51 11&quot; stroke=&quot;#ff0&quot; stroke-width=&quot;2&quot;/&gt;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;svg viewBox=&quot;0 0 82 90&quot; width=&quot;82&quot; height=&quot;90&quot;&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;41&quot; cy=&quot;60&quot; rx=&quot;30&quot; ry=&quot;30&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;41&quot; cy=&quot;66&quot; rx=&quot;18&quot; ry=&quot;16&quot; fill=&quot;&#x27;+bodyDark+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;22&quot; cy=&quot;42&quot; rx=&quot;7&quot; ry=&quot;9&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;60&quot; cy=&quot;42&quot; rx=&quot;7&quot; ry=&quot;9&quot; fill=&quot;&#x27;+body+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;ellipse cx=&quot;41&quot; cy=&quot;70&quot; rx=&quot;9&quot; ry=&quot;7&quot; fill=&quot;#f3d9c0&quot;/&gt;&#x27;
      + &#x27;&lt;rect x=&quot;37&quot; y=&quot;66&quot; width=&quot;8&quot; height=&quot;6&quot; fill=&quot;#fff&quot;/&gt;&#x27;  // teeth
      + eyes + shades
      + &#x27;&lt;circle cx=&quot;41&quot; cy=&quot;56&quot; r=&quot;3&quot; fill=&quot;#5a2b12&quot;/&gt;&#x27; // nose
      + mouth
      // helmet
      + &#x27;&lt;path d=&quot;M16 40 Q41 18 66 40 Z&quot; fill=&quot;&#x27;+helmet+&#x27;&quot;/&gt;&#x27;
      + &#x27;&lt;rect x=&quot;14&quot; y=&quot;38&quot; width=&quot;54&quot; height=&quot;6&quot; rx=&quot;3&quot; fill=&quot;&#x27;+helmetDark+&#x27;&quot;/&gt;&#x27;
      + spark
      + &#x27;&lt;/svg&gt;&#x27;;
  }

  function difficulty() {
    // returns {life, gap} based on elapsed time
    var elapsed = GAME_LEN - timeLeft;
    if (elapsed &gt;= 40) return { life: [650, 900], gap: [500, 850] };
    if (elapsed &gt;= 20) return { life: [800, 1150], gap: [650, 1000] };
    return { life: [1050, 1500], gap: [850, 1250] };
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function pickType() {
    var r = Math.random();
    if (r &lt; 0.14) return &#x27;gold&#x27;;
    if (r &lt; 0.34) return &#x27;bomb&#x27;;
    return &#x27;brown&#x27;;
  }

  function spawnGopher() {
    if (!running) return;
    var free = [];
    for (var i = 0; i &lt; 9; i++) if (!occupied[i]) free.push(i);
    if (free.length) {
      var idx = free[Math.floor(Math.random() * free.length)];
      var hole = holes[idx];
      var type = pickType();
      var diff = difficulty();
      var life = type === &#x27;gold&#x27; ? rand(700, 1000) : rand(diff.life[0], diff.life[1]);
      var g = document.createElement(&#x27;div&#x27;);
      g.className = &#x27;gopher&#x27;;
      g.innerHTML = gopherSVG(type);
      g.dataset.type = type;
      occupied[idx] = g;
      hole.appendChild(g);
      // spring up
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ g.classList.add(&#x27;up&#x27;); }); });

      // gold flash warning near end of its life
      var flashTimer = setTimeout(function(){ if (g.parentNode) g.classList.add(&#x27;flash&#x27;); }, type===&#x27;gold&#x27; ? life*0.4 : life*0.6);

      var lifeTimer = setTimeout(function(){
        if (!g.parentNode) return;
        // missed
        if (type === &#x27;brown&#x27; || type === &#x27;gold&#x27;) {
          g.classList.remove(&#x27;up&#x27;); g.classList.add(&#x27;miss&#x27;);
          // reset streak on missing a good gopher
          streak = 0; comboActive = false; streakEl.textContent = 0;
        }
        setTimeout(function(){ removeGopher(idx, g); }, 350);
      }, life);

      g.addEventListener(&#x27;click&#x27;, function(ev){
        ev.stopPropagation();
        if (g.dataset.hit) return;
        g.dataset.hit = &#x27;1&#x27;;
        clearTimeout(flashTimer);
        clearTimeout(lifeTimer);
        handleHit(type, hole, g, idx);
      });
    }
    var diff2 = difficulty();
    spawnTimer = setTimeout(spawnGopher, rand(diff2.gap[0], diff2.gap[1]));
  }

  function removeGopher(idx, g) {
    if (g &amp;&amp; g.parentNode) g.parentNode.removeChild(g);
    if (occupied[idx] === g) delete occupied[idx];
  }

  function handleHit(type, hole, g, idx) {
    var base = 0, color = &#x27;#fff&#x27;, label = &#x27;&#x27;;
    if (type === &#x27;brown&#x27;) { base = 1; color = &#x27;#fff4d6&#x27;; label = &#x27;+&#x27;; beep(520,.12); }
    else if (type === &#x27;gold&#x27;) { base = 3; color = &#x27;#ffe066&#x27;; label = &#x27;+&#x27;; beep(760,.15,&#x27;triangle&#x27;); }
    else if (type === &#x27;bomb&#x27;) { base = -2; color = &#x27;#ff6b6b&#x27;; label = &#x27;&#x27;; beep(120,.3,&#x27;sawtooth&#x27;); }

    var pts = base;
    if (type === &#x27;bomb&#x27;) {
      streak = 0; comboActive = false;
    } else {
      streak++;
      if (comboActive) pts = base * 2;
      if (streak &gt; 0 &amp;&amp; streak % 3 === 0) {
        comboActive = true; comboUntil = Date.now() + 5000;
        showCombo();
        beep(880,.2,&#x27;triangle&#x27;);
      }
    }
    streakEl.textContent = streak;

    score += pts;
    scoreEl.textContent = score;

    // splat
    var splat = document.createElement(&#x27;div&#x27;);
    splat.className = &#x27;splat go&#x27;;
    splat.textContent = type === &#x27;bomb&#x27; ? &#x27;💥&#x27; : &#x27;✨&#x27;;
    hole.appendChild(splat);
    setTimeout(function(){ if(splat.parentNode) splat.parentNode.removeChild(splat); }, 460);

    // floating score
    var fl = document.createElement(&#x27;div&#x27;);
    fl.className = &#x27;float&#x27;;
    fl.style.color = color;
    fl.style.left = &#x27;50%&#x27;;
    fl.style.top = &#x27;30%&#x27;;
    fl.textContent = (pts&gt;=0?&#x27;+&#x27;:&#x27;&#x27;) + pts + (comboActive &amp;&amp; type!==&#x27;bomb&#x27; &amp;&amp; pts!==base ? &#x27;!&#x27; : &#x27;&#x27;);
    hole.appendChild(fl);
    setTimeout(function(){ if(fl.parentNode) fl.parentNode.removeChild(fl); }, 820);

    // screen shake
    stage.classList.remove(&#x27;shake&#x27;); void stage.offsetWidth; stage.classList.add(&#x27;shake&#x27;);

    // duck down then remove
    g.classList.remove(&#x27;up&#x27;,&#x27;flash&#x27;);
    setTimeout(function(){ removeGopher(idx, g); }, 280);
  }

  function showCombo() {
    comboEl.textContent = &#x27;COMBO x2!&#x27;;
    comboEl.classList.remove(&#x27;show&#x27;); void comboEl.offsetWidth; comboEl.classList.add(&#x27;show&#x27;);
  }

  function tick() {
    if (!running) return;
    timeLeft--;
    if (comboActive &amp;&amp; Date.now() &gt; comboUntil) comboActive = false;
    timeEl.textContent = timeLeft;
    timefill.style.width = (timeLeft / GAME_LEN * 100) + &#x27;%&#x27;;
    if (timeLeft &lt;= 0) { endGame(); return; }
  }

  function clearBoard() {
    for (var k in occupied) { if (occupied[k] &amp;&amp; occupied[k].parentNode) occupied[k].parentNode.removeChild(occupied[k]); }
    occupied = {};
  }

  function startGame() {
    running = true;
    score = 0; streak = 0; timeLeft = GAME_LEN; comboActive = false;
    scoreEl.textContent = 0; streakEl.textContent = 0; timeEl.textContent = timeLeft;
    timefill.style.width = &#x27;100%&#x27;;
    overlay.classList.add(&#x27;hidden&#x27;);
    clearBoard();
    if (spawnTimer) clearTimeout(spawnTimer);
    if (gameTimer) clearInterval(gameTimer);
    spawnGopher();
    gameTimer = setInterval(tick, 1000);
  }

  function stopGame() {
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
  }

  function endGame() {
    running = false;
    if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
    if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
    clearBoard();
    overlay.innerHTML = &#x27;⏰ Time!&lt;br&gt;Final Score: &#x27; + score + &#x27;&lt;br&gt;&lt;span style=&quot;font-size:16px&quot;&gt;Press Start below to play again&lt;/span&gt;&#x27;;
    overlay.classList.remove(&#x27;hidden&#x27;);
  }

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;);
      } catch (_) {}
    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
