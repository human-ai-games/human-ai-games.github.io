&lt;html&gt;&lt;head&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐟 NEON REEF DEFENDER&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;&amp;larr; &amp;rarr;&lt;/strong&gt; (or drag the mouse) and press &lt;strong&gt;Space&lt;/strong&gt; / click to fire sonar. Blast jellyfish, crabs and pufferfish before they reach the bottom — lose all three lives and it&#x27;s game over.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;Score: &lt;span class=&quot;val&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Combo: &lt;span class=&quot;combo&quot; id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/span&gt;
    &lt;span&gt;Best Combo: &lt;span class=&quot;best&quot; id=&quot;best&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span id=&quot;lives&quot;&gt;🐟🐟🐟&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;field&quot; width=&quot;640&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div id=&quot;overlay&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;p id=&quot;finalScore&quot;&gt;Score: 0&lt;/p&gt;
      &lt;small id=&quot;finalBest&quot;&gt;Best Combo: 0&lt;/small&gt;
      &lt;small&gt;Press Restart below to dive again.&lt;/small&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  [&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
    window.addEventListener(t,function(e){
      try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
    },true);
  });

  var W=640, H=460;
  var canvas=document.getElementById(&#x27;field&#x27;), ctx=canvas.getContext(&#x27;2d&#x27;);
  var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;);
  var bestEl=document.getElementById(&#x27;best&#x27;), livesEl=document.getElementById(&#x27;lives&#x27;);
  var overlay=document.getElementById(&#x27;overlay&#x27;), flash=document.getElementById(&#x27;flash&#x27;);
  var finalScore=document.getElementById(&#x27;finalScore&#x27;), finalBest=document.getElementById(&#x27;finalBest&#x27;);

  var running=false, animId=null, gameOver=false;
  var keys={}, mouseX=null;
  var shipX=W/2, shipW=44, shipH=30, shipSpeed=6;
  var bullets=[], enemies=[], particles=[], bubbles=[], seaweed=[], biolum=[];
  var score=0, combo=1, comboTimer=0, bestCombo=0, lives=3;
  var lastShot=0, spawnTimer=0, elapsed=0, shake=0, flashAmt=0;

  var TYPES=[
    {name:&#x27;jelly&#x27;, color:&#x27;#ff6bd9&#x27;, glow:&#x27;#ff2ec4&#x27;, points:1, r:16, move:&#x27;zigzag&#x27;},
    {name:&#x27;crab&#x27;,  color:&#x27;#ffb14d&#x27;, glow:&#x27;#ff8800&#x27;, points:2, r:15, move:&#x27;straight&#x27;},
    {name:&#x27;puffer&#x27;,color:&#x27;#6ffcff&#x27;, glow:&#x27;#17e0ff&#x27;, points:3, r:18, move:&#x27;accel&#x27;}
  ];

  function initBackground(){
    bubbles=[]; for(var i=0;i&lt;26;i++){ bubbles.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*7,sp:0.3+Math.random()*0.9,a:0.15+Math.random()*0.3}); }
    biolum=[]; for(var i=0;i&lt;40;i++){ biolum.push({x:Math.random()*W,y:Math.random()*H,r:0.6+Math.random()*1.6,sp:0.1+Math.random()*0.4,ph:Math.random()*6.28}); }
    seaweed=[]; for(var i=0;i&lt;11;i++){ seaweed.push({x:20+i*58+Math.random()*20,h:40+Math.random()*70,ph:Math.random()*6.28,col:i%2?&#x27;#12ff8a&#x27;:&#x27;#0fb0ff&#x27;}); }
  }

  function spawnEnemy(){
    var t=TYPES[Math.floor(Math.random()*TYPES.length)];
    var speedBoost=Math.min(elapsed/22000, 1.6);
    var e={type:t, x:t.r+Math.random()*(W-2*t.r), y:-t.r, r:t.r,
      vy:(0.9+Math.random()*0.6)+speedBoost, vx:0, t0:0,
      base:0};
    e.base=e.x;
    enemies.push(e);
  }

  function fire(){
    var now=Date.now();
    if(now-lastShot&lt;200) return;
    lastShot=now;
    bullets.push({x:shipX, y:H-shipH-14, r:4});
    beep(680,0.06,&#x27;square&#x27;,0.06);
  }

  // Audio
  var actx=null;
  function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){} } return actx; }
  function beep(freq,dur,type,vol){
    var a=ac(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
    g.gain.value=vol||0.08;
    o.connect(g); g.connect(a.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.stop(a.currentTime+dur);
  }

  function burst(x,y,color){
    for(var i=0;i&lt;16;i++){
      var ang=Math.random()*6.28, sp=1+Math.random()*4;
      particles.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,color:color,r:2+Math.random()*3});
    }
  }

  function loseLife(){
    lives--; shake=14; flashAmt=0.6;
    combo=1; comboTimer=0;
    beep(120,0.25,&#x27;sawtooth&#x27;,0.12);
    renderLives();
    if(lives&lt;=0){ endGame(); }
  }
  function renderLives(){
    var s=&#x27;&#x27;; for(var i=0;i&lt;3;i++) s+= i&lt;lives ? &#x27;🐟&#x27; : &#x27;💀&#x27;;
    livesEl.textContent=s;
  }

  function endGame(){
    gameOver=true; running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    finalScore.textContent=&#x27;Score: &#x27;+score;
    finalBest.textContent=&#x27;Best Combo: &#x27;+bestCombo;
    overlay.style.display=&#x27;flex&#x27;;
  }

  function update(dt){
    elapsed+=dt;
    // ship
    if(keys[&#x27;ArrowLeft&#x27;]) shipX-=shipSpeed;
    if(keys[&#x27;ArrowRight&#x27;]) shipX+=shipSpeed;
    if(mouseX!=null){ var d=mouseX-shipX; shipX+= Math.max(-shipSpeed*1.6,Math.min(shipSpeed*1.6,d*0.3)); }
    shipX=Math.max(shipW/2,Math.min(W-shipW/2,shipX));

    // combo decay
    if(comboTimer&gt;0){ comboTimer-=dt; if(comboTimer&lt;=0){ combo=1; } }

    // spawn
    spawnTimer-=dt;
    var interval=Math.max(420, 1200 - elapsed/30);
    if(spawnTimer&lt;=0){ spawnEnemy(); spawnTimer=interval; }

    // bullets
    for(var i=bullets.length-1;i&gt;=0;i--){
      bullets[i].y-=8;
      if(bullets[i].y&lt;-10) bullets.splice(i,1);
    }
    // enemies
    for(var j=enemies.length-1;j&gt;=0;j--){
      var e=enemies[j]; e.t0+=dt;
      if(e.type.move===&#x27;zigzag&#x27;){ e.x=e.base+Math.sin(e.t0/300)*40; e.y+=e.vy; }
      else if(e.type.move===&#x27;accel&#x27;){ e.vy+=0.006*dt/16; e.y+=e.vy; }
      else { e.y+=e.vy; }
      if(e.y-e.r&gt;H){ enemies.splice(j,1); loseLife(); continue; }
      // collision with bullets
      for(var b=bullets.length-1;b&gt;=0;b--){
        var dx=bullets[b].x-e.x, dy=bullets[b].y-e.y;
        if(dx*dx+dy*dy &lt; (e.r+4)*(e.r+4)){
          burst(e.x,e.y,e.type.color);
          score+=e.type.points*combo;
          combo++; comboTimer=1400;
          if(combo-1&gt;bestCombo) bestCombo=combo-1;
          beep(400+combo*40,0.08,&#x27;triangle&#x27;,0.08);
          bullets.splice(b,1); enemies.splice(j,1);
          scoreEl.textContent=score;
          comboEl.textContent=&#x27;x&#x27;+combo;
          bestEl.textContent=bestCombo;
          break;
        }
      }
    }
    // particles
    for(var p=particles.length-1;p&gt;=0;p--){
      var pa=particles[p];
      pa.x+=pa.vx; pa.y+=pa.vy; pa.vy+=0.05; pa.life-=0.03;
      if(pa.life&lt;=0) particles.splice(p,1);
    }
    // bg
    for(var k=0;k&lt;bubbles.length;k++){ var bu=bubbles[k]; bu.y-=bu.sp; if(bu.y&lt;-8){ bu.y=H+8; bu.x=Math.random()*W; } }
    for(var k=0;k&lt;biolum.length;k++){ var bl=biolum[k]; bl.y-=bl.sp; bl.ph+=0.05; if(bl.y&lt;-4){ bl.y=H+4; bl.x=Math.random()*W; } }

    if(shake&gt;0) shake*=0.85;
    if(flashAmt&gt;0) flashAmt*=0.88;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
    ctx.save(); ctx.translate(sx,sy);

    // biolum
    for(var i=0;i&lt;biolum.length;i++){ var bl=biolum[i]; var a=0.3+0.3*Math.sin(bl.ph);
      ctx.fillStyle=&#x27;rgba(120,255,220,&#x27;+a.toFixed(2)+&#x27;)&#x27;; ctx.beginPath(); ctx.arc(bl.x,bl.y,bl.r,0,6.28); ctx.fill(); }
    // bubbles
    for(var i=0;i&lt;bubbles.length;i++){ var bu=bubbles[i];
      ctx.strokeStyle=&#x27;rgba(150,220,255,&#x27;+bu.a.toFixed(2)+&#x27;)&#x27;; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r,0,6.28); ctx.stroke(); }
    // seaweed
    for(var i=0;i&lt;seaweed.length;i++){ var sw=seaweed[i]; sw.ph+=0.03;
      ctx.strokeStyle=sw.col; ctx.lineWidth=4; ctx.lineCap=&#x27;round&#x27;;
      ctx.shadowBlur=8; ctx.shadowColor=sw.col;
      ctx.beginPath(); ctx.moveTo(sw.x,H);
      for(var s=1;s&lt;=4;s++){ var yy=H-sw.h*s/4; var xx=sw.x+Math.sin(sw.ph+s*0.7)*8*s/4; ctx.lineTo(xx,yy); }
      ctx.stroke(); ctx.shadowBlur=0;
    }

    // bullets
    for(var i=0;i&lt;bullets.length;i++){ var b=bullets[i];
      ctx.shadowBlur=12; ctx.shadowColor=&#x27;#7dffea&#x27;;
      ctx.fillStyle=&#x27;#c8fff5&#x27;; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fill(); ctx.shadowBlur=0; }

    // enemies
    for(var i=0;i&lt;enemies.length;i++){ var e=enemies[i];
      ctx.shadowBlur=16; ctx.shadowColor=e.type.glow;
      ctx.fillStyle=e.type.color;
      if(e.type.name===&#x27;jelly&#x27;){
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r,Math.PI,0); ctx.lineTo(e.x+e.r,e.y+e.r*0.5); ctx.lineTo(e.x-e.r,e.y+e.r*0.5); ctx.closePath(); ctx.fill();
      } else if(e.type.name===&#x27;crab&#x27;){
        ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r,e.r*0.7,0,0,6.28); ctx.fill();
        ctx.fillRect(e.x-e.r-4,e.y-2,4,4); ctx.fillRect(e.x+e.r,e.y-2,4,4);
      } else {
        ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,6.28); ctx.fill();
        ctx.strokeStyle=e.type.glow; ctx.lineWidth=2;
        for(var a=0;a&lt;8;a++){ var ang=a*0.785; ctx.beginPath(); ctx.moveTo(e.x+Math.cos(ang)*e.r,e.y+Math.sin(ang)*e.r); ctx.lineTo(e.x+Math.cos(ang)*(e.r+5),e.y+Math.sin(ang)*(e.r+5)); ctx.stroke(); }
      }
      ctx.shadowBlur=0;
      ctx.fillStyle=&#x27;#00121f&#x27;; ctx.font=&#x27;bold 13px system-ui&#x27;; ctx.textAlign=&#x27;center&#x27;; ctx.textBaseline=&#x27;middle&#x27;;
      ctx.fillText(e.type.points, e.x, e.y+2);
    }

    // particles
    for(var i=0;i&lt;particles.length;i++){ var pa=particles[i];
      ctx.globalAlpha=Math.max(0,pa.life); ctx.fillStyle=pa.color;
      ctx.shadowBlur=8; ctx.shadowColor=pa.color;
      ctx.beginPath(); ctx.arc(pa.x,pa.y,pa.r,0,6.28); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;

    // ship (anglerfish)
    var sy2=H-shipH-8;
    var pulse=0.5+0.5*Math.sin(Date.now()/250);
    ctx.shadowBlur=16+pulse*10; ctx.shadowColor=&#x27;#ffe86b&#x27;;
    // lure
    ctx.fillStyle=&#x27;#ffe86b&#x27;; ctx.beginPath(); ctx.arc(shipX,sy2-8,4+pulse*2,0,6.28); ctx.fill();
    ctx.strokeStyle=&#x27;#ffe86b&#x27;; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(shipX,sy2); ctx.lineTo(shipX,sy2-8); ctx.stroke();
    ctx.shadowBlur=14; ctx.shadowColor=&#x27;#17e0ff&#x27;;
    ctx.fillStyle=&#x27;#1aa0e0&#x27;;
    ctx.beginPath(); ctx.ellipse(shipX,sy2+shipH/2,shipW/2,shipH/2,0,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#0a5f9e&#x27;; ctx.beginPath(); ctx.moveTo(shipX+shipW/2-4,sy2+shipH/2); ctx.lineTo(shipX+shipW/2+10,sy2+3); ctx.lineTo(shipX+shipW/2+10,sy2+shipH-3); ctx.closePath(); ctx.fill();
    ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(shipX-6,sy2+shipH/2-2,3,0,6.28); ctx.fill();
    ctx.fillStyle=&#x27;#012&#x27;; ctx.beginPath(); ctx.arc(shipX-6,sy2+shipH/2-2,1.4,0,6.28); ctx.fill();
    ctx.shadowBlur=0;

    ctx.restore();

    flash.style.background=&#x27;rgba(255,40,60,&#x27;+flashAmt.toFixed(2)+&#x27;)&#x27;;
  }

  var lastTime=0;
  function loop(ts){
    if(!running) return;
    if(!lastTime) lastTime=ts;
    var dt=Math.min(50, ts-lastTime); lastTime=ts;
    update(dt); draw();
    animId=requestAnimationFrame(loop);
  }

  function startGame(){
    running=true; gameOver=false;
    overlay.style.display=&#x27;none&#x27;;
    score=0; combo=1; comboTimer=0; bestCombo=0; lives=3;
    bullets=[]; enemies=[]; particles=[];
    shipX=W/2; elapsed=0; spawnTimer=0; shake=0; flashAmt=0; lastTime=0; lastShot=0;
    for(var k in keys) keys[k]=false; mouseX=null;
    scoreEl.textContent=&#x27;0&#x27;; comboEl.textContent=&#x27;x1&#x27;; bestEl.textContent=&#x27;0&#x27;;
    renderLives();
    initBackground();
    spawnEnemy();
    animId=requestAnimationFrame(loop);
  }
  function stopGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
    else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) fire(); e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;,function(e){
    if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
  });
  canvas.addEventListener(&#x27;mousemove&#x27;,function(e){
    if(!running) return;
    var r=canvas.getBoundingClientRect();
    mouseX=(e.clientX-r.left)*(W/r.width);
  });
  canvas.addEventListener(&#x27;mousedown&#x27;,function(e){ if(running) fire(); });

  window.addEventListener(&#x27;message&#x27;,function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  // initial static frame
  initBackground(); renderLives(); draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined

&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
