&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05010f; color: #cfe8ff; overflow: hidden; }

       color: #7 df; background: linear-gradient(90deg,#4ff,#a6f,#4ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
       text-shadow: 0 0 12px rgba(120,200,255,.4); }

  .shieldwrap { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #ffb3d9; }

  .shieldfill { height: 100%; width: 100%; background: linear-gradient(90deg,#f36,#fa3); transition: width .15s; }

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;✦ COSMIC DEFENDER ✦&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move your ship with the mouse or arrow keys and press &lt;strong&gt;Space&lt;/strong&gt; to fire lasers at the aliens. Keep the energy orb bouncing off your ship — it destroys aliens too, but every time it hits the floor your Shield shrinks!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;SCORE &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;shieldwrap&quot;&gt;SHIELD &lt;div class=&quot;shieldbar&quot;&gt;&lt;div class=&quot;shieldfill&quot; id=&quot;shield&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;canvas id=&quot;cv&quot; width=&quot;640&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
  window.addEventListener(t, function(e) {
    try { window.parent.postMessage({ type: &#x27;game_input&#x27;, kind: t, key: e.key || null }, &#x27;*&#x27;); } catch (_) {}
  }, true);
});

var cv = document.getElementById(&#x27;cv&#x27;), ctx = cv.getContext(&#x27;2d&#x27;);
var W = 640, H = 440;
var scoreEl = document.getElementById(&#x27;score&#x27;), shieldEl = document.getElementById(&#x27;shield&#x27;);

var running = false, animId = null;
var keys = {};
var score = 0;

var PADDLE_MAX = 110, PADDLE_MIN = 40, PADDLE_H = 14, PADDLE_BOTTOM = 12;
var paddle = { w: PADDLE_MAX, x: (W-PADDLE_MAX)/2, speed: 7 };
var mouseX = null;

var ball, trail;
var lasers, aliens, particles, flash;
var spawnTimer = 0, waveGap = 90;
var starLayers;

// ---- Audio ----
var AC = null;
function beep(freq, dur, type, vol) {
  try {
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    g.gain.value = vol||0.08;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.stop(AC.currentTime + dur);
  } catch(_) {}
}

function initStars() {
  starLayers = [];
  var speeds = [0.15, 0.35, 0.7];
  var counts = [40, 30, 20];
  for (var l=0; l&lt;3; l++) {
    var arr = [];
    for (var i=0;i&lt;counts[l];i++) arr.push({ x: Math.random()*W, y: Math.random()*H, r: 0.5+l*0.6, s: speeds[l] });
    starLayers.push(arr);
  }
}

function resetBall() {
  ball = { x: W/2, y: 80, r: 9, vx: (Math.random()&lt;0.5?-1:1)*3.2, vy: 3.2 };
  trail = [];
}

function newGame() {
  score = 0; scoreEl.textContent = &#x27;0&#x27;;
  paddle.w = PADDLE_MAX; paddle.x = (W-paddle.w)/2;
  mouseX = null;
  lasers = []; aliens = []; particles = []; flash = 0;
  spawnTimer = 0;
  resetBall();
  initStars();
  updateShield();
}

function updateShield() {
  var pct = (paddle.w - PADDLE_MIN) / (PADDLE_MAX - PADDLE_MIN) * 100;
  shieldEl.style.width = Math.max(0,pct) + &#x27;%&#x27;;
}

var alienTypes = {
  small:  { r: 12, hp: 1, pts: 10, color: &#x27;#4ff&#x27;, speed: 0.9 },
  medium: { r: 16, hp: 1, pts: 20, color: &#x27;#fd5&#x27;, speed: 0.65 },
  large:  { r: 22, hp: 2, pts: 50, color: &#x27;#f6a&#x27;, speed: 0.45 }
};

function spawnWave() {
  var n = 3 + Math.floor(Math.random()*3);
  for (var i=0;i&lt;n;i++) {
    var roll = Math.random();
    var type = roll &lt; 0.45 ? &#x27;small&#x27; : roll &lt; 0.8 ? &#x27;medium&#x27; : &#x27;large&#x27;;
    var t = alienTypes[type];
    aliens.push({
      type: type, x: 40 + Math.random()*(W-80), y: -30 - Math.random()*40,
      r: t.r, hp: t.hp, maxhp: t.hp, pts: t.pts, color: t.color,
      speed: t.speed, wob: Math.random()*Math.PI*2
    });
  }
}

function burst(x,y,color,count) {
  for (var i=0;i&lt;(count||12);i++) {
    var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
    particles.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color:color });
  }
}

function hitAlien(al, dmg, byBall) {
  al.hp -= dmg;
  if (al.hp &lt;= 0) {
    burst(al.x, al.y, al.color, al.type===&#x27;large&#x27;?18:12);
    score += byBall ? al.pts*2 : al.pts;
    scoreEl.textContent = score;
    flash = Math.min(1, flash + 0.4);
    beep(byBall?520:660, 0.12, &#x27;square&#x27;, 0.09);
    return true;
  } else {
    burst(al.x, al.y, al.color, 5);
    beep(220, 0.06, &#x27;sawtooth&#x27;, 0.06);
    return false;
  }
}

function tick() {
  if (!running) return;

  // paddle control
  if (mouseX !== null) {
    var target = mouseX - paddle.w/2;
    paddle.x += (target - paddle.x) * 0.4;
  }
  if (keys[&#x27;ArrowLeft&#x27;]) paddle.x -= paddle.speed;
  if (keys[&#x27;ArrowRight&#x27;]) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  var paddleTop = H - PADDLE_BOTTOM - PADDLE_H;

  // ball
  trail.push({x:ball.x, y:ball.y});
  if (trail.length &gt; 14) trail.shift();
  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x - ball.r &lt;= 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r &gt;= W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r &lt;= 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  // ball-paddle
  if (ball.vy &gt; 0 &amp;&amp; ball.y + ball.r &gt;= paddleTop &amp;&amp; ball.y + ball.r &lt;= paddleTop + PADDLE_H + 8 &amp;&amp;
      ball.x &gt;= paddle.x - ball.r &amp;&amp; ball.x &lt;= paddle.x + paddle.w + ball.r) {
    ball.vy = -Math.abs(ball.vy);
    ball.y = paddleTop - ball.r;
    var hitpos = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.vx += hitpos * 1.5;
    ball.vx = Math.max(-5, Math.min(5, ball.vx));
    burst(ball.x, ball.y, &#x27;#4ff&#x27;, 6);
    beep(440, 0.07, &#x27;triangle&#x27;, 0.07);
  }

  // ball floor -&gt; shrink
  if (ball.y - ball.r &gt; H) {
    paddle.w = Math.max(PADDLE_MIN, paddle.w - 12);
    updateShield();
    flash = Math.min(1, flash + 0.5);
    beep(120, 0.25, &#x27;sawtooth&#x27;, 0.1);
    resetBall();
  }

  // lasers
  for (var i=lasers.length-1;i&gt;=0;i--) {
    lasers[i].y -= 9;
    if (lasers[i].y &lt; -10) lasers.splice(i,1);
  }

  // aliens
  for (var a=aliens.length-1;a&gt;=0;a--) {
    var al = aliens[a];
    al.wob += 0.05;
    al.y += al.speed;
    al.x += Math.sin(al.wob)*0.6;

    // ball collision
    var dx = al.x-ball.x, dy = al.y-ball.y;
    if (dx*dx+dy*dy &lt; (al.r+ball.r)*(al.r+ball.r)) {
      if (hitAlien(al, 99, true)) { aliens.splice(a,1); continue; }
    }
    // laser collision
    for (var L=lasers.length-1;L&gt;=0;L--) {
      var lx = lasers[L].x - al.x, ly = lasers[L].y - al.y;
      if (lx*lx+ly*ly &lt; (al.r+4)*(al.r+4)) {
        lasers.splice(L,1);
        if (hitAlien(al, 1, false)) { aliens.splice(a,1); }
        break;
      }
    }
    if (al &amp;&amp; al.y - al.r &gt; H) aliens.splice(a,1);
  }

  // spawn
  spawnTimer++;
  if (spawnTimer &gt;= waveGap) { spawnTimer = 0; spawnWave(); }

  // particles
  for (var p=particles.length-1;p&gt;=0;p--) {
    var pt = particles[p];
    pt.x += pt.vx; pt.y += pt.vy; pt.vx*=0.94; pt.vy*=0.94; pt.life -= 0.03;
    if (pt.life &lt;= 0) particles.splice(p,1);
  }

  // stars
  for (var l=0;l&lt;starLayers.length;l++) {
    var arr = starLayers[l];
    for (var s=0;s&lt;arr.length;s++) {
      arr[s].y += arr[s].s;
      if (arr[s].y &gt; H) { arr[s].y = 0; arr[s].x = Math.random()*W; }
    }
  }

  if (flash &gt; 0) flash -= 0.06;
  draw();
  animId = requestAnimationFrame(tick);
}

function draw() {
  ctx.fillStyle = &#x27;#05010f&#x27;;
  ctx.fillRect(0,0,W,H);

  // stars
  for (var l=0;l&lt;starLayers.length;l++) {
    var arr = starLayers[l];
    ctx.fillStyle = [&#x27;#334&#x27;,&#x27;#78a&#x27;,&#x27;#cdf&#x27;][l];
    for (var s=0;s&lt;arr.length;s++) {
      ctx.beginPath(); ctx.arc(arr[s].x, arr[s].y, arr[s].r, 0, Math.PI*2); ctx.fill();
    }
  }

  // aliens
  for (var a=0;a&lt;aliens.length;a++) drawAlien(aliens[a]);

  // lasers
  for (var i=0;i&lt;lasers.length;i++) {
    var la = lasers[i];
    ctx.shadowColor = &#x27;#7fffd4&#x27;; ctx.shadowBlur = 8;
    ctx.fillStyle = &#x27;#aef&#x27;;
    ctx.fillRect(la.x-2, la.y-8, 4, 14);
    ctx.shadowBlur = 0;
  }

  // ball trail
  for (var t=0;t&lt;trail.length;t++) {
    var alpha = t/trail.length * 0.5;
    ctx.beginPath();
    ctx.fillStyle = &#x27;rgba(120,220,255,&#x27;+alpha+&#x27;)&#x27;;
    ctx.arc(trail[t].x, trail[t].y, ball.r * (t/trail.length), 0, Math.PI*2);
    ctx.fill();
  }
  // ball
  var pulse = 1 + Math.sin(Date.now()/120)*0.15;
  ctx.shadowColor = &#x27;#5cf&#x27;; ctx.shadowBlur = 18;
  var grd = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, ball.r*pulse);
  grd.addColorStop(0,&#x27;#fff&#x27;); grd.addColorStop(0.5,&#x27;#6df&#x27;); grd.addColorStop(1,&#x27;#25a&#x27;);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r*pulse, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // particles
  for (var p=0;p&lt;particles.length;p++) {
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0,pt.life);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // paddle (ship)
  var px = paddle.x, py = H - PADDLE_BOTTOM - PADDLE_H, pw = paddle.w;
  ctx.shadowColor = &#x27;#4ff&#x27;; ctx.shadowBlur = 14;
  ctx.fillStyle = &#x27;#1b3a5a&#x27;;
  roundRect(px, py, pw, PADDLE_H, 6); ctx.fill();
  ctx.fillStyle = &#x27;#5df&#x27;;
  roundRect(px+4, py+3, pw-8, 4, 2); ctx.fill();
  // cockpit
  ctx.fillStyle = &#x27;#aef&#x27;;
  ctx.beginPath(); ctx.arc(px+pw/2, py+2, 5, Math.PI, 0); ctx.fill();
  ctx.shadowBlur = 0;

  // flash
  if (flash &gt; 0) {
    ctx.fillStyle = &#x27;rgba(255,255,255,&#x27;+(flash*0.25)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }
}

function drawAlien(al) {
  ctx.save();
  ctx.translate(al.x, al.y);
  ctx.shadowColor = al.color; ctx.shadowBlur = 12;
  // body
  ctx.fillStyle = al.color;
  ctx.beginPath();
  ctx.arc(0, 0, al.r, Math.PI, 0);
  ctx.lineTo(al.r, al.r*0.4);
  // wavy bottom
  var segs = 4;
  for (var i=segs;i&gt;=0;i--) {
    var xx = -al.r + (2*al.r)*(i/segs);
    var yy = al.r*0.4 + (i%2===0 ? 0 : al.r*0.35);
    ctx.lineTo(xx, yy);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  // eyes
  ctx.fillStyle = &#x27;#fff&#x27;;
  ctx.beginPath(); ctx.arc(-al.r*0.35, -al.r*0.1, al.r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(al.r*0.35, -al.r*0.1, al.r*0.22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = &#x27;#111&#x27;;
  ctx.beginPath(); ctx.arc(-al.r*0.35, -al.r*0.1, al.r*0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(al.r*0.35, -al.r*0.1, al.r*0.1, 0, Math.PI*2); ctx.fill();
  // armor ring for damaged large
  if (al.maxhp &gt; 1 &amp;&amp; al.hp &lt; al.maxhp) {
    ctx.strokeStyle = &#x27;#f33&#x27;; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0,al.r+3,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function fire() {
  if (!running) return;
  lasers.push({ x: paddle.x + paddle.w/2, y: H - PADDLE_BOTTOM - PADDLE_H - 4 });
  beep(880, 0.05, &#x27;square&#x27;, 0.05);
}

window.addEventListener(&#x27;keydown&#x27;, function(e) {
  if ([&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;,&#x27; &#x27;,&#x27;Spacebar&#x27;].indexOf(e.key) &gt;= 0) e.preventDefault();
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = true;
  if ((e.key === &#x27; &#x27; || e.key === &#x27;Spacebar&#x27;) &amp;&amp; !e.repeat) fire();
});
window.addEventListener(&#x27;keyup&#x27;, function(e) {
  if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
});
cv.addEventListener(&#x27;mousemove&#x27;, function(e) {
  var rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
cv.addEventListener(&#x27;mousedown&#x27;, function() { fire(); });

window.addEventListener(&#x27;message&#x27;, function(e) {
  if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
  if (e.data.type === &#x27;wd_start&#x27;) {
    if (running) return;
    newGame();
    spawnWave();
    running = true;
    animId = requestAnimationFrame(tick);
  } else if (e.data.type === &#x27;wd_stop&#x27;) {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }
});

// initial static render
newGame();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.

<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;

    if (!lastW || !lastH) return;

    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);

    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
