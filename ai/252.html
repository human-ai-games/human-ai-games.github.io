<html lang="en">

<title>🐸 Space Frog</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;
    border: 1px solid #ccc; border-radius: 6px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }
  .controls button:hover:not(:disabled) { background: #195fcb; }
  .controls button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Space Frog</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #e8e8ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#7df9ff,#c77dff,#ff9e64); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(140,120,255,.4); }
  .instructions { font-size: 16px; color: #b9b9e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .score { font-size: 20px; color: #7df9ff; margin: 0; font-weight: 700; text-shadow: 0 0 10px rgba(125,249,255,.6); }
  .field { position: relative; width: 600px; height: 432px; flex-shrink: 0; margin: 0; border-radius: 10px; overflow: hidden;
           box-shadow: 0 0 30px rgba(120,90,255,.35), inset 0 0 40px rgba(0,0,0,.6); background: #05030f; }
  .lane { position: absolute; left: 0; right: 0; overflow: hidden; }
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: .8; }
  .hero { position: absolute; display: flex; align-items: center; justify-content: center; z-index: 10;
          transition: left .09s ease, top .09s ease; font-size: 30px; will-change: transform; }
  .obstacle { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 26px; z-index: 5; }
  .rocket { position: absolute; z-index: 6; font-size: 30px; display:flex; align-items:center; justify-content:center; }
  .trail { position: absolute; border-radius: 50%; background: radial-gradient(circle,#7df9ff,rgba(125,249,255,0)); z-index: 4;
           pointer-events: none; animation: fade .5s forwards; }
  @keyframes fade { from { opacity:.7; transform: scale(1);} to { opacity:0; transform: scale(.3);} }
  .burst { position: absolute; z-index: 20; font-size: 40px; pointer-events:none; animation: burst .6s forwards; }
  @keyframes burst { 0%{transform:scale(.2) rotate(0);opacity:1;} 100%{transform:scale(2) rotate(90deg);opacity:0;} }
  .overlay { position: absolute; inset:0; z-index: 30; display:none; flex-direction:column; align-items:center; justify-content:center;
             background: rgba(5,3,15,.72); backdrop-filter: blur(2px); text-align:center; }
  .overlay.show { display:flex; }
  .overlay .big { font-size:34px; font-weight:900; color:#ff5e9e; text-shadow:0 0 20px #ff2d78; }
  .overlay .sub { font-size:20px; color:#7df9ff; margin-top:8px; text-shadow:0 0 12px #7df9ff; }
  .overlay .hint { font-size:15px; color:#c9c9ef; margin-top:12px; }
  .controls { display:flex; gap:6px; margin:0; }
  .key { border:1px solid #4a4a80; background:#12102a; color:#b9b9e0; border-radius:6px; padding:3px 9px; font-size:14px; opacity:.75; }
  .laser { width:60px; height:6px; border-radius:3px; background:linear-gradient(90deg,rgba(255,80,80,0),#ff4d4d,rgba(255,80,80,0));
           box-shadow:0 0 10px #ff4d4d; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐸 Space Frog&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop with the arrow keys (or swipe) to dodge the lasers, UFOs, comets and debris. Reach the rocket 🚀 at the top to score, then bounce back down — one hit ends the round!&lt;/p&gt;
  &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;big&quot;&gt;💥 WIPE-OUT!&lt;/div&gt;
      &lt;div class=&quot;sub&quot; id=&quot;finalScore&quot;&gt;Score: 0&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to launch again.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;&lt;span class=&quot;key&quot;&gt;←&lt;/span&gt;&lt;span class=&quot;key&quot;&gt;↑ jump&lt;/span&gt;&lt;span class=&quot;key&quot;&gt;↓&lt;/span&gt;&lt;span class=&quot;key&quot;&gt;→&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 48, COLS = 12, LANES = 7, ROWS = LANES + 2;
  var FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
  var HERO = 30, OBS_H = 34;
  var running = false, animId = null;
  var hero = { col: 6, row: ROWS - 1 };
  var lanes = [], score = 0, speedMul = 1;
  var field = document.getElementById(&#x27;field&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var heroEl = null, rocketEl = null, audioCtx = null;

  // lane themes: nebula colors + traffic type
  var THEMES = [
    { c1:&#x27;#3a0d5e&#x27;, c2:&#x27;#1a0640&#x27;, emoji:&#x27;🛸&#x27;, w:44 },
    { c1:&#x27;#062a4a&#x27;, c2:&#x27;#04162a&#x27;, emoji:&#x27;laser&#x27;, w:60 },
    { c1:&#x27;#5e2a0d&#x27;, c2:&#x27;#331304&#x27;, emoji:&#x27;☄️&#x27;, w:40 },
    { c1:&#x27;#0d4a3a&#x27;, c2:&#x27;#04241c&#x27;, emoji:&#x27;🛰️&#x27;, w:44 },
    { c1:&#x27;#4a0d3a&#x27;, c2:&#x27;#280420&#x27;, emoji:&#x27;🌠&#x27;, w:40 },
    { c1:&#x27;#0d1f5e&#x27;, c2:&#x27;#040d33&#x27;, emoji:&#x27;🛸&#x27;, w:44 },
    { c1:&#x27;#5e4a0d&#x27;, c2:&#x27;#332804&#x27;, emoji:&#x27;⚙️&#x27;, w:40 }
  ];

  function audio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function beep(freq, dur, type, vol){
    var a = audio(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||&#x27;square&#x27;; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function hopSound(){ var a=audio(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;sine&#x27;; o.frequency.setValueAtTime(300,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(620,a.currentTime+0.12);
    g.gain.setValueAtTime(0.18,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.15);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.15);
  }
  function chime(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,0.25,&#x27;triangle&#x27;,0.14); }, i*70); }); }
  function crash(){ var a=audio(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=&#x27;sawtooth&#x27;; o.frequency.setValueAtTime(400,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(50,a.currentTime+0.5);
    g.gain.setValueAtTime(0.25,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.5);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.5);
  }

  function buildField(){
    field.innerHTML = &#x27;&#x27;;
    field.appendChild(overlay);
    // lanes with nebula backgrounds
    for(var r=0;r&lt;ROWS;r++){
      var lane = document.createElement(&#x27;div&#x27;);
      lane.className=&#x27;lane&#x27;;
      lane.style.top=(r*CELL)+&#x27;px&#x27;; lane.style.height=CELL+&#x27;px&#x27;;
      if(r===0){ lane.style.background=&#x27;linear-gradient(180deg,#0a2a1a,#04150c)&#x27;; } // rocket platform
      else if(r===ROWS-1){ lane.style.background=&#x27;linear-gradient(180deg,#1a1a3a,#0a0a20)&#x27;; } // start platform
      else { var t=THEMES[r-1]; lane.style.background=&#x27;linear-gradient(180deg,&#x27;+t.c1+&#x27;,&#x27;+t.c2+&#x27;)&#x27;; }
      field.insertBefore(lane, overlay);
    }
    // stars
    for(var s=0;s&lt;50;s++){
      var st=document.createElement(&#x27;div&#x27;); st.className=&#x27;star&#x27;;
      var sz=Math.random()*2+1;
      st.style.width=sz+&#x27;px&#x27;; st.style.height=sz+&#x27;px&#x27;;
      st.style.left=(Math.random()*FIELD_W)+&#x27;px&#x27;; st.style.top=(Math.random()*FIELD_H)+&#x27;px&#x27;;
      st.style.opacity=(Math.random()*0.6+0.3);
      field.insertBefore(st, overlay);
    }
  }

  function buildLanes(){
    lanes = [];
    for(var i=0;i&lt;LANES;i++){
      var laneRow=i+1, t=THEMES[i];
      var y=laneRow*CELL+(CELL-OBS_H)/2;
      var dir=(i%2===0)?1:-1;
      var speed=(0.6+(i%3)*0.25)*speedMul;
      var obstacles=[];
      var count=2+(i%2);
      var gap=FIELD_W/count;
      for(var j=0;j&lt;count;j++){
        var x=j*gap+(i*30)%gap;
        var el=document.createElement(&#x27;div&#x27;);
        if(t.emoji===&#x27;laser&#x27;){ el.className=&#x27;obstacle&#x27;; var lz=document.createElement(&#x27;div&#x27;); lz.className=&#x27;laser&#x27;; el.appendChild(lz);
          el.style.width=t.w+&#x27;px&#x27;; el.style.height=OBS_H+&#x27;px&#x27;; }
        else { el.className=&#x27;obstacle&#x27;; el.textContent=t.emoji; el.style.width=t.w+&#x27;px&#x27;; el.style.height=OBS_H+&#x27;px&#x27;; }
        el.style.top=(laneRow*CELL)+&#x27;px&#x27;; el.style.left=x+&#x27;px&#x27;;
        el.style.transition=&#x27;none&#x27;;
        field.insertBefore(el, overlay);
        obstacles.push({x:x,el:el,w:t.w});
      }
      lanes.push({row:laneRow,dir:dir,speed:speed,obstacles:obstacles});
    }
  }

  function makeHero(){
    heroEl=document.createElement(&#x27;div&#x27;); heroEl.className=&#x27;hero&#x27;; heroEl.textContent=&#x27;🐸&#x27;;
    heroEl.style.width=CELL+&#x27;px&#x27;; heroEl.style.height=CELL+&#x27;px&#x27;;
    field.insertBefore(heroEl, overlay);
  }
  function makeRocket(){
    rocketEl=document.createElement(&#x27;div&#x27;); rocketEl.className=&#x27;rocket&#x27;; rocketEl.textContent=&#x27;🚀&#x27;;
    rocketEl.style.width=CELL+&#x27;px&#x27;; rocketEl.style.height=CELL+&#x27;px&#x27;;
    rocketEl.style.top=&#x27;0px&#x27;; rocketEl.style.left=((COLS/2)*CELL - CELL/2)+&#x27;px&#x27;;
    field.insertBefore(rocketEl, overlay);
  }
  function paintHero(){
    heroEl.style.left=(hero.col*CELL)+&#x27;px&#x27;; heroEl.style.top=(hero.row*CELL)+&#x27;px&#x27;;
  }
  function resetHero(){ hero.col=6; hero.row=ROWS-1; paintHero(); }

  function trail(){
    var tr=document.createElement(&#x27;div&#x27;); tr.className=&#x27;trail&#x27;;
    tr.style.width=&#x27;34px&#x27;; tr.style.height=&#x27;34px&#x27;;
    tr.style.left=(hero.col*CELL+7)+&#x27;px&#x27;; tr.style.top=(hero.row*CELL+7)+&#x27;px&#x27;;
    field.insertBefore(tr, overlay);
    setTimeout(function(){ if(tr.parentNode) tr.parentNode.removeChild(tr); }, 500);
  }

  function tick(){
    if(!running) return;
    for(var i=0;i&lt;lanes.length;i++){
      var lane=lanes[i];
      for(var j=0;j&lt;lane.obstacles.length;j++){
        var o=lane.obstacles[j];
        o.x+=lane.dir*lane.speed;
        if(lane.dir&gt;0 &amp;&amp; o.x&gt;FIELD_W) o.x=-o.w;
        else if(lane.dir&lt;0 &amp;&amp; o.x+o.w&lt;0) o.x=FIELD_W;
        o.el.style.left=o.x+&#x27;px&#x27;;
      }
    }
    var laneIdx=hero.row-1;
    if(laneIdx&gt;=0 &amp;&amp; laneIdx&lt;LANES){
      var hx=hero.col*CELL+9, hw=HERO;
      var lane2=lanes[laneIdx];
      for(var k=0;k&lt;lane2.obstacles.length;k++){
        var o2=lane2.obstacles[k];
        if(hx &lt; o2.x+o2.w &amp;&amp; hx+hw &gt; o2.x){ endGame(); return; }
      }
    }
    animId=requestAnimationFrame(tick);
  }

  function move(dc,dr){
    if(!running) return;
    trail();
    hero.col=Math.max(0,Math.min(COLS-1,hero.col+dc));
    hero.row=Math.max(0,Math.min(ROWS-1,hero.row+dr));
    paintHero();
    hopSound();
    heroEl.style.transform=&#x27;scale(1.25)&#x27;;
    setTimeout(function(){ if(heroEl) heroEl.style.transform=&#x27;scale(1)&#x27;; },90);
    if(hero.row===0){ scorePoint(); }
  }

  function scorePoint(){
    score+=1; scoreEl.textContent=score; chime();
    // starburst
    var b=document.createElement(&#x27;div&#x27;); b.className=&#x27;burst&#x27;; b.textContent=&#x27;🌟&#x27;;
    b.style.left=(hero.col*CELL)+&#x27;px&#x27;; b.style.top=&#x27;0px&#x27;;
    field.insertBefore(b, overlay);
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },600);
    speedMul=1+score*0.12;
    // apply new speed
    for(var i=0;i&lt;lanes.length;i++){
      lanes[i].speed=(0.6+(i%3)*0.25)*speedMul;
    }
    resetHero();
  }

  function endGame(){
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
    crash();
    // spinning wipeout
    heroEl.style.transition=&#x27;transform .5s ease&#x27;;
    heroEl.style.transform=&#x27;rotate(720deg) scale(.2)&#x27;;
    var ex=document.createElement(&#x27;div&#x27;); ex.className=&#x27;burst&#x27;; ex.textContent=&#x27;💥&#x27;;
    ex.style.left=(hero.col*CELL)+&#x27;px&#x27;; ex.style.top=(hero.row*CELL)+&#x27;px&#x27;;
    field.insertBefore(ex, overlay);
    setTimeout(function(){
      finalScoreEl.textContent=&#x27;Score: &#x27;+score;
      overlay.classList.add(&#x27;show&#x27;);
    }, 500);
  }

  function startGame(){
    if(running) return;
    score=0; speedMul=1; scoreEl.textContent=&#x27;0&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    buildField(); makeRocket(); buildLanes(); makeHero(); resetHero();
    running=true;
    animId=requestAnimationFrame(tick);
  }
  function stopGame(){
    if(!running) return;
    running=false;
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1,0); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ move(0,-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ move(0,1); e.preventDefault(); }
  });

  // swipe support
  var tsx=0, tsy=0;
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ var t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  field.addEventListener(&#x27;touchend&#x27;, function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)&gt;Math.abs(dy)){ if(dx&gt;20) move(1,0); else if(dx&lt;-20) move(-1,0); }
    else { if(dy&gt;20) move(0,1); else if(dy&lt;-20) move(0,-1); }
  }, {passive:true});

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial paint
  buildField(); makeRocket(); buildLanes(); makeHero(); paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;

<script>
