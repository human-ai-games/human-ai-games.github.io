<!doctype html>
<html lang="en">
<head>

<title>🐸 Froggy in Space</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f5f5f5; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px; min-height: 100vh; box-sizing: border-box; }
  .header { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
  .header a { color: #1f6feb; }
  iframe { width: 720px; max-width: 100%; height: 640px; max-height: 80vh;

    box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .controls { margin-top: 14px; display: flex; gap: 10px; }
  .controls button { padding: 9px 22px; background: #1f6feb; color: white; border: none;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; }

</style>
</head>
<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐸 Froggy in Space</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05030f; color: #eee; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .topbar { width: 620px; display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 1px;
       background: linear-gradient(90deg,#7cf,#c9f,#fc7); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .instructions { font-size: 16px; color: #9ab; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .scorebox { text-align: right; }
  .scorelabel { font-size: 12px; color: #8af; letter-spacing: 1px; }
  .score { font-size: 30px; font-weight: 800; color: #7fffd4; display: inline-block; transition: transform .12s; }
  .score.pulse { transform: scale(1.5); }
  .combo { font-size: 14px; color: #fc7; height: 16px; }
  .field { position: relative; width: 620px; height: 480px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
           box-shadow: 0 0 30px rgba(120,180,255,.25) inset; border: 1px solid #223; background: #060314; }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .starlayer { position: absolute; left:0; width: 100%; }
  .lane { position: absolute; left: 0; width: 100%; box-sizing: border-box; }
  .gridline { position: absolute; left: 0; right: 0; height: 1px; }
  .obstacle { position: absolute; font-size: 30px; line-height: 1; text-align: center; will-change: transform; filter: drop-shadow(0 0 6px currentColor); }
  .safezone { position: absolute; left: 0; width: 100%; background: rgba(60,255,140,.10); box-shadow: 0 0 18px rgba(60,255,140,.35) inset; }
  .hero { position: absolute; font-size: 30px; line-height: 1; text-align: center; z-index: 5; will-change: transform; transition: transform .08s; }
  .hero.hop { animation: hop .18s ease; }
  @keyframes hop { 0%{transform:scale(1)} 40%{transform:scale(1.4,.75)} 100%{transform:scale(1)} }
  .hero.hit { animation: hit .3s steps(1) 3; }
  @keyframes hit { 0%{opacity:1} 50%{opacity:0} }
  .particle { position: absolute; font-size: 16px; pointer-events: none; z-index: 6; }
  .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 8; }
  .flash.on { animation: flash .4s ease; }
  @keyframes flash { 0%{opacity:.7} 100%{opacity:0} }
  .overlay { position: absolute; inset: 0; background: rgba(3,1,12,.82); display: none; z-index: 10;
             flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: 2px;
                background: linear-gradient(90deg,#f66,#fc7,#f66); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(255,120,80,.5); }
  .overlay p { margin: 0; font-size: 20px; color: #cde; }
  .overlay small { color: #789; font-size: 14px; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div&gt;
      &lt;h1&gt;🐸 Froggy in Space&lt;/h1&gt;
    &lt;/div&gt;
    &lt;div class=&quot;scorebox&quot;&gt;
      &lt;div class=&quot;scorelabel&quot;&gt;SCORE&lt;/div&gt;
      &lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;
      &lt;div class=&quot;combo&quot; id=&quot;combo&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;instructions&quot;&gt;Hop your space-frog upward with the arrow keys or WASD, dodging alien cruisers, meteors and energy beams. Reach the green warp zone at the top to score — cross fast for combos, and use the Start/Restart button below.&lt;/p&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;flash&quot; id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;h2&gt;LOST IN SPACE&lt;/h2&gt;
      &lt;p id=&quot;finalscore&quot;&gt;Score: 0&lt;/p&gt;
      &lt;small&gt;Press Start below to warp back in&lt;/small&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 40;
  var COLS = 15;                 // 620 / 40 ~ 15
  var LANES = 8;
  var ROWS = LANES + 2;          // top safe + lanes + bottom safe
  var FIELD_W = 620, FIELD_H = 480;
  // recompute cell to fit exactly
  CELL = FIELD_W / COLS;         // ~41.3
  var ROWH = FIELD_H / ROWS;     // 48

  var field = document.getElementById(&#x27;field&#x27;);
  var starsBox = document.getElementById(&#x27;stars&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalscore&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);

  var running = false, animId = null;
  var hero = { col: 7, row: ROWS - 1 };
  var heroEl = null;
  var lanes = [];
  var score = 0, crossings = 0;
  var lastCrossTime = 0, combo = 1;
  var starLayers = [];

  // Lane theme definitions (cycled). emoji + glow color + base speed range
  var THEMES = [
    { emoji: &#x27;🛸&#x27;, color: &#x27;#b98cff&#x27;, speed: 0.9 },   // purple alien cruisers
    { emoji: &#x27;☄️&#x27;, color: &#x27;#ff9a4d&#x27;, speed: 1.4 },   // orange meteors
    { emoji: &#x27;⚡&#x27;, color: &#x27;#4dffe0&#x27;, speed: 2.1 },    // teal energy beams
    { emoji: &#x27;🚀&#x27;, color: &#x27;#ff6ba6&#x27;, speed: 1.1 },    // pink rockets
    { emoji: &#x27;🌟&#x27;, color: &#x27;#ffe14d&#x27;, speed: 1.7 },    // yellow stars
  ];

  // ---- audio ----
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  function buildStars() {
    starsBox.innerHTML = &#x27;&#x27;;
    starLayers = [];
    var layerDefs = [ {n:40, size:1, speed:0.15, op:0.5}, {n:25, size:2, speed:0.35, op:0.8} ];
    for (var l = 0; l &lt; layerDefs.length; l++) {
      var def = layerDefs[l];
      var layer = document.createElement(&#x27;div&#x27;);
      layer.className = &#x27;starlayer&#x27;;
      layer.style.height = (FIELD_H * 2) + &#x27;px&#x27;;
      layer.style.top = &#x27;0px&#x27;;
      var html = &#x27;&#x27;;
      for (var i = 0; i &lt; def.n; i++) {
        var x = Math.random() * FIELD_W;
        var y = Math.random() * FIELD_H * 2;
        html += &#x27;&lt;div style=&quot;position:absolute;left:&#x27; + x.toFixed(1) + &#x27;px;top:&#x27; + y.toFixed(1) +
                &#x27;px;width:&#x27; + def.size + &#x27;px;height:&#x27; + def.size + &#x27;px;border-radius:50%;background:#cfe;opacity:&#x27; + def.op + &#x27;&quot;&gt;&lt;/div&gt;&#x27;;
      }
      layer.innerHTML = html;
      starsBox.appendChild(layer);
      starLayers.push({ el: layer, y: 0, speed: def.speed });
    }
  }

  function clearField() {
    // remove obstacles, gridlines, safezones, hero, particles but keep stars/flash/overlay
    var toRemove = field.querySelectorAll(&#x27;.obstacle,.gridline,.safezone,.hero,.particle,.lane&#x27;);
    toRemove.forEach(function (n) { n.remove(); });
    lanes = [];
    heroEl = null;
  }

  function buildLanes(obstaclesPerLane) {
    for (var i = 0; i &lt; LANES; i++) {
      var laneRow = i + 1;
      var top = laneRow * ROWH;
      var theme = THEMES[i % THEMES.length];
      // lane background tint
      var laneBg = document.createElement(&#x27;div&#x27;);
      laneBg.className = &#x27;lane&#x27;;
      laneBg.style.top = top + &#x27;px&#x27;;
      laneBg.style.height = ROWH + &#x27;px&#x27;;
      var c = theme.color;
      laneBg.style.background = &#x27;linear-gradient(90deg, transparent, &#x27; + hexA(c,0.06) + &#x27;, transparent)&#x27;;
      field.insertBefore(laneBg, flashEl);

      var dir = (i % 2 === 0) ? 1 : -1;
      var speed = theme.speed * (0.85 + Math.random() * 0.4);
      var obstacles = [];
      var count = obstaclesPerLane;
      var gap = FIELD_W / count;
      for (var j = 0; j &lt; count; j++) {
        var x = j * gap + Math.random() * (gap * 0.4);
        var el = document.createElement(&#x27;div&#x27;);
        el.className = &#x27;obstacle&#x27;;
        el.textContent = theme.emoji;
        el.style.color = theme.color;
        el.style.width = CELL + &#x27;px&#x27;;
        el.style.top = (top + (ROWH - 30) / 2) + &#x27;px&#x27;;
        el.style.transform = &#x27;translateX(&#x27; + x + &#x27;px)&#x27;;
        field.insertBefore(el, flashEl);
        obstacles.push({ x: x, el: el });
      }
      lanes.push({ top: top, dir: dir, speed: speed, obstacles: obstacles });
    }
    // gridlines
    for (var r = 1; r &lt; ROWS; r++) {
      var g = document.createElement(&#x27;div&#x27;);
      g.className = &#x27;gridline&#x27;;
      g.style.top = (r * ROWH) + &#x27;px&#x27;;
      var themeC = (r &gt;= 1 &amp;&amp; r &lt;= LANES) ? THEMES[(r-1) % THEMES.length].color : &#x27;#4dffe0&#x27;;
      g.style.background = hexA(themeC, 0.5);
      g.style.boxShadow = &#x27;0 0 6px &#x27; + hexA(themeC, 0.6);
      field.insertBefore(g, flashEl);
    }
    // safe zones (top row 0, bottom row ROWS-1)
    var topSafe = document.createElement(&#x27;div&#x27;);
    topSafe.className = &#x27;safezone&#x27;;
    topSafe.style.top = &#x27;0px&#x27;; topSafe.style.height = ROWH + &#x27;px&#x27;;
    topSafe.textContent = &#x27;&#x27;;
    field.insertBefore(topSafe, flashEl);
    var botSafe = document.createElement(&#x27;div&#x27;);
    botSafe.className = &#x27;safezone&#x27;;
    botSafe.style.top = ((ROWS - 1) * ROWH) + &#x27;px&#x27;; botSafe.style.height = ROWH + &#x27;px&#x27;;
    field.insertBefore(botSafe, flashEl);
    // lily pad decorations
    addLily(topSafe, &#x27;🌌&#x27;); addLily(botSafe, &#x27;🪷&#x27;);
  }

  function addLily(zone, emoji) {
    for (var i = 1; i &lt; COLS; i += 3) {
      var d = document.createElement(&#x27;div&#x27;);
      d.style.position = &#x27;absolute&#x27;;
      d.style.left = (i * CELL - 8) + &#x27;px&#x27;;
      d.style.top = ((ROWH - 22) / 2) + &#x27;px&#x27;;
      d.style.fontSize = &#x27;18px&#x27;;
      d.style.opacity = &#x27;0.6&#x27;;
      d.textContent = emoji;
      zone.appendChild(d);
    }
  }

  function hexA(hex, a) {
    var h = hex.replace(&#x27;#&#x27;,&#x27;&#x27;);
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    return &#x27;rgba(&#x27; + r + &#x27;,&#x27; + g + &#x27;,&#x27; + b + &#x27;,&#x27; + a + &#x27;)&#x27;;
  }

  function makeHero() {
    heroEl = document.createElement(&#x27;div&#x27;);
    heroEl.className = &#x27;hero&#x27;;
    heroEl.textContent = &#x27;🐸&#x27;;
    heroEl.style.width = CELL + &#x27;px&#x27;;
    field.insertBefore(heroEl, flashEl);
    paintHero();
  }

  function paintHero() {
    if (!heroEl) return;
    var x = hero.col * CELL;
    var y = hero.row * ROWH + (ROWH - 30) / 2;
    heroEl.style.left = x + &#x27;px&#x27;;
    heroEl.style.top = y + &#x27;px&#x27;;
  }

  function resetHero() {
    hero.col = Math.floor(COLS / 2);
    hero.row = ROWS - 1;
    paintHero();
  }

  function tick() {
    if (!running) return;
    // parallax stars
    for (var s = 0; s &lt; starLayers.length; s++) {
      var sl = starLayers[s];
      sl.y += sl.speed;
      if (sl.y &gt;= FIELD_H) sl.y -= FIELD_H;
      sl.el.style.transform = &#x27;translateY(&#x27; + sl.y + &#x27;px)&#x27;;
    }
    for (var i = 0; i &lt; lanes.length; i++) {
      var lane = lanes[i];
      for (var j = 0; j &lt; lane.obstacles.length; j++) {
        var o = lane.obstacles[j];
        o.x += lane.dir * lane.speed;
        if (lane.dir &gt; 0 &amp;&amp; o.x &gt; FIELD_W) o.x = -CELL;
        else if (lane.dir &lt; 0 &amp;&amp; o.x + CELL &lt; 0) o.x = FIELD_W;
        o.el.style.transform = &#x27;translateX(&#x27; + o.x + &#x27;px)&#x27;;
      }
    }
    // collision
    var laneIdx = hero.row - 1;
    if (laneIdx &gt;= 0 &amp;&amp; laneIdx &lt; LANES) {
      var hx = hero.col * CELL;
      var lane2 = lanes[laneIdx];
      var pad = 6;
      for (var k = 0; k &lt; lane2.obstacles.length; k++) {
        var ox = lane2.obstacles[k].x;
        if (hx + pad &lt; ox + CELL - pad &amp;&amp; hx + CELL - pad &gt; ox + pad) {
          hitHero();
          return;
        }
      }
    }
    animId = requestAnimationFrame(tick);
  }

  function spawnParticles() {
    var cx = hero.col * CELL + CELL / 2;
    var cy = hero.row * ROWH + ROWH / 2;
    var emojis = [&#x27;✨&#x27;,&#x27;⭐&#x27;,&#x27;💫&#x27;,&#x27;🌟&#x27;];
    for (var i = 0; i &lt; 14; i++) {
      var p = document.createElement(&#x27;div&#x27;);
      p.className = &#x27;particle&#x27;;
      p.textContent = emojis[i % emojis.length];
      p.style.left = cx + &#x27;px&#x27;;
      p.style.top = cy + &#x27;px&#x27;;
      field.insertBefore(p, flashEl);
      var ang = Math.random() * Math.PI * 2;
      var dist = 30 + Math.random() * 60;
      (function (el, dx, dy) {
        var t0 = performance.now();
        function anim(t) {
          var k = (t - t0) / 600;
          if (k &gt;= 1) { el.remove(); return; }
          el.style.transform = &#x27;translate(&#x27; + (dx*k) + &#x27;px,&#x27; + (dy*k) + &#x27;px) scale(&#x27; + (1-k) + &#x27;)&#x27;;
          el.style.opacity = (1 - k);
          requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);
      })(p, Math.cos(ang)*dist, Math.sin(ang)*dist);
    }
  }

  function hitHero() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    beep(120, 0.4, &#x27;sawtooth&#x27;, 0.12);
    if (heroEl) { heroEl.classList.add(&#x27;hit&#x27;); heroEl.style.color = &#x27;#f44&#x27;; }
    spawnParticles();
    setTimeout(function () {
      if (heroEl) heroEl.style.opacity = &#x27;0&#x27;;
      field.style.filter = &#x27;brightness(0.5)&#x27;;
      finalScoreEl.textContent = &#x27;Score: &#x27; + score;
      overlay.classList.add(&#x27;show&#x27;);
    }, 350);
  }

  function move(dc, dr) {
    if (!running) return;
    hero.col = Math.max(0, Math.min(COLS - 1, hero.col + dc));
    hero.row = Math.max(0, Math.min(ROWS - 1, hero.row + dr));
    paintHero();
    if (heroEl) { heroEl.classList.remove(&#x27;hop&#x27;); void heroEl.offsetWidth; heroEl.classList.add(&#x27;hop&#x27;); }
    beep(660, 0.05, &#x27;square&#x27;, 0.03);
    if (hero.row === 0) crossWarp();
  }

  function crossWarp() {
    var now = performance.now();
    if (now - lastCrossTime &lt; 3500 &amp;&amp; lastCrossTime &gt; 0) {
      combo = Math.min(combo + 1, 9);
    } else {
      combo = 1;
    }
    lastCrossTime = now;
    var gain = combo;
    score += gain;
    scoreEl.textContent = score;
    scoreEl.classList.remove(&#x27;pulse&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pulse&#x27;);
    comboEl.textContent = combo &gt; 1 ? (&#x27;COMBO x&#x27; + combo + &#x27;!&#x27;) : &#x27;&#x27;;
    flashEl.classList.remove(&#x27;on&#x27;); void flashEl.offsetWidth; flashEl.classList.add(&#x27;on&#x27;);
    beep(880, 0.12, &#x27;triangle&#x27;, 0.08);
    beep(1180, 0.12, &#x27;triangle&#x27;, 0.06);

    crossings++;
    var perLane = Math.min(2 + Math.floor(crossings / 1), 5); // ramp: each crossing +1, cap 5
    // rebuild lanes with more obstacles
    clearField();
    buildLanes(perLane);
    makeHero();
    resetHero();
    // sparkle at bottom
    setTimeout(function () {
      var cx = hero.col * CELL + CELL/2, cy = hero.row * ROWH + ROWH/2;
      for (var i=0;i&lt;8;i++){
        var p=document.createElement(&#x27;div&#x27;); p.className=&#x27;particle&#x27;; p.textContent=&#x27;✨&#x27;;
        p.style.left=cx+&#x27;px&#x27;; p.style.top=cy+&#x27;px&#x27;; field.insertBefore(p,flashEl);
        (function(el){var ang=Math.random()*6.28,d=40; var t0=performance.now();
          function a(t){var k=(t-t0)/500; if(k&gt;=1){el.remove();return;}
            el.style.transform=&#x27;translate(&#x27;+(Math.cos(ang)*d*k)+&#x27;px,&#x27;+(Math.sin(ang)*d*k)+&#x27;px)&#x27;;
            el.style.opacity=1-k; requestAnimationFrame(a);} requestAnimationFrame(a);})(p);
      }
    }, 20);
  }

  function startGame() {
    if (running) return;
    score = 0; crossings = 0; combo = 1; lastCrossTime = 0;
    scoreEl.textContent = &#x27;0&#x27;;
    comboEl.textContent = &#x27;&#x27;;
    overlay.classList.remove(&#x27;show&#x27;);
    field.style.filter = &#x27;&#x27;;
    clearField();
    buildStars();
    buildLanes(2);
    makeHero();
    resetHero();
    running = true;
    animId = requestAnimationFrame(tick);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  window.addEventListener(&#x27;keydown&#x27;, function (e) {
    var k = e.key;
    if (k === &#x27;ArrowLeft&#x27; || k === &#x27;a&#x27; || k === &#x27;A&#x27;) { move(-1, 0); e.preventDefault(); }
    else if (k === &#x27;ArrowRight&#x27; || k === &#x27;d&#x27; || k === &#x27;D&#x27;) { move(1, 0); e.preventDefault(); }
    else if (k === &#x27;ArrowUp&#x27; || k === &#x27;w&#x27; || k === &#x27;W&#x27;) { move(0, -1); e.preventDefault(); }
    else if (k === &#x27;ArrowDown&#x27; || k === &#x27;s&#x27; || k === &#x27;S&#x27;) { move(0, 1); e.preventDefault(); }
  });

  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // Initial static paint (stopped state)
  buildStars();
  buildLanes(2);
  makeHero();
  paintHero();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {

        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,

    } catch (_) {}
  });

  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;

  }

  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }

    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });

&lt;/script&gt;

  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
