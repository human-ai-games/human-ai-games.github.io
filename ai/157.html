<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐠 Neon Reef Defender 🐠</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #01121f; color: #cfe; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg,#4ff,#7f8,#f6c); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 8px rgba(80,255,255,.3); }
  .instructions { font-size: 16px; color: #8cd; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { width: 620px; display: flex; align-items: center; gap: 14px; font-size: 16px; color: #aef; }
  .hud .lbl { font-weight: 700; }

  .barwrap { flex: 1; height: 12px; background: #033; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 4px #000; }
  .bar { height: 100%; width: 100%; background: linear-gradient(90deg,#0fa,#4ff); transition: none; }
  .bar.low { background: linear-gradient(90deg,#f33,#f80); }
  .field { position: relative; width: 620px; height: 470px; background: radial-gradient(ellipse at 50% 0%, #063850 0%, #02202f 45%, #010f18 100%); border-radius: 10px; overflow: hidden; box-shadow: 0 0 24px rgba(0,180,220,.25) inset; }
  canvas { display: block; }

  .frenzy { position: absolute; top: 8px; left: 0; width: 100%; text-align: center; font-size: 20px; font-weight: 800; color: #ff8; text-shadow: 0 0 12px #f80; opacity: 0; pointer-events: none; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐠 Neon Reef Defender 🐠&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with &lt;strong&gt;←&lt;/strong&gt; &lt;strong&gt;→&lt;/strong&gt; and press &lt;strong&gt;Space&lt;/strong&gt; to fire sonar pulses at the drifting sea creatures. Hit 5 in a row for a glowing Feeding Frenzy — score as much as you can before the 60-second timer runs out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;lbl&quot;&gt;Score&lt;/span&gt; &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;combo&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Combo&lt;/span&gt; &lt;span id=&quot;combo&quot;&gt;0&lt;/span&gt;&lt;/span&gt;
    &lt;div class=&quot;barwrap&quot;&gt;&lt;div class=&quot;bar&quot; id=&quot;bar&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;span&gt;&lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;s&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;620&quot; height=&quot;470&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;frenzy&quot; id=&quot;frenzy&quot;&gt;✨ FEEDING FRENZY! ✨&lt;/div&gt;
    &lt;div class=&quot;msg&quot; id=&quot;msg&quot;&gt;Press Start below&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){try{window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;);}catch(_){}} ,true);
});

var W=620,H=470;
var cv=document.getElementById(&#x27;cv&#x27;), ctx=cv.getContext(&#x27;2d&#x27;);
var scoreEl=document.getElementById(&#x27;score&#x27;), comboEl=document.getElementById(&#x27;combo&#x27;);
var timeEl=document.getElementById(&#x27;time&#x27;), barEl=document.getElementById(&#x27;bar&#x27;);
var msgEl=document.getElementById(&#x27;msg&#x27;), frenzyEl=document.getElementById(&#x27;frenzy&#x27;);

var running=false, animId=null;
var ship, bullets, enemies, particles, bubbles, keys;
var score, combo, timeLeft, lastTs, spawnTimer, frenzyTime, flash, heartTimer;

// ---- Audio ----
var actx=null;
function ac(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){actx=null;} } return actx; }
function beep(freq,dur,type,vol){
  var a=ac(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||&#x27;sine&#x27;; o.frequency.value=freq;
  g.gain.value=vol||.15;
  o.connect(g); g.connect(a.destination);
  var t=a.currentTime;
  o.start(t);
  g.gain.setValueAtTime(g.gain.value,t);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.stop(t+dur);
}
function sonar(){ beep(880,.12,&#x27;triangle&#x27;,.08); }
function pop(v){ beep(320+Math.random()*120,.18,&#x27;square&#x27;,.12); if(v&gt;=3) beep(180,.3,&#x27;sawtooth&#x27;,.1); }
function goldSfx(){ beep(1200,.15,&#x27;sine&#x27;,.14); beep(1600,.2,&#x27;sine&#x27;,.1); }
function heartbeat(){ beep(60,.14,&#x27;sine&#x27;,.35); }

// ---- Init ----
function reset(){
  ship={x:W/2,y:H-34,w:38,h:30,speed:6,trail:[]};
  bullets=[]; enemies=[]; particles=[]; bubbles=[];
  keys={}; score=0; combo=0; timeLeft=60; spawnTimer=0;
  frenzyTime=0; flash=0; lastTs=0; heartTimer=0;
  for(var i=0;i&lt;40;i++){ bubbles.push(newBubble(true)); }
  updateHud();
}
function newBubble(rand){
  return {x:Math.random()*W, y:rand?Math.random()*H:H+10,
    r:2+Math.random()*5, sp:.4+Math.random()*1.4, layer:Math.random()&lt;.5?1:2};
}

function updateHud(){
  scoreEl.textContent=score;
  comboEl.textContent=combo;
  timeEl.textContent=Math.ceil(timeLeft);
  var pct=Math.max(0,timeLeft/60);
  barEl.style.width=(pct*100)+&#x27;%&#x27;;
  if(timeLeft&lt;=10){ barEl.classList.add(&#x27;low&#x27;); } else { barEl.classList.remove(&#x27;low&#x27;); }
}

// ---- Spawning ----
function spawnEnemy(){
  var elapsed=60-timeLeft;
  var speedBoost=1+elapsed/45; // gets faster over time
  var roll=Math.random();
  if(roll&lt;0.10){ // golden eel - streaks across
    var dir=Math.random()&lt;.5?1:-1;
    enemies.push({type:&#x27;eel&#x27;,x:dir&gt;0?-30:W+30,y:40+Math.random()*140,
      vx:dir*(3.5+Math.random()*1.5)*speedBoost, vy:0, r:16, hp:1, pts:5,
      wob:Math.random()*6, color:&#x27;#ffd23f&#x27;});
  } else if(roll&lt;0.32){ // urchin bomb - slow, worth 3, explodes
    enemies.push({type:&#x27;urchin&#x27;,x:20+Math.random()*(W-40),y:-30,
      vx:0, vy:(0.9+Math.random()*0.5)*speedBoost, r:18, hp:1, pts:3, color:&#x27;#c86bff&#x27;});
  } else { // jellyfish - fast, worth 1
    enemies.push({type:&#x27;jelly&#x27;,x:20+Math.random()*(W-40),y:-30,
      vx:(Math.random()-.5)*1.5, vy:(1.6+Math.random()*1.2)*speedBoost, r:13, hp:1, pts:1,
      color:&#x27;#4ff0e0&#x27;, ph:Math.random()*6});
  }
}

function fire(){
  var frenzy=frenzyTime&gt;0;
  sonar();
  if(frenzy){
    bullets.push(makeBullet(ship.x,-10));
    bullets.push(makeBullet(ship.x-12,-8,-2));
    bullets.push(makeBullet(ship.x+12,-8,2));
  } else {
    bullets.push(makeBullet(ship.x,-9));
  }
}
var lastShot=0;
function tryFire(){
  var now=Date.now();
  var cd=frenzyTime&gt;0?90:230;
  if(now-lastShot&lt;cd) return;
  lastShot=now; fire();
}
function makeBullet(x,vy,vx){ return {x:x,y:ship.y-16,vx:vx||0,vy:vy,r:5,target:null}; }

// ---- Particle burst ----
function burst(x,y,color,n){
  for(var i=0;i&lt;n;i++){
    var a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:color,r:2+Math.random()*3});
  }
}

function killEnemy(idx, chained){
  var e=enemies[idx];
  var pts=e.pts;
  burst(e.x,e.y, e.color, e.type===&#x27;urchin&#x27;?26:14);
  if(e.type===&#x27;urchin&#x27;){
    // chain explosion
    for(var i=enemies.length-1;i&gt;=0;i--){
      if(i===idx) continue;
      var o=enemies[i];
      var d=Math.hypot(o.x-e.x,o.y-e.y);
      if(d&lt;80){
        pts+=o.pts;
        burst(o.x,o.y,o.color,10);
        enemies.splice(i,1);
        if(i&lt;idx) idx--;
      }
    }
    pop(3);
  } else if(e.type===&#x27;eel&#x27;){ goldSfx(); } else { pop(1); }
  enemies.splice(idx,1);
  var mult=frenzyTime&gt;0?2:1;
  score+=pts*mult;
  if(!chained){
    combo++;
    if(combo&gt;0 &amp;&amp; combo%5===0){ startFrenzy(); }
  }
  flash=1;
  updateHud();
}

function startFrenzy(){
  frenzyTime=4;
  frenzyEl.style.transition=&#x27;opacity .2s&#x27;;
  frenzyEl.style.opacity=&#x27;1&#x27;;
  beep(660,.15,&#x27;sine&#x27;,.15); beep(990,.2,&#x27;sine&#x27;,.12);
}

function missShot(){
  combo=0; updateHud();
}

// ---- Loop ----
function tick(ts){
  if(!running) return;
  if(!lastTs) lastTs=ts;
  var dt=Math.min(50,ts-lastTs)/1000; lastTs=ts;

  // timer
  timeLeft-=dt;
  if(timeLeft&lt;=0){ timeLeft=0; endGame(); return; }
  // heartbeat in last 10s
  if(timeLeft&lt;=10){
    heartTimer-=dt;
    if(heartTimer&lt;=0){ heartbeat(); heartTimer=Math.max(.35,timeLeft/28); }
  }
  if(frenzyTime&gt;0){ frenzyTime-=dt; if(frenzyTime&lt;=0){ frenzyEl.style.opacity=&#x27;0&#x27;; } }

  // spawn
  spawnTimer-=dt;
  var interval=Math.max(0.35,0.95-(60-timeLeft)/120);
  if(spawnTimer&lt;=0){ spawnEnemy(); spawnTimer=interval; }

  // input
  if(keys[&#x27;ArrowLeft&#x27;]) ship.x-=ship.speed;
  if(keys[&#x27;ArrowRight&#x27;]) ship.x+=ship.speed;
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  ship.trail.push({x:ship.x,y:ship.y+6,life:1});
  if(ship.trail.length&gt;18) ship.trail.shift();

  // bubbles
  for(var b=0;b&lt;bubbles.length;b++){
    var bu=bubbles[b]; bu.y-=bu.sp*(bu.layer===2?1.7:1); bu.x+=Math.sin(bu.y/30)*0.3;
    if(bu.y&lt;-10){ bubbles[b]=newBubble(false); }
  }

  // bullets - homing
  for(var i=bullets.length-1;i&gt;=0;i--){
    var bl=bullets[i];
    // find nearest enemy for homing
    var best=null,bd=1e9;
    for(var k=0;k&lt;enemies.length;k++){
      var en=enemies[k]; if(en.y&lt;bl.y-4){
        var d=Math.hypot(en.x-bl.x,en.y-bl.y);
        if(d&lt;bd){bd=d;best=en;}
      }
    }
    if(best &amp;&amp; bd&lt;260){
      var dx=best.x-bl.x, dy=best.y-bl.y, m=Math.hypot(dx,dy)||1;
      bl.vx+=(dx/m)*0.6; bl.vx=Math.max(-6,Math.min(6,bl.vx));
    }
    bl.x+=bl.vx; bl.y+=bl.vy;
    if(bl.y&lt;-12||bl.x&lt;-12||bl.x&gt;W+12){ bullets.splice(i,1); missShot(); }
  }

  // enemies
  for(var j=enemies.length-1;j&gt;=0;j--){
    var e=enemies[j];
    e.x+=e.vx; e.y+=e.vy;
    if(e.type===&#x27;jelly&#x27;){ e.ph+=dt*4; if(e.x&lt;15||e.x&gt;W-15) e.vx*=-1; }
    if(e.type===&#x27;eel&#x27;){ e.wob+=dt*8; }
    if(e.y&gt;H+40 || e.x&lt;-50 || e.x&gt;W+50){ enemies.splice(j,1); }
  }

  // collisions
  for(var bi=bullets.length-1;bi&gt;=0;bi--){
    var bb=bullets[bi]; var hit=false;
    for(var ei=enemies.length-1;ei&gt;=0;ei--){
      var ee=enemies[ei];
      if(Math.hypot(bb.x-ee.x,bb.y-ee.y)&lt;ee.r+bb.r){
        bullets.splice(bi,1); killEnemy(ei,false); hit=true; break;
      }
    }
  }

  // particles
  for(var p=particles.length-1;p&gt;=0;p--){
    var pt=particles[p]; pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.05; pt.life-=dt*1.6;
    if(pt.life&lt;=0) particles.splice(p,1);
  }
  if(flash&gt;0) flash-=dt*3;

  draw();
  animId=requestAnimationFrame(tick);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  var frenzy=frenzyTime&gt;0;

  // parallax coral silhouettes bottom
  ctx.save();
  ctx.globalAlpha=.35;
  ctx.fillStyle=&#x27;#062230&#x27;;
  for(var c=0;c&lt;6;c++){ var cx=c*120+30; ctx.beginPath(); ctx.moveTo(cx-40,H); ctx.quadraticCurveTo(cx,H-70-((c*37)%40),cx+40,H); ctx.fill(); }
  ctx.restore();

  // bubbles
  for(var b=0;b&lt;bubbles.length;b++){
    var bu=bubbles[b];
    ctx.beginPath(); ctx.fillStyle=bu.layer===2?&#x27;rgba(120,240,255,.28)&#x27;:&#x27;rgba(80,180,220,.15)&#x27;;
    ctx.arc(bu.x,bu.y,bu.r,0,7); ctx.fill();
  }

  // particles
  for(var p=0;p&lt;particles.length;p++){
    var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // bullets (sonar)
  for(var i=0;i&lt;bullets.length;i++){
    var bl=bullets[i];
    ctx.save(); ctx.shadowColor=&#x27;#0ff&#x27;; ctx.shadowBlur=12;
    ctx.strokeStyle=&#x27;rgba(120,255,255,.9)&#x27;; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bl.x,bl.y,bl.r,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(bl.x,bl.y,bl.r+4,0,7); ctx.globalAlpha=.4; ctx.stroke();
    ctx.restore();
  }

  // enemies
  for(var j=0;j&lt;enemies.length;j++){
    var e=enemies[j];
    ctx.save(); ctx.shadowColor=e.color; ctx.shadowBlur=frenzy?22:12;
    if(e.type===&#x27;jelly&#x27;){
      var wob=Math.sin(e.ph)*3;
      ctx.fillStyle=e.color;
      ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r,e.r*0.85,0,Math.PI,0); ctx.fill();
      ctx.strokeStyle=e.color; ctx.lineWidth=2;
      for(var t=-2;t&lt;=2;t++){ ctx.beginPath(); ctx.moveTo(e.x+t*5,e.y); ctx.lineTo(e.x+t*5+wob,e.y+16); ctx.stroke(); }
    } else if(e.type===&#x27;urchin&#x27;){
      ctx.fillStyle=e.color;
      ctx.strokeStyle=e.color; ctx.lineWidth=3;
      for(var s=0;s&lt;12;s++){ var a=s/12*Math.PI*2; ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+Math.cos(a)*(e.r+6),e.y+Math.sin(a)*(e.r+6)); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(e.x,e.y,e.r*0.6,0,7); ctx.fill();
    } else { // eel
      ctx.strokeStyle=e.color; ctx.lineWidth=7; ctx.lineCap=&#x27;round&#x27;;
      ctx.beginPath();
      for(var w=0;w&lt;=6;w++){ var xx=e.x-e.vx*w*2; var yy=e.y+Math.sin(e.wob+w*0.7)*6; if(w===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
      ctx.stroke();
      ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(e.x,e.y-2,2.5,0,7); ctx.fill();
    }
    ctx.restore();
  }

  // ship trail
  for(var tr=0;tr&lt;ship.trail.length;tr++){
    var trp=ship.trail[tr]; var a=tr/ship.trail.length;
    ctx.globalAlpha=a*0.5; ctx.fillStyle=frenzy?&#x27;#ff8&#x27;:&#x27;#6ff&#x27;;
    ctx.beginPath(); ctx.arc(trp.x,trp.y,a*6,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ship (anglerfish sub)
  ctx.save();
  ctx.shadowColor=frenzy?&#x27;#ff0&#x27;:&#x27;#0ff&#x27;; ctx.shadowBlur=frenzy?26:16;
  ctx.fillStyle=frenzy?&#x27;#ffe36b&#x27;:&#x27;#7fffd4&#x27;;
  ctx.beginPath(); ctx.ellipse(ship.x,ship.y,20,14,0,0,7); ctx.fill();
  // tail
  ctx.beginPath(); ctx.moveTo(ship.x+16,ship.y); ctx.lineTo(ship.x+28,ship.y-9); ctx.lineTo(ship.x+28,ship.y+9); ctx.fill();
  // lure light on top
  ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(ship.x-6,ship.y-12); ctx.quadraticCurveTo(ship.x-14,ship.y-26,ship.x-2,ship.y-28); ctx.stroke();
  ctx.fillStyle=&#x27;#fff&#x27;; ctx.beginPath(); ctx.arc(ship.x-2,ship.y-30,4,0,7); ctx.fill();
  // eye
  ctx.fillStyle=&#x27;#012&#x27;; ctx.beginPath(); ctx.arc(ship.x-8,ship.y-2,3,0,7); ctx.fill();
  ctx.restore();

  // caustic flash
  if(flash&gt;0){
    ctx.fillStyle=&#x27;rgba(140,255,255,&#x27;+(flash*0.18)+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }
  if(frenzy){
    ctx.fillStyle=&#x27;rgba(255,220,80,&#x27;+(0.06+0.04*Math.sin(Date.now()/80))+&#x27;)&#x27;;
    ctx.fillRect(0,0,W,H);
  }
}

function endGame(){
  running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
  msgEl.innerHTML=&#x27;⏱ Time! Score: &#x27;+score+&#x27;&lt;br&gt;&lt;span style=&quot;font-size:18px&quot;&gt;Press Start to play again&lt;/span&gt;&#x27;;
  msgEl.style.display=&#x27;block&#x27;;
  draw();
}

function startGame(){
  if(running) return;
  reset();
  msgEl.style.display=&#x27;none&#x27;;
  frenzyEl.style.opacity=&#x27;0&#x27;;
  running=true;
  var a=ac(); if(a &amp;&amp; a.state===&#x27;suspended&#x27;) a.resume();
  spawnEnemy(); // immediate visible action
  lastTs=0;
  animId=requestAnimationFrame(tick);
}
function stopGame(){
  if(!running) return;
  running=false;
  if(animId){cancelAnimationFrame(animId);animId=null;}
  msgEl.innerHTML=&#x27;Paused&#x27;;
  msgEl.style.display=&#x27;block&#x27;;
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;){ keys[e.key]=true; e.preventDefault(); }
  else if(e.key===&#x27; &#x27;||e.code===&#x27;Space&#x27;){ if(running) tryFire(); e.preventDefault(); }
});
window.addEventListener(&#x27;keyup&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;||e.key===&#x27;ArrowRight&#x27;) keys[e.key]=false;
});
// mouse drag to move + click to fire
cv.addEventListener(&#x27;mousemove&#x27;,function(e){
  if(!running) return; var r=cv.getBoundingClientRect();
  ship.x=Math.max(20,Math.min(W-20,e.clientX-r.left));
});
cv.addEventListener(&#x27;mousedown&#x27;,function(){ if(running) tryFire(); });

window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

reset();
draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {
        var ro = new ResizeObserver(reportSize);
        if (document.body) ro.observe(document.body);
      }
    } catch (_) {}
  }
  if (document.readyState === &#x27;complete&#x27;) {
    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
