    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #05060f; color: #e8f0ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 2px;
       background: linear-gradient(90deg,#00eaff,#00ff88,#ffe600); -webkit-background-clip: text; background-clip: text; color: transparent;
       text-shadow: 0 0 18px rgba(0,234,255,.35); }
  .instructions { font-size: 16px; color: #9fb2d0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; gap: 20px; align-items: center; font-size: 20px; }
  .hud .score { color: #ffe600; font-weight: 700; }
  .tier { padding: 3px 12px; border-radius: 20px; font-size: 15px; font-weight: 700; letter-spacing: 1px;
          border: 1px solid rgba(255,255,255,.15); }
  .field-wrap { position: relative; }
  #field { display: block; border-radius: 10px; background: #070912;
           box-shadow: 0 0 40px rgba(0,180,255,.15), inset 0 0 60px rgba(0,0,0,.6); }
  #flash { position: absolute; inset: 0; border-radius: 10px; pointer-events: none; opacity: 0; }
  .arrow { position: absolute; width: 52px; height: 52px; border-radius: 12px; border: 1px solid rgba(0,234,255,.4);
           background: rgba(0,234,255,.08); color: #00eaff; font-size: 24px; display: flex; align-items: center; justify-content: center;
           cursor: pointer; user-select: none; box-shadow: 0 0 12px rgba(0,234,255,.25); }
  .arrow:active { background: rgba(0,234,255,.25); }
  #aUp { top: 10px; left: 50%; transform: translateX(-50%); }
  #aDown { bottom: 10px; left: 50%; transform: translateX(-50%); }
  #aLeft { top: 50%; left: 10px; transform: translateY(-50%); }
  #aRight { top: 50%; right: 10px; transform: translateY(-50%); }
  #overlay { position: absolute; inset: 0; border-radius: 10px; background: rgba(3,5,15,.82); display: none;
             flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 40px; letter-spacing: 3px; color: #ff3b6b; text-shadow: 0 0 20px rgba(255,59,107,.6); }
  #overlay .final { font-size: 24px; }
  #overlay .stars { font-size: 42px; letter-spacing: 6px; }
  #overlay .hint { font-size: 16px; color: #9fb2d0; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with arrow keys or the on-screen arrows to eat glowing shapes — stars are 1pt, diamonds 3pt, the rare orb 5pt. Avoid the walls and yourself; you speed up as your score climbs.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;Score: &lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;tier&quot; id=&quot;tier&quot; style=&quot;color:#00eaff;border-color:rgba(0,234,255,.5)&quot;&gt;SLOW&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field-wrap&quot; id=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;field&quot; width=&quot;560&quot; height=&quot;440&quot;&gt;&lt;/canvas&gt;
    &lt;div id=&quot;flash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aUp&quot;&gt;▲&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aDown&quot;&gt;▼&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aLeft&quot;&gt;◀&lt;/div&gt;
    &lt;div class=&quot;arrow&quot; id=&quot;aRight&quot;&gt;▶&lt;/div&gt;
    &lt;div id=&quot;overlay&quot;&gt;
      &lt;h2&gt;GAME OVER&lt;/h2&gt;
      &lt;div class=&quot;final&quot;&gt;Score: &lt;span id=&quot;finalScore&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stars&quot; id=&quot;stars&quot;&gt;☆☆☆&lt;/div&gt;
      &lt;div class=&quot;hint&quot;&gt;Press Start below to play again&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 20;
  var COLS = 28, ROWS = 22;
  var canvas = document.getElementById(&#x27;field&#x27;);
  var ctx = canvas.getContext(&#x27;2d&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var tierEl = document.getElementById(&#x27;tier&#x27;);
  var flashEl = document.getElementById(&#x27;flash&#x27;);
  var overlay = document.getElementById(&#x27;overlay&#x27;);
  var finalScoreEl = document.getElementById(&#x27;finalScore&#x27;);
  var starsEl = document.getElementById(&#x27;stars&#x27;);

  var running = false, loopId = null;
  var snake = [], dir = {x:1,y:0}, pendingDir = {x:1,y:0};
  var score = 0;
  var items = {};      // star, diamond, orb
  var orbTimer = 0, orbVisible = false, orbNextIn = 0;
  var popups = [];     // floating score texts
  var particles = [];  // death explosion
  var frame = 0, moveAcc = 0;
  var lastTime = 0;

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||&#x27;sine&#x27;; o.frequency.value = freq;
      g.gain.value = vol||0.15;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch(_) {}
  }

  function tierInfo() {
    if (score &gt;= 45) return {name:&#x27;BLAZING&#x27;, ms:70, color:&#x27;#ff3b6b&#x27;};
    if (score &gt;= 25) return {name:&#x27;FAST&#x27;, ms:95, color:&#x27;#ffe600&#x27;};
    if (score &gt;= 10) return {name:&#x27;MEDIUM&#x27;, ms:125, color:&#x27;#00ff88&#x27;};
    return {name:&#x27;SLOW&#x27;, ms:160, color:&#x27;#00eaff&#x27;};
  }

  function cellFree(x,y) {
    for (var i=0;i&lt;snake.length;i++) if (snake[i].x===x&amp;&amp;snake[i].y===y) return false;
    if (items.star &amp;&amp; items.star.x===x &amp;&amp; items.star.y===y) return false;
    if (items.diamond &amp;&amp; items.diamond.x===x &amp;&amp; items.diamond.y===y) return false;
    if (items.orb &amp;&amp; items.orb.x===x &amp;&amp; items.orb.y===y) return false;
    return true;
  }
  function randCell() {
    for (var t=0;t&lt;300;t++){
      var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
      if (cellFree(x,y)) return {x:x,y:y};
    }
    return {x:0,y:0};
  }
  function spawnStar(){ items.star = randCell(); }
  function spawnDiamond(){ items.diamond = randCell(); }
  function spawnOrb(){ items.orb = randCell(); orbVisible = true; orbTimer = 3.2; } // seconds visible

  function initSnake() {
    snake = [{x:5,y:11},{x:4,y:11},{x:3,y:11}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
  }

  function reset() {
    score = 0; scoreEl.textContent = &#x27;0&#x27;;
    initSnake();
    items = {}; spawnStar(); spawnDiamond();
    orbVisible = false; orbTimer = 0; orbNextIn = 6 + Math.random()*5;
    popups = []; particles = [];
    frame = 0; moveAcc = 0;
    overlay.classList.remove(&#x27;show&#x27;);
    updateTier();
  }

  function updateTier() {
    var t = tierInfo();
    tierEl.textContent = t.name;
    tierEl.style.color = t.color;
    tierEl.style.borderColor = t.color;
  }

  function flash(color) {
    flashEl.style.transition = &#x27;none&#x27;;
    flashEl.style.background = color;
    flashEl.style.opacity = &#x27;0.5&#x27;;
    requestAnimationFrame(function(){
      flashEl.style.transition = &#x27;opacity .35s ease&#x27;;
      flashEl.style.opacity = &#x27;0&#x27;;
    });
  }

  function addPopup(x,y,text,color){
    popups.push({px:x*CELL+CELL/2, py:y*CELL, text:text, color:color, life:1, });
  }

  function step() {
    if (!(pendingDir.x===-dir.x &amp;&amp; pendingDir.y===-dir.y)) dir = pendingDir;
    var head = snake[0];
    var nx = head.x+dir.x, ny = head.y+dir.y;
    if (nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS) { die(); return; }
    var eating = (items.star&amp;&amp;items.star.x===nx&amp;&amp;items.star.y===ny) ||
                 (items.diamond&amp;&amp;items.diamond.x===nx&amp;&amp;items.diamond.y===ny) ||
                 (orbVisible&amp;&amp;items.orb&amp;&amp;items.orb.x===nx&amp;&amp;items.orb.y===ny);
    var body = eating ? snake : snake.slice(0, snake.length-1);
    for (var i=0;i&lt;body.length;i++) if (body[i].x===nx&amp;&amp;body[i].y===ny) { die(); return; }
    snake.unshift({x:nx,y:ny});
    if (items.star&amp;&amp;items.star.x===nx&amp;&amp;items.star.y===ny){
      score+=1; flash(&#x27;rgba(0,234,255,.9)&#x27;); addPopup(nx,ny,&#x27;+1&#x27;,&#x27;#00eaff&#x27;); beep(660,.12,&#x27;triangle&#x27;,.14); spawnStar();
    } else if (items.diamond&amp;&amp;items.diamond.x===nx&amp;&amp;items.diamond.y===ny){
      score+=3; flash(&#x27;rgba(255,80,220,.9)&#x27;); addPopup(nx,ny,&#x27;+3&#x27;,&#x27;#ff66e0&#x27;); beep(520,.15,&#x27;square&#x27;,.13); spawnDiamond();
    } else if (orbVisible&amp;&amp;items.orb&amp;&amp;items.orb.x===nx&amp;&amp;items.orb.y===ny){
      score+=5; flash(&#x27;rgba(255,230,0,.9)&#x27;); addPopup(nx,ny,&#x27;+5&#x27;,&#x27;#ffe600&#x27;); beep(880,.2,&#x27;sawtooth&#x27;,.12);
      orbVisible=false; items.orb=null; orbNextIn = 6 + Math.random()*5;
    } else {
      snake.pop();
    }
    scoreEl.textContent = score;
    updateTier();
  }

  function die() {
    running = false;
    beep(140,.5,&#x27;sawtooth&#x27;,.2);
    // explosion particles
    for (var i=0;i&lt;snake.length;i++){
      var s = snake[i];
      var hue = (i/snake.length)*100 + 160;
      for (var k=0;k&lt;3;k++){
        var ang = Math.random()*Math.PI*2, sp = 1+Math.random()*3;
        particles.push({px:s.x*CELL+CELL/2, py:s.y*CELL+CELL/2,
          vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:1, hue:hue});
      }
    }
    var stars = score&gt;=45?3:score&gt;=20?2:score&gt;=5?1:0;
    finalScoreEl.textContent = score;
    starsEl.textContent = (stars&gt;=1?&#x27;★&#x27;:&#x27;☆&#x27;)+(stars&gt;=2?&#x27;★&#x27;:&#x27;☆&#x27;)+(stars&gt;=3?&#x27;★&#x27;:&#x27;☆&#x27;);
    starsEl.style.color = &#x27;#ffe600&#x27;;
    // show overlay after brief explosion
    setTimeout(function(){ overlay.classList.add(&#x27;show&#x27;); }, 700);
  }

  // ---- drawing ----
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawGrid() {
    ctx.fillStyle = &#x27;#070912&#x27;;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    var off = (frame*0.4)%CELL;
    ctx.fillStyle = &#x27;rgba(60,90,160,.28)&#x27;;
    for (var y=-1;y&lt;=ROWS;y++){
      for (var x=-1;x&lt;=COLS;x++){
        var px = x*CELL + off, py = y*CELL + off;
        ctx.beginPath();
        ctx.arc(px, py, 1.3, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawStar(cx,cy,r,rot,color){
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(rot);
    ctx.shadowBlur = 14; ctx.shadowColor = color; ctx.fillStyle = color;
    ctx.beginPath();
    for (var i=0;i&lt;10;i++){
      var rr = i%2===0? r : r*0.45;
      var a = i*Math.PI/5 - Math.PI/2;
      ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawDiamond(cx,cy,r,pulse,color){
    ctx.save(); ctx.translate(cx,cy);
    var s = r*(0.85+0.15*pulse);
    ctx.shadowBlur=16; ctx.shadowColor=color; ctx.fillStyle=color;
    ctx.beginPath();
    ctx.moveTo(0,-s); ctx.lineTo(s*0.8,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.8,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawOrb(cx,cy,r,pulse){
    ctx.save(); ctx.translate(cx,cy);
    var glow = 0.5+0.5*pulse;
    ctx.shadowBlur = 20*glow; ctx.shadowColor=&#x27;#ffe600&#x27;;
    var g = ctx.createRadialGradient(0,0,1,0,0,r);
    g.addColorStop(0,&#x27;#fffbe0&#x27;); g.addColorStop(0.5,&#x27;#ffe600&#x27;); g.addColorStop(1,&#x27;rgba(255,120,0,.6)&#x27;);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,r*(0.8+0.2*pulse),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    drawGrid();
    var t = frame*0.08;

    // items
    if (items.star) drawStar(items.star.x*CELL+CELL/2, items.star.y*CELL+CELL/2, 8, t, &#x27;#00eaff&#x27;);
    if (items.diamond) drawDiamond(items.diamond.x*CELL+CELL/2, items.diamond.y*CELL+CELL/2, 9, Math.sin(t*2)*0.5+0.5, &#x27;#ff66e0&#x27;);
    if (orbVisible &amp;&amp; items.orb) {
      var blink = Math.sin(frame*0.4)*0.5+0.5;
      if (orbTimer &gt; 0.8 || blink &gt; 0.4) drawOrb(items.orb.x*CELL+CELL/2, items.orb.y*CELL+CELL/2, 9, blink);
    }

    // snake as glowing gradient orbs
    var n = snake.length;
    for (var i=n-1;i&gt;=0;i--){
      var s = snake[i];
      var f = n&gt;1 ? i/(n-1) : 0; // 0 head .. 1 tail
      // cyan -&gt; green -&gt; yellow
      var col;
      if (f &lt; 0.5) {
        var k = f/0.5;
        col = lerpColor([0,234,255],[0,255,136],k);
      } else {
        var k2 = (f-0.5)/0.5;
        col = lerpColor([0,255,136],[255,230,0],k2);
      }
      var cstr = &#x27;rgb(&#x27;+col[0]+&#x27;,&#x27;+col[1]+&#x27;,&#x27;+col[2]+&#x27;)&#x27;;
      var px = s.x*CELL+1.5, py = s.y*CELL+1.5, sz = CELL-3;
      ctx.save();
      ctx.shadowBlur = (i===0)?18:10;
      ctx.shadowColor = cstr;
      ctx.fillStyle = cstr;
      roundRect(px,py,sz,sz,6); ctx.fill();
      if (i===0){
        // eyes
        ctx.shadowBlur=0; ctx.fillStyle=&#x27;#04121a&#x27;;
        var ex = s.x*CELL+CELL/2, ey=s.y*CELL+CELL/2;
        ctx.beginPath(); ctx.arc(ex+dir.x*3-dir.y*3, ey+dir.y*3-dir.x*3, 2,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(ex+dir.x*3+dir.y*3, ey+dir.y*3+dir.x*3, 2,0,7); ctx.fill();
      }
      ctx.restore();
    }

    // popups
    for (var p=0;p&lt;popups.length;p++){
      var pu = popups[p];
      ctx.save();
      ctx.globalAlpha = pu.life;
      ctx.fillStyle = pu.color;
      ctx.font = &#x27;bold 18px system-ui&#x27;;
      ctx.textAlign=&#x27;center&#x27;;
      ctx.shadowBlur=8; ctx.shadowColor=pu.color;
      ctx.fillText(pu.text, pu.px, pu.py - (1-pu.life)*30);
      ctx.restore();
    }

    // particles
    for (var q=0;q&lt;particles.length;q++){
      var pt = particles[q];
      ctx.save();
      ctx.globalAlpha = Math.max(0,pt.life);
      ctx.fillStyle = &#x27;hsl(&#x27;+pt.hue+&#x27;,100%,60%)&#x27;;
      ctx.shadowBlur=8; ctx.shadowColor=ctx.fillStyle;
      ctx.beginPath(); ctx.arc(pt.px,pt.py,3,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function lerpColor(a,b,t){
    return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)];
  }

  function loop(time) {
    if (lastTime===0) lastTime = time;
    var dt = (time-lastTime)/1000; lastTime = time;
    frame++;

    if (running) {
      moveAcc += dt*1000;
      var ms = tierInfo().ms;
      while (moveAcc &gt;= ms &amp;&amp; running) { moveAcc -= ms; step(); }
      // orb timing
      if (orbVisible) {
        orbTimer -= dt;
        if (orbTimer &lt;= 0) { orbVisible=false; items.orb=null; orbNextIn = 6 + Math.random()*5; }
      } else {
        orbNextIn -= dt;
        if (orbNextIn &lt;= 0) spawnOrb();
      }
    }

    // update popups &amp; particles always (so death anim plays)
    for (var i=popups.length-1;i&gt;=0;i--){ popups[i].life -= dt*1.2; if (popups[i].life&lt;=0) popups.splice(i,1); }
    for (var j=particles.length-1;j&gt;=0;j--){
      var pt=particles[j]; pt.px+=pt.vx; pt.py+=pt.vy; pt.vx*=0.96; pt.vy*=0.96; pt.life-=dt*0.9;
      if (pt.life&lt;=0) particles.splice(j,1);
    }

    draw();
    loopId = requestAnimationFrame(loop);
  }

  function startLoop(){ if (!loopId){ lastTime=0; loopId=requestAnimationFrame(loop); } }
  function stopLoop(){ if (loopId){ cancelAnimationFrame(loopId); loopId=null; } }

  function startGame(){
    reset();
    running = true;
    startLoop();
  }
  function stopGame(){
    running = false;
    stopLoop();
  }

  function setDir(x,y){ pendingDir={x:x,y:y}; }
  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key===&#x27;ArrowLeft&#x27;){ setDir(-1,0); e.preventDefault(); }
    else if (e.key===&#x27;ArrowRight&#x27;){ setDir(1,0); e.preventDefault(); }
    else if (e.key===&#x27;ArrowUp&#x27;){ setDir(0,-1); e.preventDefault(); }
    else if (e.key===&#x27;ArrowDown&#x27;){ setDir(0,1); e.preventDefault(); }
  });
  function bindArrow(id,x,y){
    var el=document.getElementById(id);
    el.addEventListener(&#x27;mousedown&#x27;, function(ev){ ev.preventDefault(); setDir(x,y); });
    el.addEventListener(&#x27;touchstart&#x27;, function(ev){ ev.preventDefault(); setDir(x,y); }, {passive:false});
  }
  bindArrow(&#x27;aUp&#x27;,0,-1); bindArrow(&#x27;aDown&#x27;,0,1); bindArrow(&#x27;aLeft&#x27;,-1,0); bindArrow(&#x27;aRight&#x27;,1,0);

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data!==&#x27;object&#x27;) return;
    if (e.data.type===&#x27;wd_start&#x27;) startGame();
    else if (e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static paint
  reset(); running=false; draw();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.

<script>
