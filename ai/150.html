<body>

  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>NEON SERPENT</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #06060f; color: #e8f6ff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 12px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 2px; color: #6ff0ff; text-shadow: 0 0 8px #22d3ee, 0 0 20px #0891b2; }
  .instructions { font-size: 16px; color: #9fb8c8; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; align-items: center; gap: 22px; font-size: 22px; }

  canvas { display: block; border-radius: 10px; box-shadow: 0 0 24px rgba(34,211,238,0.25), inset 0 0 40px rgba(0,0,0,0.6); }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;NEON SERPENT&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Steer with the arrow keys, gobble glowing collectibles to score, and grab the rare pink orb before it vanishes. Use the &lt;strong&gt;Start&lt;/strong&gt;/&lt;strong&gt;Restart&lt;/strong&gt; button below the game.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div class=&quot;score&quot;&gt;Score: &lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;flames&quot; id=&quot;flames&quot; title=&quot;Speed&quot;&gt;🔥&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;wrap&quot;&gt;
    &lt;canvas id=&quot;cv&quot; width=&quot;600&quot; height=&quot;460&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
[&#x27;keydown&#x27;,&#x27;mousedown&#x27;,&#x27;touchstart&#x27;].forEach(function(t){
  window.addEventListener(t,function(e){
    try{ window.parent.postMessage({type:&#x27;game_input&#x27;,kind:t,key:e.key||null},&#x27;*&#x27;); }catch(_){}
  },true);
});

var CELL = 20;
var COLS = 30, ROWS = 23;
var W = COLS*CELL, H = ROWS*CELL;
var cv = document.getElementById(&#x27;cv&#x27;);
var ctx = cv.getContext(&#x27;2d&#x27;);
var scoreEl = document.getElementById(&#x27;score&#x27;);
var flamesEl = document.getElementById(&#x27;flames&#x27;);

var running=false, rafId=null, lastStep=0;
var snake=[], dir={x:1,y:0}, pendingDir={x:1,y:0};
var score=0, tier=1;
var collectibles=[]; // {type,x,y,ttl,maxttl}
var particles=[];
var floaters=[]; // {x,y,text,color,life}
var shatter=[]; // death segments
var flash={color:null,alpha:0};
var dying=false, deadTime=0;

function stepMs(){ return Math.max(70, 150 - (tier-1)*16); }

function cellOccupied(x,y){
  for(var i=0;i&lt;snake.length;i++) if(snake[i].x===x&amp;&amp;snake[i].y===y) return true;
  return false;
}
function collAt(x,y){
  for(var i=0;i&lt;collectibles.length;i++) if(collectibles[i].x===x&amp;&amp;collectibles[i].y===y) return true;
  return false;
}
function randEmpty(){
  for(var t=0;t&lt;300;t++){
    var x=Math.floor(Math.random()*COLS), y=Math.floor(Math.random()*ROWS);
    if(!cellOccupied(x,y)&amp;&amp;!collAt(x,y)) return {x:x,y:y};
  }
  return {x:0,y:0};
}
function hasType(type){
  for(var i=0;i&lt;collectibles.length;i++) if(collectibles[i].type===type) return true;
  return false;
}
function spawnSpark(){ var p=randEmpty(); collectibles.push({type:&#x27;spark&#x27;,x:p.x,y:p.y}); }
function spawnStar(){ var p=randEmpty(); collectibles.push({type:&#x27;star&#x27;,x:p.x,y:p.y}); }
function maybeSpawnOrb(){
  if(!hasType(&#x27;orb&#x27;) &amp;&amp; Math.random()&lt;0.10){
    var p=randEmpty(); collectibles.push({type:&#x27;orb&#x27;,x:p.x,y:p.y,ttl:6000,maxttl:6000});
  }
}

function ensureCollectibles(){
  if(!hasType(&#x27;spark&#x27;)) spawnSpark();
  if(!hasType(&#x27;star&#x27;)) spawnStar();
}

function initSnake(){
  snake=[{x:6,y:11},{x:5,y:11},{x:4,y:11},{x:3,y:11}];
  dir={x:1,y:0}; pendingDir={x:1,y:0};
}

function reset(){
  score=0; tier=1; scoreEl.textContent=&#x27;0&#x27;; updateFlames();
  collectibles=[]; particles=[]; floaters=[]; shatter=[]; flash={color:null,alpha:0};
  dying=false; deadTime=0;
  initSnake();
  ensureCollectibles();
  maybeSpawnOrb();
}

function updateFlames(){
  var s=&#x27;&#x27;;
  for(var i=0;i&lt;tier;i++) s+=&#x27;🔥&#x27;;
  flamesEl.textContent=s;
}

function burst(cx,cy,color){
  for(var i=0;i&lt;18;i++){
    var a=Math.random()*Math.PI*2, sp=1+Math.random()*3.5;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
  }
}

function eat(c,idx){
  var val = c.type===&#x27;spark&#x27;?1 : c.type===&#x27;star&#x27;?3 : 5;
  var color = c.type===&#x27;spark&#x27;?&#x27;#ffffff&#x27; : c.type===&#x27;star&#x27;?&#x27;#ffd23f&#x27; : &#x27;#ff5fa2&#x27;;
  score+=val; scoreEl.textContent=score;
  var newTier=Math.min(5,1+Math.floor(score/5));
  if(newTier!==tier){ tier=newTier; updateFlames(); }
  var cx=c.x*CELL+CELL/2, cy=c.y*CELL+CELL/2;
  burst(cx,cy,color);
  flash={color:color,alpha:0.35};
  floaters.push({x:cx,y:cy,text:&#x27;+&#x27;+val,color:color,life:1});
  collectibles.splice(idx,1);
  ensureCollectibles();
  maybeSpawnOrb();
}

function die(){
  dying=true; deadTime=0;
  flash={color:&#x27;#ff2a2a&#x27;,alpha:0.55};
  for(var i=0;i&lt;snake.length;i++){
    var a=Math.random()*Math.PI*2, sp=0.5+Math.random()*2;
    shatter.push({x:snake[i].x*CELL+CELL/2,y:snake[i].y*CELL+CELL/2,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.5,life:1,rot:Math.random()*6});
  }
}

function step(){
  if(!(pendingDir.x===-dir.x&amp;&amp;pendingDir.y===-dir.y)) dir=pendingDir;
  var head=snake[0];
  var nx=head.x+dir.x, ny=head.y+dir.y;
  if(nx&lt;0||nx&gt;=COLS||ny&lt;0||ny&gt;=ROWS){ die(); return; }
  var eatIdx=-1;
  for(var i=0;i&lt;collectibles.length;i++) if(collectibles[i].x===nx&amp;&amp;collectibles[i].y===ny){ eatIdx=i; break; }
  var grow = eatIdx&gt;=0;
  var body = grow? snake : snake.slice(0,snake.length-1);
  for(var j=0;j&lt;body.length;j++) if(body[j].x===nx&amp;&amp;body[j].y===ny){ die(); return; }
  snake.unshift({x:nx,y:ny});
  if(grow){ eat(collectibles[eatIdx],eatIdx); }
  else snake.pop();
}

// ---- Rendering ----
function lerp(a,b,t){ return a+(b-a)*t; }
function hexRibbon(t){
  // cyan -&gt; electric blue -&gt; deep purple
  var stops=[[110,240,255],[60,130,255],[130,40,190]];
  var seg = t*(stops.length-1);
  var i=Math.min(stops.length-2,Math.floor(seg));
  var f=seg-i;
  var r=Math.round(lerp(stops[i][0],stops[i+1][0],f));
  var g=Math.round(lerp(stops[i][1],stops[i+1][1],f));
  var b=Math.round(lerp(stops[i][2],stops[i+1][2],f));
  return &#x27;rgb(&#x27;+r+&#x27;,&#x27;+g+&#x27;,&#x27;+b+&#x27;)&#x27;;
}

function drawGrid(now){
  ctx.fillStyle=&#x27;#06060f&#x27;;
  ctx.fillRect(0,0,W,H);
  var hx=(snake.length?snake[0].x:0)*CELL+CELL/2;
  var hy=(snake.length?snake[0].y:0)*CELL+CELL/2;
  ctx.lineWidth=1;
  for(var x=0;x&lt;=COLS;x++){
    var px=x*CELL;
    var d=Math.abs(px-hx);
    var glow=Math.max(0,1-d/150);
    ctx.strokeStyle=&#x27;rgba(60,120,180,&#x27;+(0.06+glow*0.35)+&#x27;)&#x27;;
    ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,H); ctx.stroke();
  }
  for(var y=0;y&lt;=ROWS;y++){
    var py=y*CELL;
    var d2=Math.abs(py-hy);
    var glow2=Math.max(0,1-d2/150);
    ctx.strokeStyle=&#x27;rgba(60,120,180,&#x27;+(0.06+glow2*0.35)+&#x27;)&#x27;;
    ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke();
  }
  // spotlight near head
  var grad=ctx.createRadialGradient(hx,hy,10,hx,hy,140);
  grad.addColorStop(0,&#x27;rgba(60,200,255,0.12)&#x27;);
  grad.addColorStop(1,&#x27;rgba(0,0,0,0)&#x27;);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function drawCollectibles(now){
  for(var i=0;i&lt;collectibles.length;i++){
    var c=collectibles[i];
    var cx=c.x*CELL+CELL/2, cy=c.y*CELL+CELL/2;
    if(c.type===&#x27;spark&#x27;){
      var blink=0.55+0.45*Math.sin(now/220);
      ctx.save();
      ctx.globalAlpha=blink;
      ctx.fillStyle=&#x27;#ffffff&#x27;;
      ctx.shadowColor=&#x27;#ffffff&#x27;; ctx.shadowBlur=14;
      ctx.beginPath();
      for(var k=0;k&lt;4;k++){
        var ang=k*Math.PI/2 + now/1000;
        ctx.moveTo(cx,cy);
        ctx.lineTo(cx+Math.cos(ang)*7,cy+Math.sin(ang)*7);
      }
      ctx.lineWidth=2; ctx.strokeStyle=&#x27;#fff&#x27;; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else if(c.type===&#x27;star&#x27;){
      var pulse=1+0.18*Math.sin(now/180);
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(now/600);
      ctx.scale(pulse,pulse);
      ctx.fillStyle=&#x27;#ffd23f&#x27;;
      ctx.shadowColor=&#x27;#ffb300&#x27;; ctx.shadowBlur=16;
      ctx.beginPath();
      for(var s=0;s&lt;10;s++){
        var r=(s%2===0)?8:3.4;
        var a2=Math.PI*s/5 - Math.PI/2;
        var xx=Math.cos(a2)*r, yy=Math.sin(a2)*r;
        if(s===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if(c.type===&#x27;orb&#x27;){
      var frac=c.ttl/c.maxttl;
      ctx.save();
      var pl=1+0.12*Math.sin(now/120);
      ctx.fillStyle=&#x27;#ff5fa2&#x27;;
      ctx.shadowColor=&#x27;#ff5fa2&#x27;; ctx.shadowBlur=20;
      ctx.beginPath(); ctx.arc(cx,cy,6*pl,0,Math.PI*2); ctx.fill();
      // shrinking ring
      ctx.shadowBlur=0;
      ctx.strokeStyle=&#x27;rgba(255,180,220,0.9)&#x27;;
      ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.arc(cx,cy,10,-Math.PI/2,-Math.PI/2+frac*Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawSnake(){
  var n=snake.length;
  ctx.lineCap=&#x27;round&#x27;; ctx.lineJoin=&#x27;round&#x27;;
  // glowing tube: draw thick underlay then segments
  for(var i=n-1;i&gt;=0;i--){
    var t=n&gt;1? i/(n-1):0;
    var col=hexRibbon(t);
    var px=snake[i].x*CELL+CELL/2, py=snake[i].y*CELL+CELL/2;
    var r=(i===0?9:7.5);
    ctx.save();
    ctx.shadowColor=col; ctx.shadowBlur= (i===0?22:12);
    ctx.fillStyle=col;
    ctx.beginPath();
    roundRect(px-r,py-r,r*2,r*2,4);
    ctx.fill();
    ctx.restore();
  }
  // head eye
  if(n){
    var hx=snake[0].x*CELL+CELL/2, hy=snake[0].y*CELL+CELL/2;
    ctx.fillStyle=&#x27;#02121a&#x27;;
    ctx.beginPath();
    ctx.arc(hx+dir.x*3,hy+dir.y*3,2.2,0,Math.PI*2); ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
}

function drawParticles(){
  for(var i=0;i&lt;particles.length;i++){
    var p=particles[i];
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawShatter(){
  for(var i=0;i&lt;shatter.length;i++){
    var s=shatter[i];
    ctx.save();
    ctx.globalAlpha=Math.max(0,s.life);
    ctx.translate(s.x,s.y); ctx.rotate(s.rot);
    ctx.fillStyle=&#x27;#ff4a4a&#x27;;
    ctx.shadowColor=&#x27;#ff2a2a&#x27;; ctx.shadowBlur=12;
    ctx.beginPath(); roundRect(-7,-7,14,14,4); ctx.fill();
    ctx.restore();
  }
}
function drawFloaters(){
  for(var i=0;i&lt;floaters.length;i++){
    var f=floaters[i];
    ctx.save();
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.font=&#x27;bold 18px system-ui&#x27;;
    ctx.fillStyle=f.color;
    ctx.shadowColor=f.color; ctx.shadowBlur=10;
    ctx.textAlign=&#x27;center&#x27;;
    ctx.fillText(f.text,f.x,f.y);
    ctx.restore();
  }
}
function drawFlash(){
  if(flash.color &amp;&amp; flash.alpha&gt;0.001){
    ctx.save();
    ctx.globalAlpha=flash.alpha;
    ctx.fillStyle=flash.color;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

function updateEffects(dt){
  for(var i=particles.length-1;i&gt;=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94;
    p.life-=dt/500;
    if(p.life&lt;=0) particles.splice(i,1);
  }
  for(var j=floaters.length-1;j&gt;=0;j--){
    var f=floaters[j];
    f.y-=0.5; f.life-=dt/900;
    if(f.life&lt;=0) floaters.splice(j,1);
  }
  for(var k=shatter.length-1;k&gt;=0;k--){
    var s=shatter[k];
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.04; s.rot+=0.08; s.life-=dt/1000;
    if(s.life&lt;=0) shatter.splice(k,1);
  }
  if(flash.alpha&gt;0) flash.alpha=Math.max(0,flash.alpha-dt/400);
  for(var m=collectibles.length-1;m&gt;=0;m--){
    var c=collectibles[m];
    if(c.type===&#x27;orb&#x27;){ c.ttl-=dt; if(c.ttl&lt;=0) collectibles.splice(m,1); }
  }
}

var lastFrame=0;
function loop(now){
  if(!running){ return; }
  if(!lastFrame) lastFrame=now;
  var dt=now-lastFrame; lastFrame=now;

  if(!dying){
    if(now-lastStep&gt;=stepMs()){ lastStep=now; step(); }
  } else {
    deadTime+=dt;
  }

  updateEffects(dt);

  drawGrid(now);
  drawCollectibles(now);
  if(!dying) drawSnake();
  drawShatter();
  drawParticles();
  drawFloaters();
  drawFlash();

  if(dying &amp;&amp; deadTime&gt;1100){ running=false; rafId=null; return; }
  rafId=requestAnimationFrame(loop);
}

function renderStatic(){
  drawGrid(performance.now());
  drawCollectibles(performance.now());
  drawSnake();
}

function startGame(){
  reset();
  running=true; lastStep=performance.now(); lastFrame=0;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function stopGame(){
  running=false;
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
}

window.addEventListener(&#x27;keydown&#x27;,function(e){
  if(e.key===&#x27;ArrowLeft&#x27;){ pendingDir={x:-1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowRight&#x27;){ pendingDir={x:1,y:0}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowUp&#x27;){ pendingDir={x:0,y:-1}; e.preventDefault(); }
  else if(e.key===&#x27;ArrowDown&#x27;){ pendingDir={x:0,y:1}; e.preventDefault(); }
});
window.addEventListener(&#x27;message&#x27;,function(e){
  if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
  if(e.data.type===&#x27;wd_start&#x27;) startGame();
  else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
});

// initial static view
reset();
renderStatic();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
