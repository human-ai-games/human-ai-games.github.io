<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🍓 Fruit Drop Frenzy 🍇</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #0a0e27; color: #fff; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 10px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .instructions { font-size: 16px; color: #b8c0e0; max-width: 620px; margin: 0; line-height: 1.35; text-align: center; }
  .hud { display: flex; justify-content: space-between; align-items: flex-start; width: 260px; }
  .score { font-size: 26px; font-weight: 800; color: #feca57; display: inline-block; }
  .score.pop { animation: pop 0.3s ease; }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.4);} 100%{transform:scale(1);} }
  .level { font-size: 14px; color: #48dbfb; margin-top: 2px; }
  .next-box { text-align: center; }
  .next-label { font-size: 11px; color: #b8c0e0; letter-spacing: 1px; }
  #next { width: 72px; height: 72px; background: #060a1f; border-radius: 8px; margin-top: 2px; display: block; }
  .field { position: relative; background: linear-gradient(#0d1440,#060a1f); border-radius: 8px; border: 3px solid #1dd1a1; box-shadow: 0 0 14px #1dd1a1, inset 0 0 20px rgba(0,0,0,0.5); overflow: hidden; }
  .field.flash { animation: borderFlash 0.4s ease; }
  @keyframes borderFlash { 0%,100%{box-shadow:0 0 14px #1dd1a1,inset 0 0 20px rgba(0,0,0,0.5);border-color:#1dd1a1;} 50%{box-shadow:0 0 34px #2ecc71,inset 0 0 20px rgba(0,0,0,0.5);border-color:#7bed9f;} }
  .block { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
  .cell-fruit { background: rgba(255,255,255,0.08); box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), inset 0 3px 5px rgba(255,255,255,0.35); }
  .cell-fruit::after { content:&#x27;&#x27;; position:absolute; top:3px; left:4px; width:35%; height:25%; background:rgba(255,255,255,0.5); border-radius:50%; filter:blur(1px); }
  .ghost { background: rgba(255,255,255,0.12); border: 1px dashed rgba(255,255,255,0.35); }
  .sparkle { animation: sparkle 0.4s ease; z-index: 5; }
  @keyframes sparkle { 0%{filter:brightness(3);transform:scale(1.2);} 100%{filter:brightness(1);transform:scale(1);} }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; color:#feca57; background:rgba(6,10,31,0.75); text-align:center; }
  .controls { display: flex; gap: 8px; margin-top: 2px; }
  .controls button { width: 60px; height: 44px; font-size: 22px; border: none; border-radius: 8px; background: #2a3270; color: #fff; cursor: pointer; }
  .controls button:active { background: #48dbfb; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🍓 Fruit Drop Frenzy 🍇&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move fruit pieces with &lt;strong&gt;← →&lt;/strong&gt;, rotate with &lt;strong&gt;↑&lt;/strong&gt;, and soft-drop with &lt;strong&gt;↓&lt;/strong&gt; — clear full rows for points. Speed climbs every 10 points; use the buttons below on touch screens.&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;
      &lt;div&gt;🪙 &lt;span class=&quot;score&quot; id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;level&quot;&gt;Speed Lv &lt;span id=&quot;level&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;next-box&quot;&gt;
      &lt;div class=&quot;next-label&quot;&gt;NEXT&lt;/div&gt;
      &lt;canvas id=&quot;next&quot; width=&quot;72&quot; height=&quot;72&quot;&gt;&lt;/canvas&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;controls&quot;&gt;
    &lt;button id=&quot;bLeft&quot;&gt;◀&lt;/button&gt;
    &lt;button id=&quot;bRot&quot;&gt;⟳&lt;/button&gt;
    &lt;button id=&quot;bDown&quot;&gt;▼&lt;/button&gt;
    &lt;button id=&quot;bRight&quot;&gt;▶&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var CELL = 26, COLS = 10, ROWS = 16;
  var field = document.getElementById(&#x27;field&#x27;);
  field.style.width = (COLS*CELL)+&#x27;px&#x27;;
  field.style.height = (ROWS*CELL)+&#x27;px&#x27;;
  var scoreEl = document.getElementById(&#x27;score&#x27;);
  var levelEl = document.getElementById(&#x27;level&#x27;);
  var nextCanvas = document.getElementById(&#x27;next&#x27;);
  var nctx = nextCanvas.getContext(&#x27;2d&#x27;);

  var FRUITS = [&#x27;🍓&#x27;,&#x27;🍋&#x27;,&#x27;🍇&#x27;,&#x27;🍊&#x27;,&#x27;🍉&#x27;,&#x27;🍍&#x27;,&#x27;🍏&#x27;];
  // Each piece: fruit index + rotation states (arrays of [x,y] cells)
  var SHAPES = {
    I: { fruit:6, color:&#x27;#48dbfb&#x27;, rots:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]]] },
    O: { fruit:1, color:&#x27;#feca57&#x27;, rots:[[[1,0],[2,0],[1,1],[2,1]]] },
    T: { fruit:2, color:&#x27;#a55eea&#x27;, rots:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]] },
    S: { fruit:4, color:&#x27;#2ecc71&#x27;, rots:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]]] },
    Z: { fruit:0, color:&#x27;#ff6b6b&#x27;, rots:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]]] },
    J: { fruit:5, color:&#x27;#54a0ff&#x27;, rots:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]] },
    L: { fruit:3, color:&#x27;#ff9f43&#x27;, rots:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]] }
  };
  var KEYS = Object.keys(SHAPES);

  var grid, piece, nextType, score, level, running, dropId;

  function newGrid() {
    grid = [];
    for (var r=0;r&lt;ROWS;r++){ var row=[]; for(var c=0;c&lt;COLS;c++) row.push(null); grid.push(row); }
  }
  function randType(){ return KEYS[Math.floor(Math.random()*KEYS.length)]; }

  function makePiece(type){ return { type:type, rot:0, x:3, y:-1 }; }

  function cellsOf(p){
    var s = SHAPES[p.type];
    var r = s.rots[p.rot % s.rots.length];
    var out=[];
    for(var i=0;i&lt;r.length;i++) out.push({x:p.x+r[i][0], y:p.y+r[i][1]});
    return out;
  }
  function collides(p){
    var cells=cellsOf(p);
    for(var i=0;i&lt;cells.length;i++){
      var cx=cells[i].x, cy=cells[i].y;
      if(cx&lt;0||cx&gt;=COLS||cy&gt;=ROWS) return true;
      if(cy&gt;=0 &amp;&amp; grid[cy][cx]) return true;
    }
    return false;
  }
  function ghostPiece(){
    var g = { type:piece.type, rot:piece.rot, x:piece.x, y:piece.y };
    while(!collides({type:g.type,rot:g.rot,x:g.x,y:g.y+1})) g.y++;
    return g;
  }
  function spawn(){
    piece = makePiece(nextType);
    nextType = randType();
    drawNext();
    return !collides(piece);
  }
  function lock(){
    var s=SHAPES[piece.type], cells=cellsOf(piece);
    for(var i=0;i&lt;cells.length;i++){
      var c=cells[i];
      if(c.y&gt;=0&amp;&amp;c.y&lt;ROWS&amp;&amp;c.x&gt;=0&amp;&amp;c.x&lt;COLS) grid[c.y][c.x]={fruit:s.fruit};
    }
    piece=null;
  }
  function clearRows(){
    var full=[];
    for(var r=0;r&lt;ROWS;r++){ var f=true; for(var c=0;c&lt;COLS;c++) if(!grid[r][c]){f=false;break;} if(f) full.push(r); }
    if(full.length===0) return;
    // sparkle those rows
    paint(full);
    for(var i=full.length-1;i&gt;=0;i--){
      grid.splice(full[i],1);
      var empty=[]; for(var c2=0;c2&lt;COLS;c2++) empty.push(null);
      grid.unshift(empty);
    }
    var pts = {1:10,2:30,3:60,4:100}[full.length]||0;
    score += pts;
    scoreEl.textContent = score;
    scoreEl.classList.remove(&#x27;pop&#x27;); void scoreEl.offsetWidth; scoreEl.classList.add(&#x27;pop&#x27;);
    field.classList.remove(&#x27;flash&#x27;); void field.offsetWidth; field.classList.add(&#x27;flash&#x27;);
    updateLevel();
    beep(660,0.12);
  }
  function updateLevel(){
    var lv = Math.min(7, 1+Math.floor(score/10));
    if(lv!==level){ level=lv; levelEl.textContent=level; restartTimer(); }
  }
  function dropInterval(){
    return Math.max(100, 700 - (level-1)*100);
  }
  function restartTimer(){
    if(dropId) clearInterval(dropId);
    if(running) dropId=setInterval(step, dropInterval());
  }

  function drawBlock(cx,cy,fruit,cls){
    var el=document.createElement(&#x27;div&#x27;);
    el.className=&#x27;block &#x27;+(cls||&#x27;&#x27;);
    el.style.left=(cx*CELL)+&#x27;px&#x27;; el.style.top=(cy*CELL)+&#x27;px&#x27;;
    el.style.width=CELL+&#x27;px&#x27;; el.style.height=CELL+&#x27;px&#x27;;
    if(fruit!=null){ el.style.fontSize=(CELL*0.72)+&#x27;px&#x27;; el.classList.add(&#x27;cell-fruit&#x27;); el.textContent=FRUITS[fruit]; }
    field.appendChild(el);
    return el;
  }
  function paint(sparkleRows){
    var overlay = field.querySelector(&#x27;.overlay&#x27;);
    field.innerHTML=&#x27;&#x27;;
    if(overlay) field.appendChild(overlay);
    for(var r=0;r&lt;ROWS;r++) for(var c=0;c&lt;COLS;c++) if(grid[r][c]){
      var extra = (sparkleRows &amp;&amp; sparkleRows.indexOf(r)&gt;=0)?&#x27;sparkle&#x27;:&#x27;&#x27;;
      drawBlock(c,r,grid[r][c].fruit,extra);
    }
    if(piece){
      var g=ghostPiece(), gc=cellsOf(g);
      for(var i=0;i&lt;gc.length;i++) if(gc[i].y&gt;=0) drawBlock(gc[i].x,gc[i].y,null,&#x27;ghost&#x27;);
      var s=SHAPES[piece.type], cells=cellsOf(piece);
      for(var j=0;j&lt;cells.length;j++) if(cells[j].y&gt;=0) drawBlock(cells[j].x,cells[j].y,s.fruit);
    }
  }
  function drawNext(){
    nctx.clearRect(0,0,72,72);
    var s=SHAPES[nextType], cells=s.rots[0];
    var minx=9,miny=9,maxx=-9,maxy=-9;
    for(var i=0;i&lt;cells.length;i++){ minx=Math.min(minx,cells[i][0]); maxx=Math.max(maxx,cells[i][0]); miny=Math.min(miny,cells[i][1]); maxy=Math.max(maxy,cells[i][1]); }
    var w=maxx-minx+1, h=maxy-miny+1, cs=16;
    var ox=(72-w*cs)/2 - minx*cs, oy=(72-h*cs)/2 - miny*cs;
    nctx.font=(cs*0.85)+&#x27;px serif&#x27;;
    nctx.textAlign=&#x27;center&#x27;; nctx.textBaseline=&#x27;middle&#x27;;
    for(var j=0;j&lt;cells.length;j++){
      var px=ox+cells[j][0]*cs, py=oy+cells[j][1]*cs;
      nctx.fillStyle=&#x27;rgba(255,255,255,0.08)&#x27;;
      nctx.fillRect(px+1,py+1,cs-2,cs-2);
      nctx.fillText(FRUITS[s.fruit], px+cs/2, py+cs/2+1);
    }
  }

  function step(){
    if(!piece) return;
    var next={type:piece.type,rot:piece.rot,x:piece.x,y:piece.y+1};
    if(collides(next)){ lock(); clearRows(); if(!spawn()){ endGame(); return; } }
    else piece=next;
    paint();
  }
  function move(dx){
    if(!running||!piece) return;
    var n={type:piece.type,rot:piece.rot,x:piece.x+dx,y:piece.y};
    if(!collides(n)){ piece=n; paint(); beep(300,0.03); }
  }
  function rotate(){
    if(!running||!piece) return;
    var s=SHAPES[piece.type];
    var nr=(piece.rot+1)%s.rots.length;
    var kicks=[0,-1,1,-2,2];
    for(var k=0;k&lt;kicks.length;k++){
      var n={type:piece.type,rot:nr,x:piece.x+kicks[k],y:piece.y};
      if(!collides(n)){ piece=n; paint(); beep(440,0.04); return; }
    }
  }
  function softDrop(){ if(running) step(); }

  function endGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
    var ov=document.createElement(&#x27;div&#x27;);
    ov.className=&#x27;overlay&#x27;;
    ov.innerHTML=&#x27;Game Over!&lt;br&gt;🪙 &#x27;+score+&#x27;&lt;br&gt;&lt;span style=&quot;font-size:14px;color:#b8c0e0&quot;&gt;Press Restart&lt;/span&gt;&#x27;;
    field.appendChild(ov);
  }

  // audio
  var actx=null;
  function beep(freq,dur){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      var o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=freq; o.type=&#x27;square&#x27;;
      g.gain.value=0.04; o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
      o.stop(actx.currentTime+dur);
    }catch(e){}
  }

  function startGame(){
    score=0; level=1; scoreEl.textContent=&#x27;0&#x27;; levelEl.textContent=&#x27;1&#x27;;
    newGrid(); nextType=randType();
    running=true;
    if(!spawn()){ endGame(); return; }
    paint();
    restartTimer();
  }
  function stopGame(){
    running=false; if(dropId){clearInterval(dropId);dropId=null;}
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if(e.key===&#x27;ArrowLeft&#x27;){ move(-1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowRight&#x27;){ move(1); e.preventDefault(); }
    else if(e.key===&#x27;ArrowDown&#x27;){ softDrop(); e.preventDefault(); }
    else if(e.key===&#x27;ArrowUp&#x27;){ rotate(); e.preventDefault(); }
  });
  document.getElementById(&#x27;bLeft&#x27;).addEventListener(&#x27;click&#x27;,function(){move(-1);});
  document.getElementById(&#x27;bRight&#x27;).addEventListener(&#x27;click&#x27;,function(){move(1);});
  document.getElementById(&#x27;bRot&#x27;).addEventListener(&#x27;click&#x27;,rotate);
  document.getElementById(&#x27;bDown&#x27;).addEventListener(&#x27;click&#x27;,softDrop);

  window.addEventListener(&#x27;message&#x27;, function(e){
    if(!e.data||typeof e.data!==&#x27;object&#x27;) return;
    if(e.data.type===&#x27;wd_start&#x27;) startGame();
    else if(e.data.type===&#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });

  // initial static preview
  newGrid(); nextType=randType(); piece=makePiece(randType());
  drawNext(); paint();
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.

<script>
