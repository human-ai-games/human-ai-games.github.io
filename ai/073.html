<body>
<div class="wrap">
  <div class="header"><a href="../index.html#ai">&larr; All games</a> &middot; <b>🐙 NEON REEF DEFENSE</b></div>
  <iframe id="game" sandbox="allow-scripts" srcdoc="&lt;!doctype html&gt;
&lt;html&gt;&lt;head&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&lt;style&gt;
  html, body { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #020814; color: #7fffe0; overflow: hidden; }
  .game { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #29ffd0; text-shadow: 0 0 8px #12d1b0, 0 0 18px #0aa; }

  .hud .lbl { font-size: 11px; opacity: 0.7; letter-spacing: 2px; display: block; }
  #combo.hot { color: #ffe94d; text-shadow: 0 0 10px #ffb000; }
  .field { position: relative; width: 100%; max-width: 700px; height: 470px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, #0a2242 0%, #061530 45%, #020a1c 100%);
    box-shadow: inset 0 0 60px #001a3a, 0 0 20px #001030; border: 1px solid #0a3a5a; }
  .bubble { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(150,220,255,0.5), rgba(60,140,220,0.05)); pointer-events: none; }
  .sub { position: absolute; width: 46px; height: 26px; bottom: 10px; pointer-events: none; }
  .torpedo { position: absolute; width: 4px; height: 14px; border-radius: 3px; background: #6ffcff; box-shadow: 0 0 8px #29e6ff, 0 0 14px #0af; pointer-events: none; }
  .jelly { position: absolute; pointer-events: none; }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; }
  .waveflash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 800; letter-spacing: 6px; color: #fff; text-shadow: 0 0 20px #29ffd0, 0 0 40px #0af; opacity: 0; pointer-events: none; }
  .waveflash.show { animation: flash 1.1s ease-out; }
  @keyframes flash { 0%{opacity:0; transform:scale(0.6);} 25%{opacity:1; transform:scale(1.1);} 100%{opacity:0; transform:scale(1.3);} }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(2,8,20,0.55); color: #bff; font-size: 22px; text-align: center; }
  .overlay.hide { display: none; }
  .overlay .big { font-size: 32px; color: #29ffd0; text-shadow: 0 0 12px #0ff; }
&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;div class=&quot;game&quot;&gt;
  &lt;h1&gt;🐙 NEON REEF DEFENSE&lt;/h1&gt;
  &lt;p class=&quot;instructions&quot;&gt;Move with ← → and press Space to fire torpedoes, or tap/click the water to slide your sub there and auto-fire. Pop the jellyfish for points — chain hits for combos before the 60 seconds run out!&lt;/p&gt;
  &lt;div class=&quot;hud&quot;&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;SCORE&lt;/span&gt;&lt;span id=&quot;score&quot;&gt;0&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;WAVE&lt;/span&gt;&lt;span id=&quot;wave&quot;&gt;1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;COMBO&lt;/span&gt;&lt;span id=&quot;combo&quot;&gt;x1&lt;/span&gt;&lt;/div&gt;
    &lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;TIME&lt;/span&gt;&lt;span id=&quot;time&quot;&gt;60&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;field&quot; id=&quot;field&quot;&gt;
    &lt;div class=&quot;waveflash&quot; id=&quot;waveflash&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;overlay&quot; id=&quot;overlay&quot;&gt;
      &lt;div class=&quot;big&quot;&gt;READY&lt;/div&gt;
      &lt;div&gt;Press Start below to dive in!&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
  var FW = 700, FH = 470;
  var SUB_W = 46, SUB_H = 26, SUB_BOTTOM = 10, SUB_SPEED = 7;
  var TORP_W = 4, TORP_H = 14, TORP_SPEED = 9;
  var running = false, animId = null;
  var keys = {};
  var subX = (FW - SUB_W) / 2, subTargetX = null;
  var torps = [], jellies = [], sparks = [];
  var score = 0, wave = 1, combo = 0, mult = 1, timeLeft = 60;
  var lastShot = 0, autoFire = false;
  var lastSpawn = 0, spawnGap = 1100, waveTime = 0, gameStart = 0, lastFrame = 0;
  var field = document.getElementById(&#x27;field&#x27;);
  var scoreEl = document.getElementById(&#x27;score&#x27;), waveEl = document.getElementById(&#x27;wave&#x27;);
  var comboEl = document.getElementById(&#x27;combo&#x27;), timeEl = document.getElementById(&#x27;time&#x27;);
  var waveflash = document.getElementById(&#x27;waveflash&#x27;), overlay = document.getElementById(&#x27;overlay&#x27;);

  // audio
  var actx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || &#x27;square&#x27;; o.frequency.value = freq;
      g.gain.value = vol || 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (_) {}
  }

  var sub = document.createElement(&#x27;div&#x27;); sub.className = &#x27;sub&#x27;;
  sub.innerHTML = &#x27;&lt;svg viewBox=&quot;0 0 46 26&quot; width=&quot;46&quot; height=&quot;26&quot;&gt;&#x27; +
    &#x27;&lt;ellipse cx=&quot;23&quot; cy=&quot;14&quot; rx=&quot;20&quot; ry=&quot;10&quot; fill=&quot;#0fd0e0&quot; stroke=&quot;#7ffcff&quot; stroke-width=&quot;1.5&quot;/&gt;&#x27; +
    &#x27;&lt;circle cx=&quot;30&quot; cy=&quot;14&quot; r=&quot;4&quot; fill=&quot;#04263a&quot;/&gt;&lt;circle cx=&quot;30&quot; cy=&quot;14&quot; r=&quot;2&quot; fill=&quot;#bffcff&quot;/&gt;&#x27; +
    &#x27;&lt;rect x=&quot;20&quot; y=&quot;1&quot; width=&quot;7&quot; height=&quot;6&quot; rx=&quot;2&quot; fill=&quot;#0fd0e0&quot; stroke=&quot;#7ffcff&quot; stroke-width=&quot;1&quot;/&gt;&#x27; +
    &#x27;&lt;path d=&quot;M3 14 L-4 8 L-4 20 Z&quot; fill=&quot;#0aa0b0&quot;/&gt;&lt;/svg&gt;&#x27;;

  function makeBubbles() {
    for (var i = 0; i &lt; 22; i++) {
      var b = document.createElement(&#x27;div&#x27;); b.className = &#x27;bubble&#x27;;
      var s = 4 + Math.random() * 14;
      b.style.width = s + &#x27;px&#x27;; b.style.height = s + &#x27;px&#x27;;
      b.style.left = Math.random() * FW + &#x27;px&#x27;;
      var dur = 5 + Math.random() * 8;
      b.style.top = FH + &#x27;px&#x27;;
      b.animate([
        { transform: &#x27;translateY(0px)&#x27;, opacity: 0.7 },
        { transform: &#x27;translateY(-&#x27; + (FH + 40) + &#x27;px)&#x27;, opacity: 0 }
      ], { duration: dur * 1000, delay: Math.random() * dur * 1000, iterations: Infinity, easing: &#x27;linear&#x27; });
      field.appendChild(b);
    }
  }
  makeBubbles();

  function jellyColor(kind) {
    if (kind === &#x27;large&#x27;) return &#x27;#ff5bd4&#x27;;
    if (kind === &#x27;medium&#x27;) return &#x27;#7b6bff&#x27;;
    return &#x27;#5bff9e&#x27;;
  }
  function jellySize(kind) { return kind === &#x27;large&#x27; ? 52 : kind === &#x27;medium&#x27; ? 34 : 22; }

  function makeJellyEl(kind) {
    var s = jellySize(kind), c = jellyColor(kind);
    var el = document.createElement(&#x27;div&#x27;); el.className = &#x27;jelly&#x27;;
    el.style.width = s + &#x27;px&#x27;; el.style.height = (s * 1.3) + &#x27;px&#x27;;
    el.innerHTML = &#x27;&lt;svg viewBox=&quot;0 0 40 52&quot; width=&quot;&#x27; + s + &#x27;&quot; height=&quot;&#x27; + (s*1.3) + &#x27;&quot; style=&quot;filter:drop-shadow(0 0 8px &#x27;+c+&#x27;)&quot;&gt;&#x27; +
      &#x27;&lt;path d=&quot;M4 22 Q4 4 20 4 Q36 4 36 22 Q36 26 30 26 L10 26 Q4 26 4 22Z&quot; fill=&quot;&#x27;+c+&#x27;&quot; opacity=&quot;0.9&quot;/&gt;&#x27; +
      &#x27;&lt;path d=&quot;M10 26 Q9 40 12 50 M18 26 Q17 42 19 51 M22 26 Q23 42 21 51 M30 26 Q31 40 28 50&quot; stroke=&quot;&#x27;+c+&#x27;&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; opacity=&quot;0.7&quot;/&gt;&#x27; +
      &#x27;&lt;ellipse cx=&quot;20&quot; cy=&quot;16&quot; rx=&quot;8&quot; ry=&quot;6&quot; fill=&quot;#fff&quot; opacity=&quot;0.35&quot;/&gt;&lt;/svg&gt;&#x27;;
    return el;
  }

  function spawnJelly(kind, x) {
    kind = kind || (Math.random() &lt; 0.3 ? &#x27;large&#x27; : (Math.random() &lt; 0.6 ? &#x27;medium&#x27; : &#x27;tiny&#x27;));
    var s = jellySize(kind);
    var baseSpeed = kind === &#x27;tiny&#x27; ? 2.6 : kind === &#x27;medium&#x27; ? 1.7 : 1.2;
    var j = {
      kind: kind, s: s,
      x: x != null ? x : Math.random() * (FW - s),
      y: -s * 1.3,
      baseX: 0, phase: Math.random() * Math.PI * 2,
      amp: 20 + Math.random() * 40, freq: 0.02 + Math.random() * 0.02,
      speed: baseSpeed * (1 + (wave - 1) * 0.18),
      hp: kind === &#x27;large&#x27; ? 2 : 1,
      el: makeJellyEl(kind), pulse: 0
    };
    j.baseX = j.x;
    field.appendChild(j.el);
    jellies.push(j);
  }

  function fire() {
    var now = performance.now();
    if (now - lastShot &lt; 180) return;
    lastShot = now;
    var t = { x: subX + SUB_W / 2 - TORP_W / 2, y: FH - SUB_BOTTOM - SUB_H - TORP_H, el: document.createElement(&#x27;div&#x27;) };
    t.el.className = &#x27;torpedo&#x27;;
    field.appendChild(t.el);
    torps.push(t);
    beep(620, 0.08, &#x27;square&#x27;, 0.04);
  }

  function burst(cx, cy, color) {
    for (var i = 0; i &lt; 12; i++) {
      var a = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
      var sp = 2 + Math.random() * 3;
      var el = document.createElement(&#x27;div&#x27;); el.className = &#x27;spark&#x27;;
      el.style.background = color; el.style.boxShadow = &#x27;0 0 6px &#x27; + color;
      field.appendChild(el);
      sparks.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, el: el });
    }
  }

  function setCombo() {
    if (combo &gt;= 3) { mult = 2; comboEl.textContent = &#x27;x2 🔥&#x27;; comboEl.className = &#x27;hot&#x27;; }
    else { mult = 1; comboEl.textContent = &#x27;x1&#x27;; comboEl.className = &#x27;&#x27;; }
  }

  function onHit(j, idx) {
    if (j.kind === &#x27;large&#x27; &amp;&amp; j.hp === 2) {
      // split into two mediums
      j.hp = 0;
      burst(j.x + j.s/2, j.y + j.s*0.65, jellyColor(&#x27;large&#x27;));
      field.removeChild(j.el); jellies.splice(idx, 1);
      spawnJelly(&#x27;medium&#x27;, Math.max(0, j.x - 14));
      spawnJelly(&#x27;medium&#x27;, Math.min(FW - 34, j.x + 14));
      addScore(1, j);
      beep(300, 0.12, &#x27;sawtooth&#x27;, 0.05);
      return;
    }
    burst(j.x + j.s/2, j.y + j.s*0.65, jellyColor(j.kind));
    field.removeChild(j.el); jellies.splice(idx, 1);
    var pts = j.kind === &#x27;tiny&#x27; ? 2 : 1;
    addScore(pts, j);
    beep(j.kind === &#x27;tiny&#x27; ? 880 : 440, 0.1, &#x27;triangle&#x27;, 0.05);
  }

  function addScore(base, j) {
    combo++; setCombo();
    score += base * mult;
    scoreEl.textContent = score;
  }

  function missBottom() {
    combo = 0; setCombo();
  }

  function tick(now) {
    if (!running) return;
    var dt = lastFrame ? (now - lastFrame) : 16; lastFrame = now;

    // timer
    timeLeft = Math.max(0, 60 - (now - gameStart) / 1000);
    timeEl.textContent = Math.ceil(timeLeft);
    if (timeLeft &lt;= 0) { endGame(); return; }

    // wave ramp
    if (now - waveTime &gt; 15000) {
      waveTime = now; wave++;
      waveEl.textContent = wave;
      spawnGap = Math.max(450, 1100 - (wave - 1) * 140);
      waveflash.textContent = &#x27;WAVE &#x27; + wave;
      waveflash.classList.remove(&#x27;show&#x27;); void waveflash.offsetWidth; waveflash.classList.add(&#x27;show&#x27;);
      beep(200, 0.3, &#x27;sawtooth&#x27;, 0.05);
    }

    // movement
    if (keys[&#x27;ArrowLeft&#x27;]) { subX -= SUB_SPEED; subTargetX = null; }
    if (keys[&#x27;ArrowRight&#x27;]) { subX += SUB_SPEED; subTargetX = null; }
    if (subTargetX != null) {
      var d = subTargetX - subX;
      if (Math.abs(d) &lt; SUB_SPEED) { subX = subTargetX; subTargetX = null; }
      else subX += Math.sign(d) * SUB_SPEED * 1.4;
    }
    subX = Math.max(0, Math.min(FW - SUB_W, subX));
    sub.style.left = subX + &#x27;px&#x27;;

    if (keys[&#x27; &#x27;] || autoFire) fire();

    // spawn
    if (now - lastSpawn &gt; spawnGap) { lastSpawn = now; spawnJelly(); }

    // torpedoes
    for (var i = torps.length - 1; i &gt;= 0; i--) {
      var t = torps[i]; t.y -= TORP_SPEED;
      if (t.y + TORP_H &lt; 0) { field.removeChild(t.el); torps.splice(i, 1); continue; }
      t.el.style.left = t.x + &#x27;px&#x27;; t.el.style.top = t.y + &#x27;px&#x27;;
    }

    // jellies
    for (var j = jellies.length - 1; j &gt;= 0; j--) {
      var jl = jellies[j];
      jl.y += jl.speed * (dt / 16);
      jl.phase += jl.freq * dt;
      jl.x = jl.baseX + Math.sin(jl.phase) * jl.amp;
      if (jl.x &lt; 0) jl.x = 0; if (jl.x &gt; FW - jl.s) jl.x = FW - jl.s;
      jl.pulse += dt * 0.006;
      var sc = 1 + Math.sin(jl.pulse) * 0.08;
      jl.el.style.left = jl.x + &#x27;px&#x27;; jl.el.style.top = jl.y + &#x27;px&#x27;;
      jl.el.style.transform = &#x27;scale(&#x27; + sc + &#x27;)&#x27;;
      if (jl.y &gt; FH) { field.removeChild(jl.el); jellies.splice(j, 1); missBottom(); }
    }

    // collisions
    for (var a = torps.length - 1; a &gt;= 0; a--) {
      var tr = torps[a]; var hit = false;
      for (var b = jellies.length - 1; b &gt;= 0; b--) {
        var je = jellies[b];
        if (tr.x &lt; je.x + je.s &amp;&amp; tr.x + TORP_W &gt; je.x &amp;&amp;
            tr.y &lt; je.y + je.s*1.0 &amp;&amp; tr.y + TORP_H &gt; je.y) {
          field.removeChild(tr.el); torps.splice(a, 1); hit = true;
          if (je.kind === &#x27;large&#x27; &amp;&amp; je.hp === 2) { onHit(je, b); }
          else { onHit(je, b); }
          break;
        }
      }
      if (hit) continue;
    }

    // sparks
    for (var s = sparks.length - 1; s &gt;= 0; s--) {
      var sp = sparks[s];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.12; sp.life -= 0.03;
      if (sp.life &lt;= 0) { field.removeChild(sp.el); sparks.splice(s, 1); continue; }
      sp.el.style.left = sp.x + &#x27;px&#x27;; sp.el.style.top = sp.y + &#x27;px&#x27;;
      sp.el.style.opacity = sp.life;
    }

    animId = requestAnimationFrame(tick);
  }

  function clearAll() {
    torps.forEach(function(t){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); });
    jellies.forEach(function(j){ if(j.el.parentNode) j.el.parentNode.removeChild(j.el); });
    sparks.forEach(function(s){ if(s.el.parentNode) s.el.parentNode.removeChild(s.el); });
    torps = []; jellies = []; sparks = [];
  }

  function startGame() {
    if (running) return;
    clearAll();
    score = 0; wave = 1; combo = 0; mult = 1; timeLeft = 60;
    scoreEl.textContent = &#x27;0&#x27;; waveEl.textContent = &#x27;1&#x27;; timeEl.textContent = &#x27;60&#x27;;
    setCombo();
    subX = (FW - SUB_W) / 2; subTargetX = null;
    for (var k in keys) keys[k] = false;
    autoFire = false; lastShot = 0;
    if (!sub.parentNode) field.appendChild(sub);
    sub.style.left = subX + &#x27;px&#x27;;
    overlay.classList.add(&#x27;hide&#x27;);
    var now = performance.now();
    gameStart = now; waveTime = now; lastSpawn = now - spawnGap; lastFrame = 0;
    spawnGap = 1100;
    running = true;
    spawnJelly(&#x27;medium&#x27;);
    animId = requestAnimationFrame(tick);
  }

  function stopGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
  }

  function endGame() {
    running = false;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    overlay.innerHTML = &#x27;&lt;div class=&quot;big&quot;&gt;TIME UP!&lt;/div&gt;&lt;div&gt;Score: &#x27; + score + &#x27; — Wave &#x27; + wave + &#x27;&lt;/div&gt;&lt;div style=&quot;font-size:16px&quot;&gt;Press Start below to dive again&lt;/div&gt;&#x27;;
    overlay.classList.remove(&#x27;hide&#x27;);
    beep(180, 0.5, &#x27;sawtooth&#x27;, 0.06);
  }

  window.addEventListener(&#x27;keydown&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) { keys[e.key] = true; e.preventDefault(); }
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) { keys[&#x27; &#x27;] = true; e.preventDefault(); }
  });
  window.addEventListener(&#x27;keyup&#x27;, function(e){
    if (e.key === &#x27;ArrowLeft&#x27; || e.key === &#x27;ArrowRight&#x27;) keys[e.key] = false;
    else if (e.key === &#x27; &#x27; || e.code === &#x27;Space&#x27;) keys[&#x27; &#x27;] = false;
  });

  function pointTo(clientX) {
    var r = field.getBoundingClientRect();
    var scale = FW / r.width;
    var x = (clientX - r.left) * scale - SUB_W / 2;
    subTargetX = Math.max(0, Math.min(FW - SUB_W, x));
    autoFire = true;
  }
  field.addEventListener(&#x27;mousedown&#x27;, function(e){ if(running){ pointTo(e.clientX); } });
  field.addEventListener(&#x27;mousemove&#x27;, function(e){ if(running &amp;&amp; (e.buttons &amp; 1)){ pointTo(e.clientX); } });
  window.addEventListener(&#x27;mouseup&#x27;, function(){ autoFire = false; });
  field.addEventListener(&#x27;touchstart&#x27;, function(e){ if(running &amp;&amp; e.touches[0]){ pointTo(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});
  field.addEventListener(&#x27;touchmove&#x27;, function(e){ if(running &amp;&amp; e.touches[0]){ pointTo(e.touches[0].clientX); e.preventDefault(); } }, {passive:false});
  window.addEventListener(&#x27;touchend&#x27;, function(){ autoFire = false; });

  window.addEventListener(&#x27;message&#x27;, function(e){
    if (!e.data || typeof e.data !== &#x27;object&#x27;) return;
    if (e.data.type === &#x27;wd_start&#x27;) startGame();
    else if (e.data.type === &#x27;wd_stop&#x27;) stopGame();
  });

  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function(t) {
    window.addEventListener(t, function(e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;

    }, true);
  });
&lt;/script&gt;

&lt;script&gt;
/* game_input_heartbeat_server_inject — server-side fallback when the LLM
 * dropped the snippet that GAME_DESIGNER_SYSTEM_PROMPT requires verbatim.
 * Reports engagement events to the parent so customer-phase telemetry
 * remains intact. Also reports content size on request so the parent can
 * scale the iframe to exactly fit its wrap. Idempotent: if a previous
 * heartbeat already ran (e.g. an old-style stored copy plus this newer
 * one injected on top), the second copy short-circuits. */
(function () {
  if (window.__v5_heartbeat_v2) return;
  window.__v5_heartbeat_v2 = true;
  // Suppress in-iframe scrollbars. The parent fits the iframe layout
  // box to match the content size, so internal scroll is redundant —
  // and if the LLM&#x27;s CSS sets body overflow: auto, the scrollbar shows
  // briefly before the fit lands. Force hidden so it never appears.
  function _suppressIframeScroll() {
    try {
      document.documentElement.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      if (document.body) {
        document.body.style.setProperty(&#x27;overflow&#x27;, &#x27;hidden&#x27;, &#x27;important&#x27;);
      }
    } catch (_) {}
  }
  if (document.body) _suppressIframeScroll();
  else document.addEventListener(&#x27;DOMContentLoaded&#x27;, _suppressIframeScroll);
  [&#x27;keydown&#x27;, &#x27;mousedown&#x27;, &#x27;touchstart&#x27;].forEach(function (t) {
    window.addEventListener(t, function (e) {
      try {
        window.parent.postMessage(
          { type: &#x27;game_input&#x27;, kind: t, key: e.key || null },
          &#x27;*&#x27;
        );
      } catch (_) {}
    }, true);
  });
  // Iframe-internal JS error capture. window.onerror inside a sandboxed
  // iframe can&#x27;t post to /api/js_error directly, so we relay to the
  // parent via postMessage; parent&#x27;s error_logger.js forwards to the
  // server. Catches LLM-emitted broken HTML (invalid hex, undefined
  // variables, etc.) that would otherwise fail silently inside the
  // iframe.
  window.addEventListener(&#x27;error&#x27;, function (ev) {
    try {
      var err = ev.error || {};
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: err.message || ev.message || &#x27;(no message)&#x27;,
        stack: err.stack || null,
        source: ev.filename || null,
        line_no: typeof ev.lineno === &#x27;number&#x27; ? ev.lineno : null,
        column_no: typeof ev.colno === &#x27;number&#x27; ? ev.colno : null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  }, true);
  window.addEventListener(&#x27;unhandledrejection&#x27;, function (ev) {
    try {
      var r = ev &amp;&amp; ev.reason;
      window.parent.postMessage({
        kind: &#x27;iframe_error&#x27;,
        message: (r &amp;&amp; (r.message || String(r))) || &#x27;(unknown rejection)&#x27;,
        stack: (r &amp;&amp; r.stack) || null,
        source: &#x27;unhandledrejection&#x27;,
        line_no: null, column_no: null,
      }, &#x27;*&#x27;);
    } catch (_) {}
  });
  var lastReportT = 0;
  function reportSize() {
    try {
      // Debounce: don&#x27;t fire more than ~10× per second. ResizeObserver
      // fires repeatedly during layout/font load; we only need the latest.
      var now = Date.now();
      if (now - lastReportT &lt; 100) return;
      lastReportT = now;
      var d = document.documentElement;
      var b = document.body || d;
      var w = Math.max(b.scrollWidth || 0, d.scrollWidth || 0);
      var h = Math.max(b.scrollHeight || 0, d.scrollHeight || 0);
      // Clamp: reject obviously bogus dimensions. Any browser-game viewport
      // is well under 4000×4000 logical px; readings beyond that are layout
      // noise during load/visibility transitions.
      if (w &lt;= 0 || h &lt;= 0 || w &gt; 4000 || h &gt; 4000) return;
      window.parent.postMessage(
        { type: &#x27;game_size&#x27;, w: w, h: h }, &#x27;*&#x27;
      );
    } catch (_) {}
  }
  // Parent posts wd_remeasure when it makes the iframe visible (the body&#x27;s
  // ResizeObserver doesn&#x27;t fire on display:none→block of an outer ancestor
  // because the iframe document didn&#x27;t actually resize). Wait a frame for
  // layout to settle before measuring.
  window.addEventListener(&#x27;message&#x27;, function (e) {
    if (e &amp;&amp; e.data &amp;&amp; e.data.type === &#x27;wd_remeasure&#x27;) {
      requestAnimationFrame(function () {
        requestAnimationFrame(reportSize);
      });
    }
  });
  function init() {
    requestAnimationFrame(function () {
      requestAnimationFrame(reportSize);
    });
    try {
      if (typeof ResizeObserver !== &#x27;undefined&#x27;) {

    init();
  } else {
    window.addEventListener(&#x27;load&#x27;, init);
  }
})();
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
</div>
<script>
(function () {
  var iframe = document.getElementById('game');
  var startBtn = document.getElementById('start');
  var stopBtn = document.getElementById('stop');
  var running = false;
  function post(type) { try { iframe.contentWindow.postMessage({ type: type }, '*'); } catch (e) {} }
  startBtn.addEventListener('click', function () {
    if (running) return;
    post('wd_start'); running = true; startBtn.disabled = true; stopBtn.disabled = false;
    try { iframe.focus(); iframe.contentWindow.focus(); } catch (e) {}
  });
  stopBtn.addEventListener('click', function () {
    if (!running) return;
    post('wd_stop'); running = false; startBtn.disabled = false; stopBtn.disabled = true;
  });
  var lastW = 0, lastH = 0;
  function applyFit() {
    if (!lastW || !lastH) return;
    var maxW = Math.min(window.innerWidth - 32, 900);
    var headerH = (document.querySelector('.header') || {}).clientHeight || 0;
    var ctrlsH = (document.querySelector('.controls') || {}).clientHeight || 0;
    var maxH = Math.max(300, window.innerHeight - headerH - ctrlsH - 80);
    var scale = Math.min(maxW / lastW, maxH / lastH, 1);
    if (!isFinite(scale) || scale <= 0) return;
    iframe.style.width = lastW + 'px'; iframe.style.height = lastH + 'px';
    iframe.style.maxWidth = 'none'; iframe.style.maxHeight = 'none';
    iframe.style.transform = 'scale(' + scale + ')'; iframe.style.transformOrigin = 'top left';
    iframe.style.marginRight = (lastW * scale - lastW) + 'px';
    iframe.style.marginBottom = (lastH * scale - lastH) + 'px';
  }
  window.addEventListener('message', function (e) {
    if (!e || !e.data || e.data.type !== 'game_size') return;
    if (iframe.contentWindow !== e.source) return;
    var w = e.data.w, h = e.data.h;
    if (!w || !h || w <= 0 || h <= 0 || w > 4000 || h > 4000) return;
    lastW = w; lastH = h; applyFit();
  });
  window.addEventListener('resize', applyFit);
  function kick() { try { iframe.contentWindow.postMessage({ type: 'wd_remeasure' }, '*'); } catch (_) {} }
  iframe.addEventListener('load', kick);
  var tries = 0;
  var poll = setInterval(function () { kick(); tries++; if (lastW > 0 || tries > 15) clearInterval(poll); }, 100);
})();
</script>
